cơ thể", "example": "爷爷虽然年纪大了，但是身体很好。", "examplePinyin": "yé yé suī rán nián jì dà le ， dàn shì shēn tǐ hěn hǎo 。", "translation": "Tuy ông lớn tuổi nhưng sức khỏe rất tốt."}, {"id": "hsk2-11-05", "hanzi": "头", "pinyin": "tóu", "meaning": "đầu", "example": "爷爷家有一头牛。", "examplePinyin": "yé yé jiā yǒu yī tóu niú 。", "translation": "Nhà ông có một con bò."}, {"id": "hsk2-11-06", "hanzi": "慢", "pinyin": "màn", "meaning": "chậm", "example": "我听不太懂，请说慢一点儿。", "examplePinyin": "wǒ tīng bù tài dǒng ， qǐng shuō màn yì diǎn ér 。", "translation": "Tôi nghe chưa hiểu lắm, xin nói chậm hơn một chút."}, {"id": "hsk2-11-07", "hanzi": "路上", "pinyin": "lùshang", "meaning": "trên đường", "example": "回家的路上，我碰见了老师。", "examplePinyin": "huí jiā de lù shàng ， wǒ pèng jiàn le lǎo shī 。", "translation": "Trên đường về nhà tôi đã gặp thầy."}, {"id": "hsk2-11-08", "hanzi": "时", "pinyin": "shí", "meaning": "khi, lúc", "example": "我到家时，妈妈正在做饭。", "examplePinyin": "wǒ dào jiā shí ， mā mā zhèng zài zuò fàn 。", "translation": "Khi tôi về đến nhà mẹ đang nấu cơm."}, {"id": "hsk2-11-09", "hanzi": "着", "pinyin": "zhe", "meaning": "trợ từ trạng thái", "example": "他手里拿着一本书，站在门口。", "examplePinyin": "tā shǒu lǐ ná zhe yī běn shū ， zhàn zài mén kǒu 。", "translation": "Anh ấy cầm một quyển sách và đứng ở cửa."}, {"id": "hsk2-11-10", "hanzi": "经常", "pinyin": "jīngcháng", "meaning": "thường xuyên", "example": "他经常帮同学复习。", "examplePinyin": "tā jīng cháng bāng tóng xué fù xí 。", "translation": "Anh ấy thường giúp bạn học ôn bài."}, {"id": "hsk2-11-11", "hanzi": "进", "pinyin": "jìn", "meaning": "vào", "example": "上课了，同学们都进教室了。", "examplePinyin": "shàng kè le ， tóng xué men dōu jìn jiào shì le 。", "translation": "Đến giờ học rồi, các bạn đều vào lớp."}, {"id": "hsk2-11-12", "hanzi": "自", "pinyin": "zì", "meaning": "tự, từ", "example": "他来自越南，现在在北京学习。", "examplePinyin": "tā lái zì yuè nán ， xiàn zài zài běi jīng xué xí 。", "translation": "Anh ấy đến từ Việt Nam, hiện học ở Bắc Kinh."}, {"id": "hsk2-11-13", "hanzi": "从小", "pinyin": "cóngxiǎo", "meaning": "từ nhỏ", "example": "我从小就喜欢画画。", "examplePinyin": "wǒ cóng xiǎo jiù xǐ huān huà huà 。", "translation": "Từ nhỏ tôi đã thích vẽ."}, {"id": "hsk2-11-14", "hanzi": "最", "pinyin": "zuì", "meaning": "nhất", "example": "在这些书中，我最喜欢这一本。", "examplePinyin": "zài zhè xiē shū zhōng ， wǒ zuì xǐ huān zhè yī běn 。", "translation": "Trong những quyển sách này tôi thích quyển này nhất."}], "grammar": [{"name": "Trợ từ động thái 着", "details": ["Công thức: Chủ ngữ + Động từ + 着 + (Tân ngữ)", "Giải thích: Trợ từ động thái 「着」 được đặt sau động từ để biểu thị một hành động đang tiếp diễn hoặc một trạng thái đang tồn tại. Ví dụ: 「门开着」 (Cửa đang mở) diễn tả trạng thái của cánh cửa.", "Mẹo: Bạn có thể thêm trợ từ ngữ khí 「呢」 ở cuối câu để nhấn mạnh trạng thái đang tiếp diễn.", "Lưu ý: Cấu trúc phủ định của 「着」 thường dùng 「没有」 đặt trước động từ (Ví dụ: 「没穿着鞋」 - không mang giày).", "那你在这儿坐着。", "nà nǐ zài zhè ér zuò zhe", "Vậy bạn cứ ngồi ở đây đi.", "教室的门开着。", "jiào shì de mén kāi zhe", "Cửa phòng học đang mở.", "Ví dụ: 那你在这儿坐着。"]}, {"name": "Trợ từ động thái 着 (zhe)", "details": ["Công thức: Động từ + 着 + (Tân ngữ)", "Giải thích: Trợ từ 「着」 đặt sau động từ để biểu thị hành động hoặc trạng thái đang tiếp diễn. Nó cho thấy sự vật, sự việc vẫn đang duy trì ở thời điểm nói. Ví dụ: 「他站着」(Anh ấy đang đứng).", "Mẹo: Hãy nhớ 「着」 thường dùng để mô tả trạng thái hiện tại của chủ thể thay vì hành động đang chuyển động mạnh.", "Lưu ý: Không nhầm lẫn 「着」 với cấu trúc 「正在」, vì 「着」 tập trung vào trạng thái kéo dài hơn là nhấn mạnh hành động đang diễn ra.", "她穿着白色的裤子。", "tā chuān zhe bái sè de kù zi", "Cô ấy đang mặc cái quần màu trắng.", "陈天中没拿着咖啡。", "chén tiān zhōng méi ná zhe kā fēi", "Trần Thiên Trung không có cầm cà phê.", "Ví dụ: 她穿着白色的裤子。"]}, {"name": "Phó từ chỉ mức độ 「最」", "details": ["Công thức: S + 最 + Tính từ/Động từ tâm lý", "Giải thích: Phó từ 「最」 có nghĩa là \"nhất\", dùng để biểu thị mức độ cao nhất trong phạm vi so sánh. Nó thường được đặt trước các tính từ hoặc động từ chỉ tâm lý để nhấn mạnh đặc điểm đó vượt trội hơn mọi đối tượng khác.", "Mẹo: Bạn có thể dùng 「最」 với các động từ tâm lý như 「喜欢」(thích), 「爱」(yêu), 「想」(muốn) để thể hiện sở thích lớn nhất của bản thân.", "Lưu ý: Không nên dùng 「最」 với các động từ chỉ hành động thông thường (như ăn, uống, đi), mà chủ yếu dùng với tính từ và động từ chỉ cảm xúc.", "你最喜欢吃中国菜。", "nǐ zuì xǐ huān chī zhōng guó cài", "Bạn thích ăn món Trung Quốc nhất.", "在我们家，爸爸最高。", "zài wǒ men jiā bà bà zuì gāo", "Trong nhà chúng tôi, bố là người cao nhất.", "你们班谁说中文说得最好？", "nǐ men bān shuí shuō zhōng wén shuō de zuì hǎo", "Trong lớp các bạn ai nói tiếng Trung tốt nhất?", "Ví dụ: 你最喜欢吃中国菜。"]}], "extended": [], "structuredGrammar": [{"name": "Trợ từ động thái 着", "formula": "Chủ ngữ + Động từ + 着 + (Tân ngữ)", "explanation": "Trợ từ động thái 「着」 được đặt sau động từ để biểu thị một hành động đang tiếp diễn hoặc một trạng thái đang tồn tại. Ví dụ: 「门开着」 (Cửa đang mở) diễn tả trạng thái của cánh cửa.", "tip": "Bạn có thể thêm trợ từ ngữ khí 「呢」 ở cuối câu để nhấn mạnh trạng thái đang tiếp diễn.", "note": "Cấu trúc phủ định của 「着」 thường dùng 「没有」 đặt trước động từ (Ví dụ: 「没穿着鞋」 - không mang giày).", "examples": [{"zh": "那你在这儿坐着。", "pinyin": "nà nǐ zài zhè ér zuò zhe", "vi": "Vậy bạn cứ ngồi ở đây đi."}, {"zh": "教室的门开着。", "pinyin": "jiào shì de mén kāi zhe", "vi": "Cửa phòng học đang mở."}], "newExamples": [{"zh": "小林在门口站着，手里拿着一本书。", "pinyin": "xiǎo lín zài mén kǒu zhàn zhe ， shǒu lǐ ná zhe yī běn shū 。", "vi": "小林 đang đứng ở cửa, tay cầm một quyển sách."}, {"zh": "小林说：“门开着，你进来吧。”", "pinyin": "xiǎo lín shuō ： “ mén kāi zhe ， nǐ jìn lái ba 。 ”", "vi": "小林 nói: “Cửa đang mở, bạn vào nhé.”"}]}, {"name": "Trợ từ động thái 着 (zhe)", "formula": "Động từ + 着 + (Tân ngữ)", "explanation": "Trợ từ 「着」 đặt sau động từ để biểu thị hành động hoặc trạng thái đang tiếp diễn. Nó cho thấy sự vật, sự việc vẫn đang duy trì ở thời điểm nói. Ví dụ: 「他站着」(Anh ấy đang đứng).", "tip": "Hãy nhớ 「着」 thường dùng để mô tả trạng thái hiện tại của chủ thể thay vì hành động đang chuyển động mạnh.", "note": "Không nhầm lẫn 「着」 với cấu trúc 「正在」, vì 「着」 tập trung vào trạng thái kéo dài hơn là nhấn mạnh hành động đang diễn ra.", "examples": [{"zh": "她穿着白色的裤子。", "pinyin": "tā chuān zhe bái sè de kù zi", "vi": "Cô ấy đang mặc cái quần màu trắng."}, {"zh": "陈天中没拿着咖啡。", "pinyin": "chén tiān zhōng méi ná zhe kā fēi", "vi": "Trần Thiên Trung không có cầm cà phê."}], "newExamples": [{"zh": "小林穿着白色的裤子，很好看。", "pinyin": "xiǎo lín chuān zhe bái sè de kù zi ， hěn hǎo kàn 。", "vi": "小林 mặc quần trắng, trông rất đẹp."}, {"zh": "小林笑着跟小雨说：“明天见！”", "pinyin": "xiǎo lín xiào zhe gēn xiǎo yǔ shuō ： “ míng tiān jiàn ！ ”", "vi": "小林 mỉm cười nói với 小雨: “Hẹn mai gặp!”"}]}, {"name": "Phó từ chỉ mức độ 「最」", "formula": "S + 最 + Tính từ/Động từ tâm lý", "explanation": "Phó từ 「最」 có nghĩa là \"nhất\", dùng để biểu thị mức độ cao nhất trong phạm vi so sánh. Nó thường được đặt trước các tính từ hoặc động từ chỉ tâm lý để nhấn mạnh đặc điểm đó vượt trội hơn mọi đối tượng khác.", "tip": "Bạn có thể dùng 「最」 với các động từ tâm lý như 「喜欢」(thích), 「爱」(yêu), 「想」(muốn) để thể hiện sở thích lớn nhất của bản thân.", "note": "Không nên dùng 「最」 với các động từ chỉ hành động thông thường (như ăn, uống, đi), mà chủ yếu dùng với tính từ và động từ chỉ cảm xúc.", "examples": [{"zh": "你最喜欢吃中国菜。", "pinyin": "nǐ zuì xǐ huān chī zhōng guó cài", "vi": "Bạn thích ăn món Trung Quốc nhất."}, {"zh": "在我们家，爸爸最高。", "pinyin": "zài wǒ men jiā bà bà zuì gāo", "vi": "Trong nhà chúng tôi, bố là người cao nhất."}, {"zh": "你们班谁说中文说得最好？", "pinyin": "nǐ men bān shuí shuō zhōng wén shuō de zuì hǎo", "vi": "Trong lớp các bạn ai nói tiếng Trung tốt nhất?"}], "newExamples": [{"zh": "在三个孩子中，小林最高。", "pinyin": "zài sān gè hái zi zhōng ， xiǎo lín zuì gāo 。", "vi": "Trong ba đứa trẻ, 小林 cao nhất."}, {"zh": "小林说：“我喜欢的水果很多，其中最喜欢苹果。”", "pinyin": "xiǎo lín shuō ： “ wǒ xǐ huān de shuǐ guǒ hěn duō ， qí zhōng zuì xǐ huān píng guǒ 。 ”", "vi": "小林 nói: “Tôi thích nhiều loại quả, trong đó thích táo nhất.”"}]}]}, {"id": 12, "title": "Thời tiết và cuộc sống", "subtitle": "事情 · 晴 · 正 · 外面", "words": [{"id": "hsk2-12-01", "hanzi": "事情", "pinyin": "shìqing", "meaning": "sự việc", "example": "今天我有很多事情要做。", "examplePinyin": "jīn tiān wǒ yǒu hěn duō shì qíng yào zuò 。", "translation": "Hôm nay tôi có nhiều việc phải làm."}, {"id": "hsk2-12-02", "hanzi": "晴", "pinyin": "qíng", "meaning": "trời nắng", "example": "天气晴了，我们去公园吧。", "examplePinyin": "tiān qì qíng le ， wǒ men qù gōng yuán ba 。", "translation": "Trời quang rồi, chúng ta ra công viên nhé."}, {"id": "hsk2-12-03", "hanzi": "正", "pinyin": "zhèng", "meaning": "đang", "example": "我正准备出门，朋友就来了。", "examplePinyin": "wǒ zhèng zhǔn bèi chū mén ， péng yǒu jiù lái le 。", "translation": "Tôi đang chuẩn bị ra ngoài thì bạn đến."}, {"id": "hsk2-12-04", "hanzi": "外面", "pinyin": "wàimiàn", "meaning": "bên ngoài", "example": "外面下雨了，我们先在屋里等一会儿。", "examplePinyin": "wài miàn xià yǔ le ， wǒ men xiān zài wū lǐ děng yī huì er 。", "translation": "Bên ngoài mưa rồi, chúng ta đợi trong nhà một lát trước."}, {"id": "hsk2-12-05", "hanzi": "阴", "pinyin": "yīn", "meaning": "âm u", "example": "天阴了，也许快下雨了。", "examplePinyin": "tiān yīn le ， yě xǔ kuài xià yǔ le 。", "translation": "Trời âm u rồi, có lẽ sắp mưa."}, {"id": "hsk2-12-06", "hanzi": "从小", "pinyin": "cóngxiǎo", "meaning": "từ nhỏ", "example": "我从小就喜欢画画。", "examplePinyin": "wǒ cóng xiǎo jiù xǐ huān huà huà 。", "translation": "Từ nhỏ tôi đã thích vẽ."}, {"id": "hsk2-12-07", "hanzi": "地铁", "pinyin": "dìtiě", "meaning": "tàu điện ngầm", "example": "坐地铁比坐公交车快。", "examplePinyin": "zuò dì tiě bǐ zuò gōng jiāo chē kuài 。", "translation": "Đi tàu điện ngầm nhanh hơn đi xe buýt."}, {"id": "hsk2-12-08", "hanzi": "楼", "pinyin": "lóu", "meaning": "tầng, tòa nhà", "example": "我家楼下有一家小饭馆。", "examplePinyin": "wǒ jiā lóu xià yǒu yī jiā xiǎo fàn guǎn 。", "translation": "Dưới lầu nhà tôi có một quán ăn nhỏ."}, {"id": "hsk2-12-09", "hanzi": "站", "pinyin": "zhàn", "meaning": "đứng", "example": "请站在黄线后面等车。", "examplePinyin": "qǐng zhàn zài huáng xiàn hòu miàn děng chē 。", "translation": "Hãy đứng sau vạch vàng chờ xe."}, {"id": "hsk2-12-10", "hanzi": "小时候", "pinyin": "xiǎoshíhou", "meaning": "hồi nhỏ", "example": "小时候，我家旁边有一条小河。", "examplePinyin": "xiǎo shí hòu ， wǒ jiā páng biān yǒu yī tiáo xiǎo hé 。", "translation": "Hồi nhỏ bên cạnh nhà tôi có một con sông nhỏ."}, {"id": "hsk2-12-11", "hanzi": "好", "pinyin": "hǎo", "meaning": "tốt, rất", "example": "今天好冷，我们喝点热水吧。", "examplePinyin": "jīn tiān hǎo lěng ， wǒ men hē diǎn rè shuǐ ba 。", "translation": "Hôm nay lạnh quá, chúng ta uống chút nước nóng nhé."}], "grammar": [{"name": "Câu so sánh với bổ ngữ trạng thái", "details": ["Công thức: A 比 B + Động từ + 得 + Bổ ngữ (Tính từ)", "Giải thích: Cấu trúc này dùng để so sánh trình độ hoặc kết quả thực hiện một hành động giữa hai đối tượng. Bạn cần thêm 「得」 sau động từ để nối với tính từ miêu tả trạng thái hoặc mức độ.", "Mẹo: Hãy nhớ quy tắc 「A 比 B」 luôn đứng trước động từ, ví dụ: 「他比我跑得快」(Anh ấy chạy nhanh hơn tôi).", "Lưu ý: Đừng quên từ 「得」 giữa động từ và tính từ, đây là lỗi phổ biến nhất của người mới học.", "我这里比北京冷多了。", "wǒ zhè lǐ bǐ běi jīng lěng duō le", "Ở chỗ tôi lạnh hơn Bắc Kinh nhiều lắm.", "坐飞机比坐火车快得多。", "zuò fēi jī bǐ zuò huǒ chē kuài de duō", "Đi máy bay nhanh hơn đi tàu hỏa rất nhiều.", "Ví dụ: 我这里比北京冷多了。"]}, {"name": "Cấu trúc so sánh với 跟...相比", "details": ["Công thức: 跟 A 相比，B + tính từ + (bổ ngữ)", "Giải thích: Cấu trúc 「跟...相比」 được dùng để đưa ra đối tượng cần so sánh lên đầu câu nhằm nhấn mạnh chủ đề. Sau đó, bạn đưa ra đối tượng chính 「B」 kèm theo tính từ để nêu lên sự khác biệt. Đây là cách diễn đạt rất tự nhiên khi bạn muốn so sánh hai sự vật.", "Mẹo: Bạn có thể dịch cụm 「跟...相比」 là \"so với...\" để dễ hình dung trong tiếng Việt.", "Lưu ý: Đừng quên đặt đối tượng so sánh vào giữa 「跟」 và 「相比」, không được để ngoài phạm vi này.", "跟昨天相比，今天的雪下得更大。", "gēn zuó tiān xiāng bǐ jīn tiān de xuě xià de gèng dà", "So với hôm qua, hôm nay tuyết rơi to hơn.", "跟我相比，妈妈睡得晚多了。", "gēn wǒ xiāng bǐ mā ma shuì de wǎn duō le", "So với tôi, mẹ ngủ muộn hơn nhiều.", "Ví dụ: 跟昨天相比，今天的雪下得更大。"]}, {"name": "Cấu trúc so sánh 比起", "details": ["Công thức: 比起 + [đối tượng so sánh] (+ 来)，+ [chủ ngữ] + [vị ngữ]", "Giải thích: Cấu trúc này dùng để dẫn dắt đối tượng được đem ra so sánh trong câu. Nó giúp xác định rõ phạm vi hoặc đối tượng mà chủ ngữ đang được so sánh cùng.", "Mẹo: Bạn có thể thêm 「来」 vào sau đối tượng so sánh để câu văn nghe tự nhiên và đầy đủ hơn.", "Lưu ý: Cấu trúc này thường dùng để so sánh hai đối tượng với nhau, lưu ý không nhầm lẫn với các cấu trúc so sánh bằng 「跟...一样」.", "比起去年来，今年的冬天冷多了。", "bǐ qǐ qù nián lái jīn nián de dōng tiān lěng duō le", "So với năm ngoái, mùa đông năm nay lạnh hơn nhiều.", "比起坐公共汽车，我更喜欢骑自行车。", "bǐ qǐ zuò gōng gòng qì chē wǒ gèng xǐ huan qí zì xíng chē", "So với đi xe buýt, tôi thích đi xe đạp hơn.", "Ví dụ: 比起去年来，今年的冬天冷多了。"]}], "extended": [], "structuredGrammar": [{"name": "Câu so sánh với bổ ngữ trạng thái", "formula": "A 比 B + Động từ + 得 + Bổ ngữ (Tính từ)", "explanation": "Cấu trúc này dùng để so sánh trình độ hoặc kết quả thực hiện một hành động giữa hai đối tượng. Bạn cần thêm 「得」 sau động từ để nối với tính từ miêu tả trạng thái hoặc mức độ.", "tip": "Hãy nhớ quy tắc 「A 比 B」 luôn đứng trước động từ, ví dụ: 「他比我跑得快」(Anh ấy chạy nhanh hơn tôi).", "note": "Đừng quên từ 「得」 giữa động từ và tính từ, đây là lỗi phổ biến nhất của người mới học.", "examples": [{"zh": "我这里比北京冷多了。", "pinyin": "wǒ zhè lǐ bǐ běi jīng lěng duō le", "vi": "Ở chỗ tôi lạnh hơn Bắc Kinh nhiều lắm."}, {"zh": "坐飞机比坐火车快得多。", "pinyin": "zuò fēi jī bǐ zuò huǒ chē kuài de duō", "vi": "Đi máy bay nhanh hơn đi tàu hỏa rất nhiều."}], "newExamples": [{"zh": "小林比小雨跑得快。", "pinyin": "xiǎo lín bǐ xiǎo yǔ pǎo de kuài 。", "vi": "小林 chạy nhanh hơn 小雨."}, {"zh": "小林比小雨说中文说得流利。", "pinyin": "xiǎo lín bǐ xiǎo yǔ shuō zhōng wén shuō de liú lì 。", "vi": "小林 nói tiếng Trung lưu loát hơn 小雨."}]}, {"name": "Cấu trúc so sánh với 跟...相比", "formula": "跟 A 相比，B + tính từ + (bổ ngữ)", "explanation": "Cấu trúc 「跟...相比」 được dùng để đưa ra đối tượng cần so sánh lên đầu câu nhằm nhấn mạnh chủ đề. Sau đó, bạn đưa ra đối tượng chính 「B」 kèm theo tính từ để nêu lên sự khác biệt. Đây là cách diễn đạt rất tự nhiên khi bạn muốn so sánh hai sự vật.", "tip": "Bạn có thể dịch cụm 「跟...相比」 là \"so với...\" để dễ hình dung trong tiếng Việt.", "note": "Đừng quên đặt đối tượng so sánh vào giữa 「跟」 và 「相比」, không được để ngoài phạm vi này.", "examples": [{"zh": "跟昨天相比，今天的雪下得更大。", "pinyin": "gēn zuó tiān xiāng bǐ jīn tiān de xuě xià de gèng dà", "vi": "So với hôm qua, hôm nay tuyết rơi to hơn."}, {"zh": "跟我相比，妈妈睡得晚多了。", "pinyin": "gēn wǒ xiāng bǐ mā ma shuì de wǎn duō le", "vi": "So với tôi, mẹ ngủ muộn hơn nhiều."}], "newExamples": [{"zh": "跟小林相比，小雨起得更早。", "pinyin": "gēn xiǎo lín xiāng bǐ ， xiǎo yǔ qǐ de gèng zǎo 。", "vi": "So với 小林, 小雨 dậy sớm hơn."}, {"zh": "跟小林相比，小雨跑得更快。", "pinyin": "gēn xiǎo lín xiāng bǐ ， xiǎo yǔ pǎo de gèng kuài 。", "vi": "So với 小林, 小雨 chạy nhanh hơn."}]}, {"name": "Cấu trúc so sánh 比起", "formula": "比起 + [đối tượng so sánh] (+ 来)，+ [chủ ngữ] + [vị ngữ]", "explanation": "Cấu trúc này dùng để dẫn dắt đối tượng được đem ra so sánh trong câu. Nó giúp xác định rõ phạm vi hoặc đối tượng mà chủ ngữ đang được so sánh cùng.", "tip": "Bạn có thể thêm 「来」 vào sau đối tượng so sánh để câu văn nghe tự nhiên và đầy đủ hơn.", "note": "Cấu trúc này thường dùng để so sánh hai đối tượng với nhau, lưu ý không nhầm lẫn với các cấu trúc so sánh bằng 「跟...一样」.", "examples": [{"zh": "比起去年来，今年的冬天冷多了。", "pinyin": "bǐ qǐ qù nián lái jīn nián de dōng tiān lěng duō le", "vi": "So với năm ngoái, mùa đông năm nay lạnh hơn nhiều."}, {"zh": "比起坐公共汽车，我更喜欢骑自行车。", "pinyin": "bǐ qǐ zuò gōng gòng qì chē wǒ gèng xǐ huan qí zì xíng chē", "vi": "So với đi xe buýt, tôi thích đi xe đạp hơn."}], "newExamples": [{"zh": "比起坐车，小林更喜欢走路。", "pinyin": "bǐ qǐ zuò chē ， xiǎo lín gèng xǐ huān zǒu lù 。", "vi": "So với đi xe, 小林 thích đi bộ hơn."}, {"zh": "比起去年来，今年的冬天冷多了。小林说，这里的“来”可以省略。", "pinyin": "bǐ qǐ qù nián lái ， jīn nián de dōng tiān lěng duō le 。 xiǎo lín shuō ， zhè lǐ de “ lái ” kě yǐ shěng lüè 。", "vi": "So với năm ngoái, mùa đông năm nay lạnh hơn nhiều. 小林 nói chữ “来” ở đây có thể lược bỏ."}]}]}, {"id": 13, "title": "Quà tặng và lời chúc", "subtitle": "新年 · 教 · 花 · 希望", "words": [{"id": "hsk2-13-01", "hanzi": "新年", "pinyin": "xīnnián", "meaning": "năm mới", "example": "祝大家新年快乐，身体健康！", "examplePinyin": "zhù dà jiā xīn nián kuài lè ， shēn tǐ jiàn kāng ！", "translation": "Chúc mọi người năm mới vui vẻ, mạnh khỏe!"}, {"id": "hsk2-13-02", "hanzi": "教", "pinyin": "jiāo", "meaning": "dạy", "example": "王老师教我们写汉字。", "examplePinyin": "wáng lǎo shī jiāo wǒ men xiě hàn zì 。", "translation": "Thầy Vương dạy chúng tôi viết chữ Hán."}, {"id": "hsk2-13-03", "hanzi": "花", "pinyin": "huā", "meaning": "hoa", "example": "妈妈最喜欢红色的花。", "examplePinyin": "mā mā zuì xǐ huān hóng sè de huā 。", "translation": "Mẹ thích hoa màu đỏ nhất."}, {"id": "hsk2-13-04", "hanzi": "希望", "pinyin": "xīwàng", "meaning": "hy vọng", "example": "我希望明年能和家人一起旅行。", "examplePinyin": "wǒ xī wàng míng nián néng hé jiā rén yì qǐ lǚ xíng 。", "translation": "Tôi hy vọng năm sau có thể đi du lịch cùng gia đình."}, {"id": "hsk2-13-05", "hanzi": "上面", "pinyin": "shàngmiàn", "meaning": "phía trên", "example": "桌子上面放着一本红色的书。", "examplePinyin": "zhuō zi shàng miàn fàng zhe yī běn hóng sè de shū 。", "translation": "Trên bàn có đặt một quyển sách màu đỏ."}, {"id": "hsk2-13-06", "hanzi": "洗手间", "pinyin": "xǐshǒujiān", "meaning": "nhà vệ sinh", "example": "请问洗手间是在左边还是右边？", "examplePinyin": "qǐng wèn xǐ shǒu jiān shì zài zuǒ biān hái shì yòu biān ？", "translation": "Xin hỏi nhà vệ sinh ở bên trái hay bên phải?"}, {"id": "hsk2-13-07", "hanzi": "里面", "pinyin": "lǐmiàn", "meaning": "bên trong", "example": "盒子里面有我小时候的照片。", "examplePinyin": "hé zi lǐ miàn yǒu wǒ xiǎo shí hòu de zhào piān 。", "translation": "Trong hộp có ảnh hồi nhỏ của tôi."}, {"id": "hsk2-13-08", "hanzi": "笔", "pinyin": "bǐ", "meaning": "bút", "example": "这支笔是新买的，写字很好用。", "examplePinyin": "zhè zhī bǐ shì xīn mǎi de ， xiě zì hěn hǎo yòng 。", "translation": "Cây bút này mới mua, viết rất tốt."}, {"id": "hsk2-13-09", "hanzi": "可能", "pinyin": "kěnéng", "meaning": "có thể", "example": "下午可能下雨，你带上伞吧。", "examplePinyin": "xià wǔ kě néng xià yǔ ， nǐ dài shàng sǎn ba 。", "translation": "Chiều có thể mưa, bạn mang ô nhé."}, {"id": "hsk2-13-10", "hanzi": "上网", "pinyin": "shàngwǎng", "meaning": "lên mạng", "example": "我每天上网看十分钟中文新闻。", "examplePinyin": "wǒ měi tiān shàng wǎng kàn shí fēn zhōng zhōng wén xīn wén 。", "translation": "Mỗi ngày tôi lên mạng xem tin tiếng Trung mười phút."}, {"id": "hsk2-13-11", "hanzi": "那样", "pinyin": "nàyàng", "meaning": "như thế", "example": "你那样说，妹妹会难过的。", "examplePinyin": "nǐ nà yàng shuō ， mèi mèi huì nán guò de 。", "translation": "Bạn nói như vậy em gái sẽ buồn đấy."}, {"id": "hsk2-13-12", "hanzi": "告诉", "pinyin": "gàosu", "meaning": "nói cho biết", "example": "请告诉我你的名字。", "examplePinyin": "qǐng gào sù wǒ nǐ de míng zì 。", "translation": "Hãy cho tôi biết tên bạn."}, {"id": "hsk2-13-13", "hanzi": "班", "pinyin": "bān", "meaning": "lớp", "example": "我们班有三个留学生。", "examplePinyin": "wǒ men bān yǒu sān gè liú xué shēng 。", "translation": "Lớp chúng tôi có ba lưu học sinh."}], "grammar": [{"name": "Câu có hai tân ngữ", "details": ["Công thức: Chủ ngữ + Động từ + Tân ngữ gián tiếp + Tân ngữ trực tiếp", "Giải thích: Trong tiếng Trung, một số động từ đặc biệt như 「送」(tặng), 「给」(đưa), 「教」(dạy) có thể kéo theo hai tân ngữ cùng lúc. Tân ngữ đầu tiên thường chỉ người (người nhận), tân ngữ thứ hai thường chỉ vật (vật được nhận). Cấu trúc này giúp câu diễn đạt đầy đủ thông tin về cả người và vật trong cùng một hành động.", "Mẹo: Hãy ghi nhớ các động từ hay gặp trong cấu trúc này như 「送」(tặng), 「借」(cho mượn), 「告诉」(nói với ai đó), 「教」(dạy ai đó).", "Lưu ý: Không phải động từ nào cũng có thể đi với hai tân ngữ, chỉ những động từ mang nghĩa trao đổi hoặc truyền đạt thông tin mới sử dụng được cấu trúc này.", "王老师喜欢花，就送给她花吧。", "wáng lǎo shī xǐ huān huā jiù sòng gěi tā huā ba", "Thầy Vương thích hoa, vậy tặng hoa cho thầy ấy đi.", "她拿给我一杯水。", "tā ná gěi wǒ yī bēi shuǐ", "Cô ấy mang cho tôi một ly nước.", "Ví dụ: 王老师喜欢花，就送给她花吧。"]}, {"name": "Câu so sánh 比 với số lượng chênh lệch cụ thể", "details": ["Công thức: A + 比 + B + Tính từ + Số lượng chênh lệch", "Giải thích: Cấu trúc này dùng để so sánh sự khác biệt giữa hai đối tượng A và B. Từ 「比」 đóng vai trò như từ 'hơn' trong tiếng Việt, đặt ngay trước đối tượng được so sánh.", "Mẹo: Nếu muốn nhấn mạnh mức độ chênh lệch, bạn có thể thêm các từ chỉ mức độ như 「更」 hoặc 「还」 vào trước tính từ.", "Lưu ý: Không được dùng 「很」 hay các từ chỉ mức độ khác ngay trước tính từ trong câu so sánh với 「比」.", "今天的词比昨天多了十个。", "jīn tiān de cí bǐ zuó tiān duō le shí gè", "Từ vựng hôm nay nhiều hơn hôm qua mười từ.", "姐姐比我大三岁。", "jiě jiě bǐ wǒ dà sān suì", "Chị gái lớn hơn tôi ba tuổi.", "Ví dụ: 今天的词比昨天多了十个。"]}, {"name": "Câu so sánh 比 với mức chênh lệch nhỏ (一点儿/一些)", "details": ["Công thức: A + 比 + B + Tính từ + 一点儿/一些", "Giải thích: Cấu trúc này dùng để so sánh sự chênh lệch giữa hai đối tượng A và B. Trong đó, 「比」 đóng vai trò là giới từ chỉ sự so sánh, đặt giữa hai đối tượng cần so sánh.", "Mẹo: Bạn có thể thêm các phó từ như 「更」 hoặc 「还」 trước tính từ để nhấn mạnh thêm mức độ so sánh.", "Lưu ý: Tuyệt đối không dùng 「很」, 「非常」 trước tính từ trong câu so sánh với 「比」.", "这个本子比我们一起买的那个贵一点儿。", "zhè ge běn zi bǐ wǒ men yī qǐ mǎi de nà ge guì yī diǎnr", "Quyển vở này đắt hơn quyển chúng ta cùng mua một chút.", "姐姐比我高一点儿。", "jiě jiě bǐ wǒ gāo yī diǎn ér", "Chị gái cao hơn tôi một chút.", "那间教室比这间大一些。", "nà jiān jiào shì bǐ zhè jiān dà yī xiē", "Phòng học kia lớn hơn phòng này một chút.", "Ví dụ: 这个本子比我们一起买的那个贵一点儿。"]}], "extended": [], "structuredGrammar": [{"name": "Câu có hai tân ngữ", "formula": "Chủ ngữ + Động từ + Tân ngữ gián tiếp + Tân ngữ trực tiếp", "explanation": "Trong tiếng Trung, một số động từ đặc biệt như 「送」(tặng), 「给」(đưa), 「教」(dạy) có thể kéo theo hai tân ngữ cùng lúc. Tân ngữ đầu tiên thường chỉ người (người nhận), tân ngữ thứ hai thường chỉ vật (vật được nhận). Cấu trúc này giúp câu diễn đạt đầy đủ thông tin về cả người và vật trong cùng một hành động.", "tip": "Hãy ghi nhớ các động từ hay gặp trong cấu trúc này như 「送」(tặng), 「借」(cho mượn), 「告诉」(nói với ai đó), 「教」(dạy ai đó).", "note": "Không phải động từ nào cũng có thể đi với hai tân ngữ, chỉ những động từ mang nghĩa trao đổi hoặc truyền đạt thông tin mới sử dụng được cấu trúc này.", "examples": [{"zh": "王老师喜欢花，就送给她花吧。", "pinyin": "wáng lǎo shī xǐ huān huā jiù sòng gěi tā huā ba", "vi": "Thầy Vương thích hoa, vậy tặng hoa cho thầy ấy đi."}, {"zh": "她拿给我一杯水。", "pinyin": "tā ná gěi wǒ yī bēi shuǐ", "vi": "Cô ấy mang cho tôi một ly nước."}], "newExamples": [{"zh": "小林给小雨一本书，希望小雨喜欢。", "pinyin": "xiǎo lín gěi xiǎo yǔ yī běn shū ， xī wàng xiǎo yǔ xǐ huān 。", "vi": "小林 đưa 小雨 một quyển sách, hy vọng 小雨 thích."}, {"zh": "小林教小雨中文，小雨学得很认真。", "pinyin": "xiǎo lín jiào xiǎo yǔ zhōng wén ， xiǎo yǔ xué de hěn rèn zhēn 。", "vi": "小林 dạy 小雨 tiếng Trung, 小雨 học rất chăm chú."}]}, {"name": "Câu so sánh 比 với số lượng chênh lệch cụ thể", "formula": "A + 比 + B + Tính từ + Số lượng chênh lệch", "explanation": "Cấu trúc này dùng để so sánh sự khác biệt giữa hai đối tượng A và B. Từ 「比」 đóng vai trò như từ 'hơn' trong tiếng Việt, đặt ngay trước đối tượng được so sánh.", "tip": "Nếu muốn nhấn mạnh mức độ chênh lệch, bạn có thể thêm các từ chỉ mức độ như 「更」 hoặc 「还」 vào trước tính từ.", "note": "Không được dùng 「很」 hay các từ chỉ mức độ khác ngay trước tính từ trong câu so sánh với 「比」.", "examples": [{"zh": "今天的词比昨天多了十个。", "pinyin": "jīn tiān de cí bǐ zuó tiān duō le shí gè", "vi": "Từ vựng hôm nay nhiều hơn hôm qua mười từ."}, {"zh": "姐姐比我大三岁。", "pinyin": "jiě jiě bǐ wǒ dà sān suì", "vi": "Chị gái lớn hơn tôi ba tuổi."}], "newExamples": [{"zh": "小林十五岁，小雨十二岁，小林比小雨大三岁。", "pinyin": "xiǎo lín shí wǔ suì ， xiǎo yǔ shí èr suì ， xiǎo lín bǐ xiǎo yǔ dà sān suì 。", "vi": "小林 mười lăm tuổi, 小雨 mười hai tuổi, 小林 lớn hơn 小雨 ba tuổi."}, {"zh": "小林的本子二十块，小雨的十块，前者比后者贵十块钱。", "pinyin": "xiǎo lín de běn zi èr shí kuài ， xiǎo yǔ de shí kuài ， qián zhě bǐ hòu zhě guì shí kuài qián 。", "vi": "Vở của 小林 hai mươi tệ, của 小雨 mười tệ, cái trước đắt hơn cái sau mười tệ."}]}, {"name": "Câu so sánh 比 với mức chênh lệch nhỏ (一点儿/一些)", "formula": "A + 比 + B + Tính từ + 一点儿/一些", "explanation": "Cấu trúc này dùng để so sánh sự chênh lệch giữa hai đối tượng A và B. Trong đó, 「比」 đóng vai trò là giới từ chỉ sự so sánh, đặt giữa hai đối tượng cần so sánh.", "tip": "Bạn có thể thêm các phó từ như 「更」 hoặc 「还」 trước tính từ để nhấn mạnh thêm mức độ so sánh.", "note": "Tuyệt đối không dùng 「很」, 「非常」 trước tính từ trong câu so sánh với 「比」.", "examples": [{"zh": "这个本子比我们一起买的那个贵一点儿。", "pinyin": "zhè ge běn zi bǐ wǒ men yī qǐ mǎi de nà ge guì yī diǎnr", "vi": "Quyển vở này đắt hơn quyển chúng ta cùng mua một chút."}, {"zh": "姐姐比我高一点儿。", "pinyin": "jiě jiě bǐ wǒ gāo yī diǎn ér", "vi": "Chị gái cao hơn tôi một chút."}, {"zh": "那间教室比这间大一些。", "pinyin": "nà jiān jiào shì bǐ zhè jiān dà yī xiē", "vi": "Phòng học kia lớn hơn phòng này một chút."}], "newExamples": [{"zh": "小林的书包比小雨的重一点儿，但差别不大。", "pinyin": "xiǎo lín de shū bāo bǐ xiǎo yǔ de zhòng yì diǎn ér ， dàn chā bié bù dà 。", "vi": "Cặp của 小林 nặng hơn của 小雨 một chút, nhưng chênh lệch không lớn."}, {"zh": "小林的房间比小雨的大一些，只多两平方米。", "pinyin": "xiǎo lín de fáng jiān bǐ xiǎo yǔ de dà yī xiē ， zhǐ duō liǎng píng fāng mǐ 。", "vi": "Phòng 小林 lớn hơn phòng 小雨 một chút, chỉ hơn hai mét vuông."}]}]}, {"id": 14, "title": "Bạn mới đến chơi", "subtitle": "站 · 包 · 过年 · 没意思", "words": [{"id": "hsk2-14-01", "hanzi": "站", "pinyin": "zhàn", "meaning": "đứng", "example": "请站在黄线后面等车。", "examplePinyin": "qǐng zhàn zài huáng xiàn hòu miàn děng chē 。", "translation": "Hãy đứng sau vạch vàng chờ xe."}, {"id": "hsk2-14-02", "hanzi": "包", "pinyin": "bāo", "meaning": "gói, túi", "example": "这个包有点儿重，我帮你拿吧。", "examplePinyin": "zhè ge bāo yǒu diǎn ér zhòng ， wǒ bāng nǐ ná ba 。", "translation": "Túi này hơi nặng, để tôi cầm giúp bạn nhé."}, {"id": "hsk2-14-03", "hanzi": "过年", "pinyin": "guònián", "meaning": "đón Tết", "example": "今年我们回老家过年。", "examplePinyin": "jīn nián wǒ men huí lǎo jiā guò nián 。", "translation": "Năm nay chúng tôi về quê ăn Tết."}, {"id": "hsk2-14-04", "hanzi": "没意思", "pinyin": "méi yìsi", "meaning": "chán", "example": "一个人在家看电视真没意思。", "examplePinyin": "yí gè rén zài jiā kàn diàn shì zhēn méi yì si 。", "translation": "Xem tivi ở nhà một mình thật chán."}, {"id": "hsk2-14-05", "hanzi": "位", "pinyin": "wèi", "meaning": "lượng từ lịch sự", "example": "这位先生是我们的新老师。", "examplePinyin": "zhè wèi xiān shēng shì wǒ men de xīn lǎo shī 。", "translation": "Vị này là thầy giáo mới của chúng tôi."}, {"id": "hsk2-14-06", "hanzi": "前面", "pinyin": "qiánmiàn", "meaning": "phía trước", "example": "前面走过来一位拿着雨伞的老师。", "examplePinyin": "qián miàn zǒu guò lái yī wèi ná zhe yǔ sǎn de lǎo shī 。", "translation": "Phía trước có một thầy giáo cầm ô đi tới."}, {"id": "hsk2-14-07", "hanzi": "房子", "pinyin": "fángzi", "meaning": "nhà", "example": "这所房子比我们以前住的大一些。", "examplePinyin": "zhè suǒ fáng zi bǐ wǒ men yǐ qián zhù de dà yī xiē 。", "translation": "Ngôi nhà này lớn hơn ngôi chúng tôi ở trước đây một chút."}, {"id": "hsk2-14-08", "hanzi": "小孩儿", "pinyin": "xiǎoháir", "meaning": "trẻ con", "example": "公园里有几个小孩儿正在玩。", "examplePinyin": "gōng yuán lǐ yǒu jǐ gè xiǎo hái ér zhèng zài wán 。", "translation": "Trong công viên có mấy đứa trẻ đang chơi."}, {"id": "hsk2-14-09", "hanzi": "女孩儿", "pinyin": "nǚháir", "meaning": "bé gái", "example": "那个穿红衣服的女孩儿正在跳舞。", "examplePinyin": "nà ge chuān hóng yī fú de nǚ hái ér zhèng zài tiào wǔ 。", "translation": "Cô bé mặc áo đỏ kia đang nhảy múa."}, {"id": "hsk2-14-10", "hanzi": "姓", "pinyin": "xìng", "meaning": "họ", "example": "我姓李，你贵姓？", "examplePinyin": "wǒ xìng lǐ ， nǐ guì xìng ？", "translation": "Tôi họ Lý, xin hỏi bạn họ gì?"}, {"id": "hsk2-14-11", "hanzi": "眼睛", "pinyin": "yǎnjing", "meaning": "mắt", "example": "妹妹的眼睛又大又亮。", "examplePinyin": "mèi mèi de yǎn jīng yòu dà yòu liàng 。", "translation": "Mắt em gái vừa to vừa sáng."}, {"id": "hsk2-14-12", "hanzi": "跳舞", "pinyin": "tiàowǔ", "meaning": "nhảy múa", "example": "妈妈一有时间就去公园跳舞。", "examplePinyin": "mā mā yī yǒu shí jiān jiù qù gōng yuán tiào wǔ 。", "translation": "Mẹ cứ có thời gian là đến công viên nhảy múa."}], "grammar": [{"name": "Câu tồn tại chỉ sự xuất hiện hoặc biến mất", "details": ["Công thức: Địa điểm + Động từ + (了/着) + Danh từ", "Giải thích: Câu tồn tại không chỉ dùng để nói về sự tồn tại, mà còn để miêu tả sự xuất hiện hoặc biến mất của người/vật tại một nơi nào đó. Cấu trúc này giúp người nghe hình dung rõ bối cảnh không gian nơi sự việc đang diễn ra.", "Mẹo: Hãy chú ý dùng thêm 「了」 hoặc 「着」 sau động từ để làm rõ trạng thái của sự việc (đã xuất hiện hoặc đang tồn tại).", "Lưu ý: Trong câu này, danh từ ở cuối câu thường không xác định (ví dụ: một cái bàn, vài người), không nên dùng các từ chỉ danh từ cụ thể hay đại từ riêng.", "你家楼下站着一个人。", "nǐ jiā lóu xià zhàn zhe yī gè rén", "Dưới lầu nhà bạn có một người đang đứng.", "前面走过来一个人。", "qián miàn zǒu guò lái yī gè rén", "Phía trước có một người đi tới.", "那间教室里坐着不少学生。", "nà jiān jiào shì lǐ zuò zhe bù shǎo xué shēng", "Trong phòng học kia có khá nhiều học sinh đang ngồi.", "我们班走了两个学生。", "wǒ men bān zǒu le liǎng gè xué shēng", "Lớp chúng tôi có hai học sinh đã chuyển đi.", "Ví dụ: 你家楼下站着一个人。"]}, {"name": "Đại từ nghi vấn 多 hỏi mức độ", "details": ["Công thức: Chủ ngữ + 多 + Tính từ (大, 高, 远,...) ?", "Giải thích: Trong tiếng Trung, 「多」 được dùng trước tính từ để hỏi về mức độ của sự vật, sự việc như tuổi tác, chiều cao hoặc khoảng cách. Khi trả lời câu hỏi này, bạn cần cung cấp một con số hoặc thông tin cụ thể thay vì dùng tính từ.", "Mẹo: Hãy ghi nhớ cấu trúc 「多」 + tính từ để đặt câu hỏi về quy mô hoặc kích thước, ví dụ: 「你多大？」 (Bạn bao nhiêu tuổi?).", "Lưu ý: Đừng nhầm lẫn 「多」 trong trường hợp này với nghĩa là \"nhiều\" (số lượng); ở đây nó đóng vai trò là đại từ nghi vấn về mức độ.", "你一个人在这儿多没意思啊！", "nǐ yī gè rén zài zhè ér duō méi yì sī a", "Một mình bạn ở đây thật là chẳng thú vị gì cả!", "多好看啊！买这件吧。", "duō hǎo kàn a mǎi zhè jiàn ba", "Đẹp biết bao! Mua bộ này đi.", "Ví dụ: 你一个人在这儿多没意思啊！"]}, {"name": "Bổ ngữ xu hướng phức hợp", "details": ["Công thức: Động từ + (上/下/进/出/回/过/起) + 来/去", "Giải thích: Bổ ngữ xu hướng phức hợp gồm một động từ chỉ phương hướng kết hợp với 「来」 (lại đây) hoặc 「去」 (đi tới đó). Cấu trúc này dùng để mô tả hướng di chuyển của hành động một cách chi tiết hơn. Ví dụ 「走进来」 nghĩa là đi vào đây, 「走进去」 nghĩa là đi vào đó.", "Mẹo: Nếu câu có tân ngữ là nơi chốn, hãy đặt tân ngữ vào giữa bổ ngữ xu hướng, ví dụ 「走进教室来」.", "Lưu ý: Chú ý phân biệt giữa 「来」 (hướng về phía người nói) và 「去」 (hướng xa khỏi người nói) để sử dụng chính xác.", "她经常跑上来找我玩儿。", "tā jīng cháng pǎo shàng lái zhǎo wǒ wán ér", "Cô ấy thường xuyên chạy lên đây tìm tôi chơi.", "楼不高，我们走上去吧。", "lóu bù gāo wǒ men zǒu shàng qù ba", "Lầu không cao, chúng ta đi bộ lên đi.", "一听到老师叫他的名字，他就站起来了。", "yī tīng dào lǎo shī jiào tā de míng zì tā jiù zhàn qǐ lái le", "Vừa nghe thấy thầy giáo gọi tên mình, anh ấy liền đứng dậy.", "Ví dụ: 她经常跑上来找我玩儿。"]}], "extended": [], "structuredGrammar": [{"name": "Câu tồn tại chỉ sự xuất hiện hoặc biến mất", "formula": "Địa điểm + Động từ + (了/着) + Danh từ", "explanation": "Câu tồn tại không chỉ dùng để nói về sự tồn tại, mà còn để miêu tả sự xuất hiện hoặc biến mất của người/vật tại một nơi nào đó. Cấu trúc này giúp người nghe hình dung rõ bối cảnh không gian nơi sự việc đang diễn ra.", "tip": "Hãy chú ý dùng thêm 「了」 hoặc 「着」 sau động từ để làm rõ trạng thái của sự việc (đã xuất hiện hoặc đang tồn tại).", "note": "Trong câu này, danh từ ở cuối câu thường không xác định (ví dụ: một cái bàn, vài người), không nên dùng các từ chỉ danh từ cụ thể hay đại từ riêng.", "examples": [{"zh": "你家楼下站着一个人。", "pinyin": "nǐ jiā lóu xià zhàn zhe yī gè rén", "vi": "Dưới lầu nhà bạn có một người đang đứng."}, {"zh": "前面走过来一个人。", "pinyin": "qián miàn zǒu guò lái yī gè rén", "vi": "Phía trước có một người đi tới."}, {"zh": "那间教室里坐着不少学生。", "pinyin": "nà jiān jiào shì lǐ zuò zhe bù shǎo xué shēng", "vi": "Trong phòng học kia có khá nhiều học sinh đang ngồi."}, {"zh": "我们班走了两个学生。", "pinyin": "wǒ men bān zǒu le liǎng gè xué shēng", "vi": "Lớp chúng tôi có hai học sinh đã chuyển đi."}], "newExamples": [{"zh": "小林家楼下站着一个人，是小雨。", "pinyin": "xiǎo lín jiā lóu xià zhàn zhe yí gè rén ， shì xiǎo yǔ 。", "vi": "Dưới lầu nhà 小林 có một người đang đứng, đó là 小雨."}, {"zh": "小林说：“门口来了一位客人。”", "pinyin": "xiǎo lín shuō ： “ mén kǒu lái le yī wèi kè rén 。 ”", "vi": "小林 nói: “Ở cửa có một vị khách đến rồi.”"}]}, {"name": "Đại từ nghi vấn 多 hỏi mức độ", "formula": "Chủ ngữ + 多 + Tính từ (大, 高, 远,...) ?", "explanation": "Trong tiếng Trung, 「多」 được dùng trước tính từ để hỏi về mức độ của sự vật, sự việc như tuổi tác, chiều cao hoặc khoảng cách. Khi trả lời câu hỏi này, bạn cần cung cấp một con số hoặc thông tin cụ thể thay vì dùng tính từ.", "tip": "Hãy ghi nhớ cấu trúc 「多」 + tính từ để đặt câu hỏi về quy mô hoặc kích thước, ví dụ: 「你多大？」 (Bạn bao nhiêu tuổi?).", "note": "Đừng nhầm lẫn 「多」 trong trường hợp này với nghĩa là \"nhiều\" (số lượng); ở đây nó đóng vai trò là đại từ nghi vấn về mức độ.", "examples": [{"zh": "你一个人在这儿多没意思啊！", "pinyin": "nǐ yī gè rén zài zhè ér duō méi yì sī a", "vi": "Một mình bạn ở đây thật là chẳng thú vị gì cả!"}, {"zh": "多好看啊！买这件吧。", "pinyin": "duō hǎo kàn a mǎi zhè jiàn ba", "vi": "Đẹp biết bao! Mua bộ này đi."}], "clarification": "Phân biệt: 多 + tính từ trong câu hỏi như 多大 / 多远 hỏi mức độ; 多好看啊 là câu cảm thán “đẹp biết bao”. Hai ví dụ gốc dưới đây thuộc cách cảm thán.", "newExamples": [{"zh": "小林问小雨：“你家离学校多远？”", "pinyin": "xiǎo lín wèn xiǎo yǔ ： “ nǐ jiā lí xué xiào duō yuǎn ？ ”", "vi": "小林 hỏi 小雨: “Nhà bạn cách trường bao xa?”"}, {"zh": "小林问：“你的弟弟多大了？”", "pinyin": "xiǎo lín wèn ： “ nǐ de dì di duō dà le ？ ”", "vi": "小林 hỏi: “Em trai bạn bao nhiêu tuổi rồi?”"}]}, {"name": "Bổ ngữ xu hướng phức hợp", "formula": "Động từ + (上/下/进/出/回/过/起) + 来/去", "explanation": "Bổ ngữ xu hướng phức hợp gồm một động từ chỉ phương hướng kết hợp với 「来」 (lại đây) hoặc 「去」 (đi tới đó). Cấu trúc này dùng để mô tả hướng di chuyển của hành động một cách chi tiết hơn. Ví dụ 「走进来」 nghĩa là đi vào đây, 「走进去」 nghĩa là đi vào đó.", "tip": "Nếu câu có tân ngữ là nơi chốn, hãy đặt tân ngữ vào giữa bổ ngữ xu hướng, ví dụ 「走进教室来」.", "note": "Chú ý phân biệt giữa 「来」 (hướng về phía người nói) và 「去」 (hướng xa khỏi người nói) để sử dụng chính xác.", "examples": [{"zh": "她经常跑上来找我玩儿。", "pinyin": "tā jīng cháng pǎo shàng lái zhǎo wǒ wán ér", "vi": "Cô ấy thường xuyên chạy lên đây tìm tôi chơi."}, {"zh": "楼不高，我们走上去吧。", "pinyin": "lóu bù gāo wǒ men zǒu shàng qù ba", "vi": "Lầu không cao, chúng ta đi bộ lên đi."}, {"zh": "一听到老师叫他的名字，他就站起来了。", "pinyin": "yī tīng dào lǎo shī jiào tā de míng zì tā jiù zhàn qǐ lái le", "vi": "Vừa nghe thấy thầy giáo gọi tên mình, anh ấy liền đứng dậy."}], "newExamples": [{"zh": "小林在教室里说：“小雨，请走进来，坐在我旁边。”", "pinyin": "xiǎo lín zài jiào shì lǐ shuō ： “ xiǎo yǔ ， qǐng zǒu jìn lái ， zuò zài wǒ páng biān 。 ”", "vi": "小林 ở trong lớp nói: “小雨, hãy bước vào đây, ngồi cạnh tôi.”"}, {"zh": "老师叫到小林的名字，小林就站起来回答问题。", "pinyin": "lǎo shī jiào dào xiǎo lín de míng zì ， xiǎo lín jiù zhàn qǐ lái huí dá wèn tí 。", "vi": "Thầy gọi tên 小林, 小林 liền đứng dậy trả lời."}]}]}, {"id": 15, "title": "Hẹn gặp lại bạn", "subtitle": "姓名 · 出国 · 门票 · 高中", "words": [{"id": "hsk2-15-01", "hanzi": "姓名", "pinyin": "xìngmíng", "meaning": "họ và tên", "example": "请在第一行写你的姓名。", "examplePinyin": "qǐng zài dì yī xíng xiě nǐ de xìng míng 。", "translation": "Hãy viết họ tên bạn ở dòng đầu tiên."}, {"id": "hsk2-15-02", "hanzi": "出国", "pinyin": "chūguó", "meaning": "ra nước ngoài", "example": "这是我第一次出国。", "examplePinyin": "zhè shì wǒ dì yī cì chū guó 。", "translation": "Đây là lần đầu tôi ra nước ngoài."}, {"id": "hsk2-15-03", "hanzi": "门票", "pinyin": "ménpiào", "meaning": "vé vào cửa", "example": "这张门票比昨天买的便宜十块。", "examplePinyin": "zhè zhāng mén piào bǐ zuó tiān mǎi de pián yi shí kuài 。", "translation": "Vé vào cửa này rẻ hơn vé mua hôm qua mười tệ."}, {"id": "hsk2-15-04", "hanzi": "高中", "pinyin": "gāozhōng", "meaning": "trung học phổ thông", "example": "姐姐高中毕业以后想学中文。", "examplePinyin": "jiě jiě gāo zhōng bì yè yǐ hòu xiǎng xué zhōng wén 。", "translation": "Sau khi tốt nghiệp cấp ba chị muốn học tiếng Trung."}, {"id": "hsk2-15-05", "hanzi": "出门", "pinyin": "chūmén", "meaning": "ra khỏi nhà", "example": "出门以前记得关灯。", "examplePinyin": "chū mén yǐ qián jì de guān dēng 。", "translation": "Trước khi ra ngoài nhớ tắt đèn."}, {"id": "hsk2-15-06", "hanzi": "路", "pinyin": "lù", "meaning": "đường", "example": "这条路一直通到火车站。", "examplePinyin": "zhè tiáo lù yì zhí tōng dào huǒ chē zhàn 。", "translation": "Con đường này thông thẳng tới ga tàu hỏa."}, {"id": "hsk2-15-07", "hanzi": "机场", "pinyin": "jīchǎng", "meaning": "sân bay", "example": "明天我去机场接从中国来的朋友。", "examplePinyin": "míng tiān wǒ qù jī chǎng jiē cóng zhōng guó lái de péng yǒu 。", "translation": "Ngày mai tôi ra sân bay đón bạn từ Trung Quốc đến."}, {"id": "hsk2-15-08", "hanzi": "机票", "pinyin": "jīpiào", "meaning": "vé máy bay", "example": "我已经买好下周回国的机票了。", "examplePinyin": "wǒ yǐ jīng mǎi hǎo xià zhōu huí guó de jī piào le 。", "translation": "Tôi đã mua xong vé máy bay về nước tuần sau."}, {"id": "hsk2-15-09", "hanzi": "飞", "pinyin": "fēi", "meaning": "bay", "example": "小鸟从树上飞下来了。", "examplePinyin": "xiǎo niǎo cóng shù shàng fēi xià lái le 。", "translation": "Chim nhỏ từ trên cây bay xuống đây."}, {"id": "hsk2-15-10", "hanzi": "好像", "pinyin": "hǎoxiàng", "meaning": "hình như", "example": "那个人好像是你的同学。", "examplePinyin": "nà ge rén hǎo xiàng shì nǐ de tóng xué 。", "translation": "Người kia hình như là bạn học của bạn."}, {"id": "hsk2-15-11", "hanzi": "鸟", "pinyin": "niǎo", "meaning": "chim", "example": "树上 有」.", "Mẹo: Khi muốn nói 'không có', hãy luôn dùng 「没有」, không bao giờ nói 「不有」.", "Lưu ý: Đừng nhầm lẫn giữa 「有」 (sở hữu/tồn tại) và 「是」 (định danh/là).", "你有一年没回国了吧？", "nǐ yǒu yī nián méi huí guó le ba", "Bạn đã một năm rồi không về nước phải không?", "你女儿今年有10岁了吗？", "nǐ nǚ ér jīn nián yǒu suì le ma", "Con gái bạn năm nay được 10 tuổi chưa?", "我有一个月没给家里打电话了。", "wǒ yǒu yī gè yuè méi gěi jiā lǐ dǎ diàn huà le", "Tôi đã một tháng rồi chưa gọi điện về nhà.", "Ví dụ: 你有一年没回国了吧？"]}], "extended": [], "structuredGrammar": [{"name": "Vị trí phó từ chỉ tần suất", "formula": "Chủ ngữ + Phó từ tần suất + Động từ + Tân ngữ", "explanation": "Trong tiếng Trung, các phó từ chỉ tần suất như 「常常」(thường xuyên), 「总是」(luôn luôn) được đặt trước động từ để bổ nghĩa. Cấu trúc này giúp xác định mức độ lặp lại của một hành động trong câu.", "tip": "Nếu tân ngữ của câu là đại từ nhân xưng (như 「你」, 「他」, 「我」), bạn buộc phải đặt phó từ chỉ tần suất ngay sau đại từ đó.", "note": "Đừng đặt phó từ chỉ tần suất ở cuối câu vì vị trí của nó luôn nằm trước động từ hoặc sau đại từ nhân xưng làm tân ngữ.", "examples": [{"zh": "我想去中国，虽然去过一次，但是很想再去一次。", "pinyin": "wǒ xiǎng qù zhōng guó suī rán qù guò yī cì dàn shì hěn xiǎng zài qù yī cì", "vi": "Tôi muốn đi Trung Quốc, mặc dù đã từng đi một lần nhưng rất muốn đi thêm lần nữa."}, {"zh": "安妮来过一次北京。", "pinyin": "ān nī lái guò yī cì běi jīng", "vi": "Annie đã từng đến Bắc Kinh một lần."}], "clarification": "常常 / 经常 / 总是 là phó từ tần suất, đứng trước động từ. 一次 / 两次 là bổ ngữ số lần, không phải phó từ. Các ví dụ gốc dưới đây đang minh họa số lần; xem thêm câu mới để phân biệt.", "newExamples": [{"zh": "小林常常去图书馆看书。", "pinyin": "xiǎo lín cháng cháng qù tú shū guǎn kàn shū 。", "vi": "小林 thường đến thư viện đọc sách."}, {"zh": "小林总是很早到教室，从来不迟到。", "pinyin": "xiǎo lín zǒng shì hěn zǎo dào jiào shì ， cóng lái bù chí dào 。", "vi": "小林 luôn đến lớp rất sớm, chưa bao giờ đến muộn."}]}, {"name": "Vị trí bổ ngữ tần suất với tân ngữ", "formula": "Chủ ngữ + Động từ + Tân ngữ + (Bổ ngữ tần suất)", "explanation": "Khi tân ngữ trong câu là đại từ nhân xưng (như 「我」, 「你」, 「他」), bổ ngữ chỉ tần suất (ví dụ: 「一次」, 「两次」) bắt buộc phải đặt sau tân ngữ. Cấu trúc này giúp làm rõ hành động tác động lên đối tượng bao nhiêu lần.", "tip": "Nếu tân ngữ không phải là đại từ, bạn có thể đặt bổ ngữ tần suất trước hoặc sau tân ngữ đều được.", "note": "Đừng đặt bổ ngữ tần suất trước tân ngữ khi tân ngữ đó là đại từ nhân xưng, vì sẽ gây sai ngữ pháp.", "examples": [{"zh": "我想找他一次。", "pinyin": "wǒ xiǎng zhǎo tā yī cì", "vi": "Tôi muốn tìm anh ấy một lần."}, {"zh": "安妮来过这儿两次。", "pinyin": "ān nī lái guò zhè ér liǎng cì", "vi": "Annie đã đến đây hai lần."}], "newExamples": [{"zh": "小林今天找了小雨一次，后来就回家了。", "pinyin": "xiǎo lín jīn tiān zhǎo le xiǎo yǔ yī cì ， hòu lái jiù huí jiā le 。", "vi": "Hôm nay 小林 đã tìm 小雨 một lần, sau đó về nhà."}, {"zh": "小林昨天给小雨打了两次电话，都没人接。", "pinyin": "xiǎo lín zuó tiān gěi xiǎo yǔ dǎ le liǎng cì diàn huà ， dōu méi rén jiē 。", "vi": "Hôm qua 小林 đã gọi điện cho 小雨 hai lần, đều không ai nghe."}]}, {"name": "Câu chữ 有 (Sở hữu và Tồn tại)", "formula": "S + 有 + O (Chủ ngữ + Có + Tân ngữ)", "explanation": "Động từ 「有」 dùng để chỉ sự sở hữu (có cái gì đó) hoặc sự tồn tại (có sự xuất hiện của ai/cái gì). Trong câu phủ định, ta dùng 「没有」 thay cho 「不有」.", "tip": "Khi muốn nói 'không có', hãy luôn dùng 「没有」, không bao giờ nói 「不有」.", "note": "Đừng nhầm lẫn giữa 「有」 (sở hữu/tồn tại) và 「是」 (định danh/là).", "examples": [{"zh": "你有一年没回国了吧？", "pinyin": "nǐ yǒu yī nián méi huí guó le ba", "vi": "Bạn đã một năm rồi không về nước phải không?"}, {"zh": "你女儿今年有10岁了吗？", "pinyin": "nǐ nǚ ér jīn nián yǒu 1 0 suì le ma ？", "vi": "Con gái bạn năm nay được 10 tuổi chưa?"}, {"zh": "我有一个月没给家里打电话了。", "pinyin": "wǒ yǒu yī gè yuè méi gěi jiā lǐ dǎ diàn huà le", "vi": "Tôi đã một tháng rồi chưa gọi điện về nhà."}], "clarification": "Ngoài sở hữu và tồn tại, 有 + khoảng thời gian + 没 + V nói đã một khoảng thời gian chưa làm việc gì. Các ví dụ gốc ở đây chủ yếu minh họa nghĩa thời lượng này.", "newExamples": [{"zh": "小林家里有一只小猫。", "pinyin": "xiǎo lín jiā lǐ yǒu yī zhī xiǎo māo 。", "vi": "Nhà 小林 có một chú mèo."}, {"zh": "小林说：“我没有护照，现在还不能出国。”", "pinyin": "xiǎo lín shuō ： “ wǒ méi yǒu hù zhào ， xiàn zài hái bù néng chū guó 。 ”", "vi": "小林 nói: “Tôi chưa có hộ chiếu, bây giờ vẫn chưa thể ra nước ngoài.”"}]}]}];</script><script>
const L=window.HSK_LESSONS;let lesson=L[0],tab='words',flashIndex=0,flipped=false,session=null,filter='',hidePin=false,hideVi=false,onlyUnknown=false;
const KEY='hsk2-quest-v1';let store;try{store=JSON.parse(localStorage.getItem(KEY))||{known:{},history:[],wrong:{},recent:1}}catch{store={known:{},history:[],wrong:{},recent:1}};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(store));const all=()=>L.flatMap(x=>x.words);const known=()=>Object.values(store.known).filter(Boolean).length;const wordKey=w=>w.id;
function speak(t,rate=0.85){if(!('speechSynthesis'in window)){alert('Trình duyệt không hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=rate;speechSynthesis.speak(u)}
function home(){session=null;$('#app').innerHTML=`<section class="hero"><span class="pill">NEW HSK 2 · 15 BÀI</span><h1>HSK 2 VERSION 3.0</h1><p>211 lượt từ vựng · Flashcard · Luyện tập · Theo dõi tiến độ</p><div class="row"><button class="primary" onclick="openLesson(${store.recent||1})">▶ Tiếp tục bài ${store.recent||1}</button><button onclick="showReview()">Ôn tập tổng hợp</button></div></section><div class="grid"><div class="panel"><div class="stat">${known()}</div>Từ đã đánh dấu thuộc</div><div class="panel"><div class="stat">${store.history.length}</div>Lượt luyện tập</div><div class="panel"><div class="stat">${store.history.reduce((a,b)=>a+b.correct,0)}</div>Câu trả lời đúng</div></div><h2>15 bài học</h2><div class="grid">${L.map(x=>`<div class="card" onclick="openLesson(${x.id})"><span class="pill">Bài ${String(x.id).padStart(2,'0')}</span><h3 class="hanzi">${esc(x.title)}</h3><p>${esc(x.subtitle)}</p><small class="muted">${x.words.length} từ · ${x.grammar.length} mục ngữ pháp</small><div class="progress" style="margin-top:12px"><div style="width:${100*x.words.filter(w=>store.known[wordKey(w)]).length/x.words.length}%"></div></div></div>`).join('')}</div>`}
function openLesson(id,t='words'){lesson=L.find(x=>x.id===id);tab=t;store.recent=id;save();renderLesson()}
function renderLesson(){session=null;$('#app').innerHTML=`<button onclick="home()">← Trang chủ</button><h2>Bài ${lesson.id}: <span class="hanzi">${esc(lesson.title)}</span></h2><p class="muted">${esc(lesson.subtitle)} · ${lesson.words.length} từ vựng</p><div class="tabs">${[['words','Từ vựng'],['grammar','Ngữ pháp'],['flash','Flashcard'],['games','Trò chơi']].map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';renderLesson()">${n}</button>`).join('')}</div><section id="content"></section>`;if(tab==='words')renderWords();if(tab==='grammar')renderGrammar();if(tab==='flash')renderFlash();if(tab==='games')renderGames()}
function renderWords(){let words=lesson.words.filter(w=>(!onlyUnknown||!store.known[wordKey(w)])&&[w.hanzi,w.pinyin,w.meaning].join(' ').toLowerCase().includes(filter.toLowerCase()));$('#content').innerHTML=`<div class="toolbar"><input type="search" placeholder="Tìm Hán tự, Pinyin, nghĩa..." value="${esc(filter)}" oninput="filter=this.value;renderWords()"><button onclick="hidePin=!hidePin;renderWords()">${hidePin?'Hiện':'Ẩn'} Pinyin</button><button onclick="hideVi=!hideVi;renderWords()">${hideVi?'Hiện':'Ẩn'} nghĩa</button><button onclick="onlyUnknown=!onlyUnknown;renderWords()" class="${onlyUnknown?'active':''}">Chưa thuộc</button></div><div class="tablewrap panel"><table><thead><tr><th>STT</th><th>Hán tự</th><th>Pinyin</th><th>Nghĩa</th><th>Ví dụ và dịch</th><th>Học</th></tr></thead><tbody>${words.map((w,i)=>`<tr><td>${i+1}</td><td><div class="hanzi">${esc(w.hanzi)}</div><button onclick="speak('${w.hanzi.replace(/'/g,'')}')">🔊</button></td><td>${hidePin?'•••':esc(w.pinyin)}</td><td>${hideVi?'•••':esc(w.meaning)}</td><td><div class="hanzi" style="font-size:23px">${esc(w.example)}</div><div class="muted">${esc(w.examplePinyin||'')}</div><div class="muted">${hideVi?'•••':esc(w.translation)}</div><button onclick="speak(${JSON.stringify(w.example).replace(/"/g,'&quot;')})">🔊 Nghe câu</button></td><td><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Thuộc':'○ Chưa'}</button></td></tr>`).join('')}</tbody></table></div>`}
function toggleKnown(id){store.known[id]=!store.known[id];save();if(tab==='flash')renderFlash();else renderWords()}
function renderGrammar(){const make=(a,heading)=>`<h3>${heading}</h3>${a.map(g=>`<article class="panel grammar"><h3>${esc(g.name)}</h3><p>${g.details.map(esc).join('\n')}</p></article>`).join('')}`;$('#content').innerHTML=make(lesson.grammar,'Ngữ pháp giáo trình')+make(lesson.extended,'Chú thích mở rộng')}
function flashList(){return lesson.words.filter(w=>!onlyUnknown||!store.known[w.id])}function renderFlash(){let a=flashList();if(flashIndex>=a.length)flashIndex=0;let w=a[flashIndex];$('#content').innerHTML=`<div class="toolbar"><button onclick="onlyUnknown=!onlyUnknown;flashIndex=0;flipped=false;renderFlash()" class="${onlyUnknown?'active':''}">Chỉ từ chưa thuộc</button><button onclick="lesson.words.sort(()=>Math.random()-.5);flashIndex=0;renderFlash()">🔀 Trộn thẻ</button></div>${!w?'<div class="panel">Bạn đã đánh dấu thuộc tất cả từ trong bài.</div>':`<div class="panel flash" onclick="flipped=!flipped;renderFlash()"><div class="muted">Thẻ ${flashIndex+1}/${a.length} · Nhấn để lật</div>${flipped?`<div class="hanzi big">${esc(w.hanzi)}</div><h2>${esc(w.pinyin)}</h2><h3>${esc(w.meaning)}</h3><div class="hanzi" style="font-size:24px">${esc(w.example)}</div><p>${esc(w.translation)}</p>`:`<div class="hanzi big">${esc(w.hanzi)}</div>`}</div><div class="toolbar"><button onclick="speak(${JSON.stringify(w.hanzi).replace(/"/g,'&quot;')})">🔊 Nghe</button><button onclick="flashIndex=Math.max(0,flashIndex-1);flipped=false;renderFlash()">← Trước</button><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Đã thuộc':'○ Đánh dấu thuộc'}</button><button class="primary" onclick="flashIndex=(flashIndex+1)%flashList().length;flipped=false;renderFlash()">Tiếp →</button></div>`}`}
const MODES=[['hanzi','Hán tự → Nghĩa'],['meaning','Nghĩa → Hán tự'],['pinyin','Chọn Pinyin'],['listen','Nghe chọn Hán tự'],['type','Gõ Hán tự'],['dictation','Nghe chép chính tả']];
function renderGames(){let modes=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${n}</h3><p class="muted">Luyện với dữ liệu từ vựng của bài</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<h3>Chọn chế độ luyện tập</h3><div class="grid">${modes}</div><p class="muted">Phiên bản này triển khai 6 chế độ từ vựng. Các chế độ viết đoạn, đọc hiểu dài, sắp xếp câu và thử thách ngữ pháp chuyên sâu sẽ được bổ sung ở giai đoạn nội dung tiếp theo, không sử dụng câu hỏi giả.</p>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(mode,custom){let pool=custom||lesson.words;let questions=shuffle(pool).slice(0,Math.min(30,pool.length));session={mode,questions,pool,index:0,correct:0,answered:false};renderQuestion()}
function renderQuestion(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=s.mode;let options=shuffle([w,...shuffle(s.pool.filter(x=>x.hanzi!==w.hanzi&&x.meaning!==w.meaning)).slice(0,3)]);s.options=options;let question=m==='meaning'?w.meaning:m==='hanzi'||m==='pinyin'?w.hanzi:m==='type'?w.meaning:'🔊 Nhấn nghe';$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${MODES.find(x=>x[0]===m)?.[1]||m}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${m==='hanzi'||m==='pinyin'?'hanzi big':''}">${esc(question)}</h2>${m==='listen'||m==='dictation'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Phát âm</button>':''}<div id="options">${m==='type'||m==='dictation'?`<input id="typed" placeholder="Nhập Hán tự" autocomplete="off"><button class="primary" onclick="checkAnswer($('#typed').value)">Kiểm tra</button>`:options.map((o,i)=>`<button class="option ${m==='meaning'||m==='listen'?'chinese-option':''}" onclick="checkAnswer(${i})">${esc(m==='hanzi'?o.meaning:m==='pinyin'?o.pinyin:m==='meaning'||m==='listen'?o.hanzi:o.meaning)}</button>`).join('')}</div><div id="feedback"></div></div>`;if(m==='listen'||m==='dictation')speak(w.hanzi)}
function checkAnswer(input){let s=session;if(s.answered)return;let w=s.questions[s.index],m=s.mode;let ok=typeof input==='number'?s.options[input].id===w.id:input.replace(/[\s，。！？,.!?]/g,'')===w.hanzi.replace(/[\s，。！？,.!?]/g,'');s.answered=true;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác!':'✗ Chưa đúng'}</strong><div class="hanzi">${esc(w.hanzi)}</div><div>${esc(w.pinyin)} · ${esc(w.meaning)}</div><p>${esc(w.example)} — ${esc(w.translation)}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderQuestion()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`;[...document.querySelectorAll('.option')].forEach(b=>b.disabled=true)}
function finishGame(){let s=session;store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập 🎉</h2><div class="stat">${s.correct}/${s.questions.length}</div><p>Tỷ lệ đúng: ${Math.round(100*s.correct/s.questions.length)}%</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`}
function showReview(){let ids=L.map(x=>x.id);$('#app').innerHTML=`<h2>Ôn tập tổng hợp</h2><div class="panel"><p>Chọn các bài để luyện từ vựng.</p><div class="grid">${L.map(x=>`<label><input type="checkbox" class="lessoncheck" value="${x.id}" checked> Bài ${x.id} · ${esc(x.title)}</label>`).join('')}</div><div class="toolbar"><select id="reviewMode">${MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('')}</select><button class="primary" onclick="startReview()">Bắt đầu (tối đa 30 câu)</button></div></div>`}
function startReview(){let selected=[...document.querySelectorAll('.lessoncheck:checked')].map(x=>+x.value);let pool=L.filter(x=>selected.includes(x.id)).flatMap(x=>x.words);if(!pool.length)return alert('Hãy chọn ít nhất một bài');lesson=L.find(x=>x.id===selected[0]);startGame($('#reviewMode').value,pool)}
function showStats(){$('#app').innerHTML=`<h2>Thống kê học tập</h2><div class="grid"><div class="panel"><div class="stat">${known()}</div>Từ đã thuộc (theo lượt bài)</div><div class="panel"><div class="stat">${store.history.length}</div>Lượt luyện tập</div><div class="panel"><div class="stat">${store.history.reduce((a,b)=>a+b.correct,0)}/${store.history.reduce((a,b)=>a+b.total,0)}</div>Câu đúng / tổng câu</div></div><h3>Lịch sử gần đây</h3><div class="panel">${store.history.slice(0,30).map(h=>`<p>${new Date(h.date).toLocaleString('vi-VN')} · Bài ${h.lesson} · ${esc(h.mode)} · ${h.correct}/${h.total}</p>`).join('')||'Chưa có lượt luyện tập.'}</div><div class="toolbar"><button onclick="exportProgress()">Xuất tiến độ JSON</button><label class="panel">Nhập JSON <input type="file" accept="application/json" onchange="importProgress(this.files[0])"></label><button onclick="if(confirm('Xóa toàn bộ tiến độ trên thiết bị này?')){localStorage.removeItem(KEY);location.reload()}">Đặt lại tiến độ</button></div>`}
function exportProgress(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}));a.download='hsk2-progress.json';a.click();URL.revokeObjectURL(a.href)}async function importProgress(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!x||typeof x.known!=='object'||!Array.isArray(x.history))throw Error();if(confirm('Thay thế tiến độ hiện tại?')){store=x;save();showStats()}}catch{alert('File tiến độ không hợp lệ')}}
home();

</script><script>
/* Additional fully interactive practice modes. All questions are sourced from the workbook examples. */
const BASE_MODES=MODES.slice();
MODES.push(['cloze','Điền từ vào câu'],['translate','Dịch câu Việt → Trung'],['order','Sắp xếp câu'],['reading','Đọc hiểu câu ví dụ'],['speaking','Luyện nói'],['grammar','Thử thách ngữ pháp'],['mixed','Thử thách tổng hợp']);
const originalRenderGames=renderGames;
renderGames=function(){let html=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${esc(n)}</h3><p class="muted">${['reading','grammar','speaking'].includes(m)?'Luyện theo câu ví dụ và kiến thức có trong sổ tay':'Luyện tập tương tác'}</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<div class="toolbar"><label>Số câu <select id="numQuestions"><option>10</option><option>20</option><option selected>30</option><option>50</option></select></label></div><div class="grid">${html}</div><p class="muted">Các chế độ bổ sung khai thác câu ví dụ thực tế trong sổ tay. Chế độ “Đọc hiểu” hiện là đọc hiểu câu, chưa phải 5 bài đọc dài/bài. Số câu không vượt quá số câu hỏi khác nhau có thể tạo từ nguồn.</p>`};
function cleanHan(s){return (s||'').replace(/[\s，。！？,.!?、；：:;“”"']/g,'')}
function examples(pool){return pool.filter(w=>w.example&&w.translation&&cleanHan(w.example).length>=3)}
function getLimit(){return Number($('#numQuestions')?.value||30)}
const originalStartGame=startGame;
startGame=function(mode,custom){if(BASE_MODES.some(x=>x[0]===mode)) {let p=custom||lesson.words;let q=shuffle(p).slice(0,Math.min(getLimit(),p.length));session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderQuestion();return}let p=custom||lesson.words;let q=shuffle(examples(p));if(mode==='grammar'){let gram=(custom?L.filter(l=>l.words.some(w=>p.includes(w))):[lesson]).flatMap(l=>l.grammar.map((g,i)=>({id:`g${l.id}-${i}`,grammar:g,hanzi:g.name,example:(g.details.find(s=>s.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(s=>s.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),meaning:g.name}))).filter(x=>x.example);q=shuffle(gram)}
if(mode==='mixed')q=shuffle([...q.map((w,i)=>({...w,submode:['cloze','translate','order','reading'][i%4]})),...q.map(w=>({...w,submode:'speaking'}))]);
q=q.slice(0,Math.min(getLimit(),q.length));if(!q.length){alert('Không đủ nội dung hợp lệ trong tài liệu cho chế độ này.');return}session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderAdvanced()};
function renderAdvanced(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=w.submode||s.mode;let sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));let missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];let prompt='',control='';s.target=sentence;s.missing=missing;
if(m==='cloze'){prompt=sentence.replace(missing,'＿＿');control=`<input id="advInput" placeholder="Điền Hán tự" autocomplete="off">`}
if(m==='translate'){prompt=w.translation;control=`<textarea id="advInput" placeholder="Viết câu bằng tiếng Trung"></textarea>`}
if(m==='order'){prompt=w.translation;let units=sentence.match(/[\u3400-\u9fff]+|[^\u3400-\u9fff]/g)||tokens;s.tiles=shuffle(tokens.filter(c=>!/[。！？]/.test(c)));s.chosen=[];control=`<div id="selectedTiles" class="panel hanzi"></div><div id="tileBank" class="toolbar">${s.tiles.map((t,i)=>`<button id="tile${i}" class="hanzi" onclick="pickTile(${i})">${esc(t)}</button>`).join('')}</div><button onclick="session.chosen=[];renderAdvanced()">Xếp lại</button>`}
if(m==='reading'){prompt=sentence;control=`<p><strong>Câu này có nghĩa gì?</strong></p><textarea id="advInput" placeholder="Viết nghĩa tiếng Việt của câu"></textarea>`}
if(m==='speaking'){prompt=sentence;control=`<div class="toolbar"><button onclick="speak(session.questions[session.index].example)">🔊 Nghe mẫu</button></div><p id="recognized" class="muted">Nghe mẫu, tự đọc lại rồi gõ câu để đối chiếu.</p><input id="advInput" placeholder="Có thể gõ câu bạn đã nói">`}
if(m==='grammar'){prompt=w.grammar.name;control=`<p><strong>Nhớ lại công thức và viết câu ví dụ cho cấu trúc này.</strong></p><textarea id="advInput" placeholder="Viết một câu ví dụ"></textarea>`}
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${esc(MODES.find(x=>x[0]===m)?.[1]||m)}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${['cloze','speaking','reading'].includes(m)?'hanzi':''}">${esc(prompt)}</h2>${control}<div class="toolbar"><button class="primary" onclick="gradeAdvanced()">Kiểm tra / Đối chiếu</button></div><div id="feedback"></div></div>`}
function pickTile(i){let b=$('#tile'+i);if(b.disabled)return;session.chosen.push(session.tiles[i]);b.disabled=true;$('#selectedTiles').textContent=session.chosen.join('')}
function gradeAdvanced(){let s=session;if(s.answered)return;let w=s.questions[s.index],m=w.submode||s.mode,typed=m==='order'?s.chosen.join(''):($('#advInput')?.value||'').trim();if(!typed){alert('Hãy nhập câu trả lời trước.');return}let answer=m==='cloze'?s.missing:w.example;let ok=null;if(['cloze','translate','order','speaking'].includes(m))ok=cleanHan(typed)===cleanHan(answer);if(m==='reading'||m==='grammar')ok=null;s.answered=true;if(ok===true)s.correct++;if(ok===false)store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();let explanation=m==='grammar'?w.grammar.details.join(' · '):`${w.pinyin||''} · ${w.translation||''}`;$('#feedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu với đáp án mẫu':ok?'✓ Trùng đáp án mẫu':'Chưa trùng đáp án mẫu'}</strong><p class="hanzi">${esc(answer)}</p><p>${esc(explanation)}</p><p class="muted">${m==='translate'||m==='grammar'||m==='reading'?'Các cách diễn đạt tương đương có thể đúng; website không có AI chấm ngữ pháp/ngữ nghĩa.':''}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderAdvanced()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`}
function recordSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#recognized').textContent='Trình duyệt này không hỗ trợ nhận dạng giọng nói. Hãy thử Chrome hoặc Edge và cấp quyền micro.';return}let rec=new SR();rec.lang='zh-CN';rec.onresult=e=>{$('#advInput').value=e.results[0][0].transcript;$('#recognized').textContent='Nhận dạng: '+e.results[0][0].transcript};rec.onerror=e=>{$('#recognized').textContent='Không thể nhận dạng: '+e.error+'. Hãy kiểm tra quyền micro.'};rec.start()}
const oldFinish=finishGame;finishGame=function(){let s=session;if(BASE_MODES.some(x=>x[0]===s.mode))return oldFinish();store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length,autoGraded:!['reading','grammar','mixed'].includes(s.mode)});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập</h2><div class="stat">${s.index} câu đã làm</div><p>${s.correct} câu trùng đáp án mẫu. Các câu tự đối chiếu không được tính là sai.</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`};
const oldReview=showReview;showReview=function(){oldReview();let sel=$('#reviewMode');sel.innerHTML=MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');let btn=$('#app .primary');btn.textContent='Bắt đầu ôn tập';};

</script><script>
/* Additional practice, final exam, and answer review. No AI grading claims. */
const extraModes=[['paragraph','Viết đoạn văn có hướng dẫn'],['exam','Kiểm tra cuối khóa']];
MODES.push(...extraModes);
const previousRenderGames=renderGames;
renderGames=function(){previousRenderGames();const grid=$('#content .grid');grid.insertAdjacentHTML('beforeend',`<div class="card" onclick="startWriting()"><h3>✍️ Viết đoạn văn</h3><p class="muted">Luyện viết dựa trên câu ví dụ của bài; đối chiếu thủ công</p><button class="primary">Bắt đầu</button></div><div class="card" onclick="startFinalExam()"><h3>🏆 Kiểm tra cuối khóa</h3><p class="muted">100 câu: từ vựng, ngữ pháp và kỹ năng</p><button class="primary">Bắt đầu</button></div>`)};
function startWriting(){const words=lesson.words.filter(w=>w.example&&w.translation);if(!words.length)return alert('Chưa có câu ví dụ để luyện viết.');const selected=shuffle(words).slice(0,Math.min(30,words.length));session={mode:'paragraph',questions:selected,index:0,correct:0,answered:false};renderWriting()}
function renderWriting(){const s=session;if(s.index>=s.questions.length){finishWriting();return}const w=s.questions[s.index];$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Quay lại</button><div class="panel"><span class="pill">Luyện viết ${s.index+1}/${s.questions.length}</span><h2>Viết bằng tiếng Trung</h2><p>${esc(w.translation)}</p><p class="muted">Hãy tự viết câu này và có thể mở rộng thành một đoạn ngắn liên quan. Đây là bài tự luyện, không chấm ngữ pháp tự động.</p><textarea id="writingAnswer" rows="7" placeholder="Nhập chữ Hán...">${esc(s.draft||'')}</textarea><div class="toolbar"><button onclick="s.draft=$('#writingAnswer').value;localStorage.setItem('hsk-writing-draft',JSON.stringify({lesson:lesson.id,index:s.index,text:s.draft}));alert('Đã lưu bản nháp trên trình duyệt')">Lưu nháp</button><button class="primary" onclick="showWritingAnswer()">Xem đáp án mẫu</button></div><div id="writingFeedback"></div></div>`}
function showWritingAnswer(){const s=session,w=s.questions[s.index];s.draft=$('#writingAnswer').value;$('#writingFeedback').innerHTML=`<div class="result"><h3>Đáp án tham khảo</h3><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p class="muted">Hãy tự đối chiếu từ vựng, thứ tự từ và cấu trúc. Có thể có nhiều cách viết đúng.</p></div><button onclick="s.index++;s.draft='';renderWriting()" class="primary">${s.index+1===s.questions.length?'Hoàn thành':'Câu tiếp theo →'}</button>`}
function finishWriting(){store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:'paragraph',correct:0,total:session.questions.length,autoGraded:false});save();$('#app').innerHTML=`<div class="panel"><h2>Đã hoàn thành ${session.questions.length} bài tự luyện viết</h2><p>Không có điểm tự động vì câu trả lời cần người học đối chiếu.</p><button onclick="openLesson(${lesson.id},'games')">Quay lại bài</button></div>`}
const EXAM_PLAN=[['hanzi',20],['grammar',20],['reading',20],['listen',20],['translate',10],['mixed',10]];
function startFinalExam(){let pool=L.flatMap(l=>l.words);let questions=[];for(const [mode,count] of EXAM_PLAN){let items;if(mode==='grammar')items=L.flatMap(l=>l.grammar.map((g,i)=>({id:`gram-${l.id}-${i}`,grammar:g,example:(g.details.find(x=>x.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(x=>x.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),hanzi:g.name}))).filter(w=>w.example);else items=pool.filter(w=>w.example&&w.translation&&(mode!=='mixed'||w.example.includes(w.hanzi)));items=shuffle(items).slice(0,count);questions.push(...items.map(w=>({...w,examMode:mode==='mixed'?'cloze':mode})))}if(questions.length!==100){alert(`Ngân hàng chỉ đủ ${questions.length}/100 câu độc lập. Không tạo câu giả.`);return}lesson=L[0];session={mode:'final-exam',questions:shuffle(questions),index:0,correct:0,answered:false,graded:0,pool};renderExamQuestion()}
function renderExamQuestion(){const s=session;if(s.index>=s.questions.length){finishExam();return}const w=s.questions[s.index],m=w.examMode;s.answered=false;let q='',input='';if(m==='hanzi'||m==='listen'){s.options=shuffle([w,...shuffle(s.pool.filter(x=>x.id!==w.id&&x.meaning!==w.meaning)).slice(0,3)]);q=m==='hanzi'?w.hanzi:'Nghe và chọn nghĩa đúng';input=`${m==='listen'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Nghe</button>':''}<div class="grid">${s.options.map((o,i)=>`<button class="option" onclick="answerExam(${i})">${esc(o.meaning)}</button>`).join('')}</div>`}else if(m==='grammar'){q=w.grammar.name;input=`<p>Hãy viết câu ví dụ sử dụng cấu trúc này.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='reading'){q=w.example;input=`<p>Hãy dịch câu sang tiếng Việt.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='translate'){q=w.translation;input=`<p>Hãy dịch sang tiếng Trung.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else{q=w.example.replace(w.hanzi,'＿＿');s.missing=w.hanzi;input=`<p>Điền từ còn thiếu.</p><input id="examInput" placeholder="Nhập Hán tự"><button class="primary" onclick="answerExam()">Kiểm tra</button>`}$('#app').innerHTML=`<div class="panel"><div class="row"><span class="pill">Đề cuối khóa · ${esc(m)}</span><span class="spacer"></span>${s.index+1}/100</div><div class="progress"><div style="width:${s.index}%"></div></div><h2 class="hanzi">${esc(q)}</h2>${input}<div id="examFeedback"></div></div>`;if(m==='listen')speak(w.hanzi)}
function answerExam(choice){const s=session;if(s.answered)return;const w=s.questions[s.index],m=w.examMode;let ok=null;if(m==='hanzi'||m==='listen')ok=s.options[choice]?.id===w.id;else{const val=$('#examInput').value.trim();if(!val)return alert('Hãy nhập câu trả lời trước.');if(m==='cloze')ok=cleanHan(val)===cleanHan(s.missing);else if(m==='translate')ok=cleanHan(val)===cleanHan(w.example)}s.answered=true;if(ok!==null){s.graded++;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1}save();$('#examFeedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu':ok?'✓ Đúng':'Chưa đúng theo đáp án mẫu'}</strong><p class="hanzi">${esc(w.example||w.hanzi)}</p><p>${esc(w.translation||'')}</p>${m==='grammar'?`<p>${esc(w.grammar.details.join(' · '))}</p>`:''}<p class="muted">Các câu tự luận không được chấm ngữ nghĩa tự động.</p></div><button class="primary" onclick="session.index++;renderExamQuestion()">${s.index===99?'Xem kết quả':'Tiếp tục →'}</button>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true)}
function finishExam(){const s=session;store.history.unshift({date:new Date().toISOString(),lesson:'1–15',mode:'final-exam',correct:s.correct,total:s.graded,autoGraded:false});save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành 100 câu cuối khóa</h2><div class="stat">${s.correct}/${s.graded}</div><p>Điểm trên chỉ tính ${s.graded} câu có thể chấm tự động. ${100-s.graded} câu tự luận cần tự đối chiếu.</p><button onclick="home();if(typeof topicExit==='function')topicExit()">Trang chủ</button><button onclick="topicHome()">29 chủ đề</button><button onclick="topicToMain('stats')">Thống kê</button></div>`}

</script><script></script><script></script>
<style>
