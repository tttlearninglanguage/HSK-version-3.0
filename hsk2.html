<script>
/* Cập nhật các chế độ, giữ nguyên dữ liệu và lưu tiến độ của bản cũ. */
(function(){
const oldGames=renderGames;
renderGames=function(){oldGames();const root=document.querySelector('#content');if(!root)return;
root.querySelectorAll('.card').forEach(card=>{const action=card.getAttribute('onclick')||card.querySelector('button')?.getAttribute('onclick')||'';if(/startFinalExam|startWriting\(|startWritingPrompts/.test(action)||/kiểm tra cuối khóa|30 đề luyện viết|^✍️ Viết đoạn văn$|100 câu:/i.test(card.textContent))card.remove()});
const grid=root.querySelector('.grid');if(grid)grid.insertAdjacentHTML('beforeend',`<div class="card" onclick="startGuidedWriting()"><h3>✍️ Viết đoạn văn có hướng dẫn</h3><p class="muted">Một chủ đề mỗi bài · gợi ý từ vựng bài hiện tại và các bài trước · tự viết và lưu nháp</p><button class="primary">Bắt đầu</button></div>`);
};
const oldRenderAdvanced=renderAdvanced;
renderAdvanced=function(){let s=session,w=s?.questions?.[s.index],m=w?.submode||s?.mode;
if(m==='grammar'){renderGrammarChallenge();return}
if(m!=='cloze'){oldRenderAdvanced();return}
if(s.index>=s.questions.length){finishGame();return}
const sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));const missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];s.missing=missing;s.target=sentence;
const eligible=lesson.words.filter(x=>x.hanzi!==missing&&x.hanzi&&x.hanzi!==w.hanzi);const extras=L.filter(x=>x.id<=lesson.id).flatMap(x=>x.words).filter(x=>x.hanzi!==missing);
const opts=[missing,...shuffle([...eligible,...extras]).map(x=>x.hanzi).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3)];
while(opts.length<4){const fallback=['我','你','是','有','不','在','的','了','吗','很'];const next=fallback.find(x=>!opts.includes(x));if(!next)break;opts.push(next)}s.clozeOptions=shuffle(opts);
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">Điền từ vào câu · Bài ${lesson.id}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><div class="answer-area"><p class="muted">Chọn một trong 4 đáp án để hoàn thành câu:</p><h2 class="hanzi" style="font-size:34px;line-height:1.9">${esc(sentence.replace(missing,'＿＿＿'))}</h2><div class="cloze-options">${s.clozeOptions.map((o,i)=>`<button onclick="answerCloze(${i})">${esc(o)}</button>`).join('')}</div></div><div id="feedback"></div></div>`;
};
window.answerCloze=function(i){let s=session;if(s.answered)return;const chosen=s.clozeOptions[i];s.answered=true;const ok=chosen===s.missing;if(ok)s.correct++;else store.wrong[s.questions[s.index].id]=(store.wrong[s.questions[s.index].id]||0)+1;save();document.querySelectorAll('.cloze-options button').forEach((b,j)=>{b.disabled=true;if(s.clozeOptions[j]===s.missing)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});let w=s.questions[s.index];$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác!':'✗ Chưa chính xác'}</strong><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation||'')}</p><p>Đáp án: <b class="hanzi">${esc(s.missing)}</b></p></div><button class="primary" onclick="session.index++;session.answered=false;renderAdvanced()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`};
const oldStart=startGame;
startGame=function(mode,custom){if(mode!=='grammar')return oldStart(mode,custom);
const g=lesson.grammar.filter(x=>x.details?.some(y=>y.startsWith('Ví dụ:')));
const qs=[];
for(const gram of g){let ex=(gram.details.find(x=>x.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,'').replace(/\s*[（(][^()（）]*[)）]/g,'').trim();if(!ex)continue;
let formula=(gram.details.find(x=>x.startsWith('Công thức:'))||'').replace(/^Công thức:\s*/,'');
let preferred=['正在','因为','所以','还是','或者','已经','可以','没有','什么','怎么','多少','几','了','吗','呢','的','是','在','有','不','也','都','很','比','会','能','要','和'];
let target=preferred.find(x=>ex.includes(x)&&((gram.name+' '+formula).includes(x)))||preferred.find(x=>ex.includes(x));
if(!target){const hits=lesson.words.filter(w=>ex.includes(w.hanzi));target=hits[0]?.hanzi}
if(!target)continue;
qs.push({id:'grammar-'+lesson.id+'-'+qs.length,grammar:gram,example:ex,translation:(gram.details.find(x=>x.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),target,formula});
}
if(!qs.length){alert('Bài này chưa có ví dụ ngữ pháp đủ rõ để tạo câu hỏi trắc nghiệm. Hãy xem phần Ngữ pháp của bài.');return}
const amount=Math.min(getLimit(),qs.length);let bank=[];for(let i=0;i<amount;i++)bank.push({...qs[i%qs.length],variant:i});
session={mode:'grammar',questions:shuffle(bank),index:0,correct:0,answered:false,pool:lesson.words};renderGrammarChallenge();
};
function renderGrammarChallenge(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],target=w.target;
const current=L.filter(l=>l.id<=lesson.id).flatMap(l=>l.words).map(v=>v.hanzi);
const distractors=['的','了','吗','呢','是','有','在','不','很','也','都','和','会','能','要','比','几','什么','怎么','多少','正在','没有',...current].filter((x,i,a)=>x!==target&&a.indexOf(x)===i);
s.grammarOptions=shuffle([target,...shuffle(distractors).slice(0,3)]);
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><span class="pill">Thử thách ngữ pháp · Bài ${lesson.id}</span><span class="pill">${s.index+1}/${s.questions.length}</span><div class="answer-area"><h3>${esc(w.grammar.name)}</h3><p class="muted">${esc(w.formula)}</p><p>Chọn từ thích hợp để hoàn thành câu:</p><h2 class="hanzi" style="font-size:34px">${esc(w.example.replace(target,'＿＿＿'))}</h2><div class="cloze-options">${s.grammarOptions.map((x,i)=>`<button onclick="answerGrammar(${i})">${esc(x)}</button>`).join('')}</div></div><div id="feedback"></div></div>`;
}
window.answerGrammar=function(i){let s=session;if(s.answered)return;let w=s.questions[s.index],ok=s.grammarOptions[i]===w.target;s.answered=true;if(ok)s.correct++;save();document.querySelectorAll('.cloze-options button').forEach((b,j)=>{b.disabled=true;if(s.grammarOptions[j]===w.target)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác':'✗ Chưa đúng'}</strong><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p>${esc(w.grammar.details.join(' · '))}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderGrammarChallenge()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`};
window.startGuidedWriting=function(){session={mode:'guided-writing'};renderGuidedWriting()};
window.renderGuidedWriting=function(){const current=lesson.words,prior=L.filter(l=>l.id<lesson.id).flatMap(l=>l.words);const selected=current.filter(w=>w.example).slice(0,8),priorSelected=prior.filter(w=>w.example).slice(-8);
const title=lesson.subtitle||lesson.title;const key='hsk2-guided-v2-'+lesson.id;const draft=localStorage.getItem(key)||'';
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Quay lại trò chơi</button><div class="panel"><span class="pill">Bài ${lesson.id} · Luyện viết có hướng dẫn</span><h2>✍️ Chủ đề: ${esc(title)}</h2><p>Viết một đoạn tiếng Trung khoảng 3–6 câu theo chủ đề bài học. Ưu tiên dùng từ vựng mới của bài ${lesson.id}; có thể sử dụng các từ và cấu trúc đã học ở bài 1–${lesson.id}.</p><div class="answer-area"><h3>1. Từ vựng của bài này</h3><div class="guided-words">${selected.map(w=>`<span>${esc(w.hanzi)} · ${esc(w.meaning)}</span>`).join('')}</div><h3>2. Từ vựng ôn tập từ các bài trước</h3><div class="guided-words">${priorSelected.length?priorSelected.map(w=>`<span>${esc(w.hanzi)} · ${esc(w.meaning)}</span>`).join(''):'<p>Bài đầu tiên: chưa có từ vựng của bài trước.</p>'}</div><h3>3. Gợi ý triển khai nội dung</h3><p>• Câu 1: Giới thiệu người, vật hoặc tình huống liên quan đến chủ đề.<br>• Câu 2–3: Bổ sung thông tin, hành động hoặc sở thích bằng từ mới.<br>• Câu 4–5: Đặt câu hỏi, nêu nhận xét hoặc kết thúc câu chuyện.<br>• Kiểm tra trật tự từ và các cấu trúc ngữ pháp đã học.</p><h3>4. Viết đoạn văn của bạn</h3><textarea id="guidedText" placeholder="在这里写你的中文段落……">${esc(draft)}</textarea><div class="toolbar"><button class="primary" onclick="saveGuidedWriting()">💾 Lưu bài viết</button><button onclick="showGuidedHints()">💡 Xem câu ví dụ và ngữ pháp</button><button onclick="speak(document.querySelector('#guidedText').value)">🔊 Nghe bài viết</button></div><div id="guidedHints"></div><p class="muted">Bài viết mở, không chấm ngữ nghĩa/phát âm tự động. Nội dung gợi ý được lấy từ từ vựng và ví dụ của bài học.</p></div></div>`;
};
window.saveGuidedWriting=function(){localStorage.setItem('hsk2-guided-v2-'+lesson.id,$('#guidedText').value);alert('Đã lưu bài viết trên trình duyệt này.')};
window.showGuidedHints=function(){const grammar=lesson.grammar.filter(g=>g.details?.some(d=>d.startsWith('Ví dụ:')));$('#guidedHints').innerHTML=`<div class="result"><h3>Ví dụ tham khảo</h3>${lesson.words.filter(w=>w.example).slice(0,5).map(w=>`<p class="hanzi" style="font-size:24px">${esc(w.example)}</p><p>${esc(w.translation)}</p>`).join('')}<h3>Ngữ pháp bài ${lesson.id}</h3>${grammar.map(g=>`<p><b>${esc(g.name)}</b>: ${esc(g.details.join(' · '))}</p>`).join('')||'<p>Bài này không liệt kê mục ngữ pháp riêng trong tài liệu.</p>'}</div>`};
/* Trình duyệt bắt buộc tự quản lý quyền micro; không có cách bỏ qua yêu cầu này. */
const oldRecord=recordSpeech;
recordSpeech=function(){const note=$('#recognized');if(note)note.textContent='Nếu đây là lần đầu, trình duyệt có thể yêu cầu cấp quyền micro. Bạn có thể chọn “Cho phép” và ghi nhớ quyền cho website. Không thể bỏ qua bước bảo mật này.';oldRecord()};
/* Nút quay lại thống nhất, cả các màn hình chưa có nút riêng. */
const back=document.createElement('button');back.id='hskBack';back.textContent='← Quay lại';back.onclick=()=>{if(session&&lesson){openLesson(lesson.id,'games')}else if(lesson){home()}else home()};document.body.appendChild(back);
const syncBack=()=>{back.style.display=(!lesson&&!session)?'none':'block'};
new MutationObserver(syncBack).observe($('#app'),{childList:true,subtree:false});syncBack();
})();
</script>

<script>
(function(){
'use strict';
const palette=['#ba4d39','#b66b20','#9a7b16','#6d8d25','#2f8753','#238578','#187c9c','#346eaf','#4d63b9','#7355b3','#9053a8','#b24d88','#ba536c','#ae5849','#537c33'];
const soft=['#fff1ed','#fff3e8','#fff9e8','#f4f8e7','#eaf7ee','#e9f8f4','#e9f6fa','#edf5ff','#eef1ff','#f3efff','#f8efff','#fff0f7','#fff0f3','#fff3ef','#f0f7e9'];
function theme(id){let i=Math.max(0,Math.min(14,(id||0)-1));document.documentElement.style.setProperty('--accent',id?palette[i]:'#168b70');document.documentElement.style.setProperty('--soft',id?soft[i]:'#eaf8f1');document.documentElement.style.setProperty('--accent-border',id?`color-mix(in srgb, ${palette[i]} 34%, white)`:'#e4e8ee');document.documentElement.style.setProperty('--flash-bg',id?soft[i]:'#ffffff')}
const nativeHome=home;
home=function(){nativeHome();theme(0);const app=document.querySelector('#app');const grid=app.querySelector('.hero~.grid:last-child');if(!grid)return;grid.className='unit-grid';grid.innerHTML=L.map((u,i)=>{let n=u.words.filter(w=>store.known[w.id]).length,pr=Math.round(100*n/Math.max(1,u.words.length));let grammar=u.grammar.filter(g=>g.details?.some(d=>d.startsWith('Ví dụ:'))).length;return `<button type="button" class="unit-card" style="--local:${palette[i]};--local-soft:${soft[i]}" onclick="openLesson(${u.id})"><span class="unit-number">UNIT ${String(u.id).padStart(2,'0')}</span><h3 class="hanzi">${esc(u.title)}</h3><div class="unit-info">${esc(u.subtitle)}</div><div class="unit-info">${u.words.length} từ vựng${grammar?' · '+grammar+' điểm ngữ pháp':''}</div><div class="progress" aria-label="Đã thuộc ${pr}%"><div style="width:${pr}%;background:${palette[i]}"></div></div><span class="unit-bottom">Khám phá bài học →</span></button>`}).join('')};
const nativeLesson=renderLesson;
renderLesson=function(){nativeLesson();theme(lesson.id);
const root=document.getElementById('app');
const heading=[...root.children].find(el=>el.tagName==='H2');
const subtitle=heading?.nextElementSibling;
if(heading){
 const banner=document.createElement('section');banner.className='unit-title-banner';
 const titleBlock=document.createElement('div');titleBlock.className='unit-title-copy';
 const eyebrow=document.createElement('span');eyebrow.className='unit-title-eyebrow';eyebrow.textContent='HSK 2 · BÀI '+String(lesson.id).padStart(2,'0');
 titleBlock.appendChild(eyebrow);titleBlock.appendChild(heading);
 if(subtitle?.classList.contains('muted'))titleBlock.appendChild(subtitle);
 banner.appendChild(titleBlock);root.insertBefore(banner,root.children[1]||null);
}
if(false){const btn=[...document.querySelectorAll('.tabs button')].find(x=>x.textContent.trim()==='Ngữ pháp');btn?.remove()}document.querySelectorAll('.unit-theme-tag').forEach(e=>e.remove());};
const groupModes=[['Từ vựng & ghi nhớ',[['hanzi','Hán tự → Nghĩa','🀄','Nhìn chữ Hán, nghe phát âm và chọn nghĩa'],['meaning','Nghĩa → Hán tự','🧠','Chọn chữ Hán đúng theo nghĩa tiếng Việt'],['pinyin','Chọn Pinyin','🔤','Nhận diện cách đọc của từ']]],['Nghe & viết',[['listen','Nghe chọn Hán tự','🎧','Nghe từ và chọn chữ Hán'],['type','Gõ Hán tự','⌨️','Gõ chữ Hán theo nghĩa và nghe gợi ý'],['dictation','Nghe chép chính tả','✍️','Nghe và gõ lại từ']]],['Câu & ngữ pháp',[['cloze','Điền từ vào câu','🧩','Chọn một trong bốn đáp án'],['translate','Dịch câu','📝','Dịch câu sang tiếng Trung'],['order','Sắp xếp câu','🔀','Sắp xếp chữ thành câu'],['reading','Đọc hiểu câu','📖','Đọc câu và đối chiếu nghĩa'],['speaking','Luyện nói','🎙️','Nghe và luyện nói theo câu mẫu'],['grammar','Thử thách ngữ pháp','📐','Luyện cấu trúc ngữ pháp của Unit']]]];
renderGames=function(){theme(lesson.id);const root=document.querySelector('#content');const groups=groupModes.map(([title,items])=>{const available=items.filter(([m])=>m!=='grammar'||(lesson.grammar.some(g=>g.details?.some(d=>d.startsWith('Ví dụ:')))));if(!available.length)return '';return `<section><h3 class="game-group-title">${title}</h3><div class="grid">${available.map(([m,name,emoji,desc])=>`<button type="button" class="game-card" onclick="${m==='passages'?'startPassages()':`startGame('${m}')`}"><span class="game-icon">${emoji}</span><span><h3>${name}</h3><p>${desc}</p></span></button>`).join('')}</div></section>`}).join('');root.innerHTML=`<div class="toolbar"><label for="numQuestions">Số câu mỗi lượt: <select id="numQuestions"><option>10</option><option>20</option><option selected>30</option><option>50</option></select></label></div><div class="game-groups">${groups}</div>`};
// Browser speech voices vary by installed operating-system voices; choose a clear Chinese voice when available.
let selectedVoice='';
function chineseVoices(){return (speechSynthesis.getVoices()||[]).filter(v=>/^zh(-|_)/i.test(v.lang))}
function pickVoice(){let v=chineseVoices();return v.find(x=>x.voiceURI===selectedVoice)||v.find(x=>/xiaoxiao|xiaoyi|huihui|tingting|meijia|mandarin|natural|google.*chinese/i.test(x.name))||v.find(x=>/zh-CN/i.test(x.lang))||v[0]||null}

window.filterCourseUnits=function(query){

    card.hidden=!ok;
    if(ok)visible++;
  });
  const empty=document.querySelector('#courseEmpty');
  if(empty)empty.hidden=visible!==0;

", "id": "H2-T09-09"}, {"hanzi": "才", "pinyin": "cái", "meaning": "Chỉ, mãi mới", "example": "我等了很久，他才到。", "examplePinyin": "wǒ děng le hěn jiǔ ， tā cái dào 。", "translation": "Tôi đã đợi rất lâu anh ấy mới đến.", "id": "H2-T09-10"}, {"hanzi": "靠", "pinyin": "kào", "meaning": "Dựa vào", "example": "请坐靠窗的那个座位。", "examplePinyin": "qǐng zuò kào chuāng de nà ge zuò wèi 。", "translation": "Hãy ngồi ghế gần cửa sổ kia.", "id": "H2-T09-11"}, {"hanzi": "啊", "pinyin": "a", "meaning": "A, à", "example": "今天的天气真好啊！", "examplePinyin": "jīn tiān de tiān qì zhēn hǎo a ！", "translation": "Thời tiết hôm nay đẹp thật đấy!", "id": "H2-T09-12"}, {"hanzi": "成", "pinyin": "chéng", "meaning": "Trở thành", "example": "请把这句话翻译成中文。", "examplePinyin": "qǐng bǎ zhè jù huà fān yì chéng zhōng wén 。", "translation": "Hãy dịch câu này sang tiếng Trung.", "id": "H2-T09-13"}, {"hanzi": "更", "pinyin": "gèng", "meaning": "Hơn", "example": "我觉得这件比那件更好看。", "examplePinyin": "wǒ jué de zhè jiàn bǐ nà jiàn gèng hǎo kàn 。", "translation": "Tôi thấy chiếc này đẹp hơn chiếc kia nữa.", "id": "H2-T09-14"}, {"hanzi": "其中", "pinyin": "qízhōng", "meaning": "Trong số đó", "example": "这些学生中，其中三个来自越南。", "examplePinyin": "zhè xiē xué shēng zhōng ， qí zhōng sān gè lái zì yuè nán 。", "translation": "Trong số học sinh này có ba bạn đến từ Việt Nam.", "id": "H2-T09-15"}, {"hanzi": "不要", "pinyin": "búyào", "meaning": "Đừng, không muốn", "example": "不要在图书馆里打电话。", "examplePinyin": "bú yào zài tú shū guǎn lǐ dǎ diàn huà 。", "translation": "Đừng gọi điện trong thư viện.", "id": "H2-T09-16"}, {"hanzi": "快要", "pinyin": "kuàiyào", "meaning": "Sắp", "example": "电影快要结束了。", "examplePinyin": "diàn yǐng kuài yào jié shù le 。", "translation": "Bộ phim sắp kết thúc rồi.", "id": "H2-T09-17"}, {"hanzi": "一定", "pinyin": "yídìng", "meaning": "Nhất định", "example": "你一定要记得带书。", "examplePinyin": "nǐ yí dìng yào jì de dài shū 。", "translation": "Bạn nhất định phải nhớ mang sách.", "id": "H2-T09-18"}, {"hanzi": "离", "pinyin": "lí", "meaning": "Cách, từ", "example": "学校离我家只有十分钟的路。", "examplePinyin": "xué xiào lí wǒ jiā zhǐ yǒu shí fēn zhōng de lù 。", "translation": "Trường chỉ cách nhà tôi mười phút đi đường.", "id": "H2-T09-19"}, {"hanzi": "正是", "pinyin": "zhèngshì", "meaning": "Chính là", "example": "现在正是吃午饭的时候。", "examplePinyin": "xiàn zài zhèng shì chī wǔ fàn de shí hòu 。", "translation": "Bây giờ đúng là lúc ăn trưa.", "id": "H2-T09-20"}, {"hanzi": "又", "pinyin": "yòu", "meaning": "Lại, lần nữa", "example": "他昨天来了，今天又来了。", "examplePinyin": "tā zuó tiān lái le ， jīn tiān yòu lái le 。", "translation": "Hôm qua anh ấy đã đến, hôm nay lại đến.", "id": "H2-T09-21"}, {"hanzi": "不一定", "pinyin": "bù yídìng", "meaning": "Không nhất thiết", "example": "贵的东西不一定好。", "examplePinyin": "guì de dōng xī bù yí dìng hǎo 。", "translation": "Đồ đắt chưa chắc đã tốt.", "id": "H2-T09-22"}, {"hanzi": "不如", "pinyin": "bùrú", "meaning": "Không bằng", "example": "这里太远，走路不如坐车方便。", "examplePinyin": "zhè lǐ tài yuǎn ， zǒu lù bù rú zuò chē fāng biàn 。", "translation": "Chỗ này xa quá, đi bộ không tiện bằng đi xe.", "id": "H2-T09-23"}, {"hanzi": "为", "pinyin": "wèi", "meaning": "Vì, cho", "example": "谢谢你为我准备生日礼物。", "examplePinyin": "xiè xiè nǐ wèi wǒ zhǔn bèi shēng rì lǐ wù 。", "translation": "Cảm ơn bạn đã chuẩn bị quà sinh nhật cho tôi.", "id": "H2-T09-24"}, {"hanzi": "经过", "pinyin": "jīngguò", "meaning": "Đi qua, trải qua", "example": "我每天上学都经过这家店。", "examplePinyin": "wǒ měi tiān shàng xué dōu jīng guò zhè jiā diàn 。", "translation": "Mỗi ngày đi học tôi đều đi qua cửa hàng này.", "id": "H2-T09-25"}, {"hanzi": "不行", "pinyin": "bùxíng", "meaning": "Không được", "example": "今天不行，我还要上班。", "examplePinyin": "jīn tiān bù xíng ， wǒ hái yào shàng bān 。", "translation": "Hôm nay không được, tôi còn phải đi làm.", "id": "H2-T09-26"}, {"hanzi": "完", "pinyin": "wán", "meaning": "Hoàn thành", "example": "作业写完了，我才去睡觉。", "examplePinyin": "zuò yè xiě wán le ， wǒ cái qù shuì jiào 。", "translation": "Viết xong bài tập tôi mới đi ngủ.", "id": "H2-T09-27"}, {"hanzi": "什么样", "pinyin": "shénmeyàng", "meaning": "Loại gì", "example": "你想找什么样的工作？", "examplePinyin": "nǐ xiǎng zhǎo shén me yàng de gōng zuò ？", "translation": "Bạn muốn tìm công việc như thế nào?", "id": "H2-T09-28"}, {"hanzi": "怎么样", "pinyin": "zěnmeyàng", "meaning": "Thế nào", "example": "这家饭馆的菜怎么样？", "examplePinyin": "zhè jiā fàn guǎn de cài zěn me yàng ？", "translation": "Món ăn ở quán này thế nào?", "id": "H2-T09-29"}, {"hanzi": "为什么", "pinyin": "wèishénme", "meaning": "Tại sao", "example": "你为什么不和我们一起去？", "examplePinyin": "nǐ wèi shén me bù hé wǒ men yì qǐ qù ？", "translation": "Vì sao bạn không đi cùng chúng tôi?", "id": "H2-T09-30"}, {"hanzi": "怎样", "pinyin": "zěnyàng", "meaning": "Như thế nào", "example": "你知道怎样去火车站吗？", "examplePinyin": "nǐ zhī dào zěn yàng qù huǒ chē zhàn ma ？", "translation": "Bạn biết đi đến ga tàu thế nào không?", "id": "H2-T09-31"}, {"hanzi": "只要", "pinyin": "zhǐyào", "meaning": "Chỉ cần, miễn là", "example": "只要你有时间，就可以来我家。", "examplePinyin": "zhǐ yào nǐ yǒu shí jiān ， jiù kě yǐ lái wǒ jiā 。", "translation": "Chỉ cần bạn có thời gian là có thể đến nhà tôi.", "id": "H2-T09-32"}]}, {"id": 10, "name": "Từ Nối", "words": [{"hanzi": "然后", "pinyin": "ránhòu", "meaning": "Sau đó", "example": "我们先吃饭，然后去买书。", "examplePinyin": "wǒ men xiān chī fàn ， rán hòu qù mǎi shū 。", "translation": "Chúng tôi ăn cơm trước, sau đó đi mua sách.", "id": "H2-T10-01"}, {"hanzi": "虽然", "pinyin": "suīrán", "meaning": "Mặc dù", "example": "虽然今天很累，我还是去运动了。", "examplePinyin": "suī rán jīn tiān hěn lèi ， wǒ hái shì qù yùn dòng le 。", "translation": "Tuy hôm nay mệt, tôi vẫn đã đi vận động.", "id": "H2-T10-02"}, {"hanzi": "原来", "pinyin": "yuánlái", "meaning": "Ban đầu, hóa ra", "example": "原来你也住在这条街上！", "examplePinyin": "yuán lái nǐ yě zhù zài zhè tiáo jiē shàng ！", "translation": "Hóa ra bạn cũng sống trên con phố này!", "id": "H2-T10-03"}, {"hanzi": "后来", "pinyin": "hòulái", "meaning": "Sau này", "example": "他先在北京工作，后来去了上海。", "examplePinyin": "tā xiān zài běi jīng gōng zuò ， hòu lái qù le shàng hǎi 。", "translation": "Ban đầu anh ấy làm ở Bắc Kinh, sau đó đến Thượng Hải.", "id": "H2-T10-04"}, {"hanzi": "不但", "pinyin": "bùdàn", "meaning": "Không chỉ", "example": "她不但会说中文，还会写汉字。", "examplePinyin": "tā bù dàn huì shuō zhōng wén ， hái huì xiě hàn zì 。", "translation": "Cô ấy không chỉ nói được tiếng Trung mà còn viết được chữ Hán.", "id": "H2-T10-05"}, {"hanzi": "所以", "pinyin": "suǒyǐ", "meaning": "Vì vậy", "example": "我没带伞，所以想等雨停了再走。", "examplePinyin": "wǒ méi dài sǎn ， suǒ yǐ xiǎng děng yǔ tíng le zài zǒu 。", "translation": "Tôi không mang ô nên muốn đợi mưa tạnh rồi đi.", "id": "H2-T10-06"}, {"hanzi": "接下来", "pinyin": "jiēxiàlái", "meaning": "Tiếp theo", "example": "接下来，请大家打开课本。", "examplePinyin": "jiē xià lái ， qǐng dà jiā dǎ kāi kè běn 。", "translation": "Tiếp theo mọi người hãy mở sách giáo khoa.", "id": "H2-T10-07"}, {"hanzi": "接着", "pinyin": "jiēzhe", "meaning": "Tiếp tục, sau đó", "example": "他喝了一口水，接着讲故事。", "examplePinyin": "tā hē le yī kǒu shuǐ ， jiē zhe jiǎng gù shì 。", "translation": "Anh ấy uống một ngụm nước rồi tiếp tục kể chuyện.", "id": "H2-T10-08"}, {"hanzi": "如果", "pinyin": "rúguǒ", "meaning": "Nếu", "example": "如果明天不下雨，我们就去爬山。", "examplePinyin": "rú guǒ míng tiān bù xià yǔ ， wǒ men jiù qù pá shān 。", "translation": "Nếu ngày mai không mưa, chúng ta sẽ đi leo núi.", "id": "H2-T10-09"}, {"hanzi": "那", "pinyin": "nà", "meaning": "Vậy thì, thế thì", "example": "你不想坐车，那我们走回去吧。", "examplePinyin": "nǐ bù xiǎng zuò chē ， nà wǒ men zǒu huí qù ba 。", "translation": "Bạn không muốn đi xe, vậy chúng ta đi bộ về nhé.", "id": "H2-T10-10"}, {"hanzi": "不过", "pinyin": "búguò", "meaning": "Nhưng, tuy nhiên", "example": "这件衣服很好看，不过有点儿贵。", "examplePinyin": "zhè jiàn yī fú hěn hǎo kàn ， bù guò yǒu diǎn ér guì 。", "translation": "Bộ quần áo này đẹp, có điều hơi đắt.", "id": "H2-T10-11"}, {"hanzi": "可是", "pinyin": "kěshì", "meaning": "Nhưng", "example": "我想早睡，可是作业还没做完。", "examplePinyin": "wǒ xiǎng zǎo shuì ， kě shì z ": "Hãy viết tên bạn bằng tiếng Trung hoặc tiếng Anh.", "id": "H2-T10-20"}, {"hanzi": "例如", "pinyin": "lìrú", "meaning": "Ví dụ", "example": "很多水果都很好吃，例如苹果和香蕉。", "examplePinyin": "hěn duō shuǐ guǒ dōu hěn hǎo chī ， lì rú píng guǒ hé xiāng jiāo 。", "translation": "Nhiều loại quả rất ngon, chẳng hạn táo và chuối.", "id": "H2-T10-21"}]}, {"id": 11, "name": "Phó Từ", "words": [{"hanzi": "全体", "pinyin": "quántǐ", "meaning": "Toàn thể", "example": "全体同学都参加了今天的活动。", "examplePinyin": "quán tǐ tóng xué dōu cān jiā le jīn tiān de huó dòng 。", "translation": "Toàn thể học sinh đều tham gia hoạt động hôm nay.", "id": "H2-T11-01"}, {"hanzi": "多么", "pinyin": "duōme", "meaning": "Biết bao, đến mức nào", "example": "你看，这些小猫多么可爱！", "examplePinyin": "nǐ kàn ， zhè xiē xiǎo māo duō me kě ài ！", "translation": "Bạn nhìn xem, những chú mèo này đáng yêu biết bao!", "id": "H2-T11-02"}, {"hanzi": "老是", "pinyin": "lǎoshì", "meaning": "Luôn luôn", "example": "他老是忘记带钥匙。", "examplePinyin": "tā lǎo shì wàng jì dài yào shi 。", "translation": "Anh ấy hay quên mang chìa khóa.", "id": "H2-T11-03"}, {"hanzi": "十分", "pinyin": "shífēn", "meaning": "Rất", "example": "我十分感谢老师的帮助。", "examplePinyin": "wǒ shí fēn gǎn xiè lǎo shī de bāng zhù 。", "translation": "Tôi vô cùng cảm ơn sự giúp đỡ của thầy.", "id": "H2-T11-04"}, {"hanzi": "多", "pinyin": "duō", "meaning": "Bao nhiêu, nhiều", "example": "这里的人多，走路要小心。", "examplePinyin": "zhè lǐ de rén duō ， zǒu lù yào xiǎo xīn 。", "translation": "Ở đây đông người, đi bộ cần cẩn thận.", "id": "H2-T11-05"}, {"hanzi": "好", "pinyin": "hǎo", "meaning": "Rất", "example": "今天好冷，我们喝点热水吧。", "examplePinyin": "jīn tiān hǎo lěng ， wǒ men hē diǎn rè shuǐ ba 。", "translation": "Hôm nay lạnh quá, chúng ta uống chút nước nóng nhé.", "id": "H2-T11-06"}, {"hanzi": "身边", "pinyin": "shēnbiān", "meaning": "Bên cạnh", "example": "妈妈坐在我身边看书。", "examplePinyin": "mā mā zuò zài wǒ shēn biān kàn shū 。", "translation": "Mẹ ngồi bên cạnh tôi đọc sách.", "id": "H2-T11-07"}, {"hanzi": "平时", "pinyin": "píngshí", "meaning": "Thường ngày", "example": "你平时几点下班？", "examplePinyin": "nǐ píng shí jǐ diǎn xià bān ？", "translation": "Bình thường bạn tan làm lúc mấy giờ?", "id": "H2-T11-08"}, {"hanzi": "全", "pinyin": "quán", "meaning": "Toàn bộ", "example": "这些书我全看过了。", "examplePinyin": "zhè xiē shū wǒ quán kàn guò le 。", "translation": "Những quyển sách này tôi đã đọc hết rồi.", "id": "H2-T11-09"}, {"hanzi": "那样", "pinyin": "nàyàng", "meaning": "Như thế", "example": "你那样说，妹妹会难过的。", "examplePinyin": "nǐ nà yàng shuō ， mèi mèi huì nán guò de 。", "translation": "Bạn nói như vậy em gái sẽ buồn đấy.", "id": "H2-T11-10"}, {"hanzi": "一直", "pinyin": "yìzhí", "meaning": "Liên tục, suốt", "example": "我们一直走到河边才休息。", "examplePinyin": "wǒ men yì zhí zǒu dào hé biān cái xiū xī 。", "translation": "Chúng tôi đi mãi tới bờ sông mới nghỉ.", "id": "H2-T11-11"}, {"hanzi": "一般", "pinyin": "yìbān", "meaning": "Thông thường", "example": "我一般坐地铁去公司。", "examplePinyin": "wǒ yì bān zuò dì tiě qù gōng sī 。", "translation": "Tôi thường đi tàu điện ngầm đến công ty.", "id": "H2-T11-12"}, {"hanzi": "可能", "pinyin": "kěnéng", "meaning": "Có thể", "example": "下午可能下雨，你带上伞吧。", "examplePinyin": "xià wǔ kě néng xià yǔ ， nǐ dài shàng sǎn ba 。", "translation": "Chiều có thể mưa, bạn mang ô nhé.", "id": "H2-T11-13"}, {"hanzi": "大大", "pinyin": "dàdà", "meaning": "Rất nhiều, đáng kể", "example": "多练习能大大提高你的水平。", "examplePinyin": "duō liàn xí néng dà dà tí gāo nǐ de shuǐ píng 。", "translation": "Luyện tập nhiều có thể nâng cao đáng kể trình độ của bạn.", "id": "H2-T11-14"}, {"hanzi": "特别", "pinyin": "tèbié", "meaning": "Đặc biệt", "example": "今天的饺子特别好吃。", "examplePinyin": "jīn tiān de jiǎo zi tè bié hǎo chī 。", "translation": "Sủi cảo hôm nay đặc biệt ngon.", "id": "H2-T11-15"}, {"hanzi": "完全", "pinyin": "wánquán", "meaning": "Hoàn toàn", "example": "老师的话我完全听懂了。", "examplePinyin": "lǎo shī de huà wǒ wán quán tīng dǒng le 。", "translation": "Tôi đã hoàn toàn nghe hiểu lời thầy.", "id": "H2-T11-16"}, {"hanzi": "好像 mplePinyin": "zhōng guó de rén kǒu yǒu shí duō yì 。", "translation": "Dân số Trung Quốc có hơn một tỷ người.", "id": "H2-T15-01"}, {"hanzi": "万", "pinyin": "wàn", "meaning": "Mười nghìn", "example": "这所大学有两万多名学生。", "examplePinyin": "zhè suǒ dà xué yǒu liǎng wàn duō míng xué shēng 。", "translation": "Trường đại học này có hơn hai vạn sinh viên.", "id": "H2-T15-02"}, {"hanzi": "大部分", "pinyin": "dàbùfen", "meaning": "Phần lớn", "example": "大部分同学都坐车来学校。", "examplePinyin": "dà bù fèn tóng xué dōu zuò chē lái xué xiào 。", "translation": "Phần lớn các bạn đều đi xe đến trường.", "id": "H2-T15-03"}, {"hanzi": "一点点", "pinyin": "yìdiǎndiǎn", "meaning": "Một chút xíu", "example": "这杯水只要加一点点糖。", "examplePinyin": "zhè bēi shuǐ zhǐ yào jiā yì diǎn diǎn táng 。", "translation": "Cốc nước này chỉ cần thêm một chút xíu đường.", "id": "H2-T15-04"}, {"hanzi": "一部分", "pinyin": "yíbùfen", "meaning": "Một phần", "example": "这笔钱的一部分是给妈妈的。", "examplePinyin": "zhè bǐ qián de yī bù fèn shì gěi mā mā de 。", "translation": "Một phần số tiền này là dành cho mẹ.", "id": "H2-T15-05"}, {"hanzi": "部分", "pinyin": "bùfen", "meaning": "Bộ phận, phần", "example": "这本书最难的部分在后面。", "examplePinyin": "zhè běn shū zuì nán de bù fèn zài hòu miàn 。", "translation": "Phần khó nhất của quyển sách này ở phía sau.", "id": "H2-T15-06"}, {"hanzi": "大量", "pinyin": "dàliàng", "meaning": "Số lượng lớn", "example": "学语言需要大量练习。", "examplePinyin": "xué yǔ yán xū yào dà liàng liàn xí 。", "translation": "Học ngôn ngữ cần luyện tập rất nhiều.", "id": "H2-T15-07"}, {"hanzi": "好多", "pinyin": "hǎoduō", "meaning": "Rất nhiều", "example": "超市里有好多便宜的水果。", "examplePinyin": "chāo shì lǐ yǒu hǎo duō pián yi de shuǐ guǒ 。", "translation": "Trong siêu thị có rất nhiều trái cây rẻ.", "id": "H2-T15-08"}, {"hanzi": "不够", "pinyin": "búgòu", "meaning": "Không đủ", "example": "这些钱不够买两张票。", "examplePinyin": "zhè xiē qián bù gòu mǎi liǎng zhāng piào 。", "translation": "Số tiền này không đủ mua hai vé.", "id": "H2-T15-09"}, {"hanzi": "大多数", "pin 看了小动物。", "translation": "Vào thứ Bảy, 小林 đến Bắc Kinh thăm bạn cũ 小雨. Họ đã nửa năm chưa gặp. 小林 đi tàu hỏa buổi sáng, không đi máy bay. Trước khi xuất phát mẹ bảo cậu mang trái cây và nhờ mang một quyển sách cho gia đình bạn. Tàu đến lúc tám giờ, 小雨 lái xe đón. 小林 xin lỗi vì để bạn chờ. 小雨 nói không sao và đề nghị đi ăn trước ở quán gần ga. Ăn xong họ định đi công viên rồi về xem ảnh. Hôm sau vì trời đẹp, họ cùng đi sở thú xem động vật nhỏ.", "grammar": ["是……的", "让 + người + hành động", "吧"], "questions": [{"question": "谁开车去车站接朋友？", "answer": "小雨", "options": ["小雨", "小林", "妈妈", "老师"], "explanation": "Bài nói rõ người bạn lái xe đến đón.", "id": "H2-R01-1-Q1"}, {"question": "小林是怎么去北京的？", "answer": "坐火车", "options": ["坐火车", "坐飞机", "骑自行车", "走路"], "explanation": "Câu 是上午坐火车去的 nhấn mạnh cách và thời gian đi.", "id": "H2-R01-1-Q2"}, {"question": "他们多久没见面了？", "answer": "半年", "options": ["半年", "一个星期", "一个月", "三年"], "explanation": "Mở đầu nêu 已经有半年没见面了.", "id": "H2-R01-1-Q3"}, {"id": "H2-R01-1-Q4", "question": "第二天他们去了哪里？", "answer": "动物园", "options": ["动物园", "医院", "银行", "学校"], "explanation": "Đoạn bổ sung nêu rõ hôm sau đến 动物园."}, {"question": "“妈妈让他带上一些水果”中的“让”表示什么？", "answer": "叫他做一件事", "options": ["叫他做一件事", "和他比较", "离他很远", "已经做完"], "explanation": "让 + người + hành động là câu kiêm ngữ.", "id": "H2-R01-1-Q5"}, {"question": "“我们先去吃饭吧”主要是在做什么？", "answer": "提出建议", "options": ["提出建议", "询问年龄", "介绍工作", "说明价格"], "explanation": "吧 ở cuối câu làm lời đề nghị nhẹ nhàng hơn.", "id": "H2-R01-1-Q6"}], "pinyin": "xīng qī liù ， xiǎo lín yào qù běi jīng kàn lǎo péng yǒu xiǎo yǔ 。 tā men yǐ jīng yǒu bàn nián méi jiàn miàn le 。 xiǎo lín shì shàng wǔ zuò huǒ chē qù de ， bú shì zuò fēi jī qù de 。 chū fā yǐ qián ， mā mā ràng tā dài shàng yī xiē shuǐ guǒ ， hái qǐng tā gěi xiǎo yǔ de jiā rén dài yī běn shū 。 huǒ chē bā diǎn dào zhàn ， xiǎo yǔ kāi chē lái jiē tā 。 yī jiàn miàn ， xiǎo lín jiù shuō ： “ bù hǎo yì sī ， ràng nǐ děng le zhè me jiǔ 。 ” xiǎo yǔ xiào zhe shuō ： “ méi guān xì ， wǒ men xiān qù chī fàn ba ， fàn guǎn lí zhè lǐ bù yuǎn 。 ” chī wán fàn yǐ hòu ， tā men dǎ suàn yì qǐ dào gōng yuán zǒu zǒu ， zài huí jiā kàn zhào piān 。 dì èr tiān ， yīn wèi tiān qì hěn hǎo ， tā men yòu yì qǐ qù dòng wù yuán kàn le xiǎo dòng wù 。"}, {"id": "H2-R01-2", "lesson": 1, "title": "去上海看朋友 · 小安", "text": "星期日，小安要去上海看老朋友小月。他们已经有半年没见面了。小安是上午坐火车去的，不是坐飞机去的。出发以前，妈妈让他带上一些水果，还请他给小月的家人带一本书。火车九点到站，小月开车来接他。一见面，小安就说：“不好意思，让你等了这么久。”小月笑着说：“没关系，我们先去吃饭吧，饭馆离这里不远。”吃完饭以后，他们打算一起到公园走走，再回家看照片。后来朋友的妹妹回来了，他们三个人一起学习做饺子，晚上请妈妈尝一尝。", "translation": "Vào Chủ nhật, 小安 đến Thượng Hải thăm bạn cũ 小月. Họ đã nửa năm chưa gặp. 小安 đi tàu hỏa buổi sáng, không đi máy bay. Trước khi xuất phát mẹ bảo cậu mang trái cây và nhờ mang một quyển sách cho gia đình bạn. Tàu đến lúc chín giờ, 小月 lái xe đón. 小安 xin lỗi vì để bạn chờ. 小月 nói không sao và đề nghị đi ăn trước ở quán gần ga. Ăn xong họ định đi công viên rồi về xem ảnh. Sau đó em gái người bạn về, ba người cùng học làm sủi cảo và tối mời mẹ nếm thử.", "grammar": ["是……的", "让 + người + hành động", "吧"], "questions": [{"question": "谁开车去车站接朋友？", "answer": "小月", "options": ["小月", "小安", "妈妈", "老师"], "explanation": "Bài nói rõ người bạn lái xe đến đón.", "id": "H2-R01-2-Q1"}, {"question": "小安是怎么去上海的？", "answer": "坐火车", "options": ["坐火车", "坐飞机", "骑自行车", "走路"], "explanation": "Câu 是上午坐火车去的 nhấn mạnh cách và thời gian đi.", "id": "H2-R01-2-Q2"}, {"question": "他们多久没见面了？", "answer": "半年", "options": ["半年", "一个星期", "一个月", "三年"], "explanation": "Mở đầu nêu 已经有半年没见面了.", "id": "H2-R01-2-Q3"}, {"id": "H2-R01-2-Q4", "question": "他们后来一起学做什么？", "answer": "饺子", "options": ["饺子", "蛋糕", "米饭", "面包"], "explanation": "Họ 学习做饺子, tức học làm sủi cảo."}, {"question": "“妈妈让他带上一些水果”中的“让”表示什么？", "answer": "叫他做一件事", "options": ["叫他做一件事", "和他比较", "离他很远", "已经做完"], "explanation": "让 + người + hành động là câu kiêm ngữ.", "id": "H2-R01-2-Q5"}, {"question": "“我们先去吃饭吧”主要是在做什么？", "answer": "提出建议", "options": ["提出建议", "询问年龄", "介绍工作", "说明价格"], "explanation": "吧 ở cuối câu làm lời đề nghị nhẹ nhàng hơn.", "id": "H2-R01-2-Q6"}], "pinyin": "xīng qī rì ， xiǎo ān yào qù shàng hǎi kàn lǎo péng yǒu xiǎo yuè 。 tā men yǐ jīng yǒu bàn nián méi jiàn miàn le 。 xiǎo ān shì shàng wǔ zuò huǒ chē qù de ， bú shì zuò fēi jī qù de 。 chū fā yǐ qián ， mā mā ràng tā dài shàng yī xiē shuǐ guǒ ， hái qǐng tā gěi xiǎo yuè de jiā rén dài yī běn shū 。 huǒ chē jiǔ diǎn dào zhàn ， xiǎo yuè kāi chē lái jiē tā 。 yī jiàn miàn ， xiǎo ān jiù shuō ： “ bù hǎo yì sī ， ràng nǐ děng le zhè me jiǔ 。 ” xiǎo yuè xiào zhe shuō ： “ méi guān xì ， wǒ men xiān qù chī fàn ba ， fàn guǎn lí zhè lǐ bù yuǎn 。 ” chī wán fàn yǐ hòu ， tā men dǎ suàn yì qǐ dào gōng yuán zǒu zǒu ， zài huí jiā kàn zhào piān 。 hòu lái péng yǒu de mèi mèi huí lái le ， tā men sān gè rén yì qǐ xué xí zuò jiǎo zi ， wǎn shàng qǐng mā mā cháng yī cháng 。"}, {"id": "H2-R01-3", "lesson": 1, "title": "去广州看朋友 · 小文", "text": "星期一，小文要去广州看老朋友小兰。他们已经有半年没见面了。小文是上午坐火车去的，不是坐飞机去的。出发以前，妈妈让他带上一些水果，还请他给小兰的家人带一本书。火车十点到站，小兰开车来接他。一见面，小文就说：“不好意思，让你等了这么久。”小兰笑着说：“没关系，我们先去吃饭吧，饭馆离这里不远。”吃完饭以后，他们打算一起到公园走走，再回家看照片。第二天早上，他们去书店给孩子买书，还请店员帮忙选了一本词典。", "translation": "Vào thứ Hai, 小文 đến Quảng Châu thăm bạn cũ 小兰. Họ đã nửa năm chưa gặp. 小文 đi tàu hỏa buổi sáng, không đi máy bay. Trước khi xuất phát mẹ bảo cậu mang trái cây và nhờ mang một quyển sách cho gia đình bạn. Tàu đến lúc mười giờ, 小兰 lái xe đón. 小文 xin lỗi vì để bạn chờ. 小兰 nói không sao và đề nghị đi ăn trước ở quán gần ga. Ăn xong họ định đi công viên rồi về xem ảnh. Sáng hôm sau họ đến hiệu sách mua sách cho trẻ, còn nhờ nhân viên chọn từ điển.", "grammar": ["是……的", "让 + người + hành động", "吧"], "questions": [{"question": "谁开车去车站接朋友？", "answer": "小兰", "options": ["小兰", "小文", "妈妈", "老师"], "explanation": "Bài nói rõ người bạn lái xe đến đón.", "id": "H2-R01-3-Q1"}, {"question": "小文是怎么去广州的？", "answer": "坐火车", "options": ["坐火车", "坐飞机", "骑自行车", "走路"], "explanation": "Câu 是上午坐火车去的 nhấn mạnh cách và thời gian đi.", "id": "H2-R01-3-Q2"}, {"question": "他们多久没见面了？", "answer": "半年", "options": ["半年", "一个星期", "一个月", "三年"], "explanation": "Mở đầu nêu 已经有半年没见面了.", "id": "H2-R01-3-Q3"}, {"id": "H2-R01-3-Q4", "question": "他们请店员帮忙选了什么？", "answer": "一本词典", "options": ["一本词典", "一件外套", "一双鞋", "一个杯子"], "explanation": "Đoạn cuối ghi rõ 选了一本词典."}, {"question": "“妈妈让他带上一些水果”中的“让”表示什么？", "answer": "叫他做一件事", "options": ["叫他做一件事", "和他比较", "离他很远", "已经做完"], "explanation": "让 + người + hành động là câu kiêm ngữ.", "id": "H2-R01-3-Q5"}, {"question": "“我们先去吃饭吧”主要是在做什么？", "answer": "提出建议", "options": ["提出建议", "询问年龄", "介绍工作", "说明价格"], "explanation": "吧 ở cuối câu làm lời đề nghị nhẹ nhàng hơn.", "id": "H2-R01-3-Q6"}], "pinyin": "xīng qī yī ， xiǎo wén yào qù guǎng zhōu kàn lǎo péng yǒu xiǎo lán 。 tā men yǐ jīng yǒu bàn nián méi jiàn miàn le 。 xiǎo wén shì shàng wǔ zuò huǒ chē qù de ， bú shì zuò fēi jī qù de 。 chū fā yǐ qián ， mā mā ràng tā dài shàng yī xiē shuǐ guǒ ， hái qǐng tā gěi xiǎo lán de jiā rén dài yī běn shū 。 huǒ chē shí diǎn dào zhàn ， xiǎo lán kāi chē lái jiē tā 。 yī jiàn miàn ， xiǎo wén jiù shuō ： “ bù hǎo yì sī ， ràng nǐ děng le zhè me jiǔ 。 ” xiǎo lán xiào zhe shuō ： “ méi guān xì ， wǒ men xiān qù chī fàn ba ， fàn guǎn lí zhè lǐ bù yuǎn 。 ” chī wán fàn yǐ hòu ， tā men dǎ suàn yì qǐ dào gōng yuán zǒu zǒu ， zài huí jiā kàn zhào piān 。 dì èr tiān zǎo shàng ， tā men qù shū diàn gěi hái zi mǎi shū ， hái qǐng diàn yuán bāng máng xuǎn le yī běn cí diǎn 。"}, {"id": "H2-R01-4", "lesson": 1, "title": "去南京看朋友 · 小东", "text": "星期三，小东要去南京看老朋友小梅。他们已经有半年没见面了。小东是上午坐火车去的，不是坐飞机去的。出发以前，妈妈让他带上一些水果，还请他给小梅的家人带一本书。火车七点半到站，小梅开车来接他。一见面，小东就说：“不好意思，让你等了这么久。”小梅笑着说：“没关系，我们先去吃饭吧，饭馆离这里不远。”吃完饭以后，他们打算一起到公园走走，再回家看照片。第二天下雨了，他们没有出门，而是在家听音乐，聊以前在学校的生活。", "translation": "Vào thứ Tư, 小东 đến Nam Kinh thăm bạn cũ 小梅. Họ đã nửa năm chưa gặp. 小东 đi tàu hỏa buổi sáng, không đi máy bay. Trước khi xuất phát mẹ bảo cậu mang trái cây và nhờ mang một quyển sách cho gia đình bạn. Tàu đến lúc bảy giờ rưỡi, 小梅 lái xe đón. 小东 xin lỗi vì để bạn chờ. 小梅 nói không sao và đề nghị đi ăn trước ở quán gần ga. Ăn xong họ định đi công viên rồi về xem ảnh. Hôm sau trời mưa, họ không ra ngoài mà ở nhà nghe nhạc và kể chuyện thời đi học.", "grammar": ["是……的", "让 + người + hành động", "吧"], "questions": [{"question": "谁开车去车站接朋友？", "answer": "小梅", "options": ["小梅", "小东", "妈妈", "老师"], "explanation": "Bài nói rõ người bạn lái xe đến đón.", "id": "H2-R01-4-Q1"}, {"question": "小东是怎么去南京的？", "answer": "坐火车", "options": ["坐火车", "坐飞机", "骑自行车", "走路"], "explanation": "Câu 是上午坐火车去的 nhấn mạnh cách và thời gian đi.", "id": "H2-R01-4-Q2"}, {"question": "他们多久没见面了？", "answer": "半年", "options": ["半年", "一个星期", "一个月", "三年"], "explanation": "Mở đầu nêu 已经有半年没见面了.", "id": "H2-R01-4-Q3"}, {"id": "H2-R01-4-Q4", "question": "第二天他们为什么没出门？", "answer": "下雨了", "options": ["下雨了", "没有水果", "不认识路", "车票太贵"], "explanation": "Trời mưa khiến họ ở nhà, không phải các lý do còn lại."}, {"question": "“妈妈让他带上一些水果”中的“让”表示什么？", "answer": "叫他做一件事", "options": ["叫他做一件事", "和他比较", "离他很远", "已经做完"], "explanation": "让 + người + hành động là câu kiêm ngữ.", "id": "H2-R01-4-Q5"}, {"question": "“我们先去吃饭吧”主要是在做什么？", "answer": "提出建议", "options": ["提出建议", "询问年龄", "介绍工作", "说明价格"], "explanation": "吧 ở cuối câu làm lời đề nghị nhẹ nhàng hơn.", "id": "H2-R01-4-Q6"}], "pinyin": "xīng qī sān ， xiǎo dōng yào qù nán jīng kàn lǎo péng yǒu xiǎo méi 。 tā men yǐ jīng yǒu bàn nián méi jiàn miàn le 。 xiǎo dōng shì shàng wǔ zuò huǒ chē qù de ， bú shì zuò fēi jī qù de 。 chū fā yǐ qián ， mā mā ràng tā dài shàng yī xiē shuǐ guǒ ， hái qǐng tā gěi xiǎo méi de jiā rén dài yī běn shū 。 huǒ chē qī diǎn bàn dào zhàn ， xiǎo méi kāi chē lái jiē tā 。 yī jiàn miàn ， xiǎo dōng jiù shuō ： “ bù hǎo yì sī ， ràng nǐ děng le zhè me jiǔ 。 ” xiǎo méi xiào zhe shuō ： “ méi guān xì ， wǒ men xiān qù chī fàn ba ， fàn guǎn lí zhè lǐ bù yuǎn 。 ” chī wán fàn yǐ hòu ， tā men dǎ suàn yì qǐ dào gōng yuán zǒu zǒu ， zài huí jiā kàn zhào piān 。 dì èr tiān xià yǔ le ， tā men méi yǒu chū mén ， ér shì zài jiā tīng yīn yuè ， liáo yǐ qián zài xué xiào de shēng huó 。"}, {"id": "H2-R01-5", "lesson": 1, "title": "去天津看朋友 · 小明", "text": "星期五，小明要去天津看老朋友小雪。他们已经有半年没见面了。小明是上午坐火车去的，不是坐飞机去的。出发以前，妈妈让他带上一些水果，还请他给小雪的家人带一本书。火车八点半到站，小雪开车来接他。一见面，小明就说：“不好意思，让你等了这么久。”小雪笑着说：“没关系，我们先去吃饭吧，饭馆离这里不远。”吃完饭以后，他们打算一起到公园走走，再回家看照片。第二天回去以前，朋友给他拿来了一些自己做的面包，请他带给家人。", "translation": "Vào thứ Sáu, 小明 đến Thiên Tân thăm bạn cũ 小雪. Họ đã nửa năm chưa gặp. 小明 đi tàu hỏa buổi sáng, không đi máy bay. Trước khi xuất phát mẹ bảo cậu mang trái cây và nhờ mang một quyển sách cho gia đình bạn. Tàu đến lúc tám giờ rưỡi, 小雪 lái xe đón. 小明 xin lỗi vì để bạn chờ. 小雪 nói không sao và đề nghị đi ăn trước ở quán gần ga. Ăn xong họ định đi công viên rồi về xem ảnh. Trước khi về hôm sau, người bạn mang bánh mì tự làm đến nhờ cậu đem cho gia đình.", "grammar": ["是……的", "让 + người + hành động", "吧"], "questions": [{"question": "谁开车去车站接朋友？", "answer": "小雪", "options": ["小雪", "小明", "妈妈", "老师"], "explanation": "Bài nói rõ người bạn lái xe đến đón.", "id": "H2-R01-5-Q1"}, {"question": "小明是怎么去天津的？", "answer": "坐火车", "options": ["坐火车", "坐飞机", "骑自行车", "走路"], "explanation": "Câu 是上午坐火车去的 nhấn mạnh cách và thời gian đi.", "id": "H2-R01-5-Q2"}, {"question": "他们多久没见面了？", "answer": "半年", "options": ["半年", "一个星期", "一个月", "三年"], "explanation": "Mở đầu nêu 已经有半年没见面了.", "id": "H2-R01-5-Q3"}, {"id": "H2-R01-5-Q4", "question": "朋友让他带什么回家？", "answer": "自己做的面包", "options": ["自己做的面包", "新买的相机", "红色的裤子", "一瓶药水"], "explanation": "Câu cuối nêu bánh mì do người bạn tự làm."}, {"question": "“妈妈让他带上一些水果”中的“让”表示什么？", "answer": "叫他做一件事", "options": ["叫他做一件事", "和他比较", "离他很远", "已经做完"], "explanation": "让 + người + hành động là câu kiêm ngữ.", "id": "H2-R01-5-Q5"}, {"question": "“我们先去吃饭吧”主要是在做什么？", "answer": "提出建议", "options": ["提出建议", "询问年龄", "介绍工作", "说明价格"], "explanation": "吧 ở cuối câu làm lời đề nghị nhẹ nhàng hơn.", "id": "H2-R01-5-Q6"}], "pinyin": "xīng qī wǔ ， xiǎo míng yào qù tiān jīn kàn lǎo péng yǒu xiǎo xuě 。 tā men yǐ jīng yǒu bàn nián méi jiàn miàn le 。 xiǎo míng shì shàng wǔ zuò huǒ chē qù de ， bú shì zuò fēi jī qù de 。 chū fā yǐ qián ， mā mā ràng tā dài shàng yī xiē shuǐ guǒ ， hái qǐng tā gěi xiǎo xuě de jiā rén dài yī běn shū 。 huǒ chē bā diǎn bàn dào zhàn ， xiǎo xuě kāi chē lái jiē tā 。 yī jiàn miàn ， xiǎo míng jiù shuō ： “ bù hǎo yì sī ， ràng nǐ děng le zhè me jiǔ 。 ” xiǎo xuě xiào zhe shuō ： “ méi guān xì ， wǒ men xiān qù chī fàn ba ， fàn guǎn lí zhè lǐ bù yuǎn 。 ” chī wán fàn yǐ hòu ， tā men dǎ suàn yì qǐ dào gōng yuán zǒu zǒu ， zài huí jiā kàn zhào piān 。 dì èr tiān huí qù yǐ qián ， péng yǒu gěi tā ná lái le yī xiē zì jǐ zuò de miàn bāo ， qǐng tā dài gěi jiā rén 。"}, {"id": "H2-R02-1", "lesson": 2, "title": "第一次去新学校 · 小林", "text": "小林刚到北京，今天第一次去新学校上课。地图上学校离家不太远，但是他还不认识路。早上八点，他在门口碰见了小雨。小雨说：“坐公交车要换一次车，我们还是坐地铁去吧。”地铁站就在对面，走过去只要五分钟。两个人在学校门口买了早餐，一共花了十多块钱。到了教室，小林发现班里有二十多个学生。老师给他的那本书已经放在桌上了。他觉得新同学很友好，心里也不那么着急了。下课以后，他才发现笔记本忘在家里了，同桌就让他先用自己的。", "translation": "小林 mới đến Bắc Kinh, lần đầu tới trường mới. Trường không xa nhưng cậu chưa biết đường. Lúc tám giờ cậu gặp 小雨, người đề nghị đi tàu điện ngầm vì xe buýt phải đổi một lần. Ga ở đối diện, đi bộ năm phút. Họ mua bữa sáng ở cổng trường hết hơn mười tệ. Lớp có hơn hai mươi học sinh, sách thầy cho đã đặt trên bàn. Bạn học thân thiện nên cậu bớt lo. Tan học cậu mới phát hiện quên vở ở nhà, bạn cùng bàn cho cậu dùng vở của mình trước.", "grammar": ["还是……吧", "Số lượng ước chừng với 多", "Định ngữ + 的"], "questions": [{"question": "他们最后怎么去学校？", "answer": "坐地铁", "options": ["坐地铁", "坐公交车", "坐出租车", "骑自行车"], "explanation": "还是坐地铁去吧 là phương án họ chọn.", "id": "H2-R02-1-Q1"}, {"question": "为什么没有坐公交车？", "answer": "要换一次车", "options": ["要换一次车", "公交车太贵", "没有公交车", "已经下课了"], "explanation": "Văn bản nêu 坐公交车要换一次车.", "id": "H2-R02-1-Q2"}, {"question": "从门口走到地铁站需要多久？", "answer": "五分钟", "options": ["五分钟", "十分钟", "半小时", "一小时"], "explanation": "走过去只要五分钟.", "id": "H2-R02-1-Q3"}, {"id": "H2-R02-1-Q4", "question": "他忘带了什么？", "answer": "笔记本", "options": ["笔记本", "护照", "相机", "早餐"], "explanation": "Câu cuối nói 笔记本忘在家里了."}, {"question": "“老师给他的那本书”中，哪部分说明是哪本书？", "answer": "老师给他的", "options": ["老师给他的", "已经放在", "桌上了", "心里也"], "explanation": "老师给他的 là cụm động từ làm định ngữ cho 书.", "id": "H2-R02-1-Q5"}, {"question": "“还是坐地铁去吧”在这里表示什么？", "answer": "建议坐地铁", "options": ["建议坐地铁", "询问两种交通工具", "说以前坐过", "要求退票"], "explanation": "还是……吧 là cấu trúc đưa ra đề nghị.", "id": "H2-R02-1-Q6"}], "pinyin": "xiǎo lín gāng dào běi jīng ， jīn tiān dì yī cì qù xīn xué xiào shàng kè 。 dì tú shàng xué xiào lí jiā bù tài yuǎn ， dàn shì tā hái bù rèn shí lù 。 zǎo shàng bā diǎn ， tā zài mén kǒu pèng jiàn le xiǎo yǔ 。 xiǎo yǔ shuō ： “ zuò gōng jiāo chē yào huàn yī cì chē ， wǒ men hái shì zuò dì tiě qù ba 。 ” dì tiě zhàn jiù zài duì miàn ， zǒu guò qù zhǐ yào wǔ fēn zhōng 。 liǎng gè rén zài xué xiào mén kǒu mǎi le zǎo cān ， yī gòng huā le shí duō kuài qián 。 dào le jiào shì ， xiǎo lín fā xiàn bān lǐ yǒu èr shí duō gè xué shēng 。 lǎo shī gěi tā de nà běn shū yǐ jīng fàng zài zhuō shàng le 。 tā jué de xīn tóng xué hěn yǒu hǎo ， xīn lǐ yě bù nà me zhe jí le 。 xià kè yǐ hòu ， tā cái fā xiàn bǐ jì běn wàng zài jiā lǐ le ， tóng zhuō jiù ràng tā xiān yòng zì jǐ de 。"}, {"id": "H2-R02-2", "lesson": 2, "title": "第一次去新学校 · 小安", "text": "小安刚到上海，今天第一次去新学校上课。地图上学校离家不太远，但是他还不认识路。早上九点，他在门口碰见了小月。小月说：“坐公交车要换一次车，我们还是坐地铁去吧。”地铁站就在对面，走过去只要五分钟。两个人在学校门口买了早餐，一共花了十多块钱。到了教室，小安发现班里有二十多个学生。老师给他的那本书已经放在桌上了。他觉得新同学很友好，心里也不那么着急了。上第一节课以前，他走错了教室。班长看见了，马上带他去楼上的那一间。", "translation": "小安 mới đến Thượng Hải, lần đầu tới trường mới. Trường không xa nhưng cậu chưa biết đường. Lúc chín giờ cậu gặp 小月, người đề nghị đi tàu điện ngầm vì xe buýt phải đổi một lần. Ga ở đối diện, đi bộ năm phút. Họ mua bữa sáng ở cổng trường hết hơn mười tệ. Lớp có hơn hai mươi học sinh, sách thầy cho đã đặt trên bàn. Bạn học thân thiện nên cậu bớt lo. Trước tiết đầu cậu vào nhầm lớp; lớp trưởng thấy liền dẫn cậu đến phòng trên lầu.", "grammar": ["还是……吧", "Số lượng ước chừng với 多", "Định ngữ + 的"], "questions": [{"question": "他们最后怎么去学校？", "answer": "坐地铁", "options": ["坐地铁", "坐公交车", "坐出租车", "骑自行车"], "explanation": "还是坐地铁去吧 là phương án họ chọn.", "id": "H2-R02-2-Q1"}, {"question": "为什么没有坐公交车？", "answer": "要换一次车", "options": ["要换一次车", "公交车太贵", "没有公交车", "已经下课了"], "explanation": "Văn bản nêu 坐公交车要换一次车.", "id": "H2-R02-2-Q2"}, {"question": "从门口走到地铁站需要多久？", "answer": "五分钟", "options": ["五分钟", "十分钟", "半小时", "一小时"], "explanation": "走过去只要五分钟.", "id": "H2-R02-2-Q3"}, {"id": "H2-R02-2-Q4", "question": "谁带他找到正确的教室？", "answer": "班长", "options": ["班长", "司机", "医生", "顾客"], "explanation": "Người giúp tìm đúng lớp là 班长."}, {"question": "“老师给他的那本书”中，哪部分说明是哪本书？", "answer": "老师给他的", "options": ["老师给他的", "已经放在", "桌上了", "心里也"], "explanation": "老师给他的 là cụm động từ làm định ngữ cho 书.", "id": "H2-R02-2-Q5"}, {"question": "“还是坐地铁去吧”在这里表示什么？", "answer": "建议坐地铁", "options": ["建议坐地铁", "询问两种交通工具", "说以前坐过", "要求退票"], "explanation": "还是……吧 là cấu trúc đưa ra đề nghị.", "id": "H2-R02-2-Q6"}], "pinyin": "xiǎo ān gāng dào shàng hǎi ， jīn tiān dì yī cì qù xīn xué xiào shàng kè 。 dì tú shàng xué xiào lí jiā bù tài yuǎn ， dàn shì tā hái bù rèn shí lù 。 zǎo shàng jiǔ diǎn ， tā zài mén kǒu pèng jiàn le xiǎo yuè 。 xiǎo yuè shuō ： “ zuò gōng jiāo chē yào huàn yī cì chē ， wǒ men hái shì zuò dì tiě qù ba 。 ” dì tiě zhàn jiù zài duì miàn ， zǒu guò qù zhǐ yào wǔ fēn zhōng 。 liǎng gè rén zài xué xiào mén kǒu mǎi le zǎo cān ， yī gòng huā le shí duō kuài qián 。 dào le jiào shì ， xiǎo ān fā xiàn bān lǐ yǒu èr shí duō gè xué shēng 。 lǎo shī gěi tā de nà běn shū yǐ jīng fàng zài zhuō shàng le 。 tā jué de xīn tóng xué hěn yǒu hǎo ， xīn lǐ yě bù nà me zhe jí le 。 shàng dì yī jié kè yǐ qián ， tā zǒu cuò le jiào shì 。 bān zhǎng kàn jiàn le ， mǎ shàng dài tā qù lóu shàng de nà yī jiān 。"}, {"id": "H2-R02-3", "lesson": 2, "title": "第一次去新学校 · 小文", "text": "小文刚到广州，今天第一次去新学校上课。地图上学校离家不太远，但是他还不认识路。早上十点，他在门口碰见了小兰。小兰说：“坐公交车要换一次车，我们还是坐地铁去吧。”地铁站就在对面，走过去只要五分钟。两个人在学校门口买了早餐，一共花了十多块钱。到了教室，小文发现班里有二十多个学生。老师给他的那本书已经放在桌上了。他觉得新同学很友好，心里也不那么着急了。中午，老师请大家介绍自己。他说得有点儿慢，但是同学们听得很认真。", "translation": "小文 mới đến Quảng Châu, lần đầu tới trường mới. Trường không xa nhưng cậu chưa biết đường. Lúc mười giờ cậu gặp 小兰, người đề nghị đi tàu điện ngầm vì xe buýt phải đổi một lần. Ga ở đối diện, đi bộ năm phút. Họ mua bữa sáng ở cổng trường hết hơn mười tệ. Lớp có hơn hai mươi học sinh, sách thầy cho đã đặt trên bàn. Bạn học thân thiện nên cậu bớt lo. Buổi trưa thầy mời mọi người tự giới thiệu; cậu nói hơi chậm nhưng các bạn nghe rất chăm chú.", "grammar": ["还是……吧", "Số lượng ước chừng với 多", "Định ngữ + 的"], "questions": [{"question": "他们最后怎么去学校？", "answer": "坐地铁", "options": ["坐地铁", "坐公交车", "坐出租车", "骑自行车"], "explanation": "还是坐地铁去吧 là phương án họ chọn.", "id": "H2-R02-3-Q1"}, {"question": "为什么没有坐公交车？", "answer": "要换一次车", "options": ["要换一次车", "公交车太贵", "没有公交车", "已经下课了"], "explanation": "Văn bản nêu 坐公交车要换一次车.", "id": "H2-R02-3-Q2"}, {"question": "从门口走到地铁站需要多久？", "answer": "五分钟", "options": ["五分钟", "十分钟", "半小时", "一小时"], "explanation": "走过去只要五分钟.", "id": "H2-R02-3-Q3"}, {"id": "H2-R02-3-Q4", "question": "同学们怎样听他介绍自己？", "answer": "听得很认真", "options": ["听得很认真", "一直看手机", "全都离开了", "没有人听"], "explanation": "Câu mô tả cụ thể các bạn 听得很认真."}, {"question": "“老师给他的那本书”中，哪部分说明是哪本书？", "answer": "老师给他的", "options": ["老师给他的", "已经放在", "桌上了", "心里也"], "explanation": "老师给他的 là cụm động từ làm định ngữ cho 书.", "id": "H2-R02-3-Q5"}, {"question": "“还是坐地铁去吧”在这里表示什么？", "answer": "建议坐地铁", "options": ["建议坐地铁", "询问两种交通工具", "说以前坐过", "要求退票"], "explanation": "还是……吧 là cấu trúc đưa ra đề nghị.", "id": "H2-R02-3-Q6"}], "pinyin": "xiǎo wén gāng dào guǎng zhōu ， jīn tiān dì yī cì qù xīn xué xiào shàng kè 。 dì tú shàng xué xiào lí jiā bù tài yuǎn ， dàn shì tā hái bù rèn shí lù 。 zǎo shàng shí diǎn ， tā zài mén kǒu pèng jiàn le xiǎo lán 。 xiǎo lán shuō ： “ zuò gōng jiāo chē yào huàn yī cì chē ， wǒ men hái shì zuò dì tiě qù ba 。 ” dì tiě zhàn jiù zài duì miàn ， zǒu guò qù zhǐ yào wǔ fēn zhōng 。 liǎng gè rén zài xué xiào mén kǒu mǎi le zǎo cān ， yī gòng huā le shí duō kuài qián 。 dào le jiào shì ， xiǎo wén fā xiàn bān lǐ yǒu èr shí duō gè xué shēng 。 lǎo shī gěi tā de nà běn shū yǐ jīng fàng zài zhuō shàng le 。 tā jué de xīn tóng xué hěn yǒu hǎo ， xīn lǐ yě bù nà me zhe jí le 。 zhōng wǔ ， lǎo shī qǐng dà jiā jiè shào zì jǐ 。 tā shuō de yǒu diǎn ér màn ， dàn shì tóng xué men tīng de hěn rèn zhēn 。"}, {"id": "H2-R02-4", "lesson": 2, "title": "第一次去新学校 · 小东", "text": "小东刚到南京，今天第一次去新学校上课。地图上学校离家不太远，但是他还不认识路。早上七点半，他在门口碰见了小梅。小梅说：“坐公交车要换一次车，我们还是坐地铁去吧。”地铁站就在对面，走过去只要五分钟。两个人在学校门口买了早餐，一共花了十多块钱。到了教室，小东发现班里有二十多个学生。老师给他的那本书已经放在桌上了。他觉得新同学很友好，心里也不那么着急了。下午最后一节课，老师让两个人一组读对话。他和新朋友读了两遍才读好。", "translation": "小东 mới đến Nam Kinh, lần đầu tới trường mới. Trường không xa nhưng cậu chưa biết đường. Lúc bảy giờ rưỡi cậu gặp 小梅, người đề nghị đi tàu điện ngầm vì xe buýt phải đổi một lần. Ga ở đối diện, đi bộ năm phút. Họ mua bữa sáng ở cổng trường hết hơn mười tệ. Lớp có hơn hai mươi học sinh, sách thầy cho đã đặt trên bàn. Bạn học thân thiện nên cậu bớt lo. Tiết cuối buổi chiều thầy cho đọc hội thoại theo cặp; cậu và bạn mới đọc hai lần mới đọc tốt.", "grammar": ["还是……吧", "Số lượng ước chừng với 多", "Định ngữ + 的"], "questions": [{"question": "他们最后怎么去学校？", "answer": "坐地铁", "options": ["坐地铁", "坐公交车", "坐出租车", "骑自行车"], "explanation": "还是坐地铁去吧 là phương án họ chọn.", "id": "H2-R02-4-Q1"}, {"question": "为什么没有坐公交车？", "answer": "要换一次车", "options": ["要换一次车", "公交车太贵", "没有公交车", "已经下课了"], "explanation": "Văn bản nêu 坐公交车要换一次车.", "id": "H2-R02-4-Q2"}, {"question": "从门口走到地铁站需要多久？", "answer": "五分钟", "options": ["五分钟", "十分钟", "半小时", "一小时"], "explanation": "走过去只要五分钟.", "id": "H2-R02-4-Q3"}, {"id": "H2-R02-4-Q4", "question": "他们读了几遍对话？", "answer": "两遍", "options": ["两遍", "一遍", "四遍", "六遍"], "explanation": "Văn bản nêu 读了两遍才读好."}, {"question": "“老师给他的那本书”中，哪部分说明是哪本书？", "answer": "老师给他的", "options": ["老师给他的", "已经放在", "桌上了", "心里也"], "explanation": "老师给他的 là cụm động từ làm định ngữ cho 书.", "id": "H2-R02-4-Q5"}, {"question": "“还是坐地铁去吧”在这里表示什么？", "answer": "建议坐地铁", "options": ["建议坐地铁", "询问两种交通工具", "说以前坐过", "要求退票"], "explanation": "还是……吧 là cấu trúc đưa ra đề nghị.", "id": "H2-R02-4-Q6"}], "pinyin": "xiǎo dōng gāng dào nán jīng ， jīn tiān dì yī cì qù xīn xué xiào shàng kè 。 dì tú shàng xué xiào lí jiā bù tài yuǎn ， dàn shì tā hái bù rèn shí lù 。 zǎo shàng qī diǎn bàn ， tā zài mén kǒu pèng jiàn le xiǎo méi 。 xiǎo méi shuō ： “ zuò gōng jiāo chē yào huàn yī cì chē ， wǒ men hái shì zuò dì tiě qù ba 。 ” dì tiě zhàn jiù zài duì miàn ， zǒu guò qù zhǐ yào wǔ fēn zhōng 。 liǎng gè rén zài xué xiào mén kǒu mǎi le zǎo cān ， yī gòng huā le shí duō kuài qián 。 dào le jiào shì ， xiǎo dōng fā xiàn bān lǐ yǒu èr shí duō gè xué shēng 。 lǎo shī gěi tā de nà běn shū yǐ jīng fàng zài zhuō shàng le 。 tā jué de xīn tóng xué hěn yǒu hǎo ， xīn lǐ yě bù nà me zhe jí le 。 xià wǔ zuì hòu yī jié kè ， lǎo shī ràng liǎng gè rén yī zǔ dú duì huà 。 tā hé xīn péng yǒu dú le liǎng biàn cái dú hǎo 。"}, {"id": "H2-R02-5", "lesson": 2, "title": "第一次去新学校 · 小明", "text": "小明刚到天津，今天第一次去新学校上课。地图上学校离家不太远，但是他还不认识路。早上八点半，他在门口碰见了小雪。小雪说：“坐公交车要换一次车，我们还是坐地铁去吧。”地铁站就在对面，走过去只要五分钟。两个人在学校门口买了早餐，一共花了十多块钱。到了教室，小明发现班里有二十多个学生。老师给他的那本书已经放在桌上了。他觉得新同学很友好，心里也不那么着急了。放学的时候，他没找到校门，正着急时，一位老师带他走到了门口。", "translation": "小明 mới đến Thiên Tân, lần đầu tới trường mới. Trường không xa nhưng cậu chưa biết đường. Lúc tám giờ rưỡi cậu gặp 小雪, người đề nghị đi tàu điện ngầm vì xe buýt phải đổi một lần. Ga ở đối diện, đi bộ năm phút. Họ mua bữa sáng ở cổng trường hết hơn mười tệ. Lớp có hơn hai mươi học sinh, sách thầy cho đã đặt trên bàn. Bạn học thân thiện nên cậu bớt lo. Khi tan học cậu không tìm thấy cổng, đang lo thì một thầy giáo dẫn cậu ra tận cửa.", "grammar": ["还是……吧", "Số lượng ước chừng với 多", "Định ngữ + 的"], "questions": [{"question": "他们最后怎么去学校？", "answer": "坐地铁", "options": ["坐地铁", "坐公交车", "坐出租车", "骑自行车"], "explanation": "还是坐地铁去吧 là phương án họ chọn.", "id": "H2-R02-5-Q1"}, {"question": "为什么没有坐公交车？", "answer": "要换一次车", "options": ["要换一次车", "公交车太贵", "没有公交车", "已经下课了"], "explanation": "Văn bản nêu 坐公交车要换一次车.", "id": "H2-R02-5-Q2"}, {"question": "从门口走到地铁站需要多久？", "answer": "五分钟", "options": ["五分钟", "十分钟", "半小时", "一小时"], "explanation": "走过去只要五分钟.", "id": "H2-R02-5-Q3"}, {"id": "H2-R02-5-Q4", "question": "放学时是谁帮他找到校门？", "answer": "一位老师", "options": ["一位老师", "一位医生", "出租车司机", "饭馆老板"], "explanation": "Thầy giáo là người dẫn cậu tới cổng."}, {"question": "“老师给他的那本书”中，哪部分说明是哪本书？", "answer": "老师给他的", "options": ["老师给他的", "已经放在", "桌上了", "心里也"], "explanation": "老师给他的 là cụm động từ làm định ngữ cho 书.", "id": "H2-R02-5-Q5"}, {"question": "“还是坐地铁去吧”在这里表示什么？", "answer": "建议坐地铁", "options": ["建议坐地铁", "询问两种交通工具", "说以前坐过", "要求退票"], "explanation": "还是……吧 là cấu trúc đưa ra đề nghị.", "id": "H2-R02-5-Q6"}], "pinyin": "xiǎo míng gāng dào tiān jīn ， jīn tiān dì yī cì qù xīn xué xiào shàng kè 。 dì tú shàng xué xiào lí jiā bù tài yuǎn ， dàn shì tā hái bù rèn shí lù 。 zǎo shàng bā diǎn bàn ， tā zài mén kǒu pèng jiàn le xiǎo xuě 。 xiǎo xuě shuō ： “ zuò gōng jiāo chē yào huàn yī cì chē ， wǒ men hái shì zuò dì tiě qù ba 。 ” dì tiě zhàn jiù zài duì miàn ， zǒu guò qù zhǐ yào wǔ fēn zhōng 。 liǎng gè rén zài xué xiào mén kǒu mǎi le zǎo cān ， yī gòng huā le shí duō kuài qián 。 dào le jiào shì ， xiǎo míng fā xiàn bān lǐ yǒu èr shí duō gè xué shēng 。 lǎo shī gěi tā de nà běn shū yǐ jīng fàng zài zhuō shàng le 。 tā jué de xīn tóng xué hěn yǒu hǎo ， xīn lǐ yě bù nà me zhe jí le 。 fàng xué de shí hòu ， tā méi zhǎo dào xiào mén ， zhèng zháo jí shí ， yī wèi lǎo shī dài tā zǒu dào le mén kǒu 。"}, {"id": "H2-R03-1", "lesson": 3, "title": "一起准备晚饭 · 小林", "text": "星期六下午，小林请小雨来家里吃饭。他想自己做几道中国菜，可是这是第一次，心里有点儿着急。小雨来了以后，先看了看菜单，然后说：“你先洗菜，我来做汤。不会的地方，我们一起想一想。”小林洗完菜，就给妈妈打电话，终于听懂了这个菜的做法。晚上八点，饭菜都做好了，两个人才坐下来吃饭。小雨觉得汤很好喝，就让小林也尝尝。他们吃完以后，先休息休息，再一起洗碗。虽然做饭用了不少时间，但是大家都很高兴。第二天，他又试着做了一次同样的菜，这次不用打电话也能做好了。", "translation": "Chiều thứ Bảy, 小林 mời 小雨 đến ăn và muốn tự nấu món Trung lần đầu. 小雨 xem thực đơn, đề nghị 小林 rửa rau còn mình nấu canh. 小林 rửa xong gọi mẹ và cuối cùng hiểu cách làm. Lúc tám giờ tối đồ ăn xong họ mới ăn. Canh ngon nên 小雨 mời bạn nếm thử. Ăn xong họ nghỉ một lát rồi cùng rửa bát. Tuy tốn thời gian nhưng cả hai rất vui. Hôm sau cậu thử nấu lại món đó, lần này không cần gọi điện cũng nấu xong.", "grammar": ["Bổ ngữ kết quả", "Lặp động từ AA / A一A", "ABAB"], "questions": [{"question": "谁先洗菜？", "answer": "小林", "options": ["小林", "小雨", "妈妈", "老师"], "explanation": "Lời phân công nói 你先洗菜, người được nói là A.", "id": "H2-R03-1-Q1"}, {"question": "谁做汤？", "answer": "小雨", "options": ["小雨", "小林", "爸爸", "服务员"], "explanation": "B nói 我来做汤.", "id": "H2-R03-1-Q2"}, {"question": "小林为什么给妈妈打电话？", "answer": "问菜的做法", "options": ["问菜的做法", "借钱", "问车站在哪儿", "请妈妈买衣服"], "explanation": "Sau điện thoại cậu nghe hiểu cách làm món ăn.", "id": "H2-R03-1-Q3"}, {"id": "H2-R03-1-Q4", "question": "第二次做这道菜时，他还要打电话吗？", "answer": "不用了", "options": ["不用了", "必须打三次", "先打给老师", "只能发短信"], "explanation": "Câu cuối khẳng định không cần gọi điện nữa."}, {"question": "“饭菜都做好了”强调什么？", "answer": "做饭已经完成", "options": ["做饭已经完成", "正在买菜", "以前吃过", "不想做饭"], "explanation": "好 là bổ ngữ kết quả: đã nấu xong.", "id": "H2-R03-1-Q5"}, {"question": "“想一想”和“尝尝”有什么共同作用？", "answer": "表示试一试，语气轻松", "options": ["表示试一试，语气轻松", "表示做错了", "表示必须做很多次", "表示时间很长"], "explanation": "Lặp động từ làm hành động ngắn, thử một chút, giọng nhẹ hơn.", "id": "H2-R03-1-Q6"}], "pinyin": "xīng qī liù xià wǔ ， xiǎo lín qǐng xiǎo yǔ lái jiā lǐ chī fàn 。 tā xiǎng zì jǐ zuò jǐ dào zhōng guó cài ， kě shì zhè shì dì yī cì ， xīn lǐ yǒu diǎn ér zháo jí 。 xiǎo yǔ lái le yǐ hòu ， xiān kàn le kàn cài dān ， rán hòu shuō ： “ nǐ xiān xǐ cài ， wǒ lái zuò tāng 。 bú huì de dì fāng ， wǒ men yì qǐ xiǎng yī xiǎng 。 ” xiǎo lín xǐ wán cài ， jiù gěi mā mā dǎ diàn huà ， zhōng yú tīng dǒng le zhè ge cài de zuò fǎ 。 wǎn shàng bā diǎn ， fàn cài dōu zuò hǎo le ， liǎng gè rén cái zuò xià lái chī fàn 。 xiǎo yǔ jué de tāng hěn hǎo hē ， jiù ràng xiǎo lín yě cháng cháng 。 tā men chī wán yǐ hòu ， xiān xiū xī xiū xī ， zài yì qǐ xǐ wǎn 。 suī rán zuò fàn yòng le bù shǎo shí jiān ， dàn shì dà jiā dōu hěn gāo xìng 。 dì èr tiān ， tā yòu shì zhe zuò le yī cì tóng yàng de cài ， zhè cì bù yòng dǎ diàn huà yě néng zuò hǎo le 。"}, {"id": "H2-R03-2", "lesson": 3, "title": "一起准备晚饭 · 小安", "text": "星期日下午，小安请小月来家里吃饭。他想自己做几道中国菜，可是这是第一次，心里有点儿着急。小月来了以后，先看了看菜单，然后说：“你先洗菜，我来做汤。不会的地方，我们一起想一想。”小安洗完菜，就给妈妈打电话，终于听懂了这个菜的做法。晚上九点，饭菜都做好了，两个人才坐下来吃饭。小月觉得汤很好喝，就让小安也尝尝。他们吃完以后，先休息休息，再一起洗碗。虽然做饭用了不少时间，但是大家都很高兴。朋友最喜欢的是那盘鱼，吃完以后，还请他把做法写下来。", "translation": "Chiều Chủ nhật, 小安 mời 小月 đến ăn và muốn tự nấu món Trung lần đầu. 小月 xem thực đơn, đề nghị 小安 rửa rau còn mình nấu canh. 小安 rửa xong gọi mẹ và cuối cùng hiểu cách làm. Lúc chín giờ tối đồ ăn xong họ mới ăn. Canh ngon nên 小月 mời bạn nếm thử. Ăn xong họ nghỉ một lát rồi cùng rửa bát. Tuy tốn thời gian nhưng cả hai rất vui. Bạn thích nhất đĩa cá, ăn xong còn nhờ cậu ghi cách làm.", "grammar": ["Bổ ngữ kết quả", "Lặp động từ AA / A一A", "ABAB"], "questions": [{"question": "谁先洗菜？", "answer": "小安", "options": ["小安", "小月", "妈妈", "老师"], "explanation": "Lời phân công nói 你先洗菜, người được nói là A.", "id": "H2-R03-2-Q1"}, {"question": "谁做汤？", "answer": "小月", "options": ["小月", "小安", "爸爸", "服务员"], "explanation": "B nói 我来做汤.", "id": "H2-R03-2-Q2"}, {"question": "小安为什么给妈妈打电话？", "answer": "问菜的做法", "options": ["问菜的做法", "借钱", "问车站在哪儿", "请妈妈买衣服"], "explanation": "Sau điện thoại cậu nghe hiểu cách làm món ăn.", "id": "H2-R03-2-Q3"}, {"id": "H2-R03-2-Q4", "question": "朋友请他写下什么？", "answer": "鱼的做法", "options": ["鱼的做法", "上课时间", "公交车站", "书店地址"], "explanation": "Bạn muốn ghi lại cách làm món cá."}, {"question": "“饭菜都做好了”强调什么？", "answer": "做饭已经完成", "options": ["做饭已经完成", "正在买菜", "以前吃过", "不想做饭"], "explanation": "好 là bổ ngữ kết quả: đã nấu xong.", "id": "H2-R03-2-Q5"}, {"question": "“想一想”和“尝尝”有什么共同作用？", "answer": "表示试一试，语气轻松", "options": ["表示试一试，语气轻松", "表示做错了", "表示必须做很多次", "表示时间很长"], "explanation": "Lặp động từ làm hành động ngắn, thử một chút, giọng nhẹ hơn.", "id": "H2-R03-2-Q6"}], "pinyin": "xīng qī rì xià wǔ ， xiǎo ān qǐng xiǎo yuè lái jiā lǐ chī fàn 。 tā xiǎng zì jǐ zuò jǐ dào zhōng guó cài ， kě shì zhè shì dì yī cì ， xīn lǐ yǒu diǎn ér zháo jí 。 xiǎo yuè lái le yǐ hòu ， xiān kàn le kàn cài dān ， rán hòu shuō ： “ nǐ xiān xǐ cài ， wǒ lái zuò tāng 。 bú huì de dì fāng ， wǒ men yì qǐ xiǎng yī xiǎng 。 ” xiǎo ān xǐ wán cài ， jiù gěi mā mā dǎ diàn huà ， zhōng yú tīng dǒng le zhè ge cài de zuò fǎ 。 wǎn shàng jiǔ diǎn ， fàn cài dōu zuò hǎo le ， liǎng gè rén cái zuò xià lái chī fàn 。 xiǎo yuè jué de tāng hěn hǎo hē ， jiù ràng xiǎo ān yě cháng cháng 。 tā men chī wán yǐ hòu ， xiān xiū xī xiū xī ， zài yì qǐ xǐ wǎn 。 suī rán zuò fàn yòng le bù shǎo shí jiān ， dàn shì dà jiā dōu hěn gāo xìng 。 péng yǒu zuì xǐ huān de shì nà pán yú ， chī wán yǐ hòu ， hái qǐng tā bǎ zuò fǎ xiě xià lái 。"}, {"id": "H2-R03-3", "lesson": 3, "title": "一起准备晚饭 · 小文", "text": "星期一下午，小文请小兰来家里吃饭。他想自己做几道中国菜，可是这是第一次，心里有点儿着急。小兰来了以后，先看了看菜单，然后说：“你先洗菜，我来做汤。不会的地方，我们一起想一想。”小文洗完菜，就给妈妈打电话，终于听懂了这个菜的做法。晚上十点，饭菜都做好了，两个人才坐下来吃饭。小兰觉得汤很好喝，就让小文也尝尝。他们吃完以后，先休息休息，再一起洗碗。虽然做饭用了不少时间，但是大家都很高兴。弟弟回来得很晚，饭已经有点儿凉了。他们又热了热，等弟弟一起吃。", "translation": "Chiều thứ Hai, 小文 mời 小兰 đến ăn và muốn tự nấu món Trung lần đầu. 小兰 xem thực đơn, đề nghị 小文 rửa rau còn mình nấu canh. 小文 rửa xong gọi mẹ và cuối cùng hiểu cách làm. Lúc mười giờ tối đồ ăn xong họ mới ăn. Canh ngon nên 小兰 mời bạn nếm thử. Ăn xong họ nghỉ một lát rồi cùng rửa bát. Tuy tốn thời gian nhưng cả hai rất vui. Em trai về muộn, cơm hơi nguội nên họ hâm lại để ăn cùng em.", "grammar": ["Bổ ngữ kết quả", "Lặp động từ AA / A一A", "ABAB"], "questions": [{"question": "谁先洗菜？", "answer": "小文", "options": ["小文", "小兰", "妈妈", "老师"], "explanation": "Lời phân công nói 你先洗菜, người được nói là A.", "id": "H2-R03-3-Q1"}, {"question": "谁做汤？", "answer": "小兰", "options": ["小兰", "小文", "爸爸", "服务员"], "explanation": "B nói 我来做汤.", "id": "H2-R03-3-Q2"}, {"question": "小文为什么给妈妈打电话？", "answer": "问菜的做法", "options": ["问菜的做法", "借钱", "问车站在哪儿", "请妈妈买衣服"], "explanation": "Sau điện thoại cậu nghe hiểu cách làm món ăn.", "id": "H2-R03-3-Q3"}, {"id": "H2-R03-3-Q4", "question": "饭凉了以后，他们怎么办？", "answer": "热了热再吃", "options": ["热了热再吃", "马上扔掉", "只喝冷水", "不让弟弟吃"], "explanation": "热了热 chỉ hâm lại một chút rồi ăn."}, {"question": "“饭菜都做好了”强调什么？", "answer": "做饭已经完成", "options": ["做饭已经完成", "正在买菜", "以前吃过", "不想做饭"], "explanation": "好 là bổ ngữ kết quả: đã nấu xong.", "id": "H2-R03-3-Q5"}, {"question": "“想一想”和“尝尝”有什么共同作用？", "answer": "表示试一试，语气轻松", "options": ["表示试一试，语气轻松", "表示做错了", "表示必须做很多次", "表示时间很长"], "explanation": "Lặp động từ làm hành động ngắn, thử một chút, giọng nhẹ hơn.", "id": "H2-R03-3-Q6"}], "pinyin": "xīng qī yī xià wǔ ， xiǎo wén qǐng xiǎo lán lái jiā lǐ chī fàn 。 tā xiǎng zì jǐ zuò jǐ dào zhōng guó cài ， kě shì zhè shì dì yī cì ， xīn lǐ yǒu diǎn ér zháo jí 。 xiǎo lán lái le yǐ hòu ， xiān kàn le kàn cài dān ， rán hòu shuō ： “ nǐ xiān xǐ cài ， wǒ lái zuò tāng 。 bú huì de dì fāng ， wǒ men yì qǐ xiǎng yī xiǎng 。 ” xiǎo wén xǐ wán cài ， jiù gěi mā mā dǎ diàn huà ， zhōng yú tīng dǒng le zhè ge cài de zuò fǎ 。 wǎn shàng shí diǎn ， fàn cài dōu zuò hǎo le ， liǎng gè rén cái zuò xià lái chī fàn 。 xiǎo lán jué de tāng hěn hǎo hē ， jiù ràng xiǎo wén yě cháng cháng 。 tā men chī wán yǐ hòu ， xiān xiū xī xiū xī ， zài yì qǐ xǐ wǎn 。 suī rán zuò fàn yòng le bù shǎo shí jiān ， dàn shì dà jiā dōu hěn gāo xìng 。 dì di huí lái de hěn wǎn ， fàn yǐ jīng yǒu diǎn ér liáng le 。 tā men yòu rè le rè ， děng dì di yì qǐ chī 。"}, {"id": "H2-R03-4", "lesson": 3, "title": "一起准备晚饭 · 小东", "text": "星期三下午，小东请小梅来家里吃饭。他想自己做几道中国菜，可是这是第一次，心里有点儿着急。小梅来了以后，先看了看菜单，然后说：“你先洗菜，我来做汤。不会的地方，我们一起想一想。”小东洗完菜，就给妈妈打电话，终于听懂了这个菜的做法。晚上七点半，饭菜都做好了，两个人才坐下来吃饭。小梅觉得汤很好喝，就让小东也尝尝。他们吃完以后，先休息休息，再一起洗碗。虽然做饭用了不少时间，但是大家都很高兴。汤里放的盐有点儿多，他们又加了一些水，尝过以后，味道好多了。", "translation": "Chiều thứ Tư, 小东 mời 小梅 đến ăn và muốn tự nấu món Trung lần đầu. 小梅 xem thực đơn, đề nghị 小东 rửa rau còn mình nấu canh. 小东 rửa xong gọi mẹ và cuối cùng hiểu cách làm. Lúc bảy giờ rưỡi tối đồ ăn xong họ mới ăn. Canh ngon nên 小梅 mời bạn nếm thử. Ăn xong họ nghỉ một lát rồi cùng rửa bát. Tuy tốn thời gian nhưng cả hai rất vui. Canh hơi nhiều muối nên họ thêm nước; nếm lại thấy vị ngon hơn nhiều.", "grammar": ["Bổ ngữ kết quả", "Lặp động từ AA / A一A", "ABAB"], "questions": [{"question": "谁先洗菜？", "answer": "小东", "options": ["小东", "小梅", "妈妈", "老师"], "explanation": "Lời phân công nói 你先洗菜, người được nói là A.", "id": "H2-R03-4-Q1"}, {"question": "谁做汤？", "answer": "小梅", "options": ["小梅", "小东", "爸爸", "服务员"], "explanation": "B nói 我来做汤.", "id": "H2-R03-4-Q2"}, {"question": "小东为什么给妈妈打电话？", "answer": "问菜的做法", "options": ["问菜的做法", "借钱", "问车站在哪儿", "请妈妈买衣服"], "explanation": "Sau điện thoại cậu nghe hiểu cách làm món ăn.", "id": "H2-R03-4-Q3"}, {"id": "H2-R03-4-Q4", "question": "他们怎样让汤的味道好一点儿？", "answer": "加了一些水", "options": ["加了一些水", "再加很多盐", "放进冰箱", "拿去卖"], "explanation": "Câu cuối nêu thêm nước để canh bớt mặn."}, {"question": "“饭菜都做好了”强调什么？", "answer": "做饭已经完成", "options": ["做饭已经完成", "正在买菜", "以前吃过", "不想做饭"], "explanation": "好 là bổ ngữ kết quả: đã nấu xong.", "id": "H2-R03-4-Q5"}, {"question": "“想一想”和“尝尝”有什么共同作用？", "answer": "表示试一试，语气轻松", "options": ["表示试一试，语气轻松", "表示做错了", "表示必须做很多次", "表示时间很长"], "explanation": "Lặp động từ làm hành động ngắn, thử một chút, giọng nhẹ hơn.", "id": "H2-R03-4-Q6"}], "pinyin": "xīng qī sān xià wǔ ， xiǎo dōng qǐng xiǎo méi lái jiā lǐ chī fàn 。 tā xiǎng zì jǐ zuò jǐ dào zhōng guó cài ， kě shì zhè shì dì yī cì ， xīn lǐ yǒu diǎn ér zháo jí 。 xiǎo méi lái le yǐ hòu ， xiān kàn le kàn cài dān ， rán hòu shuō ： “ nǐ xiān xǐ cài ， wǒ lái zuò tāng 。 bú huì de dì fāng ， wǒ men yì qǐ xiǎng yī xiǎng 。 ” xiǎo dōng xǐ wán cài ， jiù gěi mā mā dǎ diàn huà ， zhōng yú tīng dǒng le zhè ge cài de zuò fǎ 。 wǎn shàng qī diǎn bàn ， fàn cài dōu zuò hǎo le ， liǎng gè rén cái zuò xià lái chī fàn 。 xiǎo méi jué de tāng hěn hǎo hē ， jiù ràng xiǎo dōng yě cháng cháng 。 tā men chī wán yǐ hòu ， xiān xiū xī xiū xī ， zài yì qǐ xǐ wǎn 。 suī rán zuò fàn yòng le bù shǎo shí jiān ， dàn shì dà jiā dōu hěn gāo xìng 。 tāng lǐ fàng de yán yǒu diǎn ér duō ， tā men yòu jiā le yī xiē shuǐ ， cháng guò yǐ hòu ， wèi dào hǎo duō le 。"}, {"id": "H2-R03-5", "lesson": 3, "title": "一起准备晚饭 · 小明", "text": "星期五下午，小明请小雪来家里吃饭。他想自己做几道中国菜，可是这是第一次，心里有点儿着急。小雪来了以后，先看了看菜单，然后说：“你先洗菜，我来做汤。不会的地方，我们一起想一想。”小明洗完菜，就给妈妈打电话，终于听懂了这个菜的做法。晚上八点半，饭菜都做好了，两个人才坐下来吃饭。小雪觉得汤很好喝，就让小明也尝尝。他们吃完以后，先休息休息，再一起洗碗。虽然做饭用了不少时间，但是大家都很高兴。妈妈回来以后尝了尝，觉得他们做得不错，就请他们下周再做一次。", "translation": "Chiều thứ Sáu, 小明 mời 小雪 đến ăn và muốn tự nấu món Trung lần đầu. 小雪 xem thực đơn, đề nghị 小明 rửa rau còn mình nấu canh. 小明 rửa xong gọi mẹ và cuối cùng hiểu cách làm. Lúc tám giờ rưỡi tối đồ ăn xong họ mới ăn. Canh ngon nên 小雪 mời bạn nếm thử. Ăn xong họ nghỉ một lát rồi cùng rửa bát. Tuy tốn thời gian nhưng cả hai rất vui. Mẹ về nếm thử, thấy họ nấu khá ngon nên nhờ tuần sau làm thêm một lần.", "grammar": ["Bổ ngữ kết quả", "Lặp động từ AA / A一A", "ABAB"], "questions": [{"question": "谁先洗菜？", "answer": "小明", "options": ["小明", "小雪", "妈妈", "老师"], "explanation": "Lời phân công nói 你先洗菜, người được nói là A.", "id": "H2-R03-5-Q1"}, {"question": "谁做汤？", "answer": "小雪", "options": ["小雪", "小明", "爸爸", "服务员"], "explanation": "B nói 我来做汤.", "id": "H2-R03-5-Q2"}, {"question": "小明为什么给妈妈打电话？", "answer": "问菜的做法", "options": ["问菜的做法", "借钱", "问车站在哪儿", "请妈妈买衣服"], "explanation": "Sau điện thoại cậu nghe hiểu cách làm món ăn.", "id": "H2-R03-5-Q3"}, {"id": "H2-R03-5-Q4", "question": "妈妈希望他们什么时候再做一次？", "answer": "下周", "options": ["下周", "今天半夜", "明年", "前年"], "explanation": "Người mẹ nhờ làm lại vào tuần sau."}, {"question": "“饭菜都做好了”强调什么？", "answer": "做饭已经完成", "options": ["做饭已经完成", "正在买菜", "以前吃过", "不想做饭"], "explanation": "好 là bổ ngữ kết quả: đã nấu xong.", "id": "H2-R03-5-Q5"}, {"question": "“想一想”和“尝尝”有什么共同作用？", "answer": "表示试一试，语气轻松", "options": ["表示试一试，语气轻松", "表示做错了", "表示必须做很多次", "表示时间很长"], "explanation": "Lặp động từ làm hành động ngắn, thử một chút, giọng nhẹ hơn.", "id": "H2-R03-5-Q6"}], "pinyin": "xīng qī wǔ xià wǔ ， xiǎo míng qǐng xiǎo xuě lái jiā lǐ chī fàn 。 tā xiǎng zì jǐ zuò jǐ dào zhōng guó cài ， kě shì zhè shì dì yī cì ， xīn lǐ yǒu diǎn ér zháo jí 。 xiǎo xuě lái le yǐ hòu ， xiān kàn le kàn cài dān ， rán hòu shuō ： “ nǐ xiān xǐ cài ， wǒ lái zuò tāng 。 bú huì de dì fāng ， wǒ men yì qǐ xiǎng yī xiǎng 。 ” xiǎo míng xǐ wán cài ， jiù gěi mā mā dǎ diàn huà ， zhōng yú tīng dǒng le zhè ge cài de zuò fǎ 。 wǎn shàng bā diǎn bàn ， fàn cài dōu zuò hǎo le ， liǎng gè rén cái zuò xià lái chī fàn 。 xiǎo xuě jué de tāng hěn hǎo hē ， jiù ràng xiǎo míng yě cháng cháng 。 tā men chī wán yǐ hòu ， xiān xiū xī xiū xī ， zài yì qǐ xǐ wǎn 。 suī rán zuò fàn yòng le bù shǎo shí jiān ， dàn shì dà jiā dōu hěn gāo xìng 。 mā mā huí lái yǐ hòu cháng le cháng ， jué de tā men zuò de bù cuò ， jiù qǐng tā men xià zhōu zài zuò yī cì 。"}, {"id": "H2-R04-1", "lesson": 4, "title": "在商场选衣服 · 小林", "text": "星期六，小林和小雨一起去商场买衣服。小林以前来过这里，但是小雨没来过。他们先走进一家小店，看见了红色的、绿色的和黑色的外套。小雨想买黑色的，因为他工作的时候常常穿黑衣服。服务员拿来一件，但是有点儿大，又给他换了一件小的。小雨试过以后觉得很合适，价格是二十块钱。他们买好衣服才去吃午饭。因为下午还有课，所以没有继续逛商场。回家的路上，小林说下次想带妈妈一起来。第二天穿着新衣服上课时，同学们都说颜色很好看，他也更有信心了。", "translation": "thứ Bảy, 小林 và 小雨 đi mua quần áo. 小林 từng đến đây còn 小雨 chưa từng. Cửa hàng có áo khoác đỏ, xanh lá, đen. 小雨 muốn màu đen vì thường mặc màu này khi làm việc. Chiếc đầu hơi rộng nên nhân viên đổi chiếc nhỏ hơn. Thử xong bạn thấy vừa, giá hai mươi tệ. Mua xong họ đi ăn trưa; vì chiều có lớp nên không mua sắm tiếp. 小林 muốn lần sau đưa mẹ đến. Hôm sau mặc áo mới đi học, các bạn khen màu đẹp khiến cậu tự tin hơn.", "grammar": ["过", "因为……所以……", "Cụm 的"], "questions": [{"question": "谁以前没来过这个商场？", "answer": "小雨", "options": ["小雨", "小林", "两个人都来过", "服务员"], "explanation": "Văn bản nói B 没来过.", "id": "H2-R04-1-Q1"}, {"question": "他最后买了什么颜色的外套？", "answer": "黑色的", "options": ["黑色的", "红色的", "绿色的", "白色的"], "explanation": "B chọn đen vì thường mặc khi làm việc.", "id": "H2-R04-1-Q2"}, {"question": "第一件外套为什么要换？", "answer": "有点儿大", "options": ["有点儿大", "太小", "太贵", "颜色不对"], "explanation": "Chiếc đầu được mô tả 有点儿大.", "id": "H2-R04-1-Q3"}, {"id": "H2-R04-1-Q4", "question": "同学们觉得新衣服怎么样？", "answer": "颜色好看", "options": ["颜色好看", "太旧了", "特别脏", "没有颜色"], "explanation": "Các bạn khen màu đẹp, không nói các nhận xét khác."}, {"question": "“来过”中的“过”表示什么？", "answer": "以前有这样的经历", "options": ["以前有这样的经历", "正在来", "马上要来", "必须来"], "explanation": "过 diễn tả trải nghiệm đã từng xảy ra.", "id": "H2-R04-1-Q5"}, {"question": "“一件小的”里的“小的”指什么？", "answer": "小一点儿的外套", "options": ["小一点儿的外套", "小朋友", "小饭馆", "小商场"], "explanation": "Danh từ 外套 được lược bỏ vì ngữ cảnh đã rõ.", "id": "H2-R04-1-Q6"}], "pinyin": "xīng qī liù ， xiǎo lín hé xiǎo yǔ yì qǐ qù shāng chǎng mǎi yī fú 。 xiǎo lín yǐ qián lái guò zhè lǐ ， dàn shì xiǎo yǔ méi lái guò 。 tā men xiān zǒu jìn yī jiā xiǎo diàn ， kàn jiàn le hóng sè de 、 lǜ sè de hé hēi sè de wài tào 。 xiǎo yǔ xiǎng mǎi hēi sè de ， yīn wèi tā gōng zuò de shí hòu cháng cháng chuān hēi yī fú 。 fú wù yuán ná lái yī jiàn ， dàn shì yǒu diǎn ér dà ， yòu gěi tā huàn le yī jiàn xiǎo de 。 xiǎo yǔ shì guò yǐ hòu jué de hěn hé shì ， jià gé shì èr shí kuài qián 。 tā men mǎi hǎo yī fú cái qù chī wǔ fàn 。 yīn wèi xià wǔ hái yǒu kè ， suǒ yǐ méi yǒu jì xù guàng shāng chǎng 。 huí jiā de lù shàng ， xiǎo lín shuō xià cì xiǎng dài mā mā yì qǐ lái 。 dì èr tiān chuān zhe xīn yī fú shàng kè shí ， tóng xué men dōu shuō yán sè hěn hǎo kàn ， tā yě gèng yǒu xìn xīn le 。"}, {"id": "H2-R04-2", "lesson": 4, "title": "在商场选衣服 · 小安", "text": "星期日，小安和小月一起去商场买衣服。小安以前来过这里，但是小月没来过。他们先走进一家小店，看见了红色的、绿色的和黑色的外套。小月想买黑色的，因为他工作的时候常常穿黑衣服。服务员拿来一件，但是有点儿大，又给他换了一件小的。小月试过以后觉得很合适，价格是三十块钱。他们买好衣服才去吃午饭。因为下午还有课，所以没有继续逛商场。回家的路上，小安说下次想带妈妈一起来。回家后他发现衣服上少了一颗扣子，第二天又去店里，请店员帮忙换好。", "translation": "Chủ nhật, 小安 và 小月 đi mua quần áo. 小安 từng đến đây còn 小月 chưa từng. Cửa hàng có áo khoác đỏ, xanh lá, đen. 小月 muốn màu đen vì thường mặc màu này khi làm việc. Chiếc đầu hơi rộng nên nhân viên đổi chiếc nhỏ hơn. Thử xong bạn thấy vừa, giá ba mươi tệ. Mua xong họ đi ăn trưa; vì chiều có lớp nên không mua sắm tiếp. 小安 muốn lần sau đưa mẹ đến. Về nhà cậu phát hiện thiếu một chiếc cúc nên hôm sau đến quán nhờ nhân viên đổi cho ổn.", "grammar": ["过", "因为……所以……", "Cụm 的"], "questions": [{"question": "谁以前没来过这个商场？", "answer": "小月", "options": ["小月", "小安", "两个人都来过", "服务员"], "explanation": "Văn bản nói B 没来过.", "id": "H2-R04-2-Q1"}, {"question": "他最后买了什么颜色的外套？", "answer": "黑色的", "options": ["黑色的", "红色的", "绿色的", "白色的"], "explanation": "B chọn đen vì thường mặc khi làm việc.", "id": "H2-R04-2-Q2"}, {"question": "第一件外套为什么要换？", "answer": "有点儿大", "options": ["有点儿大", "太小", "太贵", "颜色不对"], "explanation": "Chiếc đầu được mô tả 有点儿大.", "id": "H2-R04-2-Q3"}, {"id": "H2-R04-2-Q4", "question": "他为什么第二天又去店里？", "answer": "衣服少了一颗扣子", "options": ["衣服少了一颗扣子", "想买水果", "忘了吃饭", "找不到学校"], "explanation": "Nguyên nhân quay lại là thiếu cúc áo."}, {"question": "“来过”中的“过”表示什么？", "answer": "以前有这样的经历", "options": ["以前有这样的经历", "正在来", "马上要来", "必须来"], "explanation": "过 diễn tả trải nghiệm đã từng xảy ra.", "id": "H2-R04-2-Q5"}, {"question": "“一件小的”里的“小的”指什么？", "answer": "小一点儿的外套", "options": ["小一点儿的外套", "小朋友", "小饭馆", "小商场"], "explanation": "Danh từ 外套 được lược bỏ vì ngữ cảnh đã rõ.", "id": "H2-R04-2-Q6"}], "pinyin": "xīng qī rì ， xiǎo ān hé xiǎo yuè yì qǐ qù shāng chǎng mǎi yī fú 。 xiǎo ān yǐ qián lái guò zhè lǐ ， dàn shì xiǎo yuè méi lái guò 。 tā men xiān zǒu jìn yī jiā xiǎo diàn ， kàn jiàn le hóng sè de 、 lǜ sè de hé hēi sè de wài tào 。 xiǎo yuè xiǎng mǎi hēi sè de ， yīn wèi tā gōng zuò de shí hòu cháng cháng chuān hēi yī fú 。 fú wù yuán ná lái yī jiàn ， dàn shì yǒu diǎn ér dà ， yòu gěi tā huàn le yī jiàn xiǎo de 。 xiǎo yuè shì guò yǐ hòu jué de hěn hé shì ， jià gé shì sān shí kuài qián 。 tā men mǎi hǎo yī fú cái qù chī wǔ fàn 。 yīn wèi xià wǔ hái yǒu kè ， suǒ yǐ méi yǒu jì xù guàng shāng chǎng 。 huí jiā de lù shàng ， xiǎo ān shuō xià cì xiǎng dài mā mā yì qǐ lái 。 huí jiā hòu tā fā xiàn yī fú shàng shǎo le yī kē kòu zi ， dì èr tiān yòu qù diàn lǐ ， qǐng diàn yuán bāng máng huàn hǎo 。"}, {"id": "H2-R04-3", "lesson": 4, "title": "在商场选衣服 · 小文", "text": "星期一，小文和小兰一起去商场买衣服。小文以前来过这里，但是小兰没来过。他们先走进一家小店，看见了红色的、绿色的和黑色的外套。小兰想买黑色的，因为他工作的时候常常穿黑衣服。服务员拿来一件，但是有点儿大，又给他换了一件小的。小兰试过以后觉得很合适，价格是四十块钱。他们买好衣服才去吃午饭。因为下午还有课，所以没有继续逛商场。回家的路上，小文说下次想带妈妈一起来。妈妈看了看，说这件衣服很合适，还请他下次帮爸爸也选一件。", "translation": "thứ Hai, 小文 và 小兰 đi mua quần áo. 小文 từng đến đây còn 小兰 chưa từng. Cửa hàng có áo khoác đỏ, xanh lá, đen. 小兰 muốn màu đen vì thường mặc màu này khi làm việc. Chiếc đầu hơi rộng nên nhân viên đổi chiếc nhỏ hơn. Thử xong bạn thấy vừa, giá bốn mươi tệ. Mua xong họ đi ăn trưa; vì chiều có lớp nên không mua sắm tiếp. 小文 muốn lần sau đưa mẹ đến. Mẹ xem và thấy rất hợp, còn nhờ lần sau chọn giúp bố một chiếc.", "grammar": ["过", "因为……所以……", "Cụm 的"], "questions": [{"question": "谁以前没来过这个商场？", "answer": "小兰", "options": ["小兰", "小文", "两个人都来过", "服务员"], "explanation": "Văn bản nói B 没来过.", "id": "H2-R04-3-Q1"}, {"question": "他最后买了什么颜色的外套？", "answer": "黑色的", "options": ["黑色的", "红色的", "绿色的", "白色的"], "explanation": "B chọn đen vì thường mặc khi làm việc.", "id": "H2-R04-3-Q2"}, {"question": "第一件外套为什么要换？", "answer": "有点儿大", "options": ["有点儿大", "太小", "太贵", "颜色不对"], "explanation": "Chiếc đầu được mô tả 有点儿大.", "id": "H2-R04-3-Q3"}, {"id": "H2-R04-3-Q4", "question": "妈妈希望下次给谁选衣服？", "answer": "爸爸", "options": ["爸爸", "老师", "司机", "校长"], "explanation": "Mẹ nhờ chọn áo cho bố."}, {"question": "“来过”中的“过”表示什么？", "answer": "以前有这样的经历", "options": ["以前有这样的经历", "正在来", "马上要来", "必须来"], "explanation": "过 diễn tả trải nghiệm đã từng xảy ra.", "id": "H2-R04-3-Q5"}, {"question": "“一件小的”里的“小的”指什么？", "answer": "小一点儿的外套", "options": ["小一点儿的外套", "小朋友", "小饭馆", "小商场"], "explanation": "Danh từ 外套 được lược bỏ vì ngữ cảnh đã rõ.", "id": "H2-R04-3-Q6"}], "pinyin": "xīng qī yī ， xiǎo wén hé xiǎo lán yì qǐ qù shāng chǎng mǎi yī fú 。 xiǎo wén yǐ qián lái guò zhè lǐ ， dàn shì xiǎo lán méi lái guò 。 tā men xiān zǒu jìn yī jiā xiǎo diàn ， kàn jiàn le hóng sè de 、 lǜ sè de hé hēi sè de wài tào 。 xiǎo lán xiǎng mǎi hēi sè de ， yīn wèi tā gōng zuò de shí hòu cháng cháng chuān hēi yī fú 。 fú wù yuán ná lái yī jiàn ， dàn shì yǒu diǎn ér dà ， yòu gěi tā huàn le yī jiàn xiǎo de 。 xiǎo lán shì guò yǐ hòu jué de hěn hé shì ， jià gé shì sì shí kuài qián 。 tā men mǎi hǎo yī fú cái qù chī wǔ fàn 。 yīn wèi xià wǔ hái yǒu kè ， suǒ yǐ méi yǒu jì xù guàng shāng chǎng 。 huí jiā de lù shàng ， xiǎo wén shuō xià cì xiǎng dài mā mā yì qǐ lái 。 mā mā kàn le kàn ， shuō zhè jiàn yī fú hěn hé shì ， hái qǐng tā xià cì bāng bà bà yě xuǎn yī jiàn 。"}, {"id": "H2-R04-4", "lesson": 4, "title": "在商场选衣服 · 小东", "text": "星期三，小东和小梅一起去商场买衣服。小东以前来过这里，但是小梅没来过。他们先走进一家小店，看见了红色的、绿色的和黑色的外套。小梅想买黑色的，因为他工作的时候常常穿黑衣服。服务员拿来一件，但是有点儿大，又给他换了一件小的。小梅试过以后觉得很合适，价格是五十块钱。他们买好衣服才去吃午饭。因为下午还有课，所以没有继续逛商场。回家的路上，小东说下次想带妈妈一起来。洗过一次以后，衣服的颜色没有变。他觉得虽然不是最贵的，但是很值得买。", "translation": "thứ Tư, 小东 và 小梅 đi mua quần áo. 小东 từng đến đây còn 小梅 chưa từng. Cửa hàng có áo khoác đỏ, xanh lá, đen. 小梅 muốn màu đen vì thường mặc màu này khi làm việc. Chiếc đầu hơi rộng nên nhân viên đổi chiếc nhỏ hơn. Thử xong bạn thấy vừa, giá năm mươi tệ. Mua xong họ đi ăn trưa; vì chiều có lớp nên không mua sắm tiếp. 小东 muốn lần sau đưa mẹ đến. Giặt một lần màu không đổi, cậu thấy dù không đắt nhất nhưng đáng mua.", "grammar": ["过", "因为……所以……", "Cụm 的"], "questions": [{"question": "谁以前没来过这个商场？", "answer": "小梅", "options": ["小梅", "小东", "两个人都来过", "服务员"], "explanation": "Văn bản nói B 没来过.", "id": "H2-R04-4-Q1"}, {"question": "他最后买了什么颜色的外套？", "answer": "黑色的", "options": ["黑色的", "红色的", "绿色的", "白色的"], "explanation": "B chọn đen vì thường mặc khi làm việc.", "id": "H2-R04-4-Q2"}, {"question": "第一件外套为什么要换？", "answer": "有点儿大", "options": ["有点儿大", "太小", "太贵", "颜色不对"], "explanation": "Chiếc đầu được mô tả 有点儿大.", "id": "H2-R04-4-Q3"}, {"id": "H2-R04-4-Q4", "question": "洗过一次以后，衣服的颜色怎么样？", "answer": "没有变", "options": ["没有变", "变成白色", "变成绿色", "变得很难看"], "explanation": "Sau khi giặt, màu không thay đổi."}, {"question": "“来过”中的“过”表示什么？", "answer": "以前有这样的经历", "options": ["以前有这样的经历", "正在来", "马上要来", "必须来"], "explanation": "过 diễn tả trải nghiệm đã từng xảy ra.", "id": "H2-R04-4-Q5"}, {"question": "“一件小的”里的“小的”指什么？", "answer": "小一点儿的外套", "options": ["小一点儿的外套", "小朋友", "小饭馆", "小商场"], "explanation": "Danh từ 外套 được lược bỏ vì ngữ cảnh đã rõ.", "id": "H2-R04-4-Q6"}], "pinyin": "xīng qī sān ， xiǎo dōng hé xiǎo méi yì qǐ qù shāng chǎng mǎi yī fú 。 xiǎo dōng yǐ qián lái guò zhè lǐ ， dàn shì xiǎo méi méi lái guò 。 tā men xiān zǒu jìn yī jiā xiǎo diàn ， kàn jiàn le hóng sè de 、 lǜ sè de hé hēi sè de wài tào 。 xiǎo méi xiǎng mǎi hēi sè de ， yīn wèi tā gōng zuò de shí hòu cháng cháng chuān hēi yī fú 。 fú wù yuán ná lái yī jiàn ， dàn shì yǒu diǎn ér dà ， yòu gěi tā huàn le yī jiàn xiǎo de 。 xiǎo méi shì guò yǐ hòu jué de hěn hé shì ， jià gé shì wǔ shí kuài qián 。 tā men mǎi hǎo yī fú cái qù chī wǔ fàn 。 yīn wèi xià wǔ hái yǒu kè ， suǒ yǐ méi yǒu jì xù guàng shāng chǎng 。 huí jiā de lù shàng ， xiǎo dōng shuō xià cì xiǎng dài mā mā yì qǐ lái 。 xǐ guò yī cì yǐ hòu ， yī fú de yán sè méi yǒu biàn 。 tā jué de suī rán bú shì zuì guì de ， dàn shì hěn zhí de mǎi 。"}, {"id": "H2-R04-5", "lesson": 4, "title": "在商场选衣服 · 小明", "text": "星期五，小明和小雪一起去商场买衣服。小明以前来过这里，但是小雪没来过。他们先走进一家小店，看见了红色的、绿色的和黑色的外套。小雪想买黑色的，因为他工作的时候常常穿黑衣服。服务员拿来一件，但是有点儿大，又给他换了一件小的。小雪试过以后觉得很合适，价格是六十块钱。他们买好衣服才去吃午饭。因为下午还有课，所以没有继续逛商场。回家的路上，小明说下次想带妈妈一起来。后来他又给弟弟选了一件外套，准备回家以后送给弟弟。", "translation": "thứ Sáu, 小明 và 小雪 đi mua quần áo. 小明 từng đến đây còn 小雪 chưa từng. Cửa hàng có áo khoác đỏ, xanh lá, đen. 小雪 muốn màu đen vì thường mặc màu này khi làm việc. Chiếc đầu hơi rộng nên nhân viên đổi chiếc nhỏ hơn. Thử xong bạn thấy vừa, giá sáu mươi tệ. Mua xong họ đi ăn trưa; vì chiều có lớp nên không mua sắm tiếp. 小明 muốn lần sau đưa mẹ đến. Sau đó cậu chọn thêm một chiếc áo khoác để về nhà tặng em trai.", "grammar": ["过", "因为……所以……", "Cụm 的"], "questions": [{"question": "谁以前没来过这个商场？", "answer": "小雪", "options": ["小雪", "小明", "两个人都来过", "服务员"], "explanation": "Văn bản nói B 没来过.", "id": "H2-R04-5-Q1"}, {"question": "他最后买了什么颜色的外套？", "answer": "黑色的", "options": ["黑色的", "红色的", "绿色的", "白色的"], "explanation": "B chọn đen vì thường mặc khi làm việc.", "id": "H2-R04-5-Q2"}, {"question": "第一件外套为什么要换？", "answer": "有点儿大", "options": ["有点儿大", "太小", "太贵", "颜色不对"], "explanation": "Chiếc đầu được mô tả 有点儿大.", "id": "H2-R04-5-Q3"}, {"id": "H2-R04-5-Q4", "question": "后来又买的那件外套是给谁的？", "answer
