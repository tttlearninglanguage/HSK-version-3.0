林拿着什么？", "answer": "一袋苹果", "options": ["一袋苹果", "一本故事书", "一瓶药水", "一张车票"], "explanation": "Câu thứ hai nêu A cầm táo.", "id": "H2-R11-1-Q1"}, {"question": "他们到的时候，门是什么状态？", "answer": "开着", "options": ["开着", "关着", "锁着", "文中没说"], "explanation": "门开着 nói cửa đang mở.", "id": "H2-R11-1-Q2"}, {"question": "生病的同学最想做什么？", "answer": "回学校上课", "options": ["回学校上课", "去旅游", "买新衣服", "看电影"], "explanation": "Người bạn nói 最想早点儿回学校.", "id": "H2-R11-1-Q3"}, {"id": "H2-R11-1-Q4", "question": "医生提出了什么建议？", "answer": "好好休息", "options": ["好好休息", "马上爬山", "天天熬夜", "不喝水"], "explanation": "Bác sĩ khuyên nghỉ ngơi đầy đủ."}, {"question": "“拿着”“开着”中的“着”表示什么？", "answer": "动作或状态持续着", "options": ["动作或状态持续着", "已经结束很久", "一共做了三次", "明天才能做"], "explanation": "着 chỉ trạng thái được duy trì ở thời điểm mô tả.", "id": "H2-R11-1-Q5"}, {"question": "为什么他们没有待很久？", "answer": "同学需要休息", "options": ["同学需要休息", "都不喜欢故事", "医院要搬家", "苹果没有了"], "explanation": "Câu 因为病人需要休息 nêu nguyên nhân trực tiếp.", "id": "H2-R11-1-Q6"}], "pinyin": "xīng qī liù xià wǔ ， xiǎo lín hé xiǎo yǔ qù kàn shēng bìng de tóng xué 。 xiǎo lín shǒu lǐ ná zhe yī dài píng guǒ ， xiǎo yǔ ná zhe yī běn gù shì shū 。 tā men dào de shí hòu ， fáng jiān de mén kāi zhe ， tóng xué zhèng zuò zài chuáng biān hē shuǐ 。 suī rán liǎn sè bù tài hǎo ， dàn shì tā shuō chī le yào yǐ hòu yǐ jīng shū fú duō le 。 xiǎo lín wèn ： “ nǐ zuì xiǎng zuò shén me ？ ” tóng xué shuō ： “ wǒ zuì xiǎng zǎo diǎn ér huí xué xiào ， hé dà jiā yì qǐ shàng kè 。 ” xiǎo yǔ jiù zuò zài páng biān ， gěi tā jiǎng le jīn tiān kè táng shàng de yí gè xiǎo gù shì 。 tā men zhǐ dài le bàn gè xiǎo shí ， yīn wèi bìng rén xū yào xiū xī 。 zǒu de shí hòu ， dà jiā xiào zhe shuō míng tiān zài lái 。 dì èr tiān tā néng xià chuáng zǒu yī huì er le ， yī shēng shuō ， zhǐ yào hǎo hǎo xiū xī ， hěn kuài jiù néng huí xué xiào 。"}, {"id": "H2-R11-2", "lesson": 11, "title": "去看生病的同学 · 小安", "text": "星期日下午，小安和小月去看生病的同学。小安手里拿着一袋苹果，小月拿着一本故事书。他们到的时候，房间的门开着，同学正坐在床边喝水。虽然脸色不太好，但是他说吃了药以后已经舒服多了。小安问：“你最想做什么？”同学说：“我最想早点儿回学校，和大家一起上课。”小月就坐在旁边，给他讲了今天课堂上的一个小故事。他们只待了半个小时，因为病人需要休息。走的时候，大家笑着说明天再来。朋友们还给他带来了课堂笔记，他有精神的时候就看一点儿，不用一直学习。", "translation": "Chiều Chủ nhật, 小安 và 小月 thăm bạn bị ốm. 小安 cầm táo, 小月 cầm truyện. Cửa mở, người bạn ngồi bên giường uống nước. Tuy sắc mặt chưa tốt nhưng uống thuốc xong đã dễ chịu hơn. Bạn muốn nhất là sớm về trường học cùng mọi người. 小月 ngồi cạnh kể chuyện trên lớp. Họ chỉ ở nửa giờ vì người bệnh cần nghỉ, ra về cười nói mai lại đến. Các bạn còn mang ghi chép trên lớp; khi khỏe cậu đọc một ít, không cần học liên tục.", "grammar": ["着", "V1着V2", "最"], "questions": [{"question": "小安拿着什么？", "answer": "一袋苹果", "options": ["一袋苹果", "一本故事书", "一瓶药水", "一张车票"], "explanation": "Câu thứ hai nêu A cầm táo.", "id": "H2-R11-2-Q1"}, {"question": "他们到的时候，门是什么状态？", "answer": "开着", "options": ["开着", "关着", "锁着", "文中没说"], "explanation": "门开着 nói cửa đang mở.", "id": "H2-R11-2-Q2"}, {"question": "生病的同学最想做什么？", "answer": "回学校上课", "options": ["回学校上课", "去旅游", "买新衣服", "看电影"], "explanation": "Người bạn nói 最想早点儿回学校.", "id": "H2-R11-2-Q3"}, {"id": "H2-R11-2-Q4", "question": "朋友们还带来了什么学习材料？", "answer": "课堂笔记", "options": ["课堂笔记", "火车票", "银行广告", "菜单"], "explanation": "Tài liệu được mang đến là ghi chép trên lớp."}, {"question": "“拿着”“开着”中的“着”表示什么？", "answer": "动作或状态持续着", "options": ["动作或状态持续着", "已经结束很久", "一共做了三次", "明天才能做"], "explanation": "着 chỉ trạng thái được duy trì ở thời điểm mô tả.", "id": "H2-R11-2-Q5"}, {"question": "为什么他们没有待很久？", "answer": "同学需要休息", "options": ["同学需要休息", "都不喜欢故事", "医院要搬家", "苹果没有了"], "explanation": "Câu 因为病人需要休息 nêu nguyên nhân trực tiếp.", "id": "H2-R11-2-Q6"}], "pinyin": "xīng qī rì xià wǔ ， xiǎo ān hé xiǎo yuè qù kàn shēng bìng de tóng xué 。 xiǎo ān shǒu lǐ ná zhe yī dài píng guǒ ， xiǎo yuè ná zhe yī běn gù shì shū 。 tā men dào de shí hòu ， fáng jiān de mén kāi zhe ， tóng xué zhèng zuò zài chuáng biān hē shuǐ 。 suī rán liǎn sè bù tài hǎo ， dàn shì tā shuō chī le yào yǐ hòu yǐ jīng shū fú duō le 。 xiǎo ān wèn ： “ nǐ zuì xiǎng zuò shén me ？ ” tóng xué shuō ： “ wǒ zuì xiǎng zǎo diǎn ér huí xué xiào ， hé dà jiā yì qǐ shàng kè 。 ” xiǎo yuè jiù zuò zài páng biān ， gěi tā jiǎng le jīn tiān kè táng shàng de yí gè xiǎo gù shì 。 tā men zhǐ dài le bàn gè xiǎo shí ， yīn wèi bìng rén xū yào xiū xī 。 zǒu de shí hòu ， dà jiā xiào zhe shuō míng tiān zài lái 。 péng yǒu men huán gěi tā dài lái le kè táng bǐ jì ， tā yǒu jīng shén de shí hòu jiù kàn yì diǎn ér ， bù yòng yì zhí xué xí 。"}, {"id": "H2-R11-3", "lesson": 11, "title": "去看生病的同学 · 小文", "text": "星期一下午，小文和小兰去看生病的同学。小文手里拿着一袋苹果，小兰拿着一本故事书。他们到的时候，房间的门开着，同学正坐在床边喝水。虽然脸色不太好，但是他说吃了药以后已经舒服多了。小文问：“你最想做什么？”同学说：“我最想早点儿回学校，和大家一起上课。”小兰就坐在旁边，给他讲了今天课堂上的一个小故事。他们只待了半个小时，因为病人需要休息。走的时候，大家笑着说明天再来。他说最想念学校里的小花园，因为平时每天中午都会在那里走走。", "translation": "Chiều thứ Hai, 小文 và 小兰 thăm bạn bị ốm. 小文 cầm táo, 小兰 cầm truyện. Cửa mở, người bạn ngồi bên giường uống nước. Tuy sắc mặt chưa tốt nhưng uống thuốc xong đã dễ chịu hơn. Bạn muốn nhất là sớm về trường học cùng mọi người. 小兰 ngồi cạnh kể chuyện trên lớp. Họ chỉ ở nửa giờ vì người bệnh cần nghỉ, ra về cười nói mai lại đến. Cậu nói nhớ nhất vườn hoa nhỏ trong trường vì bình thường trưa nào cũng đi dạo ở đó.", "grammar": ["着", "V1着V2", "最"], "questions": [{"question": "小文拿着什么？", "answer": "一袋苹果", "options": ["一袋苹果", "一本故事书", "一瓶药水", "一张车票"], "explanation": "Câu thứ hai nêu A cầm táo.", "id": "H2-R11-3-Q1"}, {"question": "他们到的时候，门是什么状态？", "answer": "开着", "options": ["开着", "关着", "锁着", "文中没说"], "explanation": "门开着 nói cửa đang mở.", "id": "H2-R11-3-Q2"}, {"question": "生病的同学最想做什么？", "answer": "回学校上课", "options": ["回学校上课", "去旅游", "买新衣服", "看电影"], "explanation": "Người bạn nói 最想早点儿回学校.", "id": "H2-R11-3-Q3"}, {"id": "H2-R11-3-Q4", "question": "他平时中午喜欢在哪里走走？", "answer": "学校的小花园", "options": ["学校的小花园", "机场入口", "商场三楼", "医院门口"], "explanation": "Cậu thường đi dạo ở vườn hoa của trường."}, {"question": "“拿着”“开着”中的“着”表示什么？", "answer": "动作或状态持续着", "options": ["动作或状态持续着", "已经结束很久", "一共做了三次", "明天才能做"], "explanation": "着 chỉ trạng thái được duy trì ở thời điểm mô tả.", "id": "H2-R11-3-Q5"}, {"question": "为什么他们没有待很久？", "answer": "同学需要休息", "options": ["同学需要休息", "都不喜欢故事", "医院要搬家", "苹果没有了"], "explanation": "Câu 因为病人需要休息 nêu nguyên nhân trực tiếp.", "id": "H2-R11-3-Q6"}], "pinyin": "xīng qī yī xià wǔ ， xiǎo wén hé xiǎo lán qù kàn shēng bìng de tóng xué 。 xiǎo wén shǒu lǐ ná zhe yī dài píng guǒ ， xiǎo lán ná zhe yī běn gù shì shū 。 tā men dào de shí hòu ， fáng jiān de mén kāi zhe ， tóng xué zhèng zuò zài chuáng biān hē shuǐ 。 suī rán liǎn sè bù tài hǎo ， dàn shì tā shuō chī le yào yǐ hòu yǐ jīng shū fú duō le 。 xiǎo wén wèn ： “ nǐ zuì xiǎng zuò shén me ？ ” tóng xué shuō ： “ wǒ zuì xiǎng zǎo diǎn ér huí xué xiào ， hé dà jiā yì qǐ shàng kè 。 ” xiǎo lán jiù zuò zài páng biān ， gěi tā jiǎng le jīn tiān kè táng shàng de yí gè xiǎo gù shì 。 tā men zhǐ dài le bàn gè xiǎo shí ， yīn wèi bìng rén xū yào xiū xī 。 zǒu de shí hòu ， dà jiā xiào zhe shuō míng tiān zài lái 。 tā shuō zuì xiǎng niàn xué xiào lǐ de xiǎo huā yuán ， yīn wèi píng shí měi tiān zhōng wǔ dū huì zài nà lǐ zǒu zǒu 。"}, {"id": "H2-R11-4", "lesson": 11, "title": "去看生病的同学 · 小东", "text": "星期三下午，小东和小梅去看生病的同学。小东手里拿着一袋苹果，小梅拿着一本故事书。他们到的时候，房间的门开着，同学正坐在床边喝水。虽然脸色不太好，但是他说吃了药以后已经舒服多了。小东问：“你最想做什么？”同学说：“我最想早点儿回学校，和大家一起上课。”小梅就坐在旁边，给他讲了今天课堂上的一个小故事。他们只待了半个小时，因为病人需要休息。走的时候，大家笑着说明天再来。回去以前，他们帮他把水杯放到床边，好让他不下床也能喝水。", "translation": "Chiều thứ Tư, 小东 và 小梅 thăm bạn bị ốm. 小东 cầm táo, 小梅 cầm truyện. Cửa mở, người bạn ngồi bên giường uống nước. Tuy sắc mặt chưa tốt nhưng uống thuốc xong đã dễ chịu hơn. Bạn muốn nhất là sớm về trường học cùng mọi người. 小梅 ngồi cạnh kể chuyện trên lớp. Họ chỉ ở nửa giờ vì người bệnh cần nghỉ, ra về cười nói mai lại đến. Trước khi về họ đặt cốc sát giường để cậu uống nước mà không cần xuống giường.", "grammar": ["着", "V1着V2", "最"], "questions": [{"question": "小东拿着什么？", "answer": "一袋苹果", "options": ["一袋苹果", "一本故事书", "一瓶药水", "一张车票"], "explanation": "Câu thứ hai nêu A cầm táo.", "id": "H2-R11-4-Q1"}, {"question": "他们到的时候，门是什么状态？", "answer": "开着", "options": ["开着", "关着", "锁着", "文中没说"], "explanation": "门开着 nói cửa đang mở.", "id": "H2-R11-4-Q2"}, {"question": "生病的同学最想做什么？", "answer": "回学校上课", "options": ["回学校上课", "去旅游", "买新衣服", "看电影"], "explanation": "Người bạn nói 最想早点儿回学校.", "id": "H2-R11-4-Q3"}, {"id": "H2-R11-4-Q4", "question": "为什么把水杯放到床边？", "answer": "不下床也能喝水", "options": ["不下床也能喝水", "给小猫喝水", "让水变冷", "准备拿去卖"], "explanation": "Để người bạn lấy nước dễ hơn mà không phải xuống giường."}, {"question": "“拿着”“开着”中的“着”表示什么？", "answer": "动作或状态持续着", "options": ["动作或状态持续着", "已经结束很久", "一共做了三次", "明天才能做"], "explanation": "着 chỉ trạng thái được duy trì ở thời điểm mô tả.", "id": "H2-R11-4-Q5"}, {"question": "为什么他们没有待很久？", "answer": "同学需要休息", "options": ["同学需要休息", "都不喜欢故事", "医院要搬家", "苹果没有了"], "explanation": "Câu 因为病人需要休息 nêu nguyên nhân trực tiếp.", "id": "H2-R11-4-Q6"}], "pinyin": "xīng qī sān xià wǔ ， xiǎo dōng hé xiǎo méi qù kàn shēng bìng de tóng xué 。 xiǎo dōng shǒu lǐ ná zhe yī dài píng guǒ ， xiǎo méi ná zhe yī běn gù shì shū 。 tā men dào de shí hòu ， fáng jiān de mén kāi zhe ， tóng xué zhèng zuò zài chuáng biān hē shuǐ 。 suī rán liǎn sè bù tài hǎo ， dàn shì tā shuō chī le yào yǐ hòu yǐ jīng shū fú duō le 。 xiǎo dōng wèn ： “ nǐ zuì xiǎng zuò shén me ？ ” tóng xué shuō ： “ wǒ zuì xiǎng zǎo diǎn ér huí xué xiào ， hé dà jiā yì qǐ shàng kè 。 ” xiǎo méi jiù zuò zài páng biān ， gěi tā jiǎng le jīn tiān kè táng shàng de yí gè xiǎo gù shì 。 tā men zhǐ dài le bàn gè xiǎo shí ， yīn wèi bìng rén xū yào xiū xī 。 zǒu de shí hòu ， dà jiā xiào zhe shuō míng tiān zài lái 。 huí qù yǐ qián ， tā men bāng tā bǎ shuǐ bēi fàng dào chuáng biān ， hǎo ràng tā bù xià chuáng yě néng hē shuǐ 。"}, {"id": "H2-R11-5", "lesson": 11, "title": "去看生病的同学 · 小明", "text": "星期五下午，小明和小雪去看生病的同学。小明手里拿着一袋苹果，小雪拿着一本故事书。他们到的时候，房间的门开着，同学正坐在床边喝水。虽然脸色不太好，但是他说吃了药以后已经舒服多了。小明问：“你最想做什么？”同学说：“我最想早点儿回学校，和大家一起上课。”小雪就坐在旁边，给他讲了今天课堂上的一个小故事。他们只待了半个小时，因为病人需要休息。走的时候，大家笑着说明天再来。他怕自己忘记吃药，便请朋友每天晚上给他发一条提醒的信息。", "translation": "Chiều thứ Sáu, 小明 và 小雪 thăm bạn bị ốm. 小明 cầm táo, 小雪 cầm truyện. Cửa mở, người bạn ngồi bên giường uống nước. Tuy sắc mặt chưa tốt nhưng uống thuốc xong đã dễ chịu hơn. Bạn muốn nhất là sớm về trường học cùng mọi người. 小雪 ngồi cạnh kể chuyện trên lớp. Họ chỉ ở nửa giờ vì người bệnh cần nghỉ, ra về cười nói mai lại đến. Cậu sợ quên uống thuốc nên nhờ bạn mỗi tối gửi một tin nhắc.", "grammar": ["着", "V1着V2", "最"], "questions": [{"question": "小明拿着什么？", "answer": "一袋苹果", "options": ["一袋苹果", "一本故事书", "一瓶药水", "一张车票"], "explanation": "Câu thứ hai nêu A cầm táo.", "id": "H2-R11-5-Q1"}, {"question": "他们到的时候，门是什么状态？", "answer": "开着", "options": ["开着", "关着", "锁着", "文中没说"], "explanation": "门开着 nói cửa đang mở.", "id": "H2-R11-5-Q2"}, {"question": "生病的同学最想做什么？", "answer": "回学校上课", "options": ["回学校上课", "去旅游", "买新衣服", "看电影"], "explanation": "Người bạn nói 最想早点儿回学校.", "id": "H2-R11-5-Q3"}, {"id": "H2-R11-5-Q4", "question": "他请朋友发信息提醒什么？", "answer": "吃药", "options": ["吃药", "去看电影", "买新裤子", "参加比赛"], "explanation": "Tin nhắn cần nhắc uống thuốc."}, {"question": "“拿着”“开着”中的“着”表示什么？", "answer": "动作或状态持续着", "options": ["动作或状态持续着", "已经结束很久", "一共做了三次", "明天才能做"], "explanation": "着 chỉ trạng thái được duy trì ở thời điểm mô tả.", "id": "H2-R11-5-Q5"}, {"question": "为什么他们没有待很久？", "answer": "同学需要休息", "options": ["同学需要休息", "都不喜欢故事", "医院要搬家", "苹果没有了"], "explanation": "Câu 因为病人需要休息 nêu nguyên nhân trực tiếp.", "id": "H2-R11-5-Q6"}], "pinyin": "xīng qī wǔ xià wǔ ， xiǎo míng hé xiǎo xuě qù kàn shēng bìng de tóng xué 。 xiǎo míng shǒu lǐ ná zhe yī dài píng guǒ ， xiǎo xuě ná zhe yī běn gù shì shū 。 tā men dào de shí hòu ， fáng jiān de mén kāi zhe ， tóng xué zhèng zuò zài chuáng biān hē shuǐ 。 suī rán liǎn sè bù tài hǎo ， dàn shì tā shuō chī le yào yǐ hòu yǐ jīng shū fú duō le 。 xiǎo míng wèn ： “ nǐ zuì xiǎng zuò shén me ？ ” tóng xué shuō ： “ wǒ zuì xiǎng zǎo diǎn ér huí xué xiào ， hé dà jiā yì qǐ shàng kè 。 ” xiǎo xuě jiù zuò zài páng biān ， gěi tā jiǎng le jīn tiān kè táng shàng de yí gè xiǎo gù shì 。 tā men zhǐ dài le bàn gè xiǎo shí ， yīn wèi bìng rén xū yào xiū xī 。 zǒu de shí hòu ， dà jiā xiào zhe shuō míng tiān zài lái 。 tā pà zì jǐ wàng jì chī yào ， biàn qǐng péng yǒu měi tiān wǎn shàng gěi tā fā yī tiáo tí xǐng de xìn xī 。"}, {"id": "H2-R12-1", "lesson": 12, "title": "给家人介绍这里的天气 · 小林", "text": "小林今年在北京学习。星期六晚上，他给家里的小雨打电话，说这里最近越来越冷，今天比昨天还低三度。跟家里相比，这里的冬天冷多了，但是教室里很暖和，不用太担心。小雨问他想坐车还是走路上学，小林说，比起坐公交车，他更喜欢走路，因为学校离住的地方很近，只要十分钟。以前小林常常起晚，现在为了走路上学，每天都早起一会儿。他还发现，多走路以后，自己比以前跑得更快了。家人听了，觉得他的生活很健康。他还买了一件比原来厚一点儿的外套，准备下雪的时候穿。", "translation": "小林 đang học ở Bắc Kinh. Tối thứ Bảy cậu gọi 小雨 ở nhà, kể trời ngày càng lạnh, hôm nay thấp hơn hôm qua ba độ. So với nhà thì mùa đông nơi đây lạnh hơn nhiều nhưng lớp ấm. Cậu thích đi bộ hơn xe buýt vì trường chỉ cách chỗ ở mười phút. Trước đây hay dậy muộn, giờ cậu dậy sớm hơn để đi bộ. Đi nhiều khiến cậu chạy nhanh hơn trước; gia đình thấy lối sống của cậu lành mạnh. Cậu còn mua áo khoác dày hơn chiếc cũ một chút để mặc khi tuyết rơi.", "grammar": ["比 + V + 得", "跟……相比", "比起"], "questions": [{"question": "今天的气温比昨天怎么样？", "answer": "低三度", "options": ["低三度", "高三度", "完全一样", "高十度"], "explanation": "今天比昨天还低三度.", "id": "H2-R12-1-Q1"}, {"question": "这里的冬天跟家里相比怎么样？", "answer": "冷多了", "options": ["冷多了", "暖和多了", "一样热", "没有冬天"], "explanation": "跟家里相比，这里的冬天冷多了.", "id": "H2-R12-1-Q2"}, {"question": "小林更喜欢怎样上学？", "answer": "走路", "options": ["走路", "坐公交车", "开车", "坐飞机"], "explanation": "比起坐公交车，更喜欢走路.", "id": "H2-R12-1-Q3"}, {"id": "H2-R12-1-Q4", "question": "他新买的外套有什么特点？", "answer": "比原来的厚一点儿", "options": ["比原来的厚一点儿", "比原来的短一半", "完全没有袖子", "是给小猫穿的"], "explanation": "Áo mới dày hơn áo cũ một chút."}, {"question": "“跟家里相比”有什么作用？", "answer": "先说比较的对象", "options": ["先说比较的对象", "说自己已经到家", "表示住在一起", "询问路线"], "explanation": "跟 A 相比 đặt đối tượng dùng để so sánh lên đầu.", "id": "H2-R12-1-Q5"}, {"question": "“比以前跑得更快了”比较的是什么？", "answer": "跑步的速度", "options": ["跑步的速度", "书包的重量", "教室的温度", "学校的人数"], "explanation": "跑得快 dùng bổ ngữ trạng thái để so sánh tốc độ.", "id": "H2-R12-1-Q6"}], "pinyin": "xiǎo lín jīn nián zài běi jīng xué xí 。 xīng qī liù wǎn shàng ， tā gěi jiā lǐ de xiǎo yǔ dǎ diàn huà ， shuō zhè lǐ zuì jìn yuè lái yuè lěng ， jīn tiān bǐ zuó tiān hái dī sān dù 。 gēn jiā lǐ xiāng bǐ ， zhè lǐ de dōng tiān lěng duō le ， dàn shì jiào shì lǐ hěn nuǎn huo ， bù yòng tài dān xīn 。 xiǎo yǔ wèn tā xiǎng zuò chē hái shì zǒu lù shàng xué ， xiǎo lín shuō ， bǐ qǐ zuò gōng jiāo chē ， tā gèng xǐ huān zǒu lù ， yīn wèi xué xiào lí zhù de dì fāng hěn jìn ， zhǐ yào shí fēn zhōng 。 yǐ qián xiǎo lín cháng cháng qǐ wǎn ， xiàn zài wèi le zǒu lù shàng xué ， měi tiān dōu zǎo qǐ yī huì er 。 tā hái fā xiàn ， duō zǒu lù yǐ hòu ， zì jǐ bǐ yǐ qián pǎo de gèng kuài le 。 jiā rén tīng le ， jué de tā de shēng huó hěn jiàn kāng 。 tā hái mǎi le yī jiàn bǐ yuán lái hòu yì diǎn ér de wài tào ， zhǔn bèi xià xuě de shí hòu chuān 。"}, {"id": "H2-R12-2", "lesson": 12, "title": "给家人介绍这里的天气 · 小安", "text": "小安今年在上海学习。星期日晚上，他给家里的小月打电话，说这里最近越来越冷，今天比昨天还低三度。跟家里相比，这里的冬天冷多了，但是教室里很暖和，不用太担心。小月问他想坐车还是走路上学，小安说，比起坐公交车，他更喜欢走路，因为学校离住的地方很近，只要十分钟。以前小安常常起晚，现在为了走路上学，每天都早起一会儿。他还发现，多走路以后，自己比以前跑得更快了。家人听了，觉得他的生活很健康。家人听说他喜欢走路，就提醒他，下雪的时候路上会很滑，要小心。", "translation": "小安 đang học ở Thượng Hải. Tối Chủ nhật cậu gọi 小月 ở nhà, kể trời ngày càng lạnh, hôm nay thấp hơn hôm qua ba độ. So với nhà thì mùa đông nơi đây lạnh hơn nhiều nhưng lớp ấm. Cậu thích đi bộ hơn xe buýt vì trường chỉ cách chỗ ở mười phút. Trước đây hay dậy muộn, giờ cậu dậy sớm hơn để đi bộ. Đi nhiều khiến cậu chạy nhanh hơn trước; gia đình thấy lối sống của cậu lành mạnh. Nghe cậu thích đi bộ, gia đình nhắc khi tuyết rơi đường dễ trơn nên phải cẩn thận.", "grammar": ["比 + V + 得", "跟……相比", "比起"], "questions": [{"question": "今天的气温比昨天怎么样？", "answer": "低三度", "options": ["低三度", "高三度", "完全一样", "高十度"], "explanation": "今天比昨天还低三度.", "id": "H2-R12-2-Q1"}, {"question": "这里的冬天跟家里相比怎么样？", "answer": "冷多了", "options": ["冷多了", "暖和多了", "一样热", "没有冬天"], "explanation": "跟家里相比，这里的冬天冷多了.", "id": "H2-R12-2-Q2"}, {"question": "小安更喜欢怎样上学？", "answer": "走路", "options": ["走路", "坐公交车", "开车", "坐飞机"], "explanation": "比起坐公交车，更喜欢走路.", "id": "H2-R12-2-Q3"}, {"id": "H2-R12-2-Q4", "question": "家人为什么提醒他小心？", "answer": "下雪时路上会滑", "options": ["下雪时路上会滑", "教室没有门", "这里没有太阳", "他没有课本"], "explanation": "Lời nhắc gắn với đường trơn khi có tuyết."}, {"question": "“跟家里相比”有什么作用？", "answer": "先说比较的对象", "options": ["先说比较的对象", "说自己已经到家", "表示住在一起", "询问路线"], "explanation": "跟 A 相比 đặt đối tượng dùng để so sánh lên đầu.", "id": "H2-R12-2-Q5"}, {"question": "“比以前跑得更快了”比较的是什么？", "answer": "跑步的速度", "options": ["跑步的速度", "书包的重量", "教室的温度", "学校的人数"], "explanation": "跑得快 dùng bổ ngữ trạng thái để so sánh tốc độ.", "id": "H2-R12-2-Q6"}], "pinyin": "xiǎo ān jīn nián zài shàng hǎi xué xí 。 xīng qī rì wǎn shàng ， tā gěi jiā lǐ de xiǎo yuè dǎ diàn huà ， shuō zhè lǐ zuì jìn yuè lái yuè lěng ， jīn tiān bǐ zuó tiān hái dī sān dù 。 gēn jiā lǐ xiāng bǐ ， zhè lǐ de dōng tiān lěng duō le ， dàn shì jiào shì lǐ hěn nuǎn huo ， bù yòng tài dān xīn 。 xiǎo yuè wèn tā xiǎng zuò chē hái shì zǒu lù shàng xué ， xiǎo ān shuō ， bǐ qǐ zuò gōng jiāo chē ， tā gèng xǐ huān zǒu lù ， yīn wèi xué xiào lí zhù de dì fāng hěn jìn ， zhǐ yào shí fēn zhōng 。 yǐ qián xiǎo ān cháng cháng qǐ wǎn ， xiàn zài wèi le zǒu lù shàng xué ， měi tiān dōu zǎo qǐ yī huì er 。 tā hái fā xiàn ， duō zǒu lù yǐ hòu ， zì jǐ bǐ yǐ qián pǎo de gèng kuài le 。 jiā rén tīng le ， jué de tā de shēng huó hěn jiàn kāng 。 jiā rén tīng shuō tā xǐ huān zǒu lù ， jiù tí xǐng tā ， xià xuě de shí hòu lù shàng huì hěn huá ， yào xiǎo xīn 。"}, {"id": "H2-R12-3", "lesson": 12, "title": "给家人介绍这里的天气 · 小文", "text": "小文今年在广州学习。星期一晚上，他给家里的小兰打电话，说这里最近越来越冷，今天比昨天还低三度。跟家里相比，这里的冬天冷多了，但是教室里很暖和，不用太担心。小兰问他想坐车还是走路上学，小文说，比起坐公交车，他更喜欢走路，因为学校离住的地方很近，只要十分钟。以前小文常常起晚，现在为了走路上学，每天都早起一会儿。他还发现，多走路以后，自己比以前跑得更快了。家人听了，觉得他的生活很健康。学校还举行了一个小活动，让来自不同地方的学生介绍自己家乡的天气。", "translation": "小文 đang học ở Quảng Châu. Tối thứ Hai cậu gọi 小兰 ở nhà, kể trời ngày càng lạnh, hôm nay thấp hơn hôm qua ba độ. So với nhà thì mùa đông nơi đây lạnh hơn nhiều nhưng lớp ấm. Cậu thích đi bộ hơn xe buýt vì trường chỉ cách chỗ ở mười phút. Trước đây hay dậy muộn, giờ cậu dậy sớm hơn để đi bộ. Đi nhiều khiến cậu chạy nhanh hơn trước; gia đình thấy lối sống của cậu lành mạnh. Trường còn tổ chức hoạt động nhỏ để học sinh từ các nơi giới thiệu thời tiết quê mình.", "grammar": ["比 + V + 得", "跟……相比", "比起"], "questions": [{"question": "今天的气温比昨天怎么样？", "answer": "低三度", "options": ["低三度", "高三度", "完全一样", "高十度"], "explanation": "今天比昨天还低三度.", "id": "H2-R12-3-Q1"}, {"question": "这里的冬天跟家里相比怎么样？", "answer": "冷多了", "options": ["冷多了", "暖和多了", "一样热", "没有冬天"], "explanation": "跟家里相比，这里的冬天冷多了.", "id": "H2-R12-3-Q2"}, {"question": "小文更喜欢怎样上学？", "answer": "走路", "options": ["走路", "坐公交车", "开车", "坐飞机"], "explanation": "比起坐公交车，更喜欢走路.", "id": "H2-R12-3-Q3"}, {"id": "H2-R12-3-Q4", "question": "学校的活动让学生介绍什么？", "answer": "家乡的天气", "options": ["家乡的天气", "家里的收入", "汽车的做法", "银行卡的密码"], "explanation": "Hoạt động xoay quanh thời tiết quê hương."}, {"question": "“跟家里相比”有什么作用？", "answer": "先说比较的对象", "options": ["先说比较的对象", "说自己已经到家", "表示住在一起", "询问路线"], "explanation": "跟 A 相比 đặt đối tượng dùng để so sánh lên đầu.", "id": "H2-R12-3-Q5"}, {"question": "“比以前跑得更快了”比较的是什么？", "answer": "跑步的速度", "options": ["跑步的速度", "书包的重量", "教室的温度", "学校的人数"], "explanation": "跑得快 dùng bổ ngữ trạng thái để so sánh tốc độ.", "id": "H2-R12-3-Q6"}], "pinyin": "xiǎo wén jīn nián zài guǎng zhōu xué xí 。 xīng qī yī wǎn shàng ， tā gěi jiā lǐ de xiǎo lán dǎ diàn huà ， shuō zhè lǐ zuì jìn yuè lái yuè lěng ， jīn tiān bǐ zuó tiān hái dī sān dù 。 gēn jiā lǐ xiāng bǐ ， zhè lǐ de dōng tiān lěng duō le ， dàn shì jiào shì lǐ hěn nuǎn huo ， bù yòng tài dān xīn 。 xiǎo lán wèn tā xiǎng zuò chē hái shì zǒu lù shàng xué ， xiǎo wén shuō ， bǐ qǐ zuò gōng jiāo chē ， tā gèng xǐ huān zǒu lù ， yīn wèi xué xiào lí zhù de dì fāng hěn jìn ， zhǐ yào shí fēn zhōng 。 yǐ qián xiǎo wén cháng cháng qǐ wǎn ， xiàn zài wèi le zǒu lù shàng xué ， měi tiān dōu zǎo qǐ yī huì er 。 tā hái fā xiàn ， duō zǒu lù yǐ hòu ， zì jǐ bǐ yǐ qián pǎo de gèng kuài le 。 jiā rén tīng le ， jué de tā de shēng huó hěn jiàn kāng 。 xué xiào hái jǔ xíng le yí gè xiǎo huó dòng ， ràng lái zì bù tóng dì fāng de xué shēng jiè shào zì jǐ jiā xiāng de tiān qì 。"}, {"id": "H2-R12-4", "lesson": 12, "title": "给家人介绍这里的天气 · 小东", "text": "小东今年在南京学习。星期三晚上，他给家里的小梅打电话，说这里最近越来越冷，今天比昨天还低三度。跟家里相比，这里的冬天冷多了，但是教室里很暖和，不用太担心。小梅问他想坐车还是走路上学，小东说，比起坐公交车，他更喜欢走路，因为学校离住的地方很近，只要十分钟。以前小东常常起晚，现在为了走路上学，每天都早起一会儿。他还发现，多走路以后，自己比以前跑得更快了。家人听了，觉得他的生活很健康。有一天风太大，他还是坐了公交车，因为健康比每天都走路更重要。", "translation": "小东 đang học ở Nam Kinh. Tối thứ Tư cậu gọi 小梅 ở nhà, kể trời ngày càng lạnh, hôm nay thấp hơn hôm qua ba độ. So với nhà thì mùa đông nơi đây lạnh hơn nhiều nhưng lớp ấm. Cậu thích đi bộ hơn xe buýt vì trường chỉ cách chỗ ở mười phút. Trước đây hay dậy muộn, giờ cậu dậy sớm hơn để đi bộ. Đi nhiều khiến cậu chạy nhanh hơn trước; gia đình thấy lối sống của cậu lành mạnh. Có hôm gió quá lớn cậu vẫn đi xe buýt, vì sức khỏe quan trọng hơn việc phải đi bộ mọi ngày.", "grammar": ["比 + V + 得", "跟……相比", "比起"], "questions": [{"question": "今天的气温比昨天怎么样？", "answer": "低三度", "options": ["低三度", "高三度", "完全一样", "高十度"], "explanation": "今天比昨天还低三度.", "id": "H2-R12-4-Q1"}, {"question": "这里的冬天跟家里相比怎么样？", "answer": "冷多了", "options": ["冷多了", "暖和多了", "一样热", "没有冬天"], "explanation": "跟家里相比，这里的冬天冷多了.", "id": "H2-R12-4-Q2"}, {"question": "小东更喜欢怎样上学？", "answer": "走路", "options": ["走路", "坐公交车", "开车", "坐飞机"], "explanation": "比起坐公交车，更喜欢走路.", "id": "H2-R12-4-Q3"}, {"id": "H2-R12-4-Q4", "question": "风太大的那天，他怎样上学？", "answer": "坐公交车", "options": ["坐公交车", "骑船", "坐飞机", "一直跑步"], "explanation": "Ngày gió lớn cậu chuyển sang xe buýt."}, {"question": "“跟家里相比”有什么作用？", "answer": "先说比较的对象", "options": ["先说比较的对象", "说自己已经到家", "表示住在一起", "询问路线"], "explanation": "跟 A 相比 đặt đối tượng dùng để so sánh lên đầu.", "id": "H2-R12-4-Q5"}, {"question": "“比以前跑得更快了”比较的是什么？", "answer": "跑步的速度", "options": ["跑步的速度", "书包的重量", "教室的温度", "学校的人数"], "explanation": "跑得快 dùng bổ ngữ trạng thái để so sánh tốc độ.", "id": "H2-R12-4-Q6"}], "pinyin": "xiǎo dōng jīn nián zài nán jīng xué xí 。 xīng qī sān wǎn shàng ， tā gěi jiā lǐ de xiǎo méi dǎ diàn huà ， shuō zhè lǐ zuì jìn yuè lái yuè lěng ， jīn tiān bǐ zuó tiān hái dī sān dù 。 gēn jiā lǐ xiāng bǐ ， zhè lǐ de dōng tiān lěng duō le ， dàn shì jiào shì lǐ hěn nuǎn huo ， bù yòng tài dān xīn 。 xiǎo méi wèn tā xiǎng zuò chē hái shì zǒu lù shàng xué ， xiǎo dōng shuō ， bǐ qǐ zuò gōng jiāo chē ， tā gèng xǐ huān zǒu lù ， yīn wèi xué xiào lí zhù de dì fāng hěn jìn ， zhǐ yào shí fēn zhōng 。 yǐ qián xiǎo dōng cháng cháng qǐ wǎn ， xiàn zài wèi le zǒu lù shàng xué ， měi tiān dōu zǎo qǐ yī huì er 。 tā hái fā xiàn ， duō zǒu lù yǐ hòu ， zì jǐ bǐ yǐ qián pǎo de gèng kuài le 。 jiā rén tīng le ， jué de tā de shēng huó hěn jiàn kāng 。 yǒu yī tiān fēng tài dà ， tā hái shì zuò le gōng jiāo chē ， yīn wèi jiàn kāng bǐ měi tiān dōu zǒu lù gèng zhòng yào 。"}, {"id": "H2-R12-5", "lesson": 12, "title": "给家人介绍这里的天气 · 小明", "text": "小明今年在天津学习。星期五晚上，他给家里的小雪打电话，说这里最近越来越冷，今天比昨天还低三度。跟家里相比，这里的冬天冷多了，但是教室里很暖和，不用太担心。小雪问他想坐车还是走路上学，小明说，比起坐公交车，他更喜欢走路，因为学校离住的地方很近，只要十分钟。以前小明常常起晚，现在为了走路上学，每天都早起一会儿。他还发现，多走路以后，自己比以前跑得更快了。家人听了，觉得他的生活很健康。他把窗外的雪拍成照片发回家，妹妹看了特别高兴，也想来看看。", "translation": "小明 đang học ở Thiên Tân. Tối thứ Sáu cậu gọi 小雪 ở nhà, kể trời ngày càng lạnh, hôm nay thấp hơn hôm qua ba độ. So với nhà thì mùa đông nơi đây lạnh hơn nhiều nhưng lớp ấm. Cậu thích đi bộ hơn xe buýt vì trường chỉ cách chỗ ở mười phút. Trước đây hay dậy muộn, giờ cậu dậy sớm hơn để đi bộ. Đi nhiều khiến cậu chạy nhanh hơn trước; gia đình thấy lối sống của cậu lành mạnh. Cậu chụp ảnh tuyết ngoài cửa sổ gửi về, em gái xem rất vui và cũng muốn đến xem.", "grammar": ["比 + V + 得", "跟……相比", "比起"], "questions": [{"question": "今天的气温比昨天怎么样？", "answer": "低三度", "options": ["低三度", "高三度", "完全一样", "高十度"], "explanation": "今天比昨天还低三度.", "id": "H2-R12-5-Q1"}, {"question": "这里的冬天跟家里相比怎么样？", "answer": "冷多了", "options": ["冷多了", "暖和多了", "一样热", "没有冬天"], "explanation": "跟家里相比，这里的冬天冷多了.", "id": "H2-R12-5-Q2"}, {"question": "小明更喜欢怎样上学？", "answer": "走路", "options": ["走路", "坐公交车", "开车", "坐飞机"], "explanation": "比起坐公交车，更喜欢走路.", "id": "H2-R12-5-Q3"}, {"id": "H2-R12-5-Q4", "question": "妹妹看到照片以后想做什么？", "answer": "来看看雪", "options": ["来看看雪", "马上去游泳", "扔掉相机", "不再看照片"], "explanation": "Em gái muốn đến xem tuyết sau khi nhìn ảnh."}, {"question": "“跟家里相比”有什么作用？", "answer": "先说比较的对象", "options": ["先说比较的对象", "说自己已经到家", "表示住在一起", "询问路线"], "explanation": "跟 A 相比 đặt đối tượng dùng để so sánh lên đầu.", "id": "H2-R12-5-Q5"}, {"question": "“比以前跑得更快了”比较的是什么？", "answer": "跑步的速度", "options": ["跑步的速度", "书包的重量", "教室的温度", "学校的人数"], "explanation": "跑得快 dùng bổ ngữ trạng thái để so sánh tốc độ.", "id": "H2-R12-5-Q6"}], "pinyin": "xiǎo míng jīn nián zài tiān jīn xué xí 。 xīng qī wǔ wǎn shàng ， tā gěi jiā lǐ de xiǎo xuě dǎ diàn huà ， shuō zhè lǐ zuì jìn yuè lái yuè lěng ， jīn tiān bǐ zuó tiān hái dī sān dù 。 gēn jiā lǐ xiāng bǐ ， zhè lǐ de dōng tiān lěng duō le ， dàn shì jiào shì lǐ hěn nuǎn huo ， bù yòng tài dān xīn 。 xiǎo xuě wèn tā xiǎng zuò chē hái shì zǒu lù shàng xué ， xiǎo míng shuō ， bǐ qǐ zuò gōng jiāo chē ， tā gèng xǐ huān zǒu lù ， yīn wèi xué xiào lí zhù de dì fāng hěn jìn ， zhǐ yào shí fēn zhōng 。 yǐ qián xiǎo míng cháng cháng qǐ wǎn ， xiàn zài wèi le zǒu lù shàng xué ， měi tiān dōu zǎo qǐ yī huì er 。 tā hái fā xiàn ， duō zǒu lù yǐ hòu ， zì jǐ bǐ yǐ qián pǎo de gèng kuài le 。 jiā rén tīng le ， jué de tā de shēng huó hěn jiàn kāng 。 tā bǎ chuāng wài de xuě pāi chéng zhào piān fā huí jiā ， mèi mèi kàn le tè bié gāo xìng ， yě xiǎng lái kàn kàn 。"}, {"id": "H2-R13-1", "lesson": 13, "title": "为新同学选礼物 · 小林", "text": "快过年了，小林想送新同学小雨一份礼物。老师说小雨很喜欢画画，小林就去商店选画笔。第一套画笔二十块，第二套比第一套贵十块，但是颜色也多五种。小林带的钱不太多，最后选了第一套，又买了一张卡片。回家以后，他在卡片上写了几句中文，妈妈还教他一句新的祝福语。第二天，小林把画笔送给小雨。小雨很开心，说这份礼物比贵的东西更让人感动。两个人商量，假期一起去公园画春天的花。朋友收到以后，就画了一张两个人一起学习的画，第二天送给他。", "translation": "Sắp Tết, 小林 muốn tặng bạn mới 小雨 một món quà. Biết bạn thích vẽ, cậu chọn cọ. Bộ đầu hai mươi tệ, bộ sau đắt hơn mười tệ nhưng thêm năm màu. Tiền không nhiều nên cậu chọn bộ đầu và thiệp. Về nhà cậu viết lời chúc, mẹ dạy thêm một câu. Hôm sau 小雨 nhận quà rất vui, nói món quà khiến mình cảm động hơn đồ đắt. Hai bạn hẹn kỳ nghỉ ra công viên vẽ hoa xuân. Sau khi nhận quà người bạn vẽ cảnh hai người cùng học rồi hôm sau tặng lại.", "grammar": ["Hai tân ngữ", "比 + chênh lệch cụ thể", "So sánh mức chênh lệch"], "questions": [{"question": "小雨喜欢做什么？", "answer": "画画", "options": ["画画", "踢足球", "开车", "做饭"], "explanation": "老师说 B 很喜欢画画.", "id": "H2-R13-1-Q1"}, {"question": "第二套画笔比第一套贵多少？", "answer": "十块", "options": ["十块", "五块", "二十块", "一百块"], "explanation": "Câu 第二套比第一套贵十块 nêu chênh lệch.", "id": "H2-R13-1-Q2"}, {"question": "小林最后买了哪套画笔？", "answer": "第一套", "options": ["第一套", "第二套", "两套都买", "一套也没买"], "explanation": "Vì tiền không nhiều nên chọn bộ đầu.", "id": "H2-R13-1-Q3"}, {"id": "H2-R13-1-Q4", "question": "朋友后来回送了什么？", "answer": "一张画", "options": ["一张画", "一张机票", "一袋药", "一台洗衣机"], "explanation": "Quà đáp lại là tranh vẽ hai người học cùng nhau."}, {"question": "“送新同学一份礼物”中两个宾语是什么？", "answer": "新同学和一份礼物", "options": ["新同学和一份礼物", "送和礼物", "快和过年", "老师和妈妈"], "explanation": "Người nhận và vật được tặng là hai tân ngữ.", "id": "H2-R13-1-Q5"}, {"question": "哪句话表达了具体的差额？", "answer": "第二套比第一套贵十块", "options": ["第二套比第一套贵十块", "老师说他喜欢画画", "回家以后写中文", "妈妈教他一句话"], "explanation": "贵十块 đặt lượng chênh lệch sau tính từ.", "id": "H2-R13-1-Q6"}], "pinyin": "kuài guò nián le ， xiǎo lín xiǎng sòng xīn tóng xué xiǎo yǔ yī fèn lǐ wù 。 lǎo shī shuō xiǎo yǔ hěn xǐ huān huà huà ， xiǎo lín jiù qù shāng diàn xuǎn huà bǐ 。 dì yī tào huà bǐ èr shí kuài ， dì èr tào bǐ dì yī tào guì shí kuài ， dàn shì yán sè yě duō wǔ zhǒng 。 xiǎo lín dài de qián bù tài duō ， zuì hòu xuǎn le dì yī tào ， yòu mǎi le yī zhāng kǎ piàn 。 huí jiā yǐ hòu ， tā zài kǎ piàn shàng xiě le jǐ jù zhōng wén ， mā mā hái jiāo tā yī jù xīn de zhù fú yǔ 。 dì èr tiān ， xiǎo lín bǎ huà bǐ sòng gěi xiǎo yǔ 。 xiǎo yǔ hěn kāi xīn ， shuō zhè fèn lǐ wù bǐ guì de dōng xī gèng ràng rén gǎn dòng 。 liǎng gè rén shāng liáng ， jià qī yì qǐ qù gōng yuán huà chūn tiān de huā 。 péng yǒu shōu dào yǐ hòu ， jiù huà le yī zhāng liǎng gè rén yì qǐ xué xí de huà ， dì èr tiān sòng gěi tā 。"}, {"id": "H2-R13-2", "lesson": 13, "title": "为新同学选礼物 · 小安", "text": "快过年了，小安想送新同学小月一份礼物。老师说小月很喜欢画画，小安就去商店选画笔。第一套画笔三十块，第二套比第一套贵十块，但是颜色也多五种。小安带的钱不太多，最后选了第一套，又买了一张卡片。回家以后，他在卡片上写了几句中文，妈妈还教他一句新的祝福语。第二天，小安把画笔送给小月。小月很开心，说这份礼物比贵的东西更让人感动。两个人商量，假期一起去公园画春天的花。他们在公园画画的时候，发现红花比白花多三朵，就把两种花都画了下来。", "translation": "Sắp Tết, 小安 muốn tặng bạn mới 小月 một món quà. Biết bạn thích vẽ, cậu chọn cọ. Bộ đầu ba mươi tệ, bộ sau đắt hơn mười tệ nhưng thêm năm màu. Tiền không nhiều nên cậu chọn bộ đầu và thiệp. Về nhà cậu viết lời chúc, mẹ dạy thêm một câu. Hôm sau 小月 nhận quà rất vui, nói món quà khiến mình cảm động hơn đồ đắt. Hai bạn hẹn kỳ nghỉ ra công viên vẽ hoa xuân. Khi vẽ ở công viên họ thấy hoa đỏ nhiều hơn hoa trắng ba bông nên vẽ cả hai loại.", "grammar": ["Hai tân ngữ", "比 + chênh lệch cụ thể", "So sánh mức chênh lệch"], "questions": [{"question": "小月喜欢做什么？", "answer": "画画", "options": ["画画", "踢足球", "开车", "做饭"], "explanation": "老师说 B 很喜欢画画.", "id": "H2-R13-2-Q1"}, {"question": "第二套画笔比第一套贵多少？", "answer": "十块", "options": ["十块", "五块", "二十块", "一百块"], "explanation": "Câu 第二套比第一套贵十块 nêu chênh lệch.", "id": "H2-R13-2-Q2"}, {"question": "小安最后买了哪套画笔？", "answer": "第一套", "options": ["第一套", "第二套", "两套都买", "一套也没买"], "explanation": "Vì tiền không nhiều nên chọn bộ đầu.", "id": "H2-R13-2-Q3"}, {"id": "H2-R13-2-Q4", "question": "红花比白花多多少？", "answer": "三朵", "options": ["三朵", "十朵", "一百朵", "一千朵"], "explanation": "Chênh lệch được nêu cụ thể là ba bông."}, {"question": "“送新同学一份礼物”中两个宾语是什么？", "answer": "新同学和一份礼物", "options": ["新同学和一份礼物", "送和礼物", "快和过年", "老师和妈妈"], "explanation": "Người nhận và vật được tặng là hai tân ngữ.", "id": "H2-R13-2-Q5"}, {"question": "哪句话表达了具体的差额？", "answer": "第二套比第一套贵十块", "options": ["第二套比第一套贵十块", "老师说他喜欢画画", "回家以后写中文", "妈妈教他一句话"], "explanation": "贵十块 đặt lượng chênh lệch sau tính từ.", "id": "H2-R13-2-Q6"}], "pinyin": "kuài guò nián le ， xiǎo ān xiǎng sòng xīn tóng xué xiǎo yuè yī fèn lǐ wù 。 lǎo shī shuō xiǎo yuè hěn xǐ huān huà huà ， xiǎo ān jiù qù shāng diàn xuǎn huà bǐ 。 dì yī tào huà bǐ sān shí kuài ， dì èr tào bǐ dì yī tào guì shí kuài ， dàn shì yán sè yě duō wǔ zhǒng 。 xiǎo ān dài de qián bù tài duō ， zuì hòu xuǎn le dì yī tào ， yòu mǎi le yī zhāng kǎ piàn 。 huí jiā yǐ hòu ， tā zài kǎ piàn shàng xiě le jǐ jù zhōng wén ， mā mā hái jiāo tā yī jù xīn de zhù fú yǔ 。 dì èr tiān ， xiǎo ān bǎ huà bǐ sòng gěi xiǎo yuè 。 xiǎo yuè hěn kāi xīn ， shuō zhè fèn lǐ wù bǐ guì de dōng xī gèng ràng rén gǎn dòng 。 liǎng gè rén shāng liáng ， jià qī yì qǐ qù gōng yuán huà chūn tiān de huā 。 tā men zài gōng yuán huà huà de shí hòu ， fā xiàn hóng huā bǐ bái huā duō sān duǒ ， jiù bǎ liǎng zhòng huā dōu huà le xià lái 。"}, {"id": "H2-R13-3", "lesson": 13, "title": "为新同学选礼物 · 小文", "text": "快过年了，小文想送新同学小兰一份礼物。老师说小兰很喜欢画画，小文就去商店选画笔。第一套画笔四十块，第二套比第一套贵十块，但是颜色也多五种。小文带的钱不太多，最后选了第一套，又买了一张卡片。回家以后，他在卡片上写了几句中文，妈妈还教他一句新的祝福语。第二天，小文把画笔送给小兰。小兰很开心，说这份礼物比贵的东西更让人感动。两个人商量，假期一起去公园画春天的花。卡片上的一个字写错了，朋友没有生气，而是教他怎样写才正确。", "translation": "Sắp Tết, 小文 muốn tặng bạn mới 小兰 một món quà. Biết bạn thích vẽ, cậu chọn cọ. Bộ đầu bốn mươi tệ, bộ sau đắt hơn mười tệ nhưng thêm năm màu. Tiền không nhiều nên cậu chọn bộ đầu và thiệp. Về nhà cậu viết lời chúc, mẹ dạy thêm một câu. Hôm sau 小兰 nhận quà rất vui, nói món quà khiến mình cảm động hơn đồ đắt. Hai bạn hẹn kỳ nghỉ ra công viên vẽ hoa xuân. Một chữ trên thiệp viết sai, người bạn không giận mà dạy cậu viết đúng.", "grammar": ["Hai tân ngữ", "比 + chênh lệch cụ thể", "So sánh mức chênh lệch"], "questions": [{"question": "小兰喜欢做什么？", "answer": "画画", "options": ["画画", "踢足球", "开车", "做饭"], "explanation": "老师说 B 很喜欢画画.", "id": "H2-R13-3-Q1"}, {"question": "第二套画笔比第一套贵多少？", "answer": "十块", "options": ["十块", "五块", "二十块", "一百块"], "explanation": "Câu 第二套比第一套贵十块 nêu chênh lệch.", "id": "H2-R13-3-Q2"}, {"question": "小文最后买了哪套画笔？", "answer": "第一套", "options": ["第一套", "第二套", "两套都买", "一套也没买"], "explanation": "Vì tiền không nhiều nên chọn bộ đầu.", "id": "H2-R13-3-Q3"}, {"id": "H2-R13-3-Q4", "question": "朋友发现错字以后做了什么？", "answer": "教他正确的写法", "options": ["教他正确的写法", "马上扔掉礼物", "不再说话", "要求买更贵的礼物"], "explanation": "Người bạn chọn giúp sửa cách viết, không tức giận."}, {"question": "“送新同学一份礼物”中两个宾语是什么？", "answer": "新同学和一份礼物", "options": ["新同学和一份礼物", "送和礼物", "快和过年", "老师和妈妈"], "explanation": "Người nhận và vật được tặng là hai tân ngữ.", "id": "H2-R13-3-Q5"}, {"question": "哪句话表达了具体的差额？", "answer": "第二套比第一套贵十块", "options": ["第二套比第一套贵十块", "老师说他喜欢画画", "回家以后写中文", "妈妈教他一句话"], "explanation": "贵十块 đặt lượng chênh lệch sau tính từ.", "id": "H2-R13-3-Q6"}], "pinyin": "kuài guò nián le ， xiǎo wén xiǎng sòng xīn tóng xué xiǎo lán yī fèn lǐ wù 。 lǎo shī shuō xiǎo lán hěn xǐ huān huà huà ， xiǎo wén jiù qù shāng diàn xuǎn huà bǐ 。 dì yī tào huà bǐ sì shí kuài ， dì èr tào bǐ dì yī tào guì shí kuài ， dàn shì yán sè yě duō wǔ zhǒng 。 xiǎo wén dài de qián bù tài duō ， zuì hòu xuǎn le dì yī tào ， yòu mǎi le yī zhāng kǎ piàn 。 huí jiā yǐ hòu ， tā zài kǎ piàn shàng xiě le jǐ jù zhōng wén ， mā mā hái jiāo tā yī jù xīn de zhù fú yǔ 。 dì èr tiān ， xiǎo wén bǎ huà bǐ sòng gěi xiǎo lán 。 xiǎo lán hěn kāi xīn ， shuō zhè fèn lǐ wù bǐ guì de dōng xī gèng ràng rén gǎn dòng 。 liǎng gè rén shāng liáng ， jià qī yì qǐ qù gōng yuán huà chūn tiān de huā 。 kǎ piàn shàng de yí gè zì xiě cuò le ， péng yǒu méi yǒu shēng qì ， ér shì jiāo tā zěn yàng xiě cái zhèng què 。"}, {"id": "H2-R13-4", "lesson": 13, "title": "为新同学选礼物 · 小东", "text": "快过年了，小东想送新同学小梅一份礼物。老师说小梅很喜欢画画，小东就去商店选画笔。第一套画笔五十块，第二套比第一套贵十块，但是颜色也多五种。小东带的钱不太多，最后选了第一套，又买了一张卡片。回家以后，他在卡片上写了几句中文，妈妈还教他一句新的祝福语。第二天，小东把画笔送给小梅。小梅很开心，说这份礼物比贵的东西更让人感动。两个人商量，假期一起去公园画春天的花。妈妈说贵不贵不重要，记得朋友喜欢什么，才是真的关心。", "translation": "Sắp Tết, 小东 muốn tặng bạn mới 小梅 một món quà. Biết bạn thích vẽ, cậu chọn cọ. Bộ đầu năm mươi tệ, bộ sau đắt hơn mười tệ nhưng thêm năm màu. Tiền không nhiều nên cậu chọn bộ đầu và thiệp. Về nhà cậu viết lời chúc, mẹ dạy thêm một câu. Hôm sau 小梅 nhận quà rất vui, nói món quà khiến mình cảm động hơn đồ đắt. Hai bạn hẹn kỳ nghỉ ra công viên vẽ hoa xuân. Mẹ nói giá đắt rẻ không quan trọng, nhớ bạn thích gì mới là quan tâm thật sự.", "grammar": ["Hai tân ngữ", "比 + chênh lệch cụ thể", "So sánh mức chênh lệch"], "questions": [{"question": "小梅喜欢做什么？", "answer": "画画", "options": ["画画", "踢足球", "开车", "做饭"], "explanation": "老师说 B 很喜欢画画.", "id": "H2-R13-4-Q1"}, {"question": "第二套画笔比第一套贵多少？", "answer": "十块", "options": ["十块", "五块", "二十块", "一百块"], "explanation": "Câu 第二套比第一套贵十块 nêu chênh lệch.", "id": "H2-R13-4-Q2"}, {"question": "小东最后买了哪套画笔？", "answer": "第一套", "options": ["第一套", "第二套", "两套都买", "一套也没买"], "explanation": "Vì tiền không nhiều nên chọn bộ đầu.", "id": "H2-R13-4-Q3"}, {"id": "H2-R13-4-Q4", "question": "妈妈认为什么更重要？", "answer": "记得朋友喜欢什么", "options": ["记得朋友喜欢什么", "只买最贵的", "只看颜色", "一定要买两套"], "explanation": "Lời mẹ nhấn mạnh quan tâm sở thích của bạn."}, {"question": "“送新同学一份礼物”中两个宾语是什么？", "answer": "新同学和一份礼物", "options": ["新同学和一份礼物", "送和礼物", "快和过年", "老师和妈妈"], "explanation": "Người nhận và vật được tặng là hai tân ngữ.", "id": "H2-R13-4-Q5"}, {"question": "哪句话表达了具体的差额？", "answer": "第二套比第一套贵十块", "options": ["第二套比第一套贵十块", "老师说他喜欢画画", "回家以后写中文", "妈妈教他一句话"], "explanation": "贵十块 đặt lượng chênh lệch sau tính từ.", "id": "H2-R13-4-Q6"}], "pinyin": "kuài guò nián le ， xiǎo dōng xiǎng sòng xīn tóng xué xiǎo méi yī fèn lǐ wù 。 lǎo shī shuō xiǎo méi hěn xǐ huān huà huà ， xiǎo dōng jiù qù shāng diàn xuǎn huà bǐ 。 dì yī tào huà bǐ wǔ shí kuài ， dì èr tào bǐ dì yī tào guì shí kuài ， dàn shì yán sè yě duō wǔ zhǒng 。 xiǎo dōng dài de qián bù tài duō ， zuì hòu xuǎn le dì yī tào ， yòu mǎi le yī zhāng kǎ piàn 。 huí jiā yǐ hòu ， tā zài kǎ piàn shàng xiě le jǐ jù zhōng wén ， mā mā hái jiāo tā yī jù xīn de zhù fú yǔ 。 dì èr tiān ， xiǎo dōng bǎ huà bǐ sòng gěi xiǎo méi 。 xiǎo méi hěn kāi xīn ， shuō zhè fèn lǐ wù bǐ guì de dōng xī gèng ràng rén gǎn dòng 。 liǎng gè rén shāng liáng ， jià qī yì qǐ qù gōng yuán huà chūn tiān de huā 。 mā mā shuō guì bù guì bú zhòng yào ， jì de péng yǒu xǐ huān shén me ， cái shì zhēn de guān xīn 。"}, {"id": "H2-R13-5", "lesson": 13, "title": "为新同学选礼物 · 小明", "text": "快过年了，小明想送新同学小雪一份礼物。老师说小雪很喜欢画画，小明就去商店选画笔。第一套画笔六十块，第二套比第一套贵十块，但是颜色也多五种。小明带的钱不太多，最后选了第一套，又买了一张卡片。回家以后，他在卡片上写了几句中文，妈妈还教他一句新的祝福语。第二天，小明把画笔送给小雪。小雪很开心，说这份礼物比贵的东西更让人感动。两个人商量，假期一起去公园画春天的花。他们还用剩下的钱买了一个小本子，打算把假期画过的花都记下来。", "translation": "Sắp Tết, 小明 muốn tặng bạn mới 小雪 một món quà. Biết bạn thích vẽ, cậu chọn cọ. Bộ đầu sáu mươi tệ, bộ sau đắt hơn mười tệ nhưng thêm năm màu. Tiền không nhiều nên cậu chọn bộ đầu và thiệp. Về nhà cậu viết lời chúc, mẹ dạy thêm một câu. Hôm sau 小雪 nhận quà rất vui, nói món quà khiến mình cảm động hơn đồ đắt. Hai bạn hẹn kỳ nghỉ ra công viên vẽ hoa xuân. Họ dùng tiền còn lại mua sổ nhỏ, định ghi lại những loài hoa vẽ trong kỳ nghỉ.", "grammar": ["Hai tân ngữ", "比 + chênh lệch cụ thể", "So sánh mức chênh lệch"], "questions": [{"question": "小雪喜欢做什么？", "answer": "画画", "options": ["画画", "踢足球", "开车", "做饭"], "explanation": "老师说 B 很喜欢画画.", "id": "H2-R13-5-Q1"}, {"question": "第二套画笔比第一套贵多少？", "answer": "十块", "options": ["十块", "五块", "二十块", "一百块"], "explanation": "Câu 第二套比第一套贵十块 nêu chênh lệch.", "id": "H2-R13-5-Q2"}, {"question": "小明最后买了哪套画笔？", "answer": "第一套", "options": ["第一套", "第二套", "两套都买", "一套也没买"], "explanation": "Vì tiền không nhiều nên chọn bộ đầu.", "id": "H2-R13-5-Q3"}, {"id": "H2-R13-5-Q4", "question": "他们打算用小本子做什么？", "answer": "记录画过的花", "options": ["记录画过的花", "当车票用", "用来煮汤", "拿去换药"], "explanation": "Sổ dùng ghi lại những bông hoa đã vẽ."}, {"question": "“送新同学一份礼物”中两个宾语是什么？", "answer": "新同学和一份礼物", "options": ["新同学和一份礼物", "送和礼物", "快和过年", "老师和妈妈"], "explanation": "Người nhận và vật được tặng là hai tân ngữ.", "id": "H2-R13-5-Q5"}, {"question": "哪句话表达了具体的差额？", "answer": "第二套比第一套贵十块", "options": ["第二套比第一套贵十块", "老师说他喜欢画画", "回家以后写中文", "妈妈教他一句话"], "explanation": "贵十块 đặt lượng chênh lệch sau tính từ.", "id": "H2-R13-5-Q6"}], "pinyin": "kuài guò nián le ， xiǎo míng xiǎng sòng xīn tóng xué xiǎo xuě yī fèn lǐ wù 。 lǎo shī shuō xiǎo xuě hěn xǐ huān huà huà ， xiǎo míng jiù qù shāng diàn xuǎn huà bǐ 。 dì yī tào huà bǐ liù shí kuài ， dì èr tào bǐ dì yī tào guì shí kuài ， dàn shì yán sè yě duō wǔ zhǒng 。 xiǎo míng dài de qián bù tài duō ， zuì hòu xuǎn le dì yī tào ， yòu mǎi le yī zhāng kǎ piàn 。 huí jiā yǐ hòu ， tā zài kǎ piàn shàng xiě le jǐ jù zhōng wén ， mā mā hái jiāo tā yī jù xīn de zhù fú yǔ 。 dì èr tiān ， xiǎo míng bǎ huà bǐ sòng gěi xiǎo xuě 。 xiǎo xuě hěn kāi xīn ， shuō zhè fèn lǐ wù bǐ guì de dōng xī gèng ràng rén gǎn dòng 。 liǎng gè rén shāng liáng ， jià qī yì qǐ qù gōng yuán huà chūn tiān de huā 。 tā men hái yòng shèng xià de qián mǎi le yí gè xiǎo běn zi ， dǎ suàn bǎ jià qī huà guò de huā dōu jì xià lái 。"}, {"id": "H2-R14-1", "lesson": 14, "title": "门口来了新朋友 · 小林", "text": "星期六下午，小林在家准备做饭。窗外下着小雨，门口站着一个背包的人。小林打开门，才发现是小雨带着弟弟来看他。弟弟今年三岁，个子不高，手里拿着一张自己画的画。小林笑着问：“你多大了？这张画是送给我的吗？”孩子点了点头，就和哥哥一起走进来。小林从厨房拿出三个杯子，又端来一盘水果。弟弟看见桌子旁边有一只小猫，马上高兴地站起来。大家坐下来聊天，等雨停以后再一起出去。雨停以后，弟弟想去公园看花，大家就带上相机一起走出门。", "translation": "Chiều thứ Bảy, 小林 đang chuẩn bị nấu cơm. Ngoài cửa có người đeo ba lô đứng dưới mưa nhỏ. Mở cửa mới biết 小雨 đưa em trai đến. Em ba tuổi, thấp, cầm tranh tự vẽ. 小林 hỏi tuổi và có phải tranh tặng mình không. Em gật đầu rồi vào cùng anh. 小林 lấy ba cốc, mang trái cây. Thấy mèo cạnh bàn em vui vẻ đứng dậy. Mọi người ngồi trò chuyện chờ mưa tạnh rồi ra ngoài. Mưa tạnh em trai muốn ra công viên ngắm hoa, mọi người mang máy ảnh cùng ra cửa.", "grammar": ["Câu tồn tại", "多 hỏi mức độ", "Bổ ngữ xu hướng phức hợp"], "questions": [{"question": "谁带着弟弟来了？", "answer": "小雨", "options": ["小雨", "小林", "妈妈", "老师"], "explanation": "门口的人 là B, đi cùng em trai.", "id": "H2-R14-1-Q1"}, {"question": "弟弟手里拿着什么？", "answer": "一张画", "options": ["一张画", "一张票", "一本词典", "一个碗"], "explanation": "孩子 cầm tranh mình vẽ.", "id": "H2-R14-1-Q2"}, {"question": "弟弟今年多大？", "answer": "三岁", "options": ["三岁", "十岁", "十二岁", "二十岁"], "explanation": "Văn bản nêu tuổi trực tiếp.", "id": "H2-R14-1-Q3"}, {"id": "H2-R14-1-Q4", "question": "雨停以后，他们准备去哪里？", "answer": "公园", "options": ["公园", "机场", "银行", "药店"], "explanation": "Mọi người định đến công viên ngắm hoa."}, {"question": "“门口站着一个人”是什么表达方式？", "answer": "先说地点，再说那里的人和状态", "options": ["先说地点，再说那里的人和状态", "先比较两个人", "只询问价格", "表示以前去过"], "explanation": "Câu tồn tại: địa điểm + V + 着 + danh từ.", "id": "H2-R14-1-Q5"}, {"question": "“走进来”中的“进来”说明什么？", "answer": "从外面进入说话人所在的屋子", "options": ["从外面进入说话人所在的屋子", "从屋里走到外面", "一直往上走", "回到另一座城市"], "explanation": "进 là vào, 来 hướng về nơi người nói đang ở.", "id": "H2-R14-1-Q6"}], "pinyin": "xīng qī liù xià wǔ ， xiǎo lín zài jiā zhǔn bèi zuò fàn 。 chuāng wài xià zhe xiǎo yǔ ， mén kǒu zhàn zhe yí gè bēi bāo de rén 。 xiǎo lín dǎ kāi mén ， cái fā xiàn shì xiǎo yǔ dài zhe dì di lái kàn tā 。 dì di jīn nián sān suì ， gè zi bù gāo ， shǒu lǐ ná zhe yī zhāng zì jǐ huà de huà 。 xiǎo lín xiào zhe wèn ： “ nǐ duō dà le ？ zhè zhāng huà shì sòng gěi wǒ de ma ？ ” hái zi diǎn le diǎn tóu ， jiù hé gē gē yì qǐ zǒu jìn lái 。 xiǎo lín cóng chú fáng ná chū sān gè bēi zi ， yòu duān lái yī pán shuǐ guǒ 。 dì di kàn jiàn zhuō zi páng biān yǒu yī zhī xiǎo māo ， mǎ shàng gāo xìng dì zhàn qǐ lái 。 dà jiā zuò xià lái liáo tiān ， děng yǔ tíng yǐ hòu zài yì qǐ chū qù 。 yǔ tíng yǐ hòu ， dì di xiǎng qù gōng yuán kàn huā ， dà jiā jiù dài shàng xiàng jī yì qǐ zǒu chū mén 。"}, {"id": "H2-R14-2", "lesson": 14, "title": "门口来了新朋友 · 小安", "text": "星期日下午，小安在家准备做饭。窗外下着小雨，门口站着一个背包的人。小安打开门，才发现是小月带着弟弟来看他。弟弟今年四岁，个子不高，手里拿着一张自己画的画。小安笑着问：“你多大了？这张画是送给我的吗？”孩子点了点头，就和哥哥一起走进来。小安从厨房拿出三个杯子，又端来一盘水果。弟弟看见桌子旁边有一只小猫，马上高兴地站起来。大家坐下来聊天，等雨停以后再一起出去。小猫跑到椅子下面去了，弟弟没有追，而是拿来一点儿食物，等它自己出来。", "translation": "Chiều Chủ nhật, 小安 đang chuẩn bị nấu cơm. Ngoài cửa có người đeo ba lô đứng dưới mưa nhỏ. Mở cửa mới biết 小月 đưa em trai đến. Em bốn tuổi, thấp, cầm tranh tự vẽ. 小安 hỏi tuổi và có phải tranh tặng mình không. Em gật đầu rồi vào cùng anh. 小安 lấy ba cốc, mang trái cây. Thấy mèo cạnh bàn em vui vẻ đứng dậy. Mọi người ngồi trò chuyện chờ mưa tạnh rồi ra ngoài. Mèo chạy xuống dưới ghế, em không đuổi mà lấy ít đồ ăn chờ nó tự ra.", "grammar": ["Câu tồn tại", "多 hỏi mức độ", "Bổ ngữ xu hướng phức hợp"], "questions": [{"question": "谁带着弟弟来了？", "answer": "小月", "options": ["小月", "小安", "妈妈", "老师"], "explanation": "门口的人 là B, đi cùng em trai.", "id": "H2-R14-2-Q1"}, {"question": "弟弟手里拿着什么？", "answer": "一张画", "options": ["一张画", "一张票", "一本词典", "一个碗"], "explanation": "孩子 cầm tranh mình vẽ.", "id": "H2-R14-2-Q2"}, {"question": "弟弟今年多大？", "answer": "四岁", "options": ["四岁", "十岁", "十二岁", "二十岁"], "explanation": "Văn bản nêu tuổi trực tiếp.", "id": "H2-R14-2-Q3"}, {"id": "H2-R14-2-Q4", "question": "弟弟怎样让小猫出来？", "answer": "拿来食物等它", "options": ["拿来食物等它", "一直大声喊", "推倒椅子", "马上关灯"], "explanation": "Em dùng đồ ăn chờ mèo tự ra."}, {"question": "“门口站着一个人”是什么表达方式？", "answer": "先说地点，再说那里的人和状态", "options": ["先说地点，再说那里的人和状态", "先比较两个人", "只询问价格", "表示以前去过"], "explanation": "Câu tồn tại: địa điểm + V + 着 + danh từ.", "id": "H2-R14-2-Q5"}, {"question": "“走进来”中的“进来”说明什么？", "answer": "从外面进入说话人所在的屋子", "options": ["从外面进入说话人所在的屋子", "从屋里走到外面", "一直往上走", "回到另一座城市"], "explanation": "进 là vào, 来 hướng về nơi người nói đang ở.", "id": "H2-R14-2-Q6"}], "pinyin": "xīng qī rì xià wǔ ， xiǎo ān zài jiā zhǔn bèi zuò fàn 。 chuāng wài xià zhe xiǎo yǔ ， mén kǒu zhàn zhe yí gè bēi bāo de rén 。 xiǎo ān dǎ kāi mén ， cái fā xiàn shì xiǎo yuè dài zhe dì di lái kàn tā 。 dì di jīn nián sì suì ， gè zi bù gāo ， shǒu lǐ ná zhe yī zhāng zì jǐ huà de huà 。 xiǎo ān xiào zhe wèn ： “ nǐ duō dà le ？ zhè zhāng huà shì sòng gěi wǒ de ma ？ ” hái zi diǎn le diǎn tóu ， jiù hé gē gē yì qǐ zǒu jìn lái 。 xiǎo ān cóng chú fáng ná chū sān gè bēi zi ， yòu duān lái yī pán shuǐ guǒ 。 dì di kàn jiàn zhuō zi páng biān yǒu yī zhī xiǎo māo ， mǎ shàng gāo xìng dì zhàn qǐ lái 。 dà jiā zuò xià lái liáo tiān ， děng yǔ tíng yǐ hòu zài yì qǐ chū qù 。 xiǎo māo pǎo dào yǐ zi xià miàn qù le ， dì di méi yǒu zhuī ， ér shì ná lái yì diǎn ér shí wù ， děng tā zì jǐ chū lái 。"}, {"id": "H2-R14-3", "lesson": 14, "title": "门口来了新朋友 · 小文", "text": "星期一下午，小文在家准备做饭。窗外下着小雨，门口站着一个背包的人。小文打开门，才发现是小兰带着弟弟来看他。弟弟今年五岁，个子不高，手里拿着一张自己画的画。小文笑着问：“你多大了？这张画是送给我的吗？”孩子点了点头，就和哥哥一起走进来。小文从厨房拿出三个杯子，又端来一盘水果。弟弟看见桌子旁边有一只小猫，马上高兴地站起来。大家坐下来聊天，等雨停以后再一起出去。哥哥怕弟弟的衣服被雨打湿，就拿出一件干的，让他先换上。", "translation": "Chiều thứ Hai, 小文 đang chuẩn bị nấu cơm. Ngoài cửa có người đeo ba lô đứng dưới mưa nhỏ. Mở cửa mới biết 小兰 đưa em trai đến. Em năm tuổi, thấp, cầm tranh tự vẽ. 小文 hỏi tuổi và có phải tranh tặng mình không. Em gật đầu rồi vào cùng anh. 小文 lấy ba cốc, mang trái cây. Thấy mèo cạnh bàn em vui vẻ đứng dậy. Mọi người ngồi trò chuyện chờ mưa tạnh rồi ra ngoài. Anh sợ áo em bị mưa làm ướt nên lấy áo khô cho em thay trước.", "grammar": ["Câu tồn tại", "多 hỏi mức độ", "Bổ ngữ xu hướng phức hợp"], "questions": [{"question": "谁带着弟弟来了？", "answer": "小兰", "options": ["小兰", "小文", "妈妈", "老师"], "explanation": "门口的人 là B, đi cùng em trai.", "id": "H2-R14-3-Q1"}, {"question": "弟弟手里拿着什么？", "answer": "一张画", "options": ["一张画", "一张票", "一本词典", "一个碗"], "explanation": "孩子 cầm tranh mình vẽ.", "id": "H2-R14-3-Q2"}, {"question": "弟弟今年多大？", "answer": "五岁", "options": ["五岁", "十岁", "十二岁", "二十岁"], "explanation": "Văn bản nêu tuổi trực tiếp.", "id": "H2-R14-3-Q3"}, {"id": "H2-R14-3-Q4", "question": "哥哥拿出了什么？", "answer": "一件干衣服", "options": ["一件干衣服", "一张地图", "一把画笔", "一双黑鞋"], "explanation": "Anh lấy quần áo khô để em thay."}, {"question": "“门口站着一个人”是什么表达方式？", "answer": "先说地点，再说那里的人和状态", "options": ["先说地点，再说那里的人和状态", "先比较两个人", "只询问价格", "表示以前去过"], "explanation": "Câu tồn tại: địa điểm + V + 着 + danh từ.", "id": "H2-R14-3-Q5"}, {"question": "“走进来”中的“进来”说明什么？", "answer": "从外面进入说话人所在的屋子", "options": ["从外面进入说话人所在的屋子", "从屋里走到外面", "一直往上走", "回到另一座城市"], "explanation": "进 là vào, 来 hướng về nơi người nói đang ở.", "id": "H2-R14-3-Q6"}], "pinyin": "xīng qī yī xià wǔ ， xiǎo wén zài jiā zhǔn bèi zuò fàn 。 chuāng wài xià zhe xiǎo yǔ ， mén kǒu zhàn zhe yí gè bēi bāo de rén 。 xiǎo wén dǎ kāi mén ， cái fā xiàn shì xiǎo lán dài zhe dì di lái kàn tā 。 dì di jīn nián wǔ suì ， gè zi bù gāo ， shǒu lǐ ná zhe yī zhāng zì jǐ huà de huà 。 xiǎo wén xiào zhe wèn ： “ nǐ duō dà le ？ zhè zhāng huà shì sòng gěi wǒ de ma ？ ” hái zi diǎn le diǎn tóu ， jiù hé gē gē yì qǐ zǒu jìn lái 。 xiǎo wén cóng chú fáng ná chū sān gè bēi zi ， yòu duān lái yī pán shuǐ guǒ 。 dì di kàn jiàn zhuō zi páng biān yǒu yī zhī xiǎo māo ， mǎ shàng gāo xìng dì zhàn qǐ lái 。 dà jiā zuò xià lái liáo tiān ， děng yǔ tíng yǐ hòu zài yì qǐ chū qù 。 gē gē pà dì di de yī fú bèi yǔ dǎ shī ， jiù ná chū yī jiàn gàn de ， ràng tā xiān huàn shàng 。"}, {"id": "H2-R14-4", "lesson": 14, "title": "门口来了新朋友 · 小东", "text": "星期三下午，小东在家准备做饭。窗外下着小雨，门口站着一个背包的人。小东打开门，才发现是小梅带着弟弟来看他。弟弟今年六岁，个子不高，手里拿着一张自己画的画。小东笑着问：“你多大了？这张画是送给我的吗？”孩子点了点头，就和哥哥一起走进来。小东从厨房拿出三个杯子，又端来一盘水果。弟弟看见桌子旁边有一只小猫，马上高兴地站起来。大家坐下来聊天，等雨停以后再一起出去。弟弟问这座楼有多高，他就带孩子到窗边，一层一层地数了数。", "translation": "Chiều thứ Tư, 小东 đang chuẩn bị nấu cơm. Ngoài cửa có người đeo ba lô đứng dưới mưa nhỏ. Mở cửa mới biết 小梅 đưa em trai đến. Em sáu tuổi, thấp, cầm tranh tự vẽ. 小东 hỏi tuổi và có phải tranh tặng mình không. Em gật đầu rồi vào cùng anh. 小东 lấy ba cốc, mang trái cây. Thấy mèo cạnh bàn em vui vẻ đứng dậy. Mọi người ngồi trò chuyện chờ mưa tạnh rồi ra ngoài. Em hỏi tòa nhà cao bao nhiêu, cậu dẫn em ra cửa sổ đếm từng tầng.", "grammar": ["Câu tồn tại", "多 hỏi mức độ", "Bổ ngữ xu hướng phức hợp"], "questions": [{"question": "谁带着弟弟来了？", "answer": "小梅", "options": ["小梅", "小东", "妈妈", "老师"], "explanation": "门口的人 là B, đi cùng em trai.", "id": "H2-R14-4-Q1"}, {"question": "弟弟手里拿着什么？", "answer": "一张画", "options": ["一张画", "一张票", "一本词典", "一个碗"], "explanation": "孩子 cầm tranh mình vẽ.", "id": "H2-R14-4-Q2"}, {"question": "弟弟今年多大？", "answer": "六岁", "options": ["六岁", "十岁", "十二岁", "二十岁"], "explanation": "Văn bản nêu tuổi trực tiếp.", "id": "H2-R14-4-Q3"}, {"id": "H2-R14-4-Q4", "question": "他们在窗边做了什么？", "answer": "数楼层", "options": ["数楼层", "洗衣服", "倒热汤", "换机票"], "explanation": "Họ đếm các tầng để trả lời câu hỏi về độ cao."}, {"question": "“门口站着一个人”是什么表达方式？", "answer": "先说地点，再说那里的人和状态", "options": ["先说地点，再说那里的人和状态", "先比较两个人", "只询问价格", "表示以前去过"], "explanation": "Câu tồn tại: địa điểm + V + 着 + danh từ.", "id": "H2-R14-4-Q5"}, {"question": "“走进来”中的“进来”说明什么？", "answer": "从外面进入说话人所在的屋子", "options": ["从外面进入说话人所在的屋子", "从屋里走到外面", "一直往上走", "回到另一座城市"], "explanation": "进 là vào, 来 hướng về nơi người nói đang ở.", "id": "H2-R14-4-Q6"}], "pinyin": "xīng qī sān xià wǔ ， xiǎo dōng zài jiā zhǔn bèi zuò fàn 。 chuāng wài xià zhe xiǎo yǔ ， mén kǒu zhàn zhe yí gè bēi bāo de rén 。 xiǎo dōng dǎ kāi mén ， cái fā xiàn shì xiǎo méi dài zhe dì di lái kàn tā 。 dì di jīn nián liù suì ， gè zi bù gāo ， shǒu lǐ ná zhe yī zhāng zì jǐ huà de huà 。 xiǎo dōng xiào zhe wèn ： “ nǐ duō dà le ？ zhè zhāng huà shì sòng gěi wǒ de ma ？ ” hái zi diǎn le diǎn tóu ， jiù hé gē gē yì qǐ zǒu jìn lái 。 xiǎo dōng cóng chú fáng ná chū sān gè bēi zi ， yòu duān lái yī pán shuǐ guǒ 。 dì di kàn jiàn zhuō zi páng biān yǒu yī zhī xiǎo māo ， mǎ shàng gāo xìng dì zhàn qǐ lái 。 dà jiā zuò xià lái liáo tiān ， děng yǔ tíng yǐ hòu zài yì qǐ chū qù 。 dì di wèn zhè zuò lóu yǒu duō gāo ， tā jiù dài hái zi dào chuāng biān ， yī céng yī céng dì shù le shù 。"}, {"id": "H2-R14-5", "lesson": 14, "title": "门口来了新朋友 · 小明", "text": "星期五下午，小明在家准备做饭。窗外下着小雨，门口站着一个背包的人。小明打开门，才发现是小雪带着弟弟来看他。弟弟今年七岁，个子不高，手里拿着一张自己画的画。小明笑着问：“你多大了？这张画是送给我的吗？”孩子点了点头，就和哥哥一起走进来。小明从厨房拿出三个杯子，又端来一盘水果。弟弟看见桌子旁边有一只小猫，马上高兴地站起来。大家坐下来聊天，等雨停以后再一起出去。走的时候，弟弟还想再看小猫，大家就答应下个周末再来一次。", "translation": "Chiều thứ Sáu, 小明 đang chuẩn bị nấu cơm. Ngoài cửa có người đeo ba lô đứng dưới mưa nhỏ. Mở cửa mới biết 小雪 đưa em trai đến. Em bảy tuổi, thấp, cầm tranh tự vẽ. 小明 hỏi tuổi và có phải tranh tặng mình không. Em gật đầu rồi vào cùng anh. 小明 lấy ba cốc, mang trái cây. Thấy mèo cạnh bàn em vui vẻ đứng dậy. Mọi người ngồi trò chuyện chờ mưa tạnh rồi ra ngoài. Lúc ra về em còn muốn gặp mèo nên mọi người đồng ý cuối tuần sau đến thêm lần nữa.", "grammar": ["Câu tồn tại", "多 hỏi mức độ", "Bổ ngữ xu hướng phức hợp"], "questions": [{"question": "谁带着弟弟来了？", "answer": "小雪", "options": ["小雪", "小明", "妈妈", "老师"], "explanation": "门口的人 là B, đi cùng em trai.", "id": "H2-R14-5-Q1"}, {"question": "弟弟手里拿着什么？", "answer": "一张画", "options": ["一张画", "一张票", "一本词典", "一个碗"], "explanation": "孩子 cầm tranh mình vẽ.", "id": "H2-R14-5-Q2"}, {"question": "弟弟今年多大？", "answer": "七岁", "options": ["七岁", "十岁", "十二岁", "二十岁"], "explanation": "Văn bản nêu tuổi trực tiếp.", "id": "H2-R14-5-Q3"}, {"id": "H2-R14-5-Q4", "question": "他们答应什么时候再来？", "answer": "下个周末", "options": ["下个周末", "今天半夜", "十年以后", "前年春天"], "explanation": "Họ hẹn quay lại vào cuối tuần sau."}, {"question": "“门口站着一个人”是什么表达方式？", "answer": "先说地点，再说那里的人和状态", "options": ["先说地点，再说那里的人和状态", "先比较两个人", "只询问价格", "表示以前去过"], "explanation": "Câu tồn tại: địa điểm + V + 着 + danh từ.", "id": "H2-R14-5-Q5"}, {"question": "“走进来”中的“进来”说明什么？", "answer": "从外面进入说话人所在的屋子", "options": ["从外面进入说话人所在的屋子", "从屋里走到外面", "一直往上走", "回到另一座城市"], "explanation": "进 là vào, 来 hướng về nơi người nói đang ở.", "id": "H2-R14-5-Q6"}], "pinyin": "xīng qī wǔ xià wǔ ， xiǎo míng zài jiā zhǔn bèi zuò fàn 。 chuāng wài xià zhe xiǎo yǔ ， mén kǒu zhàn zhe yí gè bēi bāo de rén 。 xiǎo míng dǎ kāi mén ， cái fā xiàn shì xiǎo xuě dài zhe dì di lái kàn tā 。 dì di jīn nián qī suì ， gè zi bù gāo ， shǒu lǐ ná zhe yī zhāng zì jǐ huà de huà 。 xiǎo míng xiào zhe wèn ： “ nǐ duō dà le ？ zhè zhāng huà shì sòng gěi wǒ de ma ？ ” hái zi diǎn le diǎn tóu ， jiù hé gē gē yì qǐ zǒu jìn lái 。 xiǎo míng cóng chú fáng ná chū sān gè bēi zi ， yòu duān lái yī pán shuǐ guǒ 。 dì di kàn jiàn zhuō zi páng biān yǒu yī zhī xiǎo māo ， mǎ shàng gāo xìng dì zhàn qǐ lái 。 dà jiā zuò xià lái liáo tiān ， děng yǔ tíng yǐ hòu zài yì qǐ chū qù 。 zǒu de shí hòu ， dì di hái xiǎng zài kàn xiǎo māo ， dà jiā jiù dā yìng xià gè zhōu mò zài lái yī cì 。"}, {"id": "H2-R15-1", "lesson": 15, "title": "回国以前再见一面 · 小林", "text": "小林下周就要回国了。来这里学习的一年里，他常常和小雨一起复习，还去过北京两次。星期六晚上，小雨给他打了两次电话，想约他吃饭，但是第一次没人接。后来小林回了电话，说自己正在准备护照和机票。两个人约好八点在学校对面的饭馆见面。小林说，家里有爸爸妈妈和一个妹妹，他们已经很久没一起吃饭了。虽然很想家，但是离开朋友也有点儿难过。小雨说：“以后有时间再来，我们一直欢迎你。”小林答应回国以后常常给大家发信息。回家以后，他给朋友发了全家吃饭的照片，还说下次想带妹妹一起去中国。", "translation": "Tuần sau 小林 sắp về nước. Trong năm học ở đây cậu thường ôn cùng 小雨, đã đến Bắc Kinh hai lần. Tối thứ Bảy, 小雨 gọi hai lần để hẹn ăn, lần đầu không ai nghe. 小林 gọi lại, nói đang chuẩn bị hộ chiếu và vé. Họ hẹn lúc tám giờ tại quán đối diện trường. Nhà cậu có bố mẹ và em gái, đã lâu chưa ăn cùng nhau. Cậu nhớ nhà nhưng cũng buồn xa bạn. 小雨 hoan nghênh cậu quay lại; 小林 hứa về nước sẽ thường nhắn tin. Về nhà cậu gửi ảnh cả nhà ăn cơm cho bạn, nói lần sau muốn đưa em gái sang Trung Quốc cùng.", "grammar": ["Phó từ tần suất", "Số lần hành động", "有"], "questions": [{"question": "小林什么时候回国？", "answer": "下周", "options": ["下周", "明年", "今天早上", "上个月"], "explanation": "Câu đầu nêu 下周就要回国了.", "id": "H2-R15-1-Q1"}, {"question": "小林去过北京几次？", "answer": "两次", "options": ["两次", "一次", "三次", "从来没去过"], "explanation": "去过……两次 diễn tả số lần trải nghiệm.", "id": "H2-R15-1-Q2"}, {"question": "小雨打了几次电话？", "answer": "两次", "options": ["两次", "一次", "五次", "没有打"], "explanation": "Văn bản nói 给他打了两次电话.", "id": "H2-R15-1-Q3"}, {"id": "H2-R15-1-Q4", "question": "他下次想带谁一起去中国？", "answer": "妹妹", "options": ["妹妹", "经理", "司机", "医生"], "explanation": "Cậu muốn đưa em gái cùng đến Trung Quốc."}, {"question": "“常常和朋友一起复习”中的“常常”放在哪里？", "answer": "动词前面", "options": ["动词前面", "动词和得中间", "句子最后面", "名词后面"], "explanation": "Phó từ tần suất đứng trước động từ hoặc cụm động từ.", "id": "H2-R15-1-Q5"}, {"question": "为什么他既高兴又有点儿难过？", "answer": "想回家，也舍不得朋友", "options": ["想回家，也舍不得朋友", "考试没通过", "没有买到水果", "不喜欢学习"], "explanation": "Nhớ gia đình nhưng buồn vì sắp rời bạn bè; cần kết hợp hai ý trong đoạn.", "id": "H2-R15-1-Q6"}], "pinyin": "xiǎo lín xià zhōu jiù yào huí guó le 。 lái zhè lǐ xué xí de yī nián lǐ ， tā cháng cháng hé xiǎo yǔ yì qǐ fù xí ， hái qù guò běi jīng liǎng cì 。 xīng qī liù wǎn shàng ， xiǎo yǔ gěi tā dǎ le liǎng cì diàn huà ， xiǎng yuē tā chī fàn ， dàn shì dì yī cì méi rén jiē 。 hòu lái xiǎo lín huí le diàn huà ， shuō zì jǐ zhèng zài zhǔn bèi hù zhào hé jī piào 。 liǎng gè rén yuē hǎo bā diǎn zài xué xiào duì miàn de fàn guǎn jiàn miàn 。 xiǎo lín shuō ， jiā lǐ yǒu bà bà mā mā hé yí gè mèi mèi ， tā men yǐ jīng hěn jiǔ méi yì qǐ chī fàn le 。 suī rán hěn xiǎng jiā ， dàn shì lí kāi péng yǒu yě yǒu diǎn ér nán guò 。 xiǎo yǔ shuō ： “ yǐ hòu yǒu shí jiān zài lái ， wǒ men yì zhí huān yíng nǐ 。 ” xiǎo lín dā yìng huí guó yǐ hòu cháng cháng gěi dà jiā fā xìn xī 。 huí jiā yǐ hòu ， tā gěi péng yǒu fā le quán jiā chī fàn de zhào piān ， hái shuō xià cì xiǎng dài mèi mèi yì qǐ qù zhōng guó 。"}, {"id": "H2-R15-2", "lesson": 15, "title": "回国以前再见一面 · 小安", "text": "小安下周就要回国了。来这里学习的一年里，他常常和小月一起复习，还去过上海两次。星期日晚上，小月给他打了两次电话，想约他吃饭，但是第一次没人接。后来小安回了电话，说自己正在准备护照和机票。两个人约好九点在学校对面的饭馆见面。小安说，家里有爸爸妈妈和一个妹妹，他们已经很久没一起吃饭了。虽然很想家，但是离开朋友也有点儿难过。小月说：“以后有时间再来，我们一直欢迎你。”小安答应回国以后常常给大家发信息。机场人很多，他等了很久才办好手续，不过最后还是按时上了飞机。", "translation": "Tuần sau 小安 sắp về nước. Trong năm học ở đây cậu thường ôn cùng 小月, đã đến Thượng Hải hai lần. Tối Chủ nhật, 小月 gọi hai lần để hẹn ăn, lần đầu không ai nghe. 小安 gọi lại, nói đang chuẩn bị hộ chiếu và vé. Họ hẹn lúc chín giờ tại quán đối diện trường. Nhà cậu có bố mẹ và em gái, đã lâu chưa ăn cùng nhau. Cậu nhớ nhà nhưng cũng buồn xa bạn. 小月 hoan nghênh cậu quay lại; 小安 hứa về nước sẽ thường nhắn tin. Sân bay đông, cậu đợi lâu mới xong thủ tục nhưng cuối cùng vẫn lên máy bay đúng giờ.", "grammar": ["Phó từ tần suất", "Số lần hành động", "有"], "questions": [{"question": "小安什么时候回国？", "answer": "下周", "options": ["下周", "明年", "今天早上", "上个月"], "explanation": "Câu đầu nêu 下周就要回国了.", "id": "H2-R15-2-Q1"}, {"question": "小安去过上海几次？", "answer": "两次", "options": ["两次", "一次", "三次", "从来没去过"], "explanation": "去过……两次 diễn tả số lần trải nghiệm.", "id": "H2-R15-2-Q2"}, {"question": "小月打了几次电话？", "answer": "两次", "options": ["两次", "一次", "五次", "没有打"], "explanation": "Văn bản nói 给他打了两次电话.", "id": "H2-R15-2-Q3"}, {"id": "H2-R15-2-Q4", "question": "他最后有没有按时上飞机？", "answer": "按时上了", "options": ["按时上了", "没有上", "改坐火车", "一直留在学校"], "explanation": "Câu cuối khẳng định cậu vẫn lên máy bay đúng giờ."}, {"question": "“常常和朋友一起复习”中的“常常”放在哪里？", "answer": "动词前面", "options": ["动词前面", "动词和得中间", "句子最后面", "名词后面"], "explanation": "Phó từ tần suất đứng trước động từ hoặc cụm động từ.", "id": "H2-R15-2-Q5"}, {"question": "为什么他既高兴又有点儿难过？", "answer": "想回家，也舍不得朋友", "options": ["想回家，也舍不得朋友", "考试没通过", "没有买到水果", "不喜欢学习"], "explanation": "Nhớ gia đình nhưng buồn vì sắp rời bạn bè; cần kết hợp hai ý trong đoạn.", "id": "H2-R15-2-Q6"}], "pinyin": "xiǎo ān xià zhōu jiù yào huí guó le 。 lái zhè lǐ xué xí de yī nián lǐ ， tā cháng cháng hé xiǎo yuè yì qǐ fù xí ， hái qù guò shàng hǎi liǎng cì 。 xīng qī rì wǎn shàng ， xiǎo yuè gěi tā dǎ le liǎng cì diàn huà ， xiǎng yuē tā chī fàn ， dàn shì dì yī cì méi rén jiē 。 hòu lái xiǎo ān huí le diàn huà ， shuō zì jǐ zhèng zài zhǔn bèi hù zhào hé jī piào 。 liǎng gè rén yuē hǎo jiǔ diǎn zài xué xiào duì miàn de fàn guǎn jiàn miàn 。 xiǎo ān shuō ， jiā lǐ yǒu bà bà mā mā hé yí gè mèi mèi ， tā men yǐ jīng hěn jiǔ méi yì qǐ chī fàn le 。 suī rán hěn xiǎng jiā ， dàn shì lí kāi péng yǒu yě yǒu diǎn ér nán guò 。 xiǎo yuè shuō ： “ yǐ hòu yǒu shí jiān zài lái ， wǒ men yì zhí huān yíng nǐ 。 ” xiǎo ān dā yìng huí guó yǐ hòu cháng cháng gěi dà jiā fā xìn xī 。 jī chǎng rén hěn duō ， tā děng le hěn jiǔ cái bàn hǎo shǒu xù ， bù guò zuì hòu hái shì àn shí shàng le fēi jī 。"}, {"id": "H2-R15-3", "lesson": 15, "title": "回国以前再见一面 · 小文", "text": "小文下周就要回国了。来这里学习的一年里，他常常和小兰一起复习，还去过广州两次。星期一晚上，小兰给他打了两次电话，想约他吃饭，但是第一次没人接。后来小文回了电话，说自己正在准备护照和机票。两个人约好十点在学校对面的饭馆见面。小文说，家里有爸爸妈妈和一个妹妹，他们已经很久没一起吃饭了。虽然很想家，但是离开朋友也有点儿难过。小兰说：“以后有时间再来，我们一直欢迎你。”小文答应回国以后常常给大家发信息。朋友还送给他一本小相册，里面有这一年大家一起学习和旅行的照片。", "translation": "Tuần sau 小文 sắp về nước. Trong năm học ở đây cậu thường ôn cùng 小兰, đã đến Quảng Châu hai lần. Tối thứ Hai, 小兰 gọi hai lần để hẹn ăn, lần đầu không ai nghe. 小文 gọi lại, nói đang chuẩn bị hộ chiếu và vé. Họ hẹn lúc mười giờ tại quán đối diện trường. Nhà cậu có bố mẹ và em gái, đã lâu chưa ăn cùng nhau. Cậu nhớ nhà nhưng cũng buồn xa bạn. 小兰 hoan nghênh cậu quay lại; 小文 hứa về nước sẽ thường nhắn tin. Người bạn còn tặng tập ảnh nhỏ có ảnh một năm cùng học và du lịch.", "grammar": ["Phó từ tần suất", "Số lần hành động", "有"], "questions": [{"question": "小文什么时候回国？", "answer": "下周", "options": ["下周", "明年", "今天早上", "上个月"], "explanation": "Câu đầu nêu 下周就要回国了.", "id": "H2-R15-3-Q1"}, {"question": "小文去过广州几次？", "answer": "两次", "options": ["两次", "一次", "三次", "从来没去过"], "explanation": "去过……两次 diễn tả số lần trải nghiệm.", "id": "H2-R15-3-Q2"}, {"question": "小兰打了几次电话？", "answer": "两次", "options": ["两次", "一次", "五次", "没有打"], "explanation": "Văn bản nói 给他打了两次电话.", "id": "H2-R15-3-Q3"}, {"id": "H2-R15-3-Q4", "question": "小相册里主要有什么？", "answer": "学习和旅行的照片", "options": ["学习和旅行的照片", "所有考试答案", "银行卡信息", "医院的广告"], "explanation": "Tập ảnh lưu lại kỷ niệm học tập và du lịch."}, {"question": "“常常和朋友一起复习”中的“常常”放在哪里？", "answer": "动词前面", "options": ["动词前面", "动词和得中间", "句子最后面", "名词后面"], "explanation": "Phó từ tần suất đứng trước động từ hoặc cụm động từ.", "id": "H2-R15-3-Q5"}, {"question": "为什么他既高兴又有点儿难过？", "answer": "想回家，也舍不得朋友", "options": ["想回家，也舍不得朋友", "考试没通过", "没有买到水果", "不喜欢学习"], "explanation": "Nhớ gia đình nhưng buồn vì sắp rời bạn bè; cần kết hợp hai ý trong đoạn.", "id": "H2-R15-3-Q6"}], "pinyin": "xiǎo wén xià zhōu jiù yào huí guó le 。 lái zhè lǐ xué xí de yī nián lǐ ， tā cháng cháng hé xiǎo lán yì qǐ fù xí ， hái qù guò guǎng zhōu liǎng cì 。 xīng qī yī wǎn shàng ， xiǎo lán gěi tā dǎ le liǎng cì diàn huà ， xiǎng yuē tā chī fàn ， dàn shì dì yī cì méi rén jiē 。 hòu lái xiǎo wén huí le diàn huà ， shuō zì jǐ zhèng zài zhǔn bèi hù zhào hé jī piào 。 liǎng gè rén yuē hǎo shí diǎn zài xué xiào duì miàn de fàn guǎn jiàn miàn 。 xiǎo wén shuō ， jiā lǐ yǒu bà bà mā mā hé yí gè mèi mèi ， tā men yǐ jīng hěn jiǔ méi yì qǐ chī fàn le 。 suī rán hěn xiǎng jiā ， dàn shì lí kāi péng yǒu yě yǒu diǎn ér nán guò 。 xiǎo lán shuō ： “ yǐ hòu yǒu shí jiān zài lái ， wǒ men yì zhí huān yíng nǐ 。 ” xiǎo wén dā yìng huí guó yǐ hòu cháng cháng gěi dà jiā fā xìn xī 。 péng yǒu hái sòng gěi tā yī běn xiǎo xiàng cè ， lǐ miàn yǒu zhè yī nián dà jiā yì qǐ xué xí hé lǚ xíng de zhào piān 。"}, {"id": "H2-R15-4", "lesson": 15, "title": "回国以前再见一面 · 小东", "text": "小东下周就要回国了。来这里学习的一年里，他常常和小梅一起复习，还去过南京两次。星期三晚上，小梅给他打了两次电话，想约他吃饭，但是第一次没人接。后来小东回了电话，说自己正在准备护照和机票。两个人约好七点半在学校对面的饭馆见面。小东说，家里有爸爸妈妈和一个妹妹，他们已经很久没一起吃饭了。虽然很想家，但是离开朋友也有点儿难过。小梅说：“以后有时间再来，我们一直欢迎你。”小东答应回国以后常常给大家发信息。他回去以前又去学校看了老师，感谢这一年里老师对他的帮助。", "translation": "Tuần sau 小东 sắp về nước. Trong năm học ở đây cậu thường ôn cùng 小梅, đã đến Nam Kinh hai lần. Tối thứ Tư, 小梅 gọi hai lần để hẹn ăn, lần đầu không ai nghe. 小东 gọi lại, nói đang chuẩn bị hộ chiếu và vé. Họ hẹn lúc bảy giờ rưỡi tại quán đối diện trường. Nhà cậu có bố mẹ và em gái, đã lâu chưa ăn cùng nhau. Cậu nhớ nhà nhưng cũng buồn xa bạn. 小梅 hoan nghênh cậu quay lại; 小东 hứa về nước sẽ thường nhắn tin. Trước khi về cậu đến trường thăm thầy để cảm ơn sự giúp đỡ trong năm qua.", "grammar": ["Phó từ tần suất", "Số lần hành động", "有"], "questions": [{"question": "小东什么时候回国？", "answer": "下周", "options": ["下周", "明年", "今天早上", "上个月"], "explanation": "Câu đầu nêu 下周就要回国了.", "id": "H2-R15-4-Q1"}, {"question": "小东去过南京几次？", "answer": "两次", "options": ["两次", "一次", "三次", "从来没去过"], "explanation": "去过……两次 diễn tả số lần trải nghiệm.", "id": "H2-R15-4-Q2"}, {"question": "小梅打了几次电话？", "answer": "两次", "options": ["两次", "一次", "五次", "没有打"], "explanation": "Văn bản nói 给他打了两次电话.", "id": "H2-R15-4-Q3"}, {"id": "H2-R15-4-Q4", "question": "他为什么回去以前再去看老师？", "answer": "感谢老师的帮助", "options": ["感谢老师的帮助", "要求老师买票", "找一辆自行车", "让老师付饭钱"], "explanation": "Mục đích là cảm ơn thầy."}, {"question": "“常常和朋友一起复习”中的“常常”放在哪里？", "answer": "动词前面", "options": ["动词前面", "动词和得中间", "句子最后面", "名词后面"], "explanation": "Phó từ tần suất đứng trước động từ hoặc cụm động từ.", "id": "H2-R15-4-Q5"}, {"question": "为什么他既高兴又有点儿难过？", "answer": "想回家，也舍不得朋友", "options": ["想回家，也舍不得朋友", "考试没通过", "没有买到水果", "不喜欢学习"], "explanation": "Nhớ gia đình nhưng buồn vì sắp rời bạn bè; cần kết hợp hai ý trong đoạn.", "id": "H2-R15-4-Q6"}], "pinyin": "xiǎo dōng xià zhōu jiù yào huí guó le 。 lái zhè lǐ xué xí de yī nián lǐ ， tā cháng cháng hé xiǎo méi yì qǐ fù xí const back=()=>`<button class="back-inline" onclick="openLesson(${lesson.id},'games')">← Quay lại trang trò chơi</button>`;
const bar=(i,n)=>`<div class="progress"><div style="width:${Math.round(i*100/n)}%"></div></div>`;
function record(mode,correct,total,extra={}){store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode,correct,total,autoGraded:true,...extra});store.history=store.history.slice(0,300);save()}
window.h2StartGrammar=function(mode='choice',point=null){let questions=DATA.grammarQuestions.filter(q=>q.lesson===lesson.id&&(point===null||q.point===point));quiz={kind:'grammar',mode,point,questions:shuffle(questions),index:0,correct:0,answered:false,chosen:[],selfCount:0};session={mode:'h2-grammar'};h2GrammarQuestion()};
window.h2GrammarQuestion=function(){const s=quiz;if(s.index>=s.questions.length){const total=s.questions.length;record('Ngữ pháp · '+({choice:'Chọn từ',order:'Sắp xếp',write:'Viết câu'}[s.mode]),s.correct,s.mode==='write'?0:total,{autoGraded:s.mode!=='write',selfAssessed:s.mode==='write',completed:total,selfCorrect:s.selfCount});document.querySelector('#app').innerHTML=back()+`<section class="panel h2-complete"><span class="h2-eyebrow">HOÀN THÀNH NGỮ PHÁP</span><h2>${s.mode==='write'?'Đã tự đối chiếu '+total+' câu':s.correct+'/'+total+' câu đúng'}</h2><p>${s.mode==='write'?s.selfCount+' câu bạn tự đánh dấu đã viết đúng. Hệ thống không chấm ngữ nghĩa tự động.':'Bạn có thể xem lại những câu chưa đúng trước khi làm lượt mới.'}</p><div class="toolbar"><button class="primary" onclick="h2StartGrammar('${s.mode}',${s.point})">Làm lại</button><button onclick="h2ShowMistakes()">Xem lại câu cần ôn</button></div></section>`;return}const q=s.questions[s.index];s.answered=false;s.options=shuffle(q.options);s.chosen=[];
let controls='';if(s.mode==='choice')controls=`<h2 class="h2-chinese h2-question">${h2Tokens(q.question)}</h2><div class="h2-options">${s.options.map((a,i)=>`<button class="h2-answer" onclick="h2AnswerGrammar(${i})">${E(a)}</button>`).join('')}</div>`;
else if(s.mode==='order'){s.tiles=shuffle(Array.from(q.sentence.replace(/[。！？：“”？，、]/g,'')));controls=`<p>${E(q.translation)}</p><div id="h2-selected" class="h2-tile-answer" aria-live="polite"></div><div class="h2-tiles">${s.tiles.map((t,i)=>`<button id="h2-tile-${i}" onclick="h2PickTile(${i})">${E(t)}</button>`).join('')}</div><div class="toolbar"><button onclick="h2ResetTiles()">Xếp lại</button><button class="primary" onclick="h2AnswerGrammar()">Kiểm tra</button></div>`}
else controls=`<h2>${E(q.translation)}</h2><p>Áp dụng: ${E(lesson.structuredGrammar[q.point].name)}</p><textarea id="h2-grammar-input" class="h2-writing" rows="4" lang="zh" placeholder="Viết câu bằng tiếng Trung…"></textarea><button class="primary" onclick="h2AnswerGrammar()">Đối chiếu câu mẫu</button>`;
document.querySelector('#app').innerHTML=back()+`<section class="panel h2-exercise"><div class="row"><span class="pill">NGỮ PHÁP · BÀI ${lesson.id}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div>${bar(s.index,s.questions.length)}<p class="h2-exercise-label">${E(lesson.structuredGrammar[q.point].name)}</p>${controls}<div id="h2-feedback" aria-live="polite"></div></section>`;window.scrollTo(0,0)};
window.h2PickTile=function(i){if(quiz.answered)return;const b=document.querySelector('#h2-tile-'+i);if(b.disabled)return;quiz.chosen.push({i,text:quiz.tiles[i]});b.disabled=true;document.querySelector('#h2-selected').textContent=quiz.chosen.map(x=>x.text).join('')};
window.h2ResetTiles=function(){if(quiz.answered)return;quiz.chosen=[];document.querySelector('#h2-selected').textContent='';document.querySelectorAll('.h2-tiles button').forEach(b=>b.disabled=false)};
const normalized=s=>String(s).replace(/[\s，。！？,.!?、；：:;“”"']/g,'');
window.h2AnswerGrammar=function(i){const s=quiz;if(s.answered)return;const q=s.questions[s.index];let ok=null;if(s.mode==='choice')ok=s.options[i]===q.answer;else if(s.mode==='order'){if(!s.chosen.length)return;ok=normalized(s.chosen.map(x=>x.text).join(''))===normalized(q.sentence)}else if(!document.querySelector('#h2-grammar-input').value.trim()){document.querySelector('#h2-grammar-input').focus();return}s.answered=true;if(ok)s.correct++;if(ok===false){store.wrong[q.id]=(store.wrong[q.id]||0)+1;s.mistakes=s.mistakes||[];s.mistakes.push(q);save()}document.querySelectorAll('.h2-answer,.h2-tiles button').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('is-correct')});
document.querySelector('#h2-feedback').innerHTML=`<div class="h2-feedback ${ok===false?'is-wrong':'is-right'}"><strong>${ok===null?'Đối chiếu với một cách viết mẫu':ok?'✓ Chính xác!':'✗ Chưa đúng theo đáp án mẫu'}</strong><div class="h2-chinese">${h2Tokens(q.sentence)}</div><p class="h2-pin">${E(q.pinyin)}</p><p>${E(q.translation)}</p><div class="h2-feedback-rule"><b>Vì sao?</b> ${E(q.explanation)}</div>${s.mode==='write'?'<p>Câu dịch có thể có nhiều cách diễn đạt đúng. Hãy tự đánh giá sau khi đối chiếu.</p>':''}</div>${s.mode==='write'?`<div class="toolbar"><button class="primary" onclick="h2SelfNext(true)">Tôi đã viết đúng →</button><button onclick="h2SelfNext(false)">Cần ôn thêm →</button></div>`:`<button class="primary" onclick="h2NextGrammar()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`}`};
window.h2NextGrammar=function(){quiz.index++;h2GrammarQuestion()};window.h2SelfNext=function(ok){if(ok)quiz.selfCount++;else{quiz.mistakes=quiz.mistakes||[];quiz.mistakes.push(quiz.questions[quiz.index])}h2NextGrammar()};
window.h2ShowMistakes=function(){const s=quiz;document.querySelector('#app').innerHTML=back()+`<section class="panel"><h2>Câu cần ôn lại</h2>${(s.mistakes||[]).length?(s.mistakes||[]).map(q=>h2ExampleCard(q.sentence,q.pinyin,q.translation)+`<p>${E(q.explanation)}</p>`).join(''):'<p>Bạn không có câu nào cần ôn trong lượt này.</p>'}</section>`};
window.h2ReadingMenu=function(){session={mode:'h2-reading'};const passages=DATA.readings.filter(p=>p.lesson===lesson.id);document.querySelector('#app').innerHTML=back()+`<section class="h2-section-intro"><div><span class="h2-eyebrow">ĐỌC HIỂU · BÀI ${lesson.id}</span><h2>Đọc trong ngữ cảnh</h2><p>Bấm vào từ để xem pinyin và nghĩa · 6 câu hỏi mỗi đoạn</p></div><button class="primary" onclick="h2StartReading(-1)">Làm cả 5 đoạn · 30 câu →</button></section><div class="h2-reading-grid">${passages.map((p,i)=>`<article class="h2-reading-card"><span class="h2-eyebrow">ĐOẠN ${i+1} · ${p.text.length} CHỮ</span><h3>${E(p.title)}</h3><p>${E(p.text.slice(0,58))}…</p><div class="h2-tags">${p.grammar.map(g=>`<span>${E(g)}</span>`).join('')}</div><button class="primary" onclick="h2StartReading(${i})">Đọc và trả lời · 6 câu →</button></article>`).join('')}</div>`;window.scrollTo(0,0)};
window.h2StartReading=function(index){const all=DATA.readings.filter(p=>p.lesson===lesson.id);quiz={kind:'reading',passages:index===-1?all:[all[index]],pi:0,qi:0,correct:0,answered:false,showPinyin:false,showTranslation:false,total:index===-1?30:6,answers:[]};session={mode:'h2-reading'};h2RenderReading()};
window.h2RenderReading=function(){const s=quiz;if(s.pi>=s.passages.length){record('Đọc hiểu theo đoạn',s.correct,s.total);document.querySelector('#app').innerHTML=back()+`<section class="panel h2-complete"><span class="h2-eyebrow">HOÀN THÀNH ĐỌC HIỂU</span><h2>${s.correct}/${s.total} câu đúng</h2><p>Đã đọc ${s.passages.length} đoạn và vận dụng các mẫu câu của bài ${lesson.id}.</p><div class="toolbar"><button class="primary" onclick="h2ReadingMenu()">Chọn bài đọc khác</button><button onclick="h2ReviewReading()">Xem đáp án và giải thích</button></div></section>`;return}const p=s.passages[s.pi],q=p.questions[s.qi];s.answered=false;s.options=shuffle(q.options);const done=s.pi*6+s.qi;
document.querySelector('#app').innerHTML=back()+`<div class="toolbar"><button onclick="h2ReadingMenu()">← Danh sách bài đọc</button><span class="pill">Bài ${lesson.id} · Đoạn ${s.pi+1}/${s.passages.length}</span></div><div class="h2-reading-layout"><article class="panel h2-passage"><span class="h2-eyebrow">ĐỌC HIỂU HSK 2</span><h2>${E(p.title)}</h2><p class="h2-lookup-hint">Chạm / bấm vào một từ để tra nghĩa và nghe phát âm.</p><div class="h2-passage-text h2-chinese">${h2Tokens(p.text)}</div><div class="toolbar"><button data-say="${E(p.text)}">🔊 Nghe cả đoạn</button><button onclick="h2ToggleReading('pinyin',this)">${s.showPinyin?'Ẩn':'Hiện'} pinyin</button><button onclick="h2ToggleReading('translation',this)">${s.showTranslation?'Ẩn':'Hiện'} bản dịch</button></div><p id="h2-reading-pinyin" class="h2-pin" ${s.showPinyin?'':'hidden'}>${E(p.pinyin)}</p><p id="h2-reading-translation" class="h2-reading-translation" ${s.showTranslation?'':'hidden'}>${E(p.translation)}</p><div class="h2-tags">${p.grammar.map(g=>`<span>${E(g)}</span>`).join('')}</div></article><section class="panel h2-reading-question"><div class="row"><span class="pill">CÂU ${done+1}/${s.total}</span><span class="spacer"></span><b>Đúng ${s.correct}</b></div>${bar(done,s.total)}<h3 class="h2-chinese">${h2Tokens(q.question)}</h3><div class="h2-options">${s.options.map((a,i)=>`<button class="h2-answer" onclick="h2AnswerReading(${i})">${E(a)}</button>`).join('')}</div><div id="h2-feedback" aria-live="polite"></div></section></div>`};
window.h2ToggleReading=function(key,button){if(key==='pinyin'){quiz.showPinyin=!quiz.showPinyin;document.querySelector('#h2-reading-pinyin').hidden=!quiz.showPinyin;if(button)button.textContent=(quiz.showPinyin?'Ẩn':'Hiện')+' pinyin'}else{quiz.showTranslation=!quiz.showTranslation;document.querySelector('#h2-reading-translation').hidden=!quiz.showTranslation;if(button)button.textContent=(quiz.showTranslation?'Ẩn':'Hiện')+' bản dịch'}};
window.h2AnswerReading=function(i){const s=quiz;if(s.answered)return;const p=s.passages[s.pi],q=p.questions[s.qi],ans=s.options[i],ok=ans===q.answer;s.answered=true;if(ok)s.correct++;else store.wrong[q.id]=(store.wrong[q.id]||0)+1;s.answers.push({q,ans,ok});save();document.querySelectorAll('.h2-reading-question .h2-answer').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('is-correct');else if(b.textContent===ans)b.classList.add('is-incorrect')});document.querySelector('#h2-feedback').innerHTML=`<div class="h2-feedback ${ok?'is-right':'is-wrong'}"><strong>${ok?'✓ Chính xác!':'✗ Chưa đúng'}</strong><p>Đáp án: <span class="h2-chinese">${E(q.answer)}</span></p><p>${E(q.explanation)}</p></div><button class="primary" onclick="h2NextReading()">${s.pi*6+s.qi+1===s.total?'Xem kết quả':s.qi===5?'Đọc đoạn tiếp theo →':'Câu tiếp theo →'}</button>`};
window.h2NextReading=function(){quiz.qi++;if(quiz.qi===6){quiz.pi++;quiz.qi=0;quiz.showPinyin=false;quiz.showTranslation=false;window.scrollTo(0,0)}h2RenderReading()};
window.h2ReviewReading=function(){document.querySelector('#app').innerHTML=back()+`<section class="panel"><h2>Đáp án và giải thích</h2>${quiz.answers.map((a,i)=>`<article class="h2-review-answer"><p><b>${i+1}. ${a.ok?'✓':'✗'}</b> <span class="h2-chinese">${h2Tokens(a.q.question)}</span></p><p>Bạn chọn: ${E(a.ans)}</p><p>Đáp án: <span class="h2-chinese">${E(a.q.answer)}</span></p><p>${E(a.q.explanation)}</p></article>`).join('')}</section>`};
// Add lookup to the existing sentence games and word examples, without changing their scoring.
let decorating=false;
function decorate(){if(decorating)return;decorating=true;try{document.querySelectorAll('#app .hanzi:not(button),#topicRoot .topic-hanzi:not(button),#topicRoot .topic-muted,#topicRoot .topic-example-zh').forEach(node=>{if(node.querySelector('button,input,textarea')||node.closest('.qh-card,.qh-top,.flash,.topic-flash')||node.dataset.h2Decorated)return;const text=node.textContent;if(/[\u3400-\u9fff]/.test(text)){node.innerHTML=h2Tokens(text);node.dataset.h2Decorated='1'}})}finally{decorating=false}}
const observer=new MutationObserver(decorate);observer.observe(document.querySelector('#app'),{childList:true,subtree:true});observer.observe(document.querySelector('#topicRoot'),{childList:true,subtree:true});
// Preserve familiar game entry while directing grammar to the authored 30-question bank.
const previousStart=startGame;startGame=function(mode,custom){if(mode==='grammar'){if(custom){const ids=new Set(custom.map(w=>w.id));const selected=L.filter(l=>l.words.some(w=>ids.has(w.id)));if(!selected.length)return;lesson=selected[0];h2StartGrammar('choice');if(selected.length>1){quiz.questions=shuffle(DATA.grammarQuestions.filter(q=>selected.some(l=>l.id===q.lesson))).slice(0,30);quiz.questions=quiz.questions.map(q=>({...q,sourceLesson:q.lesson}));h2GrammarQuestion()}return}h2StartGrammar('choice');return}return previousStart(mode,custom)};
// Keep per-question grammar labels accurate for mixed-Unit review.
const baseGrammarQuestion=h2GrammarQuestion;window.h2GrammarQuestion=function(){if(quiz?.kind==='grammar'&&quiz.questions[quiz.index]?.sourceLesson){lesson=L.find(l=>l.id===quiz.questions[quiz.index].sourceLesson)}baseGrammarQuestion()};
home();
})();
