</style></head><body><header><div class="brand" onclick="home()">HSK 2 <span>Learning Quest</span></div><nav><button onclick="home();if(typeof topicExit==='function')topicExit()">Trang chủ</button><button onclick="topicHome()">29 chủ đề</button><button onclick="topicToMain('stats')">Thống kê</button><button onclick="topicToMain('review')">Ôn tập</button></nav></header><main id="app"></main><script>window.HSK_LESSONS=[{"id": 1, "title": "Gặp gỡ và nhờ giúp đỡ", "subtitle": "就 · 给 · 让 · 接", "words": [{"id": "hsk2-01-01", "hanzi": "就", "pinyin": "jiù", "meaning": "ngay lập tức", "example": "我马上就来。", "examplePinyin": "Wǒ mǎshàng jiù lái.", "translation": "Tôi sẽ đến ngay."}, {"id": "hsk2-01-02", "hanzi": "给", "pinyin": "gěi", "meaning": "cho", "example": "请给我一杯水。", "examplePinyin": "Qǐng gěi wǒ yì bēi shuǐ.", "translation": "Hãy cho tôi một cốc nước."}, {"id": "hsk2-01-03", "hanzi": "让", "pinyin": "ràng", "meaning": "cho phép, yêu cầu", "example": "老师让我们读书。", "examplePinyin": "Lǎoshī ràng wǒmen dú shū.", "translation": "Thầy giáo yêu cầu chúng tôi đọc sách."}, {"id": "hsk2-01-04", "hanzi": "接", "pinyin": "jiē", "meaning": "đón, nhận", "example": "我去机场接你。", "examplePinyin": "Wǒ qù jīchǎng jiē nǐ.", "translation": "Tôi ra sân bay đón bạn."}, {"id": "hsk2-01-05", "hanzi": "次", "pinyin": "cì", "meaning": "lần", "example": "我去过北京两次。", "examplePinyin": "Wǒ qù guo Běijīng liǎng cì.", "translation": "Tôi đã đến Bắc Kinh hai lần."}, {"id": "hsk2-01-06", "hanzi": "旅游", "pinyin": "lǚyóu", "meaning": "du lịch", "example": "我喜欢去中国旅游。", "examplePinyin": "Wǒ xǐhuan qù Zhōngguó lǚyóu.", "translation": "Tôi thích du lịch Trung Quốc."}, {"id": "hsk2-01-07", "hanzi": "帮忙", "pinyin": "bāngmáng", "meaning": "giúp đỡ", "example": "你能帮忙吗？", "examplePinyin": "Nǐ néng bāngmáng ma?", "translation": "Bạn có thể giúp không?"}, {"id": "hsk2-01-08", "hanzi": "不好意思", "pinyin": "bù hǎo yìsi", "meaning": "ngại, xin lỗi", "example": "不好意思，我来晚了。", "examplePinyin": "Bù hǎo yìsi, wǒ lái wǎn le.", "translation": "Xin lỗi, tôi đến muộn."}, {"id": "hsk2-01-09", "hanzi": "已经", "pinyin": "yǐjīng", "meaning": "đã", "example": "我已经吃饭了。", "examplePinyin": "Wǒ yǐjīng chī fàn le.", "translation": "Tôi đã ăn cơm rồi."}, {"id": "hsk2-01-10", "hanzi": "那", "pinyin": "nà", "meaning": "đó, kia", "example": "那是我的书。", "examplePinyin": "Nà shì wǒ de shū.", "translation": "Đó là sách của tôi."}, {"id": "hsk2-01-11", "hanzi": "介绍", "pinyin": "jièshào", "meaning": "giới thiệu", "example": "我来介绍一下。", "examplePinyin": "Wǒ lái jièshào yíxià.", "translation": "Để tôi giới thiệu một chút."}, {"id": "hsk2-01-12", "hanzi": "有时", "pinyin": "yǒushí", "meaning": "đôi khi", "example": "我有时喝咖啡。", "examplePinyin": "Wǒ yǒushí hē kāfēi.", "translation": "Đôi khi tôi uống cà phê."}, {"id": "hsk2-01-13", "hanzi": "懂", "pinyin": "dǒng", "meaning": "hiểu", "example": "我听懂了。", "examplePinyin": "Wǒ tīng dǒng le.", "translation": "Tôi nghe hiểu rồi."}, {"id": "hsk2-01-14", "hanzi": "意思", "pinyin": "yìsi", "meaning": "ý nghĩa", "example": "这是什么意思？", "examplePinyin": "Zhè shì shénme yìsi?", "translation": "Cái này có nghĩa là gì?"}], "grammar": [{"name": "Trợ từ ngữ khí 吧", "details": ["Công thức: Câu + 吧 (biểu thị yêu cầu, gợi ý, nghi vấn)", "Giải thích: Trợ từ ngữ khí 「吧」 được đặt cuối câu để làm mềm giọng điệu. Nó thường dùng để đưa ra lời đề nghị, thúc giục nhẹ nhàng hoặc dùng trong câu nghi vấn để phỏng đoán một sự việc.", "Mẹo: Dùng 「吧」 giúp câu nói của bạn nghe tự nhiên và lịch sự hơn như khi bạn nói 'nhỉ', 'nhé' hay 'được không' trong tiếng Việt.", "Lưu ý: Không dùng 「吧」 trong các câu hỏi trang trọng hoặc câu hỏi dùng từ để hỏi như 「什么」, 「谁」, 「哪里」.", "你们就是她的学生吧？", "nǐ men jiù shì tā de xué shēng ba", "Các bạn chính là học sinh của cô ấy phải không?", "她唱歌很好听吧？", "tā chàng gē hěn hǎo tīng ba", "Cô ấy hát rất hay phải không?", "陈天中是泰国人吧？", "chén tiān zhōng shì tài guó rén ba", "Trần Thiên Trung là người Thái Lan phải không?", "Ví dụ: 你们就是她的学生吧？"]}, {"name": "Nhấn mạnh thông tin đã xảy ra", "details": ["Công thức: S + 是 + [thông tin chi tiết] + V + 的", "Giải thích: Cấu trúc 「是……的」 dùng để nhấn mạnh các chi tiết như thời gian, địa điểm, cách thức hoặc người thực hiện của một sự việc đã xảy ra trong quá khứ. Trong đó, 「是」 thường có thể lược bỏ, nhưng 「的」 bắt buộc phải có ở cuối câu.", "Mẹo: Hãy tưởng tượng bạn đã biết sự việc xảy ra rồi, và cấu trúc này giúp bạn làm rõ 'khi nào', 'ở đâu' hoặc 'bằng cách nào' sự việc đó diễn ra.", "Lưu ý: Đừng dùng cấu trúc này để kể về một hành động đang xảy ra ở hiện tại hoặc tương lai, nó chỉ dùng cho sự việc đã hoàn thành.", "我是昨天到的。", "wǒ shì zuó tiān dào de", "Tôi đến vào ngày hôm qua.", "你是怎么来的？我是坐地铁来的。", "nǐ shì zěn me lái de wǒ shì zuò dì tiě lái de", "Bạn đến bằng cách nào? Tôi đi tàu điện ngầm đến.", "Ví dụ: 我是昨天到的。"]}, {"name": "Câu kiêm ngữ", "details": ["Công thức: Chủ ngữ 1 + Động từ (请/叫/让) + Tân ngữ/Chủ ngữ 2 + Động từ", "Giải thích: Câu kiêm ngữ là loại câu có hai vế, trong đó tân ngữ của động từ thứ nhất đồng thời đóng vai trò là chủ ngữ của động từ thứ hai. Cấu trúc này thường dùng để sai khiến, nhờ vả hoặc cho phép ai đó làm một việc gì đó.", "Mẹo: Hãy ghi nhớ các động từ phổ biến trong cấu trúc này là 「请」 (mời/xin), 「叫」 (bảo/gọi) và 「让」 (cho phép/để cho).", "Lưu ý: Đừng thêm chủ ngữ thứ hai vào giữa câu, vì tân ngữ của động từ đầu tiên đã đảm nhận vị trí đó rồi.", "我想请你帮个忙。", "wǒ xiǎng qǐng nǐ bāng gè máng", "Tôi muốn nhờ bạn giúp một tay.", "王老师让我们说中文。", "wáng lǎo shī ràng wǒ men shuō zhōng wén", "Thầy Vương bảo chúng tôi nói tiếng Trung.", "妈妈叫孩子们回家。", "mā mā jiào hái zi men huí jiā", "Mẹ gọi bọn trẻ về nhà.", "Ví dụ: 我想请你帮个忙。"]}], "extended": [], "structuredGrammar": [{"name": "Trợ từ ngữ khí 吧", "formula": "Câu + 吧 (biểu thị yêu cầu, gợi ý, nghi vấn)", "explanation": "Trợ từ ngữ khí 「吧」 được đặt cuối câu để làm mềm giọng điệu. Nó thường dùng để đưa ra lời đề nghị, thúc giục nhẹ nhàng hoặc dùng trong câu nghi vấn để phỏng đoán một sự việc.", "tip": "Dùng 「吧」 giúp câu nói của bạn nghe tự nhiên và lịch sự hơn như khi bạn nói 'nhỉ', 'nhé' hay 'được không' trong tiếng Việt.", "note": "Không dùng 「吧」 trong các câu hỏi trang trọng hoặc câu hỏi dùng từ để hỏi như 「什么」, 「谁」, 「哪里」.", "examples": [{"zh": "你们就是她的学生吧？", "pinyin": "nǐ men jiù shì tā de xué shēng ba", "vi": "Các bạn chính là học sinh của cô ấy phải không?"}, {"zh": "她唱歌很好听吧？", "pinyin": "tā chàng gē hěn hǎo tīng ba", "vi": "Cô ấy hát rất hay phải không?"}, {"zh": "陈天中是泰国人吧？", "pinyin": "chén tiān zhōng shì tài guó rén ba", "vi": "Trần Thiên Trung là người Thái Lan phải không?"}], "newExamples": [{"zh": "外面有点儿冷，小林，我们回家吧。", "pinyin": "wài miàn yǒu diǎn ér lěng ， xiǎo lín ， wǒ men huí jiā ba 。", "vi": "Ngoài trời hơi lạnh, 小林, chúng ta về nhà nhé."}, {"zh": "小林说：“时间不早了，早点儿睡吧。”", "pinyin": "xiǎo lín shuō ： “ shí jiān bù zǎo le ， zǎo diǎn ér shuì ba 。 ”", "vi": "小林 nói: “Không còn sớm nữa, hãy ngủ sớm nhé.”"}]}, {"name": "Nhấn mạnh thông tin đã xảy ra", "formula": "S + 是 + [thông tin chi tiết] + V + 的", "explanation": "Cấu trúc 「是……的」 dùng để nhấn mạnh các chi tiết như thời gian, địa điểm, cách thức hoặc người thực hiện của một sự việc đã xảy ra trong quá khứ. Trong đó, 「是」 thường có thể lược bỏ, nhưng 「的」 bắt buộc phải có ở cuối câu.", "tip": "Hãy tưởng tượng bạn đã biết sự việc xảy ra rồi, và cấu trúc này giúp bạn làm rõ 'khi nào', 'ở đâu' hoặc 'bằng cách nào' sự việc đó diễn ra.", "note": "Đừng dùng cấu trúc này để kể về một hành động đang xảy ra ở hiện tại hoặc tương lai, nó chỉ dùng cho sự việc đã hoàn thành.", "examples": [{"zh": "我是昨天到的。", "pinyin": "wǒ shì zuó tiān dào de", "vi": "Tôi đến vào ngày hôm qua."}, {"zh": "你是怎么来的？我是坐地铁来的。", "pinyin": "nǐ shì zěn me lái de wǒ shì zuò dì tiě lái de", "vi": "Bạn đến bằng cách nào? Tôi đi tàu điện ngầm đến."}], "newExamples": [{"zh": "小林是昨天坐飞机来的。", "pinyin": "xiǎo lín shì zuó tiān zuò fēi jī lái de 。", "vi": "小林 đã đến bằng máy bay vào hôm qua."}, {"zh": "小林是和小雨一起来的。", "pinyin": "xiǎo lín shì hé xiǎo yǔ yì qǐ lái de 。", "vi": "小林 đã đến cùng với 小雨."}]}, {"name": "Câu kiêm ngữ", "formula": "Chủ ngữ 1 + Động từ (请/叫/让) + Tân ngữ/Chủ ngữ 2 + Động từ", "explanation": "Câu kiêm ngữ là loại câu có hai vế, trong đó tân ngữ của động từ thứ nhất đồng thời đóng vai trò là chủ ngữ của động từ thứ hai. Cấu trúc này thường dùng để sai khiến, nhờ vả hoặc cho phép ai đó làm một việc gì đó.", "tip": "Hãy ghi nhớ các động từ phổ biến trong cấu trúc này là 「请」 (mời/xin), 「叫」 (bảo/gọi) và 「让」 (cho phép/để cho).", "note": "Đừng thêm chủ ngữ thứ hai vào giữa câu, vì tân ngữ của động từ đầu tiên đã đảm nhận vị trí đó rồi.", "examples": [{"zh": "我想请你帮个忙。", "pinyin": "wǒ xiǎng qǐng nǐ bāng gè máng", "vi": "Tôi muốn nhờ bạn giúp một tay."}, {"zh": "王老师让我们说中文。", "pinyin": "wáng lǎo shī ràng wǒ men shuō zhōng wén", "vi": "Thầy Vương bảo chúng tôi nói tiếng Trung."}, {"zh": "妈妈叫孩子们回家。", "pinyin": "mā mā jiào hái zi men huí jiā", "vi": "Mẹ gọi bọn trẻ về nhà."}], "newExamples": [{"zh": "老师让小林先读这句话。", "pinyin": "lǎo shī ràng xiǎo lín xiān dú zhè jù huà 。", "vi": "Thầy bảo 小林 đọc câu này trước."}, {"zh": "小林想请小雨帮忙买票。", "pinyin": "xiǎo lín xiǎng qǐng xiǎo yǔ bāng máng mǎi piào 。", "vi": "小林 muốn nhờ 小雨 giúp mua vé."}]}]}, {"id": 2, "title": "Đường đến trường", "subtitle": "公交车 · 但 · 车站 · 远", "words": [{"id": "hsk2-02-01", "hanzi": "公交车", "pinyin": "gōngjiāochē", "meaning": "xe buýt", "example": "我坐公交车上学。", "examplePinyin": "Wǒ zuò gōngjiāochē shàngxué.", "translation": "Tôi đi xe buýt đến trường."}, {"id": "hsk2-02-02", "hanzi": "但", "pinyin": "dàn", "meaning": "nhưng", "example": "我想去，但没时间。", "examplePinyin": "Wǒ xiǎng qù, dàn méi shíjiān.", "translation": "Tôi muốn đi nhưng không có thời gian."}, {"id": "hsk2-02-03", "hanzi": "车站", "pinyin": "chēzhàn", "meaning": "bến xe", "example": "车站在前面。", "examplePinyin": "Chēzhàn zài qiánmiàn.", "translation": "Bến xe ở phía trước."}, {"id": "hsk2-02-04", "hanzi": "远", "pinyin": "yuǎn", "meaning": "xa", "example": "学校离家很远。", "examplePinyin": "Xuéxiào lí jiā hěn yuǎn.", "translation": "Trường cách nhà rất xa."}, {"id": "hsk2-02-05", "hanzi": "打车", "pinyin": "dǎchē", "meaning": "bắt taxi", "example": "我们打车去吧。", "examplePinyin": "Wǒmen dǎchē qù ba.", "translation": "Chúng ta bắt taxi đi."}, {"id": "hsk2-02-06", "hanzi": "还是", "pinyin": "háishi", "meaning": "hay là", "example": "你喝茶还是咖啡？", "examplePinyin": "Nǐ hē chá háishi kāfēi?", "translation": "Bạn uống trà hay cà phê?"}, {"id": "hsk2-02-07", "hanzi": "啊", "pinyin": "a", "meaning": "trợ từ cảm thán", "example": "今天真冷啊！", "examplePinyin": "Jīntiān zhēn lěng a!", "translation": "Hôm nay lạnh thật!"}, {"id": "hsk2-02-08", "hanzi": "万", "pinyin": "wàn", "meaning": "mười nghìn", "example": "这里有一万人。", "examplePinyin": "Zhèlǐ yǒu yí wàn rén.", "translation": "Ở đây có mười nghìn người."}, {"id": "hsk2-02-09", "hanzi": "名", "pinyin": "míng", "meaning": "lượng từ chỉ người", "example": "他是一名老师。", "examplePinyin": "Tā shì yì míng lǎoshī.", "translation": "Anh ấy là một giáo viên."}, {"id": "hsk2-02-10", "hanzi": "网上", "pinyin": "wǎngshàng", "meaning": "trên mạng", "example": "我在网上买书。", "examplePinyin": "Wǒ zài wǎngshàng mǎi shū.", "translation": "Tôi mua sách trên mạng."}, {"id": "hsk2-02-11", "hanzi": "外国", "pinyin": "wàiguó", "meaning": "nước ngoài", "example": "她来自外国。", "examplePinyin": "Tā láizì wàiguó.", "translation": "Cô ấy đến từ nước ngoài."}, {"id": "hsk2-02-12", "hanzi": "间", "pinyin": "jiān", "meaning": "lượng từ phòng", "example": "这间教室很大。", "examplePinyin": "Zhè jiān jiàoshì hěn dà.", "translation": "Phòng học này rất rộng."}, {"id": "hsk2-02-13", "hanzi": "教室", "pinyin": "jiàoshì", "meaning": "phòng học", "example": "学生在教室里。", "examplePinyin": "Xuésheng zài jiàoshì lǐ.", "translation": "Học sinh ở trong lớp."}, {"id": "hsk2-02-14", "hanzi": "票", "pinyin": "piào", "meaning": "vé", "example": "我买了两张票。", "examplePinyin": "Wǒ mǎi le liǎng zhāng piào.", "translation": "Tôi mua hai vé."}, {"id": "hsk2-02-15", "hanzi": "别", "pinyin": "bié", "meaning": "đừng", "example": "别说话。", "examplePinyin": "Bié shuōhuà.", "translation": "Đừng nói chuyện."}, {"id": "hsk2-02-16", "hanzi": "过来", "pinyin": "guòlai", "meaning": "đến đây", "example": "请过来一下。", "examplePinyin": "Qǐng guòlai yíxià.", "translation": "Hãy qua đây một chút."}], "grammar": [{"name": "Cấu trúc đưa ra đề nghị: Hay là... đi", "details": ["Công thức: 还是 + [lựa chọn/động từ] + 吧", "Giải thích: Cấu trúc này được dùng để đưa ra một đề nghị hoặc một quyết định sau khi đã cân nhắc các lựa chọn. Trong tiếng Việt, nó tương đương với cụm \"Hay là... đi\" hoặc \"Thôi thì... vậy\", giúp câu nói trở nên nhẹ nhàng và lịch sự hơn.", "Mẹo: Bạn có thể dùng cấu trúc này khi muốn thay đổi ý định hoặc chốt lại phương án sau khi phân vân giữa nhiều lựa chọn.", "Lưu ý: Đừng nhầm lẫn với 「还是」 dùng trong câu hỏi lựa chọn, trong cấu trúc này 「吧」 bắt buộc phải đứng cuối câu để thể hiện ý cầu khiến.", "我们还是打车去吧。", "wǒ men hái shì dǎ chē qù ba", "Chúng ta hay là bắt taxi đi đi.", "那件衣服很好看，还是买那件吧。", "nà jiàn yī fú hěn hǎo kàn hái shì mǎi nà jiàn ba", "Bộ quần áo kia rất đẹp, hay là mua bộ đó đi.", "你第一次去北京，还是找个人接你吧。", "nǐ dì yī cì qù běi jīng hái shì zhǎo gè rén jiē nǐ ba", "Lần đầu bạn đến Bắc Kinh, hay là tìm người đón bạn đi.", "Ví dụ: 我们还是打车去吧。"]}, {"name": "Cách dùng 多 biểu thị số ước lượng", "details": ["Công thức: Số đếm + Lượng từ + 多 + Danh từ", "Giải thích: Trong tiếng Trung, để diễn tả một số lượng lớn hơn con số đã nêu, chúng ta đặt 「多」 ngay sau số đếm và lượng từ. Cấu trúc này giúp biểu thị ý nghĩa 'hơn' hoặc 'trên' một số lượng nhất định.", "Mẹo: Nếu số đếm là hàng chục (như 10, 20...), đặt 「多」 sau số đếm và trước lượng từ (ví dụ: 十多个人 - hơn 10 người).", "Lưu ý: Cần phân biệt với 「几」, vì 「多」 thường dùng cho số lượng lớn hơn, còn 「几」 dùng để hỏi hoặc ước lượng số lượng nhỏ hơn 10.", "北京大学有四万多名学生呢！", "běi jīng dà xué yǒu sì wàn duō míng xué shēng ne", "Đại học Bắc Kinh có hơn 40.000 sinh viên đấy!", "教室里有二十多个学生。", "jiào shì lǐ yǒu èr shí duō gè xué shēng", "Trong lớp học có hơn 20 học sinh.", "这两个苹果五块多钱。", "zhè liǎng gè píng guǒ wǔ kuài duō qián", "Hai quả táo này có giá hơn 5 tệ.", "Ví dụ: 北京大学有四万多名学生呢！"]}, {"name": "Động từ/cụm động từ làm định ngữ", "details": ["Công thức: Định ngữ (Động từ/Cụm động từ) + 的 + Trung tâm ngữ", "Giải thích: Khi muốn dùng một hành động hoặc cụm từ để mô tả cho một danh từ, ta đặt hành động đó lên trước danh từ. Bắt buộc phải thêm trợ từ 「的」 vào giữa để nối định ngữ và trung tâm ngữ.", "Mẹo: Hãy xem định ngữ là một 'nhãn dán' mô tả tính chất cho danh từ phía sau, ví dụ: 'quần áo' (trung tâm ngữ) + 'mới mua' (định ngữ) = 'quần áo mới mua' 「新买的衣服」.", "Lưu ý: Đừng quên chữ 「的」, nếu thiếu nó câu văn sẽ bị coi là sai ngữ pháp trong tiếng Trung.", "他们卖的电影票也很便宜。", "tā men mài de diàn yǐng piào yě hěn pián yí", "Vé xem phim họ bán cũng rất rẻ.", "现在学中文的学生很多。", "xiàn zài xué zhōng wén de xué shēng hěn duō", "Bây giờ học sinh học tiếng Trung rất nhiều.", "这是朋友给我的杯子。", "zhè shì péng yǒu gěi wǒ de bēi zi", "Đây là cái ly bạn tôi tặng cho tôi.", "Ví dụ: 他们卖的电影票也很便宜。"]}], "extended": [], "structuredGrammar": [{"name": "Cấu trúc đưa ra đề nghị: Hay là... đi", "formula": "还是 + [lựa chọn/động từ] + 吧", "explanation": "Cấu trúc này được dùng để đưa ra một đề nghị hoặc một quyết định sau khi đã cân nhắc các lựa chọn. Trong tiếng Việt, nó tương đương với cụm \"Hay là... đi\" hoặc \"Thôi thì... vậy\", giúp câu nói trở nên nhẹ nhàng và lịch sự hơn.", "tip": "Bạn có thể dùng cấu trúc này khi muốn thay đổi ý định hoặc chốt lại phương án sau khi phân vân giữa nhiều lựa chọn.", "note": "Đừng nhầm lẫn với 「还是」 dùng trong câu hỏi lựa chọn, trong cấu trúc này 「吧」 bắt buộc phải đứng cuối câu để thể hiện ý cầu khiến.", "examples": [{"zh": "我们还是打车去吧。", "pinyin": "wǒ men hái shì dǎ chē qù ba", "vi": "Chúng ta hay là bắt taxi đi đi."}, {"zh": "那件衣服很好看，还是买那件吧。", "pinyin": "nà jiàn yī fú hěn hǎo kàn hái shì mǎi nà jiàn ba", "vi": "Bộ quần áo kia rất đẹp, hay là mua bộ đó đi."}, {"zh": "你第一次去北京，还是找个人接你吧。", "pinyin": "nǐ dì yī cì qù běi jīng hái shì zhǎo gè rén jiē nǐ ba", "vi": "Lần đầu bạn đến Bắc Kinh, hay là tìm người đón bạn đi."}], "newExamples": [{"zh": "小林说：“外面下雨了，我们还是坐车去吧。”", "pinyin": "xiǎo lín shuō ： “ wài miàn xià yǔ le ， wǒ men hái shì zuò chē qù ba 。 ”", "vi": "小林 nói: “Ngoài trời mưa rồi, chúng ta đi xe thì hơn.”"}, {"zh": "小林说：“太晚了，还是明天再去吧。”", "pinyin": "xiǎo lín shuō ： “ tài wǎn le ， hái shì míng tiān zài qù ba 。 ”", "vi": "小林 nói: “Muộn quá, hay để ngày mai đi nhé.”"}]}, {"name": "Cách dùng 多 biểu thị số ước lượng", "formula": "Số nguyên chục + 多 + lượng từ + danh từ; hoặc số + lượng từ + 多 + danh từ (tùy đơn vị)", "explanation": "Trong tiếng Trung, để diễn tả một số lượng lớn hơn con số đã nêu, chúng ta đặt 「多」 ngay sau số đếm và lượng từ. Cấu trúc này giúp biểu thị ý nghĩa 'hơn' hoặc 'trên' một số lượng nhất định.", "tip": "Nếu số đếm là hàng chục (như 10, 20...), đặt 「多」 sau số đếm và trước lượng từ (ví dụ: 十多个人 - hơn 10 người).", "note": "Cần phân biệt với 「几」, vì 「多」 thường dùng cho số lượng lớn hơn, còn 「几」 dùng để hỏi hoặc ước lượng số lượng nhỏ hơn 10.", "examples": [{"zh": "北京大学有四万多名学生呢！", "pinyin": "běi jīng dà xué yǒu sì wàn duō míng xué shēng ne", "vi": "Đại học Bắc Kinh có hơn 40.000 sinh viên đấy!"}, {"zh": "教室里有二十多个学生。", "pinyin": "jiào shì lǐ yǒu èr shí duō gè xué shēng", "vi": "Trong lớp học có hơn 20 học sinh."}, {"zh": "这两个苹果五块多钱。", "pinyin": "zhè liǎng gè píng guǒ wǔ kuài duō qián", "vi": "Hai quả táo này có giá hơn 5 tệ."}], "clarification": "Ví dụ: 二十多个学生 (hơn 20 học sinh), 五块多钱 (hơn 5 tệ). Vị trí 多 cần phù hợp với đơn vị và cách đếm.", "newExamples": [{"zh": "小林买的书十多块钱。", "pinyin": "xiǎo lín mǎi de shū shí duō kuài qián 。", "vi": "Sách 小林 mua có giá hơn mười tệ."}, {"zh": "小林在车站等了二十多分钟。", "pinyin": "xiǎo lín zài chē zhàn děng le èr shí duō fēn zhōng 。", "vi": "小林 đã đợi ở bến xe hơn hai mươi phút."}]}, {"name": "Động từ/cụm động từ làm định ngữ", "formula": "Định ngữ (Động từ/Cụm động từ) + 的 + Trung tâm ngữ", "explanation": "Khi muốn dùng một hành động hoặc cụm từ để mô tả cho một danh từ, ta đặt hành động đó lên trước danh từ. Bắt buộc phải thê  các động từ chỉ trạng thái tâm lý như 「爱」, 「想」 hay 「知道」.", "我休息了一下，现在觉得不累了。", "wǒ xiū xī le yī xià xiàn zài jué de bù lèi le", "Tôi đã nghỉ ngơi một lát, bây giờ thấy không mệt nữa rồi.", "他昨天来帮了帮忙。", "tā zuó tiān lái bāng le bāng máng", "Hôm qua anh ấy đã đến giúp một tay.", "Ví dụ: 我休息了一下，现在觉得不累了。"]}], "extended": [], "structuredGrammar": [{"name": "Bổ ngữ kết quả", "formula": "Chủ ngữ + Động từ + Bổ ngữ kết quả + (Tân ngữ)", "explanation": "Bổ ngữ kết quả được đặt ngay sau động từ chính để làm rõ kết quả hoặc trạng thái sau khi hành động xảy ra. Nó giúp người nghe hiểu rõ hơn về tính hoàn tất hoặc kết quả cụ thể của hành động đó trong câu.", "tip": "Các bổ ngữ kết quả thông dụng thường gặp là 「完」(xong), 「懂」(hiểu), 「见」(thấy), 「好」(xong/tốt), 「到」(đạt tới).", "note": "Khi phủ định, ta dùng 「没」(méi) hoặc 「没有」(méiyǒu) đặt trước động từ, tuyệt đối không dùng 「不」(bù) với bổ ngữ kết quả.", "examples": [{"zh": "菜都做好了。", "pinyin": "cài dōu zuò hǎo le", "vi": "Thức ăn đều đã nấu xong rồi."}, {"zh": "我吃完饭了。", "pinyin": "wǒ chī wán fàn le", "vi": "Tôi ăn cơm xong rồi."}, {"zh": "小雪今天来晚了。", "pinyin": "xiǎo xuě jīn tiān lái wǎn le", "vi": "Tiểu Tuyết hôm nay đến muộn rồi."}], "newExamples": [{"zh": "小林吃完饭以后就去上课了。", "pinyin": "xiǎo lín chī wán fàn yǐ hòu jiù qù shàng kè le 。", "vi": "Sau khi ăn cơm xong 小林 đi học ngay."}, {"zh": "老师又说了一遍，小林终于听懂了。", "pinyin": "lǎo shī yòu shuō le yī biàn ， xiǎo lín zhōng yú tīng dǒng le 。", "vi": "Thầy nói lại một lần, cuối cùng 小林 đã nghe hiểu."}]}, {"name": "Lặp lại động từ", "formula": "AA (động từ đơn) hoặc ABAB (động từ đôi)", "explanation": "Lặp lại động từ nhằm diễn tả hành động xảy ra trong thời gian ngắn, thử nghiệm hoặc mang sắc thái nhẹ nhàng. Cấu trúc này thường được dùng trong văn nói để tạo cảm giác gần gũi, thoải mái hơn. Ví dụ: 「看看」(xem thử) hoặc 「休息休息」(nghỉ ngơi một chút).", "tip": "Nếu động từ có hai âm tiết, bạn hãy lặp lại cả cụm theo dạng 「ABAB」, ví dụ 「打扫打扫」.", "note": "Không được dùng cấu trúc này với các động từ chỉ trạng thái tâm lý hoặc sự tồn tại như 「知道」, 「在」, 「有」.", "examples": [{"zh": "那你再想一想，你想好了，我来买票。", "pinyin": "nà nǐ zài xiǎng yī xiǎng nǐ xiǎng hǎo le wǒ lái mǎi piào", "vi": "Vậy bạn nghĩ thêm chút nữa đi, bạn nghĩ xong rồi thì mình sẽ đi mua vé."}, {"zh": "我有点儿累，现在想休息休息。", "pinyin": "wǒ yǒu diǎn ér lèi xiàn zài xiǎng xiū xī xiū xī", "vi": "Tôi hơi mệt, bây giờ muốn nghỉ ngơi một chút."}, {"zh": "你能过来帮帮忙吗？", "pinyin": "nǐ néng guò lái bāng bāng máng ma", "vi": "Bạn có thể qua đây giúp một tay không?"}], "newExamples": [{"zh": "这本书很有意思，小林，你也看看吧。", "pinyin": "zhè běn shū hěn yǒu yì si ， xiǎo lín ， nǐ yě kàn kàn ba 。", "vi": "Sách này thú vị, 小林, bạn cũng xem thử nhé."}, {"zh": "小林有点儿累，想先休息休息。", "pinyin": "xiǎo lín yǒu diǎn ér lèi ， xiǎng xiān xiū xī xiū xī 。", "vi": "小林 hơi mệt, muốn nghỉ một chút trước."}]}, {"name": "Lặp lại động từ", "formula": "Động từ đơn: AA | Động từ đa: ABAB | Thêm '了' giữa: A了A / AB了AB", "explanation": "Việc lặp lại động từ nhằm diễn tả hành động xảy ra trong thời gian ngắn, mang tính chất thử nghiệm hoặc nhẹ nhàng. Cấu trúc này giúp câu văn trở nên tự nhiên và mềm mại hơn trong giao tiếp.", "tip": "Nếu động từ là từ đơn âm tiết, bạn có thể thêm 「了」 vào giữa hai từ, ví dụ: 「看一看」 hoặc 「看一看」 đều ổn.", "note": "Động từ lặp lại thường chỉ dùng cho các hành động mang tính ý chí, không dùng cho các động từ chỉ trạng thái tâm lý như 「爱」, 「想」 hay 「知道」.", "examples": [{"zh": "我休息了一下，现在觉得不累了。", "pinyin": "wǒ xiū xī le yī xià xiàn zài jué de bù lèi le", "vi": "Tôi đã nghỉ ngơi một lát, bây giờ thấy không mệt nữa rồi."}, {"zh": "他昨天来帮了帮忙。", "pinyin": "tā zuó tiān lái bāng le bāng máng", "vi": "Hôm qua anh ấy đã đến giúp một tay."}], "newExamples": [{"zh": "小林看了看菜单，点了一碗面。", "pinyin": "xiǎo lín kàn le kàn cài dān ， diǎn le yī wǎn miàn 。", "vi": "小林 xem qua thực đơn rồi gọi một bát mì."}, {"zh": "小林想和小雨讨论讨论周末的计划。", "pinyin": "xiǎo lín xiǎng hé xiǎo yǔ tǎo lùn tǎo lùn zhōu mò de jì huà 。", "vi": "小林 muốn bàn một chút với 小雨 về kế hoạch cuối tuần."}]}]}, {"id": 4, "title": "Mua sắm và trải nghiệm", "subtitle": "过 · 商场 · 进去 · 条", "words": [{"id": "hsk2-04-01", "hanzi": "过", "pinyin": "guò", "meaning": "đã từng", "example": "我去过中国。", "examplePinyin": "Wǒ qù guo Zhōngguó.", "translation": "Tôi từng đến Trung Quốc."}, {"id": "hsk2-04-02", "hanzi": "商场", "pinyin": "shāngchǎng", "meaning": "trung tâm thương mại", "example": "商场里人很多。", "examplePinyin": "Shāngchǎng lǐ rén hěn duō.", "translation": "Trong trung tâm thương mại có nhiều người."}, {"id": "hsk2-04-03", "hanzi": "进去", "pinyin": "jìnqu", "meaning": "đi vào", "example": "请进去坐。", "examplePinyin": "Qǐng jìnqu zuò.", "translation": "Mời vào trong ngồi."}, {"id": "hsk2-04-04", "hanzi": "条", "pinyin": "tiáo", "meaning": "lượng từ vật dài", "example": "我买了一条裤子。", "examplePinyin": "Wǒ mǎi le yì tiáo kùzi.", "translation": "Tôi mua một chiếc quần."}, {"id": "hsk2-04-05", "hanzi": "裤子", "pinyin": "kùzi", "meaning": "quần", "example": "这条裤子很漂亮。", "examplePinyin": "Zhè tiáo kùzi hěn piàoliang.", "translation": "Chiếc quần này rất đẹp."}, {"id": "hsk2-04-06", "hanzi": "白色", "pinyin": "báisè", "meaning": "màu trắng", "example": "我喜欢白色。", "examplePinyin": "Wǒ xǐhuan báisè.", "translation": "Tôi thích màu trắng."}, {"id": "hsk2-04-07", "hanzi": "因为", "pinyin": "yīnwèi", "meaning": "bởi vì", "example": "因为下雨，我没出去。", "examplePinyin": "Yīnwèi xià yǔ, wǒ méi chūqu.", "translation": "Vì trời mưa nên tôi không ra ngoài."}, {"id": "hsk2-04-08", "hanzi": "试", "pinyin": "shì", "meaning": "thử", "example": "我想试一下。", "examplePinyin": "Wǒ xiǎng shì yíxià.", "translation": "Tôi muốn thử một chút."}, {"id": "hsk2-04-09", "hanzi": "红色", "pinyin": "hóngsè", "meaning": "màu đỏ", "example": "她喜欢红色。", "examplePinyin": "Tā xǐhuan hóngsè.", "translation": "Cô ấy thích màu đỏ."}, {"id": "hsk2-04-10", "hanzi": "所以", "pinyin": "suǒyǐ", "meaning": "cho nên", "example": "我累了，所以想休息。", "examplePinyin": "Wǒ lèi le, suǒyǐ xiǎng xiūxi.", "translation": "Tôi mệt nên muốn nghỉ."}, {"id": "hsk2-04-11", "hanzi": "书包", "pinyin": "shūbāo", "meaning": "cặp sách", "example": "书包在桌子上。", "examplePinyin": "Shūbāo zài zhuōzi shàng.", "translation": "Cặp sách ở trên bàn."}, {"id": "hsk2-04-12", "hanzi": "过去", "pinyin": "guòqù", "meaning": "quá khứ, đi qua", "example": "过去我住在北京。", "examplePinyin": "Guòqù wǒ zhù zài Běijīng.", "translation": "Trước đây tôi sống ở Bắc Kinh."}, {"id": "hsk2-04-13", "hanzi": "绿色", "pinyin": "lǜsè", "meaning": "màu xanh lá", "example": "这件衣服是绿色的。", "examplePinyin": "Zhè jiàn yīfu shì lǜsè de.", "translation": "Áo này màu xanh lá."}, {"id": "hsk2-04-14", "hanzi": "黑色", "pinyin": "hēisè", "meaning": "màu đen", "example": "我买黑色的。", "examplePinyin": "Wǒ mǎi hēisè de.", "translation": "Tôi mua cái màu đen."}, {"id": "hsk2-04-15", "hanzi": "更", "pinyin": "gèng", "meaning": "hơn", "example": "今天更冷。", "examplePinyin": "Jīntiān gèng lěng.", "translation": "Hôm nay lạnh hơn."}, {"id": "hsk2-04-16", "hanzi": "颜色", "pinyin": "yánsè", "meaning": "màu sắc", "example": "你喜欢什么颜色？", "examplePinyin": "Nǐ xǐhuan shénme yánsè?", "translation": "Bạn thích màu gì?"}], "grammar": [{"name": "Trợ từ động thái 过", "details": ["Công thức: S + V + 过 + (O) | S + 没(有) + V + 过 + (O)", "Giải thích: Trợ từ động thái 「过」 được dùng sau động từ để diễn tả một trải nghiệm hoặc hành động đã từng xảy ra trong quá khứ. Hành động này chỉ mang tính chất trải nghiệm và không còn kéo dài đến hiện tại.", "Mẹo: Khi muốn hỏi về trải nghiệm, hãy thêm 「吗」 ở cuối câu hoặc dùng cấu trúc 「没有」 ở cuối câu thay vì dùng 「吗」.", "Lưu ý: Đừng nhầm lẫn 「过」 với 「了」; 「了」 nhấn mạnh hành động đã hoàn thành, còn 「过」 nhấn mạnh vào trải nghiệm từng thực hiện.", "她去过中国。", "tā qù guò zhōng guó", "Cô ấy đã từng đi Trung Quốc.", "我吃过饺子，很好吃。", "wǒ chī guò jiǎo zi hěn hǎo chī", "Tôi đã từng ăn sủi cảo, rất ngon.", "她没去过中国。", "tā méi qù guò zhōng guó", "Cô ấy chưa từng đi Trung Quốc.", "Ví dụ: 她去过中国。"]}, {"name": "Cấu trúc nhân quả vì... nên...", "details": ["Công thức: 因为 (nguyên nhân), 所以 (kết quả)", "Giải thích: Cấu trúc này dùng để diễn tả quan hệ nguyên nhân và kết quả. 「因为」 đứng trước vế nêu lý do, còn 「所以」 đứng trước vế nêu kết quả tương ứng.", "Mẹo: Bạn có thể chỉ dùng một trong hai từ 「因为」 hoặc 「所以」 trong câu mà vẫn giữ nguyên ý nghĩa.", "Lưu ý: Trong tiếng Trung, bạn không nên đặt chủ ngữ trước 「因为」 nếu chủ ngữ ở hai vế là giống nhau.", "就是因为没穿过，所以要试试啊！", "jiù shì yīn wèi méi chuān guò suǒ yǐ yào shì shì a", "Chính vì chưa từng mặc nên mới phải thử chứ!", "因为我生病了，今天没去上班。", "yīn wèi wǒ shēng bìng le jīn tiān méi qù shàng bān", "Vì tôi bị bệnh nên hôm nay không đi làm.", "我没去过他家，所以让他开车来站接我。", "wǒ méi qù guò tā jiā suǒ yǐ ràng tā kāi chē lái zhàn jiē wǒ", "Tôi chưa từng đến nhà anh ấy nên bảo anh ấy lái xe đến trạm đón tôi.", "Ví dụ: 就是因为没穿过，所以要试试啊！"]}, {"name": "Cụm từ chữ 的 (Định ngữ)", "details": ["Công thức: Định ngữ + 的 + Danh từ (Trung tâm ngữ)", "Giải thích: Cấu trúc này dùng để nối các thành phần bổ nghĩa (định ngữ) với danh từ chính. Trong đó, 「的」 đóng vai trò như một chiếc cầu nối, giúp người nghe hiểu rõ tính chất hoặc chủ sở hữu của danh từ đó. Đôi khi danh từ chính có thể được lược bỏ nếu ngữ cảnh đã rõ ràng.", "Mẹo: Nếu định ngữ là đại từ chỉ quan hệ thân thiết như 「我的妈妈」(mẹ tôi) hay 「我的老师」(thầy tôi), bạn có thể lược bỏ 「的」 để câu tự nhiên hơn.", "Lưu ý: Đừng quên dùng 「的」 khi định ngữ là tính từ đa âm tiết hoặc cụm động từ bổ nghĩa cho danh từ, ví dụ: 「漂亮的书」 (sách đẹp).", "红色的、绿色的、黑色的，你想买哪个？", "hóng sè de lǜ sè de hēi sè de nǐ xiǎng mǎi nǎ gè", "Cái màu đỏ, màu xanh lá hay màu đen, bạn muốn mua cái nào?", "这个面包是爸爸买的，妈妈买的在那儿。", "zhè gè miàn bāo shì bà bà mǎi de mā mā mǎi de zài nà ér", "Cái bánh mì này là bố mua, cái mẹ mua ở đằng kia.", "这件衣服太贵了，还是买那件便宜的吧。", "zhè jiàn yī fú tài guì le hái shì mǎi nà jiàn pián yí de ba", "Bộ quần áo này đắt quá, hay là mua bộ rẻ kia đi.", "Ví dụ: 红色的、绿色的、黑色的，你想买哪个？"]}], "extended": [], "structuredGrammar": [{"name": "Trợ từ động thái 过", "formula": "S + V + 过 + (O) | S + 没(有) + V + 过 + (O)", "explanation": "Trợ từ động thái 「过」 được dùng sau động từ để diễn tả một trải nghiệm hoặc hành động đã từng xảy ra trong quá khứ. Hành động này chỉ mang tính chất trải nghiệm và không còn kéo dài đến hiện tại.", "tip": "Khi muốn hỏi về trải nghiệm, hãy thêm 「吗」 ở cuối câu hoặc dùng cấu trúc 「没有」 ở cuối câu thay vì dùng 「吗」.", "note": "Đừng nhầm lẫn 「过」 với 「了」; 「了」 nhấn mạnh hành động đã hoàn thành, còn 「过」 nhấn mạnh vào trải nghiệm từng thực hiện.", "examples": [{"zh": "她去过中国。", "pinyin": "tā qù guò zhōng guó", "vi": "Cô ấy đã từng đi Trung Quốc."}, {"zh": "我吃过饺子，很好吃。", "pinyin": "wǒ chī guò jiǎo zi hěn hǎo chī", "vi": "Tôi đã từng ăn sủi cảo, rất ngon."}, {"zh": "她没去过中国。", "pinyin": "tā méi qù guò zhōng guó", "vi": "Cô ấy chưa từng đi Trung Quốc."}], "newExamples": [{"zh": "小林以前去过北京，还想再去。", "pinyin": "xiǎo lín yǐ qián qù guò běi jīng ， hái xiǎng zài qù 。", "vi": "Trước đây 小林 từng đến Bắc Kinh và còn muốn đi nữa."}, {"zh": "小林以前没吃过饺子，今天是第一次。", "pinyin": "xiǎo lín yǐ qián méi chī guò jiǎo zi ， jīn tiān shì dì yī cì 。", "vi": "Trước đây 小林 chưa từng ăn sủi cảo, hôm nay là lần đầu."}]}, {"name": "Cấu trúc nhân quả vì... nên...", "formula": "因为 (nguyên nhân), 所以 (kết quả)", "explanation": "Cấu trúc này dùng để diễn tả quan hệ nguyên nhân và kết quả. 「因为」 đứng trước vế nêu lý do, còn 「所以」 đứng trước vế nêu kết quả tương ứng.", "tip": "Bạn có thể chỉ dùng một trong hai từ 「因为」 hoặc 「所以」 trong câu mà vẫn giữ nguyên ý nghĩa.", "note": "Trong tiếng Trung, bạn không nên đặt chủ ngữ trước 「因为」 nếu chủ ngữ ở hai vế là giống nhau.", "examples": [{"zh": "就是因为没穿过，所以要试试啊！", "pinyin": "jiù shì yīn wèi méi chuān guò suǒ yǐ yào shì shì a", "vi": "Chính vì chưa từng mặc nên mới phải thử chứ!"}, {"zh": "因为我生病了，今天没去上班。", "pinyin": "yīn wèi wǒ shēng bìng le jīn tiān méi qù shàng bān", "vi": "Vì tôi bị bệnh nên hôm nay không đi làm."}, {"zh": "我没去过他家，所以让他开车来站接我。", "pinyin": "wǒ méi qù guò tā jiā suǒ yǐ ràng tā kāi chē lái zhàn jiē wǒ", "vi": "Tôi chưa từng đến nhà anh ấy nên bảo anh ấy lái xe đến trạm đón tôi."}], "newExamples": [{"zh": "因为小林生病了，所以今天没来。", "pinyin": "yīn wèi xiǎo lín shēng bìng le ， suǒ yǐ jīn tiān méi lái 。", "vi": "Vì 小林 bị ốm nên hôm nay không đến."}, {"zh": "因为小林没有车，所以请小雨来接。", "pinyin": "yīn wèi xiǎo lín méi yǒu chē ， suǒ yǐ qǐng xiǎo yǔ lái jiē 。", "vi": "Vì 小林 không có xe nên nhờ 小雨 đến đón."}]}, {"name": "Cụm từ chữ 的 (Định ngữ)", "formula": "Định ngữ + 的 + Danh từ (Trung tâm ngữ)", "explanation": "Cấu trúc này dùng để nối các thành phần bổ nghĩa (định ngữ) với danh từ chính. Trong đó, 「的」 đóng vai trò như một chiếc cầu nối, giúp người nghe hiểu rõ tính chất hoặc chủ sở hữu của danh từ đó. Đôi khi danh từ chính có thể được lược bỏ nếu ngữ cảnh đã rõ ràng.", "tip": "Nếu định ngữ là đại từ chỉ quan hệ thân thiết như 「我的妈妈」(mẹ tôi) hay 「我的老师」(thầy tôi), bạn có thể lược bỏ 「的」 để câu tự nhiên hơn.", "note": "Đừng quên dùng 「的」 khi định ngữ là tính từ đa âm tiết hoặc cụm động từ bổ nghĩa cho danh từ, ví dụ: 「漂亮的书」 (sách đẹp).", "examples": [{"zh": "红色的、绿色的、黑色的，你想买哪个？", "pinyin": "hóng sè de lǜ sè de hēi sè de nǐ xiǎng mǎi nǎ gè", "vi": "Cái màu đỏ, màu xanh lá hay màu đen, bạn muốn mua cái nào?"}, {"zh": "这个面包是爸爸买的，妈妈买的在那儿。", "pinyin": "zhè gè miàn bāo shì bà bà mǎi de mā mā mǎi de zài nà ér", "vi": "Cái bánh mì này là bố mua, cái mẹ mua ở đằng kia."}, {"zh": "这件衣服太贵了，还是买那件便宜的吧。", "pinyin": "zhè jiàn yī fú tài guì le hái shì mǎi nà jiàn pián yí de ba", "vi": "Bộ quần áo này đắt quá, hay là mua bộ rẻ kia đi."}], "newExamples": [{"zh": "小林想买红色的，不想买黑色的。", "pinyin": "xiǎo lín xiǎng mǎi hóng sè de ， bù xiǎng mǎi hēi sè de 。", "vi": "小林 muốn mua cái màu đỏ, không muốn mua cái màu đen."}, {"zh": "这个杯子是小林的，那个是小雨的。", "pinyin": "zhè ge bēi zi shì xiǎo lín de ， nà ge shì xiǎo yǔ de 。", "vi": "Cốc này là của 小林, cốc kia là của 小雨."}]}]}, {"id": 5, "title": "Đón bạn đến nhà", "subtitle": "快 · 下来 · 上来 · 上去", "words": [{"id": "hsk2-05-01", "hanzi": "快", "pinyin": "kuài", "meaning": "nhanh", "example": "你快来！", "examplePinyin": "Nǐ kuài lái!", "translation": "Bạn đến nhanh lên!"}, {"id": "hsk2-05-02", "hanzi": "下来", "pinyin": "xiàlai", "meaning": "xuống đây", "example": "请下来。", "examplePinyin": "Qǐng xiàlai.", "translation": "Mời xuống đây."}, {"id": "hsk2-05-03", "hanzi": "上来", "pinyin": "shànglai", "meaning": "lên đây", "example": "你上来吧。", "examplePinyin": "Nǐ shànglai ba.", "translation": "Bạn lên đây đi."}, {"id": "hsk2-05-04", "hanzi": "上去", "pinyin": "shàngqu", "meaning": "lên đó", "example": "我走上去。", "examplePinyin": "Wǒ zǒu shàngqu.", "translation": "Tôi đi lên đó."}, {"id": "hsk2-05-05", "hanzi": "下面", "pinyin": "xiàmiàn", "meaning": "phía dưới", "example": "猫在桌子下面。", "examplePinyin": "Māo zài zhuōzi xiàmiàn.", "translation": "Mèo ở dưới bàn."}, {"id": "hsk2-05-06", "hanzi": "等", "pinyin": "děng", "meaning": "đợi", "example": "我在这里等你。", "examplePinyin": "Wǒ zài zhèlǐ děng nǐ.", "translation": "Tôi đợi bạn ở đây."}, {"id": "hsk2-05-07", "hanzi": "一会儿", "pinyin": "yíhuìr", "meaning": "một lát", "example": "请等一会儿。", "examplePinyin": "Qǐng děng yíhuìr.", "translation": "Hãy đợi một lát."}, {"id": "hsk2-05-08", "hanzi": "下去", "pinyin": "xiàqu", "meaning": "xuống đó", "example": "你先下去吧。", "examplePinyin": "Nǐ xiān xiàqu ba.", "translation": "Bạn xuống đó trước đi."}, {"id": "hsk2-05-09", "hanzi": "进来", "pinyin": "jìnlai", "meaning": "vào đây", "example": "请进来坐。", "examplePinyin": "Qǐng jìnlai zuò.", "translation": "Mời vào đây ngồi."}, {"id": "hsk2-05-10", "hanzi": "爷爷", "pinyin": "yéye", "meaning": "ông nội", "example": "爷爷喜欢喝茶。", "examplePinyin": "Yéye xǐhuan hē chá.", "translation": "Ông nội thích uống trà."}, {"id": "hsk2-05-11", "hanzi": "奶奶", "pinyin": "nǎinai", "meaning": "bà nội", "example": "奶奶在家。", "examplePinyin": "Nǎinai zài jiā.", "translation": "Bà nội ở nhà."}, {"id": "hsk2-05-12", "hanzi": "礼物", "pinyin": "lǐwù", "meaning": "quà", "example": "这是给你的礼物。", "examplePinyin": "Zhè shì gěi nǐ de lǐwù.", "translation": "Đây là quà dành cho bạn."}, {"id": "hsk2-05-13", "hanzi": "准备", "pinyin": "zhǔnbèi", "meaning": "chuẩn bị", "example": "我正在准备考试。", "examplePinyin": "Wǒ zhèngzài zhǔnbèi kǎoshì.", "translation": "Tôi đang chuẩn bị thi."}, {"id": "hsk2-05-14", "hanzi": "奶茶", "pinyin": "nǎichá", "meaning": "trà sữa", "example": "我想喝奶茶。", "examplePinyin": "Wǒ xiǎng hē nǎichá.", "translation": "Tôi muốn uống trà sữa."}, {"id": "hsk2-05-15", "hanzi": "跟", "pinyin": "gēn", "meaning": "cùng, với", "example": "我跟朋友去学校。", "examplePinyin": "Wǒ gēn péngyou qù xuéxiào.", "translation": "Tôi đến trường cùng bạn."}, {"id": "hsk2-05-16", "hanzi": "走", "pinyin": "zǒu", "meaning": "đi", "example": "我们走吧。", "examplePinyin": "Wǒmen zǒu ba.", "translation": "Chúng ta đi thôi."}, {"id": "hsk2-05-17", "hanzi": "酒店", "pinyin": "jiǔdiàn", "meaning": "khách sạn", "example": "酒店在车站旁边。", "examplePinyin": "Jiǔdiàn zài chēzhàn pángbiān.", "translation": "Khách sạn ở cạnh bến xe."}], "grammar": [{"name": "Bổ ngữ xu hướng đơn sau động từ chỉ hướng (上/下/进/出/回 + 来/去)", "details": ["Công thức: Động từ chỉ hướng (上/下/进/出/回/过) + 来 (lái) / 去 (qù)", "Giải thích: Bổ ngữ xu hướng đơn dùng để chỉ hướng di chuyển của hành động. Ở đây động từ chính là các động từ chỉ hướng như 「上」, 「下」, 「出」, 「进」, 「回」; thêm 「来」 khi hành động tiến về phía người nói và 「去」 khi hành động rời xa người nói (上来, 下去, 出来).", "Mẹo: Hãy ghi nhớ quy tắc đơn giản: 「来」 là 'đến đây', 「去」 là 'đi đó'.", "Lưu ý: Nếu có tân ngữ chỉ nơi chốn, phải đặt nó giữa động từ và 「来/去」 (回家去, 进教室来), không đặt sau 「来/去」.", "我不上去了，就在下面等你。", "wǒ bù shàng qù le jiù zài xià miàn děng nǐ", "Tôi không lên nữa, ở ngay dưới này đợi bạn.", "家月到下边了，你下去接她吧。", "jiā yuè dào xià biān le nǐ xià qù jiē tā ba", "Gia Nguyệt đến phía dưới rồi, bạn xuống đón cô ấy đi.", "我在外面呢，你出来吧。", "wǒ zài wài miàn ne nǐ chū lái ba", "Tôi đang ở bên ngoài này, bạn ra ngoài đi.", "Ví dụ: 我不上去了，就在下面等你。"]}, {"name": "Bổ ngữ xu hướng đơn sau động từ hành động (拿来, 送来)", "details": ["Công thức: Động từ + 来 (lái) / 去 (qù)", "Giải thích: Bổ ngữ xu hướng đơn được dùng sau động từ để chỉ hướng di chuyển của hành động. 「来」 dùng khi hướng về phía người nói (đến đây), còn 「去」 dùng khi hướng rời xa người nói (đi đó).", "Mẹo: Hãy tưởng tượng bạn là tâm điểm; nếu hành động tiến về phía bạn, hãy dùng 「来」, nếu hành động tiến xa bạn, hãy dùng 「去」.", "Lưu ý: Nếu có tân ngữ chỉ nơi chốn, tân ngữ đó bắt buộc phải đặt giữa động từ và bổ ngữ xu hướng (Ví dụ: 回家去 - về nhà đi).", "你们太客气了，还拿这么多礼物来！", "nǐ men tài kè qì le hái ná zhè me duō lǐ wù lái", "Các bạn khách sáo quá, còn mang nhiều quà đến thế này!", "家月给我送来了一本书。", "jiā yuè gěi wǒ sòng lái le yī běn shū", "Gia Nguyệt mang đến tặng tôi một quyển sách.", "上课了，你们快进教室来吧。", "shàng kè le nǐ men kuài jìn jiào shì lái ba", "Đến giờ học rồi, các bạn mau vào lớp đi.", "Ví dụ: 你们太客气了，还拿这么多礼物来！"]}, {"name": "Cấu trúc nhấn mạnh thời gian 「都……了」", "details": ["Công thức: 都 + [thời gian/sự việc] + 了", "Giải thích: Cấu trúc này được dùng để nhấn mạnh một sự việc đã xảy ra hoặc đã đến một thời điểm nào đó. Nó thường mang sắc thái cảm thán, thể hiện sự ngạc nhiên hoặc không hài lòng của người nói về việc gì đó đã kéo dài hoặc đã đến lúc phải thay đổi.", "Mẹo: Bạn có thể hiểu 「都」 trong trường hợp này giống như từ 'đã' hoặc 'đến tận' để nhấn mạnh sự trễ nải hoặc quá mức.", "Lưu ý: Cấu trúc này thường đi kèm với cảm xúc cá nhân, nên hãy chú ý ngữ điệu khi nói để người nghe hiểu rõ thái độ của bạn.", "都12点了，我们吃饭吧。", "dōu diǎn le wǒ men chī fàn ba", "Đã 12 giờ rồi, chúng ta ăn cơm thôi.", "都8点半了，你还不起床吗？", "dōu diǎn bàn le nǐ hái bù qǐ chuáng ma", "Đã 8 giờ rưỡi rồi, bạn vẫn chưa ngủ dậy sao?", "我都去过北京了，不想再去了。", "wǒ dōu qù guò běi jīng le bù xiǎng zài qù le", "Tôi đã đi Bắc Kinh rồi, không muốn đi nữa.", "Ví dụ: 都12点了，我们吃饭吧。"]}], "extended": [], "structuredGrammar": [{"name": "Bổ ngữ xu hướng đơn sau động từ chỉ hướng (上/下/进/出/回 + 来/去)", "formula": "Động từ chỉ hướng (上/下/进/出/回/过) + 来 (lái) / 去 (qù)", "explanation": "Bổ ngữ xu hướng đơn dùng để chỉ hướng di chuyển của hành động. Ở đây động từ chính là các động từ chỉ hướng như 「上」, 「下」, 「出」, 「进」, 「回」; thêm 「来」 khi hành động tiến về phía người nói và 「去」 khi hành động rời xa người nói (上来, 下去, 出来).", "tip": "Hãy ghi nhớ quy tắc đơn giản: 「来」 là 'đến đây', 「去」 là 'đi đó'.", "note": "Nếu có tân ngữ chỉ nơi chốn, phải đặt nó giữa động từ và 「来/去」 (回家去, 进教室来), không đặt sau 「来/去」.", "examples": [{"zh": "我不上去了，就在下面等你。", "pinyin": "wǒ bù shàng qù le jiù zài xià miàn děng nǐ", "vi": "Tôi không lên nữa, ở ngay dưới này đợi bạn."}, {"zh": "家月到下边了，你下去接她吧。", "pinyin": "jiā yuè dào xià biān le nǐ xià qù jiē tā ba", "vi": "Gia Nguyệt đến phía dưới rồi, bạn xuống đón cô ấy đi."}, {"zh": "我在外面呢，你出来吧。", "pinyin": "wǒ zài wài miàn ne nǐ chū lái ba", "vi": "Tôi đang ở bên ngoài này, bạn ra ngoài đi."}], "newExamples": [{"zh": "小林在楼上叫：“小雨，上来吧，我在这儿。”", "pinyin": "xiǎo lín zài lóu shàng jiào ： “ xiǎo yǔ ， shàng lái ba ， wǒ zài zhè ér 。 ”", "vi": "小林 ở trên lầu gọi: “小雨, lên đây nhé, tôi ở đây.”"}, {"zh": "小林在楼下说：“我不上去了，在下面等你。”", "pinyin": "xiǎo lín zài lóu xià shuō ： “ wǒ bù shàng qù le ， zài xià miàn děng nǐ 。 ”", "vi": "小林 ở dưới lầu nói: “Tôi không lên đó nữa, sẽ đợi bạn ở dưới.”"}]}, {"name": "Bổ ngữ xu hướng đơn sau động từ hành động (拿来, 送来)", "formula": "Động từ + 来 (lái) / 去 (qù)", "explanation": "Bổ ngữ xu hướng đơn được dùng sau động từ để chỉ hướng di chuyển của hành động. 「来」 dùng khi hướng về phía người nói (đến đây), còn 「去」 dùng khi hướng rời xa người nói (đi đó).", "tip": "Hãy tưởng tượng bạn là tâm điểm; nếu hành động tiến về phía bạn, hãy dùng 「来」, nếu hành động tiến xa bạn, hãy dùng 「去」.", "note": "Nếu có tân ngữ chỉ nơi chốn, tân ngữ đó bắt buộc phải đặt giữa động từ và bổ ngữ xu hướng (Ví dụ: 回家去 - về nhà đi).", "examples": [{"zh": "你们太客气了，还拿这么多礼物来！", "pinyin": "nǐ men tài kè qì le hái ná zhè me duō lǐ wù lái", "vi": "Các bạn khách sáo quá, còn mang nhiều quà đến thế này!"}, {"zh": "家月给我送来了一本书。", "pinyin": "jiā yuè gěi wǒ sòng lái le yī běn shū", "vi": "Gia Nguyệt mang đến tặng tôi một quyển sách."}, {"zh": "上课了，你们快进教室来吧。", "pinyin": "shàng kè le nǐ men kuài jìn jiào shì lái ba", "vi": "Đến giờ học rồi, các bạn mau vào lớp đi."}], "newExamples": [{"zh": "小林说：“请把那本书拿来，给我看看。”", "pinyin": "xiǎo lín shuō ： “ qǐng bǎ nà běn shū ná lái ， gěi wǒ kàn kàn 。 ”", "vi": "小林 nói: “Hãy mang quyển sách kia lại đây cho tôi xem.”"}, {"zh": "小林在家对小雨说：“把这本书带到学校去。”", "pinyin": "xiǎo lín zài jiā duì xiǎo yǔ shuō ： “ bǎ zhè běn shū dài dào xué xiào qù 。 ”", "vi": "小林 ở nhà nói với 小雨: “Mang quyển sách này đến trường đi.”"}]}, {"name": "Cấu trúc nhấn mạnh thời gian 「都……了」", "formula": "都 + [thời gian/sự việc] + 了", "explanation": "Cấu trúc này được dùng để nhấn mạnh một sự việc đã xảy ra hoặc đã đến một thời điểm nào đó. Nó thường mang sắc thái cảm thán, thể hiện sự ngạc nhiên hoặc không hài lòng của người nói về việc gì đó đã kéo dài hoặc đã đến lúc phải thay đổi.", "tip": "Bạn có thể hiểu 「都」 trong trường hợp này giống như từ 'đã' hoặc 'đến tận' để nhấn mạnh sự trễ nải hoặc quá mức.", "note": "Cấu trúc này thường đi kèm với cảm xúc cá nhân, nên hãy chú ý ngữ điệu khi nói để người nghe hiểu rõ thái độ của bạn.", "examples": [{"zh": "都12点了，我们吃饭吧。", "pinyin": "dōu 1 2 diǎn le ， wǒ men chī fàn ba 。", "vi": "Đã 12 giờ rồi, chúng ta ăn cơm thôi."}, {"zh": "都8点半了，你还不起床吗？", "pinyin": "dōu 8 diǎn bàn le ， nǐ hái bù qǐ chuáng ma ？", "vi": "Đã 8 giờ rưỡi rồi, bạn vẫn chưa ngủ dậy sao?"}, {"zh": "我都去过北京了，不想再去了。", "pinyin": "wǒ dōu qù guò běi jīng le bù xiǎng zài qù le", "vi": "Tôi đã đi Bắc Kinh rồi, không muốn đi nữa."}], "newExamples": [{"zh": "小林说：“都十一点了，你怎么还不睡？”", "pinyin": "xiǎo lín shuō ： “ dōu shí yì diǎn le ， nǐ zěn me hái bù shuì ？ ”", "vi": "小林 nói: “Đã mười một giờ rồi, sao bạn còn chưa ngủ?”"}, {"zh": "小林说：“都八点半了，快起床！”", "pinyin": "xiǎo lín shuō ： “ dōu bā diǎn bàn le ， kuài qǐ chuáng ！ ”", "vi": "小林 nói: “Đã tám giờ rưỡi rồi, mau dậy!”"}]}]}, {"id": 6, "title": "Sinh nhật vui vẻ", "subtitle": "生日 · 忘 · 画 · 画笔", "words": [{"id": "hsk2-06-01", "hanzi": "生日", "pinyin": "shēngrì", "meaning": "sinh nhật", "example": "今天是我的生日。", "examplePinyin": "Jīntiān shì wǒ de shēngrì.", "translation": "Hôm nay là sinh nhật tôi."}, {"id": "hsk2-06-02", "hanzi": "忘", "pinyin": "wàng", "meaning": "quên", "example": "别忘了带书。", "examplePinyin": "Bié wàng le dài shū.", "translation": "Đừng quên mang sách."}, {"id": "hsk2-06-03", "hanzi": "画", "pinyin": "huà", "meaning": "vẽ, tranh", "example": "我喜欢画画。", "examplePinyin": "Wǒ xǐhuan huà huà.", "translation": "Tôi thích vẽ tranh."}, {"id": "hsk2-06-04", "hanzi": "画笔", "pinyin": "huàbǐ", "meaning": "bút vẽ", "example": "这是我的画笔。", "examplePinyin": "Zhè shì wǒ de huàbǐ.", "translation": "Đây là bút vẽ của tôi."}, {"id": "hsk2-06-05", "hanzi": "蛋糕", "pinyin": "dàngāo", "meaning": "bánh kem", "example": "蛋糕很好吃。", "examplePinyin": "Dàngāo hěn hǎochī.", "translation": "Bánh kem rất ngon."}, {"id": "hsk2-06-06", "hanzi": "快乐", "pinyin": "kuàilè", "meaning": "vui vẻ", "example": "祝你生日快乐！", "examplePinyin": "Zhù nǐ shēngrì kuàilè!", "translation": "Chúc bạn sinh nhật vui vẻ!"}, {"id": "hsk2-06-07", "hanzi": "打开", "pinyin": "dǎkāi", "meaning": "mở", "example": "请打开门。", "examplePinyin": "Qǐng dǎkāi mén.", "translation": "Hãy mở cửa."}, {"id": "hsk2-06-08", "hanzi": "长", "pinyin": "cháng", "meaning": "dài", "example": "这条路很长。", "examplePinyin": "Zhè tiáo lù hěn cháng.", "translation": "Con đường này rất dài."}, {"id": "hsk2-06-09", "hanzi": "鱼", "pinyin": "yú", "meaning": "cá", "example": "我喜欢吃鱼。", "examplePinyin": "Wǒ xǐhuan chī yú.", "translation": "Tôi thích ăn cá."}, {"id": "hsk2-06-10", "hanzi": "肉", "pinyin": "ròu", "meaning": "thịt", "example": "我不吃肉。", "examplePinyin": "Wǒ bù chī ròu.", "translation": "Tôi không ăn thịt."}, {"id": "hsk2-06-11", "hanzi": "过", "pinyin": "guò", "meaning": "đã từng", "example": "我去过中国。", "examplePinyin": "Wǒ qù guo Zhōngguó.", "translation": "Tôi từng đến Trung Quốc."}, {"id": "hsk2-06-12", "hanzi": "地", "pinyin": "de", "meaning": "trợ từ trạng ngữ", "example": "她高兴地笑了。", "examplePinyin": "Tā gāoxìng de xiào le.", "translation": "Cô ấy vui vẻ mỉm cười."}, {"id": "hsk2-06-13", "hanzi": "床", "pinyin": "chuáng", "meaning": "giường", "example": "猫在床上。", "examplePinyin": "Māo zài chuáng shàng.", "translation": "Mèo ở trên giường."}, {"id": "hsk2-06-14", "hanzi": "舒服", "pinyin": "shūfu", "meaning": "thoải mái", "example": "这张床很舒服。", "examplePinyin": "Zhè zhāng chuáng hěn shūfu.", "translation": "Chiếc giường này rất thoải mái."}], "grammar": [{"name": "Lặp lại tính từ đơn âm tiết", "details": ["Công thức: AA + (的) | Ví dụ: 高高(的), 大大(的)", "Giải thích: Trong tiếng Trung, các tính từ đơn âm tiết thường được lặp lại để nhấn mạnh trạng thái hoặc tạo cảm giác gần gũi, miêu tả sinh động hơn. Khi dùng làm định ngữ đứng trước danh từ, bạn nên thêm trợ từ 「的」 vào sau tính từ đã lặp lại.", "Mẹo: Hãy tưởng tượng việc lặp lại tính từ giống như cách chúng ta thêm từ láy trong tiếng Việt để làm câu văn hay và biểu cảm hơn.", "Lưu ý: Không phải tính từ nào cũng có thể lặp lại, hãy chú ý xem từ đó có tự nhiên trong khẩu ngữ hay không.", "我再给她买个大大的生日蛋糕。", "wǒ zài gěi tā mǎi gè dà dà de shēng rì dàn gāo", "Tôi mua thêm cho cô ấy một cái bánh sinh nhật thật to.", "这只猫小小的，真让人喜欢。", "zhè zhī māo xiǎo xiǎo de zhēn ràng rén xǐ huān", "Chú mèo này nhỏ xíu, thật khiến người ta yêu quý.", "Ví dụ: 我再给她买个大大的生日蛋糕。"]}, {"name": "Cấu trúc liệt kê “什么的”", "details": ["Công thức: Danh từ 1, Danh từ 2... + 什么的", "Giải thích: Cụm từ 「什么的」 được đặt sau các danh từ đã liệt kê để chỉ rằng vẫn còn những sự vật tương tự khác chưa kể hết. Cấu trúc này thường dùng trong văn nói để câu văn trở nên tự nhiên hơn. Ví dụ: 我喜欢吃苹果、香蕉什么的 (Tôi thích ăn táo, chuối và những thứ tương tự).", "Mẹo: Bạn có thể hiểu 「什么的」 mang nghĩa tương đương với 'vân vân' hoặc 'các thứ' trong tiếng Việt.", "Lưu ý: Cấu trúc này chủ yếu dùng trong giao tiếp khẩu ngữ, không nên dùng trong các văn bản viết trang trọng.", "桌子上有电脑、杯子、书和画笔什么的。", "zhuō zi shàng yǒu diàn nǎo bēi zi shū hé huà bǐ shén me de", "Trên bàn có máy tính, cái ly, sách và cọ vẽ đại loại vậy.", "她拿来了一些水、面包和苹果什么的。", "tā ná lái le yī xiē shuǐ miàn bāo hé píng guǒ shén me de", "Cô ấy mang đến một ít nước, bánh mì và táo đại loại vậy.", "Ví dụ: 桌子上有电脑、杯子、书和画笔什么的。"]}, {"name": "Trợ từ kết cấu 地", "details": ["Công thức: Trạng ngữ + 地 + Động từ", "Giải thích: Trợ từ kết cấu 「地」 được đặt sau trạng ngữ (thường là tính từ) để bổ nghĩa cho động từ đứng sau nó. Nó giúp diễn tả cách thức hoặc trạng thái của một hành động đang diễn ra.", "Mẹo: Hãy nhớ quy tắc: 「的」 đi với danh từ, 「地」 đi với động từ, còn 「得」 đi với bổ ngữ.", "Lưu ý: Đừng nhầm lẫn với 「的」; trong khẩu ngữ, cả ba trợ từ này đều phát âm giống nhau là 'de', nhưng cách dùng trong văn viết thì hoàn toàn khác biệt.", "还要高高兴兴地玩。", "hái yào gāo gāo xìng xìng de wán", "Còn phải chơi đùa một cách thật vui vẻ.", "老师早早地到了教室。", "lǎo shī zǎo zǎo de dào le jiào shì", "Thầy giáo đã đến lớp từ rất sớm.", "爸爸很快地吃完早饭，就去上班了。", "bà bà hěn kuài de chī wán zǎo fàn jiù qù shàng bān le", "Bố ăn xong bữa sáng rất nhanh rồi đi làm luôn.", "Ví dụ: 还要高高兴兴地玩。"]}], "extended": [], "structuredGrammar": [{"name": "Lặp lại tính từ đơn âm tiết", "formula": "AA + (的) | Ví dụ: 高高(的), 大大(的)", "explanation": "Trong tiếng Trung, các tính từ đơn âm tiết thường được lặp lại để nhấn mạnh trạng thái hoặc tạo cảm giác gần gũi, miêu tả sinh động hơn. Khi dùng làm định ngữ đứng trước danh từ, bạn nên thêm trợ từ 「的」 vào sau tính từ đã lặp lại.", "tip": "Hãy tưởng tượng việc lặp lại tính từ giống như cách chúng ta thêm từ láy trong tiếng Việt để làm câu văn hay và biểu cảm hơn.", "note": "Không phải tính từ nào cũng có thể lặp lại, hãy chú ý xem từ đó có tự nhiên trong khẩu ngữ hay không.", "examples": [{"zh": "我再给她买个大大的生日蛋糕。", "pinyin": "wǒ zài gěi tā mǎi gè dà dà de shēng rì dàn gāo", "vi": "Tôi mua thêm cho cô ấy một cái bánh sinh nhật thật to."}, {"zh": "这只猫小小的，真让人喜欢。", "pinyin": "zhè zhī māo xiǎo xiǎo de zhēn ràng rén xǐ huān", "vi": "Chú mèo này nhỏ xíu, thật khiến người ta yêu quý."}], "newExamples": [{"zh": "小林给小雨买了一个大大的生日蛋糕。", "pinyin": "xiǎo lín gěi xiǎo yǔ mǎi le yí gè dà dà de shēng rì dàn gāo 。", "vi": "小林 mua cho 小雨 một chiếc bánh sinh nhật thật to."}, {"zh": "小林养了一只小小的猫。", "pinyin": "xiǎo lín yǎng le yī zhī xiǎo xiǎo de māo 。", "vi": "小林 nuôi một chú mèo nhỏ xíu."}]}, {"name": "Cấu trúc liệt kê “什么的”", "formula": "Danh từ 1, Danh từ 2... + 什么的", "explanation": "Cụm từ 「什么的」 được đặt sau các danh từ đã liệt kê để chỉ rằng vẫn còn những sự vật tương tự khác chưa kể hết. Cấu trúc này thường dùng trong văn nói để câu văn trở nên tự nhiên hơn. Ví dụ: 我喜欢吃苹果、香蕉什么的 (Tôi thích ăn táo, chuối và những thứ tương tự).", "tip": "Bạn có thể hiểu 「什么的」 mang nghĩa tương đương với 'vân vân' hoặc 'các thứ' trong tiếng Việt.", "note": "Cấu trúc này chủ yếu dùng trong giao tiếp khẩu ngữ, không nên dùng trong các văn bản viết trang trọng.", "examples": [{"zh": "桌子上有电脑、杯子、书和画笔什么的。", "pinyin": "zhuō zi shàng yǒu diàn nǎo bēi zi shū hé huà bǐ shén me de", "vi": "Trên bàn có máy tính, cái ly, sách và cọ vẽ đại loại vậy."}, {"zh": "她拿来了一些水、面包和苹果什么的。", "pinyin": "tā ná lái le yī xiē shuǐ miàn bāo hé píng guǒ shén me de", "vi": "Cô ấy mang đến một ít nước, bánh mì và táo đại loại vậy."}], "newExamples": [{"zh": "小林买了面包、水果什么的，准备去旅行。", "pinyin": "xiǎo lín mǎi le miàn bāo 、 shuǐ guǒ shén me de ， zhǔn bèi qù lǚ xíng 。", "vi": "小林 mua bánh mì, trái cây và các thứ tương tự để đi du lịch."}, {"zh": "桌上有小林的书、本子、画笔什么的。", "pinyin": "zhuō shàng yǒu xiǎo lín de shū 、 běn zi 、 huà bǐ shén me de 。", "vi": "Trên bàn có sách, vở, cọ vẽ và những thứ tương tự của 小林."}]}, {"name": "Trợ từ kết cấu 地", "formula": "Trạng ngữ + 地 + Động từ", "explanation": "Trợ từ kết cấu 「地」 được đặt sau trạng ngữ (thường là tính từ) để bổ nghĩa cho động từ đứng sau nó. Nó giúp diễn tả cách thức hoặc trạng thái của một hành động đang diễn ra.", "tip": "Hãy nhớ quy tắc: 「的」 đi với danh từ, 「地」 đi với động từ, còn 「得」 đi với bổ ngữ.", "note": "Đừng nhầm lẫn với 「的」; trong khẩu ngữ, cả ba trợ từ này đều phát âm giống nhau là 'de', nhưng cách dùng trong văn viết thì hoàn toàn khác biệt.", "examples": [{"zh": "还要高高兴兴地玩。", "pinyin": "hái yào 家，妈妈就打来电话了。", "wǒ yī dào jiā mā mā jiù dǎ lái diàn huà le", "Tôi vừa về đến nhà là mẹ đã gọi điện tới rồi.", "一到星期六，陈天中就跟同学去打篮球。", "yī dào xīng qī liù chén tiān zhōng jiù gēn tóng xué qù dǎ lán qiú", "Cứ đến thứ Bảy là Trần Thiên Trung lại đi chơi bóng rổ với bạn học.", "Ví dụ: 你怎么一下课就往外跑？"]}, {"name": "Bổ ngữ trạng thái với 得", "details": ["Công thức: Động từ + 得 + Hình dung từ (Tính từ)", "Giải thích: Bổ ngữ trạng thái dùng để miêu tả, đánh giá kết quả hoặc tính chất của một hành động. Trợ từ 「得」 được đặt sau động từ để nối kết với phần nhận xét phía sau.", "Mẹo: Bạn có thể dùng cấu trúc này để khen ngợi, ví dụ: 「你说得很好」 (Bạn nói rất tốt).", "Lưu ý: Luôn nhớ đặt 「得」 ngay sau động từ trước khi đưa ra nhận xét.", "我踢得还可以。", "wǒ tī de hái kě yǐ", "Tôi đá bóng cũng được.", "他们玩得很高兴。", "tā men wán de hěn gāo xìng", "Họ chơi đùa rất vui vẻ.", "白家月跑得不快。", "bái jiā yuè pǎo de bù kuài", "Bạch Gia Nguyệt chạy không nhanh.", "Ví dụ: 我踢得还可以。"]}, {"name": "Bổ ngữ trạng thái với 「得」", "details": ["Công thức: Động từ + 「得」 + Tính từ (hoặc cụm tính từ)", "Giải thích: Bổ ngữ trạng thái dùng để mô tả, đánh giá kết quả hoặc mức độ thực hiện của một hành động. Trợ từ kết cấu 「得」 bắt buộc phải đặt sau động từ và trước tính từ miêu tả.", "Mẹo: Hãy nhớ cấu trúc này giúp bạn nhận xét một việc gì đó được thực hiện như thế nào, ví dụ: 「你说得很好」(Bạn nói rất tốt).", "Lưu ý: Đừng quên từ 「得」 ở giữa động từ và tính từ, đây là lỗi sai phổ biến nhất khi mới bắt đầu học.", "我游泳游得不快。", "wǒ yóu yǒng yóu de bù kuài", "Tôi bơi không nhanh.", "你篮球打得怎么样？", "nǐ lán qiú dǎ de zěn me yàng", "Bạn chơi bóng rổ thế nào?", "白家月写汉字写得很好看。", "bái jiā yuè xiě hàn zì xiě de hěn hǎo kàn", "Bạch Gia Nguyệt viết chữ Hán rất đẹp.", "Ví dụ: 我游泳游得不快。"]}], "extended": [], "structuredGrammar": [{"name": "Cấu trúc một khi... liền...", "formula": "一 [động từ/tính từ] 就 [động từ/tính từ]", "explanation": "Cấu trúc này dùng để diễn tả hai hành động hoặc sự việc xảy ra nối tiếp nhau rất nhanh. Khi vế trước vừa xảy ra xong thì vế nhiên hoặc nhấn mạnh hơn 「更」, ví dụ: 「他比我还高」.", "Lưu ý: Không được thêm các từ chỉ mức độ như 「很」, 「非常」 vào trước tính từ trong câu so sánh có 「比」.", "我看网上说这个电影比那个爱情片更有意思。", "wǒ kàn wǎng shàng shuō zhè gè diàn yǐng bǐ nà gè ài qíng piàn gèng yǒu yì sī", "Tôi thấy trên mạng nói bộ phim này thú vị hơn bộ phim tình cảm kia.", "今天比昨天更热。", "jīn tiān bǐ zuó tiān gèng rè", "Hôm nay còn nóng hơn cả hôm qua.", "Ví dụ: 我看网上说这个电影比那个爱情片更有意思。"]}, {"name": "Cấu trúc câu nhượng bộ Tuy... nhưng", "details": ["Công thức: 虽然 (Sui rán) + [Mệnh đề 1], 但是 (dàn shì) + [Mệnh đề 2]", "Giải thích: Cấu trúc 「虽然……，但是……」 dùng để nối hai mệnh đề có ý nghĩa tương phản nhau. Bạn dùng nó để diễn đạt ý \"mặc dù... nhưng mà...\" trong tiếng Việt.", "Mẹo: Trong khẩu ngữ, bạn có thể lược bỏ 「虽然」 nhưng vẫn giữ lại 「但是」 để câu tự nhiên hơn.", "Lưu ý: Không được dùng đồng thời cả 「虽然」 và 「但是」 trong cùng một câu nếu ý nghĩa không có sự đối lập rõ ràng.", "虽然你忘了，但是我还记得。", "suī rán nǐ wàng le dàn shì wǒ hái jì de", "Mặc dù bạn đã quên nhưng tôi vẫn còn nhớ.", "外边下雪了，但是不太冷。", "wài biān xià xuě le dàn shì bù tài lěng", "Bên ngoài tuyết rơi rồi nhưng không lạnh lắm.", "虽然觉得有点儿累，我还是走回家了。", "suī rán jué de yǒu diǎn ér lèi wǒ hái shì zǒu huí jiā le", "Mặc dù thấy hơi mệt nhưng tôi vẫn đi bộ về nhà.", "Ví dụ: 虽然你忘了，但是我还记得。"]}], "extended": [], "structuredGrammar": [{"name": "Câu so sánh hơn với 比", "formula": "A 比 B + [Tính từ]", "explanation": "Cấu trúc 「A 比 B + Tính từ」 dùng để so sánh sự khác biệt giữa hai đối tượng. Trong đó, A là đối tượng được so sánh, B là đối tượng làm chuẩn, và tính từ đứng sau dùng để chỉ tính chất.", "tip": "Bạn có thể thêm các phó từ chỉ mức độ như 「更」 (gèng) hoặc 「还」 (hái) vào trước tính từ để nhấn mạnh sự so sánh, ví dụ: 「今天比昨天更冷」.", "note": "Trong câu so sánh với 「比」, tuyệt đối không được dùng 「很」 trước tính từ.", "examples": [{"zh": "我也觉得左边的比右边的好看。", "pinyin": "wǒ yě jué de zuǒ biān de bǐ yòu biān de hǎo kàn", "vi": "Tôi cũng thấy cái bên trái đẹp hơn cái bên phải."}, {"zh": "今天比昨天冷。", "pinyin": "jīn tiān bǐ zuó tiān lěng", "vi": "Hôm nay lạnh hơn hôm qua."}, {"zh": "他觉得踢足球比打篮球有意思。", "pinyin": "tā jué de tī zú qiú bǐ dǎ lán qiú yǒu yì sī", "vi": "Anh ấy thấy đá bóng thú vị hơn chơi bóng rổ."}], "newExamples": [{"zh": "小林比小雨高，但是年龄更小。", "pinyin": "xiǎo lín bǐ xiǎo yǔ gāo ， dàn shì nián líng gèng xiǎo 。", "vi": "小林 cao hơn 小雨 nhưng tuổi nhỏ hơn."}, {"zh": "小林觉得今天比昨天冷。", "pinyin": "xiǎo lín jué de jīn tiān bǐ zuó tiān lěng 。", "vi": "小林 thấy hôm nay lạnh hơn hôm qua."}]}, {"name": "Câu so sánh 比 với 更/还", "formula": "A 比 B + 更/还 + Tính từ", "explanation": "Cấu trúc này dùng khi cả A và B đều có tính chất được nói tới, nhưng A ở mức cao hơn. Đặt 「更」 hoặc 「还」 ngay trước tính từ để nhấn mạnh mức chênh lệch.", "tip": "「还」 thường mang thêm sắc thái ngạc nhiên hoặc nhấn mạnh hơn 「更」, ví dụ: 「他比我还高」.", "note": "Không được thêm các từ chỉ mức độ như 「很」, 「非常」 vào trước tính từ trong câu so sánh có 「比」.", "examples": [{"zh": "我看网上说这个电影比那个爱情片更有意思。", "pinyin": "wǒ kàn wǎng shàng shuō zhè gè diàn yǐng bǐ nà gè ài qíng piàn gèng yǒu yì sī", "vi": "Tôi thấy trên mạng nói bộ phim này thú vị hơn bộ phim tình cảm kia."}, {"zh": "今天比昨天更热。", "pinyin": "jīn tiān bǐ zuó tiān gèng rè", "vi": "Hôm nay còn nóng hơn cả hôm qua."}], "newExamples": [{"zh": "小林觉得这本书比那本更有意思。", "pinyin": "xiǎo lín jué de zhè běn shū bǐ nà běn gèng yǒu yì si 。", "vi": "小林 thấy sách này còn thú vị hơn sách kia."}, {"zh": "小林的弟弟比小林还高。", "pinyin": "xiǎo lín de dì di bǐ xiǎo lín hái gāo 。", "vi": "Em trai của 小林 còn cao hơn 小林."}]}, {"name": "Cấu trúc câu nhượng bộ Tuy... nhưng", "formula": "虽然 (Sui rán) + [Mệnh đề 1], 但是 (dàn shì) + [Mệnh đề 2]", "explanation": "Cấu trúc 「虽然……，但是……」 dùng để nối hai mệnh đề có ý nghĩa tương phản nhau. Bạn dùng nó để diễn đạt ý \"mặc dù... nhưng mà...\" trong tiếng Việt.", "tip": "Trong khẩu ngữ, bạn có thể lược bỏ 「虽然」 nhưng vẫn giữ lại 「但是」 để câu tự nhiên hơn.", "note": "Không được dùng đồng thời cả 「虽然」 và 「但是」 trong cùng một câu nếu ý nghĩa không có sự đối lập rõ ràng.", "examples": [{"zh": "虽然你忘了，但是我还记得。", "pinyin": "suī rán nǐ wàng le dàn shì wǒ hái jì de", "vi": "Mặc dù bạn đã quên nhưng tôi vẫn còn nhớ."}, {"zh": "外边下雪了，但是不太冷。", "pinyin": "wài biān xià xuě le dàn shì bù tài lěng", "vi": "Bên ngoài tuyết rơi rồi nhưng không lạnh lắm."}, {"zh": "虽然觉得有点儿累，我还是走回家了。", "pinyin": "suī rán jué de yǒu diǎn ér lèi wǒ hái shì zǒu huí jiā le", "vi": "Mặc dù thấy hơi mệt nhưng tôi vẫn đi bộ về nhà."}], "newExamples": [{"zh": "虽然小林很忙，但是每天都给家里打电话。", "pinyin": "suī rán xiǎo lín hěn máng ， dàn shì měi tiān dōu gěi jiā lǐ dǎ diàn huà 。", "vi": "Tuy 小林 bận nhưng ngày nào cũng gọi điện về nhà."}, {"zh": "虽然小林觉得累，但是还是做完了作业。", "pinyin": "suī rán xiǎo lín jué de lèi ， dàn shì hái shì zuò wán le zuò yè 。", "vi": "Tuy 小林 thấy mệt nhưng vẫn làm xong bài tập."}]}]}, {"id": 9, "title": "Khoảng cách và thời gian", "subtitle": "坏 · 旁边 · 男孩儿 · 这样", "words": [{"id": "hsk2-09-01", "hanzi": "坏", "pinyin": "huài", "meaning": "xấu, hỏng", "example": "我的手机坏了，不能打电话。", "examplePinyin": "wǒ de shǒu jī huài le ， bù néng dǎ diàn huà 。", "translation": "Điện thoại của tôi hỏng rồi, không gọi được."}, {"id": "hsk2-09-02", "hanzi": "旁边", "pinyin": "pángbiān", "meaning": "bên cạnh", "example": "请把书放在电脑旁边。", "examplePinyin": "qǐng bǎ shū fàng zài diàn nǎo páng biān 。", "translation": "Hãy đặt sách ở cạnh máy tính."}, {"id": "hsk2-09-03", "hanzi": "男孩儿", "pinyin": "nánháir", "meaning": "bé trai", "example": "那个男孩儿比我弟弟大两岁。", "examplePinyin": "nà ge nán hái er bǐ wǒ dì di dà liǎng suì 。", "translation": "Cậu bé kia lớn hơn em trai tôi hai tuổi."}, {"id": "hsk2-09-04", "hanzi": "这样", "pinyin": "zhèyàng", "meaning": "như thế này", "example": "这样做比以前方便多了。", "examplePinyin": "zhè yàng zuò bǐ yǐ qián fāng biàn duō le 。", "translation": "Làm như vậy tiện hơn trước nhiều."}, {"id": "hsk2-09-05", "hanzi": "个子", "pinyin": "gèzi", "meaning": "chiều cao", "example": "他的个子比哥哥还高。", "examplePinyin": "tā de gè zi bǐ gē gē hái gāo 。", "translation": "Dáng người anh ấy còn cao hơn anh trai."}, {"id": "hsk2-09-06", "hanzi": "那么", "pinyin": "nàme", "meaning": "như vậy, đến thế", "example": "这道题没有你想的那么难。", "examplePinyin": "zhè dào tí méi yǒu nǐ xiǎng de nà me nán 。", "translation": "Bài này không khó như bạn nghĩ."}, {"id": "hsk2-09-07", "hanzi": "高", "pinyin": "gāo", "meaning": "cao", "example": "这座楼比我们学校的楼高多了。", "examplePinyin": "zhè zuò lóu bǐ wǒ men xué xiào de lóu gāo duō le 。", "translation": "Tòa nhà này cao hơn tòa ở trường chúng tôi nhiều."}, {"id": "hsk2-09-08", "hanzi": "门口", "pinyin": "ménkǒu", "meaning": "cửa ra vào", "example": "老师站在门口等我们。", "examplePinyin": "lǎo shī zhàn zài mén kǒu děng wǒ men 。", "translation": "Thầy đứng ở cửa đợi chúng tôi."}, {"id": "hsk2-09-09", "hanzi": "咖啡", "pinyin": "kāfēi", "meaning": "cà phê", "example": "晚上喝咖啡以后，我常常睡不着。", "examplePinyin": "wǎn shàng hē kā fēi yǐ hòu ， wǒ cháng cháng shuì bù zhe 。", "translation": "Sau khi uống cà phê buổi tối tôi thường không ngủ được."}, {"id": "hsk2-09-10", "hanzi": "离", "pinyin": "lí", "meaning": "cách", "example": "学校离我家只有十分钟的路。", "examplePinyin": "xué xiào lí wǒ jiā zhǐ yǒu shí fēn zhōng de lù 。", "translation": "Trường chỉ cách nhà tôi mười phút đi đường."}, {"id": "hsk2-09-11", "hanzi": "近", "pinyin": "jìn", "meaning": "gần", "example": "我家离公园很近。", "examplePinyin": "wǒ jiā lí gōng yuán hěn jìn 。", "translation": "Nhà tôi rất gần công viên."}, {"id": "hsk2-09-12", "hanzi": "走路", "pinyin": "zǒulù", "meaning": "đi bộ", "example": "比起坐车，我更喜欢走路。", "examplePinyin": "bǐ qǐ zuò chē ， wǒ gèng xǐ huān zǒu lù 。", "translation": "So với đi xe tôi thích đi bộ hơn."}, {"id": "hsk2-09-13", "hanzi": "周", "pinyin": "zhōu", "meaning": "tuần", "example": "我一周去两次图书馆。", "examplePinyin": "wǒ yī zhōu qù liǎng cì tú shū guǎn 。", "translation": "Mỗi tuần tôi đến thư viện hai lần."}], "grammar": [{"name": "So sánh bằng", "details": ["Công thức: A 跟 B (不) 一样 (+ [Tính từ])", "Giải thích: Cấu trúc này dùng để so sánh sự tương đồng giữa hai đối tượng. Nếu thêm tính từ phía sau 「一样」, nó giúp xác định rõ khía cạnh đang được so sánh (ví dụ: kích thước, độ dài, màu sắc).", "Mẹo: Nếu muốn nói 'không giống nhau', bạn chỉ cần thêm 「不」 trước 「一样」 là được.", "Lưu ý: Lưu ý rằng sau 「一样」 thường không cần thêm các từ chỉ mức độ như 「很」 hay 「非常」.", "我的个子跟哥哥一样高。", "wǒ de gè zi gēn gē ge yī yàng gāo", "Tôi cao bằng anh trai.", "今天跟昨天一样冷。", "jīn tiān gēn zuó tiān yī yàng lěng", "Hôm nay lạnh như hôm qua.", "这块手表跟那块不一样。", "zhè kuài shǒu biǎo gēn nà kuài bù yī yàng", "Chiếc đồng hồ này không giống chiếc kia.", "Ví dụ: 我的个子跟哥哥一样高。"]}, {"name": "Diễn tả khoảng cách với 离", "details": ["Công thức: A + 离 + B + (khoảng cách / 近 / 远)", "Giải thích: Động từ 「离」 được dùng để diễn tả khoảng cách giữa hai địa điểm, người hoặc sự vật. Cấu trúc này giúp xác định xem từ điểm A đến điểm B cách nhau bao xa hoặc gần/xa như thế nào.", "Mẹo: Bạn có thể thêm từ 「近」(gần) hoặc 「远」(xa) vào cuối câu để nhấn mạnh khoảng cách.", "Lưu ý: Không được nhầm lẫn 「离」 (khoảng cách) với 「从」 (điểm xuất phát của hành động).", "咖啡店离这儿有点儿远。", "kā fēi diàn lí zhè ér yǒu diǎn ér yuǎn", "Quán cà phê cách đây hơi xa một chút.", "学校离医院不远。", "xué xiào lí yī yuàn bù yuǎn", "Trường học cách bệnh viện không xa.", "现在离我的生日还有三天。", "xiàn zài lí wǒ de shēng rì hái yǒu sān tiān", "Bây giờ cách ngày sinh nhật của tôi còn ba ngày nữa.", "Ví dụ: 咖啡店离这儿有点儿远。"]}, {"name": "Bổ ngữ thời lượng (Diễn tả khoảng thời gian)", "details": ["Công thức: Động từ + (tân ngữ) + Động từ + bổ ngữ thời lượng", "Giải thích: Bổ ngữ thời lượng dùng để chỉ khoảng thời gian kéo dài của một hành động. Khi câu có tân ngữ, bạn cần lặp lại động từ trước khi thêm khoảng thời gian, ví dụ 「我学中文学了两年」 (Tôi đã học tiếng Trung được hai năm).", "Mẹo: Nếu không muốn lặp lại động từ, bạn có thể đưa tân ngữ ra sau bổ ngữ thời lượng (chỉ áp dụng với tân ngữ chỉ người hoặc vật cụ thể).", "Lưu ý: Đừng quên thêm trợ từ 「了」 sau bổ ngữ thời lượng để thể hiện hành động đã xảy ra hoặc kéo dài đến hiện tại.", "走半个多小时就到了。", "zǒu bàn gè duō xiǎo shí jiù dào le", "Đi bộ hơn nửa tiếng là đến rồi.", "我们休息十分钟。", "wǒ men xiū xī shí fēn zhōng", "Chúng ta nghỉ ngơi mười phút.", "Ví dụ: 走半个多小时就到了。"]}], "extended": [], "structuredGrammar": [{"name": "So sánh bằng", "formula": "A 跟 B (不) 一样 (+ [Tính từ])", "explanation": "Cấu trúc này dùng để so sánh sự tương đồng giữa hai đối tượng. Nếu thêm tính từ phía sau 「一样」, nó giúp xác định rõ khía cạnh đang được so sánh (ví dụ: kích thước, độ dài, màu sắc).", "tip": "Nếu muốn nói 'không giống nhau', bạn chỉ cần thêm 「不」 trước 「一样」 là được.", "note": "Lưu ý rằng sau 「一样」 thường không cần thêm các từ chỉ mức độ như 「很」 hay 「非常」.", "examples": [{"zh": "我的个子跟哥哥一样高。", "pinyin": "wǒ de gè zi gēn gē ge yī yàng gāo", "vi": "Tôi cao bằng anh trai."}, {"zh": "今天跟昨天一样冷。", "pinyin": "jīn tiān gēn zuó tiān yī yàng lěng", "vi": "Hôm nay lạnh như hôm qua."}, {"zh": "这块手表跟那块不一样。", "pinyin": "zhè kuài shǒu biǎo gēn nà kuài bù yī yàng", "vi": "Chiếc đồng hồ này không giống chiếc kia."}], "newExamples": [{"zh": "小林的书包跟小雨的一样大。", "pinyin": "xiǎo lín de shū bāo gēn xiǎo yǔ de yī yàng dà 。", "vi": "Cặp của 小林 to bằng cặp của 小雨."}, {"zh": "小林喜欢蓝色，小雨喜欢红色，他们的爱好不一样。", "pinyin": "xiǎo lín xǐ huān lán sè ， xiǎo yǔ xǐ huān hóng sè ， tā men de ài hào bù yí yàng 。", "vi": "小林 thích xanh dương, 小雨 thích đỏ, sở thích họ khác nhau."}]}, {"name": "Diễn tả khoảng cách với 离", "formula": "A + 离 + B + (khoảng cách / 近 / 远)", "explanation": "Động từ 「离」 được dùng để diễn tả khoảng cách giữa hai địa điểm, người hoặc sự vật. Cấu trúc này giúp xác định xem từ điểm A đến điểm B cách nhau bao xa hoặc gần/xa như thế nào.", "tip": "Bạn có thể thêm từ 「近」(gần) hoặc 「远」(xa) vào cuối câu để nhấn mạnh khoảng cách.", "note": "Không được nhầm lẫn 「离」 (khoảng cách) với 「从」 (điểm xuất phát của hành động).", "examples": [{"zh": "咖啡店离这儿有点儿远。", "pinyin": "kā fēi diàn lí zhè ér yǒu diǎn ér yuǎn", "vi": "Quán cà phê cách đây hơi xa một chút."}, {"zh": "学校离医院不远。", "pinyin": "xué xiào lí yī yuàn bù yuǎn", "vi": "Trường học cách bệnh viện không xa."}, {"zh": "现在离我的生日还有三天。", "pinyin": "xiàn zài lí wǒ de shēng rì hái yǒu sān tiān", "vi": "Bây giờ cách ngày sinh nhật của tôi còn ba ngày nữa."}], "newExamples": [{"zh": "小林家离学校很近，走路就能到。", "pinyin": "xiǎo lín jiā lí xué xiào hěn jìn ， zǒu lù jiù néng dào 。", "vi": "Nhà 小林 rất gần trường, đi bộ là đến."}, {"zh": "小林问：“这里离机场有多远？”", "pinyin": "xiǎo lín wèn ： “ zhè lǐ lí jī chǎng yǒu duō yuǎn ？ ”", "vi": "小林 hỏi: “Từ đây cách sân bay bao xa?”"}]}, {"name": "Bổ ngữ thời lượng (Diễn tả khoảng thời gian)", "formula": "Động từ + (tân ngữ) + Động từ + bổ ngữ thời lượng", "explanation": "Bổ ngữ thời lượng dùng để chỉ khoảng thời gian kéo dài của một hành động. Khi câu có tân ngữ, bạn cần lặp lại động từ trước khi thêm khoảng thời gian, ví dụ 「我学中文学了两年」 (Tôi đã học tiếng Trung được hai năm).", "tip": "Nếu không muốn lặp lại động từ, bạn có thể đưa tân ngữ ra sau bổ ngữ thời lượng (chỉ áp dụng với tân ngữ chỉ người hoặc vật cụ thể).", "note": "Đừng quên thêm trợ từ 「了」 sau bổ ngữ thời lượng để thể hiện hành động đã xảy ra hoặc kéo dài đến hiện tại.", "examples": [{"zh": "走半个多小时就到了。", "pinyin": "zǒu bàn gè duō xiǎo shí jiù dào le", "vi": "Đi bộ hơn nửa tiếng là đến rồi."}, {"zh": "我们休息十分钟。", "pinyin": "wǒ men xiū xī shí fēn zhōng", "vi": "Chúng ta nghỉ ngơi mười phút."}], "newExamples": [{"zh": "小林学中文学了两年，现在说得很好。", "pinyin": "xiǎo lín xué zhōng wén xué le liǎng nián ， xiàn zài shuō de hěn hǎo 。", "vi": "小林 đã học tiếng Trung hai năm, giờ nói rất tốt."}, {"zh": "小林每天看书看半个小时，也就是三十分钟。", "pinyin": "xiǎo lín měi tiān kàn shū kàn bàn gè xiǎo shí ， yě jiù shì sān shí fēn zhōng 。", "vi": "Mỗi ngày 小林 đọc sách nửa tiếng, tức ba mươi phút."}]}]}, {"id": 10, "title": "Chuẩn bị ngày khai giảng", "subtitle": "开学 · 门 · 后面 · 笔", "words": [{"id": "hsk2-10-01", "hanzi": "开学", "pinyin": "kāixué", "meaning": "khai giảng", "example": "开学以前我要买几个本子。", "examplePinyin": "kāi xué yǐ qián wǒ yào mǎi jǐ gè běn zi 。", "translation": "Trước khi khai giảng tôi cần mua vài quyển vở."}, {"id": "hsk2-10-02", "hanzi": "门", ": "háishi", "meaning": "hay là", "example": "你喝茶还是咖啡？", "examplePinyin": "Nǐ hē chá háishi kāfēi?", "translation": "Bạn uống trà hay cà phê?"}, {"id": "hsk2-10-12", "hanzi": "考", "pinyin": "kǎo", "meaning": "thi", "example": "姐姐明天要考中文，今天在家复习。", "examplePinyin": "jiě jiě míng tiān yào kǎo zhōng wén ， jīn tiān zài jiā fù xí 。", "translation": "Mai chị thi tiếng Trung, hôm nay ở nhà ôn bài."}, {"id": "hsk2-10-13", "hanzi": "快要", "pinyin": "kuàiyào", "meaning": "sắp", "example": "电影快要结束了。", "examplePinyin": "diàn yǐng kuài yào jié shù le 。", "translation": "Bộ phim sắp kết thúc rồi."}, {"id": "hsk2-10-14", "hanzi": "笑", "pinyin": "xiào", "meaning": "cười", "example": "听了这个故事，大家都笑了。", "examplePinyin": "tīng le zhè ge gù shì ， dà jiā dōu xiào le 。", "translation": "Nghe câu chuyện này mọi người đều cười."}], "grammar": [{"name": "Câu vị ngữ cụm chủ-vị", "details": ["Công thức: Chủ ngữ lớn + (Chủ ngữ nhỏ + Vị ngữ nhỏ)", "Giải thích: Trong loại câu này, toàn bộ một cụm chủ-vị đóng vai trò làm vị ngữ cho chủ ngữ lớn. Chủ ngữ nhỏ thường là một bộ phận hoặc đối tượng liên quan trực tiếp đến chủ ngữ lớn. Cấu trúc này giúp miêu tả đặc điểm hoặc trạng thái chi tiết của chủ ngữ lớn.", "Mẹo: Hãy xem cụm chủ-vị phía sau như một lời giải thích hoặc miêu tả kỹ hơn cho chủ ngữ đứng đầu câu.", "Lưu ý: Cần phân biệt rõ đâu là chủ ngữ lớn và đâu là chủ ngữ nhỏ để tránh dịch sai ý nghĩa của câu.", "我的书包你看见了吗？", "wǒ de shū bāo nǐ kàn jiàn le ma", "Cái cặp sách của tôi bạn có nhìn thấy không?", "弟弟手很小。", "dì dì shǒu hěn xiǎo", "Tay của em trai rất nhỏ.", "这件事我知道。", "zhè jiàn shì wǒ zhī dào", "Chuyện này tôi biết.", "Ví dụ: 我的书包你看见了吗？"]}, {"name": "Câu hỏi lựa chọn (Alternative Questions)", "details": ["Công thức: A 还是 B 吗？ (A or B?)", "Giải thích: Câu hỏi lựa chọn dùng để đưa ra hai hay nhiều phương án để người nghe chọn lựa. Chúng ta sử dụng liên từ 「还是」 (háishì) để nối các lựa chọn trong câu hỏi.", "Mẹo: Trong câu hỏi lựa chọn, bạn không dùng 「吗」 ở cuối câu vì bản thân cấu trúc này đã là câu hỏi rồi.", "Lưu ý: Đừng nhầm lẫn giữa 「还是」 (dùng trong câu hỏi) và 「或者」 (huòzhě - dùng trong câu trần thuật để nói 'hoặc là').", "妈妈，是您准备考试还是我准备考试？", "mā mā shì nín zhǔn bèi kǎo shì hái shì wǒ zhǔn bèi kǎo shì", "Mẹ ơi, là mẹ chuẩn bị thi hay con chuẩn bị thi vậy?", "你更喜欢打篮球、踢足球还是游泳？", "nǐ gèng xǐ huān dǎ lán qiú tī zú qiú hái shì yóu yǒng", "Bạn thích chơi bóng rổ, đá bóng hay bơi lội hơn?", "我们什么时候去看电影？今天还是明天？", "wǒ men shén me shí hòu qù kàn diàn yǐng jīn tiān hái shì míng tiān", "Khi nào chúng ta đi xem phim? Hôm nay hay là ngày mai?", "Ví dụ: 妈妈，是您准备考试还是我准备考试？"]}, {"name": "Diễn tả hành động sắp xảy ra", "details": ["Công thức: Chủ ngữ + (要/快/快要/就要) + Vị ngữ + 了", "Giải thích: Cấu trúc này dùng để diễn tả một hành động hoặc trạng thái sắp sửa xảy ra trong tương lai gần. Bạn có thể sử dụng linh hoạt các từ 「要」, 「快」, 「快要」 hoặc 「就要」 trước vị ngữ và kết thúc câu bằng 「了」.", "Mẹo: Nếu trong câu có trạng ngữ chỉ thời gian cụ thể (ví dụ: 明天, 下星期), hãy dùng 「就要……了」 hoặc 「要……了」, không dùng 「快要……了」 hay 「快……了」.", "Lưu ý: Không nên nhầm lẫn cấu trúc này với 「了」 dùng để chỉ hành động đã hoàn thành trong quá khứ.", "饭菜快要做好了。", "fàn cài kuài yào zuò hǎo le", "Cơm canh sắp nấu xong rồi.", "火车快开了。", "huǒ chē kuài kāi le", "Tàu hỏa sắp chạy rồi.", "我们下星期就要考试了。", "wǒ men xià xīng qī jiù yào kǎo shì le", "Tuần sau chúng tôi phải thi rồi.", "Ví dụ: 饭菜快要做好了。"]}], "extended": [], "structuredGrammar": [{"name": "Câu vị ngữ cụm chủ-vị", "formula": "Chủ ngữ lớn + (Chủ ngữ nhỏ + Vị ngữ nhỏ)", "explanation": "Trong loại câu này, toàn bộ một cụm chủ-vị đóng vai trò làm vị ngữ cho chủ ngữ lớn. Chủ ngữ nhỏ thường là một bộ phận hoặc đối tượng liên quan trực tiếp đến chủ ngữ lớn. Cấu trúc này giúp miêu tả đặc điểm hoặc trạng thái chi tiết của chủ ngữ lớn.", "tip": "Hãy xem cụm chủ-vị phía sau như một lời giải thích hoặc miêu tả kỹ hơn cho chủ ngữ đứng đầu câu.", "note": "Cần phân biệt rõ đâu là chủ ngữ lớn và đâu là chủ ngữ nhỏ để tránh dịch sai ý nghĩa của câu.", "examples": [{"zh": "我的书
