": "弟弟", "options": ["弟弟", "自己", "老师", "服务员"], "explanation": "Đoạn cuối xác định quà được chuẩn bị cho em trai."}, {"question": "“来过”中的“过”表示什么？", "answer": "以前有这样的经历", "options": ["以前有这样的经历", "正在来", "马上要来", "必须来"], "explanation": "过 diễn tả trải nghiệm đã từng xảy ra.", "id": "H2-R04-5-Q5"}, {"question": "“一件小的”里的“小的”指什么？", "answer": "小一点儿的外套", "options": ["小一点儿的外套", "小朋友", "小饭馆", "小商场"], "explanation": "Danh từ 外套 được lược bỏ vì ngữ cảnh đã rõ.", "id": "H2-R04-5-Q6"}], "pinyin": "xīng qī wǔ ， xiǎo míng hé xiǎo xuě yì qǐ qù shāng chǎng mǎi yī fú 。 xiǎo míng yǐ qián lái guò zhè lǐ ， dàn shì xiǎo xuě méi lái guò 。 tā men xiān zǒu jìn yī jiā xiǎo diàn ， kàn jiàn le hóng sè de 、 lǜ sè de hé hēi sè de wài tào 。 xiǎo xuě xiǎng mǎi hēi sè de ， yīn wèi tā gōng zuò de shí hòu cháng cháng chuān hēi yī fú 。 fú wù yuán ná lái yī jiàn ， dàn shì yǒu diǎn ér dà ， yòu gěi tā huàn le yī jiàn xiǎo de 。 xiǎo xuě shì guò yǐ hòu jué de hěn hé shì ， jià gé shì liù shí kuài qián 。 tā men mǎi hǎo yī fú cái qù chī wǔ fàn 。 yīn wèi xià wǔ hái yǒu kè ， suǒ yǐ méi yǒu jì xù guàng shāng chǎng 。 huí jiā de lù shàng ， xiǎo míng shuō xià cì xiǎng dài mā mā yì qǐ lái 。 hòu lái tā yòu gěi dì di xuǎn le yī jiàn wài tào ， zhǔn bèi huí jiā yǐ hòu sòng gěi dì di 。"}, {"id": "H2-R05-1", "lesson": 5, "title": "楼上的生日晚会 · 小林", "text": "星期六晚上，小林在三楼的家里等朋友来过生日。都八点了，小雨还没到。小林打电话问他在哪里，才知道他已经到了楼下，但是手里拿着很多东西，找不到门。小林说：“你先等一下，我下去接你。”到了门口，小林接过一袋水果，两个人一起走上来。妈妈从厨房端来一碗热汤，让客人先坐下。小雨把礼物拿出来，笑着说：“这是给你的，希望你喜欢。”大家先吃饭，再听音乐，玩到很晚才回家。晚会结束时，妈妈把没吃完的水果分给大家，让每个人带一点儿回家。", "translation": "Tối thứ Bảy, 小林 chờ bạn đến sinh nhật ở nhà tầng ba. Đã tám giờ mà 小雨 chưa tới. Gọi điện mới biết bạn ở dưới lầu, cầm nhiều đồ và không tìm thấy cửa. 小林 xuống đón, cầm giúp một túi trái cây rồi hai người lên nhà. Mẹ mang canh từ bếp ra. 小雨 lấy quà ra tặng. Họ ăn trước, nghe nhạc sau, chơi đến khuya mới về. Khi tiệc kết thúc, mẹ chia trái cây còn lại cho mọi người đem một ít về nhà.", "grammar": ["上来 / 下去", "V + 来", "都……了"], "questions": [{"question": "小林的家在几楼？", "answer": "三楼", "options": ["三楼", "一楼", "二楼", "五楼"], "explanation": "Câu đầu nói 在三楼的家里.", "id": "H2-R05-1-Q1"}, {"question": "打电话时，小雨在哪里？", "answer": "楼下", "options": ["楼下", "厨房里", "车站里", "学校里"], "explanation": "Điện thoại cho biết bạn đã đến dưới lầu.", "id": "H2-R05-1-Q2"}, {"question": "小林为什么下楼？", "answer": "接朋友", "options": ["接朋友", "买汤", "上课", "送老师"], "explanation": "A nói 我下去接你.", "id": "H2-R05-1-Q3"}, {"id": "H2-R05-1-Q4", "question": "大家回家时带了什么？", "answer": "水果", "options": ["水果", "新鞋", "相机", "药片"], "explanation": "Mẹ cho mọi người mang một ít trái cây về."}, {"question": "“我下去接你”中的“去”如何理解？", "answer": "从说话人所在的楼上往下走", "options": ["从说话人所在的楼上往下走", "从门口向楼上走", "不表示方向", "表示曾经去过"], "explanation": "Người nói còn ở trên lầu nên 下去 là xuống đó.", "id": "H2-R05-1-Q5"}, {"question": "“都八点了”这一类说法主要强调什么？", "answer": "已经到这个时间了", "options": ["已经到这个时间了", "只有八个人", "八点以前", "一天有八小时"], "explanation": "都 + thời điểm + 了 nhấn mạnh đã đến giờ ấy, thường có ý muộn.", "id": "H2-R05-1-Q6"}], "pinyin": "xīng qī liù wǎn shàng ， xiǎo lín zài sān lóu de jiā lǐ děng péng yǒu lái guò shēng rì 。 dōu bā diǎn le ， xiǎo yǔ hái méi dào 。 xiǎo lín dǎ diàn huà wèn tā zài nǎ lǐ ， cái zhī dào tā yǐ jīng dào le lóu xià ， dàn shì shǒu lǐ ná zhe hěn duō dōng xī ， zhǎo bú dào mén 。 xiǎo lín shuō ： “ nǐ xiān děng yí xià ， wǒ xià qù jiē nǐ 。 ” dào le mén kǒu ， xiǎo lín jiē guò yī dài shuǐ guǒ ， liǎng gè rén yì qǐ zǒu shàng lái 。 mā mā cóng chú fáng duān lái yī wǎn rè tāng ， ràng kè rén xiān zuò xià 。 xiǎo yǔ bǎ lǐ wù ná chū lái ， xiào zhe shuō ： “ zhè shì gěi nǐ de ， xī wàng nǐ xǐ huān 。 ” dà jiā xiān chī fàn ， zài tīng yīn yuè ， wán dào hěn wǎn cái huí jiā 。 wǎn huì jié shù shí ， mā mā bǎ méi chī wán de shuǐ guǒ fēn gěi dà jiā ， ràng měi gè rén dài yì diǎn ér huí jiā 。"}, {"id": "H2-R05-2", "lesson": 5, "title": "楼上的生日晚会 · 小安", "text": "星期日晚上，小安在三楼的家里等朋友来过生日。都九点了，小月还没到。小安打电话问他在哪里，才知道他已经到了楼下，但是手里拿着很多东西，找不到门。小安说：“你先等一下，我下去接你。”到了门口，小安接过一袋水果，两个人一起走上来。妈妈从厨房端来一碗热汤，让客人先坐下。小月把礼物拿出来，笑着说：“这是给你的，希望你喜欢。”大家先吃饭，再听音乐，玩到很晚才回家。朋友送的是一本画册，里面有很多城市的照片，他一看就喜欢上了。", "translation": "Tối Chủ nhật, 小安 chờ bạn đến sinh nhật ở nhà tầng ba. Đã chín giờ mà 小月 chưa tới. Gọi điện mới biết bạn ở dưới lầu, cầm nhiều đồ và không tìm thấy cửa. 小安 xuống đón, cầm giúp một túi trái cây rồi hai người lên nhà. Mẹ mang canh từ bếp ra. 小月 lấy quà ra tặng. Họ ăn trước, nghe nhạc sau, chơi đến khuya mới về. Bạn tặng một tập tranh có nhiều ảnh thành phố, cậu vừa xem đã thích.", "grammar": ["上来 / 下去", "V + 来", "都……了"], "questions": [{"question": "小安的家在几楼？", "answer": "三楼", "options": ["三楼", "一楼", "二楼", "五楼"], "explanation": "Câu đầu nói 在三楼的家里.", "id": "H2-R05-2-Q1"}, {"question": "打电话时，小月在哪里？", "answer": "楼下", "options": ["楼下", "厨房里", "车站里", "学校里"], "explanation": "Điện thoại cho biết bạn đã đến dưới lầu.", "id": "H2-R05-2-Q2"}, {"question": "小安为什么下楼？", "answer": "接朋友", "options": ["接朋友", "买汤", "上课", "送老师"], "explanation": "A nói 我下去接你.", "id": "H2-R05-2-Q3"}, {"id": "H2-R05-2-Q4", "question": "朋友送的书里面主要有什么？", "answer": "城市的照片", "options": ["城市的照片", "考试答案", "医院名单", "汽车价格"], "explanation": "Sách có nhiều ảnh các thành phố."}, {"question": "“我下去接你”中的“去”如何理解？", "answer": "从说话人所在的楼上往下走", "options": ["从说话人所在的楼上往下走", "从门口向楼上走", "不表示方向", "表示曾经去过"], "explanation": "Người nói còn ở trên lầu nên 下去 là xuống đó.", "id": "H2-R05-2-Q5"}, {"question": "“都八点了”这一类说法主要强调什么？", "answer": "已经到这个时间了", "options": ["已经到这个时间了", "只有八个人", "八点以前", "一天有八小时"], "explanation": "都 + thời điểm + 了 nhấn mạnh đã đến giờ ấy, thường có ý muộn.", "id": "H2-R05-2-Q6"}], "pinyin": "xīng qī rì wǎn shàng ， xiǎo ān zài sān lóu de jiā lǐ děng péng yǒu lái guò shēng rì 。 dōu jiǔ diǎn le ， xiǎo yuè hái méi dào 。 xiǎo ān dǎ diàn huà wèn tā zài nǎ lǐ ， cái zhī dào tā yǐ jīng dào le lóu xià ， dàn shì shǒu lǐ ná zhe hěn duō dōng xī ， zhǎo bú dào mén 。 xiǎo ān shuō ： “ nǐ xiān děng yí xià ， wǒ xià qù jiē nǐ 。 ” dào le mén kǒu ， xiǎo ān jiē guò yī dài shuǐ guǒ ， liǎng gè rén yì qǐ zǒu shàng lái 。 mā mā cóng chú fáng duān lái yī wǎn rè tāng ， ràng kè rén xiān zuò xià 。 xiǎo yuè bǎ lǐ wù ná chū lái ， xiào zhe shuō ： “ zhè shì gěi nǐ de ， xī wàng nǐ xǐ huān 。 ” dà jiā xiān chī fàn ， zài tīng yīn yuè ， wán dào hěn wǎn cái huí jiā 。 péng yǒu sòng de shì yī běn huà cè ， lǐ miàn yǒu hěn duō chéng shì de zhào piān ， tā yī kàn jiù xǐ huān shàng le 。"}, {"id": "H2-R05-3", "lesson": 5, "title": "楼上的生日晚会 · 小文", "text": "星期一晚上，小文在三楼的家里等朋友来过生日。都十点了，小兰还没到。小文打电话问他在哪里，才知道他已经到了楼下，但是手里拿着很多东西，找不到门。小文说：“你先等一下，我下去接你。”到了门口，小文接过一袋水果，两个人一起走上来。妈妈从厨房端来一碗热汤，让客人先坐下。小兰把礼物拿出来，笑着说：“这是给你的，希望你喜欢。”大家先吃饭，再听音乐，玩到很晚才回家。楼下的邻居听见音乐，也拿来一盘自己做的饺子，大家请她一起坐下。", "translation": "Tối thứ Hai, 小文 chờ bạn đến sinh nhật ở nhà tầng ba. Đã mười giờ mà 小兰 chưa tới. Gọi điện mới biết bạn ở dưới lầu, cầm nhiều đồ và không tìm thấy cửa. 小文 xuống đón, cầm giúp một túi trái cây rồi hai người lên nhà. Mẹ mang canh từ bếp ra. 小兰 lấy quà ra tặng. Họ ăn trước, nghe nhạc sau, chơi đến khuya mới về. Hàng xóm dưới lầu nghe nhạc cũng mang đĩa sủi cảo tự làm đến, mọi người mời cô ngồi cùng.", "grammar": ["上来 / 下去", "V + 来", "都……了"], "questions": [{"question": "小文的家在几楼？", "answer": "三楼", "options": ["三楼", "一楼", "二楼", "五楼"], "explanation": "Câu đầu nói 在三楼的家里.", "id": "H2-R05-3-Q1"}, {"question": "打电话时，小兰在哪里？", "answer": "楼下", "options": ["楼下", "厨房里", "车站里", "学校里"], "explanation": "Điện thoại cho biết bạn đã đến dưới lầu.", "id": "H2-R05-3-Q2"}, {"question": "小文为什么下楼？", "answer": "接朋友", "options": ["接朋友", "买汤", "上课", "送老师"], "explanation": "A nói 我下去接你.", "id": "H2-R05-3-Q3"}, {"id": "H2-R05-3-Q4", "question": "邻居带来了什么？", "answer": "自己做的饺子", "options": ["自己做的饺子", "一台电视", "一瓶药水", "一张机票"], "explanation": "Hàng xóm mang món sủi cảo tự làm."}, {"question": "“我下去接你”中的“去”如何理解？", "answer": "从说话人所在的楼上往下走", "options": ["从说话人所在的楼上往下走", "从门口向楼上走", "不表示方向", "表示曾经去过"], "explanation": "Người nói còn ở trên lầu nên 下去 là xuống đó.", "id": "H2-R05-3-Q5"}, {"question": "“都八点了”这一类说法主要强调什么？", "answer": "已经到这个时间了", "options": ["已经到这个时间了", "只有八个人", "八点以前", "一天有八小时"], "explanation": "都 + thời điểm + 了 nhấn mạnh đã đến giờ ấy, thường có ý muộn.", "id": "H2-R05-3-Q6"}], "pinyin": "xīng qī yī wǎn shàng ， xiǎo wén zài sān lóu de jiā lǐ děng péng yǒu lái guò shēng rì 。 dōu shí diǎn le ， xiǎo lán hái méi dào 。 xiǎo wén dǎ diàn huà wèn tā zài nǎ lǐ ， cái zhī dào tā yǐ jīng dào le lóu xià ， dàn shì shǒu lǐ ná zhe hěn duō dōng xī ， zhǎo bú dào mén 。 xiǎo wén shuō ： “ nǐ xiān děng yí xià ， wǒ xià qù jiē nǐ 。 ” dào le mén kǒu ， xiǎo wén jiē guò yī dài shuǐ guǒ ， liǎng gè rén yì qǐ zǒu shàng lái 。 mā mā cóng chú fáng duān lái yī wǎn rè tāng ， ràng kè rén xiān zuò xià 。 xiǎo lán bǎ lǐ wù ná chū lái ， xiào zhe shuō ： “ zhè shì gěi nǐ de ， xī wàng nǐ xǐ huān 。 ” dà jiā xiān chī fàn ， zài tīng yīn yuè ， wán dào hěn wǎn cái huí jiā 。 lóu xià de lín jū tīng jiàn yīn yuè ， yě ná lái yī pán zì jǐ zuò de jiǎo zi ， dà jiā qǐng tā yì qǐ zuò xià 。"}, {"id": "H2-R05-4", "lesson": 5, "title": "楼上的生日晚会 · 小东", "text": "星期三晚上，小东在三楼的家里等朋友来过生日。都七点半了，小梅还没到。小东打电话问他在哪里，才知道他已经到了楼下，但是手里拿着很多东西，找不到门。小东说：“你先等一下，我下去接你。”到了门口，小东接过一袋水果，两个人一起走上来。妈妈从厨房端来一碗热汤，让客人先坐下。小梅把礼物拿出来，笑着说：“这是给你的，希望你喜欢。”大家先吃饭，再听音乐，玩到很晚才回家。大家走的时候，发现外面下雨了，主人就拿出几把伞，让朋友们带走。", "translation": "Tối thứ Tư, 小东 chờ bạn đến sinh nhật ở nhà tầng ba. Đã bảy giờ rưỡi mà 小梅 chưa tới. Gọi điện mới biết bạn ở dưới lầu, cầm nhiều đồ và không tìm thấy cửa. 小东 xuống đón, cầm giúp một túi trái cây rồi hai người lên nhà. Mẹ mang canh từ bếp ra. 小梅 lấy quà ra tặng. Họ ăn trước, nghe nhạc sau, chơi đến khuya mới về. Khi ra về mọi người thấy ngoài trời mưa, chủ nhà lấy ô cho bạn mang theo.", "grammar": ["上来 / 下去", "V + 来", "都……了"], "questions": [{"question": "小东的家在几楼？", "answer": "三楼", "options": ["三楼", "一楼", "二楼", "五楼"], "explanation": "Câu đầu nói 在三楼的家里.", "id": "H2-R05-4-Q1"}, {"question": "打电话时，小梅在哪里？", "answer": "楼下", "options": ["楼下", "厨房里", "车站里", "学校里"], "explanation": "Điện thoại cho biết bạn đã đến dưới lầu.", "id": "H2-R05-4-Q2"}, {"question": "小东为什么下楼？", "answer": "接朋友", "options": ["接朋友", "买汤", "上课", "送老师"], "explanation": "A nói 我下去接你.", "id": "H2-R05-4-Q3"}, {"id": "H2-R05-4-Q4", "question": "为什么主人拿出伞？", "answer": "外面下雨了", "options": ["外面下雨了", "屋里太热", "有人要画画", "大家想游泳"], "explanation": "Lấy ô vì trời mưa lúc bạn ra về."}, {"question": "“我下去接你”中的“去”如何理解？", "answer": "从说话人所在的楼上往下走", "options": ["从说话人所在的楼上往下走", "从门口向楼上走", "不表示方向", "表示曾经去过"], "explanation": "Người nói còn ở trên lầu nên 下去 là xuống đó.", "id": "H2-R05-4-Q5"}, {"question": "“都八点了”这一类说法主要强调什么？", "answer": "已经到这个时间了", "options": ["已经到这个时间了", "只有八个人", "八点以前", "一天有八小时"], "explanation": "都 + thời điểm + 了 nhấn mạnh đã đến giờ ấy, thường có ý muộn.", "id": "H2-R05-4-Q6"}], "pinyin": "xīng qī sān wǎn shàng ， xiǎo dōng zài sān lóu de jiā lǐ děng péng yǒu lái guò shēng rì 。 dōu qī diǎn bàn le ， xiǎo méi hái méi dào 。 xiǎo dōng dǎ diàn huà wèn tā zài nǎ lǐ ， cái zhī dào tā yǐ jīng dào le lóu xià ， dàn shì shǒu lǐ ná zhe hěn duō dōng xī ， zhǎo bú dào mén 。 xiǎo dōng shuō ： “ nǐ xiān děng yí xià ， wǒ xià qù jiē nǐ 。 ” dào le mén kǒu ， xiǎo dōng jiē guò yī dài shuǐ guǒ ， liǎng gè rén yì qǐ zǒu shàng lái 。 mā mā cóng chú fáng duān lái yī wǎn rè tāng ， ràng kè rén xiān zuò xià 。 xiǎo méi bǎ lǐ wù ná chū lái ， xiào zhe shuō ： “ zhè shì gěi nǐ de ， xī wàng nǐ xǐ huān 。 ” dà jiā xiān chī fàn ， zài tīng yīn yuè ， wán dào hěn wǎn cái huí jiā 。 dà jiā zǒu de shí hòu ， fā xiàn wài miàn xià yǔ le ， zhǔ rén jiù ná chū jǐ bǎ sǎn ， ràng péng yǒu men dài zǒu 。"}, {"id": "H2-R05-5", "lesson": 5, "title": "楼上的生日晚会 · 小明", "text": "星期五晚上，小明在三楼的家里等朋友来过生日。都八点半了，小雪还没到。小明打电话问他在哪里，才知道他已经到了楼下，但是手里拿着很多东西，找不到门。小明说：“你先等一下，我下去接你。”到了门口，小明接过一袋水果，两个人一起走上来。妈妈从厨房端来一碗热汤，让客人先坐下。小雪把礼物拿出来，笑着说：“这是给你的，希望你喜欢。”大家先吃饭，再听音乐，玩到很晚才回家。第二天他把照片发给没能来的同学，还约好下次一起出去玩。", "translation": "Tối thứ Sáu, 小明 chờ bạn đến sinh nhật ở nhà tầng ba. Đã tám giờ rưỡi mà 小雪 chưa tới. Gọi điện mới biết bạn ở dưới lầu, cầm nhiều đồ và không tìm thấy cửa. 小明 xuống đón, cầm giúp một túi trái cây rồi hai người lên nhà. Mẹ mang canh từ bếp ra. 小雪 lấy quà ra tặng. Họ ăn trước, nghe nhạc sau, chơi đến khuya mới về. Hôm sau cậu gửi ảnh cho bạn học không đến được và hẹn lần sau cùng đi chơi.", "grammar": ["上来 / 下去", "V + 来", "都……了"], "questions": [{"question": "小明的家在几楼？", "answer": "三楼", "options": ["三楼", "一楼", "二楼", "五楼"], "explanation": "Câu đầu nói 在三楼的家里.", "id": "H2-R05-5-Q1"}, {"question": "打电话时，小雪在哪里？", "answer": "楼下", "options": ["楼下", "厨房里", "车站里", "学校里"], "explanation": "Điện thoại cho biết bạn đã đến dưới lầu.", "id": "H2-R05-5-Q2"}, {"question": "小明为什么下楼？", "answer": "接朋友", "options": ["接朋友", "买汤", "上课", "送老师"], "explanation": "A nói 我下去接你.", "id": "H2-R05-5-Q3"}, {"id": "H2-R05-5-Q4", "question": "照片发给了谁？", "answer": "没能来的同学", "options": ["没能来的同学", "公交车司机", "商店顾客", "不认识的人"], "explanation": "Ảnh được gửi cho những bạn không thể tới."}, {"question": "“我下去接你”中的“去”如何理解？", "answer": "从说话人所在的楼上往下走", "options": ["从说话人所在的楼上往下走", "从门口向楼上走", "不表示方向", "表示曾经去过"], "explanation": "Người nói còn ở trên lầu nên 下去 là xuống đó.", "id": "H2-R05-5-Q5"}, {"question": "“都八点了”这一类说法主要强调什么？", "answer": "已经到这个时间了", "options": ["已经到这个时间了", "只有八个人", "八点以前", "一天有八小时"], "explanation": "都 + thời điểm + 了 nhấn mạnh đã đến giờ ấy, thường có ý muộn.", "id": "H2-R05-5-Q6"}], "pinyin": "xīng qī wǔ wǎn shàng ， xiǎo míng zài sān lóu de jiā lǐ děng péng yǒu lái guò shēng rì 。 dōu bā diǎn bàn le ， xiǎo xuě hái méi dào 。 xiǎo míng dǎ diàn huà wèn tā zài nǎ lǐ ， cái zhī dào tā yǐ jīng dào le lóu xià ， dàn shì shǒu lǐ ná zhe hěn duō dōng xī ， zhǎo bú dào mén 。 xiǎo míng shuō ： “ nǐ xiān děng yí xià ， wǒ xià qù jiē nǐ 。 ” dào le mén kǒu ， xiǎo míng jiē guò yī dài shuǐ guǒ ， liǎng gè rén yì qǐ zǒu shàng lái 。 mā mā cóng chú fáng duān lái yī wǎn rè tāng ， ràng kè rén xiān zuò xià 。 xiǎo xuě bǎ lǐ wù ná chū lái ， xiào zhe shuō ： “ zhè shì gěi nǐ de ， xī wàng nǐ xǐ huān 。 ” dà jiā xiān chī fàn ， zài tīng yīn yuè ， wán dào hěn wǎn cái huí jiā 。 dì èr tiān tā bǎ zhào piān fā gěi méi néng lái de tóng xué ， hái yuē hǎo xià cì yì qǐ chū qù wán 。"}, {"id": "H2-R06-1", "lesson": 6, "title": "给朋友一个生日惊喜 · 小林", "text": "小雨的生日是星期六。为了给他准备一个小晚会，小林早早地来到他家，手里拿着一个大大的蛋糕。桌子上已经放着水果、面包、果汁什么的。小雨的妹妹用画笔画了一张卡片，上面有一只小小的猫，还有一朵红红的花。朋友们到了以后，大家轻轻地关上门，等小雨回来。八点，小雨一进门，就看见大家站在一起唱生日歌。他高高兴兴地说：“你们都来了，我真没想到！”吃完蛋糕，他们一起看了以前的照片。卡片上还有一句话：“希望你每天都开心。”他读完以后，把卡片放在书桌上。", "translation": "Sinh nhật 小雨 là thứ Bảy. 小林 đến sớm mang bánh thật to. Trên bàn có trái cây, bánh mì, nước quả và các thứ tương tự. Em gái 小雨 vẽ thiệp với mèo nhỏ và hoa đỏ. Các bạn khẽ đóng cửa chờ. Lúc tám giờ, 小雨 vào và thấy mọi người hát chúc mừng nên rất vui, không ngờ tất cả đều đến. Ăn bánh xong họ xem ảnh cũ. Thiệp còn câu “Mong bạn ngày nào cũng vui”; đọc xong cậu đặt thiệp trên bàn học.", "grammar": ["Lặp tính từ", "什么的", "地"], "questions": [{"question": "谁过生日？", "answer": "小雨", "options": ["小雨", "小林", "老师", "爸爸"], "explanation": "Câu mở đầu xác định sinh nhật B.", "id": "H2-R06-1-Q1"}, {"question": "小林带来了什么？", "answer": "一个蛋糕", "options": ["一个蛋糕", "一台电脑", "一双鞋", "一张地图"], "explanation": "A cầm 一个大大的蛋糕.", "id": "H2-R06-1-Q2"}, {"question": "卡片上画着什么？", "answer": "一只猫和一朵花", "options": ["一只猫和一朵花", "一条鱼和一只鸟", "一座山和一条河", "一辆车和一条路"], "explanation": "Thiệp có mèo nhỏ và bông hoa đỏ.", "id": "H2-R06-1-Q3"}, {"id": "H2-R06-1-Q4", "question": "他把卡片放在哪里？", "answer": "书桌上", "options": ["书桌上", "冰箱里", "楼下", "车站里"], "explanation": "Câu cuối nêu vị trí 书桌上."}, {"question": "“轻轻地关上门”中的“地”连接什么？", "answer": "动作的方式和动作", "options": ["动作的方式和动作", "人和人", "数字和量词", "地点和距离"], "explanation": "轻轻地 là trạng ngữ chỉ cách đóng cửa.", "id": "H2-R06-1-Q5"}, {"question": "“水果、面包、果汁什么的”说明什么？", "answer": "还有同类的东西没一一说完", "options": ["还有同类的东西没一一说完", "不知道水果是什么", "只有果汁", "都是假的"], "explanation": "什么的 sau danh sách cho biết còn đồ tương tự.", "id": "H2-R06-1-Q6"}], "pinyin": "xiǎo yǔ de shēng rì shì xīng qī liù 。 wèi le gěi tā zhǔn bèi yí gè xiǎo wǎn huì ， xiǎo lín zǎo zǎo dì lái dào tā jiā ， shǒu lǐ ná zhe yí gè dà dà de dàn gāo 。 zhuō zi shàng yǐ jīng fàng zhe shuǐ guǒ 、 miàn bāo 、 guǒ zhī shén me de 。 xiǎo yǔ de mèi mèi yòng huà bǐ huà le yī zhāng kǎ piàn ， shàng miàn yǒu yī zhī xiǎo xiǎo de māo ， hái yǒu yī duǒ hóng hóng de huā 。 péng yǒu men dào le yǐ hòu ， dà jiā qīng qīng dì guān shàng mén ， děng xiǎo yǔ huí lái 。 bā diǎn ， xiǎo yǔ yī jìn mén ， jiù kàn jiàn dà jiā zhàn zài yì qǐ chàng shēng rì gē 。 tā gāo gāo xìng xìng dì shuō ： “ nǐ men dōu lái le ， wǒ zhēn méi xiǎng dào ！ ” chī wán dàn gāo ， tā men yì qǐ kàn le yǐ qián de zhào piān 。 kǎ piàn shàng hái yǒu yī jù huà ： “ xī wàng nǐ měi tiān dōu kāi xīn 。 ” tā dú wán yǐ hòu ， bǎ kǎ piàn fàng zài shū zhuō shàng 。"}, {"id": "H2-R06-2", "lesson": 6, "title": "给朋友一个生日惊喜 · 小安", "text": "小月的生日是星期日。为了给他准备一个小晚会，小安早早地来到他家，手里拿着一个大大的蛋糕。桌子上已经放着水果、面包、果汁什么的。小月的妹妹用画笔画了一张卡片，上面有一只小小的猫，还有一朵红红的花。朋友们到了以后，大家轻轻地关上门，等小月回来。九点，小月一进门，就看见大家站在一起唱生日歌。他高高兴兴地说：“你们都来了，我真没想到！”吃完蛋糕，他们一起看了以前的照片。有个朋友带来了一把吉他，大家跟着音乐一起唱，连平时很安静的妹妹也唱了。", "translation": "Sinh nhật 小月 là Chủ nhật. 小安 đến sớm mang bánh thật to. Trên bàn có trái cây, bánh mì, nước quả và các thứ tương tự. Em gái 小月 vẽ thiệp với mèo nhỏ và hoa đỏ. Các bạn khẽ đóng cửa chờ. Lúc chín giờ, 小月 vào và thấy mọi người hát chúc mừng nên rất vui, không ngờ tất cả đều đến. Ăn bánh xong họ xem ảnh cũ. Một bạn mang đàn ghi-ta, mọi người hát theo nhạc, cả em gái vốn ít nói cũng hát.", "grammar": ["Lặp tính từ", "什么的", "地"], "questions": [{"question": "谁过生日？", "answer": "小月", "options": ["小月", "小安", "老师", "爸爸"], "explanation": "Câu mở đầu xác định sinh nhật B.", "id": "H2-R06-2-Q1"}, {"question": "小安带来了什么？", "answer": "一个蛋糕", "options": ["一个蛋糕", "一台电脑", "一双鞋", "一张地图"], "explanation": "A cầm 一个大大的蛋糕.", "id": "H2-R06-2-Q2"}, {"question": "卡片上画着什么？", "answer": "一只猫和一朵花", "options": ["一只猫和一朵花", "一条鱼和一只鸟", "一座山和一条河", "一辆车和一条路"], "explanation": "Thiệp có mèo nhỏ và bông hoa đỏ.", "id": "H2-R06-2-Q3"}, {"id": "H2-R06-2-Q4", "question": "平时很安静的妹妹做了什么？", "answer": "也跟着唱歌", "options": ["也跟着唱歌", "马上回家", "一直哭", "去买票"], "explanation": "Em gái cũng tham gia hát."}, {"question": "“轻轻地关上门”中的“地”连接什么？", "answer": "动作的方式和动作", "options": ["动作的方式和动作", "人和人", "数字和量词", "地点和距离"], "explanation": "轻轻地 là trạng ngữ chỉ cách đóng cửa.", "id": "H2-R06-2-Q5"}, {"question": "“水果、面包、果汁什么的”说明什么？", "answer": "还有同类的东西没一一说完", "options": ["还有同类的东西没一一说完", "不知道水果是什么", "只有果汁", "都是假的"], "explanation": "什么的 sau danh sách cho biết còn đồ tương tự.", "id": "H2-R06-2-Q6"}], "pinyin": "xiǎo yuè de shēng rì shì xīng qī rì 。 wèi le gěi tā zhǔn bèi yí gè xiǎo wǎn huì ， xiǎo ān zǎo zǎo dì lái dào tā jiā ， shǒu lǐ ná zhe yí gè dà dà de dàn gāo 。 zhuō zi shàng yǐ jīng fàng zhe shuǐ guǒ 、 miàn bāo 、 guǒ zhī shén me de 。 xiǎo yuè de mèi mèi yòng huà bǐ huà le yī zhāng kǎ piàn ， shàng miàn yǒu yī zhī xiǎo xiǎo de māo ， hái yǒu yī duǒ hóng hóng de huā 。 péng yǒu men dào le yǐ hòu ， dà jiā qīng qīng dì guān shàng mén ， děng xiǎo yuè huí lái 。 jiǔ diǎn ， xiǎo yuè yī jìn mén ， jiù kàn jiàn dà jiā zhàn zài yì qǐ chàng shēng rì gē 。 tā gāo gāo xìng xìng dì shuō ： “ nǐ men dōu lái le ， wǒ zhēn méi xiǎng dào ！ ” chī wán dàn gāo ， tā men yì qǐ kàn le yǐ qián de zhào piān 。 yǒu gè péng yǒu dài lái le yī bǎ jí tā ， dà jiā gēn zhe yīn yuè yì qǐ chàng ， lián píng shí hěn ān jìng de mèi mèi yě chàng le 。"}, {"id": "H2-R06-3", "lesson": 6, "title": "给朋友一个生日惊喜 · 小文", "text": "小兰的生日是星期一。为了给他准备一个小晚会，小文早早地来到他家，手里拿着一个大大的蛋糕。桌子上已经放着水果、面包、果汁什么的。小兰的妹妹用画笔画了一张卡片，上面有一只小小的猫，还有一朵红红的花。朋友们到了以后，大家轻轻地关上门，等小兰回来。十点，小兰一进门，就看见大家站在一起唱生日歌。他高高兴兴地说：“你们都来了，我真没想到！”吃完蛋糕，他们一起看了以前的照片。蛋糕上没有写名字，因为大家想让他自己用巧克力写上去。", "translation": "Sinh nhật 小兰 là thứ Hai. 小文 đến sớm mang bánh thật to. Trên bàn có trái cây, bánh mì, nước quả và các thứ tương tự. Em gái 小兰 vẽ thiệp với mèo nhỏ và hoa đỏ. Các bạn khẽ đóng cửa chờ. Lúc mười giờ, 小兰 vào và thấy mọi người hát chúc mừng nên rất vui, không ngờ tất cả đều đến. Ăn bánh xong họ xem ảnh cũ. Trên bánh chưa viết tên vì mọi người muốn cậu tự dùng sô-cô-la viết lên.", "grammar": ["Lặp tính từ", "什么的", "地"], "questions": [{"question": "谁过生日？", "answer": "小兰", "options": ["小兰", "小文", "老师", "爸爸"], "explanation": "Câu mở đầu xác định sinh nhật B.", "id": "H2-R06-3-Q1"}, {"question": "小文带来了什么？", "answer": "一个蛋糕", "options": ["一个蛋糕", "一台电脑", "一双鞋", "一张地图"], "explanation": "A cầm 一个大大的蛋糕.", "id": "H2-R06-3-Q2"}, {"question": "卡片上画着什么？", "answer": "一只猫和一朵花", "options": ["一只猫和一朵花", "一条鱼和一只鸟", "一座山和一条河", "一辆车和一条路"], "explanation": "Thiệp có mèo nhỏ và bông hoa đỏ.", "id": "H2-R06-3-Q3"}, {"id": "H2-R06-3-Q4", "question": "为什么蛋糕上还没有名字？", "answer": "想让他自己写", "options": ["想让他自己写", "不知道他的名字", "店已经关门", "忘了过生日"], "explanation": "Mọi người chủ ý để cậu tự viết tên."}, {"question": "“轻轻地关上门”中的“地”连接什么？", "answer": "动作的方式和动作", "options": ["动作的方式和动作", "人和人", "数字和量词", "地点和距离"], "explanation": "轻轻地 là trạng ngữ chỉ cách đóng cửa.", "id": "H2-R06-3-Q5"}, {"question": "“水果、面包、果汁什么的”说明什么？", "answer": "还有同类的东西没一一说完", "options": ["还有同类的东西没一一说完", "不知道水果是什么", "只有果汁", "都是假的"], "explanation": "什么的 sau danh sách cho biết còn đồ tương tự.", "id": "H2-R06-3-Q6"}], "pinyin": "xiǎo lán de shēng rì shì xīng qī yī 。 wèi le gěi tā zhǔn bèi yí gè xiǎo wǎn huì ， xiǎo wén zǎo zǎo dì lái dào tā jiā ， shǒu lǐ ná zhe yí gè dà dà de dàn gāo 。 zhuō zi shàng yǐ jīng fàng zhe shuǐ guǒ 、 miàn bāo 、 guǒ zhī shén me de 。 xiǎo lán de mèi mèi yòng huà bǐ huà le yī zhāng kǎ piàn ， shàng miàn yǒu yī zhī xiǎo xiǎo de māo ， hái yǒu yī duǒ hóng hóng de huā 。 péng yǒu men dào le yǐ hòu ， dà jiā qīng qīng dì guān shàng mén ， děng xiǎo lán huí lái 。 shí diǎn ， xiǎo lán yī jìn mén ， jiù kàn jiàn dà jiā zhàn zài yì qǐ chàng shēng rì gē 。 tā gāo gāo xìng xìng dì shuō ： “ nǐ men dōu lái le ， wǒ zhēn méi xiǎng dào ！ ” chī wán dàn gāo ， tā men yì qǐ kàn le yǐ qián de zhào piān 。 dàn gāo shàng méi yǒu xiě míng zì ， yīn wèi dà jiā xiǎng ràng tā zì jǐ yòng qiǎo kè lì xiě shàng qù 。"}, {"id": "H2-R06-4", "lesson": 6, "title": "给朋友一个生日惊喜 · 小东", "text": "小梅的生日是星期三。为了给他准备一个小晚会，小东早早地来到他家，手里拿着一个大大的蛋糕。桌子上已经放着水果、面包、果汁什么的。小梅的妹妹用画笔画了一张卡片，上面有一只小小的猫，还有一朵红红的花。朋友们到了以后，大家轻轻地关上门，等小梅回来。七点半，小梅一进门，就看见大家站在一起唱生日歌。他高高兴兴地说：“你们都来了，我真没想到！”吃完蛋糕，他们一起看了以前的照片。晚上爷爷也打来电话，虽然没能到家里，但是在电话里给他唱了生日歌。", "translation": "Sinh nhật 小梅 là thứ Tư. 小东 đến sớm mang bánh thật to. Trên bàn có trái cây, bánh mì, nước quả và các thứ tương tự. Em gái 小梅 vẽ thiệp với mèo nhỏ và hoa đỏ. Các bạn khẽ đóng cửa chờ. Lúc bảy giờ rưỡi, 小梅 vào và thấy mọi người hát chúc mừng nên rất vui, không ngờ tất cả đều đến. Ăn bánh xong họ xem ảnh cũ. Tối ông gọi điện, tuy không đến được nhưng hát chúc mừng qua điện thoại.", "grammar": ["Lặp tính từ", "什么的", "地"], "questions": [{"question": "谁过生日？", "answer": "小梅", "options": ["小梅", "小东", "老师", "爸爸"], "explanation": "Câu mở đầu xác định sinh nhật B.", "id": "H2-R06-4-Q1"}, {"question": "小东带来了什么？", "answer": "一个蛋糕", "options": ["一个蛋糕", "一台电脑", "一双鞋", "一张地图"], "explanation": "A cầm 一个大大的蛋糕.", "id": "H2-R06-4-Q2"}, {"question": "卡片上画着什么？", "answer": "一只猫和一朵花", "options": ["一只猫和一朵花", "一条鱼和一只鸟", "一座山和一条河", "一辆车和一条路"], "explanation": "Thiệp có mèo nhỏ và bông hoa đỏ.", "id": "H2-R06-4-Q3"}, {"id": "H2-R06-4-Q4", "question": "爷爷是怎样送来祝福的？", "answer": "在电话里唱歌", "options": ["在电话里唱歌", "开车到学校", "写在报纸上", "请司机带话"], "explanation": "Ông hát chúc mừng qua cuộc điện thoại."}, {"question": "“轻轻地关上门”中的“地”连接什么？", "answer": "动作的方式和动作", "options": ["动作的方式和动作", "人和人", "数字和量词", "地点和距离"], "explanation": "轻轻地 là trạng ngữ chỉ cách đóng cửa.", "id": "H2-R06-4-Q5"}, {"question": "“水果、面包、果汁什么的”说明什么？", "answer": "还有同类的东西没一一说完", "options": ["还有同类的东西没一一说完", "不知道水果是什么", "只有果汁", "都是假的"], "explanation": "什么的 sau danh sách cho biết còn đồ tương tự.", "id": "H2-R06-4-Q6"}], "pinyin": "xiǎo méi de shēng rì shì xīng qī sān 。 wèi le gěi tā zhǔn bèi yí gè xiǎo wǎn huì ， xiǎo dōng zǎo zǎo dì lái dào tā jiā ， shǒu lǐ ná zhe yí gè dà dà de dàn gāo 。 zhuō zi shàng yǐ jīng fàng zhe shuǐ guǒ 、 miàn bāo 、 guǒ zhī shén me de 。 xiǎo méi de mèi mèi yòng huà bǐ huà le yī zhāng kǎ piàn ， shàng miàn yǒu yī zhī xiǎo xiǎo de māo ， hái yǒu yī duǒ hóng hóng de huā 。 péng yǒu men dào le yǐ hòu ， dà jiā qīng qīng dì guān shàng mén ， děng xiǎo méi huí lái 。 qī diǎn bàn ， xiǎo méi yī jìn mén ， jiù kàn jiàn dà jiā zhàn zài yì qǐ chàng shēng rì gē 。 tā gāo gāo xìng xìng dì shuō ： “ nǐ men dōu lái le ， wǒ zhēn méi xiǎng dào ！ ” chī wán dàn gāo ， tā men yì qǐ kàn le yǐ qián de zhào piān 。 wǎn shàng yé yé yě dǎ lái diàn huà ， suī rán méi néng dào jiā lǐ ， dàn shì zài diàn huà lǐ gěi tā chàng le shēng rì gē 。"}, {"id": "H2-R06-5", "lesson": 6, "title": "给朋友一个生日惊喜 · 小明", "text": "小雪的生日是星期五。为了给他准备一个小晚会，小明早早地来到他家，手里拿着一个大大的蛋糕。桌子上已经放着水果、面包、果汁什么的。小雪的妹妹用画笔画了一张卡片，上面有一只小小的猫，还有一朵红红的花。朋友们到了以后，大家轻轻地关上门，等小雪回来。八点半，小雪一进门，就看见大家站在一起唱生日歌。他高高兴兴地说：“你们都来了，我真没想到！”吃完蛋糕，他们一起看了以前的照片。妹妹觉得蛋糕太大，吃不完，就请大家分成小份，第二天带给其他同学。", "translation": "Sinh nhật 小雪 là thứ Sáu. 小明 đến sớm mang bánh thật to. Trên bàn có trái cây, bánh mì, nước quả và các thứ tương tự. Em gái 小雪 vẽ thiệp với mèo nhỏ và hoa đỏ. Các bạn khẽ đóng cửa chờ. Lúc tám giờ rưỡi, 小雪 vào và thấy mọi người hát chúc mừng nên rất vui, không ngờ tất cả đều đến. Ăn bánh xong họ xem ảnh cũ. Em gái thấy bánh to ăn không hết nên nhờ chia phần nhỏ, hôm sau mang cho các bạn khác.", "grammar": ["Lặp tính từ", "什么的", "地"], "questions": [{"question": "谁过生日？", "answer": "小雪", "options": ["小雪", "小明", "老师", "爸爸"], "explanation": "Câu mở đầu xác định sinh nhật B.", "id": "H2-R06-5-Q1"}, {"question": "小明带来了什么？", "answer": "一个蛋糕", "options": ["一个蛋糕", "一台电脑", "一双鞋", "一张地图"], "explanation": "A cầm 一个大大的蛋糕.", "id": "H2-R06-5-Q2"}, {"question": "卡片上画着什么？", "answer": "一只猫和一朵花", "options": ["一只猫和一朵花", "一条鱼和一只鸟", "一座山和一条河", "一辆车和一条路"], "explanation": "Thiệp có mèo nhỏ và bông hoa đỏ.", "id": "H2-R06-5-Q3"}, {"id": "H2-R06-5-Q4", "question": "他们打算把剩下的蛋糕带给谁？", "answer": "其他同学", "options": ["其他同学", "药店医生", "机场旅客", "商场经理"], "explanation": "Phần bánh còn lại được dành cho các bạn khác."}, {"question": "“轻轻地关上门”中的“地”连接什么？", "answer": "动作的方式和动作", "options": ["动作的方式和动作", "人和人", "数字和量词", "地点和距离"], "explanation": "轻轻地 là trạng ngữ chỉ cách đóng cửa.", "id": "H2-R06-5-Q5"}, {"question": "“水果、面包、果汁什么的”说明什么？", "answer": "还有同类的东西没一一说完", "options": ["还有同类的东西没一一说完", "不知道水果是什么", "只有果汁", "都是假的"], "explanation": "什么的 sau danh sách cho biết còn đồ tương tự.", "id": "H2-R06-5-Q6"}], "pinyin": "xiǎo xuě de shēng rì shì xīng qī wǔ 。 wèi le gěi tā zhǔn bèi yí gè xiǎo wǎn huì ， xiǎo míng zǎo zǎo dì lái dào tā jiā ， shǒu lǐ ná zhe yí gè dà dà de dàn gāo 。 zhuō zi shàng yǐ jīng fàng zhe shuǐ guǒ 、 miàn bāo 、 guǒ zhī shén me de 。 xiǎo xuě de mèi mèi yòng huà bǐ huà le yī zhāng kǎ piàn ， shàng miàn yǒu yī zhī xiǎo xiǎo de māo ， hái yǒu yī duǒ hóng hóng de huā 。 péng yǒu men dào le yǐ hòu ， dà jiā qīng qīng dì guān shàng mén ， děng xiǎo xuě huí lái 。 bā diǎn bàn ， xiǎo xuě yī jìn mén ， jiù kàn jiàn dà jiā zhàn zài yì qǐ chàng shēng rì gē 。 tā gāo gāo xìng xìng dì shuō ： “ nǐ men dōu lái le ， wǒ zhēn méi xiǎng dào ！ ” chī wán dàn gāo ， tā men yì qǐ kàn le yǐ qián de zhào piān 。 mèi mèi jué de dàn gāo tài dà ， chī bù wán ， jiù qǐng dà jiā fēn chéng xiǎo fèn ， dì èr tiān dài gěi qí tā tóng xué 。"}, {"id": "H2-R07-1", "lesson": 7, "title": "下课后练球 · 小林", "text": "小林一到星期六，就和小雨去学校打篮球。今天他们八点到球场，先跑了十分钟，再练习投球。小林跑得很快，但是篮球打得没有小雨好。小雨说：“你不要急，我们先练最简单的。”小林听得很认真，每投完一次球，都想一想哪里可以做得更好。练了一个小时以后，他终于连续投进了几个球，开心地笑了。两个人在路边的小店买了水，坐下来休息。小林说：“我一有时间就来练，希望下个月能参加学校的比赛。”下个月比赛时，他没有得第一名，但是比以前投得准多了，老师也表扬了他。", "translation": "Cứ đến thứ Bảy, 小林 đi đánh bóng rổ với 小雨. Hôm nay họ đến lúc tám giờ, chạy mười phút rồi tập ném. 小林 chạy nhanh nhưng chơi chưa bằng 小雨. Bạn khuyên tập từ điều đơn giản nhất. 小林 nghe chăm chú, mỗi lần ném đều suy nghĩ cách làm tốt hơn. Sau một giờ cậu ném vào liên tiếp vài quả và rất vui. Họ mua nước ngồi nghỉ. 小林 muốn rảnh là tập để tháng sau thi đấu. Khi thi đấu tháng sau cậu không đứng nhất nhưng ném chính xác hơn trước nhiều và được thầy khen.", "grammar": ["一……就……", "V + 得 + tính từ", "V + O + V + 得"], "questions": [{"question": "他们练习什么运动？", "answer": "篮球", "options": ["篮球", "排球", "网球", "游泳"], "explanation": "Câu đầu xác định 打篮球.", "id": "H2-R07-1-Q1"}, {"question": "开始练球以前，他们做了什么？", "answer": "跑了十分钟", "options": ["跑了十分钟", "睡了半小时", "看了电影", "吃了晚饭"], "explanation": "先跑了十分钟，再练习投球.", "id": "H2-R07-1-Q2"}, {"question": "谁篮球打得更好？", "answer": "小雨", "options": ["小雨", "小林", "两个人都不会", "老板"], "explanation": "A nói chơi không bằng B.", "id": "H2-R07-1-Q3"}, {"id": "H2-R07-1-Q4", "question": "他比赛时有什么进步？", "answer": "投得更准了", "options": ["投得更准了", "从来不练球了", "跑得更慢了", "不会投球了"], "explanation": "Tiến bộ được nêu là ném chính xác hơn trước."}, {"question": "“一有时间就来练”是什么意思？", "answer": "有时间马上来练习", "options": ["有时间马上来练习", "只练习一次", "从来不练习", "练习后才有时间"], "explanation": "一……就…… nối điều kiện và hành động xảy ra ngay.", "id": "H2-R07-1-Q5"}, {"question": "“跑得很快”中的“得”有什么作用？", "answer": "连接动作和对动作的评价", "options": ["连接动作和对动作的评价", "表示所属", "表示动作方式在前", "表示曾经跑过"], "explanation": "V + 得 + tính từ là bổ ngữ trạng thái.", "id": "H2-R07-1-Q6"}], "pinyin": "xiǎo lín yī dào xīng qī liù ， jiù hé xiǎo yǔ qù xué xiào dǎ lán qiú 。 jīn tiān tā men bā diǎn dào qiú chǎng ， xiān pǎo le shí fēn zhōng ， zài liàn xí tóu qiú 。 xiǎo lín pǎo de hěn kuài ， dàn shì lán qiú dǎ de méi yǒu xiǎo yǔ hǎo 。 xiǎo yǔ shuō ： “ nǐ bú yào jí ， wǒ men xiān liàn zuì jiǎn dān de 。 ” xiǎo lín tīng de hěn rèn zhēn ， měi tóu wán yī cì qiú ， dōu xiǎng yī xiǎng nǎ lǐ kě yǐ zuò de gèng hǎo 。 liàn le yí gè xiǎo shí yǐ hòu ， tā zhōng yú lián xù tóu jìn le jǐ gè qiú ， kāi xīn dì xiào le 。 liǎng gè rén zài lù biān de xiǎo diàn mǎi le shuǐ ， zuò xià lái xiū xī 。 xiǎo lín shuō ： “ wǒ yī yǒu shí jiān jiù lái liàn ， xī wàng xià gè yuè néng cān jiā xué xiào de bǐ sài 。 ” xià gè yuè bǐ sài shí ， tā méi yǒu de dì yì míng ， dàn shì bǐ yǐ qián tóu de zhǔn duō le ， lǎo shī yě biǎo yáng le tā 。"}, {"id": "H2-R07-2", "lesson": 7, "title": "下课后练球 · 小安", "text": "小安一到星期日，就和小月去学校打篮球。今天他们九点到球场，先跑了十分钟，再练习投球。小安跑得很快，但是篮球打得没有小月好。小月说：“你不要急，我们先练最简单的。”小安听得很认真，每投完一次球，都想一想哪里可以做得更好。练了一个小时以后，他终于连续投进了几个球，开心地笑了。两个人在路边的小店买了水，坐下来休息。小安说：“我一有时间就来练，希望下个月能参加学校的比赛。”回去时他们碰见了班长，班长请他们下周教新同学最简单的动作。", "translation": "Cứ đến Chủ nhật, 小安 đi đánh bóng rổ với 小月. Hôm nay họ đến lúc chín giờ, chạy mười phút rồi tập ném. 小安 chạy nhanh nhưng chơi chưa bằng 小月. Bạn khuyên tập từ điều đơn giản nhất. 小安 nghe chăm chú, mỗi lần ném đều suy nghĩ cách làm tốt hơn. Sau một giờ cậu ném vào liên tiếp vài quả và rất vui. Họ mua nước ngồi nghỉ. 小安 muốn rảnh là tập để tháng sau thi đấu. Trên đường về họ gặp lớp trưởng, được nhờ tuần sau dạy bạn mới những động tác đơn giản nhất.", "grammar": ["一……就……", "V + 得 + tính từ", "V + O + V + 得"], "questions": [{"question": "他们练习什么运动？", "answer": "篮球", "options": ["篮球", "排球", "网球", "游泳"], "explanation": "Câu đầu xác định 打篮球.", "id": "H2-R07-2-Q1"}, {"question": "开始练球以前，他们做了什么？", "answer": "跑了十分钟", "options": ["跑了十分钟", "睡了半小时", "看了电影", "吃了晚饭"], "explanation": "先跑了十分钟，再练习投球.", "id": "H2-R07-2-Q2"}, {"question": "谁篮球打得更好？", "answer": "小月", "options": ["小月", "小安", "两个人都不会", "老板"], "explanation": "A nói chơi không bằng B.", "id": "H2-R07-2-Q3"}, {"id": "H2-R07-2-Q4", "question": "班长请他们下周做什么？", "answer": "教新同学", "options": ["教新同学", "去买药", "换一家公司", "坐飞机旅行"], "explanation": "Lớp trưởng nhờ họ dạy người mới."}, {"question": "“一有时间就来练”是什么意思？", "answer": "有时间马上来练习", "options": ["有时间马上来练习", "只练习一次", "从来不练习", "练习后才有时间"], "explanation": "一……就…… nối điều kiện và hành động xảy ra ngay.", "id": "H2-R07-2-Q5"}, {"question": "“跑得很快”中的“得”有什么作用？", "answer": "连接动作和对动作的评价", "options": ["连接动作和对动作的评价", "表示所属", "表示动作方式在前", "表示曾经跑过"], "explanation": "V + 得 + tính từ là bổ ngữ trạng thái.", "id": "H2-R07-2-Q6"}], "pinyin": "xiǎo ān yī dào xīng qī rì ， jiù hé xiǎo yuè qù xué xiào dǎ lán qiú 。 jīn tiān tā men jiǔ diǎn dào qiú chǎng ， xiān pǎo le shí fēn zhōng ， zài liàn xí tóu qiú 。 xiǎo ān pǎo de hěn kuài ， dàn shì lán qiú dǎ de méi yǒu xiǎo yuè hǎo 。 xiǎo yuè shuō ： “ nǐ bú yào jí ， wǒ men xiān liàn zuì jiǎn dān de 。 ” xiǎo ān tīng de hěn rèn zhēn ， měi tóu wán yī cì qiú ， dōu xiǎng yī xiǎng nǎ lǐ kě yǐ zuò de gèng hǎo 。 liàn le yí gè xiǎo shí yǐ hòu ， tā zhōng yú lián xù tóu jìn le jǐ gè qiú ， kāi xīn dì xiào le 。 liǎng gè rén zài lù biān de xiǎo diàn mǎi le shuǐ ， zuò xià lái xiū xī 。 xiǎo ān shuō ： “ wǒ yī yǒu shí jiān jiù lái liàn ， xī wàng xià gè yuè néng cān jiā xué xiào de bǐ sài 。 ” huí qù shí tā men pèng jiàn le bān zhǎng ， bān zhǎng qǐng tā men xià zhōu jiào xīn tóng xué zuì jiǎn dān de dòng zuò 。"}, {"id": "H2-R07-3", "lesson": 7, "title": "下课后练球 · 小文", "text": "小文一到星期一，就和小兰去学校打篮球。今天他们十点到球场，先跑了十分钟，再练习投球。小文跑得很快，但是篮球打得没有小兰好。小兰说：“你不要急，我们先练最简单的。”小文听得很认真，每投完一次球，都想一想哪里可以做得更好。练了一个小时以后，他终于连续投进了几个球，开心地笑了。两个人在路边的小店买了水，坐下来休息。小文说：“我一有时间就来练，希望下个月能参加学校的比赛。”今天练完以后，脚有点儿疼，他决定明天先休息，不要练得太久。", "translation": "Cứ đến thứ Hai, 小文 đi đánh bóng rổ với 小兰. Hôm nay họ đến lúc mười giờ, chạy mười phút rồi tập ném. 小文 chạy nhanh nhưng chơi chưa bằng 小兰. Bạn khuyên tập từ điều đơn giản nhất. 小文 nghe chăm chú, mỗi lần ném đều suy nghĩ cách làm tốt hơn. Sau một giờ cậu ném vào liên tiếp vài quả và rất vui. Họ mua nước ngồi nghỉ. 小文 muốn rảnh là tập để tháng sau thi đấu. Tập xong hôm nay chân hơi đau, cậu quyết định mai nghỉ trước và không tập quá lâu.", "grammar": ["一……就……", "V + 得 + tính từ", "V + O + V + 得"], "questions": [{"question": "他们练习什么运动？", "answer": "篮球", "options": ["篮球", "排球", "网球", "游泳"], "explanation": "Câu đầu xác định 打篮球.", "id": "H2-R07-3-Q1"}, {"question": "开始练球以前，他们做了什么？", "answer": "跑了十分钟", "options": ["跑了十分钟", "睡了半小时", "看了电影", "吃了晚饭"], "explanation": "先跑了十分钟，再练习投球.", "id": "H2-R07-3-Q2"}, {"question": "谁篮球打得更好？", "answer": "小兰", "options": ["小兰", "小文", "两个人都不会", "老板"], "explanation": "A nói chơi không bằng B.", "id": "H2-R07-3-Q3"}, {"id": "H2-R07-3-Q4", "question": "他为什么决定明天休息？", "answer": "脚有点儿疼", "options": ["脚有点儿疼", "球场太近", "水太便宜", "不想见朋友"], "explanation": "Cậu nghỉ vì chân hơi đau."}, {"question": "“一有时间就来练”是什么意思？", "answer": "有时间马上来练习", "options": ["有时间马上来练习", "只练习一次", "从来不练习", "练习后才有时间"], "explanation": "一……就…… nối điều kiện và hành động xảy ra ngay.", "id": "H2-R07-3-Q5"}, {"question": "“跑得很快”中的“得”有什么作用？", "answer": "连接动作和对动作的评价", "options": ["连接动作和对动作的评价", "表示所属", "表示动作方式在前", "表示曾经跑过"], "explanation": "V + 得 + tính từ là bổ ngữ trạng thái.", "id": "H2-R07-3-Q6"}], "pinyin": "xiǎo wén yī dào xīng qī yī ， jiù hé xiǎo lán qù xué xiào dǎ lán qiú 。 jīn tiān tā men shí diǎn dào qiú chǎng ， xiān pǎo le shí fēn zhōng ， zài liàn xí tóu qiú 。 xiǎo wén pǎo de hěn kuài ， dàn shì lán qiú dǎ de méi yǒu xiǎo lán hǎo 。 xiǎo lán shuō ： “ nǐ bú yào jí ， wǒ men xiān liàn zuì jiǎn dān de 。 ” xiǎo wén tīng de hěn rèn zhēn ， měi tóu wán yī cì qiú ， dōu xiǎng yī xiǎng nǎ lǐ kě yǐ zuò de gèng hǎo 。 liàn le yí gè xiǎo shí yǐ hòu ， tā zhōng yú lián xù tóu jìn le jǐ gè qiú ， kāi xīn dì xiào le 。 liǎng gè rén zài lù biān de xiǎo diàn mǎi le shuǐ ， zuò xià lái xiū xī 。 xiǎo wén shuō ： “ wǒ yī yǒu shí jiān jiù lái liàn ， xī wàng xià gè yuè néng cān jiā xué xiào de bǐ sài 。 ” jīn tiān liàn wán yǐ hòu ， jiǎo yǒu diǎn ér téng ， tā jué dìng míng tiān xiān xiū xī ， bú yào liàn de tài jiǔ 。"}, {"id": "H2-R07-4", "lesson": 7, "title": "下课后练球 · 小东", "text": "小东一到星期三，就和小梅去学校打篮球。今天他们七点半到球场，先跑了十分钟，再练习投球。小东跑得很快，但是篮球打得没有小梅好。小梅说：“你不要急，我们先练最简单的。”小东听得很认真，每投完一次球，都想一想哪里可以做得更好。练了一个小时以后，他终于连续投进了几个球，开心地笑了。两个人在路边的小店买了水，坐下来休息。小东说：“我一有时间就来练，希望下个月能参加学校的比赛。”他们把练习的时间记在本子上，想过一个月看看自己能进步多少。", "translation": "Cứ đến thứ Tư, 小东 đi đánh bóng rổ với 小梅. Hôm nay họ đến lúc bảy giờ rưỡi, chạy mười phút rồi tập ném. 小东 chạy nhanh nhưng chơi chưa bằng 小梅. Bạn khuyên tập từ điều đơn giản nhất. 小东 nghe chăm chú, mỗi lần ném đều suy nghĩ cách làm tốt hơn. Sau một giờ cậu ném vào liên tiếp vài quả và rất vui. Họ mua nước ngồi nghỉ. 小东 muốn rảnh là tập để tháng sau thi đấu. Họ ghi thời gian tập vào sổ để sau một tháng xem mình tiến bộ bao nhiêu.", "grammar": ["一……就……", "V + 得 + tính từ", "V + O + V + 得"], "questions": [{"question": "他们练习什么运动？", "answer": "篮球", "options": ["篮球", "排球", "网球", "游泳"], "explanation": "Câu đầu xác định 打篮球.", "id": "H2-R07-4-Q1"}, {"question": "开始练球以前，他们做了什么？", "answer": "跑了十分钟", "options": ["跑了十分钟", "睡了半小时", "看了电影", "吃了晚饭"], "explanation": "先跑了十分钟，再练习投球.", "id": "H2-R07-4-Q2"}, {"question": "谁篮球打得更好？", "answer": "小梅", "options": ["小梅", "小东", "两个人都不会", "老板"], "explanation": "A nói chơi không bằng B.", "id": "H2-R07-4-Q3"}, {"id": "H2-R07-4-Q4", "question": "为什么要记录练习时间？", "answer": "以后看看进步多少", "options": ["以后看看进步多少", "给商店算钱", "告诉司机路线", "准备买房子"], "explanation": "Ghi lại để theo dõi mức tiến bộ sau một tháng."}, {"question": "“一有时间就来练”是什么意思？", "answer": "有时间马上来练习", "options": ["有时间马上来练习", "只练习一次", "从来不练习", "练习后才有时间"], "explanation": "一……就…… nối điều kiện và hành động xảy ra ngay.", "id": "H2-R07-4-Q5"}, {"question": "“跑得很快”中的“得”有什么作用？", "answer": "连接动作和对动作的评价", "options": ["连接动作和对动作的评价", "表示所属", "表示动作方式在前", "表示曾经跑过"], "explanation": "V + 得 + tính từ là bổ ngữ trạng thái.", "id": "H2-R07-4-Q6"}], "pinyin": "xiǎo dōng yī dào xīng qī sān ， jiù hé xiǎo méi qù xué xiào dǎ lán qiú 。 jīn tiān tā men qī diǎn bàn dào qiú chǎng ， xiān pǎo le shí fēn zhōng ， zài liàn xí tóu qiú 。 xiǎo dōng pǎo de hěn kuài ， dàn shì lán qiú dǎ de méi yǒu xiǎo méi hǎo 。 xiǎo méi shuō ： “ nǐ bú yào jí ， wǒ men xiān liàn zuì jiǎn dān de 。 ” xiǎo dōng tīng de hěn rèn zhēn ， měi tóu wán yī cì qiú ， dōu xiǎng yī xiǎng nǎ lǐ kě yǐ zuò de gèng hǎo 。 liàn le yí gè xiǎo shí yǐ hòu ， tā zhōng yú lián xù tóu jìn le jǐ gè qiú ， kāi xīn dì xiào le 。 liǎng gè rén zài lù biān de xiǎo diàn mǎi le shuǐ ， zuò xià lái xiū xī 。 xiǎo dōng shuō ： “ wǒ yī yǒu shí jiān jiù lái liàn ， xī wàng xià gè yuè néng cān jiā xué xiào de bǐ sài 。 ” tā men bǎ liàn xí de shí jiān jì zài běn zi shàng ， xiǎng guò yí gè yuè kàn kàn zì jǐ néng jìn bù duō shǎo 。"}, {"id": "H2-R07-5", "lesson": 7, "title": "下课后练球 · 小明", "text": "小明一到星期五，就和小雪去学校打篮球。今天他们八点半到球场，先跑了十分钟，再练习投球。小明跑得很快，但是篮球打得没有小雪好。小雪说：“你不要急，我们先练最简单的。”小明听得很认真，每投完一次球，都想一想哪里可以做得更好。练了一个小时以后，他终于连续投进了几个球，开心地笑了。两个人在路边的小店买了水，坐下来休息。小明说：“我一有时间就来练，希望下个月能参加学校的比赛。”小朋友看见他们打球，也想参加。他们就把最后十分钟用来教孩子们传球。", "translation": "Cứ đến thứ Sáu, 小明 đi đánh bóng rổ với 小雪. Hôm nay họ đến lúc tám giờ rưỡi, chạy mười phút rồi tập ném. 小明 chạy nhanh nhưng chơi chưa bằng 小雪. Bạn khuyên tập từ điều đơn giản nhất. 小明 nghe chăm chú, mỗi lần ném đều suy nghĩ cách làm tốt hơn. Sau một giờ cậu ném vào liên tiếp vài quả và rất vui. Họ mua nước ngồi nghỉ. 小明 muốn rảnh là tập để tháng sau thi đấu. Các em nhỏ nhìn họ chơi cũng muốn tham gia nên họ dành mười phút cuối dạy chuyền bóng.", "grammar": ["一……就……", "V + 得 + tính từ", "V + O + V + 得"], "questions": [{"question": "他们练习什么运动？", "answer": "篮球", "options": ["篮球", "排球", "网球", "游泳"], "explanation": "Câu đầu xác định 打篮球.", "id": "H2-R07-5-Q1"}, {"question": "开始练球以前，他们做了什么？", "answer": "跑了十分钟", "options": ["跑了十分钟", "睡了半小时", "看了电影", "吃了晚饭"], "explanation": "先跑了十分钟，再练习投球.", "id": "H2-R07-5-Q2"}, {"question": "谁篮球打得更好？", "answer": "小雪", "options": ["小雪", "小明", "两个人都不会", "老板"], "explanation": "A nói chơi không bằng B.", "id": "H2-R07-5-Q3"}, {"id": "H2-R07-5-Q4", "question": "最后十分钟，他们教孩子们做什么？", "answer": "传球", "options": ["传球", "做饭", "写信", "开车"], "explanation": "Hoạt động cuối là dạy chuyền bóng."}, {"question": "“一有时间就来练”是什么意思？", "answer": "有时间马上来练习", "options": ["有时间马上来练习", "只练习一次", "从来不练习", "练习后才有时间"], "explanation": "一……就…… nối điều kiện và hành động xảy ra ngay.", "id": "H2-R07-5-Q5"}, {"question": "“跑得很快”中的“得”有什么作用？", "answer": "连接动作和对动作的评价", "options": ["连接动作和对动作的评价", "表示所属", "表示动作方式在前", "表示曾经跑过"], "explanation": "V + 得 + tính từ là bổ ngữ trạng thái.", "id": "H2-R07-5-Q6"}], "pinyin": "xiǎo míng yī dào xīng qī wǔ ， jiù hé xiǎo xuě qù xué xiào dǎ lán qiú 。 jīn tiān tā men bā diǎn bàn dào qiú chǎng ， xiān pǎo le shí fēn zhōng ， zài liàn xí tóu qiú 。 xiǎo míng pǎo de hěn kuài ， dàn shì lán qiú dǎ de méi yǒu xiǎo xuě hǎo 。 xiǎo xuě shuō ： “ nǐ bú yào jí ， wǒ men xiān liàn zuì jiǎn dān de 。 ” xiǎo míng tīng de hěn rèn zhēn ， měi tóu wán yī cì qiú ， dōu xiǎng yī xiǎng nǎ lǐ kě yǐ zuò de gèng hǎo 。 liàn le yí gè xiǎo shí yǐ hòu ， tā zhōng yú lián xù tóu jìn le jǐ gè qiú ， kāi xīn dì xiào le 。 liǎng gè rén zài lù biān de xiǎo diàn mǎi le shuǐ ， zuò xià lái xiū xī 。 xiǎo míng shuō ： “ wǒ yī yǒu shí jiān jiù lái liàn ， xī wàng xià gè yuè néng cān jiā xué xiào de bǐ sài 。 ” xiǎo péng yǒu kàn jiàn tā men dǎ qiú ， yě xiǎng cān jiā 。 tā men jiù bǎ zuì hòu shí fēn zhōng yòng lái jiào hái zi men chuán qiú 。"}, {"id": "H2-R08-1", "lesson": 8, "title": "选一本适合自己的书 · 小林", "text": "星期六，小林和小雨去书店买中文书。左边那本书有很多图片，右边那本没有图片，但是故事更长。小林觉得左边的比右边的容易，想先买左边的。小雨虽然学中文的时间不长，但是很喜欢长一点儿的故事，所以买了右边的。两个人还比较了价格：左边的二十块，右边的贵十块。回家以后，他们每天读十分钟，再用中文说说故事里的事情。小林觉得，只要每天看一点儿，读书就不会太难，也会越来越有意思。第二天他们交换着看，才发现两本书各有好处，也都适合练习中文。", "translation": "thứ Bảy, 小林 và 小雨 mua sách tiếng Trung. Quyển trái nhiều hình, quyển phải không có hình nhưng truyện dài hơn. 小林 chọn trái vì dễ hơn. Tuy học chưa lâu, 小雨 thích truyện dài nên chọn phải. Quyển trái giá hai mươi tệ, quyển phải đắt hơn mười tệ. Về nhà họ đọc mỗi ngày mười phút rồi kể lại bằng tiếng Trung. 小林 thấy đọc ít mỗi ngày sẽ bớt khó và càng thú vị. Hôm sau họ đổi sách cho nhau đọc và phát hiện mỗi quyển có cái hay, đều hợp luyện tiếng Trung.", "grammar": ["比", "更", "虽然……但是……"], "questions": [{"question": "哪本书有很多图片？", "answer": "左边的", "options": ["左边的", "右边的", "两本都没有", "文中没说"], "explanation": "Văn bản nêu 左边那本书有很多图片.", "id": "H2-R08-1-Q1"}, {"question": "小林买了哪本？", "answer": "左边的", "options": ["左边的", "右边的", "两本都买了", "一本也没买"], "explanation": "A chọn quyển trái vì dễ hơn.", "id": "H2-R08-1-Q2"}, {"question": "小雨为什么买右边的？", "answer": "喜欢长一点儿的故事", "options": ["喜欢长一点儿的故事", "图片特别多", "价格更便宜", "老师要求买"], "explanation": "B thích truyện dài dù học chưa lâu.", "id": "H2-R08-1-Q3"}, {"id": "H2-R08-1-Q4", "question": "交换看书以后，他们有什么发现？", "answer": "两本书各有好处", "options": ["两本书各有好处", "两本都不能读", "故事完全一样", "两本都没有图片"], "explanation": "Khi đổi sách họ thấy mỗi quyển có ưu điểm."}, {"question": "“虽然……但是……”在文中表示什么关系？", "answer": "转折关系", "options": ["转折关系", "先后顺序", "只有原因", "只有选择"], "explanation": "虽然 học chưa lâu, 但是 thích truyện dài: hai ý tương phản.", "id": "H2-R08-1-Q5"}, {"question": "“左边的比右边的容易”比较的是哪方面？", "answer": "难易程度", "options": ["难易程度", "颜色", "重量", "出版时间"], "explanation": "Tính từ 容易 cho biết so sánh độ dễ.", "id": "H2-R08-1-Q6"}], "pinyin": "xīng qī liù ， xiǎo lín hé xiǎo yǔ qù shū diàn mǎi zhōng wén shū 。 zuǒ biān nà běn shū yǒu hěn duō tú piàn ， yòu biān nà běn méi yǒu tú piàn ， dàn shì gù shì gèng zhǎng 。 xiǎo lín jué de zuǒ biān de bǐ yòu biān de róng yì ， xiǎng xiān mǎi zuǒ biān de 。 xiǎo yǔ suī rán xué zhōng wén de shí jiān bù zhǎng ， dàn shì hěn xǐ huān zhǎng yì diǎn ér de gù shì ， suǒ yǐ mǎi le yòu biān de 。 liǎng gè rén hái bǐ jiào le jià gé ： zuǒ biān de èr shí kuài ， yòu biān de guì shí kuài 。 huí jiā yǐ hòu ， tā men měi tiān dú shí fēn zhōng ， zài yòng zhōng wén shuō shuō gù shì lǐ de shì qíng 。 xiǎo lín jué de ， zhǐ yào měi tiān kàn yì diǎn ér ， dú shū jiù bú huì tài nán ， yě huì yuè lái yuè yǒu yì si 。 dì èr tiān tā men jiāo huàn zhe kàn ， cái fā xiàn liǎng běn shū gè yǒu hǎo chù ， yě dōu shì hé liàn xí zhōng wén 。"}, {"id": "H2-R08-2", "lesson": 8, "title": "选一本适合自己的书 · 小安", "text": "星期日，小安和小月去书店买中文书。左边那本书有很多图片，右边那本没有图片，但是故事更长。小安觉得左边的比右边的容易，想先买左边的。小月虽然学中文的时间不长，但是很喜欢长一点儿的故事，所以买了右边的。两个人还比较了价格：左边的三十块，右边的贵十块。回家以后，他们每天读十分钟，再用中文说说故事里的事情。小安觉得，只要每天看一点儿，读书就不会太难，也会越来越有意思。书里有一道题太难，他们先自己想，再请老师帮忙，最后都弄懂了。", "translation": "Chủ nhật, 小安 và 小月 mua sách tiếng Trung. Quyển trái nhiều hình, quyển phải không có hình nhưng truyện dài hơn. 小安 chọn trái vì dễ hơn. Tuy học chưa lâu, 小月 thích truyện dài nên chọn phải. Quyển trái giá ba mươi tệ, quyển phải đắt hơn mười tệ. Về nhà họ đọc mỗi ngày mười phút rồi kể lại bằng tiếng Trung. 小安 thấy đọc ít mỗi ngày sẽ bớt khó và càng thú vị. Trong sách có bài khó, họ tự nghĩ rồi nhờ thầy giúp, cuối cùng đều hiểu.", "grammar": ["比", "更", "虽然……但是……"], "questions": [{"question": "哪本书有很多图片？", "answer": "左边的", "options": ["左边的", "右边的", "两本都没有", "文中没说"], "explanation": "Văn bản nêu 左边那本书有很多图片.", "id": "H2-R08-2-Q1"}, {"question": "小安买了哪本？", "answer": "左边的", "options": ["左边的", "右边的", "两本都买了", "一本也没买"], "explanation": "A chọn quyển trái vì dễ hơn.", "id": "H2-R08-2-Q2"}, {"question": "小月为什么买右边的？", "answer": "喜欢长一点儿的故事", "options": ["喜欢长一点儿的故事", "图片特别多", "价格更便宜", "老师要求买"], "explanation": "B thích truyện dài dù học chưa lâu.", "id": "H2-R08-2-Q3"}, {"id": "H2-R08-2-Q4", "question": "遇到难题后，他们请谁帮忙？", "answer": "老师", "options": ["老师", "司机", "医生", "银行经理"], "explanation": "Sau khi tự suy nghĩ, họ nhờ thầy giúp."}, {"question": "“虽然……但是……”在文中表示什么关系？", "answer": "转折关系", "options": ["转折关系", "先后顺序", "只有原因", "只有选择"], "explanation": "虽然 học chưa lâu, 但是 thích truyện dài: hai ý tương phản.", "id": "H2-R08-2-Q5"}, {"question": "“左边的比右边的容易”比较的是哪方面？", "answer": "难易程度", "options": ["难易程度", "颜色", "重量", "出版时间"], "explanation": "Tính từ 容易 cho biết so sánh độ dễ.", "id": "H2-R08-2-Q6"}], "pinyin": "xīng qī rì ， xiǎo ān hé xiǎo yuè qù shū diàn mǎi zhōng wén shū 。 zuǒ biān nà běn shū yǒu hěn duō tú piàn ， yòu biān nà běn méi yǒu tú piàn ， dàn shì gù shì gèng zhǎng 。 xiǎo ān jué de zuǒ biān de bǐ yòu biān de róng yì ， xiǎng xiān mǎi zuǒ biān de 。 xiǎo yuè suī rán xué zhōng wén de shí jiān bù zhǎng ， dàn shì hěn xǐ huān zhǎng yì diǎn ér de gù shì ， suǒ yǐ mǎi le yòu biān de 。 liǎng gè rén hái bǐ jiào le jià gé ： zuǒ biān de sān shí kuài ， yòu biān de guì shí kuài 。 huí jiā yǐ hòu ， tā men měi tiān dú shí fēn zhōng ， zài yòng zhōng wén shuō shuō gù shì lǐ de shì qíng 。 xiǎo ān jué de ， zhǐ yào měi tiān kàn yì diǎn ér ， dú shū jiù bú huì tài nán ， yě huì yuè lái yuè yǒu yì si 。 shū lǐ yǒu yī dào tí tài nán ， tā men xiān zì jǐ xiǎng ， zài qǐng lǎo shī bāng máng ， zuì hòu dōu nòng dǒng le 。"}, {"id": "H2-R08-3", "lesson": 8, "title": "选一本适合自己的书 · 小文", "text": "星期一，小文和小兰去书店买中文书。左边那本书有很多图片，右边那本没有图片，但是故事更长。小文觉得左边的比右边的容易，想先买左边的。小兰虽然学中文的时间不长，但是很喜欢长一点儿的故事，所以买了右边的。两个人还比较了价格：左边的四十块，右边的贵十块。回家以后，他们每天读十分钟，再用中文说说故事里的事情。小文觉得，只要每天看一点儿，读书就不会太难，也会越来越有意思。后来他把一个故事讲给妹妹听，妹妹虽然不认识汉字，但是也听得很开心。", "translation": "thứ Hai, 小文 và 小兰 mua sách tiếng Trung. Quyển trái nhiều hình, quyển phải không có hình nhưng truyện dài hơn. 小文 chọn trái vì dễ hơn. Tuy học chưa lâu, 小兰 thích truyện dài nên chọn phải. Quyển trái giá bốn mươi tệ, quyển phải đắt hơn mười tệ. Về nhà họ đọc mỗi ngày mười phút rồi kể lại bằng tiếng Trung. 小文 thấy đọc ít mỗi ngày sẽ bớt khó và càng thú vị. Sau đó cậu kể một truyện cho em gái; tuy chưa biết chữ Hán, em vẫn nghe rất vui.", "grammar": ["比", "更", "虽然……但是……"], "questions": [{"question": "哪本书有很多图片？", "answer": "左边的", "options": ["左边的", "右边的", "两本都没有", "文中没说"], "explanation": "Văn bản nêu 左边那本书有很多图片.", "id": "H2-R08-3-Q1"}, {"question": "小文买了哪本？", "answer": "左边的", "options": ["左边的", "右边的", "两本都买了", "一本也没买"], "explanation": "A chọn quyển trái vì dễ hơn.", "id": "H2-R08-3-Q2"}, {"question": "小兰为什么买右边的？", "answer": "喜欢长一点儿的故事", "options": ["喜欢长一点儿的故事", "图片特别多", "价格更便宜", "老师要求买"], "explanation": "B thích truyện dài dù học chưa lâu.", "id": "H2-R08-3-Q3"}, {"id": "H2-R08-3-Q4", "question": "妹妹虽然不认识汉字，听故事时怎么样？", "answer": "很开心", "options": ["很开心", "一直生气", "马上走开", "睡不着三天"], "explanation": "Câu cuối nói em 听得很开心."}, {"question": "“虽然……但是……”在文中表示什么关系？", "answer": "转折关系", "options": ["转折关系", "先后顺序", "只有原因", "只有选择"], "explanation": "虽然 học chưa lâu, 但是 thích truyện dài: hai ý tương phản.", "id": "H2-R08-3-Q5"}, {"question": "“左边的比右边的容易”比较的是哪方面？", "answer": "难易程度", "options": ["难易程度", "颜色", "重量", "出版时间"], "explanation": "Tính từ 容易 cho biết so sánh độ dễ.", "id": "H2-R08-3-Q6"}], "pinyin": "xīng qī yī ， xiǎo wén hé xiǎo lán qù shū diàn mǎi zhōng wén shū 。 zuǒ biān nà běn shū yǒu hěn duō tú piàn ， yòu biān nà běn méi yǒu tú piàn ， dàn shì gù shì gèng zhǎng 。 xiǎo wén jué de zuǒ biān de bǐ yòu biān de róng yì ， xiǎng xiān mǎi zuǒ biān de 。 xiǎo lán suī rán xué zhōng wén de shí jiān bù zhǎng ， dàn shì hěn xǐ huān zhǎng yì diǎn ér de gù shì ， suǒ yǐ mǎi le yòu biān de 。 liǎng gè rén hái bǐ jiào le jià gé ： zuǒ biān de sì shí kuài ， yòu biān de guì shí kuài 。 huí jiā yǐ hòu ， tā men měi tiān dú shí fēn zhōng ， zài yòng zhōng wén shuō shuō gù shì lǐ de shì qíng 。 xiǎo wén jué de ， zhǐ yào měi tiān kàn yì diǎn ér ， dú shū jiù bú huì tài nán ， yě huì yuè lái yuè yǒu yì si 。 hòu lái tā bǎ yí gè gù shì jiǎng gěi mèi mèi tīng ， mèi mèi suī rán bù rèn shí hàn zì ， dàn shì yě tīng de hěn kāi xīn 。"}, {"id": "H2-R08-4", "lesson": 8, "title": "选一本适合自己的书 · 小东", "text": "星期三，小东和小梅去书店买中文书。左边那本书有很多图片，右边那本没有图片，但是故事更长。小东觉得左边的比右边的容易，想先买左边的。小梅虽然学中文的时间不长，但是很喜欢长一点儿的故事，所以买了右边的。两个人还比较了价格：左边的五十块，右边的贵十块。回家以后，他们每天读十分钟，再用中文说说故事里的事情。小东觉得，只要每天看一点儿，读书就不会太难，也会越来越有意思。看完第一本以后，他发现自己能读懂更多句子，就打算再买一本难一点儿的。", "translation": "thứ Tư, 小东 và 小梅 mua sách tiếng Trung. Quyển trái nhiều hình, quyển phải không có hình nhưng truyện dài hơn. 小东 chọn trái vì dễ hơn. Tuy học chưa lâu, 小梅 thích truyện dài nên chọn phải. Quyển trái giá năm mươi tệ, quyển phải đắt hơn mười tệ. Về nhà họ đọc mỗi ngày mười phút rồi kể lại bằng tiếng Trung. 小东 thấy đọc ít mỗi ngày sẽ bớt khó và càng thú vị. Đọc xong quyển đầu cậu nhận ra hiểu được nhiều câu hơn, định mua quyển khó hơn một chút.", "grammar": ["比", "更", "虽然……但是……"], "questions": [{"question": "哪本书有很多图片？", "answer": "左边的", "options": ["左边的", "右边的", "两本都没有", "文中没说"], "explanation": "Văn bản nêu 左边那本书有很多图片.", "id": "H2-R08-4-Q1"}, {"question": "小东买了哪本？", "answer": "左边的", "options": ["左边的", "右边的", "两本都买了", "一本也没买"], "explanation": "A chọn quyển trái vì dễ hơn.", "id": "H2-R08-4-Q2"}, {"question": "小梅为什么买右边的？", "answer": "喜欢长一点儿的故事", "options": ["喜欢长一点儿的故事", "图片特别多", "价格更便宜", "老师要求买"], "explanation": "B thích truyện dài dù học chưa lâu.", "id": "H2-R08-4-Q3"}, {"id": "H2-R08-4-Q4", "question": "他下次想买什么样的书？", "answer": "难一点儿的", "options": ["难一点儿的", "只有英文的", "完全没有字的", "特别旧的"], "explanation": "Cậu muốn tăng độ khó sau khi thấy tiến bộ."}, {"question": "“虽然……但是……”在文中表示什么关系？", "answer": "转折关系", "options": ["转折关系", "先后顺序", "只有原因", "只有选择"], "explanation": "虽然 học chưa lâu, 但是 thích truyện dài: hai ý tương phản.", "id": "H2-R08-4-Q5"}, {"question": "“左边的比右边的容易”比较的是哪方面？", "answer": "难易程度", "options": ["难易程度", "颜色", "重量", "出版时间"], "explanation": "Tính từ 容易 cho biết so sánh độ dễ.", "id": "H2-R08-4-Q6"}], "pinyin": "xīng qī sān ， xiǎo dōng hé xiǎo méi qù shū diàn mǎi zhōng wén shū 。 zuǒ biān nà běn shū yǒu hěn duō tú piàn ， yòu biān nà běn méi yǒu tú piàn ， dàn shì gù shì gèng zhǎng 。 xiǎo dōng jué de zuǒ biān de bǐ yòu biān de róng yì ， xiǎng xiān mǎi zuǒ biān de 。 xiǎo méi suī rán xué zhōng wén de shí jiān bù zhǎng ， dàn shì hěn xǐ huān zhǎng yì diǎn ér de gù shì ， suǒ yǐ mǎi le yòu biān de 。 liǎng gè rén hái bǐ jiào le jià gé ： zuǒ biān de wǔ shí kuài ， yòu biān de guì shí kuài 。 huí jiā yǐ hòu ， tā men měi tiān dú shí fēn zhōng ， zài yòng zhōng wén shuō shuō gù shì lǐ de shì qíng 。 xiǎo dōng jué de ， zhǐ yào měi tiān kàn yì diǎn ér ， dú shū jiù bú huì tài nán ， yě huì yuè lái yuè yǒu yì si 。 kàn wán dì yī běn yǐ hòu ， tā fā xiàn zì jǐ néng dú dǒng gèng duō jù zi ， jiù dǎ suàn zài mǎi yī běn nán yì diǎn ér de 。"}, {"id": "H2-R08-5", "lesson": 8, "title": "选一本适合自己的书 · 小明", "text": "星期五，小明和小雪去书店买中文书。左边那本书有很多图片，右边那本没有图片，但是故事更长。小明觉得左边的比右边的容易，想先买左边的。小雪虽然学中文的时间不长，但是很喜欢长一点儿的故事，所以买了右边的。两个人还比较了价格：左边的六十块，右边的贵十块。回家以后，他们每天读十分钟，再用中文说说故事里的事情。小明觉得，只要每天看一点儿，读书就不会太难，也会越来越有意思。有几句话他们读得不一样，就用词典查读音，再一起读了几遍。", "translation": "thứ Sáu, 小明 và 小雪 mua sách tiếng Trung. Quyển trái nhiều hình, quyển phải không có hình nhưng truyện dài hơn. 小明 chọn trái vì dễ hơn. Tuy học chưa lâu, 小雪 thích truyện dài nên chọn phải. Quyển trái giá sáu mươi tệ, quyển phải đắt hơn mười tệ. Về nhà họ đọc mỗi ngày mười phút rồi kể lại bằng tiếng Trung. 小明 thấy đọc ít mỗi ngày sẽ bớt khó và càng thú vị. Có vài câu họ đọc khác nhau nên tra cách đọc bằng từ điển rồi cùng đọc lại vài lần.", "grammar": ["比", "更", "虽然……但是……"], "questions": [{"question": "哪本书有很多图片？", "answer": "左边的", "options": ["左边的", "右边的", "两本都没有", "文中没说"], "explanation": "Văn bản nêu 左边那本书有很多图片.", "id": "H2-R08-5-Q1"}, {"question": "小明买了哪本？", "answer": "左边的", "options": ["左边的", "右边的", "两本都买了", "一本也没买"], "explanation": "A chọn quyển trái vì dễ hơn.", "id": "H2-R08-5-Q2"}, {"question": "小雪为什么买右边的？", "answer": "喜欢长一点儿的故事", "options": ["喜欢长一点儿的故事", "图片特别多", "价格更便宜", "老师要求买"], "explanation": "B thích truyện dài dù học chưa lâu.", "id": "H2-R08-5-Q3"}, {"id": "H2-R08-5-Q4", "question": "他们用什么查读音？", "answer": "词典", "options": ["词典", "菜单", "银行卡", "车票"], "explanation": "Họ dùng từ điển để kiểm tra phát âm."}, {"question": "“虽然……但是……”在文中表示什么关系？", "answer": "转折关系", "options": ["转折关系", "先后顺序", "只有原因", "只有选择"], "explanation": "虽然 học chưa lâu, 但是 thích truyện dài: hai ý tương phản.", "id": "H2-R08-5-Q5"}, {"question": "“左边的比右边的容易”比较的是哪方面？", "answer": "难易程度", "options": ["难易程度", "颜色", "重量", "出版时间"], "explanation": "Tính từ 容易 cho biết so sánh độ dễ.", "id": "H2-R08-5-Q6"}], "pinyin": "xīng qī wǔ ， xiǎo míng hé xiǎo xuě qù shū diàn mǎi zhōng wén shū 。 zuǒ biān nà běn shū yǒu hěn duō tú piàn ， yòu biān nà běn méi yǒu tú piàn ， dàn shì gù shì gèng zhǎng 。 xiǎo míng jué de zuǒ biān de bǐ yòu biān de róng yì ， xiǎng xiān mǎi zuǒ biān de 。 xiǎo xuě suī rán xué zhōng wén de shí jiān bù zhǎng ， dàn shì hěn xǐ huān zhǎng yì diǎn ér de gù shì ， suǒ yǐ mǎi le yòu biān de 。 liǎng gè rén hái bǐ jiào le jià gé ： zuǒ biān de liù shí kuài ， yòu biān de guì shí kuài 。 huí jiā yǐ hòu ， tā men měi tiān dú shí fēn zhōng ， zài yòng zhōng wén shuō shuō gù shì lǐ de shì qíng 。 xiǎo míng jué de ， zhǐ yào měi tiān kàn yì diǎn ér ， dú shū jiù bú huì tài nán ， yě huì yuè lái yuè yǒu yì si 。 yǒu jǐ jù huà tā men dú de bù yí yàng ， jiù yòng cí diǎn chá dú yīn ， zài yì qǐ dú le jǐ biàn 。"}, {"id": "H2-R09-1", "lesson": 9, "title": "去朋友家复习 · 小林", "text": "星期六下午，小林要去小雨家一起复习。小雨家离学校不远，走路只要十五分钟，但是离小林家有点儿远，所以小林先坐公交车到学校，再走过去。八点见面以后，他们发现两个人买的词典一样大，里面的例子却不一样。小林已经学中文学了一年，小雨学了半年。两个人先复习生词半个小时，再读课文二十分钟。遇到不懂的地方，他们就查词典。虽然今天学得有点儿累，但是两个人都觉得一起学习比一个人学习有意思。回家以后，他把今天不认识的词写下来，第二天带到学校请老师再讲一讲。", "translation": "Chiều thứ Bảy, 小林 đến nhà 小雨 ôn bài. Nhà 小雨 cách trường mười lăm phút đi bộ nhưng xa nhà 小林, nên 小林 đi xe buýt tới trường rồi đi bộ. Gặp lúc tám giờ, họ thấy từ điển to bằng nhau nhưng ví dụ khác nhau. 小林 học tiếng Trung một năm, 小雨 nửa năm. Họ ôn từ nửa giờ, đọc khóa văn hai mươi phút; không hiểu thì tra. Tuy mệt, cả hai thấy học cùng thú vị hơn học một mình. Về nhà cậu ghi các từ hôm nay chưa biết, hôm sau mang đến lớp nhờ thầy giảng thêm.", "grammar": ["跟……一样", "离", "Bổ ngữ thời lượng"], "questions": [{"question": "从学校走到朋友家需要多久？", "answer": "十五分钟", "options": ["十五分钟", "五分钟", "一个小时", "半天"], "explanation": "走路只要十五分钟.", "id": "H2-R09-1-Q1"}, {"question": "小林为什么先坐公交车？", "answer": "朋友家离自己家远", "options": ["朋友家离自己家远", "学校已经关门", "没有词典", "天气太热"], "explanation": "Nhà B xa nhà A nên A đi xe buýt tới trường trước.", "id": "H2-R09-1-Q2"}, {"question": "两本词典有什么相同的地方？", "answer": "大小一样", "options": ["大小一样", "所有例子一样", "颜色一样", "价格一样"], "explanation": "Văn bản chỉ xác nhận 一样大.", "id": "H2-R09-1-Q3"}, {"id": "H2-R09-1-Q4", "question": "第二天他想请老师讲什么？", "answer": "不认识的词", "options": ["不认识的词", "机票价格", "生日蛋糕", "衣服颜色"], "explanation": "Những từ chưa biết được ghi lại để nhờ giảng."}, {"question": "“学中文学了一年”中的“一年”表示什么？", "answer": "学习持续的时间", "options": ["学习持续的时间", "学习的次数", "年龄", "上课人数"], "explanation": "Đây là bổ ngữ thời lượng.", "id": "H2-R09-1-Q5"}, {"question": "“离学校不远”中的“离”表示什么？", "answer": "两个地点的距离", "options": ["两个地点的距离", "两个人的年龄", "说话方式", "动作完成"], "explanation": "离 dùng để diễn tả khoảng cách.", "id": "H2-R09-1-Q6"}], "pinyin": "xīng qī liù xià wǔ ， xiǎo lín yào qù xiǎo yǔ jiā yì qǐ fù xí 。 xiǎo yǔ jiā lí xué xiào bù yuǎn ， zǒu lù zhǐ yào shí wǔ fēn zhōng ， dàn shì lí xiǎo lín jiā yǒu diǎn ér yuǎn ， suǒ yǐ xiǎo lín xiān zuò gōng jiāo chē dào xué xiào ， zài zǒu guò qù 。 bā diǎn jiàn miàn yǐ hòu ， tā men fā xiàn liǎng gè rén mǎi de cí diǎn yī yàng dà ， lǐ miàn de lì zi què bù yí yàng 。 xiǎo lín yǐ jīng xué zhōng wén xué le yī nián ， xiǎo yǔ xué le bàn nián 。 liǎng gè rén xiān fù xí shēng cí bàn gè xiǎo shí ， zài dú kè wén èr shí fēn zhōng 。 yù dào bù dǒng de dì fāng ， tā men jiù chá cí diǎn 。 suī rán jīn tiān xué de yǒu diǎn ér lèi ， dàn shì liǎng gè rén dōu jué de yì qǐ xué xí bǐ yí gè rén xué xí yǒu yì si 。 huí jiā yǐ hòu ， tā bǎ jīn tiān bù rèn shí de cí xiě xià lái ， dì èr tiān dài dào xué xiào qǐng lǎo shī zài jiǎng yī jiǎng 。"}, {"id": "H2-R09-2", "lesson": 9, "title": "去朋友家复习 · 小安", "text": "星期日下午，小安要去小月家一起复习。小月家离学校不远，走路只要十五分钟，但是离小安家有点儿远，所以小安先坐公交车到学校，再走过去。九点见面以后，他们发现两个人买的词典一样大，里面的例子却不一样。小安已经学中文学了一年，小月学了半年。两个人先复习生词半个小时，再读课文二十分钟。遇到不懂的地方，他们就查词典。虽然今天学得有点儿累，但是两个人都觉得一起学习比一个人学习有意思。他们还约好，以后每周见一次面，轮流到对方家里复习。", "translation": "Chiều Chủ nhật, 小安 đến nhà 小月 ôn bài. Nhà 小月 cách trường mười lăm phút đi bộ nhưng xa nhà 小安, nên 小安 đi xe buýt tới trường rồi đi bộ. Gặp lúc chín giờ, họ thấy từ điển to bằng nhau nhưng ví dụ khác nhau. 小安 học tiếng Trung một năm, 小月 nửa năm. Họ ôn từ nửa giờ, đọc khóa văn hai mươi phút; không hiểu thì tra. Tuy mệt, cả hai thấy học cùng thú vị hơn học một mình. Họ còn hẹn sau này mỗi tuần gặp một lần, luân phiên tới nhà nhau ôn bài.", "grammar": ["跟……一样", "离", "Bổ ngữ thời lượng"], "questions": [{"question": "从学校走到朋友家需要多久？", "answer": "十五分钟", "options": ["十五分钟", "五分钟", "一个小时", "半天"], "explanation": "走路只要十五分钟.", "id": "H2-R09-2-Q1"}, {"question": "小安为什么先坐公交车？", "answer": "朋友家离自己家远", "options": ["朋友家离自己家远", "学校已经关门", "没有词典", "天气太热"], "explanation": "Nhà B xa nhà A nên A đi xe buýt tới trường trước.", "id": "H2-R09-2-Q2"}, {"question": "两本词典有什么相同的地方？", "answer": "大小一样", "options": ["大小一样", "所有例子一样", "颜色一样", "价格一样"], "explanation": "Văn bản chỉ xác nhận 一样大.", "id": "H2-R09-2-Q3"}, {"id": "H2-R09-2-Q4", "question": "他们以后打算多久见一次面？", "answer": "每周一次", "options": ["每周一次", "每天三次", "每年一次", "十年一次"], "explanation": "Họ hẹn 每周见一次面."}, {"question": "“学中文学了一年”中的“一年”表示什么？", "answer": "学习持续的时间", "options": ["学习持续的时间", "学习的次数", "年龄", "上课人数"], "explanation": "Đây là bổ ngữ thời lượng.", "id": "H2-R09-2-Q5"}, {"question": "“离学校不远”中的“离”表示什么？", "answer": "两个地点的距离", "options": ["两个地点的距离", "两个人的年龄", "说话方式", "动作完成"], "explanation": "离 dùng để diễn tả khoảng cách.", "id": "H2-R09-2-Q6"}], "pinyin": "xīng qī rì xià wǔ ， xiǎo ān yào qù xiǎo yuè jiā yì qǐ fù xí 。 xiǎo yuè jiā lí xué xiào bù yuǎn ， zǒu lù zhǐ yào shí wǔ fēn zhōng ， dàn shì lí xiǎo ān jiā yǒu diǎn ér yuǎn ， suǒ yǐ xiǎo ān xiān zuò gōng jiāo chē dào xué xiào ， zài zǒu guò qù 。 jiǔ diǎn jiàn miàn yǐ hòu ， tā men fā xiàn liǎng gè rén mǎi de cí diǎn yī yàng dà ， lǐ miàn de lì zi què bù yí yàng 。 xiǎo ān yǐ jīng xué zhōng wén xué le yī nián ， xiǎo yuè xué le bàn nián 。 liǎng gè rén xiān fù xí shēng cí bàn gè xiǎo shí ， zài dú kè wén èr shí fēn zhōng 。 yù dào bù dǒng de dì fāng ， tā men jiù chá cí diǎn 。 suī rán jīn tiān xué de yǒu diǎn ér lèi ， dàn shì liǎng gè rén dōu jué de yì qǐ xué xí bǐ yí gè rén xué xí yǒu yì si 。 tā men hái yuē hǎo ， yǐ hòu měi zhōu jiàn yī cì miàn ， lún liú dào duì fāng jiā lǐ fù xí 。"}, {"id": "H2-R09-3", "lesson": 9, "title": "去朋友家复习 · 小文", "text": "星期一下午，小文要去小兰家一起复习。小兰家离学校不远，走路只要十五分钟，但是离小文家有点儿远，所以小文先坐公交车到学校，再走过去。十点见面以后，他们发现两个人买的词典一样大，里面的例子却不一样。小文已经学中文学了一年，小兰学了半年。两个人先复习生词半个小时，再读课文二十分钟。遇到不懂的地方，他们就查词典。虽然今天学得有点儿累，但是两个人都觉得一起学习比一个人学习有意思。走的时候，朋友借给他一本有很多图片的书，让他在路上看看。", "translation": "Chiều thứ Hai, 小文 đến nhà 小兰 ôn bài. Nhà 小兰 cách trường mười lăm phút đi bộ nhưng xa nhà 小文, nên 小文 đi xe buýt tới trường rồi đi bộ. Gặp lúc mười giờ, họ thấy từ điển to bằng nhau nhưng ví dụ khác nhau. 小文 học tiếng Trung một năm, 小兰 nửa năm. Họ ôn từ nửa giờ, đọc khóa văn hai mươi phút; không hiểu thì tra. Tuy mệt, cả hai thấy học cùng thú vị hơn học một mình. Khi ra về bạn cho mượn sách có nhiều hình để đọc trên đường.", "grammar": ["跟……一样", "离", "Bổ ngữ thời lượng"], "questions": [{"question": "从学校走到朋友家需要多久？", "answer": "十五分钟", "options": ["十五分钟", "五分钟", "一个小时", "半天"], "explanation": "走路只要十五分钟.", "id": "H2-R09-3-Q1"}, {"question": "小文为什么先坐公交车？", "answer": "朋友家离自己家远", "options": ["朋友家离自己家远", "学校已经关门", "没有词典", "天气太热"], "explanation": "Nhà B xa nhà A nên A đi xe buýt tới trường trước.", "id": "H2-R09-3-Q2"}, {"question": "两本词典有什么相同的地方？", "answer": "大小一样", "options": ["大小一样", "所有例子一样", "颜色一样", "价格一样"], "explanation": "Văn bản chỉ xác nhận 一样大.", "id": "H2-R09-3-Q3"}, {"id": "H2-R09-3-Q4", "question": "朋友借给他的书有什么特点？", "answer": "有很多图片", "options": ["有很多图片", "完全没有图片", "只有数字", "全是菜单"], "explanation": "Quyển mượn có nhiều hình ảnh."}, {"question": "“学中文学了一年”中的“一年”表示什么？", "answer": "学习持续的时间", "options": ["学习持续的时间", "学习的次数", "年龄", "上课人数"], "explanation": "Đây là bổ ngữ thời lượng.", "id": "H2-R09-3-Q5"}, {"question": "“离学校不远”中的“离”表示什么？", "answer": "两个地点的距离", "options": ["两个地点的距离", "两个人的年龄", "说话方式", "动作完成"], "explanation": "离 dùng để diễn tả khoảng cách.", "id": "H2-R09-3-Q6"}], "pinyin": "xīng qī yī xià wǔ ， xiǎo wén yào qù xiǎo lán jiā yì qǐ fù xí 。 xiǎo lán jiā lí xué xiào bù yuǎn ， zǒu lù zhǐ yào shí wǔ fēn zhōng ， dàn shì lí xiǎo wén jiā yǒu diǎn ér yuǎn ， suǒ yǐ xiǎo wén xiān zuò gōng jiāo chē dào xué xiào ， zài zǒu guò qù 。 shí diǎn jiàn miàn yǐ hòu ， tā men fā xiàn liǎng gè rén mǎi de cí diǎn yī yàng dà ， lǐ miàn de lì zi què bù yí yàng 。 xiǎo wén yǐ jīng xué zhōng wén xué le yī nián ， xiǎo lán xué le bàn nián 。 liǎng gè rén xiān fù xí shēng cí bàn gè xiǎo shí ， zài dú kè wén èr shí fēn zhōng 。 yù dào bù dǒng de dì fāng ， tā men jiù chá cí diǎn 。 suī rán jīn tiān xué de yǒu diǎn ér lèi ， dàn shì liǎng gè rén dōu jué de yì qǐ xué xí bǐ yí gè rén xué xí yǒu yì si 。 zǒu de shí hòu ， péng yǒu jiè gěi tā yī běn yǒu hěn duō tú piàn de shū ， ràng tā zài lù shàng kàn kàn 。"}, {"id": "H2-R09-4", "lesson": 9, "title": "去朋友家复习 · 小东", "text": "星期三下午，小东要去小梅家一起复习。小梅家离学校不远，走路只要十五分钟，但是离小东家有点儿远，所以小东先坐公交车到学校，再走过去。七点半见面以后，他们发现两个人买的词典一样大，里面的例子却不一样。小东已经学中文学了一年，小梅学了半年。两个人先复习生词半个小时，再读课文二十分钟。遇到不懂的地方，他们就查词典。虽然今天学得有点儿累，但是两个人都觉得一起学习比一个人学习有意思。两个人还听了十分钟录音，所以今天一共学习了一个小时。", "translation": "Chiều thứ Tư, 小东 đến nhà 小梅 ôn bài. Nhà 小梅 cách trường mười lăm phút đi bộ nhưng xa nhà 小东, nên 小东 đi xe buýt tới trường rồi đi bộ. Gặp lúc bảy giờ rưỡi, họ thấy từ điển to bằng nhau nhưng ví dụ khác nhau. 小东 học tiếng Trung một năm, 小梅 nửa năm. Họ ôn từ nửa giờ, đọc khóa văn hai mươi phút; không hiểu thì tra. Tuy mệt, cả hai thấy học cùng thú vị hơn học một mình. Hai người nghe thêm mười phút ghi âm nên tổng cộng hôm nay học một giờ.", "grammar": ["跟……一样", "离", "Bổ ngữ thời lượng"], "questions": [{"question": "从学校走到朋友家需要多久？", "answer": "十五分钟", "options": ["十五分钟", "五分钟", "一个小时", "半天"], "explanation": "走路只要十五分钟.", "id": "H2-R09-4-Q1"}, {"question": "小东为什么先坐公交车？", "answer": "朋友家离自己家远", "options": ["朋友家离自己家远", "学校已经关门", "没有词典", "天气太热"], "explanation": "Nhà B xa nhà A nên A đi xe buýt tới trường trước.", "id": "H2-R09-4-Q2"}, {"question": "两本词典有什么相同的地方？", "answer": "大小一样", "options": ["大小一样", "所有例子一样", "颜色一样", "价格一样"], "explanation": "Văn bản chỉ xác nhận 一样大.", "id": "H2-R09-4-Q3"}, {"id": "H2-R09-4-Q4", "question": "加上听录音，今天一共学习了多久？", "answer": "一个小时", "options": ["一个小时", "二十分钟", "半小时", "三小时"], "explanation": "30 phút ôn từ + 20 phút đọc + 10 phút nghe = 60 phút."}, {"question": "“学中文学了一年”中的“一年”表示什么？", "answer": "学习持续的时间", "options": ["学习持续的时间", "学习的次数", "年龄", "上课人数"], "explanation": "Đây là bổ ngữ thời lượng.", "id": "H2-R09-4-Q5"}, {"question": "“离学校不远”中的“离”表示什么？", "answer": "两个地点的距离", "options": ["两个地点的距离", "两个人的年龄", "说话方式", "动作完成"], "explanation": "离 dùng để diễn tả khoảng cách.", "id": "H2-R09-4-Q6"}], "pinyin": "xīng qī sān xià wǔ ， xiǎo dōng yào qù xiǎo méi jiā yì qǐ fù xí 。 xiǎo méi jiā lí xué xiào bù yuǎn ， zǒu lù zhǐ yào shí wǔ fēn zhōng ， dàn shì lí xiǎo dōng jiā yǒu diǎn ér yuǎn ， suǒ yǐ xiǎo dōng xiān zuò gōng jiāo chē dào xué xiào ， zài zǒu guò qù 。 qī diǎn bàn jiàn miàn yǐ hòu ， tā men fā xiàn liǎng gè rén mǎi de cí diǎn yī yàng dà ， lǐ miàn de lì zi què bù yí yàng 。 xiǎo dōng yǐ jīng xué zhōng wén xué le yī nián ， xiǎo méi xué le bàn nián 。 liǎng gè rén xiān fù xí shēng cí bàn gè xiǎo shí ， zài dú kè wén èr shí fēn zhōng 。 yù dào bù dǒng de dì fāng ， tā men jiù chá cí diǎn 。 suī rán jīn tiān xué de yǒu diǎn ér lèi ， dàn shì liǎng gè rén dōu jué de yì qǐ xué xí bǐ yí gè rén xué xí yǒu yì si 。 liǎng gè rén hái tīng le shí fēn zhōng lù yīn ， suǒ yǐ jīn tiān yī gòng xué xí le yí gè xiǎo shí 。"}, {"id": "H2-R09-5", "lesson": 9, "title": "去朋友家复习 · 小明", "text": "星期五下午，小明要去小雪家一起复习。小雪家离学校不远，走路只要十五分钟，但是离小明家有点儿远，所以小明先坐公交车到学校，再走过去。八点半见面以后，他们发现两个人买的词典一样大，里面的例子却不一样。小明已经学中文学了一年，小雪学了半年。两个人先复习生词半个小时，再读课文二十分钟。遇到不懂的地方，他们就查词典。虽然今天学得有点儿累，但是两个人都觉得一起学习比一个人学习有意思。回去的时候公交车很挤，他就决定先在公园走走，等人少一点儿再坐车。", "translation": "Chiều thứ Sáu, 小明 đến nhà 小雪 ôn bài. Nhà 小雪 cách trường mười lăm phút đi bộ nhưng xa nhà 小明, nên 小明 đi xe buýt tới trường rồi đi bộ. Gặp lúc tám giờ rưỡi, họ thấy từ điển to bằng nhau nhưng ví dụ khác nhau. 小明 học tiếng Trung một năm, 小雪 nửa năm. Họ ôn từ nửa giờ, đọc khóa văn hai mươi phút; không hiểu thì tra. Tuy mệt, cả hai thấy học cùng thú vị hơn học một mình. Lúc về xe buýt đông nên cậu quyết định dạo công viên trước, đợi ít người hơn rồi đi xe.", "grammar": ["跟……一样", "离", "Bổ ngữ thời lượng"], "questions": [{"question": "从学校走到朋友家需要多久？", "answer": "十五分钟", "options": ["十五分钟", "五分钟", "一个小时", "半天"], "explanation": "走路只要十五分钟.", "id": "H2-R09-5-Q1"}, {"question": "小明为什么先坐公交车？", "answer": "朋友家离自己家远", "options": ["朋友家离自己家远", "学校已经关门", "没有词典", "天气太热"], "explanation": "Nhà B xa nhà A nên A đi xe buýt tới trường trước.", "id": "H2-R09-5-Q2"}, {"question": "两本词典有什么相同的地方？", "answer": "大小一样", "options": ["大小一样", "所有例子一样", "颜色一样", "价格一样"], "explanation": "Văn bản chỉ xác nhận 一样大.", "id": "H2-R09-5-Q3"}, {"id": "H2-R09-5-Q4", "question": "他为什么先去公园走走？", "answer": "等公交车上的人少一点儿", "options": ["等公交车上的人少一点儿", "朋友家没有门", "马上要比赛", "已经买了飞机票"], "explanation": "Cậu chờ bớt đông mới lên xe buýt."}, {"question": "“学中文学了一年”中的“一年”表示什么？", "answer": "学习持续的时间", "options": ["学习持续的时间", "学习的次数", "年龄", "上课人数"], "explanation": "Đây là bổ ngữ thời lượng.", "id": "H2-R09-5-Q5"}, {"question": "“离学校不远”中的“离”表示什么？", "answer": "两个地点的距离", "options": ["两个地点的距离", "两个人的年龄", "说话方式", "动作完成"], "explanation": "离 dùng để diễn tả khoảng cách.", "id": "H2-R09-5-Q6"}], "pinyin": "xīng qī wǔ xià wǔ ， xiǎo míng yào qù xiǎo xuě jiā yì qǐ fù xí 。 xiǎo xuě jiā lí xué xiào bù yuǎn ， zǒu lù zhǐ yào shí wǔ fēn zhōng ， dàn shì lí xiǎo míng jiā yǒu diǎn ér yuǎn ， suǒ yǐ xiǎo míng xiān zuò gōng jiāo chē dào xué xiào ， zài zǒu guò qù 。 bā diǎn bàn jiàn miàn yǐ hòu ， tā men fā xiàn liǎng gè rén mǎi de cí diǎn yī yàng dà ， lǐ miàn de lì zi què bù yí yàng 。 xiǎo míng yǐ jīng xué zhōng wén xué le yī nián ， xiǎo xuě xué le bàn nián 。 liǎng gè rén xiān fù xí shēng cí bàn gè xiǎo shí ， zài dú kè wén èr shí fēn zhōng 。 yù dào bù dǒng de dì fāng ， tā men jiù chá cí diǎn 。 suī rán jīn tiān xué de yǒu diǎn ér lèi ， dàn shì liǎng gè rén dōu jué de yì qǐ xué xí bǐ yí gè rén xué xí yǒu yì si 。 huí qù de shí hòu gōng jiāo chē hěn jǐ ， tā jiù jué dìng xiān zài gōng yuán zǒu zǒu ， děng rén shǎo yì diǎn ér zài zuò chē 。"}, {"id": "H2-R10-1", "lesson": 10, "title": "开学前的一天 · 小林", "text": "下星期就要开学了。星期六早上，小林找不到书包，着急地问妈妈：“我的书包你看见了吗？”妈妈让他看看椅子下面，书包果然在那里。找好书包以后，他和小雨商量：“我们上午去买本子，还是下午去？”小雨说下午有事，还是上午去比较好。商店八点开门，他们到的时候门还没开，就在旁边吃了早饭。买完本子以后，小林又检查了一遍书包，里面的书和笔都带齐了。他想，开学以前把东西准备好，上课时就不用着急了。晚上他在书包旁边放了一张小纸条，提醒自己第二天带水杯。", "translation": "Tuần sau sắp khai giảng. Sáng thứ Bảy, 小林 tìm cặp không thấy, hỏi mẹ đã thấy cặp chưa. Mẹ bảo nhìn dưới ghế và cặp ở đó. Sau đó cậu hỏi 小雨 đi mua vở sáng hay chiều. Bạn bận chiều nên chọn sáng. Cửa hàng mở lúc tám giờ, họ đến sớm nên ăn sáng bên cạnh. Mua xong cậu kiểm tra cặp lần nữa, sách bút đều đủ. Chuẩn bị trước sẽ không phải lo khi vào học. Tối cậu để giấy nhắc cạnh cặp, nhắc mình hôm sau mang cốc nước.", "grammar": ["Cụm chủ-vị làm vị ngữ", "还是", "就要……了"], "questions": [{"question": "开头找不到的东西是什么？", "answer": "书包", "options": ["书包", "手机", "护照", "车票"], "explanation": "Câu hỏi đầu tiên là 我的书包你看见了吗？", "id": "H2-R10-1-Q1"}, {"question": "书包最后在哪里找到？", "answer": "椅子下面", "options": ["椅子下面", "桌子上面", "商店里面", "公交车上"], "explanation": "Mẹ bảo nhìn dưới ghế, cặp ở đó.", "id": "H2-R10-1-Q2"}, {"question": "他们决定什么时候买本子？", "answer": "上午", "options": ["上午", "下午", "晚上", "下星期"], "explanation": "B bận chiều nên chọn sáng.", "id": "H2-R10-1-Q3"}, {"id": "H2-R10-1-Q4", "question": "纸条提醒他带什么？", "answer": "水杯", "options": ["水杯", "相机", "护照", "大衣"], "explanation": "Giấy nhắc ghi cần mang cốc nước."}, {"question": "“上午去，还是下午去”是什么问句？", "answer": "选择问句", "options": ["选择问句", "反问句", "只问原因", "只问数量"], "explanation": "还是 nối hai phương án lựa chọn.", "id": "H2-R10-1-Q5"}, {"question": "“下星期就要开学了”表示什么？", "answer": "开学快到了", "options": ["开学快到了", "已经放假半年", "过去开过学", "从不去学校"], "explanation": "就要……了 diễn tả sự việc sắp xảy ra.", "id": "H2-R10-1-Q6"}], "pinyin": "xià xīng qī jiù yào kāi xué le 。 xīng qī liù zǎo shàng ， xiǎo lín zhǎo bú dào shū bāo ， zháo jí dì wèn mā mā ： “ wǒ de shū bāo nǐ kàn jiàn le ma ？ ” mā mā ràng tā kàn kàn yǐ zi xià miàn ， shū bāo guǒ rán zài nà lǐ 。 zhǎo hǎo shū bāo yǐ hòu ， tā hé xiǎo yǔ shāng liáng ： “ wǒ men shàng wǔ qù mǎi běn zi ， hái shì xià wǔ qù ？ ” xiǎo yǔ shuō xià wǔ yǒu shì ， hái shì shàng wǔ qù bǐ jiào hǎo 。 shāng diàn bā diǎn kāi mén ， tā men dào de shí hòu mén hái méi kāi ， jiù zài páng biān chī le zǎo fàn 。 mǎi wán běn zi yǐ hòu ， xiǎo lín yòu jiǎn chá le yī biàn shū bāo ， lǐ miàn de shū hé bǐ dōu dài qí le 。 tā xiǎng ， kāi xué yǐ qián bǎ dōng xī zhǔn bèi hǎo ， shàng kè shí jiù bù yòng zháo jí le 。 wǎn shàng tā zài shū bāo páng biān fàng le yī zhāng xiǎo zhǐ tiáo ， tí xǐng zì jǐ dì èr tiān dài shuǐ bēi 。"}, {"id": "H2-R10-2", "lesson": 10, "title": "开学前的一天 · 小安", "text": "下星期就要开学了。星期日早上，小安找不到书包，着急地问妈妈：“我的书包你看见了吗？”妈妈让他看看椅子下面，书包果然在那里。找好书包以后，他和小月商量：“我们上午去买本子，还是下午去？”小月说下午有事，还是上午去比较好。商店九点开门，他们到的时候门还没开，就在旁边吃了早饭。买完本子以后，小安又检查了一遍书包，里面的书和笔都带齐了。他想，开学以前把东西准备好，上课时就不用着急了。买本子的时候，他给妹妹也选了一个，因为妹妹下星期也要开学。", "translation": "Tuần sau sắp khai giảng. Sáng Chủ nhật, 小安 tìm cặp không thấy, hỏi mẹ đã thấy cặp chưa. Mẹ bảo nhìn dưới ghế và cặp ở đó. Sau đó cậu hỏi 小月 đi mua vở sáng hay chiều. Bạn bận chiều nên chọn sáng. Cửa hàng mở lúc chín giờ, họ đến sớm nên ăn sáng bên cạnh. Mua xong cậu kiểm tra cặp lần nữa, sách bút đều đủ. Chuẩn bị trước sẽ không phải lo khi vào học. Khi mua vở cậu chọn thêm cho em gái vì tuần sau em cũng khai giảng.", "grammar": ["Cụm chủ-vị làm vị ngữ", "还是", "就要……了"], "questions": [{"question": "开头找不到的东西是什么？", "answer": "书包", "options": ["书包", "手机", "护照", "车票"], "explanation": "Câu hỏi đầu tiên là 我的书包你看见了吗？", "id": "H2-R10-2-Q1"}, {"question": "书包最后在哪里找到？", "answer": "椅子下面", "options": ["椅子下面", "桌子上面", "商店里面", "公交车上"], "explanation": "Mẹ bảo nhìn dưới ghế, cặp ở đó.", "id": "H2-R10-2-Q2"}, {"question": "他们决定什么时候买本子？", "answer": "上午", "options": ["上午", "下午", "晚上", "下星期"], "explanation": "B bận chiều nên chọn sáng.", "id": "H2-R10-2-Q3"}, {"id": "H2-R10-2-Q4", "question": "为什么还给妹妹买本子？", "answer": "妹妹也要开学了", "options": ["妹妹也要开学了", "妹妹住院了", "妹妹不识字", "妹妹要去国外工作"], "explanation": "Em gái cũng sắp khai giảng nên được mua vở."}, {"question": "“上午去，还是下午去”是什么问句？", "answer": "选择问句", "options": ["选择问句", "反问句", "只问原因", "只问数量"], "explanation": "还是 nối hai phương án lựa chọn.", "id": "H2-R10-2-Q5"}, {"question": "“下星期就要开学了”表示什么？", "answer": "开学快到了", "options": ["开学快到了", "已经放假半年", "过去开过学", "从不去学校"], "explanation": "就要……了 diễn tả sự việc sắp xảy ra.", "id": "H2-R10-2-Q6"}], "pinyin": "xià xīng qī jiù yào kāi xué le 。 xīng qī rì zǎo shàng ， xiǎo ān zhǎo bú dào shū bāo ， zháo jí dì wèn mā mā ： “ wǒ de shū bāo nǐ kàn jiàn le ma ？ ” mā mā ràng tā kàn kàn yǐ zi xià miàn ， shū bāo guǒ rán zài nà lǐ 。 zhǎo hǎo shū bāo yǐ hòu ， tā hé xiǎo yuè shāng liáng ： “ wǒ men shàng wǔ qù mǎi běn zi ， hái shì xià wǔ qù ？ ” xiǎo yuè shuō xià wǔ yǒu shì ， hái shì shàng wǔ qù bǐ jiào hǎo 。 shāng diàn jiǔ diǎn kāi mén ， tā men dào de shí hòu mén hái méi kāi ， jiù zài páng biān chī le zǎo fàn 。 mǎi wán běn zi yǐ hòu ， xiǎo ān yòu jiǎn chá le yī biàn shū bāo ， lǐ miàn de shū hé bǐ dōu dài qí le 。 tā xiǎng ， kāi xué yǐ qián bǎ dōng xī zhǔn bèi hǎo ， shàng kè shí jiù bù yòng zháo jí le 。 mǎi běn zi de shí hòu ， tā gěi mèi mèi yě xuǎn le yí gè ， yīn wèi mèi mèi xià xīng qī yě yào kāi xué 。"}, {"id": "H2-R10-3", "lesson": 10, "title": "开学前的一天 · 小文", "text": "下星期就要开学了。星期一早上，小文找不到书包，着急地问妈妈：“我的书包你看见了吗？”妈妈让他看看椅子下面，书包果然在那里。找好书包以后，他和小兰商量：“我们上午去买本子，还是下午去？”小兰说下午有事，还是上午去比较好。商店十点开门，他们到的时候门还没开，就在旁边吃了早饭。买完本子以后，小文又检查了一遍书包，里面的书和笔都带齐了。他想，开学以前把东西准备好，上课时就不用着急了。他还发现一支笔没有水了，就请店员换了一支能写的。", "translation": "Tuần sau sắp khai giảng. Sáng thứ Hai, 小文 tìm cặp không thấy, hỏi mẹ đã thấy cặp chưa. Mẹ bảo nhìn dưới ghế và cặp ở đó. Sau đó cậu hỏi 小兰 đi mua vở sáng hay chiều. Bạn bận chiều nên chọn sáng. Cửa hàng mở lúc mười giờ, họ đến sớm nên ăn sáng bên cạnh. Mua xong cậu kiểm tra cặp lần nữa, sách bút đều đủ. Chuẩn bị trước sẽ không phải lo khi vào học. Cậu còn thấy một cây bút hết mực nên nhờ nhân viên đổi cây viết được.", "grammar": ["Cụm chủ-vị làm vị ngữ", "还是", "就要……了"], "questions": [{"question": "开头找不到的东西是什么？", "answer": "书包", "options": ["书包", "手机", "护照", "车票"], "explanation": "Câu hỏi đầu tiên là 我的书包你看见了吗？", "id": "H2-R10-3-Q1"}, {"question": "书包最后在哪里找到？", "answer": "椅子下面", "options": ["椅子下面", "桌子上面", "商店里面", "公交车上"], "explanation": "Mẹ bảo nhìn dưới ghế, cặp ở đó.", "id": "H2-R10-3-Q2"}, {"question": "他们决定什么时候买本子？", "answer": "上午", "options": ["上午", "下午", "晚上", "下星期"], "explanation": "B bận chiều nên chọn sáng.", "id": "H2-R10-3-Q3"}, {"id": "H2-R10-3-Q4", "question": "为什么要换笔？", "answer": "原来的笔没有水了", "options": ["原来的笔没有水了", "颜色太多", "笔太便宜", "不想写作业"], "explanation": "Bút cũ hết mực, không phải do các lý do khác."}, {"question": "“上午去，还是下午去”是什么问句？", "answer": "选择问句", "options": ["选择问句", "反问句", "只问原因", "只问数量"], "explanation": "还是 nối hai phương án lựa chọn.", "id": "H2-R10-3-Q5"}, {"question": "“下星期就要开学了”表示什么？", "answer": "开学快到了", "options": ["开学快到了", "已经放假半年", "过去开过学", "从不去学校"], "explanation": "就要……了 diễn tả sự việc sắp xảy ra.", "id": "H2-R10-3-Q6"}], "pinyin": "xià xīng qī jiù yào kāi xué le 。 xīng qī yī zǎo shàng ， xiǎo wén zhǎo bú dào shū bāo ， zháo jí dì wèn mā mā ： “ wǒ de shū bāo nǐ kàn jiàn le ma ？ ” mā mā ràng tā kàn kàn yǐ zi xià miàn ， shū bāo guǒ rán zài nà lǐ 。 zhǎo hǎo shū bāo yǐ hòu ， tā hé xiǎo lán shāng liáng ： “ wǒ men shàng wǔ qù mǎi běn zi ， hái shì xià wǔ qù ？ ” xiǎo lán shuō xià wǔ yǒu shì ， hái shì shàng wǔ qù bǐ jiào hǎo 。 shāng diàn shí diǎn kāi mén ， tā men dào de shí hòu mén hái méi kāi ， jiù zài páng biān chī le zǎo fàn 。 mǎi wán běn zi yǐ hòu ， xiǎo wén yòu jiǎn chá le yī biàn shū bāo ， lǐ miàn de shū hé bǐ dōu dài qí le 。 tā xiǎng ， kāi xué yǐ qián bǎ dōng xī zhǔn bèi hǎo ， shàng kè shí jiù bù yòng zháo jí le 。 tā hái fā xiàn yī zhī bǐ méi yǒu shuǐ le ， jiù qǐng diàn yuán huàn le yī zhī néng xiě de 。"}, {"id": "H2-R10-4", "lesson": 10, "title": "开学前的一天 · 小东", "text": "下星期就要开学了。星期三早上，小东找不到书包，着急地问妈妈：“我的书包你看见了吗？”妈妈让他看看椅子下面，书包果然在那里。找好书包以后，他和小梅商量：“我们上午去买本子，还是下午去？”小梅说下午有事，还是上午去比较好。商店七点半开门，他们到的时候门还没开，就在旁边吃了早饭。买完本子以后，小东又检查了一遍书包，里面的书和笔都带齐了。他想，开学以前把东西准备好，上课时就不用着急了。中午老师发来信息，说开学那天要先到大门口见面，不要直接进教室。", "translation": "Tuần sau sắp khai giảng. Sáng thứ Tư, 小东 tìm cặp không thấy, hỏi mẹ đã thấy cặp chưa. Mẹ bảo nhìn dưới ghế và cặp ở đó. Sau đó cậu hỏi 小梅 đi mua vở sáng hay chiều. Bạn bận chiều nên chọn sáng. Cửa hàng mở lúc bảy giờ rưỡi, họ đến sớm nên ăn sáng bên cạnh. Mua xong cậu kiểm tra cặp lần nữa, sách bút đều đủ. Chuẩn bị trước sẽ không phải lo khi vào học. Trưa thầy nhắn ngày mai tập trung ở cổng lớn trước, đừng vào thẳng lớp.", "grammar": ["Cụm chủ-vị làm vị ngữ", "还是", "就要……了"], "questions": [{"question": "开头找不到的东西是什么？", "answer": "书包", "options": ["书包", "手机", "护照", "车票"], "explanation": "Câu hỏi đầu tiên là 我的书包你看见了吗？", "id": "H2-R10-4-Q1"}, {"question": "书包最后在哪里找到？", "answer": "椅子下面", "options": ["椅子下面", "桌子上面", "商店里面", "公交车上"], "explanation": "Mẹ bảo nhìn dưới ghế, cặp ở đó.", "id": "H2-R10-4-Q2"}, {"question": "他们决定什么时候买本子？", "answer": "上午", "options": ["上午", "下午", "晚上", "下星期"], "explanation": "B bận chiều nên chọn sáng.", "id": "H2-R10-4-Q3"}, {"id": "H2-R10-4-Q4", "question": "老师让他们开学那天先在哪里见面？", "answer": "大门口", "options": ["大门口", "电影院", "银行里面", "火车上"], "explanation": "Tin nhắn yêu cầu gặp ở cổng lớn."}, {"question": "“上午去，还是下午去”是什么问句？", "answer": "选择问句", "options": ["选择问句", "反问句", "只问原因", "只问数量"], "explanation": "还是 nối hai phương án lựa chọn.", "id": "H2-R10-4-Q5"}, {"question": "“下星期就要开学了”表示什么？", "answer": "开学快到了", "options": ["开学快到了", "已经放假半年", "过去开过学", "从不去学校"], "explanation": "就要……了 diễn tả sự việc sắp xảy ra.", "id": "H2-R10-4-Q6"}], "pinyin": "xià xīng qī jiù yào kāi xué le 。 xīng qī sān zǎo shàng ， xiǎo dōng zhǎo bú dào shū bāo ， zháo jí dì wèn mā mā ： “ wǒ de shū bāo nǐ kàn jiàn le ma ？ ” mā mā ràng tā kàn kàn yǐ zi xià miàn ， shū bāo guǒ rán zài nà lǐ 。 zhǎo hǎo shū bāo yǐ hòu ， tā hé xiǎo méi shāng liáng ： “ wǒ men shàng wǔ qù mǎi běn zi ， hái shì xià wǔ qù ？ ” xiǎo méi shuō xià wǔ yǒu shì ， hái shì shàng wǔ qù bǐ jiào hǎo 。 shāng diàn qī diǎn bàn kāi mén ， tā men dào de shí hòu mén hái méi kāi ， jiù zài páng biān chī le zǎo fàn 。 mǎi wán běn zi yǐ hòu ， xiǎo dōng yòu jiǎn chá le yī biàn shū bāo ， lǐ miàn de shū hé bǐ dōu dài qí le 。 tā xiǎng ， kāi xué yǐ qián bǎ dōng xī zhǔn bèi hǎo ， shàng kè shí jiù bù yòng zháo jí le 。 zhōng wǔ lǎo shī fā lái xìn xī ， shuō kāi xué nà tiān yào xiān dào dà mén kǒu jiàn miàn ， bú yào zhí jiē jìn jiào shì 。"}, {"id": "H2-R10-5", "lesson": 10, "title": "开学前的一天 · 小明", "text": "下星期就要开学了。星期五早上，小明找不到书包，着急地问妈妈：“我的书包你看见了吗？”妈妈让他看看椅子下面，书包果然在那里。找好书包以后，他和小雪商量：“我们上午去买本子，还是下午去？”小雪说下午有事，还是上午去比较好。商店八点半开门，他们到的时候门还没开，就在旁边吃了早饭。买完本子以后，小明又检查了一遍书包，里面的书和笔都带齐了。他想，开学以前把东西准备好，上课时就不用着急了。晚上他早点儿睡了，因为不想第一天上课就来晚。", "translation": "Tuần sau sắp khai giảng. Sáng thứ Sáu, 小明 tìm cặp không thấy, hỏi mẹ đã thấy cặp chưa. Mẹ bảo nhìn dưới ghế và cặp ở đó. Sau đó cậu hỏi 小雪 đi mua vở sáng hay chiều. Bạn bận chiều nên chọn sáng. Cửa hàng mở lúc tám giờ rưỡi, họ đến sớm nên ăn sáng bên cạnh. Mua xong cậu kiểm tra cặp lần nữa, sách bút đều đủ. Chuẩn bị trước sẽ không phải lo khi vào học. Tối cậu ngủ sớm vì không muốn đến muộn ngay ngày đầu đi học.", "grammar": ["Cụm chủ-vị làm vị ngữ", "还是", "就要……了"], "questions": [{"question": "开头找不到的东西是什么？", "answer": "书包", "options": ["书包", "手机", "护照", "车票"], "explanation": "Câu hỏi đầu tiên là 我的书包你看见了吗？", "id": "H2-R10-5-Q1"}, {"question": "书包最后在哪里找到？", "answer": "椅子下面", "options": ["椅子下面", "桌子上面", "商店里面", "公交车上"], "explanation": "Mẹ bảo nhìn dưới ghế, cặp ở đó.", "id": "H2-R10-5-Q2"}, {"question": "他们决定什么时候买本子？", "answer": "上午", "options": ["上午", "下午", "晚上", "下星期"], "explanation": "B bận chiều nên chọn sáng.", "id": "H2-R10-5-Q3"}, {"id": "H2-R10-5-Q4", "question": "他为什么早点儿睡？", "answer": "不想第一天迟到", "options": ["不想第一天迟到", "今天没有椅子", "想半夜看电视", "明天不用上课"], "explanation": "Ngủ sớm để ngày đầu đến lớp đúng giờ."}, {"question": "“上午去，还是下午去”是什么问句？", "answer": "选择问句", "options": ["选择问句", "反问句", "只问原因", "只问数量"], "explanation": "还是 nối hai phương án lựa chọn.", "id": "H2-R10-5-Q5"}, {"question": "“下星期就要开学了”表示什么？", "answer": "开学快到了", "options": ["开学快到了", "已经放假半年", "过去开过学", "从不去学校"], "explanation": "就要……了 diễn tả sự việc sắp xảy ra.", "id": "H2-R10-5-Q6"}], "pinyin": "xià xīng qī jiù yào kāi xué le 。 xīng qī wǔ zǎo shàng ， xiǎo míng zhǎo bú dào shū bāo ， zháo jí dì wèn mā mā ： “ wǒ de shū bāo nǐ kàn jiàn le ma ？ ” mā mā ràng tā kàn kàn yǐ zi xià miàn ， shū bāo guǒ rán zài nà lǐ 。 zhǎo hǎo shū bāo yǐ hòu ， tā hé xiǎo xuě shāng liáng ： “ wǒ men shàng wǔ qù mǎi běn zi ， hái shì xià wǔ qù ？ ” xiǎo xuě shuō xià wǔ yǒu shì ， hái shì shàng wǔ qù bǐ jiào hǎo 。 shāng diàn bā diǎn bàn kāi mén ， tā men dào de shí hòu mén hái méi kāi ， jiù zài páng biān chī le zǎo fàn 。 mǎi wán běn zi yǐ hòu ， xiǎo míng yòu jiǎn chá le yī biàn shū bāo ， lǐ miàn de shū hé bǐ dōu dài qí le 。 tā xiǎng ， kāi xué yǐ qián bǎ dōng xī zhǔn bèi hǎo ， shàng kè shí jiù bù yòng zháo jí le 。 wǎn shàng tā zǎo diǎn ér shuì le ， yīn wèi bù xiǎng dì yī tiān shàng kè jiù lái wǎn 。"}, {"id": "H2-R11-1", "lesson": 11, "title": "去看生病的同学 · 小林", "text": "星期六下午，小林和小雨去看生病的同学。小林手里拿着一袋苹果，小雨拿着一本故事书。他们到的时候，房间的门开着，同学正坐在床边喝水。虽然脸色不太好，但是他说吃了药以后已经舒服多了。小林问：“你最想做什么？”同学说：“我最想早点儿回学校，和大家一起上课。”小雨就坐在旁边，给他讲了今天课堂上的一个小故事。他们只待了半个小时，因为病人需要休息。走的时候，大家笑着说明天再来。第二天他能下床走一会儿了，医生说，只要好好休息，很快就能回学校。", "translation": "Chiều thứ Bảy, 小林 và 小雨 thăm bạn bị ốm. 小林 cầm táo, 小雨 cầm truyện. Cửa mở, người bạn ngồi bên giường uống nước. Tuy sắc mặt chưa tốt nhưng uống thuốc xong đã dễ chịu hơn. Bạn muốn nhất là sớm về trường học cùng mọi người. 小雨 ngồi cạnh kể chuyện trên lớp. Họ chỉ ở nửa giờ vì người bệnh cần nghỉ, ra về cười nói mai lại đến. Hôm sau cậu có thể xuống giường đi một lát; bác sĩ nói nghỉ ngơi tốt sẽ sớm về trường.", "grammar": ["着", "V1着V2", "最"], "questions": [{"question": "小
