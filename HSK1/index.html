": "Běijīng", "meaning": "Bắc Kinh", "example": "我明天去北京。", "translation": "Ngày mai tôi đến Bắc Kinh."}, {"id": "15-02", "hanzi": "飞机", "pinyin": "fēijī", "meaning": "máy bay", "example": "我坐飞机去北京。", "translation": "Tôi đi máy bay đến Bắc Kinh."}, {"id": "15-03", "hanzi": "好玩儿", "pinyin": "hǎowánr", "meaning": "vui, thú vị", "example": "北京很好玩儿。", "translation": "Bắc Kinh rất thú vị."}, {"id": "15-04", "hanzi": "家人", "pinyin": "jiārén", "meaning": "người thân", "example": "我的家人都在中国。", "translation": "Gia đình tôi đều ở Trung Quốc."}, {"id": "15-05", "hanzi": "接", "pinyin": "jiē", "meaning": "đón", "example": "爸爸去机场接我。", "translation": "Bố đến sân bay đón tôi."}, {"id": "15-06", "hanzi": "机场", "pinyin": "jīchǎng", "meaning": "sân bay", "example": "我们在机场见。", "translation": "Chúng ta gặp nhau ở sân bay."}, {"id": "15-07", "hanzi": "几", "pinyin": "jǐ", "meaning": "mấy", "example": "你有几个朋友？", "translation": "Bạn có mấy người bạn?"}, {"id": "15-08", "hanzi": "年", "pinyin": "nián", "meaning": "năm", "example": "我学了一年汉语。", "translation": "Tôi học tiếng Trung được một năm."}, {"id": "15-09", "hanzi": "那", "pinyin": "nà", "meaning": "kia", "example": "那是我的书。", "translation": "Kia là sách của tôi."}, {"id": "15-10", "hanzi": "男朋友", "pinyin": "nánpéngyou", "meaning": "bạn trai", "example": "她的男朋友在北京工作。", "translation": "Bạn trai cô ấy làm việc ở Bắc Kinh."}, {"id": "15-11", "hanzi": "哪个", "pinyin": "nǎge", "meaning": "cái nào", "example": "你喜欢哪个？", "translation": "Bạn thích cái nào?"}, {"id": "15-12", "hanzi": "去年", "pinyin": "qùnián", "meaning": "năm ngoái", "example": "我去年去了西安。", "translation": "Năm ngoái tôi đến Tây An."}, {"id": "15-13", "hanzi": "时间", "pinyin": "shíjiān", "meaning": "thời gian", "example": "你有时间吗？", "translation": "Bạn có thời gian không?"}, {"id": "15-14", "hanzi": "小时", "pinyin": "xiǎoshí", "meaning": "tiếng (thời lượng)", "example": "我每天学习两个小时。", "translation": "Tôi học hai tiếng mỗi ngày."}, {"id": "15-15", "hanzi": "西安", "pinyin": "Xī’ān", "meaning": "Tây An", "example": "西安是一个很有意思的城市。", "translation": "Tây An là một thành phố thú vị."}, {"id": "15-16", "hanzi": "要", "pinyin": "yào", "meaning": "muốn, sẽ", "example": "我要去学校。", "translation": "Tôi muốn đến trường."}, {"id": "15-17", "hanzi": "住", "pinyin": "zhù", "meaning": "cư trú", "example": "我住在北京。", "translation": "Tôi sống ở Bắc Kinh."}, {"id": "15-18", "hanzi": "早", "pinyin": "zǎo", "meaning": "sớm", "example": "我今天起床很早。", "translation": "Hôm nay tôi dậy rất sớm."}, {"id": "15-19", "hanzi": "爱", "pinyin": "ài", "meaning": "yêu", "example": "我爱我的家人。", "translation": "Tôi yêu gia đình tôi."}], "grammar": [{"name": "Câu ghép đẳng lập ……还/也……", "details": ["Công thức: Mệnh đề 1，(chủ ngữ 2) + 还/也 + vị ngữ 2.", "Ví dụ: 我学汉语，我妹妹也学汉语。", "Nghĩa: Tôi học tiếng Trung, em gái tôi cũng học tiếng Trung."]}], "extended": [{"name": "Hẹn gặp tại địa điểm", "details": ["我们在机场见。", "→ Chúng ta gặp nhau ở sân bay."]}]}];
</script><script>
const L=window.HSK_LESSONS;let lesson=L[0],tab='words',flashIndex=0,flipped=false,session=null,filter='',hidePin=false,hideVi=false,onlyUnknown=false;
const KEY='hsk1-quest-v1';let store;try{store=JSON.parse(localStorage.getItem(KEY))||{known:{},history:[],wrong:{},recent:1}}catch{store={known:{},history:[],wrong:{},recent:1}};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(store));const all=()=>L.flatMap(x=>x.words);const known=()=>Object.values(store.known).filter(Boolean).length;const wordKey=w=>w.id;
function speak(t,rate=0.85){if(!('speechSynthesis'in window)){alert('Trình duyệt không hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=rate;speechSynthesis.speak(u)}
function home(){session=null;$('#app').innerHTML=`<section class="hero"><span class="pill">NEW HSK 1 · 15 BÀI</span><h1>HSK 1 VERSION 3.0</h1><p>338 lượt từ vựng · Flashcard · Luyện tập · Theo dõi tiến độ</p><div class="row"><button class="primary" onclick="openLesson(${store.recent||1})">▶ Tiếp tục bài ${store.recent||1}</button><button onclick="showReview()">Ôn tập tổng hợp</button></div></section><div class="grid"><div class="panel"><div class="stat">${known()}</div>Từ đã đánh dấu thuộc</div><div class="panel"><div class="stat">${store.history.length}</div>Lượt luyện tập</div><div class="panel"><div class="stat">${store.history.reduce((a,b)=>a+b.correct,0)}</div>Câu trả lời đúng</div></div><h2>15 bài học</h2><div class="grid">${L.map(x=>`<div class="card" onclick="openLesson(${x.id})"><span class="pill">Bài ${String(x.id).padStart(2,'0')}</span><h3 class="hanzi">${esc(x.title)}</h3><p>${esc(x.subtitle)}</p><small class="muted">${x.words.length} từ · ${x.grammar.length} mục ngữ pháp</small><div class="progress" style="margin-top:12px"><div style="width:${100*x.words.filter(w=>store.known[wordKey(w)]).length/x.words.length}%"></div></div></div>`).join('')}</div>`}
function openLesson(id,t='words'){lesson=L.find(x=>x.id===id);tab=t;store.recent=id;save();renderLesson()}
function renderLesson(){session=null;$('#app').innerHTML=`<button onclick="home()">← Trang chủ</button><h2>Bài ${lesson.id}: <span class="hanzi">${esc(lesson.title)}</span></h2><p class="muted">${esc(lesson.subtitle)} · ${lesson.words.length} từ vựng</p><div class="tabs">${[['words','Từ vựng'],['grammar','Ngữ pháp'],['flash','Flashcard'],['games','Trò chơi']].map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';renderLesson()">${n}</button>`).join('')}</div><section id="content"></section>`;if(tab==='words')renderWords();if(tab==='grammar')renderGrammar();if(tab==='flash')renderFlash();if(tab==='games')renderGames()}
function renderWords(){let words=lesson.words.filter(w=>(!onlyUnknown||!store.known[wordKey(w)])&&[w.hanzi,w.pinyin,w.meaning].join(' ').toLowerCase().includes(filter.toLowerCase()));$('#content').innerHTML=`<div class="toolbar"><input type="search" placeholder="Tìm Hán tự, Pinyin, nghĩa..." value="${esc(filter)}" oninput="filter=this.value;renderWords()"><button onclick="hidePin=!hidePin;renderWords()">${hidePin?'Hiện':'Ẩn'} Pinyin</button><button onclick="hideVi=!hideVi;renderWords()">${hideVi?'Hiện':'Ẩn'} nghĩa</button><button onclick="onlyUnknown=!onlyUnknown;renderWords()" class="${onlyUnknown?'active':''}">Chưa thuộc</button></div><div class="tablewrap panel"><table><thead><tr><th>STT</th><th>Hán tự</th><th>Pinyin</th><th>Nghĩa</th><th>Ví dụ và dịch</th><th>Học</th></tr></thead><tbody>${words.map((w,i)=>`<tr><td>${i+1}</td><td><div class="hanzi">${esc(w.hanzi)}</div><button onclick="speak('${w.hanzi.replace(/'/g,'')}')">🔊</button></td><td>${hidePin?'•••':esc(w.pinyin)}</td><td>${hideVi?'•••':esc(w.meaning)}</td><td><div class="hanzi" style="font-size:23px">${esc(w.example)}</div><div class="muted">${hideVi?'•••':esc(w.translation)}</div><button onclick="speak(${JSON.stringify(w.example).replace(/"/g,'&quot;')})">🔊 Nghe câu</button></td><td><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Thuộc':'○ Chưa'}</button></td></tr>`).join('')}</tbody></table></div>`}
function toggleKnown(id){store.known[id]=!store.known[id];save();if(tab==='flash')renderFlash();else renderWords()}
function renderGrammar(){const make=(a,heading)=>`<h3>${heading}</h3>${a.map(g=>`<article class="panel grammar"><h3>${esc(g.name)}</h3><p>${g.details.map(esc).join('\n')}</p></article>`).join('')}`;$('#content').innerHTML=make(lesson.grammar,'Ngữ pháp giáo trình')+make(lesson.extended,'Chú thích mở rộng')+'<p class="muted">Các công thức và ví dụ được trích theo tài liệu. Chưa bổ sung 3–5 ví dụ mới cho từng điểm ngữ pháp.</p>'}
function flashList(){return lesson.words.filter(w=>!onlyUnknown||!store.known[w.id])}function renderFlash(){let a=flashList();if(flashIndex>=a.length)flashIndex=0;let w=a[flashIndex];$('#content').innerHTML=`<div class="toolbar"><button onclick="onlyUnknown=!onlyUnknown;flashIndex=0;flipped=false;renderFlash()" class="${onlyUnknown?'active':''}">Chỉ từ chưa thuộc</button><button onclick="lesson.words.sort(()=>Math.random()-.5);flashIndex=0;renderFlash()">🔀 Trộn thẻ</button></div>${!w?'<div class="panel">Bạn đã đánh dấu thuộc tất cả từ trong bài.</div>':`<div class="panel flash" onclick="flipped=!flipped;renderFlash()"><div class="muted">Thẻ ${flashIndex+1}/${a.length}</div>${flipped?`<div class="hanzi big">${esc(w.hanzi)}</div><h2>${esc(w.pinyin)}</h2><h3>${esc(w.meaning)}</h3><div class="hanzi" style="font-size:24px">${esc(w.example)}</div><p>${esc(w.translation)}</p>`:`<div class="hanzi big">${esc(w.hanzi)}</div>`}</div><div class="toolbar"><button onclick="speak(${JSON.stringify(w.hanzi).replace(/"/g,'&quot;')})">🔊 Nghe</button><button onclick="flashIndex=Math.max(0,flashIndex-1);flipped=false;renderFlash()">← Trước</button><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Đã thuộc':'○ Đánh dấu thuộc'}</button><button class="primary" onclick="flashIndex=(flashIndex+1)%flashList().length;flipped=false;renderFlash()">Tiếp →</button></div>`}`}
const MODES=[['hanzi','Hán tự → Nghĩa'],['meaning','Nghĩa → Hán tự'],['pinyin','Chọn Pinyin'],['listen','Nghe chọn Hán tự'],['type','Gõ Hán tự'],['dictation','Nghe chép chính tả']];
function renderGames(){let modes=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${n}</h3><p class="muted">Luyện với dữ liệu từ vựng của bài</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<h3>Chọn chế độ luyện tập</h3><div class="grid">${modes}</div><p class="muted">Phiên bản này triển khai 6 chế độ từ vựng. Các chế độ viết đoạn, đọc hiểu dài, sắp xếp câu và thử thách ngữ pháp chuyên sâu sẽ được bổ sung ở giai đoạn nội dung tiếp theo, không sử dụng câu hỏi giả.</p>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(mode,custom){let pool=custom||lesson.words;let questions=shuffle(pool).slice(0,Math.min(30,pool.length));session={mode,questions,pool,index:0,correct:0,answered:false};renderQuestion()}
function renderQuestion(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=s.mode;let options=shuffle([w,...shuffle(s.pool.filter(x=>x.hanzi!==w.hanzi&&x.meaning!==w.meaning)).slice(0,3)]);s.options=options;let question=m==='meaning'?w.meaning:m==='hanzi'||m==='pinyin'?w.hanzi:m==='type'?w.meaning:'🔊 Nhấn nghe';$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${MODES.find(x=>x[0]===m)?.[1]||m}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${m==='hanzi'||m==='pinyin'?'hanzi big':''}">${esc(question)}</h2>${m==='listen'||m==='dictation'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Phát âm</button>':''}<div id="options">${m==='type'||m==='dictation'?`<input id="typed" placeholder="Nhập Hán tự" autocomplete="off"><button class="primary" onclick="checkAnswer($('#typed').value)">Kiểm tra</button>`:options.map((o,i)=>`<button class="option ${m==='meaning'||m==='listen'?'chinese-option':''}" onclick="checkAnswer(${i})">${esc(m==='hanzi'?o.meaning:m==='pinyin'?o.pinyin:m==='meaning'||m==='listen'?o.hanzi:o.meaning)}</button>`).join('')}</div><div id="feedback"></div></div>`;if(m==='listen'||m==='dictation')speak(w.hanzi)}
function checkAnswer(input){let s=session;if(s.answered)return;let w=s.questions[s.index],m=s.mode;let ok=typeof input==='number'?s.options[input].id===w.id:input.replace(/[\s，。！？,.!?]/g,'')===w.hanzi.replace(/[\s，。！？,.!?]/g,'');s.answered=true;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác!':'✗ Chưa đúng'}</strong><div class="hanzi">${esc(w.hanzi)}</div><div>${esc(w.pinyin)} · ${esc(w.meaning)}</div><p>${esc(w.example)} — ${esc(w.translation)}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderQuestion()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`;[...document.querySelectorAll('.option')].forEach(b=>b.disabled=true)}
function finishGame(){let s=session;store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập 🎉</h2><div class="stat">${s.correct}/${s.questions.length}</div><p>Tỷ lệ đúng: ${Math.round(100*s.correct/s.questions.length)}%</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`}
function showReview(){let ids=L.map(x=>x.id);$('#app').innerHTML=`<h2>Ôn tập tổng hợp</h2><div class="panel"><p>Chọn các bài để luyện từ vựng.</p><div class="grid">${L.map(x=>`<label><input type="checkbox" class="lessoncheck" value="${x.id}" checked> Bài ${x.id} · ${esc(x.title)}</label>`).join('')}</div><div class="toolbar"><select id="reviewMode">${MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('')}</select><button class="primary" onclick="startReview()">Bắt đầu (tối đa 30 câu)</button></div></div>`}

</script><script>
/* Additional fully interactive practice modes. All questions are sourced from the workbook examples. */
const BASE_MODES=MODES.slice();
MODES.push(['cloze','Điền từ vào câu'],['translate','Dịch câu Việt → Trung'],['order','Sắp xếp câu'],['reading','Đọc hiểu câu ví dụ'],['speaking','Luyện nói'],['grammar','Thử thách ngữ pháp'],['mixed','Thử thách tổng hợp']);
const originalRenderGames=renderGames;
renderGames=function(){let html=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${esc(n)}</h3><p class="muted">${['reading','grammar','speaking'].includes(m)?'Luyện theo câu ví dụ và kiến thức có trong sổ tay':'Luyện tập tương tác'}</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<div class="toolbar"><label>Số câu <select id="numQuestions"><option>10</option><option>20</option><option selected>30</option><option>50</option></select></label></div><div class="grid">${html}</div><p class="muted">Các chế độ bổ sung khai thác câu ví dụ thực tế trong sổ tay. Chế độ “Đọc hiểu” hiện là đọc hiểu câu, chưa phải 5 bài đọc dài/bài. Số câu không vượt quá số câu hỏi khác nhau có thể tạo từ nguồn.</p>`};
function cleanHan(s){return (s||'').replace(/[\s，。！？,.!?、；：:;“”"']/g,'')}
function examples(pool){return pool.filter(w=>w.example&&w.translation&&cleanHan(w.example).length>=3)}
function getLimit(){return Number($('#numQuestions')?.value||30)}
const originalStartGame=startGame;
startGame=function(mode,custom){if(BASE_MODES.some(x=>x[0]===mode)) {let p=custom||lesson.words;let q=shuffle(p).slice(0,Math.min(getLimit(),p.length));session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderQuestion();return}let p=custom||lesson.words;let q=shuffle(examples(p));if(mode==='grammar'){let gram=(custom?L.filter(l=>l.words.some(w=>p.includes(w))):[lesson]).flatMap(l=>l.grammar.map((g,i)=>({id:`g${l.id}-${i}`,grammar:g,hanzi:g.name,example:(g.details.find(s=>s.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(s=>s.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),meaning:g.name}))).filter(x=>x.example);q=shuffle(gram)}
if(mode==='mixed')q=shuffle([...q.map((w,i)=>({...w,submode:['cloze','translate','order','reading'][i%4]})),...q.map(w=>({...w,submode:'speaking'}))]);
q=q.slice(0,Math.min(getLimit(),q.length));if(!q.length){alert('Không đủ nội dung hợp lệ trong tài liệu cho chế độ này.');return}session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderAdvanced()};
function renderAdvanced(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=w.submode||s.mode;let sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));let missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];let prompt='',control='';s.target=sentence;s.missing=missing;
if(m==='cloze'){prompt=sentence.replace(missing,'＿＿');control=`<input id="advInput" placeholder="Điền Hán tự" autocomplete="off">`}
if(m==='translate'){prompt=w.translation;control=`<textarea id="advInput" placeholder="Viết câu bằng tiếng Trung"></textarea>`}
if(m==='order'){prompt=w.translation;let units=sentence.match(/[\u3400-\u9fff]+|[^\u3400-\u9fff]/g)||tokens;s.tiles=shuffle(tokens.filter(c=>!/[。！？]/.test(c)));s.chosen=[];control=`<div id="selectedTiles" class="panel hanzi"></div><div id="tileBank" class="toolbar">${s.tiles.map((t,i)=>`<button id="tile${i}" class="hanzi" onclick="pickTile(${i})">${esc(t)}</button>`).join('')}</div><button onclick="session.chosen=[];renderAdvanced()">Xếp lại</button>`}
if(m==='reading'){prompt=sentence;control=`<p><strong>Câu này có nghĩa gì?</strong></p><textarea id="advInput" placeholder="Viết nghĩa tiếng Việt của câu"></textarea>`}
if(m==='speaking'){prompt=sentence;control=`<div class="toolbar"><button onclick="speak(session.questions[session.index].example)">🔊 Nghe mẫu</button><button onclick="recordSpeech()">🎤 Nói bằng micro</button></div><p id="recognized" class="muted">Nhận dạng giọng nói phụ thuộc trình duyệt; không phải điểm phát âm.</p><input id="advInput" placeholder="Có thể gõ câu bạn đã nói">`}
if(m==='grammar'){prompt=w.grammar.name;control=`<p><strong>Nhớ lại công thức và viết câu ví dụ cho cấu trúc này.</strong></p><textarea id="advInput" placeholder="Viết một câu ví dụ"></textarea>`}
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${esc(MODES.find(x=>x[0]===m)?.[1]||m)}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${['cloze','speaking','reading'].includes(m)?'hanzi':''}">${esc(prompt)}</h2>${control}<div class="toolbar"><button class="primary" onclick="gradeAdvanced()">Kiểm tra / Đối chiếu</button></div><div id="feedback"></div></div>`}
function pickTile(i){let b=$('#tile'+i);if(b.disabled)return;session.chosen.push(session.tiles[i]);b.disabled=true;$('#selectedTiles').textContent=session.chosen.join('')}
function gradeAdvanced(){let s=session;if(s.answered)return;let w=s.questions[s.index],m=w.submode||s.mode,typed=m==='order'?s.chosen.join(''):($('#advInput')?.value||'').trim();if(!typed){alert('Hãy nhập câu trả lời trước.');return}let answer=m==='cloze'?s.missing:w.example;let ok=null;if(['cloze','translate','order','speaking'].includes(m))ok=cleanHan(typed)===cleanHan(answer);if(m==='reading'||m==='grammar')ok=null;s.answered=true;if(ok===true)s.correct++;if(ok===false)store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();let explanation=m==='grammar'?w.grammar.details.join(' · '):`${w.pinyin||''} · ${w.translation||''}`;$('#feedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu với đáp án mẫu':ok?'✓ Trùng đáp án mẫu':'Chưa trùng đáp án mẫu'}</strong><p class="hanzi">${esc(answer)}</p><p>${esc(explanation)}</p><p class="muted">${m==='translate'||m==='grammar'||m==='reading'?'Các cách diễn đạt tương đương có thể đúng; website không có AI chấm ngữ pháp/ngữ nghĩa.':''}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderAdvanced()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`}
function recordSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#recognized').textContent='Trình duyệt này không hỗ trợ nhận dạng giọng nói. Hãy thử Chrome hoặc Edge và cấp quyền micro.';return}let rec=new SR();rec.lang='zh-CN';rec.onresult=e=>{$('#advInput').value=e.results[0][0].transcript;$('#recognized').textContent='Nhận dạng: '+e.results[0][0].transcript};rec.onerror=e=>{$('#recognized').textContent='Không thể nhận dạng: '+e.error+'. Hãy kiểm tra quyền micro.'};rec.start()}
const oldFinish=finishGame;finishGame=function(){let s=session;if(BASE_MODES.some(x=>x[0]===s.mode))return oldFinish();store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length,autoGraded:!['reading','grammar','mixed'].includes(s.mode)});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập</h2><div class="stat">${s.index} câu đã làm</div><p>${s.correct} câu trùng đáp án mẫu. Các câu tự đối chiếu không được tính là sai.</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`};
const oldReview=showReview;showReview=function(){oldReview();let sel=$('#reviewMode');sel.innerHTML=MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');let btn=$('#app .primary');btn.textContent='Bắt đầu ôn tập';};

</script><script>
/* Additional practice, final exam, and answer review. No AI grading claims. */
const extraModes=[['paragraph','Viết đoạn văn có hướng dẫn'],['exam','Kiểm tra cuối khóa']];
MODES.push(...extraModes);
const previousRenderGames=renderGames;
renderGames=function(){previousRenderGames();const grid=$('#content .grid');grid.insertAdjacentHTML('beforeend',`<div class="card" onclick="startWriting()"><h3>✍️ Viết đoạn văn</h3><p class="muted">Luyện viết dựa trên câu ví dụ của bài; đối chiếu thủ công</p><button class="primary">Bắt đầu</button></div><div class="card" onclick="startFinalExam()"><h3>🏆 Kiểm tra cuối khóa</h3><p class="muted">100 câu: từ vựng, ngữ pháp và kỹ năng</p><button class="primary">Bắt đầu</button></div>`)};
function startWriting(){const words=lesson.words.filter(w=>w.example&&w.translation);if(!words.length)return alert('Chưa có câu ví dụ để luyện viết.');const selected=shuffle(words).slice(0,Math.min(30,words.length));session={mode:'paragraph',questions:selected,index:0,correct:0,answered:false};renderWriting()}
function renderWriting(){const s=session;if(s.index>=s.questions.length){finishWriting();return}const w=s.questions[s.index];$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Quay lại</button><div class="panel"><span class="pill">Luyện viết ${s.index+1}/${s.questions.length}</span><h2>Viết bằng tiếng Trung</h2><p>${esc(w.translation)}</p><p class="muted">Hãy tự viết câu này và có thể mở rộng thành một đoạn ngắn liên quan. Đây là bài tự luyện, không chấm ngữ pháp tự động.</p><textarea id="writingAnswer" rows="7" placeholder="Nhập chữ Hán...">${esc(s.draft||'')}</textarea><div class="toolbar"><button onclick="s.draft=$('#writingAnswer').value;localStorage.setItem('hsk-writing-draft',JSON.stringify({lesson:lesson.id,index:s.index,text:s.draft}));alert('Đã lưu bản nháp trên trình duyệt')">Lưu nháp</button><button class="primary" onclick="showWritingAnswer()">Xem đáp án mẫu</button></div><div id="writingFeedback"></div></div>`}
function showWritingAnswer(){const s=session,w=s.questions[s.index];s.draft=$('#writingAnswer').value;$('#writingFeedback').innerHTML=`<div class="result"><h3>Đáp án tham khảo</h3><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p class="muted">Hãy tự đối chiếu từ vựng, thứ tự từ và cấu trúc. Có thể có nhiều cách viết đúng.</p></div><button onclick="s.index++;s.draft='';renderWriting()" class="primary">${s.index+1===s.questions.length?'Hoàn thành':'Câu tiếp theo →'}</button>`}
function finishWriting(){store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:'paragraph',correct:0,total:session.questions.length,autoGraded:false});save();$('#app').innerHTML=`<div class="panel"><h2>Đã hoàn thành ${session.questions.length} bài tự luyện viết</h2><p>Không có điểm tự động vì câu trả lời cần người học đối chiếu.</p><button onclick="openLesson(${lesson.id},'games')">Quay lại bài</button></div>`}
const EXAM_PLAN=[['hanzi',20],['grammar',20],['reading',20],['listen',20],['translate',10],['mixed',10]];
function startFinalExam(){let pool=L.flatMap(l=>l.words);let questions=[];for(const [mode,count] of EXAM_PLAN){let items;if(mode==='grammar')items=L.flatMap(l=>l.grammar.map((g,i)=>({id:`gram-${l.id}-${i}`,grammar:g,example:(g.details.find(x=>x.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(x=>x.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),hanzi:g.name}))).filter(w=>w.example);else items=pool.filter(w=>w.example&&w.translation&&(mode!=='mixed'||w.example.includes(w.hanzi)));items=shuffle(items).slice(0,count);questions.push(...items.map(w=>({...w,examMode:mode==='mixed'?'cloze':mode})))}if(questions.length!==100){alert(`Ngân hàng chỉ đủ ${questions.length}/100 câu độc lập. Không tạo câu giả.`);return}lesson=L[0];session={mode:'final-exam',questions:shuffle(questions),index:0,correct:0,answered:false,graded:0,pool};renderExamQuestion()}
function renderExamQuestion(){const s=session;if(s.index>=s.questions.length){finishExam();return}const w=s.questions[s.index],m=w.examMode;s.answered=false;let q='',input='';if(m==='hanzi'||m==='listen'){s.options=shuffle([w,...shuffle(s.pool.filter(x=>x.id!==w.id&&x.meaning!==w.meaning)).slice(0,3)]);q=m==='hanzi'?w.hanzi:'Nghe và chọn nghĩa đúng';input=`${m==='listen'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Nghe</button>':''}<div class="grid">${s.options.map((o,i)=>`<button class="option" onclick="answerExam(${i})">${esc(o.meaning)}</button>`).join('')}</div>`}else if(m==='grammar'){q=w.grammar.name;input=`<p>Hãy viết câu ví dụ sử dụng cấu trúc này.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='reading'){q=w.example;input=`<p>Hãy dịch câu sang tiếng Việt.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='translate'){q=w.translation;input=`<p>Hãy dịch sang tiếng Trung.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else{q=w.example.replace(w.hanzi,'＿＿');s.missing=w.hanzi;input=`<p>Điền từ còn thiếu.</p><input id="examInput" placeholder="Nhập Hán tự"><button class="primary" onclick="answerExam()">Kiểm tra</button>`}$('#app').innerHTML=`<div class="panel"><div class="row"><span class="pill">Đề cuối khóa · ${esc(m)}</span><span class="spacer"></span>${s.index+1}/100</div><div class="progress"><div style="width:${s.index}%"></div></div><h2 class="hanzi">${esc(q)}</h2>${input}<div id="examFeedback"></div></div>`;if(m==='listen')speak(w.hanzi)}
function answerExam(choice){const s=session;if(s.answered)return;const w=s.questions[s.index],m=w.examMode;let ok=null;if(m==='hanzi'||m==='listen')ok=s.options[choice]?.id===w.id;else{const val=$('#examInput').value.trim();if(!val)return alert('Hãy nhập câu trả lời trước.');if(m==='cloze')ok=cleanHan(val)===cleanHan(s.missing);else if(m==='translate')ok=cleanHan(val)===cleanHan(w.example)}s.answered=true;if(ok!==null){s.graded++;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1}save();$('#examFeedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu':ok?'✓ Đúng':'Chưa đúng theo đáp án mẫu'}</strong><p class="hanzi">${esc(w.example||w.hanzi)}</p><p>${esc(w.translation||'')}</p>${m==='grammar'?`<p>${esc(w.grammar.details.join(' · '))}</p>`:''}<p class="muted">Các câu tự luận không được chấm ngữ nghĩa tự động.</p></div><button class="primary" onclick="session.index++;renderExamQuestion()">${s.index===99?'Xem kết quả':'Tiếp tục →'}</button>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true)}

 Em chào thầy/cô Lý Văn ạ! Giáo viên: Chào em! Em là học sinh à? Học sinh: Em là học sinh. Em rất vui được làm quen với thầy/cô.", "questions": [{"id": "R02-3-v2-1", "question": "____，您叫什么名字？", "answer": "请问", "options": ["高兴", "好", "很", "请问"], "explanation": "Đáp án: 请问. Thông tin đối chiếu trong bài: “请问，您叫什么名字？”", "evidence": "请问，您叫什么名字？"}, {"id": "R02-3-v2-2", "question": "老师叫什么名字？", "answer": "李文", "options": ["李文", "我们", "你", "老师"], "explanation": "Đáp án: 李文. Thông tin đối chiếu trong bài: “老师：我叫李文。”", "evidence": "老师：我叫李文。"}, {"id": "R02-3-v2-3", "question": "李文是____。", "answer": "老师", "options": ["我", "老师", "你", "学生"], "explanation": "Đáp án: 老师. Thông tin đối chiếu trong bài: “老师：我叫李文。”", "evidence": "老师：我叫李文。"}, {"id": "R02-3-v2-4", "question": "你是____？", "answer": "学生", "options": ["同学", "您", "学生", "大家"], "explanation": "Đáp án: 学生. Thông tin đối chiếu trong bài: “学生：我是学生。”", "evidence": "学生：我是学生。"}, {"id": "R02-3-v2-5", "question": "学生：认识____，我很高兴。", "answer": "您", "options": ["你", "老师", "学生", "您"], "explanation": "Đáp án: 您. Thông tin đối chiếu trong bài: “认识您，我很高兴。”", "evidence": "认识您，我很高兴。"}, {"id": "R02-3-v2-6", "question": "学生：李文老师，____！", "answer": "您好", "options": ["您好", "大家好", "老师好", "同学们好"], "explanation": "Đáp án: 您好. Thông tin đối chiếu trong bài: “学生：李文老师，您好！”", "evidence": "学生：李文老师，您好！"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R02-4", "lesson": 2, "revision": 2, "title": "Lời xin lỗi và lời đáp", "text": "同学：对不起！\n李文：没事！\n同学：谢谢你！请问，你叫什么名字？\n李文：我叫李文。你也是学生？\n同学：我是学生。\n李文：认识你，我很高兴。", "translation": "Bạn học: Xin lỗi bạn! Lý Văn: Không sao! Bạn học: Cảm ơn bạn! Cho mình hỏi bạn tên là gì? Lý Văn: Mình tên là Lý Văn. Bạn cũng là học sinh à? Bạn học: Mình là học sinh. Lý Văn: Rất vui được làm quen với bạn.", "questions": [{"id": "R02-4-v2-1", "question": "同学：____！李文：没事！", "answer": "对不起", "options": ["没关系", "没事", "大家好", "对不起"], "explanation": "Đáp án: 对不起. Thông tin đối chiếu trong bài: “同学：对不起！”", "evidence": "同学：对不起！"}, {"id": "R02-4-v2-2", "question": "李文：____！同学：谢谢你！", "answer": "没事", "options": ["没事", "没关系", "大家好", "老师好"], "explanation": "Đáp án: 没事. Thông tin đối chiếu trong bài: “李文：没事！”", "evidence": "李文：没事！"}, {"id": "R02-4-v2-3", "question": "同学：____你！", "answer": "谢谢", "options": ["没事", "谢谢", "大家好", "老师好"], "explanation": "Đáp án: 谢谢. Thông tin đối chiếu trong bài: “同学：谢谢你！”", "evidence": "同学：谢谢你！"}, {"id": "R02-4-v2-4", "question": "你叫什么____？", "answer": "名字", "options": ["不", "是", "名字", "叫"], "explanation": "Đáp án: 名字. Thông tin đối chiếu trong bài: “请问，你叫什么名字？”", "evidence": "请问，你叫什么名字？"}, {"id": "R02-4-v2-5", "question": "我叫____。", "answer": "李文", "options": ["您", "大家", "你们", "李文"], "explanation": "Đáp án: 李文. Thông tin đối chiếu trong bài: “李文：我叫李文。”", "evidence": "李文：我叫李文。"}, {"id": "R02-4-v2-6", "question": "同学是____。", "answer": "学生", "options": ["学生", "你", "老师", "同学"], "explanation": "Đáp án: 学生. Thông tin đối chiếu trong bài: “同学：我是学生。”", "evidence": "同学：我是学生。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R02-5", "lesson": 2, "revision": 2, "title": "Làm quen qua lời giới thiệu", "text": "李文：大家好！我叫李文。我是学生。\n同学们：李文，你好！\n李文：认识你们，我很高兴。\n李文：你们是同学，我也是同学。谢谢大家！\n老师：李文，很好！", "translation": "Lý Văn: Chào mọi người! Mình tên là Lý Văn. Mình là học sinh. Các bạn học: Lý Văn, chào bạn! Lý Văn: Mình rất vui được làm quen với các bạn. Lý Văn: Các bạn là bạn học, mình cũng là bạn học. Cảm ơn mọi người! Giáo viên: Lý Văn, tốt lắm!", "questions": [{"id": "R02-5-v2-1", "question": "我叫____。", "answer": "李文", "options": ["你", "老师", "学生", "李文"], "explanation": "Đáp án: 李文. Thông tin đối chiếu trong bài: “我叫李文。”", "evidence": "我叫李文。"}, {"id": "R02-5-v2-2", "question": "我是____。", "answer": "学生", "options": ["学生", "老师", "同学", "您"], "explanation": "Đáp án: 学生. Thông tin đối chiếu trong bài: “我是学生。”", "evidence": "我是学生。"}, {"id": "R02-5-v2-3", "question": "____们：李文，你好！", "answer": "同学", "options": ["学生", "同学", "您", "大家"], "explanation": "Đáp án: 同学. Thông tin đối chiếu trong bài: “同学们：李文，你好！”", "evidence": "同学们：李文，你好！"}, {"id": "R02-5-v2-4", "question": "认识你们，我很____。", "answer": "高兴", "options": ["是", "叫", "高兴", "名字"], "explanation": "Đáp án: 高兴. Thông tin đối chiếu trong bài: “李文：认识你们，我很高兴。”", "evidence": "李文：认识你们，我很高兴。"}, {"id": "R02-5-v2-5", "question": "我____是同学。", "answer": "也", "options": ["不", "是", "叫", "也"], "explanation": "Đáp án: 也. Thông tin đối chiếu trong bài: “李文：你们是同学，我也是同学。”", "evidence": "李文：你们是同学，我也是同学。"}, {"id": "R02-5-v2-6", "question": "____：李文，很好！", "answer": "老师", "options": ["老师", "我们", "我", "你"], "explanation": "Đáp án: 老师. Thông tin đối chiếu trong bài: “老师：李文，很好！”", "evidence": "老师：李文，很好！"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R03-1", "lesson": 3, "revision": 2, "title": "Đoán quốc tịch", "text": "同学：李文，你是泰国人吗？\n李文：不，我是中国人。\n同学：她是中国人吗？\n李文：她不是中国人，她是法国人。她是我的姐姐。\n同学：认识你们，我很高兴。", "translation": "Bạn học: Lý Văn, bạn là người Thái Lan à? Lý Văn: Không, mình là người Trung Quốc. Bạn học: Chị ấy là người Trung Quốc à? Lý Văn: Chị ấy không phải người Trung Quốc, chị ấy là người Pháp. Chị ấy là chị gái của mình. Bạn học: Rất vui được làm quen với hai người.", "questions": [{"id": "R03-1-v2-1", "question": "李文是哪国人？", "answer": "中国人", "options": ["中国人", "同学", "您", "大家"], "explanation": "Đáp án: 中国人. Thông tin đối chiếu trong bài: “李文：不，我是中国人。”", "evidence": "李文：不，我是中国人。"}, {"id": "R03-1-v2-2", "question": "姐姐是哪国人？", "answer": "法国人", "options": ["老师", "法国人", "学生", "同学"], "explanation": "Đáp án: 法国人. Thông tin đối chiếu trong bài: “李文：她不是中国人，她是法国人。”", "evidence": "李文：她不是中国人，她是法国人。"}, {"id": "R03-1-v2-3", "question": "她是李文的谁？", "answer": "姐姐", "options": ["您", "大家", "姐姐", "你们"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “她是我的姐姐。”", "evidence": "她是我的姐姐。"}, {"id": "R03-1-v2-4", "question": "李文是泰国人吗？", "answer": "不是", "options": ["想", "不想", "很忙", "不是"], "explanation": "Đáp án: 不是. Thông tin đối chiếu trong bài: “李文：不，我是中国人。”", "evidence": "李文：不，我是中国人。"}, {"id": "R03-1-v2-5", "question": "姐姐是中国人吗？", "answer": "不是", "options": ["不是", "不想", "很忙", "不忙"], "explanation": "Đáp án: 不是. Thông tin đối chiếu trong bài: “李文：她不是中国人，她是法国人。”", "evidence": "李文：她不是中国人，她是法国人。"}, {"id": "R03-1-v2-6", "question": "认识你们，同学很____。", "answer": "高兴", "options": ["太", "高兴", "不太", "好"], "explanation": "Đáp án: 高兴. Thông tin đối chiếu trong bài: “同学：认识你们，我很高兴。”", "evidence": "同学：认识你们，我很高兴。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R03-2", "lesson": 3, "revision": 2, "title": "Nhận nhầm người qua điện thoại", "text": "同学：喂，您好！您是李文老师吗？\n姐姐：不，我不是老师。我是李文的姐姐。\n同学：对不起！李文忙吗？\n姐姐：她工作很忙。\n同学：谢谢您，再见！\n姐姐：不客气，再见！", "translation": "Bạn học: A lô, xin chào! Cô là giáo viên Lý Văn phải không ạ? Chị gái: Không, tôi không phải giáo viên. Tôi là chị gái của Lý Văn. Bạn học: Em xin lỗi! Lý Văn có bận không ạ? Chị gái: Em ấy rất bận, em ấy làm việc rất bận. Bạn học: Em cảm ơn, em chào chị! Chị gái: Không có gì, tạm biệt em!", "questions": [{"id": "R03-2-v2-1", "question": "她是谁的姐姐？", "answer": "李文", "options": ["李文", "法国人", "泰国人", "你"], "explanation": "Đáp án: 李文. Thông tin đối chiếu trong bài: “我是李文的姐姐。”", "evidence": "我是李文的姐姐。"}, {"id": "R03-2-v2-2", "question": "姐姐是老师吗？", "answer": "不是", "options": ["不忙", "不是", "想", "不想"], "explanation": "Đáp án: 不是. Thông tin đối chiếu trong bài: “姐姐：不，我不是老师。”", "evidence": "姐姐：不，我不是老师。"}, {"id": "R03-2-v2-3", "question": "谁很忙？", "answer": "李文", "options": ["您", "大家", "李文", "你们"], "explanation": "Đáp án: 李文. Thông tin đối chiếu trong bài: “我是李文的姐姐。”", "evidence": "我是李文的姐姐。"}, {"id": "R03-2-v2-4", "question": "李文____很忙。", "answer": "工作", "options": ["认识", "叫", "想", "工作"], "explanation": "Đáp án: 工作. Thông tin đối chiếu trong bài: “姐姐：她工作很忙。”", "evidence": "姐姐：她工作很忙。"}, {"id": "R03-2-v2-5", "question": "同学：____！李文忙吗？", "answer": "对不起", "options": ["对不起", "老师好", "同学们好", "你们好"], "explanation": "Đáp án: 对不起. Thông tin đối chiếu trong bài: “同学：对不起！”", "evidence": "同学：对不起！"}, {"id": "R03-2-v2-6", "question": "姐姐：____，再见！", "answer": "不客气", "options": ["你们好", "不客气", "你好", "您好"], "explanation": "Đáp án: 不客气. Thông tin đối chiếu trong bài: “姐姐：不客气，再见！”", "evidence": "姐姐：不客气，再见！"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R03-3", "lesson": 3, "revision": 2, "title": "Chị gái dạy tiếng Trung", "text": "我是李文。我是学生。我的姐姐是老师，她是中文老师。她的学生是法国人，也是我的同学。姐姐工作很忙。我认识她的学生。", "translation": "Tôi là Lý Văn, là học sinh. Chị gái tôi là giáo viên dạy tiếng Trung. Học sinh của chị là người Pháp và cũng là bạn học của tôi. Chị làm việc rất bận. Tôi quen học sinh của chị.", "questions": [{"id": "R03-3-v2-1", "question": "谁是学生？", "answer": "李文", "options": ["李文", "法国人", "泰国人", "你"], "explanation": "Đáp án: 李文. Thông tin đối chiếu trong bài: “我是李文。”", "evidence": "我是李文。"}, {"id": "R03-3-v2-2", "question": "谁是中文老师？", "answer": "姐姐", "options": ["你们", "姐姐", "李文", "她"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “我的姐姐是老师，她是中文老师。”", "evidence": "我的姐姐是老师，她是中文老师。"}, {"id": "R03-3-v2-3", "question": "姐姐的学生是哪国人？", "answer": "法国人", "options": ["老师", "学生", "法国人", "同学"], "explanation": "Đáp án: 法国人. Thông tin đối chiếu trong bài: “她的学生是法国人，也是我的同学。”", "evidence": "她的学生是法国人，也是我的同学。"}, {"id": "R03-3-v2-4", "question": "姐姐的学生也是我的____。", "answer": "同学", "options": ["你", "老师", "学生", "同学"], "explanation": "Đáp án: 同学. Thông tin đối chiếu trong bài: “她的学生是法国人，也是我的同学。”", "evidence": "她的学生是法国人，也是我的同学。"}, {"id": "R03-3-v2-5", "question": "姐姐工作忙吗？", "answer": "很忙", "options": ["很忙", "不想", "是", "不是"], "explanation": "Đáp án: 很忙. Thông tin đối chiếu trong bài: “姐姐工作很忙。”", "evidence": "姐姐工作很忙。"}, {"id": "R03-3-v2-6", "question": "我认识谁？", "answer": "姐姐的学生", "options": ["中国人", "姐姐的学生", "法国人", "泰国人"], "explanation": "Đáp án: 姐姐的学生. Thông tin đối chiếu trong bài: “我认识她的学生。”", "evidence": "我认识她的学生。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R03-4", "lesson": 3, "revision": 2, "title": "Một cuộc làm quen mới", "text": "她是我的同学，是泰国人。她的姐姐是老师。我的姐姐不是老师，是学生。我们认识她的姐姐。她的姐姐工作不太忙。认识我们，她也很高兴。", "translation": "Cô ấy là bạn học của tôi, là người Thái Lan. Chị gái của cô ấy là giáo viên. Chị gái tôi không phải giáo viên mà là học sinh. Chúng tôi quen chị gái của cô ấy. Chị ấy làm việc không quá bận. Chị ấy cũng rất vui được làm quen với chúng tôi.", "questions": [{"id": "R03-4-v2-1", "question": "我的同学是哪国人？", "answer": "泰国人", "options": ["泰国人", "她", "我们", "中国人"], "explanation": "Đáp án: 泰国人. Thông tin đối chiếu trong bài: “她是我的同学，是泰国人。”", "evidence": "她是我的同学，是泰国人。"}, {"id": "R03-4-v2-2", "question": "谁的姐姐是老师？", "answer": "同学的姐姐", "options": ["我们", "同学的姐姐", "中国人", "法国人"], "explanation": "Đáp án: 同学的姐姐. Thông tin đối chiếu trong bài: “她的姐姐是老师。”", "evidence": "她的姐姐是老师。"}, {"id": "R03-4-v2-3", "question": "我的姐姐是老师吗？", "answer": "不是", "options": ["很忙", "不忙", "不是", "想"], "explanation": "Đáp án: 不是. Thông tin đối chiếu trong bài: “我的姐姐不是老师，是学生。”", "evidence": "我的姐姐不是老师，是学生。"}, {"id": "R03-4-v2-4", "question": "我的姐姐是____。", "answer": "学生", "options": ["法国人", "泰国人", "我", "学生"], "explanation": "Đáp án: 学生. Thông tin đối chiếu trong bài: “我的姐姐不是老师，是学生。”", "evidence": "我的姐姐不是老师，是学生。"}, {"id": "R03-4-v2-5", "question": "我们认识谁？", "answer": "同学的姐姐", "options": ["同学的姐姐", "中国人", "法国人", "泰国人"], "explanation": "Đáp án: 同学的姐姐. Thông tin đối chiếu trong bài: “我们认识她的姐姐。”", "evidence": "我们认识她的姐姐。"}, {"id": "R03-4-v2-6", "question": "她的姐姐工作____忙。", "answer": "不太", "options": ["叫", "不太", "名字", "什么"], "explanation": "Đáp án: 不太. Thông tin đối chiếu trong bài: “她的姐姐工作不太忙。”", "evidence": "她的姐姐工作不太忙。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R03-5", "lesson": 3, "revision": 2, "title": "Người đứng trước lớp", "text": "大家好！我是你们的中文老师。我是中国人。她是我的姐姐，也是老师。她不是中文老师。我们工作很忙。你们是我的学生，我很高兴认识大家！", "translation": "Chào mọi người! Tôi là giáo viên tiếng Trung của các bạn. Tôi là người Trung Quốc. Cô ấy là chị gái của tôi, cũng là giáo viên nhưng không dạy tiếng Trung. Chúng tôi làm việc rất bận. Các bạn là học sinh của tôi, tôi rất vui được làm quen với mọi người!", "questions": [{"id": "R03-5-v2-1", "question": "我是你们的什么老师？", "answer": "中文老师", "options": ["中文老师", "姐姐", "她", "我们"], "explanation": "Đáp án: 中文老师. Thông tin đối chiếu trong bài: “我是你们的中文老师。”", "evidence": "我是你们的中文老师。"}, {"id": "R03-5-v2-2", "question": "我是哪国人？", "answer": "中国人", "options": ["她", "中国人", "我们", "法国人"], "explanation": "Đáp án: 中国人. Thông tin đối chiếu trong bài: “我是中国人。”", "evidence": "我是中国人。"}, {"id": "R03-5-v2-3", "question": "她是我的谁？", "answer": "姐姐", "options": ["你", "老师", "姐姐", "学生"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “她是我的姐姐，也是老师。”", "evidence": "她是我的姐姐，也是老师。"}, {"id": "R03-5-v2-4", "question": "姐姐也是老师吗？", "answer": "是", "options": ["很忙", "不忙", "想", "是"], "explanation": "Đáp án: 是. Thông tin đối chiếu trong bài: “她是我的姐姐，也是老师。”", "evidence": "她是我的姐姐，也是老师。"}, {"id": "R03-5-v2-5", "question": "姐姐是中文老师吗？", "answer": "不是", "options": ["不是", "不想", "很忙", "不忙"], "explanation": "Đáp án: 不是. Thông tin đối chiếu trong bài: “她不是中文老师。”", "evidence": "她不是中文老师。"}, {"id": "R03-5-v2-6", "question": "我们工作____。", "answer": "很忙", "options": ["想", "很忙", "不想", "是"], "explanation": "Đáp án: 很忙. Thông tin đối chiếu trong bài: “我们工作很忙。”", "evidence": "我们工作很忙。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R04-1", "lesson": 4, "revision": 2, "title": "Đếm thành viên gia đình", "text": "我家有五口人：爸爸、妈妈、姐姐、妹妹和我。爸爸妈妈是老师。姐姐十九岁，是学生。妹妹六岁。我没有哥哥，也没有儿子。", "translation": "Gia đình tôi có năm người: bố, mẹ, chị gái, em gái và tôi. Bố mẹ là giáo viên. Chị gái mười chín tuổi, là học sinh. Em gái sáu tuổi. Tôi không có anh trai, cũng không có con trai.", "questions": [{"id": "R04-1-v2-1", "question": "我家有几口人？", "answer": "五口人", "options": ["二十岁", "五口人", "三十九岁", "四十岁"], "explanation": "Đáp án: 五口人. Thông tin đối chiếu trong bài: “我家有五口人：爸爸、妈妈、姐姐、妹妹和我。”", "evidence": "我家有五口人：爸爸、妈妈、姐姐、妹妹和我。"}, {"id": "R04-1-v2-2", "question": "爸爸妈妈是____。", "answer": "老师", "options": ["女儿", "他", "老师", "家人"], "explanation": "Đáp án: 老师. Thông tin đối chiếu trong bài: “爸爸妈妈是老师。”", "evidence": "爸爸妈妈是老师。"}, {"id": "R04-1-v2-3", "question": "姐姐今年多大？", "answer": "十九岁", "options": ["一口人", "三口人", "四口人", "十九岁"], "explanation": "Đáp án: 十九岁. Thông tin đối chiếu trong bài: “姐姐十九岁，是学生。”", "evidence": "姐姐十九岁，是学生。"}, {"id": "R04-1-v2-4", "question": "妹妹今年几岁？", "answer": "六岁", "options": ["六岁", "十岁", "十二岁", "十九岁"], "explanation": "Đáp án: 六岁. Thông tin đối chiếu trong bài: “妹妹六岁。”", "evidence": "妹妹六岁。"}, {"id": "R04-1-v2-5", "question": "我有哥哥吗？", "answer": "没有", "options": ["很忙", "没有", "不忙", "想"], "explanation": "Đáp án: 没有. Thông tin đối chiếu trong bài: “我没有哥哥，也没有儿子。”", "evidence": "我没有哥哥，也没有儿子。"}, {"id": "R04-1-v2-6", "question": "我有儿子吗？", "answer": "没有", "options": ["想", "不想", "没有", "不大"], "explanation": "Đáp án: 没有. Thông tin đối chiếu trong bài: “我没有哥哥，也没有儿子。”", "evidence": "我没有哥哥，也没有儿子。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R04-2", "lesson": 4, "revision": 2, "title": "So sánh tuổi của hai người con", "text": "老师：您有几个孩子？\n妈妈：我有两个孩子。儿子今年八岁，女儿今年四岁。\n老师：儿子是学生吗？\n妈妈：是。女儿不是学生。您呢？\n老师：我有一个女儿，今年六岁。", "translation": "Giáo viên: Chị có mấy người con? Mẹ: Tôi có hai con. Con trai năm nay tám tuổi, con gái bốn tuổi. Giáo viên: Con trai chị là học sinh à? Mẹ: Đúng vậy. Con gái tôi chưa phải học sinh. Còn thầy/cô thì sao? Giáo viên: Tôi có một con gái, năm nay sáu tuổi.", "questions": [{"id": "R04-2-v2-1", "question": "妈妈有几个孩子？", "answer": "两个", "options": ["六个", "两个", "七个", "八个"], "explanation": "Đáp án: 两个. Thông tin đối chiếu trong bài: “妈妈：我有两个孩子。”", "evidence": "妈妈：我有两个孩子。"}, {"id": "R04-2-v2-2", "question": "儿子今年几岁？", "answer": "八岁", "options": ["三口人", "四口人", "八岁", "五口人"], "explanation": "Đáp án: 八岁. Thông tin đối chiếu trong bài: “儿子今年八岁，女儿今年四岁。”", "evidence": "儿子今年八岁，女儿今年四岁。"}, {"id": "R04-2-v2-3", "question": "女儿今年几岁？", "answer": "四岁", "options": ["八岁", "十岁", "十二岁", "四岁"], "explanation": "Đáp án: 四岁. Thông tin đối chiếu trong bài: “儿子今年八岁，女儿今年四岁。”", "evidence": "儿子今年八岁，女儿今年四岁。"}, {"id": "R04-2-v2-4", "question": "儿子是学生吗？", "answer": "是", "options": ["是", "想", "不想", "不大"], "explanation": "Đáp án: 是. Thông tin đối chiếu trong bài: “女儿不是学生。”", "evidence": "女儿不是学生。"}, {"id": "R04-2-v2-5", "question": "老师有几个女儿？", "answer": "一个", "options": ["四十岁", "一个", "两个", "三个"], "explanation": "Đáp án: 一个. Thông tin đối chiếu trong bài: “老师：我有一个女儿，今年六岁。”", "evidence": "老师：我有一个女儿，今年六岁。"}, {"id": "R04-2-v2-6", "question": "老师的女儿几岁？", "answer": "六岁", "options": ["十个", "一口人", "六岁", "三口人"], "explanation": "Đáp án: 六岁. Thông tin đối chiếu trong bài: “老师：我有一个女儿，今年六岁。”", "evidence": "老师：我有一个女儿，今年六岁。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R04-3", "lesson": 4, "revision": 2, "title": "Phỏng vấn một người anh", "text": "我叫李文，今年十岁。我有一个哥哥，他二十岁。哥哥是学生，不是老师。妈妈是法国人，爸爸是中国人。我的家不大。你家有几口人呢？", "translation": "Tôi tên là Lý Văn, năm nay mười tuổi. Tôi có một anh trai, anh ấy hai mươi tuổi. Anh trai là học sinh, không phải giáo viên. Mẹ là người Pháp, bố là người Trung Quốc. Nhà tôi không lớn. Gia đình bạn có mấy người?", "questions": [{"id": "R04-3-v2-1", "question": "李文今年多大？", "answer": "十岁", "options": ["三十九岁", "十岁", "一个", "两个"], "explanation": "Đáp án: 十岁. Thông tin đối chiếu trong bài: “我叫李文，今年十岁。”", "evidence": "我叫李文，今年十岁。"}, {"id": "R04-3-v2-2", "question": "李文有几个哥哥？", "answer": "一个", "options": ["五口人", "六口人", "一个", "六岁"], "explanation": "Đáp án: 一个. Thông tin đối chiếu trong bài: “我有一个哥哥，他二十岁。”", "evidence": "我有一个哥哥，他二十岁。"}, {"id": "R04-3-v2-3", "question": "哥哥多大？", "answer": "二十岁", "options": ["两个", "三个", "四个", "二十岁"], "explanation": "Đáp án: 二十岁. Thông tin đối chiếu trong bài: “我有一个哥哥，他二十岁。”", "evidence": "我有一个哥哥，他二十岁。"}, {"id": "R04-3-v2-4", "question": "哥哥是老师吗？", "answer": "不是", "options": ["不是", "想", "不想", "不大"], "explanation": "Đáp án: 不是. Thông tin đối chiếu trong bài: “哥哥是学生，不是老师。”", "evidence": "哥哥是学生，不是老师。"}, {"id": "R04-3-v2-5", "question": "妈妈是哪国人？", "answer": "法国人", "options": ["中国人", "法国人", "泰国人", "我"], "explanation": "Đáp án: 法国人. Thông tin đối chiếu trong bài: “妈妈是法国人，爸爸是中国人。”", "evidence": "妈妈是法国人，爸爸是中国人。"}, {"id": "R04-3-v2-6", "question": "爸爸是哪国人？", "answer": "中国人", "options": ["我们", "爸爸", "中国人", "妈妈"], "explanation": "Đáp án: 中国人. Thông tin đối chiếu trong bài: “妈妈是法国人，爸爸是中国人。”", "evidence": "妈妈是法国人，爸爸是中国人。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R04-4", "lesson": 4, "revision": 2, "title": "Hai thế hệ làm nghề dạy học", "text": "我爸爸今年四十岁，妈妈三十九岁。爸爸是中文老师，妈妈也是老师。姐姐十九岁，也是老师。我今年八岁，是学生。我有老师，也有同学。", "translation": "Bố tôi năm nay bốn mươi tuổi, mẹ ba mươi chín tuổi. Bố là giáo viên tiếng Trung, mẹ cũng là giáo viên. Chị gái mười chín tuổi, cũng là giáo viên. Tôi năm nay tám tuổi, là học sinh. Tôi có thầy cô và bạn học.", "questions": [{"id": "R04-4-v2-1", "question": "爸爸今年多大？", "answer": "四十岁", "options": ["二十岁", "四十岁", "三十九岁", "一个"], "explanation": "Đáp án: 四十岁. Thông tin đối chiếu trong bài: “我爸爸今年四十岁，妈妈三十九岁。”", "evidence": "我爸爸今年四十岁，妈妈三十九岁。"}, {"id": "R04-4-v2-2", "question": "妈妈今年多大？", "answer": "三十九岁", "options": ["两个", "三个", "三十九岁", "四个"], "explanation": "Đáp án: 三十九岁. Thông tin đối chiếu trong bài: “我爸爸今年四十岁，妈妈三十九岁。”", "evidence": "我爸爸今年四十岁，妈妈三十九岁。"}, {"id": "R04-4-v2-3", "question": "爸爸是什么老师？", "answer": "中文老师", "options": ["他", "家人", "中国人", "中文老师"], "explanation": "Đáp án: 中文老师. Thông tin đối chiếu trong bài: “爸爸是中文老师，妈妈也是老师。”", "evidence": "爸爸是中文老师，妈妈也是老师。"}, {"id": "R04-4-v2-4", "question": "妈妈也是老师吗？", "answer": "是", "options": ["是", "有", "没有", "很忙"], "explanation": "Đáp án: 是. Thông tin đối chiếu trong bài: “爸爸是中文老师，妈妈也是老师。”", "evidence": "爸爸是中文老师，妈妈也是老师。"}, {"id": "R04-4-v2-5", "question": "姐姐今年多大？", "answer": "十九岁", "options": ["八个", "十九岁", "九个", "十个"], "explanation": "Đáp án: 十九岁. Thông tin đối chiếu trong bài: “我爸爸今年四十岁，妈妈三十九岁。”", "evidence": "我爸爸今年四十岁，妈妈三十九岁。"}, {"id": "R04-4-v2-6", "question": "我今年几岁？", "answer": "八岁", "options": ["十二岁", "十九岁", "八岁", "二十岁"], "explanation": "Đáp án: 八岁. Thông tin đối chiếu trong bài: “我今年八岁，是学生。”", "evidence": "我今年八岁，是学生。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R04-5", "lesson": 4, "revision": 2, "title": "Một gia đình ít người", "text": "同学：你家有几口人？\n李文：三口人，爸爸、妈妈和我。\n同学：你有姐姐吗？\n李文：没有。你呢？\n同学：我有两个姐姐。我家有五口人。\n李文：你家人多！", "translation": "Bạn học: Nhà bạn có mấy người? Lý Văn: Ba người: bố, mẹ và mình. Bạn học: Bạn có chị gái không? Lý Văn: Không. Còn bạn? Bạn học: Mình có hai chị gái. Nhà mình có năm người. Lý Văn: Nhà bạn đông người thật!", "questions": [{"id": "R04-5-v2-1", "question": "李文家有几口人？", "answer": "三口人", "options": ["六口人", "三口人", "六岁", "八岁"], "explanation": "Đáp án: 三口人. Thông tin đối chiếu trong bài: “李文：三口人，爸爸、妈妈和我。”", "evidence": "李文：三口人，爸爸、妈妈和我。"}, {"id": "R04-5-v2-2", "question": "谁没有姐姐？", "answer": "李文", "options": ["女儿", "他", "李文", "家人"], "explanation": "Đáp án: 李文. Thông tin đối chiếu trong bài: “李文：没有。”", "evidence": "李文：没有。"}, {"id": "R04-5-v2-3", "question": "同学有几个姐姐？", "answer": "两个", "options": ["四个", "五个", "六个", "两个"], "explanation": "Đáp án: 两个. Thông tin đối chiếu trong bài: “同学：我有两个姐姐。”", "evidence": "同学：我有两个姐姐。"}, {"id": "R04-5-v2-4", "question": "同学家有几口人？", "answer": "五口人", "options": ["五口人", "六岁", "八岁", "十岁"], "explanation": "Đáp án: 五口人. Thông tin đối chiếu trong bài: “我家有五口人。”", "evidence": "我家有五口人。"}, {"id": "R04-5-v2-5", "question": "李文有妈妈吗？", "answer": "有", "options": ["不大", "有", "很多", "是"], "explanation": "Đáp án: 有. Thông tin đối chiếu trong bài: “李文：没有。”", "evidence": "李文：没有。"}, {"id": "R04-5-v2-6", "question": "李文：你家人____！", "answer": "多", "options": ["什么", "高兴", "多", "太"], "explanation": "Đáp án: 多. Thông tin đối chiếu trong bài: “李文：你家人多！”", "evidence": "李文：你家人多！"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R05-1", "lesson": 5, "revision": 2, "title": "Ngày nghỉ và món ăn", "text": "今天星期日，我休息。妈妈也休息，爸爸不休息。我会做面条儿，妈妈会做饺子。今天我想做面条儿。妈妈喜欢饺子，姐姐也喜欢饺子。爸爸下班，妈妈做饭。", "translation": "Hôm nay là Chủ nhật, tôi nghỉ. Mẹ cũng nghỉ nhưng bố không nghỉ. Tôi biết làm mì, mẹ biết làm bánh sủi cảo. Hôm nay tôi muốn làm mì. Mẹ thích sủi cảo, chị gái cũng thích. Khi bố tan làm, mẹ nấu cơm.", "questions": [{"id": "R05-1-v2-1", "question": "今天星期几？", "answer": "星期日", "options": ["星期四", "星期五", "星期日", "星期六"], "explanation": "Đáp án: 星期日. Thông tin đối chiếu trong bài: “今天星期日，我休息。”", "evidence": "今天星期日，我休息。"}, {"id": "R05-1-v2-2", "question": "谁不休息？", "answer": "爸爸", "options": ["家人", "中国人", "法国人", "爸爸"], "explanation": "Đáp án: 爸爸. Thông tin đối chiếu trong bài: “妈妈也休息，爸爸不休息。”", "evidence": "妈妈也休息，爸爸不休息。"}, {"id": "R05-1-v2-3", "question": "我会做什么？", "answer": "面条儿", "options": ["面条儿", "菜和饺子", "菜", "饺子"], "explanation": "Đáp án: 面条儿. Thông tin đối chiếu trong bài: “我会做面条儿，妈妈会做饺子。”", "evidence": "我会做面条儿，妈妈会做饺子。"}, {"id": "R05-1-v2-4", "question": "妈妈会做什么？", "answer": "饺子", "options": ["面条儿", "饺子", "一些菜", "面条儿和菜"], "explanation": "Đáp án: 饺子. Thông tin đối chiếu trong bài: “我会做面条儿，妈妈会做饺子。”", "evidence": "我会做面条儿，妈妈会做饺子。"}, {"id": "R05-1-v2-5", "question": "谁也喜欢饺子？", "answer": "姐姐", "options": ["你", "老师", "姐姐", "学生"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “妈妈喜欢饺子，姐姐也喜欢饺子。”", "evidence": "妈妈喜欢饺子，姐姐也喜欢饺子。"}, {"id": "R05-1-v2-6", "question": "爸爸下班，谁做饭？", "answer": "妈妈", "options": ["姐姐", "她", "我们", "妈妈"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “爸爸下班，妈妈做饭。”", "evidence": "爸爸下班，妈妈做饭。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R05-2", "lesson": 5, "revision": 2, "title": "Chiếc máy tính mới", "text": "这是我的新电脑，它很好看。姐姐也有电脑，她的电脑不是新的。我很喜欢新电脑。今天星期三，姐姐下班休息。我做一些菜，姐姐做面条儿。妈妈真高兴！", "translation": "Đây là máy tính mới của tôi, nó rất đẹp. Chị gái cũng có máy tính nhưng máy của chị không mới. Tôi rất thích máy tính mới. Hôm nay là thứ Tư, chị gái tan làm rồi nghỉ. Tôi làm một ít món ăn, chị làm mì. Mẹ rất vui!", "questions": [{"id": "R05-2-v2-1", "question": "什么是新的？", "answer": "我的电脑", "options": ["饺子", "面条儿", "我的电脑", "名字"], "explanation": "Đáp án: 我的电脑. Thông tin đối chiếu trong bài: “这是我的新电脑，它很好看。”", "evidence": "这是我的新电脑，它很好看。"}, {"id": "R05-2-v2-2", "question": "姐姐有电脑吗？", "answer": "有", "options": ["休息", "不休息", "不大", "有"], "explanation": "Đáp án: 有. Thông tin đối chiếu trong bài: “姐姐也有电脑，她的电脑不是新的。”", "evidence": "姐姐也有电脑，她的电脑不是新的。"}, {"id": "R05-2-v2-3", "question": "姐姐的电脑是新的吗？", "answer": "不是", "options": ["不是", "有", "没有", "很忙"], "explanation": "Đáp án: 不是. Thông tin đối chiếu trong bài: “姐姐也有电脑，她的电脑不是新的。”", "evidence": "姐姐也有电脑，她的电脑不是新的。"}, {"id": "R05-2-v2-4", "question": "今天星期几？", "answer": "星期三", "options": ["三月八号", "星期三", "四月一号", "五月三号"], "explanation": "Đáp án: 星期三. Thông tin đối chiếu trong bài: “今天星期三，姐姐下班休息。”", "evidence": "今天星期三，姐姐下班休息。"}, {"id": "R05-2-v2-5", "question": "我做什么？", "answer": "一些菜", "options": ["面条儿", "饺子和面条儿", "一些菜", "菜和饺子"], "explanation": "Đáp án: 一些菜. Thông tin đối chiếu trong bài: “我做一些菜，姐姐做面条儿。”", "evidence": "我做一些菜，姐姐做面条儿。"}, {"id": "R05-2-v2-6", "question": "谁做面条儿？", "answer": "姐姐", "options": ["老师", "学生", "同学", "姐姐"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “我做一些菜，姐姐做面条儿。”", "evidence": "我做一些菜，姐姐做面条儿。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R05-3", "lesson": 5, "revision": 2, "title": "Bữa cơm ngày 8 tháng 3", "text": "今天三月八号，爸爸今年四十岁。今天星期一，爸爸下班，妈妈做饭。我会做菜，姐姐会做饺子。我和姐姐做饭，妈妈很高兴。爸爸喜欢饺子。", "translation": "Hôm nay là ngày 8 tháng 3. Bố năm nay bốn mươi tuổi. Hôm nay là thứ Hai. Khi bố tan làm, mẹ nấu cơm. Tôi biết làm món ăn, chị gái biết làm sủi cảo. Tôi và chị cùng nấu, mẹ rất vui. Bố thích sủi cảo.", "questions": [{"id": "R05-3-v2-1", "question": "今天几月几号？", "answer": "三月八号", "options": ["五月三号", "八月十号", "三月八号", "今天"], "explanation": "Đáp án: 三月八号. Thông tin đối chiếu trong bài: “今天三月八号，爸爸今年四十岁。”", "evidence": "今天三月八号，爸爸今年四十岁。"}, {"id": "R05-3-v2-2", "question": "爸爸今年多大？", "a
