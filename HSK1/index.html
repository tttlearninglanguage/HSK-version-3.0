if(s.index>=s.questions.length){finishGame();return}
const sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));const missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];s.missing=missing;s.target=sentence;
const eligible=lesson.words.filter(x=>x.hanzi!==missing&&x.hanzi&&x.hanzi!==w.hanzi);const extras=L.filter(x=>x.id<=lesson.id).flatMap(x=>x.words).filter(x=>x.hanzi!==missing);
const opts=[missing,...shuffle([...eligible,...extras]).map(x=>x.hanzi).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3)];
while(opts.length<4){const fallback=['我','你','是','有','不','在','的','了','吗','很'];const next=fallback.find(x=>!opts.includes(x));if(!next)break;opts.push(next)}s.clozeOptions=shuffle(opts);
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">Điền từ vào câu · Bài ${lesson.id}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><div class="answer-area"><p class="muted">Chọn một trong 4 đáp án để hoàn thành câu:</p><h2 class="hanzi" style="font-size:34px;line-height:1.9">${esc(sentence.replace(missing,'＿＿＿'))}</h2><div class="cloze-options">${s.clozeOptions.map((o,i)=>`<button onclick="answerCloze(${i})">${esc(o)}</button>`).join('')}</div></div><div id="feedback"></div></div>`;
};
window.answerCloze=function(i){let s=session;if(s.answered)return;const chosen=s.clozeOptions[i];s.answered=true;const ok=chosen===s.missing;if(ok)s.correct++;else store.wrong[s.questions[s.index].id]=(store.wrong[s.questions[s.index].id]||0)+1;save();document.querySelectorAll('.cloze-options button').forEach((b,j)=>{b.disabled=true;if(s.clozeOptions[j]===s.missing)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});let w=s.questions[s.index];$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác!':'✗ Chưa chính xác'}</strong><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation||'')}</p><p>Đáp án: <b class="hanzi">${esc(s.missing)}</b></p></div><button class="primary" onclick="session.index++;session.answered=false;renderAdvanced()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`};
const oldStart=startGame;
startGame=function(mode,custom){if(mode!=='grammar')return oldStart(mode,custom);
const g=lesson.grammar.filter(x=>x.details?.some(y=>y.startsWith('Ví dụ:')));
const qs=[];
for(const gram of g){let ex=(gram.details.find(x=>x.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,'').replace(/\s*[（(][^()（）]*[)）]/g,'').trim();if(!ex)continue;
let formula=(gram.details.find(x=>x.startsWith('Công thức:'))||'').replace(/^Công thức:\s*/,'');
let preferred=['正在','因为','所以','还是','或者','已经','可以','没有','什么','怎么','多少','几','了','吗','呢','的','是','在','有','不','也','都','很','比','会','能','要','和'];
let target=preferred.find(x=>ex.includes(x)&&((gram.name+' '+formula).includes(x)))||preferred.find(x=>ex.includes(x));
if(!target){const hits=lesson.words.filter(w=>ex.includes(w.hanzi));target=hits[0]?.hanzi}
if(!target)continue;
qs.push({id:'grammar-'+lesson.id+'-'+qs.length,grammar:gram,example:ex,translation:(gram.details.find(x=>x.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),target,formula});
}
if(!qs.length){alert('Bài này chưa có ví dụ ngữ pháp đủ rõ để tạo câu hỏi trắc nghiệm. Hãy xem phần Ngữ pháp của bài.');return}
const amount=Math.min(getLimit(),qs.length);let bank=[];for(let i=0;i<amount;i++)bank.push({...qs[i%qs.length],variant:i});
session={mode:'grammar',questions:shuffle(bank),index:0,correct:0,answered:false,pool:lesson.words};renderGrammarChallenge();
};
function renderGrammarChallenge(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],target=w.target;
const current=L.filter(l=>l.id<=lesson.id).flatMap(l=>l.words).map(v=>v.hanzi);
const distractors=['的','了','吗','呢','是','有','在','不','很','也','都','和','会','能','要','比','几','什么','怎么','多少','正在','没有',...current].filter((x,i,a)=>x!==target&&a.indexOf(x)===i);
s.grammarOptions=shuffle([target,...shuffle(distractors).slice(0,3)]);
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><span class="pill">Thử thách ngữ pháp · Bài ${lesson.id}</span><span class="pill">${s.index+1}/${s.questions.length}</span><div class="answer-area"><h3>${esc(w.grammar.name)}</h3><p class="muted">${esc(w.formula)}</p><p>Chọn từ thích hợp để hoàn thành câu:</p><h2 class="hanzi" style="font-size:34px">${esc(w.example.replace(target,'＿＿＿'))}</h2><div class="cloze-options">${s.grammarOptions.map((x,i)=>`<button onclick="answerGrammar(${i})">${esc(x)}</button>`).join('')}</div></div><div id="feedback"></div></div>`;
}
window.answerGrammar=function(i){let s=session;if(s.answered)return;let w=s.questions[s.index],ok=s.grammarOptions[i]===w.target;s.answered=true;if(ok)s.correct++;save();document.querySelectorAll('.cloze-options button').forEach((b,j)=>{b.disabled=true;if(s.grammarOptions[j]===w.target)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác':'✗ Chưa đúng'}</strong><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p>${esc(w.grammar.details.join(' · '))}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderGrammarChallenge()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`};
window.startGuidedWriting=function(){session={mode:'guided-writing'};renderGuidedWriting()};
window.renderGuidedWriting=function(){const current=lesson.words,prior=L.filter(l=>l.id<lesson.id).flatMap(l=>l.words);const selected=current.filter(w=>w.example).slice(0,8),priorSelected=prior.filter(w=>w.example).slice(-8);
const title=lesson.subtitle||lesson.title;const key='hsk-guided-v2-'+lesson.id;const draft=localStorage.getItem(key)||'';
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Quay lại trò chơi</button><div class="panel"><span class="pill">Bài ${lesson.id} · Luyện viết có hướng dẫn</span><h2>✍️ Chủ đề: ${esc(title)}</h2><p>Viết một đoạn tiếng Trung khoảng 3–6 câu theo chủ đề bài học. Ưu tiên dùng từ vựng mới của bài ${lesson.id}; có thể sử dụng các từ và cấu trúc đã học ở bài 1–${lesson.id}.</p><div class="answer-area"><h3>1. Từ vựng của bài này</h3><div class="guided-words">${selected.map(w=>`<span>${esc(w.hanzi)} · ${esc(w.meaning)}</span>`).join('')}</div><h3>2. Từ vựng ôn tập từ các bài trước</h3><div class="guided-words">${priorSelected.length?priorSelected.map(w=>`<span>${esc(w.hanzi)} · ${esc(w.meaning)}</span>`).join(''):'<p>Bài đầu tiên: chưa có từ vựng của bài trước.</p>'}</div><h3>3. Gợi ý triển khai nội dung</h3><p>• Câu 1: Giới thiệu người, vật hoặc tình huống liên quan đến chủ đề.<br>• Câu 2–3: Bổ sung thông tin, hành động hoặc sở thích bằng từ mới.<br>• Câu 4–5: Đặt câu hỏi, nêu nhận xét hoặc kết thúc câu chuyện.<br>• Kiểm tra trật tự từ và các cấu trúc ngữ pháp đã học.</p><h3>4. Viết đoạn văn của bạn</h3><textarea id="guidedText" placeholder="在这里写你的中文段落……">${esc(draft)}</textarea><div class="toolbar"><button class="primary" onclick="saveGuidedWriting()">💾 Lưu bài viết</button><button onclick="showGuidedHints()">💡 Xem câu ví dụ và ngữ pháp</button><button onclick="speak(document.querySelector('#guidedText').value)">🔊 Nghe bài viết</button></div><div id="guidedHints"></div><p class="muted">Bài viết mở, không chấm ngữ nghĩa/phát âm tự động. Nội dung gợi ý được lấy từ từ vựng và ví dụ của bài học.</p></div></div>`;
};
window.saveGuidedWriting=function(){localStorage.setItem('hsk-guided-v2-'+lesson.id,$('#guidedText').value);alert('Đã lưu bài viết trên trình duyệt này.')};
window.showGuidedHints=function(){const grammar=lesson.grammar.filter(g=>g.details?.some(d=>d.startsWith('Ví dụ:')));$('#guidedHints').innerHTML=`<div class="result"><h3>Ví dụ tham khảo</h3>${lesson.words.filter(w=>w.example).slice(0,5).map(w=>`<p class="hanzi" style="font-size:24px">${esc(w.example)}</p><p>${esc(w.translation)}</p>`).join('')}<h3>Ngữ pháp bài ${lesson.id}</h3>${grammar.map(g=>`<p><b>${esc(g.name)}</b>: ${esc(g.details.join(' · '))}</p>`).join('')||'<p>Bài này không liệt kê mục ngữ pháp riêng trong tài liệu.</p>'}</div>`};
/* Trình duyệt bắt buộc tự quản lý quyền micro; không có cách bỏ qua yêu cầu này. */

recordSpeech=function(){const note=$('#recognized');if(note)note.textContent='Nếu đây là lần đầu, trình duyệt có thể yêu cầu cấp quyền micro. Bạn có thể chọn “Cho phép” và ghi nhớ quyền cho website. Không thể bỏ qua bước bảo mật này.';oldRecord()};
/* Nút quay lại thống nhất, cả các màn hình chưa có nút riêng. */
const back=document.createElement('button');back.id='hskBack';back.textContent='← Quay lại';back.onclick=()=>{if(session&&lesson){openLesson(lesson.id,'games')}else if(lesson){home()}else home()};document.body.appendChild(back);

new MutationObserver(syncBack).observe($('#app'),{childList:true,subtree:false});syncBack();
})();

const HSK_GRAMMAR_UPDATED={"1":[],"2":[{"name":"Trật tự từ cơ bản trong câu","formula":"Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","explanation":"Trong tiếng Trung, câu đơn thường tuân theo trật tự 「Chủ ngữ」 đứng trước, tiếp theo là 「Vị ngữ」 (thường là động từ) và cuối cùng là 「Tân ngữ」. Đây là cấu trúc cơ bản nhất giúp bạn hình thành câu hoàn chỉnh trong giao tiếp hàng ngày.","tip":"Hãy nhớ rằng động từ luôn đứng trước tân ngữ, khác với một số cấu trúc trong tiếng Việt.","note":"Không được đảo lộn vị trí của động từ và tân ngữ vì sẽ làm thay đổi ý nghĩa hoặc sai ngữ pháp.","examples":[{"hanzi":"我叫陈天中。","pinyin":"wǒ jiào chén tiān zhōng","meaning":"Tôi tên là Trần Thiên Trung."},{"hanzi":"我叫白家月。","pinyin":"wǒ jiào bái jiā yuè","meaning":"Tôi tên là Bạch Gia Nguyệt."},{"hanzi":"我是学生。","pinyin":"wǒ shì xué shēng","meaning":"Tôi là học sinh."}],"quiz":[{"question":"Công thức đúng của “Trật tự từ cơ bản trong câu” là gì?","options":["Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ","Câu trần thuật + 吗?"],"answer":"Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","explanation":"Trong tiếng Trung, câu đơn thường tuân theo trật tự 「Chủ ngữ」 đứng trước, tiếp theo là 「Vị ngữ」 (thường là động từ) và cuối cùng là 「Tân ngữ」. Đây là cấu trúc cơ bản nhất giúp bạn hình thành câu hoàn chỉnh trong giao tiếp hàng ngày."},{"question":"Ví dụ nào minh họa “Trật tự từ cơ bản trong câu”?","options":["我叫陈天中。","我是学生。","他是中国人。","我的中文老师"],"answer":"我叫陈天中。","explanation":"我叫陈天中。 — Tôi tên là Trần Thiên Trung."},{"question":"“我叫陈天中。” có nghĩa tiếng Việt nào?","options":["Tôi tên là Trần Thiên Trung.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi tên là Trần Thiên Trung.","explanation":"wǒ jiào chén tiān zhōng — Tôi tên là Trần Thiên Trung."},{"question":"Cấu trúc “Chủ ngữ + Vị ngữ (động từ) + Tân ngữ” thuộc điểm ngữ pháp nào?","options":["Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的","Câu hỏi nghi vấn với 吗"],"answer":"Trật tự từ cơ bản trong câu","explanation":"Trong tiếng Trung, câu đơn thường tuân theo trật tự 「Chủ ngữ」 đứng trước, tiếp theo là 「Vị ngữ」 (thường là động từ) và cuối cùng là 「Tân ngữ」. Đây là cấu trúc cơ bản nhất giúp bạn hình thành câu hoàn chỉnh trong giao tiếp hàng ngày."},{"question":"Câu “我叫陈天中。” minh họa điểm ngữ pháp nào?","options":["Trật tự từ cơ bản trong câu","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)"],"answer":"Trật tự từ cơ bản trong câu","explanation":"Không được đảo lộn vị trí của động từ và tân ngữ vì sẽ làm thay đổi ý nghĩa hoặc sai ngữ pháp."}]}],"3":[{"name":"Câu chữ 「是」 (shì) - Câu khẳng định","formula":"S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","explanation":"Từ 「是」 đóng vai trò như động từ \"là\" trong tiếng Việt, dùng để kết nối chủ ngữ với danh từ hoặc cụm danh từ. Cấu trúc này giúp xác định danh tính, nghề nghiệp, quốc tịch hoặc sự vật một cách rõ ràng.","tip":"Khi muốn phủ định, bạn chỉ cần thêm 「不」 trước 「是」 để thành 「不是」 (không phải là).","note":"Tuyệt đối không dùng 「是」 đứng trước tính từ (ví dụ: không nói 「是好」 mà chỉ nói 「很好」).","examples":[{"hanzi":"我是学生。","pinyin":"wǒ shì xué shēng","meaning":"Tôi là học sinh."},{"hanzi":"他是中国人。","pinyin":"tā shì zhōng guó rén","meaning":"Anh ấy là người Trung Quốc."}],"quiz":[{"question":"Công thức đúng của “Câu chữ 「是」 (shì) - Câu khẳng định” là gì?","options":["S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","Định ngữ + 的 + Trung tâm ngữ","Câu trần thuật + 吗?"],"answer":"S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","explanation":"Từ 「是」 đóng vai trò như động từ \"là\" trong tiếng Việt, dùng để kết nối chủ ngữ với danh từ hoặc cụm danh từ. Cấu trúc này giúp xác định danh tính, nghề nghiệp, quốc tịch hoặc sự vật một cách rõ ràng."},{"question":"Ví dụ nào minh họa “Câu chữ 「是」 (shì) - Câu khẳng định”?","options":["我是学生。","我叫陈天中。","我叫白家月。","我的中文老师"],"answer":"我是学生。","explanation":"我是学生。 — Tôi là học sinh."},{"question":"“我是学生。” có nghĩa tiếng Việt nào?","options":["Tôi là học sinh.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi là học sinh.","explanation":"wǒ shì xué shēng — Tôi là học sinh."},{"question":"Cấu trúc “S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)” thuộc điểm ngữ pháp nào?","options":["Câu chữ 「是」 (shì) - Câu khẳng định","Trật tự từ cơ bản trong câu","Trợ từ kết cấu 的","Câu hỏi nghi vấn với 吗"],"answer":"Câu chữ 「是」 (shì) - Câu khẳng định","explanation":"Từ 「是」 đóng vai trò như động từ \"là\" trong tiếng Việt, dùng để kết nối chủ ngữ với danh từ hoặc cụm danh từ. Cấu trúc này giúp xác định danh tính, nghề nghiệp, quốc tịch hoặc sự vật một cách rõ ràng."},{"question":"Câu “我是学生。” minh họa điểm ngữ pháp nào?","options":["Câu chữ 「是」 (shì) - Câu khẳng định","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)"],"answer":"Câu chữ 「是」 (shì) - Câu khẳng định","explanation":"Tuyệt đối không dùng 「是」 đứng trước tính từ (ví dụ: không nói 「是好」 mà chỉ nói 「很好」)."}]},{"name":"Trợ từ kết cấu 的","formula":"Định ngữ + 的 + Trung tâm ngữ","explanation":"Trợ từ 「的」 được dùng để kết nối định ngữ và trung tâm ngữ, biểu thị quan hệ sở hữu hoặc tính chất. Bạn đặt từ chỉ sở hữu hoặc đặc điểm lên trước, thêm 「的」 rồi mới đến danh từ chính.","tip":"Nếu định ngữ là người thân (như 'mẹ', 'anh trai') hoặc danh từ chỉ đơn vị công tác, bạn có thể lược bỏ 「的」.","note":"Đừng quên 「的」 khi định ngữ là danh từ hoặc đại từ chỉ người khác, vì nó giúp làm rõ mối quan hệ giữa hai danh từ.","examples":[{"hanzi":"我的中文老师","pinyin":"wǒ de zhōng wén lǎo shī","meaning":"Giáo viên tiếng Trung của tôi"},{"hanzi":"她的中文老师","pinyin":"tā de zhōng wén lǎo shī","meaning":"Giáo viên tiếng Trung của cô ấy"}],"quiz":[{"question":"Công thức đúng của “Trợ từ kết cấu 的” là gì?","options":["Định ngữ + 的 + Trung tâm ngữ","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị","A..., B 呢? (Cấu trúc hỏi tỉnh lược)"],"answer":"Định ngữ + 的 + Trung tâm ngữ","explanation":"Trợ từ 「的」 được dùng để kết nối định ngữ và trung tâm ngữ, biểu thị quan hệ sở hữu hoặc tính chất. Bạn đặt từ chỉ sở hữu hoặc đặc điểm lên trước, thêm 「的」 rồi mới đến danh từ chính."},{"question":"Ví dụ nào minh họa “Trợ từ kết cấu 的”?","options":["我的中文老师","我是学生。","他是中国人。","你是学生吗？"],"answer":"我的中文老师","explanation":"我的中文老师 — Giáo viên tiếng Trung của tôi"},{"question":"“我的中文老师” có nghĩa tiếng Việt nào?","options":["Giáo viên tiếng Trung của tôi","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Bạn có phải là học sinh không?"],"answer":"Giáo viên tiếng Trung của tôi","explanation":"wǒ de zhōng wén lǎo shī — Giáo viên tiếng Trung của tôi"},{"question":"Cấu trúc “Định ngữ + 的 + Trung tâm ngữ” thuộc điểm ngữ pháp nào?","options":["Trợ từ kết cấu 的","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số","Trợ từ nghi vấn 呢 (hỏi lại tình huống)"],"answer":"Trợ từ kết cấu 的","explanation":"Trợ từ 「的」 được dùng để kết nối định ngữ và trung tâm ngữ, biểu thị quan hệ sở hữu hoặc tính chất. Bạn đặt từ chỉ sở hữu hoặc đặc điểm lên trước, thêm 「的」 rồi mới đến danh từ chính."},{"question":"Câu “我的中文老师” minh họa điểm ngữ pháp nào?","options":["Trợ từ kết cấu 的","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể","Trợ từ ngữ khí 'ba' dùng để đề nghị"],"answer":"Trợ từ kết cấu 的","explanation":"Đừng quên 「的」 khi định ngữ là danh từ hoặc đại từ chỉ người khác, vì nó giúp làm rõ mối quan hệ giữa hai danh từ."}]},{"name":"Câu hỏi nghi vấn với 吗","formula":"Câu trần thuật + 吗?","explanation":"Để biến một câu trần thuật thành câu hỏi \"Có/Không\", bạn chỉ cần thêm trợ từ ngữ khí 「吗」 vào cuối câu. Cấu trúc này dùng để hỏi về sự việc mà bạn muốn xác nhận lại thông tin. Bạn không cần thay đổi trật tự từ trong câu.","tip":"Khi trả lời câu hỏi có 「吗」, bạn có thể trả lời bằng cách lặp lại động từ hoặc dùng 「是/不是」, 「有/没有」.","note":"Không được dùng 「吗」 trong câu đã có các từ nghi vấn khác như 「什么」(cái gì), 「谁」(ai), 「哪儿」(đâu).","examples":[{"hanzi":"你是学生吗？","pinyin":"nǐ shì xué shēng ma","meaning":"Bạn có phải là học sinh không?"},{"hanzi":"你工作还忙吗？","pinyin":"nǐ gōng zuò hái máng ma","meaning":"Công việc của bạn vẫn bận chứ?"}],"quiz":[{"question":"Công thức đúng của “Câu hỏi nghi vấn với 吗” là gì?","options":["Câu trần thuật + 吗?","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)"],"answer":"Câu trần thuật + 吗?","explanation":"Để biến một câu trần thuật thành câu hỏi \"Có/Không\", bạn chỉ cần thêm trợ từ ngữ khí 「吗」 vào cuối câu. Cấu trúc này dùng để hỏi về sự việc mà bạn muốn xác nhận lại thông tin. Bạn không cần thay đổi trật tự từ trong câu."},{"question":"Ví dụ nào minh họa “Câu hỏi nghi vấn với 吗”?","options":["你是学生吗？","她的中文老师","她有十个学生。","她有一个姐姐。"],"answer":"你是学生吗？","explanation":"你是学生吗？ — Bạn có phải là học sinh không?"},{"question":"“你是学生吗？” có nghĩa tiếng Việt nào?","options":["Bạn có phải là học sinh không?","Giáo viên tiếng Trung của cô ấy","Cô ấy có mười học sinh.","Cô ấy có một người chị gái."],"answer":"Bạn có phải là học sinh không?","explanation":"nǐ shì xué shēng ma — Bạn có phải là học sinh không?"},{"question":"Cấu trúc “Câu trần thuật + 吗?” thuộc điểm ngữ pháp nào?","options":["Câu hỏi nghi vấn với 吗","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu hỏi nghi vấn với 吗","explanation":"Để biến một câu trần thuật thành câu hỏi \"Có/Không\", bạn chỉ cần thêm trợ từ ngữ khí 「吗」 vào cuối câu. Cấu trúc này dùng để hỏi về sự việc mà bạn muốn xác nhận lại thông tin. Bạn không cần thay đổi trật tự từ trong câu."},{"question":"Câu “你是学生吗？” minh họa điểm ngữ pháp nào?","options":["Câu hỏi nghi vấn với 吗","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Câu hỏi nghi vấn với 吗","explanation":"Không được dùng 「吗」 trong câu đã có các từ nghi vấn khác như 「什么」(cái gì), 「谁」(ai), 「哪儿」(đâu)."}]}],"4":[{"name":"Câu chữ 有 (biểu thị sự sở hữu)","formula":"Chủ ngữ + 有 + Tân ngữ","explanation":"Câu chữ 「有」 dùng để biểu thị sự sở hữu đối với người hoặc vật, dịch sang tiếng Việt là 'có'. Đây là câu vị ngữ động từ, trong đó 「有」 đóng vai trò là động từ chính.","tip":"Khi muốn nói phủ định (không có), bạn hãy thay 「有」 bằng 「没有」 (méiyǒu).","note":"Trong câu phủ định, tuyệt đối không dùng 「不有」 mà bắt buộc phải dùng 「没有」.","examples":[{"hanzi":"她有十个学生。","pinyin":"tā yǒu shí gè xué shēng","meaning":"Cô ấy có mười học sinh."},{"hanzi":"她有一个姐姐。","pinyin":"tā yǒu yī gè jiě jiě","meaning":"Cô ấy có một người chị gái."}],"quiz":[{"question":"Công thức đúng của “Câu chữ 有 (biểu thị sự sở hữu)” là gì?","options":["Chủ ngữ + 有 + Tân ngữ","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Chủ ngữ + 有 + Tân ngữ","explanation":"Câu chữ 「有」 dùng để biểu thị sự sở hữu đối với người hoặc vật, dịch sang tiếng Việt là 'có'. Đây là câu vị ngữ động từ, trong đó 「有」 đóng vai trò là động từ chính."},{"question":"Ví dụ nào minh họa “Câu chữ 有 (biểu thị sự sở hữu)”?","options":["她有十个学生。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"她有十个学生。","explanation":"她有十个学生。 — Cô ấy có mười học sinh."},{"question":"“她有十个学生。” có nghĩa tiếng Việt nào?","options":["Cô ấy có mười học sinh.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Cô ấy có mười học sinh.","explanation":"tā yǒu shí gè xué shēng — Cô ấy có mười học sinh."},{"question":"Cấu trúc “Chủ ngữ + 有 + Tân ngữ” thuộc điểm ngữ pháp nào?","options":["Câu chữ 有 (biểu thị sự sở hữu)","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu chữ 有 (biểu thị sự sở hữu)","explanation":"Câu chữ 「有」 dùng để biểu thị sự sở hữu đối với người hoặc vật, dịch sang tiếng Việt là 'có'. Đây là câu vị ngữ động từ, trong đó 「有」 đóng vai trò là động từ chính."},{"question":"Câu “她有十个学生。” minh họa điểm ngữ pháp nào?","options":["Câu chữ 有 (biểu thị sự sở hữu)","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)"],"answer":"Câu chữ 有 (biểu thị sự sở hữu)","explanation":"Trong câu phủ định, tuyệt đối không dùng 「不有」 mà bắt buộc phải dùng 「没有」."}]},{"name":"Cách đọc và biểu đạt con số","formula":"Số đếm + (Lượng từ/Danh từ) đơn vị","explanation":"Trong tiếng Trung, số đếm từ 1-10 là nền tảng để tạo nên các số lớn hơn. Khi biểu đạt con số kèm đơn vị, bạn đặt số đếm trước lượng từ hoặc danh từ chỉ đơn vị như thời gian, tiền tệ hoặc tuổi tác.","tip":"Khi đọc số tiền lớn, người Trung Quốc thường lấy mốc 4 số 0 làm đơn vị 「万」 (vạn), ví dụ 100.000 đọc là 「十万」 (10 vạn).","note":"Thứ tự thời gian trong tiếng Trung luôn đi từ đơn vị lớn đến nhỏ: Năm -> Tháng -> Ngày -> Thứ -> Giờ -> Phút.","examples":[{"hanzi":"二十二","pinyin":"èr shí èr","meaning":"Hai mươi hai"},{"hanzi":"九百九十九","pinyin":"jiǔ bǎi jiǔ shí jiǔ","meaning":"Chín trăm chín mươi chín"}],"quiz":[{"question":"Công thức đúng của “Cách đọc và biểu đạt con số” là gì?","options":["Số đếm + (Lượng từ/Danh từ) đơn vị","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","A..., B 呢? (Cấu trúc hỏi tỉnh lược)"],"answer":"Số đếm + (Lượng từ/Danh từ) đơn vị","explanation":"Trong tiếng Trung, số đếm từ 1-10 là nền tảng để tạo nên các số lớn hơn. Khi biểu đạt con số kèm đơn vị, bạn đặt số đếm trước lượng từ hoặc danh từ chỉ đơn vị như thời gian, tiền tệ hoặc tuổi tác."},{"question":"Ví dụ nào minh họa “Cách đọc và biểu đạt con số”?","options":["二十二","我是学生。","他是中国人。","我的中文老师"],"answer":"二十二","explanation":"二十二 — Hai mươi hai"},{"question":"“二十二” có nghĩa tiếng Việt nào?","options":["Hai mươi hai","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Hai mươi hai","explanation":"èr shí èr — Hai mươi hai"},{"question":"Cấu trúc “Số đếm + (Lượng từ/Danh từ) đơn vị” thuộc điểm ngữ pháp nào?","options":["Cách đọc và biểu đạt con số","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Trợ từ nghi vấn 呢 (hỏi lại tình huống)"],"answer":"Cách đọc và biểu đạt con số","explanation":"Trong tiếng Trung, số đếm từ 1-10 là nền tảng để tạo nên các số lớn hơn. Khi biểu đạt con số kèm đơn vị, bạn đặt số đếm trước lượng từ hoặc danh từ chỉ đơn vị như thời gian, tiền tệ hoặc tuổi tác."},{"question":"Câu “二十二” minh họa điểm ngữ pháp nào?","options":["Cách đọc và biểu đạt con số","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể","Trợ từ ngữ khí 'ba' dùng để đề nghị"],"answer":"Cách đọc và biểu đạt con số","explanation":"Thứ tự thời gian trong tiếng Trung luôn đi từ đơn vị lớn đến nhỏ: Năm -> Tháng -> Ngày -> Thứ -> Giờ -> Phút."}]},{"name":"Trợ từ nghi vấn 呢 (hỏi lại tình huống)","formula":"A..., B 呢? (Cấu trúc hỏi tỉnh lược)","explanation":"Trợ từ 「呢」 đặt cuối câu dùng để hỏi lại một tình huống đã được nhắc đến trước đó. Đây là cách nói tắt giúp câu hỏi ngắn gọn và tự nhiên hơn thay vì phải lặp lại toàn bộ câu hỏi cũ.","tip":"Hãy dùng cấu trúc này khi bạn muốn hỏi ngược lại đối phương về cùng một chủ đề, ví dụ: 'Tôi ăn rồi, còn bạn thì sao?' (我吃了，你呢？).","note":"Không nên dùng 「呢」 thay thế cho 「吗」 vì 「呢」 chỉ dùng cho câu hỏi tỉnh lược hoặc liệt kê, không dùng cho câu hỏi Có/Không.","examples":[{"hanzi":"我是学生，你呢？","pinyin":"wǒ shì xué shēng nǐ ne","meaning":"Tôi là học sinh, còn bạn thì sao?"},{"hanzi":"我是中国人，你呢？","pinyin":"wǒ shì zhōng guó rén nǐ ne","meaning":"Tôi là người Trung Quốc, còn bạn?"}],"quiz":[{"question":"Công thức đúng của “Trợ từ nghi vấn 呢 (hỏi lại tình huống)” là gì?","options":["A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)"],"answer":"A..., B 呢? (Cấu trúc hỏi tỉnh lược)","explanation":"Trợ từ 「呢」 đặt cuối câu dùng để hỏi lại một tình huống đã được nhắc đến trước đó. Đây là cách nói tắt giúp câu hỏi ngắn gọn và tự nhiên hơn thay vì phải lặp lại toàn bộ câu hỏi cũ."},{"question":"Ví dụ nào minh họa “Trợ từ nghi vấn 呢 (hỏi lại tình huống)”?","options":["我是学生，你呢？","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我是学生，你呢？","explanation":"我是学生，你呢？ — Tôi là học sinh, còn bạn thì sao?"},{"question":"“我是学生，你呢？” có nghĩa tiếng Việt nào?","options":["Tôi là học sinh, còn bạn thì sao?","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Tôi là học sinh, còn bạn thì sao?","explanation":"wǒ shì xué shēng nǐ ne — Tôi là học sinh, còn bạn thì sao?"},{"question":"Cấu trúc “A..., B 呢? (Cấu trúc hỏi tỉnh lược)” thuộc điểm ngữ pháp nào?","options":["Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Trợ từ nghi vấn 呢 (hỏi lại tình huống)","explanation":"Trợ từ 「呢」 đặt cuối câu dùng để hỏi lại một tình huống đã được nhắc đến trước đó. Đây là cách nói tắt giúp câu hỏi ngắn gọn và tự nhiên hơn thay vì phải lặp lại toàn bộ câu hỏi cũ."},{"question":"Câu “我是学生，你呢？” minh họa điểm ngữ pháp nào?","options":["Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Trợ từ nghi vấn 呢 (hỏi lại tình huống)","explanation":"Không nên dùng 「呢」 thay thế cho 「吗」 vì 「呢」 chỉ dùng cho câu hỏi tỉnh lược hoặc liệt kê, không dùng cho câu hỏi Có/Không."}]},{"name":"Cấu trúc Số từ + Lượng từ + Danh từ","formula":"[Số từ] + [Lượng từ] + [Danh từ]","explanation":"Trong tiếng Trung, khi muốn chỉ số lượng của vật, bạn phải thêm lượng từ vào giữa số từ và danh từ. Lượng từ 「个」 là từ phổ biến nhất và có thể dùng cho nhiều danh từ khác nhau nếu bạn chưa biết lượng từ riêng của chúng.","tip":"Nếu bạn chưa thuộc lượng từ chuyên biệt cho một đồ vật, hãy dùng tạm 「个」 làm lượng từ chung.","note":"Đừng bao giờ bỏ qua lượng từ khi đi kèm với số đếm, vì trong tiếng Trung danh từ không thể đứng ngay sau số từ.","examples":[{"hanzi":"一个","pinyin":"yī gè","meaning":"Một cái/chiếc"},{"hanzi":"五口人","pinyin":"wǔ kǒu rén","meaning":"Năm người - dùng trong gia đình"}],"quiz":[{"question":"Công thức đúng của “Cấu trúc Số từ + Lượng từ + Danh từ” là gì?","options":["[Số từ] + [Lượng từ] + [Danh từ]","Chủ ngữ + 会 + Động từ (+ Tân ngữ)","Chủ ngữ + 想 + Động từ + (Tân ngữ)","S + V1 + O1 + V2 + O2"],"answer":"[Số từ] + [Lượng từ] + [Danh từ]","explanation":"Trong tiếng Trung, khi muốn chỉ số lượng của vật, bạn phải thêm lượng từ vào giữa số từ và danh từ. Lượng từ 「个」 là từ phổ biến nhất và có thể dùng cho nhiều danh từ khác nhau nếu bạn chưa biết lượng từ riêng của chúng."},{"question":"Ví dụ nào minh họa “Cấu trúc Số từ + Lượng từ + Danh từ”?","options":["一个","她有十个学生。","她有一个姐姐。","二十二"],"answer":"一个","explanation":"一个 — Một cái/chiếc"},{"question":"“一个” có nghĩa tiếng Việt nào?","options":["Một cái/chiếc","Cô ấy có mười học sinh.","Cô ấy có một người chị gái.","Hai mươi hai"],"answer":"Một cái/chiếc","explanation":"yī gè — Một cái/chiếc"},{"question":"Cấu trúc “[Số từ] + [Lượng từ] + [Danh từ]” thuộc điểm ngữ pháp nào?","options":["Cấu trúc Số từ + Lượng từ + Danh từ","Động từ năng nguyện 会 (biết)","Động từ năng nguyện 想 (muốn)","Câu liên động"],"answer":"Cấu trúc Số từ + Lượng từ + Danh từ","explanation":"Trong tiếng Trung, khi muốn chỉ số lượng của vật, bạn phải thêm lượng từ vào giữa số từ và danh từ. Lượng từ 「个」 là từ phổ biến nhất và có thể dùng cho nhiều danh từ khác nhau nếu bạn chưa biết lượng từ riêng của chúng."},{"question":"Câu “一个” minh họa điểm ngữ pháp nào?","options":["Cấu trúc Số từ + Lượng từ + Danh từ","Số thứ tự với 第","Cách đọc tiền tệ trong tiếng Trung","Câu vị ngữ tính từ"],"answer":"Cấu trúc Số từ + Lượng từ + Danh từ","explanation":"Đừng bao giờ bỏ qua lượng từ khi đi kèm với số đếm, vì trong tiếng Trung danh từ không thể đứng ngay sau số từ."}]}],"5":[{"name":"Thứ tự biểu đạt thời gian","formula":"Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","explanation":"Trong tiếng Trung, khi diễn đạt thời gian, chúng ta luôn đi từ đơn vị lớn nhất đến đơn vị nhỏ nhất. Bạn cần sắp xếp theo thứ tự lần lượt là 「年」 (năm), 「月」 (tháng), 「日」 hoặc 「号」 (ngày) và cuối cùng là 「星期」 (thứ).","tip":"Hãy ghi nhớ quy tắc 'từ lớn đến bé', ngược lại hoàn toàn so với tiếng Việt.","note":"Trong khẩu ngữ thường dùng 「号」 để nói về ngày, còn trong văn bản viết thường dùng 「日」.","examples":[{"hanzi":"2025年1月1日，星期三","pinyin":"èr líng èr wǔ nián yī yuè yī rì xīng qī sān","meaning":"Thứ Tư, ngày 1 tháng 1 năm 2025"},{"hanzi":"今天9月8号。","pinyin":"jīn tiān yuè hào","meaning":"Hôm nay ngày 8 tháng 9."}],"quiz":[{"question":"Công thức đúng của “Thứ tự biểu đạt thời gian” là gì?","options":["Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","explanation":"Trong tiếng Trung, khi diễn đạt thời gian, chúng ta luôn đi từ đơn vị lớn nhất đến đơn vị nhỏ nhất. Bạn cần sắp xếp theo thứ tự lần lượt là 「年」 (năm), 「月」 (tháng), 「日」 hoặc 「号」 (ngày) và cuối cùng là 「星期」 (thứ)."},{"question":"Ví dụ nào minh họa “Thứ tự biểu đạt thời gian”?","options":["2025年1月1日，星期三","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"2025年1月1日，星期三","explanation":"2025年1月1日，星期三 — Thứ Tư, ngày 1 tháng 1 năm 2025"},{"question":"“2025年1月1日，星期三” có nghĩa tiếng Việt nào?","options":["Thứ Tư, ngày 1 tháng 1 năm 2025","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Thứ Tư, ngày 1 tháng 1 năm 2025","explanation":"èr líng èr wǔ nián yī yuè yī rì xīng qī sān — Thứ Tư, ngày 1 tháng 1 năm 2025"},{"question":"Cấu trúc “Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)” thuộc điểm ngữ pháp nào?","options":["Thứ tự biểu đạt thời gian","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Thứ tự biểu đạt thời gian","explanation":"Trong tiếng Trung, khi diễn đạt thời gian, chúng ta luôn đi từ đơn vị lớn nhất đến đơn vị nhỏ nhất. Bạn cần sắp xếp theo thứ tự lần lượt là 「年」 (năm), 「月」 (tháng), 「日」 hoặc 「号」 (ngày) và cuối cùng là 「星期」 (thứ)."},{"question":"Câu “2025年1月1日，星期三” minh họa điểm ngữ pháp nào?","options":["Thứ tự biểu đạt thời gian","Cấu trúc Số từ + Lượng từ + Danh từ","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)"],"answer":"Thứ tự biểu đạt thời gian","explanation":"Trong khẩu ngữ thường dùng 「号」 để nói về ngày, còn trong văn bản viết thường dùng 「日」."}]},{"name":"Câu vị ngữ danh từ","formula":"Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)","explanation":"Trong câu này, vị ngữ không phải là động từ hay tính từ mà là một danh từ hoặc cụm danh từ. Cấu trúc này thường dùng để chỉ ngày tháng, thời gian, tuổi tác hoặc giá tiền. Ví dụ: 「今天星期一」(Hôm nay là thứ Hai).","tip":"Khi nói về ngày tháng, hãy nhớ quy tắc từ đơn vị lớn đến nhỏ: Năm -> Tháng -> Ngày -> Thứ.","note":"Trong câu vị ngữ danh từ, bạn không được thêm từ 「是」 (là) vào giữa chủ ngữ và vị ngữ.","examples":[{"hanzi":"今天星期四。","pinyin":"jīn tiān xīng qī sì","meaning":"Hôm nay là thứ Năm."},{"hanzi":"明天是2024年8月18号。","pinyin":"míng tiān shì nián yuè hào","meaning":"Ngày mai là ngày 18 tháng 8 năm 2024."}],"quiz":[{"question":"Công thức đúng của “Câu vị ngữ danh từ” là gì?","options":["Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)","explanation":"Trong câu này, vị ngữ không phải là động từ hay tính từ mà là một danh từ hoặc cụm danh từ. Cấu trúc này thường dùng để chỉ ngày tháng, thời gian, tuổi tác hoặc giá tiền. Ví dụ: 「今天星期一」(Hôm nay là thứ Hai)."},{"question":"Ví dụ nào minh họa “Câu vị ngữ danh từ”?","options":["今天星期四。","我是学生。","他是中国人。","我的中文老师"],"answer":"今天星期四。","explanation":"今天星期四。 — Hôm nay là thứ Năm."},{"question":"“今天星期四。” có nghĩa tiếng Việt nào?","options":["Hôm nay là thứ Năm.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Hôm nay là thứ Năm.","explanation":"jīn tiān xīng qī sì — Hôm nay là thứ Năm."},{"question":"Cấu trúc “Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)” thuộc điểm ngữ pháp nào?","options":["Câu vị ngữ danh từ","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Câu vị ngữ danh từ","explanation":"Trong câu này, vị ngữ không phải là động từ hay tính từ mà là một danh từ hoặc cụm danh từ. Cấu trúc này thường dùng để chỉ ngày tháng, thời gian, tuổi tác hoặc giá tiền. Ví dụ: 「今天星期一」(Hôm nay là thứ Hai)."},{"question":"Câu “今天星期四。” minh họa điểm ngữ pháp nào?","options":["Câu vị ngữ danh từ","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể","Trợ từ ngữ khí 'ba' dùng để đề nghị"],"answer":"Câu vị ngữ danh từ","explanation":"Trong câu vị ngữ danh từ, bạn không được thêm từ 「是」 (là) vào giữa chủ ngữ và vị ngữ."}]},{"name":"Động từ năng nguyện 会 (biết)","formula":"Chủ ngữ + 会 + Động từ (+ Tân ngữ)","explanation":"Động từ năng nguyện 「会」 dùng để diễn tả năng lực hoặc kỹ năng mà bạn có được thông qua quá trình học tập hoặc rèn luyện. Ví dụ: 「我会说汉语」 (Tôi biết nói tiếng Trung).","tip":"Hãy nhớ rằng 「会」 nhấn mạnh vào khả năng biết làm việc gì đó nhờ học hỏi, không phải khả năng tự nhiên.","note":"Đừng nhầm lẫn 「会」 với 「能」, vì 「能」 thường dùng để chỉ khả năng có thể làm được việc gì đó dựa trên điều kiện thực tế.","examples":[{"hanzi":"我会做饭。","pinyin":"wǒ huì zuò fàn","meaning":"Tôi biết nấu ăn."},{"hanzi":"你会做饭吗？","pinyin":"nǐ huì zuò fàn ma","meaning":"Bạn biết nấu ăn không?"}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 会 (biết)” là gì?","options":["Chủ ngữ + 会 + Động từ (+ Tân ngữ)","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 会 + Động từ (+ Tân ngữ)","explanation":"Động từ năng nguyện 「会」 dùng để diễn tả năng lực hoặc kỹ năng mà bạn có được thông qua quá trình học tập hoặc rèn luyện. Ví dụ: 「我会说汉语」 (Tôi biết nói tiếng Trung)."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 会 (biết)”?","options":["我会做饭。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我会做饭。","explanation":"我会做饭。 — Tôi biết nấu ăn."},{"question":"“我会做饭。” có nghĩa tiếng Việt nào?","options":["Tôi biết nấu ăn.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Tôi biết nấu ăn.","explanation":"wǒ huì zuò fàn — Tôi biết nấu ăn."},{"question":"Cấu trúc “Chủ ngữ + 会 + Động từ (+ Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 会 (biết)","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Động từ năng nguyện 会 (biết)","explanation":"Động từ năng nguyện 「会」 dùng để diễn tả năng lực hoặc kỹ năng mà bạn có được thông qua quá trình học tập hoặc rèn luyện. Ví dụ: 「我会说汉语」 (Tôi biết nói tiếng Trung)."},{"question":"Câu “我会做饭。” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 会 (biết)","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Động từ năng nguyện 会 (biết)","explanation":"Đừng nhầm lẫn 「会」 với 「能」, vì 「能」 thường dùng để chỉ khả năng có thể làm được việc gì đó dựa trên điều kiện thực tế."}]}],"6":[{"name":"Động từ năng nguyện 想 (muốn)","formula":"Chủ ngữ + 想 + Động từ + (Tân ngữ)","explanation":"Từ 「想」 là động từ năng nguyện dùng để biểu thị nguyện vọng, mong muốn hoặc dự định thực hiện một hành động nào đó. Nó thường đứng trước động từ chính trong câu để làm rõ mục đích của chủ ngữ.","tip":"Khi muốn nói phủ định, bạn chỉ cần thêm 「不」 phía trước 「想」 (ví dụ: 「不想」 - không muốn).","note":"Không được dùng 「想」 như một tính từ để miêu tả, nó chỉ dùng để biểu thị ý định làm việc gì đó.","examples":[{"hanzi":"我想去超市。","pinyin":"wǒ xiǎng qù chāo shì","meaning":"Tôi muốn đi siêu thị."},{"hanzi":"我哥哥不想休息。","pinyin":"wǒ gē gē bù xiǎng xiū xī","meaning":"Anh trai tôi không muốn nghỉ ngơi."}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 想 (muốn)” là gì?","options":["Chủ ngữ + 想 + Động từ + (Tân ngữ)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Chủ ngữ + 想 + Động từ + (Tân ngữ)","explanation":"Từ 「想」 là động từ năng nguyện dùng để biểu thị nguyện vọng, mong muốn hoặc dự định thực hiện một hành động nào đó. Nó thường đứng trước động từ chính trong câu để làm rõ mục đích của chủ ngữ."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 想 (muốn)”?","options":["我想去超市。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"我想去超市。","explanation":"我想去超市。 — Tôi muốn đi siêu thị."},{"question":"“我想去超市。” có nghĩa tiếng Việt nào?","options":["Tôi muốn đi siêu thị.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Tôi muốn đi siêu thị.","explanation":"wǒ xiǎng qù chāo shì — Tôi muốn đi siêu thị."},{"question":"Cấu trúc “Chủ ngữ + 想 + Động từ + (Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 想 (muốn)","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Động từ năng nguyện 想 (muốn)","explanation":"Từ 「想」 là động từ năng nguyện dùng để biểu thị nguyện vọng, mong muốn hoặc dự định thực hiện một hành động nào đó. Nó thường đứng trước động từ chính trong câu để làm rõ mục đích của chủ ngữ."},{"question":"Câu “我想去超市。” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 想 (muốn)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Động từ năng nguyện 想 (muốn)","explanation":"Không được dùng 「想」 như một tính từ để miêu tả, nó chỉ dùng để biểu thị ý định làm việc gì đó."}]},{"name":"Câu liên động","formula":"S + V1 + O1 + V2 + O2","explanation":"Câu liên động là câu có từ hai động từ trở lên cùng làm vị ngữ. Cấu trúc này thường dùng để diễn tả mục đích hoặc trình tự của hành động, trong đó động từ thứ hai thường giải thích lý do thực hiện động từ thứ nhất.","tip":"Hãy ghi nhớ quy tắc: hành động xảy ra trước đứng trước, hành động mục đích đứng sau.","note":"Không được dùng các từ liên kết như 「和」(và) hay 「然后」(sau đó) giữa hai động từ.","examples":[{"hanzi":"我去超市买东西。","pinyin":"wǒ qù chāo shì mǎi dōng xī","meaning":"Tôi đi siêu thị mua đồ."},{"hanzi":"我们坐出租车去西安饭店。","pinyin":"wǒ men zuò chū zū chē qù xī ān fàn diàn","meaning":"Chúng tôi đi taxi đến nhà hàng Tây An."}],"quiz":[{"question":"Công thức đúng của “Câu liên động” là gì?","options":["S + V1 + O1 + V2 + O2","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"S + V1 + O1 + V2 + O2","explanation":"Câu liên động là câu có từ hai động từ trở lên cùng làm vị ngữ. Cấu trúc này thường dùng để diễn tả mục đích hoặc trình tự của hành động, trong đó động từ thứ hai thường giải thích lý do thực hiện động từ thứ nhất."},{"question":"Ví dụ nào minh họa “Câu liên động”?","options":["我去超市买东西。","我是学生。","他是中国人。","我的中文老师"],"answer":"我去超市买东西。","explanation":"我去超市买东西。 — Tôi đi siêu thị mua đồ."},{"question":"“我去超市买东西。” có nghĩa tiếng Việt nào?","options":["Tôi đi siêu thị mua đồ.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi đi siêu thị mua đồ.","explanation":"wǒ qù chāo shì mǎi dōng xī — Tôi đi siêu thị mua đồ."},{"question":"Cấu trúc “S + V1 + O1 + V2 + O2” thuộc điểm ngữ pháp nào?","options":["Câu liên động","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Câu liên động","explanation":"Câu liên động là câu có từ hai động từ trở lên cùng làm vị ngữ. Cấu trúc này thường dùng để diễn tả mục đích hoặc trình tự của hành động, trong đó động từ thứ hai thường giải thích lý do thực hiện động từ thứ nhất."},{"question":"Câu “我去超市买东西。” minh họa điểm ngữ pháp nào?","options":["Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể","Trợ từ ngữ khí 'ba' dùng để đề nghị"],"answer":"Câu liên động","explanation":"Không được dùng các từ liên kết như 「和」(và) hay 「然后」(sau đó) giữa hai động từ."}]},{"name":"Đại từ nghi vấn 怎么 (làm thế nào)","formula":"S + 怎么 + V + (O)?","explanation":"Từ 「怎么」 được dùng trước động từ để hỏi về phương thức hoặc cách thức thực hiện một hành động nào đó. Nó tương đương với cấu trúc \"làm thế nào\" hoặc \"làm sao\" trong tiếng Việt.","tip":"Bạn có thể dùng cấu trúc này để hỏi cách làm một việc gì đó hoặc cách sử dụng một vật dụng nào đó, ví dụ: 「这个字怎么写？」(Chữ này viết thế nào?).","note":"Đừng nhầm lẫn 「怎么」 với 「什么」; 「怎么」 hỏi về cách làm (phương thức), còn 「什么」 hỏi về sự vật, sự việc (cái gì).","examples":[{"hanzi":"你怎么去超市？","pinyin":"nǐ zěn me qù chāo shì","meaning":"Bạn đi siêu thị bằng cách nào?"},{"hanzi":"我们怎么去？","pinyin":"wǒ men zěn me qù","meaning":"Chúng ta đi bằng cách nào?"}],"quiz":[{"question":"Công thức đúng của “Đại từ nghi vấn 怎么 (làm thế nào)” là gì?","options":["S + 怎么 + V + (O)?","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"S + 怎么 + V + (O)?","explanation":"Từ 「怎么」 được dùng trước động từ để hỏi về phương thức hoặc cách thức thực hiện một hành động nào đó. Nó tương đương với cấu trúc \"làm thế nào\" hoặc \"làm sao\" trong tiếng Việt."},{"question":"Ví dụ nào minh họa “Đại từ nghi vấn 怎么 (làm thế nào)”?","options":["你怎么去超市？","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"你怎么去超市？","explanation":"你怎么去超市？ — Bạn đi siêu thị bằng cách nào?"},{"question":"“你怎么去超市？” có nghĩa tiếng Việt nào?","options":["Bạn đi siêu thị bằng cách nào?","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Bạn đi siêu thị bằng cách nào?","explanation":"nǐ zěn me qù chāo shì — Bạn đi siêu thị bằng cách nào?"},{"question":"Cấu trúc “S + 怎么 + V + (O)?” thuộc điểm ngữ pháp nào?","options":["Đại từ nghi vấn 怎么 (làm thế nào)","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Đại từ nghi vấn 怎么 (làm thế nào)","explanation":"Từ 「怎么」 được dùng trước động từ để hỏi về phương thức hoặc cách thức thực hiện một hành động nào đó. Nó tương đương với cấu trúc \"làm thế nào\" hoặc \"làm sao\" trong tiếng Việt."},{"question":"Câu “你怎么去超市？” minh họa điểm ngữ pháp nào?","options":["Đại từ nghi vấn 怎么 (làm thế nào)","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Đại từ nghi vấn 怎么 (làm thế nào)","explanation":"Đừng nhầm lẫn 「怎么」 với 「什么」; 「怎么」 hỏi về cách làm (phương thức), còn 「什么」 hỏi về sự vật, sự việc (cái gì)."}]}],"7":[{"name":"Cách nói giờ giấc cụ thể","formula":"Số đếm + 点 (giờ) + Số đếm + 分 (phút)","explanation":"Trong tiếng Trung, để nói giờ giấc, bạn đặt số đếm trước từ 「点」 (giờ) và 「分」 (phút). Thứ tự thời gian luôn đi từ đơn vị lớn đến đơn vị nhỏ, ví dụ: 8 giờ 30 phút là 「八点三十分」.","tip":"Khi nói giờ kém hoặc 30 phút, bạn có thể dùng 「半」 thay cho 30 phút, ví dụ: 8 giờ rưỡi là 「八点半」.","note":"Đừng quên dùng 「两」 (liǎng) thay vì 「二」 (èr) khi nói \"2 giờ\" (「两点」), không dùng 「二点」.","examples":[{"hanzi":"上午十点","pinyin":"shàng wǔ shí diǎn","meaning":"Mười giờ sáng"},{"hanzi":"我晚上六点半下班。","pinyin":"wǒ wǎn shàng liù diǎn bàn xià bān","meaning":"Tôi tan làm lúc 6 giờ rưỡi tối."}],"quiz":[{"question":"Công thức đúng của “Cách nói giờ giấc cụ thể” là gì?","options":["Số đếm + 点 (giờ) + Số đếm + 分 (phút)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Số đếm + 点 (giờ) + Số đếm + 分 (phút)","explanation":"Trong tiếng Trung, để nói giờ giấc, bạn đặt số đếm trước từ 「点」 (giờ) và 「分」 (phút). Thứ tự thời gian luôn đi từ đơn vị lớn đến đơn vị nhỏ, ví dụ: 8 giờ 30 phút là 「八点三十分」."},{"question":"Ví dụ nào minh họa “Cách nói giờ giấc cụ thể”?","options":["上午十点","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"上午十点","explanation":"上午十点 — Mười giờ sáng"},{"question":"“上午十点” có nghĩa tiếng Việt nào?","options":["Mười giờ sáng","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Mười giờ sáng","explanation":"shàng wǔ shí diǎn — Mười giờ sáng"},{"question":"Cấu trúc “Số đếm + 点 (giờ) + Số đếm + 分 (phút)” thuộc điểm ngữ pháp nào?","options":["Cách nói giờ giấc cụ thể","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Cách nói giờ giấc cụ thể","explanation":"Trong tiếng Trung, để nói giờ giấc, bạn đặt số đếm trước từ 「点」 (giờ) và 「分」 (phút). Thứ tự thời gian luôn đi từ đơn vị lớn đến đơn vị nhỏ, ví dụ: 8 giờ 30 phút là 「八点三十分」."},{"question":"Câu “上午十点” minh họa điểm ngữ pháp nào?","options":["Cách nói giờ giấc cụ thể","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Cách nói giờ giấc cụ thể","explanation":"Đừng quên dùng 「两」 (liǎng) thay vì 「二」 (èr) khi nói \"2 giờ\" (「两点」), không dùng 「二点」."}]},{"name":"Trợ từ ngữ khí 'ba' dùng để đề nghị","formula":"Câu + 吧 (ba)","explanation":"Trợ từ 「吧」 đứng cuối câu để đưa ra lời đề nghị, gợi ý hoặc yêu cầu một cách nhẹ nhàng. Nó giúp câu nói của bạn trở nên lịch sự và bớt khô khan hơn.","tip":"Dùng 「吧」 khi bạn muốn rủ rê ai đó làm gì cùng mình, ví dụ: 「我们走吧」 (Chúng ta đi thôi).","note":"Đừng dùng 「吧」 trong các câu hỏi cần câu trả lời xác nhận như câu hỏi với 「吗」.","examples":[{"hanzi":"我们上课吧。","pinyin":"wǒ men shàng kè ba","meaning":"Chúng ta lên lớp thôi."},{"hanzi":"我们中午下课吧。","pinyin":"wǒ men zhōng wǔ xià kè ba","meaning":"Trưa nay chúng ta tan học đi."}],"quiz":[{"question":"Công thức đúng của “Trợ từ ngữ khí 'ba' dùng để đề nghị” là gì?","options":["Câu + 吧 (ba)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Câu + 吧 (ba)","explanation":"Trợ từ 「吧」 đứng cuối câu để đưa ra lời đề nghị, gợi ý hoặc yêu cầu một cách nhẹ nhàng. Nó giúp câu nói của bạn trở nên lịch sự và bớt khô khan hơn."},{"question":"Ví dụ nào minh họa “Trợ từ ngữ khí 'ba' dùng để đề nghị”?","options":["我们上课吧。","我是学生。","他是中国人。","我的中文老师"],"answer":"我们上课吧。","explanation":"我们上课吧。 — Chúng ta lên lớp thôi."},{"question":"“我们上课吧。” có nghĩa tiếng Việt nào?","options":["Chúng ta lên lớp thôi.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Chúng ta lên lớp thôi.","explanation":"wǒ men shàng kè ba — Chúng ta lên lớp thôi."},{"question":"Cấu trúc “Câu + 吧 (ba)” thuộc điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 'ba' dùng để đề nghị","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Trợ từ ngữ khí 'ba' dùng để đề nghị","explanation":"Trợ từ 「吧」 đứng cuối câu để đưa ra lời đề nghị, gợi ý hoặc yêu cầu một cách nhẹ nhàng. Nó giúp câu nói của bạn trở nên lịch sự và bớt khô khan hơn."},{"question":"Câu “我们上课吧。” minh họa điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 'ba' dùng để đề nghị","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Trợ từ ngữ khí 'ba' dùng để đề nghị","explanation":"Đừng dùng 「吧」 trong các câu hỏi cần câu trả lời xác nhận như câu hỏi với 「吗」."}]},{"name":"Vị trí của trạng ngữ trong câu","formula":"Trạng ngữ + Động từ/Tính từ","explanation":"Trong tiếng Trung, các từ chỉ thời gian hoặc phó từ thường đứng trước động từ hoặc tính từ để bổ nghĩa cho hành động. Bạn hãy nhớ quy tắc \"thời gian đứng trước hành động\" để đặt câu cho chính xác.","tip":"Bạn có thể đặt trạng ngữ chỉ thời gian lên đầu câu trước chủ ngữ hoặc ngay sau chủ ngữ đều được.","note":"Tuyệt đối không đặt trạng ngữ chỉ thời gian sau động từ như trong tiếng Việt.","examples":[{"hanzi":"我下午不去学校。","pinyin":"wǒ xià wǔ bù qù xué xiào","meaning":"Chiều nay tôi không đi học."},{"hanzi":"妹妹很高兴。","pinyin":"mèi mèi hěn gāo xìng","meaning":"Em gái rất vui."}],"quiz":[{"question":"Công thức đúng của “Vị trí của trạng ngữ trong câu” là gì?","options":["Trạng ngữ + Động từ/Tính từ","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Trạng ngữ + Động từ/Tính từ","explanation":"Trong tiếng Trung, các từ chỉ thời gian hoặc phó từ thường đứng trước động từ hoặc tính từ để bổ nghĩa cho hành động. Bạn hãy nhớ quy tắc \"thời gian đứng trước hành động\" để đặt câu cho chính xác."},{"question":"Ví dụ nào minh họa “Vị trí của trạng ngữ trong câu”?","options":["我下午不去学校。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我下午不去学校。","explanation":"我下午不去学校。 — Chiều nay tôi không đi học."},{"question":"“我下午不去学校。” có nghĩa tiếng Việt nào?","options":["Chiều nay tôi không đi học.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Chiều nay tôi không đi học.","explanation":"wǒ xià wǔ bù qù xué xiào — Chiều nay tôi không đi học."},{"question":"Cấu trúc “Trạng ngữ + Động từ/Tính từ” thuộc điểm ngữ pháp nào?","options":["Vị trí của trạng ngữ trong câu","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Vị trí của trạng ngữ trong câu","explanation":"Trong tiếng Trung, các từ chỉ thời gian hoặc phó từ thường đứng trước động từ hoặc tính từ để bổ nghĩa cho hành động. Bạn hãy nhớ quy tắc \"thời gian đứng trước hành động\" để đặt câu cho chính xác."},{"question":"Câu “我下午不去学校。” minh họa điểm ngữ pháp nào?","options":["Vị trí của trạng ngữ trong câu","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Vị trí của trạng ngữ trong câu","explanation":"Tuyệt đối không đặt trạng ngữ chỉ thời gian sau động từ như trong tiếng Việt."}]},{"name":"Trợ từ ngữ khí 呢 xác nhận sự thật","formula":"Câu trần thuật + 呢","explanation":"Trợ từ 「呢」 đặt cuối câu trần thuật để nhấn mạnh và xác nhận một sự thật hoặc tình trạng đang diễn ra. Nó giúp câu văn trở nên mềm mại, tự nhiên hơn, tương đương với các từ như 'nhỉ', 'đấy', 'cơ' trong tiếng Việt.","tip":"Dùng 「呢」 giúp câu nói bớt khô khan và thể hiện thái độ khẳng định của người nói về một sự việc.","note":"Cần phân biệt với 「呢」 trong câu hỏi tỉnh lược (ví dụ: 'Còn tôi thì sao?'), đây là hai cách dùng hoàn toàn khác nhau.","examples":[{"hanzi":"我下午还有课呢。","pinyin":"wǒ xià wǔ hái yǒu kè ne","meaning":"Chiều nay tôi vẫn còn tiết học đấy."},{"hanzi":"李文晚上还有事呢。","pinyin":"lǐ wén wǎn shàng hái yǒu shì ne","meaning":"Lý Văn buổi tối vẫn còn việc đấy."}],"quiz":[{"question":"Công thức đúng của “Trợ từ ngữ khí 呢 xác nhận sự thật” là gì?","options":["Câu trần thuật + 呢","Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)","Chủ ngữ + 会 + Động từ (+ Tân ngữ)","Chủ ngữ + 想 + Động từ + (Tân ngữ)"],"answer":"Câu trần thuật + 呢","explanation":"Trợ từ 「呢」 đặt cuối câu trần thuật để nhấn mạnh và xác nhận một sự thật hoặc tình trạng đang diễn ra. Nó giúp câu văn trở nên mềm mại, tự nhiên hơn, tương đương với các từ như 'nhỉ', 'đấy', 'cơ' trong tiếng Việt."},{"question":"Ví dụ nào minh họa “Trợ từ ngữ khí 呢 xác nhận sự thật”?","options":["我下午还有课呢。","她有十个学生。","她有一个姐姐。","二十二"],"answer":"我下午还有课呢。","explanation":"我下午还有课呢。 — Chiều nay tôi vẫn còn tiết học đấy."},{"question":"“我下午还有课呢。” có nghĩa tiếng Việt nào?","options":["Chiều nay tôi vẫn còn tiết học đấy.","Cô ấy có mười học sinh.","Cô ấy có một người chị gái.","Hai mươi hai"],"answer":"Chiều nay tôi vẫn còn tiết học đấy.","explanation":"wǒ xià wǔ hái yǒu kè ne — Chiều nay tôi vẫn còn tiết học đấy."},{"question":"Cấu trúc “Câu trần thuật + 呢” thuộc điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 呢 xác nhận sự thật","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)","Động từ năng nguyện 想 (muốn)"],"answer":"Trợ từ ngữ khí 呢 xác nhận sự thật","explanation":"Trợ từ 「呢」 đặt cuối câu trần thuật để nhấn mạnh và xác nhận một sự thật hoặc tình trạng đang diễn ra. Nó giúp câu văn trở nên mềm mại, tự nhiên hơn, tương đương với các từ như 'nhỉ', 'đấy', 'cơ' trong tiếng Việt."},{"question":"Câu “我下午还有课呢。” minh họa điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 呢 xác nhận sự thật","Số thứ tự với 第","Cách đọc tiền tệ trong tiếng Trung","Câu vị ngữ tính từ"],"answer":"Trợ từ ngữ khí 呢 xác nhận sự thật","explanation":"Cần phân biệt với 「呢」 trong câu hỏi tỉnh lược (ví dụ: 'Còn tôi thì sao?'), đây là hai cách dùng hoàn toàn khác nhau."}]}],"8":[{"name":"Danh từ chỉ phương hướng và vị trí","formula":"[Danh từ/Đại từ] + [Danh từ phương vị (上, 下, 前, 后, 里, 外, v.v.)]","explanation":"Trong tiếng Trung, để chỉ vị trí của một vật, ta đặt danh từ chỉ vật đó trước từ chỉ phương vị. Các từ như 「上」 (trên), 「下」 (dưới), 「里」 (trong) luôn đứng sau danh từ gốc để xác định rõ vị trí không gian.","tip":"Hãy tưởng tượng từ chỉ phương vị đóng vai trò như một chiếc 'vệ tinh' luôn bám sát phía sau danh từ chính để làm rõ vị trí.","note":"Đừng nhầm lẫn thứ tự: trong tiếng Trung, danh từ luôn đứng trước từ chỉ phương vị, ngược lại với tiếng Việt thường có từ 'ở' hoặc 'bên' đứng trước.","examples":[{"hanzi":"在桌子上","pinyin":"zài zhuō zi shàng","meaning":"Ở trên bàn"},{"hanzi":"房间外有一只小猫。","pinyin":"fáng jiān wài yǒu yī zhī xiǎo māo","meaning":"Bên ngoài phòng có một chú mèo nhỏ."}],"quiz":[{"question":"Công thức đúng của “Danh từ chỉ phương hướng và vị trí” là gì?","options":["[Danh từ/Đại từ] + [Danh từ phương vị (上, 下, 前, 后, 里, 外, v.v.)]","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"[Danh từ/Đại từ] + [Danh từ phương vị (上, 下, 前, 后, 里, 外, v.v.)]","explanation":"Trong tiếng Trung, để chỉ vị trí của một vật, ta đặt danh từ chỉ vật đó trước từ chỉ phương vị. Các từ như 「上」 (trên), 「下」 (dưới), 「里」 (trong) luôn đứng sau danh từ gốc để xác định rõ vị trí không gian."},{"question":"Ví dụ nào minh họa “Danh từ chỉ phương hướng và vị trí”?","options":["在桌子上","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"在桌子上","explanation":"在桌子上 — Ở trên bàn"},{"question":"“在桌子上” có nghĩa tiếng Việt nào?","options":["Ở trên bàn","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Ở trên bàn","explanation":"zài zhuō zi shàng — Ở trên bàn"},{"question":"Cấu trúc “[Danh từ/Đại từ] + [Danh từ phương vị (上, 下, 前, 后, 里, 外, v.v.)]” thuộc điểm ngữ pháp nào?","options":["Danh từ chỉ phương hướng và vị trí","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Danh từ chỉ phương hướng và vị trí","explanation":"Trong tiếng Trung, để chỉ vị trí của một vật, ta đặt danh từ chỉ vật đó trước từ chỉ phương vị. Các từ như 「上」 (trên), 「下」 (dưới), 「里」 (trong) luôn đứng sau danh từ gốc để xác định rõ vị trí không gian."},{"question":"Câu “在桌子上” minh họa điểm ngữ pháp nào?","options":["Danh từ chỉ phương hướng và vị trí","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Danh từ chỉ phương hướng và vị trí","explanation":"Đừng nhầm lẫn thứ tự: trong tiếng Trung, danh từ luôn đứng trước từ chỉ phương vị, ngược lại với tiếng Việt thường có từ 'ở' hoặc 'bên' đứng trước."}]},{"name":"Giới từ chỉ địa điểm 在","formula":"Chủ ngữ + 在 (zài) + Địa điểm + Động từ","explanation":"Giới từ 「在」 được dùng để chỉ nơi chốn mà hành động diễn ra. Bạn đặt 「在」 cùng với địa điểm ngay trước động từ để làm rõ vị trí thực hiện hành động đó.","tip":"Hãy nhớ cấu trúc này giúp bạn trả lời cho câu hỏi 'làm gì ở đâu', ví dụ: 「我在学校学习」(Tôi học ở trường).","note":"Đừng quên đặt 「在」 trước động từ, tránh nhầm lẫn đặt sau động từ như trong tiếng Việt.","examples":[{"hanzi":"我在学校学习。","pinyin":"wǒ zài xué xiào xué xí","meaning":"Tôi học ở trường."},{"hanzi":"我爸爸也在医院工作。","pinyin":"wǒ bà bà yě zài yī yuàn gōng zuò","meaning":"Bố tôi cũng làm việc ở bệnh viện."}],"quiz":[{"question":"Công thức đúng của “Giới từ chỉ địa điểm 在” là gì?","options":["Chủ ngữ + 在 (zài) + Địa điểm + Động từ","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Chủ ngữ + 在 (zài) + Địa điểm + Động từ","explanation":"Giới từ 「在」 được dùng để chỉ nơi chốn mà hành động diễn ra. Bạn đặt 「在」 cùng với địa điểm ngay trước động từ để làm rõ vị trí thực hiện hành động đó."},{"question":"Ví dụ nào minh họa “Giới từ chỉ địa điểm 在”?","options":["我在学校学习。","我是学生。","他是中国人。","我的中文老师"],"answer":"我在学校学习。","explanation":"我在学校学习。 — Tôi học ở trường."},{"question":"“我在学校学习。” có nghĩa tiếng Việt nào?","options":["Tôi học ở trường.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi học ở trường.","explanation":"wǒ zài xué xiào xué xí — Tôi học ở trường."},{"question":"Cấu trúc “Chủ ngữ + 在 (zài) + Địa điểm + Động từ” thuộc điểm ngữ pháp nào?","options":["Giới từ chỉ địa điểm 在","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Giới từ chỉ địa điểm 在","explanation":"Giới từ 「在」 được dùng để chỉ nơi chốn mà hành động diễn ra. Bạn đặt 「在」 cùng với địa điểm ngay trước động từ để làm rõ vị trí thực hiện hành động đó."},{"question":"Câu “我在学校学习。” minh họa điểm ngữ pháp nào?","options":["Giới từ chỉ địa điểm 在","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Giới từ chỉ địa điểm 在","explanation":"Đừng quên đặt 「在」 trước động từ, tránh nhầm lẫn đặt sau động từ như trong tiếng Việt."}]},{"name":"Động từ năng nguyện 能","formula":"Chủ ngữ + 能 + Động từ + (Tân ngữ)","explanation":"Động từ năng nguyện 「能」 được dùng trước động từ để biểu thị khả năng hoặc sự cho phép làm một việc gì đó. Bạn có thể hiểu 「能」 tương đương với \"có thể\" trong tiếng Việt.","tip":"Khi muốn phủ định, bạn chỉ cần thêm 「不」 phía trước thành 「不能」 (không thể).","note":"Khác với 「会」 (biết làm gì nhờ học tập), 「能」 thiên về khả năng khách quan hoặc sự cho phép.","examples":[{"hanzi":"我能去。","pinyin":"wǒ néng qù","meaning":"Tôi có thể đi."},{"hanzi":"星期五前能回家吗？","pinyin":"xīng qī wǔ qián néng huí jiā ma","meaning":"Trước thứ Sáu có thể về nhà không?"}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 能” là gì?","options":["Chủ ngữ + 能 + Động từ + (Tân ngữ)","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 能 + Động từ + (Tân ngữ)","explanation":"Động từ năng nguyện 「能」 được dùng trước động từ để biểu thị khả năng hoặc sự cho phép làm một việc gì đó. Bạn có thể hiểu 「能」 tương đương với \"có thể\" trong tiếng Việt."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 能”?","options":["我能去。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我能去。","explanation":"我能去。 — Tôi có thể đi."},{"question":"“我能去。” có nghĩa tiếng Việt nào?","options":["Tôi có thể đi.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Tôi có thể đi.","explanation":"wǒ néng qù — Tôi có thể đi."},{"question":"Cấu trúc “Chủ ngữ + 能 + Động từ + (Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 能","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Động từ năng nguyện 能","explanation":"Động từ năng nguyện 「能」 được dùng trước động từ để biểu thị khả năng hoặc sự cho phép làm một việc gì đó. Bạn có thể hiểu 「能」 tương đương với \"có thể\" trong tiếng Việt."},{"question":"Câu “我能去。” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 能","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Động từ năng nguyện 能","explanation":"Khác với 「会」 (biết làm gì nhờ học tập), 「能」 thiên về khả năng khách quan hoặc sự cho phép."}]}],"9":[{"name":"Câu tồn tại với 有 và 是","formula":"[Địa điểm] + 有/是 + [Danh từ]","explanation":"Cấu trúc này dùng để diễn tả sự tồn tại của người hoặc vật tại một địa điểm cụ thể. Khi dùng 「有」, câu mang nghĩa 'có cái gì ở đâu', còn dùng 「是」 thường mang nghĩa 'là' hoặc 'có sự hiện diện của'. Đây là dạng câu cơ bản để mô tả không gian trong tiếng Trung.","tip":"Luôn đặt từ chỉ vị trí (nơi chốn) lên đầu câu để xác định phạm vi tồn tại trước khi nhắc đến đối tượng.","note":"Khi chuyển sang phủ định với 「有」, bạn bắt buộc phải dùng 「没有」, không được dùng 「不有」.","examples":[{"hanzi":"桌子上有/是一本书。","pinyin":"zhuō zi shàng yǒu shì yī běn shū","meaning":"Trên bàn có một quyển sách."},{"hanzi":"学校前边有一家电影院。","pinyin":"xué xiào qián biān yǒu yī jiā diàn yǐng yuàn","meaning":"Phía trước trường học có một rạp chiếu phim."}],"quiz":[{"question":"Công thức đúng của “Câu tồn tại với 有 và 是” là gì?","options":["[Địa điểm] + 有/是 + [Danh từ]","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"[Địa điểm] + 有/是 + [Danh từ]","explanation":"Cấu trúc này dùng để diễn tả sự tồn tại của người hoặc vật tại một địa điểm cụ thể. Khi dùng 「有」, câu mang nghĩa 'có cái gì ở đâu', còn dùng 「是」 thường mang nghĩa 'là' hoặc 'có sự hiện diện của'. Đây là dạng câu cơ bản để mô tả không gian trong tiếng Trung."},{"question":"Ví dụ nào minh họa “Câu tồn tại với 有 và 是”?","options":["桌子上有/是一本书。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"桌子上有/是一本书。","explanation":"桌子上有/是一本书。 — Trên bàn có một quyển sách."},{"question":"“桌子上有/是一本书。” có nghĩa tiếng Việt nào?","options":["Trên bàn có một quyển sách.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Trên bàn có một quyển sách.","explanation":"zhuō zi shàng yǒu shì yī běn shū — Trên bàn có một quyển sách."},{"question":"Cấu trúc “[Địa điểm] + 有/是 + [Danh từ]” thuộc điểm ngữ pháp nào?","options":["Câu tồn tại với 有 và 是","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu tồn tại với 有 và 是","explanation":"Cấu trúc này dùng để diễn tả sự tồn tại của người hoặc vật tại một địa điểm cụ thể. Khi dùng 「有」, câu mang nghĩa 'có cái gì ở đâu', còn dùng 「是」 thường mang nghĩa 'là' hoặc 'có sự hiện diện của'. Đây là dạng câu cơ bản để mô tả không gian trong tiếng Trung."},{"question":"Câu “桌子上有/是一本书。” minh họa điểm ngữ pháp nào?","options":["Câu tồn tại với 有 và 是","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu tồn tại với 有 và 是","explanation":"Khi chuyển sang phủ định với 「有」, bạn bắt buộc phải dùng 「没有」, không được dùng 「不有」."}]},{"name":"Thứ tự trạng ngữ thời gian và địa điểm","formula":"Chủ ngữ + Trạng ngữ thời gian + Trạng ngữ địa điểm + Động từ","explanation":"Trong câu tiếng Trung, khi muốn nói về cả thời gian và địa điểm, bạn cần đặt trạng ngữ chỉ thời gian lên trước trạng ngữ chỉ địa điểm. Cấu trúc này giúp câu văn nghe tự nhiên và đúng quy tắc diễn đạt của người bản xứ.","tip":"Bạn có thể nhớ mẹo là \"Thời gian đi trước, nơi chốn theo sau\" để không bị nhầm lẫn.","note":"Lưu ý không đặt trạng ngữ thời gian ở cuối câu như trong tiếng Việt.","examples":[{"hanzi":"我们上午十点在书店见吧。","pinyin":"wǒ men shàng wǔ shí diǎn zài shū diàn jiàn ba","meaning":"Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé."},{"hanzi":"我明天上午在学校学习。","pinyin":"wǒ míng tiān shàng wǔ zài xué xiào xué xí","meaning":"Tôi học ở trường vào sáng mai."}],"quiz":[{"question":"Công thức đúng của “Thứ tự trạng ngữ thời gian và địa điểm” là gì?","options":["Chủ ngữ + Trạng ngữ thời gian + Trạng ngữ địa điểm + Động từ","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Chủ ngữ + Trạng ngữ thời gian + Trạng ngữ địa điểm + Động từ","explanation":"Trong câu tiếng Trung, khi muốn nói về cả thời gian và địa điểm, bạn cần đặt trạng ngữ chỉ thời gian lên trước trạng ngữ chỉ địa điểm. Cấu trúc này giúp câu văn nghe tự nhiên và đúng quy tắc diễn đạt của người bản xứ."},{"question":"Ví dụ nào minh họa “Thứ tự trạng ngữ thời gian và địa điểm”?","options":["我们上午十点在书店见吧。","我是学生。","他是中国人。","我的中文老师"],"answer":"我们上午十点在书店见吧。","explanation":"我们上午十点在书店见吧。 — Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé."},{"question":"“我们上午十点在书店见吧。” có nghĩa tiếng Việt nào?","options":["Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé.","explanation":"wǒ men shàng wǔ shí diǎn zài shū diàn jiàn ba — Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé."},{"question":"Cấu trúc “Chủ ngữ + Trạng ngữ thời gian + Trạng ngữ địa điểm + Động từ” thuộc điểm ngữ pháp nào?","options":["Thứ tự trạng ngữ thời gian và địa điểm","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Thứ tự trạng ngữ thời gian và địa điểm","explanation":"Trong câu tiếng Trung, khi muốn nói về cả thời gian và địa điểm, bạn cần đặt trạng ngữ chỉ thời gian lên trước trạng ngữ chỉ địa điểm. Cấu trúc này giúp câu văn nghe tự nhiên và đúng quy tắc diễn đạt của người bản xứ."},{"question":"Câu “我们上午十点在书店见吧。” minh họa điểm ngữ pháp nào?","options":["Thứ tự trạng ngữ thời gian và địa điểm","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Thứ tự trạng ngữ thời gian và địa điểm","explanation":"Lưu ý không đặt trạng ngữ thời gian ở cuối câu như trong tiếng Việt."}]},{"name":"Số thứ tự với 第","formula":"第 + Số đếm + (Lượng từ) + Danh từ","explanation":"Trong tiếng Trung, để biến một số đếm thành số thứ tự, chúng ta chỉ cần thêm tiền tố 「第」 vào trước số đó. Ví dụ, 「第一」 (dì yī) có nghĩa là \"thứ nhất\", 「第二」 (dì èr) là \"thứ hai\". Cấu trúc này dùng để chỉ thứ tự, xếp hạng hoặc lần lượt của sự việc.","tip":"Khi muốn nói về số lần (ví dụ: lần thứ nhất), bạn cần thêm lượng từ 「次」 ngay sau số đếm: 「第一次」 (dì yī cì).","note":"Đừng quên 「第」 chỉ dùng cho số đếm, không dùng cho số lượng ước chừng như 「几」 hay số lượng cụ thể mang tính tổng cộng.","examples":[{"hanzi":"第一，第一个，第一个学生","pinyin":"dì yī dì yī gè dì yī gè xué shēng","meaning":"Thứ nhất, cái đầu tiên, học sinh đầu tiên"},{"hanzi":"这是我的第二本中文书。","pinyin":"zhè shì wǒ de dì èr běn zhōng wén shū","meaning":"Đây là quyển sách tiếng Trung thứ hai của tôi."}],"quiz":[{"question":"Công thức đúng của “Số thứ tự với 第” là gì?","options":["第 + Số đếm + (Lượng từ) + Danh từ","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"第 + Số đếm + (Lượng từ) + Danh từ","explanation":"Trong tiếng Trung, để biến một số đếm thành số thứ tự, chúng ta chỉ cần thêm tiền tố 「第」 vào trước số đó. Ví dụ, 「第一」 (dì yī) có nghĩa là \"thứ nhất\", 「第二」 (dì èr) là \"thứ hai\". Cấu trúc này dùng để chỉ thứ tự, xếp hạng hoặc lần lượt của sự việc."},{"question":"Ví dụ nào minh họa “Số thứ tự với 第”?","options":["第一，第一个，第一个学生","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"第一，第一个，第一个学生","explanation":"第一，第一个，第一个学生 — Thứ nhất, cái đầu tiên, học sinh đầu tiên"},{"question":"“第一，第一个，第一个学生” có nghĩa tiếng Việt nào?","options":["Thứ nhất, cái đầu tiên, học sinh đầu tiên","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Thứ nhất, cái đầu tiên, học sinh đầu tiên","explanation":"dì yī dì yī gè dì yī gè xué shēng — Thứ nhất, cái đầu tiên, học sinh đầu tiên"},{"question":"Cấu trúc “第 + Số đếm + (Lượng từ) + Danh từ” thuộc điểm ngữ pháp nào?","options":["Số thứ tự với 第","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Số thứ tự với 第","explanation":"Trong tiếng Trung, để biến một số đếm thành số thứ tự, chúng ta chỉ cần thêm tiền tố 「第」 vào trước số đó. Ví dụ, 「第一」 (dì yī) có nghĩa là \"thứ nhất\", 「第二」 (dì èr) là \"thứ hai\". Cấu trúc này dùng để chỉ thứ tự, xếp hạng hoặc lần lượt của sự việc."},{"question":"Câu “第一，第一个，第一个学生” minh họa điểm ngữ pháp nào?","options":["Số thứ tự với 第","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Số thứ tự với 第","explanation":"Đừng quên 「第」 chỉ dùng cho số đếm, không dùng cho số lượng ước chừng như 「几」 hay số lượng cụ thể mang tính tổng cộng."}]}],"10":[{"name":"Cách đọc tiền tệ trong tiếng Trung","formula":"Số đếm + Đơn vị (元/角/分 hoặc 块/毛/分)","explanation":"Trong tiếng Trung, đơn vị tiền tệ chính là 「元」 (văn viết), 「角」 và 「分」. Trong giao tiếp hằng ngày, người ta thường dùng 「块」 thay cho 「元」 và 「毛」 thay cho 「角」. Đơn vị 「分」 được giữ nguyên trong cả văn nói và văn viết.","tip":"Hãy nhớ quy đổi đơn vị: 1 「元」 (块) = 10 「角」 (毛) = 100 「分」.","note":"Không nên dùng lẫn lộn đơn vị văn viết và văn nói trong cùng một cụm từ, ví dụ nên chọn dùng 「块」 và 「毛」 khi nói chuyện.","examples":[{"hanzi":"三块","pinyin":"sān kuài","meaning":"Ba tệ"},{"hanzi":"三块二","pinyin":"sān kuài èr","meaning":"Ba tệ hai hào"}],"quiz":[{"question":"Công thức đúng của “Cách đọc tiền tệ trong tiếng Trung” là gì?","options":["Số đếm + Đơn vị (元/角/分 hoặc 块/毛/分)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Số đếm + Đơn vị (元/角/分 hoặc 块/毛/分)","explanation":"Trong tiếng Trung, đơn vị tiền tệ chính là 「元」 (văn viết), 「角」 và 「分」. Trong giao tiếp hằng ngày, người ta thường dùng 「块」 thay cho 「元」 và 「毛」 thay cho 「角」. Đơn vị 「分」 được giữ nguyên trong cả văn nói và văn viết."},{"question":"Ví dụ nào minh họa “Cách đọc tiền tệ trong tiếng Trung”?","options":["三块","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"三块","explanation":"三块 — Ba tệ"},{"question":"“三块” có nghĩa tiếng Việt nào?","options":["Ba tệ","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Ba tệ","explanation":"sān kuài — Ba tệ"},{"question":"Cấu trúc “Số đếm + Đơn vị (元/角/分 hoặc 块/毛/分)” thuộc điểm ngữ pháp nào?","options":["Cách đọc tiền tệ trong tiếng Trung","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Cách đọc tiền tệ trong tiếng Trung","explanation":"Trong tiếng Trung, đơn vị tiền tệ chính là 「元」 (văn viết), 「角」 và 「分」. Trong giao tiếp hằng ngày, người ta thường dùng 「块」 thay cho 「元」 và 「毛」 thay cho 「角」. Đơn vị 「分」 được giữ nguyên trong cả văn nói và văn viết."},{"question":"Câu “三块” minh họa điểm ngữ pháp nào?","options":["Cách đọc tiền tệ trong tiếng Trung","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Cách đọc tiền tệ trong tiếng Trung","explanation":"Không nên dùng lẫn lộn đơn vị văn viết và văn nói trong cùng một cụm từ, ví dụ nên chọn dùng 「块」 và 「毛」 khi nói chuyện."}]},{"name":"Câu vị ngữ tính từ","formula":"Chủ ngữ + (phó từ chỉ mức độ) + Tính từ","explanation":"Trong câu vị ngữ tính từ, tính từ đóng vai trò làm vị ngữ thay cho động từ. Khi dùng cấu trúc này, ta thường thêm phó từ chỉ mức độ như 「很」 (rất) vào trước tính từ để câu tự nhiên hơn.","tip":"Dù trong tiếng Việt không dịch 「很」, nhưng trong tiếng Trung bạn nên thêm nó vào để tránh câu bị cụt.","note":"Không được thêm động từ 「是」 trước tính từ trong câu vị ngữ tính từ.","examples":[{"hanzi":"这个苹果很好吃。","pinyin":"zhè gè píng guǒ hěn hǎo chī","meaning":"Quả táo này rất ngon."},{"hanzi":"我的房间不大。","pinyin":"wǒ de fáng jiān bù dà","meaning":"Phòng của tôi không lớn."}],"quiz":[{"question":"Công thức đúng của “Câu vị ngữ tính từ” là gì?","options":["Chủ ngữ + (phó từ chỉ mức độ) + Tính từ","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Chủ ngữ + (phó từ chỉ mức độ) + Tính từ","explanation":"Trong câu vị ngữ tính từ, tính từ đóng vai trò làm vị ngữ thay cho động từ. Khi dùng cấu trúc này, ta thường thêm phó từ chỉ mức độ như 「很」 (rất) vào trước tính từ để câu tự nhiên hơn."},{"question":"Ví dụ nào minh họa “Câu vị ngữ tính từ”?","options":["这个苹果很好吃。","我是学生。","他是中国人。","我的中文老师"],"answer":"这个苹果很好吃。","explanation":"这个苹果很好吃。 — Quả táo này rất ngon."},{"question":"“这个苹果很好吃。” có nghĩa tiếng Việt nào?","options":["Quả táo này rất ngon.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Quả táo này rất ngon.","explanation":"zhè gè píng guǒ hěn hǎo chī — Quả táo này rất ngon."},{"question":"Cấu trúc “Chủ ngữ + (phó từ chỉ mức độ) + Tính từ” thuộc điểm ngữ pháp nào?","options":["Câu vị ngữ tính từ","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Câu vị ngữ tính từ","explanation":"Trong câu vị ngữ tính từ, tính từ đóng vai trò làm vị ngữ thay cho động từ. Khi dùng cấu trúc này, ta thường thêm phó từ chỉ mức độ như 「很」 (rất) vào trước tính từ để câu tự nhiên hơn."},{"question":"Câu “这个苹果很好吃。” minh họa điểm ngữ pháp nào?","options":["Câu vị ngữ tính từ","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Câu vị ngữ tính từ","explanation":"Không được thêm động từ 「是」 trước tính từ trong câu vị ngữ tính từ."}]},{"name":"Đại từ nghi vấn 怎么样","formula":"Chủ ngữ + 怎么样？","explanation":"Từ 「怎么样」 được dùng để hỏi về tính chất, tình trạng của người hoặc sự vật. Bạn cũng có thể dùng nó để hỏi ý kiến hoặc đưa ra một đề xuất về một vấn đề nào đó.","tip":"Bạn có thể dịch 「怎么样」 là 'như thế nào' hoặc 'thế nào' trong tiếng Việt để dễ ghi nhớ.","note":"Lưu ý không dùng 「怎么样」 để hỏi về số lượng hay giá cả (vốn dùng 「多少」).","examples":[{"hanzi":"这件衣服怎么样？","pinyin":"zhè jiàn yī fú zěn me yàng","meaning":"Bộ quần áo này thế nào?"},{"hanzi":"这个杯子怎么样？","pinyin":"zhè gè bēi zi zěn me yàng","meaning":"Cái ly này thế nào?"}],"quiz":[{"question":"Công thức đúng của “Đại từ nghi vấn 怎么样” là gì?","options":["Chủ ngữ + 怎么样？","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 怎么样？","explanation":"Từ 「怎么样」 được dùng để hỏi về tính chất, tình trạng của người hoặc sự vật. Bạn cũng có thể dùng nó để hỏi ý kiến hoặc đưa ra một đề xuất về một vấn đề nào đó."},{"question":"Ví dụ nào minh họa “Đại từ nghi vấn 怎么样”?","options":["这件衣服怎么样？","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"这件衣服怎么样？","explanation":"这件衣服怎么样？ — Bộ quần áo này thế nào?"},{"question":"“这件衣服怎么样？” có nghĩa tiếng Việt nào?","options":["Bộ quần áo này thế nào?","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Bộ quần áo này thế nào?","explanation":"zhè jiàn yī fú zěn me yàng — Bộ quần áo này thế nào?"},{"question":"Cấu trúc “Chủ ngữ + 怎么样？” thuộc điểm ngữ pháp nào?","options":["Đại từ nghi vấn 怎么样","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Đại từ nghi vấn 怎么样","explanation":"Từ 「怎么样」 được dùng để hỏi về tính chất, tình trạng của người hoặc sự vật. Bạn cũng có thể dùng nó để hỏi ý kiến hoặc đưa ra một đề xuất về một vấn đề nào đó."},{"question":"Câu “这件衣服怎么样？” minh họa điểm ngữ pháp nào?","options":["Đại từ nghi vấn 怎么样","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Đại từ nghi vấn 怎么样","explanation":"Lưu ý không dùng 「怎么样」 để hỏi về số lượng hay giá cả (vốn dùng 「多少」)."}]}],"11":[{"name":"Câu hỏi chính phản","formula":"Động từ/Tính từ + 不 (bù) + Động từ/Tính từ","explanation":"Câu hỏi chính phản sử dụng hình thức khẳng định và phủ định của từ ngữ đứng cạnh nhau để tạo thành câu hỏi. Bạn không cần dùng trợ từ nghi vấn 「吗」 ở cuối câu khi đã sử dụng cấu trúc này. Ví dụ: 「你去不去？」(Bạn có đi hay không đi?).","tip":"Cấu trúc này giúp câu hỏi trở nên trực diện và tự nhiên hơn trong giao tiếp hàng ngày so với việc dùng 「吗」.","note":"Không được thêm 「吗」 vào cuối câu khi đã sử dụng dạng câu hỏi chính phản vì sẽ gây lặp cấu trúc nghi vấn.","examples":[{"hanzi":"好不好？","pinyin":"hǎo bù hǎo","meaning":"Tốt không?"},{"hanzi":"你去不去学校？","pinyin":"nǐ qù bù qù xué xiào","meaning":"Bạn có đi học không?"}],"quiz":[{"question":"Công thức đúng của “Câu hỏi chính phản” là gì?","options":["Động từ/Tính từ + 不 (bù) + Động từ/Tính từ","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Động từ/Tính từ + 不 (bù) + Động từ/Tính từ","explanation":"Câu hỏi chính phản sử dụng hình thức khẳng định và phủ định của từ ngữ đứng cạnh nhau để tạo thành câu hỏi. Bạn không cần dùng trợ từ nghi vấn 「吗」 ở cuối câu khi đã sử dụng cấu trúc này. Ví dụ: 「你去不去？」(Bạn có đi hay không đi?)."},{"question":"Ví dụ nào minh họa “Câu hỏi chính phản”?","options":["好不好？","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"好不好？","explanation":"好不好？ — Tốt không?"},{"question":"“好不好？” có nghĩa tiếng Việt nào?","options":["Tốt không?","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Tốt không?","explanation":"hǎo bù hǎo — Tốt không?"},{"question":"Cấu trúc “Động từ/Tính từ + 不 (bù) + Động từ/Tính từ” thuộc điểm ngữ pháp nào?","options":["Câu hỏi chính phản","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu hỏi chính phản","explanation":"Câu hỏi chính phản sử dụng hình thức khẳng định và phủ định của từ ngữ đứng cạnh nhau để tạo thành câu hỏi. Bạn không cần dùng trợ từ nghi vấn 「吗」 ở cuối câu khi đã sử dụng cấu trúc này. Ví dụ: 「你去不去？」(Bạn có đi hay không đi?)."},{"question":"Câu “好不好？” minh họa điểm ngữ pháp nào?","options":["Câu hỏi chính phản","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu hỏi chính phản","explanation":"Không được thêm 「吗」 vào cuối câu khi đã sử dụng dạng câu hỏi chính phản vì sẽ gây lặp cấu trúc nghi vấn."}]},{"name":"Diễn tả hành động đang tiếp diễn","formula":"Chủ ngữ + (正/正在/在) + Động từ + (呢)","explanation":"Các phó từ 「在」, 「正在」 hoặc 「正」 được đặt trước động từ để diễn tả hành động đang thực sự xảy ra tại thời điểm nói. Bạn có thể thêm trợ từ ngữ khí 「呢」 vào cuối câu để nhấn mạnh trạng thái tiếp diễn của hành động đó.","tip":"Nếu muốn nhấn mạnh hơn vào thời điểm chính xác hành động đang xảy ra, hãy ưu tiên dùng 「正在」 hoặc kết hợp cả 「正...呢」.","note":"Cần phân biệt 「在」 là phó từ chỉ thời gian (đang) với 「在」 là giới từ chỉ địa điểm (ở), ví dụ: 「我在家」 (Tôi ở nhà) khác với 「我正在看书」 (Tôi đang đọc sách).","examples":[{"hanzi":"他在休息呢。","pinyin":"tā zài xiū xī ne","meaning":"Anh ấy đang nghỉ ngơi."},{"hanzi":"我正在看电视。","pinyin":"wǒ zhèng zài kàn diàn shì","meaning":"Tôi đang xem tivi."}],"quiz":[{"question":"Công thức đúng của “Diễn tả hành động đang tiếp diễn” là gì?","options":["Chủ ngữ + (正/正在/在) + Động từ + (呢)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/
