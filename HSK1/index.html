i: “妈妈：你今天去超市吗？”", "evidence": "妈妈：你今天去超市吗？"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R06-2", "lesson": 6, "revision": 2, "title": "Hẹn nhau qua điện thoại", "text": "同学：李文，你的手机号是多少？\n李文：一三八，六六六六，二二二二。\n同学：谢谢！明天你休息吗？\n李文：休息。我想坐出租车去超市买东西。\n同学：我也去。\n李文：明天去。", "translation": "Bạn học: Lý Văn, số điện thoại di động của bạn là bao nhiêu? Lý Văn: 138 6666 2222. Bạn học: Cảm ơn! Ngày mai bạn có nghỉ không? Lý Văn: Có. Mình muốn đi taxi đến siêu thị mua đồ. Bạn học: Mình cũng đi. Lý Văn: Ngày mai đi nhé.", "questions": [{"id": "R06-2-v2-1", "question": "手机号是____。", "answer": "一三八六六六六二二二二", "options": ["三个", "四个", "五个", "一三八六六六六二二二二"], "explanation": "Đáp án: 一三八六六六六二二二二. Thông tin đối chiếu trong bài: “同学：李文，你的手机号是多少？”", "evidence": "同学：李文，你的手机号是多少？"}, {"id": "R06-2-v2-2", "question": "李文明天休息吗？", "answer": "休息", "options": ["休息", "去", "不去", "不大"], "explanation": "Đáp án: 休息. Thông tin đối chiếu trong bài: “李文：休息。”", "evidence": "李文：休息。"}, {"id": "R06-2-v2-3", "question": "李文想去哪儿？", "answer": "超市", "options": ["家", "超市", "那边", "中国"], "explanation": "Đáp án: 超市. Thông tin đối chiếu trong bài: “我想坐出租车去超市买东西。”", "evidence": "我想坐出租车去超市买东西。"}, {"id": "R06-2-v2-4", "question": "李文想怎么去？", "answer": "坐出租车", "options": ["想", "工作", "坐出租车", "认识"], "explanation": "Đáp án: 坐出租车. Thông tin đối chiếu trong bài: “我想坐出租车去超市买东西。”", "evidence": "我想坐出租车去超市买东西。"}, {"id": "R06-2-v2-5", "question": "去超市做什么？", "answer": "买东西", "options": ["做饭", "做菜", "休息", "买东西"], "explanation": "Đáp án: 买东西. Thông tin đối chiếu trong bài: “我想坐出租车去超市买东西。”", "evidence": "我想坐出租车去超市买东西。"}, {"id": "R06-2-v2-6", "question": "谁也想去？", "answer": "同学", "options": ["同学", "您", "大家", "你们"], "explanation": "Đáp án: 同学. Thông tin đối chiếu trong bài: “同学：我也去。”", "evidence": "同学：我也去。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R06-3", "lesson": 6, "revision": 2, "title": "Hai anh em chuẩn bị bữa tối", "text": "今天爸爸妈妈工作很忙。我和哥哥想做晚饭。哥哥会做面条儿，我会做菜。我想买一些菜，哥哥想买包子。妈妈喜欢包子，爸爸喜欢米饭。哥哥的面条儿也非常好吃。", "translation": "Hôm nay bố mẹ làm việc rất bận. Tôi và anh trai muốn nấu bữa tối. Anh biết làm mì, tôi biết làm món ăn. Tôi muốn mua một ít rau, anh muốn mua bánh bao. Mẹ thích bánh bao, bố thích cơm. Mì anh làm cũng rất ngon.", "questions": [{"id": "R06-3-v2-1", "question": "谁想做晚饭？", "answer": "我和哥哥", "options": ["姐姐", "她", "我们", "我和哥哥"], "explanation": "Đáp án: 我和哥哥. Thông tin đối chiếu trong bài: “我和哥哥想做晚饭。”", "evidence": "我和哥哥想做晚饭。"}, {"id": "R06-3-v2-2", "question": "哥哥会做什么？", "answer": "面条儿", "options": ["面条儿", "米饭", "牛奶和包子", "米饭和菜"], "explanation": "Đáp án: 面条儿. Thông tin đối chiếu trong bài: “哥哥会做面条儿，我会做菜。”", "evidence": "哥哥会做面条儿，我会做菜。"}, {"id": "R06-3-v2-3", "question": "我会做什么？", "answer": "菜", "options": ["面条儿", "菜", "牛奶", "包子"], "explanation": "Đáp án: 菜. Thông tin đối chiếu trong bài: “哥哥会做面条儿，我会做菜。”", "evidence": "哥哥会做面条儿，我会做菜。"}, {"id": "R06-3-v2-4", "question": "哥哥想买什么？", "answer": "包子", "options": ["面条儿", "一些菜", "包子", "牛奶"], "explanation": "Đáp án: 包子. Thông tin đối chiếu trong bài: “我想买一些菜，哥哥想买包子。”", "evidence": "我想买一些菜，哥哥想买包子。"}, {"id": "R06-3-v2-5", "question": "妈妈喜欢什么？", "answer": "包子", "options": ["饺子", "面条儿", "一些菜", "包子"], "explanation": "Đáp án: 包子. Thông tin đối chiếu trong bài: “妈妈喜欢包子，爸爸喜欢米饭。”", "evidence": "妈妈喜欢包子，爸爸喜欢米饭。"}, {"id": "R06-3-v2-6", "question": "爸爸喜欢什么？", "answer": "米饭", "options": ["米饭", "菜和饺子", "面条儿和菜", "菜"], "explanation": "Đáp án: 米饭. Thông tin đối chiếu trong bài: “妈妈喜欢包子，爸爸喜欢米饭。”", "evidence": "妈妈喜欢包子，爸爸喜欢米饭。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R06-4", "lesson": 6, "revision": 2, "title": "Chọn cách đi siêu thị", "text": "姐姐：你想去哪儿？\n我：我想去那边的超市。\n姐姐：你怎么去？\n我：坐出租车。你也去吗？\n姐姐：不，我今天下班想休息。你想买一些牛奶吗？\n我：我想买牛奶，也想买包子。", "translation": "Chị gái: Em muốn đi đâu? Tôi: Em muốn đến siêu thị bên kia. Chị gái: Em đi bằng gì? Tôi: Em đi taxi. Chị có đi không? Chị gái: Không, hôm nay tan làm chị muốn nghỉ. Em có muốn mua ít sữa không? Tôi: Em muốn mua sữa và cũng muốn mua bánh bao.", "questions": [{"id": "R06-4-v2-1", "question": "我想去哪儿？", "answer": "超市", "options": ["那边", "中国", "法国", "超市"], "explanation": "Đáp án: 超市. Thông tin đối chiếu trong bài: “我：我想去那边的超市。”", "evidence": "我：我想去那边的超市。"}, {"id": "R06-4-v2-2", "question": "____的超市。", "answer": "那边", "options": ["那边", "超市", "中国", "法国"], "explanation": "Đáp án: 那边. Thông tin đối chiếu trong bài: “我：我想去那边的超市。”", "evidence": "我：我想去那边的超市。"}, {"id": "R06-4-v2-3", "question": "我怎么去？", "answer": "坐出租车", "options": ["认识", "坐出租车", "做饭", "做菜"], "explanation": "Đáp án: 坐出租车. Thông tin đối chiếu trong bài: “我：坐出租车。”", "evidence": "我：坐出租车。"}, {"id": "R06-4-v2-4", "question": "姐姐也去吗？", "answer": "不去", "options": ["不大", "好吃", "不去", "很好看"], "explanation": "Đáp án: 不去. Thông tin đối chiếu trong bài: “姐姐：不，我今天下班想休息。”", "evidence": "姐姐：不，我今天下班想休息。"}, {"id": "R06-4-v2-5", "question": "姐姐下班想做什么？", "answer": "休息", "options": ["做饭", "做菜", "买东西", "休息"], "explanation": "Đáp án: 休息. Thông tin đối chiếu trong bài: “姐姐：不，我今天下班想休息。”", "evidence": "姐姐：不，我今天下班想休息。"}, {"id": "R06-4-v2-6", "question": "我想买牛奶和____。", "answer": "包子", "options": ["包子", "一些菜", "牛奶", "米饭"], "explanation": "Đáp án: 包子. Thông tin đối chiếu trong bài: “我：我想买牛奶，也想买包子。”", "evidence": "我：我想买牛奶，也想买包子。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R06-5", "lesson": 6, "revision": 2, "title": "Bữa sáng và bữa tối", "text": "我喜欢吃包子，妹妹喜欢吃饺子。今天妈妈做饺子，爸爸买牛奶。妈妈的饺子非常好吃。明天我想吃面条儿。妹妹不想吃面条儿，她还想吃饺子。爸爸明天做晚饭。", "translation": "Tôi thích ăn bánh bao, em gái thích ăn sủi cảo. Hôm nay mẹ làm sủi cảo, bố mua sữa. Sủi cảo của mẹ rất ngon. Ngày mai tôi muốn ăn mì. Em gái không muốn ăn mì, em vẫn muốn ăn sủi cảo. Ngày mai bố nấu bữa tối.", "questions": [{"id": "R06-5-v2-1", "question": "我喜欢吃什么？", "answer": "包子", "options": ["面条儿", "一些菜", "牛奶", "包子"], "explanation": "Đáp án: 包子. Thông tin đối chiếu trong bài: “我喜欢吃包子，妹妹喜欢吃饺子。”", "evidence": "我喜欢吃包子，妹妹喜欢吃饺子。"}, {"id": "R06-5-v2-2", "question": "妹妹喜欢吃什么？", "answer": "饺子", "options": ["饺子", "米饭和菜", "面条儿和菜", "菜"], "explanation": "Đáp án: 饺子. Thông tin đối chiếu trong bài: “我喜欢吃包子，妹妹喜欢吃饺子。”", "evidence": "我喜欢吃包子，妹妹喜欢吃饺子。"}, {"id": "R06-5-v2-3", "question": "今天谁买牛奶？", "answer": "爸爸", "options": ["泰国人", "爸爸", "我", "你"], "explanation": "Đáp án: 爸爸. Thông tin đối chiếu trong bài: “今天妈妈做饺子，爸爸买牛奶。”", "evidence": "今天妈妈做饺子，爸爸买牛奶。"}, {"id": "R06-5-v2-4", "question": "谁的饺子非常好吃？", "answer": "妈妈", "options": ["他", "家人", "妈妈", "中国人"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “妈妈的饺子非常好吃。”", "evidence": "妈妈的饺子非常好吃。"}, {"id": "R06-5-v2-5", "question": "我明天想吃什么？", "answer": "面条儿", "options": ["菜", "饺子", "一些菜", "面条儿"], "explanation": "Đáp án: 面条儿. Thông tin đối chiếu trong bài: “明天我想吃面条儿。”", "evidence": "明天我想吃面条儿。"}, {"id": "R06-5-v2-6", "question": "明天谁做晚饭？", "answer": "爸爸", "options": ["爸爸", "您", "大家", "你们"], "explanation": "Đáp án: 爸爸. Thông tin đối chiếu trong bài: “爸爸明天做晚饭。”", "evidence": "爸爸明天做晚饭。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R07-1", "lesson": 7, "revision": 2, "title": "Tấm lịch trong ngày", "text": "我早上八点上班，下午六点半下班。姐姐上午九点上课，下午三点下课。今天晚上七点，我们想去电影院看电影。爸爸不去，他晚上在医院上班。妈妈在家做饭。", "translation": "Buổi sáng tôi đi làm lúc tám giờ, buổi chiều tan làm lúc sáu giờ rưỡi. Chị gái lên lớp lúc chín giờ sáng, tan học lúc ba giờ chiều. Tối nay lúc bảy giờ, chúng tôi muốn đến rạp xem phim. Bố không đi vì tối bố làm ở bệnh viện. Mẹ nấu cơm ở nhà.", "questions": [{"id": "R07-1-v2-1", "question": "我几点上班？", "answer": "八点", "options": ["八点", "下班后", "今天", "明天"], "explanation": "Đáp án: 八点. Thông tin đối chiếu trong bài: “我早上八点上班，下午六点半下班。”", "evidence": "我早上八点上班，下午六点半下班。"}, {"id": "R07-1-v2-2", "question": "我几点下班？", "answer": "六点半", "options": ["星期日", "六点半", "三月八号", "四月一号"], "explanation": "Đáp án: 六点半. Thông tin đối chiếu trong bài: “我早上八点上班，下午六点半下班。”", "evidence": "我早上八点上班，下午六点半下班。"}, {"id": "R07-1-v2-3", "question": "姐姐几点上课？", "answer": "九点", "options": ["下班后", "今天", "九点", "明天"], "explanation": "Đáp án: 九点. Thông tin đối chiếu trong bài: “姐姐上午九点上课，下午三点下课。”", "evidence": "姐姐上午九点上课，下午三点下课。"}, {"id": "R07-1-v2-4", "question": "姐姐几点下课？", "answer": "三点", "options": ["五点", "六点", "七点", "三点"], "explanation": "Đáp án: 三点. Thông tin đối chiếu trong bài: “姐姐上午九点上课，下午三点下课。”", "evidence": "姐姐上午九点上课，下午三点下课。"}, {"id": "R07-1-v2-5", "question": "晚上七点我们去哪儿？", "answer": "电影院", "options": ["电影院", "家", "超市", "那边"], "explanation": "Đáp án: 电影院. Thông tin đối chiếu trong bài: “今天晚上七点，我们想去电影院看电影。”", "evidence": "今天晚上七点，我们想去电影院看电影。"}, {"id": "R07-1-v2-6", "question": "爸爸晚上在哪儿上班？", "answer": "医院", "options": ["那边", "医院", "电影院", "店里"], "explanation": "Đáp án: 医院. Thông tin đối chiếu trong bài: “爸爸不去，他晚上在医院上班。”", "evidence": "爸爸不去，他晚上在医院上班。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R07-2", "lesson": 7, "revision": 2, "title": "Rạp chiếu phim đổi giờ hẹn", "text": "同学：我们晚上六点去电影院吧！\n我：六点我还在上课。六点半下课。\n同学：七点见吧。\n我：好！你现在在哪儿？\n同学：我在超市买东西呢。下课后你吃晚饭吗？\n我：吃。我在家吃。", "translation": "Bạn học: Tối sáu giờ chúng ta đi rạp chiếu phim nhé! Tôi: Sáu giờ mình vẫn đang học. Sáu giờ rưỡi mới tan học. Bạn học: Vậy bảy giờ gặp nhé. Tôi: Được! Giờ bạn ở đâu? Bạn học: Mình đang mua đồ ở siêu thị. Tan học bạn có ăn tối không? Tôi: Có. Mình ăn ở nhà.", "questions": [{"id": "R07-2-v2-1", "question": "六点我在做什么？", "answer": "上课", "options": ["上课", "做菜", "休息", "买东西"], "explanation": "Đáp án: 上课. Thông tin đối chiếu trong bài: “我：六点我还在上课。”", "evidence": "我：六点我还在上课。"}, {"id": "R07-2-v2-2", "question": "我几点下课？", "answer": "六点半", "options": ["三点", "六点半", "五点", "七点"], "explanation": "Đáp án: 六点半. Thông tin đối chiếu trong bài: “六点半下课。”", "evidence": "六点半下课。"}, {"id": "R07-2-v2-3", "question": "我们几点见？", "answer": "七点", "options": ["星期六", "星期日", "七点", "三月八号"], "explanation": "Đáp án: 七点. Thông tin đối chiếu trong bài: “同学：七点见吧。”", "evidence": "同学：七点见吧。"}, {"id": "R07-2-v2-4", "question": "同学现在在哪儿？", "answer": "超市", "options": ["泰国", "家", "那边", "超市"], "explanation": "Đáp án: 超市. Thông tin đối chiếu trong bài: “同学：我在超市买东西呢。”", "evidence": "同学：我在超市买东西呢。"}, {"id": "R07-2-v2-5", "question": "同学在超市做什么？", "answer": "买东西", "options": ["买东西", "想", "工作", "认识"], "explanation": "Đáp án: 买东西. Thông tin đối chiếu trong bài: “同学：我在超市买东西呢。”", "evidence": "同学：我在超市买东西呢。"}, {"id": "R07-2-v2-6", "question": "我在哪儿吃晚饭？", "answer": "家", "options": ["那边", "家", "电影院", "医院"], "explanation": "Đáp án: 家. Thông tin đối chiếu trong bài: “我在家吃。”", "evidence": "我在家吃。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R07-3", "lesson": 7, "revision": 2, "title": "Ở nhà đợi chị", "text": "现在下午五点。我在家看电影呢。妈妈做饭呢，爸爸还在医院上班。姐姐六点下课。我们七点吃晚饭。今天妈妈做米饭和菜。姐姐喜欢吃米饭。", "translation": "Bây giờ là năm giờ chiều. Tôi đang xem phim ở nhà. Mẹ đang nấu cơm, bố vẫn làm ở bệnh viện. Chị gái tan học lúc sáu giờ. Chúng tôi ăn tối lúc bảy giờ. Hôm nay mẹ nấu cơm và món ăn. Chị thích ăn cơm.", "questions": [{"id": "R07-3-v2-1", "question": "现在几点？", "answer": "下午五点", "options": ["下午五点", "今天", "明天", "今年"], "explanation": "Đáp án: 下午五点. Thông tin đối chiếu trong bài: “现在下午五点。”", "evidence": "现在下午五点。"}, {"id": "R07-3-v2-2", "question": "我在做什么？", "answer": "看电影", "options": ["买东西", "看电影", "坐出租车", "上课"], "explanation": "Đáp án: 看电影. Thông tin đối chiếu trong bài: “我在家看电影呢。”", "evidence": "我在家看电影呢。"}, {"id": "R07-3-v2-3", "question": "谁做饭呢？", "answer": "妈妈", "options": ["姐姐", "她", "妈妈", "我们"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “妈妈做饭呢，爸爸还在医院上班。”", "evidence": "妈妈做饭呢，爸爸还在医院上班。"}, {"id": "R07-3-v2-4", "question": "爸爸在哪儿上班？", "answer": "医院", "options": ["中国", "法国", "泰国", "医院"], "explanation": "Đáp án: 医院. Thông tin đối chiếu trong bài: “妈妈做饭呢，爸爸还在医院上班。”", "evidence": "妈妈做饭呢，爸爸还在医院上班。"}, {"id": "R07-3-v2-5", "question": "姐姐几点下课？", "answer": "六点", "options": ["六点", "下班后", "今天", "明天"], "explanation": "Đáp án: 六点. Thông tin đối chiếu trong bài: “姐姐六点下课。”", "evidence": "姐姐六点下课。"}, {"id": "R07-3-v2-6", "question": "我们几点吃晚饭？", "answer": "七点", "options": ["早上", "七点", "星期一", "星期二"], "explanation": "Đáp án: 七点. Thông tin đối chiếu trong bài: “我们七点吃晚饭。”", "evidence": "我们七点吃晚饭。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R07-4", "lesson": 7, "revision": 2, "title": "Lớp học buổi tối", "text": "我不是老师，我是学生。我上午在店里上班，下午休息。晚上六点，我和姐姐上课，是中文课。老师八点半下课。下课后，姐姐想看电影，我想在家休息。明天早上我还上班。", "translation": "Tôi không phải giáo viên mà là học sinh. Buổi sáng tôi làm ở cửa hàng, buổi chiều nghỉ. Tối sáu giờ tôi và chị học tiếng Trung. Giáo viên kết thúc buổi học lúc tám giờ rưỡi. Sau giờ học, chị muốn xem phim còn tôi muốn nghỉ ở nhà. Sáng mai tôi vẫn đi làm.", "questions": [{"id": "R07-4-v2-1", "question": "我上午在哪儿上班？", "answer": "店里", "options": ["店里", "后", "中国", "法国"], "explanation": "Đáp án: 店里. Thông tin đối chiếu trong bài: “我上午在店里上班，下午休息。”", "evidence": "我上午在店里上班，下午休息。"}, {"id": "R07-4-v2-2", "question": "我下午做什么？", "answer": "休息", "options": ["看电影", "休息", "吃晚饭", "叫"], "explanation": "Đáp án: 休息. Thông tin đối chiếu trong bài: “我上午在店里上班，下午休息。”", "evidence": "我上午在店里上班，下午休息。"}, {"id": "R07-4-v2-3", "question": "谁和我上课？", "answer": "姐姐", "options": ["他", "家人", "姐姐", "中国人"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “晚上六点，我和姐姐上课，是中文课。”", "evidence": "晚上六点，我和姐姐上课，是中文课。"}, {"id": "R07-4-v2-4", "question": "中文课几点上课？", "answer": "六点", "options": ["三月八号", "四月一号", "五月三号", "六点"], "explanation": "Đáp án: 六点. Thông tin đối chiếu trong bài: “晚上六点，我和姐姐上课，是中文课。”", "evidence": "晚上六点，我和姐姐上课，是中文课。"}, {"id": "R07-4-v2-5", "question": "几点下课？", "answer": "八点半", "options": ["八点半", "六点十分", "下午五点", "下午两点"], "explanation": "Đáp án: 八点半. Thông tin đối chiếu trong bài: “老师八点半下课。”", "evidence": "老师八点半下课。"}, {"id": "R07-4-v2-6", "question": "下课后姐姐想做什么？", "answer": "看电影", "options": ["上课", "看电影", "下课", "上班"], "explanation": "Đáp án: 看电影. Thông tin đối chiếu trong bài: “下课后，姐姐想看电影，我想在家休息。”", "evidence": "下课后，姐姐想看电影，我想在家休息。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R07-5", "lesson": 7, "revision": 2, "title": "Cuộc gọi lúc tan làm", "text": "姐姐：你下班吗？\n我：还没有。现在六点，六点十分下班。\n姐姐：我在电影院。电影七点半。\n我：好。下班后我吃晚饭。我七点去电影院。\n姐姐：我现在吃包子呢。七点见！", "translation": "Chị gái: Em tan làm chưa? Tôi: Chưa. Bây giờ sáu giờ, sáu giờ mười em tan làm. Chị gái: Chị đang ở rạp chiếu phim. Phim lúc bảy giờ rưỡi. Tôi: Được. Tan làm em ăn tối. Bảy giờ em đến rạp. Chị gái: Giờ chị đang ăn bánh bao. Bảy giờ gặp nhé!", "questions": [{"id": "R07-5-v2-1", "question": "现在几点？", "answer": "六点", "options": ["六点", "上午", "下午", "晚上"], "explanation": "Đáp án: 六点. Thông tin đối chiếu trong bài: “现在六点，六点十分下班。”", "evidence": "现在六点，六点十分下班。"}, {"id": "R07-5-v2-2", "question": "我几点下班？", "answer": "六点十分", "options": ["晚上", "六点十分", "早上", "星期一"], "explanation": "Đáp án: 六点十分. Thông tin đối chiếu trong bài: “现在六点，六点十分下班。”", "evidence": "现在六点，六点十分下班。"}, {"id": "R07-5-v2-3", "question": "姐姐在哪儿？", "answer": "电影院", "options": ["店里", "后", "电影院", "中国"], "explanation": "Đáp án: 电影院. Thông tin đối chiếu trong bài: “姐姐：我在电影院。”", "evidence": "姐姐：我在电影院。"}, {"id": "R07-5-v2-4", "question": "电影几点？", "answer": "七点半", "options": ["三点", "五点", "六点", "七点半"], "explanation": "Đáp án: 七点半. Thông tin đối chiếu trong bài: “电影七点半。”", "evidence": "电影七点半。"}, {"id": "R07-5-v2-5", "question": "我几点去电影院？", "answer": "七点", "options": ["七点", "六点", "八点", "九点"], "explanation": "Đáp án: 七点. Thông tin đối chiếu trong bài: “我七点去电影院。”", "evidence": "我七点去电影院。"}, {"id": "R07-5-v2-6", "question": "姐姐现在吃什么？", "answer": "包子", "options": ["面条儿", "包子", "一些菜", "牛奶"], "explanation": "Đáp án: 包子. Thông tin đối chiếu trong bài: “姐姐：我现在吃包子呢。”", "evidence": "姐姐：我现在吃包子呢。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R08-1", "lesson": 8, "revision": 2, "title": "Con mèo trốn dưới bàn", "text": "我家有一只小猫。今天上午，我在房间里看电影，没有看见它。妈妈在桌子下看见小猫。它不在房间外。下午小猫在桌子前，我能看见它。", "translation": "Nhà tôi có một con mèo nhỏ. Sáng nay tôi xem phim trong phòng nhưng không nhìn thấy nó. Mẹ nhìn thấy mèo dưới bàn. Nó không ở ngoài phòng, cũng không ở trên bàn. Buổi chiều mèo ở trước bàn, tôi có thể nhìn thấy nó.", "questions": [{"id": "R08-1-v2-1", "question": "我家有几只猫？", "answer": "一只", "options": ["三十九岁", "一只", "四十岁", "一半"], "explanation": "Đáp án: 一只. Thông tin đối chiếu trong bài: “我家有一只小猫。”", "evidence": "我家有一只小猫。"}, {"id": "R08-1-v2-2", "question": "上午我在哪儿？", "answer": "房间里", "options": ["学校外", "书店", "房间里", "桌子下"], "explanation": "Đáp án: 房间里. Thông tin đối chiếu trong bài: “今天上午，我在房间里看电影，没有看见它。”", "evidence": "今天上午，我在房间里看电影，没有看见它。"}, {"id": "R08-1-v2-3", "question": "我在房间里做什么？", "answer": "看电影", "options": ["上班", "下班", "吃晚饭", "看电影"], "explanation": "Đáp án: 看电影. Thông tin đối chiếu trong bài: “今天上午，我在房间里看电影，没有看见它。”", "evidence": "今天上午，我在房间里看电影，没有看见它。"}, {"id": "R08-1-v2-4", "question": "谁看见小猫？", "answer": "妈妈", "options": ["妈妈", "妹妹", "儿子", "女儿"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “妈妈在桌子下看见小猫。”", "evidence": "妈妈在桌子下看见小猫。"}, {"id": "R08-1-v2-5", "question": "上午小猫在哪儿？", "answer": "桌子下", "options": ["电影院", "桌子下", "医院", "店里"], "explanation": "Đáp án: 桌子下. Thông tin đối chiếu trong bài: “妈妈在桌子下看见小猫。”", "evidence": "妈妈在桌子下看见小猫。"}, {"id": "R08-1-v2-6", "question": "下午小猫在哪儿？", "answer": "桌子前", "options": ["中国", "法国", "桌子前", "泰国"], "explanation": "Đáp án: 桌子前. Thông tin đối chiếu trong bài: “下午小猫在桌子前，我能看见它。”", "evidence": "下午小猫在桌子前，我能看见它。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R08-2", "lesson": 8, "revision": 2, "title": "Bố làm việc ở bệnh viện", "text": "我爸爸是医生，在医院工作。医院在学校前。爸爸早上八点上班，下午六点下班。今天病人很多，爸爸很忙。妈妈想去医院看爸爸，我也想去。爸爸现在不能休息。", "translation": "Bố tôi là bác sĩ, làm việc ở bệnh viện. Bệnh viện ở trước trường học. Bố đi làm lúc tám giờ sáng, tan làm lúc sáu giờ chiều. Hôm nay có nhiều bệnh nhân, bố rất bận. Mẹ muốn đến bệnh viện thăm bố, tôi cũng muốn đi. Bây giờ bố không thể nghỉ.", "questions": [{"id": "R08-2-v2-1", "question": "爸爸做什么工作？", "answer": "医生", "options": ["我", "医生", "你", "老师"], "explanation": "Đáp án: 医生. Thông tin đối chiếu trong bài: “我爸爸是医生，在医院工作。”", "evidence": "我爸爸是医生，在医院工作。"}, {"id": "R08-2-v2-2", "question": "爸爸在哪儿工作？", "answer": "医院", "options": ["学校", "学校前", "医院", "学校外"], "explanation": "Đáp án: 医院. Thông tin đối chiếu trong bài: “我爸爸是医生，在医院工作。”", "evidence": "我爸爸是医生，在医院工作。"}, {"id": "R08-2-v2-3", "question": "医院在哪儿？", "answer": "学校前", "options": ["书店", "桌子下", "桌子前", "学校前"], "explanation": "Đáp án: 学校前. Thông tin đối chiếu trong bài: “医院在学校前。”", "evidence": "医院在学校前。"}, {"id": "R08-2-v2-4", "question": "爸爸几点上班？", "answer": "八点", "options": ["八点", "星期一", "星期二", "星期三"], "explanation": "Đáp án: 八点. Thông tin đối chiếu trong bài: “爸爸早上八点上班，下午六点下班。”", "evidence": "爸爸早上八点上班，下午六点下班。"}, {"id": "R08-2-v2-5", "question": "爸爸几点下班？", "answer": "六点", "options": ["八点", "六点", "九点", "十点"], "explanation": "Đáp án: 六点. Thông tin đối chiếu trong bài: “爸爸早上八点上班，下午六点下班。”", "evidence": "爸爸早上八点上班，下午六点下班。"}, {"id": "R08-2-v2-6", "question": "爸爸现在能休息吗？", "answer": "不能", "options": ["去", "不去", "不能", "很漂亮"], "explanation": "Đáp án: 不能. Thông tin đối chiếu trong bài: “爸爸现在不能休息。”", "evidence": "爸爸现在不能休息。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R08-3", "lesson": 8, "revision": 2, "title": "Tìm đúng hiệu sách", "text": "同学：书店在哪儿？\n我：在学校外，医院前。\n同学：书店大吗？\n我：不大。很漂亮。你现在能去吗？\n同学：不能，我下午上课。下课后我去。\n我：好，我在书店前见你。", "translation": "Bạn học: Hiệu sách ở đâu? Tôi: Ở ngoài trường, trước bệnh viện. Bạn học: Hiệu sách có lớn không? Tôi: Không lớn, rất đẹp. Giờ bạn có thể đi không? Bạn học: Không thể, chiều mình có lớp. Tan học mình đi. Tôi: Được, mình gặp bạn trước hiệu sách.", "questions": [{"id": "R08-3-v2-1", "question": "书店在哪儿？", "answer": "学校外", "options": ["后", "学校外", "大房间", "小房间"], "explanation": "Đáp án: 学校外. Thông tin đối chiếu trong bài: “我：在学校外，医院前。”", "evidence": "我：在学校外，医院前。"}, {"id": "R08-3-v2-2", "question": "书店在医院____。", "answer": "前", "options": ["中国", "法国", "前", "泰国"], "explanation": "Đáp án: 前. Thông tin đối chiếu trong bài: “我：在学校外，医院前。”", "evidence": "我：在学校外，医院前。"}, {"id": "R08-3-v2-3", "question": "书店大吗？", "answer": "不大", "options": ["不去", "能", "不能", "不大"], "explanation": "Đáp án: 不大. Thông tin đối chiếu trong bài: “我：不大。”", "evidence": "我：不大。"}, {"id": "R08-3-v2-4", "question": "书店____。", "answer": "很漂亮", "options": ["很漂亮", "休息", "不休息", "去"], "explanation": "Đáp án: 很漂亮. Thông tin đối chiếu trong bài: “很漂亮。”", "evidence": "很漂亮。"}, {"id": "R08-3-v2-5", "question": "同学现在能去吗？", "answer": "不能", "options": ["不想", "不能", "休息", "不休息"], "explanation": "Đáp án: 不能. Thông tin đối chiếu trong bài: “同学：不能，我下午上课。”", "evidence": "同学：不能，我下午上课。"}, {"id": "R08-3-v2-6", "question": "同学____去。", "answer": "下课后", "options": ["九点", "十点", "下课后", "六点半"], "explanation": "Đáp án: 下课后. Thông tin đối chiếu trong bài: “下课后我去。”", "evidence": "下课后我去。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R08-4", "lesson": 8, "revision": 2, "title": "Phòng nào có thể ăn trưa?", "text": "学校有两个房间。大房间在前，小房间在后。老师在大房间上课，学生不能在大房间吃饭。小房间里有桌子。今天我和同学在小房间吃午饭。饭很好吃。", "translation": "Trường có hai phòng. Phòng lớn ở phía trước, phòng nhỏ ở phía sau. Giáo viên dạy ở phòng lớn; học sinh không thể ăn cơm ở phòng đó. Trong phòng nhỏ có bàn. Hôm nay tôi và bạn học ăn trưa ở phòng nhỏ. Cơm rất ngon.", "questions": [{"id": "R08-4-v2-1", "question": "学校有几个房间？", "answer": "两个", "options": ["四个", "两个", "五个", "六个"], "explanation": "Đáp án: 两个. Thông tin đối chiếu trong bài: “学校有两个房间。”", "evidence": "学校有两个房间。"}, {"id": "R08-4-v2-2", "question": "大房间在哪儿？", "answer": "前", "options": ["桌子下", "后", "前", "大房间"], "explanation": "Đáp án: 前. Thông tin đối chiếu trong bài: “大房间在前，小房间在后。”", "evidence": "大房间在前，小房间在后。"}, {"id": "R08-4-v2-3", "question": "老师在哪儿上课？", "answer": "大房间", "options": ["小房间", "饭店", "中国", "大房间"], "explanation": "Đáp án: 大房间. Thông tin đối chiếu trong bài: “老师在大房间上课，学生不能在大房间吃饭。”", "evidence": "老师在大房间上课，学生不能在大房间吃饭。"}, {"id": "R08-4-v2-4", "question": "学生能在大房间吃饭吗？", "answer": "不能", "options": ["不能", "不去", "很漂亮", "不大"], "explanation": "Đáp án: 不能. Thông tin đối chiếu trong bài: “老师在大房间上课，学生不能在大房间吃饭。”", "evidence": "老师在大房间上课，学生不能在大房间吃饭。"}, {"id": "R08-4-v2-5", "question": "小房间里有什么？", "answer": "桌子", "options": ["面条儿", "桌子", "名字", "电脑"], "explanation": "Đáp án: 桌子. Thông tin đối chiếu trong bài: “小房间里有桌子。”", "evidence": "小房间里有桌子。"}, {"id": "R08-4-v2-6", "question": "我和同学在哪儿吃午饭？", "answer": "小房间", "options": ["医院", "店里", "小房间", "房间里"], "explanation": "Đáp án: 小房间. Thông tin đối chiếu trong bài: “今天我和同学在小房间吃午饭。”", "evidence": "今天我和同学在小房间吃午饭。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R08-5", "lesson": 8, "revision": 2, "title": "Đến trường sớm", "text": "今天我上午七点半到学校。老师八点上课。学校前有一只猫，我很喜欢它。我在学校外看见爸爸。他是医生，想去医院。医院不大，病人很多。爸爸今天很忙。", "translation": "Hôm nay tôi đến trường lúc bảy giờ rưỡi sáng. Giáo viên bắt đầu dạy lúc tám giờ. Trước trường có một con mèo, tôi rất thích nó. Tôi thấy bố ở ngoài trường. Bố là bác sĩ, đang muốn đến bệnh viện. Bệnh viện không lớn nhưng có nhiều bệnh nhân. Hôm nay bố rất bận.", "questions": [{"id": "R08-5-v2-1", "question": "我几点到学校？", "answer": "七点半", "options": ["下班后", "七点半", "今天", "明天"], "explanation": "Đáp án: 七点半. Thông tin đối chiếu trong bài: “今天我上午七点半到学校。”", "evidence": "今天我上午七点半到学校。"}, {"id": "R08-5-v2-2", "question": "老师几点上课？", "answer": "八点", "options": ["八月十号", "三点", "八点", "五点"], "explanation": "Đáp án: 八点. Thông tin đối chiếu trong bài: “老师八点上课。”", "evidence": "老师八点上课。"}, {"id": "R08-5-v2-3", "question": "猫在哪儿？", "answer": "学校前", "options": ["店里", "房间里", "学校外", "学校前"], "explanation": "Đáp án: 学校前. Thông tin đối chiếu trong bài: “学校前有一只猫，我很喜欢它。”", "evidence": "学校前有一只猫，我很喜欢它。"}, {"id": "R08-5-v2-4", "question": "我在哪儿看见爸爸？", "answer": "学校外", "options": ["学校外", "桌子下", "桌子前", "前"], "explanation": "Đáp án: 学校外. Thông tin đối chiếu trong bài: “我在学校外看见爸爸。”", "evidence": "我在学校外看见爸爸。"}, {"id": "R08-5-v2-5", "question": "爸爸想去哪儿？", "answer": "医院", "options": ["书店", "医院", "桌子下", "桌子前"], "explanation": "Đáp án: 医院. Thông tin đối chiếu trong bài: “他是医生，想去医院。”", "evidence": "他是医生，想去医院。"}, {"id": "R08-5-v2-6", "question": "爸爸今天忙吗？", "answer": "很忙", "options": ["有", "没有", "很忙", "不忙"], "explanation": "Đáp án: 很忙. Thông tin đối chiếu trong bài: “爸爸今天很忙。”", "evidence": "爸爸今天很忙。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R09-1", "lesson": 9, "revision": 2, "title": "Bàn học và ghế", "text": "这是我的房间。桌子上有三本书，桌子下有一只猫。椅子在桌子前。我明天上午在房间里学习，下午去学校上课。姐姐明天上午在学校读书，下午在家看电视。", "translation": "Đây là phòng của tôi. Trên bàn có ba quyển sách, dưới bàn có một con mèo. Ghế ở trước bàn. Sáng mai tôi học trong phòng, chiều đến trường học. Sáng mai chị gái đọc sách ở trường, chiều xem tivi ở nhà.", "questions": [{"id": "R09-1-v2-1", "question": "桌子上有几本书？", "answer": "三本", "options": ["十本", "一半", "三本", "第一课"], "explanation": "Đáp án: 三本. Thông tin đối chiếu trong bài: “桌子上有三本书，桌子下有一只猫。”", "evidence": "桌子上有三本书，桌子下有一只猫。"}, {"id": "R09-1-v2-2", "question": "猫在哪儿？", "answer": "桌子下", "options": ["大房间", "小房间", "桌子上", "桌子下"], "explanation": "Đáp án: 桌子下. Thông tin đối chiếu trong bài: “桌子上有三本书，桌子下有一只猫。”", "evidence": "桌子上有三本书，桌子下有一只猫。"}, {"id": "R09-1-v2-3", "question": "椅子在哪儿？", "answer": "桌子前", "options": ["桌子前", "房间里", "学校", "学校前"], "explanation": "Đáp án: 桌子前. Thông tin đối chiếu trong bài: “椅子在桌子前。”", "evidence": "椅子在桌子前。"}, {"id": "R09-1-v2-4", "question": "明天上午我在哪儿学习？", "answer": "房间里", "options": ["那边", "房间里", "电影院", "医院"], "explanation": "Đáp án: 房间里. Thông tin đối chiếu trong bài: “我明天上午在房间里学习，下午去学校上课。”", "evidence": "我明天上午在房间里学习，下午去学校上课。"}, {"id": "R09-1-v2-5", "question": "明天下午我去哪儿？", "answer": "学校", "options": ["店里", "房间里", "学校", "书店"], "explanation": "Đáp án: 学校. Thông tin đối chiếu trong bài: “我明天上午在房间里学习，下午去学校上课。”", "evidence": "我明天上午在房间里学习，下午去学校上课。"}, {"id": "R09-1-v2-6", "question": "明天下午姐姐做什么？", "answer": "看电视", "options": ["想", "工作", "认识", "看电视"], "explanation": "Đáp án: 看电视. Thông tin đối chiếu trong bài: “姐姐明天上午在学校读书，下午在家看电视。”", "evidence": "姐姐明天上午在学校读书，下午在家看电视。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R09-2", "lesson": 9, "revision": 2, "title": "Buổi học với người bạn", "text": "明天是星期日。我上午九点和朋友在学校学习中文。我们想看第一课。下午朋友在我家唱歌，我看电视。朋友的歌很好听。晚上我想去书店买书，朋友想在家休息。", "translation": "Ngày mai là Chủ nhật. Chín giờ sáng tôi cùng bạn học tiếng Trung ở trường. Chúng tôi muốn đọc bài một. Buổi chiều bạn hát ở nhà tôi, tôi xem tivi. Bạn hát rất hay. Buổi tối tôi muốn đến hiệu sách mua sách, bạn muốn nghỉ ở nhà.", "questions": [{"id": "R09-2-v2-1", "question": "明天星期几？", "answer": "星期日", "options": ["八点半", "六点十分", "星期日", "下午五点"], "explanation": "Đáp án: 星期日. Thông tin đối chiếu trong bài: “明天是星期日。”", "evidence": "明天是星期日。"}, {"id": "R09-2-v2-2", "question": "上午几点学习？", "answer": "九点", "options": ["六点半", "七点半", "八点半", "九点"], "explanation": "Đáp án: 九点. Thông tin đối chiếu trong bài: “我上午九点和朋友在学校学习中文。”", "evidence": "我上午九点和朋友在学校学习中文。"}, {"id": "R09-2-v2-3", "question": "我们想看第几课？", "answer": "第一课", "options": ["第一课", "四十岁", "两本", "三本"], "explanation": "Đáp án: 第一课. Thông tin đối chiếu trong bài: “我们想看第一课。”", "evidence": "我们想看第一课。"}, {"id": "R09-2-v2-4", "question": "下午谁唱歌？", "answer": "朋友", "options": ["妹妹", "朋友", "儿子", "女儿"], "explanation": "Đáp án: 朋友. Thông tin đối chiếu trong bài: “下午朋友在我家唱歌，我看电视。”", "evidence": "下午朋友在我家唱歌，我看电视。"}, {"id": "R09-2-v2-5", "question": "我下午做什么？", "answer": "看电视", "options": ["学习", "吃晚饭", "看电视", "叫"], "explanation": "Đáp án: 看电视. Thông tin đối chiếu trong bài: “下午朋友在我家唱歌，我看电视。”", "evidence": "下午朋友在我家唱歌，我看电视。"}, {"id": "R09-2-v2-6", "question": "晚上我想去哪儿？", "answer": "书店", "options": ["这边", "饭店", "医院前边", "书店"], "explanation": "Đáp án: 书店. Thông tin đối chiếu trong bài: “晚上我想去书店买书，朋友想在家休息。”", "evidence": "晚上我想去书店买书，朋友想在家休息。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R09-3", "lesson": 9, "revision": 2, "title": "Chó mèo trong sân trường", "text": "学校前边有一只小狗。小狗的朋友是一只猫。白天猫在桌子下，小狗在房间外边玩。晚上小狗在家休息，猫在房间里。今天下午，我和朋友在学校前边看小狗。", "translation": "Phía trước trường có một chú chó nhỏ. Bạn của chó là một con mèo. Ban ngày mèo ở dưới bàn, chó chơi ngoài phòng. Buổi tối chó nghỉ ở nhà, mèo ở trong phòng. Chiều nay tôi và bạn ngắm chú chó ở phía trước trường.", "questions": [{"id": "R09-3-v2-1", "question": "学校前边有什么？", "answer": "一只小狗", "options": ["饺子", "面条儿", "一只小狗", "名字"], "explanation": "Đáp án: 一只小狗. Thông tin đối chiếu trong bài: “学校前边有一只小狗。”", "evidence": "学校前边有一只小狗。"}, {"id": "R09-3-v2-2", "question": "小狗的朋友是谁？", "answer": "一只猫", "options": ["名字", "电脑", "我的电脑", "一只猫"], "explanation": "Đáp án: 一只猫. Thông tin đối chiếu trong bài: “小狗的朋友是一只猫。”", "evidence": "小狗的朋友是一只猫。"}, {"id": "R09-3-v2-3", "question": "白天猫在哪儿？", "answer": "桌子下", "options": ["桌子下", "学校外", "书店", "桌子前"], "explanation": "Đáp án: 桌子下. Thông tin đối chiếu trong bài: “白天猫在桌子下，小狗在房间外边玩。”", "evidence": "白天猫在桌子下，小狗在房间外边玩。"}, {"id": "R09-3-v2-4", "question": "白天小狗在哪儿玩？", "answer": "房间外边", "options": ["这边", "房间外边", "饭店", "医院前边"], "explanation": "Đáp án: 房间外边. Thông tin đối chiếu trong bài: “白天猫在桌子下，小狗在房间外边玩。”", "evidence": "白天猫在桌子下，小狗在房间外边玩。"}, {"id": "R09-3-v2-5", "question": "晚上小狗做什么？", "answer": "休息", "options": ["唱歌", "学习", "休息", "吃晚饭"], "explanation": "Đáp án: 休息. Thông tin đối chiếu trong bài: “晚上小狗在家休息，猫在房间里。”", "evidence": "晚上小狗在家休息，猫在房间里。"}, {"id": "R09-3-v2-6", "question": "今天下午谁和我看小狗？", "answer": "朋友", "options": ["你", "老师", "学生", "朋友"], "explanation": "Đáp án: 朋友. Thông tin đối chiếu trong bài: “今天下午，我和朋友在学校前边看小狗。”", "evidence": "今天下午，我和朋友在学校前边看小狗。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R09-4", "lesson": 9, "revision": 2, "title": "Mượn sách để học", "text": "朋友：你有中文书吗？\n我：有，桌子上有两本。一本是我的，一本是姐姐的。\n朋友：我想看第三课。\n我：好，我们今天下午在家学习吧！\n朋友：下午我有事。明天上午，你有事吗？\n我：好，明天九点见。", "translation": "Bạn: Bạn có sách tiếng Trung không? Tôi: Có, trên bàn có hai quyển. Một quyển của mình, một quyển của chị. Bạn: Mình muốn đọc bài ba. Tôi: Được, chiều nay cùng học ở nhà nhé! Bạn: Chiều mình có việc. Sáng mai thì sao? Tôi: Được, mai chín giờ gặp.", "questions": [{"id": "R09-4-v2-1", "question": "中文书在哪儿？", "answer": "桌子上", "options": ["饭店", "医院前边", "桌子上", "中国"], "explanation": "Đáp án: 桌子上. Thông tin đối chiếu trong bài: “我：有，桌子上有两本。”", "evidence": "我：有，桌子上有两本。"}, {"id": "R09-4-v2-2", "question": "桌子上有几本书？", "answer": "两本", "options": ["九个", "十个", "一口人", "两本"], "explanation": "Đáp án: 两本. Thông tin đối chiếu trong bài: “我：有，桌子上有两本。”", "evidence": "我：有，桌子上有两本。"}, {"id": "R09-4-v2-3", "question": "一本书是谁的？", "answer": "姐姐", "options": ["姐姐", "妈妈", "哥哥", "妹妹"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “一本是我的，一本是姐姐的。”", "evidence": "一本是我的，一本是姐姐的。"}, {"id": "R09-4-v2-4", "question": "朋友想看第几课？", "answer": "第三课", "options": ["六个", "第三课", "七个", "八个"], "explanation": "Đáp án: 第三课. Thông tin đối chiếu trong bài: “朋友：我想看第三课。”", "evidence": "朋友：我想看第三课。"}, {"id": "R09-4-v2-5", "question": "朋友今天下午有事吗？", "answer": "有", "options": ["不去", "能", "有", "不能"], "explanation": "Đáp án: 有. Thông tin đối chiếu trong bài: “朋友：下午我有事。”", "evidence": "朋友：下午我有事。"}, {"id": "R09-4-v2-6", "question": "明天几点见？", "answer": "九点", "options": ["今年", "上午", "下午", "九点"], "explanation": "Đáp án: 九点. Thông tin đối chiếu trong bài: “我：好，明天九点见。”", "evidence": "我：好，明天九点见。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R09-5", "lesson": 9, "revision": 2, "title": "Một ngày của người thích hát", "text": "妹妹喜欢唱歌，也喜欢看电视。她白天在学校学习，晚上在家唱歌。她的歌很好听。今天晚上我有中文课，不能和妹妹看电视。下课后，我想读书，不想看电影。", "translation": "Em gái thích hát và xem tivi. Ban ngày em học ở trường, buổi tối hát ở nhà. Em hát rất hay. Tối nay tôi có lớp tiếng Trung, không thể xem tivi cùng em. Tan học tôi muốn đọc sách, không muốn xem phim.", "questions": [{"id": "R09-5-v2-1", "question": "妹妹喜欢唱歌和____。", "answer": "看电视", "options": ["看电影", "读书", "看电视", "看书"], "explanation": "Đáp án: 看电视. Thông tin đối chiếu trong bài: “妹妹喜欢唱歌，也喜欢看电视。”", "evidence": "妹妹喜欢唱歌，也喜欢看电视。"}, {"id": "R09-5-v2-2", "question": "白天妹妹在哪儿学习？", "answer": "学校", "options": ["家", "超市", "那边", "学校"], "explanation": "Đáp án: 学校. Thông tin đối chiếu trong bài: “她白天在学校学习，晚上在家唱歌。”", "evidence": "她白天在学校学习，晚上在家唱歌。"}, {"id": "R09-5-v2-3", "question": "晚上妹妹在哪儿唱歌？", "answer": "家", "options": ["家", "泰国", "超市", "那边"], "explanation": "Đáp án: 家. Thông tin đối chiếu trong bài: “她白天在学校学习，晚上在家唱歌。”", "evidence": "她白天在学校学习，晚上在家唱歌。"}, {"id": "R09-5-v2-4", "question": "妹妹的歌____。", "answer": "很好听", "options": ["不能", "很好听", "很漂亮", "不大"], "explanation": "Đáp án: 很好听. Thông tin đối chiếu trong bài: “她的歌很好听。”", "evidence": "她的歌很好听。"}, {"id": "R09-5-v2-5", "question": "我今天晚上有什么课？", "answer": "中文课", "options": ["桌子", "猫", "中文课", "一只小狗"], "explanation": "Đáp án: 中文课. Thông tin đối chiếu trong bài: “今天晚上我有中文课，不能和妹妹看电视。”", "evidence": "今天晚上我有中文课，不能和妹妹看电视。"}, {"id": "R09-5-v2-6", "question": "下课后我想做什么？", "answer": "读书", "options": ["做菜", "休息", "买东西", "读书"], "explanation": "Đáp án: 读书. Thông tin đối chiếu trong bài: “下课后，我想读书，不想看电影。”", "evidence": "下课后，我想读书，不想看电影。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R10-1", "lesson": 10, "revision": 2, "title": "Quầy táo trong siêu thị", "text": "售货员：这边的苹果三块钱一斤，那边的五块钱一斤。\n我：这边真便宜！我买两斤。\n妈妈：我想买那边的苹果。\n我：那些苹果好看吗？\n妈妈：好看，也好吃。我买一斤。", "translation": "Người bán: Táo bên này ba tệ một cân, bên kia năm tệ một cân. Tôi: Bên này rẻ thật! Tôi mua hai cân. Mẹ: Mẹ muốn mua táo bên kia. Tôi: Những quả đó có đẹp không? Mẹ: Đẹp và cũng ngon. Mẹ mua một cân.", "questions": [{"id": "R10-1-v2-1", "question": "这边苹果一斤多少钱？", "answer": "三块钱", "options": ["三个", "四个", "五个", "三块钱"], "explanation": "Đáp án: 三块钱. Thông tin đối chiếu trong bài: “售货员：这边的苹果三块钱一斤，那边的五块钱一斤。”", "evidence": "售货员：这边的苹果三块钱一斤，那边的五块钱一斤。"}, {"id": "R10-1-v2-2", "question": "那边苹果一斤多少钱？", "answer": "五块钱", "options": ["五块钱", "三本", "五本", "十本"], "explanation": "Đáp án: 五块钱. Thông tin đối chiếu trong bài: “售货员：这边的苹果三块钱一斤，那边的五块钱一斤。”", "evidence": "售货员：这边的苹果三块钱一斤，那边的五块钱一斤。"}, {"id": "R10-1-v2-3", "question": "我买几斤？", "answer": "两斤", "options": ["十块钱", "两斤", "二十块钱", "十五块钱"], "explanation": "Đáp án: 两斤. Thông tin đối chiếu trong bài: “我买两斤。”", "evidence": "我买两斤。"}, {"id": "R10-1-v2-4", "question": "妈妈买几斤？", "answer": "一斤", "options": ["两本", "三本", "一斤", "五本"], "explanation": "Đáp án: 一斤. Thông tin đối chiếu trong bài: “我买一斤。”", "evidence": "我买一斤。"}, {"id": "R10-1-v2-5", "question": "哪边便宜？", "answer": "这边", "options": ["房间里", "学校", "学校前", "这边"], "explanation": "Đáp án: 这边. Thông tin đối chiếu trong bài: “我：这边真便宜！”", "evidence": "我：这边真便宜！"}, {"id": "R10-1-v2-6", "question": "妈妈：苹果____。", "answer": "好吃", "options": ["好吃", "不忙", "会", "不会"], "explanation": "Đáp án: 好吃. Thông tin đối chiếu trong bài: “妈妈：好看，也好吃。”", "evidence": "妈妈：好看，也好吃。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R10-2", "lesson": 10, "revision": 2, "title": "Chiếc áo nào phù hợp?", "text": "我和姐姐去商店买衣服。这件衣服五十元，那件八十元。姐姐喜欢八十元的衣服，我喜欢五十元的。售货员：这些衣服很好看。我今天买一件，姐姐没有买。", "translation": "Tôi và chị gái đến cửa hàng mua quần áo. Chiếc này năm mươi tệ, chiếc kia tám mươi tệ. Chị thích chiếc tám mươi tệ, tôi thích chiếc năm mươi tệ. Người bán nói những chiếc này rất đẹp. Hôm nay tôi mua một chiếc, chị không mua.", "questions": [{"id": "R10-2-v2-1", "question": "我们去哪儿买衣服？", "answer": "商店", "options": ["医院", "店里", "房间里", "商店"], "explanation": "Đáp án: 商店. Thông tin đối chiếu trong bài: “我和姐姐去商店买衣服。”", "evidence": "我和姐姐去商店买衣服。"}, {"id": "R10-2-v2-2", "question": "这件衣服多少钱？", "answer": "五十元", "options": ["五十元", "十个", "一口人", "三口人"], "explanation": "Đáp án: 五十元. Thông tin đối chiếu trong bài: “这件衣服五十元，那件八十元。”", "evidence": "这件衣服五十元，那件八十元。"}, {"id": "R10-2-v2-3", "question": "那件衣服多少钱？", "answer": "八十元", "options": ["十岁", "八十元", "十二岁", "十九岁"], "explanation": "Đáp án: 八十元. Thông tin đối chiếu trong bài: “这件衣服五十元，那件八十元。”", "evidence": "这件衣服五十元，那件八十元。"}, {"id": "R10-2-v2-4", "question": "我喜欢多少钱的衣服？", "answer": "五十元", "options": ["四十岁", "两本", "五十元", "三本"], "explanation": "Đáp án: 五十元. Thông tin đối chiếu trong bài: “姐姐喜欢八十元的衣服，我喜欢五十元的。”", "evidence": "姐姐喜欢八十元的衣服，我喜欢五十元的。"}, {"id": "R10-2-v2-5", "question": "姐姐喜欢多少钱的衣服？", "answer": "八十元", "options": ["十个", "一口人", "三口人", "八十元"], "explanation": "Đáp án: 八十元. Thông tin đối chiếu trong bài: “姐姐喜欢八十元的衣服，我喜欢五十元的。”", "evidence": "姐姐喜欢八十元的衣服，我喜欢五十元的。"}, {"id": "R10-2-v2-6", "question": "我买几件衣服？", "answer": "一件", "options": ["一件", "三个", "四个", "五个"], "explanation": "Đáp án: 一件. Thông tin đối chiếu trong bài: “我今天买一件，姐姐没有买。”", "evidence": "我今天买一件，姐姐没有买。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R10-3", "lesson": 10, "revision": 2, "title": "Hai chiếc cốc khác nhau", "text": "桌子上有两个杯子。这是爸爸的杯子，那是妈妈的。爸爸的杯子很大，妈妈的小。爸爸的杯子二十块钱，妈妈的十五块钱。我喜欢妈妈的杯子，它很漂亮。我的杯子在房间里。", "translation": "Trên bàn có hai chiếc cốc. Đây là cốc của bố, kia là cốc của mẹ. Cốc của bố lớn, cốc của mẹ nhỏ. Cốc của bố hai mươi tệ, cốc của mẹ mười lăm tệ. Tôi thích cốc của mẹ vì rất đẹp. Cốc của tôi ở trong phòng.", "questions": [{"id": "R10-3-v2-1", "question": "桌子上有几个杯子？", "answer": "两个", "options": ["第二课", "第三课", "第十课", "两个"], "explanation": "Đáp án: 两个. Thông tin đối chiếu trong bài: “桌子上有两个杯子。”", "evidence": "桌子上有两个杯子。"}, {"id": "R10-3-v2-2", "question": "谁的杯子大？", "answer": "爸爸", "options": ["爸爸", "他", "朋友", "医生"], "explanation": "Đáp án: 爸爸. Thông tin đối chiếu trong bài: “爸爸的杯子很大，妈妈的小。”", "evidence": "爸爸的杯子很大，妈妈的小。"}, {"id": "R10-3-v2-3", "question": "爸爸的杯子多少钱？", "answer": "二十块钱", "options": ["十岁", "二十块钱", "十二岁", "十九岁"], "explanation": "Đáp án: 二十块钱. Thông tin đối chiếu trong bài: “爸爸的杯子二十块钱，妈妈的十五块钱。”", "evidence": "爸爸的杯子二十块钱，妈妈的十五块钱。"}, {"id": "R10-3-v2-4", "question": "妈妈的杯子多少钱？", "answer": "十五块钱", "options": ["第十二课", "五分钟", "十五块钱", "十分钟"], "explanation": "Đáp án: 十五块钱. Thông tin đối chiếu trong bài: “爸爸的杯子二十块钱，妈妈的十五块钱。”", "evidence": "爸爸的杯子二十块钱，妈妈的十五块钱。"}, {"id": "R10-3-v2-5", "question": "我喜欢谁的杯子？", "answer": "妈妈", "options": ["我", "你", "老师", "妈妈"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “我喜欢妈妈的杯子，它很漂亮。”", "evidence": "我喜欢妈妈的杯子，它很漂亮。"}, {"id": "R10-3-v2-6", "question": "我的杯子在哪儿？", "answer": "房间里", "options": ["房间里", "学校前", "学校外", "书店"], "explanation": "Đáp án: 房间里. Thông tin đối chiếu trong bài: “我的杯子在房间里。”", "evidence": "我的杯子在房间里。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R10-4", "lesson": 10, "revision": 2, "title": "Đi mua trái cây cho gia đình", "text": "今天我去超市买水果。苹果很便宜，三块钱一斤。我买三斤。妈妈喜欢苹果，爸爸不喜欢。我还想买牛奶。超市的牛奶五块钱。我买两？一？牛奶。妹妹想吃包子，我也买一些。", "translation": "Hôm nay tôi đến siêu thị mua trái cây. Táo rất rẻ, ba tệ một cân. Tôi mua ba cân. Mẹ thích táo, bố không thích. Tôi còn muốn mua sữa. Sữa ở siêu thị giá năm tệ. Tôi cũng mua sữa. Em gái muốn ăn bánh bao nên tôi mua thêm một ít.", "questions": [{"id": "R10-4-v2-1", "question": "今天我去哪儿？", "answer": "超市", "options": ["桌子下", "桌子前", "前", "超市"], "explanation": "Đáp án: 超市. Thông tin đối chiếu trong bài: “今天我去超市买水果。”", "evidence": "今天我去超市买水果。"}, {"id": "R10-4-v2-2", "question": "我去买什么水果？", "answer": "苹果", "options": ["苹果", "牛奶和包子", "米饭和菜", "水果"], "explanation": "Đáp án: 苹果. Thông tin đối chiếu trong bài: “今天我去超市买水果。”", "evidence": "今天我去超市买水果。"}, {"id": "R10-4-v2-3", "question": "苹果一斤多少钱？", "answer": "三块钱", "options": ["十岁", "三块钱", "十二岁", "十九岁"], "explanation": "Đáp án: 三块钱. Thông tin đối chiếu trong bài: “苹果很便宜，三块钱一斤。”", "evidence": "苹果很便宜，三块钱一斤。"}, {"id": "R10-4-v2-4", "question": "我买几斤苹果？", "answer": "三斤", "options": ["五斤", "一件", "三斤", "两件"], "explanation": "Đáp án: 三斤. Thông tin đối chiếu trong bài: “我买三斤。”", "evidence": "我买三斤。"}, {"id": "R10-4-v2-5", "question": "谁不喜欢苹果？", "answer": "爸爸", "options": ["女儿", "他", "朋友", "爸爸"], "explanation": "Đáp án: 爸爸. Thông tin đối chiếu trong bài: “妈妈喜欢苹果，爸爸不喜欢。”", "evidence": "妈妈喜欢苹果，爸爸不喜欢。"}, {"id": "R10-4-v2-6", "question": "妹妹想吃什么？", "answer": "包子", "options": ["包子", "牛奶", "米饭", "米饭和菜"], "explanation": "Đáp án: 包子. Thông tin đối chiếu trong bài: “妹妹想吃包子，我也买一些。”", "evidence": "妹妹想吃包子，我也买一些。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R10-5", "lesson": 10, "revision": 2, "title": "Cửa hàng trước hiệu sách", "text": "学校外有一个商店，在书店前边。商店的售货员是我的姐姐。这里有衣服，也有杯子。这里的衣服不贵，杯子也很便宜。今天妈妈去买两个杯子。我下课后去看姐姐。", "translation": "Ngoài trường có một cửa hàng, nằm trước hiệu sách. Người bán ở đó là chị gái tôi. Chị bán quần áo và cốc. Quần áo ở đây không đắt, cốc cũng rất rẻ. Hôm nay mẹ đến mua hai chiếc cốc. Sau giờ học tôi đến thăm chị.", "questions": [{"id": "R10-5-v2-1", "question": "商店在哪儿？", "answer": "学校外", "options": ["桌子下", "桌子前", "前", "学校外"], "explanation": "Đáp án: 学校外. Thông tin đối chiếu trong bài: “学校外有一个商店，在书店前边。”", "evidence": "学校外有一个商店，在书店前边。"}, {"id": "R10-5-v2-2", "question": "商店在书店的哪边？", "answer": "前边", "options": ["前边", "桌子上", "房间外边", "这边"], "explanation": "Đáp án: 前边. Thông tin đối chiếu trong bài: “学校外有一个商店，在书店前边。”", "evidence": "学校外有一个商店，在书店前边。"}, {"id": "R10-5-v2-3", "question": "谁是售货员？", "answer": "姐姐", "options": ["法国人", "姐姐", "泰国人", "我"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “商店的售货员是我的姐姐。”", "evidence": "商店的售货员是我的姐姐。"}, {"id": "R10-5-v2-4", "question": "这里的衣服贵吗？", "answer": "不贵", "options": ["有", "没有", "不贵", "很忙"], "explanation": "Đáp án: 不贵. Thông tin đối chiếu trong bài: “这里的衣服不贵，杯子也很便宜。”", "evidence": "这里的衣服不贵，杯子也很便宜。"}, {"id": "R10-5-v2-5", "question": "妈妈买几个杯子？", "answer": "两个", "options": ["八岁", "十岁", "十二岁", "两个"], "explanation": "Đáp án: 两个. Thông tin đối chiếu trong bài: “今天妈妈去买两个杯子。”", "evidence": "今天妈妈去买两个杯子。"}, {"id": "R10-5-v2-6", "question": "我____去看姐姐。", "answer": "下课后", "options": ["下课后", "上午", "下午", "晚上"], "explanation": "Đáp án: 下课后. Thông tin đối chiếu trong bài: “我下课后去看姐姐。”", "evidence": "我下课后去看姐姐。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R11-1", "lesson": 11, "revision": 2, "title": "Em trai học đại học", "text": "我弟弟是大学生，正在学校学医。他早上六点半起床，晚上十点睡觉。昨天他在医院找爸爸，今天在家读书。他不想看电视。我问他：明天去不去书店？他想去，也想买一些书。", "translation": "Em trai tôi là sinh viên đại học, đang học y ở trường. Em dậy lúc sáu giờ rưỡi sáng, ngủ lúc mười giờ tối. Hôm qua em đến bệnh viện tìm bố, hôm nay đọc sách ở nhà. Em không muốn xem tivi. Tôi hỏi mai em có đi hiệu sách không. Em muốn đi và cũng muốn mua một ít sách.", "questions": [{"id": "R11-1-v2-1", "question": "弟弟是什么人？", "answer": "大学生", "options": ["大学生", "妈妈", "哥哥", "妹妹"], "explanation": "Đáp án: 大学生. Thông tin đối chiếu trong bài: “我弟弟是大学生，正在学校学医。”", "evidence": "我弟弟是大学生，正在学校学医。"}, {"id": "R11-1-v2-2", "question": "弟弟正在学什么？", "answer": "医", "options": ["桌子", "医", "猫", "一只小狗"], "explanation": "Đáp án: 医. Thông tin đối chiếu trong bài: “我弟弟是大学生，正在学校学医。”", "evidence": "我弟弟是大学生，正在学校学医。"}, {"id": "R11-1-v2-3", "question": "弟弟几点起床？", "answer": "六点半", "options": ["星期四", "星期五", "六点半", "星期六"], "explanation": "Đáp án: 六点半. Thông tin đối chiếu trong bài: “他早上六点半起床，晚上十点睡觉。”", "evidence": "他早上六点半起床，晚上十点睡觉。"}, {"id": "R11-1-v2-4", "question": "弟弟几点睡觉？", "answer": "十点", "options": ["六点十分", "下午五点", "下午两点", "十点"], "explanation": "Đáp án: 十点. Thông tin đối chiếu trong bài: “他早上六点半起床，晚上十点睡觉。”", "evidence": "他早上六点半起床，晚上十点睡觉。"}, {"id": "R11-1-v2-5", "question": "昨天弟弟去哪儿找爸爸？", "answer": "医院", "options": ["医院", "泰国", "家", "超市"], "explanation": "Đáp án: 医院. Thông tin đối chiếu trong bài: “昨天他在医院找爸爸，今天在家读书。”", "evidence": "昨天他在医院找爸爸，今天在家读书。"}, {"id": "R11-1-v2-6", "question": "明天弟弟想去哪儿？", "answer": "书店", "options": ["桌子前", "书店", "前", "后"], "explanation": "Đáp án: 书店. Thông tin đối chiếu trong bài: “我问他：明天去不去书店？”", "evidence": "我问他：明天去不去书店？"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R11-2", "lesson": 11, "revision": 2, "title": "Đừng gọi khi đang ngủ", "text": "姐姐：李文在哪儿？\n妈妈：他正在房间里睡觉。\n姐姐：现在九点，他还睡觉？\n妈妈：他昨天晚上在医院上班，今天早上六点下班。\n姐姐：我想问他什么时候去书店。\n妈妈：下午问吧。他现在要休息。", "translation": "Chị gái: Lý Văn ở đâu ạ? Mẹ: Em đang ngủ trong phòng. Chị gái: Giờ chín giờ mà em vẫn ngủ sao? Mẹ: Tối qua em làm ở bệnh viện, sáng nay sáu giờ mới tan làm. Chị gái: Con muốn hỏi em một câu. Mẹ: Chiều hỏi nhé. Giờ em cần nghỉ.", "questions": [{"id": "R11-2-v2-1", "question": "李文在哪儿？", "answer": "房间里", "options": ["房间里", "前", "后", "大房间"], "explanation": "Đáp án: 房间里. Thông tin đối chiếu trong bài: “妈妈：他正在房间里睡觉。”", "evidence": "妈妈：他正在房间里睡觉。"}, {"id": "R11-2-v2-2", "question": "李文正在做什么？", "answer": "睡觉", "options": ["看书", "睡觉", "看电视", "唱歌"], "explanation": "Đáp án: 睡觉. Thông tin đối chiếu trong bài: “妈妈：他正在房间里睡觉。”", "evidence": "妈妈：他正在房间里睡觉。"}, {"id": "R11-2-v2-3", "question": "现在几点？", "answer": "九点", "options": ["今天", "明天", "九点", "昨天"], "explanation": "Đáp án: 九点. Thông tin đối chiếu trong bài: “姐姐：现在九点，他还睡觉？”", "evidence": "姐姐：现在九点，他还睡觉？"}, {"id": "R11-2-v2-4", "question": "李文昨天晚上在哪儿上班？", "answer": "医院", "options": ["桌子下", "桌子前", "前", "医院"], "explanation": "Đáp án: 医院. Thông tin đối chiếu trong bài: “妈妈：他昨天晚上在医院上班，今天早上六点下班。”", "evidence": "妈妈：他昨天晚上在医院上班，今天早上六点下班。"}, {"id": "R11-2-v2-5", "question": "李文今天几点下班？", "answer": "六点", "options": ["六点", "星期一", "星期二", "星期三"], "explanation": "Đáp án: 六点. Thông tin đối chiếu trong bài: “妈妈：他昨天晚上在医院上班，今天早上六点下班。”", "evidence": "妈妈：他昨天晚上在医院上班，今天早上六点下班。"}, {"id": "R11-2-v2-6", "question": "妈妈想姐姐什么时候问？", "answer": "下午", "options": ["三点", "下午", "五点", "六点"], "explanation": "Đáp án: 下午. Thông tin đối chiếu trong bài: “姐姐：我想问他什么时候去书店。”", "evidence": "姐姐：我想问他什么时候去书店。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R11-3", "lesson": 11, "revision": 2, "title": "Tìm bạn ở quán ăn", "text": "今天我去饭店找朋友。朋友不在那里。他正在学校上课。我不知道他什么时候下课，想问他的姐姐。姐姐：他下午三点下课。现在你吃饭吧！我吃一些面条儿，三点去学校。", "translation": "Hôm nay tôi đến quán ăn tìm bạn. Bạn không có ở đó mà đang học ở trường. Tôi không biết bạn tan học lúc nào nên hỏi chị gái của bạn. Chị bảo bạn tan học lúc ba giờ chiều và bảo tôi ăn cơm trước. Tôi ăn một ít mì, rồi đến trường lúc ba giờ.", "questions": [{"id": "R11-3-v2-1", "question": "我去哪儿找朋友？", "answer": "饭店", "options": ["饭店", "桌子前", "前", "后"], "explanation": "Đáp án: 饭店. Thông tin đối chiếu trong bài: “今天我去饭店找朋友。”", "evidence": "今天我去饭店找朋友。"}, {"id": "R11-3-v2-2", "question": "朋友在饭店吗？", "answer": "不在", "options": ["很漂亮", "不在", "不大", "好吃"], "explanation": "Đáp án: 不在. Thông tin đối chiếu trong bài: “朋友不在那里。”", "evidence": "朋友不在那里。"}, {"id": "R11-3-v2-3", "question": "朋友正在做什么？", "answer": "上课", "options": ["下班", "看电影", "上课", "读书"], "explanation": "Đáp án: 上课. Thông tin đối chiếu trong bài: “他正在学校上课。”", "evidence": "他正在学校上课。"}, {"id": "R11-3-v2-4", "question": "朋友在哪儿？", "answer": "学校", "options": ["中国", "法国", "泰国", "学校"], "explanation": "Đáp án: 学校. Thông tin đối chiếu trong bài: “他正在学校上课。”", "evidence": "他正在学校上课。"}, {"id": "R11-3-v2-5", "question": "朋友几点下课？", "answer": "三点", "options": ["三点", "晚上", "早上", "星期一"], "explanation": "Đáp án: 三点. Thông tin đối chiếu trong bài: “姐姐：他下午三点下课。”", "evidence": "姐姐：他下午三点下课。"}, {"id": "R11-3-v2-6", "question": "我吃什么？", "answer": "面条儿", "options": ["一些菜", "面条儿", "牛奶", "包子"], "explanation": "Đáp án: 面条儿. Thông tin đối chiếu trong bài: “我吃一些面条儿，三点去学校。”", "evidence": "我吃一些面条儿，三点去学校。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R11-4", "lesson": 11, "revision": 2, "title": "Bố lái xe đến đâu?", "text": "爸爸会开车。今天早上，他要去学校找老师。妈妈问：你知道老师在哪儿吗？爸爸：知道，在学校的大房间里。妈妈也想去。爸爸八点开车去，九点还要去医院上班。", "translation": "Bố biết lái xe. Sáng nay bố muốn đến trường tìm giáo viên. Mẹ hỏi bố có biết giáo viên ở đâu không. Bố biết, ở phòng lớn trong trường. Mẹ cũng muốn đi. Bố lái xe đi lúc tám giờ, chín giờ còn phải đến bệnh viện làm việc.", "questions": [{"id": "R11-4-v2-1", "question": "爸爸会做什么？", "answer": "开车", "options": ["开车", "吃饭", "坐出租车", "上课"], "explanation": "Đáp án: 开车. Thông tin đối chiếu trong bài: “爸爸会开车。”", "evidence": "爸爸会开车。"}, {"id": "R11-4-v2-2", "question": "爸爸要去哪儿找老师？", "answer": "学校", "options": ["泰国", "学校", "家", "超市"], "explanation": "Đáp án: 学校. Thông tin đối chiếu trong bài: “今天早上，他要去学校找老师。”", "evidence": "今天早上，他要去学校找老师。"}, {"id": "R11-4-v2-3", "question": "老师在哪儿？", "answer": "大房间里", "options": ["书店", "桌子下", "大房间 , "explanation": "Đáp án: 第十课. Thông tin đối chiếu trong bài: “我：第十课。”", "evidence": "我：第十课。"}, {"id": "R11-5-v2-5", "question": "我想问谁？", "answer": "老师", "options": ["老师", "中国人", "法国人", "泰国人"], "explanation": "Đáp án: 老师. Thông tin đối chiếu trong bài: “我想问老师。”", "evidence": "我想问老师。"}, {"id": "R11-5-v2-6", "question": "同学想在哪儿见？", "answer": "学校", "options": ["小房间", "学校", "桌子上", "房间外边"], "explanation": "Đáp án: 学校. Thông tin đối chiếu trong bài: “我们在学校见吧！”", "evidence": "我们在学校见吧！"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R12-1", "lesson": 12, "revision": 2, "title": "Ngày đầu có tuyết", "text": "昨天下雪了，天气很冷。今天早上，学校外有一些雪。我想去学校，妈妈：你有点儿热，在家休息吧。我今天喝水，在家看书。下午觉得不热了，想明天再去上课。", "translation": "Hôm qua tuyết rơi, trời rất lạnh. Sáng nay ngoài trường có một ít tuyết. Tôi muốn đến trường, mẹ bảo tôi hơi nóng người nên ở nhà nghỉ. Hôm nay tôi uống nước, đọc sách ở nhà. Buổi chiều thấy không còn nóng nữa, tôi muốn ngày mai đi học lại.", "questions": [{"id": "R12-1-v2-1", "question": "昨天天气怎么样？", "answer": "很冷", "options": ["太热了", "很冷", "不冷", "很好看"], "explanation": "Đáp án: 很冷. Thông tin đối chiếu trong bài: “昨天下雪了，天气很冷。”", "evidence": "昨天下雪了，天气很冷。"}, {"id": "R12-1-v2-2", "question": "学校外有什么？", "answer": "雪", "options": ["菜", "饺子", "雪", "面条儿"], "explanation": "Đáp án: 雪. Thông tin đối chiếu trong bài: “今天早上，学校外有一些雪。”", "evidence": "今天早上，学校外有一些雪。"}, {"id": "R12-1-v2-3", "question": "妈妈想我在哪儿休息？", "answer": "家", "options": ["学校外", "书店", "桌子下", "家"], "explanation": "Đáp án: 家. Thông tin đối chiếu trong bài: “我想去学校，妈妈：你有点儿热，在家休息吧。”", "evidence": "我想去学校，妈妈：你有点儿热，在家休息吧。"}, {"id": "R12-1-v2-4", "question": "今天我喝什么？", "answer": "水", "options": ["水", "苹果", "热牛奶", "饺子和面条儿"], "explanation": "Đáp án: 水. Thông tin đối chiếu trong bài: “我今天喝水，在家看书。”", "evidence": "我今天喝水，在家看书。"}, {"id": "R12-1-v2-5", "question": "我在家做什么？", "answer": "看书", "options": ["读书", "看书", "看电视", "唱歌"], "explanation": "Đáp án: 看书. Thông tin đối chiếu trong bài: “我今天喝水，在家看书。”", "evidence": "我今天喝水，在家看书。"}, {"id": "R12-1-v2-6", "question": "我想什么时候再去上课？", "answer": "明天", "options": ["今年", "上午", "明天", "下午"], "explanation": "Đáp án: 明天. Thông tin đối chiếu trong bài: “下午觉得不热了，想明天再去上课。”", "evidence": "下午觉得不热了，想明天再去上课。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R12-2", "lesson": 12, "revision": 2, "title": "Đi khám cùng mẹ", "text": "今天妈妈生病了，觉得有点儿冷。我和妈妈去医院看病。医生：您喝一点儿热水，再休息吧。您今天不上班。妈妈的公司在医院前边。下午我回家做饭，妈妈在房间里休息。", "translation": "Hôm nay mẹ bị ốm, thấy hơi lạnh. Tôi đi cùng mẹ đến bệnh viện khám. Bác sĩ bảo mẹ uống một ít nước nóng và nghỉ, hôm nay mẹ không đi làm. Công ty của mẹ ở trước bệnh viện. Chiều tôi về nhà nấu cơm, mẹ nghỉ trong phòng.", "questions": [{"id": "R12-2-v2-1", "question": "谁生病了？", "answer": "妈妈", "options": ["爸爸", "妈妈", "哥哥", "妹妹"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “今天妈妈生病了，觉得有点儿冷。”", "evidence": "今天妈妈生病了，觉得有点儿冷。"}, {"id": "R12-2-v2-2", "question": "妈妈觉得怎么样？", "answer": "有点儿冷", "options": ["不去", "能", "有点儿冷", "不能"], "explanation": "Đáp án: 有点儿冷. Thông tin đối chiếu trong bài: “今天妈妈生病了，觉得有点儿冷。”", "evidence": "今天妈妈生病了，觉得有点儿冷。"}, {"id": "R12-2-v2-3", "question": "我们去哪儿看病？", "answer": "医院", "options": ["法国", "泰国", "家", "医院"], "explanation": "Đáp án: 医院. Thông tin đối chiếu trong bài: “我和妈妈去医院看病。”", "evidence": "我和妈妈去医院看病。"}, {"id": "R12-2-v2-4", "question": "医生想妈妈喝什么？", "answer": "热水", "options": ["热水", "牛奶", "包子", "米饭"], "explanation": "Đáp án: 热水. Thông tin đối chiếu trong bài: “医生：您喝一点儿热水，再休息吧。”", "evidence": "医生：您喝一点儿热水，再休息吧。"}, {"id": "R12-2-v2-5", "question": "妈妈的公司在哪儿？", "answer": "医院前边", "options": ["小房间", "医院前边", "桌子上", "房间外边"], "explanation": "Đáp án: 医院前边. Thông tin đối chiếu trong bài: “妈妈的公司在医院前边。”", "evidence": "妈妈的公司在医院前边。"}, {"id": "R12-2-v2-6", "question": "下午我回家做什么？", "answer": "做饭", "options": ["读书", "看书", "做饭", "看电视"], "explanation": "Đáp án: 做饭. Thông tin đối chiếu trong bài: “下午我回家做饭，妈妈在房间里休息。”", "evidence": "下午我回家做饭，妈妈在房间里休息。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R12-3", "lesson": 12, "revision": 2, "title": "Cơn mưa làm đổi kế hoạch", "text": "今天下午下雨了。我和朋友想去电影院，现在不去了。朋友来我家，我们在家看电影。妈妈回来了，觉得有点儿冷。她想喝热水。晚上雨很大，我们不想去超市。家里还有米饭和菜。", "translation": "Chiều nay trời mưa. Tôi và bạn định đến rạp nhưng giờ không đi nữa. Bạn đến nhà tôi, chúng tôi xem phim ở nhà. Mẹ về, thấy hơi lạnh và muốn uống nước nóng. Buổi tối mưa rất lớn, chúng tôi không muốn đi siêu thị. Trong nhà vẫn có cơm và món ăn.", "questions": [{"id": "R12-3-v2-1", "question": "今天下午天气怎么样？", "answer": "下雨了", "options": ["不休息", "下雨了", "去", "不去"], "explanation": "Đáp án: 下雨了. Thông tin đối chiếu trong bài: “今天下午下雨了。”", "evidence": "今天下午下雨了。"}, {"id": "R12-3-v2-2", "question": "我们现在去电影院吗？", "answer": "不去", "options": ["很多", "是", "不去", "不是"], "explanation": "Đáp án: 不去. Thông tin đối chiếu trong bài: “我和朋友想去电影院，现在不去了。”", "evidence": "我和朋友想去电影院，现在不去了。"}, {"id": "R12-3-v2-3", "question": "朋友来哪儿？", "answer": "我家", "options": ["桌子前", "前", "后", "我家"], "explanation": "Đáp án: 我家. Thông tin đối chiếu trong bài: “朋友来我家，我们在家看电影。”", "evidence": "朋友来我家，我们在家看电影。"}, {"id": "R12-3-v2-4", "question": "我们在家做什么？", "answer": "看电影", "options": ["看电影", "读书", "看书", "看电视"], "explanation": "Đáp án: 看电影. Thông tin đối chiếu trong bài: “朋友来我家，我们在家看电影。”", "evidence": "朋友来我家，我们在家看电影。"}, {"id": "R12-3-v2-5", "question": "谁觉得有点儿冷？", "answer": "妈妈", "options": ["哥哥", "妈妈", "妹妹", "儿子"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “妈妈回来了，觉得有点儿冷。”", "evidence": "妈妈回来了，觉得有点儿冷。"}, {"id": "R12-3-v2-6", "question": "家里还有什么？", "answer": "米饭和菜", "options": ["包子", "牛奶和包子", "米饭和菜", "苹果"], "explanation": "Đáp án: 米饭和菜. Thông tin đối chiếu trong bài: “家里还有米饭和菜。”", "evidence": "家里还有米饭和菜。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R12-4", "lesson": 12, "revision": 2, "title": "Nước nóng hay nước lạnh?", "text": "我下班回到家，觉得太热了，想喝冷水。爸爸：你有点儿生病，喝热水吧。妈妈在医院看病，还没有回家。我喝一点儿热水，在房间里休息。晚上妈妈回来了，她想喝一点儿水。", "translation": "Tôi tan làm về nhà, thấy nóng quá và muốn uống nước lạnh. Bố bảo tôi hơi ốm nên uống nước nóng. Mẹ đang khám ở bệnh viện, chưa về nhà. Tôi uống một ít nước nóng rồi nghỉ trong phòng. Tối mẹ về, mẹ muốn uống một ít nước.", "questions": [{"id": "R12-4-v2-1", "question": "我下班回到哪儿？", "answer": "家", "options": ["泰国", "家", "超市", "那边"], "explanation": "Đáp án: 家. Thông tin đối chiếu trong bài: “我下班回到家，觉得太热了，想喝冷水。”", "evidence": "我下班回到家，觉得太热了，想喝冷水。"}, {"id": "R12-4-v2-2", "question": "我觉得怎么样？", "answer": "太热了", "options": ["不忙", "会", "太热了", "不会"], "explanation": "Đáp án: 太热了. Thông tin đối chiếu trong bài: “我下班回到家，觉得太热了，想喝冷水。”", "evidence": "我下班回到家，觉得太热了，想喝冷水。"}, {"id": "R12-4-v2-3", "question": "我想喝什么？", "answer": "冷水", "options": ["水果", "热水", "热牛奶", "冷水"], "explanation": "Đáp án: 冷水. Thông tin đối chiếu trong bài: “我下班回到家，觉得太热了，想喝冷水。”", "evidence": "我下班回到家，觉得太热了，想喝冷水。"}, {"id": "R12-4-v2-4", "question": "爸爸想我喝什么？", "answer": "热水", "options": ["热水", "米饭和菜", "苹果", "水果"], "explanation": "Đáp án: 热水. Thông tin đối chiếu trong bài: “爸爸：你有点儿生病，喝热水吧。”", "evidence": "爸爸：你有点儿生病，喝热水吧。"}, {"id": "R12-4-v2-5", "question": "妈妈在哪儿看病？", "answer": "医院", "options": ["大房间", "医院", "小房间", "桌子上"], "explanation": "Đáp án: 医院. Thông tin đối chiếu trong bài: “妈妈在医院看病，还没有回家。”", "evidence": "妈妈在医院看病，还没有回家。"}, {"id": "R12-4-v2-6", "question": "我在哪儿休息？", "answer": "房间里", "options": ["家", "超市", "房间里", "那边"], "explanation": "Đáp án: 房间里. Thông tin đối chiếu trong bài: “我喝一点儿热水，在房间里休息。”", "evidence": "我喝一点儿热水，在房间里休息。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R12-5", "lesson": 12, "revision": 2, "title": "Lời nhắn từ công ty", "text": "爸爸：我今天不回家吃午饭了，公司有事。\n妈妈：外边下雨了，你冷不冷？\n爸爸：不冷，公司里很热。\n妈妈：我有点儿生病，想去医院。\n爸爸：好。晚上我回家做饭，你休息吧。", "translation": "Bố: Hôm nay bố không về nhà ăn trưa nữa, công ty có việc. Mẹ: Ngoài trời mưa rồi, bố có lạnh không? Bố: Không lạnh, trong công ty rất nóng. Mẹ: Mẹ hơi ốm, muốn đến bệnh viện. Bố: Được. Tối bố về nấu cơm, mẹ nghỉ nhé.", "questions": [{"id": "R12-5-v2-1", "question": "爸爸今天在哪儿吃午饭？", "answer": "公司", "options": ["超市", "公司", "那边", "电影院"], "explanation": "Đáp án: 公司. Thông tin đối chiếu trong bài: “爸爸：我今天不回家吃午饭了，公司有事。”", "evidence": "爸爸：我今天不回家吃午饭了，公司有事。"}, {"id": "R12-5-v2-2", "question": "外边天气怎么样？", "answer": "下雨了", "options": ["去", "不去", "下雨了", "能"], "explanation": "Đáp án: 下雨了. Thông tin đối chiếu trong bài: “妈妈：外边下雨了，你冷不冷？”", "evidence": "妈妈：外边下雨了，你冷不冷？"}, {"id": "R12-5-v2-3", "question": "公司里冷吗？", "answer": "不冷", "options": ["很冷", "下雨了", "有点儿冷", "不冷"], "explanation": "Đáp án: 不冷. Thông tin đối chiếu trong bài: “爸爸：不冷，公司里很热。”", "evidence": "爸爸：不冷，公司里很热。"}, {"id": "R12-5-v2-4", "question": "谁有点儿生病？", "answer": "妈妈", "options": ["妈妈", "中国人", "法国人", "泰国人"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “妈妈：我有点儿生病，想去医院。”", "evidence": "妈妈：我有点儿生病，想去医院。"}, {"id": "R12-5-v2-5", "question": "妈妈想去哪儿？", "answer": "医院", "options": ["公司", "医院", "中国", "法国"], "explanation": "Đáp án: 医院. Thông tin đối chiếu trong bài: “妈妈：我有点儿生病，想去医院。”", "evidence": "妈妈：我有点儿生病，想去医院。"}, {"id": "R12-5-v2-6", "question": "晚上谁做饭？", "answer": "爸爸", "options": ["弟弟", "朋友", "爸爸", "医生"], "explanation": "Đáp án: 爸爸. Thông tin đối chiếu trong bài: “爸爸：我今天不回家吃午饭了，公司有事。”", "evidence": "爸爸：我今天不回家吃午饭了，公司有事。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R13-1", "lesson": 13, "revision": 2, "title": "Gọi bữa sáng ở quán", "text": "服务员：先生，您要什么？\n我：请给我一杯茶、一个鸡蛋和一些面包。\n服务员：好。女士，您呢？\n妈妈：我要一杯热牛奶，不想吃鸡蛋。\n我：妈妈，您可以吃一半面包。\n妈妈：谢谢！我喝牛奶。", "translation": "Phục vụ: Thưa ông, ông dùng gì? Tôi: Xin cho tôi một cốc trà, một quả trứng và một ít bánh mì. Phục vụ: Còn vị nữ khách này? Mẹ: Tôi muốn một cốc sữa nóng, không muốn ăn trứng. Tôi: Mẹ có thể ăn một nửa bánh mì. Mẹ: Cảm ơn! Mẹ uống sữa.", "questions": [{"id": "R13-1-v2-1", "question": "谁问我要什么？", "answer": "服务员", "options": ["同学", "您", "服务员", "大家"], "explanation": "Đáp án: 服务员. Thông tin đối chiếu trong bài: “服务员：好。”", "evidence": "服务员：好。"}, {"id": "R13-1-v2-2", "question": "我要一杯什么？", "answer": "茶", "options": ["饺子和面条儿", "菜和饺子", "面条儿和菜", "茶"], "explanation": "Đáp án: 茶. Thông tin đối chiếu trong bài: “我：请给我一杯茶、一个鸡蛋和一些面包。”", "evidence": "我：请给我一杯茶、一个鸡蛋和一些面包。"}, {"id": "R13-1-v2-3", "question": "我要几个鸡蛋？", "answer": "一个", "options": ["一个", "第十课", "第十二课", "五分钟"], "explanation": "Đáp án: 一个. Thông tin đối chiếu trong bài: “我：请给我一杯茶、一个鸡蛋和一些面包。”", "evidence": "我：请给我一杯茶、一个鸡蛋和一些面包。"}, {"id": "R13-1-v2-4", "question": "妈妈要什么？", "answer": "热牛奶", "options": ["一些菜", "热牛奶", "包子", "米饭"], "explanation": "Đáp án: 热牛奶. Thông tin đối chiếu trong bài: “妈妈：我要一杯热牛奶，不想吃鸡蛋。”", "evidence": "妈妈：我要一杯热牛奶，不想吃鸡蛋。"}, {"id": "R13-1-v2-5", "question": "妈妈想吃鸡蛋吗？", "answer": "不想", "options": ["不去", "能", "不想", "不能"], "explanation": "Đáp án: 不想. Thông tin đối chiếu trong bài: “妈妈：我要一杯热牛奶，不想吃鸡蛋。”", "evidence": "妈妈：我要一杯热牛奶，不想吃鸡蛋。"}, {"id": "R13-1-v2-6", "question": "妈妈可以吃多少面包？", "answer": "一半", "options": ["六岁", "八岁", "十岁", "一半"], "explanation": "Đáp án: 一半. Thông tin đối chiếu trong bài: “我：妈妈，您可以吃一半面包。”", "evidence": "我：妈妈，您可以吃一半面包。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R13-2", "lesson": 13, "revision": 2, "title": "Xin phép ngồi cùng bàn", "text": "我去饭店吃午饭。桌子前有一个先生，他正在喝茶。我问：请问，我可以坐这儿吗？先生：可以，请坐。我在这儿吃午饭，服务员给我一杯水。我想看一下今天卖什么。这里的面条儿很便宜。", "translation": "Tôi đến quán ăn ăn trưa. Trước bàn có một người đàn ông đang uống trà. Tôi hỏi có thể ngồi ở đây không. Ông đồng ý và mời ngồi. Tôi ăn trưa ở đây, phục vụ đưa cho tôi một cốc nước. Tôi muốn xem hôm nay quán bán gì. Mì ở đây rất rẻ.", "questions": [{"id": "R13-2-v2-1", "question": "我去哪儿吃午饭？", "answer": "饭店", "options": ["学校", "学校前", "饭店", "学校外"], "explanation": "Đáp án: 饭店. Thông tin đối chiếu trong bài: “我去饭店吃午饭。”", "evidence": "我去饭店吃午饭。"}, {"id": "R13-2-v2-2", "question": "先生正在喝什么？", "answer": "茶", "options": ["米饭", "牛奶和包子", "米饭和菜", "茶"], "explanation": "Đáp án: 茶. Thông tin đối chiếu trong bài: “桌子前有一个先生，他正在喝茶。”", "evidence": "桌子前有一个先生，他正在喝茶。"}, {"id": "R13-2-v2-3", "question": "我可以坐这儿吗？", "answer": "可以", "options": ["可以", "卖", "不卖", "很好看"], "explanation": "Đáp án: 可以. Thông tin đối chiếu trong bài: “我问：请问，我可以坐这儿吗？”", "evidence": "我问：请问，我可以坐这儿吗？"}, {"id": "R13-2-v2-4", "question": "谁给我水？", "answer": "服务员", "options": ["哥哥", "服务员", "妹妹", "儿子"], "explanation": "Đáp án: 服务员. Thông tin đối chiếu trong bài: “我在这儿吃午饭，服务员给我一杯水。”", "evidence": "我在这儿吃午饭，服务员给我一杯水。"}, {"id": "R13-2-v2-5", "question": "服务员给我什么？", "answer": "一杯水", "options": ["饺子", "面条儿", "一杯水", "一些菜"], "explanation": "Đáp án: 一杯水. Thông tin đối chiếu trong bài: “我在这儿吃午饭，服务员给我一杯水。”", "evidence": "我在这儿吃午饭，服务员给我一杯水。"}, {"id": "R13-2-v2-6", "question": "这里的什么很便宜？", "answer": "面条儿", "options": ["苹果", "水果", "水", "面条儿"], "explanation": "Đáp án: 面条儿. Thông tin đối chiếu trong bài: “这里的面条儿很便宜。”", "evidence": "这里的面条儿很便宜。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R13-3", "lesson": 13, "revision": 2, "title": "Cuộc gọi hỏi món hàng", "text": "我给超市打电话：请问，你们卖面包吗？售货员：卖，今天的面包很好吃。我：我还想买鸡蛋，多少钱一个？售货员：一块钱一个。我：好，我下午去。妈妈想买牛奶，我也买一些牛奶。", "translation": "Tôi gọi điện cho siêu thị hỏi có bán bánh mì không. Người bán bảo có, bánh hôm nay rất ngon. Tôi còn muốn mua trứng và hỏi giá. Trứng một tệ một quả. Tôi nói chiều sẽ đến. Mẹ muốn mua sữa, tôi cũng sẽ mua một ít.", "questions": [{"id": "R13-3-v2-1", "question": "我给哪儿打电话？", "answer": "超市", "options": ["房间里", "学校", "超市", "学校前"], "explanation": "Đáp án: 超市. Thông tin đối chiếu trong bài: “我给超市打电话：请问，你们卖面包吗？”", "evidence": "我给超市打电话：请问，你们卖面包吗？"}, {"id": "R13-3-v2-2", "question": "我问____。", "answer": "售货员", "options": ["妈妈", "哥哥", "妹妹", "售货员"], "explanation": "Đáp án: 售货员. Thông tin đối chiếu trong bài: “售货员：卖，今天的面包很好吃。”", "evidence": "售货员：卖，今天的面包很好吃。"}, {"id": "R13-3-v2-3", "question": "超市卖面包吗？", "answer": "卖", "options": ["卖", "有", "没有", "很忙"], "explanation": "Đáp án: 卖. Thông tin đối chiếu trong bài: “售货员：卖，今天的面包很好吃。”", "evidence": "售货员：卖，今天的面包很好吃。"}, {"id": "R13-3-v2-4", "question": "鸡蛋一个多少钱？", "answer": "一块钱", "options": ["一个", "一块钱", "两个", "三个"], "explanation": "Đáp án: 一块钱. Thông tin đối chiếu trong bài: “售货员：一块钱一个。”", "evidence": "售货员：一块钱一个。"}, {"id": "R13-3-v2-5", "question": "我什么时候去？", "answer": "下午", "options": ["五月三号", "八月十号", "下午", "三点"], "explanation": "Đáp án: 下午. Thông tin đối chiếu trong bài: “我：好，我下午去。”", "evidence": "我：好，我下午去。"}, {"id": "R13-3-v2-6", "question": "妈妈想买什么？", "answer": "牛奶", "options": ["面条儿", "一些菜", "包子", "牛奶"], "explanation": "Đáp án: 牛奶. Thông tin đối chiếu trong bài: “妈妈想买牛奶，我也买一些牛奶。”", "evidence": "妈妈想买牛奶，我也买一些牛奶。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R13-4", "lesson": 13, "revision": 2, "title": "Chia nửa chiếc bánh mì", "text": "今天早饭，我和妹妹吃面包。妹妹没有杯子，我给她一个杯子。妈妈给我们热牛奶。妹妹：我可以吃一半面包吗？我：可以，我吃一半。爸爸现在还在睡觉，我们给他一些面包和一个鸡蛋。", "translation": "Bữa sáng hôm nay tôi và em gái ăn bánh mì. Em không có cốc nên tôi đưa em một chiếc. Mẹ cho chúng tôi sữa nóng. Em hỏi có thể ăn nửa bánh mì không. Tôi đồng ý, mình ăn một nửa. Bố vẫn đang ngủ, chúng tôi dành cho bố một ít bánh mì và một quả trứng.", "questions": [{"id": "R13-4-v2-1", "question": "今天早饭我们吃什么？", "answer": "面包", "options": ["茶", "热牛奶", "面包", "一杯水"], "explanation": "Đáp án: 面包. Thông tin đối chiếu trong bài: “今天早饭，我和妹妹吃面包。”", "evidence": "今天早饭，我和妹妹吃面包。"}, {"id": "R13-4-v2-2", "question": "妹妹没有什么？", "answer": "杯子", "options": ["一本书", "雪", "衣服", "杯子"], "explanation": "Đáp án: 杯子. Thông tin đối chiếu trong bài: “妹妹没有杯子，我给她一个杯子。”", "evidence": "妹妹没有杯子，我给她一个杯子。"}, {"id": "R13-4-v2-3", "question": "我给妹妹什么？", "answer": "一个杯子", "options": ["一个杯子", "一只小狗", "一只猫", "中文课"], "explanation": "Đáp án: 一个杯子. Thông tin đối chiếu trong bài: “妹妹没有杯子，我给她一个杯子。”", "evidence": "妹妹没有杯子，我给她一个杯子。"}, {"id": "R13-4-v2-4", "question": "谁给我们热牛奶？", "answer": "妈妈", "options": ["大家", "妈妈", "你们", "李文"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “妈妈给我们热牛奶。”", "evidence": "妈妈给我们热牛奶。"}, {"id": "R13-4-v2-5", "question": "妹妹吃多少面包？", "answe ["医", "杯子", "一个杯子", "书"], "explanation": "Đáp án: 书. Thông tin đối chiếu trong bài: “老师：你看一下书，明天上午来学校，我和你读。”", "evidence": "老师：你看一下书，明天上午来学校，我和你读。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R14-1", "lesson": 14, "revision": 2, "title": "Đi xem phim rồi kể lại", "text": "昨天下午，我和朋友看了一个电影。电影很好看，我们都很喜欢。我们还在饭店吃了晚饭。我吃面条儿，朋友吃米饭。今天朋友给我打电话，还想看那个电影。我想明天在家看书。", "translation": "Chiều qua tôi và bạn xem một bộ phim. Phim rất hay, cả hai đều thích. Chúng tôi ăn tối ở quán sau đó. Tôi ăn mì, bạn ăn cơm. Hôm nay bạn gọi cho tôi, vẫn muốn xem bộ phim ấy. Tôi muốn ngày mai đọc sách ở nhà.", "questions": [{"id": "R14-1-v2-1", "question": "我们什么时候看电影？", "answer": "昨天下午", "options": ["六点", "七点", "八点", "昨天下午"], "explanation": "Đáp án: 昨天下午. Thông tin đối chiếu trong bài: “昨天下午，我和朋友看了一个电影。”", "evidence": "昨天下午，我和朋友看了一个电影。"}, {"id": "R14-1-v2-2", "question": "电影怎么样？", "answer": "很好看", "options": ["很好看", "不大", "好吃", "不贵"], "explanation": "Đáp án: 很好看. Thông tin đối chiếu trong bài: “电影很好看，我们都很喜欢。”", "evidence": "电影很好看，我们都很喜欢。"}, {"id": "R14-1-v2-3", "question": "我们在哪儿吃晚饭？", "answer": "饭店", "options": ["桌子前", "饭店", "前", "后"], "explanation": "Đáp án: 饭店. Thông tin đối chiếu trong bài: “我们还在饭店吃了晚饭。”", "evidence": "我们还在饭店吃了晚饭。"}, {"id": "R14-1-v2-4", "question": "我吃什么？", "answer": "面条儿", "options": ["一杯水", "鸡蛋", "面条儿", "面包"], "explanation": "Đáp án: 面条儿. Thông tin đối chiếu trong bài: “我吃面条儿，朋友吃米饭。”", "evidence": "我吃面条儿，朋友吃米饭。"}, {"id": "R14-1-v2-5", "question": "朋友吃什么？", "answer": "米饭", "options": ["面条儿和菜", "菜", "饺子", "米饭"], "explanation": "Đáp án: 米饭. Thông tin đối chiếu trong bài: “我吃面条儿，朋友吃米饭。”", "evidence": "我吃面条儿，朋友吃米饭。"}, {"id": "R14-1-v2-6", "question": "明天我想做什么？", "answer": "看书", "options": ["看书", "写字", "写汉字", "坐火车"], "explanation": "Đáp án: 看书. Thông tin đối chiếu trong bài: “我想明天在家看书。”", "evidence": "我想明天在家看书。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R14-2", "lesson": 14, "revision": 2, "title": "Phân công buổi học tiếng Hán", "text": "今天中文课，老师写了三个汉字。我们都看见了。有的同学读书，有的同学写字。我听见姐姐读汉语，她读书很好听。下课后，我问老师哪些字要写。老师给我一本书：不要只看，还要写。", "translation": "Trong giờ tiếng Trung hôm nay, giáo viên viết ba chữ Hán. Chúng tôi đều nhìn thấy. Có bạn đọc sách, có bạn viết chữ. Tôi nghe chị gái đọc tiếng Hán, rất hay. Tan học tôi hỏi giáo viên những chữ nào khó. Thầy/cô đưa tôi một quyển sách và dặn đừng chỉ xem mà còn phải viết.", "questions": [{"id": "R14-2-v2-1", "question": "老师写了几个汉字？", "answer": "三个", "options": ["十五分钟", "一个", "两个", "三个"], "explanation": "Đáp án: 三个. Thông tin đối chiếu trong bài: “今天中文课，老师写了三个汉字。”", "evidence": "今天中文课，老师写了三个汉字。"}, {"id": "R14-2-v2-2", "question": "我们看见了吗？", "answer": "看见了", "options": ["看见了", "不想", "休息", "不休息"], "explanation": "Đáp án: 看见了. Thông tin đối chiếu trong bài: “我们都看见了。”", "evidence": "我们都看见了。"}, {"id": "R14-2-v2-3", "question": "有的同学读什么？", "answer": "书", "options": ["电脑", "书", "我的电脑", "桌子"], "explanation": "Đáp án: 书. Thông tin đối chiếu trong bài: “有的同学读书，有的同学写字。”", "evidence": "有的同学读书，有的同学写字。"}, {"id": "R14-2-v2-4", "question": "有的同学做什么？", "answer": "写字", "options": ["睡觉", "起床", "写字", "喝水"], "explanation": "Đáp án: 写字. Thông tin đối chiếu trong bài: “有的同学读书，有的同学写字。”", "evidence": "有的同学读书，有的同学写字。"}, {"id": "R14-2-v2-5", "question": "谁读汉语？", "answer": "姐姐", "options": ["朋友", "医生", "售货员", "姐姐"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “我听见姐姐读汉语，她读书很好听。”", "evidence": "我听见姐姐读汉语，她读书很好听。"}, {"id": "R14-2-v2-6", "question": "老师给我什么？", "answer": "一本书", "options": ["一本书", "中文书", "医", "杯子"], "explanation": "Đáp án: 一本书. Thông tin đối chiếu trong bài: “老师给我一本书：不要只看，还要写。”", "evidence": "老师给我一本书：不要只看，还要写。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R14-3", "lesson": 14, "revision": 2, "title": "Lời nhắn trong thư viện nhỏ", "text": "我今天在学校读了两本书。第一本是中文书，第二本也是中文书。房间里有很多同学，他们都在学习。有些同学说话，我想：不要说话，大家在读书呢。下午我还要写汉字，晚上再看电视。", "translation": "Hôm nay tôi đọc hai quyển sách ở trường. Quyển thứ nhất là sách tiếng Trung, quyển thứ hai cũng là sách tiếng Hán. Trong phòng có nhiều bạn học, tất cả đều đang học. Một số bạn nói chuyện, tôi nghĩ: Đừng nói chuyện, mọi người đang đọc sách mà. Chiều tôi còn phải viết chữ Hán, tối mới xem tivi.", "questions": [{"id": "R14-3-v2-1", "question": "我今天读了几本书？", "answer": "两本", "options": ["第三课", "第十课", "第十二课", "两本"], "explanation": "Đáp án: 两本. Thông tin đối chiếu trong bài: “我今天在学校读了两本书。”", "evidence": "我今天在学校读了两本书。"}, {"id": "R14-3-v2-2", "question": "我在哪儿读书？", "answer": "学校", "options": ["学校", "超市", "那边", "电影院"], "explanation": "Đáp án: 学校. Thông tin đối chiếu trong bài: “我今天在学校读了两本书。”", "evidence": "我今天在学校读了两本书。"}, {"id": "R14-3-v2-3", "question": "第一本是什么书？", "answer": "中文书", "options": ["一只猫", "中文书", "中文课", "医"], "explanation": "Đáp án: 中文书. Thông tin đối chiếu trong bài: “第一本是中文书，第二本也是中文书。”", "evidence": "第一本是中文书，第二本也是中文书。"}, {"id": "R14-3-v2-4", "question": "同学们都在做什么？", "answer": "学习", "options": ["写字", "写汉字", "学习", "坐火车"], "explanation": "Đáp án: 学习. Thông tin đối chiếu trong bài: “房间里有很多同学，他们都在学习。”", "evidence": "房间里有很多同学，他们都在学习。"}, {"id": "R14-3-v2-5", "question": "有些同学做什么？", "answer": "说话", "options": ["坐出租车", "上课", "下课", "说话"], "explanation": "Đáp án: 说话. Thông tin đối chiếu trong bài: “有些同学说话，我想：不要说话，大家在读书呢。”", "evidence": "有些同学说话，我想：不要说话，大家在读书呢。"}, {"id": "R14-3-v2-6", "question": "我下午还要做什么？", "answer": "写汉字", "options": ["写汉字", "想", "工作", "认识"], "explanation": "Đáp án: 写汉字. Thông tin đối chiếu trong bài: “下午我还要写汉字，晚上再看电视。”", "evidence": "下午我还要写汉字，晚上再看电视。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R14-4", "lesson": 14, "revision": 2, "title": "Bọn trẻ đi học khác trường", "text": "我有两个孩子。儿子是小学生，女儿是中学生。昨天儿子在家写了十个汉字，女儿读了三本书。他们都喜欢学习。今天我开车，他们上学。晚上我们不看电视，想听女儿读汉语。", "translation": "Tôi có hai người con. Con trai là học sinh tiểu học, con gái là học sinh trung học. Hôm qua con trai viết mười chữ Hán ở nhà, con gái đọc ba quyển sách. Cả hai đều thích học. Hôm nay tôi lái xe, các con đi học. Buổi tối chúng tôi không xem tivi, muốn nghe con gái đọc tiếng Hán.", "questions": [{"id": "R14-4-v2-1", "question": "我有几个孩子？", "answer": "两个", "options": ["十本", "一斤", "两斤", "两个"], "explanation": "Đáp án: 两个. Thông tin đối chiếu trong bài: “我有两个孩子。”", "evidence": "我有两个孩子。"}, {"id": "R14-4-v2-2", "question": "儿子是什么学生？", "answer": "小学生", "options": ["小学生", "法国人", "泰国人", "我"], "explanation": "Đáp án: 小学生. Thông tin đối chiếu trong bài: “儿子是小学生，女儿是中学生。”", "evidence": "儿子是小学生，女儿是中学生。"}, {"id": "R14-4-v2-3", "question": "女儿是什么学生？", "answer": "中学生", "options": ["哥哥", "中学生", "妹妹", "儿子"], "explanation": "Đáp án: 中学生. Thông tin đối chiếu trong bài: “儿子是小学生，女儿是中学生。”", "evidence": "儿子是小学生，女儿是中学生。"}, {"id": "R14-4-v2-4", "question": "儿子写了几个汉字？", "answer": "十个", "options": ["六口人", "六岁", "十个", "八岁"], "explanation": "Đáp án: 十个. Thông tin đối chiếu trong bài: “昨天儿子在家写了十个汉字，女儿读了三本书。”", "evidence": "昨天儿子在家写了十个汉字，女儿读了三本书。"}, {"id": "R14-4-v2-5", "question": "女儿读了几本书？", "answer": "三本", "options": ["四十岁", "两本", "五本", "三本"], "explanation": "Đáp án: 三本. Thông tin đối chiếu trong bài: “昨天儿子在家写了十个汉字，女儿读了三本书。”", "evidence": "昨天儿子在家写了十个汉字，女儿读了三本书。"}, {"id": "R14-4-v2-6", "question": "晚上我们想听谁读汉语？", "answer": "女儿", "options": ["女儿", "中国人", "法国人", "泰国人"], "explanation": "Đáp án: 女儿. Thông tin đối chiếu trong bài: “晚上我们不看电视，想听女儿读汉语。”", "evidence": "晚上我们不看电视，想听女儿读汉语。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R14-5", "lesson": 14, "revision": 2, "title": "Chuyến tàu và cuộc gọi muộn", "text": "昨天我坐火车去看姐姐。火车上有很多人，有的在睡觉，有的在看书。我给姐姐打电话了。她没有听见。晚上她再给我打电话：你到哪儿了？我：我到了你家外边。她很高兴。我们在她家见。", "translation": "Hôm qua tôi đi tàu hỏa đến thăm chị. Trên tàu có nhiều người, có người ngủ, có người đọc sách. Tôi gọi cho chị nhưng chị không nghe thấy. Buổi tối chị gọi lại hỏi tôi đến đâu rồi. Tôi đã ở bên ngoài nhà chị. Chị rất vui. Chúng tôi gặp nhau ở nhà chị.", "questions": [{"id": "R14-5-v2-1", "question": "我昨天怎么去看姐姐？", "answer": "坐火车", "options": ["读书", "看书", "看电视", "坐火车"], "explanation": "Đáp án: 坐火车. Thông tin đối chiếu trong bài: “昨天我坐火车去看姐姐。”", "evidence": "昨天我坐火车去看姐姐。"}, {"id": "R14-5-v2-2", "question": "火车上人多吗？", "answer": "很多", "options": ["很多", "会", "不会", "想"], "explanation": "Đáp án: 很多. Thông tin đối chiếu trong bài: “火车上有很多人，有的在睡觉，有的在看书。”", "evidence": "火车上有很多人，有的在睡觉，有的在看书。"}, {"id": "R14-5-v2-3", "question": "有的人在看什么？", "answer": "书", "options": ["我的电脑", "书", "桌子", "猫"], "explanation": "Đáp án: 书. Thông tin đối chiếu trong bài: “火车上有很多人，有的在睡觉，有的在看书。”", "evidence": "火车上有很多人，有的在睡觉，有的在看书。"}, {"id": "R14-5-v2-4", "question": "我给谁打电话？", "answer": "姐姐", "options": ["女儿", "他", "姐姐", "弟弟"], "explanation": "Đáp án: 姐姐. Thông tin đối chiếu trong bài: “我给姐姐打电话了。”", "evidence": "我给姐姐打电话了。"}, {"id": "R14-5-v2-5", "question": "姐姐听见电话了吗？", "answer": "没有", "options": ["会", "不会", "想", "没有"], "explanation": "Đáp án: 没有. Thông tin đối chiếu trong bài: “她没有听见。”", "evidence": "她没有听见。"}, {"id": "R14-5-v2-6", "question": "我到了哪儿？", "answer": "姐姐家外边", "options": ["姐姐家外边", "桌子下", "桌子前", "前"], "explanation": "Đáp án: 姐姐家外边. Thông tin đối chiếu trong bài: “我：我到了你家外边。”", "evidence": "我：我到了你家外边。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R15-1", "lesson": 15, "revision": 2, "title": "Đón người nhà ở sân bay", "text": "明天妈妈坐飞机来北京。我和爸爸去机场接她。飞机下午两点到，我们一点半去机场。爸爸想开车，我想坐出租车。妈妈去年住在西安，今年想在北京住一些时间。我很想妈妈。", "translation": "Ngày mai mẹ đi máy bay đến Bắc Kinh. Tôi và bố đến sân bay đón mẹ. Máy bay đến lúc hai giờ chiều, chúng tôi đi sân bay lúc một giờ rưỡi. Bố muốn lái xe, tôi muốn đi taxi. Năm ngoái mẹ ở Tây An, năm nay muốn ở Bắc Kinh một thời gian. Tôi rất nhớ mẹ.", "questions": [{"id": "R15-1-v2-1", "question": "谁明天来北京？", "answer": "妈妈", "options": ["妈妈", "老师", "学生", "同学"], "explanation": "Đáp án: 妈妈. Thông tin đối chiếu trong bài: “明天妈妈坐飞机来北京。”", "evidence": "明天妈妈坐飞机来北京。"}, {"id": "R15-1-v2-2", "question": "妈妈怎么来？", "answer": "坐飞机", "options": ["下班", "坐飞机", "看电影", "读书"], "explanation": "Đáp án: 坐飞机. Thông tin đối chiếu trong bài: “明天妈妈坐飞机来北京。”", "evidence": "明天妈妈坐飞机来北京。"}, {"id": "R15-1-v2-3", "question": "飞机几点到？", "answer": "下午两点", "options": ["星期二", "星期三", "下午两点", "星期四"], "explanation": "Đáp án: 下午两点. Thông tin đối chiếu trong bài: “飞机下午两点到，我们一点半去机场。”", "evidence": "飞机下午两点到，我们一点半去机场。"}, {"id": "R15-1-v2-4", "question": "我们几点去机场？", "answer": "一点半", "options": ["星期六", "星期日", "三月八号", "一点半"], "explanation": "Đáp án: 一点半. Thông tin đối chiếu trong bài: “飞机下午两点到，我们一点半去机场。”", "evidence": "飞机下午两点到，我们一点半去机场。"}, {"id": "R15-1-v2-5", "question": "爸爸想怎么去？", "answer": "开车", "options": ["开车", "唱歌", "学习", "睡觉"], "explanation": "Đáp án: 开车. Thông tin đối chiếu trong bài: “爸爸想开车，我想坐出租车。”", "evidence": "爸爸想开车，我想坐出租车。"}, {"id": "R15-1-v2-6", "question": "妈妈去年住在哪儿？", "answer": "西安", "options": ["房间里", "西安", "学校", "学校前"], "explanation": "Đáp án: 西安. Thông tin đối chiếu trong bài: “妈妈去年住在西安，今年想在北京住一些时间。”", "evidence": "妈妈去年住在西安，今年想在北京住一些时间。"}], "note": "Bài đọc biên soạn theo từ vựng và mẫu câu đã học đến Unit này."}, {"id": "R15-2", "lesson": 15, "revision": 2, "title": "Tính thời gian đến trường", "text": "我住在北京，朋友住在学校前边。我早上七点起床，八点去学校。坐出租车要半个小时，朋友只要五分钟。明天我们九点上课，我想八点半到。朋友：你太早了！我们可以在学校外吃早饭。", "translation": "Tôi sống ở Bắc Kinh, bạn sống trước trường. Buổi sáng tôi dậy lúc bảy giờ, đến trường lúc tám giờ. Đi taxi mất nửa giờ, bạn chỉ mất năm phút. Mai chúng tôi học lúc chín giờ, tôi muốn đến lúc tám giờ rưỡi. Bạn bảo tôi đến sớm quá, chúng tôi có thể ăn sáng bên ngoài trường.", "questions": [{"id": "R15-2-v2-1", "question": "我住在哪儿？", "answer": "北京", "options": ["北京", "西安", "机场", "中国"], "explanation": "Đáp án: 北京. Thông tin đối chiếu trong bài: “我住在北京，朋友住在学校前边。”", "evidence": "我住在北京，朋友住在学校前边。"}, {"id": "R15-2-v2-2", "question": "朋友住在哪儿？", "answer": "学校前边", "options": ["学校外", "学校前边", "书店", "桌子下"], "explanation": "Đáp án: 学校前边. Thông tin đối chiếu trong bài: “我住在北京，朋友住在学校前边。”", "evidence": "我住在北京，朋友住在学校前边。"}, {"id": "R15-2-v2-3", "question": "我几点起床？", "answer": "七点", "options": function gradePassage(i){let s=session;if(s.answered)return;let q=s.passages[s.pi].questions[s.qi],ok=s.options[i]===q.answer;s.answered=true;if(ok)s.correct++;else store.wrong[q.id]=(store.wrong[q.id]||0)+1;save();$('#passageFeedback').innerHTML=`<div class="result"><strong>${ok?'✓ Đúng':'✗ Chưa đúng'}</strong><p>${esc(q.explanation)}</p></div><button class="primary" onclick="nextPassage()">Tiếp theo →</button>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true)}
