Danh từ) đơn vị"],"answer":"Chủ ngữ + (正/正在/在) + Động từ + (呢)","explanation":"Các phó từ 「在」, 「正在」 hoặc 「正」 được đặt trước động từ để diễn tả hành động đang thực sự xảy ra tại thời điểm nói. Bạn có thể thêm trợ từ ngữ khí 「呢」 vào cuối câu để nhấn mạnh trạng thái tiếp diễn của hành động đó."},{"question":"Ví dụ nào minh họa “Diễn tả hành động đang tiếp diễn”?","options":["他在休息呢。","我是学生。","他是中国人。","我的中文老师"],"answer":"他在休息呢。","explanation":"他在休息呢。 — Anh ấy đang nghỉ ngơi."},{"question":"“他在休息呢。” có nghĩa tiếng Việt nào?","options":["Anh ấy đang nghỉ ngơi.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Anh ấy đang nghỉ ngơi.","explanation":"tā zài xiū xī ne — Anh ấy đang nghỉ ngơi."},{"question":"Cấu trúc “Chủ ngữ + (正/正在/在) + Động từ + (呢)” thuộc điểm ngữ pháp nào?","options":["Diễn tả hành động đang tiếp diễn","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Diễn tả hành động đang tiếp diễn","explanation":"Các phó từ 「在」, 「正在」 hoặc 「正」 được đặt trước động từ để diễn tả hành động đang thực sự xảy ra tại thời điểm nói. Bạn có thể thêm trợ từ ngữ khí 「呢」 vào cuối câu để nhấn mạnh trạng thái tiếp diễn của hành động đó."},{"question":"Câu “他在休息呢。” minh họa điểm ngữ pháp nào?","options":["Diễn tả hành động đang tiếp diễn","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Diễn tả hành động đang tiếp diễn","explanation":"Cần phân biệt 「在」 là phó từ chỉ thời gian (đang) với 「在」 là giới từ chỉ địa điểm (ở), ví dụ: 「我在家」 (Tôi ở nhà) khác với 「我正在看书」 (Tôi đang đọc sách)."}]},{"name":"Động từ năng nguyện 要","formula":"Chủ ngữ + 要 + Động từ + (Tân ngữ)","explanation":"Động từ năng nguyện 「要」 được dùng để diễn tả mong muốn, ý định hoặc dự định thực hiện một hành động nào đó. Ngoài ra, nó còn thể hiện sự yêu cầu bắt buộc hoặc dự báo một sự việc sắp xảy ra.","tip":"Khi muốn nói phủ định, bạn hãy thêm 「不」 vào trước 「要」, tạo thành 「不要」 (không muốn/không cần).","note":"Cần phân biệt 「要」 với 「想」; 「要」 thường mang sắc thái quyết tâm hoặc yêu cầu mạnh mẽ hơn so với 「想」.","examples":[{"hanzi":"我要睡觉。","pinyin":"wǒ yào shuì jiào","meaning":"Tôi muốn đi ngủ."},{"hanzi":"他今天要和小朋友玩。","pinyin":"tā jīn tiān yào hé xiǎo péng yǒu wán","meaning":"Hôm nay nó muốn chơi với các bạn nhỏ."}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 要” là gì?","options":["Chủ ngữ + 要 + Động từ + (Tân ngữ)","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 要 + Động từ + (Tân ngữ)","explanation":"Động từ năng nguyện 「要」 được dùng để diễn tả mong muốn, ý định hoặc dự định thực hiện một hành động nào đó. Ngoài ra, nó còn thể hiện sự yêu cầu bắt buộc hoặc dự báo một sự việc sắp xảy ra."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 要”?","options":["我要睡觉。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我要睡觉。","explanation":"我要睡觉。 — Tôi muốn đi ngủ."},{"question":"“我要睡觉。” có nghĩa tiếng Việt nào?","options":["Tôi muốn đi ngủ.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Tôi muốn đi ngủ.","explanation":"wǒ yào shuì jiào — Tôi muốn đi ngủ."},{"question":"Cấu trúc “Chủ ngữ + 要 + Động từ + (Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 要","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Động từ năng nguyện 要","explanation":"Động từ năng nguyện 「要」 được dùng để diễn tả mong muốn, ý định hoặc dự định thực hiện một hành động nào đó. Ngoài ra, nó còn thể hiện sự yêu cầu bắt buộc hoặc dự báo một sự việc sắp xảy ra."},{"question":"Câu “我要睡觉。” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 要","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Động từ năng nguyện 要","explanation":"Cần phân biệt 「要」 với 「想」; 「要」 thường mang sắc thái quyết tâm hoặc yêu cầu mạnh mẽ hơn so với 「想」."}]}],"12":[{"name":"Câu phi chủ vị","formula":"Danh từ/Động từ/Tính từ (không cần chủ ngữ)","explanation":"Câu phi chủ vị là loại câu ngắn gọn không có chủ ngữ rõ ràng. Người ta thường dùng loại câu này để mô tả các hiện tượng tự nhiên như 「下雨了」(Trời mưa rồi) hoặc dùng trong các lời chào hỏi, cảm thán như 「你好」(Xin chào).","tip":"Hãy tập trung ghi nhớ các cụm từ cố định trong giao tiếp vì chúng thường không cần chủ ngữ.","note":"Đừng cố gắng thêm chủ ngữ vào các câu cảm thán hoặc câu miêu tả hiện tượng tự nhiên vì sẽ làm câu trở nên gượng gạo.","examples":[{"hanzi":"下雨了。","pinyin":"xià yǔ le","meaning":"Mưa rồi."},{"hanzi":"对不起！","pinyin":"duì bù qǐ","meaning":"Xin lỗi!"}],"quiz":[{"question":"Công thức đúng của “Câu phi chủ vị” là gì?","options":["Danh từ/Động từ/Tính từ (không cần chủ ngữ)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Danh từ/Động từ/Tính từ (không cần chủ ngữ)","explanation":"Câu phi chủ vị là loại câu ngắn gọn không có chủ ngữ rõ ràng. Người ta thường dùng loại câu này để mô tả các hiện tượng tự nhiên như 「下雨了」(Trời mưa rồi) hoặc dùng trong các lời chào hỏi, cảm thán như 「你好」(Xin chào)."},{"question":"Ví dụ nào minh họa “Câu phi chủ vị”?","options":["下雨了。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"下雨了。","explanation":"下雨了。 — Mưa rồi."},{"question":"“下雨了。” có nghĩa tiếng Việt nào?","options":["Mưa rồi.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Mưa rồi.","explanation":"xià yǔ le — Mưa rồi."},{"question":"Cấu trúc “Danh từ/Động từ/Tính từ (không cần chủ ngữ)” thuộc điểm ngữ pháp nào?","options":["Câu phi chủ vị","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu phi chủ vị","explanation":"Câu phi chủ vị là loại câu ngắn gọn không có chủ ngữ rõ ràng. Người ta thường dùng loại câu này để mô tả các hiện tượng tự nhiên như 「下雨了」(Trời mưa rồi) hoặc dùng trong các lời chào hỏi, cảm thán như 「你好」(Xin chào)."},{"question":"Câu “下雨了。” minh họa điểm ngữ pháp nào?","options":["Câu phi chủ vị","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu phi chủ vị","explanation":"Đừng cố gắng thêm chủ ngữ vào các câu cảm thán hoặc câu miêu tả hiện tượng tự nhiên vì sẽ làm câu trở nên gượng gạo."}]},{"name":"Trợ từ ngữ khí 了 (lè)","formula":"Câu + 了","explanation":"Trợ từ 「了」 đặt cuối câu để biểu thị một tình huống đã thay đổi hoặc một trạng thái mới vừa xuất hiện. Nó cũng dùng để nhấn mạnh một hành động đã xảy ra hoặc đã hoàn thành.","tip":"Hãy tưởng tượng 「了」 như một dấu hiệu cho thấy tình hình hiện tại đã khác so với trước đây.","note":"Đừng nhầm lẫn giữa 「了」 biểu thị trạng thái (cuối câu) và 「了」 biểu thị hoàn thành động từ (sau động từ) vì vị trí của chúng khác nhau.","examples":[{"hanzi":"我去上课了。","pinyin":"wǒ qù shàng kè le","meaning":"Tôi đi học đây."},{"hanzi":"下雨了。","pinyin":"xià yǔ le","meaning":"Mưa rồi - tình trạng đã thay đổi."}],"quiz":[{"question":"Công thức đúng của “Trợ từ ngữ khí 了 (lè)” là gì?","options":["Câu + 了","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Câu + 了","explanation":"Trợ từ 「了」 đặt cuối câu để biểu thị một tình huống đã thay đổi hoặc một trạng thái mới vừa xuất hiện. Nó cũng dùng để nhấn mạnh một hành động đã xảy ra hoặc đã hoàn thành."},{"question":"Ví dụ nào minh họa “Trợ từ ngữ khí 了 (lè)”?","options":["我去上课了。","我是学生。","他是中国人。","我的中文老师"],"answer":"我去上课了。","explanation":"我去上课了。 — Tôi đi học đây."},{"question":"“我去上课了。” có nghĩa tiếng Việt nào?","options":["Tôi đi học đây.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi đi học đây.","explanation":"wǒ qù shàng kè le — Tôi đi học đây."},{"question":"Cấu trúc “Câu + 了” thuộc điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 了 (lè)","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Trợ từ ngữ khí 了 (lè)","explanation":"Trợ từ 「了」 đặt cuối câu để biểu thị một tình huống đã thay đổi hoặc một trạng thái mới vừa xuất hiện. Nó cũng dùng để nhấn mạnh một hành động đã xảy ra hoặc đã hoàn thành."},{"question":"Câu “我去上课了。” minh họa điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 了 (lè)","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Trợ từ ngữ khí 了 (lè)","explanation":"Đừng nhầm lẫn giữa 「了」 biểu thị trạng thái (cuối câu) và 「了」 biểu thị hoàn thành động từ (sau động từ) vì vị trí của chúng khác nhau."}]},{"name":"Cấu trúc cảm thán quá mức với 「太...了」","formula":"太 + [tính từ/động từ tâm lý] + 了","explanation":"Cấu trúc này dùng để biểu thị mức độ cao, vượt quá mức bình thường hoặc dùng để cảm thán. Nó mang nghĩa tiếng Việt tương đương với \"quá\", \"lắm\" hoặc \"thật là...\". Ví dụ: 「太好了」(Tài hǎo le - Tốt quá rồi).","tip":"Bạn có thể thêm các từ như 「真」(zhēn - thật) hoặc 「实在」(shízài - thật sự) vào trước 「太」 để tăng thêm sắc thái biểu cảm mạnh mẽ hơn.","note":"Trong câu khẳng định với 「太...了」, nhất định phải có trợ từ ngữ khí 「了」 ở cuối câu thì mới hoàn chỉnh.","examples":[{"hanzi":"太冷了！","pinyin":"tài lěng le","meaning":"Lạnh quá!"},{"hanzi":"这个杯子太小了。","pinyin":"zhè gè bēi zi tài xiǎo le","meaning":"Cái ly này nhỏ quá."}],"quiz":[{"question":"Công thức đúng của “Cấu trúc cảm thán quá mức với 「太...了」” là gì?","options":["太 + [tính từ/động từ tâm lý] + 了","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"太 + [tính từ/động từ tâm lý] + 了","explanation":"Cấu trúc này dùng để biểu thị mức độ cao, vượt quá mức bình thường hoặc dùng để cảm thán. Nó mang nghĩa tiếng Việt tương đương với \"quá\", \"lắm\" hoặc \"thật là...\". Ví dụ: 「太好了」(Tài hǎo le - Tốt quá rồi)."},{"question":"Ví dụ nào minh họa “Cấu trúc cảm thán quá mức với 「太...了」”?","options":["太冷了！","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"太冷了！","explanation":"太冷了！ — Lạnh quá!"},{"question":"“太冷了！” có nghĩa tiếng Việt nào?","options":["Lạnh quá!","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Lạnh quá!","explanation":"tài lěng le — Lạnh quá!"},{"question":"Cấu trúc “太 + [tính từ/động từ tâm lý] + 了” thuộc điểm ngữ pháp nào?","options":["Cấu trúc cảm thán quá mức với 「太...了」","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Cấu trúc cảm thán quá mức với 「太...了」","explanation":"Cấu trúc này dùng để biểu thị mức độ cao, vượt quá mức bình thường hoặc dùng để cảm thán. Nó mang nghĩa tiếng Việt tương đương với \"quá\", \"lắm\" hoặc \"thật là...\". Ví dụ: 「太好了」(Tài hǎo le - Tốt quá rồi)."},{"question":"Câu “太冷了！” minh họa điểm ngữ pháp nào?","options":["Cấu trúc cảm thán quá mức với 「太...了」","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Cấu trúc cảm thán quá mức với 「太...了」","explanation":"Trong câu khẳng định với 「太...了」, nhất định phải có trợ từ ngữ khí 「了」 ở cuối câu thì mới hoàn chỉnh."}]}],"13":[{"name":"Động từ năng nguyện 可以","formula":"Chủ ngữ + 可以 + Động từ + (Tân ngữ)","explanation":"「可以」 là động từ năng nguyện dùng để biểu thị sự cho phép hoặc khả năng thực hiện hành động nào đó. Nó thường đứng ngay trước động từ chính trong câu để bổ trợ ý nghĩa.","tip":"Khi muốn dùng câu phủ định, bạn chỉ cần thêm 「不」 phía trước, tạo thành 「不可以」 hoặc 「不可以」 có nghĩa là 'không được phép'.","note":"Đừng nhầm lẫn giữa 「可以」 (cho phép/có thể) và 「会」 (biết làm do học tập) hoặc 「能」 (năng lực thể chất/điều kiện khách quan).","examples":[{"hanzi":"我可以吃吗？","pinyin":"wǒ kě yǐ chī ma","meaning":"Tôi có thể ăn không?"},{"hanzi":"你可以看这本书。","pinyin":"nǐ kě yǐ kàn zhè běn shū","meaning":"Bạn có thể xem quyển sách này."}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 可以” là gì?","options":["Chủ ngữ + 可以 + Động từ + (Tân ngữ)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Chủ ngữ + 可以 + Động từ + (Tân ngữ)","explanation":"「可以」 là động từ năng nguyện dùng để biểu thị sự cho phép hoặc khả năng thực hiện hành động nào đó. Nó thường đứng ngay trước động từ chính trong câu để bổ trợ ý nghĩa."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 可以”?","options":["我可以吃吗？","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"我可以吃吗？","explanation":"我可以吃吗？ — Tôi có thể ăn không?"},{"question":"“我可以吃吗？” có nghĩa tiếng Việt nào?","options":["Tôi có thể ăn không?","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Tôi có thể ăn không?","explanation":"wǒ kě yǐ chī ma — Tôi có thể ăn không?"},{"question":"Cấu trúc “Chủ ngữ + 可以 + Động từ + (Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 可以","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Động từ năng nguyện 可以","explanation":"「可以」 là động từ năng nguyện dùng để biểu thị sự cho phép hoặc khả năng thực hiện hành động nào đó. Nó thường đứng ngay trước động từ chính trong câu để bổ trợ ý nghĩa."},{"question":"Câu “我可以吃吗？” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 可以","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Động từ năng nguyện 可以","explanation":"Đừng nhầm lẫn giữa 「可以」 (cho phép/có thể) và 「会」 (biết làm do học tập) hoặc 「能」 (năng lực thể chất/điều kiện khách quan)."}]},{"name":"Động từ + 一下 (hành động ngắn)","formula":"Động từ + 一下 (yíxià)","explanation":"Cấu trúc này dùng để diễn tả hành động diễn ra trong thời gian rất ngắn hoặc mang tính chất thử nghiệm, trải nghiệm. Việc thêm 「一下」 giúp câu nói trở nên nhẹ nhàng, lịch sự và tự nhiên hơn khi đưa ra yêu cầu hoặc đề nghị.","tip":"Bạn có thể dùng cấu trúc này để giảm bớt sự cứng nhắc của câu mệnh lệnh, ví dụ: 「看一下」(xem một chút) thay vì chỉ dùng 「看」(xem).","note":"Không được dùng 「一下」 sau các động từ chỉ trạng thái tâm lý hoặc cảm xúc như 「爱」(yêu), 「喜欢」(thích) hay 「知道」(biết).","examples":[{"hanzi":"看一下","pinyin":"kàn yī xià","meaning":"Xem một chút"},{"hanzi":"你可以打电话问一下。","pinyin":"nǐ kě yǐ dǎ diàn huà wèn yī xià","meaning":"Bạn có thể gọi điện hỏi một chút."}],"quiz":[{"question":"Công thức đúng của “Động từ + 一下 (hành động ngắn)” là gì?","options":["Động từ + 一下 (yíxià)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Động từ + 一下 (yíxià)","explanation":"Cấu trúc này dùng để diễn tả hành động diễn ra trong thời gian rất ngắn hoặc mang tính chất thử nghiệm, trải nghiệm. Việc thêm 「一下」 giúp câu nói trở nên nhẹ nhàng, lịch sự và tự nhiên hơn khi đưa ra yêu cầu hoặc đề nghị."},{"question":"Ví dụ nào minh họa “Động từ + 一下 (hành động ngắn)”?","options":["看一下","我是学生。","他是中国人。","我的中文老师"],"answer":"看一下","explanation":"看一下 — Xem một chút"},{"question":"“看一下” có nghĩa tiếng Việt nào?","options":["Xem một chút","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Xem một chút","explanation":"kàn yī xià — Xem một chút"},{"question":"Cấu trúc “Động từ + 一下 (yíxià)” thuộc điểm ngữ pháp nào?","options":["Động từ + 一下 (hành động ngắn)","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Động từ + 一下 (hành động ngắn)","explanation":"Cấu trúc này dùng để diễn tả hành động diễn ra trong thời gian rất ngắn hoặc mang tính chất thử nghiệm, trải nghiệm. Việc thêm 「一下」 giúp câu nói trở nên nhẹ nhàng, lịch sự và tự nhiên hơn khi đưa ra yêu cầu hoặc đề nghị."},{"question":"Câu “看一下” minh họa điểm ngữ pháp nào?","options":["Động từ + 一下 (hành động ngắn)","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Động từ + 一下 (hành động ngắn)","explanation":"Không được dùng 「一下」 sau các động từ chỉ trạng thái tâm lý hoặc cảm xúc như 「爱」(yêu), 「喜欢」(thích) hay 「知道」(biết)."}]},{"name":"Câu có hai tân ngữ","formula":"Chủ ngữ + Động từ + Tân ngữ gián tiếp (người) + Tân ngữ trực tiếp (vật)","explanation":"Một số động từ đặc biệt như 「给」 (đưa cho) hay 「问」 (hỏi) có thể mang cùng lúc hai tân ngữ. Trong đó, tân ngữ chỉ người thường đứng trước, tân ngữ chỉ vật đứng sau.","tip":"Hãy nhớ quy tắc: người đứng trước, vật đứng sau để không bị nhầm trật tự câu.","note":"Không phải động từ nào cũng dùng được cấu trúc này, chỉ những động từ biểu thị sự trao đổi hoặc cung cấp thông tin mới áp dụng được.","examples":[{"hanzi":"给我一杯水。","pinyin":"gěi wǒ yī bēi shuǐ","meaning":"Cho tôi một ly nước."},{"hanzi":"白家月给安妮一个苹果。","pinyin":"bái jiā yuè gěi ān nī yī gè píng guǒ","meaning":"Bạch Gia Nguyệt cho Annie một quả táo."}],"quiz":[{"question":"Công thức đúng của “Câu có hai tân ngữ” là gì?","options":["Chủ ngữ + Động từ + Tân ngữ gián tiếp (người) + Tân ngữ trực tiếp (vật)","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + Động từ + Tân ngữ gián tiếp (người) + Tân ngữ trực tiếp (vật)","explanation":"Một số động từ đặc biệt như 「给」 (đưa cho) hay 「问」 (hỏi) có thể mang cùng lúc hai tân ngữ. Trong đó, tân ngữ chỉ người thường đứng trước, tân ngữ chỉ vật đứng sau."},{"question":"Ví dụ nào minh họa “Câu có hai tân ngữ”?","options":["给我一杯水。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"给我一杯水。","explanation":"给我一杯水。 — Cho tôi một ly nước."},{"question":"“给我一杯水。” có nghĩa tiếng Việt nào?","options":["Cho tôi một ly nước.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Cho tôi một ly nước.","explanation":"gěi wǒ yī bēi shuǐ — Cho tôi một ly nước."},{"question":"Cấu trúc “Chủ ngữ + Động từ + Tân ngữ gián tiếp (người) + Tân ngữ trực tiếp (vật)” thuộc điểm ngữ pháp nào?","options":["Câu có hai tân ngữ","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Câu có hai tân ngữ","explanation":"Một số động từ đặc biệt như 「给」 (đưa cho) hay 「问」 (hỏi) có thể mang cùng lúc hai tân ngữ. Trong đó, tân ngữ chỉ người thường đứng trước, tân ngữ chỉ vật đứng sau."},{"question":"Câu “给我一杯水。” minh họa điểm ngữ pháp nào?","options":["Câu có hai tân ngữ","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Câu có hai tân ngữ","explanation":"Không phải động từ nào cũng dùng được cấu trúc này, chỉ những động từ biểu thị sự trao đổi hoặc cung cấp thông tin mới áp dụng được."}]}],"14":[{"name":"Trợ từ động thái 「了」 biểu thị hoàn thành","formula":"Động từ + 了 + (tân ngữ)","explanation":"Trợ từ động thái 「了」 được đặt ngay sau động từ để nhấn mạnh rằng hành động đó đã hoàn thành hoặc đã xảy ra. Khi dùng cấu trúc này, câu thường mang ý nghĩa khẳng định về việc một việc gì đó đã được thực hiện xong.","tip":"Khi động từ có tân ngữ kèm số lượng cụ thể (读了一本书), thường dùng 「了」 để nói hành động đã hoàn tất. Không dùng 「了」 cho thói quen lặp lại hoặc việc chưa xảy ra (我每天看一本书).","note":"Khi muốn nói phủ định, bạn không được dùng 「了」 mà phải bỏ nó đi và thay bằng 「没 (有)」 trước động từ.","examples":[{"hanzi":"我昨天读了一本书。","pinyin":"wǒ zuó tiān dú le yī běn shū","meaning":"Hôm qua tôi đã đọc một quyển sách."},{"hanzi":"我看了一个电影。","pinyin":"wǒ kàn le yī gè diàn yǐng","meaning":"Tôi đã xem một bộ phim."}],"quiz":[{"question":"Công thức đúng của “Trợ từ động thái 「了」 biểu thị hoàn thành” là gì?","options":["Động từ + 了 + (tân ngữ)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Động từ + 了 + (tân ngữ)","explanation":"Trợ từ động thái 「了」 được đặt ngay sau động từ để nhấn mạnh rằng hành động đó đã hoàn thành hoặc đã xảy ra. Khi dùng cấu trúc này, câu thường mang ý nghĩa khẳng định về việc một việc gì đó đã được thực hiện xong."},{"question":"Ví dụ nào minh họa “Trợ từ động thái 「了」 biểu thị hoàn thành”?","options":["我昨天读了一本书。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"我昨天读了一本书。","explanation":"我昨天读了一本书。 — Hôm qua tôi đã đọc một quyển sách."},{"question":"“我昨天读了一本书。” có nghĩa tiếng Việt nào?","options":["Hôm qua tôi đã đọc một quyển sách.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Hôm qua tôi đã đọc một quyển sách.","explanation":"wǒ zuó tiān dú le yī běn shū — Hôm qua tôi đã đọc một quyển sách."},{"question":"Cấu trúc “Động từ + 了 + (tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Trợ từ động thái 「了」 biểu thị hoàn thành","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Trợ từ động thái 「了」 biểu thị hoàn thành","explanation":"Trợ từ động thái 「了」 được đặt ngay sau động từ để nhấn mạnh rằng hành động đó đã hoàn thành hoặc đã xảy ra. Khi dùng cấu trúc này, câu thường mang ý nghĩa khẳng định về việc một việc gì đó đã được thực hiện xong."},{"question":"Câu “我昨天读了一本书。” minh họa điểm ngữ pháp nào?","options":["Trợ từ động thái 「了」 biểu thị hoàn thành","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Trợ từ động thái 「了」 biểu thị hoàn thành","explanation":"Khi muốn nói phủ định, bạn không được dùng 「了」 mà phải bỏ nó đi và thay bằng 「没 (有)」 trước động từ."}]},{"name":"Động từ ly hợp (Separable Verbs)","formula":"Động từ (A) + Thành phần chèn vào + Tân ngữ (B)","explanation":"Trong tiếng Trung, một số động từ có cấu trúc 「Động từ + Tân ngữ」. Khi muốn thêm các thành phần như bổ ngữ thời lượng, số lượng hoặc trạng từ, ta có thể tách hai phần này ra để chèn vào giữa.","tip":"Ví dụ: với 「睡觉」, bạn có thể nói 「睡了一个小时觉」 (ngủ một tiếng đồng hồ).","note":"Không được đặt bổ ngữ hoặc tân ngữ trực tiếp sau toàn bộ cụm từ ly hợp mà phải tách chúng ra.","examples":[{"hanzi":"我睡了一个小时觉。","pinyin":"wǒ shuì le yī gè xiǎo shí jiào","meaning":"Tôi đã ngủ một tiếng đồng hồ."},{"hanzi":"我们见过一次面。","pinyin":"wǒ men jiàn guò yī cì miàn","meaning":"Chúng tôi đã gặp nhau một lần."}],"quiz":[{"question":"Công thức đúng của “Động từ ly hợp (Separable Verbs)” là gì?","options":["Động từ (A) + Thành phần chèn vào + Tân ngữ (B)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Động từ (A) + Thành phần chèn vào + Tân ngữ (B)","explanation":"Trong tiếng Trung, một số động từ có cấu trúc 「Động từ + Tân ngữ」. Khi muốn thêm các thành phần như bổ ngữ thời lượng, số lượng hoặc trạng từ, ta có thể tách hai phần này ra để chèn vào giữa."},{"question":"Ví dụ nào minh họa “Động từ ly hợp (Separable Verbs)”?","options":["我睡了一个小时觉。","我是学生。","他是中国人。","我的中文老师"],"answer":"我睡了一个小时觉。","explanation":"我睡了一个小时觉。 — Tôi đã ngủ một tiếng đồng hồ."},{"question":"“我睡了一个小时觉。” có nghĩa tiếng Việt nào?","options":["Tôi đã ngủ một tiếng đồng hồ.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi đã ngủ một tiếng đồng hồ.","explanation":"wǒ shuì le yī gè xiǎo shí jiào — Tôi đã ngủ một tiếng đồng hồ."},{"question":"Cấu trúc “Động từ (A) + Thành phần chèn vào + Tân ngữ (B)” thuộc điểm ngữ pháp nào?","options":["Động từ ly hợp (Separable Verbs)","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Động từ ly hợp (Separable Verbs)","explanation":"Trong tiếng Trung, một số động từ có cấu trúc 「Động từ + Tân ngữ」. Khi muốn thêm các thành phần như bổ ngữ thời lượng, số lượng hoặc trạng từ, ta có thể tách hai phần này ra để chèn vào giữa."},{"question":"Câu “我睡了一个小时觉。” minh họa điểm ngữ pháp nào?","options":["Động từ ly hợp (Separable Verbs)","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Động từ ly hợp (Separable Verbs)","explanation":"Không được đặt bổ ngữ hoặc tân ngữ trực tiếp sau toàn bộ cụm từ ly hợp mà phải tách chúng ra."}]},{"name":"Phó từ chỉ phạm vi 都 (đều)","formula":"Chủ ngữ + 都 + Động từ/Tính từ","explanation":"Phó từ 「都」 dùng để nhấn mạnh tất cả các đối tượng trong một phạm vi đều có chung đặc điểm hoặc hành động. Bạn cần đặt 「都」 ngay trước động từ hoặc tính từ trong câu.","tip":"Cấu trúc 「每 + lượng từ + 都」 rất phổ biến để nhấn mạnh tính trọn vẹn, ví dụ 「每天都」 (ngày nào cũng).","note":"Khi phủ định, hãy đặt 「不」 trước 「都」 (không phải cái nào cũng...) hoặc sau 「都」 (cái nào cũng không...).","examples":[{"hanzi":"我们都来了。","pinyin":"wǒ men dōu lái le","meaning":"Chúng tôi đều đến rồi."},{"hanzi":"我和姐姐都喜欢喝茶。","pinyin":"wǒ hé jiě jie dōu xǐ huan hē chá","meaning":"Tôi và chị gái đều thích uống trà."}],"quiz":[{"question":"Công thức đúng của “Phó từ chỉ phạm vi 都 (đều)” là gì?","options":["Chủ ngữ + 都 + Động từ/Tính từ","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 都 + Động từ/Tính từ","explanation":"Phó từ 「都」 dùng để nhấn mạnh tất cả các đối tượng trong một phạm vi đều có chung đặc điểm hoặc hành động. Bạn cần đặt 「都」 ngay trước động từ hoặc tính từ trong câu."},{"question":"Ví dụ nào minh họa “Phó từ chỉ phạm vi 都 (đều)”?","options":["我们都来了。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我们都来了。","explanation":"我们都来了。 — Chúng tôi đều đến rồi."},{"question":"“我们都来了。” có nghĩa tiếng Việt nào?","options":["Chúng tôi đều đến rồi.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Chúng tôi đều đến rồi.","explanation":"wǒ men dōu lái le — Chúng tôi đều đến rồi."},{"question":"Cấu trúc “Chủ ngữ + 都 + Động từ/Tính từ” thuộc điểm ngữ pháp nào?","options":["Phó từ chỉ phạm vi 都 (đều)","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Phó từ chỉ phạm vi 都 (đều)","explanation":"Phó từ 「都」 dùng để nhấn mạnh tất cả các đối tượng trong một phạm vi đều có chung đặc điểm hoặc hành động. Bạn cần đặt 「都」 ngay trước động từ hoặc tính từ trong câu."},{"question":"Câu “我们都来了。” minh họa điểm ngữ pháp nào?","options":["Phó từ chỉ phạm vi 都 (đều)","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Phó từ chỉ phạm vi 都 (đều)","explanation":"Khi phủ định, hãy đặt 「不」 trước 「都」 (không phải cái nào cũng...) hoặc sau 「都」 (cái nào cũng không...)."}]}],"15":[{"name":"Câu phức song song với 还/也","formula":"S1 + V1 + O1, (S1) + 还/也 + V2 + O2","explanation":"Cấu trúc này dùng để diễn tả việc một người hoặc vật đồng thời có hai trạng thái hoặc thực hiện hai hành động cùng lúc. Từ 「还」 hoặc 「也」 đóng vai trò nhấn mạnh sự bổ sung thêm tính chất hoặc hành động mới.","tip":"Bạn có thể bỏ chủ ngữ ở vế thứ hai nếu chủ ngữ của cả hai vế giống nhau để câu văn tự nhiên hơn.","note":"Cần lưu ý 「还/也」 phải đặt trước động từ của vế câu thứ hai, không được đặt trước chủ ngữ.","examples":[{"hanzi":"我喜欢看书，也喜欢看电影。","pinyin":"wǒ xǐ huān kàn shū yě xǐ huān kàn diàn yǐng","meaning":"Tôi thích đọc sách, cũng thích xem phim."},{"hanzi":"王老师是北京人，李文也是北京人。","pinyin":"wáng lǎo shī shì běi jīng rén lǐ wén yě shì běi jīng rén","meaning":"Thầy Vương là người Bắc Kinh, Lý Văn cũng là người Bắc Kinh."}],"quiz":[{"question":"Công thức đúng của “Câu phức song song với 还/也” là gì?","options":["S1 + V1 + O1, (S1) + 还/也 + V2 + O2","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"S1 + V1 + O1, (S1) + 还/也 + V2 + O2","explanation":"Cấu trúc này dùng để diễn tả việc một người hoặc vật đồng thời có hai trạng thái hoặc thực hiện hai hành động cùng lúc. Từ 「还」 hoặc 「也」 đóng vai trò nhấn mạnh sự bổ sung thêm tính chất hoặc hành động mới."},{"question":"Ví dụ nào minh họa “Câu phức song song với 还/也”?","options":["我喜欢看书，也喜欢看电影。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"我喜欢看书，也喜欢看电影。","explanation":"我喜欢看书，也喜欢看电影。 — Tôi thích đọc sách, cũng thích xem phim."},{"question":"“我喜欢看书，也喜欢看电影。” có nghĩa tiếng Việt nào?","options":["Tôi thích đọc sách, cũng thích xem phim.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Tôi thích đọc sách, cũng thích xem phim.","explanation":"wǒ xǐ huān kàn shū yě xǐ huān kàn diàn yǐng — Tôi thích đọc sách, cũng thích xem phim."},{"question":"Cấu trúc “S1 + V1 + O1, (S1) + 还/也 + V2 + O2” thuộc điểm ngữ pháp nào?","options":["Câu phức song song với 还/也","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu phức song song với 还/也","explanation":"Cấu trúc này dùng để diễn tả việc một người hoặc vật đồng thời có hai trạng thái hoặc thực hiện hai hành động cùng lúc. Từ 「还」 hoặc 「也」 đóng vai trò nhấn mạnh sự bổ sung thêm tính chất hoặc hành động mới."},{"question":"Câu “我喜欢看书，也喜欢看电影。” minh họa điểm ngữ pháp nào?","options":["Câu phức song song với 还/也","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu phức song song với 还/也","explanation":"Cần lưu ý 「还/也」 phải đặt trước động từ của vế câu thứ hai, không được đặt trước chủ ngữ."}]}]};
function hskGrammarItems(){return HSK_GRAMMAR_UPDATED[lesson?.id]||[]}
renderGrammar=function(){const a=hskGrammarItems();document.querySelector('#content').innerHTML=a.length?`<h2>Ngữ pháp giáo trình · ${a.length} điểm</h2><p class="muted">Nội dung cập nhật từ tài liệu HSK 1 VERSION 3.0.</p>${a.map((g,i)=>`<article class="hsk-grammar-card"><h3>${i+1}. ${esc(g.name)}</h3><p class="hsk-grammar-field"><b>Công thức:</b> ${esc(g.formula)}</p><p class="hsk-grammar-field"><b>Giải thích:</b> ${esc(g.explanation)}</p><p class="hsk-grammar-field"><b>Mẹo:</b> ${esc(g.tip)}</p><p class="hsk-grammar-field"><b>Lưu ý:</b> ${esc(g.note)}</p><h4>Ví dụ minh họa</h4>${g.examples.map(e=>`<div class="hsk-grammar-example"><div class="hanzi">${esc(e.hanzi)}</div><div>${esc(e.pinyin)}</div><div>${esc(e.meaning)}</div></div>`).join('')}<button class="primary" onclick="hskStartGrammarQuiz(${i})">Luyện 5 câu về ngữ pháp này →</button></article>`).join('')}<button class="primary" onclick="hskStartGrammarQuiz()">Luyện tổng hợp ${a.length*5} câu ngữ pháp</button>`:'<div class="panel">Unit 1 không có điểm ngữ pháp riêng trong tài liệu cập nhật.</div>'};
function hskStartGrammarQuiz(only){const gs=hskGrammarItems();const questions=gs.flatMap((g,i)=>(only===undefined||i===only)?g.quiz.map((q,j)=>({...q,grammar:g.name,id:i+'-'+j})):[]);if(!questions.length)return;window.hskGrammarState={questions,index:0,correct:0,answered:false};hskRenderGrammarQuestion()}
function hskRenderGrammarQuestion(){const st=window.hskGrammarState;if(st.index>=st.questions.length){store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:'grammar-updated',correct:st.correct,total:st.questions.length,autoGraded:true});save();document.querySelector('#app').innerHTML=`<div class="panel"><h2>Hoàn thành luyện ngữ pháp</h2><p class="stat">${st.correct}/${st.questions.length}</p><button onclick="openLesson(${lesson.id},'grammar')">← Về ngữ pháp</button></div>`;return}st.answered=false;const q=st.questions[st.index];const options=shuffle(q.options);st.options=options;document.querySelector('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'grammar')">← Trở về ngữ pháp</button><div class="panel hsk-grammar-quiz"><span class="pill">${esc(q.grammar)} · ${st.index+1}/${st.questions.length}</span><div class="progress"><div style="width:${100*st.index/st.questions.length}%"></div></div><h2 style="font-size:22px;line-height:1.6">${esc(q.question)}</h2>${options.map((v,i)=>`<button class="option" onclick="hskGradeGrammar(${i})">${esc(v)}</button>`).join('')}<div id="hskGrammarFeedback"></div></div>`}

<script id="hsk-review-stats-redesign-js">
(function(){
 const banner=(tag,title,subtitle)=>`<div class="dash-banner"><div><p class="dash-eyebrow">HSK 1 · VERSION 3.0 · ${tag}</p><h1>${title}</h1><p>${subtitle}</p></div><div class="dash-illustration" aria-hidden="true"><svg width="116" height="110" viewBox="0 0 116 110" fill="none"><rect x="18" y="15" width="73" height="80" rx="11" fill="#fff" stroke="#d7a49e" stroke-width="2"/><path d="M54 15v80" stroke="#e9c9c4" stroke-width="2"/><path d="M29 39h15M29 48h15M64 39h15M64 48h15" stroke="#e5a49c" stroke-width="3" stroke-linecap="round"/><path d="M76 77l22-35 9 7-23 35-11 6z" fill="#e5a059" stroke="#c8794b" stroke-width="1.5"/><path d="M73 90l3-13 8 7z" fill="#f6d9b8"/><circle cx="101" cy="20" r="8" fill="#f5d7d3"/><path d="M98 20h6m-3-3v6" stroke="#bd554a" stroke-width="1.5"/></svg></div></div>`;
 window.showReview=function(){
  const app=document.getElementById('app');if(!app)return;
  app.innerHTML=`<div class="dash-shell">${banner('ÔN TẬP','Ôn tập tổng hợp','Chọn các Unit đã học và luyện lại từ vựng bằng chế độ bạn yêu thích.')}
  <section class="dash-section"><div class="dash-section-title"><h2>Chọn bài học</h2><span id="dash-selection-count" style="color:#b64a40;font-weight:700;font-size:13px">15/15 bài</span></div>
  <p class="dash-hint">Bạn có thể chọn một hoặc nhiều bài để tạo bộ câu hỏi ôn tập chung.</p>
  <div class="dash-tools"><button type="button" class="dash-quiet" onclick="dashSelectUnits(true)">Chọn tất cả</button><button type="button" class="dash-quiet" onclick="dashSelectUnits(false)">Bỏ chọn</button></div>
  <div class="dash-unit-grid">${L.map(x=>`<label class="dash-unit"><input type="checkbox" class="lessoncheck" value="${x.id}" checked onchange="dashUpdateCount()"><span><strong>Bài ${x.id}</strong> · ${esc(x.title)}</span></label>`).join('')}</div></section>
  <section class="dash-section"><div class="dash-section-title"><h2>Thiết lập lượt ôn tập</h2></div><p class="dash-hint">Chọn dạng câu hỏi rồi bắt đầu. Tiến độ sẽ tiếp tục được lưu trên thiết bị này.</p><div class="dash-form-row"><div><label class="dash-field-label" for="reviewMode">Chế độ luyện tập</label><select class="dash-select" id="reviewMode">${MODES.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('')}</select></div><button class="dash-action" type="button" onclick="startReview()">Bắt đầu ôn tập →</button></div></section></div>`;
  window.dashUpdateCount();
 };
 window.dashSelectUnits=function(value){document.querySelectorAll('.lessoncheck').forEach(el=>el.checked=value);window.dashUpdateCount()};
 window.dashUpdateCount=function(){const all=document.querySelectorAll('.lessoncheck'),n=document.querySelectorAll('.lessoncheck:checked').length,el=document.getElementById('dash-selection-count');if(el)el.textContent=n+'/'+all.length+' bài'};
 window.showStats=function(){
  const app=document.getElementById('app');if(!app)return;
  const hist=Array.isArray(store.history)?store.history:[],correct=hist.reduce((n,h)=>n+(Number(h.correct)||0),0),total=hist.reduce((n,h)=>n+(Number(h.total)||0),0),pct=total?Math.round(correct/total*100):0;
  const rows=hist.slice(0,25).map(h=>{const date=h.date?new Date(h.date):null;const when=date&&!isNaN(date)?date.toLocaleString('vi-VN'):'Không rõ thời gian';return `<div class="dash-history-row"><div><strong>${h.lesson==null?'Ôn tập':'Bài '+esc(String(h.lesson))} · ${esc(String(h.mode||'Luyện tập'))}</strong><small>${when}</small></div><span class="dash-score">${Number(h.correct)||0}/${Number(h.total)||0}</span></div>`}).join('');
  app.innerHTML=`<div class="dash-shell">${banner('TIẾN ĐỘ','Tiến độ học tập','Theo dõi hành trình học, xem kết quả luyện tập và quản lý dữ liệu của bạn.')}
  <div class="dash-stats-grid"><div class="dash-stat"><span class="dash-stat-number">${known()}</span><span class="dash-stat-label">Từ đã đánh dấu thuộc</span></div><div class="dash-stat"><span class="dash-stat-number">${hist.length}</span><span class="dash-stat-label">Lượt luyện tập đã lưu</span></div><div class="dash-stat"><span class="dash-stat-number">${pct}%</span><span class="dash-stat-label">Tỉ lệ đúng · ${correct}/${total} câu</span></div></div>
  <section class="dash-section"><div class="dash-section-title"><h2>Lịch sử luyện tập gần đây</h2><span style="font-size:13px;color:#7b8493">${Math.min(hist.length,25)} lượt gần nhất</span></div><div class="dash-history">${rows||'<div class="dash-empty">Bạn chưa có lượt luyện tập nào. Hãy bắt đầu học để xem kết quả tại đây.</div>'}</div></section>
  <section class="dash-section"><div class="dash-section-title"><h2>Quản lý tiến độ</h2></div><p class="dash-hint">Xuất bản sao lưu để lưu lại kết quả, hoặc nhập dữ liệu đã lưu trước đó.</p><div class="dash-tools"><button type="button" class="dash-action" onclick="exportProgress()">Xuất tiến độ JSON</button><label class="dash-quiet dash-import">Nhập tiến độ JSON<input type="file" accept="application/json,.json" aria-label="Nhập tiến độ JSON" onchange="importProgress(this.files[0])"></label><button type="button" class="dash-quiet dash-danger" onclick="if(confirm('Xóa toàn bộ tiến độ trên thiết bị này?')){localStorage.removeItem(KEY);location.reload()}">Đặt lại tiến độ</button></div></section></div>`;
 };
})();

<script id="grammar-mastery-app">/* Grammar Mastery is isolated from vocabulary, reading, flashcards and other HSK levels. */
(() => {
'use strict';
const bank=JSON.parse(document.getElementById('grammar-mastery-data').textContent);
const points=new Map(bank.points.map(p=>[p.id,p]));
const questions=new Map(bank.points.flatMap(p=>p.questions).map(q=>[q.id,q]));
const KEY='hsk1-grammar-mastery-v1', DAY=86400000, intervals=[1,3,7];
const levels=['Nhận diện cấu trúc','Sắp xếp câu','Phát hiện và sửa lỗi','Dịch và biến đổi câu','Vận dụng hội thoại'];
const sizes=[3,3,3,5,2];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFKC').replace(/[\s，。！？、,.!?;；:“”"'‘’（）()…—-]/gu,'');
let db,storageWarning='',readOnly=false,run=null;
function fresh(){return {schema:1,records:{},runs:{},history:[]};}
try {const raw=localStorage.getItem(KEY);db=raw?JSON.parse(raw):fresh();if(db.schema!==1||!db.records||!db.runs||!Array.isArray(db.history))throw Error('schema');}
catch {db=fresh();readOnly=true;storageWarning='Không đọc được dữ liệu Grammar Mastery. Dữ liệu cũ được giữ nguyên; lượt này chưa lưu vào thiết bị.';}
function persist(){if(readOnly)return;try{localStorage.setItem(KEY,JSON.stringify(db));}catch{storageWarning='Thiết bị chưa lưu được tiến độ. Bạn vẫn có thể tiếp tục luyện trong lượt này.';}}
function dateText(time){return new Date(time).toLocaleDateString('vi-VN');}
function stats(ids){return ids.reduce((s,id)=>{const r=db.records[id];if(r?.attempts)s.done++;if(r?.lastStatus==='correct')s.correct++;if(r?.lastStatus==='manual-correct')s.manual++;if(r?.lastStatus==='wrong')s.wrong++;if(r?.lastStatus==='pending')s.pending++;return s;},{done:0,correct:0,manual:0,wrong:0,pending:0});}
function due(id){const r=db.records[id];return r?.dueAt&&r.dueAt<=Date.now();}
function pointIds(p,l){return p.questions.filter(q=>!l||q.level===l).map(q=>q.id);}
function prepare(unit){openLesson(Number(unit),'grammar');const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();return accent;}
function shell(title,body,tools=''){
 const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
 const purple=/^#(4d63|7355|9053)/i.test(accent);const color=purple?'#a6533d':accent||'#ba5548';
 document.querySelector('#content').innerHTML=`<section class="gm-shell" style="--gm-accent:${E(color)}"><p class="gm-eyebrow">GRAMMAR MASTERY · 5 CẤP ĐỘ LUYỆN NGỮ PHÁP</p><h2 tabindex="-1" class="gm-title">${E(title)}</h2>${storageWarning?`<p class="gm-warning" role="status">${E(storageWarning)}</p>`:''}${tools}${body}</section>`;
 document.querySelector('.gm-title')?.focus({preventScroll:true});
}
const button=(label,action,attrs='',primary=false)=>`<button type="button" data-gm="${action}" ${attrs} class="${primary?'gm-primary':''}">${E(label)}</button>`;
function reviewTools(unit,point){const ids=[...questions.values()].filter(q=>q.unit===Number(unit)&&(!point||q.point===point)).map(q=>q.id);const wrong=ids.filter(id=>db.records[id]?.dueAt);const ready=wrong.filter(due);return `<div class="gm-tools">${button(`Ôn câu sai đến lịch (${ready.length})`,'review',`data-unit="${unit}" data-point="${point||''}"`)}${button(`Tất cả câu cần ôn (${wrong.length})`,'review-all',`data-unit="${unit}" data-point="${point||''}"`)}</div>`;}
function showPoints(unit=lesson.id){
 prepare(unit);run=null;const list=bank.points.filter(p=>p.unit===Number(unit));
 if(!list.length){shell('Unit này không có ngữ pháp','<p>Không có bài tập ngữ pháp riêng trong dữ liệu nguồn.</p>');return;}
 shell(`Bài ${unit} · ${list.length} điểm · ${list.length*16} câu`,`${reviewTools(unit)}<div class="gm-grid">${list.map(p=>{const s=stats(pointIds(p));return `<article class="gm-card"><h3>${E(p.name)}</h3><p>${s.done}/16 câu đã trả lời · ${s.correct+s.manual} đúng · ${s.pending} chờ đối chiếu</p><div class="progress"><div style="width:${s.done/16*100}%"></div></div>${button('Chọn cấp độ →','levels',`data-point="${p.id}"`,true)}</article>`}).join('')}</div><p class="gm-muted">Tiến độ mới lưu riêng trên thiết bị này. Các kết quả học tập trước đây được giữ nguyên.</p>`);
}
function showLevels(id){const p=points.get(id);if(!p)return;prepare(p.unit);run=null;
 shell(p.name,`<p class="gm-muted">16 câu lưu sẵn · ${E(p.rule)}</p>${reviewTools(p.unit,p.id)}<div class="gm-grid">${levels.map((name,i)=>{const l=i+1,s=stats(pointIds(p,l)),saved=db.runs[`${id}:${l}`];return `<article class="gm-card"><span class="gm-eyebrow">CẤP ${l} · ${sizes[i]} CÂU</span><h3>${E(name)}</h3><p>${s.done}/${sizes[i]} đã trả lời · ${s.correct+s.manual} đúng · ${s.pending} chờ đối chiếu</p>${button(saved&&!saved.completed?'Tiếp tục lượt đang làm':'Bắt đầu','start',`data-point="${id}" data-level="${l}"`,true)}${saved?button('Làm lại cấp này','restart',`data-point="${id}" data-level="${l}"`):''}</article>`}).join('')}</div>`,button('← Chọn điểm ngữ pháp','points',`data-unit="${p.unit}"`));
}
function start(id,level,restart=false){const p=points.get(id);if(!p)return;prepare(p.unit);const key=`${id}:${level}`;const existing=db.runs[key];
 if(existing&&!existing.completed&&!restart)run=existing;
 else {if(existing&&!existing.completed){db.history.unshift({...existing,abandoned:true});db.history=db.history.slice(0,200);}run={key,unit:p.unit,point:id,level,ids:pointIds(p,level),index:0,answers:{},drafts:{},tiles:{},startedAt:Date.now(),completed:false};db.runs[key]=run;}
 persist();renderQuestion();
}
function review(unit,id,all=false,idsOverride){
 prepare(unit);const reviewKey=`review:${unit}:${id||'all'}:${all?'all':'due'}`;const savedReview=db.runs[reviewKey];if(!idsOverride&&savedReview&&!savedReview.completed){run=savedReview;renderQuestion();return;}const ids=idsOverride||[...questions.values()].filter(q=>q.unit===Number(unit)&&(!id||q.point===id)&&db.records[q.id]?.dueAt&&(all||due(q.id))).sort((a,b)=>(db.records[b.id].wrong||0)-(db.records[a.id].wrong||0)||(db.records[a.id].dueAt-db.records[b.id].dueAt)).map(q=>q.id);
 if(!ids.length){shell('Chưa có câu cần ôn trong nhóm này',`<p>${all?'Chưa có câu sai cần ôn.':'Chưa đến lịch ôn. Bạn có thể chọn tất cả câu cần ôn để luyện sớm.'}</p>`,button('← Chọn điểm ngữ pháp','points',`data-unit="${unit}"`));return;}
 const key=reviewKey;run={key,unit:Number(unit),point:id||questions.get(ids[0]).point,level:0,ids:[...ids],index:0,answers:{},drafts:{},tiles:{},startedAt:Date.now(),review:true,completed:false};db.runs[key]=run;persist();renderQuestion();
}
function current(){return run&&questions.get(run.ids[run.index]);}
function hints(q){const items=[...(q.hints||[]),...(q.dialogue||[]).map(t=>({text:t.text,pinyin:t.pinyin,meaning:t.meaning}))];return items.length?`<details class="gm-hints"><summary>Pinyin và nghĩa của câu hỏi</summary>${items.map(t=>`<p class="gm-zh">${E(t.text)}</p><p>${E(t.pinyin)}</p><p>${E(t.meaning)}</p>`).join('')}</details>`:'';}
function renderQuestion(){
 if(!run)return;if(run.index>=run.ids.length){finish();return;}const q=current(),p=points.get(q.point),answer=run.answers[q.id];
 const used=run.tiles[q.id]||[];const tiles=q.tokens||[];
 const controls=q.type==='choice'?`<div class="gm-choices">${q.options.map((o,i)=>`<div class="gm-choice-row">${button(`${'ABCD'[i]}. ${o.text}`,'choice',`data-index="${i}" ${answer?'disabled':''}`)}${/[\u3400-\u9fff]/u.test(o.text)?button('🔊','audio-choice',`data-index="${i}" aria-label="Nghe lựa chọn ${'ABCD'[i]}"`):''}</div>`).join('')}</div>`:q.type==='order'?`<div class="gm-answer-tiles" aria-live="polite">${used.length?used.map((idx,i)=>button(tiles[idx],'remove-tile',`data-index="${i}" ${answer?'disabled':''}`)).join(''):'<span>Chọn các thẻ bên dưới theo thứ tự câu.</span>'}</div><div class="gm-tiles">${q.tileOrder.map(idx=>button(tiles[idx],'tile',`data-index="${idx}" ${answer||used.includes(idx)?'disabled':''}`)).join('')}</div><div class="gm-tools">${button('Hoàn tác','undo',answer?'disabled':'')}${button('Làm lại các thẻ','clear',answer?'disabled':'')}</div>`:`<label class="gm-input-label" for="gm-input">Câu trả lời tiếng Trung</label><textarea id="gm-input" lang="zh-CN" rows="3" autocomplete="off" ${answer?'disabled':''} placeholder="Nhập câu trả lời…">${E(run.drafts[q.id]||'')}</textarea>`;
 const support=q.support?.length?`<details class="gm-support"><summary>Từ hỗ trợ ngoài danh sách Unit đã học (${q.support.length})</summary>${q.support.map(v=>`<p><span lang="zh-CN">${E(v.word)}</span> · ${E(v.pinyin)} — ${E(v.meaning)}</p>`).join('')}</details>`:'';
 shell(p.name,`<article class="gm-card gm-question"><p class="gm-label">${run.review?'Ôn câu sai · ':''}Cấp ${q.level}: ${E(levels[q.level-1])} · Câu ${run.index+1}/${run.ids.length}</p><div class="progress" aria-label="Tiến độ lượt luyện"><div style="width:${run.index/run.ids.length*100}%"></div></div><h3 class="gm-prompt">${E(q.prompt)}</h3>${q.stimulus?`<p class="gm-zh" lang="zh-CN">${E(q.stimulus)}</p>${button('🔊 Nghe câu cần sửa','audio-prompt')}`:''}${q.dialogue?`<div class="gm-dialogue">${q.dialogue.map(t=>`<p><b>${E(t.speaker)}:</b> <span class="gm-zh" lang="zh-CN">${E(t.text)}</span></p>`).join('')}<p><b>B:</b> ______</p>${button('🔊 Nghe hội thoại','audio-prompt')}</div>`:''}${hints(q)}${support}${controls}<p id="gm-validation" class="gm-warning" role="status"></p>${q.type!=='choice'&&!answer?button('Kiểm tra','check','',true):''}<section id="gm-feedback" aria-live="polite">${answer?feedback(q,answer):''}</section></article>`,`<div class="gm-tools">${button('← Chọn cấp độ','levels',`data-point="${q.point}"`)}${!run.review?button('Làm lại cấp này','restart',`data-point="${q.point}" data-level="${q.level}"`):''}</div>`);
 const input=document.getElementById('gm-input');if(input)input.addEventListener('input',()=>{run.drafts[q.id]=input.value;persist()});
}
function record(q,status){const now=Date.now(),old=db.records[q.id]||{unit:q.unit,point:q.point,level:q.level,attempts:0,correct:0,wrong:0,pending:0};const r={...old,attempts:old.attempts+1,lastStatus:status,lastAt:now};
 if(status==='wrong'){r.wrong++;r.stage=0;r.dueAt=now+DAY;}
 if(status==='correct'||status==='manual-correct'){
  if(status==='correct')r.correct++;else r.manual=(r.manual||0)+1;
  if(run.review&&old.dueAt){r.stage=(old.stage||0)+1;r.dueAt=r.stage<3?now+intervals[r.stage]*DAY:null;}
 }
 if(status==='pending')r.pending++;
 db.records[q.id]=r;
}
function submit(value){const q=current();if(!q||run.answers[q.id])return;let response=value;
 if(q.type==='order'){const picked=run.tiles[q.id]||[];if(picked.length!==q.tokens.length){document.getElementById('gm-validation').textContent='Hãy dùng đủ các thẻ trước khi kiểm tra.';return;}response=picked.map(i=>q.tokens[i]).join('');}
 if(response===undefined)response=document.getElementById('gm-input')?.value||'';
 if(!normalize(response)){document.getElementById('gm-validation').textContent='Hãy nhập hoặc chọn câu trả lời trước.';return;}
 const matches=q.accepted.some(a=>normalize(a)===normalize(response));const status=matches?'correct':['write','dialogue','repair'].includes(q.type)?'pending':'wrong';
 run.answers[q.id]={response,status,at:Date.now()};record(q,status);persist();renderQuestion();
}
function resolve(status){const q=current(),a=run?.answers[q?.id];if(!a||a.status!=='pending')return;
 a.status=status;const r=db.records[q.id];r.pending=Math.max(0,r.pending-1);r.lastStatus=status;r.lastAt=Date.now();
 if(status==='wrong'){r.wrong++;r.stage=0;r.dueAt=Date.now()+DAY;}
 else {r.manual=(r.manual||0)+1;if(run.review&&r.dueAt){r.stage=(r.stage||0)+1;r.dueAt=r.stage<3?Date.now()+intervals[r.stage]*DAY:null;}}
 persist();renderQuestion();
}
function feedback(q,a){const pending=a.status==='pending';const title={correct:'✓ Khớp đáp án đã biên soạn','manual-correct':'✓ Bạn đã tự đối chiếu là đúng',wrong:'Cần luyện lại',pending:'Chưa khớp đáp án mẫu — cần đối chiếu'}[a.status];
 return `<div class="gm-feedback ${a.status==='wrong'?'gm-wrong':pending?'gm-pending':''}"><h3>${title}</h3><p>Bạn trả lời: <span lang="zh-CN">${E(a.response)}</span></p><p class="gm-zh" lang="zh-CN">${E(q.answer)}</p><p>${E(q.pinyin)}</p><p>${E(q.meaning)}</p>${q.accepted.length>1?`<p>Đáp án tương đương đã lưu: ${q.accepted.slice(1).map(E).join(' / ')}</p>`:''}<p>${E(q.explanation)}</p>${q.options?`<ul>${q.options.map(o=>`<li><span lang="zh-CN">${E(o.text)}</span> · ${E(o.pinyin)}: ${E(o.why)}</li>`).join('')}</ul>`:''}${button('🔊 Nghe đáp án','audio-answer')}${pending?`<p>Hệ thống chỉ so với đáp án lưu sẵn, không chấm ngữ nghĩa bằng AI. Nếu câu của bạn đúng về nghĩa và cấu trúc, hãy tự đối chiếu; có thể để trạng thái này để xem sau.</p><div class="gm-tools">${button('Tôi đối chiếu: đúng','manual-correct')}${button('Tôi cần ôn lại','manual-wrong')}</div>`:''}</div>${button(run.index+1===run.ids.length?'Xem kết quả':'Tiếp theo →','next','',true)}`;
}
function finish(){if(!run)return;run.completed=true;run.finishedAt=run.finishedAt||Date.now();if(!run.logged){db.history.unshift(JSON.parse(JSON.stringify({...run,logged:true})));db.history=db.history.slice(0,200);run.logged=true;}persist();
 const rows=run.ids.map(id=>({q:questions.get(id),a:run.answers[id]}));const correct=rows.filter(x=>x.a?.status==='correct').length,manual=rows.filter(x=>x.a?.status==='manual-correct').length,wrong=rows.filter(x=>x.a?.status==='wrong'),pending=rows.filter(x=>x.a?.status==='pending');const graded=correct+manual+wrong.length;
 shell('Kết quả lượt luyện',`<article class="gm-card"><p>${rows.length} câu · ${correct} khớp đáp án · ${manual} tự đối chiếu đúng · ${wrong.length} cần ôn · ${pending.length} chờ đối chiếu</p><p class="gm-score">${graded?Math.round((correct+manual)/graded*100)+'%':'Chưa có điểm xác nhận'}</p><p class="gm-muted">Tỉ lệ chỉ tính ${graded} câu đã xác nhận; ${pending.length} câu chờ đối chiếu chưa bị tính sai.</p><div class="gm-tools">${wrong.length?button(`Luyện lại ${wrong.length} câu sai`,'retry-wrong','',true):''}${button('← Chọn điểm ngữ pháp','points',`data-unit="${run.unit}"`)}</div></article>${wrong.length?'<h3>Những câu cần ôn lại</h3>'+wrong.map(({q,a})=>`<article class="gm-card"><p>${E(q.prompt)}</p><p>Bạn trả lời: ${E(a.response)}</p><p class="gm-zh">${E(q.answer)}</p><p>${E(q.pinyin)} — ${E(q.meaning)}</p><p>${E(q.explanation)}</p><p>Đã cần ôn ${db.records[q.id].wrong} lần. Gợi ý ôn: ${dateText(db.records[q.id].dueAt)} · Sau đó cách 3 ngày và 7 ngày nếu trả lời đúng.</p></article>`).join(''):''}${pending.length?'<h3>Các câu chờ tự đối chiếu</h3>'+pending.map(({q,a})=>`<article class="gm-card"><p>${E(q.prompt)}</p><p>Bạn trả lời: ${E(a.response)}</p><p class="gm-zh">${E(q.answer)}</p><p>${E(q.pinyin)} — ${E(q.meaning)}</p><p>${E(q.explanation)}</p><p>Chưa đánh dấu sai; bạn có thể làm lại cấp này để tiếp tục đối chiếu.</p></article>`).join(''):''}`);
}
document.addEventListener('click',event=>{const el=event.target.closest('[data-gm]');if(!el||el.disabled)return;const action=el.dataset.gm,q=current();
 if(action==='points')return showPoints(Number(el.dataset.unit));
 if(action==='levels')return showLevels(el.dataset.point);
 if(action==='start'||action==='restart')return start(el.dataset.point,Number(el.dataset.level),action==='restart');
 if(action==='review'||action==='review-all')return review(el.dataset.unit,el.dataset.point||null,action==='review-all');
 if(action==='retry-wrong'){const ids=run.ids.filter(id=>run.answers[id]?.status==='wrong');return review(run.unit,run.point,true,ids);}
 if(!q)return;
 if(action==='audio-answer')return window.speak(q.answer);
 if(action==='audio-prompt')return window.speak(q.stimulus||q.dialogue?.map(t=>t.text).join('。'));
 if(action==='audio-choice')return window.speak(q.options[Number(el.dataset.index)].text);
 if(action==='choice')return submit(q.options[Number(el.dataset.index)].text);
 if(action==='check')return submit();
 if(action==='manual-correct'||action==='manual-wrong')return resolve(action==='manual-correct'?'manual-correct':'wrong');
 if(action==='next'){if(!run.answers[q.id])return;run.index++;persist();return renderQuestion();}
 if(run.answers[q.id])return;
 const picked=run.tiles[q.id]||(run.tiles[q.id]=[]);
 if(action==='tile'){const idx=Number(el.dataset.index);if(!picked.includes(idx))picked.push(idx);}
 if(action==='remove-tile')picked.splice(Number(el.dataset.index),1);
 if(action==='undo')picked.pop();if(action==='clear')picked.splice(0);
 persist();renderQuestion();
});
// Redirect grammar exercise entry points; leave theory renderers and all other modes intact.
window.hskStartGrammarQuiz=only=>{const p=bank.points.find(p=>p.unit===lesson.id&&p.index===only);return p?showLevels(p.id):showPoints(lesson.id);};
const oldGrammar=window.renderGrammar;
window.renderGrammar=function(){oldGrammar();document.querySelectorAll('#content button[onclick^="hskStartGrammarQuiz"]').forEach(b=>{const match=b.getAttribute('onclick').match(/\((\d+)\)/);b.textContent=match?'Grammar Mastery · 16 câu · 5 cấp độ →':'Grammar Mastery · Chọn điểm ngữ pháp →';});};
const oldGames=window.renderGames;
window.renderGames=function(){oldGames();document.querySelectorAll('#content section').forEach(s=>{if(s.querySelector('h3')?.textContent==='Trắc nghiệm ngữ pháp cập nhật')s.remove();});document.querySelectorAll('#content button[onclick*="startGame(\'grammar\'"]').forEach(b=>b.remove());const list=bank.points.filter(p=>p.unit===lesson.id);if(!list.length)return;const section=document.createElement('section');section.className='gm-game-entry';section.innerHTML=`<h3 class="game-group-title">Grammar Mastery</h3><button type="button" class="game-card" data-gm="points" data-unit="${lesson.id}"><span class="game-icon">✎</span><span><h3>5 cấp độ luyện ngữ pháp</h3><p>${list.length} điểm · ${list.length*16} câu lưu sẵn · Ôn câu sai</p></span></button>`;document.getElementById('content').append(section);};
const oldStart=window.startGame;
window.startGame=function(mode,...args){if(mode==='grammar')return showPoints(lesson.id);return oldStart.call(this,mode,...args);};
window.GrammarMastery={showPoints,showLevels,start,review,normalize,bank};
})();

<style id="hsk1-reading-picker-style">/* Only the HSK 1 reading chooser/result screens use these classes. */

<script id="hsk1-reading-picker-app">/* Independent passage selection; reuse the existing reading and dictionary renderer. */
(() => {
'use strict';
const KEY='hsk1-reading-progress-v1';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db={schema:1,readings:{}},warning='',readOnly=false;
try{const raw=localStorage.getItem(KEY);if(raw){const value=JSON.parse(raw);if(value.schema!==1||!value.readings)throw Error('schema');db=value;}}
catch{readOnly=true;warning='Chưa đọc được tiến độ bài đọc riêng. Dữ liệu cũ được giữ nguyên; lượt này chỉ lưu trong bộ nhớ.';}
function persist(){if(readOnly)return;try{localStorage.setItem(KEY,JSON.stringify(db));}catch{warning='Chưa lưu được vào thiết bị. Bạn vẫn có thể tiếp tục đọc trong lượt này.';}}
const passages=unit=>READ_BANK.filter(p=>p.lesson===Number(unit));
const find=(unit,id)=>passages(unit).find(p=>p.id===id);
const record=p=>{const r=db.readings[p.id];return r&&(r.revision||1)===(p.revision||1)?r:undefined};
function counts(p,r){const answers=p.questions.map((q,i)=>r?.answers?.[q.id||String(i)]).filter(Boolean);return{answered:answers.length,correct:answers.filter(a=>a.correct).length};}
function prepare(unit){document.getElementById('hskWordInfo')?.remove();openLesson(Number(unit),'games');}
function color(){const c=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();return /^#(?:7355|9053)/i.test(c)?'#a6533d':c||'#ba5548';}
const button=(label,action,unit,id='',primary=false)=>`<button type="button" data-reading="${action}" data-unit="${unit}" data-id="${E(id)}" class="${primary?'reading-primary':''}">${E(label)}</button>`;
function menu(unit=lesson.id){
 prepare(unit);const list=passages(unit);const legacy=store.history.some(h=>Number(h.lesson)===Number(unit)&&h.mode==='passages'&&!h.readingId);
 document.getElementById('content').innerHTML=`<section class="reading-picker" style="--reading-accent:${E(color())}">${button('← Trò chơi','games',unit)}${warning?`<p role="status">${E(warning)}</p>`:''}${list.length!==5?`<p role="status">Dữ liệu Unit này có ${list.length} bài đọc; danh sách hiển thị đúng dữ liệu hiện có.</p>`:''}${legacy?'<p class="reading-muted">Lịch sử đọc tổng hợp trước đây vẫn được giữ. Nguồn cũ không lưu kết quả từng bài, nên tiến độ riêng được ghi nhận từ giao diện mới.</p>':''}<div class="reading-picker-grid">${list.map((p,i)=>{const r=record(p),c=counts(p,r);const status=r?.status==='completed'?'Đã hoàn thành':r?'Đang học':'Chưa học';return `<article class="reading-choice"><span class="reading-eyebrow">BÀI ĐỌC ${i+1}</span><h3>${E(p.title?.trim()||`Bài đọc số ${i+1}`)}</h3><p>${p.questions.length} câu hỏi</p><p class="reading-status ${r?.status==='completed'?'reading-completed':''}">${status}</p><p class="reading-muted">${c.answered}/${p.questions.length} câu đã trả lời · ${c.correct} đúng${r?.lastStudiedAt?' · '+new Date(r.lastStudiedAt).toLocaleDateString('vi-VN'):''}</p>${button(r?.status==='completed'?'Xem lại':r?'Tiếp tục học':'Bắt đầu đọc','open',unit,p.id,true)}</article>`}).join('')}</div></section>`;
 window.scrollTo(0,0);
}
function open(unit,id){const p=find(unit,id);if(!p)return;prepare(unit);let r=record(p);if(!r){const prior=db.readings[p.id];if(prior){db.archivedReadings=db.archivedReadings||[];db.archivedReadings.push({...prior,archivedAt:Date.now(),replacedByRevision:p.revision||1});}r={revision:p.revision||1,unitId:p.lesson,readingId:p.id,status:'in-progress',answers:{},index:0,answered:0,correct:0};db.readings[p.id]=r;}r.lastStudiedAt=Date.now();persist();
 session={mode:'passages',independentReading:true,readingId:p.id,unitId:p.lesson,passages:[p],pi:0,qi:r.status==='completed'?0:Math.min(r.index,p.questions.length-1),correct:counts(p,r).correct,answered:false};
 renderPassage();window.scrollTo(0,0);
}
function feedback(){const s=session,p=s?.independentReading&&s.passages[0];if(!p)return;const q=p.questions[s.qi],r=record(p),a=r.answers[q.id||String(s.qi)];if(!a)return;
 s.answered=true;document.querySelectorAll('#app button.option').forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',s.options[i]===q.answer);b.classList.toggle('wrong',!a.correct&&s.options[i]===a.response);});
 const target=document.getElementById('passageFeedback');target.innerHTML=`<div class="result"><strong>${a.correct?'✓ Đúng':'✗ Chưa đúng'}</strong><p>Đáp án: ${E(q.answer)}</p><p>${E(q.explanation)}</p></div><button type="button" class="primary" onclick="nextPassage()">${s.qi+1===p.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`;
}
const oldRender=window.renderPassage,oldGrade=window.gradePassage,oldNext=window.nextPassage;
window.startPassages=()=>menu(lesson.id);
window.renderPassage=function(){const s=session;if(!s?.independentReading)return oldRender();const p=s.passages[0];if(s.qi>=p.questions.length)return results(p.lesson,p.id);
 oldRender();const r=record(p);s.correct=counts(p,r).correct;
 const app=document.getElementById('app'),back=app.querySelector('button');if(back){back.removeAttribute('onclick');back.textContent='← Danh sách bài đọc';back.dataset.reading='menu';back.dataset.unit=String(p.lesson);}
 const badge=app.querySelector('.panel>.pill');if(badge)badge.textContent=`Bài đọc ${passages(p.lesson).findIndex(x=>x.id===p.id)+1}/${passages(p.lesson).length} · Câu ${s.qi+1}/${p.questions.length}`;
 if(s.qi>0){const previous=document.createElement('button');previous.type='button';previous.textContent='← Câu trước';previous.dataset.reading='previous';back?.after(previous);}
 if(warning){const notice=document.createElement('p');notice.textContent=warning;notice.setAttribute('role','status');back?.after(notice);}
 feedback();
};
window.gradePassage=function(index){const s=session;if(!s)return;if(!s.independentReading)return oldGrade(index);if(s.answered)return;const p=s.passages[0],q=p.questions[s.qi],response=s.options[index];if(response===undefined)return;const r=record(p);r.answers[q.id||String(s.qi)]={response,correct:response===q.answer,at:Date.now()};r.index=s.qi;r.lastStudiedAt=Date.now();const c=counts(p,r);Object.assign(r,c);s.correct=c.correct;
 if(response!==q.answer)store.wrong[q.id]=(store.wrong[q.id]||0)+1;
 if(c.answered===p.questions.length){r.status='completed';r.completedAt=r.completedAt||Date.now();if(!r.historyLogged){store.history.unshift({date:new Date().toISOString(),lesson:p.lesson,mode:'passages',readingId:p.id,correct:c.correct,total:p.questions.length,autoGraded:true});r.historyLogged=true;}}
 persist();try{save();}catch{warning='Chưa lưu được lịch sử trên thiết bị. Tiến độ riêng vẫn được giữ nếu localStorage còn khả dụng.';}feedback();
};
window.nextPassage=function(){const s=session;if(!s)return;if(!s.independentReading)return oldNext();if(!s.answered)return;const p=s.passages[0],r=record(p);s.qi++;r.index=Math.min(s.qi,p.questions.length-1);r.lastStudiedAt=Date.now();persist();if(s.qi===p.questions.length)return results(p.lesson,p.id);renderPassage();};
function results(unit,id){const p=find(unit,id);if(!p)return;const r=record(p),c=counts(p,r);prepare(unit);document.getElementById('content').innerHTML=`<section class="reading-picker" style="--reading-accent:${E(color())}">${button('← Danh sách bài đọc','menu',unit)}<article class="reading-choice"><p class="reading-eyebrow">ĐÃ HOÀN THÀNH BÀI ĐỌC</p><h2>${E(p.title||'Bài đọc')}</h2><p>${c.correct}/${p.questions.length} câu đúng · ${Math.round(c.correct/p.questions.length*100)}%</p><div class="reading-actions">${button(`Quay lại danh sách ${passages(unit).length} bài đọc`,'menu',unit,'',true)}${button('Xem lại bài này','open',unit,id)}</div></article></section>`;window.scrollTo(0,0);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-reading]');if(!b||b.disabled)return;const action=b.dataset.reading,unit=Number(b.dataset.unit);if(action==='games')return openLesson(unit,'games');if(action==='menu')return menu(unit||session?.unitId||lesson.id);if(action==='open')return open(unit,b.dataset.id);if(action==='previous'&&session?.independentReading&&session.qi>0){session.qi--;const p=session.passages[0];record(p).index=session.qi;persist();renderPassage();}});
window.HSKReadingPicker={menu,open,key:KEY};
})();
</script>
