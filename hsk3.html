<script>window.HSK_LESSONS=[{"id":1,"title":"我们去机场接你们","words":[{"id":"hsk3-L01-01","hanzi":"以为","pinyin":"yǐwèi","meaning":"tưởng rằng, cứ nghĩ là","example":"我以为你今天不来了。","examplePinyin":"wǒ yǐwèi nǐ jīntiān bù lái le.","translation":"Tôi cứ tưởng hôm nay bạn không đến."},{"id":"hsk3-L01-02","hanzi":"像","pinyin":"xiàng","meaning":"giống, giống như","example":"他长得像爸爸。","examplePinyin":"tā zhǎngde xiàng bàba.","translation":"Anh ấy trông giống bố."},{"id":"hsk3-L01-03","hanzi":"长","pinyin":"cháng","meaning":"dài; lớn lên (cháng)","example":"她的头发很长。","examplePinyin":"tā de tóufa hěn cháng.","translation":"Tóc cô ấy rất dài."},{"id":"hsk3-L01-04","hanzi":"身高","pinyin":"shēngāo","meaning":"chiều cao","example":"你的身高是多少？","examplePinyin":"nǐ de shēngāo shì duō shǎo?","translation":"Chiều cao của bạn là bao nhiêu?"},{"id":"hsk3-L01-05","hanzi":"米","pinyin":"mǐ","meaning":"mét","example":"他身高一米八。","examplePinyin":"tā shēngāo yì mǐ bā.","translation":"Anh ấy cao một mét tám."},{"id":"hsk3-L01-06","hanzi":"瘦","pinyin":"shòu","meaning":"gầy","example":"我哥哥很瘦。","examplePinyin":"wǒ gēge hěn shòu.","translation":"Anh trai tôi rất gầy."},{"id":"hsk3-L01-07","hanzi":"接","pinyin":"jiē","meaning":"đón, tiếp","example":"我去机场接朋友。","examplePinyin":"wǒ qù jīchǎng jiē péngyou.","translation":"Tôi đi sân bay đón bạn."},{"id":"hsk3-L01-08","hanzi":"行李","pinyin":"xíngli","meaning":"hành lý","example":"我的行李很重。","examplePinyin":"wǒ de xíngli hěn zhòng.","translation":"Hành lý của tôi rất nặng."},{"id":"hsk3-L01-09","hanzi":"丢","pinyin":"diū","meaning":"làm mất, đánh rơi","example":"我把手机丢了。","examplePinyin":"wǒ bǎ shǒu jī diū le.","translation":"Tôi làm mất điện thoại rồi."},{"id":"hsk3-L01-10","hanzi":"箱子","pinyin":"xiāngzi","meaning":"va li, cái thùng","example":"这个箱子是我的。","examplePinyin":"zhège xiāngzi shì wǒ de.","translation":"Chiếc va li này là của tôi."},{"id":"hsk3-L01-11","hanzi":"号码","pinyin":"hàomǎ","meaning":"số, số hiệu","example":"你的电话号码是多少？","examplePinyin":"nǐ de diànhuàhàomǎ shì duō shǎo?","translation":"Số điện thoại của bạn là bao nhiêu?"},{"id":"hsk3-L01-12","hanzi":"好像","pinyin":"hǎoxiàng","meaning":"hình như, có vẻ","example":"他好像不在家。","examplePinyin":"tā hǎoxiàng bùzài jiā.","translation":"Hình như anh ấy không ở nhà."},{"id":"hsk3-L01-13","hanzi":"重要","pinyin":"zhòngyào","meaning":"quan trọng","example":"这件事很重要。","examplePinyin":"zhèjiàn shì hěn zhòngyào.","translation":"Chuyện này rất quan trọng."},{"id":"hsk3-L01-14","hanzi":"着急","pinyin":"zháojí","meaning":"sốt ruột, lo lắng","example":"别着急，我们还有时间。","examplePinyin":"bié zháojí, wǒmen háiyǒu shí jiān.","translation":"Đừng sốt ruột, chúng ta vẫn còn thời gian."},{"id":"hsk3-L01-15","hanzi":"护照","pinyin":"hùzhào","meaning":"hộ chiếu","example":"我的护照在包里。","examplePinyin":"wǒ de hùzhào zài bāo lǐ.","translation":"Hộ chiếu của tôi ở trong túi."},{"id":"hsk3-L01-16","hanzi":"服务台","pinyin":"fúwùtái","meaning":"quầy dịch vụ","example":"请去服务台问一问。","examplePinyin":"qǐng qù fúwùtái wèn yī wèn.","translation":"Hãy đến quầy dịch vụ hỏi thử."},{"id":"hsk3-L01-17","hanzi":"应该","pinyin":"yīnggāi","meaning":"nên, cần phải","example":"你应该多休息。","examplePinyin":"nǐ yīnggāi duō xiūxī.","translation":"Bạn nên nghỉ ngơi nhiều hơn."},{"id":"hsk3-L01-18","hanzi":"站","pinyin":"zhàn","meaning":"đứng; trạm","example":"请站在我旁边。","examplePinyin":"qǐng zhàn zài wǒ páng biān.","translation":"Hãy đứng bên cạnh tôi."},{"id":"hsk3-L01-19","hanzi":"中间","pinyin":"zhōngjiān","meaning":"ở giữa","example":"他坐在我们中间。","examplePinyin":"tā zuò zài wǒmen zhōngjiān.","translation":"Anh ấy ngồi giữa chúng tôi."},{"id":"hsk3-L01-20","hanzi":"短","pinyin":"duǎn","meaning":"ngắn","example":"我的头发很短。","examplePinyin":"wǒ de tóufa hěn duǎn.","translation":"Tóc tôi rất ngắn."},{"id":"hsk3-L01-21","hanzi":"头发","pinyin":"tóufa","meaning":"tóc","example":"她的头发很漂亮。","examplePinyin":"tā de tóufa hěn piàoliang.","translation":"Tóc cô ấy rất đẹp."},{"id":"hsk3-L01-22","hanzi":"年轻","pinyin":"niánqīng","meaning":"trẻ tuổi","example":"这位老师很年轻。","examplePinyin":"zhè wèi lǎoshī hěn niánqīng.","translation":"Giáo viên này rất trẻ."},{"id":"hsk3-L01-23","hanzi":"发现","pinyin":"fāxiàn","meaning":"phát hiện, nhận ra","example":"我发现手机不见了。","examplePinyin":"wǒ fāxiàn shǒu jī bùjiàn le.","translation":"Tôi phát hiện điện thoại biến mất rồi."},{"id":"hsk3-L01-24","hanzi":"不见","pinyin":"bùjiàn","meaning":"không thấy, biến mất","example":"我的书不见了。","examplePinyin":"wǒ de shū bùjiàn le.","translation":"Quyển sách của tôi biến mất rồi."},{"id":"hsk3-L01-25","hanzi":"带","pinyin":"dài","meaning":"mang theo, dẫn theo","example":"你带护照了吗？","examplePinyin":"nǐ dài hùzhào le ma?","translation":"Bạn mang hộ chiếu chưa?"},{"id":"hsk3-L01-26","hanzi":"帮助","pinyin":"bāngzhù","meaning":"giúp đỡ","example":"谢谢你的帮助。","examplePinyin":"xiè xiè nǐ de bāngzhù.","translation":"Cảm ơn sự giúp đỡ của bạn."},{"id":"hsk3-L01-27","hanzi":"照片","pinyin":"zhàopiàn","meaning":"ảnh, bức ảnh","example":"这张照片很好看。","examplePinyin":"zhè zhāng zhàopiàn hěnhǎo kàn.","translation":"Bức ảnh này rất đẹp."}],"grammar":[{"name":"Cách dùng 「看上去」/「看起来」","details":["Cấu trúc: S + 看上去/看起来 + (hěn/bù) + Tính từ/Cụm từ","Giải thích: Cấu trúc này dùng để diễn tả ấn tượng hoặc nhận xét về vẻ bề ngoài của người hoặc sự vật. Nó có nghĩa tương đương với \"trông có vẻ\", \"nhìn có vẻ\" trong tiếng Việt.","Mẹo: Bạn có thể dùng 「看起来」 hoặc 「看上去」 thay thế cho nhau mà không làm thay đổi ý nghĩa của câu.","Lưu ý: Cấu trúc này thường dùng để đưa ra nhận xét dựa trên cảm nhận thị giác, không nên dùng để khẳng định một sự thật chắc chắn.","•  他们看上去有点儿像。","tā men kàn shàng qù yǒu diǎn ér xiàng","Họ trông có vẻ hơi giống nhau.","•  这些菜看起来都很好吃。","zhè xiē cài kàn qǐ lái dōu hěn hǎo chī","Những món ăn này trông đều rất ngon.","Ví dụ: 他们看上去有点儿像。","Ví dụ: 这些菜看起来都很好吃。"]},{"name":"Đại từ nghi vấn chỉ đối tượng không xác định","details":["Cấu trúc: Đại từ nghi vấn (谁, 什么, 哪儿, 怎么) + ...","Giải thích: Trong tiếng Trung, các đại từ nghi vấn không chỉ dùng để hỏi mà còn có thể chỉ một đối tượng, địa điểm hoặc cách thức không xác định. Cách dùng này mang nghĩa tương đương với các từ như \"ai đó\", \"cái gì đó\" hoặc \"đâu đó\" trong tiếng Việt.","Mẹo: Hãy chú ý ngữ cảnh của câu để phân biệt giữa câu hỏi nghi vấn và cách dùng chỉ đối tượng không xác định này.","Lưu ý: Cấu trúc này thường xuất hiện trong các câu trần thuật, không mang ngữ điệu hỏi hoặc cuối câu không có dấu hỏi chấm.","•  我好像在哪儿看到过这个箱子。","wǒ hǎo xiàng zài nǎ ér kàn dào guò zhè gè xiāng zi","Tôi hình như đã thấy cái vali này ở đâu đó rồi.","•  你吃点儿什么再走吧。","nǐ chī diǎn ér shén me zài zǒu ba","Bạn ăn chút gì đó rồi hãy đi nhé.","Ví dụ: 我好像在哪儿看到过这个箱子。","Ví dụ: 你吃点儿什么再走吧。"]},{"name":"Sắp xếp nhiều định ngữ trước danh từ","details":["Cấu trúc: Định ngữ 1 + 的 + Định ngữ 2 + 的 + Danh từ","Giải thích: Trong tiếng Trung, bạn có thể dùng nhiều cụm từ để bổ nghĩa cho một danh từ. Nếu các định ngữ dài hoặc mang tính chất khác nhau, chúng ta thường thêm 「的」 sau mỗi định ngữ để làm rõ ý nghĩa. Cấu trúc này giúp miêu tả người hoặc vật một cách chi tiết và cụ thể hơn.","Mẹo: Nếu định ngữ ngắn hoặc gần gũi với danh từ, bạn có thể lược bỏ 「的」 để câu văn tự nhiên hơn.","Lưu ý: Cần chú ý thứ tự: định ngữ biểu thị phạm vi hoặc tính chất chung thường đứng xa danh từ hơn định ngữ biểu thị đặc điểm riêng biệt.","•  李文是那个穿着黑衣服的短头发的年轻人吗？","lǐ wén shì nà gè chuān zhe hēi yī fú de duǎn tóu fā de nián qīng rén ma","Lý Văn có phải là chàng thanh niên tóc ngắn mặc áo đen kia không?","•  昨天和家月一起看电影的两个人是我的朋友。","zuó tiān hé jiā yuè yī qǐ kàn diàn yǐng de liǎng gè rén shì wǒ de péng yǒu","Hai người cùng đi xem phim với Gia Nguyệt hôm qua là bạn của tôi.","Ví dụ: 李文是那个穿着黑衣服的短头发的年轻人吗？","Ví dụ: 昨天和家月一起看电影的两个人是我的朋友。"]}],"extended":[],"structuredGrammar":[{"name":"Cách dùng 「看上去」/「看起来」","formula":"S + 看上去/看起来 + (hěn/bù) + Tính từ/Cụm từ","explanation":"Cấu trúc này dùng để diễn tả ấn tượng hoặc nhận xét về vẻ bề ngoài của người hoặc sự vật. Nó có nghĩa tương đương với \"trông có vẻ\", \"nhìn có vẻ\" trong tiếng Việt.","tip":"Bạn có thể dùng 「看起来」 hoặc 「看上去」 thay thế cho nhau mà không làm thay đổi ý nghĩa của câu.","note":"Cấu trúc này thường dùng để đưa ra nhận xét dựa trên cảm nhận thị giác, không nên dùng để khẳng định một sự thật chắc chắn.","examples":[{"zh":"他们看上去有点儿像。","pinyin":"tā men kàn shàng qù yǒu diǎn ér xiàng","vi":"Họ trông có vẻ hơi giống nhau."},{"zh":"这些菜看起来都很好吃。","pinyin":"zhè xiē cài kàn qǐ lái dōu hěn hǎo chī","vi":"Những món ăn này trông đều rất ngon."}],"newExamples":[]},{"name":"Đại từ nghi vấn chỉ đối tượng không xác định","formula":"Đại từ nghi vấn (谁, 什么, 哪儿, 怎么) + ...","explanation":"Trong tiếng Trung, các đại từ nghi vấn không chỉ dùng để hỏi mà còn có thể chỉ một đối tượng, địa điểm hoặc cách thức không xác định. Cách dùng này mang nghĩa tương đương với các từ như \"ai đó\", \"cái gì đó\" hoặc \"đâu đó\" trong tiếng Việt.","tip":"Hãy chú ý ngữ cảnh của câu để phân biệt giữa câu hỏi nghi vấn và cách dùng chỉ đối tượng không xác định này.","note":"Cấu trúc này thường xuất hiện trong các câu trần thuật, không mang ngữ điệu hỏi hoặc cuối câu không có dấu hỏi chấm.","examples":[{"zh":"我好像在哪儿看到过这个箱子。","pinyin":"wǒ hǎo xiàng zài nǎ ér kàn dào guò zhè gè xiāng zi","vi":"Tôi hình như đã thấy cái vali này ở đâu đó rồi."},{"zh":"你吃点儿什么再走吧。","pinyin":"nǐ chī diǎn ér shén me zài zǒu ba","vi":"Bạn ăn chút gì đó rồi hãy đi nhé."}],"newExamples":[]},{"name":"Sắp xếp nhiều định ngữ trước danh từ","formula":"Định ngữ 1 + 的 + Định ngữ 2 + 的 + Danh từ","explanation":"Trong tiếng Trung, bạn có thể dùng nhiều cụm từ để bổ nghĩa cho một danh từ. Nếu các định ngữ dài hoặc mang tính chất khác nhau, chúng ta thường thêm 「的」 sau mỗi định ngữ để làm rõ ý nghĩa. Cấu trúc này giúp miêu tả người hoặc vật một cách chi tiết và cụ thể hơn.","tip":"Nếu định ngữ ngắn hoặc gần gũi với danh từ, bạn có thể lược bỏ 「的」 để câu văn tự nhiên hơn.","note":"Cần chú ý thứ tự: định ngữ biểu thị phạm vi hoặc tính chất chung thường đứng xa danh từ hơn định ngữ biểu thị đặc điểm riêng biệt.","examples":[{"zh":"李文是那个穿着黑衣服的短头发的年轻人吗？","pinyin":"lǐ wén shì nà gè chuān zhe hēi yī fú de duǎn tóu fā de nián qīng rén ma","vi":"Lý Văn có phải là chàng thanh niên tóc ngắn mặc áo đen kia không?"},{"zh":"昨天和家月一起看电影的两个人是我的朋友。","pinyin":"zuó tiān hé jiā yuè yī qǐ kàn diàn yǐng de liǎng gè rén shì wǒ de péng yǒu","vi":"Hai người cùng đi xem phim với Gia Nguyệt hôm qua là bạn của tôi."}],"newExamples":[]}],"subtitle":"Chúng tôi ra sân bay đón các bạn"},{"id":2,"title":"你们想吃什么就点什么","words":[{"id":"hsk3-L02-01","hanzi":"菜单","pinyin":"càidān","meaning":"thực đơn","example":"请给我看看菜单。","examplePinyin":"qǐng gěi wǒ kàn kàn càidān.","translation":"Cho tôi xem thực đơn nhé."},{"id":"hsk3-L02-02","hanzi":"又","pinyin":"yòu","meaning":"lại; vừa... vừa...","example":"他又来了。","examplePinyin":"tā yòu lái le.","translation":"Anh ấy lại đến rồi."},{"id":"hsk3-L02-03","hanzi":"饿","pinyin":"è","meaning":"đói","example":"我现在很饿。","examplePinyin":"wǒ xiànzài hěn è.","translation":"Bây giờ tôi rất đói."},{"id":"hsk3-L02-04","hanzi":"渴","pinyin":"kě","meaning":"khát","example":"我有点儿渴。","examplePinyin":"wǒ yǒu diǎn ér kě.","translation":"Tôi hơi khát."},{"id":"hsk3-L02-05","hanzi":"客气","pinyin":"kèqì","meaning":"khách sáo, lịch sự","example":"不用客气。","examplePinyin":"búyòng kèqì.","translation":"Đừng khách sáo."},{"id":"hsk3-L02-06","hanzi":"饮料","pinyin":"yǐnliào","meaning":"đồ uống","example":"你想喝什么饮料？","examplePinyin":"nǐ xiǎng hē shénme yǐnliào?","translation":"Bạn muốn uống đồ uống gì?"},{"id":"hsk3-L02-07","hanzi":"好久","pinyin":"hǎojiǔ","meaning":"rất lâu","example":"好久不见！","examplePinyin":"hǎojiǔ bùjiàn!","translation":"Lâu rồi không gặp!"},{"id":"hsk3-L02-08","hanzi":"服务","pinyin":"fúwù","meaning":"phục vụ, dịch vụ","example":"这里的服务很好。","examplePinyin":"zhèlǐ de fúwù hěnhǎo.","translation":"Dịch vụ ở đây rất tốt."},{"id":"hsk3-L02-09","hanzi":"员","pinyin":"yuán","meaning":"nhân viên (thành tố)","example":"他是一名服务员。","examplePinyin":"tā shì yī míng fúwùyuán.","translation":"Anh ấy là một nhân viên phục vụ."},{"id":"hsk3-L02-10","hanzi":"双","pinyin":"shuāng","meaning":"đôi, cặp (lượng từ)","example":"我买了一双鞋。","examplePinyin":"wǒ mǎi le yì shuāng xié.","translation":"Tôi mua một đôi giày."},{"id":"hsk3-L02-11","hanzi":"筷子","pinyin":"kuàizi","meaning":"đũa","example":"我会用筷子吃饭。","examplePinyin":"wǒ huì yòng kuàizi chīfàn.","translation":"Tôi biết dùng đũa ăn cơm."},{"id":"hsk3-L02-12","hanzi":"勺子","pinyin":"sháozi","meaning":"thìa, muỗng","example":"请给我一个勺子。","examplePinyin":"qǐng gěi wǒ yí ge sháozi.","translation":"Cho tôi một cái thìa."},{"id":"hsk3-L02-13","hanzi":"碗","pinyin":"wǎn","meaning":"bát, tô","example":"我想吃一碗面。","examplePinyin":"wǒ xiǎng chī yì wǎn miàn.","translation":"Tôi muốn ăn một bát mì."},{"id":"hsk3-L02-14","hanzi":"马上","pinyin":"mǎshàng","meaning":"ngay lập tức","example":"我马上回来。","examplePinyin":"wǒ mǎshàng huílái.","translation":"Tôi sẽ quay lại ngay."},{"id":"hsk3-L02-15","hanzi":"热情","pinyin":"rèqíng","meaning":"nhiệt tình, thân thiện","example":"这家饭馆的服务员很热情。","examplePinyin":"zhè jiā fàn guǎn de fúwùyuán hěnrè qíng.","translation":"Nhân viên của nhà hàng này rất nhiệt tình."},{"id":"hsk3-L02-16","hanzi":"尝","pinyin":"cháng","meaning":"nếm, ăn thử","example":"你尝尝这个菜。","examplePinyin":"nǐ cháng cháng zhège cài.","translation":"Bạn nếm thử món này đi."},{"id":"hsk3-L02-17","hanzi":"记","pinyin":"jì","meaning":"ghi nhớ, ghi chép","example":"请记住我的名字。","examplePinyin":"qǐng jì zhù wǒ de míngzi.","translation":"Hãy nhớ tên tôi."},{"id":"hsk3-L02-18","hanzi":"用","pinyin":"yòng","meaning":"dùng, sử dụng","example":"我用手机学习汉语。","examplePinyin":"wǒ yòng shǒu jī xuéxí Hànyǔ.","translation":"Tôi dùng điện thoại học tiếng Trung."},{"id":"hsk3-L02-19","hanzi":"鸡","pinyin":"jī","meaning":"gà","example":"我喜欢吃鸡肉。","examplePinyin":"wǒ xǐhuān chī jī ròu.","translation":"Tôi thích ăn thịt gà."},{"id":"hsk3-L02-20","hanzi":"张","pinyin":"zhāng","meaning":"tấm, tờ (lượng từ)","example":"我有两张票。","examplePinyin":"wǒ yǒu liǎng zhāng piào.","translation":"Tôi có hai tấm vé."},{"id":"hsk3-L02-21","hanzi":"不用","pinyin":"búyòng","meaning":"không cần","example":"你不用等我。","examplePinyin":"nǐ búyòng děng wǒ.","translation":"Bạn không cần đợi tôi."},{"id":"hsk3-L02-22","hanzi":"选","pinyin":"xuǎn","meaning":"chọn, lựa chọn","example":"你想选哪个？","examplePinyin":"nǐ xiǎng xuǎn nǎge?","translation":"Bạn muốn chọn cái nào?"},{"id":"hsk3-L02-23","hanzi":"外卖","pinyin":"wàimài","meaning":"đồ ăn giao tận nơi","example":"今天我们点外卖吧。","examplePinyin":"jīntiān wǒmen diǎn wàimài ba.","translation":"Hôm nay chúng ta gọi đồ ăn giao tận nơi nhé."},{"id":"hsk3-L02-24","hanzi":"方便","pinyin":"fāngbiàn","meaning":"thuận tiện","example":"坐地铁很方便。","examplePinyin":"zuò de tiě hěn fāngbiàn.","translation":"Đi tàu điện ngầm rất thuận tiện."},{"id":"hsk3-L02-25","hanzi":"蛋糕","pinyin":"dàngāo","meaning":"bánh ngọt, bánh kem","example":"今天是妈妈的生日，我买了蛋糕。","examplePinyin":"jīntiān shì māma de shēng rì, wǒ mǎi le dàngāo.","translation":"Hôm nay là sinh nhật mẹ, tôi đã mua bánh kem."},{"id":"hsk3-L02-26","hanzi":"只","pinyin":"zhī","meaning":"chỉ; con (lượng từ, zhī)","example":"这里有一只猫。","examplePinyin":"zhèlǐ yǒu yì zhī māo.","translation":"Ở đây có một con mèo."},{"id":"hsk3-L02-27","hanzi":"方便面","pinyin":"fāngbiànmiàn","meaning":"mì ăn liền","example":"我不想天天吃方便面。","examplePinyin":"wǒ bùxiǎng tiān tiān chī fāngbiànmiàn.","translation":"Tôi không muốn ngày nào cũng ăn mì ăn liền."},{"id":"hsk3-L02-28","hanzi":"简单","pinyin":"jiǎndān","meaning":"đơn giản, dễ","example":"这个问题很简单。","examplePinyin":"zhège wèntí hěn jiǎndān.","translation":"Câu hỏi này rất đơn giản."}],"grammar":[{"name":"Cấu trúc vừa... vừa... (又...又...)","details":["Cấu trúc: 又 + tính từ + 又 + tính từ","Giải thích: Cấu trúc 「又...又...」 được dùng để liệt kê hai đặc điểm, tính chất hoặc trạng thái cùng tồn tại ở một sự vật, hiện tượng. Trong tiếng Việt, nó tương đương với cấu trúc \"vừa... vừa...\" để mô tả song song các tính chất.","Mẹo: Các tính từ được sử dụng trong cấu trúc này thường phải cùng hướng tích cực hoặc cùng hướng tiêu cực (ví dụ: vừa đẹp vừa tốt, hoặc vừa đắt vừa khó).","Lưu ý: Cấu trúc này chủ yếu dùng để liệt kê tính từ; nếu muốn diễn tả hai hành động diễn ra cùng lúc, bạn nên sử dụng cấu trúc 「一边...一边...」.","•  我现在还真是又饿又渴。","wǒ xiàn zài hái zhēn shì yòu è yòu kě","Bây giờ tôi thực sự vừa đói vừa khát.","•  那个女孩儿又高又漂亮。","nà gè nǚ hái ér yòu gāo yòu piào liàng","Cô gái kia vừa cao vừa xinh đẹp.","Ví dụ: 我现在还真是又饿又渴。","Ví dụ: 那个女孩儿又高又漂亮。"]},{"name":"Đại từ nghi vấn với 都/也 (phủ định bao quát)","details":["Cấu trúc: Đại từ nghi vấn (谁/什么/哪儿...) + 都/也 + (不/没) + Động từ/Tính từ","Giải thích: Cấu trúc này dùng để diễn tả ý nghĩa bao quát như \"bất cứ ai/cái gì/nơi nào... cũng không\". Nó giúp nhấn mạnh việc không có bất kỳ đối tượng nào ngoại lệ trong phạm vi được nhắc đến.","Mẹo: Khi muốn phủ định bao quát, đặt 「不」 hoặc 「没」 ngay sau 「都/也」 (谁也不知道). Với nghĩa khẳng định thường dùng 「都」 (哪个菜都好吃).","Lưu ý: Cẩn thận nhầm lẫn với câu hỏi; khi dùng với 「都/也」, đại từ nghi vấn không còn mang nghĩa hỏi nữa mà là chỉ sự bao quát toàn bộ.","•  哪个菜都好吃。","nǎ gè cài dōu hǎo chī","Món nào cũng đều ngon cả.","•  这次旅游，我去哪儿都可以。","zhè cì lǚ yóu wǒ qù nǎ ér dōu kě yǐ","Chuyến du lịch lần này, tôi đi đâu cũng được.","Ví dụ: 哪个菜都好吃。","Ví dụ: 这次旅游，我去哪儿都可以。"]},{"name":"Đại từ nghi vấn chỉ lựa chọn tùy ý","details":["Cấu trúc: Động từ + gì + thì + (lặp lại) + đấy: [V] + [đại từ nghi vấn] + [V] + [đại từ nghi vấn]","Giải thích: Cấu trúc này dùng để diễn tả việc thực hiện hành động dựa trên mong muốn hoặc lựa chọn tự do của một người. Khi dùng lặp lại đại từ nghi vấn ở hai vế, câu nhấn mạnh rằng bạn có thể lấy bất cứ thứ gì hoặc làm bất cứ điều gì mà mình thích.","Mẹo: Ví dụ: 「你想吃什么就吃什么」 (Bạn muốn ăn gì thì cứ ăn cái đó/ăn tùy ý).","Lưu ý: Đại từ nghi vấn ở hai vế phải giống nhau (ví dụ: cùng là 「什么」 hoặc cùng là 「哪儿」).","•  你们想吃什么就点什么。","nǐ men xiǎng chī shén me jiù diǎn shén me","Các bạn muốn ăn gì thì cứ gọi món đó.","•  你觉得哪个好看就买哪个。","nǐ jué de nǎ gè hǎo kàn jiù mǎi nǎ gè","Bạn thấy cái nào đẹp thì mua cái đó.","Ví dụ: 你们想吃什么就点什么。","Ví dụ: 你觉得哪个好看就买哪个。"]}],"extended":[],"structuredGrammar":[{"name":"Cấu trúc vừa... vừa... (又...又...)","formula":"又 + tính từ + 又 + tính từ","explanation":"Cấu trúc 「又...又...」 được dùng để liệt kê hai đặc điểm, tính chất hoặc trạng thái cùng tồn tại ở một sự vật, hiện tượng. Trong tiếng Việt, nó tương đương với cấu trúc \"vừa... vừa...\" để mô tả song song các tính chất.","tip":"Các tính từ được sử dụng trong cấu trúc này thường phải cùng hướng tích cực hoặc cùng hướng tiêu cực (ví dụ: vừa đẹp vừa tốt, hoặc vừa đắt vừa khó).","note":"Cấu trúc này chủ yếu dùng để liệt kê tính từ; nếu muốn diễn tả hai hành động diễn ra cùng lúc, bạn nên sử dụng cấu trúc 「一边...一边...」.","examples":[{"zh":"我现在还真是又饿又渴。","pinyin":"wǒ xiàn zài hái zhēn shì yòu è yòu kě","vi":"Bây giờ tôi thực sự vừa đói vừa khát."},{"zh":"那个女孩儿又高又漂亮。","pinyin":"nà gè nǚ hái ér yòu gāo yòu piào liàng","vi":"Cô gái kia vừa cao vừa xinh đẹp."}],"newExamples":[]},{"name":"Đại từ nghi vấn với 都/也 (phủ định bao quát)","formula":"Đại từ nghi vấn (谁/什么/哪儿...) + 都/也 + (不/没) + Động từ/Tính từ","explanation":"Cấu trúc này dùng để diễn tả ý nghĩa bao quát như \"bất cứ ai/cái gì/nơi nào... cũng không\". Nó giúp nhấn mạnh việc không có bất kỳ đối tượng nào ngoại lệ trong phạm vi được nhắc đến.","tip":"Khi muốn phủ định bao quát, đặt 「不」 hoặc 「没」 ngay sau 「都/也」 (谁也不知道). Với nghĩa khẳng định thường dùng 「都」 (哪个菜都好吃).","note":"Cẩn thận nhầm lẫn với câu hỏi; khi dùng với 「都/也」, đại từ nghi vấn không còn mang nghĩa hỏi nữa mà là chỉ sự bao quát toàn bộ.","examples":[{"zh":"哪个菜都好吃。","pinyin":"nǎ gè cài dōu hǎo chī","vi":"Món nào cũng đều ngon cả."},{"zh":"这次旅游，我去哪儿都可以。","pinyin":"zhè cì lǚ yóu wǒ qù nǎ ér dōu kě yǐ","vi":"Chuyến du lịch lần này, tôi đi đâu cũng được."}],"newExamples":[]},{"name":"Đại từ nghi vấn chỉ lựa chọn tùy ý","formula":"Động từ + gì + thì + (lặp lại) + đấy: [V] + [đại từ nghi vấn] + [V] + [đại từ nghi vấn]","explanation":"Cấu trúc này dùng để diễn tả việc thực hiện hành động dựa trên mong muốn hoặc lựa chọn tự do của một người. Khi dùng lặp lại đại từ nghi vấn ở hai vế, câu nhấn mạnh rằng bạn có thể lấy bất cứ thứ gì hoặc làm bất cứ điều gì mà mình thích.","tip":"Ví dụ: 「你想吃什么就吃什么」 (Bạn muốn ăn gì thì cứ ăn cái đó/ăn tùy ý).","note":"Đại từ nghi vấn ở hai vế phải giống nhau (ví dụ: cùng là 「什么」 hoặc cùng là 「哪儿」).","examples":[{"zh":"你们想吃什么就点什么。","pinyin":"nǐ men xiǎng chī shén me jiù diǎn shén me","vi":"Các bạn muốn ăn gì thì cứ gọi món đó."},{"zh":"你觉得哪个好看就买哪个。","pinyin":"nǐ jué de nǎ gè hǎo kàn jiù mǎi nǎ gè","vi":"Bạn thấy cái nào đẹp thì mua cái đó."}],"newExamples":[]}],"subtitle":"Các bạn muốn ăn gì thì gọi món đó"},{"id":3,"title":"这个小区挺好的","words":[{"id":"hsk3-L03-01","hanzi":"初中","pinyin":"chūzhōng","meaning":"trung học cơ sở","example":"我弟弟在初中学习。","examplePinyin":"wǒ dìdi zài chūzhōng xuéxí.","translation":"Em trai tôi học ở trường trung học cơ sở."},{"id":"hsk3-L03-02","hanzi":"咱们","pinyin":"zánmen","meaning":"chúng ta (bao gồm người nghe)","example":"咱们一起去吧。","examplePinyin":"zánmen yìqǐ qù ba.","translation":"Chúng ta cùng đi nhé."},{"id":"hsk3-L03-03","hanzi":"换","pinyin":"huàn","meaning":"đổi, thay","example":"我想换一个房间。","examplePinyin":"wǒ xiǎng huàn yí ge fáng jiān.","translation":"Tôi muốn đổi phòng khác."},{"id":"hsk3-L03-04","hanzi":"房子","pinyin":"fángzi","meaning":"nhà, căn nhà","example":"这个房子很大。","examplePinyin":"zhège fángzi hěndà.","translation":"Căn nhà này rất rộng."},{"id":"hsk3-L03-05","hanzi":"小区","pinyin":"xiǎoqū","meaning":"khu dân cư","example":"我住的小区很安静。","examplePinyin":"wǒ zhù de xiǎoqū hěn ānjìng.","translation":"Khu dân cư nơi tôi ở rất yên tĩnh."},{"id":"hsk3-L03-06","hanzi":"环境","pinyin":"huánjìng","meaning":"môi trường, cảnh quan","example":"这里的环境很好。","examplePinyin":"zhèlǐ de huánjìng hěnhǎo.","translation":"Môi trường ở đây rất tốt."},{"id":"hsk3-L03-07","hanzi":"挺","pinyin":"tǐng","meaning":"khá, rất (khẩu ngữ)","example":"这家饭馆挺好的。","examplePinyin":"zhè jiā fàn guǎn tǐng hǎo de.","translation":"Nhà hàng này khá tốt."},{"id":"hsk3-L03-08","hanzi":"空调","pinyin":"kōngdiào","meaning":"máy điều hòa","example":"夏天我常常开空调。","examplePinyin":"xiàtiān wǒ chángcháng kāi kōngdiào.","translation":"Mùa hè tôi thường bật điều hòa."},{"id":"hsk3-L03-09","hanzi":"洗衣机","pinyin":"xǐyījī","meaning":"máy giặt","example":"这台洗衣机是新的。","examplePinyin":"zhè tái xǐyījī shì xīn de.","translation":"Chiếc máy giặt này là đồ mới."},{"id":"hsk3-L03-10","hanzi":"层","pinyin":"céng","meaning":"tầng, lớp","example":"我住在三层。","examplePinyin":"wǒ zhù zài sān céng.","translation":"Tôi sống ở tầng ba."},{"id":"hsk3-L03-11","hanzi":"花园","pinyin":"huāyuán","meaning":"vườn hoa","example":"房子后面有一个花园。","examplePinyin":"fángzi hòu miàn yǒu yí ge huāyuán.","translation":"Phía sau nhà có một vườn hoa."},{"id":"hsk3-L03-12","hanzi":"灯","pinyin":"dēng","meaning":"đèn","example":"请把灯打开。","examplePinyin":"qǐng bǎ dēng dǎ kāi.","translation":"Hãy bật đèn lên."},{"id":"hsk3-L03-13","hanzi":"关","pinyin":"guān","meaning":"đóng, tắt","example":"出门前记得关门。","examplePinyin":"chū mén qián jì děi guān mén.","translation":"Trước khi ra ngoài nhớ đóng cửa."},{"id":"hsk3-L03-14","hanzi":"冰箱","pinyin":"bīngxiāng","meaning":"tủ lạnh","example":"水果在冰箱里。","examplePinyin":"shuǐguǒ zài bīngxiāng lǐ.","translation":"Trái cây ở trong tủ lạnh."},{"id":"hsk3-L03-15","hanzi":"卫生间","pinyin":"wèishēngjiān","meaning":"nhà vệ sinh","example":"请问卫生间在哪儿？","examplePinyin":"qǐng wèn wèishēngjiān zài nǎér?","translation":"Xin hỏi nhà vệ sinh ở đâu?"},{"id":"hsk3-L03-16","hanzi":"打扫","pinyin":"dǎsǎo","meaning":"quét dọn","example":"我周末打扫房间。","examplePinyin":"wǒ zhōumò dǎsǎo fáng jiān.","translation":"Cuối tuần tôi dọn phòng."},{"id":"hsk3-L03-17","hanzi":"搬家","pinyin":"bānjiā","meaning":"chuyển nhà","example":"我们下个月要搬家。","examplePinyin":"wǒmen xià gè yuè yào bānjiā.","translation":"Tháng sau chúng tôi sẽ chuyển nhà."},{"id":"hsk3-L03-18","hanzi":"办","pinyin":"bàn","meaning":"làm, xử lý, đăng ký","example":"我想办一张银行卡。","examplePinyin":"wǒ xiǎng bàn yì zhāng yínxíng kǎ.","translation":"Tôi muốn làm một thẻ ngân hàng."},{"id":"hsk3-L03-19","hanzi":"信用卡","pinyin":"xìnyòngkǎ","meaning":"thẻ tín dụng","example":"他没有信用卡。","examplePinyin":"tā méiyǒu xìnyòngkǎ.","translation":"Anh ấy không có thẻ tín dụng."},{"id":"hsk3-L03-20","hanzi":"还","pinyin":"huán","meaning":"trả lại (huán)","example":"明天我还你这本书。","examplePinyin":"míngtiān wǒ huán nǐ zhè běn shū.","translation":"Ngày mai tôi trả bạn quyển sách này."},{"id":"hsk3-L03-21","hanzi":"听说","pinyin":"tīngshuō","meaning":"nghe nói","example":"我听说你要搬家。","examplePinyin":"wǒ tīngshuō nǐ yào bānjiā.","translation":"Tôi nghe nói bạn sắp chuyển nhà."},{"id":"hsk3-L03-22","hanzi":"银行","pinyin":"yínxíng","meaning":"ngân hàng","example":"银行就在学校旁边。","examplePinyin":"yínxíng jiù zài xuéxiào páng biān.","translation":"Ngân hàng ở ngay cạnh trường."},{"id":"hsk3-L03-23","hanzi":"才","pinyin":"cái","meaning":"mới, chỉ đến lúc đó","example":"他十点才回家。","examplePinyin":"tā shídiǎn cái huíjiā.","translation":"Mãi mười giờ anh ấy mới về nhà."},{"id":"hsk3-L03-24","hanzi":"纸","pinyin":"zhǐ","meaning":"giấy","example":"请给我一张纸。","examplePinyin":"qǐng gěi wǒ yì zhāng zhǐ.","translation":"Cho tôi một tờ giấy."},{"id":"hsk3-L03-25","hanzi":"搬","pinyin":"bān","meaning":"chuyển, bê, dọn","example":"请帮我搬这个箱子。","examplePinyin":"qǐng bāng wǒ bān zhège xiāngzi.","translation":"Hãy giúp tôi chuyển chiếc thùng này."},{"id":"hsk3-L03-26","hanzi":"需要","pinyin":"xūyào","meaning":"cần, cần thiết","example":"我需要你的帮助。","examplePinyin":"wǒ xūyào nǐ de bāngzhù.","translation":"Tôi cần sự giúp đỡ của bạn."}],"grammar":[{"name":"Phó từ chỉ mức độ 挺","details":["Cấu trúc: 挺 + tính từ (tùy chọn: + 的)","Giải thích: Phó từ 「挺」 được dùng trước tính từ để diễn tả mức độ khá cao, tương đương với nghĩa \"khá\" hoặc \"rất\" trong tiếng Việt. Trong giao tiếp, cuối câu thường thêm 「的」 để nhấn mạnh cảm xúc hoặc sắc thái của người nói.","Mẹo: Bạn có thể dùng 「挺……的」 trong văn nói để câu văn nghe tự nhiên và biểu cảm hơn.","Lưu ý: Không dùng 「挺」 trong các câu mang ý nghĩa phủ định hoặc so sánh đối chiếu.","•  这个小区环境挺好的。","zhè gè xiǎo qū huán jìng tǐng hǎo de","Môi trường của khu dân cư này rất tốt.","•  这家饭馆的菜挺好吃的。","zhè jiā fàn guǎn de cài tǐng hǎo chī de","Món ăn của nhà hàng này rất ngon.","Ví dụ: 这个小区环境挺好的。","Ví dụ: 这家饭馆的菜挺好吃的。"]},{"name":"Bổ ngữ chỉ mức độ 坏了","details":["Cấu trúc: Tính từ/Động từ tâm lý + 坏了","Giải thích: Cấu trúc này dùng để nhấn mạnh mức độ cao đến mức quá đà hoặc khó chịu. Bạn có thể hiểu nó tương đương với việc dịch sang tiếng Việt là 'chết mất' hoặc 'hết sức'.","Mẹo: Thường dùng với các từ chỉ cảm xúc như 「累」(mệt), 「饿」(đói) hoặc 「高兴」(vui).","Lưu ý: Không dùng '坏了' cho những tình huống mang nghĩa tích cực một cách trang trọng, nó thường dùng trong văn nói thân mật.","•  我这几天忙坏了。","wǒ zhè jǐ tiān máng huài le","Mấy ngày nay tôi bận đến phát điên.","•  我渴坏了，哪里能买水？","wǒ kě huài le nǎ lǐ néng mǎi shuǐ","Tôi khát khô cả cổ rồi, chỗ nào có thể mua nước nhỉ?","Ví dụ: 我这几天忙坏了。","Ví dụ: 我渴坏了，哪里能买水？"]},{"name":"So sánh 就 và 才","details":["Cấu trúc: S + 就/才 + V","Giải thích: 「就」 diễn tả hành động xảy ra sớm, nhanh hoặc thuận lợi hơn mong đợi. Ngược lại, 「才」 nhấn mạnh hành động xảy ra muộn, chậm hoặc mất nhiều thời gian hơn dự kiến của người nói.","Mẹo: Hãy nhớ 「就」 mang cảm giác 'sớm/nhanh', còn 「才」 mang cảm giác 'muộn/chậm'.","Lưu ý: Không nên nhầm lẫn giữa hai từ này khi nói về thời gian thực tế, vì sự khác biệt nằm ở thái độ chủ quan của người nói.","•  中国银行很近，走路几分钟就能到。","zhōng guó yín háng hěn jìn zǒu lù jǐ fēn zhōng jiù néng dào","Ngân hàng Trung Quốc rất gần, đi bộ vài phút là đến ngay.","•  我下午要去医院，很晚才能回来。","wǒ xià wǔ yào qù yī yuàn hěn wǎn cái néng huí lái","Chiều nay tôi phải đi bệnh viện, tối muộn mới có thể về.","Ví dụ: 中国银行很近，走路几分钟就能到。","Ví dụ: 我下午要去医院，很晚才能回来。"]}],"extended":[],"structuredGrammar":[{"name":"Phó từ chỉ mức độ 挺","formula":"挺 + tính từ (tùy chọn: + 的)","explanation":"Phó từ 「挺」 được dùng trước tính từ để diễn tả mức độ khá cao, tương đương với nghĩa \"khá\" hoặc \"rất\" trong tiếng Việt. Trong giao tiếp, cuối câu thường thêm 「的」 để nhấn mạnh cảm xúc hoặc sắc thái của người nói.","tip":"Bạn có thể dùng 「挺……的」 trong văn nói để câu văn nghe tự nhiên và biểu cảm hơn.","note":"Không dùng 「挺」 trong các câu mang ý nghĩa phủ định hoặc so sánh đối chiếu.","examples":[{"zh":"这个小区环境挺好的。","pinyin":"zhè gè xiǎo qū huán jìng tǐng hǎo de","vi":"Môi trường của khu dân cư này rất tốt."},{"zh":"这家饭馆的菜挺好吃的。","pinyin":"zhè jiā fàn guǎn de cài tǐng hǎo chī de","vi":"Món ăn của nhà hàng này rất ngon."}],"newExamples":[]},{"name":"Bổ ngữ chỉ mức độ 坏了","formula":"Tính từ/Động từ tâm lý + 坏了","explanation":"Cấu trúc này dùng để nhấn mạnh mức độ cao đến mức quá đà hoặc khó chịu. Bạn có thể hiểu nó tương đương với việc dịch sang tiếng Việt là 'chết mất' hoặc 'hết sức'.","tip":"Thường dùng với các từ chỉ cảm xúc như 「累」(mệt), 「饿」(đói) hoặc 「高兴」(vui).","note":"Không dùng '坏了' cho những tình huống mang nghĩa tích cực một cách trang trọng, nó thường dùng trong văn nói thân mật.","examples":[{"zh":"我这几天忙坏了。","pinyin":"wǒ zhè jǐ tiān máng huài le","vi":"Mấy ngày nay tôi bận đến phát điên."},{"zh":"我渴坏了，哪里能买水？","pinyin":"wǒ kě huài le nǎ lǐ néng mǎi shuǐ","vi":"Tôi khát khô cả cổ rồi, chỗ nào có thể mua nước nhỉ?"}],"newExamples":[]},{"name":"So sánh 就 và 才","formula":"S + 就/才 + V","explanation":"「就」 diễn tả hành động xảy ra sớm, nhanh hoặc thuận lợi hơn mong đợi. Ngược lại, 「才」 nhấn mạnh hành động xảy ra muộn, chậm hoặc mất nhiều thời gian hơn dự kiến của người nói.","tip":"Hãy nhớ 「就」 mang cảm giác 'sớm/nhanh', còn 「才」 mang cảm giác 'muộn/chậm'.","note":"Không nên nhầm lẫn giữa hai từ này khi nói về thời gian thực tế, vì sự khác biệt nằm ở thái độ chủ quan của người nói.","examples":[{"zh":"中国银行很近，走路几分钟就能到。","pinyin":"zhōng guó yín háng hěn jìn zǒu lù jǐ fēn zhōng jiù néng dào","vi":"Ngân hàng Trung Quốc rất gần, đi bộ vài phút là đến ngay."},{"zh":"我下午要去医院，很晚才能回来。","pinyin":"wǒ xià wǔ yào qù yī yuàn hěn wǎn cái néng huí lái","vi":"Chiều nay tôi phải đi bệnh viện, tối muộn mới có thể về."}],"newExamples":[]}],"subtitle":"Khu dân cư này khá tốt"},{"id":4,"title":"这家宾馆跟别的不一样","words":[{"id":"hsk3-L04-01","hanzi":"假期","pinyin":"jiǎqī","meaning":"kỳ nghỉ","example":"假期我想去海边。","examplePinyin":"jiǎqī wǒ xiǎng qù hǎi biān.","translation":"Kỳ nghỉ tôi muốn ra biển."},{"id":"hsk3-L04-02","hanzi":"海","pinyin":"hǎi","meaning":"biển","example":"我喜欢看海。","examplePinyin":"wǒ xǐhuān kàn hǎi.","translation":"Tôi thích ngắm biển."},{"id":"hsk3-L04-03","hanzi":"草原","pinyin":"cǎoyuán","meaning":"thảo nguyên","example":"草原上有很多羊。","examplePinyin":"cǎoyuán shàng yǒu hěnduō yáng.","translation":"Trên thảo nguyên có rất nhiều cừu."},{"id":"hsk3-L04-04","hanzi":"主意","pinyin":"zhǔyì","meaning":"ý kiến, ý tưởng","example":"这是个好主意。","examplePinyin":"zhè shì gè hǎo zhǔyì.","translation":"Đây là một ý tưởng hay."},{"id":"hsk3-L04-05","hanzi":"骑","pinyin":"qí","meaning":"cưỡi, đi (xe đạp)","example":"他会骑马。","examplePinyin":"tā huì qí mǎ.","translation":"Anh ấy biết cưỡi ngựa."},{"id":"hsk3-L04-06","hanzi":"马","pinyin":"mǎ","meaning":"ngựa","example":"那匹马很高。","examplePinyin":"nà pǐ mǎ hěn gāo.","translation":"Con ngựa đó rất cao."},{"id":"hsk3-L04-07","hanzi":"羊","pinyin":"yáng","meaning":"cừu, dê","example":"草原上有一只羊。","examplePinyin":"cǎoyuán shàng yǒu yì zhī yáng.","translation":"Trên thảo nguyên có một con cừu."},{"id":"hsk3-L04-08","hanzi":"月亮","pinyin":"yuèliàng","meaning":"mặt trăng","example":"今天的月亮很漂亮。","examplePinyin":"jīntiān de yuèliàng hěn piàoliang.","translation":"Mặt trăng hôm nay rất đẹp."},{"id":"hsk3-L04-09","hanzi":"一定","pinyin":"yídìng","meaning":"nhất định; chắc chắn","example":"明天我一定来。","examplePinyin":"míngtiān wǒ yídìng lái.","translation":"Ngày mai tôi nhất định sẽ đến."},{"id":"hsk3-L04-10","hanzi":"刻","pinyin":"kè","meaning":"khắc; 15 phút","example":"现在八点一刻。","examplePinyin":"xiànzài bādiǎn yī kè.","translation":"Bây giờ là tám giờ mười lăm."},{"id":"hsk3-L04-11","hanzi":"起飞","pinyin":"qǐfēi","meaning":"cất cánh","example":"飞机十点起飞。","examplePinyin":"fēijī shídiǎn qǐfēi.","translation":"Máy bay cất cánh lúc mười giờ."},{"id":"hsk3-L04-12","hanzi":"宾馆","pinyin":"bīnguǎn","meaning":"khách sạn","example":"我们住在这家宾馆。","examplePinyin":"wǒmen zhù zài zhè jiā bīnguǎn.","translation":"Chúng tôi ở khách sạn này."},{"id":"hsk3-L04-13","hanzi":"特别","pinyin":"tèbié","meaning":"đặc biệt; rất","example":"这个地方特别漂亮。","examplePinyin":"zhège dìfang tèbié piàoliang.","translation":"Nơi này đặc biệt đẹp."},{"id":"hsk3-L04-14","hanzi":"别的","pinyin":"biéde","meaning":"khác, cái khác","example":"我想看看别的房间。","examplePinyin":"wǒ xiǎng kàn kàn biéde fáng jiān.","translation":"Tôi muốn xem phòng khác."},{"id":"hsk3-L04-15","hanzi":"一样","pinyin":"yíyàng","meaning":"giống nhau","example":"这两件衣服不一样。","examplePinyin":"zhè liǎng jiàn yīfú bù yíyàng.","translation":"Hai bộ quần áo này không giống nhau."},{"id":"hsk3-L04-16","hanzi":"牛","pinyin":"niú","meaning":"bò","example":"农场里有很多牛。","examplePinyin":"nóng chǎng lǐ yǒu hěnduō niú.","translation":"Trong nông trại có nhiều bò."},{"id":"hsk3-L04-17","hanzi":"相机","pinyin":"xiāngjī","meaning":"máy ảnh","example":"这台相机是我哥哥的。","examplePinyin":"zhè tái xiāngjī shì wǒ gēge de.","translation":"Chiếc máy ảnh này là của anh trai tôi."},{"id":"hsk3-L04-18","hanzi":"欢迎","pinyin":"huānyíng","meaning":"chào mừng","example":"欢迎来我家做客！","examplePinyin":"huānyíng lái wǒ jiā zuòkè!","translation":"Hoan nghênh bạn đến nhà tôi chơi!"},{"id":"hsk3-L04-19","hanzi":"司机","pinyin":"sījī","meaning":"tài xế, lái xe","example":"司机开车很小心。","examplePinyin":"sījī kāi chē hěnxiǎo xīn.","translation":"Tài xế lái xe rất cẩn thận."},{"id":"hsk3-L04-20","hanzi":"晚点","pinyin":"wǎndiǎn","meaning":"trễ giờ, muộn giờ (tàu xe)","example":"飞机晚点了。","examplePinyin":"fēijī wǎndiǎn le.","translation":"Máy bay bị trễ giờ rồi."},{"id":"hsk3-L04-21","hanzi":"久","pinyin":"jiǔ","meaning":"lâu","example":"你等了很久吗？","examplePinyin":"nǐ děng le hěn jiǔ ma?","translation":"Bạn đã đợi lâu chưa?"},{"id":"hsk3-L04-22","hanzi":"除了","pinyin":"chúle","meaning":"ngoài, trừ","example":"除了我，他也会说汉语。","examplePinyin":"chúle wǒ, tā yě huì shuō Hànyǔ.","translation":"Ngoài tôi ra, anh ấy cũng biết nói tiếng Trung."},{"id":"hsk3-L04-23","hanzi":"以外","pinyin":"yǐwài","meaning":"bên ngoài; ngoài... ra","example":"除了汉语以外，我还学英语。","examplePinyin":"chúle Hànyǔ yǐwài, wǒ huán xué Yīngyǔ.","translation":"Ngoài tiếng Trung, tôi còn học tiếng Anh."},{"id":"hsk3-L04-24","hanzi":"先","pinyin":"xiān","meaning":"trước tiên","example":"我们先吃饭，再学习。","examplePinyin":"wǒmen xiān chīfàn, zài xuéxí.","translation":"Chúng ta ăn cơm trước rồi học."},{"id":"hsk3-L04-25","hanzi":"一直","pinyin":"yìzhí","meaning":"luôn luôn, suốt","example":"他一直在等你。","examplePinyin":"tā yìzhí zài děng nǐ.","translation":"Anh ấy vẫn luôn đợi bạn."},{"id":"hsk3-L04-26","hanzi":"干净","pinyin":"gānjìng","meaning":"sạch sẽ","example":"这个房间很干净。","examplePinyin":"zhège fáng jiān hěn gānjìng.","translation":"Căn phòng này rất sạch sẽ."},{"id":"hsk3-L04-27","hanzi":"满意","pinyin":"mǎnyì","meaning":"hài lòng","example":"我对这个宾馆很满意。","examplePinyin":"wǒ duì zhège bīnguǎn hěn mǎnyì.","translation":"Tôi rất hài lòng với khách sạn này."}],"grammar":[{"name":"Cấu trúc phủ định hoàn toàn 「一……也/都……」","details":["Cấu trúc: S + 一 + (lượng từ) + N + 也/都 + 不/没 + V","Giải thích: Cấu trúc này dùng để nhấn mạnh sự phủ định hoàn toàn, có nghĩa là \"một chút/một cái... cũng không\". Khi nói về hành động trong quá khứ hoặc trạng thái đã hoàn thành, bạn dùng 「没」; khi nói về thói quen, dự định hoặc trạng thái hiện tại, bạn dùng 「不」.","Mẹo: Bạn có thể dùng 「一点儿」 thay cho 「lượng từ + danh từ」 để nhấn mạnh ý nghĩa \"một chút cũng không\".","Lưu ý: Đừng quên đặt 「也」 hoặc 「都」 trước 「不/没」, nếu để sau là sai ngữ pháp.","•  她一件衣服都不想买。","tā yī jiàn yī fú dōu bù xiǎng mǎi","Một bộ quần áo cô ấy cũng không muốn mua.","•  草原一点儿也不冷。","cǎo yuán yī diǎn ér yě bù lěng","Thảo nguyên một chút cũng không lạnh.","Ví dụ: 她一件衣服都不想买。","Ví dụ: 草原一点儿也不冷。"]},{"name":"So sánh bằng","details":["Cấu trúc: A 跟 B 一样 (+ Tính từ/Động từ)","Giải thích: Cấu trúc 「A 跟 B 一样」 dùng để so sánh hai đối tượng có tính chất hoặc mức độ tương đồng nhau. Nếu muốn nhấn mạnh phương diện giống nhau, ta thêm tính từ hoặc động từ phía sau cụm 「一样」.","Mẹo: Bạn có thể dùng 「和」 thay cho 「跟」 mà ý nghĩa không hề thay đổi.","Lưu ý: Khi muốn nói phủ định (không giống), hãy thêm 「不」 vào trước 「一样」, thành 「A 跟 B 不一样」.","•  这家宾馆跟别的不一样。","zhè jiā bīn guǎn gēn bié de bù yī yàng","Khách sạn này không giống những cái khác.","•  他买的新手机跟我的一样。","tā mǎi de xīn shǒu jī gēn wǒ de yī yàng","Điện thoại mới anh ấy mua giống hệt cái của tôi.","Ví dụ: 这家宾馆跟别的不一样。","Ví dụ: 他买的新手机跟我的一样。"]},{"name":"Cấu trúc 'Ngoài ra' với 除了","details":["Cấu trúc: 除了 + A + (以外)，+ (B) + 都/还/也 + Động từ/Tính từ","Giải thích: Cấu trúc này dùng để diễn tả ý 'ngoài... ra'. Nếu dùng với 「都」, nó mang nghĩa loại trừ tất cả đều như thế; nếu dùng với 「还/也」, nó mang nghĩa ngoài cái đó ra còn có thêm cái khác.","Mẹo: Bạn có thể lược bỏ 「以外」 trong khẩu ngữ để câu nói tự nhiên và nhanh gọn hơn.","Lưu ý: Chú ý phân biệt: dùng 「都」 là phủ định hoặc bao hàm toàn bộ, còn dùng 「还/也」 là bổ sung thêm đối tượng mới.","•  除了我以外，大家都在玩手机。","chú le wǒ yǐ wài dà jiā dōu zài wán shǒu jī","Ngoài tôi ra, mọi người đều đang chơi điện thoại.","•  除了唱歌以外，他也喜欢跳舞。","chú le chàng gē yǐ wài tā yě xǐ huān tiào wǔ","Ngoài ca hát ra, anh ấy cũng thích khiêu vũ.","Ví dụ: 除了我以外，大家都在玩手机。","Ví dụ: 除了唱歌以外，他也喜欢跳舞。"]}],"extended":[],"structuredGrammar":[{"name":"Cấu trúc phủ định hoàn toàn 「一……也/都……」","formula":"S + 一 + (lượng từ) + N + 也/都 + 不/没 + V","explanation":"Cấu trúc này dùng để nhấn mạnh sự phủ định hoàn toàn, có nghĩa là \"một chút/một cái... cũng không\". Khi nói về hành động trong quá khứ hoặc trạng thái đã hoàn thành, bạn dùng 「没」; khi nói về thói quen, dự định hoặc trạng thái hiện tại, bạn dùng 「不」.","tip":"Bạn có thể dùng 「一点儿」 thay cho 「lượng từ + danh từ」 để nhấn mạnh ý nghĩa \"một chút cũng không\".","note":"Đừng quên đặt 「也」 hoặc 「都」 trước 「不/没」, nếu để sau là sai ngữ pháp.","examples":[{"zh":"她一件衣服都不想买。","pinyin":"tā yī jiàn yī fú dōu bù xiǎng mǎi","vi":"Một bộ quần áo cô ấy cũng không muốn mua."},{"zh":"草原一点儿也不冷。","pinyin":"cǎo yuán yī diǎn ér yě bù lěng","vi":"Thảo nguyên một chút cũng không lạnh."}],"newExamples":[]},{"name":"So sánh bằng","formula":"A 跟 B 一样 (+ Tính từ/Động từ)","explanation":"Cấu trúc 「A 跟 B 一样」 dùng để so sánh hai đối tượng có tính chất hoặc mức độ tương đồng nhau. Nếu muốn nhấn mạnh phương diện giống nhau, ta thêm tính từ hoặc động từ phía sau cụm 「一样」.","tip":"Bạn có thể dùng 「和」 thay cho 「跟」 mà ý nghĩa không hề thay đổi.","note":"Khi muốn nói phủ định (không giống), hãy thêm 「不」 vào trước 「一样」, thành 「A 跟 B 不一样」.","examples":[{"zh":"这家宾馆跟别的不一样。","pinyin":"zhè jiā bīn guǎn gēn bié de bù yī yàng","vi":"Khách sạn này không giống những cái khác."},{"zh":"他买的新手机跟我的一样。","pinyin":"tā mǎi de xīn shǒu jī gēn wǒ de yī yàng","vi":"Điện thoại mới anh ấy mua giống hệt cái của tôi."}],"newExamples":[]},{"name":"Cấu trúc 'Ngoài ra' với 除了","formula":"除了 + A + (以外)，+ (B) + 都/还/也 + Động từ/Tính từ","explanation":"Cấu trúc này dùng để diễn tả ý 'ngoài... ra'. Nếu dùng với 「都」, nó mang nghĩa loại trừ tất cả đều như thế; nếu dùng với 「还/也」, nó mang nghĩa ngoài cái đó ra còn có thêm cái khác.","tip":"Bạn có thể lược bỏ 「以外」 trong khẩu ngữ để câu nói tự nhiên và nhanh gọn hơn.","note":"Chú ý phân biệt: dùng 「都」 là phủ định hoặc bao hàm toàn bộ, còn dùng 「还/也」 là bổ sung thêm đối tượng mới.","examples":[{"zh":"除了我以外，大家都在玩手机。","pinyin":"chú le wǒ yǐ wài dà jiā dōu zài wán shǒu jī","vi":"Ngoài tôi ra, mọi người đều đang chơi điện thoại."},{"zh":"除了唱歌以外，他也喜欢跳舞。","pinyin":"chú le chàng gē yǐ wài tā yě xǐ huān tiào wǔ","vi":"Ngoài ca hát ra, anh ấy cũng thích khiêu vũ."}],"newExamples":[]}],"subtitle":"Khách sạn này khác những nơi khác"},{"id":5,"title":"这样的照片才好看","words":[{"id":"hsk3-L05-01","hanzi":"总是","pinyin":"zǒngshì","meaning":"luôn luôn","example":"她总是很早起床。","examplePinyin":"tā zǒngshì hěnzǎo qǐ chuáng.","translation":"Cô ấy luôn dậy rất sớm."},{"id":"hsk3-L05-02","hanzi":"终于","pinyin":"zhōngyú","meaning":"cuối cùng cũng","example":"我终于找到手机了。","examplePinyin":"wǒ zhōngyú zhǎo dào shǒu jī le.","translation":"Cuối cùng tôi cũng tìm thấy điện thoại."},{"id":"hsk3-L05-03","hanzi":"爬","pinyin":"pá","meaning":"leo, trèo","example":"周末我们去爬山。","examplePinyin":"zhōumò wǒmen qù páshān.","translation":"Cuối tuần chúng tôi đi leo núi."},{"id":"hsk3-L05-04","hanzi":"山","pinyin":"shān","meaning":"núi","example":"这座山很高。","examplePinyin":"zhè zuò shān hěn gāo.","translation":"Ngọn núi này rất cao."},{"id":"hsk3-L05-05","hanzi":"锻炼","pinyin":"duànliàn","meaning":"rèn luyện, tập thể dục","example":"我每天都锻炼身体。","examplePinyin":"wǒ měitiān dōu duànliàn shēn tǐ.","translation":"Ngày nào tôi cũng tập thể dục."},{"id":"hsk3-L05-06","hanzi":"照","pinyin":"zhào","meaning":"chụp, chiếu; theo","example":"请帮我照一张照片。","examplePinyin":"qǐng bāng wǒ zhào yì zhāng zhàopiàn.","translation":"Hãy chụp giúp tôi một bức ảnh."},{"id":"hsk3-L05-07","hanzi":"鞋","pinyin":"xié","meaning":"giày","example":"这双鞋很舒服。","examplePinyin":"zhè shuāng xié hěn shū fú.","translation":"Đôi giày này rất thoải mái."},{"id":"hsk3-L05-08","hanzi":"大衣","pinyin":"dàyī","meaning":"áo khoác dài","example":"冬天我要穿大衣。","examplePinyin":"dōngtiān wǒ yào chuān dàyī.","translation":"Mùa đông tôi cần mặc áo khoác dày."},{"id":"hsk3-L05-09","hanzi":"拍照","pinyin":"pāizhào","meaning":"chụp ảnh","example":"我们在公园里拍照。","examplePinyin":"wǒmen zài gōngyuán lǐ pāizhào.","translation":"Chúng tôi chụp ảnh trong công viên."},{"id":"hsk3-L05-10","hanzi":"感兴趣","pinyin":"gǎnxìngqù","meaning":"cảm thấy hứng thú","example":"我对中国文化很感兴趣。","examplePinyin":"wǒ duì zhōngguówénhuà hěn gǎnxìngqù.","translation":"Tôi rất hứng thú với văn hóa Trung Quốc."},{"id":"hsk3-L05-11","hanzi":"照相","pinyin":"zhàoxiàng","meaning":"chụp hình","example":"我喜欢给朋友照相。","examplePinyin":"wǒ xǐhuān gěi péngyou zhàoxiàng.","translation":"Tôi thích chụp ảnh cho bạn bè."},{"id":"hsk3-L05-12","hanzi":"难看","pinyin":"nánkàn","meaning":"xấu, khó coi","example":"这张照片有点儿难看。","examplePinyin":"zhè zhāng zhàopiàn yǒu diǎn ér nánkàn.","translation":"Bức ảnh này hơi xấu."},{"id":"hsk3-L05-13","hanzi":"比较","pinyin":"bǐjiào","meaning":"khá, tương đối; so sánh","example":"今天比较冷。","examplePinyin":"jīntiān bǐjiào lěng.","translation":"Hôm nay khá lạnh."},{"id":"hsk3-L05-14","hanzi":"水平","pinyin":"shuǐpíng","meaning":"trình độ, mức độ","example":"我的汉语水平提高了。","examplePinyin":"wǒ de hànyǔshuǐpíng tígāo le.","translation":"Trình độ tiếng Trung của tôi đã tiến bộ."},{"id":"hsk3-L05-15","hanzi":"太阳","pinyin":"tàiyáng","meaning":"mặt trời","example":"今天太阳很好。","examplePinyin":"jīntiān tàiyáng hěnhǎo.","translation":"Hôm nay trời có nắng đẹp."},{"id":"hsk3-L05-16","hanzi":"树","pinyin":"shù","meaning":"cây","example":"公园里有很多树。","examplePinyin":"gōngyuán lǐ yǒu hěnduō shù.","translation":"Trong công viên có nhiều cây."},{"id":"hsk3-L05-17","hanzi":"干","pinyin":"gān","meaning":"khô (gān)","example":"我的衣服已经干了。","examplePinyin":"wǒ de yīfú yǐjīng gān le.","translation":"Quần áo của tôi đã khô rồi."},{"id":"hsk3-L05-18","hanzi":"电","pinyin":"diàn","meaning":"điện","example":"这个房间没有电。","examplePinyin":"zhège fáng jiān méiyǒu diàn.","translation":"Căn phòng này không có điện."},{"id":"hsk3-L05-19","hanzi":"收到","pinyin":"shōudào","meaning":"nhận được","example":"我收到了你的邮件。","examplePinyin":"wǒ shōudào le nǐ de yóujiàn.","translation":"Tôi đã nhận được email của bạn."},{"id":"hsk3-L05-20","hanzi":"封","pinyin":"fēng","meaning":"phong, bức (lượng từ thư)","example":"我收到了一封信。","examplePinyin":"wǒ shōudào le yì fēng xìn.","translation":"Tôi đã nhận được một bức thư."},{"id":"hsk3-L05-21","hanzi":"邮件","pinyin":"yóujiàn","meaning":"thư, email","example":"我已经发邮件给老师了。","examplePinyin":"wǒ yǐjīng fā yóujiàn gěi lǎoshī le.","translation":"Tôi đã gửi email cho giáo viên rồi."},{"id":"hsk3-L05-22","hanzi":"难过","pinyin":"nánguò","meaning":"buồn, đau lòng","example":"听到这个消息，我很难过。","examplePinyin":"tīng dào zhège xiāo xī, wǒ hěn nánguò.","translation":"Nghe tin này tôi rất buồn."},{"id":"hsk3-L05-23","hanzi":"哈哈","pinyin":"hāhā","meaning":"ha ha (tiếng cười)","example":"哈哈，这个故事真有意思！","examplePinyin":"hāhā, zhège gùshì zhēn yǒu yì sī!","translation":"Ha ha, câu chuyện này thật thú vị!"},{"id":"hsk3-L05-24","hanzi":"音乐","pinyin":"yīnlè","meaning":"âm nhạc","example":"我喜欢听音乐。","examplePinyin":"wǒ xǐhuān tīng yīnlè.","translation":"Tôi thích nghe nhạc."},{"id":"hsk3-L05-25","hanzi":"兴趣","pinyin":"xìngqù","meaning":"sở thích, hứng thú","example":"我对历史有兴趣。","examplePinyin":"wǒ duì lìshǐ yǒu xìngqù.","translation":"Tôi có hứng thú với lịch sử."},{"id":"hsk3-L05-26","hanzi":"会","pinyin":"huì","meaning":"biết, có thể; cuộc họp (huì)","example":"我会说一点儿汉语。","examplePinyin":"wǒ huì shuō yìdiǎnr Hànyǔ.","translation":"Tôi biết nói một chút tiếng Trung."},{"id":"hsk3-L05-27","hanzi":"结束","pinyin":"jiéshù","meaning":"kết thúc","example":"会议五点结束。","examplePinyin":"huìyì wǔ diǎn jiéshù.","translation":"Cuộc họp kết thúc lúc năm giờ."}],"grammar":[{"name":"Bổ ngữ chỉ mức độ 得很","details":["Cấu trúc: Tính từ + 得很 (Rất/Vô cùng)","Giải thích: Cấu trúc 「得很」 được đặt sau tính từ để nhấn mạnh mức độ cao của tính chất đó, tương tự như 「很」 nhưng mang sắc thái biểu cảm mạnh hơn. Bạn có thể dịch là \"rất\", \"cực kỳ\" hoặc \"vô cùng\".","Mẹo: Dùng 「得很」 giúp câu văn tự nhiên và nhấn mạnh cảm xúc của người nói tốt hơn là chỉ dùng 「很」 trước tính từ.","Lưu ý: Không nên dùng 「很」 cùng lúc trước tính từ khi đã dùng 「得很」 ở phía sau.","•  现在天气好得很。","xiàn zài tiān qì hǎo de hěn","Bây giờ thời tiết tốt lắm.","•  房间里面热得很。","fáng jiān lǐ miàn rè de hěn","Trong phòng nóng vô cùng.","Ví dụ: 现在天气好得很。","Ví dụ: 房间里面热得很。"]},{"name":"Lặp lại lượng từ","details":["Cấu trúc: Lượng từ + Lượng từ (ví dụ: 个个, 天天)","Giải thích: Khi lặp lại lượng từ, câu văn nhấn mạnh rằng tất cả các cá thể trong nhóm đều mang cùng một đặc điểm hoặc thực hiện cùng một hành động. Cấu trúc này thường đứng trước động từ để bổ nghĩa cho chủ ngữ hoặc tân ngữ.","Mẹo: Cách dùng này giúp câu văn trở nên tự nhiên và nhấn mạnh sự đồng nhất của đối tượng được nhắc đến.","Lưu ý: Không phải lượng từ nào cũng có thể lặp lại, hãy ưu tiên các từ thông dụng như 「个个」, 「天天」, 「年年」.","•  这些照片张张都非常好看。","zhè xiē zhào piàn zhāng zhāng dōu fēi cháng hǎo kàn","Những bức ảnh này tấm nào cũng đều rất đẹp.","•  这些苹果个个都很大。","zhè xiē píng guǒ gè gè dōu hěn dà","Những quả táo này quả nào cũng đều rất to.","Ví dụ: 这些照片张张都非常好看。","Ví dụ: 这些苹果个个都很大。"]},{"name":"Câu tồn tại diễn tả sự xuất hiện/biến mất","details":["Cấu trúc: [Địa điểm] + [Động từ] + [Bổ ngữ xu hướng] + [Danh từ]","Giải thích: Cấu trúc này dùng để diễn tả sự xuất hiện hoặc biến mất của người/vật tại một địa điểm cụ thể. Động từ thường đi kèm với các bổ ngữ như 「来」, 「去」, 「出来」, 「掉」 để chỉ hướng của hành động.","Mẹo: Hãy chú ý danh từ chỉ người hoặc vật thường đứng sau động từ để làm rõ sự tồn tại hoặc thay đổi trạng thái tại đó.","Lưu ý: Đừng nhầm lẫn với câu tồn tại trạng thái (thường dùng 「着」), câu tồn tại loại này nhấn mạnh vào hành động di chuyển hoặc xuất hiện.","•  后边走过去两个人。","hòu biān zǒu guò qù liǎng gè rén","Phía sau có hai người vừa đi qua.","•  楼下来了几个人。","lóu xià lái le jǐ gè rén","Dưới lầu có mấy người vừa đến.","Ví dụ: 后边走过去两个人。","Ví dụ: 楼下来了几个人。"]},{"name":"Diễn tả hành động nối tiếp ngay lập tức","details":["Cấu trúc: V1 + 了 + (O), + 就 + V2","Giải thích: Cấu trúc này dùng để nhấn mạnh trình tự thời gian giữa hai hành động. Hành động thứ hai sẽ xảy ra ngay sau khi hành động thứ nhất hoàn thành.","Mẹo: Bạn có thể hiểu đơn giản là: làm xong việc A thì làm ngay việc B.","Lưu ý: Không được dùng cấu trúc này để diễn tả hai hành động diễn ra cùng lúc.","•  你听完了音乐会就来我家吃饭。","nǐ tīng wán le yīn yuè huì jiù lái wǒ jiā chī fàn","Bạn nghe xong buổi hòa nhạc thì đến nhà tôi ăn cơm nhé.","•  我吃了早饭就去学校了。","wǒ chī le zǎo fàn jiù qù xué xiào le","Tôi ăn sáng xong là đi học ngay.","Ví dụ: 你听完了音乐会就来我家吃饭。","Ví dụ: 我吃了早饭就去学校了。"]}],"extended":[],"structuredGrammar":[{"name":"Bổ ngữ chỉ mức độ 得很","formula":"Tính từ + 得很 (Rất/Vô cùng)","explanation":"Cấu trúc 「得很」 được đặt sau tính từ để nhấn mạnh mức độ cao của tính chất đó, tương tự như 「很」 nhưng mang sắc thái biểu cảm mạnh hơn. Bạn có thể dịch là \"rất\", \"cực kỳ\" hoặc \"vô cùng\".","tip":"Dùng 「得很」 giúp câu văn tự nhiên và nhấn mạnh cảm xúc của người nói tốt hơn là chỉ dùng 「很」 trước tính từ.","note":"Không nên dùng 「很」 cùng lúc trước tính từ khi đã dùng 「得很」 ở phía sau.","examples":[{"zh":"现在天气好得很。","pinyin":"xiàn zài tiān qì hǎo de hěn","vi":"Bây giờ thời tiết tốt lắm."},{"zh":"房间里面热得很。","pinyin":"fáng jiān lǐ miàn rè de hěn","vi":"Trong phòng nóng vô cùng."}],"newExamples":[]},{"name":"Lặp lại lượng từ","formula":"Lượng từ + Lượng từ (ví dụ: 个个, 天天)","explanation":"Khi lặp lại lượng từ, câu văn nhấn mạnh rằng tất cả các cá thể trong nhóm đều mang cùng một đặc điểm hoặc thực hiện cùng một hành động. Cấu trúc này thường đứng trước động từ để bổ nghĩa cho chủ ngữ hoặc tân ngữ.","tip":"Cách dùng này giúp câu văn trở nên tự nhiên và nhấn mạnh sự đồng nhất của đối tượng được nhắc đến.","note":"Không phải lượng từ nào cũng có thể lặp lại, hãy ưu tiên các từ thông dụng như 「个个」, 「天天」, 「年年」.","examples":[{"zh":"这些照片张张都非常好看。","pinyin":"zhè xiē zhào piàn zhāng zhāng dōu fēi cháng hǎo kàn","vi":"Những bức ảnh này tấm nào cũng đều rất đẹp."},{"zh":"这些苹果个个都很大。","pinyin":"zhè xiē píng guǒ gè gè dōu hěn dà","vi":"Những quả táo này quả nào cũng đều rất to."}],"newExamples":[]},{"name":"Câu tồn tại diễn tả sự xuất hiện/biến mất","formula":"[Địa điểm] + [Động từ] + [Bổ ngữ xu hướng] + [Danh từ]","explanation":"Cấu trúc này dùng để diễn tả sự xuất hiện hoặc biến mất của người/vật tại một địa điểm cụ thể. Động từ thường đi kèm với các bổ ngữ như 「来」, 「去」, 「出来」, 「掉」 để chỉ hướng của hành động.","tip":"Hãy chú ý danh từ chỉ người hoặc vật thường đứng sau động từ để làm rõ sự tồn tại hoặc thay đổi trạng thái tại đó.","note":"Đừng nhầm lẫn với câu tồn tại trạng thái (thường dùng 「着」), câu tồn tại loại này nhấn mạnh vào hành động di chuyển hoặc xuất hiện.","examples":[{"zh":"后边走过去两个人。","pinyin":"hòu biān zǒu guò qù liǎng gè rén","vi":"Phía sau có hai người vừa đi qua."},{"zh":"楼下来了几个人。","pinyin":"lóu xià lái le jǐ gè rén","vi":"Dưới lầu có mấy người vừa đến."}],"newExamples":[]},{"name":"Diễn tả hành động nối tiếp ngay lập tức","formula":"V1 + 了 + (O), + 就 + V2","explanation":"Cấu trúc này dùng để nhấn mạnh trình tự thời gian giữa hai hành động. Hành động thứ hai sẽ xảy ra ngay sau khi hành động thứ nhất hoàn thành.","tip":"Bạn có thể hiểu đơn giản là: làm xong việc A thì làm ngay việc B.","note":"Không được dùng cấu trúc này để diễn tả hai hành động diễn ra cùng lúc.","examples":[{"zh":"你听完了音乐会就来我家吃饭。","pinyin":"nǐ tīng wán le yīn yuè huì jiù lái wǒ jiā chī fàn","vi":"Bạn nghe xong buổi hòa nhạc thì đến nhà tôi ăn cơm nhé."},{"zh":"我吃了早饭就去学校了。","pinyin":"wǒ chī le zǎo fàn jiù qù xué xiào le","vi":"Tôi ăn sáng xong là đi học ngay."}],"newExamples":[]}],"subtitle":"Ảnh như thế này mới đẹp"},{"id":6,"title":"高铁上还可以点外卖","words":[{"id":"hsk3-L06-01","hanzi":"该","pinyin":"gāi","meaning":"đến lúc, nên","example":"八点了，该上课了。","examplePinyin":"bādiǎn le, gāi shàng kè le.","translation":"Tám giờ rồi, đến lúc vào học."},{"id":"hsk3-L06-02","hanzi":"打算","pinyin":"dǎsuàn","meaning":"dự định","example":"我打算明天去北京。","examplePinyin":"wǒ dǎsuàn míngtiān qù Běijīng.","translation":"Tôi dự định ngày mai đi Bắc Kinh."},{"id":"hsk3-L06-03","hanzi":"高铁","pinyin":"gāotiě","meaning":"tàu cao tốc","example":"我们坐高铁去上海。","examplePinyin":"wǒmen zuò gāotiě qù Shànghǎi.","translation":"Chúng tôi đi Thượng Hải bằng tàu cao tốc."},{"id":"hsk3-L06-04","hanzi":"行","pinyin":"xíng","meaning":"được, ổn, có thể","example":"这样做行吗？","examplePinyin":"zhè yàng zuò xíng ma?","translation":"Làm như vậy có được không?"},{"id":"hsk3-L06-05","hanzi":"路口","pinyin":"lùkǒu","meaning":"ngã đường, giao lộ","example":"在下一个路口左转。","examplePinyin":"zài xià yí ge lùkǒu zuǒ zhuǎn.","translation":"Rẽ trái ở ngã đường tiếp theo."},{"id":"hsk3-L06-06","hanzi":"小心","pinyin":"xiǎoxīn","meaning":"cẩn thận","example":"过马路要小心。","examplePinyin":"guò mǎlù yào xiǎoxīn.","translation":"Qua đường phải cẩn thận."},{"id":"hsk3-L06-07","hanzi":"迟到","pinyin":"chídào","meaning":"đến muộn","example":"上课不要迟到。","examplePinyin":"shàng kè bùyào chídào.","translation":"Đừng đến lớp muộn."},{"id":"hsk3-L06-08","hanzi":"红绿灯","pinyin":"hónglǜdēng","meaning":"đèn giao thông","example":"红绿灯在前面。","examplePinyin":"hónglǜdēng zài qián miàn.","translation":"Đèn giao thông ở phía trước."},{"id":"hsk3-L06-09","hanzi":"后来","pinyin":"hòulái","meaning":"sau đó, về sau","example":"后来他去了中国。","examplePinyin":"hòulái tā qù le Zhōngguó.","translation":"Sau đó anh ấy đã đến Trung Quốc."},{"id":"hsk3-L06-10","hanzi":"急","pinyin":"jí","meaning":"gấp, vội, sốt ruột","example":"别急，我们还有时间。","examplePinyin":"bié jí, wǒmen háiyǒu shí jiān.","translation":"Đừng vội, chúng ta vẫn còn thời gian."},{"id":"hsk3-L06-11","hanzi":"如果","pinyin":"rúguǒ","meaning":"nếu, nếu như","example":"如果下雨，我就不去。","examplePinyin":"rúguǒ xià yǔ, wǒ jiù bù qù.","translation":"Nếu trời mưa, tôi sẽ không đi."},{"id":"hsk3-L06-12","hanzi":"以前","pinyin":"yǐqián","meaning":"trước đây, trước khi","example":"我以前住在北京。","examplePinyin":"wǒ yǐqián zhù zài Běijīng.","translation":"Trước đây tôi sống ở Bắc Kinh."},{"id":"hsk3-L06-13","hanzi":"耳机","pinyin":"ěrjī","meaning":"tai nghe","example":"我的耳机不见了。","examplePinyin":"wǒ de ěrjī bùjiàn le.","translation":"Tai nghe của tôi biến mất rồi."},{"id":"hsk3-L06-14","hanzi":"充电宝","pinyin":"chōngdiànbǎo","meaning":"sạc dự phòng","example":"我的充电宝在包里。","examplePinyin":"wǒ de chōngdiànbǎo zài bāo lǐ.","translation":"Sạc dự phòng của tôi ở trong túi."},{"id":"hsk3-L06-15","hanzi":"常用","pinyin":"chángyòng","meaning":"thường dùng, thông dụng","example":"这是一个常用的汉字。","examplePinyin":"zhè shì yí ge chángyòng de hànzì.","translation":"Đây là một chữ Hán thường dùng."},{"id":"hsk3-L06-16","hanzi":"越","pinyin":"yuè","meaning":"càng","example":"我越学越喜欢汉语。","examplePinyin":"wǒ yuè xué yuè xǐhuān Hànyǔ.","translation":"Tôi càng học càng thích tiếng Trung."},{"id":"hsk3-L06-17","hanzi":"分开","pinyin":"fēnkāi","meaning":"tách ra, chia ra","example":"我们在路口分开了。","examplePinyin":"wǒmen zài lùkǒu fēnkāi le.","translation":"Chúng tôi chia tay nhau ở ngã đường."},{"id":"hsk3-L06-18","hanzi":"检查","pinyin":"jiǎnchá","meaning":"kiểm tra","example":"请检查你的行李。","examplePinyin":"qǐng jiǎnchá nǐ de xíngli.","translation":"Hãy kiểm tra hành lý của bạn."},{"id":"hsk3-L06-19","hanzi":"刷","pinyin":"shuā","meaning":"quét, chải","example":"请刷一下这张卡。","examplePinyin":"qǐng shuā yíxià zhè zhāng kǎ.","translation":"Hãy quét tấm thẻ này một lần."},{"id":"hsk3-L06-20","hanzi":"检票","pinyin":"jiǎnpiào","meaning":"soát vé","example":"我们现在开始检票。","examplePinyin":"wǒmen xiànzài kāishǐ jiǎnpiào.","translation":"Bây giờ chúng ta bắt đầu soát vé."},{"id":"hsk3-L06-21","hanzi":"电梯","pinyin":"diàntī","meaning":"thang máy","example":"我们坐电梯上去。","examplePinyin":"wǒmen zuò diàntī shàngqu.","translation":"Chúng ta đi thang máy lên trên."},{"id":"hsk3-L06-22","hanzi":"放假","pinyin":"fàngjiǎ","meaning":"nghỉ lễ, nghỉ học","example":"明天学校放假。","examplePinyin":"míngtiān xuéxiào fàngjiǎ.","translation":"Ngày mai trường được nghỉ."},{"id":"hsk3-L06-23","hanzi":"沙发","pinyin":"shāfā","meaning":"ghế sofa","example":"妈妈坐在沙发上。","examplePinyin":"māma zuò zài shāfā shàng.","translation":"Mẹ ngồi trên ghế sofa."},{"id":"hsk3-L06-24","hanzi":"安静","pinyin":"ānjìng","meaning":"yên tĩnh","example":"请安静一点儿。","examplePinyin":"qǐng ānjìng yìdiǎnr.","translation":"Xin hãy yên lặng một chút."},{"id":"hsk3-L06-25","hanzi":"选择","pinyin":"xuǎnzé","meaning":"lựa chọn","example":"我选择坐高铁。","examplePinyin":"wǒ xuǎnzé zuò gāotiě.","translation":"Tôi chọn đi tàu cao tốc."},{"id":"hsk3-L06-26","hanzi":"必须","pinyin":"bìxū","meaning":"bắt buộc, nhất định phải","example":"你必须带护照。","examplePinyin":"nǐ bìxū dài hùzhào.","translation":"Bạn phải mang theo hộ chiếu."}],"grammar":[{"name":"Diễn tả đã đến lúc làm gì","details":["Cấu trúc: 该 + [động từ] + 了","Giải thích: Cấu trúc này dùng để thông báo rằng đã đến lúc cần phải thực hiện một hành động nào đó. Nó thường mang ý nghĩa thúc giục hoặc nhắc nhở bản thân/người khác bắt đầu làm việc gì ngay.","Mẹo: Có thể thêm chủ ngữ vào trước cấu trúc: 「我们该走了」 (Đến lúc chúng ta phải đi rồi).","Lưu ý: Đừng nhầm lẫn với 「应该」 (nên), vì 「该……了」 nhấn mạnh vào thời điểm hành động cần bắt đầu ngay.","•  咱们该买去上海的票了。","zán men gāi mǎi qù shàng hǎi de piào le","Chúng ta nên mua vé đi Thượng Hải thôi.","•  八点了，该上课了。","bā diǎn le gāi shàng kè le","8 giờ rồi, đến giờ lên lớp rồi.","Ví dụ: 咱们该买去上海的票了。","Ví dụ: 八点了，该上课了。"]},{"name":"Câu điều kiện với 如果...就...","details":["Cấu trúc: 如果 + giả thuyết + (的话)，(chủ ngữ) + 就 + kết quả","Giải thích: Cấu trúc này dùng để diễn tả một giả thiết và kết quả tương ứng xảy ra sau đó, tương đương với nghĩa \"nếu... thì...\" trong tiếng Việt. 「如果」 mở đầu vế điều kiện, còn 「就」 nối tiếp để dẫn ra kết quả.","Mẹo: Bạn có thể thêm 「的话」 vào cuối vế giả thiết để câu văn nghe tự nhiên hơn, dù không bắt buộc.","Lưu ý: Trong tiếng Trung, 「就」 phải được đặt sau chủ ngữ của vế kết quả, không nên đặt trước chủ ngữ.","•  如果没走错，二十分钟以前就到了。","rú guǒ méi zǒu cuò èr shí fēn zhōng yǐ qián jiù dào le","Nếu không đi nhầm đường thì 20 phút trước đã đến rồi.","•  如果你需要帮忙，就给我打电话。","rú guǒ nǐ xū yào bāng máng jiù gěi wǒ dǎ diàn huà","Nếu bạn cần giúp đỡ thì hãy gọi điện cho tôi.","Ví dụ: 如果没走错，二十分钟以前就到了。","Ví dụ: 如果你需要帮忙，就给我打电话。"]},{"name":"Diễn tả sự thay đổi tăng dần","details":["Cấu trúc: 越来越 + tính từ / động từ tâm lý","Giải thích: Cấu trúc 「越来越」 được dùng để diễn tả một trạng thái hoặc tính chất thay đổi dần dần theo thời gian. Nó thể hiện mức độ ngày càng tăng hoặc ngày càng mạnh hơn.","Mẹo: Bạn có thể hiểu 「越来越」 tương đương với cụm từ \"càng ngày càng\" trong tiếng Việt.","Lưu ý: Không được thêm các trạng từ chỉ mức độ như 「很」, 「非常」 vào ngay sau 「越来越」.","•  前面的人越来越多。","qián miàn de rén yuè lái yuè duō","Người phía trước ngày càng đông.","•  我越来越喜欢这里的生活了。","wǒ yuè lái yuè xǐ huān zhè lǐ de shēng huó le","Tôi ngày càng yêu thích cuộc sống ở đây.","Ví dụ: 前面的人越来越多。","Ví dụ: 我越来越喜欢这里的生活了。"]}],"extended":[],"structuredGrammar":[{"name":"Diễn tả đã đến lúc làm gì","formula":"该 + [động từ] + 了","explanation":"Cấu trúc này dùng để thông báo rằng đã đến lúc cần phải thực hiện một hành động nào đó. Nó thường mang ý nghĩa thúc giục hoặc nhắc nhở bản thân/người khác bắt đầu làm việc gì ngay.","tip":"Có thể thêm chủ ngữ vào trước cấu trúc: 「我们该走了」 (Đến lúc chúng ta phải đi rồi).","note":"Đừng nhầm lẫn với 「应该」 (nên), vì 「该……了」 nhấn mạnh vào thời điểm hành động cần bắt đầu ngay.","examples":[{"zh":"咱们该买去上海的票了。","pinyin":"zán men gāi mǎi qù shàng hǎi de piào le","vi":"Chúng ta nên mua vé đi Thượng Hải thôi."},{"zh":"八点了，该上课了。","pinyin":"bā diǎn le gāi shàng kè le","vi":"8 giờ rồi, đến giờ lên lớp rồi."}],"newExamples":[]},{"name":"Câu điều kiện với 如果...就...","formula":"如果 + giả thuyết + (的话)，(chủ ngữ) + 就 + kết quả","explanation":"Cấu trúc này dùng để diễn tả một giả thiết và kết quả tương ứng xảy ra sau đó, tương đương với nghĩa \"nếu... thì...\" trong tiếng Việt. 「如果」 mở đầu vế điều kiện, còn 「就」 nối tiếp để dẫn ra kết quả.","tip":"Bạn có thể thêm 「的话」 vào cuối vế giả thiết để câu văn nghe tự nhiên hơn, dù không bắt buộc.","note":"Trong tiếng Trung, 「就」 phải được đặt sau chủ ngữ của vế kết quả, không nên đặt trước chủ ngữ.","examples":[{"zh":"如果没走错，二十分钟以前就到了。","pinyin":"rú guǒ méi zǒu cuò èr shí fēn zhōng yǐ qián jiù dào le","vi":"Nếu không đi nhầm đường thì 20 phút trước đã đến rồi."},{"zh":"如果你需要帮忙，就给我打电话。","pinyin":"rú guǒ nǐ xū yào bāng máng jiù gěi wǒ dǎ diàn huà","vi":"Nếu bạn cần giúp đỡ thì hãy gọi điện cho tôi."}],"newExamples":[]},{"name":"Diễn tả sự thay đổi tăng dần","formula":"越来越 + tính từ / động từ tâm lý","explanation":"Cấu trúc 「越来越」 được dùng để diễn tả một trạng thái hoặc tính chất thay đổi dần dần theo thời gian. Nó thể hiện mức độ ngày càng tăng hoặc ngày càng mạnh hơn.","tip":"Bạn có thể hiểu 「越来越」 tương đương với cụm từ \"càng ngày càng\" trong tiếng Việt.","note":"Không được thêm các trạng từ chỉ mức độ như 「很」, 「非常」 vào ngay sau 「越来越」.","examples":[{"zh":"前面的人越来越多。","pinyin":"qián miàn de rén yuè lái yuè duō","vi":"Người phía trước ngày càng đông."},{"zh":"我越来越喜欢这里的生活了。","pinyin":"wǒ yuè lái yuè xǐ huān zhè lǐ de shēng huó le","vi":"Tôi ngày càng yêu thích cuộc sống ở đây."}],"newExamples":[]}],"subtitle":"Trên tàu cao tốc cũng có thể đặt đồ ăn"},{"id":7,"title":"那条裙子比短裤更好看","words":[{"id":"hsk3-L07-01","hanzi":"辆","pinyin":"liàng","meaning":"chiếc (lượng từ xe cộ)","example":"我买了一辆新车。","examplePinyin":"wǒ mǎi le yí liàng xīn chē.","translation":"Tôi mua một chiếc xe mới."},{"id":"hsk3-L07-02","hanzi":"自行车","pinyin":"zìxíngchē","meaning":"xe đạp","example":"我每天骑自行车上学。","examplePinyin":"wǒ měitiān qí zìxíngchē shàngxué.","translation":"Mỗi ngày tôi đạp xe đi học."},{"id":"hsk3-L07-03","hanzi":"旧","pinyin":"jiù","meaning":"cũ","example":"这辆自行车很旧。","examplePinyin":"zhè liàng zìxíngchē hěn jiù.","translation":"Chiếc xe đạp này rất cũ."},{"id":"hsk3-L07-04","hanzi":"矮","pinyin":"ǎi","meaning":"thấp (chiều cao)","example":"我弟弟比我矮。","examplePinyin":"wǒ dìdi bǐ wǒ ǎi.","translation":"Em trai tôi thấp hơn tôi."},{"id":"hsk3-L07-05","hanzi":"试","pinyin":"shì","meaning":"thử","example":"我想试试这件衣服。","examplePinyin":"wǒ xiǎng shì shì zhèjiàn yīfú.","translation":"Tôi muốn thử bộ quần áo này."},{"id":"hsk3-L07-06","hanzi":"黄色","pinyin":"huángsè","meaning":"màu vàng","example":"我喜欢黄色的裙子。","examplePinyin":"wǒ xǐhuān huángsè de qúnzi.","translation":"Tôi thích váy màu vàng."},{"id":"hsk3-L07-07","hanzi":"短裤","pinyin":"duǎnkù","meaning":"quần đùi, quần soóc","example":"夏天我常穿短裤。","examplePinyin":"xiàtiān wǒ cháng chuān duǎnkù.","translation":"Mùa hè tôi thường mặc quần soóc."},{"id":"hsk3-L07-08","hanzi":"大小","pinyin":"dàxiǎo","meaning":"kích cỡ, lớn nhỏ","example":"这双鞋的大小正好。","examplePinyin":"zhè shuāng xié de dàxiǎo zhèng hǎo.","translation":"Kích cỡ đôi giày này vừa vặn."},{"id":"hsk3-L07-09","hanzi":"合适","pinyin":"héshì","meaning":"phù hợp, vừa vặn","example":"这件衣服很合适。","examplePinyin":"zhèjiàn yīfú hěn héshì.","translation":"Bộ quần áo này rất vừa."},{"id":"hsk3-L07-10","hanzi":"裙子","pinyin":"qúnzi","meaning":"váy","example":"妹妹买了一条裙子。","examplePinyin":"mèimei mǎi le yì tiáo qúnzi.","translation":"Em gái mua một chiếc váy."},{"id":"hsk3-L07-11","hanzi":"更","pinyin":"gèng","meaning":"càng, hơn nữa","example":"这条裙子更好看。","examplePinyin":"zhè tiáo qúnzi gèng hǎokàn.","translation":"Chiếc váy này đẹp hơn."},{"id":"hsk3-L07-12","hanzi":"决定","pinyin":"juédìng","meaning":"quyết định","example":"我决定明天去图书馆。","examplePinyin":"wǒ juédìng míngtiān qù túshūguǎn.","translation":"Tôi quyết định ngày mai đến thư viện."},{"id":"hsk3-L07-13","hanzi":"西瓜","pinyin":"xīguā","meaning":"dưa hấu","example":"这个西瓜很甜。","examplePinyin":"zhège xīguā hěn tián.","translation":"Quả dưa hấu này rất ngọt."},{"id":"hsk3-L07-14","hanzi":"新鲜","pinyin":"xīnxiān","meaning":"tươi, mới","example":"这里的水果很新鲜。","examplePinyin":"zhèlǐ de shuǐguǒ hěn xīnxiān.","translation":"Trái cây ở đây rất tươi."},{"id":"hsk3-L07-15","hanzi":"甜","pinyin":"tián","meaning":"ngọt","example":"这个蛋糕太甜了。","examplePinyin":"zhège dàngāo tài tián le.","translation":"Chiếc bánh này quá ngọt."},{"id":"hsk3-L07-16","hanzi":"公斤","pinyin":"gōngjīn","meaning":"ki-lô-gam","example":"我买了两公斤苹果。","examplePinyin":"wǒ mǎi le liǎng gōngjīn píngguǒ.","translation":"Tôi mua hai ki-lô-gam táo."},{"id":"hsk3-L07-17","hanzi":"冰","pinyin":"bīng","meaning":"đá; lạnh như băng","example":"我想喝一杯冰水。","examplePinyin":"wǒ xiǎng hē yī bēi bīng shuǐ.","translation":"Tôi muốn uống một cốc nước đá."},{"id":"hsk3-L07-18","hanzi":"极","pinyin":"jí","meaning":"cực kỳ (trong 极了)","example":"今天的天气好极了。","examplePinyin":"jīntiān de tiān qì hǎo jí le.","translation":"Thời tiết hôm nay đẹp cực kỳ."},{"id":"hsk3-L07-19","hanzi":"斤","pinyin":"jīn","meaning":"cân Trung Quốc (500 g)","example":"我买了一斤香蕉。","examplePinyin":"wǒ mǎi le yī jīn xiāngjiāo.","translation":"Tôi mua nửa ki-lô-gam chuối."},{"id":"hsk3-L07-20","hanzi":"香蕉","pinyin":"xiāngjiāo","meaning":"chuối","example":"我每天吃一根香蕉。","examplePinyin":"wǒ měitiān chī yī gēn xiāngjiāo.","translation":"Tôi ăn một quả chuối mỗi ngày."},{"id":"hsk3-L07-21","hanzi":"一共","pinyin":"yígòng","meaning":"tổng cộng","example":"这些水果一共多少钱？","examplePinyin":"zhèxiē shuǐguǒ yígòng duō shǎo qián?","translation":"Tổng cộng những trái cây này bao nhiêu tiền?"},{"id":"hsk3-L07-22","hanzi":"毛","pinyin":"máo","meaning":"hào (đơn vị tiền Trung Quốc)","example":"这个东西五毛钱。","examplePinyin":"zhège dōngxi wǔ máo qián.","translation":"Món đồ này giá năm hào."},{"id":"hsk3-L07-23","hanzi":"结婚","pinyin":"jiéhūn","meaning":"kết hôn","example":"我姐姐明年结婚。","examplePinyin":"wǒ jiějie míng nián jiéhūn.","translation":"Chị gái tôi kết hôn vào năm sau."},{"id":"hsk3-L07-24","hanzi":"不但","pinyin":"bùdàn","meaning":"không những","example":"他不但聪明，而且很努力。","examplePinyin":"tā bùdàn cōngmíng, érqiě hěn nǔlì.","translation":"Anh ấy không những thông minh mà còn rất chăm chỉ."},{"id":"hsk3-L07-25","hanzi":"而且","pinyin":"érqiě","meaning":"hơn nữa, mà còn","example":"这个房间大，而且干净。","examplePinyin":"zhège fáng jiān dà, érqiě gānjìng.","translation":"Căn phòng này rộng và còn sạch sẽ."},{"id":"hsk3-L07-26","hanzi":"声","pinyin":"shēng","meaning":"tiếng, âm thanh (lượng từ)","example":"我听见了一声叫声。","examplePinyin":"wǒ tīng jiàn le yī shēng jiào shēng.","translation":"Tôi nghe thấy một tiếng kêu."},{"id":"hsk3-L07-27","hanzi":"开机","pinyin":"kāijī","meaning":"khởi động, bật máy","example":"请先开机再检查。","examplePinyin":"qǐng xiān kāijī zài jiǎnchá.","translation":"Hãy bật máy trước rồi kiểm tra."}],"grammar":[{"name":"Câu liên động V1+着+V2","details":["Cấu trúc: Động từ 1 + 着 + Động từ 2 (Hành động phụ + Hành động chính)","Giải thích: Cấu trúc này dùng để diễn tả một hành động hoặc trạng thái xảy ra song song hoặc đi kèm trong khi thực hiện hành động chính. Trong đó, 「着」 gắn sau động từ thứ nhất để chỉ trạng thái kéo dài, làm nền cho động từ thứ hai.","Mẹo: Hãy nhớ rằng 「V1」 chỉ cách thức hoặc trạng thái, còn 「V2」 mới là hành động chính bạn muốn nhấn mạnh.","Lưu ý: Không nên nhầm lẫn 「着」 trong cấu trúc này với 「着」 dùng trong thì tiếp diễn; ở đây nó mang nghĩa là \"đang làm gì đó mà...\".","•  咱们可以走着去。","zán men kě yǐ zǒu zhe qù","Chúng ta có thể đi bộ đi.","•  弟弟吃着苹果写作业。","dì dì chī zhe píng guǒ xiě zuò yè","Em trai vừa ăn táo vừa làm bài tập.","Ví dụ: 咱们可以走着去。","Ví dụ: 弟弟吃着苹果写作业。"]},{"name":"Câu so sánh phủ định 「A 不比 B + Tính từ」","details":["Cấu trúc: A + 不比 + B + Tính từ","Giải thích: Cấu trúc này dùng để phủ định việc A hơn B về một đặc điểm nào đó, mang nghĩa là A không bằng hoặc không vượt trội hơn B. Nó thường dùng khi người nói cảm thấy mức độ của A không cao hơn mức độ của B.","Mẹo: Cách nói này khác với 「A 没有 B + tính từ」 vì nó nhấn mạnh vào việc phủ định sự so sánh hơn là chỉ đơn thuần nói A kém hơn B.","Lưu ý: Không được thêm các từ chỉ mức độ như 「很」, 「非常」 sau tính từ trong cấu trúc so sánh này.","•  裙子不比短裤贵多少。","qún zi bù bǐ duǎn kù guì duō shǎo","Váy không đắt hơn quần soóc bao nhiêu.","•  他的中文不比你好。","tā de zhōng wén bù bǐ nǐ hǎo","Tiếng Trung của anh ấy không giỏi hơn bạn đâu.","Ví dụ: 裙子不比短裤贵多少。","Ví dụ: 他的中文不比你好。"]},{"name":"Bổ ngữ chỉ mức độ cực độ 「极了」","details":["Cấu trúc: Tính từ + 极了 (Cực kỳ/Vô cùng)","Giải thích: Cấu trúc 「极了」 được đặt sau tính từ để nhấn mạnh mức độ ở cấp độ cao nhất. Nó tương đương với nghĩa \"cực kỳ\" hoặc \"vô cùng\" trong tiếng Việt.","Mẹo: Thường dùng để biểu đạt cảm xúc mạnh hoặc mô tả trạng thái một cách nhấn mạnh, ví dụ: 「太好了」(tốt quá/cực kỳ tốt).","Lưu ý: Cần lưu ý 「极了」 thường đi với các tính từ mang ý nghĩa tích cực hoặc mô tả trạng thái cực hạn.","•  这块西瓜甜极了。","zhè kuài xī guā tián jí le","Miếng dưa hấu này ngọt cực kỳ.","•  今年夏天热极了。","jīn nián xià tiān rè jí le","Mùa hè năm nay nóng vô cùng.","Ví dụ: 这块西瓜甜极了。","Ví dụ: 今年夏天热极了。"]},{"name":"Cấu trúc tăng tiến","details":["Cấu trúc: 不但 (búdàn) + A, 而且 (érqiě) + B","Giải thích: Cấu trúc này dùng để diễn tả ý “không những… mà còn…”, biểu thị mức độ của sự việc sau cao hơn hoặc bổ sung cho sự việc trước. Đây là liên từ chỉ quan hệ tăng tiến phổ biến trong tiếng Trung.","Mẹo: Nếu hai vế câu có cùng chủ ngữ, 「不但」 nên đặt trước chủ ngữ của vế thứ nhất.","Lưu ý: Không nên nhầm lẫn 「而且」 với các từ nối khác, vì nó chuyên dùng để thể hiện sự bổ sung ý nghĩa mang tính tăng tiến.","•  现在的电视不但便宜，而且用着非常方便。","xiàn zài de diàn shì bù dàn pián yí ér qiě yòng zhe fēi cháng fāng biàn","Tivi bây giờ không những rẻ mà dùng còn rất tiện lợi.","•  家月不但喜欢唱歌，而且唱得很好听。","jiā yuè bù dàn xǐ huān chàng gē ér qiě chàng de hěn hǎo tīng","Gia Nguyệt không những thích hát mà hát còn rất hay.","Ví dụ: 现在的电视不但便宜，而且用着非常方便。","Ví dụ: 家月不但喜欢唱歌，而且唱得很好听。"]}],"extended":[],"structuredGrammar":[{"name":"Câu liên động V1+着+V2","formula":"Động từ 1 + 着 + Động từ 2 (Hành động phụ + Hành động chính)","explanation":"Cấu trúc này dùng để diễn tả một hành động hoặc trạng thái xảy ra song song hoặc đi kèm trong khi thực hiện hành động chính. Trong đó, 「着」 gắn sau động từ thứ nhất để chỉ trạng thái kéo dài, làm nền cho động từ thứ hai.","tip":"Hãy nhớ rằng 「V1」 chỉ cách thức hoặc trạng thái, còn 「V2」 mới là hành động chính bạn muốn nhấn mạnh.","note":"Không nên nhầm lẫn 「着」 trong cấu trúc này với 「着」 dùng trong thì tiếp diễn; ở đây nó mang nghĩa là \"đang làm gì đó mà...\".","examples":[{"zh":"咱们可以走着去。","pinyin":"zán men kě yǐ zǒu zhe qù","vi":"Chúng ta có thể đi bộ đi."},{"zh":"弟弟吃着苹果写作业。","pinyin":"dì dì chī zhe píng guǒ xiě zuò yè","vi":"Em trai vừa ăn táo vừa làm bài tập."}],"newExamples":[]},{"name":"Câu so sánh phủ định 「A 不比 B + Tính từ」","formula":"A + 不比 + B + Tính từ","explanation":"Cấu trúc này dùng để phủ định việc A hơn B về một đặc điểm nào đó, mang nghĩa là A không bằng hoặc không vượt trội hơn B. Nó thường dùng khi người nói cảm thấy mức độ của A không cao hơn mức độ của B.","tip":"Cách nói này khác với 「A 没有 B + tính từ」 vì nó nhấn mạnh vào việc phủ định sự so sánh hơn là chỉ đơn thuần nói A kém hơn B.","note":"Không được thêm các từ chỉ mức độ như 「很」, 「非常」 sau tính từ trong cấu trúc so sánh này.","examples":[{"zh":"裙子不比短裤贵多少。","pinyin":"qún zi bù bǐ duǎn kù guì duō shǎo","vi":"Váy không đắt hơn quần soóc bao nhiêu."},{"zh":"他的中文不比你好。","pinyin":"tā de zhōng wén bù bǐ nǐ hǎo","vi":"Tiếng Trung của anh ấy không giỏi hơn bạn đâu."}],"newExamples":[]},{"name":"Bổ ngữ chỉ mức độ cực độ 「极了」","formula":"Tính từ + 极了 (Cực kỳ/Vô cùng)","explanation":"Cấu trúc 「极了」 được đặt sau tính từ để nhấn mạnh mức độ ở cấp độ cao nhất. Nó tương đương với nghĩa \"cực kỳ\" hoặc \"vô cùng\" trong tiếng Việt.","tip":"Thường dùng để biểu đạt cảm xúc mạnh hoặc mô tả trạng thái một cách nhấn mạnh, ví dụ: 「太好了」(tốt quá/cực kỳ tốt).","note":"Cần lưu ý 「极了」 thường đi với các tính từ mang ý nghĩa tích cực hoặc mô tả trạng thái cực hạn.","examples":[{"zh":"这块西瓜甜极了。","pinyin":"zhè kuài xī guā tián jí le","vi":"Miếng dưa hấu này ngọt cực kỳ."},{"zh":"今年夏天热极了。","pinyin":"jīn nián xià tiān rè jí le","vi":"Mùa hè năm nay nóng vô cùng."}],"newExamples":[]},{"name":"Cấu trúc tăng tiến","formula":"不但 (búdàn) + A, 而且 (érqiě) + B","explanation":"Cấu trúc này dùng để diễn tả ý “không những… mà còn…”, biểu thị mức độ của sự việc sau cao hơn hoặc bổ sung cho sự việc trước. Đây là liên từ chỉ quan hệ tăng tiến phổ biến trong tiếng Trung.","tip":"Nếu hai vế câu có cùng chủ ngữ, 「不但」 nên đặt trước chủ ngữ của vế thứ nhất.","note":"Không nên nhầm lẫn 「而且」 với các từ nối khác, vì nó chuyên dùng để thể hiện sự bổ sung ý nghĩa mang tính tăng tiến.","examples":[{"zh":"现在的电视不但便宜，而且用着非常方便。","pinyin":"xiàn zài de diàn shì bù dàn pián yí ér qiě yòng zhe fēi cháng fāng biàn","vi":"Tivi bây giờ không những rẻ mà dùng còn rất tiện lợi."},{"zh":"家月不但喜欢唱歌，而且唱得很好听。","pinyin":"jiā yuè bù dàn xǐ huān chàng gē ér qiě chàng de hěn hǎo tīng","vi":"Gia Nguyệt không những thích hát mà hát còn rất hay."}],"newExamples":[]}],"subtitle":"Chiếc váy kia đẹp hơn quần soóc"},{"id":8,"title":"今天我出院了","words":[{"id":"hsk3-L08-01","hanzi":"最近","pinyin":"zuìjìn","meaning":"gần đây","example":"我最近很忙。","examplePinyin":"wǒ zuìjìn hěn máng.","translation":"Gần đây tôi rất bận."},{"id":"hsk3-L08-02","hanzi":"常","pinyin":"cháng","meaning":"thường, thường xuyên","example":"我常去图书馆。","examplePinyin":"wǒ cháng qù túshūguǎn.","translation":"Tôi thường đến thư viện."},{"id":"hsk3-L08-03","hanzi":"体育馆","pinyin":"tǐyùguǎn","meaning":"nhà thi đấu, phòng thể thao","example":"我们在体育馆打球。","examplePinyin":"wǒmen zài tǐyùguǎn dǎ qiú.","translation":"Chúng tôi chơi bóng ở nhà thi đấu."},{"id":"hsk3-L08-04","hanzi":"习惯","pinyin":"xíguàn","meaning":"thói quen; quen với","example":"我习惯早上学习。","examplePinyin":"wǒ xíguàn zǎoshang xuéxí.","translation":"Tôi quen học vào buổi sáng."},{"id":"hsk3-L08-05","hanzi":"胖","pinyin":"pàng","meaning":"béo, mập","example":"他最近胖了一点儿。","examplePinyin":"tā zuìjìn pàng le yìdiǎnr.","translation":"Gần đây anh ấy tăng cân một chút."},{"id":"hsk3-L08-06","hanzi":"健康","pinyin":"jiànkāng","meaning":"khỏe mạnh, sức khỏe","example":"多运动对健康有好处。","examplePinyin":"duō yùn dòng duì jiànkāng yǒu hǎo chù.","translation":"Vận động nhiều có lợi cho sức khỏe."},{"id":"hsk3-L08-07","hanzi":"以后","pinyin":"yǐhòu","meaning":"sau này, sau khi","example":"吃完饭以后去散步。","examplePinyin":"chī wán fàn yǐhòu qù sàn bù.","translation":"Ăn xong thì đi dạo."},{"id":"hsk3-L08-08","hanzi":"羽毛球","pinyin":"yǔmáoqiú","meaning":"cầu lông","example":"我周末打羽毛球。","examplePinyin":"wǒ zhōumò dǎ yǔmáoqiú.","translation":"Cuối tuần tôi chơi cầu lông."},{"id":"hsk3-L08-09","hanzi":"耳朵","pinyin":"ěrduǒ","meaning":"tai","example":"我的耳朵有点儿疼。","examplePinyin":"wǒ de ěrduǒ yǒu diǎn ér téng.","translation":"Tai tôi hơi đau."},{"id":"hsk3-L08-10","hanzi":"感冒","pinyin":"gǎnmào","meaning":"bị cảm","example":"他感冒了，不能上课。","examplePinyin":"tā gǎnmào le, bùnéng shàng kè.","translation":"Anh ấy bị cảm, không thể lên lớp."},{"id":"hsk3-L08-11","hanzi":"发烧","pinyin":"fāshāo","meaning":"sốt","example":"孩子发烧了。","examplePinyin":"háizi fāshāo le.","translation":"Đứa trẻ bị sốt rồi."},{"id":"hsk3-L08-12","hanzi":"低","pinyin":"dī","meaning":"thấp","example":"今天的温度很低。","examplePinyin":"jīntiān de wēn dù hěn dī.","translation":"Nhiệt độ hôm nay rất thấp."},{"id":"hsk3-L08-13","hanzi":"关心","pinyin":"guānxīn","meaning":"quan tâm","example":"妈妈很关心我的学习。","examplePinyin":"māma hěn guānxīn wǒ de xuéxí.","translation":"Mẹ rất quan tâm đến việc học của tôi."},{"id":"hsk3-L08-14","hanzi":"注意","pinyin":"zhùyì","meaning":"chú ý","example":"请注意安全。","examplePinyin":"qǐng zhùyì ān quán.","translation":"Hãy chú ý an toàn."},{"id":"hsk3-L08-15","hanzi":"突然","pinyin":"tūrán","meaning":"đột nhiên","example":"天突然下雨了。","examplePinyin":"tiān tūrán xià yǔ le.","translation":"Trời đột nhiên đổ mưa."},{"id":"hsk3-L08-16","hanzi":"住院","pinyin":"zhùyuàn","meaning":"nhập viện, nằm viện","example":"爸爸生病住院了。","examplePinyin":"bàba shēng bìng zhùyuàn le.","translation":"Bố bị bệnh và nhập viện rồi."},{"id":"hsk3-L08-17","hanzi":"担心","pinyin":"dānxīn","meaning":"lo lắng","example":"别担心，我很好。","examplePinyin":"bié dānxīn, wǒ hěnhǎo.","translation":"Đừng lo, tôi vẫn ổn."},{"id":"hsk3-L08-18","hanzi":"腿","pinyin":"tuǐ","meaning":"chân (đùi, cẳng chân)","example":"我的腿有点儿疼。","examplePinyin":"wǒ de tuǐ yǒu diǎn ér téng.","translation":"Chân tôi hơi đau."},{"id":"hsk3-L08-19","hanzi":"病人","pinyin":"bìngrén","meaning":"bệnh nhân","example":"医生正在照顾病人。","examplePinyin":"yīshēng zhèng zài zhàogù bìngrén.","translation":"Bác sĩ đang chăm sóc bệnh nhân."},{"id":"hsk3-L08-20","hanzi":"差不多","pinyin":"chàbuduō","meaning":"gần như, xấp xỉ","example":"现在差不多八点了。","examplePinyin":"xiànzài chàbuduō bādiǎn le.","translation":"Bây giờ đã gần tám giờ rồi."},{"id":"hsk3-L08-21","hanzi":"得","pinyin":"děi","meaning":"phải, cần (děi)","example":"我得去医院看看。","examplePinyin":"wǒ děi qù yīyuàn kàn kàn.","translation":"Tôi phải đến bệnh viện khám thử."},{"id":"hsk3-L08-22","hanzi":"开心","pinyin":"kāixīn","meaning":"vui vẻ","example":"今天我很开心。","examplePinyin":"jīntiān wǒ hěn kāixīn.","translation":"Hôm nay tôi rất vui."},{"id":"hsk3-L08-23","hanzi":"出院","pinyin":"chūyuàn","meaning":"xuất viện","example":"他明天可以出院。","examplePinyin":"tā míngtiān kěyǐ chūyuàn.","translation":"Ngày mai anh ấy có thể xuất viện."},{"id":"hsk3-L08-24","hanzi":"开","pinyin":"kāi","meaning":"mở, lái; nở","example":"爸爸每天开车上班。","examplePinyin":"bàba měitiān kāi chē shàngbān.","translation":"Bố lái xe đi làm mỗi ngày."},{"id":"hsk3-L08-25","hanzi":"种","pinyin":"zhòng","meaning":"trồng (zhòng)","example":"我想在花园里种花。","examplePinyin":"wǒ xiǎng zài huāyuán lǐ zhòng huā.","translation":"Tôi muốn trồng hoa trong vườn."},{"id":"hsk3-L08-26","hanzi":"方法","pinyin":"fāngfǎ","meaning":"phương pháp, cách làm","example":"这个学习方法很好。","examplePinyin":"zhège xuéxífāngfǎ hěnhǎo.","translation":"Phương pháp học này rất tốt."},{"id":"hsk3-L08-27","hanzi":"其他","pinyin":"qítā","meaning":"khác, những thứ còn lại","example":"其他同学都回家了。","examplePinyin":"qítā tóngxué dōu huíjiā le.","translation":"Các bạn học khác đều về nhà rồi."},{"id":"hsk3-L08-28","hanzi":"心里","pinyin":"xīnlǐ","meaning":"trong lòng, trong tâm trí","example":"我心里很高兴。","examplePinyin":"wǒ xīnlǐ hěn gāo xìng.","translation":"Trong lòng tôi rất vui."}],"grammar":[{"name":"Bổ ngữ xu hướng 「下去」: Sự tiếp tục","details":["Cấu trúc: Động từ + 下去","Giải thích: Cấu trúc 「下去」 được dùng sau động từ để diễn tả một hành động hoặc trạng thái đang diễn ra và cần được tiếp tục duy trì trong tương lai. Nó giúp nhấn mạnh tính liên tục của hành động đó, ví dụ: 「请说下去」 (Xin hãy nói tiếp đi).","Mẹo: Hãy tưởng tượng 「下去」 như việc bạn đang 'tiếp tục đi xuống' con đường đang đi, giúp bạn ghi nhớ nghĩa của nó là kéo dài hành động.","Lưu ý: Không nên nhầm lẫn với hướng đi vật lý (từ cao xuống thấp), ở đây 「下去」 chỉ mang nghĩa trừu tượng về thời gian và trạng thái.","•  我今年胖了十多斤，不能再胖下去了。","wǒ jīn nián pàng le shí duō jīn bù néng zài pàng xià qù le","Năm nay tôi béo lên hơn 10 cân rồi, không thể cứ béo mãi thế này được.","•  她读完了第一个问题，后面的你读下去。","tā dú wán le dì yī gè wèn tí hòu miàn de nǐ dú xià qù","Cô ấy đọc xong câu hỏi thứ nhất rồi, phần sau bạn đọc tiếp đi.","Ví dụ: 我今年胖了十多斤，不能再胖下去了。","Ví dụ: 她读完了第一个问题，后面的你读下去。"]},{"name":"Động từ ly hợp","details":["Cấu trúc: Động từ (A) + Thành phần bổ trợ + Tân ngữ (B)","Giải thích: Trong tiếng Trung, 「động từ ly hợp」 gồm một động từ và một tân ngữ dính liền nhau. Khi muốn thêm số lần, thời lượng hoặc bổ ngữ, ta phải tách chúng ra và chèn các thành phần đó vào giữa.","Mẹo: Hãy tưởng tượng 「động từ ly hợp」 là một cặp đôi, khi có 'người thứ ba' chen vào thì hai bạn ấy phải tách nhau ra.","Lưu ý: Đừng bao giờ đặt bổ ngữ hoặc tân ngữ trực tiếp ngay sau toàn bộ cụm động từ ly hợp mà không tách chúng ra.","•  上个星期我跟他见了一次面。","shàng gè xīng qī wǒ gēn tā jiàn le yī cì miàn","Tuần trước tôi đã gặp anh ấy một lần.","•  今年夏天只下了两次雨。","jīn nián xià tiān zhǐ xià le liǎng cì yǔ","Mùa hè năm nay chỉ mưa có hai lần.","Ví dụ: 上个星期我跟他见了一次面。","Ví dụ: 今年夏天只下了两次雨。"]},{"name":"Bổ ngữ thời lượng biểu thị thời gian kéo dài","details":["Cấu trúc: Chủ ngữ + Động từ + (了) + Bổ ngữ thời lượng + (của tân ngữ)","Giải thích: Bổ ngữ thời lượng dùng để diễn tả khoảng thời gian mà một hành động đã diễn ra hoặc kéo dài. Khi có tân ngữ đi kèm, bạn có thể đặt thời lượng ở giữa động từ và tân ngữ, hoặc thêm 「的」 sau bổ ngữ thời lượng.","Mẹo: Nếu hành động đã kết thúc, bạn có thể thêm 「了」 ngay sau động từ.","Lưu ý: Nếu tân ngữ là danh từ chỉ người hoặc đại từ (ví dụ: 我, 他), bổ ngữ thời lượng phải đặt sau tân ngữ.","•  我上次来医院已经过去差不多两年了。","wǒ shàng cì lái yī yuàn yǐ jīng guò qù chà bù duō liǎng nián le","Lần trước tôi đến bệnh viện đã cách đây gần hai năm rồi.","•  开学已经三个多星期了。","kāi xué yǐ jīng sān gè duō xīng qī le","Khai giảng đã được hơn ba tuần rồi.","Ví dụ: 我上次来医院已经过去差不多两年了。","Ví dụ: 开学已经三个多星期了。"]},{"name":"Thời gian trước và sau hành động","details":["Cấu trúc: [Cụm động từ/Thời gian] + 以前/以后","Giải thích: Cấu trúc này dùng để diễn
