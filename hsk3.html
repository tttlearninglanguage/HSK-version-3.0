指出错误。","examplePinyin":"Wǒ xīwàng yǐhòu néng zhǐchū cuòwù.","translation":"Tôi hy vọng sau này có thể chỉ ra lỗi sai."},{"id":"hsk3-T28-22","hanzi":"深刻","pinyin":"shēnkè","meaning":"sâu sắc","example":"这次旅行给我留下了深刻的印象。","examplePinyin":"Zhè cì lǚxíng gěi wǒ liúxià le shēnkè de yìnxiàng.","translation":"Chuyến đi này để lại ấn tượng sâu sắc với tôi."},{"id":"hsk3-T28-23","hanzi":"明确","pinyin":"míngquè","meaning":"rõ ràng","example":"我们的学习目标已经很明确了。","examplePinyin":"Wǒmen de xuéxí mùbiāo yǐjīng hěn míngquè le.","translation":"Mục tiêu học của chúng tôi đã rõ ràng."},{"id":"hsk3-T28-24","hanzi":"明显","pinyin":"míngxiǎn","meaning":"rõ ràng, dễ nhận thấy","example":"她的汉语水平明显提高了。","examplePinyin":"Tā de Hànyǔ shuǐpíng míngxiǎn tígāo le.","translation":"Trình độ tiếng Trung của cô ấy cải thiện rõ rệt."},{"id":"hsk3-T28-25","hanzi":"具体","pinyin":"jùtǐ","meaning":"cụ thể","example":"你能告诉我具体的时间吗？","examplePinyin":"Nǐ néng gàosu wǒ jùtǐ de shíjiān ma?","translation":"Bạn có thể cho tôi biết thời gian cụ thể không?"},{"id":"hsk3-T28-26","hanzi":"看上去","pinyin":"kàn shàngqu","meaning":"trông có vẻ","example":"他看上去很累，可能没睡好。","examplePinyin":"Tā kàn shàngqu hěn lèi, kěnéng méi shuì hǎo.","translation":"Anh ấy trông rất mệt, có lẽ không ngủ ngon."},{"id":"hsk3-T28-27","hanzi":"意义","pinyin":"yìyì","meaning":"ý nghĩa","example":"帮助别人是一件有意义的事。","examplePinyin":"Bāngzhù biérén shì yí jiàn yǒu yìyì de shì.","translation":"Giúp đỡ người khác là việc có ý nghĩa."},{"id":"hsk3-T28-28","hanzi":"主意","pinyin":"zhǔyi","meaning":"ý tưởng","example":"你有什么好主意吗？","examplePinyin":"Nǐ yǒu shénme hǎo zhǔyi ma?","translation":"Bạn có ý kiến hay nào không?"},{"id":"hsk3-T28-29","hanzi":"概念","pinyin":"gàiniàn","meaning":"khái niệm","example":"老师解释了这个概念。","examplePinyin":"Lǎoshī jiěshì le zhège gàiniàn.","translation":"Giáo viên giải thích khái niệm này."},{"id":"hsk3-T28-30","hanzi":"合理","pinyin":"hélǐ","meaning":"hợp lý","example":"我觉得这个安排很合理。","examplePinyin":"Wǒ juéde zhège ānpái hěn hélǐ.","translation":"Tôi thấy cách sắp xếp này rất hợp lý."},{"id":"hsk3-T28-31","hanzi":"体会","pinyin":"tǐhuì","meaning":"cảm nhận","example":"离开家以后，我才体会到父母的关心。","examplePinyin":"Líkāi jiā yǐhòu, wǒ cái tǐhuì dào fùmǔ de guānxīn.","translation":"Sau khi xa nhà, tôi mới cảm nhận sự quan tâm của bố mẹ."},{"id":"hsk3-T28-32","hanzi":"批准","pinyin":"pīzhǔn","meaning":"phê duyệt","example":"我们需要批准休假。","examplePinyin":"Wǒmen xūyào pīzhǔn xiūjià.","translation":"Chúng ta cần phê duyệt nghỉ phép."},{"id":"hsk3-T28-33","hanzi":"总结","pinyin":"zǒngjié","meaning":"tổng kết","example":"他们正在总结学习内容。","examplePinyin":"Tāmen zhèngzài zǒngjié xuéxí nèiróng.","translation":"Họ đang tổng kết nội dung học."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/tu-duy/"},{"id":29,"name":"LIÊN LẠC","words":[{"id":"hsk3-T29-01","hanzi":"同意","pinyin":"tóngyì","meaning":"đồng ý","example":"我同意你的想法。","examplePinyin":"wǒ tóngyì nǐ de xiǎng fǎ.","translation":"Tôi đồng ý với suy nghĩ của bạn."},{"id":"hsk3-T29-02","hanzi":"表达","pinyin":"biǎodá","meaning":"biểu đạt","example":"他们正在表达感情。","examplePinyin":"Tāmen zhèngzài biǎodá gǎnqíng.","translation":"Họ đang biểu đạt tình cảm."},{"id":"hsk3-T29-03","hanzi":"表明","pinyin":"biǎomíng","meaning":"cho thấy","example":"学校决定表明态度。","examplePinyin":"Xuéxiào juédìng biǎomíng tàidu.","translation":"Nhà trường quyết định cho thấy thái độ."},{"id":"hsk3-T29-04","hanzi":"表现","pinyin":"biǎoxiàn","meaning":"thể hiện","example":"老师让我们表现自己的能力。","examplePinyin":"Lǎoshī ràng wǒmen biǎoxiàn zìjǐ de nénglì.","translation":"Giáo viên yêu cầu chúng tôi thể hiện năng lực bản thân."},{"id":"hsk3-T29-05","hanzi":"吵","pinyin":"chǎo","meaning":"ồn ào","example":"孩子们太吵了，我没办法看书。","examplePinyin":"Háizimen tài chǎo le, wǒ méi bànfǎ kàn shū.","translation":"Bọn trẻ ồn quá, tôi không thể đọc sách."},{"id":"hsk3-T29-06","hanzi":"吵架","pinyin":"chǎojià","meaning":"cãi nhau","example":"他们昨天吵架了，今天又和好了。","examplePinyin":"Tāmen zuótiān chǎojià le, jīntiān yòu héhǎo le.","translation":"Họ cãi nhau hôm qua, hôm nay đã làm hòa."},{"id":"hsk3-T29-07","hanzi":"传说","pinyin":"chuánshuō","meaning":"truyền thuyết","example":"奶奶给我讲了一个传说。","examplePinyin":"Nǎinai gěi wǒ jiǎng le yí ge chuánshuō.","translation":"Bà kể cho tôi nghe một truyền thuyết."},{"id":"hsk3-T29-08","hanzi":"有的是","pinyin":"yǒu de shì","meaning":"có rất nhiều","example":"学习汉语的方法有的是。","examplePinyin":"Xuéxí Hànyǔ de fāngfǎ yǒu de shì.","translation":"Có rất nhiều phương pháp học tiếng Trung."},{"id":"hsk3-T29-09","hanzi":"话题","pinyin":"huàtí","meaning":"chủ đề","example":"我们今天聊天的话题是中国文化。","examplePinyin":"Wǒmen jīntiān liáotiān de huàtí shì Zhōngguó wénhuà.","translation":"Chủ đề trò chuyện hôm nay là văn hóa Trung Quốc."},{"id":"hsk3-T29-10","hanzi":"请教","pinyin":"qǐngjiào","meaning":"thỉnh giáo","example":"我希望以后能请教老师。","examplePinyin":"Wǒ xīwàng yǐhòu néng qǐngjiào lǎoshī.","translation":"Tôi hy vọng sau này có thể thỉnh giáo giáo viên."},{"id":"hsk3-T29-11","hanzi":"谈","pinyin":"tán","meaning":"nói chuyện","example":"我们昨天谈了两个小时。","examplePinyin":"Wǒmen zuótiān tán le liǎng ge xiǎoshí.","translation":"Hôm qua chúng tôi nói chuyện hai tiếng."},{"id":"hsk3-T29-12","hanzi":"谈话","pinyin":"tánhuà","meaning":"cuộc trò chuyện","example":"和父母谈话以后，她决定继续学习。","examplePinyin":"Hé fùmǔ tánhuà yǐhòu, tā juédìng jìxù xuéxí.","translation":"Sau khi trò chuyện với bố mẹ, cô ấy quyết định học tiếp."},{"id":"hsk3-T29-13","hanzi":"谈判","pinyin":"tánpàn","meaning":"đàm phán","example":"学校决定谈判价格。","examplePinyin":"Xuéxiào juédìng tánpàn jiàgé.","translation":"Nhà trường quyết định đàm phán giá cả."},{"id":"hsk3-T29-14","hanzi":"提问","pinyin":"tíwèn","meaning":"đặt câu hỏi","example":"老师让我们提问问题。","examplePinyin":"Lǎoshī ràng wǒmen tíwèn wèntí.","translation":"Giáo viên yêu cầu chúng tôi đặt câu hỏi câu hỏi."},{"id":"hsk3-T29-15","hanzi":"通信","pinyin":"tōngxìn","meaning":"liên lạc","example":"老师让我们先通信。","examplePinyin":"Lǎoshī ràng wǒmen xiān tōngxìn.","translation":"Giáo viên yêu cầu chúng tôi liên lạc trước."},{"id":"hsk3-T29-16","hanzi":"强调","pinyin":"qiángdiào","meaning":"nhấn mạnh","example":"我们需要强调安全。","examplePinyin":"Wǒmen xūyào qiángdiào ānquán.","translation":"Chúng ta cần nhấn mạnh an toàn."},{"id":"hsk3-T29-17","hanzi":"发表","pinyin":"fābiǎo","meaning":"công bố, xuất bản","example":"他们正在发表文章。","examplePinyin":"Tāmen zhèngzài fābiǎo wénzhāng.","translation":"Họ đang công bố, xuất bản bài viết."},{"id":"hsk3-T29-18","hanzi":"发言","pinyin":"fāyán","meaning":"phát biểu","example":"学校决定发言一次。","examplePinyin":"Xuéxiào juédìng fāyán yí cì.","translation":"Nhà trường quyết định phát biểu một lần."},{"id":"hsk3-T29-19","hanzi":"否定","pinyin":"fǒudìng","meaning":"phủ định","example":"老师让我们否定别人的努力。","examplePinyin":"Lǎoshī ràng wǒmen fǒudìng biérén de nǔlì.","translation":"Giáo viên yêu cầu chúng tôi phủ định nỗ lực của người khác."},{"id":"hsk3-T29-20","hanzi":"否认","pinyin":"fǒurèn","meaning":"phủ nhận","example":"我希望以后能否认事实。","examplePinyin":"Wǒ xīwàng yǐhòu néng fǒurèn shìshí.","translation":"Tôi hy vọng sau này có thể phủ nhận sự thật."},{"id":"hsk3-T29-21","hanzi":"告别","pinyin":"gàobié","meaning":"từ biệt","example":"我们需要告别朋友。","examplePinyin":"Wǒmen xūyào gàobié péngyou.","translation":"Chúng ta cần từ biệt bạn bè."},{"id":"hsk3-T29-22","hanzi":"基本上","pinyin":"jīběn shang","meaning":"về cơ bản","example":"这本书我基本上看懂了。","examplePinyin":"Zhè běn shū wǒ jīběn shang kàn dǒng le.","translation":"Tôi đã hiểu cơ bản cuốn sách này."},{"id":"hsk3-T29-23","hanzi":"一方面","pinyin":"yì fāngmiàn","meaning":"một mặt","example":"一方面我想去留学，另一方面又舍不得家人。","examplePinyin":"Yì fāngmiàn wǒ xiǎng qù liúxué, lìng yì fāngmiàn yòu shěbude jiārén.","translation":"Một mặt tôi muốn du học, mặt khác không nỡ xa gia đình."},{"id":"hsk3-T29-24","hanzi":"反复","pinyin":"fǎnfù","meaning":"lặp lại","example":"老师让我们反复练习。","examplePinyin":"Lǎoshī ràng wǒmen fǎnfù liànxí.","translation":"Giáo viên yêu cầu chúng tôi lặp lại luyện tập."},{"id":"hsk3-T29-25","hanzi":"另一方面","pinyin":"lìng yì fāngmiàn","meaning":"mặt khác","example":"这份工作工资高，另一方面压力也大。","examplePinyin":"Zhè fèn gōngzuò gōngzī gāo, lìng yì fāngmiàn yālì yě dà.","translation":"Công việc này lương cao, mặt khác áp lực cũng lớn."},{"id":"hsk3-T29-26","hanzi":"建议","pinyin":"jiànyì","meaning":"đề nghị, lời khuyên","example":"我们需要建议这个方法。","examplePinyin":"Wǒmen xūyào jiànyì zhège fāngfǎ.","translation":"Chúng ta cần đề nghị, lời khuyên phương pháp này."},{"id":"hsk3-T29-27","hanzi":"交往","pinyin":"jiāowǎng","meaning":"giao lưu","example":"我喜欢和不同国家的人交往。","examplePinyin":"Wǒ xǐhuan hé bùtóng guójiā de rén jiāowǎng.","translation":"Tôi thích giao lưu với người từ nhiều quốc gia."},{"id":"hsk3-T29-28","hanzi":"交流","pinyin":"jiāoliú","meaning":"trao đổi","example":"学校决定交流学习经验。","examplePinyin":"Xuéxiào juédìng jiāoliú xuéxí jīngyàn.","translation":"Nhà trường quyết định trao đổi kinh nghiệm học tập."},{"id":"hsk3-T29-29","hanzi":"据说","pinyin":"jùshuō","meaning":"nghe nói","example":"据说这家饭馆的菜很好吃。","examplePinyin":"Jùshuō zhè jiā fànguǎn de cài hěn hǎochī.","translation":"Nghe nói món ăn nhà hàng này rất ngon."},{"id":"hsk3-T29-30","hanzi":"批评","pinyin":"pīpíng","meaning":"phê bình","example":"我希望以后能批评学生。","examplePinyin":"Wǒ xīwàng yǐhòu néng pīpíng xuésheng.","translation":"Tôi hy vọng sau này có thể phê bình học sinh."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/lien-lac/"},{"id":30,"name":"ĐO LƯỜNG, LƯỢNG TỪ VÀ ĐẠI TỪ","words":[{"id":"hsk3-T30-01","hanzi":"双","pinyin":"shuāng","meaning":"đôi, cặp","example":"我买了两双鞋，一双黑色，一双白色。","examplePinyin":"Wǒ mǎi le liǎng shuāng xié, yì shuāng hēisè, yì shuāng báisè.","translation":"Tôi mua hai đôi giày, một đôi đen và một đôi trắng."},{"id":"hsk3-T30-02","hanzi":"顿","pinyin":"dùn","meaning":"bữa","example":"我们全家一起吃了一顿晚饭。","examplePinyin":"Wǒmen quán jiā yìqǐ chī le yí dùn wǎnfàn.","translation":"Cả gia đình tôi cùng ăn một bữa tối."},{"id":"hsk3-T30-03","hanzi":"类","pinyin":"lèi","meaning":"loại","example":"这种食品和那种食品不是同一类。","examplePinyin":"Zhè zhǒng shípǐn hé nà zhǒng shípǐn bú shì tóng yí lèi.","translation":"Loại thực phẩm này và loại kia không cùng nhóm."},{"id":"hsk3-T30-04","hanzi":"群","pinyin":"qún","meaning":"đàn, nhóm","example":"草原上有一群羊正在吃草。","examplePinyin":"Cǎoyuán shang yǒu yì qún yáng zhèngzài chī cǎo.","translation":"Trên thảo nguyên có một đàn cừu đang ăn cỏ."},{"id":"hsk3-T30-05","hanzi":"束","pinyin":"shù","meaning":"bó","example":"我送给老师一束花。","examplePinyin":"Wǒ sòng gěi lǎoshī yí shù huā.","translation":"Tôi tặng giáo viên một bó hoa."},{"id":"hsk3-T30-06","hanzi":"台","pinyin":"tái","meaning":"chiếc, cái","example":"办公室里有五台电脑。","examplePinyin":"Bàngōngshì lǐ yǒu wǔ tái diànnǎo.","translation":"Trong văn phòng có năm chiếc máy tính."},{"id":"hsk3-T30-07","hanzi":"所","pinyin":"suǒ","meaning":"ngôi, trường","example":"这个城市有三所大学。","examplePinyin":"Zhège chéngshì yǒu sān suǒ dàxué.","translation":"Thành phố này có ba trường đại học."},{"id":"hsk3-T30-08","hanzi":"团","pinyin":"tuán","meaning":"đoàn, cục","example":"一个旅游团正在门口等车。","examplePinyin":"Yí ge lǚyóu tuán zhèngzài ménkǒu děng chē.","translation":"Một đoàn du lịch đang đợi xe ngoài cửa."},{"id":"hsk3-T30-09","hanzi":"支","pinyin":"zhī","meaning":"cây, chiếc","example":"你能借给我一支笔吗？","examplePinyin":"Nǐ néng jiè gěi wǒ yì zhī bǐ ma?","translation":"Bạn có thể cho tôi mượn một cây bút không?"},{"id":"hsk3-T30-10","hanzi":"张","pinyin":"zhāng","meaning":"tờ, bức","example":"我最喜欢这张照片。","examplePinyin":"Wǒ zuì xǐhuan zhè zhāng zhàopiàn.","translation":"Tôi thích bức ảnh này nhất."},{"id":"hsk3-T30-11","hanzi":"每","pinyin":"měi","meaning":"mỗi","example":"我每天都复习生词。","examplePinyin":"Wǒ měitiān dōu fùxí shēngcí.","translation":"Ngày nào tôi cũng ôn từ mới."},{"id":"hsk3-T30-12","hanzi":"任何","pinyin":"rènhé","meaning":"bất kỳ","example":"如果有任何问题，都可以问我。","examplePinyin":"Rúguǒ yǒu rènhé wèntí, dōu kěyǐ wèn wǒ.","translation":"Nếu có bất kỳ vấn đề gì, bạn đều có thể hỏi tôi."},{"id":"hsk3-T30-13","hanzi":"某","pinyin":"mǒu","meaning":"một nào đó","example":"我记得某一天在图书馆见过他。","examplePinyin":"Wǒ jìde mǒu yì tiān zài túshūguǎn jiànguo tā.","translation":"Tôi nhớ đã gặp anh ấy tại thư viện vào một ngày nào đó."},{"id":"hsk3-T30-14","hanzi":"一切","pinyin":"yíqiè","meaning":"tất cả","example":"现在一切都很好。","examplePinyin":"Xiànzài yíqiè dōu hěn hǎo.","translation":"Bây giờ mọi thứ đều tốt."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/do-luong-cac-tu-va-dai-tu/"},{"id":31,"name":"BẢN TÍNH","words":[{"id":"hsk3-T31-01","hanzi":"能力","pinyin":"nénglì","meaning":"năng lực","example":"她有很强的工作能力。","examplePinyin":"Tā yǒu hěn qiáng de gōngzuò nénglì.","translation":"Cô ấy có năng lực làm việc rất tốt."},{"id":"hsk3-T31-02","hanzi":"才能","pinyin":"cáinéng","meaning":"tài năng","example":"他很有音乐才能。","examplePinyin":"Tā hěn yǒu yīnyuè cáinéng.","translation":"Anh ấy có tài năng âm nhạc."},{"id":"hsk3-T31-03","hanzi":"毛病","pinyin":"máobing","meaning":"tật xấu, trục trặc","example":"他有一个毛病，就是总忘记带手机。","examplePinyin":"Tā yǒu yí ge máobing, jiù shì zǒng wàngjì dài shǒujī.","translation":"Anh ấy có một tật xấu là hay quên mang điện thoại."},{"id":"hsk3-T31-04","hanzi":"值得","pinyin":"zhíde","meaning":"đáng","example":"这本书很值得读。","examplePinyin":"Zhè běn shū hěn zhíde dú.","translation":"Cuốn sách này rất đáng đọc."},{"id":"hsk3-T31-05","hanzi":"缺点","pinyin":"quēdiǎn","meaning":"nhược điểm","example":"每个人都有自己的缺点。","examplePinyin":"Měi ge rén dōu yǒu zìjǐ de quēdiǎn.","translation":"Ai cũng có khuyết điểm riêng."},{"id":"hsk3-T31-06","hanzi":"特色","pinyin":"tèsè","meaning":"nét riêng","example":"这家饭馆的特色是南方菜。","examplePinyin":"Zhè jiā fànguǎn de tèsè shì nánfāng cài.","translation":"Nét đặc trưng của nhà hàng này là món miền Nam."},{"id":"hsk3-T31-07","hanzi":"优点","pinyin":"yōudiǎn","meaning":"ưu điểm","example":"这个方法有很多优点。","examplePinyin":"Zhège fāngfǎ yǒu hěn duō yōudiǎn.","translation":"Phương pháp này có nhiều ưu điểm."},{"id":"hsk3-T31-08","hanzi":"短处","pinyin":"duǎnchu","meaning":"sở đoản","example":"每个人都有长处和短处。","examplePinyin":"Měi ge rén dōu yǒu chángchu hé duǎnchu.","translation":"Ai cũng có điểm mạnh và điểm yếu."},{"id":"hsk3-T31-09","hanzi":"长处","pinyin":"chángchu","meaning":"sở trường","example":"他的长处是写作。","examplePinyin":"Tā de chángchu shì xiězuò.","translation":"Sở trường của anh ấy là viết."},{"id":"hsk3-T31-10","hanzi":"本领","pinyin":"běnlǐng","meaning":"bản lĩnh","example":"他有修电脑的本领。","examplePinyin":"Tā yǒu xiū diànnǎo de běnlǐng.","translation":"Anh ấy có kỹ năng sửa máy tính."},{"id":"hsk3-T31-11","hanzi":"巧","pinyin":"qiǎo","meaning":"khéo, trùng hợp","example":"真巧！我们坐的是同一班高铁。","examplePinyin":"Zhēn qiǎo! Wǒmen zuò de shì tóng yì bān gāotiě.","translation":"Trùng hợp thật! Chúng ta đi cùng chuyến tàu cao tốc."},{"id":"hsk3-T31-12","hanzi":"人才","pinyin":"réncái","meaning":"nhân tài","example":"这家公司需要专业人才。","examplePinyin":"Zhè jiā gōngsī xūyào zhuānyè réncái.","translation":"Công ty này cần nhân tài chuyên môn."},{"id":"hsk3-T31-13","hanzi":"性格","pinyin":"xìnggé","meaning":"tính cách","example":"我姐姐的性格和我不同。","examplePinyin":"Wǒ jiějie de xìnggé hé wǒ bùtóng.","translation":"Tính cách chị gái tôi khác tôi."},{"id":"hsk3-T31-14","hanzi":"个人","pinyin":"gèrén","meaning":"cá nhân","example":"这是我个人的意见。","examplePinyin":"Zhè shì wǒ gèrén de yìjiàn.","translation":"Đây là ý kiến cá nhân của tôi."},{"id":"hsk3-T31-15","hanzi":"个性","pinyin":"gèxìng","meaning":"cá tính","example":"她设计的衣服很有个性。","examplePinyin":"Tā shèjì de yīfu hěn yǒu gèxìng.","translation":"Quần áo cô ấy thiết kế rất có cá tính."},{"id":"hsk3-T31-16","hanzi":"本事","pinyin":"běnshi","meaning":"tài cán","example":"他很有本事，能解决这个问题。","examplePinyin":"Tā hěn yǒu běnshi, néng jiějué zhège wèntí.","translation":"Anh ấy rất có bản lĩnh, có thể giải quyết vấn đề này."},{"id":"hsk3-T31-17","hanzi":"客观","pinyin":"kèguān","meaning":"khách quan","example":"他的评价很客观。","examplePinyin":"tā de píngjià hěn kèguān.","translation":"Đánh giá của anh ấy rất khách quan."},{"id":"hsk3-T31-18","hanzi":"自主","pinyin":"zìzhǔ","meaning":"tự chủ","example":"学生应该学会自主安排时间。","examplePinyin":"Xuésheng yīnggāi xuéhuì zìzhǔ ānpái shíjiān.","translation":"Học sinh nên học cách tự chủ sắp xếp thời gian."},{"id":"hsk3-T31-19","hanzi":"幸运","pinyin":"xìngyùn","meaning":"may mắn","example":"我很幸运，遇见了一位好老师。","examplePinyin":"Wǒ hěn xìngyùn, yùjiàn le yí wèi hǎo lǎoshī.","translation":"Tôi rất may mắn khi gặp được một giáo viên tốt."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/ban-tinh/"},{"id":32,"name":"ĐẶC ĐIỂM","words":[{"id":"hsk3-T32-01","hanzi":"性","pinyin":"xìng","meaning":"tính chất","example":"“性”这个词在课文里出现了。","examplePinyin":"“xìng” zhège cí zài kèwén lǐ chūxiàn le.","translation":"Từ “tính chất” xuất hiện trong bài khóa."},{"id":"hsk3-T32-02","hanzi":"基础","pinyin":"jīchǔ","meaning":"nền tảng","example":"学习汉语首先要打好基础。","examplePinyin":"Xuéxí Hànyǔ shǒuxiān yào dǎ hǎo jīchǔ.","translation":"Học tiếng Trung trước tiên phải xây dựng nền tảng tốt."},{"id":"hsk3-T32-03","hanzi":"优势","pinyin":"yōushì","meaning":"lợi thế","example":"这家宾馆最大的优势是离机场近。","examplePinyin":"Zhè jiā bīnguǎn zuì dà de yōushì shì lí jīchǎng jìn.","translation":"Lợi thế lớn nhất của khách sạn này là gần sân bay."},{"id":"hsk3-T32-04","hanzi":"功能","pinyin":"gōngnéng","meaning":"chức năng","example":"这个学习网站有一个新功能。","examplePinyin":"Zhège xuéxí wǎngzhàn yǒu yí ge xīn gōngnéng.","translation":"Website học tập này có một chức năng mới."},{"id":"hsk3-T32-05","hanzi":"实力","pinyin":"shílì","meaning":"thực lực","example":"这个对手的实力很强。","examplePinyin":"Zhège duìshǒu de shílì hěn qiáng.","translation":"Đối thủ này có thực lực rất mạnh."},{"id":"hsk3-T32-06","hanzi":"程度","pinyin":"chéngdù","meaning":"mức độ","example":"学生们的汉语程度不一样。","examplePinyin":"Xuéshengmen de Hànyǔ chéngdù bù yíyàng.","translation":"Trình độ tiếng Trung của các học sinh khác nhau."},{"id":"hsk3-T32-07","hanzi":"彩色","pinyin":"cǎisè","meaning":"nhiều màu","example":"妹妹喜欢看彩色的图画。","examplePinyin":"Mèimei xǐhuan kàn cǎisè de túhuà.","translation":"Em gái thích xem tranh nhiều màu."},{"id":"hsk3-T32-08","hanzi":"超级","pinyin":"chāojí","meaning":"siêu, cực kỳ","example":"这个游戏超级有意思。","examplePinyin":"Zhège yóuxì chāojí yǒu yìsi.","translation":"Trò chơi này cực kỳ thú vị."},{"id":"hsk3-T32-09","hanzi":"难度","pinyin":"nándù","meaning":"độ khó","example":"这次考试的难度比上次高。","examplePinyin":"Zhè cì kǎoshì de nándù bǐ shàng cì gāo.","translation":"Độ khó kỳ thi này cao hơn lần trước."},{"id":"hsk3-T32-10","hanzi":"形式","pinyin":"xíngshì","meaning":"hình thức","example":"老师用游戏的形式教我们汉语。","examplePinyin":"Lǎoshī yòng yóuxì de xíngshì jiāo wǒmen Hànyǔ.","translation":"Giáo viên dạy tiếng Trung cho chúng tôi bằng hình thức trò chơi."},{"id":"hsk3-T32-11","hanzi":"各自","pinyin":"gèzì","meaning":"riêng mình","example":"大家回到各自的办公室继续工作。","examplePinyin":"Dàjiā huí dào gèzì de bàngōngshì jìxù gōngzuò.","translation":"Mọi người về văn phòng riêng tiếp tục làm việc."},{"id":"hsk3-T32-12","hanzi":"全面","pinyin":"quánmiàn","meaning":"toàn diện","example":"我们需要全面了解这个问题。","examplePinyin":"Wǒmen xūyào quánmiàn liǎojiě zhège wèntí.","translation":"Chúng ta cần hiểu vấn đề này một cách toàn diện."},{"id":"hsk3-T32-13","hanzi":"形象","pinyin":"xíngxiàng","meaning":"hình tượng","example":"这本书里的熊猫形象很可爱。","examplePinyin":"Zhè běn shū lǐ de xióngmāo xíngxiàng hěn kě'ài.","translation":"Hình tượng gấu trúc trong cuốn sách rất đáng yêu."},{"id":"hsk3-T32-14","hanzi":"基本","pinyin":"jīběn","meaning":"cơ bản","example":"他已经学会了基本的汉语句子。","examplePinyin":"Tā yǐjīng xuéhuì le jīběn de Hànyǔ jùzi.","translation":"Anh ấy đã học được những câu tiếng Trung cơ bản."},{"id":"hsk3-T32-15","hanzi":"重","pinyin":"zhòng","meaning":"nặng","example":"这个箱子很重。","examplePinyin":"zhège xiāngzi hěn zhòng.","translation":"Chiếc va li này rất nặng."},{"id":"hsk3-T32-16","hanzi":"精彩","pinyin":"jīngcǎi","meaning":"đặc sắc","example":"昨晚的演出很精彩。","examplePinyin":"zuówǎn de yǎnchū hěn jīngcǎi.","translation":"Buổi biểu diễn tối qua rất đặc sắc."},{"id":"hsk3-T32-17","hanzi":"整整","pinyin":"zhěngzhěng","meaning":"tròn, đúng","example":"他整整等了两个小时。","examplePinyin":"Tā zhěngzhěng děng le liǎng ge xiǎoshí.","translation":"Anh ấy đợi tròn hai tiếng."},{"id":"hsk3-T32-18","hanzi":"坚强","pinyin":"jiānqiáng","meaning":"kiên cường","example":"她很坚强。","examplePinyin":"tā hěn jiānqiáng.","translation":"Cô ấy rất kiên cường."},{"id":"hsk3-T32-19","hanzi":"属","pinyin":"shǔ","meaning":"thuộc về, cầm tinh","example":"我妈妈属马，爸爸属羊。","examplePinyin":"Wǒ māma shǔ mǎ, bàba shǔ yáng.","translation":"Mẹ tôi tuổi Ngọ, bố tôi tuổi Mùi."},{"id":"hsk3-T32-20","hanzi":"力","pinyin":"lì","meaning":"sức lực","example":"我今天没有力气。","examplePinyin":"Wǒ jīntiān méiyǒu lìqi.","translation":"Hôm nay tôi không có sức."},{"id":"hsk3-T32-21","hanzi":"坚决","pinyin":"jiānjué","meaning":"kiên quyết","example":"他坚决反对这个计划。","examplePinyin":"Tā jiānjué fǎnduì zhège jìhuà.","translation":"Anh ấy kiên quyết phản đối kế hoạch này."},{"id":"hsk3-T32-22","hanzi":"通常","pinyin":"tōngcháng","meaning":"thông thường","example":"我通常早上学习新词。","examplePinyin":"Wǒ tōngcháng zǎoshang xuéxí xīn cí.","translation":"Tôi thường học từ mới vào buổi sáng."},{"id":"hsk3-T32-23","hanzi":"表面","pinyin":"biǎomiàn","meaning":"bề mặt","example":"桌子的表面很干净。","examplePinyin":"Zhuōzi de biǎomiàn hěn gānjìng.","translation":"Bề mặt chiếc bàn rất sạch."},{"id":"hsk3-T32-24","hanzi":"范围","pinyin":"fànwéi","meaning":"phạm vi","example":"这次考试的范围是第一课到第十课。","examplePinyin":"Zhè cì kǎoshì de fànwéi shì dì yī kè dào dì shí kè.","translation":"Phạm vi kỳ thi này là từ Bài 1 đến Bài 10."},{"id":"hsk3-T32-25","hanzi":"范围","pinyin":"fànwéi","meaning":"phạm vi (lặp theo nguồn)","example":"这家公司的服务范围包括三个城市。","examplePinyin":"Zhè jiā gōngsī de fúwù fànwéi bāokuò sān ge chéngshì.","translation":"Phạm vi dịch vụ của công ty này bao gồm ba thành phố."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/dac-diem/"},{"id":33,"name":"TÍNH TỪ","words":[{"id":"hsk3-T33-01","hanzi":"旧","pinyin":"jiù","meaning":"cũ","example":"这辆自行车很旧。","examplePinyin":"zhè liàng zìxíngchē hěn jiù.","translation":"Chiếc xe đạp này rất cũ."},{"id":"hsk3-T33-02","hanzi":"专门","pinyin":"zhuānmén","meaning":"chuyên biệt","example":"这家商店专门卖中文书。","examplePinyin":"Zhè jiā shāngdiàn zhuānmén mài Zhōngwén shū.","translation":"Cửa hàng này chuyên bán sách tiếng Trung."},{"id":"hsk3-T33-03","hanzi":"空","pinyin":"kōng","meaning":"trống","example":"这个房间很空。","examplePinyin":"zhège fángjiān hěn kōng.","translation":"Căn phòng này rất trống."},{"id":"hsk3-T33-04","hanzi":"美","pinyin":"měi","meaning":"đẹp","example":"这里的景色很美。","examplePinyin":"zhèlǐ de jǐngsè hěn měi.","translation":"Phong cảnh nơi đây rất đẹp."},{"id":"hsk3-T33-05","hanzi":"落后","pinyin":"luòhòu","meaning":"lạc hậu","example":"这个地方的交通很落后。","examplePinyin":"zhège dìfang de jiāotōng hěn luòhòu.","translation":"Giao thông nơi này rất lạc hậu."},{"id":"hsk3-T33-06","hanzi":"麻烦","pinyin":"máfan","meaning":"phiền phức","example":"这些手续很麻烦。","examplePinyin":"zhèxiē shǒuxù hěn máfan.","translation":"Những thủ tục này rất phiền phức."},{"id":"hsk3-T33-07","hanzi":"没用","pinyin":"méiyòng","meaning":"vô dụng","example":"这个方法很没用。","examplePinyin":"zhège fāngfǎ hěn méiyòng.","translation":"Phương pháp này rất vô dụng."},{"id":"hsk3-T33-08","hanzi":"美好","pinyin":"měihǎo","meaning":"tốt đẹp","example":"我们的生活很美好。","examplePinyin":"wǒmen de shēnghuó hěn měihǎo.","translation":"Cuộc sống của chúng ta rất tốt đẹp."},{"id":"hsk3-T33-09","hanzi":"强烈","pinyin":"qiángliè","meaning":"mãnh liệt","example":"我有一种强烈的感觉。","examplePinyin":"Wǒ yǒu yì zhǒng qiángliè de gǎnjué.","translation":"Tôi có một cảm giác mãnh liệt."},{"id":"hsk3-T33-10","hanzi":"容易","pinyin":"róngyì","meaning":"dễ","example":"这道题很容易。","examplePinyin":"zhè dào tí hěn róngyì.","translation":"Câu này rất dễ."},{"id":"hsk3-T33-11","hanzi":"重","pinyin":"zhòng","meaning":"nặng","example":"这个箱子很重。","examplePinyin":"zhège xiāngzi hěn zhòng.","translation":"Chiếc va li này rất nặng."},{"id":"hsk3-T33-12","hanzi":"简单","pinyin":"jiǎndān","meaning":"đơn giản","example":"这个问题很简单。","examplePinyin":"zhège wèntí hěn jiǎndān.","translation":"Câu hỏi này rất đơn giản."},{"id":"hsk3-T33-13","hanzi":"紧","pinyin":"jǐn","meaning":"chặt","example":"这双鞋很紧。","examplePinyin":"zhè shuāng xié hěn jǐn.","translation":"Đôi giày này rất chặt."},{"id":"hsk3-T33-14","hanzi":"重大","pinyin":"zhòngdà","meaning":"trọng đại","example":"这个决定对他的将来有重大影响。","examplePinyin":"Zhège juédìng duì tā de jiānglái yǒu zhòngdà yǐngxiǎng.","translation":"Quyết định này có ảnh hưởng trọng đại đến tương lai anh ấy."},{"id":"hsk3-T33-15","hanzi":"齐","pinyin":"qí","meaning":"đều, đủ","example":"所有学生都到齐了。","examplePinyin":"Suǒyǒu xuésheng dōu dào qí le.","translation":"Tất cả học sinh đã đến đông đủ."},{"id":"hsk3-T33-16","hanzi":"乱","pinyin":"luàn","meaning":"bừa bãi","example":"弟弟的房间很乱。","examplePinyin":"dìdi de fángjiān hěn luàn.","translation":"Phòng em trai rất bừa bãi."},{"id":"hsk3-T33-17","hanzi":"积极","pinyin":"jījí","meaning":"tích cực","example":"这位学生很积极。","examplePinyin":"zhè wèi xuésheng hěn jījí.","translation":"Học sinh này rất tích cực."},{"id":"hsk3-T33-18","hanzi":"和平","pinyin":"hépíng","meaning":"hòa bình","example":"大家都希望世界和平。","examplePinyin":"Dàjiā dōu xīwàng shìjiè hépíng.","translation":"Mọi người đều mong thế giới hòa bình."},{"id":"hsk3-T33-19","hanzi":"有利","pinyin":"yǒulì","meaning":"có lợi","example":"这个方法对学习汉语很有利。","examplePinyin":"Zhège fāngfǎ duì xuéxí Hànyǔ hěn yǒulì.","translation":"Phương pháp này rất có lợi cho việc học tiếng Trung."},{"id":"hsk3-T33-20","hanzi":"广大","pinyin":"guǎngdà","meaning":"rộng lớn, đông đảo","example":"广大观众都很喜欢这场演出。","examplePinyin":"Guǎngdà guānzhòng dōu hěn xǐhuan zhè chǎng yǎnchū.","translation":"Đông đảo khán giả rất thích buổi biểu diễn này."},{"id":"hsk3-T33-21","hanzi":"生动","pinyin":"shēngdòng","meaning":"sinh động","example":"这个故事很生动。","examplePinyin":"zhège gùshi hěn shēngdòng.","translation":"Câu chuyện này rất sinh động."},{"id":"hsk3-T33-22","hanzi":"热烈","pinyin":"rèliè","meaning":"nồng nhiệt","example":"大家正在热烈讨论这个问题。","examplePinyin":"Dàjiā zhèngzài rèliè tǎolùn zhège wèntí.","translation":"Mọi người đang thảo luận sôi nổi vấn đề này."},{"id":"hsk3-T33-23","hanzi":"通常","pinyin":"tōngcháng","meaning":"thông thường","example":"我通常早上学习新词。","examplePinyin":"Wǒ tōngcháng zǎoshang xuéxí xīn cí.","translation":"Tôi thường học từ mới vào buổi sáng."},{"id":"hsk3-T33-24","hanzi":"暖和","pinyin":"nuǎnhuo","meaning":"ấm áp","example":"今天的天气很暖和。","examplePinyin":"jīntiān de tiānqì hěn nuǎnhuo.","translation":"Thời tiết hôm nay rất ấm áp."},{"id":"hsk3-T33-25","hanzi":"古","pinyin":"gǔ","meaning":"cổ, xưa","example":"这座桥很古。","examplePinyin":"zhè zuò qiáo hěn gǔ.","translation":"Cây cầu này rất cổ, xưa."},{"id":"hsk3-T33-26","hanzi":"美丽","pinyin":"měilì","meaning":"đẹp đẽ","example":"这座城市很美丽。","examplePinyin":"zhè zuò chéngshì hěn měilì.","translation":"Thành phố này rất đẹp đẽ."},{"id":"hsk3-T33-27","hanzi":"光明","pinyin":"guāngmíng","meaning":"tươi sáng","example":"我们的将来很光明。","examplePinyin":"wǒmen de jiānglái hěn guāngmíng.","translation":"Tương lai của chúng ta rất tươi sáng."},{"id":"hsk3-T33-28","hanzi":"温暖","pinyin":"wēnnuǎn","meaning":"ấm áp","example":"这个房间很温暖。","examplePinyin":"zhège fángjiān hěn wēnnuǎn.","translation":"Căn phòng này rất ấm áp."},{"id":"hsk3-T33-29","hanzi":"伟大","pinyin":"wěidà","meaning":"vĩ đại","example":"她是一位伟大的母亲。","examplePinyin":"Tā shì yí wèi wěidà de mǔqīn.","translation":"Cô ấy là một người mẹ vĩ đại."},{"id":"hsk3-T33-30","hanzi":"正","pinyin":"zhèng","meaning":"đang, đúng","example":"今天我们学习“正”这个词。","examplePinyin":"Jīntiān wǒmen xuéxí “zhèng” zhège cí.","translation":"Hôm nay chúng tôi học từ “正” (đang)."},{"id":"hsk3-T33-31","hanzi":"复杂","pinyin":"fùzá","meaning":"phức tạp","example":"这个问题很复杂。","examplePinyin":"zhège wèntí hěn fùzá.","translation":"Vấn đề này rất phức tạp."},{"id":"hsk3-T33-32","hanzi":"直","pinyin":"zhí","meaning":"thẳng","example":"这条路很直。","examplePinyin":"zhè tiáo lù hěn zhí.","translation":"Con đường này rất thẳng."},{"id":"hsk3-T33-33","hanzi":"丰富","pinyin":"fēngfù","meaning":"phong phú","example":"这里的文化很丰富。","examplePinyin":"zhèlǐ de wénhuà hěn fēngfù.","translation":"Văn hóa nơi đây rất phong phú."},{"id":"hsk3-T33-34","hanzi":"强大","pinyin":"qiángdà","meaning":"mạnh mẽ","example":"这支队伍很强大。","examplePinyin":"zhè zhī duìwu hěn qiángdà.","translation":"Đội này rất mạnh mẽ."},{"id":"hsk3-T33-35","hanzi":"必然","pinyin":"bìrán","meaning":"tất yếu","example":"我觉得这个办法很必然。","examplePinyin":"Wǒ juéde zhège bànfǎ hěn bìrán.","translation":"Tôi thấy cách này rất tất yếu."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/tinh-tu/"},{"id":34,"name":"QUẦN ÁO VÀ PHỤ KIỆN","words":[{"id":"hsk3-T34-01","hanzi":"理发","pinyin":"lǐfà","meaning":"cắt tóc","example":"我明天要去理发。","examplePinyin":"Wǒ míngtiān yào qù lǐfà.","translation":"Ngày mai tôi đi cắt tóc."},{"id":"hsk3-T34-02","hanzi":"深","pinyin":"shēn","meaning":"sâu","example":"这条河很深，不能在这里游泳。","examplePinyin":"Zhè tiáo hé hěn shēn, bù néng zài zhèlǐ yóuyǒng.","translation":"Con sông này rất sâu, không được bơi ở đây."},{"id":"hsk3-T34-03","hanzi":"行李","pinyin":"xíngli","meaning":"hành lý","example":"我的行李很重。","examplePinyin":"wǒ de xíngli hěn zhòng.","translation":"Hành lý của tôi rất nặng."},{"id":"hsk3-T34-04","hanzi":"上衣","pinyin":"shàngyī","meaning":"áo ngoài","example":"我昨天买了上衣。","examplePinyin":"Wǒ zuótiān mǎi le shàngyī.","translation":"Hôm qua tôi đã mua áo ngoài."},{"id":"hsk3-T34-05","hanzi":"被子","pinyin":"bèizi","meaning":"chăn","example":"我把被子带回家了。","examplePinyin":"Wǒ bǎ bèizi dài huí jiā le.","translation":"Tôi đã mang chăn về nhà."},{"id":"hsk3-T34-06","hanzi":"皮包","pinyin":"píbāo","meaning":"túi da","example":"你喜欢皮包吗？","examplePinyin":"Nǐ xǐhuan píbāo ma?","translation":"Bạn có thích túi da không?"},{"id":"hsk3-T34-07","hanzi":"短裤","pinyin":"duǎnkù","meaning":"quần short","example":"夏天我常穿短裤。","examplePinyin":"xiàtiān wǒ cháng chuān duǎnkù.","translation":"Mùa hè tôi thường mặc quần soóc."},{"id":"hsk3-T34-08","hanzi":"服装","pinyin":"fúzhuāng","meaning":"trang phục","example":"商店里有各种服装。","examplePinyin":"Shāngdiàn lǐ yǒu gèzhǒng fúzhuāng.","translation":"Cửa hàng có nhiều loại trang phục."},{"id":"hsk3-T34-09","hanzi":"衣架","pinyin":"yījià","meaning":"móc treo quần áo","example":"我们需要一些衣架。","examplePinyin":"Wǒmen xūyào yìxiē yījià.","translation":"Chúng ta cần một ít móc treo quần áo."},{"id":"hsk3-T34-10","hanzi":"裙子","pinyin":"qúnzi","meaning":"váy","example":"妹妹买了一条裙子。","examplePinyin":"mèimei mǎi le yì tiáo qúnzi.","translation":"Em gái mua một chiếc váy."},{"id":"hsk3-T34-11","hanzi":"衬衣","pinyin":"chènyī","meaning":"áo sơ mi","example":"我想看看不同的衬衣。","examplePinyin":"Wǒ xiǎng kànkan bùtóng de chènyī.","translation":"Tôi muốn xem những loại áo sơ mi khác nhau."},{"id":"hsk3-T34-12","hanzi":"衬衫","pinyin":"chènshān","meaning":"áo sơ mi","example":"今天我第一次见到衬衫。","examplePinyin":"Jīntiān wǒ dì yī cì jiàndào chènshān.","translation":"Hôm nay tôi lần đầu thấy áo sơ mi."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/quan-ao-va-phu-kien/"},{"id":35,"name":"TỪ CHỨC NĂNG I","words":[{"id":"hsk3-T35-01","hanzi":"把","pinyin":"bǎ","meaning":"giới từ 把","example":"请把你的书放在桌子上。","examplePinyin":"Qǐng bǎ nǐ de shū fàng zài zhuōzi shang.","translation":"Hãy đặt sách của bạn lên bàn."},{"id":"hsk3-T35-02","hanzi":"被","pinyin":"bèi","meaning":"bị, được","example":"我的自行车被弟弟骑走了。","examplePinyin":"Wǒ de zìxíngchē bèi dìdi qí zǒu le.","translation":"Xe đạp của tôi bị em trai lấy đi mất."},{"id":"hsk3-T35-03","hanzi":"为","pinyin":"wèi","meaning":"vì, cho","example":"我为妈妈准备了一份生日礼物。","examplePinyin":"Wǒ wèi māma zhǔnbèi le yí fèn shēngrì lǐwù.","translation":"Tôi chuẩn bị một món quà sinh nhật cho mẹ."},{"id":"hsk3-T35-04","hanzi":"极了","pinyin":"jí le","meaning":"cực kỳ, vô cùng","example":"今天的天气好极了。","examplePinyin":"Jīntiān de tiānqì hǎo jí le.","translation":"Thời tiết hôm nay đẹp vô cùng."},{"id":"hsk3-T35-05","hanzi":"按","pinyin":"àn","meaning":"theo, dựa theo","example":"请按老师说的方法练习。","examplePinyin":"Qǐng àn lǎoshī shuō de fāngfǎ liànxí.","translation":"Hãy luyện tập theo cách giáo viên nói."},{"id":"hsk3-T35-06","hanzi":"难道","pinyin":"nándào","meaning":"chẳng lẽ","example":"难道你今天不去学校吗？","examplePinyin":"Nándào nǐ jīntiān bú qù xuéxiào ma?","translation":"Chẳng lẽ hôm nay bạn không đi học sao?"},{"id":"hsk3-T35-07","hanzi":"并","pinyin":"bìng","meaning":"hoàn toàn không","example":"我并不觉得这道题很难。","examplePinyin":"Wǒ bìng bù juéde zhè dào tí hěn nán.","translation":"Tôi hoàn toàn không thấy câu này khó."},{"id":"hsk3-T35-08","hanzi":"并且","pinyin":"bìngqiě","meaning":"hơn nữa","example":"他会说汉语，并且会说英语。","examplePinyin":"Tā huì shuō Hànyǔ, bìngqiě huì shuō Yīngyǔ.","translation":"Anh ấy biết nói tiếng Trung và còn biết nói tiếng Anh."},{"id":"hsk3-T35-09","hanzi":"就是","pinyin":"jiùshì","meaning":"chính là","example":"站在门口的人就是我哥哥。","examplePinyin":"Zhàn zài ménkǒu de rén jiùshì wǒ gēge.","translation":"Người đứng ở cửa chính là anh trai tôi."},{"id":"hsk3-T35-10","hanzi":"不得不","pinyin":"bùdébù","meaning":"buộc phải","example":"下大雨了，我们不得不取消比赛。","examplePinyin":"Xià dà yǔ le, wǒmen bùdébù qǔxiāo bǐsài.","translation":"Mưa lớn rồi, chúng tôi buộc phải hủy cuộc thi."},{"id":"hsk3-T35-11","hanzi":"不必","pinyin":"búbì","meaning":"không cần","example":"你不必这么着急，还有时间。","examplePinyin":"Nǐ búbì zhème zháojí, hái yǒu shíjiān.","translation":"Bạn không cần vội vậy, vẫn còn thời gian."},{"id":"hsk3-T35-12","hanzi":"干吗","pinyin":"gànmá","meaning":"làm gì, tại sao","example":"你干吗把手机放在这里？","examplePinyin":"Nǐ gànmá bǎ shǒujī fàng zài zhèlǐ?","translation":"Sao bạn lại đặt điện thoại ở đây?"},{"id":"hsk3-T35-13","hanzi":"各位","pinyin":"gèwèi","meaning":"quý vị","example":"各位同学，今天我们学习新词。","examplePinyin":"Gèwèi tóngxué, jīntiān wǒmen xuéxí xīn cí.","translation":"Các bạn học sinh, hôm nay chúng ta học từ mới."},{"id":"hsk3-T35-14","hanzi":"各种","pinyin":"gèzhǒng","meaning":"các loại","example":"这家商店有各种颜色的衣服。","examplePinyin":"Zhè jiā shāngdiàn yǒu gèzhǒng yánsè de yīfu.","translation":"Cửa hàng này có quần áo đủ các màu sắc."},{"id":"hsk3-T35-15","hanzi":"必要","pinyin":"bìyào","meaning":"cần thiết","example":"如果没有必要，就不用买。","examplePinyin":"Rúguǒ méiyǒu bìyào, jiù búyòng mǎi.","translation":"Nếu không cần thiết thì không cần mua."},{"id":"hsk3-T35-16","hanzi":"已","pinyin":"yǐ","meaning":"đã","example":"今天的会议已结束。","examplePinyin":"Jīntiān de huìyì yǐ jiéshù.","translation":"Cuộc họp hôm nay đã kết thúc."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/tu-chuc-nang-i/"},{"id":36,"name":"TỪ CHỨC NĂNG II","words":[{"id":"hsk3-T36-01","hanzi":"按照","pinyin":"ànzhào","meaning":"theo, dựa theo","example":"请按照地图上的路线走。","examplePinyin":"Qǐng ànzhào dìtú shang de lùxiàn zǒu.","translation":"Hãy đi theo lộ trình trên bản đồ."},{"id":"hsk3-T36-02","hanzi":"不论","pinyin":"búlùn","meaning":"bất kể","example":"不论天气怎么样，他都去跑步。","examplePinyin":"Búlùn tiānqì zěnmeyàng, tā dōu qù pǎobù.","translation":"Bất kể thời tiết thế nào, anh ấy đều chạy bộ."},{"id":"hsk3-T36-03","hanzi":"缺","pinyin":"quē","meaning":"thiếu","example":"这次会议还缺两个人。","examplePinyin":"Zhè cì huìyì hái quē liǎng ge rén.","translation":"Cuộc họp này vẫn thiếu hai người."},{"id":"hsk3-T36-04","hanzi":"缺少","pinyin":"quēshǎo","meaning":"thiếu hụt","example":"他缺少工作经验。","examplePinyin":"Tā quēshǎo gōngzuò jīngyàn.","translation":"Anh ấy thiếu kinh nghiệm làm việc."},{"id":"hsk3-T36-05","hanzi":"各","pinyin":"gè","meaning":"mỗi, các","example":"各班都要参加比赛。","examplePinyin":"Gè bān dōu yào cānjiā bǐsài.","translation":"Các lớp đều phải tham gia cuộc thi."},{"id":"hsk3-T36-06","hanzi":"连","pinyin":"lián","meaning":"ngay cả","example":"这道题连老师都觉得难。","examplePinyin":"Zhè dào tí lián lǎoshī dōu juéde nán.","translation":"Ngay cả giáo viên cũng thấy câu này khó."},{"id":"hsk3-T36-07","hanzi":"属于","pinyin":"shǔyú","meaning":"thuộc về","example":"这本书属于学校图书馆。","examplePinyin":"Zhè běn shū shǔyú xuéxiào túshūguǎn.","translation":"Cuốn sách này thuộc về thư viện của trường."},{"id":"hsk3-T36-08","hanzi":"赶紧","pinyin":"gǎnjǐn","meaning":"mau chóng","example":"快下雨了，赶紧回家吧！","examplePinyin":"Kuài xià yǔ le, gǎnjǐn huí jiā ba!","translation":"Sắp mưa rồi, mau về nhà thôi!"},{"id":"hsk3-T36-09","hanzi":"到底","pinyin":"dàodǐ","meaning":"rốt cuộc","example":"你到底想去哪里？","examplePinyin":"Nǐ dàodǐ xiǎng qù nǎlǐ?","translation":"Rốt cuộc bạn muốn đi đâu?"},{"id":"hsk3-T36-10","hanzi":"能不能","pinyin":"néng bu néng","meaning":"có thể hay không","example":"你能不能早点儿来？","examplePinyin":"Nǐ néng bu néng zǎodiǎnr lái?","translation":"Bạn có thể đến sớm hơn không?"},{"id":"hsk3-T36-11","hanzi":"不光","pinyin":"bùguāng","meaning":"không chỉ","example":"他不光会唱歌，还会跳舞。","examplePinyin":"Tā bùguāng huì chànggē, hái huì tiàowǔ.","translation":"Anh ấy không chỉ biết hát mà còn biết nhảy."},{"id":"hsk3-T36-12","hanzi":"不仅","pinyin":"bùjǐn","meaning":"không những","example":"她不仅聪明，而且很努力。","examplePinyin":"Tā bùjǐn cōngming, érqiě hěn nǔlì.","translation":"Cô ấy không chỉ thông minh mà còn chăm chỉ."},{"id":"hsk3-T36-13","hanzi":"自从","pinyin":"zìcóng","meaning":"kể từ khi","example":"自从开始工作以后，他每天都很忙。","examplePinyin":"Zìcóng kāishǐ gōngzuò yǐhòu, tā měitiān dōu hěn máng.","translation":"Kể từ khi đi làm, ngày nào anh ấy cũng bận."},{"id":"hsk3-T36-14","hanzi":"仍然","pinyin":"réngrán","meaning":"vẫn","example":"虽然下雨了，他仍然去跑步。","examplePinyin":"Suīrán xià yǔ le, tā réngrán qù pǎobù.","translation":"Dù trời mưa, anh ấy vẫn đi chạy bộ."},{"id":"hsk3-T36-15","hanzi":"事实上","pinyin":"shìshí shang","meaning":"trên thực tế","example":"事实上，这个问题并不难。","examplePinyin":"Shìshí shang, zhège wèntí bìng bù nán.","translation":"Thực ra, vấn đề này không khó."},{"id":"hsk3-T36-16","hanzi":"本来","pinyin":"běnlái","meaning":"vốn dĩ","example":"我本来想去北京，可是没有时间。","examplePinyin":"Wǒ běnlái xiǎng qù Běijīng, kěshì méiyǒu shíjiān.","translation":"Vốn dĩ tôi muốn đến Bắc Kinh nhưng không có thời gian."},{"id":"hsk3-T36-17","hanzi":"要是","pinyin":"yàoshi","meaning":"nếu như","example":"要是明天不下雨，我们就去公园。","examplePinyin":"Yàoshi míngtiān bú xià yǔ, wǒmen jiù qù gōngyuán.","translation":"Nếu mai không mưa, chúng ta sẽ đi công viên."},{"id":"hsk3-T36-18","hanzi":"只有","pinyin":"zhǐyǒu","meaning":"chỉ khi, chỉ có","example":"只有认真学习，才能提高成绩。","examplePinyin":"Zhǐyǒu rènzhēn xuéxí, cái néng tígāo chéngjì.","translation":"Chỉ khi học chăm chỉ mới có thể cải thiện thành tích."},{"id":"hsk3-T36-19","hanzi":"另外","pinyin":"lìngwài","meaning":"ngoài ra","example":"我买了两本书，另外还买了一支笔。","examplePinyin":"Wǒ mǎi le liǎng běn shū, lìngwài hái mǎi le yì zhī bǐ.","translation":"Tôi mua hai cuốn sách, ngoài ra còn mua một cây bút."},{"id":"hsk3-T36-20","hanzi":"将近","pinyin":"jiāngjìn","meaning":"gần, xấp xỉ","example":"我们等了将近两个小时。","examplePinyin":"Wǒmen děng le jiāngjìn liǎng ge xiǎoshí.","translation":"Chúng tôi đợi gần hai tiếng."},{"id":"hsk3-T36-21","hanzi":"其次","pinyin":"qícì","meaning":"thứ hai, tiếp theo","example":"首先复习生词，其次练习造句。","examplePinyin":"Shǒuxiān fùxí shēngcí, qícì liànxí zàojù.","translation":"Trước tiên ôn từ mới, tiếp theo luyện đặt câu."},{"id":"hsk3-T36-22","hanzi":"仍","pinyin":"réng","meaning":"vẫn","example":"会议结束了，但是经理仍在工作。","examplePinyin":"Huìyì jiéshù le, dànshì jīnglǐ réng zài gōngzuò.","translation":"Cuộc họp đã xong nhưng giám đốc vẫn đang làm việc."},{"id":"hsk3-T36-23","hanzi":"直到","pinyin":"zhídào","meaning":"cho đến khi","example":"我直到晚上十点才回家。","examplePinyin":"Wǒ zhídào wǎnshang shí diǎn cái huí jiā.","translation":"Mãi đến mười giờ tối tôi mới về nhà."},{"id":"hsk3-T36-24","hanzi":"如何","pinyin":"rúhé","meaning":"như thế nào","example":"老师告诉我们如何提高听力。","examplePinyin":"Lǎoshī gàosu wǒmen rúhé tígāo tīnglì.","translation":"Giáo viên chỉ chúng tôi cách nâng cao kỹ năng nghe."},{"id":"hsk3-T36-25","hanzi":"由于","pinyin":"yóuyú","meaning":"do, bởi vì","example":"由于天气不好，比赛取消了。","examplePinyin":"Yóuyú tiānqì bù hǎo, bǐsài qǔxiāo le.","translation":"Do thời tiết xấu nên cuộc thi bị hủy."},{"id":"hsk3-T36-26","hanzi":"当中","pinyin":"dāngzhōng","meaning":"trong số","example":"这十个人当中，有三个人是老师。","examplePinyin":"Zhè shí ge rén dāngzhōng, yǒu sān ge rén shì lǎoshī.","translation":"Trong mười người này có ba người là giáo viên."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/tu-chuc-nang-ii/"}];

if(typeof window.topicOpen==='function'){

}
if(typeof window.topicMode==='function'){
 const originalMode=window.topicMode;
 window.topicMode=function(m){const result=originalMode(m);ensureTopicBack();return result};
}
// Unit flashcards: separate All / Known / Unknown, while keeping existing storage keys.
window.hskUnitFlashFilter='all';
window.hskSetUnitFlashFilter=function(value){window.hskUnitFlashFilter=value;flashIndex=0;flipped=false;renderFlash()};
window.renderFlash=function(){
 const all=lesson.words;
 const knownCount=all.filter(w=>!!store.known[w.id]).length;
 const f=window.hskUnitFlashFilter||'all';
 const list=all.filter(w=>f==='all'||(f==='known'?!!store.known[w.id]:!store.known[w.id]));
 if(flashIndex>=list.length)flashIndex=0;
 const w=list[flashIndex];const root=document.getElementById('content');if(!root)return;
 root.innerHTML='<div class="hsk-unit-flash-filters">'+[
 ['all','Tất cả ('+all.length+')'],['known','Đã thuộc ('+knownCount+')'],['unknown','Chưa thuộc ('+(all.length-knownCount)+')']
 ].map(([id,label])=>'<button type="button" class="'+(f===id?'active':'')+'" data-filter="'+id+'">'+label+'</button>').join('')+'</div>'+
 (!w?'<div class="panel">Không có từ nào trong nhóm này. Bạn có thể chọn nhóm khác ở phía trên.</div>':
 '<div class="panel flash" id="hskUnitFlashCard" role="button" tabindex="0"><div class="muted">Thẻ '+(flashIndex+1)+'/'+list.length+' · Nhấn để lật</div><div class="hanzi big">'+esc(w.hanzi)+'</div>'+
 (flipped?'<h2>'+esc(w.pinyin)+'</h2><h3>'+esc(w.meaning)+'</h3><div class="hsk-unit-flash-example">'+esc(w.example)+'</div><p class="hsk-unit-flash-translation">'+esc(w.translation)+'</p>':'<p class="muted">Chạm để xem nghĩa và ví dụ</p>')+'</div>'+
 '<div class="toolbar" id="hskUnitFlashActions"><button data-action="listen">🔊 Nghe</button><button data-action="prev">← Trước</button><button data-action="mark">'+(store.known[w.id]?'✓ Đã thuộc · Bỏ đánh dấu':'○ Đánh dấu đã thuộc')+'</button><button data-action="shuffle">🔀 Trộn thẻ</button><button class="primary" data-action="next">Tiếp →</button></div>');
 root.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>window.hskSetUnitFlashFilter(b.dataset.filter)));
 if(!w)return;
 const flip=()=>{flipped=!flipped;renderFlash()};
 const card=root.querySelector('#hskUnitFlashCard');card.addEventListener('click',flip);
 card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
 root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
 switch(b.dataset.action){
 case 'listen':speak(w.hanzi);break;
 case 'prev':flashIndex=Math.max(0,flashIndex-1);flipped=false;renderFlash();break;
 case 'next':flashIndex=(flashIndex+1)%list.length;flipped=false;renderFlash();break;
 case 'mark':store.known[w.id]=!store.known[w.id];save();if(f!=='all'&&flashIndex>=list.length-1)flashIndex=0;renderFlash();break;
 case 'shuffle':lesson.words.sort(()=>Math.random()-.5);flashIndex=0;flipped=false;renderFlash();break;
 }
 }));
};
// Reset filter when opening a new lesson, not on every flashcard flip.
if(typeof window.openLesson==='function'){
 const oldOpenLesson=window.openLesson;
 window.openLesson=function(id,t='words'){window.hskUnitFlashFilter='all';return oldOpenLesson(id,t)};
}
// Topic flashcards: promote the example text to a large, clearly separated block.
if(typeof window.topicFlash==='function'){
 const oldTopicFlash=window.topicFlash;
 window.topicFlash=function(){const result=oldTopicFlash();const flash=document.querySelector('#topicRoot .topic-flash');
 if(flash){const paragraphs=[...flash.querySelectorAll('p.topic-muted')];const example=paragraphs.find(p=>p.textContent.includes(' — '));if(example){const parts=example.textContent.split(' — ');const zh=parts.shift();example.textContent='';const z=document.createElement('div');z.className='hsk-topic-flash-example';z.textContent=zh;const vi=document.createElement('div');vi.className='hsk-topic-flash-translation';vi.textContent=parts.join(' — ');example.append(z,vi)}}return result};
}
})();

</script><script>window.HSK3_UPDATE={"grammarQuestions":[{"id":"H3-G01-01-01","lesson":1,"point":0,"question":"他们＿＿＿有点儿像。","answer":"看上去","options":["看上去","的","了","吗"],"sentence":"他们看上去有点儿像。","pinyin":"tā men kàn shàng qù yǒu diǎn ér xiàng","translation":"Họ trông có vẻ hơi giống nhau.","explanation":"S + 看上去/看起来 + (hěn/bù) + Tính từ/Cụm từ — Cấu trúc này dùng để diễn tả ấn tượng hoặc nhận xét về vẻ bề ngoài của người hoặc sự vật. Nó có nghĩa tương đương với \"trông có vẻ\", \"nhìn có vẻ\" trong tiếng Việt."},{"id":"H3-G01-01-02","lesson":1,"point":0,"question":"这些菜＿＿＿都很好吃。","answer":"看起来","options":["看起来","的","了","吗"],"sentence":"这些菜看起来都很好吃。","pinyin":"zhè xiē cài kàn qǐ lái dōu hěn hǎo chī","translation":"Những món ăn này trông đều rất ngon.","explanation":"S + 看上去/看起来 + (hěn/bù) + Tính từ/Cụm từ — Cấu trúc này dùng để diễn tả ấn tượng hoặc nhận xét về vẻ bề ngoài của người hoặc sự vật. Nó có nghĩa tương đương với \"trông có vẻ\", \"nhìn có vẻ\" trong tiếng Việt."},{"id":"H3-G01-02-01","lesson":1,"point":1,"question":"我好像在＿＿＿看到过这个箱子。","answer":"哪儿","options":["哪儿","的","了","吗"],"sentence":"我好像在哪儿看到过这个箱子。","pinyin":"wǒ hǎo xiàng zài nǎ ér kàn dào guò zhè gè xiāng zi","translation":"Tôi hình như đã thấy cái vali này ở đâu đó rồi.","explanation":"Đại từ nghi vấn (谁, 什么, 哪儿, 怎么) + ... — Trong tiếng Trung, các đại từ nghi vấn không chỉ dùng để hỏi mà còn có thể chỉ một đối tượng, địa điểm hoặc cách thức không xác định. Cách dùng này mang nghĩa tương đương với các từ như \"ai đó\", \"cái gì đó\" hoặc \"đâu đó\" trong tiếng Việt."},{"id":"H3-G01-02-02","lesson":1,"point":1,"question":"你吃点儿＿＿＿再走吧。","answer":"什么","options":["什么","的","了","吗"],"sentence":"你吃点儿什么再走吧。","pinyin":"nǐ chī diǎn ér shén me zài zǒu ba","translation":"Bạn ăn chút gì đó rồi hãy đi nhé.","explanation":"Đại từ nghi vấn (谁, 什么, 哪儿, 怎么) + ... — Trong tiếng Trung, các đại từ nghi vấn không chỉ dùng để hỏi mà còn có thể chỉ một đối tượng, địa điểm hoặc cách thức không xác định. Cách dùng này mang nghĩa tương đương với các từ như \"ai đó\", \"cái gì đó\" hoặc \"đâu đó\" trong tiếng Việt."},{"id":"H3-G01-03-01","lesson":1,"point":2,"question":"李文是那个穿着黑衣服＿＿＿短头发的年轻人吗？","answer":"的","options":["的","了","吗","呢"],"sentence":"李文是那个穿着黑衣服的短头发的年轻人吗？","pinyin":"lǐ wén shì nà gè chuān zhe hēi yī fú de duǎn tóu fā de nián qīng rén ma","translation":"Lý Văn có phải là chàng thanh niên tóc ngắn mặc áo đen kia không?","explanation":"Định ngữ 1 + 的 + Định ngữ 2 + 的 + Danh từ — Trong tiếng Trung, bạn có thể dùng nhiều cụm từ để bổ nghĩa cho một danh từ. Nếu các định ngữ dài hoặc mang tính chất khác nhau, chúng ta thường thêm 「的」 sau mỗi định ngữ để làm rõ ý nghĩa. Cấu trúc này giúp miêu tả người hoặc vật một cách chi tiết và cụ thể hơn."},{"id":"H3-G01-03-02","lesson":1,"point":2,"question":"昨天和家月一起看电影＿＿＿两个人是我的朋友。","answer":"的","options":["的","了","吗","呢"],"sentence":"昨天和家月一起看电影的两个人是我的朋友。","pinyin":"zuó tiān hé jiā yuè yī qǐ kàn diàn yǐng de liǎng gè rén shì wǒ de péng yǒu","translation":"Hai người cùng đi xem phim với Gia Nguyệt hôm qua là bạn của tôi.","explanation":"Định ngữ 1 + 的 + Định ngữ 2 + 的 + Danh từ — Trong tiếng Trung, bạn có thể dùng nhiều cụm từ để bổ nghĩa cho một danh từ. Nếu các định ngữ dài hoặc mang tính chất khác nhau, chúng ta thường thêm 「的」 sau mỗi định ngữ để làm rõ ý nghĩa. Cấu trúc này giúp miêu tả người hoặc vật một cách chi tiết và cụ thể hơn."},{"id":"H3-G02-01-01","lesson":2,"point":0,"question":"我现在还真是＿＿＿饿又渴。","answer":"又","options":["又","的","了","吗"],"sentence":"我现在还真是又饿又渴。","pinyin":"wǒ xiàn zài hái zhēn shì yòu è yòu kě","translation":"Bây giờ tôi thực sự vừa đói vừa khát.","explanation":"又 + tính từ + 又 + tính từ — Cấu trúc 「又...又...」 được dùng để liệt kê hai đặc điểm, tính chất hoặc trạng thái cùng tồn tại ở một sự vật, hiện tượng. Trong tiếng Việt, nó tương đương với cấu trúc \"vừa... vừa...\" để mô tả song song các tính chất."},{"id":"H3-G02-01-02","lesson":2,"point":0,"question":"那个女孩儿＿＿＿高又漂亮。","answer":"又","options":["又","的","了","吗"],"sentence":"那个女孩儿又高又漂亮。","pinyin":"nà gè nǚ hái ér yòu gāo yòu piào liàng","translation":"Cô gái kia vừa cao vừa xinh đẹp.","explanation":"又 + tính từ + 又 + tính từ — Cấu trúc 「又...又...」 được dùng để liệt kê hai đặc điểm, tính chất hoặc trạng thái cùng tồn tại ở một sự vật, hiện tượng. Trong tiếng Việt, nó tương đương với cấu trúc \"vừa... vừa...\" để mô tả song song các tính chất."},{"id":"H3-G02-02-01","lesson":2,"point":1,"question":"哪个菜＿＿＿好吃。","answer":"都","options":["都","的","了","吗"],"sentence":"哪个菜都好吃。","pinyin":"nǎ gè cài dōu hǎo chī","translation":"Món nào cũng đều ngon cả.","explanation":"Đại từ nghi vấn (谁/什么/哪儿...) + 都/也 + (不/没) + Động từ/Tính từ — Cấu trúc này dùng để diễn tả ý nghĩa bao quát như \"bất cứ ai/cái gì/nơi nào... cũng không\". Nó giúp nhấn mạnh việc không có bất kỳ đối tượng nào ngoại lệ trong phạm vi được nhắc đến."},{"id":"H3-G02-02-02","lesson":2,"point":1,"question":"这次旅游，我去＿＿＿都可以。","answer":"哪儿","options":["哪儿","的","了","吗"],"sentence":"这次旅游，我去哪儿都可以。","pinyin":"zhè cì lǚ yóu wǒ qù nǎ ér dōu kě yǐ","translation":"Chuyến du lịch lần này, tôi đi đâu cũng được.","explanation":"Đại từ nghi vấn (谁/什么/哪儿...) + 都/也 + (不/没) + Động từ/Tính từ — Cấu trúc này dùng để diễn tả ý nghĩa bao quát như \"bất cứ ai/cái gì/nơi nào... cũng không\". Nó giúp nhấn mạnh việc không có bất kỳ đối tượng nào ngoại lệ trong phạm vi được nhắc đến."},{"id":"H3-G02-03-01","lesson":2,"point":2,"question":"你们想吃什么＿＿＿点什么。","answer":"就","options":["就","的","了","吗"],"sentence":"你们想吃什么就点什么。","pinyin":"nǐ men xiǎng chī shén me jiù diǎn shén me","translation":"Các bạn muốn ăn gì thì cứ gọi món đó.","explanation":"Động từ + gì + thì + (lặp lại) + đấy: [V] + [đại từ nghi vấn] + [V] + [đại từ nghi vấn] — Cấu trúc này dùng để diễn tả việc thực hiện hành động dựa trên mong muốn hoặc lựa chọn tự do của một người. Khi dùng lặp lại đại từ nghi vấn ở hai vế, câu nhấn mạnh rằng bạn có thể lấy bất cứ thứ gì hoặc làm bất cứ điều gì mà mình thích."},{"id":"H3-G02-03-02","lesson":2,"point":2,"question":"你觉得哪个好看＿＿＿买哪个。","answer":"就","options":["就","的","了","吗"],"sentence":"你觉得哪个好看就买哪个。","pinyin":"nǐ jué de nǎ gè hǎo kàn jiù mǎi nǎ gè","translation":"Bạn thấy cái nào đẹp thì mua cái đó.","explanation":"Động từ + gì + thì + (lặp lại) + đấy: [V] + [đại từ nghi vấn] + [V] + [đại từ nghi vấn] — Cấu trúc này dùng để diễn tả việc thực hiện hành động dựa trên mong muốn hoặc lựa chọn tự do của một người. Khi dùng lặp lại đại từ nghi vấn ở hai vế, câu nhấn mạnh rằng bạn có thể lấy bất cứ thứ gì hoặc làm bất cứ điều gì mà mình thích."},{"id":"H3-G03-01-01","lesson":3,"point":0,"question":"这个小区环境＿＿＿好的。","answer":"挺","options":["挺","的","了","吗"],"sentence":"这个小区环境挺好的。","pinyin":"zhè gè xiǎo qū huán jìng tǐng hǎo de","translation":"Môi trường của khu dân cư này rất tốt.","explanation":"挺 + tính từ (tùy chọn: + 的) — Phó từ 「挺」 được dùng trước tính từ để diễn tả mức độ khá cao, tương đương với nghĩa \"khá\" hoặc \"rất\" trong tiếng Việt. Trong giao tiếp, cuối câu thường thêm 「的」 để nhấn mạnh cảm xúc hoặc sắc thái của người nói."},{"id":"H3-G03-01-02","lesson":3,"point":0,"question":"这家饭馆的菜＿＿＿好吃的。","answer":"挺","options":["挺","的","了","吗"],"sentence":"这家饭馆的菜挺好吃的。","pinyin":"zhè jiā fàn guǎn de cài tǐng hǎo chī de","translation":"Món ăn của nhà hàng này rất ngon.","explanation":"挺 + tính từ (tùy chọn: + 的) — Phó từ 「挺」 được dùng trước tính từ để diễn tả mức độ khá cao, tương đương với nghĩa \"khá\" hoặc \"rất\" trong tiếng Việt. Trong giao tiếp, cuối câu thường thêm 「的」 để nhấn mạnh cảm xúc hoặc sắc thái của người nói."},{"id":"H3-G03-02-01","lesson":3,"point":1,"question":"我这几天忙＿＿＿。","answer":"坏了","options":["坏了","的","了","吗"],"sentence":"我这几天忙坏了。","pinyin":"wǒ zhè jǐ tiān máng huài le","translation":"Mấy ngày nay tôi bận đến phát điên.","explanation":"Tính từ/Động từ tâm lý + 坏了 — Cấu trúc này dùng để nhấn mạnh mức độ cao đến mức quá đà hoặc khó chịu. Bạn có thể hiểu nó tương đương với việc dịch sang tiếng Việt là 'chết mất' hoặc 'hết sức'."},{"id":"H3-G03-02-02","lesson":3,"point":1,"question":"我渴＿＿＿，哪里能买水？","answer":"坏了","options":["坏了","的","了","吗"],"sentence":"我渴坏了，哪里能买水？","pinyin":"wǒ kě huài le nǎ lǐ néng mǎi shuǐ","translation":"Tôi khát khô cả cổ rồi, chỗ nào có thể mua nước nhỉ?","explanation":"Tính từ/Động từ tâm lý + 坏了 — Cấu trúc này dùng để nhấn mạnh mức độ cao đến mức quá đà hoặc khó chịu. Bạn có thể hiểu nó tương đương với việc dịch sang tiếng Việt là 'chết mất' hoặc 'hết sức'."},{"id":"H3-G03-03-01","lesson":3,"point":2,"question":"中国银行很近，走路几分钟＿＿＿能到。","answer":"就","options":["就","的","了","吗"],"sentence":"中国银行很近，走路几分钟就能到。","pinyin":"zhōng guó yín háng hěn jìn zǒu lù jǐ fēn zhōng jiù néng dào","translation":"Ngân hàng Trung Quốc rất gần, đi bộ vài phút là đến ngay.","explanation":"S + 就/才 + V — 「就」 diễn tả hành động xảy ra sớm, nhanh hoặc thuận lợi hơn mong đợi. Ngược lại, 「才」 nhấn mạnh hành động xảy ra muộn, chậm hoặc mất nhiều thời gian hơn dự kiến của người nói."},{"id":"H3-G03-03-02","lesson":3,"point":2,"question":"我下午要去医院，很晚＿＿＿能回来。","answer":"才","options":["才","的","了","吗"],"sentence":"我下午要去医院，很晚才能回来。","pinyin":"wǒ xià wǔ yào qù yī yuàn hěn wǎn cái néng huí lái","translation":"Chiều nay tôi phải đi bệnh viện, tối muộn mới có thể về.","explanation":"S + 就/才 + V — 「就」 diễn tả hành động xảy ra sớm, nhanh hoặc thuận lợi hơn mong đợi. Ngược lại, 「才」 nhấn mạnh hành động xảy ra muộn, chậm hoặc mất nhiều thời gian hơn dự kiến của người nói."},{"id":"H3-G04-01-01","lesson":4,"point":0,"question":"她＿＿＿件衣服都不想买。","answer":"一","options":["一","的","了","吗"],"sentence":"她一件衣服都不想买。","pinyin":"tā yī jiàn yī fú dōu bù xiǎng mǎi","translation":"Một bộ quần áo cô ấy cũng không muốn mua.","explanation":"S + 一 + (lượng từ) + N + 也/都 + 不/没 + V — Cấu trúc này dùng để nhấn mạnh sự phủ định hoàn toàn, có nghĩa là \"một chút/một cái... cũng không\". Khi nói về hành động trong quá khứ hoặc trạng thái đã hoàn thành, bạn dùng 「没」; khi nói về thói quen, dự định hoặc trạng thái hiện tại, bạn dùng 「不」."},{"id":"H3-G04-01-02","lesson":4,"point":0,"question":"草原＿＿＿点儿也不冷。","answer":"一","options":["一","的","了","吗"],"sentence":"草原一点儿也不冷。","pinyin":"cǎo yuán yī diǎn ér yě bù lěng","translation":"Thảo nguyên một chút cũng không lạnh.","explanation":"S + 一 + (lượng từ) + N + 也/都 + 不/没 + V — Cấu trúc này dùng để nhấn mạnh sự phủ định hoàn toàn, có nghĩa là \"một chút/một cái... cũng không\". Khi nói về hành động trong quá khứ hoặc trạng thái đã hoàn thành, bạn dùng 「没」; khi nói về thói quen, dự định hoặc trạng thái hiện tại, bạn dùng 「不」."},{"id":"H3-G04-02-01","lesson":4,"point":1,"question":"这家宾馆跟别的不＿＿＿。","answer":"一样","options":["一样","的","了","吗"],"sentence":"这家宾馆跟别的不一样。","pinyin":"zhè jiā bīn guǎn gēn bié de bù yī yàng","translation":"Khách sạn này không giống những cái khác.","explanation":"A 跟 B 一样 (+ Tính từ/Động từ) — Cấu trúc 「A 跟 B 一样」 dùng để so sánh hai đối tượng có tính chất hoặc mức độ tương đồng nhau. Nếu muốn nhấn mạnh phương diện giống nhau, ta thêm tính từ hoặc động từ phía sau cụm 「一样」."},{"id":"H3-G04-02-02","lesson":4,"point":1,"question":"他买的新手机跟我的＿＿＿。","answer":"一样","options":["一样","的","了","吗"],"sentence":"他买的新手机跟我的一样。","pinyin":"tā mǎi de xīn shǒu jī gēn wǒ de yī yàng","translation":"Điện thoại mới anh ấy mua giống hệt cái của tôi.","explanation":"A 跟 B 一样 (+ Tính từ/Động từ) — Cấu trúc 「A 跟 B 一样」 dùng để so sánh hai đối tượng có tính chất hoặc mức độ tương đồng nhau. Nếu muốn nhấn mạnh phương diện giống nhau, ta thêm tính từ hoặc động từ phía sau cụm 「一样」."},{"id":"H3-G04-03-01","lesson":4,"point":2,"question":"＿＿＿我以外，大家都在玩手机。","answer":"除了","options":["除了","的","了","吗"],"sentence":"除了我以外，大家都在玩手机。","pinyin":"chú le wǒ yǐ wài dà jiā dōu zài wán shǒu jī","translation":"Ngoài tôi ra, mọi người đều đang chơi điện thoại.","explanation":"除了 + A + (以外)，+ (B) + 都/还/也 + Động từ/Tính từ — Cấu trúc này dùng để diễn tả ý 'ngoài... ra'. Nếu dùng với 「都」, nó mang nghĩa loại trừ tất cả đều như thế; nếu dùng với 「还/也」, nó mang nghĩa ngoài cái đó ra còn có thêm cái khác."},{"id":"H3-G04-03-02","lesson":4,"point":2,"question":"＿＿＿唱歌以外，他也喜欢跳舞。","answer":"除了","options":["除了","的","了","吗"],"sentence":"除了唱歌以外，他也喜欢跳舞。","pinyin":"chú le chàng gē yǐ wài tā yě xǐ huān tiào wǔ","translation":"Ngoài ca hát ra, anh ấy cũng thích khiêu vũ.","explanation":"除了 + A + (以外)，+ (B) + 都/还/也 + Động từ/Tính từ — Cấu trúc này dùng để diễn tả ý 'ngoài... ra'. Nếu dùng với 「都」, nó mang nghĩa loại trừ tất cả đều như thế; nếu dùng với 「还/也」, nó mang nghĩa ngoài cái đó ra còn có thêm cái khác."},{"id":"H3-G05-01-01","lesson":5,"point":0,"question":"现在天气好＿＿＿。","answer":"得很","options":["得很","的","了","吗"],"sentence":"现在天气好得很。","pinyin":"xiàn zài tiān qì hǎo de hěn","translation":"Bây giờ thời tiết tốt lắm.","explanation":"Tính từ + 得很 (Rất/Vô cùng) — Cấu trúc 「得很」 được đặt sau tính từ để nhấn mạnh mức độ cao của tính chất đó, tương tự như 「很」 nhưng mang sắc thái biểu cảm mạnh hơn. Bạn có thể dịch là \"rất\", \"cực kỳ\" hoặc \"vô cùng\"."},{"id":"H3-G05-01-02","lesson":5,"point":0,"question":"房间里面热＿＿＿。","answer":"得很","options":["得很","的","了","吗"],"sentence":"房间里面热得很。","pinyin":"fáng jiān lǐ miàn rè de hěn","translation":"Trong phòng nóng vô cùng.","explanation":"Tính từ + 得很 (Rất/Vô cùng) — Cấu trúc 「得很」 được đặt sau tính từ để nhấn mạnh mức độ cao của tính chất đó, tương tự như 「很」 nhưng mang sắc thái biểu cảm mạnh hơn. Bạn có thể dịch là \"rất\", \"cực kỳ\" hoặc \"vô cùng\"."},{"id":"H3-G05-02-01","lesson":5,"point":1,"question":"这些照片张张＿＿＿非常好看。","answer":"都","options":["都","的","了","吗"],"sentence":"这些照片张张都非常好看。","pinyin":"zhè xiē zhào piàn zhāng zhāng dōu fēi cháng hǎo kàn","translation":"Những bức ảnh này tấm nào cũng đều rất đẹp.","explanation":"Lượng từ + Lượng từ (ví dụ: 个个, 天天) — Khi lặp lại lượng từ, câu văn nhấn mạnh rằng tất cả các cá thể trong nhóm đều mang cùng một đặc điểm hoặc thực hiện cùng một hành động. Cấu trúc này thường đứng trước động từ để bổ nghĩa cho chủ ngữ hoặc tân ngữ."},{"id":"H3-G05-02-02","lesson":5,"point":1,"question":"这些苹果＿＿＿都很大。","answer":"个个","options":["个个","的","了","吗"],"sentence":"这些苹果个个都很大。","pinyin":"zhè xiē píng guǒ gè gè dōu hěn dà","translation":"Những quả táo này quả nào cũng đều rất to.","explanation":"Lượng từ + Lượng từ (ví dụ: 个个, 天天) — Khi lặp lại lượng từ, câu văn nhấn mạnh rằng tất cả các cá thể trong nhóm đều mang cùng một đặc điểm hoặc thực hiện cùng một hành động. Cấu trúc này thường đứng trước động từ để bổ nghĩa cho chủ ngữ hoặc tân ngữ."},{"id":"H3-G05-03-01","lesson":5,"point":2,"question":"后边走＿＿＿去两个人。","answer":"过","options":["过","的","了","吗"],"sentence":"后边走过去两个人。","pinyin":"hòu biān zǒu guò qù liǎng gè rén","translation":"Phía sau có hai người vừa đi qua.","explanation":"[Địa điểm] + [Động từ] + [Bổ ngữ xu hướng] + [Danh từ] — Cấu trúc này dùng để diễn tả sự xuất hiện hoặc biến mất của người/vật tại một địa điểm cụ thể. Động từ thường đi kèm với các bổ ngữ như 「来」, 「去」, 「出来」, 「掉」 để chỉ hướng của hành động."},{"id":"H3-G05-03-02","lesson":5,"point":2,"question":"楼下来＿＿＿几个人。","answer":"了","options":["了","的","吗","呢"],"sentence":"楼下来了几个人。","pinyin":"lóu xià lái le jǐ gè rén","translation":"Dưới lầu có mấy người vừa đến.","explanation":"[Địa điểm] + [Động từ] + [Bổ ngữ xu hướng] + [Danh từ] — Cấu trúc này dùng để diễn tả sự xuất hiện hoặc biến mất của người/vật tại một địa điểm cụ thể. Động từ thường đi kèm với các bổ ngữ như 「来」, 「去」, 「出来」, 「掉」 để chỉ hướng của hành động."},{"id":"H3-G05-04-01","lesson":5,"point":3,"question":"你听完＿＿＿音乐会就来我家吃饭。","answer":"了","options":["了","的","吗","呢"],"sentence":"你听完了音乐会就来我家吃饭。","pinyin":"nǐ tīng wán le yīn yuè huì jiù lái wǒ jiā chī fàn","translation":"Bạn nghe xong buổi hòa nhạc thì đến nhà tôi ăn cơm nhé.","explanation":"V1 + 了 + (O), + 就 + V2 — Cấu trúc này dùng để nhấn mạnh trình tự thời gian giữa hai hành động. Hành động thứ hai sẽ xảy ra ngay sau khi hành động thứ nhất hoàn thành."},{"id":"H3-G05-04-02","lesson":5,"point":3,"question":"我吃＿＿＿早饭就去学校了。","answer":"了","options":["了","的","吗","呢"],"sentence":"我吃了早饭就去学校了。","pinyin":"wǒ chī le zǎo fàn jiù qù xué xiào le","translation":"Tôi ăn sáng xong là đi học ngay.","explanation":"V1 + 了 + (O), + 就 + V2 — Cấu trúc này dùng để nhấn mạnh trình tự thời gian giữa hai hành động. Hành động thứ hai sẽ xảy ra ngay sau khi hành động thứ nhất hoàn thành."},{"id":"H3-G06-01-01","lesson":6,"point":0,"question":"咱们该买去上海的票＿＿＿。","answer":"了","options":["了","的","吗","呢"],"sentence":"咱们该买去上海的票了。","pinyin":"zán men gāi mǎi qù shàng hǎi de piào le","translation":"Chúng ta nên mua vé đi Thượng Hải thôi.","explanation":"该 + [động từ] + 了 — Cấu trúc này dùng để thông báo rằng đã đến lúc cần phải thực hiện một hành động nào đó. Nó thường mang ý nghĩa thúc giục hoặc nhắc nhở bản thân/người khác bắt đầu làm việc gì ngay."},{"id":"H3-G06-01-02","lesson":6,"point":0,"question":"八点＿＿＿，该上课了。","answer":"了","options":["了","的","吗","呢"],"sentence":"八点了，该上课了。","pinyin":"bā diǎn le gāi shàng kè le","translation":"8 giờ rồi, đến giờ lên lớp rồi.","explanation":"该 + [động từ] + 了 — Cấu trúc này dùng để thông báo rằng đã đến lúc cần phải thực hiện một hành động nào đó. Nó thường mang ý nghĩa thúc giục hoặc nhắc nhở bản thân/người khác bắt đầu làm việc gì ngay."},{"id":"H3-G06-02-01","lesson":6,"point":1,"question":"＿＿＿没走错，二十分钟以前就到了。","answer":"如果","options":["如果","的","了","吗"],"sentence":"如果没走错，二十分钟以前就到了。","pinyin":"rú guǒ méi zǒu cuò èr shí fēn zhōng yǐ qián jiù dào le","translation":"Nếu không đi nhầm đường thì 20 phút trước đã đến rồi.","explanation":"如果 + giả thuyết + (的话)，(chủ ngữ) + 就 + kết quả — Cấu trúc này dùng để diễn tả một giả thiết và kết quả tương ứng xảy ra sau đó, tương đương với nghĩa \"nếu... thì...\" trong tiếng Việt. 「如果」 mở đầu vế điều kiện, còn 「就」 nối tiếp để dẫn ra kết quả."},{"id":"H3-G06-02-02","lesson":6,"point":1,"question":"＿＿＿你需要帮忙，就给我打电话。","answer":"如果","options":["如果","的","了","吗"],"sentence":"如果你需要帮忙，就给我打电话。","pinyin":"rú guǒ nǐ xū yào bāng máng jiù gěi wǒ dǎ diàn huà","translation":"Nếu bạn cần giúp đỡ thì hãy gọi điện cho tôi.","explanation":"如果 + giả thuyết + (的话)，(chủ ngữ) + 就 + kết quả — Cấu trúc này dùng để diễn tả một giả thiết và kết quả tương ứng xảy ra sau đó, tương đương với nghĩa \"nếu... thì...\" trong tiếng Việt. 「如果」 mở đầu vế điều kiện, còn 「就」 nối tiếp để dẫn ra kết quả."},{"id":"H3-G06-03-01","lesson":6,"point":2,"question":"前面的人＿＿＿多。","answer":"越来越","options":["越来越","的","了","吗"],"sentence":"前面的人越来越多。","pinyin":"qián miàn de rén yuè lái yuè duō","translation":"Người phía trước ngày càng đông.","explanation":"越来越 + tính từ / động từ tâm lý — Cấu trúc 「越来越」 được dùng để diễn tả một trạng thái hoặc tính chất thay đổi dần dần theo thời gian. Nó thể hiện mức độ ngày càng tăng hoặc ngày càng mạnh hơn."},{"id":"H3-G06-03-02","lesson":6,"point":2,"question":"我＿＿＿喜欢这里的生活了。","answer":"越来越","options":["越来越","的","了","吗"],"sentence":"我越来越喜欢这里的生活了。","pinyin":"wǒ yuè lái yuè xǐ huān zhè lǐ de shēng huó le","translation":"Tôi ngày càng yêu thích cuộc sống ở đây.","explanation":"越来越 + tính từ / động từ tâm lý — Cấu trúc 「越来越」 được dùng để diễn tả một trạng thái hoặc tính chất thay đổi dần dần theo thời gian. Nó thể hiện mức độ ngày càng tăng hoặc ngày càng mạnh hơn."},{"id":"H3-G07-01-01","lesson":7,"point":0,"question":"咱们可以走＿＿＿去。","answer":"着","options":["着","的","了","吗"],"sentence":"咱们可以走着去。","pinyin":"zán men kě yǐ zǒu zhe qù","translation":"Chúng ta có thể đi bộ đi.","explanation":"Động từ 1 + 着 + Động từ 2 (Hành động phụ + Hành động chính) — Cấu trúc này dùng để diễn tả một hành động hoặc trạng thái xảy ra song song hoặc đi kèm trong khi thực hiện hành động chính. Trong đó, 「着」 gắn sau động từ thứ nhất để chỉ trạng thái kéo dài, làm nền cho động từ thứ hai."},{"id":"H3-G07-01-02","lesson":7,"point":0,"question":"弟弟吃＿＿＿苹果写作业。","answer":"着","options":["着","的","了","吗"],"sentence":"弟弟吃着苹果写作业。","pinyin":"dì dì chī zhe píng guǒ xiě zuò yè","translation":"Em trai vừa ăn táo vừa làm bài tập.","explanation":"Động từ 1 + 着 + Động từ 2 (Hành động phụ + Hành động chính) — Cấu trúc này dùng để diễn tả một hành động hoặc trạng thái xảy ra song song hoặc đi kèm trong khi thực hiện hành động chính. Trong đó, 「着」 gắn sau động từ thứ nhất để chỉ trạng thái kéo dài, làm nền cho động từ thứ hai."},{"id":"H3-G07-02-01","lesson":7,"point":1,"question":"裙子＿＿＿短裤贵多少。","answer":"不比","options":["不比","的","了","吗"],"sentence":"裙子不比短裤贵多少。","pinyin":"qún zi bù bǐ duǎn kù guì duō shǎo","translation":"Váy không đắt hơn quần soóc bao nhiêu.","explanation":"A + 不比 + B + Tính từ — Cấu trúc này dùng để phủ định việc A hơn B về một đặc điểm nào đó, mang nghĩa là A không bằng hoặc không vượt trội hơn B. Nó thường dùng khi người nói cảm thấy mức độ của A không cao hơn mức độ của B."},{"id":"H3-G07-02-02","lesson":7,"point":1,"question":"他的中文＿＿＿你好。","answer":"不比","options":["不比","的","了","吗"],"sentence":"他的中文不比你好。","pinyin":"tā de zhōng wén bù bǐ nǐ hǎo","translation":"Tiếng Trung của anh ấy không giỏi hơn bạn đâu.","explanation":"A + 不比 + B + Tính từ — Cấu trúc này dùng để phủ định việc A hơn B về một đặc điểm nào đó, mang nghĩa là A không bằng hoặc không vượt trội hơn B. Nó thường dùng khi người nói cảm thấy mức độ của A không cao hơn mức độ của B."},{"id":"H3-G07-03-01","lesson":7,"point":2,"question":"这块西瓜甜＿＿＿。","answer":"极了","options":["极了","的","了","吗"],"sentence":"这块西瓜甜极了。","pinyin":"zhè kuài xī guā tián jí le","translation":"Miếng dưa hấu này ngọt cực kỳ.","explanation":"Tính từ + 极了 (Cực kỳ/Vô cùng) — Cấu trúc 「极了」 được đặt sau tính từ để nhấn mạnh mức độ ở cấp độ cao nhất. Nó tương đương với nghĩa \"cực kỳ\" hoặc \"vô cùng\" trong tiếng Việt."},{"id":"H3-G07-03-02","lesson":7,"point":2,"question":"今年夏天热＿＿＿。","answer":"极了","options":["极了","的","了","吗"],"sentence":"今年夏天热极了。","pinyin":"jīn nián xià tiān rè jí le","translation":"Mùa hè năm nay nóng vô cùng.","explanation":"Tính từ + 极了 (Cực kỳ/Vô cùng) — Cấu trúc 「极了」 được đặt sau tính từ để nhấn mạnh mức độ ở cấp độ cao nhất. Nó tương đương với nghĩa \"cực kỳ\" hoặc \"vô cùng\" trong tiếng Việt."},{"id":"H3-G07-04-01","lesson":7,"point":3,"question":"现在的电视不但便宜，＿＿＿用着非常方便。","answer":"而且","options":["而且","的","了","吗"],"sentence":"现在的电视不但便宜，而且用着非常方便。","pinyin":"xiàn zài de diàn shì bù dàn pián yí ér qiě yòng zhe fēi cháng fāng biàn","translation":"Tivi bây giờ không những rẻ mà dùng còn rất tiện lợi.","explanation":"不但 (búdàn) + A, 而且 (érqiě) + B — Cấu trúc này dùng để diễn tả ý “không những… mà còn…”, biểu thị mức độ của sự việc sau cao hơn hoặc bổ sung cho sự việc trước. Đây là liên từ chỉ quan hệ tăng tiến phổ biến trong tiếng Trung."},{"id":"H3-G07-04-02","lesson":7,"point":3,"question":"家月不但喜欢唱歌，＿＿＿唱得很好听。","answer":"而且","options":["而且","的","了","吗"],"sentence":"家月不但喜欢唱歌，而且唱得很好听。","pinyin":"jiā yuè bù dàn xǐ huān chàng gē ér qiě chàng de hěn hǎo tīng","translation":"Gia Nguyệt không những thích hát mà hát còn rất hay.","explanation":"不但 (búdàn) + A, 而且 (érqiě) + B — Cấu trúc này dùng để diễn tả ý “không những… mà còn…”, biểu thị mức độ của sự việc sau cao hơn hoặc bổ sung cho sự việc trước. Đây là liên từ chỉ quan hệ tăng tiến phổ biến trong tiếng Trung."},{"id":"H3-G08-01-01","lesson":8,"point":0,"question":"我今年胖了十多斤，不能再胖＿＿＿了。","answer":"下去","options":["下去","的","了","吗"],"sentence":"我今年胖了十多斤，不能再胖下去了。","pinyin":"wǒ jīn nián pàng le shí duō jīn bù néng zài pàng xià qù le","translation":"Năm nay tôi béo lên hơn 10 cân rồi, không thể cứ béo mãi thế này được.","explanation":"Động từ + 下去 — Cấu trúc 「下去」 được dùng sau động từ để diễn tả một hành động hoặc trạng thái đang diễn ra và cần được tiếp tục duy trì trong tương lai. Nó giúp nhấn mạnh tính liên tục của hành động đó, ví dụ: 「请说下去」 (Xin hãy nói tiếp đi)."},{"id":"H3-G08-01-02","lesson":8,"point":0,"question":"她读完了第一个问题，后面的你读＿＿＿。","answer":"下去","options":["下去","的","了","吗"],"sentence":"她读完了第一个问题，后面的你读下去。","pinyin":"tā dú wán le dì yī gè wèn tí hòu miàn de nǐ dú xià qù","translation":"Cô ấy đọc xong câu hỏi thứ nhất rồi, phần sau bạn đọc tiếp đi.","explanation":"Động từ + 下去 — Cấu trúc 「下去」 được dùng sau động từ để diễn tả một hành động hoặc trạng thái đang diễn ra và cần được tiếp tục duy trì trong tương lai. Nó giúp nhấn mạnh tính liên tục của hành động đó, ví dụ: 「请说下去」 (Xin hãy nói tiếp đi)."},{"id":"H3-G08-02-01","lesson":8,"point":1,"question":"上个星期我跟他见＿＿＿一次面。","answer":"了","options":["了","的","吗","呢"],"sentence":"上个星期我跟他见了一次面。","pinyin":"shàng gè xīng qī wǒ gēn tā jiàn le yī cì miàn","translation":"Tuần trước tôi đã gặp anh ấy một lần.","explanation":"Động từ (A) + Thành phần bổ trợ + Tân ngữ (B) — Trong tiếng Trung, 「động từ ly hợp」 gồm một động từ và một tân ngữ dính liền nhau. Khi muốn thêm số lần, thời lượng hoặc bổ ngữ, ta phải tách chúng ra và chèn các thành phần đó vào giữa."},{"id":"H3-G08-02-02","lesson":8,"point":1,"question":"今年夏天只下＿＿＿两次雨。","answer":"了","options":["了","的","吗","呢"],"sentence":"今年夏天只下了两次雨。","pinyin":"jīn nián xià tiān zhǐ xià le liǎng cì yǔ","translation":"Mùa hè năm nay chỉ mưa có hai lần.","explanation":"Động từ (A) + Thành phần bổ trợ + Tân ngữ (B) — Trong tiếng Trung, 「động từ ly hợp」 gồm một động từ và một tân ngữ dính liền nhau. Khi muốn thêm số lần, thời lượng hoặc bổ ngữ, ta phải tách chúng ra và chèn các thành phần đó vào giữa."},{"id":"H3-G08-03-01","lesson":8,"point":2,"question":"我上次来医院已经过去差不多两年＿＿＿。","answer":"了","options":["了","的","吗","呢"],"sentence":"我上次来医院已经过去差不多两年了。","pinyin":"wǒ shàng cì lái yī yuàn yǐ jīng guò qù chà bù duō liǎng nián le","translation":"Lần trước tôi đến bệnh viện đã cách đây gần hai năm rồi.","explanation":"Chủ ngữ + Động từ + (了) + Bổ ngữ thời lượng + (của tân ngữ) — Bổ ngữ thời lượng dùng để diễn tả khoảng thời gian mà một hành động đã diễn ra hoặc kéo dài. Khi có tân ngữ đi kèm, bạn có thể đặt thời lượng ở giữa động từ và tân ngữ, hoặc thêm 「的」 sau bổ ngữ thời lượng."},{"id":"H3-G08-03-02","lesson":8,"point":2,"question":"开学已经三个多星期＿＿＿。","answer":"了","options":["了","的","吗","呢"],"sentence":"开学已经三个多星期了。","pinyin":"kāi xué yǐ jīng sān gè duō xīng qī le","translation":"Khai giảng đã được hơn ba tuần rồi.","explanation":"Chủ ngữ + Động từ + (了) + Bổ ngữ thời lượng + (của tân ngữ) — Bổ ngữ thời lượng dùng để diễn tả khoảng thời gian mà một hành động đã diễn ra hoặc kéo dài. Khi có tân ngữ đi kèm, bạn có thể đặt thời lượng ở giữa động từ và tân ngữ, hoặc thêm 「的」 sau bổ ngữ thời lượng."},{"id":"H3-G08-04-01","lesson":8,"point":3,"question":"这种药需＿＿＿每天睡前吃一次。","answer":"要","options":["要","的","了","吗"],"sentence":"这种药需要每天睡前吃一次。","pinyin":"zhè zhǒng yào xū yào měi tiān shuì qián chī yī cì","translation":"Loại thuốc này cần uống một lần trước khi ngủ mỗi ngày.","explanation":"[Cụm động từ/Thời gian] + 以前/以后 — Cấu trúc này dùng để diễn tả một mốc thời gian hoặc sự kiện xảy ra trước 「以前」 hoặc sau 「以后」 một hành động cụ thể. Trong câu, cụm từ chỉ thời gian luôn đứng trước động từ chính để bổ nghĩa cho hành động đó."},{"id":"H3-G08-04-02","lesson":8,"point":3,"question":"考完试＿＿＿，咱们一起去旅游吧。","answer":"以后","options":["以后","的","了","吗"],"sentence":"考完试以后，咱们一起去旅游吧。","pinyin":"kǎo wán shì yǐ hòu zán men yī qǐ qù lǚ yóu ba","translation":"Sau khi thi xong, chúng mình cùng đi du lịch nhé.","explanation":"[Cụm động từ/Thời gian] + 以前/以后 — Cấu trúc này dùng để diễn tả một mốc thời gian hoặc sự kiện xảy ra trước 「以前」 hoặc sau 「以后」 một hành động cụ thể. Trong câu, cụm từ chỉ thời gian luôn đứng trước động từ chính để bổ nghĩa cho hành động đó."},{"id":"H3-G09-01-01","lesson":9,"point":0,"question":"听说＿＿＿准备运动会，你们几个男生每天都练球。","answer":"为了","options":["为了","的","了","吗"],"sentence":"听说为了准备运动会，你们几个男生每天都练球。","pinyin":"tīng shuō wèi le zhǔn bèi yùn dòng huì nǐ men jǐ gè nán shēng měi tiān dōu liàn qiú","translation":"Nghe nói để chuẩn bị cho đại hội thể thao, mấy bạn nam các cậu ngày nào cũng luyện bóng.","explanation":"为了 + Mục đích, + Hành động (S + V...) — Cấu trúc 「为了」 được dùng để nêu lên mục đích của một hành động, mang nghĩa là \"để\" hoặc \"vì\". Vế đầu chứa mục đích cần đạt được, vế sau là hành động thực hiện để đạt được mục đích đó."},{"id":"H3-G09-01-02","lesson":9,"point":0,"question":"＿＿＿上大学，她每天努力学习。","answer":"为了","options":["为了","的","了","吗"],"sentence":"为了上大学，她每天努力学习。","pinyin":"wèi le shàng dà xué tā měi tiān nǔ lì xué xí","translation":"Để được vào đại học, cô ấy nỗ lực học tập mỗi ngày.","explanation":"为了 + Mục đích, + Hành động (S + V...) — Cấu trúc 「为了」 được dùng để nêu lên mục đích của một hành động, mang nghĩa là \"để\" hoặc \"vì\". Vế đầu chứa mục đích cần đạt được, vế sau là hành động thực hiện để đạt được mục đích đó."},{"id":"H3-G09-02-01","lesson":9,"point":1,"question":"打＿＿＿好没关系。","answer":"不","options":["不","的","了","吗"],"sentence":"打不好没关系。","pinyin":"dǎ bù hǎo méi guān xì","translation":"Đánh không tốt cũng không sao.","explanation":"V + 得/不 + bổ ngữ (kết quả/xu hướng) — Cấu trúc này dùng để diễn đạt việc hành động có thể hoặc không thể thực hiện được do điều kiện khách quan hoặc năng lực. 「得」 dùng cho khẳng định (làm được), còn 「不」 dùng cho phủ định (không làm được). Ví dụ: 「听得懂」 (nghe hiểu) và 「听不懂」 (nghe không hiểu)."},{"id":"H3-G09-02-02","lesson":9,"point":1,"question":"这本书你看＿＿＿懂看不懂？","answer":"得","options":["得","的","了","吗"],"sentence":"这本书你看得懂看不懂？","pinyin":"zhè běn shū nǐ kàn de dǒng kàn bù dǒng","translation":"Quyển sách này bạn có đọc hiểu không?","explanation":"V + 得/不 + bổ ngữ (kết quả/xu hướng) — Cấu trúc này dùng để diễn đạt việc hành động có thể hoặc không thể thực hiện được do điều kiện khách quan hoặc năng lực. 「得」 dùng cho khẳng định (làm được), còn 「不」 dùng cho phủ định (không làm được). Ví dụ: 「听得懂」 (nghe hiểu) và 「听不懂」 (nghe không hiểu)."},{"id":"H3-G09-03-01","lesson":9,"point":2,"question":"今天的足球比赛我＿＿＿看越着急。","answer":"越","options":["越","的","了","吗"],"sentence":"今天的足球比赛我越看越着急。","pinyin":"jīn tiān de zú qiú bǐ sài wǒ yuè kàn yuè zháo jí","translation":"Trận bóng đá hôm nay tôi càng xem càng thấy sốt ruột.","explanation":"越 + A + 越 + B — Cấu trúc 「越 A 越 B」 dùng để diễn tả sự thay đổi song song của hai yếu tố, khi mức độ của A tăng lên thì B cũng thay đổi theo tương ứng. Bạn có thể dịch là \"càng A càng B\" để nắm bắt ý nghĩa của cấu trúc này."},{"id":"H3-G09-03-02","lesson":9,"point":2,"question":"我想认识中国朋友，＿＿＿多越好。","answer":"越","options":["越","的","了","吗"],"sentence":"我想认识中国朋友，越多越好。","pinyin":"wǒ xiǎng rèn shí zhōng guó péng yǒu yuè duō yuè hǎo","translation":"Tôi muốn quen bạn người Trung Quốc, càng nhiều càng tốt.","explanation":"越 + A + 越 + B — Cấu trúc 「越 A 越 B」 dùng để diễn tả sự thay đổi song song của hai yếu tố, khi mức độ của A tăng lên thì B cũng thay đổi theo tương ứng. Bạn có thể dịch là \"càng A càng B\" để nắm bắt ý nghĩa của cấu trúc này."},{"id":"H3-G10-01-01","lesson":10,"point":0,"question":"我会＿＿＿这些题都记在本子上。","answer":"把","options":["把","的","了","吗"],"sentence":"我会把这些题都记在本子上。","pinyin":"wǒ huì bǎ zhè xiē tí dōu jì zài běn zi shàng","translation":"Tôi sẽ ghi lại tất cả những câu này vào vở.","explanation":"Chủ ngữ + 把 + Tân ngữ + Động từ + Thành phần khác — Câu chữ 「把」 được dùng để nhấn mạnh sự tác động của chủ ngữ lên tân ngữ, khiến tân ngữ thay đổi trạng thái hoặc bị xử lý. Động từ trong câu này không bao giờ đứng một mình mà thường đi kèm với bổ ngữ hoặc các thành phần khác như 「了」."},{"id":"H3-G10-01-02","lesson":10,"point":0,"question":"老师＿＿＿作业本放到桌子上了。","answer":"把","options":["把","的","了","吗"],"sentence":"老师把作业本放到桌子上了。","pinyin":"lǎo shī bǎ zuò yè běn fàng dào zhuō zi shàng le","translation":"Thầy giáo đã để vở bài tập lên bàn rồi.","explanation":"Chủ ngữ + 把 + Tân ngữ + Động từ + Thành phần khác — Câu chữ 「把」 được dùng để nhấn mạnh sự tác động của chủ ngữ lên tân ngữ, khiến tân ngữ thay đổi trạng thái hoặc bị xử lý. Động từ trong câu này không bao giờ đứng một mình mà thường đi kèm với bổ ngữ hoặc các thành phần khác như 「了」."},{"id":"H3-G10-02-01","lesson":10,"point":1,"question":"＿＿＿学习上，遇到什么问题都可以问我。","answer":"在","options":["在","的","了","吗"],"sentence":"在学习上，遇到什么问题都可以问我。","pinyin":"zài xué xí shàng yù dào shén me wèn tí dōu kě yǐ wèn wǒ","translation":"Trong học tập, gặp vấn đề gì bạn cũng có thể hỏi tôi.","explanation":"在 + [Danh từ/Khái cạnh] + 上/中/下 — Cấu trúc này dùng để xác định phạm vi, hoàn cảnh hoặc khía cạnh mà hành động hay sự việc xảy ra. Trong đó, 「上」 thường chỉ khía cạnh (lý thuyết), 「中」 chỉ quá trình (đang diễn ra) và 「下」 chỉ điều kiện (dưới sự tác động)."},{"id":"H3-G10-02-02","lesson":10,"point":1,"question":"＿＿＿老师的帮助下，我的成绩提高很快。","answer":"在","options":["在","的","了","吗"],"sentence":"在老师的帮助下，我的成绩提高很快。","pinyin":"zài lǎo shī de bāng zhù xià wǒ de chéng jì tí gāo hěn kuài","translation":"Dưới sự giúp đỡ của thầy giáo, thành tích của tôi tiến bộ rất nhanh.","explanation":"在 + [Danh từ/Khái cạnh] + 上/中/下 — Cấu trúc này dùng để xác định phạm vi, hoàn cảnh hoặc khía cạnh mà hành động hay sự việc xảy ra. Trong đó, 「上」 thường chỉ khía cạnh (lý thuyết), 「中」 chỉ quá trình (đang diễn ra) và 「下」 chỉ điều kiện (dưới sự tác động)."},{"id":"H3-G10-03-01","lesson":10,"point":2,"question":"我跟你一起＿＿＿这些工作做完。","answer":"把","options":["把","的","了","吗"],"sentence":"我跟你一起把这些工作做完。","pinyin":"wǒ gēn nǐ yī qǐ bǎ zhè xiē gōng zuò zuò wán","translation":"Tôi cùng bạn làm cho xong những công việc này.","explanation":"Chủ ngữ + 把 + Tân ngữ + Động từ + Bổ ngữ (kết quả/xu hướng) — Trong câu chữ 「把」, khi muốn nhấn mạnh kết quả hoặc hướng của hành động tác động lên tân ngữ, ta thêm bổ ngữ ngay sau động từ. Cấu trúc này giúp làm rõ trạng thái hoặc vị trí mới của sự vật sau khi hành động kết thúc."},{"id":"H3-G10-03-02","lesson":10,"point":2,"question":"妈妈＿＿＿衣服洗干净了。","answer":"把","options":["把","的","了","吗"],"sentence":"妈妈把衣服洗干净了。","pinyin":"mā mā bǎ yī fú xǐ gān jìng le","translation":"Mẹ đã giặt sạch quần áo rồi.","explanation":"Chủ ngữ + 把 + Tân ngữ + Động từ + Bổ ngữ (kết quả/xu hướng) — Trong câu chữ 「把」, khi muốn nhấn mạnh kết quả hoặc hướng của hành động tác động lên tân ngữ, ta thêm bổ ngữ ngay sau động từ. Cấu trúc này giúp làm rõ trạng thái hoặc vị trí mới của sự vật sau khi hành động kết thúc."},{"id":"H3-G11-01-01","lesson":11,"point":0,"question":"我们用会议室的电脑＿＿＿自己的笔记本电脑？","answer":"还是","options":["还是","的","了","吗"],"sentence":"我们用会议室的电脑还是自己的笔记本电脑？","pinyin":"wǒ men yòng huì yì shì de diàn nǎo hái shì zì jǐ de bǐ jì běn diàn nǎo","translation":"Chúng ta dùng máy tính của
