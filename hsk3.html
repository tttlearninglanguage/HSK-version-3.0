ành phố","example":"我喜欢这个城市。","examplePinyin":"wǒ xǐhuān zhège chéngshì.","translation":"Tôi thích thành phố này."},{"id":"hsk3-T15-20","hanzi":"城","pinyin":"chéng","meaning":"thành, thành phố","example":"这座古城有很多景点。","examplePinyin":"Zhè zuò gǔchéng yǒu hěn duō jǐngdiǎn.","translation":"Thành cổ này có nhiều điểm tham quan."},{"id":"hsk3-T15-21","hanzi":"地区","pinyin":"dìqū","meaning":"khu vực","example":"我们下个星期打算去地区。","examplePinyin":"Wǒmen xià ge xīngqī dǎsuàn qù dìqū.","translation":"Tuần sau chúng tôi định đến khu vực."},{"id":"hsk3-T15-22","hanzi":"中部","pinyin":"zhōngbù","meaning":"miền Trung","example":"这个城市在中国中部。","examplePinyin":"Zhège chéngshì zài Zhōngguó zhōngbù.","translation":"Thành phố này nằm ở miền Trung Trung Quốc."},{"id":"hsk3-T15-23","hanzi":"当地","pinyin":"dāngdì","meaning":"địa phương","example":"我喜欢当地的美食。","examplePinyin":"Wǒ xǐhuan dāngdì de měishí.","translation":"Tôi thích ẩm thực địa phương."},{"id":"hsk3-T15-24","hanzi":"家乡","pinyin":"jiāxiāng","meaning":"quê hương","example":"今年我想去家乡旅游。","examplePinyin":"Jīnnián wǒ xiǎng qù jiāxiāng lǚyóu.","translation":"Năm nay tôi muốn du lịch đến quê hương."},{"id":"hsk3-T15-25","hanzi":"国内","pinyin":"guónèi","meaning":"trong nước","example":"我和朋友正在找国内。","examplePinyin":"Wǒ hé péngyou zhèngzài zhǎo guónèi.","translation":"Tôi và bạn đang tìm trong nước."},{"id":"hsk3-T15-26","hanzi":"村","pinyin":"cūn","meaning":"làng","example":"我们需要更多关于村的信息。","examplePinyin":"Wǒmen xūyào gèng duō guānyú cūn de xìnxī.","translation":"Chúng tôi cần thêm thông tin về làng."},{"id":"hsk3-T15-27","hanzi":"各地","pinyin":"gèdì","meaning":"các nơi","example":"每年都有来自各地的游客。","examplePinyin":"Měinián dōu yǒu láizì gèdì de yóukè.","translation":"Năm nào cũng có du khách từ nhiều nơi đến."},{"id":"hsk3-T15-28","hanzi":"故乡","pinyin":"gùxiāng","meaning":"cố hương","example":"你知道故乡在哪里吗？","examplePinyin":"Nǐ zhīdào gùxiāng zài nǎlǐ ma?","translation":"Bạn biết cố hương ở đâu không?"},{"id":"hsk3-T15-29","hanzi":"北部","pinyin":"běibù","meaning":"miền Bắc","example":"中国北部冬天很冷。","examplePinyin":"Zhōngguó běibù dōngtiān hěn lěng.","translation":"Mùa đông miền Bắc Trung Quốc rất lạnh."},{"id":"hsk3-T15-30","hanzi":"南部","pinyin":"nánbù","meaning":"miền Nam","example":"这个国家南部有很多海边城市。","examplePinyin":"Zhège guójiā nánbù yǒu hěn duō hǎibiān chéngshì.","translation":"Miền Nam nước này có nhiều thành phố biển."},{"id":"hsk3-T15-31","hanzi":"长城","pinyin":"Chángchéng","meaning":"Vạn Lý Trường Thành","example":"我和朋友正在找长城。","examplePinyin":"Wǒ hé péngyou zhèngzài zhǎo Chángchéng.","translation":"Tôi và bạn đang tìm Vạn Lý Trường Thành."},{"id":"hsk3-T15-32","hanzi":"海关","pinyin":"hǎiguān","meaning":"hải quan","example":"经过海关时，请准备好护照。","examplePinyin":"Jīngguò hǎiguān shí, qǐng zhǔnbèi hǎo hùzhào.","translation":"Khi qua hải quan, hãy chuẩn bị sẵn hộ chiếu."},{"id":"hsk3-T15-33","hanzi":"桥","pinyin":"qiáo","meaning":"cầu","example":"河上有一座很长的桥。","examplePinyin":"Hé shang yǒu yí zuò hěn cháng de qiáo.","translation":"Trên sông có một cây cầu rất dài."},{"id":"hsk3-T15-34","hanzi":"东部","pinyin":"dōngbù","meaning":"miền Đông","example":"这个国家东部的经济发展很快。","examplePinyin":"Zhège guójiā dōngbù de jīngjì fāzhǎn hěn kuài.","translation":"Kinh tế miền Đông nước này phát triển nhanh."},{"id":"hsk3-T15-35","hanzi":"西部","pinyin":"xībù","meaning":"miền Tây","example":"我还没有去过中国西部。","examplePinyin":"Wǒ hái méiyǒu qùguo Zhōngguó xībù.","translation":"Tôi chưa từng đến miền Tây Trung Quốc."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/noi/"},{"id":16,"name":"CÁC HOẠT ĐỘNG","words":[{"id":"hsk3-T16-01","hanzi":"导演","pinyin":"dǎoyǎn","meaning":"đạo diễn","example":"这位导演工作很认真。","examplePinyin":"Zhè wèi dǎoyǎn gōngzuò hěn rènzhēn.","translation":"Vị đạo diễn này làm việc rất nghiêm túc."},{"id":"hsk3-T16-02","hanzi":"作者","pinyin":"zuòzhě","meaning":"tác giả","example":"今天我和一位作者聊天了。","examplePinyin":"Jīntiān wǒ hé yí wèi zuòzhě liáotiān le.","translation":"Hôm nay tôi đã trò chuyện với một tác giả."},{"id":"hsk3-T16-03","hanzi":"大夫","pinyin":"dàifu","meaning":"bác sĩ","example":"那位大夫正在等朋友。","examplePinyin":"Nà wèi dàifu zhèngzài děng péngyou.","translation":"Vị bác sĩ kia đang đợi bạn."},{"id":"hsk3-T16-04","hanzi":"工程师","pinyin":"gōngchéngshī","meaning":"kỹ sư","example":"我们请了一位工程师来帮助学生。","examplePinyin":"Wǒmen qǐng le yí wèi gōngchéngshī lái bāngzhù xuésheng.","translation":"Chúng tôi mời một kỹ sư đến giúp các học sinh."},{"id":"hsk3-T16-05","hanzi":"工业","pinyin":"gōngyè","meaning":"công nghiệp","example":"我对工业很感兴趣。","examplePinyin":"Wǒ duì gōngyè hěn gǎn xìngqù.","translation":"Tôi rất hứng thú với công nghiệp."},{"id":"hsk3-T16-06","hanzi":"记者","pinyin":"jìzhě","meaning":"phóng viên","example":"我认识一位记者。","examplePinyin":"Wǒ rènshi yí wèi jìzhě.","translation":"Tôi quen một phóng viên."},{"id":"hsk3-T16-07","hanzi":"公务员","pinyin":"gōngwùyuán","meaning":"công chức","example":"这位公务员工作很认真。","examplePinyin":"Zhè wèi gōngwùyuán gōngzuò hěn rènzhēn.","translation":"Vị công chức này làm việc rất nghiêm túc."},{"id":"hsk3-T16-08","hanzi":"外交","pinyin":"wàijiāo","meaning":"ngoại giao","example":"你能介绍一下外交吗？","examplePinyin":"Nǐ néng jièshào yíxià wàijiāo ma?","translation":"Bạn có thể giới thiệu đôi chút về ngoại giao không?"},{"id":"hsk3-T16-09","hanzi":"会员","pinyin":"huìyuán","meaning":"hội viên","example":"那位会员正在等朋友。","examplePinyin":"Nà wèi huìyuán zhèngzài děng péngyou.","translation":"Vị hội viên kia đang đợi bạn."},{"id":"hsk3-T16-10","hanzi":"代表团","pinyin":"dàibiǎotuán","meaning":"đoàn đại biểu","example":"他昨天和朋友谈到了代表团。","examplePinyin":"Tā zuótiān hé péngyou tándào le dàibiǎotuán.","translation":"Hôm qua anh ấy và bạn trò chuyện về đoàn đại biểu."},{"id":"hsk3-T16-11","hanzi":"成员","pinyin":"chéngyuán","meaning":"thành viên","example":"我在学校遇见了一位成员。","examplePinyin":"Wǒ zài xuéxiào yùjiàn le yí wèi chéngyuán.","translation":"Tôi gặp một thành viên ở trường."},{"id":"hsk3-T16-12","hanzi":"部长","pinyin":"bùzhǎng","meaning":"bộ trưởng","example":"我认识一位部长。","examplePinyin":"Wǒ rènshi yí wèi bùzhǎng.","translation":"Tôi quen một bộ trưởng."},{"id":"hsk3-T16-13","hanzi":"队员","pinyin":"duìyuán","meaning":"đội viên","example":"这位队员工作很认真。","examplePinyin":"Zhè wèi duìyuán gōngzuò hěn rènzhēn.","translation":"Vị đội viên này làm việc rất nghiêm túc."},{"id":"hsk3-T16-14","hanzi":"交警","pinyin":"jiāojǐng","meaning":"cảnh sát giao thông","example":"今天我和一位交警聊天了。","examplePinyin":"Jīntiān wǒ hé yí wèi jiāojǐng liáotiān le.","translation":"Hôm nay tôi đã trò chuyện với một cảnh sát giao thông."},{"id":"hsk3-T16-15","hanzi":"警察","pinyin":"jǐngchá","meaning":"cảnh sát","example":"那位警察正在等朋友。","examplePinyin":"Nà wèi jǐngchá zhèngzài děng péngyou.","translation":"Vị cảnh sát kia đang đợi bạn."},{"id":"hsk3-T16-16","hanzi":"老板","pinyin":"lǎobǎn","meaning":"ông chủ","example":"我们请了一位老板来帮助学生。","examplePinyin":"Wǒmen qǐng le yí wèi lǎobǎn lái bāngzhù xuésheng.","translation":"Chúng tôi mời một ông chủ đến giúp các học sinh."},{"id":"hsk3-T16-17","hanzi":"农业","pinyin":"nóngyè","meaning":"nông nghiệp","example":"我们需要更多关于农业的信息。","examplePinyin":"Wǒmen xūyào gèng duō guānyú nóngyè de xìnxī.","translation":"Chúng tôi cần thêm thông tin về nông nghiệp."},{"id":"hsk3-T16-18","hanzi":"人工","pinyin":"réngōng","meaning":"nhân tạo, nhân công","example":"你能介绍一下人工吗？","examplePinyin":"Nǐ néng jièshào yíxià réngōng ma?","translation":"Bạn có thể giới thiệu đôi chút về nhân tạo, nhân công không?"},{"id":"hsk3-T16-19","hanzi":"所长","pinyin":"suǒzhǎng","meaning":"trưởng cơ quan","example":"这位所长工作很认真。","examplePinyin":"Zhè wèi suǒzhǎng gōngzuò hěn rènzhēn.","translation":"Vị trưởng cơ quan này làm việc rất nghiêm túc."},{"id":"hsk3-T16-20","hanzi":"选手","pinyin":"xuǎnshǒu","meaning":"tuyển thủ","example":"今天我和一位选手聊天了。","examplePinyin":"Jīntiān wǒ hé yí wèi xuǎnshǒu liáotiān le.","translation":"Hôm nay tôi đã trò chuyện với một tuyển thủ."},{"id":"hsk3-T16-21","hanzi":"演员","pinyin":"yǎnyuán","meaning":"diễn viên","example":"那位演员正在等朋友。","examplePinyin":"Nà wèi yǎnyuán zhèngzài děng péngyou.","translation":"Vị diễn viên kia đang đợi bạn."},{"id":"hsk3-T16-22","hanzi":"员","pinyin":"yuán","meaning":"nhân viên, thành viên","example":"他是一名服务员。","examplePinyin":"tā shì yī míng fúwùyuán.","translation":"Anh ấy là một nhân viên phục vụ."},{"id":"hsk3-T16-23","hanzi":"主任","pinyin":"zhǔrèn","meaning":"chủ nhiệm","example":"学校正在研究有关主任的问题。","examplePinyin":"Xuéxiào zhèngzài yánjiū yǒuguān zhǔrèn de wèntí.","translation":"Nhà trường đang nghiên cứu vấn đề liên quan đến chủ nhiệm."},{"id":"hsk3-T16-24","hanzi":"员工","pinyin":"yuángōng","meaning":"nhân viên","example":"我认识一位员工。","examplePinyin":"Wǒ rènshi yí wèi yuángōng.","translation":"Tôi quen một nhân viên."},{"id":"hsk3-T16-25","hanzi":"者","pinyin":"zhě","meaning":"người, hậu tố chỉ người","example":"“者”这个词在课文里出现了。","examplePinyin":"“zhě” zhège cí zài kèwén lǐ chūxiàn le.","translation":"Từ “người, hậu tố chỉ người” xuất hiện trong bài khóa."},{"id":"hsk3-T16-26","hanzi":"读者","pinyin":"dúzhě","meaning":"độc giả","example":"今天我和一位读者聊天了。","examplePinyin":"Jīntiān wǒ hé yí wèi dúzhě liáotiān le.","translation":"Hôm nay tôi đã trò chuyện với một độc giả."},{"id":"hsk3-T16-27","hanzi":"职工","pinyin":"zhígōng","meaning":"người lao động","example":"那位职工正在等朋友。","examplePinyin":"Nà wèi zhígōng zhèngzài děng péngyou.","translation":"Vị người lao động kia đang đợi bạn."},{"id":"hsk3-T16-28","hanzi":"职业","pinyin":"zhíyè","meaning":"nghề nghiệp","example":"今天老师教了我们“职业”这个词。","examplePinyin":"Jīntiān lǎoshī jiāo le wǒmen “zhíyè” zhège cí.","translation":"Hôm nay giáo viên dạy chúng tôi từ “nghề nghiệp”."},{"id":"hsk3-T16-29","hanzi":"志愿者","pinyin":"zhìyuànzhě","meaning":"tình nguyện viên","example":"我在学校遇见了一位志愿者。","examplePinyin":"Wǒ zài xuéxiào yùjiàn le yí wèi zhìyuànzhě.","translation":"Tôi gặp một tình nguyện viên ở trường."},{"id":"hsk3-T16-30","hanzi":"专业","pinyin":"zhuānyè","meaning":"chuyên ngành","example":"他昨天和朋友谈到了专业。","examplePinyin":"Tā zuótiān hé péngyou tándào le zhuānyè.","translation":"Hôm qua anh ấy và bạn trò chuyện về chuyên ngành."},{"id":"hsk3-T16-31","hanzi":"专家","pinyin":"zhuānjiā","meaning":"chuyên gia","example":"这位专家工作很认真。","examplePinyin":"Zhè wèi zhuānjiā gōngzuò hěn rènzhēn.","translation":"Vị chuyên gia này làm việc rất nghiêm túc."},{"id":"hsk3-T16-32","hanzi":"代表","pinyin":"dàibiǎo","meaning":"đại diện","example":"今天我和一位代表聊天了。","examplePinyin":"Jīntiān wǒ hé yí wèi dàibiǎo liáotiān le.","translation":"Hôm nay tôi đã trò chuyện với một đại diện."},{"id":"hsk3-T16-33","hanzi":"领","pinyin":"lǐng","meaning":"dẫn đầu, nhận","example":"请到办公室领你的新书。","examplePinyin":"Qǐng dào bàngōngshì lǐng nǐ de xīn shū.","translation":"Hãy đến văn phòng nhận sách mới của bạn."},{"id":"hsk3-T16-34","hanzi":"馆","pinyin":"guǎn","meaning":"nhà, cơ sở","example":"今天老师教了我们“馆”这个词。","examplePinyin":"Jīntiān lǎoshī jiāo le wǒmen “guǎn” zhège cí.","translation":"Hôm nay giáo viên dạy chúng tôi từ “nhà, cơ sở”."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/cac-hoat-dong/"},{"id":17,"name":"NHỮNG THAY ĐỔI","words":[{"id":"hsk3-T17-01","hanzi":"完美","pinyin":"wánměi","meaning":"hoàn hảo","example":"这个计划很完美。","examplePinyin":"zhège jìhuà hěn wánměi.","translation":"Kế hoạch này rất hoàn hảo."},{"id":"hsk3-T17-02","hanzi":"创新","pinyin":"chuàngxīn","meaning":"đổi mới","example":"我希望以后能创新学习方法。","examplePinyin":"Wǒ xīwàng yǐhòu néng chuàngxīn xuéxí fāngfǎ.","translation":"Tôi hy vọng sau này có thể đổi mới phương pháp học."},{"id":"hsk3-T17-03","hanzi":"创造","pinyin":"chuàngzào","meaning":"sáng tạo","example":"我们需要创造机会。","examplePinyin":"Wǒmen xūyào chuàngzào jīhuì.","translation":"Chúng ta cần sáng tạo cơ hội."},{"id":"hsk3-T17-04","hanzi":"创作","pinyin":"chuàngzuò","meaning":"sáng tác","example":"他们正在创作音乐。","examplePinyin":"Tāmen zhèngzài chuàngzuò yīnyuè.","translation":"Họ đang sáng tác âm nhạc."},{"id":"hsk3-T17-05","hanzi":"发达","pinyin":"fādá","meaning":"phát triển, thịnh vượng","example":"这座城市很发达。","examplePinyin":"zhè zuò chéngshì hěn fādá.","translation":"Thành phố này rất phát triển, thịnh vượng."},{"id":"hsk3-T17-06","hanzi":"发展","pinyin":"fāzhǎn","meaning":"phát triển","example":"这个城市发展很快。","examplePinyin":"zhège chéngshì fāzhǎn hěnkuài.","translation":"Thành phố này phát triển rất nhanh."},{"id":"hsk3-T17-07","hanzi":"转变","pinyin":"zhuǎnbiàn","meaning":"chuyển biến","example":"他的想法发生了很大的转变。","examplePinyin":"Tā de xiǎngfǎ fāshēng le hěn dà de zhuǎnbiàn.","translation":"Suy nghĩ của anh ấy đã thay đổi đáng kể."},{"id":"hsk3-T17-08","hanzi":"增加","pinyin":"zēngjiā","meaning":"tăng thêm","example":"我们需要增加收入。","examplePinyin":"Wǒmen xūyào zēngjiā shōurù.","translation":"Chúng ta cần tăng thêm thu nhập."},{"id":"hsk3-T17-09","hanzi":"前进","pinyin":"qiánjìn","meaning":"tiến lên","example":"虽然路很难走，我们还是继续前进。","examplePinyin":"Suīrán lù hěn nán zǒu, wǒmen háishi jìxù qiánjìn.","translation":"Dù đường khó đi, chúng tôi vẫn tiếp tục tiến lên."},{"id":"hsk3-T17-10","hanzi":"变化","pinyin":"biànhuà","meaning":"thay đổi","example":"这里的变化很大。","examplePinyin":"zhèlǐ de biànhuà hěndà.","translation":"Nơi này thay đổi rất nhiều."},{"id":"hsk3-T17-11","hanzi":"变为","pinyin":"biànwéi","meaning":"biến thành","example":"这间旧教室变为了图书馆。","examplePinyin":"Zhè jiān jiù jiàoshì biànwéi le túshūguǎn.","translation":"Phòng học cũ này được chuyển thành thư viện."},{"id":"hsk3-T17-12","hanzi":"成长","pinyin":"chéngzhǎng","meaning":"trưởng thành","example":"孩子在成长过程中需要家人的关心。","examplePinyin":"Háizi zài chéngzhǎng guòchéng zhōng xūyào jiārén de guānxīn.","translation":"Trẻ cần sự quan tâm của gia đình trong quá trình trưởng thành."},{"id":"hsk3-T17-13","hanzi":"造","pinyin":"zào","meaning":"chế tạo","example":"这座桥是十年前造的。","examplePinyin":"Zhè zuò qiáo shì shí nián qián zào de.","translation":"Cây cầu này được xây cách đây mười năm."},{"id":"hsk3-T17-14","hanzi":"修","pinyin":"xiū","meaning":"sửa chữa","example":"自行车坏了，我要去修。","examplePinyin":"Zìxíngchē huài le, wǒ yào qù xiū.","translation":"Xe đạp hỏng rồi, tôi phải đi sửa."},{"id":"hsk3-T17-15","hanzi":"进步","pinyin":"jìnbù","meaning":"tiến bộ","example":"坚持学习以后，他进步了很多。","examplePinyin":"Jiānchí xuéxí yǐhòu, tā jìnbù le hěn duō.","translation":"Sau khi kiên trì học, anh ấy tiến bộ rất nhiều."},{"id":"hsk3-T17-16","hanzi":"进一步","pinyin":"jìn yí bù","meaning":"hơn nữa","example":"我想进一步了解中国文化。","examplePinyin":"Wǒ xiǎng jìn yí bù liǎojiě Zhōngguó wénhuà.","translation":"Tôi muốn tìm hiểu sâu hơn về văn hóa Trung Quốc."},{"id":"hsk3-T17-17","hanzi":"进展","pinyin":"jìnzhǎn","meaning":"tiến triển","example":"这项工作进展得怎么样？","examplePinyin":"Zhè xiàng gōngzuò jìnzhǎn de zěnmeyàng?","translation":"Công việc này tiến triển thế nào?"},{"id":"hsk3-T17-18","hanzi":"加强","pinyin":"jiāqiáng","meaning":"tăng cường","example":"我们需要加强练习。","examplePinyin":"Wǒmen xūyào jiāqiáng liànxí.","translation":"Chúng ta cần tăng cường việc luyện tập."},{"id":"hsk3-T17-19","hanzi":"完善","pinyin":"wánshàn","meaning":"hoàn thiện","example":"他们正在完善网站。","examplePinyin":"Tāmen zhèngzài wánshàn wǎngzhàn.","translation":"Họ đang hoàn thiện website."},{"id":"hsk3-T17-20","hanzi":"调整","pinyin":"tiáozhěng","meaning":"điều chỉnh","example":"学校决定调整学习时间。","examplePinyin":"Xuéxiào juédìng tiáozhěng xuéxí shíjiān.","translation":"Nhà trường quyết định điều chỉnh thời gian học."},{"id":"hsk3-T17-21","hanzi":"形成","pinyin":"xíngchéng","meaning":"hình thành","example":"老师让我们形成习惯。","examplePinyin":"Lǎoshī ràng wǒmen xíngchéng xíguàn.","translation":"Giáo viên yêu cầu chúng tôi hình thành thói quen."},{"id":"hsk3-T17-22","hanzi":"开放","pinyin":"kāifàng","meaning":"mở cửa","example":"公园每天早上六点开放。","examplePinyin":"Gōngyuán měitiān zǎoshang liù diǎn kāifàng.","translation":"Công viên mở cửa lúc sáu giờ sáng mỗi ngày."},{"id":"hsk3-T17-23","hanzi":"开始","pinyin":"kāishǐ","meaning":"bắt đầu","example":"我们开始上课。","examplePinyin":"Wǒmen kāishǐ shàngkè.","translation":"Chúng ta bắt đầu vào học."},{"id":"hsk3-T17-24","hanzi":"开展","pinyin":"kāizhǎn","meaning":"triển khai","example":"他们正在开展活动。","examplePinyin":"Tāmen zhèngzài kāizhǎn huódòng.","translation":"Họ đang triển khai hoạt động."},{"id":"hsk3-T17-25","hanzi":"先进","pinyin":"xiānjìn","meaning":"tiên tiến","example":"这里的设备很先进。","examplePinyin":"zhèlǐ de shèbèi hěn xiānjìn.","translation":"Thiết bị ở đây rất tiên tiến."},{"id":"hsk3-T17-26","hanzi":"增长","pinyin":"zēngzhǎng","meaning":"tăng trưởng","example":"今年游客数量增长了很多。","examplePinyin":"Jīnnián yóukè shùliàng zēngzhǎng le hěn duō.","translation":"Lượng du khách năm nay tăng lên nhiều."},{"id":"hsk3-T17-27","hanzi":"开发","pinyin":"kāifā","meaning":"phát triển","example":"我希望以后能开发游戏。","examplePinyin":"Wǒ xīwàng yǐhòu néng kāifā yóuxì.","translation":"Tôi hy vọng sau này có thể phát triển trò chơi."},{"id":"hsk3-T17-28","hanzi":"修改","pinyin":"xiūgǎi","meaning":"sửa đổi","example":"我们需要修改作文。","examplePinyin":"Wǒmen xūyào xiūgǎi zuòwén.","translation":"Chúng ta cần sửa đổi bài văn."},{"id":"hsk3-T17-29","hanzi":"改进","pinyin":"gǎijìn","meaning":"cải tiến","example":"他们正在改进服务。","examplePinyin":"Tāmen zhèngzài gǎijìn fúwù.","translation":"Họ đang cải tiến dịch vụ."},{"id":"hsk3-T17-30","hanzi":"改造","pinyin":"gǎizào","meaning":"cải tạo","example":"学校决定改造旧房子。","examplePinyin":"Xuéxiào juédìng gǎizào jiù fángzi.","translation":"Nhà trường quyết định cải tạo nhà cũ."},{"id":"hsk3-T17-31","hanzi":"化","pinyin":"huà","meaning":"hóa, biến đổi","example":"“变化”里的“化”有改变的意思。","examplePinyin":"“Biànhuà” lǐ de “huà” yǒu gǎibiàn de yìsi.","translation":"Chữ 化 trong 变化 mang nghĩa biến đổi."},{"id":"hsk3-T17-32","hanzi":"生长","pinyin":"shēngzhǎng","meaning":"sinh trưởng","example":"春天到了，花草开始生长。","examplePinyin":"Chūntiān dào le, huācǎo kāishǐ shēngzhǎng.","translation":"Mùa xuân đến, hoa cỏ bắt đầu sinh trưởng."},{"id":"hsk3-T17-33","hanzi":"体现","pinyin":"tǐxiàn","meaning":"thể hiện","example":"我们需要体现文化。","examplePinyin":"Wǒmen xūyào tǐxiàn wénhuà.","translation":"Chúng ta cần thể hiện văn hóa."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/nhung-thay-doi/"},{"id":18,"name":"THÔNG TIN VÀ PHƯƠNG TIỆN","words":[{"id":"hsk3-T18-01","hanzi":"播出","pinyin":"bōchū","meaning":"phát sóng","example":"我希望以后能播出新闻。","examplePinyin":"Wǒ xīwàng yǐhòu néng bōchū xīnwén.","translation":"Tôi hy vọng sau này có thể phát sóng bản tin."},{"id":"hsk3-T18-02","hanzi":"播放","pinyin":"bōfàng","meaning":"bật, phát","example":"我们需要播放视频。","examplePinyin":"Wǒmen xūyào bōfàng shìpín.","translation":"Chúng ta cần bật, phát video."},{"id":"hsk3-T18-03","hanzi":"互联网","pinyin":"hùliánwǎng","meaning":"Internet","example":"我们希望进一步了解互联网。","examplePinyin":"Wǒmen xīwàng jìn yí bù liǎojiě hùliánwǎng.","translation":"Chúng tôi hy vọng tìm hiểu sâu hơn về Internet."},{"id":"hsk3-T18-04","hanzi":"媒体","pinyin":"méitǐ","meaning":"truyền thông","example":"很多人都很关心媒体。","examplePinyin":"Hěn duō rén dōu hěn guānxīn méitǐ.","translation":"Nhiều người rất quan tâm đến truyền thông."},{"id":"hsk3-T18-05","hanzi":"传播","pinyin":"chuánbō","meaning":"truyền bá","example":"老师让我们传播消息。","examplePinyin":"Lǎoshī ràng wǒmen chuánbō xiāoxi.","translation":"Giáo viên yêu cầu chúng tôi truyền bá tin tức."},{"id":"hsk3-T18-06","hanzi":"传来","pinyin":"chuánlái","meaning":"vọng đến","example":"我希望以后能传来声音。","examplePinyin":"Wǒ xīwàng yǐhòu néng chuánlái shēngyīn.","translation":"Tôi hy vọng sau này có thể vọng đến âm thanh."},{"id":"hsk3-T18-07","hanzi":"打听","pinyin":"dǎting","meaning":"hỏi thăm","example":"我们需要打听地址。","examplePinyin":"Wǒmen xūyào dǎting dìzhǐ.","translation":"Chúng ta cần hỏi thăm địa chỉ."},{"id":"hsk3-T18-08","hanzi":"现实","pinyin":"xiànshí","meaning":"hiện thực","example":"这本书介绍了现实。","examplePinyin":"Zhè běn shū jièshào le xiànshí.","translation":"Cuốn sách này giới thiệu về hiện thực."},{"id":"hsk3-T18-09","hanzi":"确实","pinyin":"quèshí","meaning":"quả thực","example":"我们需要更多关于确实的信息。","examplePinyin":"Wǒmen xūyào gèng duō guānyú quèshí de xìnxī.","translation":"Chúng tôi cần thêm thông tin về quả thực."},{"id":"hsk3-T18-10","hanzi":"内容","pinyin":"nèiróng","meaning":"nội dung","example":"你能介绍一下内容吗？","examplePinyin":"Nǐ néng jièshào yíxià nèiróng ma?","translation":"Bạn có thể giới thiệu đôi chút về nội dung không?"},{"id":"hsk3-T18-11","hanzi":"牌子","pinyin":"páizi","meaning":"biển hiệu","example":"今天老师讲了关于牌子的内容。","examplePinyin":"Jīntiān lǎoshī jiǎng le guānyú páizi de nèiróng.","translation":"Hôm nay giáo viên giảng nội dung về biển hiệu."},{"id":"hsk3-T18-12","hanzi":"普及","pinyin":"pǔjí","meaning":"phổ biến","example":"经理要求我们认真普及。","examplePinyin":"Jīnglǐ yāoqiú wǒmen rènzhēn pǔjí.","translation":"Giám đốc yêu cầu chúng tôi phổ biến nghiêm túc."},{"id":"hsk3-T18-13","hanzi":"推广","pinyin":"tuīguǎng","meaning":"quảng bá","example":"他们正在推广新方法。","examplePinyin":"Tāmen zhèngzài tuīguǎng xīn fāngfǎ.","translation":"Họ đang quảng bá phương pháp mới."},{"id":"hsk3-T18-14","hanzi":"文明","pinyin":"wénmíng","meaning":"văn minh","example":"很多人都很关心文明。","examplePinyin":"Hěn duō rén dōu hěn guānxīn wénmíng.","translation":"Nhiều người rất quan tâm đến văn minh."},{"id":"hsk3-T18-15","hanzi":"公布","pinyin":"gōngbù","meaning":"công bố","example":"老师让我们公布成绩。","examplePinyin":"Lǎoshī ràng wǒmen gōngbù chéngjì.","translation":"Giáo viên yêu cầu chúng tôi công bố điểm số."},{"id":"hsk3-T18-16","hanzi":"录","pinyin":"lù","meaning":"ghi âm","example":"我希望以后能录一段视频。","examplePinyin":"Wǒ xīwàng yǐhòu néng lù yí duàn shìpín.","translation":"Tôi hy vọng sau này có thể ghi âm một đoạn video."},{"id":"hsk3-T18-17","hanzi":"声明","pinyin":"shēngmíng","meaning":"tuyên bố","example":"你知道应该怎么声明吗？","examplePinyin":"Nǐ zhīdào yīnggāi zěnme shēngmíng ma?","translation":"Bạn biết nên tuyên bố như thế nào không?"},{"id":"hsk3-T18-18","hanzi":"录音","pinyin":"lùyīn","meaning":"ghi âm","example":"这本书介绍了录音。","examplePinyin":"Zhè běn shū jièshào le lùyīn.","translation":"Cuốn sách này giới thiệu về ghi âm."},{"id":"hsk3-T18-19","hanzi":"收看","pinyin":"shōukàn","meaning":"xem truyền hình","example":"学校决定收看新闻。","examplePinyin":"Xuéxiào juédìng shōukàn xīnwén.","translation":"Nhà trường quyết định xem truyền hình bản tin."},{"id":"hsk3-T18-20","hanzi":"事实","pinyin":"shìshí","meaning":"sự thật","example":"你能介绍一下事实吗？","examplePinyin":"Nǐ néng jièshào yíxià shìshí ma?","translation":"Bạn có thể giới thiệu đôi chút về sự thật không?"},{"id":"hsk3-T18-21","hanzi":"收听","pinyin":"shōutīng","meaning":"nghe phát thanh","example":"我希望以后能收听广播。","examplePinyin":"Wǒ xīwàng yǐhòu néng shōutīng guǎngbō.","translation":"Tôi hy vọng sau này có thể nghe phát thanh phát thanh."},{"id":"hsk3-T18-22","hanzi":"收音机","pinyin":"shōuyīnjī","meaning":"máy radio","example":"他昨天和朋友谈到了收音机。","examplePinyin":"Tā zuótiān hé péngyou tándào le shōuyīnjī.","translation":"Hôm qua anh ấy và bạn trò chuyện về máy radio."},{"id":"hsk3-T18-23","hanzi":"广播","pinyin":"guǎngbō","meaning":"phát thanh","example":"他希望明天可以继续广播。","examplePinyin":"Tā xīwàng míngtiān kěyǐ jìxù guǎngbō.","translation":"Anh ấy hy vọng ngày mai có thể tiếp tục phát thanh."},{"id":"hsk3-T18-24","hanzi":"记录","pinyin":"jìlù","meaning":"ghi chép","example":"学校决定记录内容。","examplePinyin":"Xuéxiào juédìng jìlù nèiróng.","translation":"Nhà trường quyết định ghi chép nội dung."},{"id":"hsk3-T18-25","hanzi":"显示","pinyin":"xiǎnshì","meaning":"hiển thị","example":"老师让我们显示时间。","examplePinyin":"Lǎoshī ràng wǒmen xiǎnshì shíjiān.","translation":"Giáo viên yêu cầu chúng tôi hiển thị thời gian."},{"id":"hsk3-T18-26","hanzi":"直播","pinyin":"zhíbō","meaning":"phát trực tiếp","example":"今天我们一起练习直播。","examplePinyin":"Jīntiān wǒmen yìqǐ liànxí zhíbō.","translation":"Hôm nay chúng tôi cùng luyện phát trực tiếp."},{"id":"hsk3-T18-27","hanzi":"消息","pinyin":"xiāoxi","meaning":"tin tức","example":"我对消息很感兴趣。","examplePinyin":"Wǒ duì xiāoxi hěn gǎn xìngqù.","translation":"Tôi rất hứng thú với tin tức."},{"id":"hsk3-T18-28","hanzi":"信封","pinyin":"xìnfēng","meaning":"phong bì","example":"我昨天买了信封。","examplePinyin":"Wǒ zuótiān mǎi le xìnfēng.","translation":"Hôm qua tôi đã mua phong bì."},{"id":"hsk3-T18-29","hanzi":"宣布","pinyin":"xuānbù","meaning":"tuyên bố","example":"学校决定宣布结果。","examplePinyin":"Xuéxiào juédìng xuānbù jiéguǒ.","translation":"Nhà trường quyết định tuyên bố kết quả."},{"id":"hsk3-T18-30","hanzi":"影视","pinyin":"yǐngshì","meaning":"điện ảnh và truyền hình","example":"你能介绍一下影视吗？","examplePinyin":"Nǐ néng jièshào yíxià yǐngshì ma?","translation":"Bạn có thể giới thiệu đôi chút về điện ảnh và truyền hình không?"},{"id":"hsk3-T18-31","hanzi":"公开","pinyin":"gōngkāi","meaning":"công khai","example":"我希望以后能公开信息。","examplePinyin":"Wǒ xīwàng yǐhòu néng gōngkāi xìnxī.","translation":"Tôi hy vọng sau này có thể công khai thông tin."},{"id":"hsk3-T18-32","hanzi":"真实","pinyin":"zhēnshí","meaning":"chân thực","example":"他昨天和朋友谈到了真实。","examplePinyin":"Tā zuótiān hé péngyou tándào le zhēnshí.","translation":"Hôm qua anh ấy và bạn trò chuyện về chân thực."},{"id":"hsk3-T18-33","hanzi":"邮票","pinyin":"yóupiào","meaning":"tem thư","example":"我们需要一些邮票。","examplePinyin":"Wǒmen xūyào yìxiē yóupiào.","translation":"Chúng ta cần một ít tem thư."},{"id":"hsk3-T18-34","hanzi":"报","pinyin":"bào","meaning":"báo tin","example":"老师让我们先报。","examplePinyin":"Lǎoshī ràng wǒmen xiān bào.","translation":"Giáo viên yêu cầu chúng tôi báo tin trước."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/thong-tin-va-phuong-tien/"},{"id":19,"name":"THÀNH TỰU VÀ KẾT QUẢ","words":[{"id":"hsk3-T19-01","hanzi":"成功","pinyin":"chénggōng","meaning":"thành công","example":"经过三个月的努力，他终于成功了。","examplePinyin":"Jīngguò sān ge yuè de nǔlì, tā zhōngyú chénggōng le.","translation":"Sau ba tháng cố gắng, cuối cùng anh ấy đã thành công."},{"id":"hsk3-T19-02","hanzi":"成果","pinyin":"chéngguǒ","meaning":"thành quả","example":"这是我们一起努力的成果。","examplePinyin":"Zhè shì wǒmen yìqǐ nǔlì de chéngguǒ.","translation":"Đây là thành quả của chúng tôi cùng cố gắng."},{"id":"hsk3-T19-03","hanzi":"成就","pinyin":"chéngjiù","meaning":"thành tựu","example":"她在工作中取得了很大的成就。","examplePinyin":"Tā zài gōngzuò zhōng qǔdé le hěn dà de chéngjiù.","translation":"Cô ấy đạt được thành tựu lớn trong công việc."},{"id":"hsk3-T19-04","hanzi":"成熟","pinyin":"chéngshú","meaning":"trưởng thành","example":"他很成熟。","examplePinyin":"tā hěn chéngshú.","translation":"Anh ấy rất trưởng thành."},{"id":"hsk3-T19-05","hanzi":"达到","pinyin":"dádào","meaning":"đạt được","example":"他的汉语水平达到了目标。","examplePinyin":"Tā de Hànyǔ shuǐpíng dádào le mùbiāo.","translation":"Trình độ tiếng Trung của anh ấy đã đạt mục tiêu."},{"id":"hsk3-T19-06","hanzi":"后果","pinyin":"hòuguǒ","meaning":"hậu quả","example":"不注意安全，后果可能很严重。","examplePinyin":"Bú zhùyì ānquán, hòuguǒ kěnéng hěn yánzhòng.","translation":"Không chú ý an toàn có thể dẫn đến hậu quả nghiêm trọng."},{"id":"hsk3-T19-07","hanzi":"争取","pinyin":"zhēngqǔ","meaning":"phấn đấu giành lấy","example":"他们正在争取机会。","examplePinyin":"Tāmen zhèngzài zhēngqǔ jīhuì.","translation":"Họ đang phấn đấu giành lấy cơ hội."},{"id":"hsk3-T19-08","hanzi":"胜","pinyin":"shèng","meaning":"chiến thắng","example":"我们队以三比一获胜。","examplePinyin":"Wǒmen duì yǐ sān bǐ yī huòshèng.","translation":"Đội chúng tôi thắng với tỷ số ba một."},{"id":"hsk3-T19-09","hanzi":"领先","pinyin":"lǐngxiān","meaning":"dẫn đầu","example":"比赛开始以后，我们队一直领先。","examplePinyin":"Bǐsài kāishǐ yǐhòu, wǒmen duì yìzhí lǐngxiān.","translation":"Sau khi trận đấu bắt đầu, đội chúng tôi luôn dẫn trước."},{"id":"hsk3-T19-10","hanzi":"胜利","pinyin":"shènglì","meaning":"thắng lợi","example":"最后我们取得了胜利。","examplePinyin":"Zuìhòu wǒmen qǔdé le shènglì.","translation":"Cuối cùng chúng tôi đã giành chiến thắng."},{"id":"hsk3-T19-11","hanzi":"输","pinyin":"shū","meaning":"thua","example":"这次比赛输了没关系。","examplePinyin":"Zhè cì bǐsài shū le méi guānxi.","translation":"Thua trận lần này cũng không sao."},{"id":"hsk3-T19-12","hanzi":"效果","pinyin":"xiàoguǒ","meaning":"hiệu quả","example":"这个学习方法的效果很好。","examplePinyin":"Zhège xuéxí fāngfǎ de xiàoguǒ hěn hǎo.","translation":"Phương pháp học này có hiệu quả rất tốt."},{"id":"hsk3-T19-13","hanzi":"赢","pinyin":"yíng","meaning":"thắng","example":"他努力练习，终于赢了比赛。","examplePinyin":"Tā nǔlì liànxí, zhōngyú yíng le bǐsài.","translation":"Anh ấy luyện tập chăm chỉ và cuối cùng thắng cuộc thi."},{"id":"hsk3-T19-14","hanzi":"制作","pinyin":"zhìzuò","meaning":"sản xuất","example":"老师让我们制作学习视频。","examplePinyin":"Lǎoshī ràng wǒmen zhìzuò xuéxí shìpín.","translation":"Giáo viên yêu cầu chúng tôi sản xuất video học tập."},{"id":"hsk3-T19-15","hanzi":"银牌","pinyin":"yínpái","meaning":"huy chương bạc","example":"她第一次比赛就得了一块银牌。","examplePinyin":"Tā dì yī cì bǐsài jiù dé le yí kuài yínpái.","translation":"Lần đầu thi cô ấy đã giành huy chương bạc."},{"id":"hsk3-T19-16","hanzi":"有效","pinyin":"yǒuxiào","meaning":"có hiệu quả","example":"这个方法很有效。","examplePinyin":"zhège fāngfǎ hěn yǒuxiào.","translation":"Phương pháp này rất có hiệu quả."},{"id":"hsk3-T19-17","hanzi":"造成","pinyin":"zàochéng","meaning":"gây ra","example":"他们正在造成交通问题。","examplePinyin":"Tāmen zhèngzài zàochéng jiāotōng wèntí.","translation":"Họ đang gây ra vấn đề giao thông."},{"id":"hsk3-T19-18","hanzi":"结束","pinyin":"jiéshù","meaning":"kết thúc","example":"会议五点结束。","examplePinyin":"huìyì wǔ diǎn jiéshù.","translation":"Cuộc họp kết thúc lúc năm giờ."},{"id":"hsk3-T19-19","hanzi":"产生","pinyin":"chǎnshēng","meaning":"nảy sinh","example":"这件事产生了新的问题。","examplePinyin":"Zhè jiàn shì chǎnshēng le xīn de wèntí.","translation":"Việc này làm nảy sinh vấn đề mới."},{"id":"hsk3-T19-20","hanzi":"成立","pinyin":"chénglì","meaning":"thành lập","example":"我们的学习小组去年成立了。","examplePinyin":"Wǒmen de xuéxí xiǎozǔ qùnián chénglì le.","translation":"Nhóm học của chúng tôi được thành lập năm ngoái."},{"id":"hsk3-T19-21","hanzi":"错误","pinyin":"cuòwù","meaning":"lỗi, sai lầm","example":"老师指出了我作文里的错误。","examplePinyin":"Lǎoshī zhǐchū le wǒ zuòwén lǐ de cuòwù.","translation":"Giáo viên chỉ ra lỗi trong bài văn của tôi."},{"id":"hsk3-T19-22","hanzi":"发明","pinyin":"fāmíng","meaning":"phát minh","example":"他们正在发明新机器。","examplePinyin":"Tāmen zhèngzài fāmíng xīn jīqì.","translation":"Họ đang phát minh máy móc mới."},{"id":"hsk3-T19-23","hanzi":"打破","pinyin":"dǎpò","meaning":"đập vỡ","example":"学校决定打破纪录。","examplePinyin":"Xuéxiào juédìng dǎpò jìlù.","translation":"Nhà trường quyết định đập vỡ kỷ lục."},{"id":"hsk3-T19-24","hanzi":"反应","pinyin":"fǎnyìng","meaning":"phản ứng","example":"听到消息后，她的反应很特别。","examplePinyin":"Tīngdào xiāoxi hòu, tā de fǎnyìng hěn tèbié.","translation":"Sau khi nghe tin, phản ứng của cô ấy rất đặc biệt."},{"id":"hsk3-T19-25","hanzi":"纪录","pinyin":"jìlù","meaning":"kỷ lục","example":"他打破了学校的跳高纪录。","examplePinyin":"Tā dǎpò le xuéxiào de tiàogāo jìlù.","translation":"Anh ấy phá kỷ lục nhảy cao của trường."},{"id":"hsk3-T19-26","hanzi":"金牌","pinyin":"jīnpái","meaning":"huy chương vàng","example":"他在运动会上得到了金牌。","examplePinyin":"Tā zài yùndònghuì shang dédào le jīnpái.","translation":"Anh ấy giành huy chương vàng tại hội thao."},{"id":"hsk3-T19-27","hanzi":"克服","pinyin":"kèfú","meaning":"khắc phục","example":"他们正在克服困难。","examplePinyin":"Tāmen zhèngzài kèfú kùnnan.","translation":"Họ đang khắc phục khó khăn."},{"id":"hsk3-T19-28","hanzi":"破","pinyin":"pò","meaning":"vỡ, rách","example":"我的鞋破了，不能再穿。","examplePinyin":"Wǒ de xié pò le, bù néng zài chuān.","translation":"Giày tôi rách rồi, không thể đi tiếp."},{"id":"hsk3-T19-29","hanzi":"破坏","pinyin":"pòhuài","meaning":"phá hủy","example":"这件事我们明天再破坏吧。","examplePinyin":"Zhè jiàn shì wǒmen míngtiān zài pòhuài ba.","translation":"Việc này ngày mai chúng ta hãy phá hủy nhé."},{"id":"hsk3-T19-30","hanzi":"取消","pinyin":"qǔxiāo","meaning":"hủy bỏ","example":"我希望以后能取消计划。","examplePinyin":"Wǒ xīwàng yǐhòu néng qǔxiāo jìhuà.","translation":"Tôi hy vọng sau này có thể hủy bỏ kế hoạch."},{"id":"hsk3-T19-31","hanzi":"失去","pinyin":"shīqù","meaning":"mất đi","example":"我们需要失去机会。","examplePinyin":"Wǒmen xūyào shīqù jīhuì.","translation":"Chúng ta cần mất đi cơ hội."},{"id":"hsk3-T19-32","hanzi":"生产","pinyin":"shēngchǎn","meaning":"sản xuất","example":"他们正在生产衣服。","examplePinyin":"Tāmen zhèngzài shēngchǎn yīfu.","translation":"Họ đang sản xuất quần áo."},{"id":"hsk3-T19-33","hanzi":"作品","pinyin":"zuòpǐn","meaning":"tác phẩm","example":"这些作品都是学生自己完成的。","examplePinyin":"Zhèxiē zuòpǐn dōu shì xuésheng zìjǐ wánchéng de.","translation":"Những tác phẩm này đều do học sinh tự hoàn thành."},{"id":"hsk3-T19-34","hanzi":"制造","pinyin":"zhìzào","meaning":"chế tạo","example":"老师让我们制造机器。","examplePinyin":"Lǎoshī ràng wǒmen zhìzào jīqì.","translation":"Giáo viên yêu cầu chúng tôi chế tạo máy móc."},{"id":"hsk3-T19-35","hanzi":"消失","pinyin":"xiāoshī","meaning":"biến mất","example":"雨停以后，天空中的乌云消失了。","examplePinyin":"Yǔ tíng yǐhòu, tiānkōng zhōng de wūyún xiāoshī le.","translation":"Sau khi mưa tạnh, mây đen trên trời biến mất."},{"id":"hsk3-T19-36","hanzi":"目标","pinyin":"mùbiāo","meaning":"mục tiêu","example":"我的目标是提高汉语水平。","examplePinyin":"wǒ de mùbiāo shì tígāo hànyǔshuǐpíng.","translation":"Mục tiêu của tôi là nâng cao trình độ tiếng Trung."},{"id":"hsk3-T19-37","hanzi":"得分","pinyin":"défēn","meaning":"ghi điểm","example":"我们队得分了。","examplePinyin":"wǒmen duì défēn le.","translation":"Đội chúng tôi ghi điểm rồi."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/thanh-tuu-va-ket-qua/"},{"id":20,"name":"SO SÁNH VÀ TUÂN THỦ","words":[{"id":"hsk3-T20-01","hanzi":"相关","pinyin":"xiāngguān","meaning":"liên quan","example":"这些书都跟中国历史相关。","examplePinyin":"Zhèxiē shū dōu gēn Zhōngguó lìshǐ xiāngguān.","translation":"Những cuốn sách này đều liên quan đến lịch sử Trung Quốc."},{"id":"hsk3-T20-02","hanzi":"相似","pinyin":"xiāngsì","meaning":"tương tự","example":"这两张照片很相似。","examplePinyin":"Zhè liǎng zhāng zhàopiàn hěn xiāngsì.","translation":"Hai bức ảnh này rất giống nhau."},{"id":"hsk3-T20-03","hanzi":"类似","pinyin":"lèisì","meaning":"gần giống","example":"我以前遇到过类似的问题。","examplePinyin":"Wǒ yǐqián yùdào guo lèisì de wèntí.","translation":"Trước đây tôi từng gặp vấn đề tương tự."},{"id":"hsk3-T20-04","hanzi":"区别","pinyin":"qūbié","meaning":"sự khác biệt","example":"这两个词有什么区别？","examplePinyin":"Zhè liǎng ge cí yǒu shénme qūbié?","translation":"Hai từ này có sự khác biệt gì?"},{"id":"hsk3-T20-05","hanzi":"比例","pinyin":"bǐlì","meaning":"tỷ lệ","example":"我们班男女生的比例是一比二。","examplePinyin":"Wǒmen bān nán nǚshēng de bǐlì shì yī bǐ èr.","translation":"Tỷ lệ nam nữ của lớp chúng tôi là một trên hai."},{"id":"hsk3-T20-06","hanzi":"标准","pinyin":"biāozhǔn","meaning":"tiêu chuẩn","example":"这次考试的标准比上次高。","examplePinyin":"Zhè cì kǎoshì de biāozhǔn bǐ shàng cì gāo.","translation":"Tiêu chuẩn kỳ thi lần này cao hơn lần trước."},{"id":"hsk3-T20-07","hanzi":"分别","pinyin":"fēnbié","meaning":"lần lượt, riêng biệt","example":"我和妹妹分别在北京和上海工作。","examplePinyin":"Wǒ hé mèimei fēnbié zài Běijīng hé Shànghǎi gōngzuò.","translation":"Tôi và em gái lần lượt làm việc ở Bắc Kinh và Thượng Hải."},{"id":"hsk3-T20-08","hanzi":"相当","pinyin":"xiāngdāng","meaning":"tương đương, khá","example":"这道数学题相当难。","examplePinyin":"Zhè dào shùxué tí xiāngdāng nán.","translation":"Bài toán này khá khó."},{"id":"hsk3-T20-09","hanzi":"相比","pinyin":"xiāngbǐ","meaning":"so với","example":"跟去年相比，今年的游客更多。","examplePinyin":"Gēn qùnián xiāngbǐ, jīnnián de yóukè gèng duō.","translation":"So với năm ngoái, du khách năm nay đông hơn."},{"id":"hsk3-T20-10","hanzi":"合法","pinyin":"héfǎ","meaning":"hợp pháp","example":"在这里工作需要合法的证件。","examplePinyin":"Zài zhèlǐ gōngzuò xūyào héfǎ de zhèngjiàn.","translation":"Làm việc ở đây cần có giấy tờ hợp pháp."},{"id":"hsk3-T20-11","hanzi":"合格","pinyin":"hégé","meaning":"đạt chuẩn","example":"他的考试成绩合格了。","examplePinyin":"Tā de kǎoshì chéngjì hégé le.","translation":"Kết quả thi của anh ấy đã đạt yêu cầu."},{"id":"hsk3-T20-12","hanzi":"配","pinyin":"pèi","meaning":"phối hợp","example":"这条蓝裙子配白鞋很好看。","examplePinyin":"Zhè tiáo lán qúnzi pèi bái xié hěn hǎokàn.","translation":"Váy xanh phối cùng giày trắng rất đẹp."},{"id":"hsk3-T20-13","hanzi":"配合","pinyin":"pèihé","meaning":"phối hợp","example":"大家互相配合，终于完成了任务。","examplePinyin":"Dàjiā hùxiāng pèihé, zhōngyú wánchéng le rènwu.","translation":"Mọi người phối hợp với nhau và cuối cùng hoàn thành nhiệm vụ."},{"id":"hsk3-T20-14","hanzi":"合","pinyin":"hé","meaning":"hợp, khép","example":"请把书合上。","examplePinyin":"Qǐng bǎ shū hé shang.","translation":"Hãy khép cuốn sách lại."},{"id":"hsk3-T20-15","hanzi":"适应","pinyin":"shìyìng","meaning":"thích nghi","example":"我还不适应北京的冬天。","examplePinyin":"Wǒ hái bú shìyìng Běijīng de dōngtiān.","translation":"Tôi vẫn chưa thích nghi với mùa đông Bắc Kinh."},{"id":"hsk3-T20-16","hanzi":"应当","pinyin":"yīngdāng","meaning":"nên, cần phải","example":"学生应当认真完成作业。","examplePinyin":"Xuésheng yīngdāng rènzhēn wánchéng zuòyè.","translation":"Học sinh nên nghiêm túc hoàn thành bài tập."},{"id":"hsk3-T20-17","hanzi":"应用","pinyin":"yìngyòng","meaning":"áp dụng","example":"我们可以把新语法应用到写作中。","examplePinyin":"Wǒmen kěyǐ bǎ xīn yǔfǎ yìngyòng dào xiězuò zhōng.","translation":"Chúng ta có thể áp dụng ngữ pháp mới vào bài viết."},{"id":"hsk3-T20-18","hanzi":"适合","pinyin":"shìhé","meaning":"phù hợp","example":"这本书适合初级汉语学生。","examplePinyin":"Zhè běn shū shìhé chūjí Hànyǔ xuésheng.","translation":"Cuốn sách này phù hợp với người học tiếng Trung sơ cấp."},{"id":"hsk3-T20-19","hanzi":"准","pinyin":"zhǔn","meaning":"chính xác","example":"这个钟不准，比我的手机慢。","examplePinyin":"Zhège zhōng bù zhǔn, bǐ wǒ de shǒujī màn.","translation":"Đồng hồ này chạy không chuẩn, chậm hơn điện thoại tôi."},{"id":"hsk3-T20-20","hanzi":"较","pinyin":"jiào","meaning":"khá, tương đối","example":"这个房间较大，而且阳光很好。","examplePinyin":"Zhège fángjiān jiào dà, érqiě yángguāng hěn hǎo.","translation":"Căn phòng này tương đối rộng và có nhiều ánh nắng."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/so-sanh-va-tuan-thu/"},{"id":21,"name":"PHÂN BỔ","words":[{"id":"hsk3-T21-01","hanzi":"首先","pinyin":"shǒuxiān","meaning":"trước tiên","example":"首先看菜单，然后再点菜。","examplePinyin":"Shǒuxiān kàn càidān, ránhòu zài diǎn cài.","translation":"Trước tiên xem thực đơn rồi mới gọi món."},{"id":"hsk3-T21-02","hanzi":"初步","pinyin":"chūbù","meaning":"sơ bộ","example":"我们已经有了初步的计划。","examplePinyin":"Wǒmen yǐjīng yǒu le chūbù de jìhuà.","translation":"Chúng tôi đã có kế hoạch sơ bộ."},{"id":"hsk3-T21-03","hanzi":"初级","pinyin":"chūjí","meaning":"sơ cấp","example":"这本书适合初级学生。","examplePinyin":"Zhè běn shū shìhé chūjí xuésheng.","translation":"Cuốn sách này phù hợp với học sinh sơ cấp."},{"id":"hsk3-T21-04","hanzi":"连续","pinyin":"liánxù","meaning":"liên tục","example":"他连续工作了十个小时。","examplePinyin":"Tā liánxù gōngzuò le shí ge xiǎoshí.","translation":"Anh ấy làm việc liên tục mười tiếng."},{"id":"hsk3-T21-05","hanzi":"排名","pinyin":"páimíng","meaning":"xếp hạng","example":"我们学校的比赛排名提高了。","examplePinyin":"Wǒmen xuéxiào de bǐsài páimíng tígāo le.","translation":"Thứ hạng thi đấu của trường chúng tôi tăng lên."},{"id":"hsk3-T21-06","hanzi":"团结","pinyin":"tuánjié","meaning":"đoàn kết","example":"我们班的学生很团结。","examplePinyin":"Wǒmen bān de xuésheng hěn tuánjié.","translation":"Học sinh lớp chúng tôi rất đoàn kết."},{"id":"hsk3-T21-07","hanzi":"头","pinyin":"tóu","meaning":"đầu, lượng từ gia súc","example":"今天我们学习“头”这个词。","examplePinyin":"Jīntiān wǒmen xuéxí “tóu” zhège cí.","translation":"Hôm nay chúng tôi học từ “头” (đầu)."},{"id":"hsk3-T21-08","hanzi":"分配","pinyin":"fēnpèi","meaning":"phân chia","example":"我希望以后能分配任务。","examplePinyin":"Wǒ xīwàng yǐhòu néng fēnpèi rènwu.","translation":"Tôi hy vọng sau này có thể phân chia nhiệm vụ."},{"id":"hsk3-T21-09","hanzi":"分组","pinyin":"fēnzǔ","meaning":"chia nhóm","example":"今天我们一起练习分组。","examplePinyin":"Jīntiān wǒmen yìqǐ liànxí fēnzǔ.","translation":"Hôm nay chúng tôi cùng luyện chia nhóm."},{"id":"hsk3-T21-10","hanzi":"总","pinyin":"zǒng","meaning":"tổng, luôn","example":"他总会找到解决问题的办法。","examplePinyin":"Tā zǒng huì zhǎodào jiějué wèntí de bànfǎ.","translation":"Anh ấy luôn tìm ra cách giải quyết vấn đề."},{"id":"hsk3-T21-11","hanzi":"公共","pinyin":"gōnggòng","meaning":"công cộng","example":"在公共场所不要大声说话。","examplePinyin":"Zài gōnggòng chǎngsuǒ bú yào dàshēng shuōhuà.","translation":"Đừng nói lớn ở nơi công cộng."},{"id":"hsk3-T21-12","hanzi":"足够","pinyin":"zúgòu","meaning":"đầy đủ","example":"我们有足够的时间。","examplePinyin":"Wǒmen yǒu zúgòu de shíjiān.","translation":"Chúng ta có đủ thời gian."},{"id":"hsk3-T21-13","hanzi":"组合","pinyin":"zǔhé","meaning":"kết hợp","example":"这两个词可以组合在一起。","examplePinyin":"Zhè liǎng ge cí kěyǐ zǔhé zài yìqǐ.","translation":"Hai từ này có thể kết hợp với nhau."},{"id":"hsk3-T21-14","hanzi":"整","pinyin":"zhěng","meaning":"cả, nguyên","example":"我整天都在学习汉语。","examplePinyin":"Wǒ zhěngtiān dōu zài xuéxí Hànyǔ.","translation":"Tôi học tiếng Trung suốt cả ngày."},{"id":"hsk3-T21-15","hanzi":"整理","pinyin":"zhěnglǐ","meaning":"sắp xếp","example":"他们正在整理房间。","examplePinyin":"Tāmen zhèngzài zhěnglǐ fángjiān.","translation":"Họ đang sắp xếp phòng."},{"id":"hsk3-T21-16","hanzi":"整个","pinyin":"zhěnggè","meaning":"toàn bộ","example":"整个下午我都在图书馆。","examplePinyin":"Zhěnggè xiàwǔ wǒ dōu zài túshūguǎn.","translation":"Cả buổi chiều tôi ở thư viện."},{"id":"hsk3-T21-17","hanzi":"整齐","pinyin":"zhěngqí","meaning":"ngăn nắp","example":"你的房间真整齐。","examplePinyin":"Nǐ de fángjiān zhēn zhěngqí.","translation":"Phòng bạn thật gọn gàng."},{"id":"hsk3-T21-18","hanzi":"整体","pinyin":"zhěngtǐ","meaning":"tổng thể","example":"整体来看，这次活动很成功。","examplePinyin":"Zhěngtǐ lái kàn, zhè cì huódòng hěn chénggōng.","translation":"Nhìn tổng thể, hoạt động lần này rất thành công."},{"id":"hsk3-T21-19","hanzi":"完整","pinyin":"wánzhěng","meaning":"hoàn chỉnh","example":"请用完整的句子回答问题。","examplePinyin":"Qǐng yòng wánzhěng de jùzi huídá wèntí.","translation":"Hãy dùng câu hoàn chỉnh để trả lời."},{"id":"hsk3-T21-20","hanzi":"共同","pinyin":"gòngtóng","meaning":"cùng nhau, chung","example":"我们为共同的目标一起努力。","examplePinyin":"Wǒmen wèi gòngtóng de mùbiāo yìqǐ nǔlì.","translation":"Chúng tôi cùng cố gắng vì mục tiêu chung."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/phan-bo/"},{"id":22,"name":"KINH TẾ VÀ TÀI CHÍNH","words":[{"id":"hsk3-T22-01","hanzi":"生意","pinyin":"shēngyi","meaning":"kinh doanh","example":"我对生意很感兴趣。","examplePinyin":"Wǒ duì shēngyi hěn gǎn xìngqù.","translation":"Tôi rất hứng thú với kinh doanh."},{"id":"hsk3-T22-02","hanzi":"市场","pinyin":"shìchǎng","meaning":"thị trường","example":"这本书介绍了市场。","examplePinyin":"Zhè běn shū jièshào le shìchǎng.","translation":"Cuốn sách này giới thiệu về thị trường."},{"id":"hsk3-T22-03","hanzi":"经济","pinyin":"jīngjì","meaning":"kinh tế","example":"我们需要更多关于经济的信息。","examplePinyin":"Wǒmen xūyào gèng duō guānyú jīngjì de xìnxī.","translation":"Chúng tôi cần thêm thông tin về kinh tế."},{"id":"hsk3-T22-04","hanzi":"经营","pinyin":"jīngyíng","meaning":"điều hành","example":"他们正在经营饭馆。","examplePinyin":"Tāmen zhèngzài jīngyíng fànguǎn.","translation":"Họ đang điều hành nhà hàng."},{"id":"hsk3-T22-05","hanzi":"数量","pinyin":"shùliàng","meaning":"số lượng","example":"今天老师讲了关于数量的内容。","examplePinyin":"Jīntiān lǎoshī jiǎng le guānyú shùliàng de nèiróng.","translation":"Hôm nay giáo viên giảng nội dung về số lượng."},{"id":"hsk3-T22-06","hanzi":"计算","pinyin":"jìsuàn","meaning":"tính toán","example":"老师让我们计算价格。","examplePinyin":"Lǎoshī ràng wǒmen jìsuàn jiàgé.","translation":"Giáo viên yêu cầu chúng tôi tính toán giá cả."},{"id":"hsk3-T22-07","hanzi":"商品","pinyin":"shāngpǐn","meaning":"hàng hóa","example":"我们希望进一步了解商品。","examplePinyin":"Wǒmen xīwàng jìn yí bù liǎojiě shāngpǐn.","translation":"Chúng tôi hy vọng tìm hiểu sâu hơn về hàng hóa."},{"id":"hsk3-T22-08","hanzi":"商业","pinyin":"shāngyè","meaning":"thương mại","example":"他在大学学习商业。","examplePinyin":"Tā zài dàxué xuéxí shāngyè.","translation":"Anh ấy học ngành thương mại ở đại học."},{"id":"hsk3-T22-09","hanzi":"富","pinyin":"fù","meaning":"giàu","example":"学校正在研究有关富的问题。","examplePinyin":"Xuéxiào zhèngzài yánjiū yǒuguān fù de wèntí.","translation":"Nhà trường đang nghiên cứu vấn đề liên quan đến giàu."},{"id":"hsk3-T22-10","hanzi":"预计","pinyin":"yùjì","meaning":"dự tính","example":"学校决定预计费用。","examplePinyin":"Xuéxiào juédìng yùjì fèiyòng.","translation":"Nhà trường quyết định dự tính chi phí."},{"id":"hsk3-T22-11","hanzi":"交易","pinyin":"jiāoyì","meaning":"giao dịch","example":"你知道应该怎么交易吗？","examplePinyin":"Nǐ zhīdào yīnggāi zěnme jiāoyì ma?","translation":"Bạn biết nên giao dịch như thế nào không?"},{"id":"hsk3-T22-12","hanzi":"节约","pinyin":"jiéyuē","meaning":"tiết kiệm","example":"我希望以后能节约时间。","examplePinyin":"Wǒ xīwàng yǐhòu néng jiéyuē shíjiān.","translation":"Tôi hy vọng sau này có thể tiết kiệm thời gian."},{"id":"hsk3-T22-13","hanzi":"浪费","pinyin":"làngfèi","meaning":"lãng phí","example":"我们需要浪费时间。","examplePinyin":"Wǒmen xūyào làngfèi shíjiān.","translation":"Chúng ta cần lãng phí thời gian."},{"id":"hsk3-T22-14","hanzi":"现金","pinyin":"xiànjīn","meaning":"tiền mặt","example":"这个商店只收现金。","examplePinyin":"Zhège shāngdiàn zhǐ shōu xiànjīn.","translation":"Cửa hàng này chỉ nhận tiền mặt."},{"id":"hsk3-T22-15","hanzi":"消费","pinyin":"xiāofèi","meaning":"chi tiêu","example":"我正在学习怎么消费。","examplePinyin":"Wǒ zhèngzài xuéxí zěnme xiāofèi.","translation":"Tôi đang học cách chi tiêu."},{"id":"hsk3-T22-16","hanzi":"资金","pinyin":"zījīn","meaning":"nguồn vốn","example":"我们想创业，但是资金不够。","examplePinyin":"Wǒmen xiǎng chuàngyè, dànshì zījīn bú gòu.","translation":"Chúng tôi muốn khởi nghiệp nhưng vốn chưa đủ."},{"id":"hsk3-T22-17","hanzi":"补充","pinyin":"bǔchōng","meaning":"bổ sung","example":"我希望以后能补充知识。","examplePinyin":"Wǒ xīwàng yǐhòu néng bǔchōng zhīshi.","translation":"Tôi hy vọng sau này có thể bổ sung kiến thức."},{"id":"hsk3-T22-18","hanzi":"费","pinyin":"fèi","meaning":"chi phí","example":"在这里坐公交车不太费钱。","examplePinyin":"Zài zhèlǐ zuò gōngjiāochē bú tài fèi qián.","translation":"Đi xe buýt ở đây không tốn nhiều tiền."},{"id":"hsk3-T22-19","hanzi":"费用","pinyin":"fèiyòng","meaning":"chi phí","example":"这次旅行的费用比较高。","examplePinyin":"Zhè cì lǚxíng de fèiyòng bǐjiào gāo.","translation":"Chi phí chuyến du lịch này khá cao."},{"id":"hsk3-T22-20","hanzi":"付","pinyin":"fù","meaning":"trả tiền","example":"今天我们一起练习付。","examplePinyin":"Jīntiān wǒmen yìqǐ liànxí fù.","translation":"Hôm nay chúng tôi cùng luyện trả tiền."},{"id":"hsk3-T22-21","hanzi":"收费","pinyin":"shōufèi","meaning":"thu phí","example":"你知道应该怎么收费吗？","examplePinyin":"Nǐ zhīdào yīnggāi zěnme shōufèi ma?","translation":"Bạn biết nên thu phí như thế nào không?"},{"id":"hsk3-T22-22","hanzi":"价钱","pinyin":"jiàqian","meaning":"giá tiền","example":"这件大衣的价钱太高了。","examplePinyin":"Zhè jiàn dàyī de jiàqian tài gāo le.","translation":"Giá chiếc áo khoác này quá cao."},{"id":"hsk3-T22-23","hanzi":"价格","pinyin":"jiàgé","meaning":"giá cả","example":"这两家饭馆的价格差不多。","examplePinyin":"Zhè liǎng jiā fànguǎn de jiàgé chàbuduō.","translation":"Giá của hai nhà hàng này gần như nhau."},{"id":"hsk3-T22-24","hanzi":"价值","pinyin":"jiàzhí","meaning":"giá trị","example":"这本旧书对我很有价值。","examplePinyin":"Zhè běn jiù shū duì wǒ hěn yǒu jiàzhí.","translation":"Cuốn sách cũ này rất có giá trị với tôi."},{"id":"hsk3-T22-25","hanzi":"交费","pinyin":"jiāofèi","meaning":"nộp phí","example":"我正在学习怎么交费。","examplePinyin":"Wǒ zhèngzài xuéxí zěnme jiāofèi.","translation":"Tôi đang học cách nộp phí."},{"id":"hsk3-T22-26","hanzi":"人民币","pinyin":"rénmínbì","meaning":"nhân dân tệ","example":"这本词典是一百元人民币。","examplePinyin":"Zhè běn cídiǎn shì yì bǎi yuán rénmínbì.","translation":"Cuốn từ điển này có giá 100 nhân dân tệ."},{"id":"hsk3-T22-27","hanzi":"美元","pinyin":"měiyuán","meaning":"đô la Mỹ","example":"这件商品要五十美元。","examplePinyin":"Zhè jiàn shāngpǐn yào wǔshí měiyuán.","translation":"Sản phẩm này có giá 50 đô la Mỹ."},{"id":"hsk3-T22-28","hanzi":"票价","pinyin":"piàojià","meaning":"giá vé","example":"我想知道高铁的票价。","examplePinyin":"Wǒ xiǎng zhīdào gāotiě de piàojià.","translation":"Tôi muốn biết giá vé tàu cao tốc."},{"id":"hsk3-T22-29","hanzi":"支付","pinyin":"zhīfù","meaning":"thanh toán","example":"他们正在支付费用。","examplePinyin":"Tāmen zhèngzài zhīfù fèiyòng.","translation":"Họ đang thanh toán chi phí."},{"id":"hsk3-T22-30","hanzi":"值","pinyin":"zhí","meaning":"trị giá","example":"今天老师教了我们“值”这个词。","examplePinyin":"Jīntiān lǎoshī jiāo le wǒmen “zhí” zhège cí.","translation":"Hôm nay giáo viên dạy chúng tôi từ “trị giá”."},{"id":"hsk3-T22-31","hanzi":"需求","pinyin":"xūqiú","meaning":"nhu cầu","example":"我们会根据客人的需求改进服务。","examplePinyin":"Wǒmen huì gēnjù kèrén de xūqiú gǎijìn fúwù.","translation":"Chúng tôi sẽ cải thiện dịch vụ theo nhu cầu khách hàng."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/kinh-te-va-tai-chinh/"},{"id":23,"name":"ĐỘNG TỪ I","words":[{"id":"hsk3-T23-01","hanzi":"把握","pinyin":"bǎwò","meaning":"nắm bắt","example":"我希望以后能把握机会。","examplePinyin":"Wǒ xīwàng yǐhòu néng bǎwò jīhuì.","translation":"Tôi hy vọng sau này có thể nắm bắt cơ hội."},{"id":"hsk3-T23-02","hanzi":"围","pinyin":"wéi","meaning":"bao quanh","example":"孩子们围着老师听故事。","examplePinyin":"Háizimen wéi zhe lǎoshī tīng gùshi.","translation":"Bọn trẻ vây quanh giáo viên nghe kể chuyện."},{"id":"hsk3-T23-03","hanzi":"建","pinyin":"jiàn","meaning":"xây dựng","example":"我们想在这里建一所新学校。","examplePinyin":"Wǒmen xiǎng zài zhèlǐ jiàn yì suǒ xīn xuéxiào.","translation":"Chúng tôi muốn xây một ngôi trường mới ở đây."},{"id":"hsk3-T23-04","hanzi":"争","pinyin":"zhēng","meaning":"tranh giành","example":"两个孩子正在争一个玩具。","examplePinyin":"Liǎng ge háizi zhèngzài zhēng yí ge wánjù.","translation":"Hai đứa trẻ đang tranh nhau món đồ chơi."},{"id":"hsk3-T23-05","hanzi":"敢","pinyin":"gǎn","meaning":"dám","example":"以前我不敢说汉语，现在敢了。","examplePinyin":"Yǐqián wǒ bù gǎn shuō Hànyǔ, xiànzài gǎn le.","translation":"Trước đây tôi không dám nói tiếng Trung, bây giờ đã dám."},{"id":"hsk3-T23-06","hanzi":"传","pinyin":"chuán","meaning":"truyền đạt","example":"请把这个消息传给其他同学。","examplePinyin":"Qǐng bǎ zhège xiāoxi chuán gěi qítā tóngxué.","translation":"Hãy chuyển tin này cho các bạn học khác."},{"id":"hsk3-T23-07","hanzi":"充满","pinyin":"chōngmǎn","meaning":"tràn đầy","example":"春天的花园充满了花香。","examplePinyin":"Chūntiān de huāyuán chōngmǎn le huāxiāng.","translation":"Khu vườn mùa xuân tràn ngập hương hoa."},{"id":"hsk3-T23-08","hanzi":"称为","pinyin":"chēngwéi","meaning":"được gọi là","example":"这种动物被称为大熊猫。","examplePinyin":"Zhè zhǒng dòngwù bèi chēngwéi dàxióngmāo.","translation":"Loài động vật này được gọi là gấu trúc lớn."},{"id":"hsk3-T23-09","hanzi":"订","pinyin":"dìng","meaning":"đặt trước","example":"我已经在网上订好了火车票。","examplePinyin":"Wǒ yǐjīng zài wǎngshàng dìng hǎo le huǒchēpiào.","translation":"Tôi đã đặt vé tàu xong trên mạng."},{"id":"hsk3-T23-10","hanzi":"发出","pinyin":"fāchū","meaning":"phát ra","example":"老师让我们发出声音。","examplePinyin":"Lǎoshī ràng wǒmen fāchū shēngyīn.","translation":"Giáo viên yêu cầu chúng tôi phát ra âm thanh."},{"id":"hsk3-T23-11","hanzi":"发送","pinyin":"fāsòng","meaning":"gửi đi","example":"我希望以后能发送电子邮件。","examplePinyin":"Wǒ xīwàng yǐhòu néng fāsòng diànzǐ yóujiàn.","translation":"Tôi hy vọng sau này có thể gửi đi email."},{"id":"hsk3-T23-12","hanzi":"等待","pinyin":"děngdài","meaning":"chờ đợi","example":"我们在机场等待了两个小时。","examplePinyin":"Wǒmen zài jīchǎng děngdài le liǎng ge xiǎoshí.","translation":"Chúng tôi đợi ở sân bay hai tiếng."},{"id":"hsk3-T23-13","hanzi":"补","pinyin":"bǔ","meaning":"bù, bổ sung","example":"我今天请假了，明天需要补课。","examplePinyin":"Wǒ jīntiān qǐngjià le, míngtiān xūyào bǔkè.","translation":"Hôm nay tôi xin nghỉ, mai cần học bù."},{"id":"hsk3-T23-14","hanzi":"采取","pinyin":"cǎiqǔ","meaning":"áp dụng","example":"学校决定采取新办法。","examplePinyin":"Xuéxiào juédìng cǎiqǔ xīn bànfǎ.","translation":"Nhà trường quyết định áp dụng biện pháp mới."},{"id":"hsk3-T23-15","hanzi":"采用","pinyin":"cǎiyòng","meaning":"áp dụng","example":"老师让我们采用新方法。","examplePinyin":"Lǎoshī ràng wǒmen cǎiyòng xīn fāngfǎ.","translation":"Giáo viên yêu cầu chúng tôi áp dụng phương pháp mới."},{"id":"hsk3-T23-16","hanzi":"为","pinyin":"wéi","meaning":"là, làm, trở thành","example":"他毕业以后成为了一名中文老师。","examplePinyin":"Tā bìyè yǐhòu chéngwéi le yì míng Zhōngwén lǎoshī.","translation":"Sau khi tốt nghiệp, anh ấy trở thành một giáo viên tiếng Trung."},{"id":"hsk3-T23-17","hanzi":"存","pinyin":"cún","meaning":"cất giữ","example":"我们需要存钱。","examplePinyin":"Wǒmen xūyào cún qián.","translation":"Chúng ta cần cất giữ tiền."},{"id":"hsk3-T23-18","hanzi":"代","pinyin":"dài","meaning":"thay mặt","example":"今天经理不能来，我代他参加会议。","examplePinyin":"Jīntiān jīnglǐ bù néng lái, wǒ dài tā cānjiā huìyì.","translation":"Giám đốc hôm nay không đến được, tôi dự họp thay ông ấy."},{"id":"hsk3-T23-19","hanzi":"带动","pinyin":"dàidòng","meaning":"thúc đẩy","example":"学校决定带动经济发展。","examplePinyin":"Xuéxiào juédìng dàidòng jīngjì fāzhǎn.","translation":"Nhà trường quyết định thúc đẩy phát triển kinh tế."},{"id":"hsk3-T23-20","hanzi":"断","pinyin":"duàn","meaning":"đứt, gãy","example":"下大雨以后，这条路断了。","examplePinyin":"Xià dà yǔ yǐhòu, zhè tiáo lù duàn le.","translation":"Sau mưa lớn, con đường này bị chia cắt."},{"id":"hsk3-T23-21","hanzi":"抓","pinyin":"zhuā","meaning":"nắm, bắt","example":"我希望以后能抓孩子的手。","examplePinyin":"Wǒ xīwàng yǐhòu néng zhuā háizi de shǒu.","translation":"Tôi hy vọng sau này có thể nắm, bắt tay đứa trẻ."},{"id":"hsk3-T23-22","hanzi":"环","pinyin":"huán","meaning":"vòng","example":"孩子们围成了一个环。","examplePinyin":"Háizimen wéi chéng le yí ge huán.","translation":"Bọn trẻ đứng thành một vòng tròn."},{"id":"hsk3-T23-23","hanzi":"抓住","pinyin":"zhuāzhù","meaning":"nắm chắc","example":"他们正在抓住机会。","examplePinyin":"Tāmen zhèngzài zhuāzhù jīhuì.","translation":"Họ đang nắm chắc cơ hội."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/dong-tu-toi/"},{"id":24,"name":"ĐỘNG TỪ II","words":[{"id":"hsk3-T24-01","hanzi":"输入","pinyin":"shūrù","meaning":"nhập dữ liệu","example":"我们需要输入名字。","examplePinyin":"Wǒmen xūyào shūrù míngzi.","translation":"Chúng ta cần nhập dữ liệu tên."},{"id":"hsk3-T24-02","hanzi":"实行","pinyin":"shíxíng","meaning":"thực hiện","example":"他们正在实行新规定。","examplePinyin":"Tāmen zhèngzài shíxíng xīn guīdìng.","translation":"Họ đang thực hiện quy định mới."},{"id":"hsk3-T24-03","hanzi":"共有","pinyin":"gòngyǒu","meaning":"tổng cộng có","example":"我们班共有二十八名学生。","examplePinyin":"Wǒmen bān gòngyǒu èrshíbā míng xuésheng.","translation":"Lớp chúng tôi có tổng cộng 28 học sinh."},{"id":"hsk3-T24-04","hanzi":"挂","pinyin":"guà","meaning":"treo","example":"老师让我们挂照片。","examplePinyin":"Lǎoshī ràng wǒmen guà zhàopiàn.","translation":"Giáo viên yêu cầu chúng tôi treo ảnh."},{"id":"hsk3-T24-05","hanzi":"观看","pinyin":"guānkàn","meaning":"xem, quan sát","example":"我希望以后能观看比赛。","examplePinyin":"Wǒ xīwàng yǐhòu néng guānkàn bǐsài.","translation":"Tôi hy vọng sau này có thể xem, quan sát cuộc thi."},{"id":"hsk3-T24-06","hanzi":"集中","pinyin":"jízhōng","meaning":"tập trung","example":"我们需要集中注意力。","examplePinyin":"Wǒmen xūyào jízhōng zhùyìlì.","translation":"Chúng ta cần tập trung sự chú ý."},{"id":"hsk3-T24-07","hanzi":"压","pinyin":"yā","meaning":"đè, ép","example":"他们正在压这本书。","examplePinyin":"Tāmen zhèngzài yā zhè běn shū.","translation":"Họ đang đè, ép cuốn sách này."},{"id":"hsk3-T24-08","hanzi":"坚持","pinyin":"jiānchí","meaning":"kiên trì","example":"我每天坚持学习汉语。","examplePinyin":"wǒ měitiān jiānchí xuéxí Hànyǔ.","translation":"Ngày nào tôi cũng kiên trì học tiếng Trung."},{"id":"hsk3-T24-09","hanzi":"调","pinyin":"tiáo","meaning":"điều chỉnh","example":"房间太热了，请把空调温度调低一点儿。","examplePinyin":"Fángjiān tài rè le, qǐng bǎ kōngtiáo wēndù tiáo dī yìdiǎnr.","translation":"Phòng nóng quá, hãy chỉnh nhiệt độ điều hòa thấp xuống."},{"id":"hsk3-T24-10","hanzi":"突出","pinyin":"tūchū","meaning":"nổi bật","example":"她的口语成绩很突出。","examplePinyin":"Tā de kǒuyǔ chéngjì hěn tūchū.","translation":"Thành tích nói của cô ấy rất nổi bật."},{"id":"hsk3-T24-11","hanzi":"结合","pinyin":"jiéhé","meaning":"kết hợp","example":"我们需要结合听力和口语。","examplePinyin":"Wǒmen xūyào jiéhé tīnglì hé kǒuyǔ.","translation":"Chúng ta cần kết hợp nghe và nói."},{"id":"hsk3-T24-12","hanzi":"解开","pinyin":"jiěkāi","meaning":"tháo ra, giải đáp","example":"他们正在解开这个问题。","examplePinyin":"Tāmen zhèngzài jiěkāi zhège wèntí.","translation":"Họ đang tháo ra, giải đáp vấn đề này."},{"id":"hsk3-T24-13","hanzi":"具有","pinyin":"jùyǒu","meaning":"có, sở hữu","example":"这座城市具有悠久的历史。","examplePinyin":"Zhè zuò chéngshì jùyǒu yōujiǔ de lìshǐ.","translation":"Thành phố này có lịch sử lâu đời."},{"id":"hsk3-T24-14","hanzi":"利用","pinyin":"lìyòng","meaning":"tận dụng","example":"老师让我们利用时间。","examplePinyin":"Lǎoshī ràng wǒmen lìyòng shíjiān.","translation":"Giáo viên yêu cầu chúng tôi tận dụng thời gian."},{"id":"hsk3-T24-15","hanzi":"迷","pinyin":"mí","meaning":"mê, người hâm mộ","example":"他是一个足球迷。","examplePinyin":"Tā shì yí ge zúqiúmí.","translation":"Anh ấy là người hâm mộ bóng đá."},{"id":"hsk3-T24-16","hanzi":"拍","pinyin":"pāi","meaning":"chụp, vỗ","example":"我们需要拍照片。","examplePinyin":"Wǒmen xūyào pāi zhàopiàn.","translation":"Chúng ta cần chụp, vỗ ảnh."},{"id":"hsk3-T24-17","hanzi":"约","pinyin":"yuē","meaning":"hẹn","example":"他们正在约朋友。","examplePinyin":"Tāmen zhèngzài yuē péngyou.","translation":"Họ đang hẹn bạn bè."},{"id":"hsk3-T24-18","hanzi":"反对","pinyin":"fǎnduì","meaning":"phản đối","example":"学校决定反对这个计划。","examplePinyin":"Xuéxiào juédìng fǎnduì zhège jìhuà.","translation":"Nhà trường quyết định phản đối kế hoạch này."},{"id":"hsk3-T24-19","hanzi":"深入","pinyin":"shēnrù","meaning":"đi sâu vào","example":"老师让我们深入了解中国文化。","examplePinyin":"Lǎoshī ràng wǒmen shēnrù liǎojiě Zhōngguó wénhuà.","translation":"Giáo viên yêu cầu chúng tôi đi sâu vào tìm hiểu văn hóa Trung Quốc."},{"id":"hsk3-T24-20","hanzi":"适用","pinyin":"shìyòng","meaning":"phù hợp để sử dụng","example":"这个方法适用于初级学生。","examplePinyin":"Zhège fāngfǎ shìyòng yú chūjí xuésheng.","translation":"Phương pháp này phù hợp với học sinh sơ cấp."},{"id":"hsk3-T24-21","hanzi":"受","pinyin":"shòu","meaning":"chịu, nhận","example":"他昨天受了伤。","examplePinyin":"Tā zuótiān shòu le shāng.","translation":"Hôm qua anh ấy bị thương."},{"id":"hsk3-T24-22","hanzi":"放到","pinyin":"fàngdào","meaning":"đặt vào","example":"他们正在放到桌子上。","examplePinyin":"Tāmen zhèngzài fàngdào zhuōzi shang.","translation":"Họ đang đặt vào lên bàn."},{"id":"hsk3-T24-23","hanzi":"指","pinyin":"zhǐ","meaning":"chỉ, trỏ","example":"学校决定指地图。","examplePinyin":"Xuéxiào juédìng zhǐ dìtú.","translation":"Nhà trường quyết định chỉ, trỏ bản đồ."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/words-ii/"},{"id":25,"name":"TRƯỜNG HỢP","words":[{"id":"hsk3-T25-01","hanzi":"事故","pinyin":"shìgù","meaning":"tai nạn","example":"昨天路上发生了一起交通事故。","examplePinyin":"Zuótiān lù shang fāshēng le yì qǐ jiāotōng shìgù.","translation":"Hôm qua trên đường xảy ra một vụ tai nạn giao thông."},{"id":"hsk3-T25-02","hanzi":"现场","pinyin":"xiànchǎng","meaning":"hiện trường","example":"警察很快赶到了事故现场。","examplePinyin":"Jǐngchá hěn kuài gǎndào le shìgù xiànchǎng.","translation":"Cảnh sát nhanh chóng có mặt tại hiện trường tai nạn."},{"id":"hsk3-T25-03","hanzi":"状态","pinyin":"zhuàngtài","meaning":"trạng thái","example":"他今天的学习状态很好。","examplePinyin":"Tā jīntiān de xuéxí zhuàngtài hěn hǎo.","translation":"Trạng thái học tập của anh ấy hôm nay rất tốt."},{"id":"hsk3-T25-04","hanzi":"状况","pinyin":"zhuàngkuàng","meaning":"tình hình","example":"病人的身体状况比昨天好多了。","examplePinyin":"Bìngrén de shēntǐ zhuàngkuàng bǐ zuótiān hǎo duō le.","translation":"Tình trạng sức khỏe bệnh nhân tốt hơn hôm qua nhiều."},{"id":"hsk3-T25-05","hanzi":"持续","pinyin":"chíxù","meaning":"kéo dài","example":"这场雨已经持续了三个小时。","examplePinyin":"Zhè chǎng yǔ yǐjīng chíxù le sān ge xiǎoshí.","translation":"Trận mưa này kéo dài ba tiếng rồi."},{"id":"hsk3-T25-06","hanzi":"发动","pinyin":"fādòng","meaning":"khởi động","example":"天气太冷了，车很难发动。","examplePinyin":"Tiānqì tài lěng le, chē hěn nán fādòng.","translation":"Trời quá lạnh, xe khó khởi động."},{"id":"hsk3-T25-07","hanzi":"发生","pinyin":"fāshēng","meaning":"xảy ra","example":"昨天发生了一件奇怪的事。","examplePinyin":"zuótiān fāshēng le yí jiàn qíguài de shì.","translation":"Hôm qua đã xảy ra một chuyện kỳ lạ."},{"id":"hsk3-T25-08","hanzi":"风险","pinyin":"fēngxiǎn","meaning":"rủi ro","example":"下雨时开车有风险。","examplePinyin":"Xià yǔ shí kāichē yǒu fēngxiǎn.","translation":"Lái xe khi trời mưa có rủi ro."},{"id":"hsk3-T25-09","hanzi":"继续","pinyin":"jìxù","meaning":"tiếp tục","example":"我们继续学习吧。","examplePinyin":"wǒmen jìxù xuéxí ba.","translation":"Chúng ta tiếp tục học nhé."},{"id":"hsk3-T25-10","hanzi":"面对","pinyin":"miànduì","meaning":"đối mặt","example":"面对困难的时候，不要放弃。","examplePinyin":"Miànduì kùnnan de shíhou, bú yào fàngqì.","translation":"Khi đối mặt khó khăn, đừng bỏ cuộc."},{"id":"hsk3-T25-11","hanzi":"情况","pinyin":"qíngkuàng","meaning":"tình hình","example":"我还不了解具体情况。","examplePinyin":"Wǒ hái bù liǎojiě jùtǐ qíngkuàng.","translation":"Tôi vẫn chưa hiểu tình hình cụ thể."},{"id":"hsk3-T25-12","hanzi":"全场","pinyin":"quánchǎng","meaning":"toàn sân","example":"学校正在研究有关全场的问题。","examplePinyin":"Xuéxiào zhèngzài yánjiū yǒuguān quánchǎng de wèntí.","translation":"Nhà trường đang nghiên cứu vấn đề liên quan đến toàn sân."},{"id":"hsk3-T25-13","hanzi":"危险","pinyin":"wēixiǎn","meaning":"nguy hiểm","example":"这条河很深，在这里游泳很危险。","examplePinyin":"Zhè tiáo hé hěn shēn, zài zhèlǐ yóuyǒng hěn wēixiǎn.","translation":"Sông này rất sâu, bơi ở đây rất nguy hiểm."},{"id":"hsk3-T25-14","hanzi":"危害","pinyin":"wēihài","meaning":"gây hại","example":"长期睡不好会危害健康。","examplePinyin":"Chángqī shuì bù hǎo huì wēihài jiànkāng.","translation":"Ngủ kém lâu dài gây hại sức khỏe."},{"id":"hsk3-T25-15","hanzi":"意外","pinyin":"yìwài","meaning":"bất ngờ","example":"我没想到他会来，真让我意外。","examplePinyin":"Wǒ méi xiǎngdào tā huì lái, zhēn ràng wǒ yìwài.","translation":"Tôi không ngờ anh ấy đến, thật bất ngờ."},{"id":"hsk3-T25-16","hanzi":"现象","pinyin":"xiànxiàng","meaning":"hiện tượng","example":"冬天下雪是很常见的现象。","examplePinyin":"Dōngtiān xià xuě shì hěn chángjiàn de xiànxiàng.","translation":"Tuyết rơi mùa đông là hiện tượng phổ biến."},{"id":"hsk3-T25-17","hanzi":"需要","pinyin":"xūyào","meaning":"cần","example":"我需要你的帮助。","examplePinyin":"wǒ xūyào nǐ de bāngzhù.","translation":"Tôi cần sự giúp đỡ của bạn."},{"id":"hsk3-T25-18","hanzi":"自身","pinyin":"zìshēn","meaning":"bản thân","example":"为了自身的健康，他每天跑步。","examplePinyin":"Wèile zìshēn de jiànkāng, tā měitiān pǎobù.","translation":"Vì sức khỏe bản thân, anh ấy chạy bộ mỗi ngày."},{"id":"hsk3-T25-19","hanzi":"场合","pinyin":"chǎnghé","meaning":"dịp, trường hợp","example":"正式场合要注意说话方式。","examplePinyin":"Zhèngshì chǎnghé yào zhùyì shuōhuà fāngshì.","translation":"Trong dịp trang trọng cần chú ý cách nói."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/truong-hop/"},{"id":26,"name":"NGHIÊN CỨU","words":[{"id":"hsk3-T26-01","hanzi":"调查","pinyin":"diàochá","meaning":"khảo sát","example":"学校决定调查这个问题。","examplePinyin":"Xuéxiào juédìng diàochá zhège wèntí.","translation":"Nhà trường quyết định khảo sát vấn đề này."},{"id":"hsk3-T26-02","hanzi":"初中","pinyin":"chūzhōng","meaning":"trung học cơ sở","example":"我弟弟在初中学习。","examplePinyin":"wǒ dìdi zài chūzhōng xuéxí.","translation":"Em trai tôi học ở trường trung học cơ sở."},{"id":"hsk3-T26-03","hanzi":"体验","pinyin":"tǐyàn","meaning":"trải nghiệm","example":"我希望以后能体验中国文化。","examplePinyin":"Wǒ xīwàng yǐhòu néng tǐyàn Zhōngguó wénhuà.","translation":"Tôi hy vọng sau này có thể trải nghiệm văn hóa Trung Quốc."},{"id":"hsk3-T26-04","hanzi":"关注","pinyin":"guānzhù","meaning":"quan tâm","example":"我每天关注天气变化。","examplePinyin":"wǒ měitiān guānzhù tiānqìbiànhuà.","translation":"Tôi theo dõi thay đổi thời tiết mỗi ngày."},{"id":"hsk3-T26-05","hanzi":"观察","pinyin":"guānchá","meaning":"quan sát","example":"他们正在观察动物。","examplePinyin":"Tāmen zhèngzài guānchá dòngwù.","translation":"Họ đang quan sát động vật."},{"id":"hsk3-T26-06","hanzi":"经历","pinyin":"jīnglì","meaning":"trải qua, trải nghiệm","example":"这件事我们明天再经历吧。","examplePinyin":"Zhè jiàn shì wǒmen míngtiān zài jīnglì ba.","translation":"Việc này ngày mai chúng ta hãy trải qua, trải nghiệm nhé."},{"id":"hsk3-T26-07","hanzi":"经验","pinyin":"jīngyàn","meaning":"kinh nghiệm","example":"我们需要更多关于经验的信息。","examplePinyin":"Wǒmen xūyào gèng duō guānyú jīngyàn de xìnxī.","translation":"Chúng tôi cần thêm thông tin về kinh nghiệm."},{"id":"hsk3-T26-08","hanzi":"文章","pinyin":"wénzhāng","meaning":"bài viết","example":"你能介绍一下文章吗？","examplePinyin":"Nǐ néng jièshào yíxià wénzhāng ma?","translation":"Bạn có thể giới thiệu đôi chút về bài viết không?"},{"id":"hsk3-T26-09","hanzi":"文学","pinyin":"wénxué","meaning":"văn học","example":"今天老师讲了关于文学的内容。","examplePinyin":"Jīntiān lǎoshī jiǎng le guānyú wénxué de nèiróng.","translation":"Hôm nay giáo viên giảng nội dung về văn học."},{"id":"hsk3-T26-10","hanzi":"学费","pinyin":"xuéfèi","meaning":"học phí","example":"他昨天和朋友谈到了学费。","examplePinyin":"Tā zuótiān hé péngyou tándào le xuéfèi.","translation":"Hôm qua anh ấy và bạn trò chuyện về học phí."},{"id":"hsk3-T26-11","hanzi":"留学","pinyin":"liúxué","meaning":"du học","example":"我打算去中国留学。","examplePinyin":"wǒ dǎsuàn qù Zhōngguó liúxué.","translation":"Tôi dự định sang Trung Quốc du học."},{"id":"hsk3-T26-12","hanzi":"考验","pinyin":"kǎoyàn","meaning":"thử thách","example":"很多人都很关心考验。","examplePinyin":"Hěn duō rén dōu hěn guānxīn kǎoyàn.","translation":"Nhiều người rất quan tâm đến thử thách."},{"id":"hsk3-T26-13","hanzi":"科技","pinyin":"kējì","meaning":"công nghệ","example":"学校正在研究有关科技的问题。","examplePinyin":"Xuéxiào zhèngzài yánjiū yǒuguān kējì de wèntí.","translation":"Nhà trường đang nghiên cứu vấn đề liên quan đến công nghệ."},{"id":"hsk3-T26-14","hanzi":"念","pinyin":"niàn","meaning":"đọc thành tiếng","example":"我们需要念这个句子。","examplePinyin":"Wǒmen xūyào niàn zhège jùzi.","translation":"Chúng ta cần đọc thành tiếng câu này."},{"id":"hsk3-T26-15","hanzi":"外文","pinyin":"wàiwén","meaning":"ngoại ngữ","example":"我对外文很感兴趣。","examplePinyin":"Wǒ duì wàiwén hěn gǎn xìngqù.","translation":"Tôi rất hứng thú với ngoại ngữ."},{"id":"hsk3-T26-16","hanzi":"文字","pinyin":"wénzì","meaning":"chữ viết","example":"这本书介绍了文字。","examplePinyin":"Zhè běn shū jièshào le wénzì.","translation":"Cuốn sách này giới thiệu về chữ viết."},{"id":"hsk3-T26-17","hanzi":"写作","pinyin":"xiězuò","meaning":"viết lách","example":"我想先写作，然后再休息。","examplePinyin":"Wǒ xiǎng xiān xiězuò, ránhòu zài xiūxi.","translation":"Tôi muốn viết lách trước rồi mới nghỉ ngơi."},{"id":"hsk3-T26-18","hanzi":"专题","pinyin":"zhuāntí","meaning":"chuyên đề","example":"你能介绍一下专题吗？","examplePinyin":"Nǐ néng jièshào yíxià zhuāntí ma?","translation":"Bạn có thể giới thiệu đôi chút về chuyên đề không?"},{"id":"hsk3-T26-19","hanzi":"教练","pinyin":"jiàoliàn","meaning":"huấn luyện viên","example":"今天老师讲了关于教练的内容。","examplePinyin":"Jīntiān lǎoshī jiǎng le guānyú jiàoliàn de nèiróng.","translation":"Hôm nay giáo viên giảng nội dung về huấn luyện viên."},{"id":"hsk3-T26-20","hanzi":"标题","pinyin":"biāotí","meaning":"tiêu đề","example":"他昨天和朋友谈到了标题。","examplePinyin":"Tā zuótiān hé péngyou tándào le biāotí.","translation":"Hôm qua anh ấy và bạn trò chuyện về tiêu đề."},{"id":"hsk3-T26-21","hanzi":"功课","pinyin":"gōngkè","meaning":"bài tập","example":"我们希望进一步了解功课。","examplePinyin":"Wǒmen xīwàng jìn yí bù liǎojiě gōngkè.","translation":"Chúng tôi hy vọng tìm hiểu sâu hơn về bài tập."},{"id":"hsk3-T26-22","hanzi":"班级","pinyin":"bānjí","meaning":"lớp học","example":"我们班级有三十个学生。","examplePinyin":"wǒmen bānjí yǒu sān shí gè xuésheng.","translation":"Lớp chúng tôi có ba mươi học sinh."},{"id":"hsk3-T26-23","hanzi":"听力","pinyin":"tīnglì","meaning":"kỹ năng nghe","example":"学校正在研究有关听力的问题。","examplePinyin":"Xuéxiào zhèngzài yánjiū yǒuguān tīnglì de wèntí.","translation":"Nhà trường đang nghiên cứu vấn đề liên quan đến kỹ năng nghe."},{"id":"hsk3-T26-24","hanzi":"训练","pinyin":"xùnliàn","meaning":"huấn luyện","example":"我们需要训练运动员。","examplePinyin":"Wǒmen xūyào xùnliàn yùndòngyuán.","translation":"Chúng ta cần huấn luyện vận động viên."},{"id":"hsk3-T26-25","hanzi":"试验","pinyin":"shìyàn","meaning":"thử nghiệm","example":"我对试验很感兴趣。","examplePinyin":"Wǒ duì shìyàn hěn gǎn xìngqù.","translation":"Tôi rất hứng thú với thử nghiệm."},{"id":"hsk3-T26-26","hanzi":"题目","pinyin":"tímù","meaning":"đề bài","example":"这本书介绍了题目。","examplePinyin":"Zhè běn shū jièshào le tímù.","translation":"Cuốn sách này giới thiệu về đề bài."},{"id":"hsk3-T26-27","hanzi":"实验室","pinyin":"shíyànshì","meaning":"phòng thí nghiệm","example":"我们需要更多关于实验室的信息。","examplePinyin":"Wǒmen xūyào gèng duō guānyú shíyànshì de xìnxī.","translation":"Chúng tôi cần thêm thông tin về phòng thí nghiệm."},{"id":"hsk3-T26-28","hanzi":"试题","pinyin":"shìtí","meaning":"câu hỏi thi","example":"你能介绍一下试题吗？","examplePinyin":"Nǐ néng jièshào yíxià shìtí ma?","translation":"Bạn có thể giới thiệu đôi chút về câu hỏi thi không?"},{"id":"hsk3-T26-29","hanzi":"教材","pinyin":"jiàocái","meaning":"giáo trình","example":"今天老师讲了关于教材的内容。","examplePinyin":"Jīntiān lǎoshī jiǎng le guānyú jiàocái de nèiróng.","translation":"Hôm nay giáo viên giảng nội dung về giáo trình."},{"id":"hsk3-T26-30","hanzi":"预习","pinyin":"yùxí","meaning":"xem bài trước","example":"他们正在预习新课。","examplePinyin":"Tāmen zhèngzài yùxí xīn kè.","translation":"Họ đang xem bài trước bài mới."},{"id":"hsk3-T26-31","hanzi":"课程","pinyin":"kèchéng","meaning":"khóa học","example":"我们希望进一步了解课程。","examplePinyin":"Wǒmen xīwàng jìn yí bù liǎojiě kèchéng.","translation":"Chúng tôi hy vọng tìm hiểu sâu hơn về khóa học."},{"id":"hsk3-T26-32","hanzi":"实验","pinyin":"shíyàn","meaning":"thí nghiệm","example":"很多人都很关心实验。","examplePinyin":"Hěn duō rén dōu hěn guānxīn shíyàn.","translation":"Nhiều người rất quan tâm đến thí nghiệm."},{"id":"hsk3-T26-33","hanzi":"系","pinyin":"xì","meaning":"khoa, hệ","example":"学校正在研究有关系的问题。","examplePinyin":"Xuéxiào zhèngzài yánjiū yǒuguān xì de wèntí.","translation":"Nhà trường đang nghiên cứu vấn đề liên quan đến khoa, hệ."},{"id":"hsk3-T26-34","hanzi":"读者","pinyin":"dúzhě","meaning":"độc giả","example":"我们请了一位读者来帮助学生。","examplePinyin":"Wǒmen qǐng le yí wèi dúzhě lái bāngzhù xuésheng.","translation":"Chúng tôi mời một độc giả đến giúp các học sinh."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/nghien-cuu/"},{"id":27,"name":"CĂN NHÀ","words":[{"id":"hsk3-T27-01","hanzi":"空调","pinyin":"kōngtiáo","meaning":"máy điều hòa","example":"商店里有各种空调。","examplePinyin":"Shāngdiàn lǐ yǒu gèzhǒng kōngtiáo.","translation":"Cửa hàng có nhiều loại máy điều hòa."},{"id":"hsk3-T27-02","hanzi":"卫生间","pinyin":"wèishēngjiān","meaning":"nhà vệ sinh","example":"请问卫生间在哪儿？","examplePinyin":"qǐng wèn wèishēngjiān zài nǎér?","translation":"Xin hỏi nhà vệ sinh ở đâu?"},{"id":"hsk3-T27-03","hanzi":"钟","pinyin":"zhōng","meaning":"đồng hồ","example":"妈妈把钟放在桌子上了。","examplePinyin":"Māma bǎ zhōng fàng zài zhuōzi shang le.","translation":"Mẹ đã đặt đồng hồ lên bàn."},{"id":"hsk3-T27-04","hanzi":"搬家","pinyin":"bānjiā","meaning":"chuyển nhà","example":"我们下个月要搬家。","examplePinyin":"wǒmen xià gè yuè yào bānjiā.","translation":"Tháng sau chúng tôi sẽ chuyển nhà."},{"id":"hsk3-T27-05","hanzi":"把","pinyin":"bǎ","meaning":"giới từ 把","example":"请把你的书放在桌子上。","examplePinyin":"Qǐng bǎ nǐ de shū fàng zài zhuōzi shang.","translation":"Hãy đặt sách của bạn lên bàn."},{"id":"hsk3-T27-06","hanzi":"安装","pinyin":"ānzhuāng","meaning":"lắp đặt","example":"我在商店看到了安装。","examplePinyin":"Wǒ zài shāngdiàn kàndào le ānzhuāng.","translation":"Tôi thấy lắp đặt ở cửa hàng."},{"id":"hsk3-T27-07","hanzi":"板","pinyin":"bǎn","meaning":"tấm, ván","example":"我昨天买了板。","examplePinyin":"Wǒ zuótiān mǎi le bǎn.","translation":"Hôm qua tôi đã mua tấm, ván."},{"id":"hsk3-T27-08","hanzi":"布","pinyin":"bù","meaning":"vải","example":"我把布带回家了。","examplePinyin":"Wǒ bǎ bù dài huí jiā le.","translation":"Tôi đã mang vải về nhà."},{"id":"hsk3-T27-09","hanzi":"刀","pinyin":"dāo","meaning":"dao","example":"你喜欢刀吗？","examplePinyin":"Nǐ xǐhuan dāo ma?","translation":"Bạn có thích dao không?"},{"id":"hsk3-T27-10","hanzi":"电视台","pinyin":"diànshìtái","meaning":"đài truyền hình","example":"家里还有电视台吗？","examplePinyin":"Jiā lǐ hái yǒu diànshìtái ma?","translation":"Ở nhà còn đài truyền hình không?"},{"id":"hsk3-T27-11","hanzi":"电台","pinyin":"diàntái","meaning":"đài phát thanh","example":"商店里有各种电台。","examplePinyin":"Shāngdiàn lǐ yǒu gèzhǒng diàntái.","translation":"Cửa hàng có nhiều loại đài phát thanh."},{"id":"hsk3-T27-12","hanzi":"房东","pinyin":"fángdōng","meaning":"chủ nhà","example":"我们需要一些房东。","examplePinyin":"Wǒmen xūyào yìxiē fángdōng.","translation":"Chúng ta cần một ít chủ nhà."},{"id":"hsk3-T27-13","hanzi":"房租","pinyin":"fángzū","meaning":"tiền thuê nhà","example":"妈妈把房租放在桌子上了。","examplePinyin":"Māma bǎ fángzū fàng zài zhuōzi shang le.","translation":"Mẹ đã đặt tiền thuê nhà lên bàn."},{"id":"hsk3-T27-14","hanzi":"房屋","pinyin":"fángwū","meaning":"nhà cửa","example":"我想看看不同的房屋。","examplePinyin":"Wǒ xiǎng kànkan bùtóng de fángwū.","translation":"Tôi muốn xem những loại nhà cửa khác nhau."},{"id":"hsk3-T27-15","hanzi":"架","pinyin":"jià","meaning":"giá, kệ","example":"今天我第一次见到架。","examplePinyin":"Jīntiān wǒ dì yī cì jiàndào jià.","translation":"Hôm nay tôi lần đầu thấy giá, kệ."},{"id":"hsk3-T27-16","hanzi":"沙发","pinyin":"shāfā","meaning":"sofa","example":"妈妈坐在沙发上。","examplePinyin":"māma zuò zài shāfā shàng.","translation":"Mẹ ngồi trên ghế sofa."},{"id":"hsk3-T27-17","hanzi":"书架","pinyin":"shūjià","meaning":"giá sách","example":"我昨天买了书架。","examplePinyin":"Wǒ zuótiān mǎi le shūjià.","translation":"Hôm qua tôi đã mua giá sách."},{"id":"hsk3-T27-18","hanzi":"家具","pinyin":"jiājù","meaning":"đồ nội thất","example":"我把家具带回家了。","examplePinyin":"Wǒ bǎ jiājù dài huí jiā le.","translation":"Tôi đã mang đồ nội thất về nhà."},{"id":"hsk3-T27-19","hanzi":"屋子","pinyin":"wūzi","meaning":"căn phòng","example":"这个屋子很干净。","examplePinyin":"zhège wūzi hěn gānjìng.","translation":"Căn phòng này rất sạch sẽ."},{"id":"hsk3-T27-20","hanzi":"室","pinyin":"shì","meaning":"phòng","example":"我们在会议室见面。","examplePinyin":"wǒmen zài huìyì shì jiànmiàn.","translation":"Chúng ta gặp ở phòng họp."},{"id":"hsk3-T27-21","hanzi":"设备","pinyin":"shèbèi","meaning":"thiết bị","example":"商店里有各种设备。","examplePinyin":"Shāngdiàn lǐ yǒu gèzhǒng shèbèi.","translation":"Cửa hàng có nhiều loại thiết bị."},{"id":"hsk3-T27-22","hanzi":"图","pinyin":"tú","meaning":"hình, sơ đồ","example":"我们需要一些图。","examplePinyin":"Wǒmen xūyào yìxiē tú.","translation":"Chúng ta cần một ít hình, sơ đồ."},{"id":"hsk3-T27-23","hanzi":"工具","pinyin":"gōngjù","meaning":"công cụ","example":"妈妈把工具放在桌子上了。","examplePinyin":"Māma bǎ gōngjù fàng zài zhuōzi shang le.","translation":"Mẹ đã đặt công cụ lên bàn."},{"id":"hsk3-T27-24","hanzi":"图画","pinyin":"túhuà","meaning":"tranh vẽ","example":"我想看看不同的图画。","examplePinyin":"Wǒ xiǎng kànkan bùtóng de túhuà.","translation":"Tôi muốn xem những loại tranh vẽ khác nhau."},{"id":"hsk3-T27-25","hanzi":"玩具","pinyin":"wánjù","meaning":"đồ chơi","example":"今天我第一次见到玩具。","examplePinyin":"Jīntiān wǒ dì yī cì jiàndào wánjù.","translation":"Hôm nay tôi lần đầu thấy đồ chơi."},{"id":"hsk3-T27-26","hanzi":"邮箱","pinyin":"yóuxiāng","meaning":"hộp thư","example":"请把照片发到我的邮箱。","examplePinyin":"qǐng bǎ zhàopiàn fā dào wǒ de yóuxiāng.","translation":"Hãy gửi ảnh vào hộp thư của tôi."},{"id":"hsk3-T27-27","hanzi":"机器","pinyin":"jīqì","meaning":"máy móc","example":"我昨天买了机器。","examplePinyin":"Wǒ zuótiān mǎi le jīqì.","translation":"Hôm qua tôi đã mua máy móc."},{"id":"hsk3-T27-28","hanzi":"单元","pinyin":"dānyuán","meaning":"đơn vị, bài học","example":"我把单元带回家了。","examplePinyin":"Wǒ bǎ dānyuán dài huí jiā le.","translation":"Tôi đã mang đơn vị, bài học về nhà."},{"id":"hsk3-T27-29","hanzi":"照","pinyin":"zhào","meaning":"chụp ảnh","example":"请帮我照一张照片。","examplePinyin":"qǐng bāng wǒ zhào yì zhāng zhàopiàn.","translation":"Hãy chụp giúp tôi một bức ảnh."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/can-nha/"},{"id":28,"name":"TƯ DUY","words":[{"id":"hsk3-T28-01","hanzi":"安排","pinyin":"ānpái","meaning":"sắp xếp","example":"我希望以后能安排会议。","examplePinyin":"Wǒ xīwàng yǐhòu néng ānpái huìyì.","translation":"Tôi hy vọng sau này có thể sắp xếp cuộc họp."},{"id":"hsk3-T28-02","hanzi":"决定","pinyin":"juédìng","meaning":"quyết định","example":"我决定明天去图书馆。","examplePinyin":"wǒ juédìng míngtiān qù túshūguǎn.","translation":"Tôi quyết định ngày mai đến thư viện."},{"id":"hsk3-T28-03","hanzi":"解决","pinyin":"jiějué","meaning":"giải quyết","example":"我们一起解决这个问题。","examplePinyin":"wǒmen yìqǐ jiějué zhège wèntí.","translation":"Chúng ta cùng giải quyết vấn đề này."},{"id":"hsk3-T28-04","hanzi":"处理","pinyin":"chǔlǐ","meaning":"xử lý","example":"学校决定处理文件。","examplePinyin":"Xuéxiào juédìng chǔlǐ wénjiàn.","translation":"Nhà trường quyết định xử lý tài liệu."},{"id":"hsk3-T28-05","hanzi":"方式","pinyin":"fāngshì","meaning":"cách thức","example":"每个人都有自己的学习方式。","examplePinyin":"Měi ge rén dōu yǒu zìjǐ de xuéxí fāngshì.","translation":"Mỗi người đều có cách học riêng."},{"id":"hsk3-T28-06","hanzi":"过程","pinyin":"guòchéng","meaning":"quá trình","example":"学习汉语的过程虽然不容易，但是很有意思。","examplePinyin":"Xuéxí Hànyǔ de guòchéng suīrán bù róngyì, dànshì hěn yǒu yìsi.","translation":"Quá trình học tiếng Trung tuy không dễ nhưng thú vị."},{"id":"hsk3-T28-07","hanzi":"决心","pinyin":"juéxīn","meaning":"quyết tâm","example":"他下决心每天复习生词。","examplePinyin":"Tā xià juéxīn měitiān fùxí shēngcí.","translation":"Anh ấy quyết tâm ôn từ mới mỗi ngày."},{"id":"hsk3-T28-08","hanzi":"理解","pinyin":"lǐjiě","meaning":"thấu hiểu","example":"他们正在理解意思。","examplePinyin":"Tāmen zhèngzài lǐjiě yìsi.","translation":"Họ đang thấu hiểu ý nghĩa."},{"id":"hsk3-T28-09","hanzi":"理由","pinyin":"lǐyóu","meaning":"lý do","example":"你不同意这个计划，有什么理由？","examplePinyin":"Nǐ bù tóngyì zhège jìhuà, yǒu shénme lǐyóu?","translation":"Bạn không đồng ý kế hoạch này, có lý do gì?"},{"id":"hsk3-T28-10","hanzi":"理论","pinyin":"lǐlùn","meaning":"lý thuyết","example":"老师用例子解释了这个理论。","examplePinyin":"Lǎoshī yòng lìzi jiěshì le zhège lǐlùn.","translation":"Giáo viên dùng ví dụ để giải thích lý thuyết này."},{"id":"hsk3-T28-11","hanzi":"看起来","pinyin":"kàn qǐlái","meaning":"trông có vẻ","example":"这道题看起来很简单。","examplePinyin":"Zhè dào tí kàn qǐlái hěn jiǎndān.","translation":"Câu hỏi này trông có vẻ đơn giản."},{"id":"hsk3-T28-12","hanzi":"判断","pinyin":"pànduàn","meaning":"phán đoán","example":"我们需要判断对错。","examplePinyin":"Wǒmen xūyào pànduàn duì cuò.","translation":"Chúng ta cần phán đoán đúng sai."},{"id":"hsk3-T28-13","hanzi":"评价","pinyin":"píngjià","meaning":"đánh giá","example":"他们正在评价作品。","examplePinyin":"Tāmen zhèngzài píngjià zuòpǐn.","translation":"Họ đang đánh giá tác phẩm."},{"id":"hsk3-T28-14","hanzi":"实际上","pinyin":"shíjì shang","meaning":"trên thực tế","example":"我以为他是北京人，实际上他来自南方。","examplePinyin":"Wǒ yǐwéi tā shì Běijīng rén, shíjì shang tā láizì nánfāng.","translation":"Tôi tưởng anh ấy là người Bắc Kinh, thực tế anh ấy từ miền Nam."},{"id":"hsk3-T28-15","hanzi":"思想","pinyin":"sīxiǎng","meaning":"tư tưởng","example":"这本书介绍了不同年代的思想。","examplePinyin":"Zhè běn shū jièshào le bùtóng niándài de sīxiǎng.","translation":"Cuốn sách giới thiệu tư tưởng của những thời kỳ khác nhau."},{"id":"hsk3-T28-16","hanzi":"绝对","pinyin":"juéduì","meaning":"tuyệt đối","example":"开车时绝对不能看手机。","examplePinyin":"Kāichē shí juéduì bù néng kàn shǒujī.","translation":"Khi lái xe tuyệt đối không được xem điện thoại."},{"id":"hsk3-T28-17","hanzi":"认出","pinyin":"rènchū","meaning":"nhận ra","example":"十年没见，我差点儿没认出他。","examplePinyin":"Shí nián méi jiàn, wǒ chàdiǎnr méi rènchū tā.","translation":"Mười năm không gặp, tôi suýt không nhận ra anh ấy."},{"id":"hsk3-T28-18","hanzi":"认可","pinyin":"rènkě","meaning":"công nhận","example":"他们正在认可这个计划。","examplePinyin":"Tāmen zhèngzài rènkě zhège jìhuà.","translation":"Họ đang công nhận kế hoạch này."},{"id":"hsk3-T28-19","hanzi":"显得","pinyin":"xiǎnde","meaning":"trông có vẻ","example":"她穿这件大衣显得很年轻。","examplePinyin":"Tā chuān zhè jiàn dàyī xiǎnde hěn niánqīng.","translation":"Cô ấy mặc áo khoác này trông rất trẻ."},{"id":"hsk3-T28-20","hanzi":"主张","pinyin":"zhǔzhāng","meaning":"chủ trương","example":"他主张每天练习说汉语。","examplePinyin":"Tā zhǔzhāng měitiān liànxí shuō Hànyǔ.","translation":"Anh ấy chủ trương luyện nói tiếng Trung mỗi ngày."},{"id":"hsk3-T28-21","hanzi":"指出","pinyin":"zhǐchū","meaning":"chỉ ra","example":"我希望以后能
