tả một mốc thời gian hoặc sự kiện xảy ra trước 「以前」 hoặc sau 「以后」 một hành động cụ thể. Trong câu, cụm từ chỉ thời gian luôn đứng trước động từ chính để bổ nghĩa cho hành động đó.","Mẹo: Nếu muốn nói 'trước khi đi' bạn chỉ cần đặt cụm 'đi' trước 「以前」, ví dụ: '去以前'.","Lưu ý: Không được đặt 「以前/以后」 đứng một mình ở đầu câu nếu không có danh từ hoặc cụm động từ đi kèm phía trước để làm rõ nghĩa.","•  这种药需要每天睡前吃一次。","zhè zhǒng yào xū yào měi tiān shuì qián chī yī cì","Loại thuốc này cần uống một lần trước khi ngủ mỗi ngày.","•  考完试以后，咱们一起去旅游吧。","kǎo wán shì yǐ hòu zán men yī qǐ qù lǚ yóu ba","Sau khi thi xong, chúng mình cùng đi du lịch nhé.","Ví dụ: 这种药需要每天睡前吃一次。","Ví dụ: 考完试以后，咱们一起去旅游吧。"]}],"extended":[],"structuredGrammar":[{"name":"Bổ ngữ xu hướng 「下去」: Sự tiếp tục","formula":"Động từ + 下去","explanation":"Cấu trúc 「下去」 được dùng sau động từ để diễn tả một hành động hoặc trạng thái đang diễn ra và cần được tiếp tục duy trì trong tương lai. Nó giúp nhấn mạnh tính liên tục của hành động đó, ví dụ: 「请说下去」 (Xin hãy nói tiếp đi).","tip":"Hãy tưởng tượng 「下去」 như việc bạn đang 'tiếp tục đi xuống' con đường đang đi, giúp bạn ghi nhớ nghĩa của nó là kéo dài hành động.","note":"Không nên nhầm lẫn với hướng đi vật lý (từ cao xuống thấp), ở đây 「下去」 chỉ mang nghĩa trừu tượng về thời gian và trạng thái.","examples":[{"zh":"我今年胖了十多斤，不能再胖下去了。","pinyin":"wǒ jīn nián pàng le shí duō jīn bù néng zài pàng xià qù le","vi":"Năm nay tôi béo lên hơn 10 cân rồi, không thể cứ béo mãi thế này được."},{"zh":"她读完了第一个问题，后面的你读下去。","pinyin":"tā dú wán le dì yī gè wèn tí hòu miàn de nǐ dú xià qù","vi":"Cô ấy đọc xong câu hỏi thứ nhất rồi, phần sau bạn đọc tiếp đi."}],"newExamples":[]},{"name":"Động từ ly hợp","formula":"Động từ (A) + Thành phần bổ trợ + Tân ngữ (B)","explanation":"Trong tiếng Trung, 「động từ ly hợp」 gồm một động từ và một tân ngữ dính liền nhau. Khi muốn thêm số lần, thời lượng hoặc bổ ngữ, ta phải tách chúng ra và chèn các thành phần đó vào giữa.","tip":"Hãy tưởng tượng 「động từ ly hợp」 là một cặp đôi, khi có 'người thứ ba' chen vào thì hai bạn ấy phải tách nhau ra.","note":"Đừng bao giờ đặt bổ ngữ hoặc tân ngữ trực tiếp ngay sau toàn bộ cụm động từ ly hợp mà không tách chúng ra.","examples":[{"zh":"上个星期我跟他见了一次面。","pinyin":"shàng gè xīng qī wǒ gēn tā jiàn le yī cì miàn","vi":"Tuần trước tôi đã gặp anh ấy một lần."},{"zh":"今年夏天只下了两次雨。","pinyin":"jīn nián xià tiān zhǐ xià le liǎng cì yǔ","vi":"Mùa hè năm nay chỉ mưa có hai lần."}],"newExamples":[]},{"name":"Bổ ngữ thời lượng biểu thị thời gian kéo dài","formula":"Chủ ngữ + Động từ + (了) + Bổ ngữ thời lượng + (của tân ngữ)","explanation":"Bổ ngữ thời lượng dùng để diễn tả khoảng thời gian mà một hành động đã diễn ra hoặc kéo dài. Khi có tân ngữ đi kèm, bạn có thể đặt thời lượng ở giữa động từ và tân ngữ, hoặc thêm 「的」 sau bổ ngữ thời lượng.","tip":"Nếu hành động đã kết thúc, bạn có thể thêm 「了」 ngay sau động từ.","note":"Nếu tân ngữ là danh từ chỉ người hoặc đại từ (ví dụ: 我, 他), bổ ngữ thời lượng phải đặt sau tân ngữ.","examples":[{"zh":"我上次来医院已经过去差不多两年了。","pinyin":"wǒ shàng cì lái yī yuàn yǐ jīng guò qù chà bù duō liǎng nián le","vi":"Lần trước tôi đến bệnh viện đã cách đây gần hai năm rồi."},{"zh":"开学已经三个多星期了。","pinyin":"kāi xué yǐ jīng sān gè duō xīng qī le","vi":"Khai giảng đã được hơn ba tuần rồi."}],"newExamples":[]},{"name":"Thời gian trước và sau hành động","formula":"[Cụm động từ/Thời gian] + 以前/以后","explanation":"Cấu trúc này dùng để diễn tả một mốc thời gian hoặc sự kiện xảy ra trước 「以前」 hoặc sau 「以后」 một hành động cụ thể. Trong câu, cụm từ chỉ thời gian luôn đứng trước động từ chính để bổ nghĩa cho hành động đó.","tip":"Nếu muốn nói 'trước khi đi' bạn chỉ cần đặt cụm 'đi' trước 「以前」, ví dụ: '去以前'.","note":"Không được đặt 「以前/以后」 đứng một mình ở đầu câu nếu không có danh từ hoặc cụm động từ đi kèm phía trước để làm rõ nghĩa.","examples":[{"zh":"这种药需要每天睡前吃一次。","pinyin":"zhè zhǒng yào xū yào měi tiān shuì qián chī yī cì","vi":"Loại thuốc này cần uống một lần trước khi ngủ mỗi ngày."},{"zh":"考完试以后，咱们一起去旅游吧。","pinyin":"kǎo wán shì yǐ hòu zán men yī qǐ qù lǚ yóu ba","vi":"Sau khi thi xong, chúng mình cùng đi du lịch nhé."}],"newExamples":[]}],"subtitle":"Hôm nay tôi xuất viện rồi"},{"id":9,"title":"打不好没关系","words":[{"id":"hsk3-L09-01","hanzi":"校园","pinyin":"xiàoyuán","meaning":"khuôn viên trường","example":"我们的校园很漂亮。","examplePinyin":"wǒmen de xiàoyuán hěn piàoliang.","translation":"Khuôn viên trường chúng tôi rất đẹp."},{"id":"hsk3-L09-02","hanzi":"卡","pinyin":"kǎ","meaning":"thẻ","example":"我找不到学生卡了。","examplePinyin":"wǒ zhǎo bù dào xuéshēngkǎ le.","translation":"Tôi không tìm thấy thẻ học sinh nữa."},{"id":"hsk3-L09-03","hanzi":"球场","pinyin":"qiúchǎng","meaning":"sân bóng","example":"我们在球场见面。","examplePinyin":"wǒmen zài qiúchǎng jiànmiàn.","translation":"Chúng ta gặp nhau ở sân bóng."},{"id":"hsk3-L09-04","hanzi":"为了","pinyin":"wèile","meaning":"để, vì mục đích","example":"为了学好汉语，我每天练习。","examplePinyin":"wèile xué hǎo Hànyǔ, wǒ měitiān liànxí.","translation":"Để học tốt tiếng Trung, tôi luyện tập mỗi ngày."},{"id":"hsk3-L09-05","hanzi":"运动会","pinyin":"yùndònghuì","meaning":"hội thao, đại hội thể thao","example":"学校明天有运动会。","examplePinyin":"xuéxiào míngtiān yǒu yùndònghuì.","translation":"Ngày mai trường tổ chức hội thao."},{"id":"hsk3-L09-06","hanzi":"男生","pinyin":"nánshēng","meaning":"học sinh nam, nam sinh","example":"我们班有十个男生。","examplePinyin":"wǒmen bān yǒu shí gè nánshēng.","translation":"Lớp chúng tôi có mười bạn nam."},{"id":"hsk3-L09-07","hanzi":"练","pinyin":"liàn","meaning":"luyện tập","example":"我每天练说汉语。","examplePinyin":"wǒ měitiān liàn shuō Hànyǔ.","translation":"Tôi luyện nói tiếng Trung mỗi ngày."},{"id":"hsk3-L09-08","hanzi":"参加","pinyin":"cānjiā","meaning":"tham gia","example":"我想参加比赛。","examplePinyin":"wǒ xiǎng cānjiā bǐsài.","translation":"Tôi muốn tham gia cuộc thi."},{"id":"hsk3-L09-09","hanzi":"网球","pinyin":"wǎngqiú","meaning":"quần vợt","example":"她喜欢打网球。","examplePinyin":"tā xǐhuān dǎ wǎngqiú.","translation":"Cô ấy thích chơi quần vợt."},{"id":"hsk3-L09-10","hanzi":"比赛","pinyin":"bǐsài","meaning":"cuộc thi, trận đấu","example":"明天的比赛很重要。","examplePinyin":"míngtiān de bǐsài hěn zhòngyào.","translation":"Trận đấu ngày mai rất quan trọng."},{"id":"hsk3-L09-11","hanzi":"练习","pinyin":"liànxí","meaning":"luyện tập; bài tập","example":"我们一起练习发音。","examplePinyin":"wǒmen yìqǐ liànxí fā yīn.","translation":"Chúng ta cùng luyện phát âm."},{"id":"hsk3-L09-12","hanzi":"好多","pinyin":"hǎoduō","meaning":"rất nhiều","example":"这里有好多学生。","examplePinyin":"zhèlǐ yǒu hǎoduō xuésheng.","translation":"Ở đây có rất nhiều học sinh."},{"id":"hsk3-L09-13","hanzi":"几乎","pinyin":"jǐhū","meaning":"hầu như, gần như","example":"他几乎每天都跑步。","examplePinyin":"tā jǐhū měitiān dōu pǎo bù.","translation":"Anh ấy gần như ngày nào cũng chạy bộ."},{"id":"hsk3-L09-14","hanzi":"只是","pinyin":"zhǐshì","meaning":"chỉ là, chẳng qua","example":"我只是有点儿累。","examplePinyin":"wǒ zhǐshì yǒu diǎn ér lèi.","translation":"Tôi chỉ hơi mệt thôi."},{"id":"hsk3-L09-15","hanzi":"啤酒","pinyin":"píjiǔ","meaning":"bia","example":"爸爸不喜欢喝啤酒。","examplePinyin":"bàba bù xǐhuān hē píjiǔ.","translation":"Bố không thích uống bia."},{"id":"hsk3-L09-16","hanzi":"回","pinyin":"huí","meaning":"lượt, lần; trở về","example":"我去过北京两回。","examplePinyin":"wǒ qù guò Běijīng liǎng huí.","translation":"Tôi đã đến Bắc Kinh hai lần."},{"id":"hsk3-L09-17","hanzi":"紧张","pinyin":"jǐnzhāng","meaning":"căng thẳng, hồi hộp","example":"考试以前我有点儿紧张。","examplePinyin":"kǎo shì yǐqián wǒ yǒu diǎn ér jǐnzhāng.","translation":"Trước kỳ thi tôi hơi hồi hộp."},{"id":"hsk3-L09-18","hanzi":"主要","pinyin":"zhǔyào","meaning":"chủ yếu, chính","example":"我主要学习汉语。","examplePinyin":"wǒ zhǔyào xuéxí Hànyǔ.","translation":"Tôi chủ yếu học tiếng Trung."},{"id":"hsk3-L09-19","hanzi":"受到","pinyin":"shòudào","meaning":"chịu, nhận (tác động)","example":"他受到了老师的帮助。","examplePinyin":"tā shòudào le lǎoshī de bāngzhù.","translation":"Anh ấy đã nhận được sự giúp đỡ của giáo viên."},{"id":"hsk3-L09-20","hanzi":"影响","pinyin":"yǐngxiǎng","meaning":"ảnh hưởng","example":"天气会影响比赛。","examplePinyin":"tiān qì huì yǐngxiǎng bǐsài.","translation":"Thời tiết có thể ảnh hưởng trận đấu."},{"id":"hsk3-L09-21","hanzi":"得分","pinyin":"défēn","meaning":"ghi điểm, được điểm","example":"我们队得分了。","examplePinyin":"wǒmen duì défēn le.","translation":"Đội chúng tôi ghi điểm rồi."},{"id":"hsk3-L09-22","hanzi":"体育","pinyin":"tǐyù","meaning":"thể dục, thể thao","example":"我最喜欢体育课。","examplePinyin":"wǒ zuì xǐhuān tǐyù kè.","translation":"Tôi thích nhất tiết thể dục."},{"id":"hsk3-L09-23","hanzi":"世界","pinyin":"shìjiè","meaning":"thế giới","example":"世界上有很多国家。","examplePinyin":"shìjiè shàng yǒu hěnduō guójiā.","translation":"Trên thế giới có rất nhiều quốc gia."},{"id":"hsk3-L09-24","hanzi":"运动员","pinyin":"yùndòngyuán","meaning":"vận động viên","example":"他是一名网球运动员。","examplePinyin":"tā shì yī míng wǎngqiú yùndòngyuán.","translation":"Anh ấy là một vận động viên quần vợt."},{"id":"hsk3-L09-25","hanzi":"得到","pinyin":"dédào","meaning":"nhận được, đạt được","example":"我得到了朋友的帮助。","examplePinyin":"wǒ dédào le péngyou de bāngzhù.","translation":"Tôi đã nhận được sự giúp đỡ của bạn."},{"id":"hsk3-L09-26","hanzi":"成绩","pinyin":"chéngjì","meaning":"thành tích, điểm số","example":"他的考试成绩很好。","examplePinyin":"tā de kǎo shì chéngjì hěnhǎo.","translation":"Điểm thi của anh ấy rất tốt."}],"grammar":[{"name":"Câu phức chỉ mục đích","details":["Cấu trúc: 为了 + Mục đích, + Hành động (S + V...)","Giải thích: Cấu trúc 「为了」 được dùng để nêu lên mục đích của một hành động, mang nghĩa là \"để\" hoặc \"vì\". Vế đầu chứa mục đích cần đạt được, vế sau là hành động thực hiện để đạt được mục đích đó.","Mẹo: Bạn có thể đặt 「为了」 ở ngay đầu câu hoặc sau chủ ngữ của mệnh đề chính.","Lưu ý: Đừng nhầm lẫn 「为了」 (chỉ mục đích) với 「因为」 (chỉ lý do/nguyên nhân).","•  听说为了准备运动会，你们几个男生每天都练球。","tīng shuō wèi le zhǔn bèi yùn dòng huì nǐ men jǐ gè nán shēng měi tiān dōu liàn qiú","Nghe nói để chuẩn bị cho đại hội thể thao, mấy bạn nam các cậu ngày nào cũng luyện bóng.","•  为了上大学，她每天努力学习。","wèi le shàng dà xué tā měi tiān nǔ lì xué xí","Để được vào đại học, cô ấy nỗ lực học tập mỗi ngày.","Ví dụ: 听说为了准备运动会，你们几个男生每天都练球。","Ví dụ: 为了上大学，她每天努力学习。"]},{"name":"Bổ ngữ khả năng (V + 得/不 + bổ ngữ)","details":["Cấu trúc: V + 得/不 + bổ ngữ (kết quả/xu hướng)","Giải thích: Cấu trúc này dùng để diễn đạt việc hành động có thể hoặc không thể thực hiện được do điều kiện khách quan hoặc năng lực. 「得」 dùng cho khẳng định (làm được), còn 「不」 dùng cho phủ định (không làm được). Ví dụ: 「听得懂」 (nghe hiểu) và 「听不懂」 (nghe không hiểu).","Mẹo: Hãy ghi nhớ cặp đối lập này để nói về khả năng đạt được kết quả của một hành động, giúp câu văn tự nhiên hơn nhiều so với việc chỉ dùng 「能」.","Lưu ý: Đừng nhầm lẫn với bổ ngữ trình độ (V + 得 + tính từ); bổ ngữ khả năng luôn dùng để nói về việc có hoàn thành được kết quả hay không.","•  打不好没关系。","dǎ bù hǎo méi guān xì","Đánh không tốt cũng không sao.","•  这本书你看得懂看不懂？","zhè běn shū nǐ kàn de dǒng kàn bù dǒng","Quyển sách này bạn có đọc hiểu không?","Ví dụ: 打不好没关系。","Ví dụ: 这本书你看得懂看不懂？"]},{"name":"Cấu trúc càng... càng...","details":["Cấu trúc: 越 + A + 越 + B","Giải thích: Cấu trúc 「越 A 越 B」 dùng để diễn tả sự thay đổi song song của hai yếu tố, khi mức độ của A tăng lên thì B cũng thay đổi theo tương ứng. Bạn có thể dịch là \"càng A càng B\" để nắm bắt ý nghĩa của cấu trúc này.","Mẹo: Thông thường A và B thường là các động từ chỉ tâm lý hoặc tính từ chỉ trạng thái.","Lưu ý: Cấu trúc này không dùng các từ chỉ trạng thái cố định mà chỉ dùng cho những thứ có tính chất thay đổi, tăng tiến.","•  今天的足球比赛我越看越着急。","jīn tiān de zú qiú bǐ sài wǒ yuè kàn yuè zháo jí","Trận bóng đá hôm nay tôi càng xem càng thấy sốt ruột.","•  我想认识中国朋友，越多越好。","wǒ xiǎng rèn shí zhōng guó péng yǒu yuè duō yuè hǎo","Tôi muốn quen bạn người Trung Quốc, càng nhiều càng tốt.","Ví dụ: 今天的足球比赛我越看越着急。","Ví dụ: 我想认识中国朋友，越多越好。"]}],"extended":[],"structuredGrammar":[{"name":"Câu phức chỉ mục đích","formula":"为了 + Mục đích, + Hành động (S + V...)","explanation":"Cấu trúc 「为了」 được dùng để nêu lên mục đích của một hành động, mang nghĩa là \"để\" hoặc \"vì\". Vế đầu chứa mục đích cần đạt được, vế sau là hành động thực hiện để đạt được mục đích đó.","tip":"Bạn có thể đặt 「为了」 ở ngay đầu câu hoặc sau chủ ngữ của mệnh đề chính.","note":"Đừng nhầm lẫn 「为了」 (chỉ mục đích) với 「因为」 (chỉ lý do/nguyên nhân).","examples":[{"zh":"听说为了准备运动会，你们几个男生每天都练球。","pinyin":"tīng shuō wèi le zhǔn bèi yùn dòng huì nǐ men jǐ gè nán shēng měi tiān dōu liàn qiú","vi":"Nghe nói để chuẩn bị cho đại hội thể thao, mấy bạn nam các cậu ngày nào cũng luyện bóng."},{"zh":"为了上大学，她每天努力学习。","pinyin":"wèi le shàng dà xué tā měi tiān nǔ lì xué xí","vi":"Để được vào đại học, cô ấy nỗ lực học tập mỗi ngày."}],"newExamples":[]},{"name":"Bổ ngữ khả năng (V + 得/不 + bổ ngữ)","formula":"V + 得/不 + bổ ngữ (kết quả/xu hướng)","explanation":"Cấu trúc này dùng để diễn đạt việc hành động có thể hoặc không thể thực hiện được do điều kiện khách quan hoặc năng lực. 「得」 dùng cho khẳng định (làm được), còn 「不」 dùng cho phủ định (không làm được). Ví dụ: 「听得懂」 (nghe hiểu) và 「听不懂」 (nghe không hiểu).","tip":"Hãy ghi nhớ cặp đối lập này để nói về khả năng đạt được kết quả của một hành động, giúp câu văn tự nhiên hơn nhiều so với việc chỉ dùng 「能」.","note":"Đừng nhầm lẫn với bổ ngữ trình độ (V + 得 + tính từ); bổ ngữ khả năng luôn dùng để nói về việc có hoàn thành được kết quả hay không.","examples":[{"zh":"打不好没关系。","pinyin":"dǎ bù hǎo méi guān xì","vi":"Đánh không tốt cũng không sao."},{"zh":"这本书你看得懂看不懂？","pinyin":"zhè běn shū nǐ kàn de dǒng kàn bù dǒng","vi":"Quyển sách này bạn có đọc hiểu không?"}],"newExamples":[]},{"name":"Cấu trúc càng... càng...","formula":"越 + A + 越 + B","explanation":"Cấu trúc 「越 A 越 B」 dùng để diễn tả sự thay đổi song song của hai yếu tố, khi mức độ của A tăng lên thì B cũng thay đổi theo tương ứng. Bạn có thể dịch là \"càng A càng B\" để nắm bắt ý nghĩa của cấu trúc này.","tip":"Thông thường A và B thường là các động từ chỉ tâm lý hoặc tính từ chỉ trạng thái.","note":"Cấu trúc này không dùng các từ chỉ trạng thái cố định mà chỉ dùng cho những thứ có tính chất thay đổi, tăng tiến.","examples":[{"zh":"今天的足球比赛我越看越着急。","pinyin":"jīn tiān de zú qiú bǐ sài wǒ yuè kàn yuè zháo jí","vi":"Trận bóng đá hôm nay tôi càng xem càng thấy sốt ruột."},{"zh":"我想认识中国朋友，越多越好。","pinyin":"wǒ xiǎng rèn shí zhōng guó péng yǒu yuè duō yuè hǎo","vi":"Tôi muốn quen bạn người Trung Quốc, càng nhiều càng tốt."}],"newExamples":[]}],"subtitle":"Chơi chưa tốt cũng không sao"},{"id":10,"title":"你明天再把书还给我","words":[{"id":"hsk3-L10-01","hanzi":"数学","pinyin":"shùxué","meaning":"toán học","example":"我喜欢学习数学。","examplePinyin":"wǒ xǐhuān xuéxí shùxué.","translation":"Tôi thích học toán."},{"id":"hsk3-L10-02","hanzi":"认真","pinyin":"rènzhēn","meaning":"chăm chỉ, nghiêm túc","example":"他学习很认真。","examplePinyin":"tā xuéxí hěn rènzhēn.","translation":"Anh ấy học rất nghiêm túc."},{"id":"hsk3-L10-03","hanzi":"笔记","pinyin":"bǐjì","meaning":"ghi chép, sổ ghi chép","example":"上课时我认真做笔记。","examplePinyin":"shàng kè shí wǒ rènzhēn zuò bǐjì.","translation":"Khi lên lớp tôi ghi chép cẩn thận."},{"id":"hsk3-L10-04","hanzi":"清楚","pinyin":"qīngchu","meaning":"rõ ràng","example":"你说清楚一点儿。","examplePinyin":"nǐ shuō qīngchu yìdiǎnr.","translation":"Bạn nói rõ hơn một chút."},{"id":"hsk3-L10-05","hanzi":"黑板","pinyin":"hēibǎn","meaning":"bảng đen","example":"老师在黑板上写字。","examplePinyin":"lǎoshī zài hēibǎn shàng xiě zì.","translation":"Giáo viên viết chữ trên bảng đen."},{"id":"hsk3-L10-06","hanzi":"把","pinyin":"bǎ","meaning":"đem, lấy (chữ 把); lượng từ có cán","example":"请把门关上。","examplePinyin":"qǐng bǎ mén guān shàng.","translation":"Hãy đóng cửa lại."},{"id":"hsk3-L10-07","hanzi":"作业","pinyin":"zuòyè","meaning":"bài tập về nhà","example":"我已经做完作业了。","examplePinyin":"wǒ yǐjīng zuò wán zuòyè le.","translation":"Tôi đã làm xong bài tập về nhà."},{"id":"hsk3-L10-08","hanzi":"遍","pinyin":"biàn","meaning":"lần, lượt (từ đầu đến cuối)","example":"请再读一遍。","examplePinyin":"qǐng zài dú yī biàn.","translation":"Hãy đọc lại một lượt nữa."},{"id":"hsk3-L10-09","hanzi":"提高","pinyin":"tígāo","meaning":"nâng cao, cải thiện","example":"我想提高汉语水平。","examplePinyin":"wǒ xiǎng tígāo hànyǔshuǐpíng.","translation":"Tôi muốn nâng cao trình độ tiếng Trung."},{"id":"hsk3-L10-10","hanzi":"历史","pinyin":"lìshǐ","meaning":"lịch sử","example":"我对中国历史很感兴趣。","examplePinyin":"wǒ duì zhōngguólìshǐ hěn gǎnxìngqù.","translation":"Tôi rất hứng thú với lịch sử Trung Quốc."},{"id":"hsk3-L10-11","hanzi":"难","pinyin":"nán","meaning":"khó","example":"这道题很难。","examplePinyin":"zhè dào tí hěn nán.","translation":"Câu này rất khó."},{"id":"hsk3-L10-12","hanzi":"要求","pinyin":"yàoqiú","meaning":"yêu cầu, đòi hỏi","example":"老师要求我们认真学习。","examplePinyin":"lǎoshī yàoqiú wǒmen rènzhēn xuéxí.","translation":"Giáo viên yêu cầu chúng tôi học nghiêm túc."},{"id":"hsk3-L10-13","hanzi":"差","pinyin":"chà","meaning":"kém, thiếu, chênh lệch","example":"我的数学成绩不差。","examplePinyin":"wǒ de shùxué chéngjì bù chà.","translation":"Điểm toán của tôi không tệ."},{"id":"hsk3-L10-14","hanzi":"复习","pinyin":"fùxí","meaning":"ôn tập","example":"考试以前我要复习。","examplePinyin":"kǎo shì yǐqián wǒ yào fùxí.","translation":"Trước kỳ thi tôi cần ôn tập."},{"id":"hsk3-L10-15","hanzi":"外语","pinyin":"wàiyǔ","meaning":"ngoại ngữ","example":"我正在学习一门外语。","examplePinyin":"wǒ zhèng zài xuéxí yī mén wàiyǔ.","translation":"Tôi đang học một ngoại ngữ."},{"id":"hsk3-L10-16","hanzi":"当然","pinyin":"dāngrán","meaning":"tất nhiên, đương nhiên","example":"当然可以。","examplePinyin":"dāngrán kěyǐ.","translation":"Tất nhiên là được."},{"id":"hsk3-L10-17","hanzi":"遇到","pinyin":"yùdào","meaning":"gặp phải","example":"我遇到了一个难题。","examplePinyin":"wǒ yùdào le yí ge nántí.","translation":"Tôi gặp phải một câu hỏi khó."},{"id":"hsk3-L10-18","hanzi":"办公室","pinyin":"bàngōngshì","meaning":"văn phòng","example":"老师在办公室工作。","examplePinyin":"lǎoshī zài bàngōngshì gōngzuò.","translation":"Giáo viên làm việc trong văn phòng."},{"id":"hsk3-L10-19","hanzi":"页","pinyin":"yè","meaning":"trang (sách)","example":"请打开第十页。","examplePinyin":"qǐng dǎ kāi dì shí yè.","translation":"Hãy mở trang thứ mười."},{"id":"hsk3-L10-20","hanzi":"对话","pinyin":"duìhuà","meaning":"đối thoại, hội thoại","example":"我们练习汉语对话。","examplePinyin":"wǒmen liànxí Hànyǔ duìhuà.","translation":"Chúng tôi luyện tập hội thoại tiếng Trung."},{"id":"hsk3-L10-21","hanzi":"明白","pinyin":"míngbai","meaning":"hiểu rõ","example":"我明白你的意思了。","examplePinyin":"wǒ míngbai nǐ de yì sī le.","translation":"Tôi đã hiểu ý bạn rồi."},{"id":"hsk3-L10-22","hanzi":"讲","pinyin":"jiǎng","meaning":"nói, giảng, kể","example":"老师正在讲故事。","examplePinyin":"lǎoshī zhèng zài jiǎng gùshì.","translation":"Giáo viên đang kể chuyện."},{"id":"hsk3-L10-23","hanzi":"句","pinyin":"jù","meaning":"câu (lượng từ)","example":"请说一句汉语。","examplePinyin":"qǐng shuō yī jù Hànyǔ.","translation":"Hãy nói một câu tiếng Trung."},{"id":"hsk3-L10-24","hanzi":"句子","pinyin":"jùzi","meaning":"câu văn","example":"这个句子很简单。","examplePinyin":"zhège jùzi hěn jiǎndān.","translation":"Câu này rất đơn giản."},{"id":"hsk3-L10-25","hanzi":"年级","pinyin":"niánjí","meaning":"khối lớp","example":"我弟弟上三年级。","examplePinyin":"wǒ dìdi shàng sān niánjí.","translation":"Em trai tôi học lớp ba."},{"id":"hsk3-L10-26","hanzi":"后年","pinyin":"hòunián","meaning":"năm sau nữa","example":"我后年大学毕业。","examplePinyin":"wǒ hòunián dà xué bìyè.","translation":"Năm sau nữa tôi tốt nghiệp đại học."},{"id":"hsk3-L10-27","hanzi":"一般","pinyin":"yìbān","meaning":"thông thường, bình thường","example":"我一般七点起床。","examplePinyin":"wǒ yìbān qīdiǎn qǐ chuáng.","translation":"Tôi thường dậy lúc bảy giờ."},{"id":"hsk3-L10-28","hanzi":"努力","pinyin":"nǔlì","meaning":"nỗ lực, chăm chỉ","example":"她每天努力学习。","examplePinyin":"tā měitiān nǔlì xuéxí.","translation":"Cô ấy học rất chăm chỉ mỗi ngày."}],"grammar":[{"name":"Câu chữ 把: cấu trúc cơ bản","details":["Cấu trúc: Chủ ngữ + 把 + Tân ngữ + Động từ + Thành phần khác","Giải thích: Câu chữ 「把」 được dùng để nhấn mạnh sự tác động của chủ ngữ lên tân ngữ, khiến tân ngữ thay đổi trạng thái hoặc bị xử lý. Động từ trong câu này không bao giờ đứng một mình mà thường đi kèm với bổ ngữ hoặc các thành phần khác như 「了」.","Mẹo: Hãy nhớ rằng các phó từ như 「不」, 「没」 hay động từ năng nguyện phải đặt ngay trước chữ 「把」, không đặt trước động từ chính.","Lưu ý: Động từ trong câu 「把」 phải có kèm thành phần phụ phía sau như bổ ngữ kết quả, bổ ngữ xu hướng hoặc trợ từ 「了」 để chỉ kết quả của hành động.","•  我会把这些题都记在本子上。","wǒ huì bǎ zhè xiē tí dōu jì zài běn zi shàng","Tôi sẽ ghi lại tất cả những câu này vào vở.","•  老师把作业本放到桌子上了。","lǎo shī bǎ zuò yè běn fàng dào zhuō zi shàng le","Thầy giáo đã để vở bài tập lên bàn rồi.","Ví dụ: 我会把这些题都记在本子上。","Ví dụ: 老师把作业本放到桌子上了。"]},{"name":"Cấu trúc phạm vi 在……上/中/下","details":["Cấu trúc: 在 + [Danh từ/Khái cạnh] + 上/中/下","Giải thích: Cấu trúc này dùng để xác định phạm vi, hoàn cảnh hoặc khía cạnh mà hành động hay sự việc xảy ra. Trong đó, 「上」 thường chỉ khía cạnh (lý thuyết), 「中」 chỉ quá trình (đang diễn ra) và 「下」 chỉ điều kiện (dưới sự tác động).","Mẹo: Hãy ghi nhớ các cụm từ cố định như 「在工作上」 (trong công việc) hay 「在学习中」 (trong quá trình học) để vận dụng linh hoạt.","Lưu ý: Cần chú ý không dịch máy móc theo nghĩa đen (trên/trong/dưới) vì đây là các từ chỉ phạm vi trừu tượng.","•  在学习上，遇到什么问题都可以问我。","zài xué xí shàng yù dào shén me wèn tí dōu kě yǐ wèn wǒ","Trong học tập, gặp vấn đề gì bạn cũng có thể hỏi tôi.","•  在老师的帮助下，我的成绩提高很快。","zài lǎo shī de bāng zhù xià wǒ de chéng jì tí gāo hěn kuài","Dưới sự giúp đỡ của thầy giáo, thành tích của tôi tiến bộ rất nhanh.","Ví dụ: 在学习上，遇到什么问题都可以问我。","Ví dụ: 在老师的帮助下，我的成绩提高很快。"]},{"name":"Câu chữ 把 với bổ ngữ kết quả","details":["Cấu trúc: Chủ ngữ + 把 + Tân ngữ + Động từ + Bổ ngữ (kết quả/xu hướng)","Giải thích: Trong câu chữ 「把」, khi muốn nhấn mạnh kết quả hoặc hướng của hành động tác động lên tân ngữ, ta thêm bổ ngữ ngay sau động từ. Cấu trúc này giúp làm rõ trạng thái hoặc vị trí mới của sự vật sau khi hành động kết thúc.","Mẹo: Hãy nhớ rằng sau động từ trong câu 「把」 bắt buộc phải có thành phần khác kèm theo, không được đứng một mình.","Lưu ý: Không được thêm các phó từ chỉ thời gian hay phủ định như 「不」, 「没」 vào trước động từ trong câu này.","•  我跟你一起把这些工作做完。","wǒ gēn nǐ yī qǐ bǎ zhè xiē gōng zuò zuò wán","Tôi cùng bạn làm cho xong những công việc này.","•  妈妈把衣服洗干净了。","mā mā bǎ yī fú xǐ gān jìng le","Mẹ đã giặt sạch quần áo rồi.","Ví dụ: 我跟你一起把这些工作做完。","Ví dụ: 妈妈把衣服洗干净了。"]}],"extended":[],"structuredGrammar":[{"name":"Câu chữ 把: cấu trúc cơ bản","formula":"Chủ ngữ + 把 + Tân ngữ + Động từ + Thành phần khác","explanation":"Câu chữ 「把」 được dùng để nhấn mạnh sự tác động của chủ ngữ lên tân ngữ, khiến tân ngữ thay đổi trạng thái hoặc bị xử lý. Động từ trong câu này không bao giờ đứng một mình mà thường đi kèm với bổ ngữ hoặc các thành phần khác như 「了」.","tip":"Hãy nhớ rằng các phó từ như 「不」, 「没」 hay động từ năng nguyện phải đặt ngay trước chữ 「把」, không đặt trước động từ chính.","note":"Động từ trong câu 「把」 phải có kèm thành phần phụ phía sau như bổ ngữ kết quả, bổ ngữ xu hướng hoặc trợ từ 「了」 để chỉ kết quả của hành động.","examples":[{"zh":"我会把这些题都记在本子上。","pinyin":"wǒ huì bǎ zhè xiē tí dōu jì zài běn zi shàng","vi":"Tôi sẽ ghi lại tất cả những câu này vào vở."},{"zh":"老师把作业本放到桌子上了。","pinyin":"lǎo shī bǎ zuò yè běn fàng dào zhuō zi shàng le","vi":"Thầy giáo đã để vở bài tập lên bàn rồi."}],"newExamples":[]},{"name":"Cấu trúc phạm vi 在……上/中/下","formula":"在 + [Danh từ/Khái cạnh] + 上/中/下","explanation":"Cấu trúc này dùng để xác định phạm vi, hoàn cảnh hoặc khía cạnh mà hành động hay sự việc xảy ra. Trong đó, 「上」 thường chỉ khía cạnh (lý thuyết), 「中」 chỉ quá trình (đang diễn ra) và 「下」 chỉ điều kiện (dưới sự tác động).","tip":"Hãy ghi nhớ các cụm từ cố định như 「在工作上」 (trong công việc) hay 「在学习中」 (trong quá trình học) để vận dụng linh hoạt.","note":"Cần chú ý không dịch máy móc theo nghĩa đen (trên/trong/dưới) vì đây là các từ chỉ phạm vi trừu tượng.","examples":[{"zh":"在学习上，遇到什么问题都可以问我。","pinyin":"zài xué xí shàng yù dào shén me wèn tí dōu kě yǐ wèn wǒ","vi":"Trong học tập, gặp vấn đề gì bạn cũng có thể hỏi tôi."},{"zh":"在老师的帮助下，我的成绩提高很快。","pinyin":"zài lǎo shī de bāng zhù xià wǒ de chéng jì tí gāo hěn kuài","vi":"Dưới sự giúp đỡ của thầy giáo, thành tích của tôi tiến bộ rất nhanh."}],"newExamples":[]},{"name":"Câu chữ 把 với bổ ngữ kết quả","formula":"Chủ ngữ + 把 + Tân ngữ + Động từ + Bổ ngữ (kết quả/xu hướng)","explanation":"Trong câu chữ 「把」, khi muốn nhấn mạnh kết quả hoặc hướng của hành động tác động lên tân ngữ, ta thêm bổ ngữ ngay sau động từ. Cấu trúc này giúp làm rõ trạng thái hoặc vị trí mới của sự vật sau khi hành động kết thúc.","tip":"Hãy nhớ rằng sau động từ trong câu 「把」 bắt buộc phải có thành phần khác kèm theo, không được đứng một mình.","note":"Không được thêm các phó từ chỉ thời gian hay phủ định như 「不」, 「没」 vào trước động từ trong câu này.","examples":[{"zh":"我跟你一起把这些工作做完。","pinyin":"wǒ gēn nǐ yī qǐ bǎ zhè xiē gōng zuò zuò wán","vi":"Tôi cùng bạn làm cho xong những công việc này."},{"zh":"妈妈把衣服洗干净了。","pinyin":"mā mā bǎ yī fú xǐ gān jìng le","vi":"Mẹ đã giặt sạch quần áo rồi."}],"newExamples":[]}],"subtitle":"Ngày mai bạn hãy trả sách cho tôi"},{"id":11,"title":"看来我没办法解决这个问题","words":[{"id":"hsk3-L11-01","hanzi":"会议","pinyin":"huìyì","meaning":"cuộc họp, hội nghị","example":"下午三点有一个会议。","examplePinyin":"xiàwǔ sān diǎn yǒu yí ge huìyì.","translation":"Ba giờ chiều có một cuộc họp."},{"id":"hsk3-L11-02","hanzi":"经理","pinyin":"jīnglǐ","meaning":"giám đốc, quản lý","example":"经理今天不在办公室。","examplePinyin":"jīnglǐ jīntiān bùzài bàngōngshì.","translation":"Hôm nay giám đốc không ở văn phòng."},{"id":"hsk3-L11-03","hanzi":"开会","pinyin":"kāihuì","meaning":"họp","example":"他们正在开会。","examplePinyin":"tāmen zhèng zài kāihuì.","translation":"Họ đang họp."},{"id":"hsk3-L11-04","hanzi":"后天","pinyin":"hòutiān","meaning":"ngày kia","example":"后天我去上海。","examplePinyin":"hòutiān wǒ qù Shànghǎi.","translation":"Ngày kia tôi đến Thượng Hải."},{"id":"hsk3-L11-05","hanzi":"地点","pinyin":"dìdiǎn","meaning":"địa điểm","example":"开会的地点在哪儿？","examplePinyin":"kāihuì de dìdiǎn zài nǎér?","translation":"Địa điểm họp ở đâu?"},{"id":"hsk3-L11-06","hanzi":"室","pinyin":"shì","meaning":"phòng (thành tố)","example":"我们在会议室见面。","examplePinyin":"wǒmen zài huìyì shì jiànmiàn.","translation":"Chúng ta gặp ở phòng họp."},{"id":"hsk3-L11-07","hanzi":"发","pinyin":"fā","meaning":"gửi, phát; phát ra","example":"我给你发邮件了。","examplePinyin":"wǒ gěi nǐ fā yóujiàn le.","translation":"Tôi đã gửi email cho bạn."},{"id":"hsk3-L11-08","hanzi":"笔记本","pinyin":"bǐjìběn","meaning":"sổ ghi chép; máy tính xách tay","example":"我把笔记本放在桌子上。","examplePinyin":"wǒ bǎ bǐjìběn fàng zài zhuō zǐ shàng.","translation":"Tôi đặt cuốn sổ ghi chép lên bàn."},{"id":"hsk3-L11-09","hanzi":"或者","pinyin":"huòzhě","meaning":"hoặc là","example":"明天或者后天都可以。","examplePinyin":"míngtiān huòzhě hòutiān dōu kěyǐ.","translation":"Ngày mai hoặc ngày kia đều được."},{"id":"hsk3-L11-10","hanzi":"声音","pinyin":"shēngyīn","meaning":"âm thanh, giọng nói","example":"你的声音很好听。","examplePinyin":"nǐ de shēngyīn hěnhǎo tīng.","translation":"Giọng nói của bạn nghe rất hay."},{"id":"hsk3-L11-11","hanzi":"看来","pinyin":"kànlái","meaning":"xem ra, có vẻ như","example":"看来今天要下雨。","examplePinyin":"kànlái jīntiān yào xià yǔ.","translation":"Xem ra hôm nay trời sắp mưa."},{"id":"hsk3-L11-12","hanzi":"办法","pinyin":"bànfǎ","meaning":"cách, biện pháp","example":"我有一个好办法。","examplePinyin":"wǒ yǒu yí ge hǎo bànfǎ.","translation":"Tôi có một cách hay."},{"id":"hsk3-L11-13","hanzi":"解决","pinyin":"jiějué","meaning":"giải quyết","example":"我们一起解决这个问题。","examplePinyin":"wǒmen yìqǐ jiějué zhège wèntí.","translation":"Chúng ta cùng giải quyết vấn đề này."},{"id":"hsk3-L11-14","hanzi":"只能","pinyin":"zhǐnéng","meaning":"chỉ có thể, đành phải","example":"太晚了，我只能回家。","examplePinyin":"tài wǎn le, wǒ zhǐnéng huíjiā.","translation":"Muộn quá rồi, tôi chỉ có thể về nhà."},{"id":"hsk3-L11-15","hanzi":"别人","pinyin":"biérén","meaning":"người khác","example":"不要拿别人的东西。","examplePinyin":"bùyào ná biérén de dōngxi.","translation":"Đừng lấy đồ của người khác."},{"id":"hsk3-L11-16","hanzi":"请假","pinyin":"qǐngjiǎ","meaning":"xin nghỉ phép","example":"我生病了，要请假。","examplePinyin":"wǒ shēng bìng le, yào qǐngjiǎ.","translation":"Tôi bị ốm nên phải xin nghỉ."},{"id":"hsk3-L11-17","hanzi":"同事","pinyin":"tóngshì","meaning":"đồng nghiệp","example":"我的同事很热情。","examplePinyin":"wǒ de tóngshì hěnrè qíng.","translation":"Đồng nghiệp của tôi rất nhiệt tình."},{"id":"hsk3-L11-18","hanzi":"休假","pinyin":"xiūjiǎ","meaning":"nghỉ phép, đi nghỉ","example":"经理下周休假。","examplePinyin":"jīnglǐ xià zhōu xiūjiǎ.","translation":"Giám đốc nghỉ phép tuần sau."},{"id":"hsk3-L11-19","hanzi":"怕","pinyin":"pà","meaning":"sợ","example":"我怕明天会下雨。","examplePinyin":"wǒ pà míngtiān huì xià yǔ.","translation":"Tôi sợ ngày mai trời sẽ mưa."},{"id":"hsk3-L11-20","hanzi":"邮箱","pinyin":"yóuxiāng","meaning":"hộp thư điện tử","example":"请把照片发到我的邮箱。","examplePinyin":"qǐng bǎ zhàopiàn fā dào wǒ de yóuxiāng.","translation":"Hãy gửi ảnh vào hộp thư của tôi."},{"id":"hsk3-L11-21","hanzi":"愿意","pinyin":"yuànyì","meaning":"sẵn lòng, đồng ý","example":"我愿意帮助你。","examplePinyin":"wǒ yuànyì bāngzhù nǐ.","translation":"Tôi sẵn lòng giúp bạn."},{"id":"hsk3-L11-22","hanzi":"城市","pinyin":"chéngshì","meaning":"thành phố","example":"我喜欢这个城市。","examplePinyin":"wǒ xǐhuān zhège chéngshì.","translation":"Tôi thích thành phố này."},{"id":"hsk3-L11-23","hanzi":"离开","pinyin":"líkāi","meaning":"rời khỏi","example":"他明天离开北京。","examplePinyin":"tā míngtiān líkāi Běijīng.","translation":"Ngày mai anh ấy rời Bắc Kinh."},{"id":"hsk3-L11-24","hanzi":"机会","pinyin":"jīhuì","meaning":"cơ hội","example":"我想要一个学习的机会。","examplePinyin":"wǒ xiǎng yào yí ge xuéxí de jīhuì.","translation":"Tôi muốn có một cơ hội học tập."},{"id":"hsk3-L11-25","hanzi":"生活","pinyin":"shēnghuó","meaning":"cuộc sống; sinh sống","example":"这里的生活很方便。","examplePinyin":"zhèlǐ de shēnghuó hěn fāngbiàn.","translation":"Cuộc sống ở đây rất thuận tiện."},{"id":"hsk3-L11-26","hanzi":"为","pinyin":"wèi","meaning":"vì, cho, thay cho","example":"我为你感到开心。","examplePinyin":"wǒ wèi nǐ gǎndào kāixīn.","translation":"Tôi cảm thấy vui cho bạn."},{"id":"hsk3-L11-27","hanzi":"或","pinyin":"huò","meaning":"hoặc","example":"你可以喝茶或咖啡。","examplePinyin":"nǐ kěyǐ hē chá huò kā fēi.","translation":"Bạn có thể uống trà hoặc cà phê."}],"grammar":[{"name":"Phân biệt 还是 và 或者","details":["Cấu trúc: A 还是 B? (Câu hỏi) / A 或者 B (Câu trần thuật)","Giải thích: Cả 「还是」 và 「或者」 đều dùng để diễn tả sự lựa chọn. Điểm khác biệt là 「还是」 thường dùng trong câu nghi vấn để đặt câu hỏi lựa chọn, trong khi 「或者」 dùng trong câu trần thuật để liệt kê các phương án.","Mẹo: Hãy nhớ quy tắc đơn giản: thấy dấu chấm hỏi thì chọn 「还是」, câu kể bình thường thì chọn 「或者」.","Lưu ý: Không dùng 「还是」 trong câu trần thuật vì nó sẽ làm câu trở thành dạng câu hỏi, gây khó hiểu cho người nghe.","•  我们用会议室的电脑还是自己的笔记本电脑？","wǒ men yòng huì yì shì de diàn nǎo hái shì zì jǐ de bǐ jì běn diàn nǎo","Chúng ta dùng máy tính của phòng họp hay máy tính xách tay của mình?","•  会议室的电脑或者自己的电脑都可以。","huì yì shì de diàn nǎo huò zhě zì jǐ de diàn nǎo dōu kě yǐ","Máy tính của phòng họp hay máy tính của mình đều được.","Ví dụ: 我们用会议室的电脑还是自己的笔记本电脑？","Ví dụ: 会议室的电脑或者自己的电脑都可以。"]},{"name":"Cụm từ chỉ nhận định \"看来\"","details":["Cấu trúc: 看来 + [Câu/Mệnh đề]","Giải thích: Cụm từ 「看来」 thường được đặt ở đầu câu để đưa ra nhận định hoặc suy đoán dựa trên tình hình thực tế. Trong tiếng Việt, nó tương ứng với nghĩa \"xem ra\" hoặc \"có vẻ như\".","Mẹo: Bạn có thể dùng 「看来」 khi muốn đưa ra ý kiến cá nhân sau khi quan sát một sự việc nào đó.","Lưu ý: 「看来」 thường diễn đạt suy đoán chủ quan, không nên dùng khi bạn muốn khẳng định một sự thật hiển nhiên.","•  看来我没办法解决这个问题。","kàn lái wǒ méi bàn fǎ jiě jué zhè gè wèn tí","Xem ra tôi không có cách nào giải quyết vấn đề này.","•  电梯坏了，看来咱们只能走下去了。","diàn tī huài le kàn lái zán men zhǐ néng zǒu xià qù le","Thang máy hỏng rồi, xem ra chúng ta chỉ có thể đi bộ xuống thôi.","Ví dụ: 看来我没办法解决这个问题。","Ví dụ: 电梯坏了，看来咱们只能走下去了。"]},{"name":"Câu chữ 把 với 在/给/到 chỉ nơi chốn, đối tượng","details":["Cấu trúc: Chủ ngữ (S) + 把 + Tân ngữ (O) + Động từ + Thành phần khác","Giải thích: Câu chữ 「把」 dùng để nhấn mạnh sự tác động của chủ ngữ lên tân ngữ, khiến tân ngữ thay đổi vị trí hoặc trạng thái. Cấu trúc này thường đi kèm với các thành phần bổ sung sau động từ như bổ ngữ kết quả hoặc trợ từ 「了」.","Mẹo: Luôn đảm bảo động từ trong câu 「把」 có đi kèm các thành phần khác (bổ ngữ, 「了」, v.v.), không dùng động từ đứng một mình.","Lưu ý: Tân ngữ sau 「把」 phải là đối tượng xác định, đã được nhắc đến hoặc cụ thể hóa.","•  你明天再把书还给我。","nǐ míng tiān zài bǎ shū huán gěi wǒ","Ngày mai bạn hãy trả sách cho tôi nhé.","•  老师，我把作业本放在您办公室了。","lǎo shī wǒ bǎ zuò yè běn fàng zài nín bàn gōng shì le","Thưa thầy, em để vở bài tập ở văn phòng thầy rồi ạ.","Ví dụ: 你明天再把书还给我。","Ví dụ: 老师，我把作业本放在您办公室了。"]},{"name":"Cấu trúc Đối với... mà nói","details":["Cấu trúc: 对 + [đối tượng] + 来说，+ [nhận xét/đánh giá]","Giải thích: Cấu trúc này dùng để xác định phạm vi hoặc góc nhìn của một người. Nó giúp bạn nêu lên quan điểm hoặc tiêu chuẩn đánh giá của một đối tượng cụ thể nào đó.","Mẹo: Bạn có thể sử dụng 「对我来说」 để nói về quan điểm cá nhân của chính mình, ví dụ: 「对我来说，学汉语很有意思。」","Lưu ý: Cấu trúc này luôn bắt đầu bằng 「对」 và kết thúc cụm từ bằng 「来说」, không được bỏ sót một trong hai từ này.","•  对我来说，生活也很重要，我不愿意为工作或学习离开家人。","duì wǒ lái shuō shēng huó yě hěn zhòng yào wǒ bù yuàn yì wèi gōng zuò huò xué xí lí kāi jiā rén","Đối với tôi, cuộc sống cũng rất quan trọng, tôi không muốn rời xa gia đình vì công việc hay học tập.","•  对她来说，学习汉语很有意思。","duì tā lái shuō xué xí hàn yǔ hěn yǒu yì sī","Đối với cô ấy, học tiếng Trung rất thú vị.","Ví dụ: 对我来说，生活也很重要，我不愿意为工作或学习离开家人。","Ví dụ: 对她来说，学习汉语很有意思。"]}],"extended":[],"structuredGrammar":[{"name":"Phân biệt 还是 và 或者","formula":"A 还是 B? (Câu hỏi) / A 或者 B (Câu trần thuật)","explanation":"Cả 「还是」 và 「或者」 đều dùng để diễn tả sự lựa chọn. Điểm khác biệt là 「还是」 thường dùng trong câu nghi vấn để đặt câu hỏi lựa chọn, trong khi 「或者」 dùng trong câu trần thuật để liệt kê các phương án.","tip":"Hãy nhớ quy tắc đơn giản: thấy dấu chấm hỏi thì chọn 「还是」, câu kể bình thường thì chọn 「或者」.","note":"Không dùng 「还是」 trong câu trần thuật vì nó sẽ làm câu trở thành dạng câu hỏi, gây khó hiểu cho người nghe.","examples":[{"zh":"我们用会议室的电脑还是自己的笔记本电脑？","pinyin":"wǒ men yòng huì yì shì de diàn nǎo hái shì zì jǐ de bǐ jì běn diàn nǎo","vi":"Chúng ta dùng máy tính của phòng họp hay máy tính xách tay của mình?"},{"zh":"会议室的电脑或者自己的电脑都可以。","pinyin":"huì yì shì de diàn nǎo huò zhě zì jǐ de diàn nǎo dōu kě yǐ","vi":"Máy tính của phòng họp hay máy tính của mình đều được."}],"newExamples":[]},{"name":"Cụm từ chỉ nhận định \"看来\"","formula":"看来 + [Câu/Mệnh đề]","explanation":"Cụm từ 「看来」 thường được đặt ở đầu câu để đưa ra nhận định hoặc suy đoán dựa trên tình hình thực tế. Trong tiếng Việt, nó tương ứng với nghĩa \"xem ra\" hoặc \"có vẻ như\".","tip":"Bạn có thể dùng 「看来」 khi muốn đưa ra ý kiến cá nhân sau khi quan sát một sự việc nào đó.","note":"「看来」 thường diễn đạt suy đoán chủ quan, không nên dùng khi bạn muốn khẳng định một sự thật hiển nhiên.","examples":[{"zh":"看来我没办法解决这个问题。","pinyin":"kàn lái wǒ méi bàn fǎ jiě jué zhè gè wèn tí","vi":"Xem ra tôi không có cách nào giải quyết vấn đề này."},{"zh":"电梯坏了，看来咱们只能走下去了。","pinyin":"diàn tī huài le kàn lái zán men zhǐ néng zǒu xià qù le","vi":"Thang máy hỏng rồi, xem ra chúng ta chỉ có thể đi bộ xuống thôi."}],"newExamples":[]},{"name":"Câu chữ 把 với 在/给/到 chỉ nơi chốn, đối tượng","formula":"Chủ ngữ (S) + 把 + Tân ngữ (O) + Động từ + Thành phần khác","explanation":"Câu chữ 「把」 dùng để nhấn mạnh sự tác động của chủ ngữ lên tân ngữ, khiến tân ngữ thay đổi vị trí hoặc trạng thái. Cấu trúc này thường đi kèm với các thành phần bổ sung sau động từ như bổ ngữ kết quả hoặc trợ từ 「了」.","tip":"Luôn đảm bảo động từ trong câu 「把」 có đi kèm các thành phần khác (bổ ngữ, 「了」, v.v.), không dùng động từ đứng một mình.","note":"Tân ngữ sau 「把」 phải là đối tượng xác định, đã được nhắc đến hoặc cụ thể hóa.","examples":[{"zh":"你明天再把书还给我。","pinyin":"nǐ míng tiān zài bǎ shū huán gěi wǒ","vi":"Ngày mai bạn hãy trả sách cho tôi nhé."},{"zh":"老师，我把作业本放在您办公室了。","pinyin":"lǎo shī wǒ bǎ zuò yè běn fàng zài nín bàn gōng shì le","vi":"Thưa thầy, em để vở bài tập ở văn phòng thầy rồi ạ."}],"newExamples":[]},{"name":"Cấu trúc Đối với... mà nói","formula":"对 + [đối tượng] + 来说，+ [nhận xét/đánh giá]","explanation":"Cấu trúc này dùng để xác định phạm vi hoặc góc nhìn của một người. Nó giúp bạn nêu lên quan điểm hoặc tiêu chuẩn đánh giá của một đối tượng cụ thể nào đó.","tip":"Bạn có thể sử dụng 「对我来说」 để nói về quan điểm cá nhân của chính mình, ví dụ: 「对我来说，学汉语很有意思。」","note":"Cấu trúc này luôn bắt đầu bằng 「对」 và kết thúc cụm từ bằng 「来说」, không được bỏ sót một trong hai từ này.","examples":[{"zh":"对我来说，生活也很重要，我不愿意为工作或学习离开家人。","pinyin":"duì wǒ lái shuō shēng huó yě hěn zhòng yào wǒ bù yuàn yì wèi gōng zuò huò xué xí lí kāi jiā rén","vi":"Đối với tôi, cuộc sống cũng rất quan trọng, tôi không muốn rời xa gia đình vì công việc hay học tập."},{"zh":"对她来说，学习汉语很有意思。","pinyin":"duì tā lái shuō xué xí hàn yǔ hěn yǒu yì sī","vi":"Đối với cô ấy, học tiếng Trung rất thú vị."}],"newExamples":[]}],"subtitle":"Xem ra tôi không giải quyết được vấn đề này"},{"id":12,"title":"这个季节天气变化很快","words":[{"id":"hsk3-L12-01","hanzi":"街","pinyin":"jiē","meaning":"phố, đường phố","example":"这条街很热闹。","examplePinyin":"zhè tiáo jiē hěnrè nào.","translation":"Con phố này rất nhộn nhịp."},{"id":"hsk3-L12-02","hanzi":"开花","pinyin":"kāihuā","meaning":"nở hoa","example":"春天树上开花了。","examplePinyin":"chūntiān shù shàng kāihuā le.","translation":"Mùa xuân cây đã nở hoa."},{"id":"hsk3-L12-03","hanzi":"公园","pinyin":"gōngyuán","meaning":"công viên","example":"我们去公园散步。","examplePinyin":"wǒmen qù gōngyuán sàn bù.","translation":"Chúng ta đi công viên dạo nhé."},{"id":"hsk3-L12-04","hanzi":"船","pinyin":"chuán","meaning":"thuyền, tàu thủy","example":"河上有一条船。","examplePinyin":"hé shàng yǒu yì tiáo chuán.","translation":"Trên sông có một chiếc thuyền."},{"id":"hsk3-L12-05","hanzi":"工作日","pinyin":"gōngzuòrì","meaning":"ngày làm việc","example":"工作日我每天上班。","examplePinyin":"gōngzuòrì wǒ měitiān shàngbān.","translation":"Vào ngày làm việc tôi đi làm mỗi ngày."},{"id":"hsk3-L12-06","hanzi":"地方","pinyin":"dìfang","meaning":"nơi, địa điểm","example":"这个地方很安静。","examplePinyin":"zhège dìfang hěn ānjìng.","translation":"Nơi này rất yên tĩnh."},{"id":"hsk3-L12-07","hanzi":"刚才","pinyin":"gāngcái","meaning":"vừa nãy","example":"刚才谁给你打电话了？","examplePinyin":"gāngcái shéi gěi nǐ dǎdiànhuà le?","translation":"Vừa nãy ai gọi điện cho bạn?"},{"id":"hsk3-L12-08","hanzi":"刮","pinyin":"guā","meaning":"thổi (gió)","example":"今天刮大风。","examplePinyin":"jīntiān guā dà fēng.","translation":"Hôm nay gió thổi mạnh."},{"id":"hsk3-L12-09","hanzi":"风","pinyin":"fēng","meaning":"gió","example":"外面的风很大。","examplePinyin":"wài miàn de fēng hěndà.","translation":"Gió bên ngoài rất mạnh."},{"id":"hsk3-L12-10","hanzi":"新闻","pinyin":"xīnwén","meaning":"tin tức, thời sự","example":"我每天看新闻。","examplePinyin":"wǒ měitiān kàn xīnwén.","translation":"Tôi xem tin tức mỗi ngày."},{"id":"hsk3-L12-11","hanzi":"伞","pinyin":"sǎn","meaning":"ô, dù","example":"出门要带伞。","examplePinyin":"chū mén yào dài sǎn.","translation":"Ra ngoài cần mang ô."},{"id":"hsk3-L12-12","hanzi":"借","pinyin":"jiè","meaning":"mượn, cho mượn","example":"我想借你的书。","examplePinyin":"wǒ xiǎng jiè nǐ de shū.","translation":"Tôi muốn mượn sách của bạn."},{"id":"hsk3-L12-13","hanzi":"把","pinyin":"bǎ","meaning":"cái, chiếc (lượng từ đồ có cán)","example":"我买了一把伞。","examplePinyin":"wǒ mǎi le yī bǎ sǎn.","translation":"Tôi mua một chiếc ô."},{"id":"hsk3-L12-14","hanzi":"雨衣","pinyin":"yǔyī","meaning":"áo mưa","example":"下雨了，请穿雨衣。","examplePinyin":"xià yǔ le, qǐng chuān yǔyī.","translation":"Trời mưa rồi, hãy mặc áo mưa."},{"id":"hsk3-L12-15","hanzi":"变","pinyin":"biàn","meaning":"thay đổi, trở nên","example":"天气变冷了。","examplePinyin":"tiān qì biàn lěng le.","translation":"Thời tiết trở lạnh rồi."},{"id":"hsk3-L12-16","hanzi":"季节","pinyin":"jìjié","meaning":"mùa (trong năm)","example":"我喜欢这个季节。","examplePinyin":"wǒ xǐhuān zhège jìjié.","translation":"Tôi thích mùa này."},{"id":"hsk3-L12-17","hanzi":"变化","pinyin":"biànhuà","meaning":"sự thay đổi; thay đổi","example":"这里的变化很大。","examplePinyin":"zhèlǐ de biànhuà hěndà.","translation":"Nơi này thay đổi rất nhiều."},{"id":"hsk3-L12-18","hanzi":"冬天","pinyin":"dōngtiān","meaning":"mùa đông","example":"冬天北京很冷。","examplePinyin":"dōngtiān Běijīng hěnlěng.","translation":"Mùa đông ở Bắc Kinh rất lạnh."},{"id":"hsk3-L12-19","hanzi":"常常","pinyin":"chángcháng","meaning":"thường xuyên","example":"他常常去公园。","examplePinyin":"tā chángcháng qù gōngyuán.","translation":"Anh ấy thường đi công viên."},{"id":"hsk3-L12-20","hanzi":"关注","pinyin":"guānzhù","meaning":"quan tâm, theo dõi","example":"我每天关注天气变化。","examplePinyin":"wǒ měitiān guānzhù tiānqìbiànhuà.","translation":"Tôi theo dõi thay đổi thời tiết mỗi ngày."},{"id":"hsk3-L12-21","hanzi":"四季","pinyin":"sìjì","meaning":"bốn mùa","example":"这里的四季很漂亮。","examplePinyin":"zhèlǐ de sìjì hěn piàoliang.","translation":"Bốn mùa ở đây đều đẹp."},{"id":"hsk3-L12-22","hanzi":"春天","pinyin":"chūntiān","meaning":"mùa xuân","example":"春天来了，天气暖和了。","examplePinyin":"chūntiān lái le, tiān qì nuǎn hé le.","translation":"Mùa xuân đến rồi, thời tiết đã ấm lên."},{"id":"hsk3-L12-23","hanzi":"夏天","pinyin":"xiàtiān","meaning":"mùa hè","example":"夏天我喜欢游泳。","examplePinyin":"xiàtiān wǒ xǐhuān yóu yǒng.","translation":"Mùa hè tôi thích bơi."},{"id":"hsk3-L12-24","hanzi":"凉快","pinyin":"liángkuài","meaning":"mát mẻ","example":"秋天的天气很凉快。","examplePinyin":"qiūtiān de tiān qì hěn liángkuài.","translation":"Thời tiết mùa thu rất mát mẻ."},{"id":"hsk3-L12-25","hanzi":"秋天","pinyin":"qiūtiān","meaning":"mùa thu","example":"我最喜欢秋天。","examplePinyin":"wǒ zuì xǐhuān qiūtiān.","translation":"Tôi thích mùa thu nhất."},{"id":"hsk3-L12-26","hanzi":"叶子","pinyin":"yèzǐ","meaning":"lá cây","example":"秋天树上的叶子变黄了。","examplePinyin":"qiūtiān shù shàng de yèzǐ biàn huáng le.","translation":"Mùa thu lá trên cây chuyển vàng."},{"id":"hsk3-L12-27","hanzi":"变成","pinyin":"biànchéng","meaning":"biến thành, trở thành","example":"水变成冰了。","examplePinyin":"shuǐ biànchéng bīng le.","translation":"Nước đã biến thành đá."}],"grammar":[{"name":"Cấu trúc câu phức lựa chọn 「或者」","details":["Cấu trúc: 或者 A，或者 B (Diễn tả sự lựa chọn)","Giải thích: Cấu trúc 「或者……，或者……」 được dùng trong câu trần thuật để liệt kê hai hoặc nhiều khả năng khác nhau. Nó mang ý nghĩa tương đương với \"hoặc là... hoặc là...\" trong tiếng Việt.","Mẹo: Hãy nhớ rằng 「或者」 chỉ dùng trong câu trần thuật, không dùng trong câu hỏi.","Lưu ý: Đừng nhầm lẫn với 「还是」, vì 「还是」 thường được dùng để đặt câu hỏi lựa chọn.","•  或者明天去，或者后天去，我给你打电话。","huò zhě míng tiān qù huò zhě hòu tiān qù wǒ gěi nǐ dǎ diàn huà","Hoặc là mai đi, hoặc là ngày kia đi, tôi sẽ gọi điện cho bạn.","•  晚饭你自己选，或者吃中国菜，或者吃日本菜。","wǎn fàn nǐ zì jǐ xuǎn huò zhě chī zhōng guó cài huò zhě chī rì běn cài","Bữa tối bạn tự chọn đi, hoặc là ăn món Trung Quốc, hoặc là ăn món Nhật.","Ví dụ: 或者明天去，或者后天去，我给你打电话。","Ví dụ: 晚饭你自己选，或者吃中国菜，或者吃日本菜。"]},{"name":"Bổ ngữ xu hướng 起来 (Bắt đầu hành động)","details":["Cấu trúc: Động từ/Tính từ + 起来","Giải thích: Bổ ngữ xu hướng 「起来」 được dùng để diễn tả một hành động bắt đầu xảy ra hoặc một trạng thái bắt đầu thay đổi. Ví dụ, khi nói 「下起雨来了」(Trời bắt đầu đổ mưa), hành động mưa đã chính thức bắt đầu.","Mẹo: Hãy chú ý cấu trúc này thường đi kèm với trợ từ 「了」 ở cuối câu để nhấn mạnh sự thay đổi trạng thái.","Lưu ý: Đừng nhầm lẫn với nghĩa chỉ hướng đi lên (như 「站起来」 - đứng lên), hãy dựa vào ngữ cảnh để xác định nghĩa là bắt đầu hành động.","•  雨已经下起来了。","yǔ yǐ jīng xià qǐ lái le","Mưa đã bắt đầu rơi rồi.","•  最近天气热起来了。","zuì jìn tiān qì rè qǐ lái le","Dạo này thời tiết đã nóng lên rồi.","Ví dụ: 雨已经下起来了。","Ví dụ: 最近天气热起来了。"]},{"name":"Phó từ phạm vi 就","details":["Cấu trúc: Chủ ngữ + 就 + Động từ/Danh từ","Giải thích: Phó từ 「就」 được dùng để nhấn mạnh phạm vi giới hạn, mang nghĩa là 'chỉ' hoặc 'đúng là'. Nó thường đứng trước động từ để biểu thị sự ít ỏi của số lượng hoặc nhấn mạnh vào một đối tượng duy nhất.","Mẹo: Bạn có thể hiểu 「就」 trong trường hợp này tương đương với 「只」 (chỉ) để diễn đạt sự hạn chế về số lượng.","Lưu ý: Cần chú ý phân biệt với các nghĩa khác của 「就」 như diễn tả thời gian sớm hoặc hành động sắp xảy ra để tránh nhầm lẫn.","•  北京常常下雪，但听说今年就下了一次。","běi jīng cháng cháng xià xuě dàn tīng shuō jīn nián jiù xià le yī cì","Bắc Kinh thường xuyên có tuyết, nhưng nghe nói năm nay chỉ có tuyết rơi một lần.","•  我每天书包里都放着雨伞，就今天没带。","wǒ měi tiān shū bāo lǐ dōu fàng zhe yǔ sǎn jiù jīn tiān méi dài","Ngày nào tôi cũng để ô trong cặp, chỉ có hôm nay là không mang.","Ví dụ: 北京常常下雪，但听说今年就下了一次。","Ví dụ: 我每天书包里都放着雨伞，就今天没带。"]},{"name":"Bổ ngữ xu hướng 「下来」 diễn tả sự duy trì","details":["Cấu trúc: Động từ + 下来","Giải thích: Cấu trúc này dùng để diễn tả một hành động đã hoàn thành và kết quả của nó được duy trì bền vững theo thời gian. Nó cũng có thể biểu thị sự chuyển đổi từ trạng thái đang hoạt động sang trạng thái tĩnh lặng hoặc ổn định.","Mẹo: Hãy liên tưởng 「下来」 như việc đặt một vật gì đó xuống mặt đất để nó cố định tại chỗ, giúp bạn dễ nhớ cách dùng duy trì trạng thái.","Lưu ý: Cần phân biệt với 「下来」 mang nghĩa hướng chuyển động từ trên cao xuống thấp; trong trường hợp này, nó nhấn mạnh vào tính chất 'kết quả' hơn là 'phương hướng'.","•  这一年多住下来，我还是更喜欢北京的四季。","zhè yī nián duō zhù xià lái wǒ hái shì gèng xǐ huān běi jīng de sì jì","Sau hơn một năm sống ở đây, tôi vẫn yêu thích bốn mùa của Bắc Kinh hơn.","•  这本书对我来说很难，我用了一个月终于读下来了。","zhè běn shū duì wǒ lái shuō hěn nán wǒ yòng le yī gè yuè zhōng yú dú xià lái le","Quyển sách này đối với tôi rất khó, tôi dùng một tháng cuối cùng cũng đọc xong rồi.","Ví dụ: 这一年多住下来，我还是更喜欢北京的四季。","Ví dụ: 这本书对我来说很难，我用了一个月终于读下来了。"]}],"extended":[],"structuredGrammar":[{"name":"Cấu trúc câu phức lựa chọn 「或者」","formula":"或者 A，或者 B (Diễn tả sự lựa chọn)","explanation":"Cấu trúc 「或者……，或者……」 được dùng trong câu trần thuật để liệt kê hai hoặc nhiều khả năng khác nhau. Nó mang ý nghĩa tương đương với \"hoặc là... hoặc là...\" trong tiếng Việt.","tip":"Hãy nhớ rằng 「或者」 chỉ dùng trong câu trần thuật, không dùng trong câu hỏi.","note":"Đừng nhầm lẫn với 「还是」, vì 「还是」 thường được dùng để đặt câu hỏi lựa chọn.","examples":[{"zh":"或者明天去，或者后天去，我给你打电话。","pinyin":"huò zhě míng tiān qù huò zhě hòu tiān qù wǒ gěi nǐ dǎ diàn huà","vi":"Hoặc là mai đi, hoặc là ngày kia đi, tôi sẽ gọi điện cho bạn."},{"zh":"晚饭你自己选，或者吃中国菜，或者吃日本菜。","pinyin":"wǎn fàn nǐ zì jǐ xuǎn huò zhě chī zhōng guó cài huò zhě chī rì běn cài","vi":"Bữa tối bạn tự chọn đi, hoặc là ăn món Trung Quốc, hoặc là ăn món Nhật."}],"newExamples":[]},{"name":"Bổ ngữ xu hướng 起来 (Bắt đầu hành động)","formula":"Động từ/Tính từ + 起来","explanation":"Bổ ngữ xu hướng 「起来」 được dùng để diễn tả một hành động bắt đầu xảy ra hoặc một trạng thái bắt đầu thay đổi. Ví dụ, khi nói 「下起雨来了」(Trời bắt đầu đổ mưa), hành động mưa đã chính thức bắt đầu.","tip":"Hãy chú ý cấu trúc này thường đi kèm với trợ từ 「了」 ở cuối câu để nhấn mạnh sự thay đổi trạng thái.","note":"Đừng nhầm lẫn với nghĩa chỉ hướng đi lên (như 「站起来」 - đứng lên), hãy dựa vào ngữ cảnh để xác định nghĩa là bắt đầu hành động.","examples":[{"zh":"雨已经下起来了。","pinyin":"yǔ yǐ jīng xià qǐ lái le","vi":"Mưa đã bắt đầu rơi rồi."},{"zh":"最近天气热起来了。","pinyin":"zuì jìn tiān qì rè qǐ lái le","vi":"Dạo này thời tiết đã nóng lên rồi."}],"newExamples":[]},{"name":"Phó từ phạm vi 就","formula":"Chủ ngữ + 就 + Động từ/Danh từ","explanation":"Phó từ 「就」 được dùng để nhấn mạnh phạm vi giới hạn, mang nghĩa là 'chỉ' hoặc 'đúng là'. Nó thường đứng trước động từ để biểu thị sự ít ỏi của số lượng hoặc nhấn mạnh vào một đối tượng duy nhất.","tip":"Bạn có thể hiểu 「就」 trong trường hợp này tương đương với 「只」 (chỉ) để diễn đạt sự hạn chế về số lượng.","note":"Cần chú ý phân biệt với các nghĩa khác của 「就」 như diễn tả thời gian sớm hoặc hành động sắp xảy ra để tránh nhầm lẫn.","examples":[{"zh":"北京常常下雪，但听说今年就下了一次。","pinyin":"běi jīng cháng cháng xià xuě dàn tīng shuō jīn nián jiù xià le yī cì","vi":"Bắc Kinh thường xuyên có tuyết, nhưng nghe nói năm nay chỉ có tuyết rơi một lần."},{"zh":"我每天书包里都放着雨伞，就今天没带。","pinyin":"wǒ měi tiān shū bāo lǐ dōu fàng zhe yǔ sǎn jiù jīn tiān méi dài","vi":"Ngày nào tôi cũng để ô trong cặp, chỉ có hôm nay là không mang."}],"newExamples":[]},{"name":"Bổ ngữ xu hướng 「下来」 diễn tả sự duy trì","formula":"Động từ + 下来","explanation":"Cấu trúc này dùng để diễn tả một hành động đã hoàn thành và kết quả của nó được duy trì bền vững theo thời gian. Nó cũng có thể biểu thị sự chuyển đổi từ trạng thái đang hoạt động sang trạng thái tĩnh lặng hoặc ổn định.","tip":"Hãy liên tưởng 「下来」 như việc đặt một vật gì đó xuống mặt đất để nó cố định tại chỗ, giúp bạn dễ nhớ cách dùng duy trì trạng thái.","note":"Cần phân biệt với 「下来」 mang nghĩa hướng chuyển động từ trên cao xuống thấp; trong trường hợp này, nó nhấn mạnh vào tính chất 'kết quả' hơn là 'phương hướng'.","examples":[{"zh":"这一年多住下来，我还是更喜欢北京的四季。","pinyin":"zhè yī nián duō zhù xià lái wǒ hái shì gèng xǐ huān běi jīng de sì jì","vi":"Sau hơn một năm sống ở đây, tôi vẫn yêu thích bốn mùa của Bắc Kinh hơn."},{"zh":"这本书对我来说很难，我用了一个月终于读下来了。","pinyin":"zhè běn shū duì wǒ lái shuō hěn nán wǒ yòng le yī gè yuè zhōng yú dú xià lái le","vi":"Quyển sách này đối với tôi rất khó, tôi dùng một tháng cuối cùng cũng đọc xong rồi."}],"newExamples":[]}],"subtitle":"Thời tiết mùa này thay đổi rất nhanh"},{"id":13,"title":"我的新邻居来自英国","words":[{"id":"hsk3-L13-01","hanzi":"请客","pinyin":"qǐngkè","meaning":"mời khách, đãi khách","example":"今天我请客，你不用付钱。","examplePinyin":"jīntiān wǒ qǐngkè, nǐ búyòng fù qián.","translation":"Hôm nay tôi đãi, bạn không cần trả tiền."},{"id":"hsk3-L13-02","hanzi":"南方","pinyin":"nánfāng","meaning":"phía nam, miền nam","example":"中国南方的冬天不太冷。","examplePinyin":"Zhōngguó nánfāng de dōngtiān bú tài lěng.","translation":"Mùa đông miền nam Trung Quốc không quá lạnh."},{"id":"hsk3-L13-03","hanzi":"北方","pinyin":"běifāng","meaning":"phía bắc, miền bắc","example":"我的朋友来自北方。","examplePinyin":"wǒ de péngyou láizì běifāng.","translation":"Bạn của tôi đến từ miền bắc."},{"id":"hsk3-L13-04","hanzi":"做法","pinyin":"zuòfǎ","meaning":"cách làm, phương pháp thực hiện","example":"这个菜的做法很简单。","examplePinyin":"zhège cài de zuòfǎ hěn jiǎndān.","translation":"Cách làm món ăn này rất đơn giản."},{"id":"hsk3-L13-05","hanzi":"不同","pinyin":"bùtóng","meaning":"khác nhau","example":"我们的想法不同。","examplePinyin":"wǒmen de xiǎng fǎ bùtóng.","translation":"Suy nghĩ của chúng tôi khác nhau."},{"id":"hsk3-L13-06","hanzi":"加","pinyin":"jiā","meaning":"thêm, cộng","example":"请给我加一点儿水。","examplePinyin":"qǐng gěi wǒ jiā yìdiǎnr shuǐ.","translation":"Hãy thêm cho tôi một chút nước."},{"id":"hsk3-L13-07","hanzi":"的话","pinyin":"dehuà","meaning":"nếu (trong mệnh đề điều kiện)","example":"你有时间的话，就来我家。","examplePinyin":"nǐ yǒu shí jiān dehuà, jiù lái wǒ jiā.","translation":"Nếu bạn có thời gian thì đến nhà tôi nhé."},{"id":"hsk3-L13-08","hanzi":"做客","pinyin":"zuòkè","meaning":"đến chơi nhà, làm khách","example":"周末你来我家做客吧。","examplePinyin":"zhōumò nǐ lái wǒ jiā zuòkè ba.","translation":"Cuối tuần bạn đến nhà tôi chơi nhé."},{"id":"hsk3-L13-09","hanzi":"邻居","pinyin":"línjū","meaning":"hàng xóm","example":"我的邻居很热情。","examplePinyin":"wǒ de línjū hěnrè qíng.","translation":"Hàng xóm của tôi rất nhiệt tình."},{"id":"hsk3-L13-10","hanzi":"放心","pinyin":"fàngxīn","meaning":"yên tâm","example":"你放心，我会帮助你。","examplePinyin":"nǐ fàngxīn, wǒ huì bāngzhù nǐ.","translation":"Bạn yên tâm, tôi sẽ giúp bạn."},{"id":"hsk3-L13-11","hanzi":"酒","pinyin":"jiǔ","meaning":"rượu","example":"爸爸今天不喝酒。","examplePinyin":"bàba jīntiān bù hē jiǔ.","translation":"Hôm nay bố không uống rượu."},{"id":"hsk3-L13-12","hanzi":"放","pinyin":"fàng","meaning":"đặt, để, bỏ vào","example":"请把书放在桌子上。","examplePinyin":"qǐng bǎ shū fàng zài zhuō zǐ shàng.","translation":"Hãy đặt sách lên bàn."},{"id":"hsk3-L13-13","hanzi":"客人","pinyin":"kèrén","meaning":"khách","example":"今天家里来了很多客人。","examplePinyin":"jīntiān jiā lǐ lái le hěnduō kèrén.","translation":"Hôm nay nhà tôi có nhiều khách đến."},{"id":"hsk3-L13-14","hanzi":"晚会","pinyin":"wǎnhuì","meaning":"buổi liên hoan, dạ hội","example":"我们晚上参加晚会。","examplePinyin":"wǒmen wǎnshang cānjiā wǎnhuì.","translation":"Buổi tối chúng tôi tham gia liên hoan."},{"id":"hsk3-L13-15","hanzi":"礼物","pinyin":"lǐwù","meaning":"quà tặng","example":"这是送给你的礼物。","examplePinyin":"zhè shì sòng gěi nǐ de lǐwù.","translation":"Đây là món quà tặng bạn."},{"id":"hsk3-L13-16","hanzi":"画家","pinyin":"huàjiā","meaning":"họa sĩ","example":"他是一位有名的画家。","examplePinyin":"tā shì yì wèi yǒumíng de huàjiā.","translation":"Ông ấy là một họa sĩ nổi tiếng."},{"id":"hsk3-L13-17","hanzi":"盘子","pinyin":"pánzi","meaning":"cái đĩa","example":"桌子上有三个盘子。","examplePinyin":"zhuō zǐ shàng yǒu sāngè pánzi.","translation":"Trên bàn có ba cái đĩa."},{"id":"hsk3-L13-18","hanzi":"一边","pinyin":"yìbiān","meaning":"vừa... vừa... (trong 一边...一边...)","example":"我一边吃饭一边看书。","examplePinyin":"wǒ yìbiān chīfàn yìbiān kànshū.","translation":"Tôi vừa ăn cơm vừa đọc sách."},{"id":"hsk3-L13-19","hanzi":"聊天儿","pinyin":"liáotiānr","meaning":"trò chuyện, tán gẫu","example":"我们坐在一起聊天儿。","examplePinyin":"wǒmen zuò zài yìqǐ liáotiānr.","translation":"Chúng tôi ngồi cùng nhau trò chuyện."},{"id":"hsk3-L13-20","hanzi":"来自","pinyin":"láizì","meaning":"đến từ","example":"我来自越南。","examplePinyin":"wǒ láizì Yuènán.","translation":"Tôi đến từ Việt Nam."},{"id":"hsk3-L13-21","hanzi":"夫妻","pinyin":"fūqī","meaning":"vợ chồng","example":"他们是一对夫妻。","examplePinyin":"tāmen shì yī duì fūqī.","translation":"Họ là một cặp vợ chồng."},{"id":"hsk3-L13-22","hanzi":"直到","pinyin":"zhídào","meaning":"mãi đến, cho đến khi","example":"我一直等到晚上，直到他回来。","examplePinyin":"wǒ yìzhí děng dào wǎnshang, zhídào tā huílái.","translation":"Tôi đợi đến tối, mãi khi anh ấy về."},{"id":"hsk3-L13-23","hanzi":"地图","pinyin":"dìtú","meaning":"bản đồ","example":"我在地图上找到了学校。","examplePinyin":"wǒ zài dìtú shàng zhǎo dào le xuéxiào.","translation":"Tôi đã tìm thấy trường trên bản đồ."},{"id":"hsk3-L13-24","hanzi":"点","pinyin":"diǎn","meaning":"chấm; gọi món; một chút","example":"你想点什么菜？","examplePinyin":"nǐ xiǎng diǎn shénme cài?","translation":"Bạn muốn gọi món gì?"},{"id":"hsk3-L13-25","hanzi":"感到","pinyin":"gǎndào","meaning":"cảm thấy","example":"我感到很开心。","examplePinyin":"wǒ gǎndào hěn kāixīn.","translation":"Tôi cảm thấy rất vui."},{"id":"hsk3-L13-26","hanzi":"东方","pinyin":"dōngfāng","meaning":"phương đông","example":"太阳从东方出来。","examplePinyin":"tàiyáng cóng dōngfāng chūlái.","translation":"Mặt trời mọc từ hướng đông."},{"id":"hsk3-L13-27","hanzi":"文化","pinyin":"wénhuà","meaning":"văn hóa","example":"我想了解中国文化。","examplePinyin":"wǒ xiǎng liǎojiě zhōngguówénhuà.","translation":"Tôi muốn tìm hiểu văn hóa Trung Quốc."}],"grammar":[{"name":"Câu điều kiện giả thiết với ...的话，就 ...","details":["Cấu trúc: (如果) + [Giả thiết] + 的话，(chủ ngữ) + 就 + [Kết quả]","Giải thích: Cấu trúc này dùng để diễn tả một điều kiện giả định và kết quả tất yếu xảy ra. Trong đó, vế đầu là điều kiện giả thiết, vế sau dùng 「就」 để chỉ kết quả đi kèm.","Mẹo: Bạn có thể lược bỏ 「如果」 trong văn nói, nhưng nên giữ lại 「的话」 ở cuối vế giả thiết để câu nghe tự nhiên hơn.","Lưu ý: Trong cấu trúc này, vế sau bắt buộc phải có 「就」 để dẫn ra kết quả, không được bỏ quên.","•  你们有时间的话，就来我家做客。","nǐ men yǒu shí jiān de huà jiù lái wǒ jiā zuò kè","Nếu các bạn có thời gian thì hãy đến nhà tôi chơi nhé.","•  明天天气好的话，我就去爬山。","míng tiān tiān qì hǎo de huà wǒ jiù qù pá shān","Ngày mai nếu thời tiết đẹp thì tôi sẽ đi leo núi.","Ví dụ: 你们有时间的话，就来我家做客。","Ví dụ: 明天天气好的话，我就去爬山。"]},{"name":"Câu chữ 把 với bổ ngữ xu hướng và bổ ngữ trạng thái","details":["Cấu trúc: Chủ ngữ + 把 + Tân ngữ + Động từ + Bổ ngữ (Kết quả/Xu hướng/Mức độ)","Giải thích: Trong câu chữ 「把」, động từ không bao giờ đứng một mình mà phải đi kèm bổ ngữ để chỉ kết quả, xu hướng hoặc mức độ. Cấu trúc này nhấn mạnh việc tân ngữ đã chịu tác động và thay đổi ra sao sau hành động. Bạn cần đặt bổ ngữ ngay sau động từ để hoàn thiện ý nghĩa.","Mẹo: Hãy nhớ rằng bổ ngữ như 「了」, 「下来」, 「好」 hay 「清楚」 thường được thêm vào sau động từ để làm rõ kết quả của hành động đối với tân ngữ.","Lưu ý: Không được để động từ đứng đơn độc mà không có các thành phần bổ sung phía sau trong câu chữ 「把」.","•  你把声音开得太大了。","nǐ bǎ shēng yīn kāi de tài dà le","Bạn mở tiếng to quá rồi đấy.","•  他把球踢进去了吗？","tā bǎ qiú tī jìn qù le ma","Anh ấy có đá bóng vào không?","Ví dụ: 你把声音开得太大了。","Ví dụ: 他把球踢进去了吗？"]},{"name":"Diễn tả hai hành động đồng thời","details":["Cấu trúc: 一边 + V1 + ，一边 + V2","Giải thích: Cấu trúc 「一边……，一边……」 được dùng để diễn tả hai hành động diễn ra cùng một lúc. Bạn có thể dịch là \"vừa... vừa...\" để mô tả việc làm song song hai việc trong cùng một khoảng thời gian.","Mẹo: Chủ ngữ có thể đặt ở trước cấu trúc hoặc giữa hai vế 「一边」 nếu cần nhấn mạnh.","Lưu ý: Cấu trúc này chỉ dùng cho hai hành động diễn ra đồng thời, không dùng để liệt kê tính chất (khi đó hãy dùng 「又...又...」).","•  咱们一边吃蛋糕，一边聊天儿吧。","zán men yī biān chī dàn gāo yī biān liáo tiān ér ba","Chúng mình vừa ăn bánh ngọt vừa trò chuyện đi.","•  我喜欢一边跑步，一边听音乐。","wǒ xǐ huān yī biān pǎo bù yī biān tīng yīn yuè","Tôi thích vừa chạy bộ vừa nghe nhạc.","Ví dụ: 咱们一边吃蛋糕，一边聊天儿吧。","Ví dụ: 我喜欢一边跑步，一边听音乐。"]}],"extended":[],"structuredGrammar":[{"name":"Câu điều kiện giả thiết với ...的话，就 ...","formula":"(如果) + [Giả thiết] + 的话，(chủ ngữ) + 就 + [Kết quả]","explanation":"Cấu trúc này dùng để diễn tả một điều kiện giả định và kết quả tất yếu xảy ra. Trong đó, vế đầu là điều kiện giả thiết, vế sau dùng 「就」 để chỉ kết quả đi kèm.","tip":"Bạn có thể lược bỏ 「如果」 trong văn nói, nhưng nên giữ lại 「的话」 ở cuối vế giả thiết để câu nghe tự nhiên hơn.","note":"Trong cấu trúc này, vế sau bắt buộc phải có 「就」 để dẫn ra kết quả, không được bỏ quên.","examples":[{"zh":"你们有时间的话，就来我家做客。","pinyin":"nǐ men yǒu shí jiān de huà jiù lái wǒ jiā zuò kè","vi":"Nếu các bạn có thời gian thì hãy đến nhà tôi chơi nhé."},{"zh":"明天天气好的话，我就去爬山。","pinyin":"míng tiān tiān qì hǎo de huà wǒ jiù qù pá shān","vi":"Ngày mai nếu thời tiết đẹp thì tôi sẽ đi leo núi."}],"newExamples":[]},{"name":"Câu chữ 把 với bổ ngữ xu hướng và bổ ngữ trạng thái","formula":"Chủ ngữ + 把 + Tân ngữ + Động từ + Bổ ngữ (Kết quả/Xu hướng/Mức độ)","explanation":"Trong câu chữ 「把」, động từ không bao giờ đứng một mình mà phải đi kèm bổ ngữ để chỉ kết quả, xu hướng hoặc mức độ. Cấu trúc này nhấn mạnh việc tân ngữ đã chịu tác động và thay đổi ra sao sau hành động. Bạn cần đặt bổ ngữ ngay sau động từ để hoàn thiện ý nghĩa.","tip":"Hãy nhớ rằng bổ ngữ như 「了」, 「下来」, 「好」 hay 「清楚」 thường được thêm vào sau động từ để làm rõ kết quả của hành động đối với tân ngữ.","note":"Không được để động từ đứng đơn độc mà không có các thành phần bổ sung phía sau trong câu chữ 「把」.","examples":[{"zh":"你把声音开得太大了。","pinyin":"nǐ bǎ shēng yīn kāi de tài dà le","vi":"Bạn mở tiếng to quá rồi đấy."},{"zh":"他把球踢进去了吗？","pinyin":"tā bǎ qiú tī jìn qù le ma","vi":"Anh ấy có đá bóng vào không?"}],"newExamples":[]},{"name":"Diễn tả hai hành động đồng thời","formula":"一边 + V1 + ，一边 + V2","explanation":"Cấu trúc 「一边……，一边……」 được dùng để diễn tả hai hành động diễn ra cùng một lúc. Bạn có thể dịch là \"vừa... vừa...\" để mô tả việc làm song song hai việc trong cùng một khoảng thời gian.","tip":"Chủ ngữ có thể đặt ở trước cấu trúc hoặc giữa hai vế 「一边」 nếu cần nhấn mạnh.","note":"Cấu trúc này chỉ dùng cho hai hành động diễn ra đồng thời, không dùng để liệt kê tính chất (khi đó hãy dùng 「又...又...」).","examples":[{"zh":"咱们一边吃蛋糕，一边聊天儿吧。","pinyin":"zán men yī biān chī dàn gāo yī biān liáo tiān ér ba","vi":"Chúng mình vừa ăn bánh ngọt vừa trò chuyện đi."},{"zh":"我喜欢一边跑步，一边听音乐。","pinyin":"wǒ xǐ huān yī biān pǎo bù yī biān tīng yīn yuè","vi":"Tôi thích vừa chạy bộ vừa nghe nhạc."}],"newExamples":[]}],"subtitle":"Hàng xóm mới của tôi đến từ Anh"},{"id":14,"title":"这本书被别人借走了","words":[{"id":"hsk3-L14-01","hanzi":"词典","pinyin":"cídiǎn","meaning":"từ điển","example":"我用词典查汉字。","examplePinyin":"wǒ yòng cídiǎn chá hànzì.","translation":"Tôi dùng từ điển tra chữ Hán."},{"id":"hsk3-L14-02","hanzi":"最好","pinyin":"zuìhǎo","meaning":"tốt nhất, nên","example":"你最好早点儿休息。","examplePinyin":"nǐ zuìhǎo zǎo diǎn ér xiūxī.","translation":"Bạn nên nghỉ ngơi sớm một chút."},{"id":"hsk3-L14-03","hanzi":"节","pinyin":"jié","meaning":"tiết học; đơn vị chỉ tiết học","example":"今天有两节汉语课。","examplePinyin":"jīntiān yǒu liǎng jié Hànyǔ kè.","translation":"Hôm nay có hai tiết tiếng Trung."},{"id":"hsk3-L14-04","hanzi":"图书馆","pinyin":"túshūguǎn","meaning":"thư viện","example":"我在图书馆看书。","examplePinyin":"wǒ zài túshūguǎn kànshū.","translation":"Tôi đọc sách ở thư viện."},{"id":"hsk3-L14-05","hanzi":"被","pinyin":"bèi","meaning":"bị, được (câu bị động)","example":"这本书被别人借走了。","examplePinyin":"zhè běn shū bèi biérén jiè zǒu le.","translation":"Quyển sách này bị người khác mượn đi rồi."},{"id":"hsk3-L14-06","hanzi":"名人","pinyin":"míngrén","meaning":"người nổi tiếng, danh nhân","example":"我喜欢看名人的故事。","examplePinyin":"wǒ xǐhuān kàn míngrén de gùshì.","translation":"Tôi thích đọc chuyện về người nổi tiếng."},{"id":"hsk3-L14-07","hanzi":"故事","pinyin":"gùshì","meaning":"câu chuyện","example":"妈妈给我讲了一个故事。","examplePinyin":"māma gěi wǒ jiǎng le yí ge gùshì.","translation":"Mẹ kể cho tôi một câu chuyện."},{"id":"hsk3-L14-08","hanzi":"然后","pinyin":"ránhòu","meaning":"sau đó, rồi","example":"我先吃饭，然后去学校。","examplePinyin":"wǒ xiān chīfàn, ránhòu qù xuéxiào.","translation":"Tôi ăn cơm trước rồi đến trường."},{"id":"hsk3-L14-09","hanzi":"报纸","pinyin":"bàozhǐ","meaning":"báo giấy","example":"爸爸每天看报纸。","examplePinyin":"bàba měitiān kàn bàozhǐ.","translation":"Bố đọc báo mỗi ngày."},{"id":"hsk3-L14-10","hanzi":"忘记","pinyin":"wàngjì","meaning":"quên","example":"我忘记带手机了。","examplePinyin":"wǒ wàngjì dài shǒu jī le.","translation":"Tôi quên mang điện thoại rồi."},{"id":"hsk3-L14-11","hanzi":"电子书","pinyin":"diànzǐshū","meaning":"sách điện tử","example":"我喜欢看电子书。","examplePinyin":"wǒ xǐhuān kàn diànzǐshū.","translation":"Tôi thích đọc sách điện tử."},{"id":"hsk3-L14-12","hanzi":"女生","pinyin":"nǚshēng","meaning":"nữ sinh, học sinh nữ","example":"我们班有十五个女生。","examplePinyin":"wǒmen bān yǒu shí wǔ gè nǚshēng.","translation":"Lớp tôi có mười lăm bạn nữ."},{"id":"hsk3-L14-13","hanzi":"表演","pinyin":"biǎoyǎn","meaning":"biểu diễn, màn biểu diễn","example":"她在晚会上表演唱歌。","examplePinyin":"tā zài wǎnhuì shàng biǎoyǎn chàng gē.","translation":"Cô ấy biểu diễn hát ở buổi liên hoan."},{"id":"hsk3-L14-14","hanzi":"节目","pinyin":"jiémù","meaning":"tiết mục, chương trình","example":"这个节目很有意思。","examplePinyin":"zhège jiémù hěn yǒu yì sī.","translation":"Chương trình này rất thú vị."},{"id":"hsk3-L14-15","hanzi":"怎么办","pinyin":"zěnmebàn","meaning":"phải làm sao, làm thế nào","example":"我的手机不见了，怎么办？","examplePinyin":"wǒ de shǒu jī bùjiàn le, zěnmebàn?","translation":"Điện thoại của tôi mất rồi, phải làm sao đây?"},{"id":"hsk3-L14-16","hanzi":"校长","pinyin":"xiàozhǎng","meaning":"hiệu trưởng","example":"校长今天来我们班。","examplePinyin":"xiàozhǎng jīntiān lái wǒmen bān.","translation":"Hôm nay hiệu trưởng đến lớp tôi."},{"id":"hsk3-L14-17","hanzi":"面前","pinyin":"miànqián","meaning":"phía trước mặt","example":"老师站在学生面前。","examplePinyin":"lǎoshī zhàn zài xuésheng miànqián.","translation":"Giáo viên đứng trước mặt học sinh."},{"id":"hsk3-L14-18","hanzi":"有些","pinyin":"yǒuxiē","meaning":"một số, có vài","example":"有些学生喜欢运动。","examplePinyin":"yǒuxiē xuésheng xǐhuān yùn dòng.","translation":"Có vài học sinh thích thể thao."},{"id":"hsk3-L14-19","hanzi":"相信","pinyin":"xiāngxìn","meaning":"tin tưởng, tin là","example":"我相信你能做好。","examplePinyin":"wǒ xiāngxìn nǐ néng zuò hǎo.","translation":"Tôi tin bạn có thể làm tốt."},{"id":"hsk3-L14-20","hanzi":"新年","pinyin":"xīnnián","meaning":"năm mới","example":"新年我们一起吃饭。","examplePinyin":"xīnnián wǒmen yìqǐ chīfàn.","translation":"Năm mới chúng tôi cùng ăn cơm."},{"id":"hsk3-L14-21","hanzi":"班级","pinyin":"bānjí","meaning":"lớp học, tập thể lớp","example":"我们班级有三十个学生。","examplePinyin":"wǒmen bānjí yǒu sān shí gè xuésheng.","translation":"Lớp chúng tôi có ba mươi học sinh."},{"id":"hsk3-L14-22","hanzi":"跳","pinyin":"tiào","meaning":"nhảy","example":"小孩子喜欢跳。","examplePinyin":"xiǎoháizǐ xǐhuān tiào.","translation":"Trẻ nhỏ thích nhảy."},{"id":"hsk3-L14-23","hanzi":"留学生","pinyin":"liúxuéshēng","meaning":"du học sinh","example":"他是在中国学习的留学生。","examplePinyin":"tā shì zài Zhōngguó xuéxí de liúxuéshēng.","translation":"Anh ấy là du học sinh đang học ở Trung Quốc."},{"id":"hsk3-L14-24","hanzi":"最后","pinyin":"zuìhòu","meaning":"cuối cùng","example":"最后我们决定坐高铁。","examplePinyin":"zuìhòu wǒmen juédìng zuò gāotiě.","translation":"Cuối cùng chúng tôi quyết định đi tàu cao tốc."},{"id":"hsk3-L14-25","hanzi":"一块儿","pinyin":"yíkuàir","meaning":"cùng nhau","example":"周末我们一块儿去公园。","examplePinyin":"zhōumò wǒmen yíkuàir qù gōngyuán.","translation":"Cuối tuần chúng ta cùng đi công viên."},{"id":"hsk3-L14-26","hanzi":"网站","pinyin":"wǎngzhàn","meaning":"trang web, website","example":"这个网站可以学习汉语。","examplePinyin":"zhège wǎngzhàn kěyǐ xuéxí Hànyǔ.","translation":"Trang web này có thể dùng để học tiếng Trung."},{"id":"hsk3-L14-27","hanzi":"视频","pinyin":"shìpín","meaning":"video, đoạn phim","example":"我看了一个汉语视频。","examplePinyin":"wǒ kàn le yí ge Hànyǔ shìpín.","translation":"Tôi đã xem một video tiếng Trung."}],"grammar":[{"name":"Câu bị động với 被","details":["Cấu trúc: Chủ ngữ + 被 + tác nhân + động từ + thành phần khác","Giải thích: Cấu trúc 「被」 được dùng để chỉ chủ ngữ là đối tượng chịu tác động của hành động. Mẫu câu này thường dùng để nhấn mạnh các kết quả không mong muốn hoặc sự việc không may xảy ra với chủ ngữ.","Mẹo: Nếu trong câu không xác định rõ tác nhân gây ra hành động, bạn có thể lược bỏ phần 「tác nhân」 ngay sau 「被」.","Lưu ý: Trong tiếng Trung, câu bị động với 「被」 thường mang sắc thái tiêu cực, không nên dùng cho các sự việc mang tính chất tốt đẹp hay tích cực.","•  这本书被别人借走了。","zhè běn shū bèi bié rén jiè zǒu le","Quyển sách này bị người khác mượn mất rồi.","•  水果可能被弟弟吃了。","shuǐ guǒ kě néng bèi dì dì chī le","Hoa quả có lẽ bị em trai ăn rồi.","Ví dụ: 这本书被别人借走了。","Ví dụ: 水果可能被弟弟吃了。"]},{"name":"Diễn tả thứ tự hành động","details":["Cấu trúc: 先 + [Động từ 1], 再/然后 + [Động từ 2]","Giải thích: Cấu trúc này dùng để liệt kê trình tự thực hiện các hành động theo thời gian. 「先」 có nghĩa là trước tiên, 「再」 hoặc 「然后」 có nghĩa là sau đó hoặc rồi làm gì tiếp theo.","Mẹo: Bạn có thể kết hợp chuỗi hành động dài hơn bằng cách dùng 「先...，再...，然后...」.","Lưu ý: Lưu ý 「再」 chỉ dùng cho hành động chưa xảy ra, không dùng thay thế cho 「又」 khi diễn tả hành động lặp lại đã xảy ra.","•  我要先去图书馆借书，然后去游泳。","wǒ yào xiān qù tú shū guǎn jiè shū rán hòu qù yóu yǒng","Tôi phải đi thư viện mượn sách trước, sau đó mới đi bơi.","•  你先去买门票，再来这里找我。","nǐ xiān qù mǎi mén piào zài lái zhè lǐ zhǎo wǒ","Bạn đi mua vé trước đi, rồi quay lại đây tìm tôi.","Ví dụ: 我要先去图书馆借书，然后去游泳。","Ví dụ: 你先去买门票，再来这里找我。"]},{"name":"Cấu trúc phản bác 「× 什么（啊）」","details":["Cấu trúc: Từ/Cụm từ + 什么 (啊)!","Giải thích: Cấu trúc này được dùng trong khẩu ngữ để phản bác hoặc phủ định một nhận định của người khác. Nó mang sắc thái biểu cảm mạnh, giống như \"... cái gì mà ...\" hay \"... gì chứ!\" trong tiếng Việt để thể hiện thái độ không đồng tình.","Mẹo: Bạn có thể thêm thán từ 「啊」 vào cuối câu để tăng thêm sắc thái biểu cảm cho lời nói.","Lưu ý: Cấu trúc này mang sắc thái suồng sã và đôi khi khá gay gắt, nên chỉ nên dùng với bạn bè thân thiết, tránh dùng trong hoàn cảnh trang trọng.","•  紧什么张啊，我们都喜欢听你唱歌，你要相信自己。","jǐn shén me zhāng a wǒ men dōu xǐ huān tīng nǐ chàng gē nǐ yào xiāng xìn zì jǐ","Căng thẳng cái gì chứ, chúng tôi đều thích nghe bạn hát, bạn phải tin vào bản thân mình.","•  胖什么啊，你一点儿也不瘦。","pàng shén me a nǐ yī diǎn ér yě bù shòu","Béo cái gì mà béo, bạn nhìn xem chẳng gầy chút nào.","Ví dụ: 紧什么张啊，我们都喜欢听你唱歌，你要相信自己。","Ví dụ: 胖什么啊，你一点儿也不瘦。"]}],"extended":[],"structuredGrammar":[{"name":"Câu bị động với 被","formula":"Chủ ngữ + 被 + tác nhân + động từ + thành phần khác","explanation":"Cấu trúc 「被」 được dùng để chỉ chủ ngữ là đối tượng chịu tác động của hành động. Mẫu câu này thường dùng để nhấn mạnh các kết quả không mong muốn hoặc sự việc không may xảy ra với chủ ngữ.","tip":"Nếu trong câu không xác định rõ tác nhân gây ra hành động, bạn có thể lược bỏ phần 「tác nhân」 ngay sau 「被」.","note":"Trong tiếng Trung, câu bị động với 「被」 thường mang sắc thái tiêu cực, không nên dùng cho các sự việc mang tính chất tốt đẹp hay tích cực.","examples":[{"zh":"这本书被别人借走了。","pinyin":"zhè běn shū bèi bié rén jiè zǒu le","vi":"Quyển sách này bị người khác mượn mất rồi."},{"zh":"水果可能被弟弟吃了。","pinyin":"shuǐ guǒ kě néng bèi dì dì chī le","vi":"Hoa quả có lẽ bị em trai ăn rồi."}],"newExamples":[]},{"name":"Diễn tả thứ tự hành động","formula":"先 + [Động từ 1], 再/然后 + [Động từ 2]","explanation":"Cấu trúc này dùng để liệt kê trình tự thực hiện các hành động theo thời gian. 「先」 có nghĩa là trước tiên, 「再」 hoặc 「然后」 có nghĩa là sau đó hoặc rồi làm gì tiếp theo.","tip":"Bạn có thể kết hợp chuỗi hành động dài hơn bằng cách dùng 「先...，再...，然后...」.","note":"Lưu ý 「再」 chỉ dùng cho hành động chưa xảy ra, không dùng thay thế cho 「又」 khi diễn tả hành động lặp lại đã xảy ra.","examples":[{"zh":"我要先去图书馆借书，然后去游泳。","pinyin":"wǒ yào xiān qù tú shū guǎn jiè shū rán hòu qù yóu yǒng","vi":"Tôi phải đi thư viện mượn sách trước, sau đó mới đi bơi."},{"zh":"你先去买门票，再来这里找我。","pinyin":"nǐ xiān qù mǎi mén piào zài lái zhè lǐ zhǎo wǒ","vi":"Bạn đi mua vé trước đi, rồi quay lại đây tìm tôi."}],"newExamples":[]},{"name":"Cấu trúc phản bác 「× 什么（啊）」","formula":"Từ/Cụm từ + 什么 (啊)!","explanation":"Cấu trúc này được dùng trong khẩu ngữ để phản bác hoặc phủ định một nhận định của người khác. Nó mang sắc thái biểu cảm mạnh, giống như \"... cái gì mà ...\" hay \"... gì chứ!\" trong tiếng Việt để thể hiện thái độ không đồng tình.","tip":"Bạn có thể thêm thán từ 「啊」 vào cuối câu để tăng thêm sắc thái biểu cảm cho lời nói.","note":"Cấu trúc này mang sắc thái suồng sã và đôi khi khá gay gắt, nên chỉ nên dùng với bạn bè thân thiết, tránh dùng trong hoàn cảnh trang trọng.","examples":[{"zh":"紧什么张啊，我们都喜欢听你唱歌，你要相信自己。","pinyin":"jǐn shén me zhāng a wǒ men dōu xǐ huān tīng nǐ chàng gē nǐ yào xiāng xìn zì jǐ","vi":"Căng thẳng cái gì chứ, chúng tôi đều thích nghe bạn hát, bạn phải tin vào bản thân mình."},{"zh":"胖什么啊，你一点儿也不瘦。","pinyin":"pàng shén me a nǐ yī diǎn ér yě bù shòu","vi":"Béo cái gì mà béo, bạn nhìn xem chẳng gầy chút nào."}],"newExamples":[]}],"subtitle":"Quyển sách này bị người khác mượn rồi"},{"id":15,"title":"我是半个南京人","words":[{"id":"hsk3-L15-01","hanzi":"蓝","pinyin":"lán","meaning":"xanh da trời","example":"我喜欢蓝色的衣服。","examplePinyin":"wǒ xǐhuān lán sè de yīfú.","translation":"Tôi thích quần áo màu xanh da trời."},{"id":"hsk3-L15-02","hanzi":"段","pinyin":"duàn","meaning":"đoạn (thời gian, đường)","example":"这段路很长。","examplePinyin":"zhè duàn lù hěn cháng.","translation":"Đoạn đường này rất dài."},{"id":"hsk3-L15-03","hanzi":"附近","pinyin":"fùjìn","meaning":"gần đây, vùng lân cận","example":"我家附近有一个公园。","examplePinyin":"wǒ jiā fùjìn yǒu yí ge gōngyuán.","translation":"Gần nhà tôi có một công viên."},{"id":"hsk3-L15-04","hanzi":"马路","pinyin":"mǎlù","meaning":"đường lớn, đường xe chạy","example":"过马路要小心。","examplePinyin":"guò mǎlù yào xiǎoxīn.","translation":"Qua đường phải cẩn thận."},{"id":"hsk3-L15-05","hanzi":"平时","pinyin":"píngshí","meaning":"thường ngày, bình thường","example":"我平时六点起床。","examplePinyin":"wǒ píngshí liùdiǎn qǐ chuáng.","translation":"Ngày thường tôi dậy lúc sáu giờ."},{"id":"hsk3-L15-06","hanzi":"放学","pinyin":"fàngxué","meaning":"tan học","example":"弟弟下午四点放学。","examplePinyin":"dìdi xiàwǔ sì diǎn fàngxué.","translation":"Em trai tan học lúc bốn giờ chiều."},{"id":"hsk3-L15-07","hanzi":"游戏","pinyin":"yóuxì","meaning":"trò chơi","example":"孩子们喜欢玩游戏。","examplePinyin":"háizi men xǐhuān wán yóuxì.","translation":"Bọn trẻ thích chơi trò chơi."},{"id":"hsk3-L15-08","hanzi":"老人","pinyin":"lǎorén","meaning":"người già, người cao tuổi","example":"公园里有很多老人。","examplePinyin":"gōngyuán lǐ yǒu hěnduō lǎorén.","translation":"Trong công viên có rất nhiều người cao tuổi."},{"id":"hsk3-L15-09","hanzi":"根据","pinyin":"gēnjù","meaning":"căn cứ vào, dựa theo","example":"根据天气变化，我们决定明天再去。","examplePinyin":"gēnjù tiānqìbiànhuà, wǒmen juédìng míngtiān zài qù.","translation":"Dựa theo thay đổi thời tiết, chúng tôi quyết định ngày mai mới đi."},{"id":"hsk3-L15-10","hanzi":"了解","pinyin":"liǎojiě","meaning":"tìm hiểu, hiểu rõ","example":"我想了解这个城市。","examplePinyin":"wǒ xiǎng liǎojiě zhège chéngshì.","translation":"Tôi muốn tìm hiểu thành phố này."},{"id":"hsk3-L15-11","hanzi":"可是","pinyin":"kěshì","meaning":"nhưng, thế nhưng","example":"我想去，可是没有时间。","examplePinyin":"wǒ xiǎng qù, kěshì méiyǒu shí jiān.","translation":"Tôi muốn đi nhưng không có thời gian."},{"id":"hsk3-L15-12","hanzi":"以上","pinyin":"yǐshàng","meaning":"trở lên, ở trên","example":"十岁以上的孩子可以参加。","examplePinyin":"shí suì yǐshàng de háizi kěyǐ cānjiā.","translation":"Trẻ từ mười tuổi trở lên có thể tham gia."},{"id":"hsk3-L15-13","hanzi":"有名","pinyin":"yǒumíng","meaning":"nổi tiếng","example":"这个地方很有名。","examplePinyin":"zhège dìfang hěn yǒumíng.","translation":"Nơi này rất nổi tiếng."},{"id":"hsk3-L15-14","hanzi":"景点","pinyin":"jǐngdiǎn","meaning":"điểm tham quan, danh thắng","example":"这个城市有很多景点。","examplePinyin":"zhège chéngshì yǒu hěnduō jǐngdiǎn.","translation":"Thành phố này có nhiều điểm tham quan."},{"id":"hsk3-L15-15","hanzi":"游客","pinyin":"yóukè","meaning":"du khách","example":"这个景点有很多游客。","examplePinyin":"zhège jǐngdiǎn yǒu hěnduō yóukè.","translation":"Điểm tham quan này có nhiều du khách."},{"id":"hsk3-L15-16","hanzi":"外地","pinyin":"wàidì","meaning":"nơi khác, địa phương khác","example":"我的同事来自外地。","examplePinyin":"wǒ de tóngshì láizì wàidì.","translation":"Đồng nghiệp của tôi đến từ nơi khác."},{"id":"hsk3-L15-17","hanzi":"聊","pinyin":"liáo","meaning":"trò chuyện","example":"我们聊了一个小时。","examplePinyin":"wǒmen liáo le yīgèxiǎoshí.","translation":"Chúng tôi trò chuyện suốt một giờ."},{"id":"hsk3-L15-18","hanzi":"河","pinyin":"hé","meaning":"sông","example":"公园旁边有一条河。","examplePinyin":"gōngyuán páng biān yǒu yì tiáo hé.","translation":"Bên cạnh công viên có một con sông."},{"id":"hsk3-L15-19","hanzi":"关系","pinyin":"guānxì","meaning":"mối quan hệ, liên quan","example":"我和邻居的关系很好。","examplePinyin":"wǒ hé línjū de guānxì hěnhǎo.","translation":"Tôi và hàng xóm có mối quan hệ rất tốt."},{"id":"hsk3-L15-20","hanzi":"养","pinyin":"yǎng","meaning":"nuôi, chăm nuôi","example":"我家养了一只猫。","examplePinyin":"wǒ jiā yǎng le yì zhī māo.","translation":"Nhà tôi nuôi một con mèo."},{"id":"hsk3-L15-21","hanzi":"西北","pinyin":"xīběi","meaning":"phía tây bắc","example":"这个城市在中国的西北。","examplePinyin":"zhège chéngshì zài Zhōngguó de xīběi.","translation":"Thành phố này ở phía tây bắc Trung Quốc."},{"id":"hsk3-L15-22","hanzi":"经过","pinyin":"jīngguò","meaning":"đi qua; trải qua","example":"我每天经过这个公园。","examplePinyin":"wǒ měitiān jīngguò zhège gōngyuán.","translation":"Mỗi ngày tôi đều đi qua công viên này."},{"id":"hsk3-L15-23","hanzi":"草地","pinyin":"cǎodì","meaning":"bãi cỏ","example":"孩子们在草地上玩。","examplePinyin":"háizi men zài cǎodì shàng wán.","translation":"Bọn trẻ chơi trên bãi cỏ."},{"id":"hsk3-L15-24","hanzi":"遇见","pinyin":"yùjiàn","meaning":"tình cờ gặp","example":"昨天我在公园遇见了老师。","examplePinyin":"zuótiān wǒ zài gōngyuán yùjiàn le lǎoshī.","translation":"Hôm qua tôi tình cờ gặp giáo viên ở công viên."}],"grammar":[{"name":"Giới từ căn cứ: 根据","details":["Cấu trúc: 根据 + căn cứ/tài liệu + V + thành phần khác","Giải thích: Giới từ 「根据」 được dùng để chỉ cơ sở, căn cứ hoặc nguồn thông tin cho một hành động hay phán đoán. Trong tiếng Việt, cấu trúc này tương ứng với các nghĩa như \"dựa theo\", \"căn cứ vào\" hoặc \"theo như\".","Mẹo: Bạn có thể đặt cụm từ 「根据...」 ở đầu câu để nhấn mạnh nguồn tin hoặc căn cứ trước khi nêu ra hành động chính.","Lưu ý: Cần phân biệt 「根据」 (dựa theo căn cứ) với 「跟」 (đi cùng với/theo sau ai đó), tránh nhầm lẫn về ý nghĩa.","•  这几年小区根据他们的需要，有了很多变化。","zhè jǐ nián xiǎo qū gēn jù tā men de xū yào yǒu le hěn duō biàn huà","Mấy năm nay khu dân cư đã có nhiều thay đổi dựa theo nhu cầu của họ.","•  根据要求，我们必须参加明天的会议。","gēn jù yāo qiú wǒ men bì xū cān jiā míng tiān de huì yì","Theo yêu cầu, chúng tôi phải tham gia cuộc họp ngày mai.","Ví dụ: 这几年小区根据他们的需要，有了很多变化。","Ví dụ: 根据要求，我们必须参加明天的会议。"]},{"name":"Lặp lại cụm số lượng diễn tả sự thay đổi","details":["Cấu trúc: Số từ + Lượng từ + Số từ + Lượng từ (ví dụ: 一点儿一点儿)","Giải thích: Cấu trúc lặp lại này được dùng để mô tả một hành động hoặc sự thay đổi diễn ra từng chút một hoặc từng bước một. Nó giúp nhấn mạnh quá trình tích lũy dần dần của sự việc trong câu.","Mẹo: Bạn có thể dùng cấu trúc này với các cụm như 「一点儿一点儿」 (từng chút một) hoặc 「一步一步」 (từng bước một).","Lưu ý: Lưu ý rằng cấu trúc này không phải là phép nhân số học mà là cách diễn đạt trạng thái tăng dần hoặc chậm rãi.","•  我得一点儿一点儿给你讲。","wǒ děi yī diǎn ér yī diǎn ér gěi nǐ jiǎng","Tôi phải giảng cho bạn từng chút từng chút một.","•  学生们的汉语水平一天一天地提高了。","xué shēng men de hàn yǔ shuǐ píng yī tiān yī tiān de tí gāo le","Trình độ tiếng Trung của học sinh tiến bộ lên từng ngày.","Ví dụ: 我得一点儿一点儿给你讲。","Ví dụ: 学生们的汉语水平一天一天地提高了。"]},{"name":"Cách nêu quan điểm cá nhân","details":["Cấu trúc: 在 + [Người] + 看来 + [Quan điểm]","Giải thích: Cấu trúc này dùng để diễn đạt ý kiến hoặc góc nhìn của một người nào đó về một vấn đề. Trong tiếng Việt, nó tương đương với các cụm từ như \"theo tôi thấy\", \"trong mắt anh ấy\" hay \"đối với cô ấy\".","Mẹo: Bạn có thể thay thế [Người] bằng các đại từ như 「我」(tôi), 「他」(anh ấy) hoặc danh từ chỉ người cụ thể.","Lưu ý: Cụm từ 「看来」 phải luôn đứng sau người có quan điểm, không được đặt ở đầu câu.","•  在我们中国人看来，黄河像妈妈一样，养了我们几千年。","zài wǒ men zhōng guó rén kàn lái huáng hé xiàng mā mā yī yàng yǎng le wǒ men jǐ qiān nián","Trong mắt người Trung Quốc chúng tôi, sông Hoàng Hà giống như người mẹ đã nuôi dưỡng chúng tôi mấy ngàn năm.","•  在我看来，每天读书是一种很好的习惯。","zài wǒ kàn lái měi tiān dú shū shì yī zhǒng hěn hǎo de xí guàn","Theo tôi thấy, đọc sách mỗi ngày là một thói quen rất tốt.","Ví dụ: 在我们中国人看来，黄河像妈妈一样，养了我们几千年。","Ví dụ: 在我看来，每天读书是一种很好的习惯。"]},{"name":"Cách dùng cụm từ chỉ thời gian '不一会儿'","details":["Cấu trúc: 不一会儿 + V/Cụm câu","Giải thích: Cụm từ 「不一会儿」 dùng để diễn tả một khoảng thời gian trôi qua rất nhanh chóng, ngắn ngủi. Bạn có thể dùng nó ở đầu câu để làm trạng ngữ chỉ thời gian, mang nghĩa là “chẳng mấy chốc” hay “chốc lát sau”.","Mẹo: Bạn có thể dùng cấu trúc này để kể về các sự việc xảy ra nối tiếp nhau một cách nhanh chóng trong một câu chuyện.","Lưu ý: 「不一会儿」 là một cụm từ cố định, không nên thay thế các thành phần bên trong nó bằng các từ khác.","•  难过的事情不一会儿就忘了。","nán guò de shì qíng bù yī huì ér jiù wàng le","Những chuyện buồn chẳng mấy chốc là quên ngay.","•  不一会儿，张校长就来了。","bù yī huì ér zhāng xiào zhǎng jiù lái le","Chẳng mấy chốc mà hiệu trưởng Trương đã đến rồi.","Ví dụ: 难过的事情不一会儿就忘了。","Ví dụ: 不一会儿，张校长就来了。"]}],"extended":[],"structuredGrammar":[{"name":"Giới từ căn cứ: 根据","formula":"根据 + căn cứ/tài liệu + V + thành phần khác","explanation":"Giới từ 「根据」 được dùng để chỉ cơ sở, căn cứ hoặc nguồn thông tin cho một hành động hay phán đoán. Trong tiếng Việt, cấu trúc này tương ứng với các nghĩa như \"dựa theo\", \"căn cứ vào\" hoặc \"theo như\".","tip":"Bạn có thể đặt cụm từ 「根据...」 ở đầu câu để nhấn mạnh nguồn tin hoặc căn cứ trước khi nêu ra hành động chính.","note":"Cần phân biệt 「根据」 (dựa theo căn cứ) với 「跟」 (đi cùng với/theo sau ai đó), tránh nhầm lẫn về ý nghĩa.","examples":[{"zh":"这几年小区根据他们的需要，有了很多变化。","pinyin":"zhè jǐ nián xiǎo qū gēn jù tā men de xū yào yǒu le hěn duō biàn huà","vi":"Mấy năm nay khu dân cư đã có nhiều thay đổi dựa theo nhu cầu của họ."},{"zh":"根据要求，我们必
