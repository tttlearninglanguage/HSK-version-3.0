 phòng họp hay máy tính xách tay của mình?","explanation":"A 还是 B? (Câu hỏi) / A 或者 B (Câu trần thuật) — Cả 「还是」 và 「或者」 đều dùng để diễn tả sự lựa chọn. Điểm khác biệt là 「还是」 thường dùng trong câu nghi vấn để đặt câu hỏi lựa chọn, trong khi 「或者」 dùng trong câu trần thuật để liệt kê các phương án."},{"id":"H3-G11-01-02","lesson":11,"point":0,"question":"会议室的电脑＿＿＿自己的电脑都可以。","answer":"或者","options":["或者","的","了","吗"],"sentence":"会议室的电脑或者自己的电脑都可以。","pinyin":"huì yì shì de diàn nǎo huò zhě zì jǐ de diàn nǎo dōu kě yǐ","translation":"Máy tính của phòng họp hay máy tính của mình đều được.","explanation":"A 还是 B? (Câu hỏi) / A 或者 B (Câu trần thuật) — Cả 「还是」 và 「或者」 đều dùng để diễn tả sự lựa chọn. Điểm khác biệt là 「还是」 thường dùng trong câu nghi vấn để đặt câu hỏi lựa chọn, trong khi 「或者」 dùng trong câu trần thuật để liệt kê các phương án."},{"id":"H3-G11-02-01","lesson":11,"point":1,"question":"＿＿＿我没办法解决这个问题。","answer":"看来","options":["看来","的","了","吗"],"sentence":"看来我没办法解决这个问题。","pinyin":"kàn lái wǒ méi bàn fǎ jiě jué zhè gè wèn tí","translation":"Xem ra tôi không có cách nào giải quyết vấn đề này.","explanation":"看来 + [Câu/Mệnh đề] — Cụm từ 「看来」 thường được đặt ở đầu câu để đưa ra nhận định hoặc suy đoán dựa trên tình hình thực tế. Trong tiếng Việt, nó tương ứng với nghĩa \"xem ra\" hoặc \"có vẻ như\"."},{"id":"H3-G11-02-02","lesson":11,"point":1,"question":"电梯坏了，＿＿＿咱们只能走下去了。","answer":"看来","options":["看来","的","了","吗"],"sentence":"电梯坏了，看来咱们只能走下去了。","pinyin":"diàn tī huài le kàn lái zán men zhǐ néng zǒu xià qù le","translation":"Thang máy hỏng rồi, xem ra chúng ta chỉ có thể đi bộ xuống thôi.","explanation":"看来 + [Câu/Mệnh đề] — Cụm từ 「看来」 thường được đặt ở đầu câu để đưa ra nhận định hoặc suy đoán dựa trên tình hình thực tế. Trong tiếng Việt, nó tương ứng với nghĩa \"xem ra\" hoặc \"có vẻ như\"."},{"id":"H3-G11-03-01","lesson":11,"point":2,"question":"你明天再把书还＿＿＿我。","answer":"给","options":["给","的","了","吗"],"sentence":"你明天再把书还给我。","pinyin":"nǐ míng tiān zài bǎ shū huán gěi wǒ","translation":"Ngày mai bạn hãy trả sách cho tôi nhé.","explanation":"Chủ ngữ (S) + 把 + Tân ngữ (O) + Động từ + Thành phần khác — Câu chữ 「把」 dùng để nhấn mạnh sự tác động của chủ ngữ lên tân ngữ, khiến tân ngữ thay đổi vị trí hoặc trạng thái. Cấu trúc này thường đi kèm với các thành phần bổ sung sau động từ như bổ ngữ kết quả hoặc trợ từ 「了」."},{"id":"H3-G11-03-02","lesson":11,"point":2,"question":"老师，我把作业本放＿＿＿您办公室了。","answer":"在","options":["在","的","了","吗"],"sentence":"老师，我把作业本放在您办公室了。","pinyin":"lǎo shī wǒ bǎ zuò yè běn fàng zài nín bàn gōng shì le","translation":"Thưa thầy, em để vở bài tập ở văn phòng thầy rồi ạ.","explanation":"Chủ ngữ (S) + 把 + Tân ngữ (O) + Động từ + Thành phần khác — Câu chữ 「把」 dùng để nhấn mạnh sự tác động của chủ ngữ lên tân ngữ, khiến tân ngữ thay đổi vị trí hoặc trạng thái. Cấu trúc này thường đi kèm với các thành phần bổ sung sau động từ như bổ ngữ kết quả hoặc trợ từ 「了」."},{"id":"H3-G11-04-01","lesson":11,"point":3,"question":"对我＿＿＿，生活也很重要，我不愿意为工作或学习离开家人。","answer":"来说","options":["来说","的","了","吗"],"sentence":"对我来说，生活也很重要，我不愿意为工作或学习离开家人。","pinyin":"duì wǒ lái shuō shēng huó yě hěn zhòng yào wǒ bù yuàn yì wèi gōng zuò huò xué xí lí kāi jiā rén","translation":"Đối với tôi, cuộc sống cũng rất quan trọng, tôi không muốn rời xa gia đình vì công việc hay học tập.","explanation":"对 + [đối tượng] + 来说，+ [nhận xét/đánh giá] — Cấu trúc này dùng để xác định phạm vi hoặc góc nhìn của một người. Nó giúp bạn nêu lên quan điểm hoặc tiêu chuẩn đánh giá của một đối tượng cụ thể nào đó."},{"id":"H3-G11-04-02","lesson":11,"point":3,"question":"对她＿＿＿，学习汉语很有意思。","answer":"来说","options":["来说","的","了","吗"],"sentence":"对她来说，学习汉语很有意思。","pinyin":"duì tā lái shuō xué xí hàn yǔ hěn yǒu yì sī","translation":"Đối với cô ấy, học tiếng Trung rất thú vị.","explanation":"对 + [đối tượng] + 来说，+ [nhận xét/đánh giá] — Cấu trúc này dùng để xác định phạm vi hoặc góc nhìn của một người. Nó giúp bạn nêu lên quan điểm hoặc tiêu chuẩn đánh giá của một đối tượng cụ thể nào đó."},{"id":"H3-G12-01-01","lesson":12,"point":0,"question":"＿＿＿明天去，或者后天去，我给你打电话。","answer":"或者","options":["或者","的","了","吗"],"sentence":"或者明天去，或者后天去，我给你打电话。","pinyin":"huò zhě míng tiān qù huò zhě hòu tiān qù wǒ gěi nǐ dǎ diàn huà","translation":"Hoặc là mai đi, hoặc là ngày kia đi, tôi sẽ gọi điện cho bạn.","explanation":"或者 A，或者 B (Diễn tả sự lựa chọn) — Cấu trúc 「或者……，或者……」 được dùng trong câu trần thuật để liệt kê hai hoặc nhiều khả năng khác nhau. Nó mang ý nghĩa tương đương với \"hoặc là... hoặc là...\" trong tiếng Việt."},{"id":"H3-G12-01-02","lesson":12,"point":0,"question":"晚饭你自己选，＿＿＿吃中国菜，或者吃日本菜。","answer":"或者","options":["或者","的","了","吗"],"sentence":"晚饭你自己选，或者吃中国菜，或者吃日本菜。","pinyin":"wǎn fàn nǐ zì jǐ xuǎn huò zhě chī zhōng guó cài huò zhě chī rì běn cài","translation":"Bữa tối bạn tự chọn đi, hoặc là ăn món Trung Quốc, hoặc là ăn món Nhật.","explanation":"或者 A，或者 B (Diễn tả sự lựa chọn) — Cấu trúc 「或者……，或者……」 được dùng trong câu trần thuật để liệt kê hai hoặc nhiều khả năng khác nhau. Nó mang ý nghĩa tương đương với \"hoặc là... hoặc là...\" trong tiếng Việt."},{"id":"H3-G12-02-01","lesson":12,"point":1,"question":"雨已经下＿＿＿了。","answer":"起来","options":["起来","的","了","吗"],"sentence":"雨已经下起来了。","pinyin":"yǔ yǐ jīng xià qǐ lái le","translation":"Mưa đã bắt đầu rơi rồi.","explanation":"Động từ/Tính từ + 起来 — Bổ ngữ xu hướng 「起来」 được dùng để diễn tả một hành động bắt đầu xảy ra hoặc một trạng thái bắt đầu thay đổi. Ví dụ, khi nói 「下起雨来了」(Trời bắt đầu đổ mưa), hành động mưa đã chính thức bắt đầu."},{"id":"H3-G12-02-02","lesson":12,"point":1,"question":"最近天气热＿＿＿了。","answer":"起来","options":["起来","的","了","吗"],"sentence":"最近天气热起来了。","pinyin":"zuì jìn tiān qì rè qǐ lái le","translation":"Dạo này thời tiết đã nóng lên rồi.","explanation":"Động từ/Tính từ + 起来 — Bổ ngữ xu hướng 「起来」 được dùng để diễn tả một hành động bắt đầu xảy ra hoặc một trạng thái bắt đầu thay đổi. Ví dụ, khi nói 「下起雨来了」(Trời bắt đầu đổ mưa), hành động mưa đã chính thức bắt đầu."},{"id":"H3-G12-03-01","lesson":12,"point":2,"question":"北京常常下雪，但听说今年＿＿＿下了一次。","answer":"就","options":["就","的","了","吗"],"sentence":"北京常常下雪，但听说今年就下了一次。","pinyin":"běi jīng cháng cháng xià xuě dàn tīng shuō jīn nián jiù xià le yī cì","translation":"Bắc Kinh thường xuyên có tuyết, nhưng nghe nói năm nay chỉ có tuyết rơi một lần.","explanation":"Chủ ngữ + 就 + Động từ/Danh từ — Phó từ 「就」 được dùng để nhấn mạnh phạm vi giới hạn, mang nghĩa là 'chỉ' hoặc 'đúng là'. Nó thường đứng trước động từ để biểu thị sự ít ỏi của số lượng hoặc nhấn mạnh vào một đối tượng duy nhất."},{"id":"H3-G12-03-02","lesson":12,"point":2,"question":"我每天书包里都放着雨伞，＿＿＿今天没带。","answer":"就","options":["就","的","了","吗"],"sentence":"我每天书包里都放着雨伞，就今天没带。","pinyin":"wǒ měi tiān shū bāo lǐ dōu fàng zhe yǔ sǎn jiù jīn tiān méi dài","translation":"Ngày nào tôi cũng để ô trong cặp, chỉ có hôm nay là không mang.","explanation":"Chủ ngữ + 就 + Động từ/Danh từ — Phó từ 「就」 được dùng để nhấn mạnh phạm vi giới hạn, mang nghĩa là 'chỉ' hoặc 'đúng là'. Nó thường đứng trước động từ để biểu thị sự ít ỏi của số lượng hoặc nhấn mạnh vào một đối tượng duy nhất."},{"id":"H3-G12-04-01","lesson":12,"point":3,"question":"这一年多住＿＿＿，我还是更喜欢北京的四季。","answer":"下来","options":["下来","的","了","吗"],"sentence":"这一年多住下来，我还是更喜欢北京的四季。","pinyin":"zhè yī nián duō zhù xià lái wǒ hái shì gèng xǐ huān běi jīng de sì jì","translation":"Sau hơn một năm sống ở đây, tôi vẫn yêu thích bốn mùa của Bắc Kinh hơn.","explanation":"Động từ + 下来 — Cấu trúc này dùng để diễn tả một hành động đã hoàn thành và kết quả của nó được duy trì bền vững theo thời gian. Nó cũng có thể biểu thị sự chuyển đổi từ trạng thái đang hoạt động sang trạng thái tĩnh lặng hoặc ổn định."},{"id":"H3-G12-04-02","lesson":12,"point":3,"question":"这本书对我来说很难，我用了一个月终于读＿＿＿了。","answer":"下来","options":["下来","的","了","吗"],"sentence":"这本书对我来说很难，我用了一个月终于读下来了。","pinyin":"zhè běn shū duì wǒ lái shuō hěn nán wǒ yòng le yī gè yuè zhōng yú dú xià lái le","translation":"Quyển sách này đối với tôi rất khó, tôi dùng một tháng cuối cùng cũng đọc xong rồi.","explanation":"Động từ + 下来 — Cấu trúc này dùng để diễn tả một hành động đã hoàn thành và kết quả của nó được duy trì bền vững theo thời gian. Nó cũng có thể biểu thị sự chuyển đổi từ trạng thái đang hoạt động sang trạng thái tĩnh lặng hoặc ổn định."},{"id":"H3-G13-01-01","lesson":13,"point":0,"question":"你们有时间＿＿＿，就来我家做客。","answer":"的话","options":["的话","的","了","吗"],"sentence":"你们有时间的话，就来我家做客。","pinyin":"nǐ men yǒu shí jiān de huà jiù lái wǒ jiā zuò kè","translation":"Nếu các bạn có thời gian thì hãy đến nhà tôi chơi nhé.","explanation":"(如果) + [Giả thiết] + 的话，(chủ ngữ) + 就 + [Kết quả] — Cấu trúc này dùng để diễn tả một điều kiện giả định và kết quả tất yếu xảy ra. Trong đó, vế đầu là điều kiện giả thiết, vế sau dùng 「就」 để chỉ kết quả đi kèm."},{"id":"H3-G13-01-02","lesson":13,"point":0,"question":"明天天气好＿＿＿，我就去爬山。","answer":"的话","options":["的话","的","了","吗"],"sentence":"明天天气好的话，我就去爬山。","pinyin":"míng tiān tiān qì hǎo de huà wǒ jiù qù pá shān","translation":"Ngày mai nếu thời tiết đẹp thì tôi sẽ đi leo núi.","explanation":"(如果) + [Giả thiết] + 的话，(chủ ngữ) + 就 + [Kết quả] — Cấu trúc này dùng để diễn tả một điều kiện giả định và kết quả tất yếu xảy ra. Trong đó, vế đầu là điều kiện giả thiết, vế sau dùng 「就」 để chỉ kết quả đi kèm."},{"id":"H3-G13-02-01","lesson":13,"point":1,"question":"你＿＿＿声音开得太大了。","answer":"把","options":["把","的","了","吗"],"sentence":"你把声音开得太大了。","pinyin":"nǐ bǎ shēng yīn kāi de tài dà le","translation":"Bạn mở tiếng to quá rồi đấy.","explanation":"Chủ ngữ + 把 + Tân ngữ + Động từ + Bổ ngữ (Kết quả/Xu hướng/Mức độ) — Trong câu chữ 「把」, động từ không bao giờ đứng một mình mà phải đi kèm bổ ngữ để chỉ kết quả, xu hướng hoặc mức độ. Cấu trúc này nhấn mạnh việc tân ngữ đã chịu tác động và thay đổi ra sao sau hành động. Bạn cần đặt bổ ngữ ngay sau động từ để hoàn thiện ý nghĩa."},{"id":"H3-G13-02-02","lesson":13,"point":1,"question":"他＿＿＿球踢进去了吗？","answer":"把","options":["把","的","了","吗"],"sentence":"他把球踢进去了吗？","pinyin":"tā bǎ qiú tī jìn qù le ma","translation":"Anh ấy có đá bóng vào không?","explanation":"Chủ ngữ + 把 + Tân ngữ + Động từ + Bổ ngữ (Kết quả/Xu hướng/Mức độ) — Trong câu chữ 「把」, động từ không bao giờ đứng một mình mà phải đi kèm bổ ngữ để chỉ kết quả, xu hướng hoặc mức độ. Cấu trúc này nhấn mạnh việc tân ngữ đã chịu tác động và thay đổi ra sao sau hành động. Bạn cần đặt bổ ngữ ngay sau động từ để hoàn thiện ý nghĩa."},{"id":"H3-G13-03-01","lesson":13,"point":2,"question":"咱们＿＿＿吃蛋糕，一边聊天儿吧。","answer":"一边","options":["一边","的","了","吗"],"sentence":"咱们一边吃蛋糕，一边聊天儿吧。","pinyin":"zán men yī biān chī dàn gāo yī biān liáo tiān ér ba","translation":"Chúng mình vừa ăn bánh ngọt vừa trò chuyện đi.","explanation":"一边 + V1 + ，一边 + V2 — Cấu trúc 「一边……，一边……」 được dùng để diễn tả hai hành động diễn ra cùng một lúc. Bạn có thể dịch là \"vừa... vừa...\" để mô tả việc làm song song hai việc trong cùng một khoảng thời gian."},{"id":"H3-G13-03-02","lesson":13,"point":2,"question":"我喜欢＿＿＿跑步，一边听音乐。","answer":"一边","options":["一边","的","了","吗"],"sentence":"我喜欢一边跑步，一边听音乐。","pinyin":"wǒ xǐ huān yī biān pǎo bù yī biān tīng yīn yuè","translation":"Tôi thích vừa chạy bộ vừa nghe nhạc.","explanation":"一边 + V1 + ，一边 + V2 — Cấu trúc 「一边……，一边……」 được dùng để diễn tả hai hành động diễn ra cùng một lúc. Bạn có thể dịch là \"vừa... vừa...\" để mô tả việc làm song song hai việc trong cùng một khoảng thời gian."},{"id":"H3-G14-01-01","lesson":14,"point":0,"question":"这本书＿＿＿别人借走了。","answer":"被","options":["被","的","了","吗"],"sentence":"这本书被别人借走了。","pinyin":"zhè běn shū bèi bié rén jiè zǒu le","translation":"Quyển sách này bị người khác mượn mất rồi.","explanation":"Chủ ngữ + 被 + tác nhân + động từ + thành phần khác — Cấu trúc 「被」 được dùng để chỉ chủ ngữ là đối tượng chịu tác động của hành động. Mẫu câu này thường dùng để nhấn mạnh các kết quả không mong muốn hoặc sự việc không may xảy ra với chủ ngữ."},{"id":"H3-G14-01-02","lesson":14,"point":0,"question":"水果可能＿＿＿弟弟吃了。","answer":"被","options":["被","的","了","吗"],"sentence":"水果可能被弟弟吃了。","pinyin":"shuǐ guǒ kě néng bèi dì dì chī le","translation":"Hoa quả có lẽ bị em trai ăn rồi.","explanation":"Chủ ngữ + 被 + tác nhân + động từ + thành phần khác — Cấu trúc 「被」 được dùng để chỉ chủ ngữ là đối tượng chịu tác động của hành động. Mẫu câu này thường dùng để nhấn mạnh các kết quả không mong muốn hoặc sự việc không may xảy ra với chủ ngữ."},{"id":"H3-G14-02-01","lesson":14,"point":1,"question":"我要先去图书馆借书，＿＿＿去游泳。","answer":"然后","options":["然后","的","了","吗"],"sentence":"我要先去图书馆借书，然后去游泳。","pinyin":"wǒ yào xiān qù tú shū guǎn jiè shū rán hòu qù yóu yǒng","translation":"Tôi phải đi thư viện mượn sách trước, sau đó mới đi bơi.","explanation":"先 + [Động từ 1], 再/然后 + [Động từ 2] — Cấu trúc này dùng để liệt kê trình tự thực hiện các hành động theo thời gian. 「先」 có nghĩa là trước tiên, 「再」 hoặc 「然后」 có nghĩa là sau đó hoặc rồi làm gì tiếp theo."},{"id":"H3-G14-02-02","lesson":14,"point":1,"question":"你先去买门票，＿＿＿来这里找我。","answer":"再","options":["再","的","了","吗"],"sentence":"你先去买门票，再来这里找我。","pinyin":"nǐ xiān qù mǎi mén piào zài lái zhè lǐ zhǎo wǒ","translation":"Bạn đi mua vé trước đi, rồi quay lại đây tìm tôi.","explanation":"先 + [Động từ 1], 再/然后 + [Động từ 2] — Cấu trúc này dùng để liệt kê trình tự thực hiện các hành động theo thời gian. 「先」 có nghĩa là trước tiên, 「再」 hoặc 「然后」 có nghĩa là sau đó hoặc rồi làm gì tiếp theo."},{"id":"H3-G14-03-01","lesson":14,"point":2,"question":"紧＿＿＿张啊，我们都喜欢听你唱歌，你要相信自己。","answer":"什么","options":["什么","的","了","吗"],"sentence":"紧什么张啊，我们都喜欢听你唱歌，你要相信自己。","pinyin":"jǐn shén me zhāng a wǒ men dōu xǐ huān tīng nǐ chàng gē nǐ yào xiāng xìn zì jǐ","translation":"Căng thẳng cái gì chứ, chúng tôi đều thích nghe bạn hát, bạn phải tin vào bản thân mình.","explanation":"Từ/Cụm từ + 什么 (啊)! — Cấu trúc này được dùng trong khẩu ngữ để phản bác hoặc phủ định một nhận định của người khác. Nó mang sắc thái biểu cảm mạnh, giống như \"... cái gì mà ...\" hay \"... gì chứ!\" trong tiếng Việt để thể hiện thái độ không đồng tình."},{"id":"H3-G14-03-02","lesson":14,"point":2,"question":"胖＿＿＿啊，你一点儿也不瘦。","answer":"什么","options":["什么","的","了","吗"],"sentence":"胖什么啊，你一点儿也不瘦。","pinyin":"pàng shén me a nǐ yī diǎn ér yě bù shòu","translation":"Béo cái gì mà béo, bạn nhìn xem chẳng gầy chút nào.","explanation":"Từ/Cụm từ + 什么 (啊)! — Cấu trúc này được dùng trong khẩu ngữ để phản bác hoặc phủ định một nhận định của người khác. Nó mang sắc thái biểu cảm mạnh, giống như \"... cái gì mà ...\" hay \"... gì chứ!\" trong tiếng Việt để thể hiện thái độ không đồng tình."},{"id":"H3-G15-01-01","lesson":15,"point":0,"question":"这几年小区＿＿＿他们的需要，有了很多变化。","answer":"根据","options":["根据","的","了","吗"],"sentence":"这几年小区根据他们的需要，有了很多变化。","pinyin":"zhè jǐ nián xiǎo qū gēn jù tā men de xū yào yǒu le hěn duō biàn huà","translation":"Mấy năm nay khu dân cư đã có nhiều thay đổi dựa theo nhu cầu của họ.","explanation":"根据 + căn cứ/tài liệu + V + thành phần khác — Giới từ 「根据」 được dùng để chỉ cơ sở, căn cứ hoặc nguồn thông tin cho một hành động hay phán đoán. Trong tiếng Việt, cấu trúc này tương ứng với các nghĩa như \"dựa theo\", \"căn cứ vào\" hoặc \"theo như\"."},{"id":"H3-G15-01-02","lesson":15,"point":0,"question":"＿＿＿要求，我们必须参加明天的会议。","answer":"根据","options":["根据","的","了","吗"],"sentence":"根据要求，我们必须参加明天的会议。","pinyin":"gēn jù yāo qiú wǒ men bì xū cān jiā míng tiān de huì yì","translation":"Theo yêu cầu, chúng tôi phải tham gia cuộc họp ngày mai.","explanation":"根据 + căn cứ/tài liệu + V + thành phần khác — Giới từ 「根据」 được dùng để chỉ cơ sở, căn cứ hoặc nguồn thông tin cho một hành động hay phán đoán. Trong tiếng Việt, cấu trúc này tương ứng với các nghĩa như \"dựa theo\", \"căn cứ vào\" hoặc \"theo như\"."},{"id":"H3-G15-02-01","lesson":15,"point":1,"question":"我＿＿＿一点儿一点儿给你讲。","answer":"得","options":["得","的","了","吗"],"sentence":"我得一点儿一点儿给你讲。","pinyin":"wǒ děi yī diǎn ér yī diǎn ér gěi nǐ jiǎng","translation":"Tôi phải giảng cho bạn từng chút từng chút một.","explanation":"Số từ + Lượng từ + Số từ + Lượng từ (ví dụ: 一点儿一点儿) — Cấu trúc lặp lại này được dùng để mô tả một hành động hoặc sự thay đổi diễn ra từng chút một hoặc từng bước một. Nó giúp nhấn mạnh quá trình tích lũy dần dần của sự việc trong câu."},{"id":"H3-G15-02-02","lesson":15,"point":1,"question":"学生们的汉语水平一天一天地提高＿＿＿。","answer":"了","options":["了","的","吗","呢"],"sentence":"学生们的汉语水平一天一天地提高了。","pinyin":"xué shēng men de hàn yǔ shuǐ píng yī tiān yī tiān de tí gāo le","translation":"Trình độ tiếng Trung của học sinh tiến bộ lên từng ngày.","explanation":"Số từ + Lượng từ + Số từ + Lượng từ (ví dụ: 一点儿一点儿) — Cấu trúc lặp lại này được dùng để mô tả một hành động hoặc sự thay đổi diễn ra từng chút một hoặc từng bước một. Nó giúp nhấn mạnh quá trình tích lũy dần dần của sự việc trong câu."},{"id":"H3-G15-03-01","lesson":15,"point":2,"question":"在我们中国人＿＿＿，黄河像妈妈一样，养了我们几千年。","answer":"看来","options":["看来","的","了","吗"],"sentence":"在我们中国人看来，黄河像妈妈一样，养了我们几千年。","pinyin":"zài wǒ men zhōng guó rén kàn lái huáng hé xiàng mā mā yī yàng yǎng le wǒ men jǐ qiān nián","translation":"Trong mắt người Trung Quốc chúng tôi, sông Hoàng Hà giống như người mẹ đã nuôi dưỡng chúng tôi mấy ngàn năm.","explanation":"在 + [Người] + 看来 + [Quan điểm] — Cấu trúc này dùng để diễn đạt ý kiến hoặc góc nhìn của một người nào đó về một vấn đề. Trong tiếng Việt, nó tương đương với các cụm từ như \"theo tôi thấy\", \"trong mắt anh ấy\" hay \"đối với cô ấy\"."},{"id":"H3-G15-03-02","lesson":15,"point":2,"question":"在我＿＿＿，每天读书是一种很好的习惯。","answer":"看来","options":["看来","的","了","吗"],"sentence":"在我看来，每天读书是一种很好的习惯。","pinyin":"zài wǒ kàn lái měi tiān dú shū shì yī zhǒng hěn hǎo de xí guàn","translation":"Theo tôi thấy, đọc sách mỗi ngày là một thói quen rất tốt.","explanation":"在 + [Người] + 看来 + [Quan điểm] — Cấu trúc này dùng để diễn đạt ý kiến hoặc góc nhìn của một người nào đó về một vấn đề. Trong tiếng Việt, nó tương đương với các cụm từ như \"theo tôi thấy\", \"trong mắt anh ấy\" hay \"đối với cô ấy\"."},{"id":"H3-G15-04-01","lesson":15,"point":3,"question":"难过的事情＿＿＿就忘了。","answer":"不一会儿","options":["不一会儿","的","了","吗"],"sentence":"难过的事情不一会儿就忘了。","pinyin":"nán guò de shì qíng bù yī huì ér jiù wàng le","translation":"Những chuyện buồn chẳng mấy chốc là quên ngay.","explanation":"不一会儿 + V/Cụm câu — Cụm từ 「不一会儿」 dùng để diễn tả một khoảng thời gian trôi qua rất nhanh chóng, ngắn ngủi. Bạn có thể dùng nó ở đầu câu để làm trạng ngữ chỉ thời gian, mang nghĩa là “chẳng mấy chốc” hay “chốc lát sau”."},{"id":"H3-G15-04-02","lesson":15,"point":3,"question":"＿＿＿，张校长就来了。","answer":"不一会儿","options":["不一会儿","的","了","吗"],"sentence":"不一会儿，张校长就来了。","pinyin":"bù yī huì ér zhāng xiào zhǎng jiù lái le","translation":"Chẳng mấy chốc mà hiệu trưởng Trương đã đến rồi.","explanation":"不一会儿 + V/Cụm câu — Cụm từ 「不一会儿」 dùng để diễn tả một khoảng thời gian trôi qua rất nhanh chóng, ngắn ngủi. Bạn có thể dùng nó ở đầu câu để làm trạng ngữ chỉ thời gian, mang nghĩa là “chẳng mấy chốc” hay “chốc lát sau”."},{"id":"H3-G16-01-01","lesson":16,"point":0,"question":"它＿＿＿在你脚边睡觉，一会儿在你身上爬。","answer":"一会儿","options":["一会儿","的","了","吗"],"sentence":"它一会儿在你脚边睡觉，一会儿在你身上爬。","pinyin":"tā yī huì ér zài nǐ jiǎo biān shuì jiào yī huì ér zài nǐ shēn shàng pá","translation":"Nó lúc thì ngủ dưới chân bạn, lúc thì leo lên người bạn.","explanation":"一会儿 + Động từ/Tính từ, 一会儿 + Động từ/Tính từ — Cấu trúc này dùng để diễn tả hai hoặc nhiều hành động, trạng thái thay đổi qua lại liên tục. Trong tiếng Việt, ta dịch là \"lúc thì... lúc thì...\" để chỉ sự không ổn định hoặc thay đổi nhanh chóng."},{"id":"H3-G16-01-02","lesson":16,"point":0,"question":"最近天气变化很快，＿＿＿冷，一会儿热。","answer":"一会儿","options":["一会儿","的","了","吗"],"sentence":"最近天气变化很快，一会儿冷，一会儿热。","pinyin":"zuì jìn tiān qì biàn huà hěn kuài yī huì ér lěng yī huì ér rè","translation":"Dạo này thời tiết thay đổi rất nhanh, lúc thì lạnh, lúc thì nóng.","explanation":"一会儿 + Động từ/Tính từ, 一会儿 + Động từ/Tính từ — Cấu trúc này dùng để diễn tả hai hoặc nhiều hành động, trạng thái thay đổi qua lại liên tục. Trong tiếng Việt, ta dịch là \"lúc thì... lúc thì...\" để chỉ sự không ổn định hoặc thay đổi nhanh chóng."},{"id":"H3-G16-02-01","lesson":16,"point":1,"question":"＿＿＿这个问题，我得慢慢给你讲。","answer":"关于","options":["关于","的","了","吗"],"sentence":"关于这个问题，我得慢慢给你讲。","pinyin":"guān yú zhè gè wèn tí wǒ děi màn màn gěi nǐ jiǎng","translation":"Về vấn đề này, tôi phải từ từ giảng cho bạn.","explanation":"关于 + danh từ/cụm danh từ + , + mệnh đề — Giới từ 「关于」 được dùng để dẫn dắt chủ đề hoặc phạm vi mà người nói muốn đề cập đến. Trong câu, nó thường đứng ở đầu câu để xác định nội dung chính mà câu đó hướng tới, tương đương với nghĩa “về” hoặc “về việc” trong tiếng Việt."},{"id":"H3-G16-02-02","lesson":16,"point":1,"question":"＿＿＿比赛的时间，我明天一定告诉大家。","answer":"关于","options":["关于","的","了","吗"],"sentence":"关于比赛的时间，我明天一定告诉大家。","pinyin":"guān yú bǐ sài de shí jiān wǒ míng tiān yī dìng gào sù dà jiā","translation":"Về thời gian thi đấu, ngày mai tôi nhất định sẽ báo cho mọi người.","explanation":"关于 + danh từ/cụm danh từ + , + mệnh đề — Giới từ 「关于」 được dùng để dẫn dắt chủ đề hoặc phạm vi mà người nói muốn đề cập đến. Trong câu, nó thường đứng ở đầu câu để xác định nội dung chính mà câu đó hướng tới, tương đương với nghĩa “về” hoặc “về việc” trong tiếng Việt."},{"id":"H3-G16-03-01","lesson":16,"point":2,"question":"＿＿＿，熊猫每天要睡很多次觉。","answer":"一般来说","options":["一般来说","的","了","吗"],"sentence":"一般来说，熊猫每天要睡很多次觉。","pinyin":"yī bān lái shuō xióng māo měi tiān yào shuì hěn duō cì jué","translation":"Thông thường mà nói, gấu trúc mỗi ngày phải ngủ rất nhiều lần.","explanation":"一般来说，+ câu nhận xét — Cụm từ 「一般来说」 thường đứng đầu câu để nêu ra một nhận xét mang tính khái quát hoặc thông thường. Nó tương đương với nghĩa “nói chung là” hoặc “thông thường mà nói” trong tiếng Việt."},{"id":"H3-G16-03-02","lesson":16,"point":2,"question":"＿＿＿，学习外语需要多练习。","answer":"一般来说","options":["一般来说","的","了","吗"],"sentence":"一般来说，学习外语需要多练习。","pinyin":"yī bān lái shuō xué xí wài yǔ xū yào duō liàn xí","translation":"Thông thường, học ngoại ngữ cần phải luyện tập nhiều.","explanation":"一般来说，+ câu nhận xét — Cụm từ 「一般来说」 thường đứng đầu câu để nêu ra một nhận xét mang tính khái quát hoặc thông thường. Nó tương đương với nghĩa “nói chung là” hoặc “thông thường mà nói” trong tiếng Việt."},{"id":"H3-G16-04-01","lesson":16,"point":3,"question":"冬天＿＿＿夏天早关门一个小时。","answer":"比","options":["比","的","了","吗"],"sentence":"冬天比夏天早关门一个小时。","pinyin":"dōng tiān bǐ xià tiān zǎo guān mén yī gè xiǎo shí","translation":"Mùa đông đóng cửa sớm hơn mùa hè một tiếng đồng hồ.","explanation":"A 比 B + [多/少/早/晚] + Động từ + Số lượng — Cấu trúc này dùng để nhấn mạnh sự chênh lệch cụ thể về số lượng khi thực hiện một hành động nào đó giữa hai đối tượng. Trong đó, 「比」 được dùng để thiết lập phép so sánh, còn số lượng đứng cuối câu chỉ ra mức độ chênh lệch chính xác."},{"id":"H3-G16-04-02","lesson":16,"point":3,"question":"哥哥＿＿＿弟弟多吃了三个饺子。","answer":"比","options":["比","的","了","吗"],"sentence":"哥哥比弟弟多吃了三个饺子。","pinyin":"gē gē bǐ dì dì duō chī le sān gè jiǎo zi","translation":"Anh trai ăn nhiều hơn em trai ba cái sủi cảo.","explanation":"A 比 B + [多/少/早/晚] + Động từ + Số lượng — Cấu trúc này dùng để nhấn mạnh sự chênh lệch cụ thể về số lượng khi thực hiện một hành động nào đó giữa hai đối tượng. Trong đó, 「比」 được dùng để thiết lập phép so sánh, còn số lượng đứng cuối câu chỉ ra mức độ chênh lệch chính xác."},{"id":"H3-G17-01-01","lesson":17,"point":0,"question":"我以后要多＿＿＿认真的人学习。","answer":"向","options":["向","的","了","吗"],"sentence":"我以后要多向认真的人学习。","pinyin":"wǒ yǐ hòu yào duō xiàng rèn zhēn de rén xué xí","translation":"Sau này tôi phải học hỏi nhiều hơn ở những người nghiêm túc.","explanation":"Chủ ngữ + 向 + đối tượng + Động từ — Giới từ 「向」 dùng để chỉ hướng hoặc đối tượng mà hành động nhắm tới. Nó thường đi kèm với các động từ như 「学习」(học hỏi), 「问」(hỏi), hoặc 「借」(mượn) để xác định rõ bạn đang thực hiện hành động đó với ai."},{"id":"H3-G17-01-02","lesson":17,"point":0,"question":"他＿＿＿我笑了笑。","answer":"向","options":["向","的","了","吗"],"sentence":"他向我笑了笑。","pinyin":"tā xiàng wǒ xiào le xiào","translation":"Anh ấy mỉm cười với tôi.","explanation":"Chủ ngữ + 向 + đối tượng + Động từ — Giới từ 「向」 dùng để chỉ hướng hoặc đối tượng mà hành động nhắm tới. Nó thường đi kèm với các động từ như 「学习」(học hỏi), 「问」(hỏi), hoặc 「借」(mượn) để xác định rõ bạn đang thực hiện hành động đó với ai."},{"id":"H3-G17-02-01","lesson":17,"point":1,"question":"你＿＿＿喜欢玩电脑吗？你可以去看看跟电脑有关的书。","answer":"不是","options":["不是","的","了","吗"],"sentence":"你不是喜欢玩电脑吗？你可以去看看跟电脑有关的书。","pinyin":"nǐ bù shì xǐ huān wán diàn nǎo ma nǐ kě yǐ qù kàn kàn gēn diàn nǎo yǒu guān de shū","translation":"Chẳng phải bạn thích chơi máy tính sao? Bạn có thể đi xem những quyển sách liên quan đến máy tính.","explanation":"不是 + [Thành phần câu] + 吗？ — Cấu trúc này dùng để nhắc lại hoặc xác nhận một điều mà người nói cho là đúng. Nó mang sắc thái phản vấn, giống như cách nói \"Chẳng phải là... sao?\" trong tiếng Việt."},{"id":"H3-G17-02-02","lesson":17,"point":1,"question":"你＿＿＿说今天有事吗？为什么来了？","answer":"不是","options":["不是","的","了","吗"],"sentence":"你不是说今天有事吗？为什么来了？","pinyin":"nǐ bù shì shuō jīn tiān yǒu shì ma wèi shén me lái le","translation":"Chẳng phải bạn nói hôm nay có việc sao? Tại sao lại đến đây?","explanation":"不是 + [Thành phần câu] + 吗？ — Cấu trúc này dùng để nhắc lại hoặc xác nhận một điều mà người nói cho là đúng. Nó mang sắc thái phản vấn, giống như cách nói \"Chẳng phải là... sao?\" trong tiếng Việt."},{"id":"H3-G17-03-01","lesson":17,"point":2,"question":"我还没想好学什么，＿＿＿没想好去哪个国家。","answer":"更","options":["更","的","了","吗"],"sentence":"我还没想好学什么，更没想好去哪个国家。","pinyin":"wǒ hái méi xiǎng hǎo xué shén me gèng méi xiǎng hǎo qù nǎ gè guó jiā","translation":"Tôi còn chưa nghĩ xong sẽ học gì, càng chưa nghĩ xong sẽ đi nước nào.","explanation":"A，更 B (A, B hơn nữa/càng B hơn) — Cấu trúc này dùng để biểu thị ý nghĩa tăng tiến, nhấn mạnh mức độ cao hơn của sự việc hoặc tính chất sau dấu phẩy. Từ 「更」 đóng vai trò là phó từ chỉ mức độ, giúp câu văn trở nên nhấn mạnh và giàu sắc thái hơn so với câu đơn."},{"id":"H3-G17-03-02","lesson":17,"point":2,"question":"来中国学习，我学会了中文，＿＿＿了解了中国文化。","answer":"更","options":["更","的","了","吗"],"sentence":"来中国学习，我学会了中文，更了解了中国文化。","pinyin":"lái zhōng guó xué xí wǒ xué huì le zhōng wén gèng liǎo jiě le zhōng guó wén huà","translation":"Đến Trung Quốc học tập, tôi đã học được tiếng Trung, và càng hiểu thêm về văn hóa Trung Quốc.","explanation":"A，更 B (A, B hơn nữa/càng B hơn) — Cấu trúc này dùng để biểu thị ý nghĩa tăng tiến, nhấn mạnh mức độ cao hơn của sự việc hoặc tính chất sau dấu phẩy. Từ 「更」 đóng vai trò là phó từ chỉ mức độ, giúp câu văn trở nên nhấn mạnh và giàu sắc thái hơn so với câu đơn."},{"id":"H3-G17-04-01","lesson":17,"point":3,"question":"＿＿＿想清楚自己真正喜欢什么，才能做出最合适的选择。","answer":"只有","options":["只有","的","了","吗"],"sentence":"只有想清楚自己真正喜欢什么，才能做出最合适的选择。","pinyin":"zhǐ yǒu xiǎng qīng chǔ zì jǐ zhēn zhèng xǐ huān shén me cái néng zuò chū zuì hé shì de xuǎn zé","translation":"Chỉ khi nghĩ thông suốt bản thân thực sự thích cái gì thì mới có thể đưa ra lựa chọn phù hợp nhất.","explanation":"只有 (chỉ có) + Điều kiện, 才 (mới) + Kết quả — Cấu trúc 「只有... 才...」 được dùng để nhấn mạnh một kết quả chỉ xảy ra khi điều kiện duy nhất được thỏa mãn. \"只有\" đứng trước điều kiện cần thiết, còn \"才\" đứng trước kết quả tương ứng."},{"id":"H3-G17-04-02","lesson":17,"point":3,"question":"＿＿＿每天锻炼身体，才会越来越健康。","answer":"只有","options":["只有","的","了","吗"],"sentence":"只有每天锻炼身体，才会越来越健康。","pinyin":"zhǐ yǒu měi tiān duàn liàn shēn tǐ cái huì yuè lái yuè jiàn kāng","translation":"Chỉ có tập thể dục mỗi ngày mới có thể ngày càng khỏe mạnh.","explanation":"只有 (chỉ có) + Điều kiện, 才 (mới) + Kết quả — Cấu trúc 「只有... 才...」 được dùng để nhấn mạnh một kết quả chỉ xảy ra khi điều kiện duy nhất được thỏa mãn. \"只有\" đứng trước điều kiện cần thiết, còn \"才\" đứng trước kết quả tương ứng."},{"id":"H3-G18-01-01","lesson":18,"point":0,"question":"春＿＿＿大概放七八天假。","answer":"节","options":["节","的","了","吗"],"sentence":"春节大概放七八天假。","pinyin":"chūn jié dà gài fàng qī bā tiān jiǎ","translation":"Tết Nguyên Đán nghỉ khoảng 7, 8 ngày.","explanation":"Số đếm A + Số đếm B (liên tiếp) — Trong tiếng Trung, bạn có thể đặt hai số đếm liên tiếp nhau để diễn tả một con số ước chừng. Ví dụ: 「三四」 (ba bốn) có nghĩa là khoảng 3 hoặc 4."},{"id":"H3-G18-01-02","lesson":18,"point":0,"question":"教室里来＿＿＿五六个学生。","answer":"了","options":["了","的","吗","呢"],"sentence":"教室里来了五六个学生。","pinyin":"jiào shì lǐ lái le wǔ liù gè xué shēng","translation":"Trong lớp có khoảng 5, 6 học sinh vừa đến.","explanation":"Số đếm A + Số đếm B (liên tiếp) — Trong tiếng Trung, bạn có thể đặt hai số đếm liên tiếp nhau để diễn tả một con số ước chừng. Ví dụ: 「三四」 (ba bốn) có nghĩa là khoảng 3 hoặc 4."},{"id":"H3-G18-02-01","lesson":18,"point":1,"question":"我＿＿＿看视频学会了包饺子。","answer":"刚刚","options":["刚刚","的","了","吗"],"sentence":"我刚刚看视频学会了包饺子。","pinyin":"wǒ gāng gāng kàn shì pín xué huì le bāo jiǎo zi","translation":"Tôi vừa mới xem video và học được cách gói sủi cảo.","explanation":"S + 刚才 / 刚刚 + V hoặc 刚才 / 刚刚 + S + V — Cả 「刚才」 và 「刚刚」 đều dùng để chỉ hành động vừa mới xảy ra trong quá khứ gần. 「刚才」 là danh từ chỉ thời gian, thường dùng để nhấn mạnh thời điểm vừa xảy ra tức thì. 「刚刚」 có thể là phó từ hoặc danh từ, linh hoạt hơn trong việc diễn tả hành động vừa mới hoàn thành."},{"id":"H3-G18-02-02","lesson":18,"point":1,"question":"＿＿＿的话是我妈妈打来的。","answer":"刚才","options":["刚才","的","了","吗"],"sentence":"刚才的话是我妈妈打来的。","pinyin":"gāng cái de huà shì wǒ mā mā dǎ lái de","translation":"Cuộc điện thoại vừa rồi là mẹ tôi gọi đến.","explanation":"S + 刚才 / 刚刚 + V hoặc 刚才 / 刚刚 + S + V — Cả 「刚才」 và 「刚刚」 đều dùng để chỉ hành động vừa mới xảy ra trong quá khứ gần. 「刚才」 là danh từ chỉ thời gian, thường dùng để nhấn mạnh thời điểm vừa xảy ra tức thì. 「刚刚」 có thể là phó từ hoặc danh từ, linh hoạt hơn trong việc diễn tả hành động vừa mới hoàn thành."},{"id":"H3-G18-03-01","lesson":18,"point":2,"question":"＿＿＿你努力学习，就一定能完成目标。","answer":"只要","options":["只要","的","了","吗"],"sentence":"只要你努力学习，就一定能完成目标。","pinyin":"zhǐ yào nǐ nǔ lì xué xí jiù yī dìng néng wán chéng mù biāo","translation":"Chỉ cần bạn nỗ lực học tập thì nhất định sẽ hoàn thành mục tiêu.","explanation":"只要 + [Điều kiện], 就 + [Kết quả] — Cấu trúc 「只要……，就……」 dùng để biểu thị một điều kiện cần thiết, chỉ cần điều kiện đó xảy ra thì kết quả tương ứng sẽ xuất hiện. Đây là mẫu câu rất phổ biến trong tiếng Trung để khẳng định mối quan hệ nhân quả."},{"id":"H3-G18-03-02","lesson":18,"point":2,"question":"＿＿＿你坚持每天早睡，身体就一定会好起来。","answer":"只要","options":["只要","的","了","吗"],"sentence":"只要你坚持每天早睡，身体就一定会好起来。","pinyin":"zhǐ yào nǐ jiān chí měi tiān zǎo shuì shēn tǐ jiù yī dìng huì hǎo qǐ lái","translation":"Chỉ cần bạn kiên trì ngủ sớm mỗi ngày thì sức khỏe nhất định sẽ tốt lên.","explanation":"只要 + [Điều kiện], 就 + [Kết quả] — Cấu trúc 「只要……，就……」 dùng để biểu thị một điều kiện cần thiết, chỉ cần điều kiện đó xảy ra thì kết quả tương ứng sẽ xuất hiện. Đây là mẫu câu rất phổ biến trong tiếng Trung để khẳng định mối quan hệ nhân quả."},{"id":"H3-G18-04-01","lesson":18,"point":3,"question":"他从那时＿＿＿就努力学习。","answer":"起","options":["起","的","了","吗"],"sentence":"他从那时起就努力学习。","pinyin":"tā cóng nà shí qǐ jiù nǔ lì xué xí","translation":"Anh ấy bắt đầu nỗ lực học tập từ lúc đó.","explanation":"从 + [mốc thời gian] + 起 — Cấu trúc 「从……起」 được dùng để xác định thời điểm bắt đầu của một hành động hoặc trạng thái. Trong tiếng Việt, nó tương đương với cụm từ \"kể từ...\" hoặc \"bắt đầu từ...\"."},{"id":"H3-G18-04-02","lesson":18,"point":3,"question":"从那天＿＿＿，我们就变成了好朋友。","answer":"起","options":["起","的","了","吗"],"sentence":"从那天起，我们就变成了好朋友。","pinyin":"cóng nà tiān qǐ wǒ men jiù biàn chéng le hǎo péng yǒu","translation":"Từ ngày đó, chúng tôi đã trở thành bạn thân của nhau.","explanation":"从 + [mốc thời gian] + 起 — Cấu trúc 「从……起」 được dùng để xác định thời điểm bắt đầu của một hành động hoặc trạng thái. Trong tiếng Việt, nó tương đương với cụm từ \"kể từ...\" hoặc \"bắt đầu từ...\"."}],"readings":[{"id":"H3-R01","lesson":1,"title":"Đón bạn ở sân bay","text":"今天下午，我去机场接朋友。他给我打电话，说行李不见了。他很着急。我让他先去服务台问一问，不要离开那里。后来，工作人员找到了他的箱子。我们都很高兴。","pinyin":"Jīn tiān xià wǔ， wǒ qù jī chǎng jiē péng you。 tā gěi wǒ dǎ diàn huà， shuō xíng lǐ bú jiàn le。 tā hěn zháo jí。 wǒ ràng tā xiān qù fú wù tái wèn yī wèn， bú yào lí kāi nà lǐ。 hòu lái， gōng zuò rén yuán zhǎo dào le tā de xiāng zi。 wǒ men dōu hěn gāo xìng。","translation":"Chiều nay tôi ra sân bay đón bạn. Bạn gọi điện nói hành lý biến mất. Bạn rất sốt ruột. Tôi bảo bạn đến quầy dịch vụ hỏi trước và đừng rời khỏi đó. Sau đó nhân viên tìm được va li của bạn. Chúng tôi đều rất vui.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R01-Q1","question":"我去机场做什么？","answer":"接朋友","options":["接朋友","买票","上班","买箱子"],"explanation":"Đối chiếu nội dung bài đọc: 接朋友"},{"id":"H3-R01-Q2","question":"朋友为什么着急？","answer":"行李不见了","options":["行李不见了","飞机晚点了","手机坏了","没有护照"],"explanation":"Đối chiếu nội dung bài đọc: 行李不见了"},{"id":"H3-R01-Q3","question":"我让朋友先去哪儿？","answer":"服务台","options":["服务台","饭馆","学校","商店"],"explanation":"Đối chiếu nội dung bài đọc: 服务台"},{"id":"H3-R01-Q4","question":"最后谁找到了箱子？","answer":"工作人员","options":["工作人员","老师","司机","我的妈妈"],"explanation":"Đối chiếu nội dung bài đọc: 工作人员"}]},{"id":"H3-R01-2","lesson":1,"title":"Cuộc gọi trước chuyến bay","text":"明天姐姐要来北京。我问她几点到，她说下午三点。我以为她会带很多行李，想开车去接她。姐姐说只有一个小箱子，坐地铁也很方便。我还是决定到机场等她，因为这是她第一次来北京。","pinyin":"Míng tiān jiě jie yào lái běi jīng。 wǒ wèn tā jǐ diǎn dào， tā shuō xià wǔ sān diǎn。 wǒ yǐ wéi tā huì dài hěn duō xíng lǐ， xiǎng kāi chē qù jiē tā。 jiě jie shuō zhǐ yǒu yí gè xiǎo xiāng zi， zuò dì tiě yě hěn fāng biàn。 wǒ hái shì jué dìng dào jī chǎng děng tā， yīn wèi zhè shì tā dì yī cì lái běi jīng。","translation":"Ngày mai chị đến Bắc Kinh. Tôi hỏi giờ đến, chị nói ba giờ chiều. Tôi tưởng chị mang nhiều hành lý nên định lái xe đón. Chị nói chỉ có một va li nhỏ, đi tàu điện ngầm cũng tiện. Tôi vẫn quyết định chờ chị ở sân bay vì đây là lần đầu chị đến Bắc Kinh.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R01-2-Q1","question":"姐姐几点到北京？","answer":"下午三点","options":["下午三点","下个月","两分钟","六点"],"explanation":"Đối chiếu đoạn: “我问她几点到，她说下午三点。” → Chọn “下午三点”."},{"id":"H3-R01-2-Q2","question":"姐姐带几个箱子？","answer":"一个","options":["一个","两个","两个晚上","五张"],"explanation":"Đối chiếu đoạn: “姐姐说只有一个小箱子，坐地铁也很方便。” → Chọn “一个”."},{"id":"H3-R01-2-Q3","question":"我决定去哪儿等姐姐？","answer":"机场","options":["机场","小区里","卖早饭的店","楼门口"],"explanation":"Đối chiếu đoạn: “我还是决定到机场等她，因为这是她第一次来北京。” → Chọn “机场”."},{"id":"H3-R01-2-Q4","question":"我为什么去接姐姐？","answer":"她第一次来北京","options":["她第一次来北京","准备下个月的比赛","回家时还要检查","用错了方法"],"explanation":"Đối chiếu đoạn: “我还是决定到机场等她，因为这是她第一次来北京。” → Chọn “她第一次来北京”."}]},{"id":"H3-R01-3","lesson":1,"title":"Nhận lại hành lý","text":"下飞机以后，哥哥发现自己的箱子不见了。他没有马上离开机场，就去服务台请工作人员帮助查找。他告诉对方箱子的颜色，还拿出一张照片。半个小时以后，箱子找到了。哥哥检查了一下，里面的东西都在。","pinyin":"Xià fēi jī yǐ hòu， gē ge fā xiàn zì jǐ de xiāng zi bú jiàn le。 tā méi yǒu mǎ shàng lí kāi jī chǎng， jiù qù fú wù tái qǐng gōng zuò rén yuán bāng zhù chá zhǎo。 tā gào sù duì fāng xiāng zi de yán sè， hái ná chū yī zhāng zhào piān。 bàn gè xiǎo shí yǐ hòu， xiāng zi zhǎo dào le。 gē ge jiǎn chá le yī xià， lǐ miàn de dōng xi dōu zài。","translation":"Sau khi xuống máy bay, anh phát hiện mất va li. Anh không rời sân bay mà đến quầy dịch vụ nhờ nhân viên tìm giúp. Anh mô tả màu sắc và đưa ảnh. Nửa tiếng sau tìm thấy va li. Anh kiểm tra, đồ đạc vẫn đầy đủ.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R01-3-Q1","question":"哥哥发现什么不见了？","answer":"箱子","options":["箱子","身体","油","鸡蛋"],"explanation":"Đối chiếu đoạn: “下飞机以后，哥哥发现自己的箱子不见了。” → Chọn “箱子”."},{"id":"H3-R01-3-Q2","question":"哥哥去哪儿请人帮忙？","answer":"服务台","options":["服务台","卖早饭的店","楼门口","楼后"],"explanation":"Đối chiếu đoạn: “他没有马上离开机场，就去服务台请工作人员帮助查找。” → Chọn “服务台”."},{"id":"H3-R01-3-Q3","question":"工作人员多久以后找到箱子？","answer":"半个小时以后","options":["半个小时以后","九点","二十分钟","下班以后"],"explanation":"Đối chiếu đoạn: “半个小时以后，箱子找到了。” → Chọn “半个小时以后”."},{"id":"H3-R01-3-Q4","question":"箱子里的东西怎么样？","answer":"都在","options":["都在","不太好","每个人都看得很清楚","可以"],"explanation":"Đối chiếu đoạn: “哥哥检查了一下，里面的东西都在。” → Chọn “都在”."}]},{"id":"H3-R01-4","lesson":1,"title":"Đón thầy giáo","text":"今天我们去车站接新老师。以前只在网上见过他的照片，所以大家有点儿着急。一位年轻人向我们走来，他的头发很短，身高一米八左右。听到他叫我们的名字，我们才知道他就是新老师。他比照片上看起来更年轻。","pinyin":"Jīn tiān wǒ men qù chē zhàn jiē xīn lǎo shī。 yǐ qián zhǐ zài wǎng shàng jiàn guò tā de zhào piān， suǒ yǐ dà jiā yǒu diǎn ér zháo jí。 yī wèi nián qīng rén xiàng wǒ men zǒu lái， tā de tóu fà hěn duǎn， shēn gāo yī mǐ bā zuǒ yòu。 tīng dào tā jiào wǒ men de míng zi， wǒ men cái zhī dao tā jiù shì xīn lǎo shī。 tā bǐ zhào piān shàng kàn qǐ lái gèng nián qīng。","translation":"Hôm nay chúng tôi ra ga đón thầy mới. Trước đây chỉ thấy ảnh trên mạng nên hơi lo. Một người trẻ tóc ngắn, cao khoảng mét tám đi tới. Khi anh gọi tên, chúng tôi mới biết đó là thầy. Thầy trông trẻ hơn trong ảnh.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R01-4-Q1","question":"我们去哪儿接老师？","answer":"车站","options":["车站","卖早饭的店","楼门口","楼后"],"explanation":"Đối chiếu đoạn: “今天我们去车站接新老师。” → Chọn “车站”."},{"id":"H3-R01-4-Q2","question":"以前我们在哪儿见过老师的照片？","answer":"网上","options":["网上","楼门口","楼后","规定的地方"],"explanation":"Đối chiếu đoạn: “以前只在网上见过他的照片，所以大家有点儿着急。” → Chọn “网上”."},{"id":"H3-R01-4-Q3","question":"老师的头发怎么样？","answer":"很短","options":["很短","每个人都看得很清楚","可以","少一些，但是更满意"],"explanation":"Đối chiếu đoạn: “一位年轻人向我们走来，他的头发很短，身高一米八左右。” → Chọn “很短”."},{"id":"H3-R01-4-Q4","question":"老师比照片上看起来怎么样？","answer":"更年轻","options":["更年轻","可以","少一些，但是更满意","不靠门"],"explanation":"Đối chiếu đoạn: “他比照片上看起来更年轻。” → Chọn “更年轻”."}]},{"id":"H3-R01-5","lesson":1,"title":"Kiểm tra trước khi đi","text":"早上出门以前，妈妈让我检查护照和手机。我打开包，发现手机在，护照但是不见了。我很着急，到处找。妈妈让我先想一想昨天做过什么。我这才想起来，昨天晚上把护照放进了箱子。找到以后，我们一起出门了。","pinyin":"Zǎo shàng chū mén yǐ qián， mā ma ràng wǒ jiǎn chá hù zhào hé shǒu jī。 wǒ dǎ kāi bāo， fā xiàn shǒu jī zài， hù zhào dàn shì bú jiàn le。 wǒ hěn zháo jí， dào chù zhǎo。 mā ma ràng wǒ xiān xiǎng yī xiǎng zuó tiān zuò guò shén me。 wǒ zhè cái xiǎng qǐ lái， zuó tiān wǎn shàng bǎ hù zhào fàng jìn le xiāng zi。 zhǎo dào yǐ hòu， wǒ men yì qǐ chū mén le。","translation":"Trước khi ra ngoài, mẹ bảo tôi kiểm tra hộ chiếu và điện thoại. Điện thoại còn nhưng không thấy hộ chiếu. Tôi lo lắng tìm khắp nơi. Mẹ bảo nhớ lại việc hôm qua. Tôi mới nhớ tối qua đã cất hộ chiếu vào va li. Tìm được rồi chúng tôi cùng ra ngoài.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R01-5-Q1","question":"妈妈让我检查什么？","answer":"护照和手机","options":["护照和手机","蛋糕","山和河照片","面包"],"explanation":"Đối chiếu đoạn: “早上出门以前，妈妈让我检查护照和手机。” → Chọn “护照和手机”."},{"id":"H3-R01-5-Q2","question":"刚打开包时我看到了什么？","answer":"手机","options":["手机","山和河照片","面包","鸡肉饭"],"explanation":"Đối chiếu đoạn: “我打开包，发现手机在，护照但是不见了。” → Chọn “手机”."},{"id":"H3-R01-5-Q3","question":"护照最后在哪儿找到？","answer":"箱子里","options":["箱子里","楼后","规定的地方","北京"],"explanation":"Đối chiếu đoạn: “我这才想起来，昨天晚上把护照放进了箱子。” → Chọn “箱子里”."},{"id":"H3-R01-5-Q4","question":"妈妈让我先做什么？","answer":"想一想昨天做过什么","options":["想一想昨天做过什么","先看说明","按医生说的做","吃早饭"],"explanation":"Đối chiếu đoạn: “妈妈让我先想一想昨天做过什么。” → Chọn “想一想昨天做过什么”."}]},{"id":"H3-R02","lesson":2,"title":"Gọi món cùng bạn","text":"周末，我们到一家饭馆吃饭。服务员拿来菜单，让我们慢慢看。朋友喜欢吃鱼，我想吃饺子。我们还点了两杯茶。这家饭馆的菜味道不错，价格也不贵。吃完饭，我们一起去散步。","pinyin":"Zhōu mò， wǒ men dào yī jiā fàn guǎn chī fàn。 fú wù yuán ná lái cài dān， ràng wǒ men màn màn kàn。 péng you xǐ huan chī yú， wǒ xiǎng chī jiǎo zi。 wǒ men hái diǎn le liǎng bēi chá。 zhè jiā fàn guǎn de cài wèi dào bù cuò， jià gé yě bù guì。 chī wán fàn， wǒ men yì qǐ qù sàn bù。","translation":"Cuối tuần chúng tôi đến nhà hàng ăn. Nhân viên mang thực đơn và để chúng tôi xem từ từ. Bạn thích cá, tôi muốn ăn sủi cảo. Chúng tôi còn gọi hai cốc trà. Món ăn ngon và giá không đắt. Ăn xong, chúng tôi đi dạo cùng nhau.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R02-Q1","question":"朋友喜欢吃什么？","answer":"鱼","options":["鱼","牛肉","面包","鸡蛋"],"explanation":"Đối chiếu nội dung bài đọc: 鱼"},{"id":"H3-R02-Q2","question":"我们点了几杯茶？","answer":"两杯","options":["两杯","一杯","三杯","四杯"],"explanation":"Đối chiếu nội dung bài đọc: 两杯"},{"id":"H3-R02-Q3","question":"这家饭馆的价格怎么样？","answer":"不贵","options":["不贵","非常贵","没有说","比别家贵"],"explanation":"Đối chiếu nội dung bài đọc: 不贵"},{"id":"H3-R02-Q4","question":"吃完饭以后，我们做什么？","answer":"散步","options":["散步","上课","睡觉","坐飞机"],"explanation":"Đối chiếu nội dung bài đọc: 散步"}]},{"id":"H3-R02-2","lesson":2,"title":"Chọn món cho cả nhà","text":"星期六爸爸不用上班，我们一起去吃饭。妈妈不想吃太油的菜，爸爸说吃什么都可以。我给弟弟看菜单，让他想吃什么就点什么。最后我们点了鱼、菜和米饭。服务员还给我们拿来了热水，大家吃得很开心。","pinyin":"Xīng qī liù bà ba bù yòng shàng bān， wǒ men yì qǐ qù chī fàn。 mā ma bù xiǎng chī tài yóu de cài， bà ba shuō chī shén me dōu kě yǐ。 wǒ gěi dì di kàn cài dān， ràng tā xiǎng chī shén me jiù diǎn shén me。 zuì hòu wǒ men diǎn le yú、 cài hé mǐ fàn。 fú wù yuán huán gěi wǒ men ná lái le rè shuǐ， dà jiā chī de hěn kāi xīn。","translation":"Thứ bảy bố nghỉ làm, cả nhà đi ăn. Mẹ không muốn món nhiều dầu, bố ăn gì cũng được. Tôi đưa thực đơn để em chọn món thích. Cuối cùng gọi cá, rau và cơm. Nhân viên mang nước nóng, mọi người ăn vui vẻ.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R02-2-Q1","question":"爸爸星期六要上班吗？","answer":"不用上班","options":["不用上班","看清楚想拍什么","看书","向她说谢谢"],"explanation":"Đối chiếu đoạn: “星期六爸爸不用上班，我们一起去吃饭。” → Chọn “不用上班”."},{"id":"H3-R02-2-Q2","question":"妈妈不想吃什么样的菜？","answer":"太油的菜","options":["太油的菜","面包和鸡蛋","蛋糕","山和河照片"],"explanation":"Đối chiếu đoạn: “妈妈不想吃太油的菜，爸爸说吃什么都可以。” → Chọn “太油的菜”."},{"id":"H3-R02-2-Q3","question":"谁看菜单点菜？","answer":"弟弟","options":["弟弟","我和妈妈","旁边的姐姐","女儿"],"explanation":"Đối chiếu đoạn: “我给弟弟看菜单，让他想吃什么就点什么。” → Chọn “弟弟”."},{"id":"H3-R02-2-Q4","question":"服务员拿来了什么？","answer":"热水","options":["热水","山和河照片","面包","鸡肉饭"],"explanation":"Đối chiếu đoạn: “服务员还给我们拿来了热水，大家吃得很开心。” → Chọn “热水”."}]},{"id":"H3-R02-3","lesson":2,"title":"Bữa trưa hơi muộn","text":"今天上午工作很多，我到下午一点才去吃午饭。饭馆里人已经不多了，服务员很快就把面条送来了。面条又热又好吃，我把面都吃完了。吃完以后，我没有马上回去，就在旁边的公园走了十分钟。","pinyin":"Jīn tiān shàng wǔ gōng zuò hěn duō， wǒ dào xià wǔ yì diǎn cái qù chī wǔ fàn。 fàn guǎn lǐ rén yǐ jīng bù duō le， fú wù yuán hěn kuài jiù bǎ miàn tiáo sòng lái le。 miàn tiáo yòu rè yòu hǎo chī， wǒ bǎ miàn dōu chī wán le。 chī wán yǐ hòu， wǒ méi yǒu mǎ shàng huí qù， jiù zài páng biān de gōng yuán zǒu le shí fēn zhōng。","translation":"Sáng nay nhiều việc, một giờ chiều tôi mới ăn trưa. Quán đã vắng, nhân viên nhanh chóng mang mì. Mì nóng và ngon, tôi ăn hết. Sau bữa tôi đi bộ mười phút ở công viên bên cạnh rồi mới về.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R02-3-Q1","question":"我几点才去吃午饭？","answer":"下午一点","options":["下午一点","六点","九点","二十分钟"],"explanation":"Đối chiếu đoạn: “今天上午工作很多，我到下午一点才去吃午饭。” → Chọn “下午一点”."},{"id":"H3-R02-3-Q2","question":"我点的是什么？","answer":"面条","options":["面条","鸡蛋","面包和鸡蛋","蛋糕"],"explanation":"Đối chiếu đoạn: “饭馆里人已经不多了，服务员很快就把面条送来了。” → Chọn “面条”."},{"id":"H3-R02-3-Q3","question":"面条怎么样？","answer":"又热又好吃","options":["又热又好吃","不太好","每个人都看得很清楚","可以"],"explanation":"Đối chiếu đoạn: “面条又热又好吃，我把面都吃完了。” → Chọn “又热又好吃”."},{"id":"H3-R02-3-Q4","question":"吃完以后我去哪儿走了走？","answer":"公园","options":["公园","楼后","规定的地方","北京"],"explanation":"Đối chiếu đoạn: “吃完以后，我没有马上回去，就在旁边的公园走了十分钟。” → Chọn “公园”."}]},{"id":"H3-R02-4","lesson":2,"title":"Món ăn ít cay","text":"朋友第一次来我家吃饭，我不知道他能不能吃油多的菜，就先给他打电话。他说自己什么都吃，但是最近身体不太舒服，希望少放一点儿油。妈妈听了以后，做了两个油少的菜。朋友吃完以后说，这顿饭让他想起了自己的家。","pinyin":"Péng you dì yī cì lái wǒ jiā chī fàn， wǒ bù zhī dao tā néng bù néng chī yóu duō de cài， jiù xiān gěi tā dǎ diàn huà。 tā shuō zì jǐ shén me dōu chī， dàn shì zuì jìn shēn tǐ bù tài shū fu， xī wàng shǎo fàng yì diǎn ér yóu。 mā ma tīng le yǐ hòu， zuò le liǎng gè yóu shǎo de cài。 péng you chī wán yǐ hòu shuō， zhè dùn fàn ràng tā xiǎng qǐ le zì jǐ de jiā。","translation":"Bạn lần đầu đến nhà ăn cơm, tôi gọi hỏi có ăn nhiều dầu được không. Bạn ăn mọi thứ nhưng gần đây cơ thể khó chịu nên muốn ít dầu. Mẹ làm hai món ít dầu. Bạn nói bữa cơm gợi nhớ nhà mình.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R02-4-Q1","question":"朋友是第几次来我家吃饭？","answer":"第一次","options":["第一次","五张","二十八度","三个"],"explanation":"Đối chiếu đoạn: “朋友第一次来我家吃饭，我不知道他能不能吃油多的菜，就先给他打电话。” → Chọn “第一次”."},{"id":"H3-R02-4-Q2","question":"朋友最近身体怎么样？","answer":"身体","options":["身体","蛋糕","山和河照片","面包"],"explanation":"Đối chiếu đoạn: “他说自己什么都吃，但是最近身体不太舒服，希望少放一点儿油。” → Chọn “身体”."},{"id":"H3-R02-4-Q3","question":"朋友希望少放什么？","answer":"油","options":["油","面包","鸡肉饭","衣服"],"explanation":"Đối chiếu đoạn: “他说自己什么都吃，但是最近身体不太舒服，希望少放一点儿油。” → Chọn “油”."},{"id":"H3-R02-4-Q4","question":"妈妈做了几个油少的菜？","answer":"两个","options":["两个","二十八度","三个","一个"],"explanation":"Đối chiếu đoạn: “妈妈听了以后，做了两个油少的菜。” → Chọn “两个”."}]},{"id":"H3-R02-5","lesson":2,"title":"Chọn quán ăn","text":"下课以后，我们想找个地方吃晚饭。学校门口的新饭馆又近又便宜，可是人太多，可能要等很久。我们讨论了一下，决定去街对面的老店。那里虽然没有那么漂亮，但是不用等，菜的味道也很好。","pinyin":"Xià kè yǐ hòu， wǒ men xiǎng zhǎo gè dì fang chī wǎn fàn。 xué xiào mén kǒu de xīn fàn guǎn yòu jìn yòu pián yi， kě shì rén tài duō， kě néng yào děng hěn jiǔ。 wǒ men tǎo lùn le yī xià， jué dìng qù jiē duì miàn de lǎo diàn。 nà lǐ suī rán méi yǒu nà me piào liàng， dàn shì bù yòng děng， cài de wèi dào yě hěn hǎo。","translation":"Tan học chúng tôi tìm quán ăn tối. Quán mới trước cổng trường gần, rẻ nhưng đông, có thể chờ lâu. Bàn bạc xong chúng tôi sang quán cũ đối diện. Quán không đẹp bằng nhưng không phải đợi, đồ ăn cũng ngon.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R02-5-Q1","question":"我们什么时候去吃晚饭？","answer":"下课以后","options":["下课以后","二十分钟","下班以后","下星期"],"explanation":"Đối chiếu đoạn: “下课以后，我们想找个地方吃晚饭。” → Chọn “下课以后”."},{"id":"H3-R02-5-Q2","question":"学校门口的新饭馆怎么样？","answer":"又近又便宜","options":["又近又便宜","每个人都看得很清楚","可以","少一些，但是更满意"],"explanation":"Đối chiếu đoạn: “学校门口的新饭馆又近又便宜，可是人太多，可能要等很久。” → Chọn “又近又便宜”."},{"id":"H3-R02-5-Q3","question":"我们为什么没去新饭馆？","answer":"人太多，可能要等很久","options":["人太多，可能要等很久","手机没电了","一道题做不出来","怕热"],"explanation":"Đối chiếu đoạn: “学校门口的新饭馆又近又便宜，可是人太多，可能要等很久。” → Chọn “人太多，可能要等很久”."},{"id":"H3-R02-5-Q4","question":"我们最后去哪儿吃饭？","answer":"街对面的老店","options":["街对面的老店","北京","地铁站","花园"],"explanation":"Đối chiếu đoạn: “我们讨论了一下，决定去街对面的老店。” → Chọn “街对面的老店”."}]},{"id":"H3-R03","lesson":3,"title":"Khu nhà mới","text":"我搬到一个新小区。这里离学校很近，走路十分钟就到了。小区里有花，有树，还有一个小商店。晚上很安静。我每天早上在小区里跑步，然后去学校上课。我觉得住在这里很方便。","pinyin":"Wǒ bān dào yí gè xīn xiǎo qū。 zhè lǐ lí xué xiào hěn jìn， zǒu lù shí fēn zhōng jiù dào le。 xiǎo qū lǐ yǒu huā， yǒu shù， hái yǒu yí gè xiǎo shāng diàn。 wǎn shàng hěn ān jìng。 wǒ měi tiān zǎo shàng zài xiǎo qū lǐ pǎo bù， rán hòu qù xué xiào shàng kè。 wǒ jué de zhù zài zhè lǐ hěn fāng biàn。","translation":"Tôi chuyển đến khu dân cư mới. Từ đây đi bộ đến trường chỉ mười phút. Trong khu có hoa, cây và một cửa hàng nhỏ. Buổi tối yên tĩnh. Mỗi sáng tôi chạy bộ rồi đến trường học. Tôi thấy sống ở đây rất tiện.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R03-Q1","question":"从小区走到学校要多久？","answer":"十分钟","options":["十分钟","一个小时","两分钟","半天"],"explanation":"Đối chiếu nội dung bài đọc: 十分钟"},{"id":"H3-R03-Q2","question":"小区晚上怎么样？","answer":"很安静","options":["很安静","很有意思","很冷","很吵"],"explanation":"Đối chiếu nội dung bài đọc: 很安静"},{"id":"H3-R03-Q3","question":"我每天早上先做什么？","answer":"跑步","options":["跑步","买菜","上课","打电话"],"explanation":"Đối chiếu nội dung bài đọc: 跑步"},{"id":"H3-R03-Q4","question":"我觉得住在这里怎么样？","answer":"很方便","options":["很方便","不方便","很累","很远"],"explanation":"Đối chiếu nội dung bài đọc: 很方便"}]},{"id":"H3-R03-2","lesson":3,"title":"Tìm nhà gần trường","text":"以前我住的地方离学校很远，每天坐车要一个小时。这个月我想找一个近一点儿的房子。朋友介绍的小区虽然房间不大，但是附近有地铁站和超市。我去看过以后很喜欢，决定下个月搬进去。","pinyin":"Yǐ qián wǒ zhù de dì fang lí xué xiào hěn yuǎn， měi tiān zuò chē yào yí gè xiǎo shí。 zhè ge yuè wǒ xiǎng zhǎo yí gè jìn yì diǎn ér de fáng zi。 péng you jiè shào de xiǎo qū suī rán fáng jiān bù dà， dàn shì fù jìn yǒu dì tiě zhàn hé chāo shì。 wǒ qù kàn guò yǐ hòu hěn xǐ huan， jué dìng xià gè yuè bān jìn qù。","translation":"Trước đây tôi ở xa trường, mỗi ngày đi xe mất một tiếng. Tháng này tôi tìm nhà gần hơn. Khu bạn giới thiệu phòng không lớn nhưng gần ga tàu điện và siêu thị. Xem nhà xong tôi thích và quyết định tháng sau chuyển đến.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R03-2-Q1","question":"以前坐车去学校要多久？","answer":"一个小时","options":["一个小时","九点","二十分钟","下班以后"],"explanation":"Đối chiếu đoạn: “以前我住的地方离学校很远，每天坐车要一个小时。” → Chọn “一个小时”."},{"id":"H3-R03-2-Q2","question":"谁介绍了这个小区？","answer":"朋友","options":["朋友","全班","我和妈妈","旁边的姐姐"],"explanation":"Đối chiếu đoạn: “朋友介绍的小区虽然房间不大，但是附近有地铁站和超市。” → Chọn “朋友”."},{"id":"H3-R03-2-Q3","question":"房间大不大？","answer":"不大","options":["不大","不太好","每个人都看得很清楚","可以"],"explanation":"Đối chiếu đoạn: “朋友介绍的小区虽然房间不大，但是附近有地铁站和超市。” → Chọn “不大”."},{"id":"H3-R03-2-Q4","question":"我打算什么时候搬进去？","answer":"下个月","options":["下个月","下星期","早饭后和晚饭后","三天"],"explanation":"Đối chiếu đoạn: “我去看过以后很喜欢，决定下个月搬进去。” → Chọn “下个月”."}]},{"id":"H3-R03-3","lesson":3,"title":"Cửa hàng trong khu nhà","text":"我们小区里开了一家小商店。店不大，东西但是很齐全，可以买水果、面包和牛奶。昨天晚上我做饭时发现没有鸡蛋了，走了两分钟就买到了。以前要去很远的超市，现在方便多了。邻居们都说这家店开得好。","pinyin":"Wǒ men xiǎo qū lǐ kāi le yī jiā xiǎo shāng diàn。 diàn bù dà， dōng xi dàn shì hěn qí quán， kě yǐ mǎi shuǐ guǒ、 miàn bāo hé niú nǎi。 zuó tiān wǎn shàng wǒ zuò fàn shí fā xiàn méi yǒu jī dàn le， zǒu le liǎng fēn zhōng jiù mǎi dào le。 yǐ qián yào qù hěn yuǎn de chāo shì， xiàn zài fāng biàn duō le。 lín jū men dōu shuō zhè jiā diàn kāi dé hǎo。","translation":"Khu tôi có cửa hàng nhỏ mới mở, bán khá đủ đồ như trái cây, bánh mì, sữa. Tối qua nấu ăn mới thấy hết trứng, tôi đi hai phút đã mua được. Trước phải đi siêu thị xa, giờ tiện hơn. Hàng xóm đều khen.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R03-3-Q1","question":"新商店开在哪儿？","answer":"小区里","options":["小区里","卖早饭的店","楼门口","楼后"],"explanation":"Đối chiếu đoạn: “我们小区里开了一家小商店。” → Chọn “小区里”."},{"id":"H3-R03-3-Q2","question":"昨天做饭时我发现少了什么？","answer":"鸡蛋","options":["鸡蛋","蛋糕","山和河照片","鸡肉饭"],"explanation":"Đối chiếu đoạn: “昨天晚上我做饭时发现没有鸡蛋了，走了两分钟就买到了。” → Chọn “鸡蛋”."},{"id":"H3-R03-3-Q3","question":"我走了多久买到鸡蛋？","answer":"两分钟","options":["两分钟","下班以后","下星期","早饭后和晚饭后"],"explanation":"Đối chiếu đoạn: “昨天晚上我做饭时发现没有鸡蛋了，走了两分钟就买到了。” → Chọn “两分钟”."},{"id":"H3-R03-3-Q4","question":"和以前比，现在怎么样？","answer":"方便多了","options":["方便多了","不靠门","贵一点儿","大一点儿的"],"explanation":"Đối chiếu đoạn: “以前要去很远的超市，现在方便多了。” → Chọn “方便多了”."}]},{"id":"H3-R03-4","lesson":3,"title":"Buổi sáng yên tĩnh","text":"搬家以后，我开始早起。每天六点，小区里的路上还没有几个人。我先慢慢走一会儿，再跑步。七点回家的时候，楼下卖早饭的店已经开门了。我买好早饭带回家，和家人一起吃，然后去上班。","pinyin":"Bān jiā yǐ hòu， wǒ kāi shǐ zǎo qǐ。 měi tiān liù diǎn， xiǎo qū lǐ de lù shàng hái méi yǒu jǐ gè rén。 wǒ xiān màn màn zǒu yī huì er， zài pǎo bù。 qī diǎn huí jiā de shí hou， lóu xià mài zǎo fàn de diàn yǐ jīng kāi mén le。 wǒ mǎi hǎo zǎo fàn dài huí jiā， hé jiā rén yì qǐ chī， rán hòu qù shàng bān。","translation":"Sau khi chuyển nhà tôi bắt đầu dậy sớm. Sáu giờ đường trong khu còn vắng. Tôi đi bộ rồi chạy, bảy giờ về thì quán ăn sáng dưới nhà đã mở. Tôi mua đồ mang về ăn cùng gia đình rồi đi làm.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R03-4-Q1","question":"我每天几点开始在小区活动？","answer":"六点","options":["六点","二十分钟","下班以后","下星期"],"explanation":"Đối chiếu đoạn: “每天六点，小区里的路上还没有几个人。” → Chọn “六点”."},{"id":"H3-R03-4-Q2","question":"我先做什么？","answer":"慢慢走一会儿","options":["慢慢走一会儿","爬山","先看说明","按医生说的做"],"explanation":"Đối chiếu đoạn: “我先慢慢走一会儿，再跑步。” → Chọn “慢慢走一会儿”."},{"id":"H3-R03-4-Q3","question":"七点回家时什么店开门了？","answer":"卖早饭的店","options":["卖早饭的店","北京","地铁站","花园"],"explanation":"Đối chiếu đoạn: “七点回家的时候，楼下卖早饭的店已经开门了。” → Chọn “卖早饭的店”."},{"id":"H3-R03-4-Q4","question":"我和谁一起吃早饭？","answer":"家人","options":["家人","女儿","妹妹","老师"],"explanation":"Đối chiếu đoạn: “我买好早饭带回家，和家人一起吃，然后去上班。” → Chọn “家人”."}]},{"id":"H3-R03-5","lesson":3,"title":"Xe đạp để ở đâu","text":"昨天我回小区时，把自行车停在了楼门口。晚上下楼，发现车不见了，急坏了。邻居告诉我，门口不能停车，工作人员把车放到后面去了。我到楼后找到了车。从那以后，我每次都把车停在规定的地方。","pinyin":"Zuó tiān wǒ huí xiǎo qū shí， bǎ zì xíng chē tíng zài le lóu mén kǒu。 wǎn shàng xià lóu， fā xiàn chē bú jiàn le， jí huài le。 lín jū gào sù wǒ， mén kǒu bù néng tíng chē， gōng zuò rén yuán bǎ chē fàng dào hòu miàn qù le。 wǒ dào lóu hòu zhǎo dào le chē。 cóng nà yǐ hòu， wǒ měi cì dōu bǎ chē tíng zài guī dìng de dì fang。","translation":"Hôm qua tôi để xe đạp ở cửa tòa nhà. Tối xuống không thấy xe nên rất lo. Hàng xóm nói cửa không được đỗ, nhân viên chuyển ra sau. Tôi ra sau tìm thấy. Từ đó tôi luôn đỗ đúng nơi quy định.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R03-5-Q1","question":"昨天我把自行车停在哪儿？","answer":"楼门口","options":["楼门口","北京","地铁站","花园"],"explanation":"Đối chiếu đoạn: “昨天我回小区时，把自行车停在了楼门口。” → Chọn “楼门口”."},{"id":"H3-R03-5-Q2","question":"谁告诉我车被拿走了？","answer":"邻居","options":["邻居","旁边的姐姐","女儿","妹妹"],"explanation":"Đối chiếu đoạn: “邻居告诉我，门口不能停车，工作人员把车放到后面去了。” → Chọn “邻居”."},{"id":"H3-R03-5-Q3","question":"我最后在哪儿找到车？","answer":"楼后","options":["楼后","花园","床边","门旁边"],"explanation":"Đối chiếu đoạn: “我到楼后找到了车。” → Chọn “楼后”."},{"id":"H3-R03-5-Q4","question":"以后我把车停在哪儿？","answer":"规定的地方","options":["规定的地方","床边","门旁边","河边"],"explanation":"Đối chiếu đoạn: “从那以后，我每次都把车停在规定的地方。” → Chọn “规定的地方”."}]},{"id":"H3-R04","lesson":4,"title":"Chọn khách sạn","text":"我们去北京旅游，在网上找宾馆。一家宾馆离车站近，但是房间很小。第二家宾馆远一点儿，但是房间很干净，也比较安静。妈妈想好好休息，所以我们选了第二家。第二天，我们坐公共汽车去车站。","pinyin":"Wǒ men qù běi jīng lǚ yóu， zài wǎng shàng zhǎo bīn guǎn。 yī jiā bīn guǎn lí chē zhàn jìn， dàn shì fáng jiān hěn xiǎo。 dì èr jiā bīn guǎn yuǎn yì diǎn ér， dàn shì fáng jiān hěn gān jìng， yě bǐ jiào ān jìng。 mā ma xiǎng hǎo hǎo xiū xī， suǒ yǐ wǒ men xuǎn le dì èr jiā。 dì èr tiān， wǒ men zuò gōng gòng qì chē qù chē zhàn。","translation":"Chúng tôi đi du lịch Bắc Kinh và tìm khách sạn trên mạng. Một nơi gần bến xe nhưng phòng nhỏ. Nơi khác xa hơn chút nhưng sạch và yên tĩnh. Mẹ muốn nghỉ ngơi nên chúng tôi chọn nơi thứ hai. Hôm sau chúng tôi đi xe buýt đến bến.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R04-Q1","question":"我们在哪儿找宾馆？","answer":"网上","options":["网上","机场","学校","公园"],"explanation":"Đối chiếu nội dung bài đọc: 网上"},{"id":"H3-R04-Q2","question":"第一家宾馆的房间怎么样？","answer":"很小","options":["很小","很大","很脏","很冷"],"explanation":"Đối chiếu nội dung bài đọc: 很小"},{"id":"H3-R04-Q3","question":"我们为什么选第二家？","answer":"妈妈想好好休息","options":["妈妈想好好休息","离车站最近","没有别的房间","朋友住在那里"],"explanation":"Đối chiếu nội dung bài đọc: 妈妈想好好休息"},{"id":"H3-R04-Q4","question":"第二天怎么去车站？","answer":"坐公共汽车","options":["坐公共汽车","走路","骑车","坐飞机"],"explanation":"Đối chiếu nội dung bài đọc: 坐公共汽车"}]},{"id":"H3-R04-2","lesson":4,"title":"Đặt phòng qua điện thoại","text":"下周我们要去北京，爸爸让我帮忙订房间。我在网上看到一家宾馆，离地铁站很近。我给服务台打电话，问还有没有两个人住的房间。工作人员说有，还告诉我房间里可以上网。我订了两个晚上，把名字发给了爸爸。","pinyin":"Xià zhōu wǒ men yào qù běi jīng， bà ba ràng wǒ bāng máng dìng fáng jiān。 wǒ zài wǎng shàng kàn dào yī jiā bīn guǎn， lí dì tiě zhàn hěn jìn。 wǒ gěi fú wù tái dǎ diàn huà， wèn hái yǒu méi yǒu liǎng gè rén zhù de fáng jiān。 gōng zuò rén yuán shuō yǒu， hái gào sù wǒ fáng jiān lǐ kě yǐ shàng wǎng。 wǒ dìng le liǎng gè wǎn shàng， bǎ míng zi fā gěi le bà ba。","translation":"Tuần sau chúng tôi đi Bắc Kinh, bố nhờ đặt phòng. Tôi thấy một khách sạn gần ga tàu điện và gọi hỏi phòng hai người. Nhân viên nói còn và có mạng trong phòng. Tôi đặt hai đêm rồi gửi địa chỉ cho bố.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R04-2-Q1","question":"我们下周要去哪儿？","answer":"北京","options":["北京","楼门口","楼后","规定的地方"],"explanation":"Đối chiếu đoạn: “下周我们要去北京，爸爸让我帮忙订房间。” → Chọn “北京”."},{"id":"H3-R04-2-Q2","question":"宾馆离什么地方很近？","answer":"地铁站","options":["地铁站","楼后","规定的地方","花园"],"explanation":"Đối chiếu đoạn: “我在网上看到一家宾馆，离地铁站很近。” → Chọn “地铁站”."},{"id":"H3-R04-2-Q3","question":"我打电话给谁？","answer":"服务台的工作人员","options":["服务台的工作人员","旁边的姐姐","女儿","妹妹"],"explanation":"Đối chiếu đoạn: “我给服务台打电话，问还有没有两个人住的房间。” → Chọn “服务台的工作人员”."},{"id":"H3-R04-2-Q4","question":"我订了几个晚上？","answer":"两个晚上","options":["两个晚上","一个","第一次","五张"],"explanation":"Đối chiếu đoạn: “我订了两个晚上，把名字发给了爸爸。” → Chọn “两个晚上”."}]},{"id":"H3-R04-3","lesson":4,"title":"Đổi phòng yên tĩnh hơn","text":"我们住进宾馆以后，发现门外的车很多，晚上有点儿吵。妈妈睡不好，第二天去服务台问能不能换房间。工作人员带我们看了楼上的一间，门对着花园。虽然小一点儿，但是安静多了，我们很满意。","pinyin":"Wǒ men zhù jìn bīn guǎn yǐ hòu， fā xiàn mén wài de chē hěn duō， wǎn shàng yǒu diǎn ér chǎo。 mā ma shuì bù hǎo， dì èr tiān qù fú wù tái wèn néng bù néng huàn fáng jiān。 gōng zuò rén yuán dài wǒ men kàn le lóu shàng de yī jiān， mén duì zhe huā yuán。 suī rán xiǎo yì diǎn ér， dàn shì ān jìng duō le， wǒ men hěn mǎn yì。","translation":"Nhận phòng xong chúng tôi thấy ngoài cửa nhiều xe, tối hơi ồn. Mẹ ngủ không ngon nên hôm sau hỏi đổi phòng. Nhân viên dẫn xem phòng tầng trên nhìn ra vườn. Phòng nhỏ hơn chút nhưng yên tĩnh, chúng tôi hài lòng.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R04-3-Q1","question":"第一间房间晚上怎么样？","answer":"有点儿吵","options":["有点儿吵","不太好","每个人都看得很清楚","可以"],"explanation":"Đối chiếu đoạn: “我们住进宾馆以后，发现门外的车很多，晚上有点儿吵。” → Chọn “有点儿吵”."},{"id":"H3-R04-3-Q2","question":"谁睡不好？","answer":"妈妈","options":["妈妈","旁边的姐姐","女儿","妹妹"],"explanation":"Đối chiếu đoạn: “妈妈睡不好，第二天去服务台问能不能换房间。” → Chọn “妈妈”."},{"id":"H3-R04-3-Q3","question":"新房间的门对着哪儿？","answer":"花园","options":["花园","规定的地方","北京","地铁站"],"explanation":"Đối chiếu đoạn: “工作人员带我们看了楼上的一间，门对着花园。” → Chọn “花园”."},{"id":"H3-R04-3-Q4","question":"新房间和原来的相比怎么样？","answer":"小一点儿，但是更安静","options":["小一点儿，但是更安静","不靠门","贵一点儿","大一点儿的"],"explanation":"Đối chiếu đoạn: “虽然小一点儿，但是安静多了，我们很满意。” → Chọn “小一点儿，但是更安静”."}]},{"id":"H3-R04-4","lesson":4,"title":"Bữa sáng ở khách sạn","text":"这家宾馆的早饭跟别的地方不一样。每天早上都有热面条，也有水果和牛奶。爸爸喜欢吃面，妈妈只吃面包和鸡蛋。我什么都想尝一点。服务员说早饭到九点结束，所以我们决定明天早一点下来。","pinyin":"Zhè jiā bīn guǎn de zǎo fàn gēn bié de dì fang bù yí yàng。 měi tiān zǎo shàng dōu yǒu rè miàn tiáo， yě yǒu shuǐ guǒ hé niú nǎi。 bà ba xǐ huan chī miàn， mā ma zhǐ chī miàn bāo hé jī dàn。 wǒ shén me dōu xiǎng cháng yì diǎn。 fú wù yuán shuō zǎo fàn dào jiǔ diǎn jié shù， suǒ yǐ wǒ men jué dìng míng tiān zǎo yì diǎn xià lái。","translation":"Bữa sáng ở khách sạn này khác nơi khác: có mì nóng, trái cây, sữa. Bố thích mì, mẹ chỉ ăn bánh mì và trứng. Tôi muốn thử mỗi thứ một chút. Bữa sáng kết thúc lúc chín giờ nên chúng tôi định mai xuống sớm.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R04-4-Q1","question":"爸爸喜欢吃什么？","answer":"面条","options":["面条","鸡肉饭","衣服","蓝色"],"explanation":"Đối chiếu đoạn: “爸爸喜欢吃面，妈妈只吃面包和鸡蛋。” → Chọn “面条”."},{"id":"H3-R04-4-Q2","question":"妈妈吃什么？","answer":"面包和鸡蛋","options":["面包和鸡蛋","衣服","蓝色","运动鞋"],"explanation":"Đối chiếu đoạn: “爸爸喜欢吃面，妈妈只吃面包和鸡蛋。” → Chọn “面包和鸡蛋”."},{"id":"H3-R04-4-Q3","question":"早饭几点结束？","answer":"九点","options":["九点","早饭后和晚饭后","三天","十点半"],"explanation":"Đối chiếu đoạn: “服务员说早饭到九点结束，所以我们决定明天早一点下来。” → Chọn “九点”."},{"id":"H3-R04-4-Q4","question":"我们决定明天怎么做？","answer":"早一点下来","options":["早一点下来","吃早饭","散步","篮球比赛"],"explanation":"Đối chiếu đoạn: “服务员说早饭到九点结束，所以我们决定明天早一点下来。” → Chọn “早一点下来”."}]},{"id":"H3-R04-5","lesson":4,"title":"Trước khi trả phòng","text":"早上离开宾馆以前，我们把东西都准备好了。爸爸去服务台问一下，妈妈又检查了一遍房间。她在床边发现了我的手机，马上叫住我。我很不好意思。爸爸说，出门不能只看行李，重要的东西要一个一个检查。","pinyin":"Zǎo shàng lí kāi bīn guǎn yǐ qián， wǒ men bǎ dōng xi dōu zhǔn bèi hǎo le。 bà ba qù fú wù tái wèn yī xià， mā ma yòu jiǎn chá le yī biàn fáng jiān。 tā zài chuáng biān fā xiàn le wǒ de shǒu jī， mǎ shàng jiào zhù wǒ。 wǒ hěn bù hǎo yì sī。 bà ba shuō， chū mén bù néng zhǐ kàn xíng lǐ， zhòng yào de dōng xi yào yí gè yí gè jiǎn chá。","translation":"Trước khi rời khách sạn chúng tôi thu xếp đồ. Bố đến hỏi, mẹ kiểm tra lại và thấy điện thoại của tôi cạnh giường. Mẹ gọi tôi, tôi ngại quá. Bố nói không chỉ nhìn hành lý mà phải kiểm tra từng đồ quan trọng.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R04-5-Q1","question":"谁去服务台问一下？","answer":"爸爸","options":["爸爸","妹妹","老师","姐姐"],"explanation":"Đối chiếu đoạn: “爸爸去服务台问一下，妈妈又检查了一遍房间。” → Chọn “爸爸”."},{"id":"H3-R04-5-Q2","question":"妈妈在哪儿发现手机？","answer":"床边","options":["床边","北京","地铁站","花园"],"explanation":"Đối chiếu đoạn: “她在床边发现了我的手机，马上叫住我。” → Chọn “床边”."},{"id":"H3-R04-5-Q3","question":"手机是谁的？","answer":"我的","options":["我的","姐姐","附近的店员","学校的"],"explanation":"Đối chiếu đoạn: “她在床边发现了我的手机，马上叫住我。” → Chọn “我的”."},{"id":"H3-R04-5-Q4","question":"爸爸建议怎么检查重要的东西？","answer":"一个一个检查","options":["一个一个检查","散步","篮球比赛","一起努力"],"explanation":"Đối chiếu đoạn: “爸爸说，出门不能只看行李，重要的东西要一个一个检查。” → Chọn “一个一个检查”."}]},{"id":"H3-R05","lesson":5,"title":"Chụp ảnh trong công viên","text":"星期天，我和妹妹去公园拍照片。开始的时候，她站得太远，照片里看不到她的脸。我请她走近一点儿，再站到树旁边。这样拍出来的照片好看多了。回家以后，她把照片发给妈妈看。","pinyin":"Xīng qī tiān， wǒ hé mèi mei qù gōng yuán pāi zhào piān。 kāi shǐ de shí hou， tā zhàn dé tài yuǎn， zhào piān lǐ kàn bú dào tā de liǎn。 wǒ qǐng tā zǒu jìn yì diǎn ér， zài zhàn dào shù páng biān。 zhè yàng pāi chū lái de zhào piān hǎo kàn duō le。 huí jiā yǐ hòu， tā bǎ zhào piān fā gěi mā ma kàn。","translation":"Chủ nhật tôi cùng em gái chụp ảnh ở công viên. Ban đầu em đứng quá xa nên ảnh không rõ mặt. Tôi bảo em lại gần và đứng cạnh cây. Ảnh chụp như vậy đẹp hơn nhiều. Về nhà em gửi ảnh cho mẹ xem.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R05-Q1","question":"我们去哪儿拍照片？","answer":"公园","options":["公园","机场","饭馆","医院"],"explanation":"Đối chiếu nội dung bài đọc: 公园"},{"id":"H3-R05-Q2","question":"开始为什么看不到妹妹的脸？","answer":"她站得太远","options":["她站得太远","天太黑","没有手机","她没来"],"explanation":"Đối chiếu nội dung bài đọc: 她站得太远"},{"id":"H3-R05-Q3","question":"后来妹妹站在哪儿？","answer":"树旁边","options":["树旁边","车里","门外","桌子上"],"explanation":"Đối chiếu nội dung bài đọc: 树旁边"},{"id":"H3-R05-Q4","question":"妹妹把照片发给谁？","answer":"妈妈","options":["妈妈","老师","医生","同学"],"explanation":"Đối chiếu nội dung bài đọc: 妈妈"}]},{"id":"H3-R05-2","lesson":5,"title":"Chụp ảnh cả lớp","text":"今天是我们在这所学校上课的最后一天，老师想给全班拍一张照片。开始大家站得不太好，前面的人和后面的人站得太近了。老师让个子高的站在后面，其他人坐在前面。照片拍好以后，每个人都能看得很清楚。","pinyin":"Jīn tiān shì wǒ men zài zhè suǒ xué xiào shàng kè de zuì hòu yī tiān， lǎo shī xiǎng gěi quán bān pāi yī zhāng zhào piān。 kāi shǐ dà jiā zhàn dé bù tài hǎo， qián miàn de rén hé hòu miàn de rén zhàn dé tài jìn le。 lǎo shī ràng gè zi gāo de zhàn zài hòu miàn， qí tā rén zuò zài qián miàn。 zhào piān pāi hǎo yǐ hòu， měi gè rén dōu néng kàn de hěn qīng chǔ。","translation":"Hôm nay là buổi học cuối ở trường, thầy muốn chụp ảnh lớp. Ban đầu mọi người đứng lộn xộn, người trước che người sau. Thầy bảo người cao đứng sau, những người khác ngồi trước. Chụp xong ai cũng rõ.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R05-2-Q1","question":"老师想给谁拍照片？","answer":"全班","options":["全班","教她做蛋糕的朋友","我和妈妈","旁边的姐姐"],"explanation":"Đối chiếu đoạn: “今天是我们在这所学校上课的最后一天，老师想给全班拍一张照片。” → Chọn “全班”."},{"id":"H3-R05-2-Q2","question":"开始大家站得怎么样？","answer":"不太好","options":["不太好","每个人都看得很清楚","可以","少一些，但是更满意"],"explanation":"Đối chiếu đoạn: “开始大家站得不太好，前面的人和后面的人站得太近了。” → Chọn “不太好”."},{"id":"H3-R05-2-Q3","question":"个子高的人站在哪儿？","answer":"后面","options":["后面","楼后","规定的地方","北京"],"explanation":"Đối chiếu đoạn: “老师让个子高的站在后面，其他人坐在前面。” → Chọn “后面”."},{"id":"H3-R05-2-Q4","question":"最后照片拍得怎么样？","answer":"每个人都看得很清楚","options":["每个人都看得很清楚","不靠门","贵一点儿","大一点儿的"],"explanation":"Đối chiếu đoạn: “照片拍好以后，每个人都能看得很清楚。” → Chọn “每个人都看得很清楚”."}]},{"id":"H3-R05-3","lesson":5,"title":"Ánh sáng bên cửa sổ","text":"妹妹想给自己做的蛋糕拍照片，可是放在桌子上总是拍不好。我发现房间里不太亮，就建议她把蛋糕放到门旁边。妹妹试了一下，照片果然好看多了。她没有马上吃蛋糕，先把照片发给了教她做蛋糕的朋友。","pinyin":"Mèi mei xiǎng gěi zì jǐ zuò de dàn gāo pāi zhào piān， kě shì fàng zài zhuō zi shàng zǒng shì pāi bù hǎo。 wǒ fā xiàn fáng jiān lǐ bù tài liàng， jiù jiàn yì tā bǎ dàn gāo fàng dào mén páng biān。 mèi mei shì le yī xià， zhào piān guǒ rán hǎo kàn duō le。 tā méi yǒu mǎ shàng chī dàn gāo， xiān bǎ zhào piān fā gěi le jiāo tā zuò dàn gāo de péng you。","translation":"Em muốn chụp chiếc bánh mình làm nhưng chụp trên bàn chưa đẹp. Tôi thấy phòng tối nên gợi ý đặt bánh bên cửa. Ảnh đẹp hơn hẳn. Em chưa ăn ngay mà gửi ảnh cho người bạn đã dạy làm bánh.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R05-3-Q1","question":"妹妹想拍什么？","answer":"蛋糕","options":["蛋糕","面包和鸡蛋","山和河照片","面包"],"explanation":"Đối chiếu đoạn: “妹妹想给自己做的蛋糕拍照片，可是放在桌子上总是拍不好。” → Chọn “蛋糕”."},{"id":"H3-R05-3-Q2","question":"开始为什么拍不好？","answer":"房间里不太亮","options":["房间里不太亮","手机没电了","一道题做不出来","怕热"],"explanation":"Đối chiếu đoạn: “我发现房间里不太亮，就建议她把蛋糕放到门旁边。” → Chọn “房间里不太亮”."},{"id":"H3-R05-3-Q3","question":"我建议把蛋糕放在哪儿？","answer":"门旁边","options":["门旁边","规定的地方","北京","地铁站"],"explanation":"Đối chiếu đoạn: “我发现房间里不太亮，就建议她把蛋糕放到门旁边。” → Chọn “门旁边”."},{"id":"H3-R05-3-Q4","question":"妹妹先把照片发给了谁？","answer":"教她做蛋糕的朋友","options":["教她做蛋糕的朋友","姐姐","附近的店员","学校的"],"explanation":"Đối chiếu đoạn: “她没有马上吃蛋糕，先把照片发给了教她做蛋糕的朋友。” → Chọn “教她做蛋糕的朋友”."}]},{"id":"H3-R05-4","lesson":5,"title":"Chọn ảnh gửi cho bà","text":"我们周末去公园玩，拍了很多照片。回家以后，我和姐姐一起选照片给奶奶看。姐姐喜欢山和河，我但是觉得有家人的照片更有意思。最后我们选了五张，其中三张都有爷爷。奶奶看到照片，高兴得很，说下次也要一起去。","pinyin":"Wǒ men zhōu mò qù gōng yuán wán， pāi le hěn duō zhào piān。 huí jiā yǐ hòu， wǒ hé jiě jie yì qǐ xuǎn zhào piān gěi nǎi nai kàn。 jiě jie xǐ huan shān hé hé， wǒ dàn shì jué de yǒu jiā rén de zhào piān gèng yǒu yì si。 zuì hòu wǒ men xuǎn le wǔ zhāng， qí zhōng sān zhāng dōu yǒu yé ye。 nǎi nai kàn dào zhào piān， gāo xìng de hěn， shuō xià cì yě yào yì qǐ qù。","translation":"Cuối tuần chúng tôi đi công viên và chụp nhiều ảnh. Về nhà tôi cùng chị chọn ảnh cho bà. Chị thích phong cảnh, tôi thấy ảnh có gia đình thú vị hơn. Chúng tôi chọn năm ảnh, ba ảnh có ông. Bà rất vui và muốn lần sau đi cùng.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R05-4-Q1","question":"我们在哪儿拍了照片？","answer":"公园","options":["公园","规定的地方","北京","地铁站"],"explanation":"Đối chiếu đoạn: “我们周末去公园玩，拍了很多照片。” → Chọn “公园”."},{"id":"H3-R05-4-Q2","question":"姐姐喜欢什么样的照片？","answer":"山和河照片","options":["山和河照片","面包","鸡肉饭","衣服"],"explanation":"Đối chiếu đoạn: “姐姐喜欢山和河，我但是觉得有家人的照片更有意思。” → Chọn “山和河照片”."},{"id":"H3-R05-4-Q3","question":"最后选了几张照片？","answer":"五张","options":["五张","一个","第一次","两个"],"explanation":"Đối chiếu đoạn: “最后我们选了五张，其中三张都有爷爷。” → Chọn “五张”."},{"id":"H3-R05-4-Q4","question":"奶奶下次想做什么？","answer":"一起去公园","options":["一起去公园","散步","篮球比赛","一起努力"],"explanation":"Đối chiếu đoạn: “奶奶看到照片，高兴得很，说下次也要一起去。” → Chọn “一起去公园”."}]},{"id":"H3-R05-5","lesson":5,"title":"Học chụp ảnh bằng điện thoại","text":"朋友说，拍照片不一定要用很贵的相机，手机也可以拍得很好。他带我到河边，让我先看清楚想拍什么，再找合适的地方。我以前总是一到地方就拍，这次慢慢地想了一下。虽然照片不多，但是比以前满意多了。","pinyin":"Péng you shuō， pāi zhào piān bù yí dìng yào yòng hěn guì de xiàng jī， shǒu jī yě kě yǐ pāi de hěn hǎo。 tā dài wǒ dào hé biān， ràng wǒ xiān kàn qīng chǔ xiǎng pāi shén me， zài zhǎo hé shì de dì fang。 wǒ yǐ qián zǒng shì yī dào dì fang jiù pāi， zhè cì màn màn de xiǎng le yī xià。 suī rán zhào piān bù duō， dàn shì bǐ yǐ qián mǎn yì duō le。","translation":"Bạn nói không nhất thiết cần máy ảnh đắt, điện thoại cũng chụp đẹp. Bạn dẫn tôi ra bờ sông, bảo quan sát rồi chọn vị trí. Trước tôi đến là chụp ngay, lần này suy nghĩ kỹ hơn. Ảnh ít nhưng tôi hài lòng hơn.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R05-5-Q1","question":"朋友说手机能不能拍好照片？","answer":"可以","options":["可以","少一些，但是更满意","不靠门","贵一点儿"],"explanation":"Đối chiếu đoạn: “朋友说，拍照片不一定要用很贵的相机，手机也可以拍得很好。” → Chọn “可以”."},{"id":"H3-R05-5-Q2","question":"朋友带我去哪儿？","answer":"河边","options":["河边","北京","地铁站","花园"],"explanation":"Đối chiếu đoạn: “他带我到河边，让我先看清楚想拍什么，再找合适的地方。” → Chọn “河边”."},{"id":"H3-R05-5-Q3","question":"朋友让我先做什么？","answer":"看清楚想拍什么","options":["看清楚想拍什么","散步","篮球比赛","一起努力"],"explanation":"Đối chiếu đoạn: “他带我到河边，让我先看清楚想拍什么，再找合适的地方。” → Chọn “看清楚想拍什么”."},{"id":"H3-R05-5-Q4","question":"这次的照片和以前比怎么样？","answer":"少一些，但是更满意","options":["少一些，但是更满意","很舒服","颜色和以前不一样了","很难过"],"explanation":"Đối chiếu đoạn: “虽然照片不多，但是比以前满意多了。” → Chọn “少一些，但是更满意”."}]},{"id":"H3-R06","lesson":6,"title":"Chuyến tàu cao tốc","text":"今天我坐高铁去看朋友。出门太早，我没吃早饭。在车上，我发现手机上可以点外卖，就点了一份米饭和一杯热茶。饭送到的时候还是热的。吃完饭，我给朋友发消息，告诉他我快到了。","pinyin":"Jīn tiān wǒ zuò gāo tiě qù kàn péng you。 chū mén tài zǎo， wǒ méi chī zǎo fàn。 zài chē shàng， wǒ fā xiàn shǒu jī shàng kě yǐ diǎn wài mài， jiù diǎn le yī fèn mǐ fàn hé yī bēi rè chá。 fàn sòng dào de shí hou hái shì rè de。 chī wán fàn， wǒ gěi péng you fā xiāo xī， gào sù tā wǒ kuài dào le。","translation":"Hôm nay tôi đi tàu cao tốc thăm bạn. Ra ngoài sớm quá nên tôi chưa ăn sáng. Trên tàu tôi thấy có thể đặt đồ ăn qua điện thoại, liền gọi một phần cơm và trà nóng. Cơm đến vẫn nóng. Ăn xong tôi nhắn cho bạn là sắp đến.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R06-Q1","question":"我坐什么去看朋友？","answer":"高铁","options":["高铁","飞机","自行车","出租车"],"explanation":"Đối chiếu nội dung bài đọc: 高铁"},{"id":"H3-R06-Q2","question":"我为什么没吃早饭？","answer":"出门太早","options":["出门太早","不饿","没有钱","不喜欢米饭"],"explanation":"Đối chiếu nội dung bài đọc: 出门太早"},{"id":"H3-R06-Q3","question":"我怎么点外卖？","answer":"用手机","options":["用手机","去商店","给妈妈打电话","问司机"],"explanation":"Đối chiếu nội dung bài đọc: 用手机"},{"id":"H3-R06-Q4","question":"饭送到的时候怎么样？","answer":"还是热的","options":["还是热的","已经冷了","没有米饭","太少了"],"explanation":"Đối chiếu nội dung bài đọc: 还是热的"}]},{"id":"H3-R06-2","lesson":6,"title":"Chờ chuyến tàu","text":"今天我们坐高铁去北京。妈妈怕迟到，让我们早一个小时到车站。到了以后，弟弟说有点儿饿，爸爸就带他去买面包。我和妈妈留在原来的地方看行李。车快来的时候，爸爸和弟弟回来了，我们一起排队上车。","pinyin":"Jīn tiān wǒ men zuò gāo tiě qù běi jīng。 mā ma pà chí dào， ràng wǒ men zǎo yí gè xiǎo shí dào chē zhàn。 dào le yǐ hòu， dì di shuō yǒu diǎn ér è， bà ba jiù dài tā qù mǎi miàn bāo。 wǒ hé mā ma liú zài yuán lái de dì fang kàn xíng lǐ。 chē kuài lái de shí hou， bà ba hé dì di huí lái le， wǒ men yì qǐ pái duì shàng chē。","translation":"Hôm nay chúng tôi đi tàu cao tốc đến Bắc Kinh. Mẹ sợ muộn nên đến ga sớm một tiếng. Em đói, bố dẫn mua bánh. Tôi và mẹ ở lại trông hành lý. Gần giờ tàu, bố và em về, cả nhà xếp hàng lên tàu.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R06-2-Q1","question":"我们坐高铁去哪儿？","answer":"北京","options":["北京","楼后","规定的地方","地铁站"],"explanation":"Đối chiếu đoạn: “今天我们坐高铁去北京。” → Chọn “北京”."},{"id":"H3-R06-2-Q2","question":"妈妈让我们提前多久到车站？","answer":"一个小时","options":["一个小时","下星期","早饭后和晚饭后","三天"],"explanation":"Đối chiếu đoạn: “妈妈怕迟到，让我们早一个小时到车站。” → Chọn “一个小时”."},{"id":"H3-R06-2-Q3","question":"爸爸带弟弟去买什么？","answer":"面包","options":["面包","鸡肉饭","衣服","蓝色"],"explanation":"Đối chiếu đoạn: “到了以后，弟弟说有点儿饿，爸爸就带他去买面包。” → Chọn “面包”."},{"id":"H3-R06-2-Q4","question":"谁留下来看行李？","answer":"我和妈妈","options":["我和妈妈","附近的店员","学校的","一个同学"],"explanation":"Đối chiếu đoạn: “我和妈妈留在原来的地方看行李。” → Chọn “我和妈妈”."}]},{"id":"H3-R06-3","lesson":6,"title":"Chỗ ngồi bên cửa sổ","text":"上车以后，我发现自己的座位不靠门，心里有点儿不高兴。旁边的姐姐看见我一直看外面，就问我是不是想坐门旁边。我不好意思地点了点头。她说自己要看书，坐哪儿都一样，就跟我换了座位。我连忙向她说谢谢。","pinyin":"Shàng chē yǐ hòu， wǒ fā xiàn zì jǐ de zuò wèi bù kào mén， xīn lǐ yǒu diǎn ér bù gāo xìng。 páng biān de jiě jie kàn jiàn wǒ yì zhí kàn wài miàn， jiù wèn wǒ shì bú shì xiǎng zuò mén páng biān。 wǒ bù hǎo yì sī dì diǎn le diǎn tóu。 tā shuō zì jǐ yào kàn shū， zuò nǎ ér dōu yī yàng， jiù gēn wǒ huàn le zuò wèi。 wǒ lián máng xiàng tā shuō xiè xie。","translation":"Lên tàu tôi hơi thất vọng vì ghế không gần cửa. Chị bên cạnh thấy tôi nhìn ra ngoài nên hỏi có muốn đổi không. Tôi ngại ngùng gật đầu. Chị đọc sách, ngồi đâu cũng được nên đổi cho tôi. Tôi cảm ơn chị.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R06-3-Q1","question":"我的座位靠门吗？","answer":"不靠门","options":["不靠门","每个人都看得很清楚","可以","少一些，但是更满意"],"explanation":"Đối chiếu đoạn: “上车以后，我发现自己的座位不靠门，心里有点儿不高兴。” → Chọn “不靠门”."},{"id":"H3-R06-3-Q2","question":"旁边的姐姐想做什么？","answer":"看书","options":["看书","吃早饭","散步","篮球比赛"],"explanation":"Đối chiếu đoạn: “她说自己要看书，坐哪儿都一样，就跟我换了座位。” → Chọn “看书”."},{"id":"H3-R06-3-Q3","question":"谁和我换了座位？","answer":"旁边的姐姐","options":["旁边的姐姐","妹妹","老师","附近的店员"],"explanation":"Đối chiếu đoạn: “她说自己要看书，坐哪儿都一样，就跟我换了座位。” → Chọn “旁边的姐姐”."},{"id":"H3-R06-3-Q4","question":"换座位以后我做了什么？","answer":"向她说谢谢","options":["向她说谢谢","篮球比赛","一起努力","传球"],"explanation":"Đối chiếu đoạn: “我连忙向她说谢谢。” → Chọn “向她说谢谢”."}]},{"id":"H3-R06-4","lesson":6,"title":"Đặt cơm trên tàu","text":"中午，高铁上的工作人员告诉我们，可以用手机点饭。我看了菜单，选了一份鸡肉饭，没有点饮料，因为包里带了水。过了一会儿，饭送到了座位上。弟弟想尝一口，我分了一点儿给他。他说下次也要试试。","pinyin":"Zhōng wǔ， gāo tiě shàng de gōng zuò rén yuán gào sù wǒ men， kě yǐ yòng shǒu jī diǎn fàn。 wǒ kàn le cài dān， xuǎn le yī fèn jī ròu fàn， méi yǒu diǎn yǐn liào， yīn wèi bāo lǐ dài le shuǐ。 guò le yī huì er， fàn sòng dào le zuò wèi shàng。 dì di xiǎng cháng yī kǒu， wǒ fēn le yì diǎn ér gěi tā。 tā shuō xià cì yě yào shì shì。","translation":"Buổi trưa nhân viên nói có thể đặt cơm bằng điện thoại. Tôi chọn cơm gà, không gọi đồ uống vì có nước. Một lúc sau cơm được giao đến ghế. Em muốn nếm, tôi chia một ít. Em nói lần sau cũng muốn thử.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R06-4-Q1","question":"我用什么点饭？","answer":"手机","options":["手机","衣服","蓝色","运动鞋"],"explanation":"Đối chiếu đoạn: “中午，高铁上的工作人员告诉我们，可以用手机点饭。” → Chọn “手机”."},{"id":"H3-R06-4-Q2","question":"我点了什么？","answer":"鸡肉饭","options":["鸡肉饭","衣服","蓝色","运动鞋"],"explanation":"Đối chiếu đoạn: “我看了菜单，选了一份鸡肉饭，没有点饮料，因为包里带了水。” → Chọn “鸡肉饭”."},{"id":"H3-R06-4-Q3","question":"为什么没点饮料？","answer":"包里带了水","options":["包里带了水","手有点儿冷","一本书的日期好像不对","水杯里的水流出来了"],"explanation":"Đối chiếu đoạn: “我看了菜单，选了一份鸡肉饭，没有点饮料，因为包里带了水。” → Chọn “包里带了水”."},{"id":"H3-R06-4-Q4","question":"谁想尝一口我的饭？","answer":"弟弟","options":["弟弟","姐姐","附近的店员","学校的"],"explanation":"Đối chiếu đoạn: “弟弟想尝一口，我分了一点儿给他。” → Chọn “弟弟”."}]},{"id":"H3-R06-5","lesson":6,"title":"Nhắc bạn xuống tàu","text":"我在高铁上认识了一位老人。他要去看女儿，但是不太会看手机上的消息。快到站的时候，他担心自己下错站，就问我还有多久。我查了一下，告诉他还有二十分钟。到站以后，我帮他拿行李，一直送到车门口。","pinyin":"Wǒ zài gāo tiě shàng rèn shi le yī wèi lǎo rén。 tā yào qù kàn nǚ ér， dàn shì bù tài huì kàn shǒu jī shàng de xiāo xī。 kuài dào zhàn de shí hou， tā dān xīn zì jǐ xià cuò zhàn， jiù wèn wǒ hái yǒu duō jiǔ。 wǒ chá le yī xià， gào sù tā hái yǒu èr shí fēn zhōng。 dào zhàn yǐ hòu， wǒ bāng tā ná xíng lǐ， yì zhí sòng dào chē mén kǒu。","translation":"Tôi quen một ông lão trên tàu, ông đi thăm con gái nhưng không quen xem tin nhắn. Gần đến ga ông sợ xuống nhầm nên hỏi còn bao lâu. Tôi kiểm tra, còn hai mươi phút. Đến ga tôi giúp mang hành lý ra cửa tàu.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R06-5-Q1","question":"老人坐高铁去看谁？","answer":"女儿","options":["女儿","妹妹","老师","姐姐"],"explanation":"Đối chiếu đoạn: “他要去看女儿，但是不太会看手机上的消息。” → Chọn “女儿”."},{"id":"H3-R06-5-Q2","question":"老人担心什么？","answer":"下错站","options":["下错站","手有点儿冷","一本书的日期好像不对","水杯里的水流出来了"],"explanation":"Đối chiếu đoạn: “快到站的时候，他担心自己下错站，就问我还有多久。” → Chọn “下错站”."},{"id":"H3-R06-5-Q3","question":"我告诉他还有多久到站？","answer":"二十分钟","options":["二十分钟","星期五","星期天","十分钟以后"],"explanation":"Đối chiếu đoạn: “我查了一下，告诉他还有二十分钟。” → Chọn “二十分钟”."},{"id":"H3-R06-5-Q4","question":"到站以后我帮他做了什么？","answer":"拿行李","options":["拿行李","一起努力","传球","跑步"],"explanation":"Đối chiếu đoạn: “到站以后，我帮他拿行李，一直送到车门口。” → Chọn “拿行李”."}]},{"id":"H3-R07","lesson":7,"title":"Chọn quần áo","text":"姐姐要参加朋友的生日会，请我帮她选衣服。她先穿了一条短裤，又试了一条裙子。我觉得裙子比短裤更好看，也更适合今天的活动。姐姐听了我的意见，穿着裙子出门了。","pinyin":"Jiě jie yào cān jiā péng you de shēng rì huì， qǐng wǒ bāng tā xuǎn yī fu。 tā xiān chuān le yī tiáo duǎn kù， yòu shì le yī tiáo qún zi。 wǒ jué de qún zi bǐ duǎn kù gèng hǎo kàn， yě gèng shì hé jīn tiān de huó dòng。 jiě jie tīng le wǒ de yì jiàn， chuān zhe qún zi chū mén le。","translation":"Chị nhờ tôi chọn đồ để dự sinh nhật bạn. Chị mặc thử quần soóc rồi thử váy. Tôi thấy váy đẹp hơn và hợp hoạt động hôm nay hơn. Chị nghe ý kiến tôi và mặc váy ra ngoài.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R07-Q1","question":"姐姐要参加什么活动？","answer":"生日会","options":["生日会","考试","比赛","面试"],"explanation":"Đối chiếu nội dung bài đọc: 生日会"},{"id":"H3-R07-Q2","question":"姐姐先穿了什么？","answer":"短裤","options":["短裤","裙子","大衣","衬衫"],"explanation":"Đối chiếu nội dung bài đọc: 短裤"},{"id":"H3-R07-Q3","question":"我觉得哪件更好看？","answer":"裙子","options":["裙子","短裤","两件都不好看","没有说"],"explanation":"Đối chiếu nội dung bài đọc: 裙子"},{"id":"H3-R07-Q4","question":"姐姐最后穿什么出门？","answer":"裙子","options":["裙子","短裤","衬衫","大衣"],"explanation":"Đối chiếu nội dung bài đọc: 裙子"}]},{"id":"H3-R07-2","lesson":7,"title":"Mua quà cho chị","text":"姐姐下个月过生日，我想送她一件衣服。商店里的裙子有很多颜色，我不知道选哪条。服务员问姐姐多大了，建议我选蓝色的。我觉得这条虽然比红色的贵一点儿，但是更适合姐姐，就买了下来。","pinyin":"Jiě jie xià gè yuè guò shēng rì， wǒ xiǎng sòng tā yī jiàn yī fu。 shāng diàn lǐ de qún zi yǒu hěn duō yán sè， wǒ bù zhī dao xuǎn nǎ tiáo。 fú wù yuán wèn jiě jie duō dà le， jiàn yì wǒ xuǎn lán sè de。 wǒ jué de zhè tiáo suī rán bǐ hóng sè de guì yì diǎn ér， dàn shì gèng shì hé jiě jie， jiù mǎi le xià lái。","translation":"Tháng sau sinh nhật chị, tôi muốn tặng quần áo. Cửa hàng có váy nhiều màu, tôi chưa biết chọn. Nhân viên hỏi tuổi chị rồi gợi ý màu xanh. Váy đắt hơn màu đỏ một chút nhưng hợp chị hơn nên tôi mua.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R07-2-Q1","question":"姐姐什么时候过生日？","answer":"下个月","options":["下个月","下星期","早饭后和晚饭后","三天"],"explanation":"Đối chiếu đoạn: “姐姐下个月过生日，我想送她一件衣服。” → Chọn “下个月”."},{"id":"H3-R07-2-Q2","question":"我想送姐姐什么？","answer":"衣服","options":["衣服","山和河照片","面包","鸡肉饭"],"explanation":"Đối chiếu đoạn: “姐姐下个月过生日，我想送她一件衣服。” → Chọn “衣服”."},{"id":"H3-R07-2-Q3","question":"服务员建议选什么颜色？","answer":"蓝色","options":["蓝色","面包","鸡肉饭","运动鞋"],"explanation":"Đối chiếu đoạn: “服务员问姐姐多大了，建议我选蓝色的。” → Chọn “蓝色”."},{"id":"H3-R07-2-Q4","question":"蓝色的裙子比红色的怎么样？","answer":"贵一点儿","options":["贵一点儿","不靠门","大一点儿的","很舒服"],"explanation":"Đối chiếu đoạn: “我觉得这条虽然比红色的贵一点儿，但是更适合姐姐，就买了下来。” → Chọn “贵一点儿”."}]},{"id":"H3-R07-3","lesson":7,"title":"Quần áo cho chuyến đi","text":"明天学校带我们去爬山。妈妈让我穿运动鞋，不要穿新买的皮鞋。我觉得皮鞋更好看，但是也知道走山路不方便。准备书包的时候，我又放进去一件衣服。山上可能比城里冷，带着总比不带好。","pinyin":"Míng tiān xué xiào dài wǒ men qù pá shān。 mā ma ràng wǒ chuān yùn dòng xié， bú yào chuān xīn mǎi de pí xié。 wǒ jué de pí xié gèng hǎo kàn， dàn shì yě zhī dao zǒu shān lù bù fāng biàn。 zhǔn bèi shū bāo de shí hou， wǒ yòu fàng jìn qù yī jiàn yī fu。 shān shàng kě néng bǐ chéng lǐ lěng， dài zhe zǒng bǐ bù dài hǎo。","translation":"Ngày mai trường tổ chức leo núi. Mẹ dặn mang giày thể thao, không đi giày da mới. Tôi thấy giày da đẹp hơn nhưng đi đường núi không tiện. Tôi bỏ thêm áo vào cặp vì trên núi có thể lạnh hơn trong thành phố.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R07-3-Q1","question":"学校明天带我们做什么？","answer":"爬山","options":["爬山","按医生说的做","吃早饭","散步"],"explanation":"Đối chiếu đoạn: “明天学校带我们去爬山。” → Chọn “爬山”."},{"id":"H3-R07-3-Q2","question":"妈妈建议穿什么鞋？","answer":"运动鞋","options":["运动鞋","面包","鸡肉饭","蓝色"],"explanation":"Đối chiếu đoạn: “妈妈让我穿运动鞋，不要穿新买的皮鞋。” → Chọn “运动鞋”."},{"id":"H3-R07-3-Q3","question":"我又在书包里放了什么？","answer":"衣服","options":["衣服","鸡肉饭","蓝色","说明"],"explanation":"Đối chiếu đoạn: “准备书包的时候，我又放进去一件衣服。” → Chọn “衣服”."},{"id":"H3-R07-3-Q4","question":"为什么要带衣服？","answer":"山上可能更冷","options":["山上可能更冷","一本书的日期好像不对","水杯里的水流出来了","怕别人觉得我学得慢"],"explanation":"Đối chiếu đoạn: “山上可能比城里冷，带着总比不带好。” → Chọn “山上可能更冷”."}]},{"id":"H3-R07-4","lesson":7,"title":"Thử áo trước khi mua","text":"我在网上看到一件很漂亮的衬衫，价格也不贵。朋友告诉我，不同商店的大小可能不一样，最好先看看说明。我照着说明试了一下，发现自己应该买大一点儿的。衣服送来以后，我试了试，穿着很舒服。","pinyin":"Wǒ zài wǎng shàng kàn dào yī jiàn hěn piào liàng de chèn shān， jià gé yě bù guì。 péng you gào sù wǒ， bù tóng shāng diàn de dà xiǎo kě néng bù yí yàng， zuì hǎo
