","example":"请慢慢说，我还没听懂。","examplePinyin":"Qǐng mànmàn shuō, wǒ hái méi tīng dǒng.","translation":"Hãy nói từ từ, tôi vẫn chưa nghe hiểu."},{"id":"hsk3-T01-20","hanzi":"怕","pinyin":"pà","meaning":"sợ","example":"我怕明天下雨，所以今天先去买东西。","examplePinyin":"Wǒ pà míngtiān xià yǔ, suǒyǐ jīntiān xiān qù mǎi dōngxi.","translation":"Tôi sợ mai trời mưa nên hôm nay đi mua đồ trước."},{"id":"hsk3-T01-21","hanzi":"左右","pinyin":"zuǒyòu","meaning":"khoảng, trái phải","example":"我们晚上九点左右回家。","examplePinyin":"Wǒmen wǎnshang jiǔ diǎn zuǒyòu huí jiā.","translation":"Chúng tôi về nhà khoảng chín giờ tối."},{"id":"hsk3-T01-22","hanzi":"只好","pinyin":"zhǐhǎo","meaning":"đành phải","example":"电梯坏了，我们只好走楼梯。","examplePinyin":"Diàntī huài le, wǒmen zhǐhǎo zǒu lóutī.","translation":"Thang máy hỏng nên chúng tôi đành đi cầu thang."},{"id":"hsk3-T01-23","hanzi":"只是","pinyin":"zhǐshì","meaning":"chỉ là","example":"我很想参加比赛，只是最近没有时间。","examplePinyin":"Wǒ hěn xiǎng cānjiā bǐsài, zhǐshì zuìjìn méiyǒu shíjiān.","translation":"Tôi rất muốn thi đấu, chỉ là gần đây không có thời gian."},{"id":"hsk3-T01-24","hanzi":"反正","pinyin":"fǎnzhèng","meaning":"dù sao thì","example":"反正明天放假，我们今天不用早睡。","examplePinyin":"Fǎnzhèng míngtiān fàngjià, wǒmen jīntiān búyòng zǎo shuì.","translation":"Dù sao mai cũng nghỉ, hôm nay không cần ngủ sớm."},{"id":"hsk3-T01-25","hanzi":"更加","pinyin":"gèngjiā","meaning":"càng hơn","example":"了解中国文化以后，我更加喜欢汉语了。","examplePinyin":"Liǎojiě Zhōngguó wénhuà yǐhòu, wǒ gèngjiā xǐhuan Hànyǔ le.","translation":"Sau khi tìm hiểu văn hóa Trung Quốc, tôi càng thích tiếng Trung."},{"id":"hsk3-T01-26","hanzi":"赶快","pinyin":"gǎnkuài","meaning":"nhanh lên","example":"快下雨了，我们赶快回家！","examplePinyin":"Kuài xià yǔ le, wǒmen gǎnkuài huí jiā!","translation":"Sắp mưa rồi, chúng ta mau về nhà!"},{"id":"hsk3-T01-27","hanzi":"根本","pinyin":"gēnběn","meaning":"hoàn toàn, căn bản","example":"我根本不知道他为什么离开。","examplePinyin":"Wǒ gēnběn bù zhīdào tā wèishénme líkāi.","translation":"Tôi hoàn toàn không biết tại sao anh ấy rời đi."},{"id":"hsk3-T01-28","hanzi":"比较","pinyin":"bǐjiào","meaning":"khá, tương đối","example":"这条裙子的大小比较合适。","examplePinyin":"Zhè tiáo qúnzi de dàxiǎo bǐjiào héshì.","translation":"Kích cỡ chiếc váy này khá vừa vặn."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/pho-tu/"},{"id":2,"name":"THỨC ĂN VÀ ĐỒ UỐNG","words":[{"id":"hsk3-T02-01","hanzi":"香蕉","pinyin":"xiāngjiāo","meaning":"chuối","example":"我每天吃一根香蕉。","examplePinyin":"wǒ měitiān chī yī gēn xiāngjiāo.","translation":"Tôi ăn một quả chuối mỗi ngày."},{"id":"hsk3-T02-02","hanzi":"糖","pinyin":"táng","meaning":"đường, kẹo","example":"我昨天买了糖。","examplePinyin":"Wǒ zuótiān mǎi le táng.","translation":"Hôm qua tôi đã mua đường, kẹo."},{"id":"hsk3-T02-03","hanzi":"甜","pinyin":"tián","meaning":"ngọt","example":"这个西瓜很甜。","examplePinyin":"Zhège xīguā hěn tián.","translation":"Quả dưa hấu này rất ngọt."},{"id":"hsk3-T02-04","hanzi":"啤酒","pinyin":"píjiǔ","meaning":"bia","example":"爸爸不喜欢喝啤酒。","examplePinyin":"bàba bù xǐhuān hē píjiǔ.","translation":"Bố không thích uống bia."},{"id":"hsk3-T02-05","hanzi":"白菜","pinyin":"báicài","meaning":"cải thảo","example":"家里还有白菜吗？","examplePinyin":"Jiā lǐ hái yǒu báicài ma?","translation":"Ở nhà còn cải thảo không?"},{"id":"hsk3-T02-06","hanzi":"苹果","pinyin":"píngguǒ","meaning":"táo","example":"商店里有各种苹果。","examplePinyin":"Shāngdiàn lǐ yǒu gèzhǒng píngguǒ.","translation":"Cửa hàng có nhiều loại táo."},{"id":"hsk3-T02-07","hanzi":"米","pinyin":"mǐ","meaning":"gạo, mét","example":"家里没有米了，我们去买一些吧。","examplePinyin":"Jiā lǐ méiyǒu mǐ le, wǒmen qù mǎi yìxiē ba.","translation":"Nhà hết gạo rồi, chúng ta đi mua một ít nhé."},{"id":"hsk3-T02-08","hanzi":"果汁","pinyin":"guǒzhī","meaning":"nước ép trái cây","example":"妈妈把果汁放在桌子上了。","examplePinyin":"Māma bǎ guǒzhī fàng zài zhuōzi shang le.","translation":"Mẹ đã đặt nước ép trái cây lên bàn."},{"id":"hsk3-T02-09","hanzi":"红茶","pinyin":"hóngchá","meaning":"hồng trà","example":"我想看看不同的红茶。","examplePinyin":"Wǒ xiǎng kànkan bùtóng de hóngchá.","translation":"Tôi muốn xem những loại hồng trà khác nhau."},{"id":"hsk3-T02-10","hanzi":"红酒","pinyin":"hóngjiǔ","meaning":"rượu vang đỏ","example":"今天我第一次见到红酒。","examplePinyin":"Jīntiān wǒ dì yī cì jiàndào hóngjiǔ.","translation":"Hôm nay tôi lần đầu thấy rượu vang đỏ."},{"id":"hsk3-T02-11","hanzi":"咖啡","pinyin":"kāfēi","meaning":"cà phê","example":"今天我们学习“咖啡”这个词。","examplePinyin":"Jīntiān wǒmen xuéxí “kāfēi” zhège cí.","translation":"Hôm nay chúng tôi học từ “咖啡” (cà phê)."},{"id":"hsk3-T02-12","hanzi":"可乐","pinyin":"kělè","meaning":"nước cola","example":"我昨天买了可乐。","examplePinyin":"Wǒ zuótiān mǎi le kělè.","translation":"Hôm qua tôi đã mua nước cola."},{"id":"hsk3-T02-13","hanzi":"凉水","pinyin":"liángshuǐ","meaning":"nước mát","example":"我把凉水带回家了。","examplePinyin":"Wǒ bǎ liángshuǐ dài huí jiā le.","translation":"Tôi đã mang nước mát về nhà."},{"id":"hsk3-T02-14","hanzi":"绿茶","pinyin":"lǜchá","meaning":"trà xanh","example":"你喜欢绿茶吗？","examplePinyin":"Nǐ xǐhuan lǜchá ma?","translation":"Bạn có thích trà xanh không?"},{"id":"hsk3-T02-15","hanzi":"美食","pinyin":"měishí","meaning":"món ngon","example":"家里还有美食吗？","examplePinyin":"Jiā lǐ hái yǒu měishí ma?","translation":"Ở nhà còn món ngon không?"},{"id":"hsk3-T02-16","hanzi":"牛奶","pinyin":"niúnǎi","meaning":"sữa bò","example":"商店里有各种牛奶。","examplePinyin":"Shāngdiàn lǐ yǒu gèzhǒng niúnǎi.","translation":"Cửa hàng có nhiều loại sữa bò."},{"id":"hsk3-T02-17","hanzi":"汤","pinyin":"tāng","meaning":"canh, súp","example":"我们需要一些汤。","examplePinyin":"Wǒmen xūyào yìxiē tāng.","translation":"Chúng ta cần một ít canh, súp."},{"id":"hsk3-T02-18","hanzi":"食品","pinyin":"shípǐn","meaning":"thực phẩm","example":"妈妈把食品放在桌子上了。","examplePinyin":"Māma bǎ shípǐn fàng zài zhuōzi shang le.","translation":"Mẹ đã đặt thực phẩm lên bàn."},{"id":"hsk3-T02-19","hanzi":"生","pinyin":"shēng","meaning":"sống, chưa chín","example":"这块肉还是生的，不能吃。","examplePinyin":"Zhè kuài ròu háishi shēng de, bù néng chī.","translation":"Miếng thịt này vẫn còn sống, không ăn được."},{"id":"hsk3-T02-20","hanzi":"香","pinyin":"xiāng","meaning":"thơm","example":"妈妈做的饭真香！","examplePinyin":"Māma zuò de fàn zhēn xiāng!","translation":"Món mẹ nấu thơm quá!"}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/thuc-an-va-do-uong/"},{"id":3,"name":"CƠ THỂ VÀ SỨC KHỎE","words":[{"id":"hsk3-T03-01","hanzi":"卫生","pinyin":"wèishēng","meaning":"vệ sinh","example":"请注意教室的卫生。","examplePinyin":"Qǐng zhùyì jiàoshì de wèishēng.","translation":"Hãy chú ý vệ sinh của lớp học."},{"id":"hsk3-T03-02","hanzi":"强","pinyin":"qiáng","meaning":"mạnh, giỏi","example":"这个对手很强。","examplePinyin":"zhège duìshǒu hěn qiáng.","translation":"Đối thủ này rất mạnh, giỏi."},{"id":"hsk3-T03-03","hanzi":"营养","pinyin":"yíngyǎng","meaning":"dinh dưỡng","example":"鸡蛋和牛奶都很有营养。","examplePinyin":"Jīdàn hé niúnǎi dōu hěn yǒu yíngyǎng.","translation":"Trứng và sữa đều rất bổ dưỡng."},{"id":"hsk3-T03-04","hanzi":"感冒","pinyin":"gǎnmào","meaning":"cảm lạnh","example":"他感冒了，不能上课。","examplePinyin":"tā gǎnmào le, bùnéng shàng kè.","translation":"Anh ấy bị cảm, không thể lên lớp."},{"id":"hsk3-T03-05","hanzi":"胖","pinyin":"pàng","meaning":"béo","example":"他最近胖了一点儿。","examplePinyin":"tā zuìjìn pàng le yìdiǎnr.","translation":"Gần đây anh ấy tăng cân một chút."},{"id":"hsk3-T03-06","hanzi":"背","pinyin":"bēi","meaning":"đeo, mang trên lưng","example":"弟弟每天背着书包去学校。","examplePinyin":"Dìdi měitiān bēi zhe shūbāo qù xuéxiào.","translation":"Ngày nào em trai cũng đeo cặp đến trường."},{"id":"hsk3-T03-07","hanzi":"毛","pinyin":"máo","meaning":"lông","example":"这只小猫的毛是白色的。","examplePinyin":"Zhè zhī xiǎo māo de máo shì báisè de.","translation":"Lông con mèo nhỏ này màu trắng."},{"id":"hsk3-T03-08","hanzi":"皮","pinyin":"pí","meaning":"da, vỏ","example":"吃香蕉以前，先把皮去掉。","examplePinyin":"Chī xiāngjiāo yǐqián, xiān bǎ pí qùdiào.","translation":"Trước khi ăn chuối, hãy bỏ vỏ."},{"id":"hsk3-T03-09","hanzi":"生","pinyin":"shēng","meaning":"sống, chưa chín","example":"医生说最好不要吃生的肉。","examplePinyin":"Yīshēng shuō zuìhǎo bú yào chī shēng de ròu.","translation":"Bác sĩ nói tốt nhất đừng ăn thịt sống."},{"id":"hsk3-T03-10","hanzi":"手指","pinyin":"shǒuzhǐ","meaning":"ngón tay","example":"我的手指受伤了。","examplePinyin":"Wǒ de shǒuzhǐ shòushāng le.","translation":"Ngón tay tôi bị thương rồi."},{"id":"hsk3-T03-11","hanzi":"受伤","pinyin":"shòushāng","meaning":"bị thương","example":"大家正在讨论受伤的问题。","examplePinyin":"Dàjiā zhèngzài tǎolùn shòushāng de wèntí.","translation":"Mọi người đang thảo luận vấn đề bị thương."},{"id":"hsk3-T03-12","hanzi":"头脑","pinyin":"tóunǎo","meaning":"đầu óc, tư duy","example":"他的头脑很清楚，遇到问题不着急。","examplePinyin":"Tā de tóunǎo hěn qīngchu, yùdào wèntí bù zháojí.","translation":"Anh ấy đầu óc tỉnh táo, gặp vấn đề không sốt ruột."},{"id":"hsk3-T03-13","hanzi":"血","pinyin":"xuè","meaning":"máu","example":"他的手受伤了，流了很多血。","examplePinyin":"Tā de shǒu shòushāng le, liú le hěn duō xuè.","translation":"Tay anh ấy bị thương và chảy nhiều máu."},{"id":"hsk3-T03-14","hanzi":"心","pinyin":"xīn","meaning":"tim, lòng","example":"听到这个消息，我心里很开心。","examplePinyin":"Tīngdào zhège xiāoxi, wǒ xīnli hěn kāixīn.","translation":"Nghe tin này, trong lòng tôi rất vui."},{"id":"hsk3-T03-15","hanzi":"伤","pinyin":"shāng","meaning":"vết thương","example":"他受了伤，但是不想去医院。","examplePinyin":"Tā shòu le shāng, dànshì bù xiǎng qù yīyuàn.","translation":"Anh ấy bị thương nhưng không muốn đến bệnh viện."},{"id":"hsk3-T03-16","hanzi":"痛","pinyin":"tòng","meaning":"đau","example":"我的脚很痛，今天不能爬山了。","examplePinyin":"Wǒ de jiǎo hěn tòng, jīntiān bù néng páshān le.","translation":"Chân tôi rất đau, hôm nay không thể leo núi."},{"id":"hsk3-T03-17","hanzi":"精神","pinyin":"jīngshén","meaning":"tinh thần","example":"今天我很有精神。","examplePinyin":"Jīntiān wǒ hěn yǒu jīngshén.","translation":"Hôm nay tôi rất tỉnh táo."},{"id":"hsk3-T03-18","hanzi":"死","pinyin":"sǐ","meaning":"chết","example":"这棵树已经死了。","examplePinyin":"Zhè kē shù yǐjīng sǐ le.","translation":"Cây này đã chết rồi."},{"id":"hsk3-T03-19","hanzi":"结实","pinyin":"jiēshi","meaning":"chắc chắn, khỏe mạnh","example":"这张桌子很结实。","examplePinyin":"Zhè zhāng zhuōzi hěn jiēshi.","translation":"Chiếc bàn này rất chắc chắn."},{"id":"hsk3-T03-20","hanzi":"力量","pinyin":"lìliang","meaning":"sức lực","example":"一个人的力量不够，我们一起搬吧。","examplePinyin":"Yí ge rén de lìliang bú gòu, wǒmen yìqǐ bān ba.","translation":"Sức một người không đủ, chúng ta cùng khiêng nhé."},{"id":"hsk3-T03-21","hanzi":"领","pinyin":"lǐng","meaning":"cổ áo, nhận","example":"这件衣服的领太小了，我想换一件。","examplePinyin":"Zhè jiàn yīfu de lǐng tài xiǎo le, wǒ xiǎng huàn yí jiàn.","translation":"Cổ chiếc áo này nhỏ quá, tôi muốn đổi chiếc khác."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/co-the-va-suc-khoe/"},{"id":4,"name":"NHỮNG NGƯỜI","words":[{"id":"hsk3-T04-01","hanzi":"老百姓","pinyin":"lǎobǎixìng","meaning":"người dân","example":"当地老百姓很热情。","examplePinyin":"Dāngdì lǎobǎixìng hěn rèqíng.","translation":"Người dân địa phương rất nhiệt tình."},{"id":"hsk3-T04-02","hanzi":"民间","pinyin":"mínjiān","meaning":"dân gian","example":"这个故事在民间很有名。","examplePinyin":"Zhège gùshi zài mínjiān hěn yǒumíng.","translation":"Câu chuyện này rất nổi tiếng trong dân gian."},{"id":"hsk3-T04-03","hanzi":"民族","pinyin":"mínzú","meaning":"dân tộc","example":"中国有很多不同的民族。","examplePinyin":"Zhōngguó yǒu hěn duō bùtóng de mínzú.","translation":"Trung Quốc có nhiều dân tộc khác nhau."},{"id":"hsk3-T04-04","hanzi":"农民","pinyin":"nóngmín","meaning":"nông dân","example":"我们请了一位农民来帮助学生。","examplePinyin":"Wǒmen qǐng le yí wèi nóngmín lái bāngzhù xuésheng.","translation":"Chúng tôi mời một nông dân đến giúp các học sinh."},{"id":"hsk3-T04-05","hanzi":"中华民族","pinyin":"Zhōnghuá mínzú","meaning":"dân tộc Trung Hoa","example":"中华民族有悠久的历史。","examplePinyin":"Zhōnghuá mínzú yǒu yōujiǔ de lìshǐ.","translation":"Dân tộc Trung Hoa có lịch sử lâu đời."},{"id":"hsk3-T04-06","hanzi":"人群","pinyin":"rénqún","meaning":"đám đông","example":"我在人群中找到了朋友。","examplePinyin":"Wǒ zài rénqún zhōng zhǎodào le péngyou.","translation":"Tôi tìm thấy bạn mình trong đám đông."},{"id":"hsk3-T04-07","hanzi":"父母","pinyin":"fùmǔ","meaning":"bố mẹ","example":"我的父母都在医院工作。","examplePinyin":"Wǒ de fùmǔ dōu zài yīyuàn gōngzuò.","translation":"Bố mẹ tôi đều làm việc ở bệnh viện."},{"id":"hsk3-T04-08","hanzi":"人民","pinyin":"rénmín","meaning":"nhân dân","example":"人民的健康非常重要。","examplePinyin":"Rénmín de jiànkāng fēicháng zhòngyào.","translation":"Sức khỏe của nhân dân rất quan trọng."},{"id":"hsk3-T04-09","hanzi":"父亲","pinyin":"fùqīn","meaning":"cha","example":"那位父亲正在等朋友。","examplePinyin":"Nà wèi fùqīn zhèngzài děng péngyou.","translation":"Vị cha kia đang đợi bạn."},{"id":"hsk3-T04-10","hanzi":"姑娘","pinyin":"gūniang","meaning":"cô gái","example":"我们请了一位姑娘来帮助学生。","examplePinyin":"Wǒmen qǐng le yí wèi gūniang lái bāngzhù xuésheng.","translation":"Chúng tôi mời một cô gái đến giúp các học sinh."},{"id":"hsk3-T04-11","hanzi":"性别","pinyin":"xìngbié","meaning":"giới tính","example":"老师问了学生的年龄和性别。","examplePinyin":"Lǎoshī wèn le xuésheng de niánlíng hé xìngbié.","translation":"Giáo viên hỏi tuổi và giới tính của học sinh."},{"id":"hsk3-T04-12","hanzi":"子女","pinyin":"zǐnǚ","meaning":"con cái","example":"她的子女都在外地工作。","examplePinyin":"Tā de zǐnǚ dōu zài wàidì gōngzuò.","translation":"Các con của bà ấy đều làm việc xa nhà."},{"id":"hsk3-T04-13","hanzi":"老太太","pinyin":"lǎotàitai","meaning":"bà cụ","example":"这位老太太工作很认真。","examplePinyin":"Zhè wèi lǎotàitai gōngzuò hěn rènzhēn.","translation":"Vị bà cụ này làm việc rất nghiêm túc."},{"id":"hsk3-T04-14","hanzi":"老头儿","pinyin":"lǎotóur","meaning":"ông lão","example":"今天我和一位老头儿聊天了。","examplePinyin":"Jīntiān wǒ hé yí wèi lǎotóur liáotiān le.","translation":"Hôm nay tôi đã trò chuyện với một ông lão."},{"id":"hsk3-T04-15","hanzi":"华人","pinyin":"Huárén","meaning":"người Hoa","example":"那位华人正在等朋友。","examplePinyin":"Nà wèi Huárén zhèngzài děng péngyou.","translation":"Vị người Hoa kia đang đợi bạn."},{"id":"hsk3-T04-16","hanzi":"公民","pinyin":"gōngmín","meaning":"công dân","example":"我们请了一位公民来帮助学生。","examplePinyin":"Wǒmen qǐng le yí wèi gōngmín lái bāngzhù xuésheng.","translation":"Chúng tôi mời một công dân đến giúp các học sinh."},{"id":"hsk3-T04-17","hanzi":"母亲","pinyin":"mǔqīn","meaning":"mẹ","example":"我在学校遇见了一位母亲。","examplePinyin":"Wǒ zài xuéxiào yùjiàn le yí wèi mǔqīn.","translation":"Tôi gặp một mẹ ở trường."},{"id":"hsk3-T04-18","hanzi":"男子","pinyin":"nánzǐ","meaning":"người đàn ông","example":"我认识一位男子。","examplePinyin":"Wǒ rènshi yí wèi nánzǐ.","translation":"Tôi quen một người đàn ông."},{"id":"hsk3-T04-19","hanzi":"女子","pinyin":"nǚzǐ","meaning":"người phụ nữ","example":"这位女子工作很认真。","examplePinyin":"Zhè wèi nǚzǐ gōngzuò hěn rènzhēn.","translation":"Vị người phụ nữ này làm việc rất nghiêm túc."},{"id":"hsk3-T04-20","hanzi":"社会","pinyin":"shèhuì","meaning":"xã hội","example":"我们生活的社会正在变化。","examplePinyin":"Wǒmen shēnghuó de shèhuì zhèngzài biànhuà.","translation":"Xã hội chúng ta đang sống đang thay đổi."},{"id":"hsk3-T04-21","hanzi":"亲人","pinyin":"qīnrén","meaning":"người thân","example":"那位亲人正在等朋友。","examplePinyin":"Nà wèi qīnrén zhèngzài děng péngyou.","translation":"Vị người thân kia đang đợi bạn."},{"id":"hsk3-T04-22","hanzi":"人生","pinyin":"rénshēng","meaning":"cuộc đời","example":"每个人的人生都不一样。","examplePinyin":"Měi ge rén de rénshēng dōu bù yíyàng.","translation":"Cuộc đời mỗi người đều khác nhau."},{"id":"hsk3-T04-23","hanzi":"命运","pinyin":"mìngyùn","meaning":"số phận","example":"他相信努力可以改变命运。","examplePinyin":"Tā xiāngxìn nǔlì kěyǐ gǎibiàn mìngyùn.","translation":"Anh ấy tin nỗ lực có thể thay đổi số phận."},{"id":"hsk3-T04-24","hanzi":"生命","pinyin":"shēngmìng","meaning":"sinh mệnh","example":"水对生命很重要。","examplePinyin":"Shuǐ duì shēngmìng hěn zhòngyào.","translation":"Nước rất quan trọng đối với sự sống."},{"id":"hsk3-T04-25","hanzi":"人类","pinyin":"rénlèi","meaning":"nhân loại","example":"水对人类非常重要。","examplePinyin":"Shuǐ duì rénlèi fēicháng zhòngyào.","translation":"Nước rất quan trọng với nhân loại."},{"id":"hsk3-T04-26","hanzi":"活","pinyin":"huó","meaning":"sống","example":"你能介绍一下活吗？","examplePinyin":"Nǐ néng jièshào yíxià huó ma?","translation":"Bạn có thể giới thiệu đôi chút về sống không?"},{"id":"hsk3-T04-27","hanzi":"身份证","pinyin":"shēnfènzhèng","meaning":"căn cước công dân","example":"去银行时，请带好身份证。","examplePinyin":"Qù yínháng shí, qǐng dài hǎo shēnfènzhèng.","translation":"Khi đến ngân hàng, hãy mang căn cước."},{"id":"hsk3-T04-28","hanzi":"属","pinyin":"shǔ","meaning":"cầm tinh, thuộc về","example":"我妈妈属马，爸爸属羊。","examplePinyin":"Wǒ māma shǔ mǎ, bàba shǔ yáng.","translation":"Mẹ tôi tuổi Ngọ, bố tôi tuổi Mùi."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/nhung-nguoi/"},{"id":5,"name":"CÁC MỐI QUAN HỆ","words":[{"id":"hsk3-T05-01","hanzi":"接待","pinyin":"jiēdài","meaning":"tiếp đón","example":"他们正在接待客人。","examplePinyin":"Tāmen zhèngzài jiēdài kèrén.","translation":"Họ đang tiếp đón khách."},{"id":"hsk3-T05-02","hanzi":"集体","pinyin":"jítǐ","meaning":"tập thể","example":"我们是一个集体，应该一起努力。","examplePinyin":"Wǒmen shì yí ge jítǐ, yīnggāi yìqǐ nǔlì.","translation":"Chúng ta là một tập thể, nên cùng cố gắng."},{"id":"hsk3-T05-03","hanzi":"相互","pinyin":"xiānghù","meaning":"lẫn nhau","example":"我们应该相互帮助。","examplePinyin":"Wǒmen yīnggāi xiānghù bāngzhù.","translation":"Chúng ta nên giúp đỡ lẫn nhau."},{"id":"hsk3-T05-04","hanzi":"握手","pinyin":"wòshǒu","meaning":"bắt tay","example":"你知道应该怎么握手吗？","examplePinyin":"Nǐ zhīdào yīnggāi zěnme wòshǒu ma?","translation":"Bạn biết nên bắt tay như thế nào không?"},{"id":"hsk3-T05-05","hanzi":"对待","pinyin":"duìdài","meaning":"đối xử","example":"我们需要对待学生。","examplePinyin":"Wǒmen xūyào duìdài xuésheng.","translation":"Chúng ta cần đối xử học sinh."},{"id":"hsk3-T05-06","hanzi":"迎接","pinyin":"yíngjiē","meaning":"chào đón","example":"他们正在迎接新同学。","examplePinyin":"Tāmen zhèngzài yíngjiē xīn tóngxué.","translation":"Họ đang chào đón bạn học mới."},{"id":"hsk3-T05-07","hanzi":"结婚","pinyin":"jiéhūn","meaning":"kết hôn","example":"我姐姐明年结婚。","examplePinyin":"wǒ jiějie míng nián jiéhūn.","translation":"Chị gái tôi kết hôn vào năm sau."},{"id":"hsk3-T05-08","hanzi":"关系","pinyin":"guānxi","meaning":"quan hệ","example":"我们之间的关系很好。","examplePinyin":"Wǒmen zhījiān de guānxi hěn hǎo.","translation":"Mối quan hệ giữa chúng tôi rất tốt."},{"id":"hsk3-T05-09","hanzi":"对方","pinyin":"duìfāng","meaning":"đối phương","example":"聊天时，要认真听对方说话。","examplePinyin":"Liáotiān shí, yào rènzhēn tīng duìfāng shuōhuà.","translation":"Khi trò chuyện, cần chăm chú nghe đối phương."},{"id":"hsk3-T05-10","hanzi":"对手","pinyin":"duìshǒu","meaning":"đối thủ","example":"这次比赛的对手很强。","examplePinyin":"Zhè cì bǐsài de duìshǒu hěn qiáng.","translation":"Đối thủ trong cuộc thi lần này rất mạnh."},{"id":"hsk3-T05-11","hanzi":"做客","pinyin":"zuòkè","meaning":"đến nhà làm khách","example":"周末你来我家做客吧。","examplePinyin":"zhōumò nǐ lái wǒ jiā zuòkè ba.","translation":"Cuối tuần bạn đến nhà tôi chơi nhé."},{"id":"hsk3-T05-12","hanzi":"对象","pinyin":"duìxiàng","meaning":"đối tượng, người yêu","example":"听说我哥哥有对象了。","examplePinyin":"Tīngshuō wǒ gēge yǒu duìxiàng le.","translation":"Nghe nói anh trai tôi có người yêu rồi."},{"id":"hsk3-T05-13","hanzi":"互相","pinyin":"hùxiāng","meaning":"lẫn nhau","example":"我和同学互相练习说汉语。","examplePinyin":"Wǒ hé tóngxué hùxiāng liànxí shuō Hànyǔ.","translation":"Tôi và bạn cùng lớp luyện nói tiếng Trung với nhau."},{"id":"hsk3-T05-14","hanzi":"家属","pinyin":"jiāshǔ","meaning":"thân nhân","example":"病人的家属正在医院外面等。","examplePinyin":"Bìngrén de jiāshǔ zhèngzài yīyuàn wàimiàn děng.","translation":"Người nhà bệnh nhân đang đợi ngoài bệnh viện."},{"id":"hsk3-T05-15","hanzi":"离婚","pinyin":"líhūn","meaning":"ly hôn","example":"这件事我们明天再离婚吧。","examplePinyin":"Zhè jiàn shì wǒmen míngtiān zài líhūn ba.","translation":"Việc này ngày mai chúng ta hãy ly hôn nhé."},{"id":"hsk3-T05-16","hanzi":"认得","pinyin":"rènde","meaning":"nhận ra","example":"我认得这个人。","examplePinyin":"wǒ rènde zhège rén.","translation":"Tôi nhận ra người này."},{"id":"hsk3-T05-17","hanzi":"亲切","pinyin":"qīnqiè","meaning":"thân thiện","example":"这位老师说话很亲切。","examplePinyin":"Zhè wèi lǎoshī shuōhuà hěn qīnqiè.","translation":"Giáo viên này nói chuyện rất thân thiện."},{"id":"hsk3-T05-18","hanzi":"亲","pinyin":"qīn","meaning":"thân, ruột thịt","example":"今天老师讲了关于亲的内容。","examplePinyin":"Jīntiān lǎoshī jiǎng le guānyú qīn de nèiróng.","translation":"Hôm nay giáo viên giảng nội dung về thân, ruột thịt."},{"id":"hsk3-T05-19","hanzi":"熟人","pinyin":"shúrén","meaning":"người quen","example":"这位老师是我爸爸的熟人。","examplePinyin":"Zhè wèi lǎoshī shì wǒ bàba de shúrén.","translation":"Giáo viên này là người quen của bố tôi."},{"id":"hsk3-T05-20","hanzi":"熟","pinyin":"shú","meaning":"chín, quen thuộc","example":"鸡肉还没熟，请再等一会儿。","examplePinyin":"Jīròu hái méi shú, qǐng zài děng yíhuìr.","translation":"Thịt gà chưa chín, hãy đợi thêm một lát."},{"id":"hsk3-T05-21","hanzi":"亲自","pinyin":"qīnzì","meaning":"đích thân","example":"校长亲自来迎接学生。","examplePinyin":"Xiàozhǎng qīnzì lái yíngjiē xuésheng.","translation":"Hiệu trưởng đích thân đến đón học sinh."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/cac-moi-quan-he/"},{"id":6,"name":"BẢO HÀNH VÀ BẢO VỆ","words":[{"id":"hsk3-T06-01","hanzi":"保","pinyin":"bǎo","meaning":"giữ, bảo vệ","example":"“保”这个词在课文里出现了。","examplePinyin":"“bǎo” zhège cí zài kèwén lǐ chūxiàn le.","translation":"Từ “giữ, bảo vệ” xuất hiện trong bài khóa."},{"id":"hsk3-T06-02","hanzi":"保持","pinyin":"bǎochí","meaning":"duy trì","example":"老师让我们保持安静。","examplePinyin":"Lǎoshī ràng wǒmen bǎochí ānjìng.","translation":"Giáo viên yêu cầu chúng tôi duy trì sự yên tĩnh."},{"id":"hsk3-T06-03","hanzi":"保存","pinyin":"bǎocún","meaning":"lưu trữ","example":"我希望以后能保存重要文件。","examplePinyin":"Wǒ xīwàng yǐhòu néng bǎocún zhòngyào wénjiàn.","translation":"Tôi hy vọng sau này có thể lưu trữ tài liệu quan trọng."},{"id":"hsk3-T06-04","hanzi":"保护","pinyin":"bǎohù","meaning":"bảo vệ","example":"我们需要保护环境。","examplePinyin":"Wǒmen xūyào bǎohù huánjìng.","translation":"Chúng ta cần bảo vệ môi trường."},{"id":"hsk3-T06-05","hanzi":"保留","pinyin":"bǎoliú","meaning":"giữ lại","example":"他们正在保留这张照片。","examplePinyin":"Tāmen zhèngzài bǎoliú zhè zhāng zhàopiàn.","translation":"Họ đang giữ lại bức ảnh này."},{"id":"hsk3-T06-06","hanzi":"保险","pinyin":"bǎoxiǎn","meaning":"bảo hiểm","example":"出国前，父母让我买保险。","examplePinyin":"Chūguó qián, fùmǔ ràng wǒ mǎi bǎoxiǎn.","translation":"Trước khi ra nước ngoài, bố mẹ bảo tôi mua bảo hiểm."},{"id":"hsk3-T06-07","hanzi":"保证","pinyin":"bǎozhèng","meaning":"bảo đảm","example":"老师让我们保证安全。","examplePinyin":"Lǎoshī ràng wǒmen bǎozhèng ānquán.","translation":"Giáo viên yêu cầu chúng tôi bảo đảm an toàn."},{"id":"hsk3-T06-08","hanzi":"保安","pinyin":"bǎo'ān","meaning":"bảo vệ, an ninh","example":"门口的保安正在检查证件。","examplePinyin":"Ménkǒu de bǎo'ān zhèngzài jiǎnchá zhèngjiàn.","translation":"Bảo vệ ở cửa đang kiểm tra giấy tờ."},{"id":"hsk3-T06-09","hanzi":"防","pinyin":"fáng","meaning":"phòng ngừa","example":"“防”这个词在课文里出现了。","examplePinyin":"“fáng” zhège cí zài kèwén lǐ chūxiàn le.","translation":"Từ “phòng ngừa” xuất hiện trong bài khóa."},{"id":"hsk3-T06-10","hanzi":"防止","pinyin":"fángzhǐ","meaning":"ngăn chặn","example":"他们正在防止感冒。","examplePinyin":"Tāmen zhèngzài fángzhǐ gǎnmào.","translation":"Họ đang ngăn chặn cảm lạnh."},{"id":"hsk3-T06-11","hanzi":"救","pinyin":"jiù","meaning":"cứu","example":"医生救了那个受伤的孩子。","examplePinyin":"Yīshēng jiù le nà ge shòushāng de háizi.","translation":"Bác sĩ đã cứu đứa trẻ bị thương."},{"id":"hsk3-T06-12","hanzi":"预防","pinyin":"yùfáng","meaning":"phòng ngừa","example":"老师让我们预防感冒。","examplePinyin":"Lǎoshī ràng wǒmen yùfáng gǎnmào.","translation":"Giáo viên yêu cầu chúng tôi phòng ngừa cảm lạnh."},{"id":"hsk3-T06-13","hanzi":"证明","pinyin":"zhèngmíng","meaning":"chứng minh","example":"我希望以后能证明这件事。","examplePinyin":"Wǒ xīwàng yǐhòu néng zhèngmíng zhè jiàn shì.","translation":"Tôi hy vọng sau này có thể chứng minh việc này."},{"id":"hsk3-T06-14","hanzi":"证据","pinyin":"zhèngjù","meaning":"bằng chứng","example":"你有什么证据证明他说错了？","examplePinyin":"Nǐ yǒu shénme zhèngjù zhèngmíng tā shuō cuò le?","translation":"Bạn có bằng chứng gì chứng minh anh ấy nói sai?"},{"id":"hsk3-T06-15","hanzi":"确保","pinyin":"quèbǎo","meaning":"đảm bảo","example":"他们正在确保安全。","examplePinyin":"Tāmen zhèngzài quèbǎo ānquán.","translation":"Họ đang đảm bảo an toàn."},{"id":"hsk3-T06-16","hanzi":"确定","pinyin":"quèdìng","meaning":"xác định","example":"学校决定确定时间。","examplePinyin":"Xuéxiào juédìng quèdìng shíjiān.","translation":"Nhà trường quyết định xác định thời gian."},{"id":"hsk3-T06-17","hanzi":"证件","pinyin":"zhèngjiàn","meaning":"giấy tờ tùy thân","example":"去机场前，请检查自己的证件。","examplePinyin":"Qù jīchǎng qián, qǐng jiǎnchá zìjǐ de zhèngjiàn.","translation":"Trước khi đến sân bay, hãy kiểm tra giấy tờ của mình."},{"id":"hsk3-T06-18","hanzi":"证","pinyin":"zhèng","meaning":"giấy chứng nhận","example":"今天老师教了我们“证”这个词。","examplePinyin":"Jīntiān lǎoshī jiāo le wǒmen “zhèng” zhège cí.","translation":"Hôm nay giáo viên dạy chúng tôi từ “giấy chứng nhận”."},{"id":"hsk3-T06-19","hanzi":"可靠","pinyin":"kěkào","meaning":"đáng tin cậy","example":"他很可靠。","examplePinyin":"tā hěn kěkào.","translation":"Anh ấy rất đáng tin cậy."},{"id":"hsk3-T06-20","hanzi":"满足","pinyin":"mǎnzú","meaning":"đáp ứng","example":"他们正在满足需要。","examplePinyin":"Tāmen zhèngzài mǎnzú xūyào.","translation":"Họ đang đáp ứng nhu cầu."},{"id":"hsk3-T06-21","hanzi":"规定","pinyin":"guīdìng","meaning":"quy định","example":"学校规定考试时不能用手机。","examplePinyin":"Xuéxiào guīdìng kǎoshì shí bù néng yòng shǒujī.","translation":"Trường quy định không được dùng điện thoại khi thi."},{"id":"hsk3-T06-22","hanzi":"规范","pinyin":"guīfàn","meaning":"quy chuẩn","example":"老师要求我们按照规范写汉字。","examplePinyin":"Lǎoshī yāoqiú wǒmen ànzhào guīfàn xiě Hànzì.","translation":"Giáo viên yêu cầu chúng tôi viết chữ Hán đúng quy chuẩn."},{"id":"hsk3-T06-23","hanzi":"制度","pinyin":"zhìdù","meaning":"chế độ, hệ thống quy định","example":"每个学校都有自己的制度。","examplePinyin":"Měi ge xuéxiào dōu yǒu zìjǐ de zhìdù.","translation":"Mỗi trường đều có hệ thống quy định riêng."},{"id":"hsk3-T06-24","hanzi":"制定","pinyin":"zhìdìng","meaning":"ban hành","example":"我们需要制定计划。","examplePinyin":"Wǒmen xūyào zhìdìng jìhuà.","translation":"Chúng ta cần ban hành kế hoạch."},{"id":"hsk3-T06-25","hanzi":"联合国","pinyin":"Liánhéguó","meaning":"Liên Hợp Quốc","example":"联合国正在讨论一个重要问题。","examplePinyin":"Liánhéguó zhèngzài tǎolùn yí ge zhòngyào wèntí.","translation":"Liên Hợp Quốc đang thảo luận một vấn đề quan trọng."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/bao-hanh-va-bao-ve/"},{"id":7,"name":"THỜI GIAN","words":[{"id":"hsk3-T07-01","hanzi":"定期","pinyin":"dìngqī","meaning":"định kỳ","example":"医生让我定期检查身体。","examplePinyin":"Yīshēng ràng wǒ dìngqī jiǎnchá shēntǐ.","translation":"Bác sĩ bảo tôi kiểm tra sức khỏe định kỳ."},{"id":"hsk3-T07-02","hanzi":"时刻","pinyin":"shíkè","meaning":"thời khắc","example":"在这个重要的时刻，我很想见家人。","examplePinyin":"Zài zhège zhòngyào de shíkè, wǒ hěn xiǎng jiàn jiārén.","translation":"Trong thời khắc quan trọng này, tôi rất muốn gặp gia đình."},{"id":"hsk3-T07-03","hanzi":"时代","pinyin":"shídài","meaning":"thời đại","example":"我们生活在一个变化很快的时代。","examplePinyin":"Wǒmen shēnghuó zài yí ge biànhuà hěn kuài de shídài.","translation":"Chúng ta sống trong một thời đại đổi thay nhanh chóng."},{"id":"hsk3-T07-04","hanzi":"短期","pinyin":"duǎnqī","meaning":"ngắn hạn","example":"她打算参加一个短期汉语班。","examplePinyin":"Tā dǎsuàn cānjiā yí ge duǎnqī Hànyǔ bān.","translation":"Cô ấy dự định tham gia lớp tiếng Trung ngắn hạn."},{"id":"hsk3-T07-05","hanzi":"时","pinyin":"shí","meaning":"khi, lúc","example":"今天我们学习“时”这个词。","examplePinyin":"Jīntiān wǒmen xuéxí “shí” zhège cí.","translation":"Hôm nay chúng tôi học từ “时” (khi, lúc)."},{"id":"hsk3-T07-06","hanzi":"初","pinyin":"chū","meaning":"đầu, ban đầu","example":"“初”这个词在课文里出现了。","examplePinyin":"“chū” zhège cí zài kèwén lǐ chūxiàn le.","translation":"Từ “đầu, ban đầu” xuất hiện trong bài khóa."},{"id":"hsk3-T07-07","hanzi":"长期","pinyin":"chángqī","meaning":"dài hạn","example":"长期不运动对身体不好。","examplePinyin":"Chángqī bú yùndòng duì shēntǐ bù hǎo.","translation":"Không vận động trong thời gian dài không tốt cho sức khỏe."},{"id":"hsk3-T07-08","hanzi":"过去","pinyin":"guòqù","meaning":"quá khứ","example":"过去我住在北京，现在住在上海。","examplePinyin":"Guòqù wǒ zhù zài Běijīng, xiànzài zhù zài Shànghǎi.","translation":"Trước đây tôi sống ở Bắc Kinh, giờ sống ở Thượng Hải."},{"id":"hsk3-T07-09","hanzi":"后年","pinyin":"hòunián","meaning":"năm sau nữa","example":"我后年大学毕业。","examplePinyin":"wǒ hòunián dà xué bìyè.","translation":"Năm sau nữa tôi tốt nghiệp đại học."},{"id":"hsk3-T07-10","hanzi":"现代","pinyin":"xiàndài","meaning":"hiện đại","example":"现代城市的生活很方便。","examplePinyin":"Xiàndài chéngshì de shēnghuó hěn fāngbiàn.","translation":"Cuộc sống thành phố hiện đại rất thuận tiện."},{"id":"hsk3-T07-11","hanzi":"年初","pinyin":"niánchū","meaning":"đầu năm","example":"今年年初我开始学汉语。","examplePinyin":"Jīnnián niánchū wǒ kāishǐ xué Hànyǔ.","translation":"Đầu năm nay tôi bắt đầu học tiếng Trung."},{"id":"hsk3-T07-12","hanzi":"年代","pinyin":"niándài","meaning":"thời kỳ, thập niên","example":"那个年代还没有手机。","examplePinyin":"Nà ge niándài hái méiyǒu shǒujī.","translation":"Thời đó vẫn chưa có điện thoại di động."},{"id":"hsk3-T07-13","hanzi":"年底","pinyin":"niándǐ","meaning":"cuối năm","example":"今年年底我打算回家看父母。","examplePinyin":"Jīnnián niándǐ wǒ dǎsuàn huí jiā kàn fùmǔ.","translation":"Cuối năm nay tôi dự định về thăm bố mẹ."},{"id":"hsk3-T07-14","hanzi":"期","pinyin":"qī","meaning":"kỳ, đợt","example":"“期”这个词在课文里出现了。","examplePinyin":"“qī” zhège cí zài kèwén lǐ chūxiàn le.","translation":"Từ “kỳ, đợt” xuất hiện trong bài khóa."},{"id":"hsk3-T07-15","hanzi":"年纪","pinyin":"niánjì","meaning":"tuổi tác","example":"虽然他年纪不大，但是很认真。","examplePinyin":"Suīrán tā niánjì bú dà, dànshì hěn rènzhēn.","translation":"Dù anh ấy không lớn tuổi nhưng rất nghiêm túc."},{"id":"hsk3-T07-16","hanzi":"日常","pinyin":"rìcháng","meaning":"hằng ngày","example":"我在日常生活中经常用汉语。","examplePinyin":"Wǒ zài rìcháng shēnghuó zhōng jīngcháng yòng Hànyǔ.","translation":"Trong sinh hoạt hằng ngày tôi thường dùng tiếng Trung."},{"id":"hsk3-T07-17","hanzi":"从来","pinyin":"cónglái","meaning":"từ trước đến nay","example":"妈妈从来给我打电话。","examplePinyin":"Māma cónglái gěi wǒ dǎ diànhuà.","translation":"Mẹ từ trước đến nay gọi điện cho tôi."},{"id":"hsk3-T07-18","hanzi":"总是","pinyin":"zǒngshì","meaning":"luôn luôn","example":"她总是很早起床。","examplePinyin":"tā zǒngshì hěnzǎo qǐ chuáng.","translation":"Cô ấy luôn dậy rất sớm."},{"id":"hsk3-T07-19","hanzi":"久","pinyin":"jiǔ","meaning":"lâu","example":"你等了很久吗？","examplePinyin":"nǐ děng le hěn jiǔ ma?","translation":"Bạn đã đợi lâu chưa?"},{"id":"hsk3-T07-20","hanzi":"立刻","pinyin":"lìkè","meaning":"ngay lập tức","example":"听到消息以后，他立刻回家了。","examplePinyin":"Tīngdào xiāoxi yǐhòu, tā lìkè huí jiā le.","translation":"Nghe tin xong, anh ấy lập tức về nhà."},{"id":"hsk3-T07-21","hanzi":"不断","pinyin":"búduàn","meaning":"liên tục","example":"他不断练习，成绩越来越好。","examplePinyin":"Tā búduàn liànxí, chéngjì yuèláiyuè hǎo.","translation":"Anh ấy luyện tập không ngừng, thành tích ngày càng tốt."},{"id":"hsk3-T07-22","hanzi":"曾经","pinyin":"céngjīng","meaning":"đã từng","example":"我曾经在北京生活过一年。","examplePinyin":"Wǒ céngjīng zài Běijīng shēnghuóguo yì nián.","translation":"Tôi từng sống ở Bắc Kinh một năm."},{"id":"hsk3-T07-23","hanzi":"以来","pinyin":"yǐlái","meaning":"kể từ khi","example":"毕业以来，我一直在这里工作。","examplePinyin":"Bìyè yǐlái, wǒ yìzhí zài zhèlǐ gōngzuò.","translation":"Kể từ khi tốt nghiệp, tôi luôn làm việc ở đây."},{"id":"hsk3-T07-24","hanzi":"从前","pinyin":"cóngqián","meaning":"ngày xưa","example":"从前这里没有这么多高楼。","examplePinyin":"Cóngqián zhèlǐ méiyǒu zhème duō gāolóu.","translation":"Ngày xưa ở đây không có nhiều tòa nhà cao như vậy."},{"id":"hsk3-T07-25","hanzi":"当初","pinyin":"dāngchū","meaning":"lúc đầu","example":"他当初在学校工作。","examplePinyin":"Tā dāngchū zài xuéxiào gōngzuò.","translation":"Anh ấy lúc đầu làm việc tại trường."},{"id":"hsk3-T07-26","hanzi":"及时","pinyin":"jíshí","meaning":"kịp thời","example":"妈妈及时给我打电话。","examplePinyin":"Māma jíshí gěi wǒ dǎ diànhuà.","translation":"Mẹ kịp thời gọi điện cho tôi."},{"id":"hsk3-T07-27","hanzi":"将来","pinyin":"jiānglái","meaning":"tương lai","example":"将来我希望去中国工作。","examplePinyin":"Jiānglái wǒ xīwàng qù Zhōngguó gōngzuò.","translation":"Trong tương lai tôi hy vọng làm việc tại Trung Quốc."},{"id":"hsk3-T07-28","hanzi":"近期","pinyin":"jìnqī","meaning":"gần đây","example":"近期我没有出国的打算。","examplePinyin":"Jìnqī wǒ méiyǒu chūguó de dǎsuàn.","translation":"Gần đây tôi không có kế hoạch ra nước ngoài."},{"id":"hsk3-T07-29","hanzi":"连忙","pinyin":"liánmáng","meaning":"vội vàng","example":"妈妈连忙给我打电话。","examplePinyin":"Māma liánmáng gěi wǒ dǎ diànhuà.","translation":"Mẹ vội vàng gọi điện cho tôi."},{"id":"hsk3-T07-30","hanzi":"目前","pinyin":"mùqián","meaning":"hiện tại","example":"目前我正在准备汉语考试。","examplePinyin":"Mùqián wǒ zhèngzài zhǔnbèi Hànyǔ kǎoshì.","translation":"Hiện tại tôi đang chuẩn bị cho kỳ thi tiếng Trung."},{"id":"hsk3-T07-31","hanzi":"前后","pinyin":"qiánhòu","meaning":"trước sau","example":"新年前后，车站总是有很多人。","examplePinyin":"Xīnnián qiánhòu, chēzhàn zǒngshì yǒu hěn duō rén.","translation":"Khoảng trước và sau năm mới, ga luôn rất đông."},{"id":"hsk3-T07-32","hanzi":"始终","pinyin":"shǐzhōng","meaning":"từ đầu đến cuối","example":"他始终没有放弃学习汉语。","examplePinyin":"Tā shǐzhōng méiyǒu fàngqì xuéxí Hànyǔ.","translation":"Anh ấy luôn không bỏ cuộc học tiếng Trung."},{"id":"hsk3-T07-33","hanzi":"提前","pinyin":"tíqián","meaning":"trước thời hạn","example":"我们决定提前一天出发。","examplePinyin":"Wǒmen juédìng tíqián yì tiān chūfā.","translation":"Chúng tôi quyết định xuất phát sớm một ngày."},{"id":"hsk3-T07-34","hanzi":"早已","pinyin":"zǎoyǐ","meaning":"đã từ lâu","example":"他早已知道这件事了。","examplePinyin":"Tā zǎoyǐ zhīdào zhè jiàn shì le.","translation":"Anh ấy đã biết chuyện này từ lâu."},{"id":"hsk3-T07-35","hanzi":"整天","pinyin":"zhěngtiān","meaning":"cả ngày","example":"弟弟整天在家玩游戏。","examplePinyin":"Dìdi zhěngtiān zài jiā wán yóuxì.","translation":"Em trai cả ngày chơi game ở nhà."},{"id":"hsk3-T07-36","hanzi":"至今","pinyin":"zhìjīn","meaning":"cho đến nay","example":"我们认识十年了，至今还是朋友。","examplePinyin":"Wǒmen rènshi shí nián le, zhìjīn háishi péngyou.","translation":"Chúng tôi quen nhau mười năm, đến nay vẫn là bạn."},{"id":"hsk3-T07-37","hanzi":"古代","pinyin":"gǔdài","meaning":"thời cổ đại","example":"我对中国古代的历史很感兴趣。","examplePinyin":"Wǒ duì Zhōngguó gǔdài de lìshǐ hěn gǎn xìngqù.","translation":"Tôi rất hứng thú với lịch sử Trung Quốc cổ đại."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/thoi-gian/"},{"id":8,"name":"NHỮNG CẢM XÚC VÀ CẢM GIÁC","words":[{"id":"hsk3-T08-01","hanzi":"害怕","pinyin":"hàipà","meaning":"sợ hãi","example":"妹妹害怕一个人在家。","examplePinyin":"Mèimei hàipà yí ge rén zài jiā.","translation":"Em gái sợ ở nhà một mình."},{"id":"hsk3-T08-02","hanzi":"痛苦","pinyin":"tòngkǔ","meaning":"đau khổ","example":"生病住院的那段时间，他很痛苦。","examplePinyin":"Shēngbìng zhùyuàn de nà duàn shíjiān, tā hěn tòngkǔ.","translation":"Khoảng thời gian bị bệnh nằm viện, anh ấy rất đau khổ."},{"id":"hsk3-T08-03","hanzi":"伤心","pinyin":"shāngxīn","meaning":"buồn bã","example":"听到这个消息以后，她很伤心。","examplePinyin":"Tīngdào zhège xiāoxi yǐhòu, tā hěn shāngxīn.","translation":"Nghe tin này xong, cô ấy rất buồn."},{"id":"hsk3-T08-04","hanzi":"不安","pinyin":"bù'ān","meaning":"bất an","example":"第一次参加比赛，我有点儿不安。","examplePinyin":"Dì yī cì cānjiā bǐsài, wǒ yǒudiǎnr bù'ān.","translation":"Lần đầu dự thi, tôi hơi bất an."},{"id":"hsk3-T08-05","hanzi":"动人","pinyin":"dòngrén","meaning":"cảm động","example":"这个故事非常动人。","examplePinyin":"Zhège gùshi fēicháng dòngrén.","translation":"Câu chuyện này vô cùng cảm động."},{"id":"hsk3-T08-06","hanzi":"福","pinyin":"fú","meaning":"phúc, may mắn","example":"大家正在讨论福的问题。","examplePinyin":"Dàjiā zhèngzài tǎolùn fú de wèntí.","translation":"Mọi người đang thảo luận vấn đề phúc, may mắn."},{"id":"hsk3-T08-07","hanzi":"感情","pinyin":"gǎnqíng","meaning":"tình cảm","example":"我和姐姐的感情很好。","examplePinyin":"Wǒ hé jiějie de gǎnqíng hěn hǎo.","translation":"Tôi và chị gái rất thân thiết."},{"id":"hsk3-T08-08","hanzi":"感受","pinyin":"gǎnshòu","meaning":"cảm nhận","example":"第一次来中国，你有什么感受？","examplePinyin":"Dì yī cì lái Zhōngguó, nǐ yǒu shénme gǎnshòu?","translation":"Lần đầu đến Trung Quốc, bạn có cảm nhận gì?"},{"id":"hsk3-T08-09","hanzi":"好奇","pinyin":"hàoqí","meaning":"tò mò","example":"孩子们对大熊猫很好奇。","examplePinyin":"Háizimen duì dàxióngmāo hěn hàoqí.","translation":"Bọn trẻ rất tò mò về gấu trúc."},{"id":"hsk3-T08-10","hanzi":"欢乐","pinyin":"huānlè","meaning":"vui tươi","example":"晚会很欢乐，大家都在唱歌。","examplePinyin":"Wǎnhuì hěn huānlè, dàjiā dōu zài chànggē.","translation":"Buổi liên hoan rất vui, mọi người đều hát."},{"id":"hsk3-T08-11","hanzi":"紧张","pinyin":"jǐnzhāng","meaning":"căng thẳng","example":"第一次用汉语发言，我很紧张。","examplePinyin":"Dì yī cì yòng Hànyǔ fāyán, wǒ hěn jǐnzhāng.","translation":"Lần đầu phát biểu bằng tiếng Trung, tôi rất căng thẳng."},{"id":"hsk3-T08-12","hanzi":"哈哈","pinyin":"hāhā","meaning":"ha ha","example":"哈哈，这个故事真有意思！","examplePinyin":"hāhā, zhège gùshì zhēn yǒu yì sī!","translation":"Ha ha, câu chuyện này thật thú vị!"},{"id":"hsk3-T08-13","hanzi":"恐怕","pinyin":"kǒngpà","meaning":"e rằng","example":"恐怕明天会下大雨。","examplePinyin":"Kǒngpà míngtiān huì xià dà yǔ.","translation":"E rằng ngày mai sẽ mưa lớn."},{"id":"hsk3-T08-14","hanzi":"乐","pinyin":"lè","meaning":"vui, vui sướng","example":"很多人都很关心乐。","examplePinyin":"Hěn duō rén dōu hěn guānxīn lè.","translation":"Nhiều người rất quan tâm đến vui, vui sướng."},{"id":"hsk3-T08-15","hanzi":"奇怪","pinyin":"qíguài","meaning":"kỳ lạ","example":"今天经理没有来，大家都觉得奇怪。","examplePinyin":"Jīntiān jīnglǐ méiyǒu lái, dàjiā dōu juéde qíguài.","translation":"Hôm nay giám đốc không đến, mọi người đều thấy lạ."},{"id":"hsk3-T08-16","hanzi":"情感","pinyin":"qínggǎn","meaning":"cảm xúc","example":"这本书写了很多人的情感。","examplePinyin":"Zhè běn shū xiě le hěn duō rén de qínggǎn.","translation":"Cuốn sách này viết về cảm xúc của nhiều người."},{"id":"hsk3-T08-17","hanzi":"热爱","pinyin":"rè'ài","meaning":"yêu tha thiết","example":"她很热爱自己的工作。","examplePinyin":"Tā hěn rè'ài zìjǐ de gōngzuò.","translation":"Cô ấy rất yêu công việc của mình."},{"id":"hsk3-T08-18","hanzi":"主动","pinyin":"zhǔdòng","meaning":"chủ động","example":"他经常主动帮助同学。","examplePinyin":"Tā jīngcháng zhǔdòng bāngzhù tóngxué.","translation":"Anh ấy thường chủ động giúp bạn học."},{"id":"hsk3-T08-19","hanzi":"爱心","pinyin":"àixīn","meaning":"lòng nhân ái","example":"这位医生很有爱心。","examplePinyin":"Zhè wèi yīshēng hěn yǒu àixīn.","translation":"Bác sĩ này rất giàu lòng nhân ái."},{"id":"hsk3-T08-20","hanzi":"纪念","pinyin":"jìniàn","meaning":"kỷ niệm","example":"我保留这张照片来纪念我们的旅行。","examplePinyin":"Wǒ bǎoliú zhè zhāng zhàopiàn lái jìniàn wǒmen de lǚxíng.","translation":"Tôi giữ bức ảnh này để kỷ niệm chuyến đi."},{"id":"hsk3-T08-21","hanzi":"内心","pinyin":"nèixīn","meaning":"nội tâm","example":"虽然他没有说话，但是内心很难过。","examplePinyin":"Suīrán tā méiyǒu shuōhuà, dànshì nèixīn hěn nánguò.","translation":"Dù không nói gì nhưng trong lòng anh ấy rất buồn."},{"id":"hsk3-T08-22","hanzi":"希望","pinyin":"xīwàng","meaning":"hy vọng","example":"我希望明年去中国留学。","examplePinyin":"Wǒ xīwàng míngnián qù Zhōngguó liúxué.","translation":"Tôi hy vọng năm sau sang Trung Quốc du học."},{"id":"hsk3-T08-23","hanzi":"志愿","pinyin":"zhìyuàn","meaning":"nguyện vọng","example":"他的志愿是当一名医生。","examplePinyin":"Tā de zhìyuàn shì dāng yì míng yīshēng.","translation":"Nguyện vọng của anh ấy là làm bác sĩ."},{"id":"hsk3-T08-24","hanzi":"精神","pinyin":"jīngshén","meaning":"tinh thần","example":"今天我很有精神。","examplePinyin":"Jīntiān wǒ hěn yǒu jīngshén.","translation":"Hôm nay tôi rất tỉnh táo."},{"id":"hsk3-T08-25","hanzi":"印象","pinyin":"yìnxiàng","meaning":"ấn tượng","example":"这家宾馆给我留下了很好的印象。","examplePinyin":"Zhè jiā bīnguǎn gěi wǒ liúxià le hěn hǎo de yìnxiàng.","translation":"Khách sạn này để lại ấn tượng rất tốt với tôi."},{"id":"hsk3-T08-26","hanzi":"愿望","pinyin":"yuànwàng","meaning":"ước nguyện","example":"我的愿望是明年去中国留学。","examplePinyin":"Wǒ de yuànwàng shì míngnián qù Zhōngguó liúxué.","translation":"Ước nguyện của tôi là sang Trung Quốc du học năm sau."},{"id":"hsk3-T08-27","hanzi":"支持","pinyin":"zhīchí","meaning":"ủng hộ","example":"我的父母一直支持我学习汉语。","examplePinyin":"Wǒ de fùmǔ yìzhí zhīchí wǒ xuéxí Hànyǔ.","translation":"Bố mẹ luôn ủng hộ tôi học tiếng Trung."},{"id":"hsk3-T08-28","hanzi":"乐观","pinyin":"lèguān","meaning":"lạc quan","example":"她很乐观，遇到困难也不害怕。","examplePinyin":"Tā hěn lèguān, yùdào kùnnan yě bù hàipà.","translation":"Cô ấy rất lạc quan, gặp khó cũng không sợ."},{"id":"hsk3-T08-29","hanzi":"幸福","pinyin":"xìngfú","meaning":"hạnh phúc","example":"每天和家人一起吃饭，我觉得很幸福。","examplePinyin":"Měitiān hé jiārén yìqǐ chīfàn, wǒ juéde hěn xìngfú.","translation":"Tôi thấy hạnh phúc khi được ăn cùng gia đình mỗi ngày."},{"id":"hsk3-T08-30","hanzi":"觉得","pinyin":"juéde","meaning":"cảm thấy","example":"你能介绍一下觉得吗？","examplePinyin":"Nǐ néng jièshào yíxià juéde ma?","translation":"Bạn có thể giới thiệu đôi chút về cảm thấy không?"},{"id":"hsk3-T08-31","hanzi":"信任","pinyin":"xìnrèn","meaning":"tin tưởng","example":"大家都很信任这位老师。","examplePinyin":"Dàjiā dōu hěn xìnrèn zhè wèi lǎoshī.","translation":"Mọi người đều rất tin tưởng giáo viên này."},{"id":"hsk3-T08-32","hanzi":"信","pinyin":"xìn","meaning":"tin tưởng","example":"我信你说的话。","examplePinyin":"Wǒ xìn nǐ shuō de huà.","translation":"Tôi tin lời bạn nói."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/nhung-cam-xuc-va-cam-giac/"},{"id":9,"name":"THIÊN NHIÊN","words":[{"id":"hsk3-T09-01","hanzi":"银","pinyin":"yín","meaning":"bạc","example":"这个杯子是银做的。","examplePinyin":"Zhège bēizi shì yín zuò de.","translation":"Chiếc cốc này làm bằng bạc."},{"id":"hsk3-T09-02","hanzi":"种子","pinyin":"zhǒngzi","meaning":"hạt giống","example":"家里还有种子吗？","examplePinyin":"Jiā lǐ hái yǒu zhǒngzi ma?","translation":"Ở nhà còn hạt giống không?"},{"id":"hsk3-T09-03","hanzi":"光","pinyin":"guāng","meaning":"ánh sáng","example":"太阳的光照进了我的房间。","examplePinyin":"Tàiyáng de guāng zhào jìn le wǒ de fángjiān.","translation":"Ánh nắng mặt trời chiếu vào phòng tôi."},{"id":"hsk3-T09-04","hanzi":"羊","pinyin":"yáng","meaning":"cừu, dê","example":"草原上有一只羊。","examplePinyin":"cǎoyuán shàng yǒu yì zhī yáng.","translation":"Trên thảo nguyên có một con cừu."},{"id":"hsk3-T09-05","hanzi":"烟","pinyin":"yān","meaning":"khói, thuốc lá","example":"房间里有很多烟，请赶快出去。","examplePinyin":"Fángjiān lǐ yǒu hěn duō yān, qǐng gǎnkuài chūqu.","translation":"Trong phòng có nhiều khói, hãy mau ra ngoài."},{"id":"hsk3-T09-06","hanzi":"铁","pinyin":"tiě","meaning":"sắt","example":"我想看看不同的铁。","examplePinyin":"Wǒ xiǎng kànkan bùtóng de tiě.","translation":"Tôi muốn xem những loại sắt khác nhau."},{"id":"hsk3-T09-07","hanzi":"土","pinyin":"tǔ","meaning":"đất","example":"今天我第一次见到土。","examplePinyin":"Jīntiān wǒ dì yī cì jiàndào tǔ.","translation":"Hôm nay tôi lần đầu thấy đất."},{"id":"hsk3-T09-08","hanzi":"天空","pinyin":"tiānkōng","meaning":"bầu trời","example":"今天的天空很蓝。","examplePinyin":"Jīntiān de tiānkōng hěn lán.","translation":"Bầu trời hôm nay rất xanh."},{"id":"hsk3-T09-09","hanzi":"石油","pinyin":"shíyóu","meaning":"dầu mỏ","example":"世界上很多地方都有石油。","examplePinyin":"Shìjiè shang hěn duō dìfang dōu yǒu shíyóu.","translation":"Trên thế giới nhiều nơi có dầu mỏ."},{"id":"hsk3-T09-10","hanzi":"火","pinyin":"huǒ","meaning":"lửa","example":"屋子里着火了，大家快出去！","examplePinyin":"Wūzi lǐ zháohuǒ le, dàjiā kuài chūqu!","translation":"Trong nhà cháy rồi, mọi người mau ra ngoài!"},{"id":"hsk3-T09-11","hanzi":"沙子","pinyin":"shāzi","meaning":"cát","example":"你喜欢沙子吗？","examplePinyin":"Nǐ xǐhuan shāzi ma?","translation":"Bạn có thích cát không?"},{"id":"hsk3-T09-12","hanzi":"石头","pinyin":"shítou","meaning":"hòn đá","example":"路中间有一块大石头。","examplePinyin":"Lù zhōngjiān yǒu yí kuài dà shítou.","translation":"Giữa đường có một hòn đá lớn."},{"id":"hsk3-T09-13","hanzi":"猪","pinyin":"zhū","meaning":"lợn","example":"商店里有各种猪。","examplePinyin":"Shāngdiàn lǐ yǒu gèzhǒng zhū.","translation":"Cửa hàng có nhiều loại lợn."},{"id":"hsk3-T09-14","hanzi":"牛","pinyin":"niú","meaning":"bò","example":"农场里有很多牛。","examplePinyin":"nóng chǎng lǐ yǒu hěnduō niú.","translation":"Trong nông trại có nhiều bò."},{"id":"hsk3-T09-15","hanzi":"木头","pinyin":"mùtou","meaning":"gỗ","example":"这张桌子是木头做的。","examplePinyin":"Zhè zhāng zhuōzi shì mùtou zuò de.","translation":"Chiếc bàn này làm bằng gỗ."},{"id":"hsk3-T09-16","hanzi":"阳光","pinyin":"yángguāng","meaning":"ánh nắng","example":"冬天的阳光很舒服。","examplePinyin":"Dōngtiān de yángguāng hěn shūfu.","translation":"Ánh nắng mùa đông rất dễ chịu."},{"id":"hsk3-T09-17","hanzi":"马","pinyin":"mǎ","meaning":"ngựa","example":"那匹马很高。","examplePinyin":"nà pǐ mǎ hěn gāo.","translation":"Con ngựa đó rất cao."},{"id":"hsk3-T09-18","hanzi":"龙","pinyin":"lóng","meaning":"rồng","example":"龙在中国文化中很重要。","examplePinyin":"Lóng zài Zhōngguó wénhuà zhōng hěn zhòngyào.","translation":"Rồng rất quan trọng trong văn hóa Trung Quốc."},{"id":"hsk3-T09-19","hanzi":"金","pinyin":"jīn","meaning":"vàng","example":"这个东西是金做的吗？","examplePinyin":"Zhège dōngxi shì jīn zuò de ma?","translation":"Thứ này làm bằng vàng à?"},{"id":"hsk3-T09-20","hanzi":"自然","pinyin":"zìrán","meaning":"thiên nhiên","example":"我很喜欢大自然。","examplePinyin":"Wǒ hěn xǐhuan dà zìrán.","translation":"Tôi rất yêu thiên nhiên."},{"id":"hsk3-T09-21","hanzi":"静","pinyin":"jìng","meaning":"yên tĩnh","example":"夜里这里很静。","examplePinyin":"Yèlǐ zhèlǐ hěn jìng.","translation":"Ban đêm nơi này rất yên tĩnh."},{"id":"hsk3-T09-22","hanzi":"全球","pinyin":"quánqiú","meaning":"toàn cầu","example":"全球有很多人学习汉语。","examplePinyin":"Quánqiú yǒu hěn duō rén xuéxí Hànyǔ.","translation":"Khắp thế giới có nhiều người học tiếng Trung."},{"id":"hsk3-T09-23","hanzi":"世界","pinyin":"shìjiè","meaning":"thế giới","example":"世界上有很多国家。","examplePinyin":"shìjiè shàng yǒu hěnduō guójiā.","translation":"Trên thế giới có rất nhiều quốc gia."},{"id":"hsk3-T09-24","hanzi":"气候","pinyin":"qìhòu","meaning":"khí hậu","example":"南方的气候跟北方不一样。","examplePinyin":"Nánfāng de qìhòu gēn běifāng bù yíyàng.","translation":"Khí hậu miền Nam khác miền Bắc."},{"id":"hsk3-T09-25","hanzi":"景色","pinyin":"jǐngsè","meaning":"phong cảnh","example":"秋天山上的景色很美。","examplePinyin":"Qiūtiān shān shang de jǐngsè hěn měi.","translation":"Phong cảnh trên núi mùa thu rất đẹp."},{"id":"hsk3-T09-26","hanzi":"环保","pinyin":"huánbǎo","meaning":"bảo vệ môi trường","example":"骑自行车上班比较环保。","examplePinyin":"Qí zìxíngchē shàngbān bǐjiào huánbǎo.","translation":"Đi xe đạp đi làm khá thân thiện môi trường."},{"id":"hsk3-T09-27","hanzi":"环境","pinyin":"huánjìng","meaning":"môi trường","example":"这里的环境很好。","examplePinyin":"zhèlǐ de huánjìng hěnhǎo.","translation":"Môi trường ở đây rất tốt."},{"id":"hsk3-T09-28","hanzi":"种","pinyin":"zhòng","meaning":"trồng","example":"我想在花园里种花。","examplePinyin":"wǒ xiǎng zài huāyuán lǐ zhòng huā.","translation":"Tôi muốn trồng hoa trong vườn."},{"id":"hsk3-T09-29","hanzi":"预报","pinyin":"yùbào","meaning":"dự báo","example":"天气预报说明天会下雨。","examplePinyin":"Tiānqì yùbào shuō míngtiān huì xià yǔ.","translation":"Dự báo thời tiết nói mai sẽ mưa."},{"id":"hsk3-T09-30","hanzi":"存在","pinyin":"cúnzài","meaning":"tồn tại","example":"这个问题已经存在很多年了。","examplePinyin":"Zhège wèntí yǐjīng cúnzài hěn duō nián le.","translation":"Vấn đề này đã tồn tại nhiều năm."},{"id":"hsk3-T09-31","hanzi":"生存","pinyin":"shēngcún","meaning":"sinh tồn","example":"没有水，人就不能生存。","examplePinyin":"Méiyǒu shuǐ, rén jiù bù néng shēngcún.","translation":"Không có nước, con người không thể tồn tại."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/thien-nhien/"},{"id":10,"name":"GIẢI TRÍ I","words":[{"id":"hsk3-T10-01","hanzi":"划船","pinyin":"huá chuán","meaning":"chèo thuyền","example":"周末我想和朋友去划船。","examplePinyin":"Zhōumò wǒ xiǎng hé péngyou qù huá chuán.","translation":"Cuối tuần tôi muốn cùng bạn đi chèo thuyền."},{"id":"hsk3-T10-02","hanzi":"话剧","pinyin":"huàjù","meaning":"kịch nói","example":"我第一次看话剧，觉得很有意思。","examplePinyin":"Wǒ dì yī cì kàn huàjù, juéde hěn yǒu yìsi.","translation":"Lần đầu tôi xem kịch nói và thấy rất thú vị."},{"id":"hsk3-T10-03","hanzi":"京剧","pinyin":"jīngjù","meaning":"kinh kịch","example":"爷爷很喜欢京剧。","examplePinyin":"Yéye hěn xǐhuan jīngjù.","translation":"Ông rất thích kinh kịch."},{"id":"hsk3-T10-04","hanzi":"连续剧","pinyin":"liánxùjù","meaning":"phim truyền hình nhiều tập","example":"他昨天和朋友谈到了连续剧。","examplePinyin":"Tā zuótiān hé péngyou tándào le liánxùjù.","translation":"Hôm qua anh ấy và bạn trò chuyện về phim truyền hình nhiều tập."},{"id":"hsk3-T10-05","hanzi":"演出","pinyin":"yǎnchū","meaning":"buổi biểu diễn","example":"学校下个月要举办一次演出活动。","examplePinyin":"Xuéxiào xià ge yuè yào jǔbàn yí cì yǎnchū huódòng.","translation":"Tháng sau trường sẽ tổ chức một hoạt động buổi biểu diễn."},{"id":"hsk3-T10-06","hanzi":"美术","pinyin":"měishù","meaning":"mỹ thuật","example":"明天我们打算一起美术。","examplePinyin":"Míngtiān wǒmen dǎsuàn yìqǐ měishù.","translation":"Ngày mai chúng tôi dự định cùng mỹ thuật."},{"id":"hsk3-T10-07","hanzi":"球迷","pinyin":"qiúmí","meaning":"người hâm mộ bóng đá","example":"学校正在研究有关球迷的问题。","examplePinyin":"Xuéxiào zhèngzài yánjiū yǒuguān qiúmí de wèntí.","translation":"Nhà trường đang nghiên cứu vấn đề liên quan đến người hâm mộ bóng đá."},{"id":"hsk3-T10-08","hanzi":"设计","pinyin":"shèjì","meaning":"thiết kế","example":"老师让我们设计新衣服。","examplePinyin":"Lǎoshī ràng wǒmen shèjì xīn yīfu.","translation":"Giáo viên yêu cầu chúng tôi thiết kế quần áo mới."},{"id":"hsk3-T10-09","hanzi":"世界杯","pinyin":"Shìjièbēi","meaning":"World Cup","example":"我对世界杯很感兴趣。","examplePinyin":"Wǒ duì Shìjièbēi hěn gǎn xìngqù.","translation":"Tôi rất hứng thú với World Cup."},{"id":"hsk3-T10-10","hanzi":"跳舞","pinyin":"tiàowǔ","meaning":"nhảy múa","example":"今天我们学习“跳舞”这个词。","examplePinyin":"Jīntiān wǒmen xuéxí “tiàowǔ” zhège cí.","translation":"Hôm nay chúng tôi học từ “跳舞” (nhảy múa)."},{"id":"hsk3-T10-11","hanzi":"听众","pinyin":"tīngzhòng","meaning":"thính giả","example":"这位歌手的声音很好听，听众都很喜欢。","examplePinyin":"Zhè wèi gēshǒu de shēngyīn hěn hǎotīng, tīngzhòng dōu hěn xǐhuan.","translation":"Giọng ca sĩ này rất hay, thính giả đều yêu thích."},{"id":"hsk3-T10-12","hanzi":"杂志","pinyin":"zázhì","meaning":"tạp chí","example":"你喜欢杂志吗？","examplePinyin":"Nǐ xǐhuan zázhì ma?","translation":"Bạn có thích tạp chí không?"},{"id":"hsk3-T10-13","hanzi":"武术","pinyin":"wǔshù","meaning":"võ thuật","example":"周末我想和朋友去武术。","examplePinyin":"Zhōumò wǒ xiǎng hé péngyou qù wǔshù.","translation":"Cuối tuần tôi muốn cùng bạn đi võ thuật."},{"id":"hsk3-T10-14","hanzi":"技术","pinyin":"jìshù","meaning":"kỹ thuật","example":"他昨天和朋友谈到了技术。","examplePinyin":"Tā zuótiān hé péngyou tándào le jìshù.","translation":"Hôm qua anh ấy và bạn trò chuyện về kỹ thuật."},{"id":"hsk3-T10-15","hanzi":"观众","pinyin":"guānzhòng","meaning":"khán giả","example":"演出结束以后，观众都站起来了。","examplePinyin":"Yǎnchū jiéshù yǐhòu, guānzhòng dōu zhàn qǐlái le.","translation":"Buổi biểu diễn kết thúc, khán giả đều đứng dậy."},{"id":"hsk3-T10-16","hanzi":"国庆","pinyin":"guóqìng","meaning":"Quốc khánh","example":"很多人都很关心国庆。","examplePinyin":"Hěn duō rén dōu hěn guānxīn guóqìng.","translation":"Nhiều người rất quan tâm đến Quốc khánh."},{"id":"hsk3-T10-17","hanzi":"功夫","pinyin":"gōngfu","meaning":"võ thuật Trung Quốc","example":"学校下个月要举办一次功夫活动。","examplePinyin":"Xuéxiào xià ge yuè yào jǔbàn yí cì gōngfu huódòng.","translation":"Tháng sau trường sẽ tổ chức một hoạt động võ thuật Trung Quốc."},{"id":"hsk3-T10-18","hanzi":"武器","pinyin":"wǔqì","meaning":"vũ khí","example":"大家正在讨论武器的问题。","examplePinyin":"Dàjiā zhèngzài tǎolùn wǔqì de wèntí.","translation":"Mọi người đang thảo luận vấn đề vũ khí."},{"id":"hsk3-T10-19","hanzi":"旅行社","pinyin":"lǚxíngshè","meaning":"hãng lữ hành","example":"我们通过旅行社买了机票。","examplePinyin":"Wǒmen tōngguò lǚxíngshè mǎi le jīpiào.","translation":"Chúng tôi mua vé máy bay qua công ty du lịch."},{"id":"hsk3-T10-20","hanzi":"旅馆","pinyin":"lǚguǎn","meaning":"nhà trọ","example":"这家旅馆离车站很近。","examplePinyin":"Zhè jiā lǚguǎn lí chēzhàn hěn jìn.","translation":"Nhà trọ này rất gần ga."},{"id":"hsk3-T10-21","hanzi":"团体","pinyin":"tuántǐ","meaning":"đoàn, tập thể","example":"这次比赛有十个团体参加。","examplePinyin":"Zhè cì bǐsài yǒu shí ge tuántǐ cānjiā.","translation":"Cuộc thi này có mười đoàn tham gia."},{"id":"hsk3-T10-22","hanzi":"工夫","pinyin":"gōngfu","meaning":"thời gian, công sức","example":"学好汉语需要花很多工夫。","examplePinyin":"Xué hǎo Hànyǔ xūyào huā hěn duō gōngfu.","translation":"Học giỏi tiếng Trung cần bỏ nhiều công sức."},{"id":"hsk3-T10-23","hanzi":"空儿","pinyin":"kòngr","meaning":"thời gian rảnh","example":"你明天下午有空儿吗？","examplePinyin":"Nǐ míngtiān xiàwǔ yǒu kòngr ma?","translation":"Chiều mai bạn có rảnh không?"}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/giai-tri-toi/"},{"id":11,"name":"GIẢI TRÍ II","words":[{"id":"hsk3-T11-01","hanzi":"游戏","pinyin":"yóuxì","meaning":"trò chơi","example":"孩子们喜欢玩游戏。","examplePinyin":"háizi men xǐhuān wán yóuxì.","translation":"Bọn trẻ thích chơi trò chơi."},{"id":"hsk3-T11-02","hanzi":"游泳","pinyin":"yóuyǒng","meaning":"bơi lội","example":"我喜欢游泳。","examplePinyin":"Wǒ xǐhuan yóuyǒng.","translation":"Tôi thích bơi."},{"id":"hsk3-T11-03","hanzi":"游","pinyin":"yóu","meaning":"bơi, đi chơi","example":"鱼在水里游。","examplePinyin":"Yú zài shuǐ lǐ yóu.","translation":"Cá bơi trong nước."},{"id":"hsk3-T11-04","hanzi":"文化","pinyin":"wénhuà","meaning":"văn hóa","example":"我想了解中国文化。","examplePinyin":"wǒ xiǎng liǎojiě zhōngguówénhuà.","translation":"Tôi muốn tìm hiểu văn hóa Trung Quốc."},{"id":"hsk3-T11-05","hanzi":"艺术","pinyin":"yìshù","meaning":"nghệ thuật","example":"她从小就对艺术感兴趣。","examplePinyin":"Tā cóng xiǎo jiù duì yìshù gǎn xìngqù.","translation":"Cô ấy yêu thích nghệ thuật từ nhỏ."},{"id":"hsk3-T11-06","hanzi":"祝","pinyin":"zhù","meaning":"chúc","example":"祝你考试顺利！","examplePinyin":"Zhù nǐ kǎoshì shùnlì!","translation":"Chúc bạn thi thuận lợi!"},{"id":"hsk3-T11-07","hanzi":"庆祝","pinyin":"qìngzhù","meaning":"ăn mừng","example":"为了庆祝毕业，我们一起吃饭。","examplePinyin":"Wèile qìngzhù bìyè, wǒmen yìqǐ chīfàn.","translation":"Để mừng tốt nghiệp, chúng tôi cùng ăn cơm."},{"id":"hsk3-T11-08","hanzi":"表演","pinyin":"biǎoyǎn","meaning":"biểu diễn","example":"她在晚会上表演唱歌。","examplePinyin":"tā zài wǎnhuì shàng biǎoyǎn chàng gē.","translation":"Cô ấy biểu diễn hát ở buổi liên hoan."},{"id":"hsk3-T11-09","hanzi":"比赛","pinyin":"bǐsài","meaning":"cuộc thi","example":"明天的比赛很重要。","examplePinyin":"míngtiān de bǐsài hěn zhòngyào.","translation":"Trận đấu ngày mai rất quan trọng."},{"id":"hsk3-T11-10","hanzi":"决赛","pinyin":"juésài","meaning":"trận chung kết","example":"今天晚上有足球决赛。","examplePinyin":"Jīntiān wǎnshang yǒu zúqiú juésài.","translation":"Tối nay có trận chung kết bóng đá."},{"id":"hsk3-T11-11","hanzi":"舞台","pinyin":"wǔtái","meaning":"sân khấu","example":"她第一次站在舞台上，有点儿紧张。","examplePinyin":"Tā dì yī cì zhàn zài wǔtái shang, yǒudiǎnr jǐnzhāng.","translation":"Lần đầu đứng trên sân khấu, cô ấy hơi căng thẳng."},{"id":"hsk3-T11-12","hanzi":"电视剧","pinyin":"diànshìjù","meaning":"phim truyền hình","example":"这部电视剧一共有三十集。","examplePinyin":"Zhè bù diànshìjù yígòng yǒu sānshí jí.","translation":"Bộ phim truyền hình này có tổng cộng 30 tập."},{"id":"hsk3-T11-13","hanzi":"足球","pinyin":"zúqiú","meaning":"bóng đá","example":"他喜欢足球。","examplePinyin":"Tā xǐhuan zúqiú.","translation":"Anh ấy thích bóng đá."},{"id":"hsk3-T11-14","hanzi":"乐队","pinyin":"yuèduì","meaning":"ban nhạc","example":"这个乐队有五个人，他们每个周末都一起练习。","examplePinyin":"Zhège yuèduì yǒu wǔ ge rén, tāmen měi ge zhōumò dōu yìqǐ liànxí.","translation":"Ban nhạc này có năm người, cuối tuần nào họ cũng luyện tập cùng nhau."},{"id":"hsk3-T11-15","hanzi":"乐队","pinyin":"yuèduì","meaning":"dàn nhạc","example":"这支乐队正在准备明天的演出。","examplePinyin":"Zhè zhī yuèduì zhèngzài zhǔnbèi míngtiān de yǎnchū.","translation":"Dàn nhạc này đang chuẩn bị cho buổi biểu diễn ngày mai."},{"id":"hsk3-T11-16","hanzi":"演唱","pinyin":"yǎnchàng","meaning":"hát, trình diễn","example":"她在晚会上演唱了一首中文歌。","examplePinyin":"Tā zài wǎnhuì shang yǎnchàng le yì shǒu Zhōngwén gē.","translation":"Cô ấy biểu diễn một bài hát tiếng Trung trong liên hoan."},{"id":"hsk3-T11-17","hanzi":"歌迷","pinyin":"gēmí","meaning":"người hâm mộ ca sĩ","example":"演唱会结束以后，歌迷还在等歌手。","examplePinyin":"Yǎnchànghuì jiéshù yǐhòu, gēmí hái zài děng gēshǒu.","translation":"Sau hòa nhạc, người hâm mộ vẫn đợi ca sĩ."},{"id":"hsk3-T11-18","hanzi":"歌声","pinyin":"gēshēng","meaning":"giọng hát","example":"我从楼上听到了美丽的歌声。","examplePinyin":"Wǒ cóng lóushang tīngdào le měilì de gēshēng.","translation":"Tôi nghe tiếng hát hay vọng từ tầng trên."},{"id":"hsk3-T11-19","hanzi":"歌手","pinyin":"gēshǒu","meaning":"ca sĩ","example":"她是一名年轻歌手。","examplePinyin":"Tā shì yì míng niánqīng gēshǒu.","translation":"Cô ấy là một ca sĩ trẻ."},{"id":"hsk3-T11-20","hanzi":"演唱会","pinyin":"yǎnchànghuì","meaning":"buổi hòa nhạc","example":"这场演唱会的票太贵了。","examplePinyin":"Zhè chǎng yǎnchànghuì de piào tài guì le.","translation":"Vé buổi hòa nhạc này đắt quá."},{"id":"hsk3-T11-21","hanzi":"剧场","pinyin":"jùchǎng","meaning":"nhà hát","example":"剧场在图书馆附近。","examplePinyin":"Jùchǎng zài túshūguǎn fùjìn.","translation":"Nhà hát nằm gần thư viện."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/giai-tri-ii/"},{"id":12,"name":"LÀM VIỆC I","words":[{"id":"hsk3-T12-01","hanzi":"会议","pinyin":"huìyì","meaning":"cuộc họp","example":"下午三点有一个会议。","examplePinyin":"xiàwǔ sān diǎn yǒu yí ge huìyì.","translation":"Ba giờ chiều có một cuộc họp."},{"id":"hsk3-T12-02","hanzi":"从事","pinyin":"cóngshì","meaning":"làm trong lĩnh vực","example":"我姐姐一直从事教育工作。","examplePinyin":"Wǒ jiějie yìzhí cóngshì jiàoyù gōngzuò.","translation":"Chị gái tôi luôn làm trong lĩnh vực giáo dục."},{"id":"hsk3-T12-03","hanzi":"注意","pinyin":"zhùyì","meaning":"chú ý","example":"请注意安全。","examplePinyin":"qǐng zhùyì ān quán.","translation":"Hãy chú ý an toàn."},{"id":"hsk3-T12-04","hanzi":"双方","pinyin":"shuāngfāng","meaning":"hai bên","example":"双方都同意这个办法。","examplePinyin":"Shuāngfāng dōu tóngyì zhège bànfǎ.","translation":"Cả hai bên đều đồng ý với phương án này."},{"id":"hsk3-T12-05","hanzi":"使","pinyin":"shǐ","meaning":"khiến, làm cho","example":"这个方法使我更加喜欢学习汉语。","examplePinyin":"Zhège fāngfǎ shǐ wǒ gèngjiā xǐhuan xuéxí Hànyǔ.","translation":"Phương pháp này khiến tôi thích học tiếng Trung hơn."},{"id":"hsk3-T12-06","hanzi":"电子邮件","pinyin":"diànzǐ yóujiàn","meaning":"email","example":"他昨天和朋友谈到了电子邮件。","examplePinyin":"Tā zuótiān hé péngyou tándào le diànzǐ yóujiàn.","translation":"Hôm qua anh ấy và bạn trò chuyện về email."},{"id":"hsk3-T12-07","hanzi":"办理","pinyin":"bànlǐ","meaning":"làm thủ tục","example":"我希望以后能办理手续。","examplePinyin":"Wǒ xīwàng yǐhòu néng bànlǐ shǒuxù.","translation":"Tôi hy vọng sau này có thể làm thủ tục thủ tục."},{"id":"hsk3-T12-08","hanzi":"退休","pinyin":"tuìxiū","meaning":"nghỉ hưu","example":"爸爸明年就退休了。","examplePinyin":"Bàba míngnián jiù tuìxiū le.","translation":"Năm sau bố tôi nghỉ hưu."},{"id":"hsk3-T12-09","hanzi":"加工","pinyin":"jiāgōng","meaning":"gia công","example":"他们正在加工食品。","examplePinyin":"Tāmen zhèngzài jiāgōng shípǐn.","translation":"Họ đang gia công thực phẩm."},{"id":"hsk3-T12-10","hanzi":"举办","pinyin":"jǔbàn","meaning":"tổ chức","example":"学校决定举办比赛。","examplePinyin":"Xuéxiào juédìng jǔbàn bǐsài.","translation":"Nhà trường quyết định tổ chức cuộc thi."},{"id":"hsk3-T12-11","hanzi":"联系","pinyin":"liánxì","meaning":"liên hệ","example":"老师让我们联系朋友。","examplePinyin":"Lǎoshī ràng wǒmen liánxì péngyou.","translation":"Giáo viên yêu cầu chúng tôi liên hệ bạn bè."},{"id":"hsk3-T12-12","hanzi":"报到","pinyin":"bàodào","meaning":"báo danh","example":"明天新生到学校报到。","examplePinyin":"Míngtiān xīnshēng dào xuéxiào bàodào.","translation":"Ngày mai học sinh mới đến trường báo danh."},{"id":"hsk3-T12-13","hanzi":"报道","pinyin":"bàodào","meaning":"đưa tin","example":"我们需要报道新闻。","examplePinyin":"Wǒmen xūyào bàodào xīnwén.","translation":"Chúng ta cần đưa tin tin tức."},{"id":"hsk3-T12-14","hanzi":"报告","pinyin":"bàogào","meaning":"báo cáo","example":"他们正在报告工作。","examplePinyin":"Tāmen zhèngzài bàogào gōngzuò.","translation":"Họ đang báo cáo công việc."},{"id":"hsk3-T12-15","hanzi":"表格","pinyin":"biǎogé","meaning":"biểu mẫu","example":"请先填写这张表格。","examplePinyin":"Qǐng xiān tiánxiě zhè zhāng biǎogé.","translation":"Hãy điền biểu mẫu này trước."},{"id":"hsk3-T12-16","hanzi":"主持","pinyin":"zhǔchí","meaning":"chủ trì","example":"老师让我们主持会议。","examplePinyin":"Lǎoshī ràng wǒmen zhǔchí huìyì.","translation":"Giáo viên yêu cầu chúng tôi chủ trì cuộc họp."},{"id":"hsk3-T12-17","hanzi":"部","pinyin":"bù","meaning":"bộ, lượng từ chỉ phim","example":"“部”这个词在课文里出现了。","examplePinyin":"“bù” zhège cí zài kèwén lǐ chūxiàn le.","translation":"Từ “bộ, lượng từ chỉ phim” xuất hiện trong bài khóa."},{"id":"hsk3-T12-18","hanzi":"合作","pinyin":"hézuò","meaning":"hợp tác","example":"我们需要合作完成任务。","examplePinyin":"Wǒmen xūyào hézuò wánchéng rènwu.","translation":"Chúng ta cần hợp tác hoàn thành nhiệm vụ."},{"id":"hsk3-T12-19","hanzi":"工资","pinyin":"gōngzī","meaning":"tiền lương","example":"虽然工资不高，但是他很喜欢工作。","examplePinyin":"Suīrán gōngzī bù gāo, dànshì tā hěn xǐhuan gōngzuò.","translation":"Dù lương không cao, anh ấy rất thích công việc."},{"id":"hsk3-T12-20","hanzi":"带领","pinyin":"dàilǐng","meaning":"dẫn dắt","example":"学校决定带领学生。","examplePinyin":"Xuéxiào juédìng dàilǐng xuésheng.","translation":"Nhà trường quyết định dẫn dắt học sinh."},{"id":"hsk3-T12-21","hanzi":"建成","pinyin":"jiànchéng","meaning":"xây dựng xong","example":"你知道应该怎么建成吗？","examplePinyin":"Nǐ zhīdào yīnggāi zěnme jiànchéng ma?","translation":"Bạn biết nên xây dựng xong như thế nào không?"},{"id":"hsk3-T12-22","hanzi":"建立","pinyin":"jiànlì","meaning":"thành lập","example":"我希望以后能建立新学校。","examplePinyin":"Wǒ xīwàng yǐhòu néng jiànlì xīn xuéxiào.","translation":"Tôi hy vọng sau này có thể thành lập trường học mới."},{"id":"hsk3-T12-23","hanzi":"建设","pinyin":"jiànshè","meaning":"xây dựng","example":"我们需要建设医院。","examplePinyin":"Wǒmen xūyào jiànshè yīyuàn.","translation":"Chúng ta cần xây dựng bệnh viện."},{"id":"hsk3-T12-24","hanzi":"大使馆","pinyin":"dàshǐguǎn","meaning":"đại sứ quán","example":"我们下个星期打算去大使馆。","examplePinyin":"Wǒmen xià ge xīngqī dǎsuàn qù dàshǐguǎn.","translation":"Tuần sau chúng tôi định đến đại sứ quán."},{"id":"hsk3-T12-25","hanzi":"压力","pinyin":"yālì","meaning":"áp lực","example":"最近他的工作压力很大。","examplePinyin":"Zuìjìn tā de gōngzuò yālì hěn dà.","translation":"Gần đây áp lực công việc của anh ấy rất lớn."},{"id":"hsk3-T12-26","hanzi":"困难","pinyin":"kùnnan","meaning":"khó khăn","example":"学习汉语虽然有困难，但是我很开心。","examplePinyin":"Xuéxí Hànyǔ suīrán yǒu kùnnan, dànshì wǒ hěn kāixīn.","translation":"Học tiếng Trung tuy khó khăn nhưng tôi rất vui."},{"id":"hsk3-T12-27","hanzi":"困","pinyin":"kùn","meaning":"buồn ngủ","example":"我昨天睡得很晚，现在很困。","examplePinyin":"Wǒ zuótiān shuì de hěn wǎn, xiànzài hěn kùn.","translation":"Hôm qua tôi ngủ rất muộn, bây giờ rất buồn ngủ."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/lam-viec-toi/"},{"id":13,"name":"CÔNG VIỆC II","words":[{"id":"hsk3-T13-01","hanzi":"领导","pinyin":"lǐngdǎo","meaning":"lãnh đạo","example":"这位领导很关心员工。","examplePinyin":"Zhè wèi lǐngdǎo hěn guānxīn yuángōng.","translation":"Vị lãnh đạo này rất quan tâm nhân viên."},{"id":"hsk3-T13-02","hanzi":"人员","pinyin":"rényuán","meaning":"nhân viên","example":"这次会议一共有三十名人员参加。","examplePinyin":"Zhè cì huìyì yígòng yǒu sānshí míng rényuán cānjiā.","translation":"Cuộc họp lần này có tổng cộng 30 người tham gia."},{"id":"hsk3-T13-03","hanzi":"任务","pinyin":"rènwu","meaning":"nhiệm vụ","example":"经理给我一个新任务。","examplePinyin":"Jīnglǐ gěi wǒ yí ge xīn rènwu.","translation":"Giám đốc giao cho tôi một nhiệm vụ mới."},{"id":"hsk3-T13-04","hanzi":"事业","pinyin":"shìyè","meaning":"sự nghiệp","example":"她希望发展自己的事业。","examplePinyin":"Tā xīwàng fāzhǎn zìjǐ de shìyè.","translation":"Cô ấy hy vọng phát triển sự nghiệp riêng."},{"id":"hsk3-T13-05","hanzi":"文件","pinyin":"wénjiàn","meaning":"tài liệu","example":"请把文件发到我的邮箱。","examplePinyin":"Qǐng bǎ wénjiàn fā dào wǒ de yóuxiāng.","translation":"Hãy gửi tài liệu vào email của tôi."},{"id":"hsk3-T13-06","hanzi":"邮件","pinyin":"yóujiàn","meaning":"email","example":"我已经发邮件给老师了。","examplePinyin":"wǒ yǐjīng fā yóujiàn gěi lǎoshī le.","translation":"Tôi đã gửi email cho giáo viên rồi."},{"id":"hsk3-T13-07","hanzi":"责任","pinyin":"zérèn","meaning":"trách nhiệm","example":"做好自己的工作是我的责任。","examplePinyin":"Zuò hǎo zìjǐ de gōngzuò shì wǒ de zérèn.","translation":"Làm tốt công việc của mình là trách nhiệm của tôi."},{"id":"hsk3-T13-08","hanzi":"正式","pinyin":"zhèngshì","meaning":"chính thức","example":"下个星期我正式开始新工作。","examplePinyin":"Xià ge xīngqī wǒ zhèngshì kāishǐ xīn gōngzuò.","translation":"Tuần sau tôi chính thức bắt đầu công việc mới."},{"id":"hsk3-T13-09","hanzi":"资格","pinyin":"zīgé","meaning":"tư cách, tiêu chuẩn","example":"他有参加比赛的资格。","examplePinyin":"Tā yǒu cānjiā bǐsài de zīgé.","translation":"Anh ấy đủ điều kiện tham gia cuộc thi."},{"id":"hsk3-T13-10","hanzi":"管理","pinyin":"guǎnlǐ","meaning":"quản lý","example":"老师让我们管理公司。","examplePinyin":"Lǎoshī ràng wǒmen guǎnlǐ gōngsī.","translation":"Giáo viên yêu cầu chúng tôi quản lý công ty."},{"id":"hsk3-T13-11","hanzi":"访问","pinyin":"fǎngwèn","meaning":"thăm, truy cập","example":"我希望以后能访问网站。","examplePinyin":"Wǒ xīwàng yǐhòu néng fǎngwèn wǎngzhàn.","translation":"Tôi hy vọng sau này có thể thăm, truy cập website."},{"id":"hsk3-T13-12","hanzi":"负责","pinyin":"fùzé","meaning":"phụ trách","example":"我们需要负责这次活动。","examplePinyin":"Wǒmen xūyào fùzé zhè cì huódòng.","translation":"Chúng ta cần phụ trách hoạt động lần này."},{"id":"hsk3-T13-13","hanzi":"派","pinyin":"pài","meaning":"cử đi","example":"这件事我们明天再派吧。","examplePinyin":"Zhè jiàn shì wǒmen míngtiān zài pài ba.","translation":"Việc này ngày mai chúng ta hãy cử đi nhé."},{"id":"hsk3-T13-14","hanzi":"任","pinyin":"rèn","meaning":"đảm nhiệm","example":"我想先任，然后再休息。","examplePinyin":"Wǒ xiǎng xiān rèn, ránhòu zài xiūxi.","translation":"Tôi muốn đảm nhiệm trước rồi mới nghỉ ngơi."},{"id":"hsk3-T13-15","hanzi":"退出","pinyin":"tuìchū","meaning":"rút khỏi","example":"我们可以先试着退出。","examplePinyin":"Wǒmen kěyǐ xiān shì zhe tuìchū.","translation":"Chúng ta có thể thử rút khỏi trước."},{"id":"hsk3-T13-16","hanzi":"指导","pinyin":"zhǐdǎo","meaning":"hướng dẫn","example":"我希望以后能指导学生。","examplePinyin":"Wǒ xīwàng yǐhòu néng zhǐdǎo xuésheng.","translation":"Tôi hy vọng sau này có thể hướng dẫn học sinh."},{"id":"hsk3-T13-17","hanzi":"手续","pinyin":"shǒuxù","meaning":"thủ tục","example":"他昨天和朋友谈到了手续。","examplePinyin":"Tā zuótiān hé péngyou tándào le shǒuxù.","translation":"Hôm qua anh ấy và bạn trò chuyện về thủ tục."},{"id":"hsk3-T13-18","hanzi":"就业","pinyin":"jiùyè","meaning":"việc làm","example":"大学毕业后，就业是一个重要问题。","examplePinyin":"Dàxué bìyè hòu, jiùyè shì yí ge zhòngyào wèntí.","translation":"Sau khi tốt nghiệp đại học, việc làm là một vấn đề quan trọng."},{"id":"hsk3-T13-19","hanzi":"复印","pinyin":"fùyìn","meaning":"sao chụp","example":"学校决定复印文件。","examplePinyin":"Xuéxiào juédìng fùyìn wénjiàn.","translation":"Nhà trường quyết định sao chụp tài liệu."},{"id":"hsk3-T13-20","hanzi":"创业","pinyin":"chuàngyè","meaning":"khởi nghiệp","example":"他打算和朋友一起创业。","examplePinyin":"Tā dǎsuàn hé péngyou yìqǐ chuàngyè.","translation":"Anh ấy định cùng bạn khởi nghiệp."},{"id":"hsk3-T13-21","hanzi":"开业","pinyin":"kāiyè","meaning":"khai trương","example":"这家新饭馆明天开业。","examplePinyin":"Zhè jiā xīn fànguǎn míngtiān kāiyè.","translation":"Nhà hàng mới này khai trương ngày mai."},{"id":"hsk3-T13-22","hanzi":"设立","pinyin":"shèlì","meaning":"thiết lập","example":"我们需要设立新学校。","examplePinyin":"Wǒmen xūyào shèlì xīn xuéxiào.","translation":"Chúng ta cần thiết lập trường học mới."},{"id":"hsk3-T13-23","hanzi":"工厂","pinyin":"gōngchǎng","meaning":"nhà máy","example":"我还没有去过工厂。","examplePinyin":"Wǒ hái méiyǒu qùguo gōngchǎng.","translation":"Tôi chưa từng đến nhà máy."},{"id":"hsk3-T13-24","hanzi":"厂","pinyin":"chǎng","meaning":"xưởng, nhà máy","example":"我们需要更多关于厂的信息。","examplePinyin":"Wǒmen xūyào gèng duō guānyú chǎng de xìnxī.","translation":"Chúng tôi cần thêm thông tin về xưởng, nhà máy."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/cong-viec-ii/"},{"id":14,"name":"VẬN CHUYỂN VÀ DI CHUYỂN","words":[{"id":"hsk3-T14-01","hanzi":"跳高","pinyin":"tiàogāo","meaning":"nhảy cao","example":"周末我想和朋友去跳高。","examplePinyin":"Zhōumò wǒ xiǎng hé péngyou qù tiàogāo.","translation":"Cuối tuần tôi muốn cùng bạn đi nhảy cao."},{"id":"hsk3-T14-02","hanzi":"停止","pinyin":"tíngzhǐ","meaning":"dừng lại","example":"雨终于停止了。","examplePinyin":"Yǔ zhōngyú tíngzhǐ le.","translation":"Cuối cùng mưa đã tạnh."},{"id":"hsk3-T14-03","hanzi":"前往","pinyin":"qiánwǎng","meaning":"đi đến","example":"我们明天早上七点前往机场。","examplePinyin":"Wǒmen míngtiān zǎoshang qī diǎn qiánwǎng jīchǎng.","translation":"Sáng mai chúng tôi đến sân bay lúc bảy giờ."},{"id":"hsk3-T14-04","hanzi":"推动","pinyin":"tuīdòng","meaning":"thúc đẩy","example":"老师让我们推动发展。","examplePinyin":"Lǎoshī ràng wǒmen tuīdòng fāzhǎn.","translation":"Giáo viên yêu cầu chúng tôi thúc đẩy sự phát triển."},{"id":"hsk3-T14-05","hanzi":"推进","pinyin":"tuījìn","meaning":"đẩy mạnh","example":"我希望以后能推进计划。","examplePinyin":"Wǒ xīwàng yǐhòu néng tuījìn jìhuà.","translation":"Tôi hy vọng sau này có thể đẩy mạnh kế hoạch."},{"id":"hsk3-T14-06","hanzi":"推开","pinyin":"tuīkāi","meaning":"đẩy mở","example":"我们需要推开门。","examplePinyin":"Wǒmen xūyào tuīkāi mén.","translation":"Chúng ta cần đẩy mở cửa."},{"id":"hsk3-T14-07","hanzi":"退","pinyin":"tuì","meaning":"lùi, trả lại","example":"我正在学习怎么退。","examplePinyin":"Wǒ zhèngzài xuéxí zěnme tuì.","translation":"Tôi đang học cách lùi, trả lại."},{"id":"hsk3-T14-08","hanzi":"自动","pinyin":"zìdòng","meaning":"tự động","example":"这扇门是自动的。","examplePinyin":"Zhè shàn mén shì zìdòng de.","translation":"Cánh cửa này là cửa tự động."},{"id":"hsk3-T14-09","hanzi":"转","pinyin":"zhuǎn","meaning":"rẽ, chuyển","example":"老师让我们转右。","examplePinyin":"Lǎoshī ràng wǒmen zhuǎn yòu.","translation":"Giáo viên yêu cầu chúng tôi rẽ, chuyển sang phải."},{"id":"hsk3-T14-10","hanzi":"追","pinyin":"zhuī","meaning":"đuổi theo","example":"小狗跑出去了，弟弟马上追过去。","examplePinyin":"Xiǎo gǒu pǎo chūqu le, dìdi mǎshàng zhuī guòqu.","translation":"Chó con chạy ra ngoài, em trai lập tức đuổi theo."},{"id":"hsk3-T14-11","hanzi":"展开","pinyin":"zhǎnkāi","meaning":"mở ra","example":"我们需要展开地图。","examplePinyin":"Wǒmen xūyào zhǎnkāi dìtú.","translation":"Chúng ta cần mở ra bản đồ."},{"id":"hsk3-T14-12","hanzi":"快速","pinyin":"kuàisù","meaning":"nhanh chóng","example":"他快速地跑到了车站。","examplePinyin":"Tā kuàisù de pǎo dào le chēzhàn.","translation":"Anh ấy nhanh chóng chạy đến nhà ga."},{"id":"hsk3-T14-13","hanzi":"高速","pinyin":"gāosù","meaning":"cao tốc","example":"高速列车比普通火车快得多。","examplePinyin":"Gāosù lièchē bǐ pǔtōng huǒchē kuài de duō.","translation":"Tàu cao tốc nhanh hơn tàu thường rất nhiều."},{"id":"hsk3-T14-14","hanzi":"运输","pinyin":"yùnshū","meaning":"vận chuyển","example":"老师让我们运输食品。","examplePinyin":"Lǎoshī ràng wǒmen yùnshū shípǐn.","translation":"Giáo viên yêu cầu chúng tôi vận chuyển thực phẩm."},{"id":"hsk3-T14-15","hanzi":"动力","pinyin":"dònglì","meaning":"động lực","example":"父母的支持给了我动力。","examplePinyin":"Fùmǔ de zhīchí gěi le wǒ dònglì.","translation":"Sự ủng hộ của bố mẹ cho tôi động lực."},{"id":"hsk3-T14-16","hanzi":"赶","pinyin":"gǎn","meaning":"vội, cố kịp","example":"我们还要赶火车呢。","examplePinyin":"Wǒmen hái yào gǎn huǒchē ne.","translation":"Chúng ta còn phải chạy cho kịp chuyến tàu."},{"id":"hsk3-T14-17","hanzi":"赶到","pinyin":"gǎndào","meaning":"vội đến nơi","example":"他很快赶到了医院。","examplePinyin":"Tā hěn kuài gǎndào le yīyuàn.","translation":"Anh ấy vội đến bệnh viện rất nhanh."},{"id":"hsk3-T14-18","hanzi":"高速公路","pinyin":"gāosù gōnglù","meaning":"đường cao tốc","example":"这条高速公路通向机场。","examplePinyin":"Zhè tiáo gāosù gōnglù tōngxiàng jīchǎng.","translation":"Đường cao tốc này dẫn đến sân bay."},{"id":"hsk3-T14-19","hanzi":"搬","pinyin":"bān","meaning":"chuyển, khiêng","example":"请帮我搬这个箱子。","examplePinyin":"qǐng bāng wǒ bān zhège xiāngzi.","translation":"Hãy giúp tôi chuyển chiếc thùng này."},{"id":"hsk3-T14-20","hanzi":"步","pinyin":"bù","meaning":"bước","example":"他向前走了几步。","examplePinyin":"Tā xiàng qián zǒu le jǐ bù.","translation":"Anh ấy bước về phía trước vài bước."},{"id":"hsk3-T14-21","hanzi":"到达","pinyin":"dàodá","meaning":"đến nơi","example":"这次我们决定一起到达。","examplePinyin":"Zhè cì wǒmen juédìng yìqǐ dàodá.","translation":"Lần này chúng tôi quyết định cùng đến nơi."},{"id":"hsk3-T14-22","hanzi":"排","pinyin":"pái","meaning":"xếp hàng","example":"我们排了半个小时的队。","examplePinyin":"Wǒmen pái le bàn ge xiǎoshí de duì.","translation":"Chúng tôi xếp hàng nửa tiếng."},{"id":"hsk3-T14-23","hanzi":"加快","pinyin":"jiākuài","meaning":"tăng tốc","example":"学校决定加快速度。","examplePinyin":"Xuéxiào juédìng jiākuài sùdù.","translation":"Nhà trường quyết định tăng tốc tốc độ."},{"id":"hsk3-T14-24","hanzi":"跑步","pinyin":"pǎobù","meaning":"chạy bộ","example":"我每天跑步。","examplePinyin":"Wǒ měitiān pǎobù.","translation":"Tôi chạy bộ mỗi ngày."},{"id":"hsk3-T14-25","hanzi":"散步","pinyin":"sànbù","meaning":"đi dạo","example":"吃完饭以后，爷爷去公园散步。","examplePinyin":"Chī wán fàn yǐhòu, yéye qù gōngyuán sànbù.","translation":"Ăn xong, ông đến công viên đi dạo."},{"id":"hsk3-T14-26","hanzi":"上升","pinyin":"shàngshēng","meaning":"tăng lên","example":"最近气温不断上升。","examplePinyin":"Zuìjìn qìwēn búduàn shàngshēng.","translation":"Gần đây nhiệt độ không ngừng tăng."},{"id":"hsk3-T14-27","hanzi":"上去","pinyin":"shàngqu","meaning":"đi lên","example":"我走上去。","examplePinyin":"Wǒ zǒu shàngqu.","translation":"Tôi đi lên đó."},{"id":"hsk3-T14-28","hanzi":"上来","pinyin":"shànglai","meaning":"lên đây","example":"你上来吧。","examplePinyin":"Nǐ shànglai ba.","translation":"Bạn lên đây đi."},{"id":"hsk3-T14-29","hanzi":"跳","pinyin":"tiào","meaning":"nhảy","example":"小孩子喜欢跳。","examplePinyin":"xiǎoháizǐ xǐhuān tiào.","translation":"Trẻ nhỏ thích nhảy."},{"id":"hsk3-T14-30","hanzi":"跳远","pinyin":"tiàoyuǎn","meaning":"nhảy xa","example":"明天我们打算一起跳远。","examplePinyin":"Míngtiān wǒmen dǎsuàn yìqǐ tiàoyuǎn.","translation":"Ngày mai chúng tôi dự định cùng nhảy xa."},{"id":"hsk3-T14-31","hanzi":"调","pinyin":"diào","meaning":"điều động","example":"公司决定把他调到上海工作。","examplePinyin":"Gōngsī juédìng bǎ tā diào dào Shànghǎi gōngzuò.","translation":"Công ty quyết định điều anh ấy đến Thượng Hải làm việc."},{"id":"hsk3-T14-32","hanzi":"下来","pinyin":"xiàlai","meaning":"xuống đây","example":"请下来。","examplePinyin":"Qǐng xiàlai.","translation":"Mời xuống đây."},{"id":"hsk3-T14-33","hanzi":"下去","pinyin":"xiàqu","meaning":"đi xuống","example":"你先下去吧。","examplePinyin":"Nǐ xiān xiàqu ba.","translation":"Bạn xuống đó trước đi."},{"id":"hsk3-T14-34","hanzi":"速度","pinyin":"sùdù","meaning":"tốc độ","example":"下雨时开车，速度不要太快。","examplePinyin":"Xià yǔ shí kāichē, sùdù bú yào tài kuài.","translation":"Khi trời mưa, đừng lái xe quá nhanh."},{"id":"hsk3-T14-35","hanzi":"铁路","pinyin":"tiělù","meaning":"đường sắt","example":"这条铁路经过很多城市。","examplePinyin":"Zhè tiáo tiělù jīngguò hěn duō chéngshì.","translation":"Tuyến đường sắt này đi qua nhiều thành phố."},{"id":"hsk3-T14-36","hanzi":"飞行","pinyin":"fēixíng","meaning":"bay","example":"今天的飞行时间可能会改变。","examplePinyin":"Jīntiān de fēixíng shíjiān kěnéng huì gǎibiàn.","translation":"Giờ bay hôm nay có thể thay đổi."},{"id":"hsk3-T14-37","hanzi":"路线","pinyin":"lùxiàn","meaning":"lộ trình","example":"请把路线发给我。","examplePinyin":"Qǐng bǎ lùxiàn fā gěi wǒ.","translation":"Hãy gửi lộ trình cho tôi."},{"id":"hsk3-T14-38","hanzi":"线","pinyin":"xiàn","meaning":"tuyến, sợi","example":"今天老师教了我们“线”这个词。","examplePinyin":"Jīntiān lǎoshī jiāo le wǒmen “xiàn” zhège cí.","translation":"Hôm nay giáo viên dạy chúng tôi từ “tuyến, sợi”."},{"id":"hsk3-T14-39","hanzi":"米","pinyin":"mǐ","meaning":"mét","example":"这座山有两千多米高。","examplePinyin":"Zhè zuò shān yǒu liǎng qiān duō mǐ gāo.","translation":"Ngọn núi này cao hơn hai nghìn mét."},{"id":"hsk3-T14-40","hanzi":"接近","pinyin":"jiējìn","meaning":"đến gần","example":"现在已经接近十二点了。","examplePinyin":"Xiànzài yǐjīng jiējìn shí'èr diǎn le.","translation":"Bây giờ đã gần mười hai giờ."}],"sourceUrl":"https://xiehanzi.com/thu-vien-new-hsk/new-hsk-3/van-chuyen-va-di-chuyen/"},{"id":15,"name":"NƠI","words":[{"id":"hsk3-T15-01","hanzi":"所","pinyin":"suǒ","meaning":"lượng từ cho trường học","example":"这个城市有三所大学。","examplePinyin":"Zhège chéngshì yǒu sān suǒ dàxué.","translation":"Thành phố này có ba trường đại học."},{"id":"hsk3-T15-02","hanzi":"场所","pinyin":"chǎngsuǒ","meaning":"địa điểm","example":"学校正在研究有关场所的问题。","examplePinyin":"Xuéxiào zhèngzài yánjiū yǒuguān chǎngsuǒ de wèntí.","translation":"Nhà trường đang nghiên cứu vấn đề liên quan đến địa điểm."},{"id":"hsk3-T15-03","hanzi":"背后","pinyin":"bèihòu","meaning":"phía sau","example":"我听到背后有人叫我。","examplePinyin":"Wǒ tīngdào bèihòu yǒu rén jiào wǒ.","translation":"Tôi nghe có người gọi từ phía sau."},{"id":"hsk3-T15-04","hanzi":"周围","pinyin":"zhōuwéi","meaning":"xung quanh","example":"学校周围有很多饭馆。","examplePinyin":"Xuéxiào zhōuwéi yǒu hěn duō fànguǎn.","translation":"Xung quanh trường có nhiều nhà hàng."},{"id":"hsk3-T15-05","hanzi":"朝","pinyin":"cháo","meaning":"hướng về","example":"请朝前走，然后向左转。","examplePinyin":"Qǐng cháo qián zǒu, ránhòu xiàng zuǒ zhuǎn.","translation":"Hãy đi về phía trước rồi rẽ trái."},{"id":"hsk3-T15-06","hanzi":"底下","pinyin":"dǐxia","meaning":"bên dưới","example":"小猫在桌子底下。","examplePinyin":"Xiǎo māo zài zhuōzi dǐxia.","translation":"Mèo con ở dưới bàn."},{"id":"hsk3-T15-07","hanzi":"后面","pinyin":"hòumiàn","meaning":"phía sau","example":"他站在我后面。","examplePinyin":"Tā zhàn zài wǒ hòumiàn.","translation":"Anh ấy đứng sau tôi."},{"id":"hsk3-T15-08","hanzi":"里面","pinyin":"lǐmiàn","meaning":"bên trong","example":"护照在箱子里面。","examplePinyin":"Hùzhào zài xiāngzi lǐmiàn.","translation":"Hộ chiếu ở trong va li."},{"id":"hsk3-T15-09","hanzi":"眼前","pinyin":"yǎnqián","meaning":"trước mắt","example":"机会就在眼前，别错过。","examplePinyin":"Jīhuì jiù zài yǎnqián, bié cuòguò.","translation":"Cơ hội ngay trước mắt, đừng bỏ lỡ."},{"id":"hsk3-T15-10","hanzi":"内","pinyin":"nèi","meaning":"bên trong","example":"“内”这个词在课文里出现了。","examplePinyin":"“nèi” zhège cí zài kèwén lǐ chūxiàn le.","translation":"Từ “bên trong” xuất hiện trong bài khóa."},{"id":"hsk3-T15-11","hanzi":"前面","pinyin":"qiánmiàn","meaning":"phía trước","example":"前面就是图书馆。","examplePinyin":"Qiánmiàn jiù shì túshūguǎn.","translation":"Phía trước là thư viện."},{"id":"hsk3-T15-12","hanzi":"上面","pinyin":"shàngmiàn","meaning":"bên trên","example":"桌子上面有一本书。","examplePinyin":"Zhuōzi shàngmiàn yǒu yì běn shū.","translation":"Trên bàn có một cuốn sách."},{"id":"hsk3-T15-13","hanzi":"外面","pinyin":"wàimiàn","meaning":"bên ngoài","example":"外面正在下大雨。","examplePinyin":"Wàimiàn zhèngzài xià dà yǔ.","translation":"Bên ngoài trời đang mưa lớn."},{"id":"hsk3-T15-14","hanzi":"下面","pinyin":"xiàmiàn","meaning":"bên dưới","example":"请回答下面的问题。","examplePinyin":"Qǐng huídá xiàmiàn de wèntí.","translation":"Hãy trả lời câu hỏi bên dưới."},{"id":"hsk3-T15-15","hanzi":"面积","pinyin":"miànjī","meaning":"diện tích","example":"这个房子的面积不大。","examplePinyin":"Zhège fángzi de miànjī bú dà.","translation":"Diện tích căn nhà này không lớn."},{"id":"hsk3-T15-16","hanzi":"区","pinyin":"qū","meaning":"quận, khu","example":"我住在这个区。","examplePinyin":"Wǒ zhù zài zhège qū.","translation":"Tôi sống ở quận này."},{"id":"hsk3-T15-17","hanzi":"首都","pinyin":"shǒudū","meaning":"thủ đô","example":"我还没有去过首都。","examplePinyin":"Wǒ hái méiyǒu qùguo shǒudū.","translation":"Tôi chưa từng đến thủ đô."},{"id":"hsk3-T15-18","hanzi":"农村","pinyin":"nóngcūn","meaning":"nông thôn","example":"今年我想去农村旅游。","examplePinyin":"Jīnnián wǒ xiǎng qù nóngcūn lǚyóu.","translation":"Năm nay tôi muốn du lịch đến nông thôn."},{"id":"hsk3-T15-19","hanzi":"城市","pinyin":"chéngshì","meaning":"th
