 Hiểu từng bước quan trọng hơn vội làm xong.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R18-3-Q1","question":"谁教我包饺子？","answer":"奶奶","options":["奶奶","弟弟","朋友","家人"],"explanation":"Đối chiếu đoạn: “奶奶包饺子又快又好，我也想学。” → Chọn “奶奶”."},{"id":"H3-R18-3-Q2","question":"我先做什么？","answer":"看奶奶做几个","options":["看奶奶做几个","准备东西","找书","请我吃饭"],"explanation":"Đối chiếu đoạn: “她没有让我一下做很多，就先看她做几个，再自己慢慢试。” → Chọn “看奶奶做几个”."},{"id":"H3-R18-3-Q3","question":"第一次为什么包不上？","answer":"放的菜太多","options":["放的菜太多","包里带了水","下错站","山上可能更冷"],"explanation":"Đối chiếu đoạn: “我第一次放的菜太多，饺子包不上。” → Chọn “放的菜太多”."},{"id":"H3-R18-3-Q4","question":"奶奶帮我做了什么？","answer":"少放了一点儿菜","options":["少放了一点儿菜","请我吃饭","骑车","找到了"],"explanation":"Đối chiếu đoạn: “奶奶帮我少放了一点儿，我马上就成功了。” → Chọn “少放了一点儿菜”."}]},{"id":"H3-R18-4","lesson":18,"title":"Mời bạn nếm thử","text":"我学会包饺子以后，周末请朋友来家里吃。为了让大家都能吃，我先问了每个人喜欢什么。有的朋友不吃肉，我就另外准备了一种只有菜的。虽然准备的时间长了一点儿，但是看见朋友们吃得开心，我觉得很值得。","pinyin":"Wǒ xué huì bāo jiǎo zi yǐ hòu， zhōu mò qǐng péng you lái jiā lǐ chī。 wèi le ràng dà jiā dōu néng chī， wǒ xiān wèn le měi gè rén xǐ huan shén me。 yǒu de péng you bù chī ròu， wǒ jiù lìng wài zhǔn bèi le yī zhǒng zhǐ yǒu cài de。 suī rán zhǔn bèi de shí jiān zhǎng le yì diǎn ér， dàn shì kàn jiàn péng you men chī de kāi xīn， wǒ jué de hěn zhí de。","translation":"Học gói xong tôi mời bạn đến cuối tuần. Tôi hỏi sở thích trước, có bạn không ăn thịt nên chuẩn bị thêm bánh chỉ rau. Chuẩn bị lâu hơn chút nhưng mọi người vui nên tôi thấy đáng.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R18-4-Q1","question":"我周末请朋友来做什么？","answer":"吃饺子","options":["吃饺子","准备东西","找书","请我吃饭"],"explanation":"Đối chiếu đoạn: “我学会包饺子以后，周末请朋友来家里吃。” → Chọn “吃饺子”."},{"id":"H3-R18-4-Q2","question":"准备以前我先问了什么？","answer":"每个人喜欢什么","options":["每个人喜欢什么","电脑","怎么做","一点儿帮助"],"explanation":"Đối chiếu đoạn: “为了让大家都能吃，我先问了每个人喜欢什么。” → Chọn “每个人喜欢什么”."},{"id":"H3-R18-4-Q3","question":"为什么另外准备只有菜的饺子？","answer":"有的朋友不吃肉","options":["有的朋友不吃肉","下错站","山上可能更冷","他还需要休息"],"explanation":"Đối chiếu đoạn: “有的朋友不吃肉，我就另外准备了一种只有菜的。” → Chọn “有的朋友不吃肉”."},{"id":"H3-R18-4-Q4","question":"我觉得多花时间值得吗？","answer":"很值得","options":["很值得","害怕","不再害怕了","比以前干净"],"explanation":"Đối chiếu đoạn: “虽然准备的时间长了一点儿，但是看见朋友们吃得开心，我觉得很值得。” → Chọn “很值得”."}]},{"id":"H3-R18-5","lesson":18,"title":"Học được rồi tiếp tục luyện","text":"刚学会做饭的时候，我觉得照着书做就不会错。后来才发现，同样的菜，水放多一点儿或火开大一点儿，味道都可能不一样。我开始把每次做的方法记下来，慢慢比较。现在虽然还做得不算快，但是已经能做出家人喜欢的味道了。","pinyin":"Gāng xué huì zuò fàn de shí hou， wǒ jué de zhào zhe shū zuò jiù bú huì cuò。 hòu lái cái fā xiàn， tóng yàng de cài， shuǐ fàng duō yì diǎn ér huò huǒ kāi dà yī diǎn ér， wèi dào dōu kě néng bù yí yàng。 wǒ kāi shǐ bǎ měi cì zuò de fāng fǎ jì xià lái， màn màn bǐ jiào。 xiàn zài suī rán hái zuò dé bù suàn kuài， dàn shì yǐ jīng néng zuò chū jiā rén xǐ huan de wèi dào le。","translation":"Mới học nấu tôi nghĩ làm theo sách sẽ đúng. Sau mới thấy thêm nước hoặc lửa khác cũng đổi vị. Tôi ghi cách làm từng lần rồi so sánh. Giờ nấu chưa nhanh nhưng hợp khẩu vị gia đình.","grammar":[],"source":"Bài đọc bổ sung; từ vựng đối chiếu dữ liệu HSK 1–3.","questions":[{"id":"H3-R18-5-Q1","question":"我刚开始觉得照着什么做就不会错？","answer":"书","options":["书","电脑","怎么做","一点儿帮助"],"explanation":"Đối chiếu đoạn: “刚学会做饭的时候，我觉得照着书做就不会错。” → Chọn “书”."},{"id":"H3-R18-5-Q2","question":"什么可能影响菜的味道？","answer":"水和火","options":["水和火","怎么做","一点儿帮助","一件衬衫"],"explanation":"Đối chiếu đoạn: “后来才发现，同样的菜，水放多一点儿或火开大一点儿，味道都可能不一样。” → Chọn “水和火”."},{"id":"H3-R18-5-Q3","question":"后来我把什么记下来？","answer":"每次做的方法","options":["每次做的方法","一点儿帮助","一件衬衫","很多花"],"explanation":"Đối chiếu đoạn: “我开始把每次做的方法记下来，慢慢比较。” → Chọn “每次做的方法”."},{"id":"H3-R18-5-Q4","question":"现在我能做出什么样的味道？","answer":"家人喜欢的味道","options":["家人喜欢的味道","一件衬衫","很多花","中文词"],"explanation":"Đối chiếu đoạn: “现在虽然还做得不算快，但是已经能做出家人喜欢的味道了。” → Chọn “家人喜欢的味道”."}]}],"dictionary":[{"hanzi":"不客气","pinyin":"bù kèqi","meaning":"không có chi; Không có chi"},{"hanzi":"大家","pinyin":"dàji ['openLesson','showReview','showStats','renderLesson','renderQuestion','renderAdvanced','startGuidedWriting','startFinalExam','renderExamQuestion','topicOpen','topicMode','topicToMain','topicExit','h2ReadingMenu','h2StartReading','h2GrammarQuestion'].forEach(name=>wrap(name));
// Review uses the same working entry points as the lesson games.
const originalStart=startGame;
startGame=function(mode,custom){if(mode==='paragraph')return startGuidedWriting();if(mode==='exam')return startFinalExam();return originalStart(mode,custom)};
// Provide one consistent back control on screens whose template omits it.
function ensureBack(){const app=document.querySelector('#app');if(!app||app.querySelector('.qh-home'))return;
 if([...app.querySelectorAll('button')].some(b=>/^(←|‹)/.test(b.textContent.trim())))return;
 const back=document.createElement('button');back.type='button';back.className='back-inline hsk3-top-back';back.textContent=session?'← Quay lại trò chơi':'← Trang chủ HSK 3';back.onclick=()=>{if(session&&lesson)openLesson(lesson.id,'games');else topicToMain('home')};app.prepend(back);
}
new MutationObserver(ensureBack).observe(document.querySelector('#app'),{childList:true,subtree:true});
// Match the source completeness on the back of every unit flashcard.
const flash=renderFlash;renderFlash=function(){flash();if(!flipped)return;const card=document.querySelector('#hskUnitFlashCard');if(!card)return;const words=lesson.words.filter(w=>hskUnitFlashFilter==='all'||(hskUnitFlashFilter==='known'?!!store.known[w.id]:!store.known[w.id]));const word=words[flashIndex];const example=card.querySelector('.hsk-unit-flash-example');if(example&&word){const pin=document.createElement('p');pin.className='hsk3-example-pin';pin.textContent=word.examplePinyin;example.after(pin)}};
home();
})();
</script>
