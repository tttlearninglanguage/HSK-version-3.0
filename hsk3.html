须参加明天的会议。","pinyin":"gēn jù yāo qiú wǒ men bì xū cān jiā míng tiān de huì yì","vi":"Theo yêu cầu, chúng tôi phải tham gia cuộc họp ngày mai."}],"newExamples":[]},{"name":"Lặp lại cụm số lượng diễn tả sự thay đổi","formula":"Số từ + Lượng từ + Số từ + Lượng từ (ví dụ: 一点儿一点儿)","explanation":"Cấu trúc lặp lại này được dùng để mô tả một hành động hoặc sự thay đổi diễn ra từng chút một hoặc từng bước một. Nó giúp nhấn mạnh quá trình tích lũy dần dần của sự việc trong câu.","tip":"Bạn có thể dùng cấu trúc này với các cụm như 「一点儿一点儿」 (từng chút một) hoặc 「一步一步」 (từng bước một).","note":"Lưu ý rằng cấu trúc này không phải là phép nhân số học mà là cách diễn đạt trạng thái tăng dần hoặc chậm rãi.","examples":[{"zh":"我得一点儿一点儿给你讲。","pinyin":"wǒ děi yī diǎn ér yī diǎn ér gěi nǐ jiǎng","vi":"Tôi phải giảng cho bạn từng chút từng chút một."},{"zh":"学生们的汉语水平一天一天地提高了。","pinyin":"xué shēng men de hàn yǔ shuǐ píng yī tiān yī tiān de tí gāo le","vi":"Trình độ tiếng Trung của học sinh tiến bộ lên từng ngày."}],"newExamples":[]},{"name":"Cách nêu quan điểm cá nhân","formula":"在 + [Người] + 看来 + [Quan điểm]","explanation":"Cấu trúc này dùng để diễn đạt ý kiến hoặc góc nhìn của một người nào đó về một vấn đề. Trong tiếng Việt, nó tương đương với các cụm từ như \"theo tôi thấy\", \"trong mắt anh ấy\" hay \"đối với cô ấy\".","tip":"Bạn có thể thay thế [Người] bằng các đại từ như 「我」(tôi), 「他」(anh ấy) hoặc danh từ chỉ người cụ thể.","note":"Cụm từ 「看来」 phải luôn đứng sau người có quan điểm, không được đặt ở đầu câu.","examples":[{"zh":"在我们中国人看来，黄河像妈妈一样，养了我们几千年。","pinyin":"zài wǒ men zhōng guó rén kàn lái huáng hé xiàng mā mā yī yàng yǎng le wǒ men jǐ qiān nián","vi":"Trong mắt người Trung Quốc chúng tôi, sông Hoàng Hà giống như người mẹ đã nuôi dưỡng chúng tôi mấy ngàn năm."},{"zh":"在我看来，每天读书是一种很好的习惯。","pinyin":"zài wǒ kàn lái měi tiān dú shū shì yī zhǒng hěn hǎo de xí guàn","vi":"Theo tôi thấy, đọc sách mỗi ngày là một thói quen rất tốt."}],"newExamples":[]},{"name":"Cách dùng cụm từ chỉ thời gian '不一会儿'","formula":"不一会儿 + V/Cụm câu","explanation":"Cụm từ 「不一会儿」 dùng để diễn tả một khoảng thời gian trôi qua rất nhanh chóng, ngắn ngủi. Bạn có thể dùng nó ở đầu câu để làm trạng ngữ chỉ thời gian, mang nghĩa là “chẳng mấy chốc” hay “chốc lát sau”.","tip":"Bạn có thể dùng cấu trúc này để kể về các sự việc xảy ra nối tiếp nhau một cách nhanh chóng trong một câu chuyện.","note":"「不一会儿」 là một cụm từ cố định, không nên thay thế các thành phần bên trong nó bằng các từ khác.","examples":[{"zh":"难过的事情不一会儿就忘了。","pinyin":"nán guò de shì qíng bù yī huì ér jiù wàng le","vi":"Những chuyện buồn chẳng mấy chốc là quên ngay."},{"zh":"不一会儿，张校长就来了。","pinyin":"bù yī huì ér zhāng xiào zhǎng jiù lái le","vi":"Chẳng mấy chốc mà hiệu trưởng Trương đã đến rồi."}],"newExamples":[]}],"subtitle":"Tôi là người Nam Kinh một nửa"},{"id":16,"title":"我听说有的熊猫出国了","words":[{"id":"hsk3-L16-01","hanzi":"脏","pinyin":"zàng","meaning":"nội tạng (zàng); bẩn (zāng)","example":"医生说我的心脏很健康。","examplePinyin":"yīshēng shuō wǒ de xīnzàng hěn jiànkāng.","translation":"Bác sĩ nói tim tôi rất khỏe mạnh."},{"id":"hsk3-L16-02","hanzi":"可爱","pinyin":"kěài","meaning":"đáng yêu","example":"这只熊猫很可爱。","examplePinyin":"zhè zhī xióng māo hěn kěài.","translation":"Con gấu trúc này rất đáng yêu."},{"id":"hsk3-L16-03","hanzi":"一会儿","pinyin":"yíhuìr","meaning":"một lát, chốc lát","example":"你等我一会儿。","examplePinyin":"nǐ děng wǒ yíhuìr.","translation":"Bạn đợi tôi một lát."},{"id":"hsk3-L16-04","hanzi":"脚","pinyin":"jiǎo","meaning":"bàn chân","example":"我的脚有点儿疼。","examplePinyin":"wǒ de jiǎo yǒu diǎn ér téng.","translation":"Bàn chân tôi hơi đau."},{"id":"hsk3-L16-05","hanzi":"照顾","pinyin":"zhàogù","meaning":"chăm sóc","example":"妈妈生病了，我照顾她。","examplePinyin":"māma shēng bìng le, wǒ zhàogù tā.","translation":"Mẹ bị ốm, tôi chăm sóc mẹ."},{"id":"hsk3-L16-06","hanzi":"好像","pinyin":"hǎoxiàng","meaning":"hình như, có vẻ","example":"他好像感冒了。","examplePinyin":"tā hǎoxiàng gǎnmào le.","translation":"Hình như anh ấy bị cảm."},{"id":"hsk3-L16-07","hanzi":"认得","pinyin":"rènde","meaning":"nhận ra, nhận biết","example":"我认得这个人。","examplePinyin":"wǒ rènde zhège rén.","translation":"Tôi nhận ra người này."},{"id":"hsk3-L16-08","hanzi":"周末","pinyin":"zhōumò","meaning":"cuối tuần","example":"这个周末我们去公园。","examplePinyin":"zhège zhōumò wǒmen qù gōngyuán.","translation":"Cuối tuần này chúng ta đi công viên."},{"id":"hsk3-L16-09","hanzi":"动物园","pinyin":"dòngwùyuán","meaning":"vườn thú","example":"动物园里有熊猫。","examplePinyin":"dòngwùyuán lǐ yǒu xióng māo.","translation":"Trong vườn thú có gấu trúc."},{"id":"hsk3-L16-10","hanzi":"动物","pinyin":"dòngwù","meaning":"động vật","example":"我喜欢小动物。","examplePinyin":"wǒ xǐhuān xiǎo dòngwù.","translation":"Tôi thích những con vật nhỏ."},{"id":"hsk3-L16-11","hanzi":"大熊猫","pinyin":"dàxióngmāo","meaning":"gấu trúc lớn","example":"大熊猫喜欢吃竹子。","examplePinyin":"dàxióngmāo xǐhuān chī zhúzi.","translation":"Gấu trúc lớn thích ăn tre."},{"id":"hsk3-L16-12","hanzi":"奇怪","pinyin":"qíguài","meaning":"kỳ lạ","example":"今天他没有来，真奇怪。","examplePinyin":"jīntiān tā méiyǒu lái, zhēn qíguài.","translation":"Hôm nay anh ấy không đến, thật kỳ lạ."},{"id":"hsk3-L16-13","hanzi":"其实","pinyin":"qíshí","meaning":"thật ra, thực ra","example":"其实我很喜欢这里。","examplePinyin":"qíshí wǒ hěn xǐhuān zhèlǐ.","translation":"Thực ra tôi rất thích nơi đây."},{"id":"hsk3-L16-14","hanzi":"竹子","pinyin":"zhúzi","meaning":"cây tre","example":"熊猫正在吃竹子。","examplePinyin":"xióng māo zhèng zài chī zhúzi.","translation":"Gấu trúc đang ăn tre."},{"id":"hsk3-L16-15","hanzi":"国宝","pinyin":"guóbǎo","meaning":"quốc bảo","example":"大熊猫是中国的国宝。","examplePinyin":"dàxióngmāo shì Zhōngguó de guóbǎo.","translation":"Gấu trúc lớn là quốc bảo của Trung Quốc."},{"id":"hsk3-L16-16","hanzi":"全","pinyin":"quán","meaning":"toàn bộ, cả","example":"全班同学都来了。","examplePinyin":"quán bān tóngxué dōu lái le.","translation":"Tất cả học sinh trong lớp đều đến rồi."},{"id":"hsk3-L16-17","hanzi":"野生","pinyin":"yěshēng","meaning":"hoang dã","example":"这是一只野生动物。","examplePinyin":"zhè shì yì zhī yěshēng dòngwù.","translation":"Đây là một động vật hoang dã."},{"id":"hsk3-L16-18","hanzi":"关于","pinyin":"guānyú","meaning":"về, liên quan đến","example":"我看了一本关于动物的书。","examplePinyin":"wǒ kàn le yī běn guānyú dòngwù de shū.","translation":"Tôi đã đọc một cuốn sách về động vật."},{"id":"hsk3-L16-19","hanzi":"饱","pinyin":"bǎo","meaning":"no","example":"我已经吃饱了。","examplePinyin":"wǒ yǐjīng chī bǎo le.","translation":"Tôi đã ăn no rồi."},{"id":"hsk3-L16-20","hanzi":"张","pinyin":"zhāng","meaning":"tờ, tấm (lượng từ)","example":"我拍了三张照片。","examplePinyin":"wǒ pāi le sān zhāng zhàopiàn.","translation":"Tôi đã chụp ba bức ảnh."},{"id":"hsk3-L16-21","hanzi":"嘴","pinyin":"zuǐ","meaning":"miệng","example":"这只动物的嘴很小。","examplePinyin":"zhè zhī dòngwù de zuǐ hěnxiǎo.","translation":"Miệng của con vật này rất nhỏ."},{"id":"hsk3-L16-22","hanzi":"身边","pinyin":"shēnbiān","meaning":"bên cạnh, bên mình","example":"妈妈一直在我身边。","examplePinyin":"māma yìzhí zài wǒ shēnbiān.","translation":"Mẹ luôn ở bên tôi."},{"id":"hsk3-L16-23","hanzi":"半天","pinyin":"bàntiān","meaning":"nửa ngày; rất lâu","example":"我在图书馆看了半天书。","examplePinyin":"wǒ zài túshūguǎn kàn le bàntiān shū.","translation":"Tôi đọc sách trong thư viện suốt nửa ngày."},{"id":"hsk3-L16-24","hanzi":"脸","pinyin":"liǎn","meaning":"mặt, khuôn mặt","example":"妹妹的脸红了。","examplePinyin":"mèimei de liǎn hóng le.","translation":"Mặt em gái đỏ lên rồi."},{"id":"hsk3-L16-25","hanzi":"大人","pinyin":"dàrén","meaning":"người lớn","example":"大人和孩子都喜欢熊猫。","examplePinyin":"dàrén hé háizi dōu xǐhuān xióng māo.","translation":"Cả người lớn và trẻ em đều thích gấu trúc."},{"id":"hsk3-L16-26","hanzi":"喜爱","pinyin":"xǐài","meaning":"yêu thích","example":"很多人喜爱大熊猫。","examplePinyin":"hěnduō rén xǐài dàxióngmāo.","translation":"Rất nhiều người yêu thích gấu trúc lớn."}],"grammar":[{"name":"Cấu trúc diễn tả hành động thay đổi luân phiên","details":["Cấu trúc: 一会儿 + Động từ/Tính từ, 一会儿 + Động từ/Tính từ","Giải thích: Cấu trúc này dùng để diễn tả hai hoặc nhiều hành động, trạng thái thay đổi qua lại liên tục. Trong tiếng Việt, ta dịch là \"lúc thì... lúc thì...\" để chỉ sự không ổn định hoặc thay đổi nhanh chóng.","Mẹo: Cấu trúc này thường dùng để mô tả sự thay đổi mang tính tùy hứng, không theo quy luật hoặc tâm trạng không kiên định của người nói.","Lưu ý: Cần phân biệt với 「一会儿」 mang nghĩa là \"một lát nữa\", trong cấu trúc này 「一会儿」 bắt buộc phải lặp lại hai lần.","•  它一会儿在你脚边睡觉，一会儿在你身上爬。","tā yī huì ér zài nǐ jiǎo biān shuì jiào yī huì ér zài nǐ shēn shàng pá","Nó lúc thì ngủ dưới chân bạn, lúc thì leo lên người bạn.","•  最近天气变化很快，一会儿冷，一会儿热。","zuì jìn tiān qì biàn huà hěn kuài yī huì ér lěng yī huì ér rè","Dạo này thời tiết thay đổi rất nhanh, lúc thì lạnh, lúc thì nóng.","Ví dụ: 它一会儿在你脚边睡觉，一会儿在你身上爬。","Ví dụ: 最近天气变化很快，一会儿冷，一会儿热。"]},{"name":"Giới từ 关于 (Về, liên quan đến)","details":["Cấu trúc: 关于 + danh từ/cụm danh từ + , + mệnh đề","Giải thích: Giới từ 「关于」 được dùng để dẫn dắt chủ đề hoặc phạm vi mà người nói muốn đề cập đến. Trong câu, nó thường đứng ở đầu câu để xác định nội dung chính mà câu đó hướng tới, tương đương với nghĩa “về” hoặc “về việc” trong tiếng Việt.","Mẹo: Bạn có thể dùng 「关于」 để giới thiệu tiêu đề hoặc chủ đề chính của một bài báo, bài viết hoặc cuộc hội thoại.","Lưu ý: Không được dùng 「关于」 như một động từ. 「关于」 chỉ dùng để bổ sung ngữ nghĩa cho chủ đề chứ không thay thế được các động từ như 「说」 hay 「讨论」.","•  关于这个问题，我得慢慢给你讲。","guān yú zhè gè wèn tí wǒ děi màn màn gěi nǐ jiǎng","Về vấn đề này, tôi phải từ từ giảng cho bạn.","•  关于比赛的时间，我明天一定告诉大家。","guān yú bǐ sài de shí jiān wǒ míng tiān yī dìng gào sù dà jiā","Về thời gian thi đấu, ngày mai tôi nhất định sẽ báo cho mọi người.","Ví dụ: 关于这个问题，我得慢慢给你讲。","Ví dụ: 关于比赛的时间，我明天一定告诉大家。"]},{"name":"Cách dùng cụm từ 「一般来说」","details":["Cấu trúc: 一般来说，+ câu nhận xét","Giải thích: Cụm từ 「一般来说」 thường đứng đầu câu để nêu ra một nhận xét mang tính khái quát hoặc thông thường. Nó tương đương với nghĩa “nói chung là” hoặc “thông thường mà nói” trong tiếng Việt.","Mẹo: Bạn có thể dùng 「一般来说」 để mở đầu câu khi muốn đưa ra một kết luận dựa trên đa số trường hợp.","Lưu ý: Không nên dùng cụm từ này cho những sự việc mang tính chất cá nhân, riêng biệt hoặc quá cụ thể.","•  一般来说，熊猫每天要睡很多次觉。","yī bān lái shuō xióng māo měi tiān yào shuì hěn duō cì jué","Thông thường mà nói, gấu trúc mỗi ngày phải ngủ rất nhiều lần.","•  一般来说，学习外语需要多练习。","yī bān lái shuō xué xí wài yǔ xū yào duō liàn xí","Thông thường, học ngoại ngữ cần phải luyện tập nhiều.","Ví dụ: 一般来说，熊猫每天要睡很多次觉。","Ví dụ: 一般来说，学习外语需要多练习。"]},{"name":"So sánh mức chênh lệch cụ thể","details":["Cấu trúc: A 比 B + [多/少/早/晚] + Động từ + Số lượng","Giải thích: Cấu trúc này dùng để nhấn mạnh sự chênh lệch cụ thể về số lượng khi thực hiện một hành động nào đó giữa hai đối tượng. Trong đó, 「比」 được dùng để thiết lập phép so sánh, còn số lượng đứng cuối câu chỉ ra mức độ chênh lệch chính xác.","Mẹo: Hãy chú ý đặt số lượng từ (ví dụ: 「三十分钟」, 「五次」) ngay sau động từ để làm rõ mức độ chênh lệch.","Lưu ý: Đừng nhầm lẫn với cấu trúc so sánh tính từ, ở đây ta đang so sánh hành động nên số lượng phải đứng sau động từ.","•  冬天比夏天早关门一个小时。","dōng tiān bǐ xià tiān zǎo guān mén yī gè xiǎo shí","Mùa đông đóng cửa sớm hơn mùa hè một tiếng đồng hồ.","•  哥哥比弟弟多吃了三个饺子。","gē gē bǐ dì dì duō chī le sān gè jiǎo zi","Anh trai ăn nhiều hơn em trai ba cái sủi cảo.","Ví dụ: 冬天比夏天早关门一个小时。","Ví dụ: 哥哥比弟弟多吃了三个饺子。"]}],"extended":[],"structuredGrammar":[{"name":"Cấu trúc diễn tả hành động thay đổi luân phiên","formula":"一会儿 + Động từ/Tính từ, 一会儿 + Động từ/Tính từ","explanation":"Cấu trúc này dùng để diễn tả hai hoặc nhiều hành động, trạng thái thay đổi qua lại liên tục. Trong tiếng Việt, ta dịch là \"lúc thì... lúc thì...\" để chỉ sự không ổn định hoặc thay đổi nhanh chóng.","tip":"Cấu trúc này thường dùng để mô tả sự thay đổi mang tính tùy hứng, không theo quy luật hoặc tâm trạng không kiên định của người nói.","note":"Cần phân biệt với 「一会儿」 mang nghĩa là \"một lát nữa\", trong cấu trúc này 「一会儿」 bắt buộc phải lặp lại hai lần.","examples":[{"zh":"它一会儿在你脚边睡觉，一会儿在你身上爬。","pinyin":"tā yī huì ér zài nǐ jiǎo biān shuì jiào yī huì ér zài nǐ shēn shàng pá","vi":"Nó lúc thì ngủ dưới chân bạn, lúc thì leo lên người bạn."},{"zh":"最近天气变化很快，一会儿冷，一会儿热。","pinyin":"zuì jìn tiān qì biàn huà hěn kuài yī huì ér lěng yī huì ér rè","vi":"Dạo này thời tiết thay đổi rất nhanh, lúc thì lạnh, lúc thì nóng."}],"newExamples":[]},{"name":"Giới từ 关于 (Về, liên quan đến)","formula":"关于 + danh từ/cụm danh từ + , + mệnh đề","explanation":"Giới từ 「关于」 được dùng để dẫn dắt chủ đề hoặc phạm vi mà người nói muốn đề cập đến. Trong câu, nó thường đứng ở đầu câu để xác định nội dung chính mà câu đó hướng tới, tương đương với nghĩa “về” hoặc “về việc” trong tiếng Việt.","tip":"Bạn có thể dùng 「关于」 để giới thiệu tiêu đề hoặc chủ đề chính của một bài báo, bài viết hoặc cuộc hội thoại.","note":"Không được dùng 「关于」 như một động từ. 「关于」 chỉ dùng để bổ sung ngữ nghĩa cho chủ đề chứ không thay thế được các động từ như 「说」 hay 「讨论」.","examples":[{"zh":"关于这个问题，我得慢慢给你讲。","pinyin":"guān yú zhè gè wèn tí wǒ děi màn màn gěi nǐ jiǎng","vi":"Về vấn đề này, tôi phải từ từ giảng cho bạn."},{"zh":"关于比赛的时间，我明天一定告诉大家。","pinyin":"guān yú bǐ sài de shí jiān wǒ míng tiān yī dìng gào sù dà jiā","vi":"Về thời gian thi đấu, ngày mai tôi nhất định sẽ báo cho mọi người."}],"newExamples":[]},{"name":"Cách dùng cụm từ 「一般来说」","formula":"一般来说，+ câu nhận xét","explanation":"Cụm từ 「一般来说」 thường đứng đầu câu để nêu ra một nhận xét mang tính khái quát hoặc thông thường. Nó tương đương với nghĩa “nói chung là” hoặc “thông thường mà nói” trong tiếng Việt.","tip":"Bạn có thể dùng 「一般来说」 để mở đầu câu khi muốn đưa ra một kết luận dựa trên đa số trường hợp.","note":"Không nên dùng cụm từ này cho những sự việc mang tính chất cá nhân, riêng biệt hoặc quá cụ thể.","examples":[{"zh":"一般来说，熊猫每天要睡很多次觉。","pinyin":"yī bān lái shuō xióng māo měi tiān yào shuì hěn duō cì jué","vi":"Thông thường mà nói, gấu trúc mỗi ngày phải ngủ rất nhiều lần."},{"zh":"一般来说，学习外语需要多练习。","pinyin":"yī bān lái shuō xué xí wài yǔ xū yào duō liàn xí","vi":"Thông thường, học ngoại ngữ cần phải luyện tập nhiều."}],"newExamples":[]},{"name":"So sánh mức chênh lệch cụ thể","formula":"A 比 B + [多/少/早/晚] + Động từ + Số lượng","explanation":"Cấu trúc này dùng để nhấn mạnh sự chênh lệch cụ thể về số lượng khi thực hiện một hành động nào đó giữa hai đối tượng. Trong đó, 「比」 được dùng để thiết lập phép so sánh, còn số lượng đứng cuối câu chỉ ra mức độ chênh lệch chính xác.","tip":"Hãy chú ý đặt số lượng từ (ví dụ: 「三十分钟」, 「五次」) ngay sau động từ để làm rõ mức độ chênh lệch.","note":"Đừng nhầm lẫn với cấu trúc so sánh tính từ, ở đây ta đang so sánh hành động nên số lượng phải đứng sau động từ.","examples":[{"zh":"冬天比夏天早关门一个小时。","pinyin":"dōng tiān bǐ xià tiān zǎo guān mén yī gè xiǎo shí","vi":"Mùa đông đóng cửa sớm hơn mùa hè một tiếng đồng hồ."},{"zh":"哥哥比弟弟多吃了三个饺子。","pinyin":"gē gē bǐ dì dì duō chī le sān gè jiǎo zi","vi":"Anh trai ăn nhiều hơn em trai ba cái sủi cảo."}],"newExamples":[]}],"subtitle":"Tôi nghe nói có gấu trúc đã ra nước ngoài"},{"id":17,"title":"我要多向认真的人学习","words":[{"id":"hsk3-L17-01","hanzi":"向","pinyin":"xiàng","meaning":"hướng về; học hỏi từ","example":"我要向老师学习。","examplePinyin":"wǒ yào xiàng lǎoshī xuéxí.","translation":"Tôi muốn học hỏi từ giáo viên."},{"id":"hsk3-L17-02","hanzi":"楼梯","pinyin":"lóutī","meaning":"cầu thang","example":"请走楼梯上去。","examplePinyin":"qǐng zǒu lóutī shàngqu.","translation":"Hãy đi cầu thang lên trên."},{"id":"hsk3-L17-03","hanzi":"害怕","pinyin":"hàipà","meaning":"sợ hãi","example":"我害怕一个人在家。","examplePinyin":"wǒ hàipà yí ge rén zàijiā.","translation":"Tôi sợ ở nhà một mình."},{"id":"hsk3-L17-04","hanzi":"生气","pinyin":"shēngqì","meaning":"tức giận","example":"妈妈很生气。","examplePinyin":"māma hěn shēngqì.","translation":"Mẹ rất tức giận."},{"id":"hsk3-L17-05","hanzi":"常见","pinyin":"chángjiàn","meaning":"thường gặp, phổ biến","example":"这是一个常见的汉字。","examplePinyin":"zhè shì yí ge chángjiàn de hànzì.","translation":"Đây là một chữ Hán thường gặp."},{"id":"hsk3-L17-06","hanzi":"聪明","pinyin":"cōngmíng","meaning":"thông minh","example":"这个孩子很聪明。","examplePinyin":"zhège háizi hěn cōngmíng.","translation":"Đứa trẻ này rất thông minh."},{"id":"hsk3-L17-07","hanzi":"错","pinyin":"cuò","meaning":"sai, nhầm","example":"这道题我做错了。","examplePinyin":"zhè dào tí wǒ zuò cuò le.","translation":"Tôi làm sai câu này rồi."},{"id":"hsk3-L17-08","hanzi":"认为","pinyin":"rènwéi","meaning":"cho rằng, nghĩ rằng","example":"我认为这个方法很好。","examplePinyin":"wǒ rènwéi zhège fāngfǎ hěnhǎo.","translation":"Tôi cho rằng phương pháp này rất tốt."},{"id":"hsk3-L17-09","hanzi":"到处","pinyin":"dàochù","meaning":"khắp nơi","example":"公园里到处都是花。","examplePinyin":"gōngyuán lǐ dàochù dōu shì huā.","translation":"Trong công viên nơi nào cũng có hoa."},{"id":"hsk3-L17-10","hanzi":"继续","pinyin":"jìxù","meaning":"tiếp tục","example":"我们继续学习吧。","examplePinyin":"wǒmen jìxù xuéxí ba.","translation":"Chúng ta tiếp tục học nhé."},{"id":"hsk3-L17-11","hanzi":"同意","pinyin":"tóngyì","meaning":"đồng ý","example":"我同意你的想法。","examplePinyin":"wǒ tóngyì nǐ de xiǎng fǎ.","translation":"Tôi đồng ý với suy nghĩ của bạn."},{"id":"hsk3-L17-12","hanzi":"可","pinyin":"kě","meaning":"nhưng; có thể; thật là","example":"我想去，可今天没有时间。","examplePinyin":"wǒ xiǎng qù, kě jīntiān méiyǒu shí jiān.","translation":"Tôi muốn đi, nhưng hôm nay không có thời gian."},{"id":"hsk3-L17-13","hanzi":"屋子","pinyin":"wūzi","meaning":"căn phòng, căn nhà","example":"这个屋子很干净。","examplePinyin":"zhège wūzi hěn gānjìng.","translation":"Căn phòng này rất sạch sẽ."},{"id":"hsk3-L17-14","hanzi":"有关","pinyin":"yǒuguān","meaning":"có liên quan","example":"这本书跟历史有关。","examplePinyin":"zhè běn shū gēn lìshǐ yǒuguān.","translation":"Cuốn sách này liên quan đến lịch sử."},{"id":"hsk3-L17-15","hanzi":"关机","pinyin":"guānjī","meaning":"tắt máy","example":"开会的时候请关机。","examplePinyin":"kāihuì de shíhou qǐng guānjī.","translation":"Khi họp xin hãy tắt máy."},{"id":"hsk3-L17-16","hanzi":"前天","pinyin":"qiántiān","meaning":"hôm kia","example":"前天我去了图书馆。","examplePinyin":"qiántiān wǒ qù le túshūguǎn.","translation":"Hôm kia tôi đến thư viện."},{"id":"hsk3-L17-17","hanzi":"留学","pinyin":"liúxué","meaning":"du học","example":"我打算去中国留学。","examplePinyin":"wǒ dǎsuàn qù Zhōngguó liúxué.","translation":"Tôi dự định sang Trung Quốc du học."},{"id":"hsk3-L17-18","hanzi":"国家","pinyin":"guójiā","meaning":"quốc gia, đất nước","example":"世界上有很多国家。","examplePinyin":"shìjiè shàng yǒu hěnduō guójiā.","translation":"Trên thế giới có nhiều quốc gia."},{"id":"hsk3-L17-19","hanzi":"比如","pinyin":"bǐrú","meaning":"chẳng hạn như, ví dụ như","example":"我喜欢运动，比如网球。","examplePinyin":"wǒ xǐhuān yùn dòng, bǐrú wǎngqiú.","translation":"Tôi thích thể thao, chẳng hạn quần vợt."},{"id":"hsk3-L17-20","hanzi":"查","pinyin":"chá","meaning":"tra, kiểm tra","example":"我用词典查这个字。","examplePinyin":"wǒ yòng cídiǎn chá zhège zì.","translation":"Tôi dùng từ điển tra chữ này."},{"id":"hsk3-L17-21","hanzi":"有用","pinyin":"yǒuyòng","meaning":"có ích, hữu dụng","example":"这个方法很有用。","examplePinyin":"zhège fāngfǎ hěn yǒuyòng.","translation":"Phương pháp này rất hữu ích."},{"id":"hsk3-L17-22","hanzi":"容易","pinyin":"róngyì","meaning":"dễ dàng","example":"这道题很容易。","examplePinyin":"zhè dào tí hěn róngyì.","translation":"Câu này rất dễ."},{"id":"hsk3-L17-23","hanzi":"回答","pinyin":"huídá","meaning":"trả lời","example":"请回答老师的问题。","examplePinyin":"qǐng huídá lǎoshī de wèntí.","translation":"Hãy trả lời câu hỏi của giáo viên."},{"id":"hsk3-L17-24","hanzi":"方向","pinyin":"fāngxiàng","meaning":"phương hướng, hướng","example":"你知道去学校的方向吗？","examplePinyin":"nǐ zhīdào qù xuéxiào de fāngxiàng ma?","translation":"Bạn biết hướng đến trường không?"},{"id":"hsk3-L17-25","hanzi":"只有","pinyin":"zhǐyǒu","meaning":"chỉ có; chỉ khi","example":"这里只有一个学生。","examplePinyin":"zhèlǐ zhǐyǒu yí ge xuésheng.","translation":"Ở đây chỉ có một học sinh."},{"id":"hsk3-L17-26","hanzi":"真正","pinyin":"zhēnzhèng","meaning":"thực sự, chân chính","example":"他是真正喜欢汉语的人。","examplePinyin":"tā shì zhēnzhèng xǐhuān Hànyǔ de rén.","translation":"Anh ấy là người thực sự yêu thích tiếng Trung."},{"id":"hsk3-L17-27","hanzi":"难题","pinyin":"nántí","meaning":"vấn đề khó, bài toán khó","example":"我遇到了一个难题。","examplePinyin":"wǒ yùdào le yí ge nántí.","translation":"Tôi đã gặp một vấn đề khó."}],"grammar":[{"name":"Giới từ chỉ hướng hành động 「向」","details":["Cấu trúc: Chủ ngữ + 向 + đối tượng + Động từ","Giải thích: Giới từ 「向」 dùng để chỉ hướng hoặc đối tượng mà hành động nhắm tới. Nó thường đi kèm với các động từ như 「学习」(học hỏi), 「问」(hỏi), hoặc 「借」(mượn) để xác định rõ bạn đang thực hiện hành động đó với ai.","Mẹo: Hãy tưởng tượng 「向」 như một mũi tên chỉ hướng từ chủ ngữ đến đối tượng tiếp nhận hành động.","Lưu ý: Đừng nhầm lẫn 「向」 với 「向」(hướng về) và 「跟」(với ai đó cùng làm gì). 「向」 nhấn mạnh vào phía tiếp nhận hành động, không phải là cùng làm.","•  我以后要多向认真的人学习。","wǒ yǐ hòu yào duō xiàng rèn zhēn de rén xué xí","Sau này tôi phải học hỏi nhiều hơn ở những người nghiêm túc.","•  他向我笑了笑。","tā xiàng wǒ xiào le xiào","Anh ấy mỉm cười với tôi.","Ví dụ: 我以后要多向认真的人学习。","Ví dụ: 他向我笑了笑。"]},{"name":"Câu hỏi phản vấn 「不是……吗？」","details":["Cấu trúc: 不是 + [Thành phần câu] + 吗？","Giải thích: Cấu trúc này dùng để nhắc lại hoặc xác nhận một điều mà người nói cho là đúng. Nó mang sắc thái phản vấn, giống như cách nói \"Chẳng phải là... sao?\" trong tiếng Việt.","Mẹo: Bạn có thể dùng cấu trúc này để bày tỏ sự ngạc nhiên hoặc thuyết phục người nghe đồng tình với ý kiến của mình.","Lưu ý: Đừng nhầm lẫn với câu hỏi phủ định thông thường, vì cấu trúc này thường dùng để nhấn mạnh sự thật hiển nhiên thay vì chỉ để hỏi thông tin.","•  你不是喜欢玩电脑吗？你可以去看看跟电脑有关的书。","nǐ bù shì xǐ huān wán diàn nǎo ma nǐ kě yǐ qù kàn kàn gēn diàn nǎo yǒu guān de shū","Chẳng phải bạn thích chơi máy tính sao? Bạn có thể đi xem những quyển sách liên quan đến máy tính.","•  你不是说今天有事吗？为什么来了？","nǐ bù shì shuō jīn tiān yǒu shì ma wèi shén me lái le","Chẳng phải bạn nói hôm nay có việc sao? Tại sao lại đến đây?","Ví dụ: 你不是喜欢玩电脑吗？你可以去看看跟电脑有关的书。","Ví dụ: 你不是说今天有事吗？为什么来了？"]},{"name":"Cấu trúc tăng tiến với 「更」","details":["Cấu trúc: A，更 B (A, B hơn nữa/càng B hơn)","Giải thích: Cấu trúc này dùng để biểu thị ý nghĩa tăng tiến, nhấn mạnh mức độ cao hơn của sự việc hoặc tính chất sau dấu phẩy. Từ 「更」 đóng vai trò là phó từ chỉ mức độ, giúp câu văn trở nên nhấn mạnh và giàu sắc thái hơn so với câu đơn.","Mẹo: Bạn có thể hiểu 「更」 tương đương với từ \"hơn\" hoặc \"càng\" trong tiếng Việt khi so sánh hoặc nhấn mạnh mức độ.","Lưu ý: Cần phân biệt với cấu trúc 「越A越B」 vì 「更」 dùng để nhấn mạnh mức độ còn 「越...越...」 diễn tả sự thay đổi song song theo thời gian.","•  我还没想好学什么，更没想好去哪个国家。","wǒ hái méi xiǎng hǎo xué shén me gèng méi xiǎng hǎo qù nǎ gè guó jiā","Tôi còn chưa nghĩ xong sẽ học gì, càng chưa nghĩ xong sẽ đi nước nào.","•  来中国学习，我学会了中文，更了解了中国文化。","lái zhōng guó xué xí wǒ xué huì le zhōng wén gèng liǎo jiě le zhōng guó wén huà","Đến Trung Quốc học tập, tôi đã học được tiếng Trung, và càng hiểu thêm về văn hóa Trung Quốc.","Ví dụ: 我还没想好学什么，更没想好去哪个国家。","Ví dụ: 来中国学习，我学会了中文，更了解了中国文化。"]},{"name":"Câu điều kiện \"Chỉ... mới...\"","details":["Cấu trúc: 只有 (chỉ có) + Điều kiện, 才 (mới) + Kết quả","Giải thích: Cấu trúc 「只有... 才...」 được dùng để nhấn mạnh một kết quả chỉ xảy ra khi điều kiện duy nhất được thỏa mãn. \"只有\" đứng trước điều kiện cần thiết, còn \"才\" đứng trước kết quả tương ứng.","Mẹo: Bạn có thể hiểu đơn giản là \"Nếu không có điều kiện A thì sẽ không có kết quả B\".","Lưu ý: Không được dùng \"就\" thay thế cho \"才\" trong cấu trúc này vì \"才\" nhấn mạnh sự khó khăn hoặc điều kiện khắt khe để đạt được kết quả.","•  只有想清楚自己真正喜欢什么，才能做出最合适的选择。","zhǐ yǒu xiǎng qīng chǔ zì jǐ zhēn zhèng xǐ huān shén me cái néng zuò chū zuì hé shì de xuǎn zé","Chỉ khi nghĩ thông suốt bản thân thực sự thích cái gì thì mới có thể đưa ra lựa chọn phù hợp nhất.","•  只有每天锻炼身体，才会越来越健康。","zhǐ yǒu měi tiān duàn liàn shēn tǐ cái huì yuè lái yuè jiàn kāng","Chỉ có tập thể dục mỗi ngày mới có thể ngày càng khỏe mạnh.","Ví dụ: 只有想清楚自己真正喜欢什么，才能做出最合适的选择。","Ví dụ: 只有每天锻炼身体，才会越来越健康。"]}],"extended":[],"structuredGrammar":[{"name":"Giới từ chỉ hướng hành động 「向」","formula":"Chủ ngữ + 向 + đối tượng + Động từ","explanation":"Giới từ 「向」 dùng để chỉ hướng hoặc đối tượng mà hành động nhắm tới. Nó thường đi kèm với các động từ như 「学习」(học hỏi), 「问」(hỏi), hoặc 「借」(mượn) để xác định rõ bạn đang thực hiện hành động đó với ai.","tip":"Hãy tưởng tượng 「向」 như một mũi tên chỉ hướng từ chủ ngữ đến đối tượng tiếp nhận hành động.","note":"Đừng nhầm lẫn 「向」 với 「向」(hướng về) và 「跟」(với ai đó cùng làm gì). 「向」 nhấn mạnh vào phía tiếp nhận hành động, không phải là cùng làm.","examples":[{"zh":"我以后要多向认真的人学习。","pinyin":"wǒ yǐ hòu yào duō xiàng rèn zhēn de rén xué xí","vi":"Sau này tôi phải học hỏi nhiều hơn ở những người nghiêm túc."},{"zh":"他向我笑了笑。","pinyin":"tā xiàng wǒ xiào le xiào","vi":"Anh ấy mỉm cười với tôi."}],"newExamples":[]},{"name":"Câu hỏi phản vấn 「不是……吗？」","formula":"不是 + [Thành phần câu] + 吗？","explanation":"Cấu trúc này dùng để nhắc lại hoặc xác nhận một điều mà người nói cho là đúng. Nó mang sắc thái phản vấn, giống như cách nói \"Chẳng phải là... sao?\" trong tiếng Việt.","tip":"Bạn có thể dùng cấu trúc này để bày tỏ sự ngạc nhiên hoặc thuyết phục người nghe đồng tình với ý kiến của mình.","note":"Đừng nhầm lẫn với câu hỏi phủ định thông thường, vì cấu trúc này thường dùng để nhấn mạnh sự thật hiển nhiên thay vì chỉ để hỏi thông tin.","examples":[{"zh":"你不是喜欢玩电脑吗？你可以去看看跟电脑有关的书。","pinyin":"nǐ bù shì xǐ huān wán diàn nǎo ma nǐ kě yǐ qù kàn kàn gēn diàn nǎo yǒu guān de shū","vi":"Chẳng phải bạn thích chơi máy tính sao? Bạn có thể đi xem những quyển sách liên quan đến máy tính."},{"zh":"你不是说今天有事吗？为什么来了？","pinyin":"nǐ bù shì shuō jīn tiān yǒu shì ma wèi shén me lái le","vi":"Chẳng phải bạn nói hôm nay có việc sao? Tại sao lại đến đây?"}],"newExamples":[]},{"name":"Cấu trúc tăng tiến với 「更」","fo những người nghiêm túc"},{"id":18,"title":"我学会了包饺子","words":[{"id":"hsk3-L18-01","hanzi":"怎样","pinyin":"zěnyàng","meaning":"như thế nào, làm sao","example":"你觉得这个方法怎样？","examplePinyin":"nǐ juéde zhège fāngfǎ zěnyàng?","translation":"Bạn thấy phương pháp này thế nào?"},{"id":"hsk3-L18-02","hanzi":"过节","pinyin":"guòjié","meaning":"đón lễ, ăn mừng ngày lễ","example":"过节的时候我们一起吃饭。","examplePinyin":"guòjié de shíhou wǒmen yìqǐ chīfàn.","translation":"Vào ngày lễ, chúng tôi cùng ăn cơm."},{"id":"hsk3-L18-03","hanzi":"节","pinyin":"jié","meaning":"tiết học; đơn vị chỉ tiết","example":"今天有三节课。","examplePinyin":"jīntiān yǒu sān jié kè.","translation":"Hôm nay có ba tiết học."},{"id":"hsk3-L18-04","hanzi":"节日","pinyin":"jiérì","meaning":"ngày lễ, lễ hội","example":"今天是一个重要的节日。","examplePinyin":"jīntiān shì yí ge zhòngyào de jiérì.","translation":"Hôm nay là một ngày lễ quan trọng."},{"id":"hsk3-L18-05","hanzi":"联欢","pinyin":"liánhuān","meaning":"liên hoan","example":"新年的时候我们一起联欢。","examplePinyin":"xīnnián de shíhou wǒmen yìqǐ liánhuān.","translation":"Dịp năm mới chúng tôi cùng liên hoan."},{"id":"hsk3-L18-06","hanzi":"大概","pinyin":"dàgài","meaning":"khoảng, có lẽ","example":"去学校大概需要十分钟。","examplePinyin":"qù xuéxiào dàgài xūyào shí fēnzhōng.","translation":"Đến trường mất khoảng mười phút."},{"id":"hsk3-L18-07","hanzi":"阿姨","pinyin":"āyí","meaning":"cô, dì","example":"李阿姨是我的邻居。","examplePinyin":"Lǐ āyí shì wǒ de línjū.","translation":"Dì Lý là hàng xóm của tôi."},{"id":"hsk3-L18-08","hanzi":"叔叔","pinyin":"shūshu","meaning":"chú, bác trai","example":"王叔叔今天来我家。","examplePinyin":"Wáng shūshu jīntiān lái wǒ jiā.","translation":"Hôm nay chú Vương đến nhà tôi."},{"id":"hsk3-L18-09","hanzi":"收","pinyin":"shōu","meaning":"nhận, thu","example":"我收到了你的邮件。","examplePinyin":"wǒ shōudào le nǐ de yóujiàn.","translation":"Tôi nhận được email của bạn."},{"id":"hsk3-L18-10","hanzi":"总","pinyin":"zǒng","meaning":"luôn; tổng","example":"他总是很早起床。","examplePinyin":"tā zǒngshì hěnzǎo qǐ chuáng.","translation":"Anh ấy luôn dậy sớm."},{"id":"hsk3-L18-11","hanzi":"起","pinyin":"qǐ","meaning":"bắt đầu; dậy; đứng lên","example":"我每天六点起床。","examplePinyin":"wǒ měitiān liùdiǎn qǐ chuáng.","translation":"Mỗi ngày tôi thức dậy lúc sáu giờ."},{"id":"hsk3-L18-12","hanzi":"见面","pinyin":"jiànmiàn","meaning":"gặp mặt","example":"我们明天见面吧。","examplePinyin":"wǒmen míngtiān jiànmiàn ba.","translation":"Ngày mai chúng ta gặp nhau nhé."},{"id":"hsk3-L18-13","hanzi":"矿泉水","pinyin":"kuàngquánshuǐ","meaning":"nước khoáng","example":"请给我一瓶矿泉水。","examplePinyin":"qǐng gěi wǒ yì píng kuàngquánshuǐ.","translation":"Cho tôi một chai nước khoáng."},{"id":"hsk3-L18-14","hanzi":"刚刚","pinyin":"gānggāng","meaning":"vừa mới","example":"我刚刚做完作业。","examplePinyin":"wǒ gānggāng zuò wán zuòyè.","translation":"Tôi vừa mới làm xong bài tập."},{"id":"hsk3-L18-15","hanzi":"出发","pinyin":"chūfā","meaning":"khởi hành, xuất phát","example":"我们明天七点出发。","examplePinyin":"wǒmen míngtiān qīdiǎn chūfā.","translation":"Ngày mai chúng tôi xuất phát lúc bảy giờ."},{"id":"hsk3-L18-16","hanzi":"不久","pinyin":"bùjiǔ","meaning":"không lâu, chẳng bao lâu","example":"他来中国不久。","examplePinyin":"tā lái Zhōngguó bùjiǔ.","translation":"Anh ấy đến Trung Quốc chưa lâu."},{"id":"hsk3-L18-17","hanzi":"发生","pinyin":"fāshēng","meaning":"xảy ra","example":"昨天发生了一件奇怪的事。","examplePinyin":"zuótiān fāshēng le yí jiàn qíguài de shì.","translation":"Hôm qua đã xảy ra một chuyện kỳ lạ."},{"id":"hsk3-L18-18","hanzi":"刚","pinyin":"gāng","meaning":"vừa mới","example":"我刚到家。","examplePinyin":"wǒ gāng dào jiā.","translation":"Tôi vừa về đến nhà."},{"id":"hsk3-L18-19","hanzi":"只要","pinyin":"zhǐyào","meaning":"chỉ cần, miễn là","example":"只要努力，就能提高成绩。","examplePinyin":"zhǐyào nǔlì, jiù néng tígāo chéngjì.","translation":"Chỉ cần nỗ lực thì có thể nâng cao thành tích."},{"id":"hsk3-L18-20","hanzi":"学期","pinyin":"xuéqī","meaning":"học kỳ","example":"这个学期我们学习汉语。","examplePinyin":"zhège xuéqī wǒmen xuéxí Hànyǔ.","translation":"Học kỳ này chúng tôi học tiếng Trung."},{"id":"hsk3-L18-21","hanzi":"毕业","pinyin":"bìyè","meaning":"tốt nghiệp","example":"我哥哥明年大学毕业。","examplePinyin":"wǒ gēge míng nián dà xué bìyè.","translation":"Năm sau anh tôi tốt nghiệp đại học."},{"id":"hsk3-L18-22","hanzi":"出生","pinyin":"chūshēng","meaning":"sinh ra, chào đời","example":"我出生在北京。","examplePinyin":"wǒ chūshēng zài Běijīng.","translation":"Tôi sinh ra ở Bắc Kinh."},{"id":"hsk3-L18-23","hanzi":"过去","pinyin":"guòqù","meaning":"trước đây, quá khứ","example":"过去我住在北京。","examplePinyin":"guòqù wǒ zhù zài Běijīng.","translation":"Trước đây tôi sống ở Bắc Kinh."},{"id":"hsk3-L18-24","hanzi":"懂得","pinyin":"dǒngde","meaning":"hiểu được, biết rõ","example":"我懂得怎样学习汉语。","examplePinyin":"wǒ dǒngde zěnyàng xuéxí Hànyǔ.","translation":"Tôi hiểu cách học tiếng Trung."},{"id":"hsk3-L18-25","hanzi":"坚持","pinyin":"jiānchí","meaning":"kiên trì, duy trì","example":"我每天坚持学习汉语。","examplePinyin":"wǒ měitiān jiānchí xuéxí Hànyǔ.","translation":"Ngày nào tôi cũng kiên trì học tiếng Trung."},{"id":"hsk3-L18-26","hanzi":"完成","pinyin":"wánchéng","meaning":"hoàn thành","example":"我已经完成作业了。","examplePinyin":"wǒ yǐjīng wánchéng zuòyè le.","translation":"Tôi đã hoàn thành bài tập."},{"id":"hsk3-L18-27","hanzi":"目标","pinyin":"mùbiāo","meaning":"mục tiêu","example":"我的目标是提高汉语水平。","examplePinyin":"wǒ de mùbiāo shì tígāo hànyǔshuǐpíng.","translation":"Mục tiêu của tôi là nâng cao trình độ tiếng Trung."},{"id":"hsk3-L18-28","hanzi":"发展","pinyin":"fāzhǎn","meaning":"phát triển","example":"这个城市发展很快。","examplePinyin":"zhège chéngshì fāzhǎn hěnkuài.","translation":"Thành phố này phát triển rất nhanh."}],"grammar":[{"name":"Cách biểu đạt số ước lượng bằng số đếm","details":["Cấu trúc: Số đếm A + Số đếm B (liên tiếp)","Giải thích: Trong tiếng Trung, bạn có thể đặt hai số đếm liên tiếp nhau để diễn tả một con số ước chừng. Ví dụ: 「三四」 (ba bốn) có nghĩa là khoảng 3 hoặc 4.","Mẹo: Cách dùng này rất phổ biến trong giao tiếp hàng ngày để nói về số lượng không chính xác.","Lưu ý: Chỉ áp dụng với các số đếm đứng liền kề nhau trong dãy số tự nhiên, không được nhảy cóc.","•  春节大概放七八天假。","chūn jié dà gài fàng qī bā tiān jiǎ","Tết Nguyên Đán nghỉ khoảng 7, 8 ngày.","•  教室里来了五六个学生。","jiào shì lǐ lái le wǔ liù gè xué shēng","Trong lớp có khoảng 5, 6 học sinh vừa đến.","Ví dụ: 春节大概放七八天假。","Ví dụ: 教室里来了五六个学生。"]},{"name":"Phân biệt 刚才 và 刚刚","details":["Cấu trúc: S + 刚才 / 刚刚 + V hoặc 刚才 / 刚刚 + S + V","Giải thích: Cả 「刚才」 và 「刚刚」 đều dùng để chỉ hành động vừa mới xảy ra trong quá khứ gần. 「刚才」 là danh từ chỉ thời gian, thường dùng để nhấn mạnh thời điểm vừa xảy ra tức thì. 「刚刚」 có thể là phó từ hoặc danh từ, linh hoạt hơn trong việc diễn tả hành động vừa mới hoàn thành.","Mẹo: Bạn có thể dùng 「刚才」 ở trước hoặc sau chủ ngữ, nhưng 「刚刚」 thường đặt trước động từ.","Lưu ý: 「刚才」 không thể kết hợp với các từ chỉ khoảng thời gian (như 'hai phút'), trong khi 「刚刚」 thì có thể.","•  我刚刚看视频学会了包饺子。","wǒ gāng gāng kàn shì pín xué huì le bāo jiǎo zi","Tôi vừa mới xem video và học được cách gói sủi cảo.","•  刚才的话是我妈妈打来的。","gāng cái de huà shì wǒ mā mā dǎ lái de","Cuộc điện thoại vừa rồi là mẹ tôi gọi đến.","Ví dụ: 我刚刚看视频学会了包饺子。","Ví dụ: 刚才的话是我妈妈打来的。"]},{"name":"Cấu trúc điều kiện Chỉ cần... thì...","details":["Cấu trúc: 只要 + [Điều kiện], 就 + [Kết quả]","Giải thích: Cấu trúc 「只要……，就……」 dùng để biểu thị một điều kiện cần thiết, chỉ cần điều kiện đó xảy ra thì kết quả tương ứng sẽ xuất hiện. Đây là mẫu câu rất phổ biến trong tiếng Trung để khẳng định mối quan hệ nhân quả.","Mẹo: Bạn có thể dịch là \"Chỉ cần... thì...\" hoặc \"Miễn là... thì...\" để câu văn nghe tự nhiên hơn trong tiếng Việt.","Lưu ý: Cần chú ý đặt 「就」 ngay trước kết quả hoặc động từ chỉ kết quả để làm nổi bật sự chắc chắn của hành động.","•  只要你努力学习，就一定能完成目标。","zhǐ yào nǐ nǔ lì xué xí jiù yī dìng néng wán chéng mù biāo","Chỉ cần bạn nỗ lực học tập thì nhất định sẽ hoàn thành mục tiêu.","•  只要你坚持每天早睡，身体就一定会好起来。","zhǐ yào nǐ jiān chí měi tiān zǎo shuì shēn tǐ jiù yī dìng huì hǎo qǐ lái","Chỉ cần bạn kiên trì ngủ sớm mỗi ngày thì sức khỏe nhất định sẽ tốt lên.","Ví dụ: 只要你努力学习，就一定能完成目标。","Ví dụ: 只要你坚持每天早睡，身体就一定会好起来。"]},{"name":"Cấu trúc chỉ thời điểm bắt đầu","details":["Cấu trúc: 从 + [mốc thời gian] + 起","Giải thích: Cấu trúc 「从……起」 được dùng để xác định thời điểm bắt đầu của một hành động hoặc trạng thái. Trong tiếng Việt, nó tương đương với cụm từ \"kể từ...\" hoặc \"bắt đầu từ...\".","Mẹo: Bạn có thể thay thế 「起」 bằng 「开始」 mà nghĩa của câu vẫn không thay đổi.","Lưu ý: Cấu trúc này thường đi kèm với các mốc thời gian cụ thể như 「今天」 (hôm nay), 「明年」 (năm sau) hoặc 「八点」 (8 giờ).","•  他从那时起就努力学习。","tā cóng nà shí qǐ jiù nǔ lì xué xí","Anh ấy bắt đầu nỗ lực học tập từ lúc đó.","•  从那天起，我们就变成了好朋友。","cóng nà tiān qǐ wǒ men jiù biàn chéng le hǎo péng yǒu","Từ ngày đó, chúng tôi đã trở thành bạn thân của nhau.","Ví dụ: 他从那时起就努力学习。","Ví dụ: 从那天起，我们就变成了好朋友。"]}],"extended":[],"structuredGrammar":[{"name":"Cách biểu đạt số ước lượng bằng số đếm","formula":"Số đếm A + Số đếm B (liên tiếp)","explanation":"Trong tiếng Trung, bạn có thể đặt hai số đếm liên tiếp nhau để diễn tả một con số ước chừng. Ví dụ: 「三四」 (ba bốn) có nghĩa là khoảng 3 hoặc 4.","tip":"Cách dùng này rất phổ biến trong giao tiếp hàng ngày để nói về số lượng không chính xác.","note":"Chỉ áp dụng với các số đếm đứng liền kề nhau trong dãy số tự nhiên, không được nhảy cóc.","examples":[{"zh":"春节大概放七八天假。","pinyin":"chūn jié dà gài fàng qī bā tiān jiǎ","vi":"Tết Nguyên Đán nghỉ khoảng 7, 8 ngày."},{"zh":"教室里来了五六个学生。","pinyin":"jiào shì lǐ lái le wǔ liù gè xué shēng","vi":"Trong lớp có khoảng 5, 6 học sinh vừa đến."}],"newExamples":[]},{"name":"Phân biệt 刚才 và 刚刚","formula":"S + 刚才 / 刚刚 + V hoặc 刚才 / 刚刚 + S + V","explanation":"Cả 「刚才」 và 「刚刚」 đều dùng để chỉ hành động vừa mới xảy ra trong quá khứ gần. 「刚才」 là danh từ chỉ thời gian, thường dùng để nhấn mạnh thời điểm vừa xảy ra tức thì. 「刚刚」 có thể là phó từ hoặc danh từ, linh hoạt hơn trong việc diễn tả hành động vừa mới hoàn thành.","tip":"Bạn có thể dùng 「刚才」 ở trước hoặc sau chủ ngữ, nhưng 「刚刚」 thường đặt trước động từ.","note":"「刚才」 không thể kết hợp với các từ chỉ khoảng thời gian (như 'hai phút'), trong khi 「刚刚」 thì có thể.","examples":[{"zh":"我刚刚看视频学会了包饺子。","pinyin":"wǒ gāng gāng kàn shì pín xué huì le bāo jiǎo zi","vi":"Tôi vừa mới xem video và học được cách gói sủi cảo."},{"zh":"刚才的话是我妈妈打来的。","pinyin":"gāng cái de huà shì wǒ mā mā dǎ lái de","vi":"Cuộc điện thoại vừa rồi là mẹ tôi gọi đến."}],"newExamples":[]},{"name":"Cấu trúc điều kiện Chỉ cần... thì...","formula":"只要 + [Điều kiện], 就 + [Kết quả]","explanation":"Cấu trúc 「只要……，就……」 dùng để biểu thị một điều kiện cần thiết, chỉ cần điều kiện đó xảy ra thì kết quả tương ứng sẽ xuất hiện. Đây là mẫu câu rất phổ biến trong tiếng Trung để khẳng định mối quan hệ nhân quả.","tip":"Bạn có thể dịch là \"Chỉ cần... thì...\" hoặc \"Miễn là... thì...\" để câu văn nghe tự nhiên hơn trong tiếng Việt.","note":"Cần chú ý đặt 「就」 ngay trước kết quả hoặc động từ chỉ kết quả để làm nổi bật sự chắc chắn của hành động.","examples":[{"zh":"只要你努力学习，就一定能完成目标。","pinyin":"zhǐ yào nǐ nǔ lì xué xí jiù yī dìng néng wán chéng mù biāo","vi":"Chỉ cần bạn nỗ lực học tập thì nhất định sẽ hoàn thành mục tiêu."},{"zh":"只要你坚持每天早睡，身体就一定会好起来。","pinyin":"zhǐ yào nǐ jiān chí měi tiān zǎo shuì shēn tǐ jiù yī dìng huì hǎo qǐ lái","vi":"Chỉ cần bạn kiên trì ngủ sớm mỗi ngày thì sức khỏe nhất định sẽ tốt lên."}],"newExamples":[]},{"name":"Cấu trúc chỉ thời điểm bắt đầu","formula":"从 + [mốc thời gian] + 起","explanation":"Cấu trúc 「从……起」 được dùng để xác định thời điểm bắt đầu của một hành động hoặc trạng thái. Trong tiếng Việt, nó tương đương với cụm từ \"kể từ...\" hoặc \"bắt đầu từ...\".","tip":"Bạn có thể thay thế 「起」 bằng 「开始」 mà nghĩa của câu vẫn không thay đổi.","note":"Cấu trúc này thường đi kèm với các mốc thời gian cụ thể như 「今天」 (hôm nay), 「明年」 (năm sau) hoặc 「八点」 (8 giờ).","examples":[{"zh":"他从那时起就努力学习。","pinyin":"tā cóng nà shí qǐ jiù nǔ lì xué xí","vi":"Anh ấy bắt đầu nỗ lực học tập từ lúc đó."},{"zh":"从那天起，我们就变成了好朋友。","pinyin":"cóng nà tiān qǐ wǒ men jiù biàn chéng le hǎo péng yǒu","vi":"Từ ngày đó, chúng tôi đã trở thành bạn thân của nhau."}],"newExamples":[]}],"subtitle":"Tôi đã học được cách gói sủi cảo"}];</script>

function home(){session=null;$('#app').innerHTML=`<section class="hero"><span class="pill">NEW HSK 3 · 18 BÀI</span><h1>HSK 3 VERSION 3.0</h1><p>483 lượt từ vựng · Flashcard · Luyện tập · Theo dõi tiến độ</p><div class="row"><button class="primary" onclick="openLesson(${store.recent||1})">▶ Tiếp tục bài ${store.recent||1}</button><button onclick="showReview()">Ôn tập tổng hợp</button></div></section><div class="grid"><div class="panel"><div class="stat">${known()}</div>Từ đã đánh dấu thuộc</div><div class="panel"><div class="stat">${store.history.length}</div>Lượt luyện tập</div><div class="panel"><div class="stat">${store.history.reduce((a,b)=>a+b.correct,0)}</div>Câu trả lời đúng</div></div><h2>18 bài học</h2><div class="grid">${L.map(x=>`<div class="card" onclick="openLesson(${x.id})"><span class="pill">Bài ${String(x.id).padStart(2,'0')}</span><h3 class="hanzi">${esc(x.title)}</h3><p>${esc(x.subtitle)}</p><small class="muted">${x.words.length} từ · ${x.grammar.length} mục ngữ pháp</small><div class="progress" style="margin-top:12px"><div style="width:${100*x.words.filter(w=>store.known[wordKey(w)]).length/x.words.length}%"></div></div></div>`).join('')}</div>`}
function openLesson(id,t='words'){lesson=L.find(x=>x.id===id);tab=t;store.recent=id;save();renderLesson()}
function renderLesson(){session=null;$('#app').innerHTML=`<button onclick="home()">← Trang chủ</button><h2>Bài ${lesson.id}: <span class="hanzi">${esc(lesson.title)}</span></h2><p class="muted">${esc(lesson.subtitle)} · ${lesson.words.length} từ vựng</p><div class="tabs">${[['words','Từ vựng'],['grammar','Ngữ pháp'],['flash','Flashcard'],['games','Trò chơi']].map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';renderLesson()">${n}</button>`).join('')}</div><section id="content"></section>`;if(tab==='words')renderWords();if(tab==='grammar')renderGrammar();if(tab==='flash')renderFlash();if(tab==='games')renderGames()}
function renderWords(){let words=lesson.words.filter(w=>(!onlyUnknown||!store.known[wordKey(w)])&&[w.hanzi,w.pinyin,w.meaning].join(' ').toLowerCase().includes(filter.toLowerCase()));$('#content').innerHTML=`<div class="toolbar"><input type="search" placeholder="Tìm Hán tự, Pinyin, nghĩa..." value="${esc(filter)}" oninput="filter=this.value;renderWords()"><button onclick="hidePin=!hidePin;renderWords()">${hidePin?'Hiện':'Ẩn'} Pinyin</button><button onclick="hideVi=!hideVi;renderWords()">${hideVi?'Hiện':'Ẩn'} nghĩa</button><button onclick="onlyUnknown=!onlyUnknown;renderWords()" class="${onlyUnknown?'active':''}">Chưa thuộc</button></div><div class="tablewrap panel"><table><thead><tr><th>STT</th><th>Hán tự</th><th>Pinyin</th><th>Nghĩa</th><th>Ví dụ và dịch</th><th>Học</th></tr></thead><tbody>${words.map((w,i)=>`<tr><td>${i+1}</td><td><div class="hanzi">${esc(w.hanzi)}</div><button onclick="speak('${w.hanzi.replace(/'/g,'')}')">🔊</button></td><td>${hidePin?'•••':esc(w.pinyin)}</td><td>${hideVi?'•••':esc(w.meaning)}</td><td><div class="hanzi" style="font-size:23px">${esc(w.example)}</div><div class="muted">${esc(w.examplePinyin||'')}</div><div class="muted">${hideVi?'•••':esc(w.translation)}</div><button onclick="speak(${JSON.stringify(w.example).replace(/"/g,'&quot;')})">🔊 Nghe câu</button></td><td><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Thuộc':'○ Chưa'}</button></td></tr>`).join('')}</tbody></table></div>`}
function toggleKnown(id){store.known[id]=!store.known[id];save();if(tab==='flash')renderFlash();else renderWords()}
function renderGrammar(){const make=(a,heading)=>`<h3>${heading}</h3>${a.map(g=>`<article class="panel grammar"><h3>${esc(g.name)}</h3><p>${g.details.map(esc).join('\n')}</p></article>`).join('')}`;$('#content').innerHTML=make(lesson.grammar,'Ngữ pháp giáo trình')+make(lesson.extended,'Chú thích mở rộng')}
function flashList(){return lesson.words.filter(w=>!onlyUnknown||!store.known[w.id])}function renderFlash(){let a=flashList();if(flashIndex>=a.length)flashIndex=0;let w=a[flashIndex];$('#content').innerHTML=`<div class="toolbar"><button onclick="onlyUnknown=!onlyUnknown;flashIndex=0;flipped=false;renderFlash()" class="${onlyUnknown?'active':''}">Chỉ từ chưa thuộc</button><button onclick="lesson.words.sort(()=>Math.random()-.5);flashIndex=0;renderFlash()">🔀 Trộn thẻ</button></div>${!w?'<div class="panel">Bạn đã đánh dấu thuộc tất cả từ trong bài.</div>':`<div class="panel flash" onclick="flipped=!flipped;renderFlash()"><div class="muted">Thẻ ${flashIndex+1}/${a.length} · Nhấn để lật</div>${flipped?`<div class="hanzi big">${esc(w.hanzi)}</div><h2>${esc(w.pinyin)}</h2><h3>${esc(w.meaning)}</h3><div class="hanzi" style="font-size:24px">${esc(w.example)}</div><p>${esc(w.translation)}</p>`:`<div class="hanzi big">${esc(w.hanzi)}</div>`}</div><div class="toolbar"><button onclick="speak(${JSON.stringify(w.hanzi).replace(/"/g,'&quot;')})">🔊 Nghe</button><button onclick="flashIndex=Math.max(0,flashIndex-1);flipped=false;renderFlash()">← Trước</button><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Đã thuộc':'○ Đánh dấu thuộc'}</button><button class="primary" onclick="flashIndex=(flashIndex+1)%flashList().length;flipped=false;renderFlash()">Tiếp →</button></div>`}`}
const MODES=[['hanzi','Hán tự → Nghĩa'],['meaning','Nghĩa → Hán tự'],['pinyin','Chọn Pinyin'],['listen','Nghe chọn Hán tự'],['type','Gõ Hán tự'],['dictation','Nghe chép chính tả']];
function renderGames(){let modes=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${n}</h3><p class="muted">Luyện với dữ liệu từ vựng của bài</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<h3>Chọn chế độ luyện tập</h3><div class="grid">${modes}</div><p class="muted">Phiên bản này triển khai 6 chế độ từ vựng. Các chế độ viết đoạn, đọc hiểu dài, sắp xếp câu và thử thách ngữ pháp chuyên sâu sẽ được bổ sung ở giai đoạn nội dung tiếp theo, không sử dụng câu hỏi giả.</p>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(mode,custom){let pool=custom||lesson.words;let questions=shuffle(pool).slice(0,Math.min(30,pool.length));session={mode,questions,pool,index:0,correct:0,answered:false};renderQuestion()}
function renderQuestion(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=s.mode;let options=shuffle([w,...shuffle(s.pool.filter(x=>x.hanzi!==w.hanzi&&x.meaning!==w.meaning)).slice(0,3)]);s.options=options;let question=m==='meaning'?w.meaning:m==='hanzi'||m==='pinyin'?w.hanzi:m==='type'?w.meaning:'🔊 Nhấn nghe';$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${MODES.find(x=>x[0]===m)?.[1]||m}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${m==='hanzi'||m==='pinyin'?'hanzi big':''}">${esc(question)}</h2>${m==='listen'||m==='dictation'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Phát âm</button>':''}<div id="options">${m==='type'||m==='dictation'?`<input id="typed" placeholder="Nhập Hán tự" autocomplete="off"><button class="primary" onclick="checkAnswer($('#typed').value)">Kiểm tra</button>`:options.map((o,i)=>`<button class="option ${m==='meaning'||m==='listen'?'chinese-option':''}" onclick="checkAnswer(${i})">${esc(m==='hanzi'?o.meaning:m==='pinyin'?o.pinyin:m==='meaning'||m==='listen'?o.hanzi:o.meaning)}</button>`).join('')}</div><div id="feedback"></div></div>`;if(m==='listen'||m==='dictation')speak(w.hanzi)}
function checkAnswer(input){let s=session;if(s.answered)return;let w=s.questions[s.index],m=s.mode;let ok=typeof input==='number'?s.options[input].id===w.id:input.replace(/[\s，。！？,.!?]/g,'')===w.hanzi.replace(/[\s，。！？,.!?]/g,'');s.answered=true;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác!':'✗ Chưa đúng'}</strong><div class="hanzi">${esc(w.hanzi)}</div><div>${esc(w.pinyin)} · ${esc(w.meaning)}</div><p>${esc(w.example)} — ${esc(w.translation)}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderQuestion()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`;[...document.querySelectorAll('.option')].forEach(b=>b.disabled=true)}
function finishGame(){let s=session;store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập 🎉</h2><div class="stat">${s.correct}/${s.questions.length}</div><p>Tỷ lệ đúng: ${Math.round(100*s.correct/s.questions.length)}%</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`}
function showReview(){let ids=L.map(x=>x.id);$('#app').innerHTML=`<h2>Ôn tập tổng hợp</h2><div class="panel"><p>Chọn các bài để luyện từ vựng.</p><div class="grid">${L.map(x=>`<label><input type="checkbox" class="lessoncheck" value="${x.id}" checked> Bài ${x.id} · ${esc(x.title)}</label>`).join('')}</div><div class="toolbar"><select id="reviewMode">${MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('')}</select><button class="primary" onclick="startReview()">Bắt đầu (tối đa 30 câu)</button></div></div>`}
function startReview(){let selected=[...document.querySelectorAll('.lessoncheck:checked')].map(x=>+x.value);let pool=L.filter(x=>selected.includes(x.id)).flatMap(x=>x.words);if(!pool.length)return alert('Hãy chọn ít nhất một bài');lesson=L.find(x=>x.id===selected[0]);startGame($('#reviewMode').value,pool)}
function showStats(){$('#app').innerHTML=`<h2>Thống kê học tập</h2><div class="grid"><div class="panel"><div class="stat">${known()}</div>Từ đã thuộc (theo lượt bài)</div><div class="panel"><div class="stat">${store.history.length}</div>Lượt luyện tập</div><div class="panel"><div class="stat">${store.history.reduce((a,b)=>a+b.correct,0)}/${store.history.reduce((a,b)=>a+b.total,0)}</div>Câu đúng / tổng câu</div></div><h3>Lịch sử gần đây</h3><div class="panel">${store.history.slice(0,30).map(h=>`<p>${new Date(h.date).toLocaleString('vi-VN')} · Bài ${h.lesson} · ${esc(h.mode)} · ${h.correct}/${h.total}</p>`).join('')||'Chưa có lượt luyện tập.'}</div><div class="toolbar"><button onclick="exportProgress()">Xuất tiến độ JSON</button><label class="panel">Nhập JSON <input type="file" accept="application/json" onchange="importProgress(this.files[0])"></label><button onclick="if(confirm('Xóa toàn bộ tiến độ trên thiết bị này?')){localStorage.removeItem(KEY);location.reload()}">Đặt lại tiến độ</button></div>`}
function exportProgress(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}));a.download='hsk3-progress.json';a.click();URL.revokeObjectURL(a.href)}async function importProgress(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!x||typeof x.known!=='object'||!Array.isArray(x.history))throw Error();if(confirm('Thay thế tiến độ hiện tại?')){store=x;save();showStats()}}catch{alert('File tiến độ không hợp lệ')}}
home();

</script><script>
/* Additional fully interactive practice modes. All questions are sourced from the workbook examples. */
const BASE_MODES=MODES.slice();
MODES.push(['cloze','Điền từ vào câu'],['translate','Dịch câu Việt → Trung'],['order','Sắp xếp câu'],['reading','Đọc hiểu câu ví dụ'],['speaking','Luyện nói'],['grammar','Thử thách ngữ pháp'],['mixed','Thử thách tổng hợp']);
const originalRenderGames=renderGames;
renderGames=function(){let html=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${esc(n)}</h3><p class="muted">${['reading','grammar','speaking'].includes(m)?'Luyện theo câu ví dụ và kiến thức có trong sổ tay':'Luyện tập tương tác'}</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<div class="toolbar"><label>Số câu <select id="numQuestions"><option>10</option><option>20</option><option selected>30</option><option>50</option></select></label></div><div class="grid">${html}</div><p class="muted">Các chế độ bổ sung khai thác câu ví dụ thực tế trong sổ tay. Chế độ “Đọc hiểu” hiện là đọc hiểu câu, chưa phải 5 bài đọc dài/bài. Số câu không vượt quá số câu hỏi khác nhau có thể tạo từ nguồn.</p>`};
function cleanHan(s){return (s||'').replace(/[\s，。！？,.!?、；：:;“”"']/g,'')}
function examples(pool){return pool.filter(w=>w.example&&w.translation&&cleanHan(w.example).length>=3)}
function getLimit(){return Number($('#numQuestions')?.value||30)}
const originalStartGame=startGame;
startGame=function(mode,custom){if(BASE_MODES.some(x=>x[0]===mode)) {let p=custom||lesson.words;let q=shuffle(p).slice(0,Math.min(getLimit(),p.length));session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderQuestion();return}let p=custom||lesson.words;let q=shuffle(examples(p));if(mode==='grammar'){let gram=(custom?L.filter(l=>l.words.some(w=>p.includes(w))):[lesson]).flatMap(l=>l.grammar.map((g,i)=>({id:`g${l.id}-${i}`,grammar:g,hanzi:g.name,example:(g.details.find(s=>s.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(s=>s.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),meaning:g.name}))).filter(x=>x.example);q=shuffle(gram)}
if(mode==='mixed')q=shuffle([...q.map((w,i)=>({...w,submode:['cloze','translate','order','reading'][i%4]})),...q.map(w=>({...w,submode:'speaking'}))]);
q=q.slice(0,Math.min(getLimit(),q.length));if(!q.length){alert('Không đủ nội dung hợp lệ trong tài liệu cho chế độ này.');return}session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderAdvanced()};
function renderAdvanced(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=w.submode||s.mode;let sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));let missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];let prompt='',control='';s.target=sentence;s.missing=missing;
if(m==='cloze'){prompt=sentence.replace(missing,'＿＿');control=`<input id="advInput" placeholder="Điền Hán tự" autocomplete="off">`}
if(m==='translate'){prompt=w.translation;control=`<textarea id="advInput" placeholder="Viết câu bằng tiếng Trung"></textarea>`}
if(m==='order'){prompt=w.translation;let units=sentence.match(/[\u3400-\u9fff]+|[^\u3400-\u9fff]/g)||tokens;s.tiles=shuffle(tokens.filter(c=>!/[。！？]/.test(c)));s.chosen=[];control=`<div id="selectedTiles" class="panel hanzi"></div><div id="tileBank" class="toolbar">${s.tiles.map((t,i)=>`<button id="tile${i}" class="hanzi" onclick="pickTile(${i})">${esc(t)}</button>`).join('')}</div><button onclick="session.chosen=[];renderAdvanced()">Xếp lại</button>`}
if(m==='reading'){prompt=sentence;control=`<p><strong>Câu này có nghĩa gì?</strong></p><textarea id="advInput" placeholder="Viết nghĩa tiếng Việt của câu"></textarea>`}
if(m==='speaking'){prompt=sentence;control=`<div class="toolbar"><button onclick="speak(session.questions[session.index].example)">🔊 Nghe mẫu</button></div><p id="recognized" class="muted">Nghe mẫu, tự đọc lại rồi gõ câu để đối chiếu.</p><input id="advInput" placeholder="Có thể gõ câu bạn đã nói">`}
if(m==='grammar'){prompt=w.grammar.name;control=`<p><strong>Nhớ lại công thức và viết câu ví dụ cho cấu trúc này.</strong></p><textarea id="advInput" placeholder="Viết một câu ví dụ"></textarea>`}
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${esc(MODES.find(x=>x[0]===m)?.[1]||m)}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${['cloze','speaking','reading'].includes(m)?'hanzi':''}">${esc(prompt)}</h2>${control}<div class="toolbar"><button class="primary" onclick="gradeAdvanced()">Kiểm tra / Đối chiếu</button></div><div id="feedback"></div></div>`}
function pickTile(i){let b=$('#tile'+i);if(b.disabled)return;session.chosen.push(session.tiles[i]);b.disabled=true;$('#selectedTiles').textContent=session.chosen.join('')}
function gradeAdvanced(){let s=session;if(s.answered)return;let w=s.questions[s.index],m=w.submode||s.mode,typed=m==='order'?s.chosen.join(''):($('#advInput')?.value||'').trim();if(!typed){alert('Hãy nhập câu trả lời trước.');return}let answer=m==='cloze'?s.missing:w.example;let ok=null;if(['cloze','translate','order','speaking'].includes(m))ok=cleanHan(typed)===cleanHan(answer);if(m==='reading'||m==='grammar')ok=null;s.answered=true;if(ok===true)s.correct++;if(ok===false)store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();let explanation=m==='grammar'?w.grammar.details.join(' · '):`${w.pinyin||''} · ${w.translation||''}`;$('#feedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu với đáp án mẫu':ok?'✓ Trùng đáp án mẫu':'Chưa trùng đáp án mẫu'}</strong><p class="hanzi">${esc(answer)}</p><p>${esc(explanation)}</p><p class="muted">${m==='translate'||m==='grammar'||m==='reading'?'Các cách diễn đạt tương đương có thể đúng; website không có AI chấm ngữ pháp/ngữ nghĩa.':''}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderAdvanced()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`}
function recordSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#recognized').textContent='Trình duyệt này không hỗ trợ nhận dạng giọng nói. Hãy thử Chrome hoặc Edge và cấp quyền micro.';return}let rec=new SR();rec.lang='zh-CN';rec.onresult=e=>{$('#advInput').value=e.results[0][0].transcript;$('#recognized').textContent='Nhận dạng: '+e.results[0][0].transcript};rec.onerror=e=>{$('#recognized').textContent='Không thể nhận dạng: '+e.error+'. Hãy kiểm tra quyền micro.'};rec.start()}
const oldFinish=finishGame;finishGame=function(){let s=session;if(BASE_MODES.some(x=>x[0]===s.mode))return oldFinish();store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length,autoGraded:!['reading','grammar','mixed'].includes(s.mode)});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập</h2><div class="stat">${s.index} câu đã làm</div><p>${s.correct} câu trùng đáp án mẫu. Các câu tự đối chiếu không được tính là sai.</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`};
const oldReview=showReview;showReview=function(){oldReview();let sel=$('#reviewMode');sel.innerHTML=MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');let btn=$('#app .primary');btn.textContent='Bắt đầu ôn tập';};

</script><script>
/* Additional practice, final exam, and answer review. No AI grading claims. */
const extraModes=[['paragraph','Viết đoạn văn có hướng dẫn'],['exam','Kiểm tra cuối khóa']];
MODES.push(...extraModes);
const previousRenderGames=renderGames;
renderGames=function(){previousRenderGames();const grid=$('#content .grid');grid.insertAdjacentHTML('beforeend',`<div class="card" onclick="startWriting()"><h3>✍️ Viết đoạn văn</h3><p class="muted">Luyện viết dựa trên câu ví dụ của bài; đối chiếu thủ công</p><button class="primary">Bắt đầu</button></div><div class="card" onclick="startFinalExam()"><h3>🏆 Kiểm tra cuối khóa</h3><p class="muted">100 câu: từ vựng, ngữ pháp và kỹ năng</p><button class="primary">Bắt đầu</button></div>`)};
function startWriting(){const words=lesson.words.filter(w=>w.example&&w.translation);if(!words.length)return alert('Chưa có câu ví dụ để luyện viết.');const selected=shuffle(words).slice(0,Math.min(30,words.length));session={mode:'paragraph',questions:selected,index:0,correct:0,answered:false};renderWriting()}
function renderWriting(){const s=session;if(s.index>=s.questions.length){finishWriting();return}const w=s.questions[s.index];$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Quay lại</button><div class="panel"><span class="pill">Luyện viết ${s.index+1}/${s.questions.length}</span><h2>Viết bằng tiếng Trung</h2><p>${esc(w.translation)}</p><p class="muted">Hãy tự viết câu này và có thể mở rộng thành một đoạn ngắn liên quan. Đây là bài tự luyện, không chấm ngữ pháp tự động.</p><textarea id="writingAnswer" rows="7" placeholder="Nhập chữ Hán...">${esc(s.draft||'')}</textarea><div class="toolbar"><button onclick="session.draft=$('#writingAnswer').value;localStorage.setItem('hsk3-writing-draft',JSON.stringify({lesson:lesson.id,index:session.index,text:session.draft}));alert('Đã lưu bản nháp trên trình duyệt')">Lưu nháp</button><button class="primary" onclick="showWritingAnswer()">Xem đáp án mẫu</button></div><div id="writingFeedback"></div></div>`}
function showWritingAnswer(){const s=session,w=s.questions[s.index];s.draft=$('#writingAnswer').value;$('#writingFeedback').innerHTML=`<div class="result"><h3>Đáp án tham khảo</h3><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p class="muted">Hãy tự đối chiếu từ vựng, thứ tự từ và cấu trúc. Có thể có nhiều cách viết đúng.</p></div><button onclick="session.index++;session.draft='';renderWriting()" class="primary">${s.index+1===s.questions.length?'Hoàn thành':'Câu tiếp theo →'}</button>`}
function finishWriting(){store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:'paragraph',correct:0,total:session.questions.length,autoGraded:false});save();$('#app').innerHTML=`<div class="panel"><h2>Đã hoàn thành ${session.questions.length} bài tự luyện viết</h2><p>Không có điểm tự động vì câu trả lời cần người học đối chiếu.</p><button onclick="openLesson(${lesson.id},'games')">Quay lại bài</button></div>`}
const EXAM_PLAN=[['hanzi',20],['grammar',20],['reading',20],['listen',20],['translate',10],['mixed',10]];
function startFinalExam(){let pool=L.flatMap(l=>l.words);let questions=[];for(const [mode,count] of EXAM_PLAN){let items;if(mode==='grammar')items=L.flatMap(l=>l.grammar.map((g,i)=>({id:`gram-${l.id}-${i}`,grammar:g,example:(g.details.find(x=>x.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(x=>x.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),hanzi:g.name}))).filter(w=>w.example);else items=pool.filter(w=>w.example&&w.translation&&(mode!=='mixed'||w.example.includes(w.hanzi)));items=shuffle(items).slice(0,count);questions.push(...items.map(w=>({...w,examMode:mode==='mixed'?'cloze':mode})))}if(questions.length!==100){alert(`Ngân hàng chỉ đủ ${questions.length}/100 câu độc lập. Không tạo câu giả.`);return}lesson=L[0];session={mode:'final-exam',questions:shuffle(questions),index:0,correct:0,answered:false,graded:0,pool};renderExamQuestion()}
function renderExamQuestion(){const s=session;if(s.index>=s.questions.length){finishExam();return}const w=s.questions[s.index],m=w.examMode;s.answered=false;let q='',input='';if(m==='hanzi'||m==='listen'){s.options=shuffle([w,...shuffle(s.pool.filter(x=>x.id!==w.id&&x.meaning!==w.meaning)).slice(0,3)]);q=m==='hanzi'?w.hanzi:'Nghe và chọn nghĩa đúng';input=`${m==='listen'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Nghe</button>':''}<div class="grid">${s.options.map((o,i)=>`<button class="option" onclick="answerExam(${i})">${esc(o.meaning)}</button>`).join('')}</div>`}else if(m==='grammar'){q=w.grammar.name;input=`<p>Hãy viết câu ví dụ sử dụng cấu trúc này.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='reading'){q=w.example;input=`<p>Hãy dịch câu sang tiếng Việt.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='translate'){q=w.translation;input=`<p>Hãy dịch sang tiếng Trung.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else{q=w.example.replace(w.hanzi,'＿＿');s.missing=w.hanzi;input=`<p>Điền từ còn thiếu.</p><input id="examInput" placeholder="Nhập Hán tự"><button class="primary" onclick="answerExam()">Kiểm tra</button>`}$('#app').innerHTML=`<div class="panel"><div class="row"><span class="pill">Đề cuối khóa · ${esc(m)}</span><span class="spacer"></span>${s.index+1}/100</div><div class="progress"><div style="width:${s.index}%"></div></div><h2 class="hanzi">${esc(q)}</h2>${input}<div id="examFeedback"></div></div>`;if(m==='listen')speak(w.hanzi)}
function answerExam(choice){const s=session;if(s.answered)return;const w=s.questions[s.index],m=w.examMode;let ok=null;if(m==='hanzi'||m==='listen')ok=s.options[choice]?.id===w.id;else{const val=$('#examInput').value.trim();if(!val)return alert('Hãy nhập câu trả lời trước.');if(m==='cloze')ok=cleanHan(val)===cleanHan(s.missing);else if(m==='translate')ok=cleanHan(val)===cleanHan(w.example)}s.answered=true;if(ok!==null){s.graded++;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1}save();$('#examFeedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu':ok?'✓ Đúng':'Chưa đúng theo đáp án mẫu'}</strong><p class="hanzi">${esc(w.example||w.hanzi)}</p><p>${esc(w.translation||'')}</p>${m==='grammar'?`<p>${esc(w.grammar.details.join(' · '))}</p>`:''}<p class="muted">Các câu tự luận không được chấm ngữ nghĩa tự động.</p></div><button class="primary" onclick="session.index++;renderExamQuestion()">${s.index===99?'Xem kết quả':'Tiếp tục →'}</button>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true)}
function finishExam(){const s=session;store.history.unshift({date:new Date().toISOString(),lesson:'1–18',mode:'final-exam',correct:s.correct,total:s.graded,autoGraded:false});save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành 100 câu cuối khóa</h2><div class="stat">${s.correct}/${s.graded}</div><p>Điểm trên chỉ tính ${s.graded} câu có thể chấm tự động. ${100-s.graded} câu tự luận cần tự đối chiếu.</p><button onclick="home();if(typeof topicExit==='function')topicExit()">Trang chủ</button><button onclick="topicHome()">36 chủ đề</button><button onclick="topicToMain('stats')">Thống kê</button></div>`}

<script>
/* Cập nhật các chế độ, giữ nguyên dữ liệu và lưu tiến độ của bản cũ. */
(function(){
const oldGames=renderGames;
renderGames=function(){oldGames();const root=document.querySelector('#content');if(!root)return;
root.querySelectorAll('.card').forEach(card=>{const action=card.getAttribute('onclick')||card.querySelector('button')?.getAttribute('onclick')||'';if(/startFinalExam|startWriting\(|startWritingPrompts/.test(action)||/kiểm tra cuối khóa|30 đề luyện viết|^✍️ Viết đoạn văn$|100 câu:/i.test(card.textContent))card.remove()});
const grid=root.querySelector('.grid');if(grid)grid.insertAdjacentHTML('beforeend',`<div class="card" onclick="startGuidedWriting()"><h3>✍️ Viết đoạn văn có hướng dẫn</h3><p class="muted">Một chủ đề mỗi bài · gợi ý từ vựng bài hiện tại và các bài trước · tự viết và lưu nháp</p><button class="primary">Bắt đầu</button></div>`);
};
const oldRenderAdvanced=renderAdvanced;
renderAdvanced=function(){let s=session,w=s?.questions?.[s.index],m=w?.submode||s?.mode;
if(m==='grammar'){renderGrammarChallenge();return}
if(m!=='cloze'){oldRenderAdvanced();return}
if(s.index>=s.questions.length){finishGame();return}
const sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));const missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];s.missing=missing;s.target=sentence;
const eligible=lesson.words.filter(x=>x.hanzi!==missing&&x.hanzi&&x.hanzi!==w.hanzi);const extras=L.filter(x=>x.id<=lesson.id).flatMap(x=>x.words).filter(x=>x.hanzi!==missing);
const opts=[missing,...shuffle([...eligible,...extras]).map(x=>x.hanzi).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3)];
while(opts.length<4){const fallback=['我','你','是','有','不','在','的','了','吗','很'];const next=fallback.find(x=>!opts.includes(x));if(!next)break;opts.push(next)}s.clozeOptions=shuffle(opts);
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">Điền từ vào câu · Bài ${lesson.id}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><div class="answer-area"><p class="muted">Chọn một trong 4 đáp án để hoàn thành câu:</p><h2 class="hanzi" style="font-size:34px;line-height:1.9">${esc(sentence.replace(missing,'＿＿＿'))}</h2><div class="cloze-options">${s.clozeOptions.map((o,i)=>`<button onclick="answerCloze(${i})">${esc(o)}</button>`).join('')}</div></div><div id="feedback"></div></div>`;
};
window.answerCloze=function(i){let s=session;if(s.answered)return;const chosen=s.clozeOptions[i];s.answered=true;const ok=chosen===s.missing;if(ok)s.correct++;else store.wrong[s.questions[s.index].id]=(store.wrong[s.questions[s.index].id]||0)+1;save();document.querySelectorAll('.cloze-options button').forEach((b,j)=>{b.disabled=true;if(s.clozeOptions[j]===s.missing)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});let w=s.questions[s.index];$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác!':'✗ Chưa chính xác'}</strong><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation||'')}</p><p>Đáp án: <b class="hanzi">${esc(s.missing)}</b></p></div><button class="primary" onclick="session.index++;session.answered=false;renderAdvanced()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`};
const oldStart=startGame;
startGame=function(mode,custom){if(mode!=='grammar')return oldStart(mode,custom);
const g=lesson.grammar.filter(x=>x.details?.some(y=>y.startsWith('Ví dụ:')));
const qs=[];
for(const gram of g){let ex=(gram.details.find(x=>x.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,'').replace(/\s*[（(][^()（）]*[)）]/g,'').trim();if(!ex)continue;
let formula=(gram.details.find(x=>x.startsWith('Công thức:'))||'').replace(/^Công thức:\s*/,'');
let preferred=['正在','因为','所以','还是','或者','已经','可以','没有','什么','怎么','多少','几','了','吗','呢','的','是','在','有','不','也','都','很','比','会','能','要','和'];
let target=preferred.find(x=>ex.includes(x)&&((gram.name+' '+formula).includes(x)))||preferred.find(x=>ex.includes(x));
if(!target){const hits=lesson.words.filter(w=>ex.includes(w.hanzi));target=hits[0]?.hanzi}
if(!target)continue;
qs.push({id:'grammar-'+lesson.id+'-'+qs.length,grammar:gram,example:ex,translation:(gram.details.find(x=>x.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),target,formula});
}
if(!qs.length){alert('Bài này chưa có ví dụ ngữ pháp đủ rõ để tạo câu hỏi trắc nghiệm. Hãy xem phần Ngữ pháp của bài.');return}
const amount=Math.min(getLimit(),qs.length);let bank=[];for(let i=0;i<amount;i++)bank.push({...qs[i%qs.length],variant:i});
session={mode:'grammar',questions:shuffle(bank),index:0,correct:0,answered:false,pool:lesson.words};renderGrammarChallenge();
};
function renderGrammarChallenge(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],target=w.target;
const current=L.filter(l=>l.id<=lesson.id).flatMap(l=>l.words).map(v=>v.hanzi);
const distractors=['的','了','吗','呢','是','有','在','不','很','也','都','和','会','能','要','比','几','什么','怎么','多少','正在','没有',...current].filter((x,i,a)=>x!==target&&a.indexOf(x)===i);
s.grammarOptions=shuffle([target,...shuffle(distractors).slice(0,3)]);
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><span class="pill">Thử thách ngữ pháp · Bài ${lesson.id}</span><span class="pill">${s.index+1}/${s.questions.length}</span><div class="answer-area"><h3>${esc(w.grammar.name)}</h3><p class="muted">${esc(w.formula)}</p><p>Chọn từ thích hợp để hoàn thành câu:</p><h2 class="hanzi" style="font-size:34px">${esc(w.example.replace(target,'＿＿＿'))}</h2><div class="cloze-options">${s.grammarOptions.map((x,i)=>`<button onclick="answerGrammar(${i})">${esc(x)}</button>`).join('')}</div></div><div id="feedback"></div></div>`;
}
window.answerGrammar=function(i){let s=session;if(s.answered)return;let w=s.questions[s.index],ok=s.grammarOptions[i]===w.target;s.answered=true;if(ok)s.correct++;save();document.querySelectorAll('.cloze-options button').forEach((b,j)=>{b.disabled=true;if(s.grammarOptions[j]===w.target)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác':'✗ Chưa đúng'}</strong><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p>${esc(w.grammar.details.join(' · '))}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderGrammarChallenge()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`};
window.startGuidedWriting=function(){session={mode:'guided-writing'};renderGuidedWriting()};
window.renderGuidedWriting=function(){const current=lesson.words,prior=L.filter(l=>l.id<lesson.id).flatMap(l=>l.words);const selected=current.filter(w=>w.example).slice(0,8),priorSelected=prior.filter(w=>w.example).slice(-8);
const title=lesson.subtitle||lesson.title;const key='hsk3-guided-v2-'+lesson.id;const draft=localStorage.getItem(key)||'';
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Quay lại trò chơi</button><div class="panel"><span class="pill">Bài ${lesson.id} · Luyện viết có hướng dẫn</span><h2>✍️ Chủ đề: ${esc(title)}</h2><p>Viết một đoạn tiếng Trung khoảng 3–6 câu theo chủ đề bài học. Ưu tiên dùng từ vựng mới của bài ${lesson.id}; có thể sử dụng các từ và cấu trúc đã học ở bài 1–${lesson.id}.</p><div class="answer-area"><h3>1. Từ vựng của bài này</h3><div class="guided-words">${selected.map(w=>`<span>${esc(w.hanzi)} · ${esc(w.meaning)}</span>`).join('')}</div><h3>2. Từ vựng ôn tập từ các bài trước</h3><div class="guided-words">${priorSelected.length?priorSelected.map(w=>`<span>${esc(w.hanzi)} · ${esc(w.meaning)}</span>`).join(''):'<p>Bài đầu tiên: chưa có từ vựng của bài trước.</p>'}</div><h3>3. Gợi ý triển khai nội dung</h3><p>• Câu 1: Giới thiệu người, vật hoặc tình huống liên quan đến chủ đề.<br>• Câu 2–3: Bổ sung thông tin, hành động hoặc sở thích bằng từ mới.<br>• Câu 4–5: Đặt câu hỏi, nêu nhận xét hoặc kết thúc câu chuyện.<br>• Kiểm tra trật tự từ và các cấu trúc ngữ pháp đã học.</p><h3>4. Viết đoạn văn của bạn</h3><textarea id="guidedText" placeholder="在这里写你的中文段落……">${esc(draft)}</textarea><div class="toolbar"><button class="primary" onclick="saveGuidedWriting()">💾 Lưu bài viết</button><button onclick="showGuidedHints()">💡 Xem câu ví dụ và ngữ pháp</button><button onclick="speak(document.querySelector('#guidedText').value)">🔊 Nghe bài viết</button></div><div id="guidedHints"></div><p class="muted">Bài viết mở, không chấm ngữ nghĩa/phát âm tự động. Nội dung gợi ý được lấy từ từ vựng và ví dụ của bài học.</p></div></div>`;
};
window.saveGuidedWriting=function(){localStorage.setItem('hsk3-guided-v2-'+lesson.id,$('#guidedText').value);alert('Đã lưu bài viết trên trình duyệt này.')};
window.showGuidedHints=function(){const grammar=lesson.grammar.filter(g=>g.details?.some(d=>d.startsWith('Ví dụ:')));$('#guidedHints').innerHTML=`<div class="result"><h3>Ví dụ tham khảo</h3>${lesson.words.filter(w=>w.example).slice(0,5).map(w=>`<p class="hanzi" style="font-size:24px">${esc(w.example)}</p><p>${esc(w.translation)}</p>`).join('')}<h3>Ngữ pháp bài ${lesson.id}</h3>${grammar.map(g=>`<p><b>${esc(g.name)}</b>: ${esc(g.details.join(' · '))}</p>`).join('')||'<p>Bài này không liệt kê mục ngữ pháp riêng trong tài liệu.</p>'}</div>`};
/* Trình duyệt bắt buộc tự quản lý quyền micro; không có cách bỏ qua yêu cầu này. */
const oldRecord=recordSpeech;
recordSpeech=function(){const note=$('#recognized');if(note)note.textContent='Nếu đây là lần đầu, trình duyệt có thể yêu cầu cấp quyền micro. Bạn có thể chọn “Cho phép” và ghi nhớ quyền cho website. Không thể bỏ qua bước bảo mật này.';oldRecord()};

const TOPICS=[{"id":1,"name":"PHÓ TỪ","words":[{"id":"hsk3-T01-01","hanzi":"只","pinyin":"zhǐ","meaning":"chỉ","example":"我今天只买了一张票。","examplePinyin":"Wǒ jīntiān zhǐ mǎi le yì zhāng piào.","translation":"Hôm nay tôi chỉ mua một vé."},{"id":"hsk3-T01-02","hanzi":"当然","pinyin":"dāngrán","meaning":"tất nhiên","example":"你当然可以来我家做客。","examplePinyin":"Nǐ dāngrán kěyǐ lái wǒ jiā zuòkè.","translation":"Tất nhiên bạn có thể đến nhà tôi chơi."},{"id":"hsk3-T01-03","hanzi":"突然","pinyin":"tūrán","meaning":"đột nhiên","example":"我们正在聊天，突然下雨了。","examplePinyin":"Wǒmen zhèngzài liáotiān, tūrán xià yǔ le.","translation":"Chúng tôi đang trò chuyện thì đột nhiên trời mưa."},{"id":"hsk3-T01-04","hanzi":"显然","pinyin":"xiǎnrán","meaning":"rõ ràng","example":"这个方法显然比较有效。","examplePinyin":"Zhège fāngfǎ xiǎnrán bǐjiào yǒuxiào.","translation":"Phương pháp này rõ ràng khá hiệu quả."},{"id":"hsk3-T01-05","hanzi":"终于","pinyin":"zhōngyú","meaning":"cuối cùng","example":"我找了半天，终于找到护照了。","examplePinyin":"Wǒ zhǎo le bàntiān, zhōngyú zhǎodào hùzhào le.","translation":"Tôi tìm mãi, cuối cùng đã tìm thấy hộ chiếu."},{"id":"hsk3-T01-06","hanzi":"至少","pinyin":"zhìshǎo","meaning":"ít nhất","example":"我每天至少学习一个小时。","examplePinyin":"Wǒ měitiān zhìshǎo xuéxí yí ge xiǎoshí.","translation":"Mỗi ngày tôi học ít nhất một tiếng."},{"id":"hsk3-T01-07","hanzi":"其实","pinyin":"qíshí","meaning":"thực ra","example":"其实他已经知道这件事了。","examplePinyin":"Qíshí tā yǐjīng zhīdào zhè jiàn shì le.","translation":"Thực ra anh ấy đã biết chuyện này rồi."},{"id":"hsk3-T01-08","hanzi":"往往","pinyin":"wǎngwǎng","meaning":"thường hay","example":"工作很忙的人往往没有时间运动。","examplePinyin":"Gōngzuò hěn máng de rén wǎngwǎng méiyǒu shíjiān yùndòng.","translation":"Người bận công việc thường không có thời gian tập thể dục."},{"id":"hsk3-T01-09","hanzi":"千万","pinyin":"qiānwàn","meaning":"nhất định phải","example":"出门前千万别忘记带护照。","examplePinyin":"Chūmén qián qiānwàn bié wàngjì dài hùzhào.","translation":"Trước khi ra ngoài nhất định đừng quên hộ chiếu."},{"id":"hsk3-T01-10","hanzi":"大概","pinyin":"dàgài","meaning":"khoảng, có lẽ","example":"从这里到机场大概需要一个小时。","examplePinyin":"Cóng zhèlǐ dào jīchǎng dàgài xūyào yí ge xiǎoshí.","translation":"Từ đây đến sân bay mất khoảng một tiếng."},{"id":"hsk3-T01-11","hanzi":"大约","pinyin":"dàyuē","meaning":"khoảng, xấp xỉ","example":"会议大约有二十个人参加。","examplePinyin":"Huìyì dàyuē yǒu èrshí ge rén cānjiā.","translation":"Khoảng hai mươi người tham dự cuộc họp."},{"id":"hsk3-T01-12","hanzi":"果然","pinyin":"guǒrán","meaning":"quả nhiên","example":"你说得对，今天果然下雪了。","examplePinyin":"Nǐ shuō de duì, jīntiān guǒrán xià xuě le.","translation":"Bạn nói đúng, hôm nay quả nhiên tuyết rơi."},{"id":"hsk3-T01-13","hanzi":"仅","pinyin":"jǐn","meaning":"chỉ, vỏn vẹn","example":"这个班仅有十名学生。","examplePinyin":"Zhège bān jǐn yǒu shí míng xuésheng.","translation":"Lớp này chỉ có mười học sinh."},{"id":"hsk3-T01-14","hanzi":"仅仅","pinyin":"jǐnjǐn","meaning":"chỉ là","example":"我们仅仅见过一次面。","examplePinyin":"Wǒmen jǐnjǐn jiànguo yí cì miàn.","translation":"Chúng tôi mới gặp nhau đúng một lần."},{"id":"hsk3-T01-15","hanzi":"尽量","pinyin":"jǐnliàng","meaning":"cố gắng hết mức","example":"请尽量早点儿到学校。","examplePinyin":"Qǐng jǐnliàng zǎodiǎnr dào xuéxiào.","translation":"Hãy cố gắng đến trường sớm một chút."},{"id":"hsk3-T01-16","hanzi":"简直","pinyin":"jiǎnzhí","meaning":"quả thật là","example":"这家饭馆的菜简直太好吃了！","examplePinyin":"Zhè jiā fànguǎn de cài jiǎnzhí tài hǎochī le!","translation":"Món ăn ở nhà hàng này ngon quá đi mất!"},{"id":"hsk3-T01-17","hanzi":"白","pinyin":"bái","meaning":"uổng công","example":"我等了半天，结果白等了。","examplePinyin":"Wǒ děng le bàntiān, jiéguǒ bái děng le.","translation":"Tôi đợi rất lâu, kết quả là đợi công cốc."},{"id":"hsk3-T01-18","hanzi":"好好","pinyin":"hǎohǎo","meaning":"cho tốt, cẩn thận","example":"你最近很累，应该好好休息。","examplePinyin":"Nǐ zuìjìn hěn lèi, yīnggāi hǎohǎo xiūxi.","translation":"Gần đây bạn rất mệt, nên nghỉ ngơi thật tốt."},{"id":"hsk3-T01-19","hanzi":"慢慢","pinyin":"mànmàn","meaning":"từ từ
