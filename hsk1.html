 động từ để biểu thị khả năng hoặc sự cho phép làm một việc gì đó. Bạn có thể hiểu 「能」 tương đương với \"có thể\" trong tiếng Việt."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 能”?","options":["我能去。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我能去。","explanation":"我能去。 — Tôi có thể đi."},{"question":"“我能去。” có nghĩa tiếng Việt nào?","options":["Tôi có thể đi.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Tôi có thể đi.","explanation":"wǒ néng qù — Tôi có thể đi."},{"question":"Cấu trúc “Chủ ngữ + 能 + Động từ + (Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 能","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Động từ năng nguyện 能","explanation":"Động từ năng nguyện 「能」 được dùng trước động từ để biểu thị khả năng hoặc sự cho phép làm một việc gì đó. Bạn có thể hiểu 「能」 tương đương với \"có thể\" trong tiếng Việt."},{"question":"Câu “我能去。” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 能","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Động từ năng nguyện 能","explanation":"Khác với 「会」 (biết làm gì nhờ học tập), 「能」 thiên về khả năng khách quan hoặc sự cho phép."}]}],"9":[{"name":"Câu tồn tại với 有 và 是","formula":"[Địa điểm] + 有/是 + [Danh từ]","explanation":"Cấu trúc này dùng để diễn tả sự tồn tại của người hoặc vật tại một địa điểm cụ thể. Khi dùng 「有」, câu mang nghĩa 'có cái gì ở đâu', còn dùng 「是」 thường mang nghĩa 'là' hoặc 'có sự hiện diện của'. Đây là dạng câu cơ bản để mô tả không gian trong tiếng Trung.","tip":"Luôn đặt từ chỉ vị trí (nơi chốn) lên đầu câu để xác định phạm vi tồn tại trước khi nhắc đến đối tượng.","note":"Khi chuyển sang phủ định với 「有」, bạn bắt buộc phải dùng 「没有」, không được dùng 「不有」.","examples":[{"hanzi":"桌子上有/是一本书。","pinyin":"zhuō zi shàng yǒu shì yī běn shū","meaning":"Trên bàn có một quyển sách."},{"hanzi":"学校前边有一家电影院。","pinyin":"xué xiào qián biān yǒu yī jiā diàn yǐng yuàn","meaning":"Phía trước trường học có một rạp chiếu phim."}],"quiz":[{"question":"Công thức đúng của “Câu tồn tại với 有 và 是” là gì?","options":["[Địa điểm] + 有/是 + [Danh từ]","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"[Địa điểm] + 有/是 + [Danh từ]","explanation":"Cấu trúc này dùng để diễn tả sự tồn tại của người hoặc vật tại một địa điểm cụ thể. Khi dùng 「有」, câu mang nghĩa 'có cái gì ở đâu', còn dùng 「是」 thường mang nghĩa 'là' hoặc 'có sự hiện diện của'. Đây là dạng câu cơ bản để mô tả không gian trong tiếng Trung."},{"question":"Ví dụ nào minh họa “Câu tồn tại với 有 và 是”?","options":["桌子上有/是一本书。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"桌子上有/是一本书。","explanation":"桌子上有/是一本书。 — Trên bàn có một quyển sách."},{"question":"“桌子上有/是一本书。” có nghĩa tiếng Việt nào?","options":["Trên bàn có một quyển sách.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Trên bàn có một quyển sách.","explanation":"zhuō zi shàng yǒu shì yī běn shū — Trên bàn có một quyển sách."},{"question":"Cấu trúc “[Địa điểm] + 有/是 + [Danh từ]” thuộc điểm ngữ pháp nào?","options":["Câu tồn tại với 有 và 是","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu tồn tại với 有 và 是","explanation":"Cấu trúc này dùng để diễn tả sự tồn tại của người hoặc vật tại một địa điểm cụ thể. Khi dùng 「有」, câu mang nghĩa 'có cái gì ở đâu', còn dùng 「是」 thường mang nghĩa 'là' hoặc 'có sự hiện diện của'. Đây là dạng câu cơ bản để mô tả không gian trong tiếng Trung."},{"question":"Câu “桌子上有/是一本书。” minh họa điểm ngữ pháp nào?","options":["Câu tồn tại với 有 và 是","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu tồn tại với 有 và 是","explanation":"Khi chuyển sang phủ định với 「有」, bạn bắt buộc phải dùng 「没有」, không được dùng 「不有」."}]},{"name":"Thứ tự trạng ngữ thời gian và địa điểm","formula":"Chủ ngữ + Trạng ngữ thời gian + Trạng ngữ địa điểm + Động từ","explanation":"Trong câu tiếng Trung, khi muốn nói về cả thời gian và địa điểm, bạn cần đặt trạng ngữ chỉ thời gian lên trước trạng ngữ chỉ địa điểm. Cấu trúc này giúp câu văn nghe tự nhiên và đúng quy tắc diễn đạt của người bản xứ.","tip":"Bạn có thể nhớ mẹo là \"Thời gian đi trước, nơi chốn theo sau\" để không bị nhầm lẫn.","note":"Lưu ý không đặt trạng ngữ thời gian ở cuối câu như trong tiếng Việt.","examples":[{"hanzi":"我们上午十点在书店见吧。","pinyin":"wǒ men shàng wǔ shí diǎn zài shū diàn jiàn ba","meaning":"Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé."},{"hanzi":"我明天上午在学校学习。","pinyin":"wǒ míng tiān shàng wǔ zài xué xiào xué xí","meaning":"Tôi học ở trường vào sáng mai."}],"quiz":[{"question":"Công thức đúng của “Thứ tự trạng ngữ thời gian và địa điểm” là gì?","options":["Chủ ngữ + Trạng ngữ thời gian + Trạng ngữ địa điểm + Động từ","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Chủ ngữ + Trạng ngữ thời gian + Trạng ngữ địa điểm + Động từ","explanation":"Trong câu tiếng Trung, khi muốn nói về cả thời gian và địa điểm, bạn cần đặt trạng ngữ chỉ thời gian lên trước trạng ngữ chỉ địa điểm. Cấu trúc này giúp câu văn nghe tự nhiên và đúng quy tắc diễn đạt của người bản xứ."},{"question":"Ví dụ nào minh họa “Thứ tự trạng ngữ thời gian và địa điểm”?","options":["我们上午十点在书店见吧。","我是学生。","他是中国人。","我的中文老师"],"answer":"我们上午十点在书店见吧。","explanation":"我们上午十点在书店见吧。 — Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé."},{"question":"“我们上午十点在书店见吧。” có nghĩa tiếng Việt nào?","options":["Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé.","explanation":"wǒ men shàng wǔ shí diǎn zài shū diàn jiàn ba — Mười giờ sáng chúng ta gặp nhau ở nhà sách nhé."},{"question":"Cấu trúc “Chủ ngữ + Trạng ngữ thời gian + Trạng ngữ địa điểm + Động từ” thuộc điểm ngữ pháp nào?","options":["Thứ tự trạng ngữ thời gian và địa điểm","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Thứ tự trạng ngữ thời gian và địa điểm","explanation":"Trong câu tiếng Trung, khi muốn nói về cả thời gian và địa điểm, bạn cần đặt trạng ngữ chỉ thời gian lên trước trạng ngữ chỉ địa điểm. Cấu trúc này giúp câu văn nghe tự nhiên và đúng quy tắc diễn đạt của người bản xứ."},{"question":"Câu “我们上午十点在书店见吧。” minh họa điểm ngữ pháp nào?","options":["Thứ tự trạng ngữ thời gian và địa điểm","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Thứ tự trạng ngữ thời gian và địa điểm","explanation":"Lưu ý không đặt trạng ngữ thời gian ở cuối câu như trong tiếng Việt."}]},{"name":"Số thứ tự với 第","formula":"第 + Số đếm + (Lượng từ) + Danh từ","explanation":"Trong tiếng Trung, để biến một số đếm thành số thứ tự, chúng ta chỉ cần thêm tiền tố 「第」 vào trước số đó. Ví dụ, 「第一」 (dì yī) có nghĩa là \"thứ nhất\", 「第二」 (dì èr) là \"thứ hai\". Cấu trúc này dùng để chỉ thứ tự, xếp hạng hoặc lần lượt của sự việc.","tip":"Khi muốn nói về số lần (ví dụ: lần thứ nhất), bạn cần thêm lượng từ 「次」 ngay sau số đếm: 「第一次」 (dì yī cì).","note":"Đừng quên 「第」 chỉ dùng cho số đếm, không dùng cho số lượng ước chừng như 「几」 hay số lượng cụ thể mang tính tổng cộng.","examples":[{"hanzi":"第一，第一个，第一个学生","pinyin":"dì yī dì yī gè dì yī gè xué shēng","meaning":"Thứ nhất, cái đầu tiên, học sinh đầu tiên"},{"hanzi":"这是我的第二本中文书。","pinyin":"zhè shì wǒ de dì èr běn zhōng wén shū","meaning":"Đây là quyển sách tiếng Trung thứ hai của tôi."}],"quiz":[{"question":"Công thức đúng của “Số thứ tự với 第” là gì?","options":["第 + Số đếm + (Lượng từ) + Danh từ","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"第 + Số đếm + (Lượng từ) + Danh từ","explanation":"Trong tiếng Trung, để biến một số đếm thành số thứ tự, chúng ta chỉ cần thêm tiền tố 「第」 vào trước số đó. Ví dụ, 「第一」 (dì yī) có nghĩa là \"thứ nhất\", 「第二」 (dì èr) là \"thứ hai\". Cấu trúc này dùng để chỉ thứ tự, xếp hạng hoặc lần lượt của sự việc."},{"question":"Ví dụ nào minh họa “Số thứ tự với 第”?","options":["第一，第一个，第一个学生","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"第一，第一个，第一个学生","explanation":"第一，第一个，第一个学生 — Thứ nhất, cái đầu tiên, học sinh đầu tiên"},{"question":"“第一，第一个，第一个学生” có nghĩa tiếng Việt nào?","options":["Thứ nhất, cái đầu tiên, học sinh đầu tiên","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Thứ nhất, cái đầu tiên, học sinh đầu tiên","explanation":"dì yī dì yī gè dì yī gè xué shēng — Thứ nhất, cái đầu tiên, học sinh đầu tiên"},{"question":"Cấu trúc “第 + Số đếm + (Lượng từ) + Danh từ” thuộc điểm ngữ pháp nào?","options":["Số thứ tự với 第","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Số thứ tự với 第","explanation":"Trong tiếng Trung, để biến một số đếm thành số thứ tự, chúng ta chỉ cần thêm tiền tố 「第」 vào trước số đó. Ví dụ, 「第一」 (dì yī) có nghĩa là \"thứ nhất\", 「第二」 (dì èr) là \"thứ hai\". Cấu trúc này dùng để chỉ thứ tự, xếp hạng hoặc lần lượt của sự việc."},{"question":"Câu “第一，第一个，第一个学生” minh họa điểm ngữ pháp nào?","options":["Số thứ tự với 第","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Số thứ tự với 第","explanation":"Đừng quên 「第」 chỉ dùng cho số đếm, không dùng cho số lượng ước chừng như 「几」 hay số lượng cụ thể mang tính tổng cộng."}]}],"10":[{"name":"Cách đọc tiền tệ trong tiếng Trung","formula":"Số đếm + Đơn vị (元/角/分 hoặc 块/毛/分)","explanation":"Trong tiếng Trung, đơn vị tiền tệ chính là 「元」 (văn viết), 「角」 và 「分」. Trong giao tiếp hằng ngày, người ta thường dùng 「块」 thay cho 「元」 và 「毛」 thay cho 「角」. Đơn vị 「分」 được giữ nguyên trong cả văn nói và văn viết.","tip":"Hãy nhớ quy đổi đơn vị: 1 「元」 (块) = 10 「角」 (毛) = 100 「分」.","note":"Không nên dùng lẫn lộn đơn vị văn viết và văn nói trong cùng một cụm từ, ví dụ nên chọn dùng 「块」 và 「毛」 khi nói chuyện.","examples":[{"hanzi":"三块","pinyin":"sān kuài","meaning":"Ba tệ"},{"hanzi":"三块二","pinyin":"sān kuài èr","meaning":"Ba tệ hai hào"}],"quiz":[{"question":"Công thức đúng của “Cách đọc tiền tệ trong tiếng Trung” là gì?","options":["Số đếm + Đơn vị (元/角/分 hoặc 块/毛/分)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Số đếm + Đơn vị (元/角/分 hoặc 块/毛/分)","explanation":"Trong tiếng Trung, đơn vị tiền tệ chính là 「元」 (văn viết), 「角」 và 「分」. Trong giao tiếp hằng ngày, người ta thường dùng 「块」 thay cho 「元」 và 「毛」 thay cho 「角」. Đơn vị 「分」 được giữ nguyên trong cả văn nói và văn viết."},{"question":"Ví dụ nào minh họa “Cách đọc tiền tệ trong tiếng Trung”?","options":["三块","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"三块","explanation":"三块 — Ba tệ"},{"question":"“三块” có nghĩa tiếng Việt nào?","options":["Ba tệ","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Ba tệ","explanation":"sān kuài — Ba tệ"},{"question":"Cấu trúc “Số đếm + Đơn vị (元/角/分 hoặc 块/毛/分)” thuộc điểm ngữ pháp nào?","options":["Cách đọc tiền tệ trong tiếng Trung","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Cách đọc tiền tệ trong tiếng Trung","explanation":"Trong tiếng Trung, đơn vị tiền tệ chính là 「元」 (văn viết), 「角」 và 「分」. Trong giao tiếp hằng ngày, người ta thường dùng 「块」 thay cho 「元」 và 「毛」 thay cho 「角」. Đơn vị 「分」 được giữ nguyên trong cả văn nói và văn viết."},{"question":"Câu “三块” minh họa điểm ngữ pháp nào?","options":["Cách đọc tiền tệ trong tiếng Trung","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Cách đọc tiền tệ trong tiếng Trung","explanation":"Không nên dùng lẫn lộn đơn vị văn viết và văn nói trong cùng một cụm từ, ví dụ nên chọn dùng 「块」 và 「毛」 khi nói chuyện."}]},{"name":"Câu vị ngữ tính từ","formula":"Chủ ngữ + (phó từ chỉ mức độ) + Tính từ","explanation":"Trong câu vị ngữ tính từ, tính từ đóng vai trò làm vị ngữ thay cho động từ. Khi dùng cấu trúc này, ta thường thêm phó từ chỉ mức độ như 「很」 (rất) vào trước tính từ để câu tự nhiên hơn.","tip":"Dù trong tiếng Việt không dịch 「很」, nhưng trong tiếng Trung bạn nên thêm nó vào để tránh câu bị cụt.","note":"Không được thêm động từ 「是」 trước tính từ trong câu vị ngữ tính từ.","examples":[{"hanzi":"这个苹果很好吃。","pinyin":"zhè gè píng guǒ hěn hǎo chī","meaning":"Quả táo này rất ngon."},{"hanzi":"我的房间不大。","pinyin":"wǒ de fáng jiān bù dà","meaning":"Phòng của tôi không lớn."}],"quiz":[{"question":"Công thức đúng của “Câu vị ngữ tính từ” là gì?","options":["Chủ ngữ + (phó từ chỉ mức độ) + Tính từ","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Chủ ngữ + (phó từ chỉ mức độ) + Tính từ","explanation":"Trong câu vị ngữ tính từ, tính từ đóng vai trò làm vị ngữ thay cho động từ. Khi dùng cấu trúc này, ta thường thêm phó từ chỉ mức độ như 「很」 (rất) vào trước tính từ để câu tự nhiên hơn."},{"question":"Ví dụ nào minh họa “Câu vị ngữ tính từ”?","options":["这个苹果很好吃。","我是学生。","他是中国人。","我的中文老师"],"answer":"这个苹果很好吃。","explanation":"这个苹果很好吃。 — Quả táo này rất ngon."},{"question":"“这个苹果很好吃。” có nghĩa tiếng Việt nào?","options":["Quả táo này rất ngon.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Quả táo này rất ngon.","explanation":"zhè gè píng guǒ hěn hǎo chī — Quả táo này rất ngon."},{"question":"Cấu trúc “Chủ ngữ + (phó từ chỉ mức độ) + Tính từ” thuộc điểm ngữ pháp nào?","options":["Câu vị ngữ tính từ","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Câu vị ngữ tính từ","explanation":"Trong câu vị ngữ tính từ, tính từ đóng vai trò làm vị ngữ thay cho động từ. Khi dùng cấu trúc này, ta thường thêm phó từ chỉ mức độ như 「很」 (rất) vào trước tính từ để câu tự nhiên hơn."},{"question":"Câu “这个苹果很好吃。” minh họa điểm ngữ pháp nào?","options":["Câu vị ngữ tính từ","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Câu vị ngữ tính từ","explanation":"Không được thêm động từ 「是」 trước tính từ trong câu vị ngữ tính từ."}]},{"name":"Đại từ nghi vấn 怎么样","formula":"Chủ ngữ + 怎么样？","explanation":"Từ 「怎么样」 được dùng để hỏi về tính chất, tình trạng của người hoặc sự vật. Bạn cũng có thể dùng nó để hỏi ý kiến hoặc đưa ra một đề xuất về một vấn đề nào đó.","tip":"Bạn có thể dịch 「怎么样」 là 'như thế nào' hoặc 'thế nào' trong tiếng Việt để dễ ghi nhớ.","note":"Lưu ý không dùng 「怎么样」 để hỏi về số lượng hay giá cả (vốn dùng 「多少」).","examples":[{"hanzi":"这件衣服怎么样？","pinyin":"zhè jiàn yī fú zěn me yàng","meaning":"Bộ quần áo này thế nào?"},{"hanzi":"这个杯子怎么样？","pinyin":"zhè gè bēi zi zěn me yàng","meaning":"Cái ly này thế nào?"}],"quiz":[{"question":"Công thức đúng của “Đại từ nghi vấn 怎么样” là gì?","options":["Chủ ngữ + 怎么样？","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 怎么样？","explanation":"Từ 「怎么样」 được dùng để hỏi về tính chất, tình trạng của người hoặc sự vật. Bạn cũng có thể dùng nó để hỏi ý kiến hoặc đưa ra một đề xuất về một vấn đề nào đó."},{"question":"Ví dụ nào minh họa “Đại từ nghi vấn 怎么样”?","options":["这件衣服怎么样？","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"这件衣服怎么样？","explanation":"这件衣服怎么样？ — Bộ quần áo này thế nào?"},{"question":"“这件衣服怎么样？” có nghĩa tiếng Việt nào?","options":["Bộ quần áo này thế nào?","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Bộ quần áo này thế nào?","explanation":"zhè jiàn yī fú zěn me yàng — Bộ quần áo này thế nào?"},{"question":"Cấu trúc “Chủ ngữ + 怎么样？” thuộc điểm ngữ pháp nào?","options":["Đại từ nghi vấn 怎么样","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Đại từ nghi vấn 怎么样","explanation":"Từ 「怎么样」 được dùng để hỏi về tính chất, tình trạng của người hoặc sự vật. Bạn cũng có thể dùng nó để hỏi ý kiến hoặc đưa ra một đề xuất về một vấn đề nào đó."},{"question":"Câu “这件衣服怎么样？” minh họa điểm ngữ pháp nào?","options":["Đại từ nghi vấn 怎么样","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Đại từ nghi vấn 怎么样","explanation":"Lưu ý không dùng 「怎么样」 để hỏi về số lượng hay giá cả (vốn dùng 「多少」)."}]}],"11":[{"name":"Câu hỏi chính phản","formula":"Động từ/Tính từ + 不 (bù) + Động từ/Tính từ","explanation":"Câu hỏi chính phản sử dụng hình thức khẳng định và phủ định của từ ngữ đứng cạnh nhau để tạo thành câu hỏi. Bạn không cần dùng trợ từ nghi vấn 「吗」 ở cuối câu khi đã sử dụng cấu trúc này. Ví dụ: 「你去不去？」(Bạn có đi hay không đi?).","tip":"Cấu trúc này giúp câu hỏi trở nên trực diện và tự nhiên hơn trong giao tiếp hàng ngày so với việc dùng 「吗」.","note":"Không được thêm 「吗」 vào cuối câu khi đã sử dụng dạng câu hỏi chính phản vì sẽ gây lặp cấu trúc nghi vấn.","examples":[{"hanzi":"好不好？","pinyin":"hǎo bù hǎo","meaning":"Tốt không?"},{"hanzi":"你去不去学校？","pinyin":"nǐ qù bù qù xué xiào","meaning":"Bạn có đi học không?"}],"quiz":[{"question":"Công thức đúng của “Câu hỏi chính phản” là gì?","options":["Động từ/Tính từ + 不 (bù) + Động từ/Tính từ","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Động từ/Tính từ + 不 (bù) + Động từ/Tính từ","explanation":"Câu hỏi chính phản sử dụng hình thức khẳng định và phủ định của từ ngữ đứng cạnh nhau để tạo thành câu hỏi. Bạn không cần dùng trợ từ nghi vấn 「吗」 ở cuối câu khi đã sử dụng cấu trúc này. Ví dụ: 「你去不去？」(Bạn có đi hay không đi?)."},{"question":"Ví dụ nào minh họa “Câu hỏi chính phản”?","options":["好不好？","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"好不好？","explanation":"好不好？ — Tốt không?"},{"question":"“好不好？” có nghĩa tiếng Việt nào?","options":["Tốt không?","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Tốt không?","explanation":"hǎo bù hǎo — Tốt không?"},{"question":"Cấu trúc “Động từ/Tính từ + 不 (bù) + Động từ/Tính từ” thuộc điểm ngữ pháp nào?","options":["Câu hỏi chính phản","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu hỏi chính phản","explanation":"Câu hỏi chính phản sử dụng hình thức khẳng định và phủ định của từ ngữ đứng cạnh nhau để tạo thành câu hỏi. Bạn không cần dùng trợ từ nghi vấn 「吗」 ở cuối câu khi đã sử dụng cấu trúc này. Ví dụ: 「你去不去？」(Bạn có đi hay không đi?)."},{"question":"Câu “好不好？” minh họa điểm ngữ pháp nào?","options":["Câu hỏi chính phản","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu hỏi chính phản","explanation":"Không được thêm 「吗」 vào cuối câu khi đã sử dụng dạng câu hỏi chính phản vì sẽ gây lặp cấu trúc nghi vấn."}]},{"name":"Diễn tả hành động đang tiếp diễn","formula":"Chủ ngữ + (正/正在/在) + Động từ + (呢)","explanation":"Các phó từ 「在」, 「正在」 hoặc 「正」 được đặt trước động từ để diễn tả hành động đang thực sự xảy ra tại thời điểm nói. Bạn có thể thêm trợ từ ngữ khí 「呢」 vào cuối câu để nhấn mạnh trạng thái tiếp diễn của hành động đó.","tip":"Nếu muốn nhấn mạnh hơn vào thời điểm chính xác hành động đang xảy ra, hãy ưu tiên dùng 「正在」 hoặc kết hợp cả 「正...呢」.","note":"Cần phân biệt 「在」 là phó từ chỉ thời gian (đang) với 「在」 là giới từ chỉ địa điểm (ở), ví dụ: 「我在家」 (Tôi ở nhà) khác với 「我正在看书」 (Tôi đang đọc sách).","examples":[{"hanzi":"他在休息呢。","pinyin":"tā zài xiū xī ne","meaning":"Anh ấy đang nghỉ ngơi."},{"hanzi":"我正在看电视。","pinyin":"wǒ zhèng zài kàn diàn shì","meaning":"Tôi đang xem tivi."}],"quiz":[{"question":"Công thức đúng của “Diễn tả hành động đang tiếp diễn” là gì?","options":["Chủ ngữ + (正/正在/在) + Động từ + (呢)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Chủ ngữ + (正/正在/在) + Động từ + (呢)","explanation":"Các phó từ 「在」, 「正在」 hoặc 「正」 được đặt trước động từ để diễn tả hành động đang thực sự xảy ra tại thời điểm nói. Bạn có thể thêm trợ từ ngữ khí 「呢」 vào cuối câu để nhấn mạnh trạng thái tiếp diễn của hành động đó."},{"question":"Ví dụ nào minh họa “Diễn tả hành động đang tiếp diễn”?","options":["他在休息呢。","我是学生。","他是中国人。","我的中文老师"],"answer":"他在休息呢。","explanation":"他在休息呢。 — Anh ấy đang nghỉ ngơi."},{"question":"“他在休息呢。” có nghĩa tiếng Việt nào?","options":["Anh ấy đang nghỉ ngơi.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Anh ấy đang nghỉ ngơi.","explanation":"tā zài xiū xī ne — Anh ấy đang nghỉ ngơi."},{"question":"Cấu trúc “Chủ ngữ + (正/正在/在) + Động từ + (呢)” thuộc điểm ngữ pháp nào?","options":["Diễn tả hành động đang tiếp diễn","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Diễn tả hành động đang tiếp diễn","explanation":"Các phó từ 「在」, 「正在」 hoặc 「正」 được đặt trước động từ để diễn tả hành động đang thực sự xảy ra tại thời điểm nói. Bạn có thể thêm trợ từ ngữ khí 「呢」 vào cuối câu để nhấn mạnh trạng thái tiếp diễn của hành động đó."},{"question":"Câu “他在休息呢。” minh họa điểm ngữ pháp nào?","options":["Diễn tả hành động đang tiếp diễn","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Diễn tả hành động đang tiếp diễn","explanation":"Cần phân biệt 「在」 là phó từ chỉ thời gian (đang) với 「在」 là giới từ chỉ địa điểm (ở), ví dụ: 「我在家」 (Tôi ở nhà) khác với 「我正在看书」 (Tôi đang đọc sách)."}]},{"name":"Động từ năng nguyện 要","formula":"Chủ ngữ + 要 + Động từ + (Tân ngữ)","explanation":"Động từ năng nguyện 「要」 được dùng để diễn tả mong muốn, ý định hoặc dự định thực hiện một hành động nào đó. Ngoài ra, nó còn thể hiện sự yêu cầu bắt buộc hoặc dự báo một sự việc sắp xảy ra.","tip":"Khi muốn nói phủ định, bạn hãy thêm 「不」 vào trước 「要」, tạo thành 「不要」 (không muốn/không cần).","note":"Cần phân biệt 「要」 với 「想」; 「要」 thường mang sắc thái quyết tâm hoặc yêu cầu mạnh mẽ hơn so với 「想」.","examples":[{"hanzi":"我要睡觉。","pinyin":"wǒ yào shuì jiào","meaning":"Tôi muốn đi ngủ."},{"hanzi":"他今天要和小朋友玩。","pinyin":"tā jīn tiān yào hé xiǎo péng yǒu wán","meaning":"Hôm nay nó muốn chơi với các bạn nhỏ."}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 要” là gì?","options":["Chủ ngữ + 要 + Động từ + (Tân ngữ)","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 要 + Động từ + (Tân ngữ)","explanation":"Động từ năng nguyện 「要」 được dùng để diễn tả mong muốn, ý định hoặc dự định thực hiện một hành động nào đó. Ngoài ra, nó còn thể hiện sự yêu cầu bắt buộc hoặc dự báo một sự việc sắp xảy ra."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 要”?","options":["我要睡觉。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我要睡觉。","explanation":"我要睡觉。 — Tôi muốn đi ngủ."},{"question":"“我要睡觉。” có nghĩa tiếng Việt nào?","options":["Tôi muốn đi ngủ.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Tôi muốn đi ngủ.","explanation":"wǒ yào shuì jiào — Tôi muốn đi ngủ."},{"question":"Cấu trúc “Chủ ngữ + 要 + Động từ + (Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 要","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Động từ năng nguyện 要","explanation":"Động từ năng nguyện 「要」 được dùng để diễn tả mong muốn, ý định hoặc dự định thực hiện một hành động nào đó. Ngoài ra, nó còn thể hiện sự yêu cầu bắt buộc hoặc dự báo một sự việc sắp xảy ra."},{"question":"Câu “我要睡觉。” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 要","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Động từ năng nguyện 要","explanation":"Cần phân biệt 「要」 với 「想」; 「要」 thường mang sắc thái quyết tâm hoặc yêu cầu mạnh mẽ hơn so với 「想」."}]}],"12":[{"name":"Câu phi chủ vị","formula":"Danh từ/Động từ/Tính từ (không cần chủ ngữ)","explanation":"Câu phi chủ vị là loại câu ngắn gọn không có chủ ngữ rõ ràng. Người ta thường dùng loại câu này để mô tả các hiện tượng tự nhiên như 「下雨了」(Trời mưa rồi) hoặc dùng trong các lời chào hỏi, cảm thán như 「你好」(Xin chào).","tip":"Hãy tập trung ghi nhớ các cụm từ cố định trong giao tiếp vì chúng thường không cần chủ ngữ.","note":"Đừng cố gắng thêm chủ ngữ vào các câu cảm thán hoặc câu miêu tả hiện tượng tự nhiên vì sẽ làm câu trở nên gượng gạo.","examples":[{"hanzi":"下雨了。","pinyin":"xià yǔ le","meaning":"Mưa rồi."},{"hanzi":"对不起！","pinyin":"duì bù qǐ","meaning":"Xin lỗi!"}],"quiz":[{"question":"Công thức đúng của “Câu phi chủ vị” là gì?","options":["Danh từ/Động từ/Tính từ (không cần chủ ngữ)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Danh từ/Động từ/Tính từ (không cần chủ ngữ)","explanation":"Câu phi chủ vị là loại câu ngắn gọn không có chủ ngữ rõ ràng. Người ta thường dùng loại câu này để mô tả các hiện tượng tự nhiên như 「下雨了」(Trời mưa rồi) hoặc dùng trong các lời chào hỏi, cảm thán như 「你好」(Xin chào)."},{"question":"Ví dụ nào minh họa “Câu phi chủ vị”?","options":["下雨了。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"下雨了。","explanation":"下雨了。 — Mưa rồi."},{"question":"“下雨了。” có nghĩa tiếng Việt nào?","options":["Mưa rồi.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Mưa rồi.","explanation":"xià yǔ le — Mưa rồi."},{"question":"Cấu trúc “Danh từ/Động từ/Tính từ (không cần chủ ngữ)” thuộc điểm ngữ pháp nào?","options":["Câu phi chủ vị","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu phi chủ vị","explanation":"Câu phi chủ vị là loại câu ngắn gọn không có chủ ngữ rõ ràng. Người ta thường dùng loại câu này để mô tả các hiện tượng tự nhiên như 「下雨了」(Trời mưa rồi) hoặc dùng trong các lời chào hỏi, cảm thán như 「你好」(Xin chào)."},{"question":"Câu “下雨了。” minh họa điểm ngữ pháp nào?","options":["Câu phi chủ vị","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu phi chủ vị","explanation":"Đừng cố gắng thêm chủ ngữ vào các câu cảm thán hoặc câu miêu tả hiện tượng tự nhiên vì sẽ làm câu trở nên gượng gạo."}]},{"name":"Trợ từ ngữ khí 了 (lè)","formula":"Câu + 了","explanation":"Trợ từ 「了」 đặt cuối câu để biểu thị một tình huống đã thay đổi hoặc một trạng thái mới vừa xuất hiện. Nó cũng dùng để nhấn mạnh một hành động đã xảy ra hoặc đã hoàn thành.","tip":"Hãy tưởng tượng 「了」 như một dấu hiệu cho thấy tình hình hiện tại đã khác so với trước đây.","note":"Đừng nhầm lẫn giữa 「了」 biểu thị trạng thái (cuối câu) và 「了」 biểu thị hoàn thành động từ (sau động từ) vì vị trí của chúng khác nhau.","examples":[{"hanzi":"我去上课了。","pinyin":"wǒ qù shàng kè le","meaning":"Tôi đi học đây."},{"hanzi":"下雨了。","pinyin":"xià yǔ le","meaning":"Mưa rồi - tình trạng đã thay đổi."}],"quiz":[{"question":"Công thức đúng của “Trợ từ ngữ khí 了 (lè)” là gì?","options":["Câu + 了","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Câu + 了","explanation":"Trợ từ 「了」 đặt cuối câu để biểu thị một tình huống đã thay đổi hoặc một trạng thái mới vừa xuất hiện. Nó cũng dùng để nhấn mạnh một hành động đã xảy ra hoặc đã hoàn thành."},{"question":"Ví dụ nào minh họa “Trợ từ ngữ khí 了 (lè)”?","options":["我去上课了。","我是学生。","他是中国人。","我的中文老师"],"answer":"我去上课了。","explanation":"我去上课了。 — Tôi đi học đây."},{"question":"“我去上课了。” có nghĩa tiếng Việt nào?","options":["Tôi đi học đây.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi đi học đây.","explanation":"wǒ qù shàng kè le — Tôi đi học đây."},{"question":"Cấu trúc “Câu + 了” thuộc điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 了 (lè)","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Trợ từ ngữ khí 了 (lè)","explanation":"Trợ từ 「了」 đặt cuối câu để biểu thị một tình huống đã thay đổi hoặc một trạng thái mới vừa xuất hiện. Nó cũng dùng để nhấn mạnh một hành động đã xảy ra hoặc đã hoàn thành."},{"question":"Câu “我去上课了。” minh họa điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 了 (lè)","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Trợ từ ngữ khí 了 (lè)","explanation":"Đừng nhầm lẫn giữa 「了」 biểu thị trạng thái (cuối câu) và 「了」 biểu thị hoàn thành động từ (sau động từ) vì vị trí của chúng khác nhau."}]},{"name":"Cấu trúc cảm thán quá mức với 「太...了」","formula":"太 + [tính từ/động từ tâm lý] + 了","explanation":"Cấu trúc này dùng để biểu thị mức độ cao, vượt quá mức bình thường hoặc dùng để cảm thán. Nó mang nghĩa tiếng Việt tương đương với \"quá\", \"lắm\" hoặc \"thật là...\". Ví dụ: 「太好了」(Tài hǎo le - Tốt quá rồi).","tip":"Bạn có thể thêm các từ như 「真」(zhēn - thật) hoặc 「实在」(shízài - thật sự) vào trước 「太」 để tăng thêm sắc thái biểu cảm mạnh mẽ hơn.","note":"Trong câu khẳng định với 「太...了」, nhất định phải có trợ từ ngữ khí 「了」 ở cuối câu thì mới hoàn chỉnh.","examples":[{"hanzi":"太冷了！","pinyin":"tài lěng le","meaning":"Lạnh quá!"},{"hanzi":"这个杯子太小了。","pinyin":"zhè gè bēi zi tài xiǎo le","meaning":"Cái ly này nhỏ quá."}],"quiz":[{"question":"Công thức đúng của “Cấu trúc cảm thán quá mức với 「太...了」” là gì?","options":["太 + [tính từ/động từ tâm lý] + 了","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"太 + [tính từ/động từ tâm lý] + 了","explanation":"Cấu trúc này dùng để biểu thị mức độ cao, vượt quá mức bình thường hoặc dùng để cảm thán. Nó mang nghĩa tiếng Việt tương đương với \"quá\", \"lắm\" hoặc \"thật là...\". Ví dụ: 「太好了」(Tài hǎo le - Tốt quá rồi)."},{"question":"Ví dụ nào minh họa “Cấu trúc cảm thán quá mức với 「太...了」”?","options":["太冷了！","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"太冷了！","explanation":"太冷了！ — Lạnh quá!"},{"question":"“太冷了！” có nghĩa tiếng Việt nào?","options":["Lạnh quá!","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Lạnh quá!","explanation":"tài lěng le — Lạnh quá!"},{"question":"Cấu trúc “太 + [tính từ/động từ tâm lý] + 了” thuộc điểm ngữ pháp nào?","options":["Cấu trúc cảm thán quá mức với 「太...了」","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Cấu trúc cảm thán quá mức với 「太...了」","explanation":"Cấu trúc này dùng để biểu thị mức độ cao, vượt quá mức bình thường hoặc dùng để cảm thán. Nó mang nghĩa tiếng Việt tương đương với \"quá\", \"lắm\" hoặc \"thật là...\". Ví dụ: 「太好了」(Tài hǎo le - Tốt quá rồi)."},{"question":"Câu “太冷了！” minh họa điểm ngữ pháp nào?","options":["Cấu trúc cảm thán quá mức với 「太...了」","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Cấu trúc cảm thán quá mức với 「太...了」","explanation":"Trong câu khẳng định với 「太...了」, nhất định phải có trợ từ ngữ khí 「了」 ở cuối câu thì mới hoàn chỉnh."}]}],"13":[{"name":"Động từ năng nguyện 可以","formula":"Chủ ngữ + 可以 + Động từ + (Tân ngữ)","explanation":"「可以」 là động từ năng nguyện dùng để biểu thị sự cho phép hoặc khả năng thực hiện hành động nào đó. Nó thường đứng ngay trước động từ chính trong câu để bổ trợ ý nghĩa.","tip":"Khi muốn dùng câu phủ định, bạn chỉ cần thêm 「不」 phía trước, tạo thành 「不可以」 hoặc 「不可以」 có nghĩa là 'không được phép'.","note":"Đừng nhầm lẫn giữa 「可以」 (cho phép/có thể) và 「会」 (biết làm do học tập) hoặc 「能」 (năng lực thể chất/điều kiện khách quan).","examples":[{"hanzi":"我可以吃吗？","pinyin":"wǒ kě yǐ chī ma","meaning":"Tôi có thể ăn không?"},{"hanzi":"你可以看这本书。","pinyin":"nǐ kě yǐ kàn zhè běn shū","meaning":"Bạn có thể xem quyển sách này."}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 可以” là gì?","options":["Chủ ngữ + 可以 + Động từ + (Tân ngữ)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Chủ ngữ + 可以 + Động từ + (Tân ngữ)","explanation":"「可以」 là động từ năng nguyện dùng để biểu thị sự cho phép hoặc khả năng thực hiện hành động nào đó. Nó thường đứng ngay trước động từ chính trong câu để bổ trợ ý nghĩa."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 可以”?","options":["我可以吃吗？","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"我可以吃吗？","explanation":"我可以吃吗？ — Tôi có thể ăn không?"},{"question":"“我可以吃吗？” có nghĩa tiếng Việt nào?","options":["Tôi có thể ăn không?","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Tôi có thể ăn không?","explanation":"wǒ kě yǐ chī ma — Tôi có thể ăn không?"},{"question":"Cấu trúc “Chủ ngữ + 可以 + Động từ + (Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 可以","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Động từ năng nguyện 可以","explanation":"「可以」 là động từ năng nguyện dùng để biểu thị sự cho phép hoặc khả năng thực hiện hành động nào đó. Nó thường đứng ngay trước động từ chính trong câu để bổ trợ ý nghĩa."},{"question":"Câu “我可以吃吗？” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 可以","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Động từ năng nguyện 可以","explanation":"Đừng nhầm lẫn giữa 「可以」 (cho phép/có thể) và 「会」 (biết làm do học tập) hoặc 「能」 (năng lực thể chất/điều kiện khách quan)."}]},{"name":"Động từ + 一下 (hành động ngắn)","formula":"Động từ + 一下 (yíxià)","explanation":"Cấu trúc này dùng để diễn tả hành động diễn ra trong thời gian rất ngắn hoặc mang tính chất thử nghiệm, trải nghiệm. Việc thêm 「一下」 giúp câu nói trở nên nhẹ nhàng, lịch sự và tự nhiên hơn khi đưa ra yêu cầu hoặc đề nghị.","tip":"Bạn có thể dùng cấu trúc này để giảm bớt sự cứng nhắc của câu mệnh lệnh, ví dụ: 「看一下」(xem một chút) thay vì chỉ dùng 「看」(xem).","note":"Không được dùng 「一下」 sau các động từ chỉ trạng thái tâm lý hoặc cảm xúc như 「爱」(yêu), 「喜欢」(thích) hay 「知道」(biết).","examples":[{"hanzi":"看一下","pinyin":"kàn yī xià","meaning":"Xem một chút"},{"hanzi":"你可以打电话问一下。","pinyin":"nǐ kě yǐ dǎ diàn huà wèn yī xià","meaning":"Bạn có thể gọi điện hỏi một chút."}],"quiz":[{"question":"Công thức đúng của “Động từ + 一下 (hành động ngắn)” là gì?","options":["Động từ + 一下 (yíxià)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Động từ + 一下 (yíxià)","explanation":"Cấu trúc này dùng để diễn tả hành động diễn ra trong thời gian rất ngắn hoặc mang tính chất thử nghiệm, trải nghiệm. Việc thêm 「一下」 giúp câu nói trở nên nhẹ nhàng, lịch sự và tự nhiên hơn khi đưa ra yêu cầu hoặc đề nghị."},{"question":"Ví dụ nào minh họa “Động từ + 一下 (hành động ngắn)”?","options":["看一下","我是学生。","他是中国人。","我的中文老师"],"answer":"看一下","explanation":"看一下 — Xem một chút"},{"question":"“看一下” có nghĩa tiếng Việt nào?","options":["Xem một chút","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Xem một chút","explanation":"kàn yī xià — Xem một chút"},{"question":"Cấu trúc “Động từ + 一下 (yíxià)” thuộc điểm ngữ pháp nào?","options":["Động từ + 一下 (hành động ngắn)","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Động từ + 一下 (hành động ngắn)","explanation":"Cấu trúc này dùng để diễn tả hành động diễn ra trong thời gian rất ngắn hoặc mang tính chất thử nghiệm, trải nghiệm. Việc thêm 「一下」 giúp câu nói trở nên nhẹ nhàng, lịch sự và tự nhiên hơn khi đưa ra yêu cầu hoặc đề nghị."},{"question":"Câu “看一下” minh họa điểm ngữ pháp nào?","options":["Động từ + 一下 (hành động ngắn)","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Động từ + 一下 (hành động ngắn)","explanation":"Không được dùng 「一下」 sau các động từ chỉ trạng thái tâm lý hoặc cảm xúc như 「爱」(yêu), 「喜欢」(thích) hay 「知道」(biết)."}]},{"name":"Câu có hai tân ngữ","formula":"Chủ ngữ + Động từ + Tân ngữ gián tiếp (người) + Tân ngữ trực tiếp (vật)","explanation":"Một số động từ đặc biệt như 「给」 (đưa cho) hay 「问」 (hỏi) có thể mang cùng lúc hai tân ngữ. Trong đó, tân ngữ chỉ người thường đứng trước, tân ngữ chỉ vật đứng sau.","tip":"Hãy nhớ quy tắc: người đứng trước, vật đứng sau để không bị nhầm trật tự câu.","note":"Không phải động từ nào cũng dùng được cấu trúc này, chỉ những động từ biểu thị sự trao đổi hoặc cung cấp thông tin mới áp dụng được.","examples":[{"hanzi":"给我一杯水。","pinyin":"gěi wǒ yī bēi shuǐ","meaning":"Cho tôi một ly nước."},{"hanzi":"白家月给安妮一个苹果。","pinyin":"bái jiā yuè gěi ān nī yī gè píng guǒ","meaning":"Bạch Gia Nguyệt cho Annie một quả táo."}],"quiz":[{"question":"Công thức đúng của “Câu có hai tân ngữ” là gì?","options":["Chủ ngữ + Động từ + Tân ngữ gián tiếp (người) + Tân ngữ trực tiếp (vật)","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + Động từ + Tân ngữ gián tiếp (người) + Tân ngữ trực tiếp (vật)","explanation":"Một số động từ đặc biệt như 「给」 (đưa cho) hay 「问」 (hỏi) có thể mang cùng lúc hai tân ngữ. Trong đó, tân ngữ chỉ người thường đứng trước, tân ngữ chỉ vật đứng sau."},{"question":"Ví dụ nào minh họa “Câu có hai tân ngữ”?","options":["给我一杯水。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"给我一杯水。","explanation":"给我一杯水。 — Cho tôi một ly nước."},{"question":"“给我一杯水。” có nghĩa tiếng Việt nào?","options":["Cho tôi một ly nước.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Cho tôi một ly nước.","explanation":"gěi wǒ yī bēi shuǐ — Cho tôi một ly nước."},{"question":"Cấu trúc “Chủ ngữ + Động từ + Tân ngữ gián tiếp (người) + Tân ngữ trực tiếp (vật)” thuộc điểm ngữ pháp nào?","options":["Câu có hai tân ngữ","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Câu có hai tân ngữ","explanation":"Một số động từ đặc biệt như 「给」 (đưa cho) hay 「问」 (hỏi) có thể mang cùng lúc hai tân ngữ. Trong đó, tân ngữ chỉ người thường đứng trước, tân ngữ chỉ vật đứng sau."},{"question":"Câu “给我一杯水。” minh họa điểm ngữ pháp nào?","options":["Câu có hai tân ngữ","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Câu có hai tân ngữ","explanation":"Không phải động từ nào cũng dùng được cấu trúc này, chỉ những động từ biểu thị sự trao đổi hoặc cung cấp thông tin mới áp dụng được."}]}],"14":[{"name":"Trợ từ động thái 「了」 biểu thị hoàn thành","formula":"Động từ + 了 + (tân ngữ)","explanation":"Trợ từ động thái 「了」 được đặt ngay sau động từ để nhấn mạnh rằng hành động đó đã hoàn thành hoặc đã xảy ra. Khi dùng cấu trúc này, câu thường mang ý nghĩa khẳng định về việc một việc gì đó đã được thực hiện xong.","tip":"Khi động từ có tân ngữ kèm số lượng cụ thể (读了一本书), thường dùng 「了」 để nói hành động đã hoàn tất. Không dùng 「了」 cho thói quen lặp lại hoặc việc chưa xảy ra (我每天看一本书).","note":"Khi muốn nói phủ định, bạn không được dùng 「了」 mà phải bỏ nó đi và thay bằng 「没 (有)」 trước động từ.","examples":[{"hanzi":"我昨天读了一本书。","pinyin":"wǒ zuó tiān dú le yī běn shū","meaning":"Hôm qua tôi đã đọc một quyển sách."},{"hanzi":"我看了一个电影。","pinyin":"wǒ kàn le yī gè diàn yǐng","meaning":"Tôi đã xem một bộ phim."}],"quiz":[{"question":"Công thức đúng của “Trợ từ động thái 「了」 biểu thị hoàn thành” là gì?","options":["Động từ + 了 + (tân ngữ)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Động từ + 了 + (tân ngữ)","explanation":"Trợ từ động thái 「了」 được đặt ngay sau động từ để nhấn mạnh rằng hành động đó đã hoàn thành hoặc đã xảy ra. Khi dùng cấu trúc này, câu thường mang ý nghĩa khẳng định về việc một việc gì đó đã được thực hiện xong."},{"question":"Ví dụ nào minh họa “Trợ từ động thái 「了」 biểu thị hoàn thành”?","options":["我昨天读了一本书。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"我昨天读了一本书。","explanation":"我昨天读了一本书。 — Hôm qua tôi đã đọc một quyển sách."},{"question":"“我昨天读了一本书。” có nghĩa tiếng Việt nào?","options":["Hôm qua tôi đã đọc một quyển sách.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Hôm qua tôi đã đọc một quyển sách.","explanation":"wǒ zuó tiān dú le yī běn shū — Hôm qua tôi đã đọc một quyển sách."},{"question":"Cấu trúc “Động từ + 了 + (tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Trợ từ động thái 「了」 biểu thị hoàn thành","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Trợ từ động thái 「了」 biểu thị hoàn thành","explanation":"Trợ từ động thái 「了」 được đặt ngay sau động từ để nhấn mạnh rằng hành động đó đã hoàn thành hoặc đã xảy ra. Khi dùng cấu trúc này, câu thường mang ý nghĩa khẳng định về việc một việc gì đó đã được thực hiện xong."},{"question":"Câu “我昨天读了一本书。” minh họa điểm ngữ pháp nào?","options":["Trợ từ động thái 「了」 biểu thị hoàn thành","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Trợ từ động thái 「了」 biểu thị hoàn thành","explanation":"Khi muốn nói phủ định, bạn không được dùng 「了」 mà phải bỏ nó đi và thay bằng 「没 (有)」 trước động từ."}]},{"name":"Động từ ly hợp (Separable Verbs)","formula":"Động từ (A) + Thành phần chèn vào + Tân ngữ (B)","explanation":"Trong tiếng Trung, một số động từ có cấu trúc 「Động từ + Tân ngữ」. Khi muốn thêm các thành phần như bổ ngữ thời lượng, số lượng hoặc trạng từ, ta có thể tách hai phần này ra để chèn vào giữa.","tip":"Ví dụ: với 「睡觉」, bạn có thể nói 「睡了一个小时觉」 (ngủ một tiếng đồng hồ).","note":"Không được đặt bổ ngữ hoặc tân ngữ trực tiếp sau toàn bộ cụm từ ly hợp mà phải tách chúng ra.","examples":[{"hanzi":"我睡了一个小时觉。","pinyin":"wǒ shuì le yī gè xiǎo shí jiào","meaning":"Tôi đã ngủ một tiếng đồng hồ."},{"hanzi":"我们见过一次面。","pinyin":"wǒ men jiàn guò yī cì miàn","meaning":"Chúng tôi đã gặp nhau một lần."}],"quiz":[{"question":"Công thức đúng của “Động từ ly hợp (Separable Verbs)” là gì?","options":["Động từ (A) + Thành phần chèn vào + Tân ngữ (B)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Động từ (A) + Thành phần chèn vào + Tân ngữ (B)","explanation":"Trong tiếng Trung, một số động từ có cấu trúc 「Động từ + Tân ngữ」. Khi muốn thêm các thành phần như bổ ngữ thời lượng, số lượng hoặc trạng từ, ta có thể tách hai phần này ra để chèn vào giữa."},{"question":"Ví dụ nào minh họa “Động từ ly hợp (Separable Verbs)”?","options":["我睡了一个小时觉。","我是学生。","他是中国人。","我的中文老师"],"answer":"我睡了一个小时觉。","explanation":"我睡了一个小时觉。 — Tôi đã ngủ một tiếng đồng hồ."},{"question":"“我睡了一个小时觉。” có nghĩa tiếng Việt nào?","options":["Tôi đã ngủ một tiếng đồng hồ.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi đã ngủ một tiếng đồng hồ.","explanation":"wǒ shuì le yī gè xiǎo shí jiào — Tôi đã ngủ một tiếng đồng hồ."},{"question":"Cấu trúc “Động từ (A) + Thành phần chèn vào + Tân ngữ (B)” thuộc điểm ngữ pháp nào?","options":["Động từ ly hợp (Separable Verbs)","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Động từ ly hợp (Separable Verbs)","explanation":"Trong tiếng Trung, một số động từ có cấu trúc 「Động từ + Tân ngữ」. Khi muốn thêm các thành phần như bổ ngữ thời lượng, số lượng hoặc trạng từ, ta có thể tách hai phần này ra để chèn vào giữa."},{"question":"Câu “我睡了一个小时觉。” minh họa điểm ngữ pháp nào?","options":["Động từ ly hợp (Separable Verbs)","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Động từ ly hợp (Separable Verbs)","explanation":"Không được đặt bổ ngữ hoặc tân ngữ trực tiếp sau toàn bộ cụm từ ly hợp mà phải tách chúng ra."}]},{"name":"Phó từ chỉ phạm vi 都 (đều)","formula":"Chủ ngữ + 都 + Động từ/Tính từ","explanation":"Phó từ 「都」 dùng để nhấn mạnh tất cả các đối tượng trong một phạm vi đều có chung đặc điểm hoặc hành động. Bạn cần đặt 「都」 ngay trước động từ hoặc tính từ trong câu.","tip":"Cấu trúc 「每 + lượng từ + 都」 rất phổ biến để nhấn mạnh tính trọn vẹn, ví dụ 「每天都」 (ngày nào cũng).","note":"Khi phủ định, hãy đặt 「不」 trước 「都」 (không phải cái nào cũng...) hoặc sau 「都」 (cái nào cũng không...).","examples":[{"hanzi":"我们都来了。","pinyin":"wǒ men dōu lái le","meaning":"Chúng tôi đều đến rồi."},{"hanzi":"我和姐姐都喜欢喝茶。","pinyin":"wǒ hé jiě jie dōu xǐ huan hē chá","meaning":"Tôi và chị gái đều thích uống trà."}],"quiz":[{"question":"Công thức đúng của “Phó từ chỉ phạm vi 都 (đều)” là gì?","options":["Chủ ngữ + 都 + Động từ/Tính từ","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 都 + Động từ/Tính từ","explanation":"Phó từ 「都」 dùng để nhấn mạnh tất cả các đối tượng trong một phạm vi đều có chung đặc điểm hoặc hành động. Bạn cần đặt 「都」 ngay trước động từ hoặc tính từ trong câu."},{"question":"Ví dụ nào minh họa “Phó từ chỉ phạm vi 都 (đều)”?","options":["我们都来了。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我们都来了。","explanation":"我们都来了。 — Chúng tôi đều đến rồi."},{"question":"“我们都来了。” có nghĩa tiếng Việt nào?","options":["Chúng tôi đều đến rồi.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Chúng tôi đều đến rồi.","explanation":"wǒ men dōu lái le — Chúng tôi đều đến rồi."},{"question":"Cấu trúc “Chủ ngữ + 都 + Động từ/Tính từ” thuộc điểm ngữ pháp nào?","options":["Phó từ chỉ phạm vi 都 (đều)","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Phó từ chỉ phạm vi 都 (đều)","explanation":"Phó từ 「都」 dùng để nhấn mạnh tất cả các đối tượng trong một phạm vi đều có chung đặc điểm hoặc hành động. Bạn cần đặt 「都」 ngay trước động từ hoặc tính từ trong câu."},{"question":"Câu “我们都来了。” minh họa điểm ngữ pháp nào?","options":["Phó từ chỉ phạm vi 都 (đều)","Trợ từ ngữ khí 呢 xác nhận sự thật","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在"],"answer":"Phó từ chỉ phạm vi 都 (đều)","explanation":"Khi phủ định, hãy đặt 「不」 trước 「都」 (không phải cái nào cũng...) hoặc sau 「都」 (cái nào cũng không...)."}]}],"15":[{"name":"Câu phức song song với 还/也","formula":"S1 + V1 + O1, (S1) + 还/也 + V2 + O2","explanation":"Cấu trúc này dùng để diễn tả việc một người hoặc vật đồng thời có hai trạng thái hoặc thực hiện hai hành động cùng lúc. Từ 「还」 hoặc 「也」 đóng vai trò nhấn mạnh sự bổ sung thêm tính chất hoặc hành động mới.","tip":"Bạn có thể bỏ chủ ngữ ở vế thứ hai nếu chủ ngữ của cả hai vế giống nhau để câu văn tự nhiên hơn.","note":"Cần lưu ý 「还/也」 phải đặt trước động từ của vế câu thứ hai, không được đặt trước chủ ngữ.","examples":[{"hanzi":"我喜欢看书，也喜欢看电影。","pinyin":"wǒ xǐ huān kàn shū yě xǐ huān kàn diàn yǐng","meaning":"Tôi thích đọc sách, cũng thích xem phim."},{"hanzi":"王老师是北京人，李文也是北京人。","pinyin":"wáng lǎo shī shì běi jīng rén lǐ wén yě shì běi jīng rén","meaning":"Thầy Vương là người Bắc Kinh, Lý Văn cũng là người Bắc Kinh."},{"hanzi":"Unit 9: ví dụ “桌子上有/是一本书。” gộp 有 và 是; hai cách dùng không hoàn toàn hoán đổi trong mọi ngữ cảnh.","pinyin":"","meaning":""},{"hanzi":"Unit 12: tiêu đề ghi “了 (lè)”; cách đọc thông dụng của trợ từ ngữ khí 了 là “le”.","pinyin":"Một số ví dụ Pinyin trong nguồn chưa có phiên âm cho chữ số hoặc tách âm tiết theo từng chữ; bản này giữ nguyên để dễ đối chiếu.","meaning":""}],"quiz":[{"question":"Công thức đúng của “Câu phức song song với 还/也” là gì?","options":["S1 + V1 + O1, (S1) + 还/也 + V2 + O2","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"S1 + V1 + O1, (S1) + 还/也 + V2 + O2","explanation":"Cấu trúc này dùng để diễn tả việc một người hoặc vật đồng thời có hai trạng thái hoặc thực hiện hai hành động cùng lúc. Từ 「还」 hoặc 「也」 đóng vai trò nhấn mạnh sự bổ sung thêm tính chất hoặc hành động mới."},{"question":"Ví dụ nào minh họa “Câu phức song song với 还/也”?","options":["我喜欢看书，也喜欢看电影。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"我喜欢看书，也喜欢看电影。","explanation":"我喜欢看书，也喜欢看电影。 — Tôi thích đọc sách, cũng thích xem phim."},{"question":"“我喜欢看书，也喜欢看电影。” có nghĩa tiếng Việt nào?","options":["Tôi thích đọc sách, cũng thích xem phim.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Tôi thích đọc sách, cũng thích xem phim.","explanation":"wǒ xǐ huān kàn shū yě xǐ huān kàn diàn yǐng — Tôi thích đọc sách, cũng thích xem phim."},{"question":"Cấu trúc “S1 + V1 + O1, (S1) + 还/也 + V2 + O2” thuộc điểm ngữ pháp nào?","options":["Câu phức song song với 还/也","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu phức song song với 还/也","explanation":"Cấu trúc này dùng để diễn tả việc một người hoặc vật đồng thời có hai trạng thái hoặc thực hiện hai hành động cùng lúc. Từ 「还」 hoặc 「也」 đóng vai trò nhấn mạnh sự bổ sung thêm tính chất hoặc hành động mới."},{"question":"Câu “我喜欢看书，也喜欢看电影。” minh họa điểm ngữ pháp nào?","options":["Câu phức song song với 还/也","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu phức song song với 还/也","explanation":"Cần lưu ý 「还/也」 phải đặt trước động từ của vế câu thứ hai, không được đặt trước chủ ngữ."}]}]};
function hskGrammarItems(){return HSK_GRAMMAR_UPDATED[lesson?.id]||[]}
renderGrammar=function(){const a=hskGrammarItems();document.querySelector('#content').innerHTML=a.length?`<h2>Ngữ pháp giáo trình · ${a.length} điểm</h2><p class="muted">Nội dung cập nhật từ tài liệu HSK 1 VERSION 3.0.</p>${a.map((g,i)=>`<article class="hsk-grammar-card"><h3>${i+1}. ${esc(g.name)}</h3><p class="hsk-grammar-field"><b>Công thức:</b> ${esc(g.formula)}</p><p class="hsk-grammar-field"><b>Giải thích:</b> ${esc(g.explanation)}</p><p class="hsk-grammar-field"><b>Mẹo:</b> ${esc(g.tip)}</p><p class="hsk-grammar-field"><b>Lưu ý:</b> ${esc(g.note)}</p><h4>Ví dụ minh họa</h4>${g.examples.map(e=>`<div class="hsk-grammar-example"><div class="hanzi">${esc(e.hanzi)}</div><div>${esc(e.pinyin)}</div><div>${esc(e.meaning)}</div></div>`).join('')}<button class="primary" onclick="hskStartGrammarQuiz(${i})">Luyện 5 câu về ngữ pháp này →</button></article>`).join('')}<button class="primary" onclick="hskStartGrammarQuiz()">Luyện tổng hợp ${a.length*5} câu ngữ pháp</button>`:'<div class="panel">Unit 1 không có điểm ngữ pháp riêng trong tài liệu cập nhật.</div>'};
function hskStartGrammarQuiz(only){const gs=hskGrammarItems();const questions=gs.flatMap((g,i)=>(only===undefined||i===only)?g.quiz.map((q,j)=>({...q,grammar:g.name,id:i+'-'+j})):[]);if(!questions.length)return;window.hskGrammarState={questions,index:0,correct:0,answered:false};hskRenderGrammarQuestion()}
function hskRenderGrammarQuestion(){const st=window.hskGrammarState;if(st.index>=st.questions.length){store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:'grammar-updated',correct:st.correct,total:st.questions.length,autoGraded:true});save();document.querySelector('#app').innerHTML=`<div class="panel"><h2>Hoàn thành luyện ngữ pháp</h2><p class="stat">${st.correct}/${st.questions.length}</p><button onclick="openLesson(${lesson.id},'grammar')">← Về ngữ pháp</button></div>`;return}st.answered=false;const q=st.questions[st.index];const options=shuffle(q.options);st.options=options;document.querySelector('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'grammar')">← Trở về ngữ pháp</button><div class="panel hsk-grammar-quiz"><span class="pill">${esc(q.grammar)} · ${st.index+1}/${st.questions.length}</span><div class="progress"><div style="width:${100*st.index/st.questions.length}%"></div></div><h2 style="font-size:22px;line-height:1.6">${esc(q.question)}</h2>${options.map((v,i)=>`<button class="option" onclick="hskGradeGrammar(${i})">${esc(v)}</button>`).join('')}<div id="hskGrammarFeedback"></div></div>`}
function hskGradeGrammar(i){const st=window.hskGrammarState;if(st.answered)return;st.answered=true;const q=st.questions[st.index];const ok=st.options[i]===q.answer;if(ok)st.correct++;document.querySelectorAll('.hsk-grammar-quiz .option').forEach((b,j)=>{b.disabled=true;if(st.options[j]===q.answer)b.classList.add('correct');else if(i===j)b.classList.add('wrong')});document.querySelector('#hskGrammarFeedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác':'✗ Chưa đúng'}</strong><p><b>Đáp án:</b> ${esc(q.answer)}</p><p>${esc(q.explanation)}</p></div><button class="primary" onclick="hskGrammarState.index++;hskRenderGrammarQuestion()">${st.index+1===st.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`}
// Keep original lesson game menu, add an explicit grammar challenge tile.
const hskOldGames=renderGames;renderGames=function(){hskOldGames();const gs=hskGrammarItems();if(!gs.length)return;const section=document.createElement('section');section.innerHTML=`<h3 class="game-group-title">Trắc nghiệm ngữ pháp cập nhật</h3><button class="game-card" onclick="hskStartGrammarQuiz()"><span class="game-icon">📖</span><span><h3>${gs.length*5} câu trắc nghiệm ngữ pháp</h3><p>Mỗi điểm ngữ pháp có 5 câu, chia đều theo tài liệu mới</p></span></button>`;document.querySelector('#content').appendChild(section)};
function hskLookupDictionary(){const map=new Map();for(const l of L.filter(x=>x.id<=lesson.id))for(const w of l.words||[])if(w.hanzi&&w.pinyin&&!map.has(w.hanzi))map.set(w.hanzi,{hanzi:w.hanzi,pinyin:w.pinyin,meaning:w.meaning});for(const g of hskGrammarItems())for(const e of g.examples||[])if(e.hanzi&&e.pinyin){/* examples are full sentences; do not mislabel as single words */}return [...map.values()].sort((a,b)=>b.hanzi.length-a.hanzi.length)}
function hskClickableText(text){const words=hskLookupDictionary();let out='',i=0;while(i<text.length){let w=words.find(x=>text.startsWith(x.hanzi,i));if(w){const id=window.hskWordIndex.length;window.hskWordIndex.push(w);out+=`<span role="button" tabindex="0" class="hsk-clickword" data-word="${id}" onclick="event.stopPropagation();hskShowWord(${id})" onkeydown="if(event.key==='Enter'){event.stopPropagation();hskShowWord(${id})}">${esc(w.hanzi)}</span>`;i+=w.hanzi.length}else{const ch=text[i];if(/[\u3400-\u9fff]/.test(ch)){const id=window.hskWordIndex.length;window.hskWordIndex.push({hanzi:ch,pinyin:'Chưa có trong từ điển đã học',meaning:'Chưa có nghĩa được xác minh'});out+=`<span role="button" tabindex="0" class="hsk-clickword" onclick="event.stopPropagation();hskShowWord(${id})" onkeydown="if(event.key==='Enter'){event.stopPropagation();hskShowWord(${id})}">${esc(ch)}</span>`}else out+=esc(ch);i++}}return out}

@media(max-width:420px){#app .dash-unit-grid{grid-template-columns:1fr}}

<script id="hsk-review-stats-redesign-js">
(function(){
 const banner=(tag,title,subtitle)=>`<div class="dash-banner"><div><p class="dash-eyebrow">HSK 1 · VERSION 3.0 · ${tag}</p><h1>${title}</h1><p>${subtitle}</p></div><div class="dash-illustration" aria-hidden="true"><svg width="116" height="110" viewBox="0 0 116 110" fill="none"><rect x="18" y="15" width="73" height="80" rx="11" fill="#fff" stroke="#d7a49e" stroke-width="2"/><path d="M54 15v80" stroke="#e9c9c4" stroke-width="2"/><path d="M29 39h15M29 48h15M64 39h15M64 48h15" stroke="#e5a49c" stroke-width="3" stroke-linecap="round"/><path d="M76 77l22-35 9 7-23 35-11 6z" fill="#e5a059" stroke="#c8794b" stroke-width="1.5"/><path d="M73 90l3-13 8 7z" fill="#f6d9b8"/><circle cx="101" cy="20" r="8" fill="#f5d7d3"/><path d="M98 20h6m-3-3v6" stroke="#bd554a" stroke-width="1.5"/></svg></div></div>`;
 window.showReview=function(){
  const app=document.getElementById('app');if(!app)return;
  app.innerHTML=`<div class="dash-shell">${banner('ÔN TẬP','Ôn tập tổng hợp','Chọn các Unit đã học và luyện lại từ vựng bằng chế độ bạn yêu thích.')}
  <section class="dash-section"><div class="dash-section-title"><h2>Chọn bài học</h2><span id="dash-selection-count" style="color:#b64a40;font-weight:700;font-size:13px">15/15 bài</span></div>
  <p class="dash-hint">Bạn có thể chọn một hoặc nhiều bài để tạo bộ câu hỏi ôn tập chung.</p>
  <div class="dash-tools"><button type="button" class="dash-quiet" onclick="dashSelectUnits(true)">Chọn tất cả</button><button type="button" class="dash-quiet" onclick="dashSelectUnits(false)">Bỏ chọn</button></div>
  <div class="dash-unit-grid">${L.map(x=>`<label class="dash-unit"><input type="checkbox" class="lessoncheck" value="${x.id}" checked onchange="dashUpdateCount()"><span><strong>Bài ${x.id}</strong> · ${esc(x.title)}</span></label>`).join('')}</div></section>
  <section class="dash-section"><div class="dash-section-title"><h2>Thiết lập lượt ôn tập</h2></div><p class="dash-hint">Chọn dạng câu hỏi rồi bắt đầu. Tiến độ sẽ tiếp tục được lưu trên thiết bị này.</p><div class="dash-form-row"><div><label class="dash-field-label" for="reviewMode">Chế độ luyện tập</label><select class="dash-select" id="reviewMode">${MODES.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('')}</select></div><button class="dash-action" type="button" onclick="startReview()">Bắt đầu ôn tập →</button></div></section></div>`;
  window.dashUpdateCount();
 };
 window.dashSelectUnits=function(value){document.querySelectorAll('.lessoncheck').forEach(el=>el.checked=value);window.dashUpdateCount()};
 window.dashUpdateCount=function(){const all=document.querySelectorAll('.lessoncheck'),n=document.querySelectorAll('.lessoncheck:checked').length,el=document.getElementById('dash-selection-count');if(el)el.textContent=n+'/'+all.length+' bài'};
 window.showStats=function(){
  const app=document.getElementById('app');if(!app)return;
  const hist=Array.isArray(store.history)?store.history:[],correct=hist.reduce((n,h)=>n+(Number(h.correct)||0),0),total=hist.reduce((n,h)=>n+(Number(h.total)||0),0),pct=total?Math.round(correct/total*100):0;
  const rows=hist.slice(0,25).map(h=>{const date=h.date?new Date(h.date):null;const when=date&&!isNaN(date)?date.toLocaleString('vi-VN'):'Không rõ thời gian';return `<div class="dash-history-row"><div><strong>${h.lesson==null?'Ôn tập':'Bài '+esc(String(h.lesson))} · ${esc(String(h.mode||'Luyện tập'))}</strong><small>${when}</small></div><span class="dash-score">${Number(h.correct)||0}/${Number(h.total)||0}</span></div>`}).join('');
  app.innerHTML=`<div class="dash-shell">${banner('TIẾN ĐỘ','Tiến độ học tập','Theo dõi hành trình học, xem kết quả luyện tập và quản lý dữ liệu của bạn.')}
  <div class="dash-stats-grid"><div class="dash-stat"><span class="dash-stat-number">${known()}</span><span class="dash-stat-label">Từ đã đánh dấu thuộc</span></div><div class="dash-stat"><span class="dash-stat-number">${hist.length}</span><span class="dash-stat-label">Lượt luyện tập đã lưu</span></div><div class="dash-stat"><span class="dash-stat-number">${pct}%</span><span class="dash-stat-label">Tỉ lệ đúng · ${correct}/${total} câu</span></div></div>
  <section class="dash-section"><div class="dash-section-title"><h2>Lịch sử luyện tập gần đây</h2><span style="font-size:13px;color:#7b8493">${Math.min(hist.length,25)} lượt gần nhất</span></div><div class="dash-history">${rows||'<div class="dash-empty">Bạn chưa có lượt luyện tập nào. Hãy bắt đầu học để xem kết quả tại đây.</div>'}</div></section>
  <section class="dash-section"><div class="dash-section-title"><h2>Quản lý tiến độ</h2></div><p class="dash-hint">Xuất bản sao lưu để lưu lại kết quả, hoặc nhập dữ liệu đã lưu trước đó.</p><div class="dash-tools"><button type="button" class="dash-action" onclick="exportProgress()">Xuất tiến độ JSON</button><label class="dash-quiet dash-import">Nhập tiến độ JSON<input type="file" accept="application/json,.json" aria-label="Nhập tiến độ JSON" onchange="importProgress(this.files[0])"></label><button type="button" class="dash-quiet dash-danger" onclick="if(confirm('Xóa toàn bộ tiến độ trên thiết bị này?')){localStorage.removeItem(KEY);location.reload()}">Đặt lại tiến độ</button></div></section></div>`;
 };
})();
</script><link rel="stylesheet" href="./flashcard-compact.css"><script src="./hsk-navigation.js"></script></body></html>
