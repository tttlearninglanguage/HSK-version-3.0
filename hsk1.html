": "Běijīng", "meaning": "Bắc Kinh", "example": "我明天去北京。", "translation": "Ngày mai tôi đến Bắc Kinh."}, {"id": "15-02", "hanzi": "飞机", "pinyin": "fēijī", "meaning": "máy bay", "example": "我坐飞机去北京。", "translation": "Tôi đi máy bay đến Bắc Kinh."}, {"id": "15-03", "hanzi": "好玩儿", "pinyin": "hǎowánr", "meaning": "vui, thú vị", "example": "北京很好玩儿。", "translation": "Bắc Kinh rất thú vị."}, {"id": "15-04", "hanzi": "家人", "pinyin": "jiārén", "meaning": "người thân", "example": "我的家人都在中国。", "translation": "Gia đình tôi đều ở Trung Quốc."}, {"id": "15-05", "hanzi": "接", "pinyin": "jiē", "meaning": "đón", "example": "爸爸去机场接我。", "translation": "Bố đến sân bay đón tôi."}, {"id": "15-06", "hanzi": "机场", "pinyin": "jīchǎng", "meaning": "sân bay", "example": "我们在机场见。", "translation": "Chúng ta gặp nhau ở sân bay."}, {"id": "15-07", "hanzi": "几", "pinyin": "jǐ", "meaning": "mấy", "example": "你有几个朋友？", "translation": "Bạn có mấy người bạn?"}, {"id": "15-08", "hanzi": "年", "pinyin": "nián", "meaning": "năm", "example": "我学了一年汉语。", "translation": "Tôi học tiếng Trung được một năm."}, {"id": "15-09", "hanzi": "那", "pinyin": "nà", "meaning": "kia", "example": "那是我的书。", "translation": "Kia là sách của tôi."}, {"id": "15-10", "hanzi": "男朋友", "pinyin": "nánpéngyou", "meaning": "bạn trai", "example": "她的男朋友在北京工作。", "translation": "Bạn trai cô ấy làm việc ở Bắc Kinh."}, {"id": "15-11", "hanzi": "哪个", "pinyin": "nǎge", "meaning": "cái nào", "example": "你喜欢哪个？", "translation": "Bạn thích cái nào?"}, {"id": "15-12", "hanzi": "去年", "pinyin": "qùnián", "meaning": "năm ngoái", "example": "我去年去了西安。", "translation": "Năm ngoái tôi đến Tây An."}, {"id": "15-13", "hanzi": "时间", "pinyin": "shíjiān", "meaning": "thời gian", "example": "你有时间吗？", "translation": "Bạn có thời gian không?"}, {"id": "15-14", "hanzi": "小时", "pinyin": "xiǎoshí", "meaning": "tiếng (thời lượng)", "example": "我每天学习两个小时。", "translation": "Tôi học hai tiếng mỗi ngày."}, {"id": "15-15", "hanzi": "西安", "pinyin": "Xī’ān", "meaning": "Tây An", "example": "西安是一个很有意思的城市。", "translation": "Tây An là một thành phố thú vị."}, {"id": "15-16", "hanzi": "要", "pinyin": "yào", "meaning": "muốn, sẽ", "example": "我要去学校。", "translation": "Tôi muốn đến trường."}, {"id": "15-17", "hanzi": "住", "pinyin": "zhù", "meaning": "cư trú", "example": "我住在北京。", "translation": "Tôi sống ở Bắc Kinh."}, {"id": "15-18", "hanzi": "早", "pinyin": "zǎo", "meaning": "sớm", "example": "我今天起床很早。", "translation": "Hôm nay tôi dậy rất sớm."}, {"id": "15-19", "hanzi": "爱", "pinyin": "ài", "meaning": "yêu", "example": "我爱我的家人。", "translation": "Tôi yêu gia đình tôi."}], "grammar": [{"name": "Câu ghép đẳng lập ……还/也……", "details": ["Công thức: Mệnh đề 1，(chủ ngữ 2) + 还/也 + vị ngữ 2.", "Ví dụ: 我学汉语，我妹妹也学汉语。", "Nghĩa: Tôi học tiếng Trung, em gái tôi cũng học tiếng Trung."]}], "extended": [{"name": "Hẹn gặp tại địa điểm", "details": ["我们在机场见。", "→ Chúng ta gặp nhau ở sân bay."]}]}];
</script><script>
const L=window.HSK_LESSONS;let lesson=L[0],tab='words',flashIndex=0,flipped=false,session=null,filter='',hidePin=false,hideVi=false,onlyUnknown=false;
const KEY='hsk1-quest-v1';let store;try{store=JSON.parse(localStorage.getItem(KEY))||{known:{},history:[],wrong:{},recent:1}}catch{store={known:{},history:[],wrong:{},recent:1}};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(store));const all=()=>L.flatMap(x=>x.words);const known=()=>Object.values(store.known).filter(Boolean).length;const wordKey=w=>w.id;
function speak(t,rate=0.85){if(!('speechSynthesis'in window)){alert('Trình duyệt không hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=rate;speechSynthesis.speak(u)}
function home(){session=null;$('#app').innerHTML=`<section class="hero"><span class="pill">NEW HSK 1 · 15 BÀI</span><h1>HSK 1 VERSION 3.0</h1><p>338 lượt từ vựng · Flashcard · Luyện tập · Theo dõi tiến độ</p><div class="row"><button class="primary" onclick="openLesson(${store.recent||1})">▶ Tiếp tục bài ${store.recent||1}</button><button onclick="showReview()">Ôn tập tổng hợp</button></div></section><div class="grid"><div class="panel"><div class="stat">${known()}</div>Từ đã đánh dấu thuộc</div><div class="panel"><div class="stat">${store.history.length}</div>Lượt luyện tập</div><div class="panel"><div class="stat">${store.history.reduce((a,b)=>a+b.correct,0)}</div>Câu trả lời đúng</div></div><h2>15 bài học</h2><div class="grid">${L.map(x=>`<div class="card" onclick="openLesson(${x.id})"><span class="pill">Bài ${String(x.id).padStart(2,'0')}</span><h3 class="hanzi">${esc(x.title)}</h3><p>${esc(x.subtitle)}</p><small class="muted">${x.words.length} từ · ${x.grammar.length} mục ngữ pháp</small><div class="progress" style="margin-top:12px"><div style="width:${100*x.words.filter(w=>store.known[wordKey(w)]).length/x.words.length}%"></div></div></div>`).join('')}</div>`}
function openLesson(id,t='words'){lesson=L.find(x=>x.id===id);tab=t;store.recent=id;save();renderLesson()}
function renderLesson(){session=null;$('#app').innerHTML=`<button onclick="home()">← Trang chủ</button><h2>Bài ${lesson.id}: <span class="hanzi">${esc(lesson.title)}</span></h2><p class="muted">${esc(lesson.subtitle)} · ${lesson.words.length} từ vựng</p><div class="tabs">${[['words','Từ vựng'],['grammar','Ngữ pháp'],['flash','Flashcard'],['games','Trò chơi']].map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';renderLesson()">${n}</button>`).join('')}</div><section id="content"></section>`;if(tab==='words')renderWords();if(tab==='grammar')renderGrammar();if(tab==='flash')renderFlash();if(tab==='games')renderGames()}
function renderWords(){let words=lesson.words.filter(w=>(!onlyUnknown||!store.known[wordKey(w)])&&[w.hanzi,w.pinyin,w.meaning].join(' ').toLowerCase().includes(filter.toLowerCase()));$('#content').innerHTML=`<div class="toolbar"><input type="search" placeholder="Tìm Hán tự, Pinyin, nghĩa..." value="${esc(filter)}" oninput="filter=this.value;renderWords()"><button onclick="hidePin=!hidePin;renderWords()">${hidePin?'Hiện':'Ẩn'} Pinyin</button><button onclick="hideVi=!hideVi;renderWords()">${hideVi?'Hiện':'Ẩn'} nghĩa</button><button onclick="onlyUnknown=!onlyUnknown;renderWords()" class="${onlyUnknown?'active':''}">Chưa thuộc</button></div><div class="tablewrap panel"><table><thead><tr><th>STT</th><th>Hán tự</th><th>Pinyin</th><th>Nghĩa</th><th>Ví dụ và dịch</th><th>Học</th></tr></thead><tbody>${words.map((w,i)=>`<tr><td>${i+1}</td><td><div class="hanzi">${esc(w.hanzi)}</div><button onclick="speak('${w.hanzi.replace(/'/g,'')}')">🔊</button></td><td>${hidePin?'•••':esc(w.pinyin)}</td><td>${hideVi?'•••':esc(w.meaning)}</td><td><div class="hanzi" style="font-size:23px">${esc(w.example)}</div><div class="muted">${hideVi?'•••':esc(w.translation)}</div><button onclick="speak(${JSON.stringify(w.example).replace(/"/g,'&quot;')})">🔊 Nghe câu</button></td><td><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Thuộc':'○ Chưa'}</button></td></tr>`).join('')}</tbody></table></div>`}
function toggleKnown(id){store.known[id]=!store.known[id];save();if(tab==='flash')renderFlash();else renderWords()}
function renderGrammar(){const make=(a,heading)=>`<h3>${heading}</h3>${a.map(g=>`<article class="panel grammar"><h3>${esc(g.name)}</h3><p>${g.details.map(esc).join('\n')}</p></article>`).join('')}`;$('#content').innerHTML=make(lesson.grammar,'Ngữ pháp giáo trình')+make(lesson.extended,'Chú thích mở rộng')+'<p class="muted">Các công thức và ví dụ được trích theo tài liệu. Chưa bổ sung 3–5 ví dụ mới cho từng điểm ngữ pháp.</p>'}
function flashList(){return lesson.words.filter(w=>!onlyUnknown||!store.known[w.id])}function renderFlash(){let a=flashList();if(flashIndex>=a.length)flashIndex=0;let w=a[flashIndex];$('#content').innerHTML=`<div class="toolbar"><button onclick="onlyUnknown=!onlyUnknown;flashIndex=0;flipped=false;renderFlash()" class="${onlyUnknown?'active':''}">Chỉ từ chưa thuộc</button><button onclick="lesson.words.sort(()=>Math.random()-.5);flashIndex=0;renderFlash()">🔀 Trộn thẻ</button></div>${!w?'<div class="panel">Bạn đã đánh dấu thuộc tất cả từ trong bài.</div>':`<div class="panel flash" onclick="flipped=!flipped;renderFlash()"><div class="muted">Thẻ ${flashIndex+1}/${a.length}</div>${flipped?`<div class="hanzi big">${esc(w.hanzi)}</div><h2>${esc(w.pinyin)}</h2><h3>${esc(w.meaning)}</h3><div class="hanzi" style="font-size:24px">${esc(w.example)}</div><p>${esc(w.translation)}</p>`:`<div class="hanzi big">${esc(w.hanzi)}</div>`}</div><div class="toolbar"><button onclick="speak(${JSON.stringify(w.hanzi).replace(/"/g,'&quot;')})">🔊 Nghe</button><button onclick="flashIndex=Math.max(0,flashIndex-1);flipped=false;renderFlash()">← Trước</button><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Đã thuộc':'○ Đánh dấu thuộc'}</button><button class="primary" onclick="flashIndex=(flashIndex+1)%flashList().length;flipped=false;renderFlash()">Tiếp →</button></div>`}`}
const MODES=[['hanzi','Hán tự → Nghĩa'],['meaning','Nghĩa → Hán tự'],['pinyin','Chọn Pinyin'],['listen','Nghe chọn Hán tự'],['type','Gõ Hán tự'],['dictation','Nghe chép chính tả']];
function renderGames(){let modes=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${n}</h3><p class="muted">Luyện với dữ liệu từ vựng của bài</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<h3>Chọn chế độ luyện tập</h3><div class="grid">${modes}</div><p class="muted">Phiên bản này triển khai 6 chế độ từ vựng. Các chế độ viết đoạn, đọc hiểu dài, sắp xếp câu và thử thách ngữ pháp chuyên sâu sẽ được bổ sung ở giai đoạn nội dung tiếp theo, không sử dụng câu hỏi giả.</p>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(mode,custom){let pool=custom||lesson.words;let questions=shuffle(pool).slice(0,Math.min(30,pool.length));session={mode,questions,pool,index:0,correct:0,answered:false};renderQuestion()}
function renderQuestion(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=s.mode;let options=shuffle([w,...shuffle(s.pool.filter(x=>x.hanzi!==w.hanzi&&x.meaning!==w.meaning)).slice(0,3)]);s.options=options;let question=m==='meaning'?w.meaning:m==='hanzi'||m==='pinyin'?w.hanzi:m==='type'?w.meaning:'🔊 Nhấn nghe';$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${MODES.find(x=>x[0]===m)?.[1]||m}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${m==='hanzi'||m==='pinyin'?'hanzi big':''}">${esc(question)}</h2>${m==='listen'||m==='dictation'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Phát âm</button>':''}<div id="options">${m==='type'||m==='dictation'?`<input id="typed" placeholder="Nhập Hán tự" autocomplete="off"><button class="primary" onclick="checkAnswer($('#typed').value)">Kiểm tra</button>`:options.map((o,i)=>`<button class="option ${m==='meaning'||m==='listen'?'chinese-option':''}" onclick="checkAnswer(${i})">${esc(m==='hanzi'?o.meaning:m==='pinyin'?o.pinyin:m==='meaning'||m==='listen'?o.hanzi:o.meaning)}</button>`).join('')}</div><div id="feedback"></div></div>`;if(m==='listen'||m==='dictation')speak(w.hanzi)}
function checkAnswer(input){let s=session;if(s.answered)return;let w=s.questions[s.index],m=s.mode;let ok=typeof input==='number'?s.options[input].id===w.id:input.replace(/[\s，。！？,.!?]/g,'')===w.hanzi.replace(/[\s，。！？,.!?]/g,'');s.answered=true;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác!':'✗ Chưa đúng'}</strong><div class="hanzi">${esc(w.hanzi)}</div><div>${esc(w.pinyin)} · ${esc(w.meaning)}</div><p>${esc(w.example)} — ${esc(w.translation)}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderQuestion()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`;[...document.querySelectorAll('.option')].forEach(b=>b.disabled=true)}
function finishGame(){let s=session;store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập 🎉</h2><div class="stat">${s.correct}/${s.questions.length}</div><p>Tỷ lệ đúng: ${Math.round(100*s.correct/s.questions.length)}%</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`}
function showReview(){let ids=L.map(x=>x.id);$('#app').innerHTML=`<h2>Ôn tập tổng hợp</h2><div class="panel"><p>Chọn các bài để luyện từ vựng.</p><div class="grid">${L.map(x=>`<label><input type="checkbox" class="lessoncheck" value="${x.id}" checked> Bài ${x.id} · ${esc(x.title)}</label>`).join('')}</div><div class="toolbar"><select id="reviewMode">${MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('')}</select><button class="primary" onclick="startReview()">Bắt đầu (tối đa 30 câu)</button></div></div>`}

</script><script>
/* Additional fully interactive practice modes. All questions are sourced from the workbook examples. */
const BASE_MODES=MODES.slice();
MODES.push(['cloze','Điền từ vào câu'],['translate','Dịch câu Việt → Trung'],['order','Sắp xếp câu'],['reading','Đọc hiểu câu ví dụ'],['speaking','Luyện nói'],['grammar','Thử thách ngữ pháp'],['mixed','Thử thách tổng hợp']);
const originalRenderGames=renderGames;
renderGames=function(){let html=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${esc(n)}</h3><p class="muted">${['reading','grammar','speaking'].includes(m)?'Luyện theo câu ví dụ và kiến thức có trong sổ tay':'Luyện tập tương tác'}</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<div class="toolbar"><label>Số câu <select id="numQuestions"><option>10</option><option>20</option><option selected>30</option><option>50</option></select></label></div><div class="grid">${html}</div><p class="muted">Các chế độ bổ sung khai thác câu ví dụ thực tế trong sổ tay. Chế độ “Đọc hiểu” hiện là đọc hiểu câu, chưa phải 5 bài đọc dài/bài. Số câu không vượt quá số câu hỏi khác nhau có thể tạo từ nguồn.</p>`};
function cleanHan(s){return (s||'').replace(/[\s，。！？,.!?、；：:;“”"']/g,'')}
function examples(pool){return pool.filter(w=>w.example&&w.translation&&cleanHan(w.example).length>=3)}
function getLimit(){return Number($('#numQuestions')?.value||30)}
const originalStartGame=startGame;
startGame=function(mode,custom){if(BASE_MODES.some(x=>x[0]===mode)) {let p=custom||lesson.words;let q=shuffle(p).slice(0,Math.min(getLimit(),p.length));session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderQuestion();return}let p=custom||lesson.words;let q=shuffle(examples(p));if(mode==='grammar'){let gram=(custom?L.filter(l=>l.words.some(w=>p.includes(w))):[lesson]).flatMap(l=>l.grammar.map((g,i)=>({id:`g${l.id}-${i}`,grammar:g,hanzi:g.name,example:(g.details.find(s=>s.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(s=>s.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),meaning:g.name}))).filter(x=>x.example);q=shuffle(gram)}
if(mode==='mixed')q=shuffle([...q.map((w,i)=>({...w,submode:['cloze','translate','order','reading'][i%4]})),...q.map(w=>({...w,submode:'speaking'}))]);
q=q.slice(0,Math.min(getLimit(),q.length));if(!q.length){alert('Không đủ nội dung hợp lệ trong tài liệu cho chế độ này.');return}session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderAdvanced()};
function renderAdvanced(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=w.submode||s.mode;let sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));let missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];let prompt='',control='';s.target=sentence;s.missing=missing;
if(m==='cloze'){prompt=sentence.replace(missing,'＿＿');control=`<input id="advInput" placeholder="Điền Hán tự" autocomplete="off">`}
if(m==='translate'){prompt=w.translation;control=`<textarea id="advInput" placeholder="Viết câu bằng tiếng Trung"></textarea>`}
if(m==='order'){prompt=w.translation;let units=sentence.match(/[\u3400-\u9fff]+|[^\u3400-\u9fff]/g)||tokens;s.tiles=shuffle(tokens.filter(c=>!/[。！？]/.test(c)));s.chosen=[];control=`<div id="selectedTiles" class="panel hanzi"></div><div id="tileBank" class="toolbar">${s.tiles.map((t,i)=>`<button id="tile${i}" class="hanzi" onclick="pickTile(${i})">${esc(t)}</button>`).join('')}</div><button onclick="session.chosen=[];renderAdvanced()">Xếp lại</button>`}
if(m==='reading'){prompt=sentence;control=`<p><strong>Câu này có nghĩa gì?</strong></p><textarea id="advInput" placeholder="Viết nghĩa tiếng Việt của câu"></textarea>`}
if(m==='speaking'){prompt=sentence;control=`<div class="toolbar"><button onclick="speak(session.questions[session.index].example)">🔊 Nghe mẫu</button><button onclick="recordSpeech()">🎤 Nói bằng micro</button></div><p id="recognized" class="muted">Nhận dạng giọng nói phụ thuộc trình duyệt; không phải điểm phát âm.</p><input id="advInput" placeholder="Có thể gõ câu bạn đã nói">`}
if(m==='grammar'){prompt=w.grammar.name;control=`<p><strong>Nhớ lại công thức và viết câu ví dụ cho cấu trúc này.</strong></p><textarea id="advInput" placeholder="Viết một câu ví dụ"></textarea>`}
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${esc(MODES.find(x=>x[0]===m)?.[1]||m)}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${['cloze','speaking','reading'].includes(m)?'hanzi':''}">${esc(prompt)}</h2>${control}<div class="toolbar"><button class="primary" onclick="gradeAdvanced()">Kiểm tra / Đối chiếu</button></div><div id="feedback"></div></div>`}
function pickTile(i){let b=$('#tile'+i);if(b.disabled)return;session.chosen.push(session.tiles[i]);b.disabled=true;$('#selectedTiles').textContent=session.chosen.join('')}
function gradeAdvanced(){let s=session;if(s.answered)return;let w=s.questions[s.index],m=w.submode||s.mode,typed=m==='order'?s.chosen.join(''):($('#advInput')?.value||'').trim();if(!typed){alert('Hãy nhập câu trả lời trước.');return}let answer=m==='cloze'?s.missing:w.example;let ok=null;if(['cloze','translate','order','speaking'].includes(m))ok=cleanHan(typed)===cleanHan(answer);if(m==='reading'||m==='grammar')ok=null;s.answered=true;if(ok===true)s.correct++;if(ok===false)store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();let explanation=m==='grammar'?w.grammar.details.join(' · '):`${w.pinyin||''} · ${w.translation||''}`;$('#feedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu với đáp án mẫu':ok?'✓ Trùng đáp án mẫu':'Chưa trùng đáp án mẫu'}</strong><p class="hanzi">${esc(answer)}</p><p>${esc(explanation)}</p><p class="muted">${m==='translate'||m==='grammar'||m==='reading'?'Các cách diễn đạt tương đương có thể đúng; website không có AI chấm ngữ pháp/ngữ nghĩa.':''}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderAdvanced()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`}
function recordSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#recognized').textContent='Trình duyệt này không hỗ trợ nhận dạng giọng nói. Hãy thử Chrome hoặc Edge và cấp quyền micro.';return}let rec=new SR();rec.lang='zh-CN';rec.onresult=e=>{$('#advInput').value=e.results[0][0].transcript;$('#recognized').textContent='Nhận dạng: '+e.results[0][0].transcript};rec.onerror=e=>{$('#recognized').textContent='Không thể nhận dạng: '+e.error+'. Hãy kiểm tra quyền micro.'};rec.start()}
const oldFinish=finishGame;finishGame=function(){let s=session;if(BASE_MODES.some(x=>x[0]===s.mode))return oldFinish();store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length,autoGraded:!['reading','grammar','mixed'].includes(s.mode)});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập</h2><div class="stat">${s.index} câu đã làm</div><p>${s.correct} câu trùng đáp án mẫu. Các câu tự đối chiếu không được tính là sai.</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`};
const oldReview=showReview;showReview=function(){oldReview();let sel=$('#reviewMode');sel.innerHTML=MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');let btn=$('#app .primary');btn.textContent='Bắt đầu ôn tập';};

</script><script>
/* Additional practice, final exam, and answer review. No AI grading claims. */
const extraModes=[['paragraph','Viết đoạn văn có hướng dẫn'],['exam','Kiểm tra cuối khóa']];
MODES.push(...extraModes);
const previousRenderGames=renderGames;
renderGames=function(){previousRenderGames();const grid=$('#content .grid');grid.insertAdjacentHTML('beforeend',`<div class="card" onclick="startWriting()"><h3>✍️ Viết đoạn văn</h3><p class="muted">Luyện viết dựa trên câu ví dụ của bài; đối chiếu thủ công</p><button class="primary">Bắt đầu</button></div><div class="card" onclick="startFinalExam()"><h3>🏆 Kiểm tra cuối khóa</h3><p class="muted">100 câu: từ vựng, ngữ pháp và kỹ năng</p><button class="primary">Bắt đầu</button></div>`)};
function startWriting(){const words=lesson.words.filter(w=>w.example&&w.translation);if(!words.length)return alert('Chưa có câu ví dụ để luyện viết.');const selected=shuffle(words).slice(0,Math.min(30,words.length));session={mode:'paragraph',questions:selected,index:0,correct:0,answered:false};renderWriting()}
function renderWriting(){const s=session;if(s.index>=s.questions.length){finishWriting();return}const w=s.questions[s.index];$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Quay lại</button><div class="panel"><span class="pill">Luyện viết ${s.index+1}/${s.questions.length}</span><h2>Viết bằng tiếng Trung</h2><p>${esc(w.translation)}</p><p class="muted">Hãy tự viết câu này và có thể mở rộng thành một đoạn ngắn liên quan. Đây là bài tự luyện, không chấm ngữ pháp tự động.</p><textarea id="writingAnswer" rows="7" placeholder="Nhập chữ Hán...">${esc(s.draft||'')}</textarea><div class="toolbar"><button onclick="s.draft=$('#writingAnswer').value;localStorage.setItem('hsk-writing-draft',JSON.stringify({lesson:lesson.id,index:s.index,text:s.draft}));alert('Đã lưu bản nháp trên trình duyệt')">Lưu nháp</button><button class="primary" onclick="showWritingAnswer()">Xem đáp án mẫu</button></div><div id="writingFeedback"></div></div>`}
function showWritingAnswer(){const s=session,w=s.questions[s.index];s.draft=$('#writingAnswer').value;$('#writingFeedback').innerHTML=`<div class="result"><h3>Đáp án tham khảo</h3><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p class="muted">Hãy tự đối chiếu từ vựng, thứ tự từ và cấu trúc. Có thể có nhiều cách viết đúng.</p></div><button onclick="s.index++;s.draft='';renderWriting()" class="primary">${s.index+1===s.questions.length?'Hoàn thành':'Câu tiếp theo →'}</button>`}
function finishWriting(){store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:'paragraph',correct:0,total:session.questions.length,autoGraded:false});save();$('#app').innerHTML=`<div class="panel"><h2>Đã hoàn thành ${session.questions.length} bài tự luyện viết</h2><p>Không có điểm tự động vì câu trả lời cần người học đối chiếu.</p><button onclick="openLesson(${lesson.id},'games')">Quay lại bài</button></div>`}
const EXAM_PLAN=[['hanzi',20],['grammar',20],['reading',20],['listen',20],['translate',10],['mixed',10]];
function startFinalExam(){let pool=L.flatMap(l=>l.words);let questions=[];for(const [mode,count] of EXAM_PLAN){let items;if(mode==='grammar')items=L.flatMap(l=>l.grammar.map((g,i)=>({id:`gram-${l.id}-${i}`,grammar:g,example:(g.details.find(x=>x.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(x=>x.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),hanzi:g.name}))).filter(w=>w.example);else items=pool.filter(w=>w.example&&w.translation&&(mode!=='mixed'||w.example.includes(w.hanzi)));items=shuffle(items).slice(0,count);questions.push(...items.map(w=>({...w,examMode:mode==='mixed'?'cloze':mode})))}if(questions.length!==100){alert(`Ngân hàng chỉ đủ ${questions.length}/100 câu độc lập. Không tạo câu giả.`);return}lesson=L[0];session={mode:'final-exam',questions:shuffle(questions),index:0,correct:0,answered:false,graded:0,pool};renderExamQuestion()}
function renderExamQuestion(){const s=session;if(s.index>=s.questions.length){finishExam();return}const w=s.questions[s.index],m=w.examMode;s.answered=false;let q='',input='';if(m==='hanzi'||m==='listen'){s.options=shuffle([w,...shuffle(s.pool.filter(x=>x.id!==w.id&&x.meaning!==w.meaning)).slice(0,3)]);q=m==='hanzi'?w.hanzi:'Nghe và chọn nghĩa đúng';input=`${m==='listen'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Nghe</button>':''}<div class="grid">${s.options.map((o,i)=>`<button class="option" onclick="answerExam(${i})">${esc(o.meaning)}</button>`).join('')}</div>`}else if(m==='grammar'){q=w.grammar.name;input=`<p>Hãy viết câu ví dụ sử dụng cấu trúc này.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='reading'){q=w.example;input=`<p>Hãy dịch câu sang tiếng Việt.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='translate'){q=w.translation;input=`<p>Hãy dịch sang tiếng Trung.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else{q=w.example.replace(w.hanzi,'＿＿');s.missing=w.hanzi;input=`<p>Điền từ còn thiếu.</p><input id="examInput" placeholder="Nhập Hán tự"><button class="primary" onclick="answerExam()">Kiểm tra</button>`}$('#app').innerHTML=`<div class="panel"><div class="row"><span class="pill">Đề cuối khóa · ${esc(m)}</span><span class="spacer"></span>${s.index+1}/100</div><div class="progress"><div style="width:${s.index}%"></div></div><h2 class="hanzi">${esc(q)}</h2>${input}<div id="examFeedback"></div></div>`;if(m==='listen')speak(w.hanzi)}
function answerExam(choice){const s=session;if(s.answered)return;const w=s.questions[s.index],m=w.examMode;let ok=null;if(m==='hanzi'||m==='listen')ok=s.options[choice]?.id===w.id;else{const val=$('#examInput').value.trim();if(!val)return alert('Hãy nhập câu trả lời trước.');if(m==='cloze')ok=cleanHan(val)===cleanHan(s.missing);else if(m==='translate')ok=cleanHan(val)===cleanHan(w.example)}s.answered=true;if(ok!==null){s.graded++;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1}save();$('#examFeedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu':ok?'✓ Đúng':'Chưa đúng theo đáp án mẫu'}</strong><p class="hanzi">${esc(w.example||w.hanzi)}</p><p>${esc(w.translation||'')}</p>${m==='grammar'?`<p>${esc(w.grammar.details.join(' · '))}</p>`:''}<p class="muted">Các câu tự luận không được chấm ngữ nghĩa tự động.</p></div><button class="primary" onclick="session.index++;renderExamQuestion()">${s.index===99?'Xem kết quả':'Tiếp tục →'}</button>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true)}

<script>

(function(){
const oldGames=renderGames;

root.querySelectorAll('.card').forEach(card=>{const action=card.getAttribute('onclick')||card.querySelector('button')?.getAttribute('onclick')||'';if(/startFinalExam|startWriting\(|startWritingPrompts/.test(action)||/kiểm tra cuối khóa|30 đề luyện viết|^✍️ Viết đoạn văn$|100 câu:/i.test(card.textContent))card.remove()});
const grid=root.querySelector('.grid');if(grid)grid.insertAdjacentHTML('beforeend',`<div class="card" onclick="startGuidedWriting()"><h3>✍️ Viết đoạn văn có hướng dẫn</h3><p class="muted">Một chủ đề mỗi bài · gợi ý từ vựng bài hiện tại và các bài trước · tự viết và lưu nháp</p><button class="primary">Bắt đầu</button></div>`);
};
const oldRenderAdvanced=renderAdvanced;
renderAdvanced=function(){let s=session,w=s?.questions?.[s.index],m=w?.submode||s?.mode;
if(m==='grammar'){renderGrammarChallenge();return}
if(m!=='cloze'){oldRenderAdvanced();return}
if(s.index>=s.questions.length){finishGame();return}
const sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));const missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];s.missing=missing;s.target=sentence;
const eligible=lesson.words.filter(x=>x.hanzi!==missing&&x.hanzi&&x.hanzi!==w.hanzi);const extras=L.filter(x=>x.id<=lesson.id).flatMap(x=>x.words).filter(x=>x.hanzi!==missing);

while(opts.length<4){const fallback=['我','你','是','有','不','在','的','了','吗','很'];const next=fallback.find(x=>!opts.includes(x));if(!next)break;opts.push(next)}s.clozeOptions=shuffle(opts);

};

if(!target)continue;

}

};
function renderGrammarChallenge(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],target=w.target;
const current=L.filter(l=>l.id<=lesson.id).flatMap(l=>l.words).map(v=>v.hanzi);
const distractors=['的','了','吗','呢','是','有','在','不','很','也','都','和','会','能','要','比','几','什么','怎么','多少','正在','没有',...current].filter((x,i,a)=>x!==target&&a.indexOf(x)===i);
s.grammarOptions=shuffle([target,...shuffle(distractors).slice(0,3)]);
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><span class="pill">Thử thách ngữ pháp · Bài ${lesson.id}</span><span class="pill">${s.index+1}/${s.questions.length}</span><div class="answer-area"><h3>${esc(w.grammar.name)}</h3><p class="muted">${esc(w.formula)}</p><p>Chọn từ thích hợp để hoàn thành câu:</p><h2 class="hanzi" style="font-size:34px">${esc(w.example.replace(target,'＿＿＿'))}</h2><div class="cloze-options">${s.grammarOptions.map((x,i)=>`<button onclick="answerGrammar(${i})">${esc(x)}</button>`).join('')}</div></div><div id="feedback"></div></div>`;
}
window.answerGrammar=function(i){let s=session;if(s.answered)return;let w=s.questions[s.index],ok=s.grammarOptions[i]===w.target;s.answered=true;if(ok)s.correct++;save();document.querySelectorAll('.cloze-options button').forEach((b,j)=>{b.disabled=true;if(s.grammarOptions[j]===w.target)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác':'✗ Chưa đúng'}</strong><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p>${esc(w.grammar.details.join(' · '))}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderGrammarChallenge()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`};
window.startGuidedWriting=function(){session={mode:'guided-writing'};renderGuidedWriting()};
window.renderGuidedWriting=function(){const current=lesson.words,prior=L.filter(l=>l.id<lesson.id).flatMap(l=>l.words);const selected=current.filter(w=>w.example).slice(0,8),priorSelected=prior.filter(w=>w.example).slice(-8);

};

 khẳng định","Trợ từ kết cấu 的","Câu hỏi nghi vấn với 吗"],"answer":"Trật tự từ cơ bản trong câu","explanation":"Trong tiếng Trung, câu đơn thường tuân theo trật tự 「Chủ ngữ」 đứng trước, tiếp theo là 「Vị ngữ」 (thường là động từ) và cuối cùng là 「Tân ngữ」. Đây là cấu trúc cơ bản nhất giúp bạn hình thành câu hoàn chỉnh trong giao tiếp hàng ngày."},{"question":"Câu “我叫陈天中。” minh họa điểm ngữ pháp nào?","options":["Trật tự từ cơ bản trong câu","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)"],"answer":"Trật tự từ cơ bản trong câu","explanation":"Không được đảo lộn vị trí của động từ và tân ngữ vì sẽ làm thay đổi ý nghĩa hoặc sai ngữ pháp."}]}],"3":[{"name":"Câu chữ 「是」 (shì) - Câu khẳng định","formula":"S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","explanation":"Từ 「是」 đóng vai trò như động từ \"là\" trong tiếng Việt, dùng để kết nối chủ ngữ với danh từ hoặc cụm danh từ. Cấu trúc này giúp xác định danh tính, nghề nghiệp, quốc tịch hoặc sự vật một cách rõ ràng.","tip":"Khi muốn phủ định, bạn chỉ cần thêm 「不」 trước 「是」 để thành 「不是」 (không phải là).","note":"Tuyệt đối không dùng 「是」 đứng trước tính từ (ví dụ: không nói 「是好」 mà chỉ nói 「很好」).","examples":[{"hanzi":"我是学生。","pinyin":"wǒ shì xué shēng","meaning":"Tôi là học sinh."},{"hanzi":"他是中国人。","pinyin":"tā shì zhōng guó rén","meaning":"Anh ấy là người Trung Quốc."}],"quiz":[{"question":"Công thức đúng của “Câu chữ 「是」 (shì) - Câu khẳng định” là gì?","options":["S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","Định ngữ + 的 + Trung tâm ngữ","Câu trần thuật + 吗?"],"answer":"S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","explanation":"Từ 「是」 đóng vai trò như động từ \"là\" trong tiếng Việt, dùng để kết nối chủ ngữ với danh từ hoặc cụm danh từ. Cấu trúc này giúp xác định danh tính, nghề nghiệp, quốc tịch hoặc sự vật một cách rõ ràng."},{"question":"Ví dụ nào minh họa “Câu chữ 「是」 (shì) - Câu khẳng định”?","options":["我是学生。","我叫陈天中。","我叫白家月。","我的中文老师"],"answer":"我是学生。","explanation":"我是学生。 — Tôi là học sinh."},{"question":"“我是学生。” có nghĩa tiếng Việt nào?","options":["Tôi là học sinh.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi là học sinh.","explanation":"wǒ shì xué shēng — Tôi là học sinh."},{"question":"Cấu trúc “S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)” thuộc điểm ngữ pháp nào?","options":["Câu chữ 「是」 (shì) - Câu khẳng định","Trật tự từ cơ bản trong câu","Trợ từ kết cấu 的","Câu hỏi nghi vấn với 吗"],"answer":"Câu chữ 「是」 (shì) - Câu khẳng định","explanation":"Từ 「是」 đóng vai trò như động từ \"là\" trong tiếng Việt, dùng để kết nối chủ ngữ với danh từ hoặc cụm danh từ. Cấu trúc này giúp xác định danh tính, nghề nghiệp, quốc tịch hoặc sự vật một cách rõ ràng."},{"question":"Câu “我是学生。” minh họa điểm ngữ pháp nào?","options":["Câu chữ 「是」 (shì) - Câu khẳng định","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)"],"answer":"Câu chữ 「是」 (shì) - Câu khẳng định","explanation":"Tuyệt đối không dùng 「是」 đứng trước tính từ (ví dụ: không nói 「是好」 mà chỉ nói 「很好」)."}]},{"name":"Trợ từ kết cấu 的","formula":"Định ngữ + 的 + Trung tâm ngữ","explanation":"Trợ từ 「的」 được dùng để kết nối định ngữ và trung tâm ngữ, biểu thị quan hệ sở hữu hoặc tính chất. Bạn đặt từ chỉ sở hữu hoặc đặc điểm lên trước, thêm 「的」 rồi mới đến danh từ chính.","tip":"Nếu định ngữ là người thân (như 'mẹ', 'anh trai') hoặc danh từ chỉ đơn vị công tác, bạn có thể lược bỏ 「的」.","note":"Đừng quên 「的」 khi định ngữ là danh từ hoặc đại từ chỉ người khác, vì nó giúp làm rõ mối quan hệ giữa hai danh từ.","examples":[{"hanzi":"我的中文老师","pinyin":"wǒ de zhōng wén lǎo shī","meaning":"Giáo viên tiếng Trung của tôi"},{"hanzi":"她的中文老师","pinyin":"tā de zhōng wén lǎo shī","meaning":"Giáo viên tiếng Trung của cô ấy"}],"quiz":[{"question":"Công thức đúng của “Trợ từ kết cấu 的” là gì?","options":["Định ngữ + 的 + Trung tâm ngữ","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị","A..., B 呢? (Cấu trúc hỏi tỉnh lược)"],"answer":"Định ngữ + 的 + Trung tâm ngữ","explanation":"Trợ từ 「的」 được dùng để kết nối định ngữ và trung tâm ngữ, biểu thị quan hệ sở hữu hoặc tính chất. Bạn đặt từ chỉ sở hữu hoặc đặc điểm lên trước, thêm 「的」 rồi mới đến danh từ chính."},{"question":"Ví dụ nào minh họa “Trợ từ kết cấu 的”?","options":["我的中文老师","我是学生。","他是中国人。","你是学生吗？"],"answer":"我的中文老师","explanation":"我的中文老师 — Giáo viên tiếng Trung của tôi"},{"question":"“我的中文老师” có nghĩa tiếng Việt nào?","options":["Giáo viên tiếng Trung của tôi","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Bạn có phải là học sinh không?"],"answer":"Giáo viên tiếng Trung của tôi","explanation":"wǒ de zhōng wén lǎo shī — Giáo viên tiếng Trung của tôi"},{"question":"Cấu trúc “Định ngữ + 的 + Trung tâm ngữ” thuộc điểm ngữ pháp nào?","options":["Trợ từ kết cấu 的","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số","Trợ từ nghi vấn 呢 (hỏi lại tình huống)"],"answer":"Trợ từ kết cấu 的","explanation":"Trợ từ 「的」 được dùng để kết nối định ngữ và trung tâm ngữ, biểu thị quan hệ sở hữu hoặc tính chất. Bạn đặt từ chỉ sở hữu hoặc đặc điểm lên trước, thêm 「的」 rồi mới đến danh từ chính."},{"question":"Câu “我的中文老师” minh họa điểm ngữ pháp nào?","options":["Trợ từ kết cấu 的","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể","Trợ từ ngữ khí 'ba' dùng để đề nghị"],"answer":"Trợ từ kết cấu 的","explanation":"Đừng quên 「的」 khi định ngữ là danh từ hoặc đại từ chỉ người khác, vì nó giúp làm rõ mối quan hệ giữa hai danh từ."}]},{"name":"Câu hỏi nghi vấn với 吗","formula":"Câu trần thuật + 吗?","explanation":"Để biến một câu trần thuật thành câu hỏi \"Có/Không\", bạn chỉ cần thêm trợ từ ngữ khí 「吗」 vào cuối câu. Cấu trúc này dùng để hỏi về sự việc mà bạn muốn xác nhận lại thông tin. Bạn không cần thay đổi trật tự từ trong câu.","tip":"Khi trả lời câu hỏi có 「吗」, bạn có thể trả lời bằng cách lặp lại động từ hoặc dùng 「是/不是」, 「有/没有」.","note":"Không được dùng 「吗」 trong câu đã có các từ nghi vấn khác như 「什么」(cái gì), 「谁」(ai), 「哪儿」(đâu).","examples":[{"hanzi":"你是学生吗？","pinyin":"nǐ shì xué shēng ma","meaning":"Bạn có phải là học sinh không?"},{"hanzi":"你工作还忙吗？","pinyin":"nǐ gōng zuò hái máng ma","meaning":"Công việc của bạn vẫn bận chứ?"}],"quiz":[{"question":"Công thức đúng của “Câu hỏi nghi vấn với 吗” là gì?","options":["Câu trần thuật + 吗?","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)"],"answer":"Câu trần thuật + 吗?","explanation":"Để biến một câu trần thuật thành câu hỏi \"Có/Không\", bạn chỉ cần thêm trợ từ ngữ khí 「吗」 vào cuối câu. Cấu trúc này dùng để hỏi về sự việc mà bạn muốn xác nhận lại thông tin. Bạn không cần thay đổi trật tự từ trong câu."},{"question":"Ví dụ nào minh họa “Câu hỏi nghi vấn với 吗”?","options":["你是学生吗？","她的中文老师","她有十个学生。","她有一个姐姐。"],"answer":"你是学生吗？","explanation":"你是学生吗？ — Bạn có phải là học sinh không?"},{"question":"“你是学生吗？” có nghĩa tiếng Việt nào?","options":["Bạn có phải là học sinh không?","Giáo viên tiếng Trung của cô ấy","Cô ấy có mười học sinh.","Cô ấy có một người chị gái."],"answer":"Bạn có phải là học sinh không?","explanation":"nǐ shì xué shēng ma — Bạn có phải là học sinh không?"},{"question":"Cấu trúc “Câu trần thuật + 吗?” thuộc điểm ngữ pháp nào?","options":["Câu hỏi nghi vấn với 吗","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Câu hỏi nghi vấn với 吗","explanation":"Để biến một câu trần thuật thành câu hỏi \"Có/Không\", bạn chỉ cần thêm trợ từ ngữ khí 「吗」 vào cuối câu. Cấu trúc này dùng để hỏi về sự việc mà bạn muốn xác nhận lại thông tin. Bạn không cần thay đổi trật tự từ trong câu."},{"question":"Câu “你是学生吗？” minh họa điểm ngữ pháp nào?","options":["Câu hỏi nghi vấn với 吗","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Câu hỏi nghi vấn với 吗","explanation":"Không được dùng 「吗」 trong câu đã có các từ nghi vấn khác như 「什么」(cái gì), 「谁」(ai), 「哪儿」(đâu)."}]}],"4":[{"name":"Câu chữ 有 (biểu thị sự sở hữu)","formula":"Chủ ngữ + 有 + Tân ngữ","explanation":"Câu chữ 「有」 dùng để biểu thị sự sở hữu đối với người hoặc vật, dịch sang tiếng Việt là 'có'. Đây là câu vị ngữ động từ, trong đó 「有」 đóng vai trò là động từ chính.","tip":"Khi muốn nói phủ định (không có), bạn hãy thay 「有」 bằng 「没有」 (méiyǒu).","note":"Trong câu phủ định, tuyệt đối không dùng 「不有」 mà bắt buộc phải dùng 「没有」.","examples":[{"hanzi":"她有十个学生。","pinyin":"tā yǒu shí gè xué shēng","meaning":"Cô ấy có mười học sinh."},{"hanzi":"她有一个姐姐。","pinyin":"tā yǒu yī gè jiě jiě","meaning":"Cô ấy có một người chị gái."}],"quiz":[{"question":"Công thức đúng của “Câu chữ 有 (biểu thị sự sở hữu)” là gì?","options":["Chủ ngữ + 有 + Tân ngữ","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Chủ ngữ + 有 + Tân ngữ","explanation":"Câu chữ 「有」 dùng để biểu thị sự sở hữu đối với người hoặc vật, dịch sang tiếng Việt là 'có'. Đây là câu vị ngữ động từ, trong đó 「有」 đóng vai trò là động từ chính."},{"question":"Ví dụ nào minh họa “Câu chữ 有 (biểu thị sự sở hữu)”?","options":["她有十个学生。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"她有十个学生。","explanation":"她有十个学生。 — Cô ấy có mười học sinh."},{"question":"“她有十个学生。” có nghĩa tiếng Việt nào?","options":["Cô ấy có mười học sinh.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Cô ấy có mười học sinh.","explanation":"tā yǒu shí gè xué shēng — Cô ấy có mười học sinh."},{"question":"Cấu trúc “Chủ ngữ + 有 + Tân ngữ” thuộc điểm ngữ pháp nào?","options":["Câu chữ 有 (biểu thị sự sở hữu)","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Câu chữ 有 (biểu thị sự sở hữu)","explanation":"Câu chữ 「有」 dùng để biểu thị sự sở hữu đối với người hoặc vật, dịch sang tiếng Việt là 'có'. Đây là câu vị ngữ động từ, trong đó 「有」 đóng vai trò là động từ chính."},{"question":"Câu “她有十个学生。” minh họa điểm ngữ pháp nào?","options":["Câu chữ 有 (biểu thị sự sở hữu)","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)"],"answer":"Câu chữ 有 (biểu thị sự sở hữu)","explanation":"Trong câu phủ định, tuyệt đối không dùng 「不有」 mà bắt buộc phải dùng 「没有」."}]},{"name":"Cách đọc và biểu đạt con số","formula":"Số đếm + (Lượng từ/Danh từ) đơn vị","explanation":"Trong tiếng Trung, số đếm từ 1-10 là nền tảng để tạo nên các số lớn hơn. Khi biểu đạt con số kèm đơn vị, bạn đặt số đếm trước lượng từ hoặc danh từ chỉ đơn vị như thời gian, tiền tệ hoặc tuổi tác.","tip":"Khi đọc số tiền lớn, người Trung Quốc thường lấy mốc 4 số 0 làm đơn vị 「万」 (vạn), ví dụ 100.000 đọc là 「十万」 (10 vạn).","note":"Thứ tự thời gian trong tiếng Trung luôn đi từ đơn vị lớn đến nhỏ: Năm -> Tháng -> Ngày -> Thứ -> Giờ -> Phút.","examples":[{"hanzi":"二十二","pinyin":"èr shí èr","meaning":"Hai mươi hai"},{"hanzi":"九百九十九","pinyin":"jiǔ bǎi jiǔ shí jiǔ","meaning":"Chín trăm chín mươi chín"}],"quiz":[{"question":"Công thức đúng của “Cách đọc và biểu đạt con số” là gì?","options":["Số đếm + (Lượng từ/Danh từ) đơn vị","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","A..., B 呢? (Cấu trúc hỏi tỉnh lược)"],"answer":"Số đếm + (Lượng từ/Danh từ) đơn vị","explanation":"Trong tiếng Trung, số đếm từ 1-10 là nền tảng để tạo nên các số lớn hơn. Khi biểu đạt con số kèm đơn vị, bạn đặt số đếm trước lượng từ hoặc danh từ chỉ đơn vị như thời gian, tiền tệ hoặc tuổi tác."},{"question":"Ví dụ nào minh họa “Cách đọc và biểu đạt con số”?","options":["二十二","我是学生。","他是中国人。","我的中文老师"],"answer":"二十二","explanation":"二十二 — Hai mươi hai"},{"question":"“二十二” có nghĩa tiếng Việt nào?","options":["Hai mươi hai","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Hai mươi hai","explanation":"èr shí èr — Hai mươi hai"},{"question":"Cấu trúc “Số đếm + (Lượng từ/Danh từ) đơn vị” thuộc điểm ngữ pháp nào?","options":["Cách đọc và biểu đạt con số","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Trợ từ nghi vấn 呢 (hỏi lại tình huống)"],"answer":"Cách đọc và biểu đạt con số","explanation":"Trong tiếng Trung, số đếm từ 1-10 là nền tảng để tạo nên các số lớn hơn. Khi biểu đạt con số kèm đơn vị, bạn đặt số đếm trước lượng từ hoặc danh từ chỉ đơn vị như thời gian, tiền tệ hoặc tuổi tác."},{"question":"Câu “二十二” minh họa điểm ngữ pháp nào?","options":["Cách đọc và biểu đạt con số","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể","Trợ từ ngữ khí 'ba' dùng để đề nghị"],"answer":"Cách đọc và biểu đạt con số","explanation":"Thứ tự thời gian trong tiếng Trung luôn đi từ đơn vị lớn đến nhỏ: Năm -> Tháng -> Ngày -> Thứ -> Giờ -> Phút."}]},{"name":"Trợ từ nghi vấn 呢 (hỏi lại tình huống)","formula":"A..., B 呢? (Cấu trúc hỏi tỉnh lược)","explanation":"Trợ từ 「呢」 đặt cuối câu dùng để hỏi lại một tình huống đã được nhắc đến trước đó. Đây là cách nói tắt giúp câu hỏi ngắn gọn và tự nhiên hơn thay vì phải lặp lại toàn bộ câu hỏi cũ.","tip":"Hãy dùng cấu trúc này khi bạn muốn hỏi ngược lại đối phương về cùng một chủ đề, ví dụ: 'Tôi ăn rồi, còn bạn thì sao?' (我吃了，你呢？).","note":"Không nên dùng 「呢」 thay thế cho 「吗」 vì 「呢」 chỉ dùng cho câu hỏi tỉnh lược hoặc liệt kê, không dùng cho câu hỏi Có/Không.","examples":[{"hanzi":"我是学生，你呢？","pinyin":"wǒ shì xué shēng nǐ ne","meaning":"Tôi là học sinh, còn bạn thì sao?"},{"hanzi":"我是中国人，你呢？","pinyin":"wǒ shì zhōng guó rén nǐ ne","meaning":"Tôi là người Trung Quốc, còn bạn?"}],"quiz":[{"question":"Công thức đúng của “Trợ từ nghi vấn 呢 (hỏi lại tình huống)” là gì?","options":["A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)"],"answer":"A..., B 呢? (Cấu trúc hỏi tỉnh lược)","explanation":"Trợ từ 「呢」 đặt cuối câu dùng để hỏi lại một tình huống đã được nhắc đến trước đó. Đây là cách nói tắt giúp câu hỏi ngắn gọn và tự nhiên hơn thay vì phải lặp lại toàn bộ câu hỏi cũ."},{"question":"Ví dụ nào minh họa “Trợ từ nghi vấn 呢 (hỏi lại tình huống)”?","options":["我是学生，你呢？","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我是学生，你呢？","explanation":"我是学生，你呢？ — Tôi là học sinh, còn bạn thì sao?"},{"question":"“我是学生，你呢？” có nghĩa tiếng Việt nào?","options":["Tôi là học sinh, còn bạn thì sao?","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Tôi là học sinh, còn bạn thì sao?","explanation":"wǒ shì xué shēng nǐ ne — Tôi là học sinh, còn bạn thì sao?"},{"question":"Cấu trúc “A..., B 呢? (Cấu trúc hỏi tỉnh lược)” thuộc điểm ngữ pháp nào?","options":["Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Trợ từ nghi vấn 呢 (hỏi lại tình huống)","explanation":"Trợ từ 「呢」 đặt cuối câu dùng để hỏi lại một tình huống đã được nhắc đến trước đó. Đây là cách nói tắt giúp câu hỏi ngắn gọn và tự nhiên hơn thay vì phải lặp lại toàn bộ câu hỏi cũ."},{"question":"Câu “我是学生，你呢？” minh họa điểm ngữ pháp nào?","options":["Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Trợ từ nghi vấn 呢 (hỏi lại tình huống)","explanation":"Không nên dùng 「呢」 thay thế cho 「吗」 vì 「呢」 chỉ dùng cho câu hỏi tỉnh lược hoặc liệt kê, không dùng cho câu hỏi Có/Không."}]},{"name":"Cấu trúc Số từ + Lượng từ + Danh từ","formula":"[Số từ] + [Lượng từ] + [Danh từ]","explanation":"Trong tiếng Trung, khi muốn chỉ số lượng của vật, bạn phải thêm lượng từ vào giữa số từ và danh từ. Lượng từ 「个」 là từ phổ biến nhất và có thể dùng cho nhiều danh từ khác nhau nếu bạn chưa biết lượng từ riêng của chúng.","tip":"Nếu bạn chưa thuộc lượng từ chuyên biệt cho một đồ vật, hãy dùng tạm 「个」 làm lượng từ chung.","note":"Đừng bao giờ bỏ qua lượng từ khi đi kèm với số đếm, vì trong tiếng Trung danh từ không thể đứng ngay sau số từ.","examples":[{"hanzi":"一个","pinyin":"yī gè","meaning":"Một cái/chiếc"},{"hanzi":"五口人","pinyin":"wǔ kǒu rén","meaning":"Năm người - dùng trong gia đình"}],"quiz":[{"question":"Công thức đúng của “Cấu trúc Số từ + Lượng từ + Danh từ” là gì?","options":["[Số từ] + [Lượng từ] + [Danh từ]","Chủ ngữ + 会 + Động từ (+ Tân ngữ)","Chủ ngữ + 想 + Động từ + (Tân ngữ)","S + V1 + O1 + V2 + O2"],"answer":"[Số từ] + [Lượng từ] + [Danh từ]","explanation":"Trong tiếng Trung, khi muốn chỉ số lượng của vật, bạn phải thêm lượng từ vào giữa số từ và danh từ. Lượng từ 「个」 là từ phổ biến nhất và có thể dùng cho nhiều danh từ khác nhau nếu bạn chưa biết lượng từ riêng của chúng."},{"question":"Ví dụ nào minh họa “Cấu trúc Số từ + Lượng từ + Danh từ”?","options":["一个","她有十个学生。","她有一个姐姐。","二十二"],"answer":"一个","explanation":"一个 — Một cái/chiếc"},{"question":"“一个” có nghĩa tiếng Việt nào?","options":["Một cái/chiếc","Cô ấy có mười học sinh.","Cô ấy có một người chị gái.","Hai mươi hai"],"answer":"Một cái/chiếc","explanation":"yī gè — Một cái/chiếc"},{"question":"Cấu trúc “[Số từ] + [Lượng từ] + [Danh từ]” thuộc điểm ngữ pháp nào?","options":["Cấu trúc Số từ + Lượng từ + Danh từ","Động từ năng nguyện 会 (biết)","Động từ năng nguyện 想 (muốn)","Câu liên động"],"answer":"Cấu trúc Số từ + Lượng từ + Danh từ","explanation":"Trong tiếng Trung, khi muốn chỉ số lượng của vật, bạn phải thêm lượng từ vào giữa số từ và danh từ. Lượng từ 「个」 là từ phổ biến nhất và có thể dùng cho nhiều danh từ khác nhau nếu bạn chưa biết lượng từ riêng của chúng."},{"question":"Câu “一个” minh họa điểm ngữ pháp nào?","options":["Cấu trúc Số từ + Lượng từ + Danh từ","Số thứ tự với 第","Cách đọc tiền tệ trong tiếng Trung","Câu vị ngữ tính từ"],"answer":"Cấu trúc Số từ + Lượng từ + Danh từ","explanation":"Đừng bao giờ bỏ qua lượng từ khi đi kèm với số đếm, vì trong tiếng Trung danh từ không thể đứng ngay sau số từ."}]}],"5":[{"name":"Thứ tự biểu đạt thời gian","formula":"Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","explanation":"Trong tiếng Trung, khi diễn đạt thời gian, chúng ta luôn đi từ đơn vị lớn nhất đến đơn vị nhỏ nhất. Bạn cần sắp xếp theo thứ tự lần lượt là 「年」 (năm), 「月」 (tháng), 「日」 hoặc 「号」 (ngày) và cuối cùng là 「星期」 (thứ).","tip":"Hãy ghi nhớ quy tắc 'từ lớn đến bé', ngược lại hoàn toàn so với tiếng Việt.","note":"Trong khẩu ngữ thường dùng 「号」 để nói về ngày, còn trong văn bản viết thường dùng 「日」.","examples":[{"hanzi":"2025年1月1日，星期三","pinyin":"èr líng èr wǔ nián yī yuè yī rì xīng qī sān","meaning":"Thứ Tư, ngày 1 tháng 1 năm 2025"},{"hanzi":"今天9月8号。","pinyin":"jīn tiān yuè hào","meaning":"Hôm nay ngày 8 tháng 9."}],"quiz":[{"question":"Công thức đúng của “Thứ tự biểu đạt thời gian” là gì?","options":["Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)","explanation":"Trong tiếng Trung, khi diễn đạt thời gian, chúng ta luôn đi từ đơn vị lớn nhất đến đơn vị nhỏ nhất. Bạn cần sắp xếp theo thứ tự lần lượt là 「年」 (năm), 「月」 (tháng), 「日」 hoặc 「号」 (ngày) và cuối cùng là 「星期」 (thứ)."},{"question":"Ví dụ nào minh họa “Thứ tự biểu đạt thời gian”?","options":["2025年1月1日，星期三","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"2025年1月1日，星期三","explanation":"2025年1月1日，星期三 — Thứ Tư, ngày 1 tháng 1 năm 2025"},{"question":"“2025年1月1日，星期三” có nghĩa tiếng Việt nào?","options":["Thứ Tư, ngày 1 tháng 1 năm 2025","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Thứ Tư, ngày 1 tháng 1 năm 2025","explanation":"èr líng èr wǔ nián yī yuè yī rì xīng qī sān — Thứ Tư, ngày 1 tháng 1 năm 2025"},{"question":"Cấu trúc “Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)” thuộc điểm ngữ pháp nào?","options":["Thứ tự biểu đạt thời gian","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Thứ tự biểu đạt thời gian","explanation":"Trong tiếng Trung, khi diễn đạt thời gian, chúng ta luôn đi từ đơn vị lớn nhất đến đơn vị nhỏ nhất. Bạn cần sắp xếp theo thứ tự lần lượt là 「年」 (năm), 「月」 (tháng), 「日」 hoặc 「号」 (ngày) và cuối cùng là 「星期」 (thứ)."},{"question":"Câu “2025年1月1日，星期三” minh họa điểm ngữ pháp nào?","options":["Thứ tự biểu đạt thời gian","Cấu trúc Số từ + Lượng từ + Danh từ","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)"],"answer":"Thứ tự biểu đạt thời gian","explanation":"Trong khẩu ngữ thường dùng 「号」 để nói về ngày, còn trong văn bản viết thường dùng 「日」."}]},{"name":"Câu vị ngữ danh từ","formula":"Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)","explanation":"Trong câu này, vị ngữ không phải là động từ hay tính từ mà là một danh từ hoặc cụm danh từ. Cấu trúc này thường dùng để chỉ ngày tháng, thời gian, tuổi tác hoặc giá tiền. Ví dụ: 「今天星期一」(Hôm nay là thứ Hai).","tip":"Khi nói về ngày tháng, hãy nhớ quy tắc từ đơn vị lớn đến nhỏ: Năm -> Tháng -> Ngày -> Thứ.","note":"Trong câu vị ngữ danh từ, bạn không được thêm từ 「是」 (là) vào giữa chủ ngữ và vị ngữ.","examples":[{"hanzi":"今天星期四。","pinyin":"jīn tiān xīng qī sì","meaning":"Hôm nay là thứ Năm."},{"hanzi":"明天是2024年8月18号。","pinyin":"míng tiān shì nián yuè hào","meaning":"Ngày mai là ngày 18 tháng 8 năm 2024."}],"quiz":[{"question":"Công thức đúng của “Câu vị ngữ danh từ” là gì?","options":["Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)","explanation":"Trong câu này, vị ngữ không phải là động từ hay tính từ mà là một danh từ hoặc cụm danh từ. Cấu trúc này thường dùng để chỉ ngày tháng, thời gian, tuổi tác hoặc giá tiền. Ví dụ: 「今天星期一」(Hôm nay là thứ Hai)."},{"question":"Ví dụ nào minh họa “Câu vị ngữ danh từ”?","options":["今天星期四。","我是学生。","他是中国人。","我的中文老师"],"answer":"今天星期四。","explanation":"今天星期四。 — Hôm nay là thứ Năm."},{"question":"“今天星期四。” có nghĩa tiếng Việt nào?","options":["Hôm nay là thứ Năm.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Hôm nay là thứ Năm.","explanation":"jīn tiān xīng qī sì — Hôm nay là thứ Năm."},{"question":"Cấu trúc “Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)” thuộc điểm ngữ pháp nào?","options":["Câu vị ngữ danh từ","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Câu vị ngữ danh từ","explanation":"Trong câu này, vị ngữ không phải là động từ hay tính từ mà là một danh từ hoặc cụm danh từ. Cấu trúc này thường dùng để chỉ ngày tháng, thời gian, tuổi tác hoặc giá tiền. Ví dụ: 「今天星期一」(Hôm nay là thứ Hai)."},{"question":"Câu “今天星期四。” minh họa điểm ngữ pháp nào?","options":["Câu vị ngữ danh từ","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể","Trợ từ ngữ khí 'ba' dùng để đề nghị"],"answer":"Câu vị ngữ danh từ","explanation":"Trong câu vị ngữ danh từ, bạn không được thêm từ 「是」 (là) vào giữa chủ ngữ và vị ngữ."}]},{"name":"Động từ năng nguyện 会 (biết)","formula":"Chủ ngữ + 会 + Động từ (+ Tân ngữ)","explanation":"Động từ năng nguyện 「会」 dùng để diễn tả năng lực hoặc kỹ năng mà bạn có được thông qua quá trình học tập hoặc rèn luyện. Ví dụ: 「我会说汉语」 (Tôi biết nói tiếng Trung).","tip":"Hãy nhớ rằng 「会」 nhấn mạnh vào khả năng biết làm việc gì đó nhờ học hỏi, không phải khả năng tự nhiên.","note":"Đừng nhầm lẫn 「会」 với 「能」, vì 「能」 thường dùng để chỉ khả năng có thể làm được việc gì đó dựa trên điều kiện thực tế.","examples":[{"hanzi":"我会做饭。","pinyin":"wǒ huì zuò fàn","meaning":"Tôi biết nấu ăn."},{"hanzi":"你会做饭吗？","pinyin":"nǐ huì zuò fàn ma","meaning":"Bạn biết nấu ăn không?"}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 会 (biết)” là gì?","options":["Chủ ngữ + 会 + Động từ (+ Tân ngữ)","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 会 + Động từ (+ Tân ngữ)","explanation":"Động từ năng nguyện 「会」 dùng để diễn tả năng lực hoặc kỹ năng mà bạn có được thông qua quá trình học tập hoặc rèn luyện. Ví dụ: 「我会说汉语」 (Tôi biết nói tiếng Trung)."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 会 (biết)”?","options":["我会做饭。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我会做饭。","explanation":"我会做饭。 — Tôi biết nấu ăn."},{"question":"“我会做饭。” có nghĩa tiếng Việt nào?","options":["Tôi biết nấu ăn.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Tôi biết nấu ăn.","explanation":"wǒ huì zuò fàn — Tôi biết nấu ăn."},{"question":"Cấu trúc “Chủ ngữ + 会 + Động từ (+ Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 会 (biết)","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Động từ năng nguyện 会 (biết)","explanation":"Động từ năng nguyện 「会」 dùng để diễn tả năng lực hoặc kỹ năng mà bạn có được thông qua quá trình học tập hoặc rèn luyện. Ví dụ: 「我会说汉语」 (Tôi biết nói tiếng Trung)."},{"question":"Câu “我会做饭。” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 会 (biết)","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Động từ năng nguyện 会 (biết)","explanation":"Đừng nhầm lẫn 「会」 với 「能」, vì 「能」 thường dùng để chỉ khả năng có thể làm được việc gì đó dựa trên điều kiện thực tế."}]}],"6":[{"name":"Động từ năng nguyện 想 (muốn)","formula":"Chủ ngữ + 想 + Động từ + (Tân ngữ)","explanation":"Từ 「想」 là động từ năng nguyện dùng để biểu thị nguyện vọng, mong muốn hoặc dự định thực hiện một hành động nào đó. Nó thường đứng trước động từ chính trong câu để làm rõ mục đích của chủ ngữ.","tip":"Khi muốn nói phủ định, bạn chỉ cần thêm 「不」 phía trước 「想」 (ví dụ: 「不想」 - không muốn).","note":"Không được dùng 「想」 như một tính từ để miêu tả, nó chỉ dùng để biểu thị ý định làm việc gì đó.","examples":[{"hanzi":"我想去超市。","pinyin":"wǒ xiǎng qù chāo shì","meaning":"Tôi muốn đi siêu thị."},{"hanzi":"我哥哥不想休息。","pinyin":"wǒ gē gē bù xiǎng xiū xī","meaning":"Anh trai tôi không muốn nghỉ ngơi."}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 想 (muốn)” là gì?","options":["Chủ ngữ + 想 + Động từ + (Tân ngữ)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Chủ ngữ + 想 + Động từ + (Tân ngữ)","explanation":"Từ 「想」 là động từ năng nguyện dùng để biểu thị nguyện vọng, mong muốn hoặc dự định thực hiện một hành động nào đó. Nó thường đứng trước động từ chính trong câu để làm rõ mục đích của chủ ngữ."},{"question":"Ví dụ nào minh họa “Động từ năng nguyện 想 (muốn)”?","options":["我想去超市。","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"我想去超市。","explanation":"我想去超市。 — Tôi muốn đi siêu thị."},{"question":"“我想去超市。” có nghĩa tiếng Việt nào?","options":["Tôi muốn đi siêu thị.","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Tôi muốn đi siêu thị.","explanation":"wǒ xiǎng qù chāo shì — Tôi muốn đi siêu thị."},{"question":"Cấu trúc “Chủ ngữ + 想 + Động từ + (Tân ngữ)” thuộc điểm ngữ pháp nào?","options":["Động từ năng nguyện 想 (muốn)","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Động từ năng nguyện 想 (muốn)","explanation":"Từ 「想」 là động từ năng nguyện dùng để biểu thị nguyện vọng, mong muốn hoặc dự định thực hiện một hành động nào đó. Nó thường đứng trước động từ chính trong câu để làm rõ mục đích của chủ ngữ."},{"question":"Câu “我想去超市。” minh họa điểm ngữ pháp nào?","options":["Động từ năng nguyện 想 (muốn)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Động từ năng nguyện 想 (muốn)","explanation":"Không được dùng 「想」 như một tính từ để miêu tả, nó chỉ dùng để biểu thị ý định làm việc gì đó."}]},{"name":"Câu liên động","formula":"S + V1 + O1 + V2 + O2","explanation":"Câu liên động là câu có từ hai động từ trở lên cùng làm vị ngữ. Cấu trúc này thường dùng để diễn tả mục đích hoặc trình tự của hành động, trong đó động từ thứ hai thường giải thích lý do thực hiện động từ thứ nhất.","tip":"Hãy ghi nhớ quy tắc: hành động xảy ra trước đứng trước, hành động mục đích đứng sau.","note":"Không được dùng các từ liên kết như 「和」(và) hay 「然后」(sau đó) giữa hai động từ.","examples":[{"hanzi":"我去超市买东西。","pinyin":"wǒ qù chāo shì mǎi dōng xī","meaning":"Tôi đi siêu thị mua đồ."},{"hanzi":"我们坐出租车去西安饭店。","pinyin":"wǒ men zuò chū zū chē qù xī ān fàn diàn","meaning":"Chúng tôi đi taxi đến nhà hàng Tây An."}],"quiz":[{"question":"Công thức đúng của “Câu liên động” là gì?","options":["S + V1 + O1 + V2 + O2","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"S + V1 + O1 + V2 + O2","explanation":"Câu liên động là câu có từ hai động từ trở lên cùng làm vị ngữ. Cấu trúc này thường dùng để diễn tả mục đích hoặc trình tự của hành động, trong đó động từ thứ hai thường giải thích lý do thực hiện động từ thứ nhất."},{"question":"Ví dụ nào minh họa “Câu liên động”?","options":["我去超市买东西。","我是学生。","他是中国人。","我的中文老师"],"answer":"我去超市买东西。","explanation":"我去超市买东西。 — Tôi đi siêu thị mua đồ."},{"question":"“我去超市买东西。” có nghĩa tiếng Việt nào?","options":["Tôi đi siêu thị mua đồ.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi đi siêu thị mua đồ.","explanation":"wǒ qù chāo shì mǎi dōng xī — Tôi đi siêu thị mua đồ."},{"question":"Cấu trúc “S + V1 + O1 + V2 + O2” thuộc điểm ngữ pháp nào?","options":["Câu liên động","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Câu liên động","explanation":"Câu liên động là câu có từ hai động từ trở lên cùng làm vị ngữ. Cấu trúc này thường dùng để diễn tả mục đích hoặc trình tự của hành động, trong đó động từ thứ hai thường giải thích lý do thực hiện động từ thứ nhất."},{"question":"Câu “我去超市买东西。” minh họa điểm ngữ pháp nào?","options":["Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể","Trợ từ ngữ khí 'ba' dùng để đề nghị"],"answer":"Câu liên động","explanation":"Không được dùng các từ liên kết như 「和」(và) hay 「然后」(sau đó) giữa hai động từ."}]},{"name":"Đại từ nghi vấn 怎么 (làm thế nào)","formula":"S + 怎么 + V + (O)?","explanation":"Từ 「怎么」 được dùng trước động từ để hỏi về phương thức hoặc cách thức thực hiện một hành động nào đó. Nó tương đương với cấu trúc \"làm thế nào\" hoặc \"làm sao\" trong tiếng Việt.","tip":"Bạn có thể dùng cấu trúc này để hỏi cách làm một việc gì đó hoặc cách sử dụng một vật dụng nào đó, ví dụ: 「这个字怎么写？」(Chữ này viết thế nào?).","note":"Đừng nhầm lẫn 「怎么」 với 「什么」; 「怎么」 hỏi về cách làm (phương thức), còn 「什么」 hỏi về sự vật, sự việc (cái gì).","examples":[{"hanzi":"你怎么去超市？","pinyin":"nǐ zěn me qù chāo shì","meaning":"Bạn đi siêu thị bằng cách nào?"},{"hanzi":"我们怎么去？","pinyin":"wǒ men zěn me qù","meaning":"Chúng ta đi bằng cách nào?"}],"quiz":[{"question":"Công thức đúng của “Đại từ nghi vấn 怎么 (làm thế nào)” là gì?","options":["S + 怎么 + V + (O)?","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"S + 怎么 + V + (O)?","explanation":"Từ 「怎么」 được dùng trước động từ để hỏi về phương thức hoặc cách thức thực hiện một hành động nào đó. Nó tương đương với cấu trúc \"làm thế nào\" hoặc \"làm sao\" trong tiếng Việt."},{"question":"Ví dụ nào minh họa “Đại từ nghi vấn 怎么 (làm thế nào)”?","options":["你怎么去超市？","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"你怎么去超市？","explanation":"你怎么去超市？ — Bạn đi siêu thị bằng cách nào?"},{"question":"“你怎么去超市？” có nghĩa tiếng Việt nào?","options":["Bạn đi siêu thị bằng cách nào?","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Bạn đi siêu thị bằng cách nào?","explanation":"nǐ zěn me qù chāo shì — Bạn đi siêu thị bằng cách nào?"},{"question":"Cấu trúc “S + 怎么 + V + (O)?” thuộc điểm ngữ pháp nào?","options":["Đại từ nghi vấn 怎么 (làm thế nào)","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Đại từ nghi vấn 怎么 (làm thế nào)","explanation":"Từ 「怎么」 được dùng trước động từ để hỏi về phương thức hoặc cách thức thực hiện một hành động nào đó. Nó tương đương với cấu trúc \"làm thế nào\" hoặc \"làm sao\" trong tiếng Việt."},{"question":"Câu “你怎么去超市？” minh họa điểm ngữ pháp nào?","options":["Đại từ nghi vấn 怎么 (làm thế nào)","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Đại từ nghi vấn 怎么 (làm thế nào)","explanation":"Đừng nhầm lẫn 「怎么」 với 「什么」; 「怎么」 hỏi về cách làm (phương thức), còn 「什么」 hỏi về sự vật, sự việc (cái gì)."}]}],"7":[{"name":"Cách nói giờ giấc cụ thể","formula":"Số đếm + 点 (giờ) + Số đếm + 分 (phút)","explanation":"Trong tiếng Trung, để nói giờ giấc, bạn đặt số đếm trước từ 「点」 (giờ) và 「分」 (phút). Thứ tự thời gian luôn đi từ đơn vị lớn đến đơn vị nhỏ, ví dụ: 8 giờ 30 phút là 「八点三十分」.","tip":"Khi nói giờ kém hoặc 30 phút, bạn có thể dùng 「半」 thay cho 30 phút, ví dụ: 8 giờ rưỡi là 「八点半」.","note":"Đừng quên dùng 「两」 (liǎng) thay vì 「二」 (èr) khi nói \"2 giờ\" (「两点」), không dùng 「二点」.","examples":[{"hanzi":"上午十点","pinyin":"shàng wǔ shí diǎn","meaning":"Mười giờ sáng"},{"hanzi":"我晚上六点半下班。","pinyin":"wǒ wǎn shàng liù diǎn bàn xià bān","meaning":"Tôi tan làm lúc 6 giờ rưỡi tối."}],"quiz":[{"question":"Công thức đúng của “Cách nói giờ giấc cụ thể” là gì?","options":["Số đếm + 点 (giờ) + Số đếm + 分 (phút)","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"Số đếm + 点 (giờ) + Số đếm + 分 (phút)","explanation":"Trong tiếng Trung, để nói giờ giấc, bạn đặt số đếm trước từ 「点」 (giờ) và 「分」 (phút). Thứ tự thời gian luôn đi từ đơn vị lớn đến đơn vị nhỏ, ví dụ: 8 giờ 30 phút là 「八点三十分」."},{"question":"Ví dụ nào minh họa “Cách nói giờ giấc cụ thể”?","options":["上午十点","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"上午十点","explanation":"上午十点 — Mười giờ sáng"},{"question":"“上午十点” có nghĩa tiếng Việt nào?","options":["Mười giờ sáng","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Mười giờ sáng","explanation":"shàng wǔ shí diǎn — Mười giờ sáng"},{"question":"Cấu trúc “Số đếm + 点 (giờ) + Số đếm + 分 (phút)” thuộc điểm ngữ pháp nào?","options":["Cách nói giờ giấc cụ thể","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Cách nói giờ giấc cụ thể","explanation":"Trong tiếng Trung, để nói giờ giấc, bạn đặt số đếm trước từ 「点」 (giờ) và 「分」 (phút). Thứ tự thời gian luôn đi từ đơn vị lớn đến đơn vị nhỏ, ví dụ: 8 giờ 30 phút là 「八点三十分」."},{"question":"Câu “上午十点” minh họa điểm ngữ pháp nào?","options":["Cách nói giờ giấc cụ thể","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Cách nói giờ giấc cụ thể","explanation":"Đừng quên dùng 「两」 (liǎng) thay vì 「二」 (èr) khi nói \"2 giờ\" (「两点」), không dùng 「二点」."}]},{"name":"Trợ từ ngữ khí 'ba' dùng để đề nghị","formula":"Câu + 吧 (ba)","explanation":"Trợ từ 「吧」 đứng cuối câu để đưa ra lời đề nghị, gợi ý hoặc yêu cầu một cách nhẹ nhàng. Nó giúp câu nói của bạn trở nên lịch sự và bớt khô khan hơn.","tip":"Dùng 「吧」 khi bạn muốn rủ rê ai đó làm gì cùng mình, ví dụ: 「我们走吧」 (Chúng ta đi thôi).","note":"Đừng dùng 「吧」 trong các câu hỏi cần câu trả lời xác nhận như câu hỏi với 「吗」.","examples":[{"hanzi":"我们上课吧。","pinyin":"wǒ men shàng kè ba","meaning":"Chúng ta lên lớp thôi."},{"hanzi":"我们中午下课吧。","pinyin":"wǒ men zhōng wǔ xià kè ba","meaning":"Trưa nay chúng ta tan học đi."}],"quiz":[{"question":"Công thức đúng của “Trợ từ ngữ khí 'ba' dùng để đề nghị” là gì?","options":["Câu + 吧 (ba)","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Câu + 吧 (ba)","explanation":"Trợ từ 「吧」 đứng cuối câu để đưa ra lời đề nghị, gợi ý hoặc yêu cầu một cách nhẹ nhàng. Nó giúp câu nói của bạn trở nên lịch sự và bớt khô khan hơn."},{"question":"Ví dụ nào minh họa “Trợ từ ngữ khí 'ba' dùng để đề nghị”?","options":["我们上课吧。","我是学生。","他是中国人。","我的中文老师"],"answer":"我们上课吧。","explanation":"我们上课吧。 — Chúng ta lên lớp thôi."},{"question":"“我们上课吧。” có nghĩa tiếng Việt nào?","options":["Chúng ta lên lớp thôi.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Chúng ta lên lớp thôi.","explanation":"wǒ men shàng kè ba — Chúng ta lên lớp thôi."},{"question":"Cấu trúc “Câu + 吧 (ba)” thuộc điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 'ba' dùng để đề nghị","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Trợ từ ngữ khí 'ba' dùng để đề nghị","explanation":"Trợ từ 「吧」 đứng cuối câu để đưa ra lời đề nghị, gợi ý hoặc yêu cầu một cách nhẹ nhàng. Nó giúp câu nói của bạn trở nên lịch sự và bớt khô khan hơn."},{"question":"Câu “我们上课吧。” minh họa điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 'ba' dùng để đề nghị","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Trợ từ ngữ khí 'ba' dùng để đề nghị","explanation":"Đừng dùng 「吧」 trong các câu hỏi cần câu trả lời xác nhận như câu hỏi với 「吗」."}]},{"name":"Vị trí của trạng ngữ trong câu","formula":"Trạng ngữ + Động từ/Tính từ","explanation":"Trong tiếng Trung, các từ chỉ thời gian hoặc phó từ thường đứng trước động từ hoặc tính từ để bổ nghĩa cho hành động. Bạn hãy nhớ quy tắc \"thời gian đứng trước hành động\" để đặt câu cho chính xác.","tip":"Bạn có thể đặt trạng ngữ chỉ thời gian lên đầu câu trước chủ ngữ hoặc ngay sau chủ ngữ đều được.","note":"Tuyệt đối không đặt trạng ngữ chỉ thời gian sau động từ như trong tiếng Việt.","examples":[{"hanzi":"我下午不去学校。","pinyin":"wǒ xià wǔ bù qù xué xiào","meaning":"Chiều nay tôi không đi học."},{"hanzi":"妹妹很高兴。","pinyin":"mèi mèi hěn gāo xìng","meaning":"Em gái rất vui."}],"quiz":[{"question":"Công thức đúng của “Vị trí của trạng ngữ trong câu” là gì?","options":["Trạng ngữ + Động từ/Tính từ","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Trạng ngữ + Động từ/Tính từ","explanation":"Trong tiếng Trung, các từ chỉ thời gian hoặc phó từ thường đứng trước động từ hoặc tính từ để bổ nghĩa cho hành động. Bạn hãy nhớ quy tắc \"thời gian đứng trước hành động\" để đặt câu cho chính xác."},{"question":"Ví dụ nào minh họa “Vị trí của trạng ngữ trong câu”?","options":["我下午不去学校。","她的中文老师","你是学生吗？","你工作还忙吗？"],"answer":"我下午不去学校。","explanation":"我下午不去学校。 — Chiều nay tôi không đi học."},{"question":"“我下午不去学校。” có nghĩa tiếng Việt nào?","options":["Chiều nay tôi không đi học.","Giáo viên tiếng Trung của cô ấy","Bạn có phải là học sinh không?","Công việc của bạn vẫn bận chứ?"],"answer":"Chiều nay tôi không đi học.","explanation":"wǒ xià wǔ bù qù xué xiào — Chiều nay tôi không đi học."},{"question":"Cấu trúc “Trạng ngữ + Động từ/Tính từ” thuộc điểm ngữ pháp nào?","options":["Vị trí của trạng ngữ trong câu","Trợ từ nghi vấn 呢 (hỏi lại tình huống)","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian"],"answer":"Vị trí của trạng ngữ trong câu","explanation":"Trong tiếng Trung, các từ chỉ thời gian hoặc phó từ thường đứng trước động từ hoặc tính từ để bổ nghĩa cho hành động. Bạn hãy nhớ quy tắc \"thời gian đứng trước hành động\" để đặt câu cho chính xác."},{"question":"Câu “我下午不去学校。” minh họa điểm ngữ pháp nào?","options":["Vị trí của trạng ngữ trong câu","Danh từ chỉ phương hướng và vị trí","Giới từ chỉ địa điểm 在","Động từ năng nguyện 能"],"answer":"Vị trí của trạng ngữ trong câu","explanation":"Tuyệt đối không đặt trạng ngữ chỉ thời gian sau động từ như trong tiếng Việt."}]},{"name":"Trợ từ ngữ khí 呢 xác nhận sự thật","formula":"Câu trần thuật + 呢","explanation":"Trợ từ 「呢」 đặt cuối câu trần thuật để nhấn mạnh và xác nhận một sự thật hoặc tình trạng đang diễn ra. Nó giúp câu văn trở nên mềm mại, tự nhiên hơn, tương đương với các từ như 'nhỉ', 'đấy', 'cơ' trong tiếng Việt.","tip":"Dùng 「呢」 giúp câu nói bớt khô khan và thể hiện thái độ khẳng định của người nói về một sự việc.","note":"Cần phân biệt với 「呢」 trong câu hỏi tỉnh lược (ví dụ: 'Còn tôi thì sao?'), đây là hai cách dùng hoàn toàn khác nhau.","examples":[{"hanzi":"我下午还有课呢。","pinyin":"wǒ xià wǔ hái yǒu kè ne","meaning":"Chiều nay tôi vẫn còn tiết học đấy."},{"hanzi":"李文晚上还有事呢。","pinyin":"lǐ wén wǎn shàng hái yǒu shì ne","meaning":"Lý Văn buổi tối vẫn còn việc đấy."}],"quiz":[{"question":"Công thức đúng của “Trợ từ ngữ khí 呢 xác nhận sự thật” là gì?","options":["Câu trần thuật + 呢","Chủ ngữ + Danh từ/Cụm danh từ (vị ngữ)","Chủ ngữ + 会 + Động từ (+ Tân ngữ)","Chủ ngữ + 想 + Động từ + (Tân ngữ)"],"answer":"Câu trần thuật + 呢","explanation":"Trợ từ 「呢」 đặt cuối câu trần thuật để nhấn mạnh và xác nhận một sự thật hoặc tình trạng đang diễn ra. Nó giúp câu văn trở nên mềm mại, tự nhiên hơn, tương đương với các từ như 'nhỉ', 'đấy', 'cơ' trong tiếng Việt."},{"question":"Ví dụ nào minh họa “Trợ từ ngữ khí 呢 xác nhận sự thật”?","options":["我下午还有课呢。","她有十个学生。","她有一个姐姐。","二十二"],"answer":"我下午还有课呢。","explanation":"我下午还有课呢。 — Chiều nay tôi vẫn còn tiết học đấy."},{"question":"“我下午还有课呢。” có nghĩa tiếng Việt nào?","options":["Chiều nay tôi vẫn còn tiết học đấy.","Cô ấy có mười học sinh.","Cô ấy có một người chị gái.","Hai mươi hai"],"answer":"Chiều nay tôi vẫn còn tiết học đấy.","explanation":"wǒ xià wǔ hái yǒu kè ne — Chiều nay tôi vẫn còn tiết học đấy."},{"question":"Cấu trúc “Câu trần thuật + 呢” thuộc điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 呢 xác nhận sự thật","Câu vị ngữ danh từ","Động từ năng nguyện 会 (biết)","Động từ năng nguyện 想 (muốn)"],"answer":"Trợ từ ngữ khí 呢 xác nhận sự thật","explanation":"Trợ từ 「呢」 đặt cuối câu trần thuật để nhấn mạnh và xác nhận một sự thật hoặc tình trạng đang diễn ra. Nó giúp câu văn trở nên mềm mại, tự nhiên hơn, tương đương với các từ như 'nhỉ', 'đấy', 'cơ' trong tiếng Việt."},{"question":"Câu “我下午还有课呢。” minh họa điểm ngữ pháp nào?","options":["Trợ từ ngữ khí 呢 xác nhận sự thật","Số thứ tự với 第","Cách đọc tiền tệ trong tiếng Trung","Câu vị ngữ tính từ"],"answer":"Trợ từ ngữ khí 呢 xác nhận sự thật","explanation":"Cần phân biệt với 「呢」 trong câu hỏi tỉnh lược (ví dụ: 'Còn tôi thì sao?'), đây là hai cách dùng hoàn toàn khác nhau."}]}],"8":[{"name":"Danh từ chỉ phương hướng và vị trí","formula":"[Danh từ/Đại từ] + [Danh từ phương vị (上, 下, 前, 后, 里, 外, v.v.)]","explanation":"Trong tiếng Trung, để chỉ vị trí của một vật, ta đặt danh từ chỉ vật đó trước từ chỉ phương vị. Các từ như 「上」 (trên), 「下」 (dưới), 「里」 (trong) luôn đứng sau danh từ gốc để xác định rõ vị trí không gian.","tip":"Hãy tưởng tượng từ chỉ phương vị đóng vai trò như một chiếc 'vệ tinh' luôn bám sát phía sau danh từ chính để làm rõ vị trí.","note":"Đừng nhầm lẫn thứ tự: trong tiếng Trung, danh từ luôn đứng trước từ chỉ phương vị, ngược lại với tiếng Việt thường có từ 'ở' hoặc 'bên' đứng trước.","examples":[{"hanzi":"在桌子上","pinyin":"zài zhuō zi shàng","meaning":"Ở trên bàn"},{"hanzi":"房间外有一只小猫。","pinyin":"fáng jiān wài yǒu yī zhī xiǎo māo","meaning":"Bên ngoài phòng có một chú mèo nhỏ."}],"quiz":[{"question":"Công thức đúng của “Danh từ chỉ phương hướng và vị trí” là gì?","options":["[Danh từ/Đại từ] + [Danh từ phương vị (上, 下, 前, 后, 里, 外, v.v.)]","Chủ ngữ + Vị ngữ (động từ) + Tân ngữ","S + 是 + N/Đại từ (Ví dụ: 我是学生 - Tôi là học sinh)","Định ngữ + 的 + Trung tâm ngữ"],"answer":"[Danh từ/Đại từ] + [Danh từ phương vị (上, 下, 前, 后, 里, 外, v.v.)]","explanation":"Trong tiếng Trung, để chỉ vị trí của một vật, ta đặt danh từ chỉ vật đó trước từ chỉ phương vị. Các từ như 「上」 (trên), 「下」 (dưới), 「里」 (trong) luôn đứng sau danh từ gốc để xác định rõ vị trí không gian."},{"question":"Ví dụ nào minh họa “Danh từ chỉ phương hướng và vị trí”?","options":["在桌子上","我叫陈天中。","我叫白家月。","我是学生。"],"answer":"在桌子上","explanation":"在桌子上 — Ở trên bàn"},{"question":"“在桌子上” có nghĩa tiếng Việt nào?","options":["Ở trên bàn","Tôi tên là Trần Thiên Trung.","Tôi tên là Bạch Gia Nguyệt.","Tôi là học sinh."],"answer":"Ở trên bàn","explanation":"zài zhuō zi shàng — Ở trên bàn"},{"question":"Cấu trúc “[Danh từ/Đại từ] + [Danh từ phương vị (上, 下, 前, 后, 里, 外, v.v.)]” thuộc điểm ngữ pháp nào?","options":["Danh từ chỉ phương hướng và vị trí","Trật tự từ cơ bản trong câu","Câu chữ 「是」 (shì) - Câu khẳng định","Trợ từ kết cấu 的"],"answer":"Danh từ chỉ phương hướng và vị trí","explanation":"Trong tiếng Trung, để chỉ vị trí của một vật, ta đặt danh từ chỉ vật đó trước từ chỉ phương vị. Các từ như 「上」 (trên), 「下」 (dưới), 「里」 (trong) luôn đứng sau danh từ gốc để xác định rõ vị trí không gian."},{"question":"Câu “在桌子上” minh họa điểm ngữ pháp nào?","options":["Danh từ chỉ phương hướng và vị trí","Cấu trúc Số từ + Lượng từ + Danh từ","Thứ tự biểu đạt thời gian","Câu vị ngữ danh từ"],"answer":"Danh từ chỉ phương hướng và vị trí","explanation":"Đừng nhầm lẫn thứ tự: trong tiếng Trung, danh từ luôn đứng trước từ chỉ phương vị, ngược lại với tiếng Việt thường có từ 'ở' hoặc 'bên' đứng trước."}]},{"name":"Giới từ chỉ địa điểm 在","formula":"Chủ ngữ + 在 (zài) + Địa điểm + Động từ","explanation":"Giới từ 「在」 được dùng để chỉ nơi chốn mà hành động diễn ra. Bạn đặt 「在」 cùng với địa điểm ngay trước động từ để làm rõ vị trí thực hiện hành động đó.","tip":"Hãy nhớ cấu trúc này giúp bạn trả lời cho câu hỏi 'làm gì ở đâu', ví dụ: 「我在学校学习」(Tôi học ở trường).","note":"Đừng quên đặt 「在」 trước động từ, tránh nhầm lẫn đặt sau động từ như trong tiếng Việt.","examples":[{"hanzi":"我在学校学习。","pinyin":"wǒ zài xué xiào xué xí","meaning":"Tôi học ở trường."},{"hanzi":"我爸爸也在医院工作。","pinyin":"wǒ bà bà yě zài yī yuàn gōng zuò","meaning":"Bố tôi cũng làm việc ở bệnh viện."}],"quiz":[{"question":"Công thức đúng của “Giới từ chỉ địa điểm 在” là gì?","options":["Chủ ngữ + 在 (zài) + Địa điểm + Động từ","Câu trần thuật + 吗?","Chủ ngữ + 有 + Tân ngữ","Số đếm + (Lượng từ/Danh từ) đơn vị"],"answer":"Chủ ngữ + 在 (zài) + Địa điểm + Động từ","explanation":"Giới từ 「在」 được dùng để chỉ nơi chốn mà hành động diễn ra. Bạn đặt 「在」 cùng với địa điểm ngay trước động từ để làm rõ vị trí thực hiện hành động đó."},{"question":"Ví dụ nào minh họa “Giới từ chỉ địa điểm 在”?","options":["我在学校学习。","我是学生。","他是中国人。","我的中文老师"],"answer":"我在学校学习。","explanation":"我在学校学习。 — Tôi học ở trường."},{"question":"“我在学校学习。” có nghĩa tiếng Việt nào?","options":["Tôi học ở trường.","Tôi là học sinh.","Anh ấy là người Trung Quốc.","Giáo viên tiếng Trung của tôi"],"answer":"Tôi học ở trường.","explanation":"wǒ zài xué xiào xué xí — Tôi học ở trường."},{"question":"Cấu trúc “Chủ ngữ + 在 (zài) + Địa điểm + Động từ” thuộc điểm ngữ pháp nào?","options":["Giới từ chỉ địa điểm 在","Câu hỏi nghi vấn với 吗","Câu chữ 有 (biểu thị sự sở hữu)","Cách đọc và biểu đạt con số"],"answer":"Giới từ chỉ địa điểm 在","explanation":"Giới từ 「在」 được dùng để chỉ nơi chốn mà hành động diễn ra. Bạn đặt 「在」 cùng với địa điểm ngay trước động từ để làm rõ vị trí thực hiện hành động đó."},{"question":"Câu “我在学校学习。” minh họa điểm ngữ pháp nào?","options":["Giới từ chỉ địa điểm 在","Câu liên động","Đại từ nghi vấn 怎么 (làm thế nào)","Cách nói giờ giấc cụ thể"],"answer":"Giới từ chỉ địa điểm 在","explanation":"Đừng quên đặt 「在」 trước động từ, tránh nhầm lẫn đặt sau động từ như trong tiếng Việt."}]},{"name":"Động từ năng nguyện 能","formula":"Chủ ngữ + 能 + Động từ + (Tân ngữ)","explanation":"Động từ năng nguyện 「能」 được dùng trước động từ để biểu thị khả năng hoặc sự cho phép làm một việc gì đó. Bạn có thể hiểu 「能」 tương đương với \"có thể\" trong tiếng Việt.","tip":"Khi muốn phủ định, bạn chỉ cần thêm 「不」 phía trước thành 「不能」 (không thể).","note":"Khác với 「会」 (biết làm gì nhờ học tập), 「能」 thiên về khả năng khách quan hoặc sự cho phép.","examples":[{"hanzi":"我能去。","pinyin":"wǒ néng qù","meaning":"Tôi có thể đi."},{"hanzi":"星期五前能回家吗？","pinyin":"xīng qī wǔ qián néng huí jiā ma","meaning":"Trước thứ Sáu có thể về nhà không?"}],"quiz":[{"question":"Công thức đúng của “Động từ năng nguyện 能” là gì?","options":["Chủ ngữ + 能 + Động từ + (Tân ngữ)","A..., B 呢? (Cấu trúc hỏi tỉnh lược)","[Số từ] + [Lượng từ] + [Danh từ]","Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)"],"answer":"Chủ ngữ + 能 + Động từ + (Tân ngữ)","explanation":"Động từ năng nguyện 「能」 được dùng trước
