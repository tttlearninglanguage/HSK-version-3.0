 tā zìjǐ de huà 。 wǒ hé tā māma zài zuòfàn ， tóngxué men ná lái le dàngāo hé niúnǎi 。 péngyou gāoxìng de gěi dàjiā jièshào mèimei de huà 。 wǒmen chī le hěn duō dōngxi ， hái chànggē 。 tā shuō jiālǐ bù tài dà ， dàn jīntiān hěn kuàilè ， dàjiā yě shuō xià cì hái kěyǐ zàijiā yìqǐ guò shēngrì 。","grammar":["Lặp lại tính từ đơn âm tiết","Cấu trúc liệt kê “什么的”","Trợ từ kết cấu 地"],"questions":[{"id":"H2-R06-3-v2-Q1","question":"朋友请了几个同学？","answer":"五个","options":["三个","四个","六个","五个"],"explanation":"Thông tin đối chiếu trong bài: “朋友想在饭店过生日，请了五个同学。”","evidence":"朋友想在饭店过生日，请了五个同学。"},{"id":"H2-R06-3-v2-Q2","question":"饭店的一条鱼多少钱？","answer":"八十元","options":["八十元","二百元","五元","二十元"],"explanation":"Thông tin đối chiếu trong bài: “那家饭店的鱼很好吃，但一条鱼要八十元，蛋糕还要很多钱。”","evidence":"那家饭店的鱼很好吃，但一条鱼要八十元，蛋糕还要很多钱。"},{"id":"H2-R06-3-v2-Q3","question":"朋友在哪儿过生日？","answer":"家","options":["药店","家","学校的教室","洗手间"],"explanation":"Thông tin đối chiếu trong bài: “他说家里不太大，但今天很快乐，大家也说下次还可以在家一起过生日。”","evidence":"他说家里不太大，但今天很快乐，大家也说下次还可以在家一起过生日。"},{"id":"H2-R06-3-v2-Q4","question":"谁会做肉？","answer":"朋友的妈妈","options":["妹妹","儿子","朋友的妈妈","女儿"],"explanation":"Thông tin đối chiếu trong bài: “他妈妈会做肉，我会做鱼，同学可以拿一些水果来。”","evidence":"他妈妈会做肉，我会做鱼，同学可以拿一些水果来。"},{"id":"H2-R06-3-v2-Q5","question":"妹妹准备什么礼物？","answer":"生日画","options":["一只猫","中文课","中文书","生日画"],"explanation":"Thông tin đối chiếu trong bài: “他的妹妹正在画画，要送他自己的画。”","evidence":"他的妹妹正在画画，要送他自己的画。"},{"id":"H2-R06-3-v2-Q6","question":"同学们拿来了什么？","answer":"蛋糕和牛奶","options":["蛋糕和牛奶","饺子和面条儿","菜和饺子","面条儿和菜"],"explanation":"Thông tin đối chiếu trong bài: “我和他妈妈在做饭，同学们拿来了蛋糕和牛奶。”","evidence":"我和他妈妈在做饭，同学们拿来了蛋糕和牛奶。"}]},{"id":"H2-R06-4","lesson":6,"revision":2,"title":"Ông muốn ăn cá chứ không ăn bánh","text":"今天是爷爷的先生日。奶奶准备了很多菜，爸爸买了蛋糕，我画了一条长长的鱼。爷爷看见画很高兴，说自己今天想吃鱼。我问为什么不吃蛋糕，他说蛋糕很漂亮，大家晚上一起吃，现在只想和奶奶吃午饭。奶奶已经做好了肉和菜，但没有买鱼。爸爸就让我和他去超市。超市里有大的鱼，也有小的。我们买了一条不太大的，回家后奶奶说这条鱼就很好。下午爷爷在床上休息，我在房间里画画。晚上家人都来了，我们给爷爷看画，一起唱歌、吃蛋糕。爷爷说今天有鱼、有画，还有家人，很快乐。","translation":"Hôm nay sinh nhật ông. Bà làm nhiều món, bố mua bánh, tôi vẽ một con cá dài. Ông thích tranh và nói muốn ăn cá. Tôi hỏi sao không ăn bánh; ông muốn để tối cả nhà cùng ăn, trưa chỉ ăn với bà. Bà đã làm thịt, rau nhưng chưa mua cá nên bố và tôi đến siêu thị, chọn một con không quá lớn. Bà thấy vừa đủ. Chiều ông nghỉ trên giường, tôi vẽ trong phòng. Tối cả nhà đến, xem tranh rồi hát và ăn bánh. Ông vui vì có cá, có tranh và cả gia đình.","pinyin":"jīntiān shì yéye de xiānsheng rì 。 nǎinai zhǔnbèi le hěn duō cài ， bàba mǎi le dàngāo ， wǒ huà le yì tiáo cháng cháng de yú 。 yéye kàn jiàn huà hěn gāoxìng ， shuō zìjǐ jīntiān xiǎng chī yú 。 wǒ wèn wèishénme bù chī dàngāo ， tā shuō dàngāo hěn piàoliang ， dàjiā wǎnshang yìqǐ chī ， xiànzài zhǐ xiǎng hé nǎinai chī wǔfàn 。 nǎinai yǐjīng zuò hǎo le ròu hé cài ， dàn méiyǒu mǎi yú 。 bàba jiù ràng wǒ hé tā qù chāoshì 。 chāoshì lǐ yǒu dà de yú ， yě yǒu xiǎo de 。 wǒmen mǎi le yì tiáo bù tài dà de ， huíjiā hòu nǎinai shuō zhè tiáo yú jiù hěn hǎo 。 xiàwǔ yéye zài chuáng shàng xiūxi ， wǒ zài fángjiān lǐ huà huà 。 wǎnshang jiārén dōu lái le ， wǒmen gěi yéye kàn huà ， yìqǐ chànggē 、 chī dàngāo 。 yéye shuō jīntiān yǒu yú 、 yǒu huà ， háiyǒu jiārén ， hěn kuàilè 。","grammar":["Lặp lại tính từ đơn âm tiết","Cấu trúc liệt kê “什么的”","Trợ từ kết cấu 地"],"questions":[{"id":"H2-R06-4-v2-Q1","question":"谁今天过生日？","answer":"爷爷","options":["中国人","法国人","泰国人","爷爷"],"explanation":"Thông tin đối chiếu trong bài: “今天是爷爷的先生日。”","evidence":"今天是爷爷的先生日。"},{"id":"H2-R06-4-v2-Q2","question":"谁买了蛋糕？","answer":"爸爸","options":["爸爸","外国学生","朋友的妈妈","来接我的朋友"],"explanation":"Thông tin đối chiếu trong bài: “奶奶准备了很多菜，爸爸买了蛋糕，我画了一条长长的鱼。”","evidence":"奶奶准备了很多菜，爸爸买了蛋糕，我画了一条长长的鱼。"},{"id":"H2-R06-4-v2-Q3","question":"爷爷午饭想吃什么？","answer":"鱼","options":["水果","鱼","水","热水"],"explanation":"Thông tin đối chiếu trong bài: “爷爷看见画很高兴，说自己今天想吃鱼。”","evidence":"爷爷看见画很高兴，说自己今天想吃鱼。"},{"id":"H2-R06-4-v2-Q4","question":"谁和我去超市？","answer":"爸爸","options":["奶奶","中国学生","爸爸","外国学生"],"explanation":"Thông tin đối chiếu trong bài: “爸爸就让我和他去超市。”","evidence":"爸爸就让我和他去超市。"},{"id":"H2-R06-4-v2-Q5","question":"下午爷爷在哪儿休息？","answer":"床上","options":["学校的书店","前边的大教室","我家","床上"],"explanation":"Thông tin đối chiếu trong bài: “下午爷爷在床上休息，我在房间里画画。”","evidence":"下午爷爷在床上休息，我在房间里画画。"},{"id":"H2-R06-4-v2-Q6","question":"大家什么时候吃蛋糕？","answer":"晚上","options":["晚上","三点","五点","六点"],"explanation":"Thông tin đối chiếu trong bài: “我问为什么不吃蛋糕，他说蛋糕很漂亮，大家晚上一起吃，现在只想和奶奶吃午饭。”","evidence":"我问为什么不吃蛋糕，他说蛋糕很漂亮，大家晚上一起吃，现在只想和奶奶吃午饭。"}]},{"id":"H2-R06-5","lesson":6,"revision":2,"title":"Học vẽ nhưng quên bút","text":"今天上午有画画课。我早上准备好了画笔，还想给朋友拿一些面包。到了学校，朋友说他忘了自己的画笔，问能不能给他一些。我有红色、绿色和黑色的画笔，给了他绿色的和黑色的，自己拿红色的。我想画蛋糕，他想画鱼。老师过来看了看，说他的鱼太长，不是鱼，是面条儿吧！我们都很高兴。下课后，我和朋友去吃午饭。我想吃鱼，他说今天已经画了鱼，就吃肉吧。我们在学校外的饭店吃了米饭和肉。下午回家，我看见面包还在床上，知道今天没有拿给朋友。我给他打电话，说下次给他拿。今天的事很好玩儿。","translation":"Sáng nay có lớp vẽ. Tôi chuẩn bị bút và mang bánh mì cho bạn từ sáng. Đến trường bạn mới nhớ quên bút, xin dùng cùng tôi. Tôi có ba màu nên đưa bạn xanh và đen, mình giữ đỏ. Tôi vẽ bánh, bạn vẽ cá; giáo viên đến xem và đùa đây là mì chứ không phải cá, cả hai rất vui. Tan học chúng tôi đi ăn, tôi muốn cá nhưng bạn bảo đã vẽ cá rồi thì ăn thịt. Cả hai ăn cơm thịt ở quán ngoài trường. Về nhà tôi thấy bánh mì vẫn trên giường mới biết sáng đã quên mang cho bạn. Nhớ chuyện trong ngày tôi thấy rất vui.","pinyin":"jīntiān shàngwǔ yǒu huà huà kè 。 wǒ zǎoshang zhǔnbèi hǎo le huàbǐ ， hái xiǎng gěi péngyou ná yìxiē miànbāo 。 dào le xuéxiào ， péngyou shuō tā wàng le zìjǐ de huàbǐ ， wèn néng bù néng gěi tā yìxiē 。 wǒ yǒu hóngsè 、 lǜsè hé hēisè de huàbǐ ， gěi le tā lǜsè de hé hēisè de ， zìjǐ ná hóngsè de 。 wǒ xiǎng huà dàngāo ， tā xiǎng huà yú 。 lǎoshī guòlai kàn le kàn ， shuō tā de yú tài cháng ， bù shì yú ， shì miàntiáor ba ！ wǒmen dōu hěn gāoxìng 。 xià kè hòu ， wǒ hé péngyou qù chī wǔfàn 。 wǒ xiǎng chī yú ， tā shuō jīntiān yǐjīng huà le yú ， jiù chī ròu ba 。 wǒmen zài xuéxiào wài de fàndiàn chī le mǐfàn hé ròu 。 xiàwǔ huíjiā ， wǒ kàn jiàn miànbāo hái zài chuáng shàng ， zhīdào jīntiān méiyǒu ná gěi péngyou 。 wǒ gěi tā dǎ diànhuà ， shuō xià cì gěi tā ná 。 jīntiān de shì hěn hǎowánr 。","grammar":["Lặp lại tính từ đơn âm tiết","Cấu trúc liệt kê “什么的”","Trợ từ kết cấu 地"],"questions":[{"id":"H2-R06-5-v2-Q1","question":"朋友忘了拿什么？","answer":"画笔","options":["雪","衣服","手机","画笔"],"explanation":"Thông tin đối chiếu trong bài: “我早上准备好了画笔，还想给朋友拿一些面包。”","evidence":"我早上准备好了画笔，还想给朋友拿一些面包。"},{"id":"H2-R06-5-v2-Q2","question":"我给朋友什么颜色？","answer":"绿色和黑色","options":["绿色和黑色","白色和黑色","红色和黑色","绿色和白色"],"explanation":"Thông tin đối chiếu trong bài: “我有红色、绿色和黑色的画笔，给了他绿色的和黑色的，自己拿红色的。”","evidence":"我有红色、绿色和黑色的画笔，给了他绿色的和黑色的，自己拿红色的。"},{"id":"H2-R06-5-v2-Q3","question":"我自己拿什么颜色？","answer":"红色","options":["黑色","红色","绿色","白色"],"explanation":"Thông tin đối chiếu trong bài: “我有红色、绿色和黑色的画笔，给了他绿色的和黑色的，自己拿红色的。”","evidence":"我有红色、绿色和黑色的画笔，给了他绿色的和黑色的，自己拿红色的。"},{"id":"H2-R06-5-v2-Q4","question":"我想画什么？","answer":"蛋糕","options":["名字","电脑","蛋糕","我的电脑"],"explanation":"Thông tin đối chiếu trong bài: “我想画蛋糕，他想画鱼。”","evidence":"我想画蛋糕，他想画鱼。"},{"id":"H2-R06-5-v2-Q5","question":"朋友画的鱼怎么样？","answer":"太长","options":["没有了","对了","有点儿小","太长"],"explanation":"Thông tin đối chiếu trong bài: “老师过来看了看，说他的鱼太长，不是鱼，是面条儿吧！”","evidence":"老师过来看了看，说他的鱼太长，不是鱼，是面条儿吧！"},{"id":"H2-R06-5-v2-Q6","question":"我们午饭吃什么？","answer":"米饭和肉","options":["米饭和肉","热茶","饺子和面条儿","菜和饺子"],"explanation":"Thông tin đối chiếu trong bài: “我们在学校外的饭店吃了米饭和肉。”","evidence":"我们在学校外的饭店吃了米饭和肉。"}]},{"id":"H2-R07-1","lesson":7,"revision":2,"title":"Lần đầu xuống bể bơi","text":"我喜欢运动，会打篮球，但不会游泳。朋友游得很好，今天让我跟他去游泳。我有点儿不好意思，说自己一次也没游过。他说没关系，从今天开始学就可以。我们下午两点去，在外边跑了一会儿。我一到水里，就不知道怎么游。朋友让我看看他怎么游，不要只看自己的手。我学了一会儿，已经能游一点儿了。三点半，我们回到学校。朋友还想打篮球，我有点儿累，就坐下休息。他说第一次不要做太多运动，明天下课后再来。我觉得他说得对，今天游得不太好，还是很高兴。","translation":"Tôi thích thể thao, biết bóng rổ nhưng chưa biết bơi. Bạn bơi giỏi nên chiều nay rủ đi học. Tôi ngại vì chưa từng bơi, bạn động viên bắt đầu hôm nay là được. Hai giờ chúng tôi đi, chạy một chút bên ngoài rồi xuống nước. Tôi chưa biết cử động tay, bạn bảo xem cách bạn bơi thay vì chỉ nhìn tay mình. Học một lúc tôi bơi được chút ít. Ba giờ rưỡi về trường, bạn còn muốn bóng rổ nhưng tôi mệt nên nghỉ. Bạn dặn buổi đầu đừng tập quá nhiều, mai tan học lại đến. Tôi thấy đúng, dù chưa giỏi vẫn vui.","pinyin":"wǒ xǐhuan yùndòng ， huì dǎ lánqiú ， dàn bù huì yóuyǒng 。 péngyou yóu de hěn hǎo ， jīntiān ràng wǒ gēn tā qù yóuyǒng 。 wǒ yǒudiǎnr bù hǎo yìsi ， shuō zìjǐ yī cì yě méi yóu guò 。 tā shuō méi guān xi ， cóng jīntiān kāishǐ xué jiù kěyǐ 。 wǒmen xiàwǔ liǎng diǎn qù ， zài wàibian pǎo le yíhuìr 。 wǒ yī dào shuǐ lǐ ， jiù bù zhīdào zěnme yóu 。 péngyou ràng wǒ kàn kàn tā zěnme yóu ， bú yào zhǐ kàn zìjǐ de shǒu 。 wǒ xué le yíhuìr ， yǐjīng néng yóu yìdiǎnr le 。 sān diǎn bàn ， wǒmen huídào xuéxiào 。 péngyou hái xiǎng dǎ lánqiú ， wǒ yǒudiǎnr lèi ， jiù zuòxià xiūxi 。 tā shuō dì yī cì bú yào zuò tài duō yùndòng ， míngtiān xià kè hòu zài lái 。 wǒ juéde tā shuō de duì ， jīntiān yóu de bù tài hǎo ， háishi hěn gāoxìng 。","grammar":["Cấu trúc một khi... liền...","Bổ ngữ trạng thái với 得","Bổ ngữ trạng thái với 「得」"],"questions":[{"id":"H2-R07-1-v2-Q1","question":"我会做什么运动？","answer":"打篮球","options":["打篮球","跑步","踢足球","游泳"],"explanation":"Thông tin đối chiếu trong bài: “我喜欢运动，会打篮球，但不会游泳。”","evidence":"我喜欢运动，会打篮球，但不会游泳。"},{"id":"H2-R07-1-v2-Q2","question":"谁让我跟他学游泳？","answer":"朋友","options":["您","朋友","大家","你们"],"explanation":"Thông tin đối chiếu trong bài: “朋友游得很好，今天让我跟他去游泳。”","evidence":"朋友游得很好，今天让我跟他去游泳。"},{"id":"H2-R07-1-v2-Q3","question":"我们下午几点去？","answer":"两点","options":["五点","六点","两点","七点"],"explanation":"Thông tin đối chiếu trong bài: “我们下午两点去，在外边跑了一会儿。”","evidence":"我们下午两点去，在外边跑了一会儿。"},{"id":"H2-R07-1-v2-Q4","question":"我到水里觉得怎么样？","answer":"不知道怎么游","options":["太小","不太大","很远","不知道怎么游"],"explanation":"Thông tin đối chiếu trong bài: “我一到水里，就不知道怎么游。”","evidence":"我一到水里，就不知道怎么游。"},{"id":"H2-R07-1-v2-Q5","question":"我们几点回学校？","answer":"三点半","options":["三点半","一点半","两点半","十一点半"],"explanation":"Thông tin đối chiếu trong bài: “三点半，我们回到学校。”","evidence":"三点半，我们回到学校。"},{"id":"H2-R07-1-v2-Q6","question":"回学校后我做什么？","answer":"休息","options":["读书","休息","看书","看电视"],"explanation":"Thông tin đối chiếu trong bài: “朋友还想打篮球，我有点儿累，就坐下休息。”","evidence":"朋友还想打篮球，我有点儿累，就坐下休息。"}]},{"id":"H2-R07-2","lesson":7,"revision":2,"title":"Đổi giờ chạy buổi sáng","text":"我和姐姐每个星期日都去跑步。姐姐跑得快，我跑得不快。她过去一出去，就开始跑，我还在准备水。今天我们说好，早上七点在学校外见。我六点半就起床，吃了一点儿面包，再拿好水。七点姐姐来了，看见我已经在等，很高兴。我们从学校跑到书店，还从书店跑回学校。我跑完觉得有点儿累，她让我不要坐下，再走一会儿。我问她为什么今天没有跑太快。她说两个人一起运动，要知道朋友能不能一起跑。下次我想再早一点儿来，看看自己能不能跑得更好。","translation":"Chủ nhật nào tôi và chị cũng chạy. Chị chạy nhanh, tôi chậm; trước đây chị ra khỏi nhà đã chạy còn tôi vẫn chuẩn bị nước. Hôm nay hẹn bảy giờ ngoài trường nên tôi dậy sáu giờ rưỡi, ăn bánh rồi lấy nước. Chị đến vui vì tôi đã đợi. Chúng tôi chạy từ trường đến hiệu sách rồi quay lại. Tôi mệt muốn ngồi, chị bảo đi bộ thêm chút. Tôi hỏi sao hôm nay chị không chạy nhanh như mọi khi. Chị nói tập cùng phải biết bạn có theo được không. Lần sau tôi muốn đến sớm hơn để thử chạy tốt hơn.","pinyin":"wǒ hé jiějie měi gè xīngqīrì dōu qù pǎobù 。 jiějie pǎo de kuài ， wǒ pǎo de bù kuài 。 tā guòqù yī chūqù ， jiù kāishǐ pǎo ， wǒ hái zài zhǔnbèi shuǐ 。 jīntiān wǒmen shuō hǎo ， zǎoshang qī diǎn zài xuéxiào wài jiàn 。 wǒ liù diǎn bàn jiù qǐchuáng ， chī le yìdiǎnr miànbāo ， zài ná hǎo shuǐ 。 qī diǎn jiějie lái le ， kàn jiàn wǒ yǐjīng zài děng ， hěn gāoxìng 。 wǒmen cóng xuéxiào pǎo dào shūdiàn ， hái cóng shūdiàn pǎo huí xuéxiào 。 wǒ pǎo wán juéde yǒudiǎnr lèi ， tā ràng wǒ bú yào zuòxià ， zài zǒu yíhuìr 。 wǒ wèn tā wèishénme jīntiān méiyǒu pǎo tài kuài 。 tā shuō liǎng gè rén yìqǐ yùndòng ， yào zhīdào péngyou néng bù néng yìqǐ pǎo 。 xià cì wǒ xiǎng zài zǎo yìdiǎnr lái ， kàn kàn zìjǐ néng bù néng pǎo de gèng hǎo 。","grammar":["Cấu trúc một khi... liền...","Bổ ngữ trạng thái với 得","Bổ ngữ trạng thái với 「得」"],"questions":[{"id":"H2-R07-2-v2-Q1","question":"我们星期几跑步？","answer":"星期日","options":["星期日","星期二","星期三","星期四"],"explanation":"Thông tin đối chiếu trong bài: “我和姐姐每个星期日都去跑步。”","evidence":"我和姐姐每个星期日都去跑步。"},{"id":"H2-R07-2-v2-Q2","question":"我们今天几点见？","answer":"七点","options":["三点五十分","七点","五点半","三点"],"explanation":"Thông tin đối chiếu trong bài: “今天我们说好，早上七点在学校外见。”","evidence":"今天我们说好，早上七点在学校外见。"},{"id":"H2-R07-2-v2-Q3","question":"我几点起床？","answer":"六点半","options":["八点半","六点十分","六点半","下午五点"],"explanation":"Thông tin đối chiếu trong bài: “我六点半就起床，吃了一点儿面包，再拿好水。”","evidence":"我六点半就起床，吃了一点儿面包，再拿好水。"},{"id":"H2-R07-2-v2-Q4","question":"我们从学校跑到哪儿？","answer":"书店","options":["北京","西安","机场","书店"],"explanation":"Thông tin đối chiếu trong bài: “我们从学校跑到书店，还从书店跑回学校。”","evidence":"我们从学校跑到书店，还从书店跑回学校。"},{"id":"H2-R07-2-v2-Q5","question":"跑完后姐姐让我做什么？","answer":"走一会儿","options":["走一会儿","认识","做饭","做菜"],"explanation":"Thông tin đối chiếu trong bài: “我跑完觉得有点儿累，她让我不要坐下，再走一会儿。”","evidence":"我跑完觉得有点儿累，她让我不要坐下，再走一会儿。"},{"id":"H2-R07-2-v2-Q6","question":"谁跑得快？","answer":"姐姐","options":["外国学生","姐姐","朋友的妈妈","来接我的朋友"],"explanation":"Thông tin đối chiếu trong bài: “姐姐跑得快，我跑得不快。”","evidence":"姐姐跑得快，我跑得不快。"}]},{"id":"H2-R07-3","lesson":7,"revision":2,"title":"Bóng rổ hay bóng đá?","text":"下课后，朋友问我打不打篮球。我很想去，但今天只拿了足球。我让他去问问同学，有没有人拿篮球来。一个男同学说他的篮球在家，回去拿要半个小时。我们不想等，就一起踢足球。我踢得不太好，朋友让我看看大家怎么踢。我一开始就想踢得很快，球没有到朋友那边，去了学校外。我跑过去拿回来，觉得自己太快了。朋友说，运动不是只要快，还要知道朋友在哪里。我们玩了一个小时，五点半回教室拿书。今天没有打篮球，但我觉得踢球也很好玩儿，明天还想跟大家一起踢。","translation":"Tan học bạn rủ bóng rổ. Tôi muốn chơi nhưng chỉ mang bóng đá. Một bạn nam có bóng rổ ở nhà, đi lấy mất nửa giờ. Không muốn chờ nên cả nhóm chơi bóng đá. Tôi chưa giỏi, bạn bảo xem người khác đá. Tôi vội đá nhanh làm bóng ra ngoài trường, chạy đi lấy mới thấy mình quá vội. Bạn bảo không phải cứ nhanh là được, phải nhìn bạn ở đâu. Chơi một giờ, năm giờ rưỡi chúng tôi về lớp lấy sách. Tuy không chơi bóng rổ, tôi thấy bóng đá cũng vui và muốn mai chơi tiếp.","pinyin":"xià kè hòu ， péngyou wèn wǒ dǎ bù dǎ lánqiú 。 wǒ hěn xiǎng qù ， dàn jīntiān zhǐ ná le zúqiú 。 wǒ ràng tā qù wèn wèn tóngxué ， yǒu méiyǒu rén ná lánqiú lái 。 yí gè nán tóngxué shuō tā de lánqiú zàijiā ， huí qù ná yào bàn ge xiǎoshí 。 wǒmen bù xiǎng děng ， jiù yìqǐ tī zúqiú 。 wǒ tī de bù tài hǎo ， péngyou ràng wǒ kàn kàn dàjiā zěnme tī 。 wǒ yī kāishǐ jiù xiǎng tī de hěn kuài ， qiú méiyǒu dào péngyou nàbiān ， qù le xuéxiào wài 。 wǒ pǎo guòqù ná huí lái ， juéde zìjǐ tài kuài le 。 péngyou shuō ， yùndòng bù shì zhǐyào kuài ， hái yào zhīdào péngyou zài nǎlǐ 。 wǒmen wán le yí gè xiǎoshí ， wǔ diǎn bàn huí jiàoshì ná shū 。 jīntiān méiyǒu dǎ lánqiú ， dàn wǒ juéde tī qiú yě hěn hǎowánr ， míngtiān hái xiǎng gēn dàjiā yìqǐ tī 。","grammar":["Cấu trúc một khi... liền...","Bổ ngữ trạng thái với 得","Bổ ngữ trạng thái với 「得」"],"questions":[{"id":"H2-R07-3-v2-Q1","question":"我今天拿了什么球？","answer":"足球","options":["足球","我的电脑","桌子","猫"],"explanation":"Thông tin đối chiếu trong bài: “我很想去，但今天只拿了足球。”","evidence":"我很想去，但今天只拿了足球。"},{"id":"H2-R07-3-v2-Q2","question":"男同学回家拿篮球要多少时间？","answer":"半个小时","options":["两个星期","半个小时","三个星期","一个星期"],"explanation":"Thông tin đối chiếu trong bài: “一个男同学说他的篮球在家，回去拿要半个小时。”","evidence":"一个男同学说他的篮球在家，回去拿要半个小时。"},{"id":"H2-R07-3-v2-Q3","question":"我们做什么运动？","answer":"踢足球","options":["叫","想","踢足球","工作"],"explanation":"Thông tin đối chiếu trong bài: “我们不想等，就一起踢足球。”","evidence":"我们不想等，就一起踢足球。"},{"id":"H2-R07-3-v2-Q4","question":"球去了哪儿？","answer":"学校外","options":["前边","这边","饭店","学校外"],"explanation":"Thông tin đối chiếu trong bài: “我一开始就想踢得很快，球没有到朋友那边，去了学校外。”","evidence":"我一开始就想踢得很快，球没有到朋友那边，去了学校外。"},{"id":"H2-R07-3-v2-Q5","question":"我们玩了多少时间？","answer":"一个小时","options":["一个小时","八点二十分","九点二十分","三点五十分"],"explanation":"Thông tin đối chiếu trong bài: “我们玩了一个小时，五点半回教室拿书。”","evidence":"我们玩了一个小时，五点半回教室拿书。"},{"id":"H2-R07-3-v2-Q6","question":"我们几点回教室？","answer":"五点半","options":["三点五十分","五点半","三点","六点"],"explanation":"Thông tin đối chiếu trong bài: “我们玩了一个小时，五点半回教室拿书。”","evidence":"我们玩了一个小时，五点半回教室拿书。"}]},{"id":"H2-R07-4","lesson":7,"revision":2,"title":"Khi bố bắt đầu vận động","text":"爸爸在公司工作，每天坐很多时间。他说下班后很累，想回家看电视，不想运动。我让他星期六跟我去学校走走。他一开始不想去，后来看见妈妈也准备出去，就跟我们来了。学校外有很多人在跑步，有的人还和孩子一起。我和爸爸从学校走到超市，妈妈去买水果。爸爸走了一会儿觉得不错，还想自己跑一下。我让他别跑得太快。我们五点开始运动，六点回家。爸爸说，今天没有打篮球，也没有游泳，走走已经让他很高兴。他想下星期再来，还让我每天给他打电话，别让他下班就看电视。","translation":"Bố làm ở công ty, mỗi ngày ngồi lâu. Bố hay nói mệt nên về xem tivi, không muốn vận động. Tôi rủ thứ Bảy đến trường đi dạo. Ban đầu bố không muốn, thấy mẹ chuẩn bị đi mới đi cùng. Ngoài trường nhiều người chạy, có người đi cùng con. Tôi và bố đi từ trường đến siêu thị, mẹ mua trái cây. Đi một lúc bố thấy tốt, muốn chạy thử, tôi dặn đừng quá nhanh. Năm giờ bắt đầu, sáu giờ về. Không bóng rổ hay bơi, chỉ đi bộ đã làm bố vui. Bố muốn tuần sau lại đến và nhờ tôi gọi nhắc để tan làm đừng chỉ xem tivi.","pinyin":"bàba zài gōngsī gōngzuò ， měi tiān zuò hěn duō shíjiān 。 tā shuō xiàbān hòu hěn lèi ， xiǎng huíjiā kàn diànshì ， bù xiǎng yùndòng 。 wǒ ràng tā xīngqī liù gēn wǒ qù xuéxiào zǒu zǒu 。 tā yī kāishǐ bù xiǎng qù ， hòulái kàn jiàn māma yě zhǔnbèi chūqù ， jiù gēn wǒmen lái le 。 xuéxiào wài yǒu hěn duō rén zài pǎobù ， yǒude rén hái hé háizi yìqǐ 。 wǒ hé bàba cóng xuéxiào zǒu dào chāoshì ， māma qù mǎi shuǐguǒ 。 bàba zǒu le yíhuìr juéde búcuò ， hái xiǎng zìjǐ pǎo yíxià 。 wǒ ràng tā bié pǎo de tài kuài 。 wǒmen wǔ diǎn kāishǐ yùndòng ， liù diǎn huíjiā 。 bàba shuō ， jīntiān méiyǒu dǎ lánqiú ， yě méiyǒu yóuyǒng ， zǒu zǒu yǐjīng ràng tā hěn gāoxìng 。 tā xiǎng xià xīngqī zài lái ， hái ràng wǒ měi tiān gěi tā dǎ diànhuà ， bié ràng tā xiàbān jiù kàn diànshì 。","grammar":["Cấu trúc một khi... liền...","Bổ ngữ trạng thái với 得","Bổ ngữ trạng thái với 「得」"],"questions":[{"id":"H2-R07-4-v2-Q1","question":"爸爸下班后想做什么？","answer":"看电视","options":["看电视","看电影","读书","看书"],"explanation":"Thông tin đối chiếu trong bài: “他说下班后很累，想回家看电视，不想运动。”","evidence":"他说下班后很累，想回家看电视，不想运动。"},{"id":"H2-R07-4-v2-Q2","question":"星期六谁跟我们一起运动？","answer":"爸爸","options":["女儿","爸爸","他","弟弟"],"explanation":"Thông tin đối chiếu trong bài: “我让他星期六跟我去学校走走。”","evidence":"我让他星期六跟我去学校走走。"},{"id":"H2-R07-4-v2-Q3","question":"我和爸爸从学校走到哪儿？","answer":"超市","options":["前边","这边","超市","饭店"],"explanation":"Thông tin đối chiếu trong bài: “我和爸爸从学校走到超市，妈妈去买水果。”","evidence":"我和爸爸从学校走到超市，妈妈去买水果。"},{"id":"H2-R07-4-v2-Q4","question":"妈妈去买什么？","answer":"水果","options":["蛋糕和牛奶","面包和牛奶","热茶","水果"],"explanation":"Thông tin đối chiếu trong bài: “我和爸爸从学校走到超市，妈妈去买水果。”","evidence":"我和爸爸从学校走到超市，妈妈去买水果。"},{"id":"H2-R07-4-v2-Q5","question":"我们几点开始运动？","answer":"五点","options":["五点","十一点半","八点二十分","九点二十分"],"explanation":"Thông tin đối chiếu trong bài: “我们五点开始运动，六点回家。”","evidence":"我们五点开始运动，六点回家。"},{"id":"H2-R07-4-v2-Q6","question":"我们几点回家？","answer":"六点","options":["九点","六点","十点","七点半"],"explanation":"Thông tin đối chiếu trong bài: “我们五点开始运动，六点回家。”","evidence":"我们五点开始运动，六点回家。"}]},{"id":"H2-R07-5","lesson":7,"revision":2,"title":"Ai hát hay thì hát, ai chơi bóng thì chơi","text":"学校今天下午没有课，同学们想做一些自己喜欢的事。有两个同学唱歌唱得很好，想在教室里唱给大家听。我喜欢运动，和三名同学去打篮球。我们说好四点回教室，再一起去吃饭。一开始，大家都想自己拿球，不想给别人，球很快就到外边去了。我说，还是看一看朋友在哪儿，再给他球。我们再打，就觉得不错了。三点半，唱歌的同学过来找我们，说老师也想打球。老师打得很好，让我们都很高兴。四点，我们回教室拿东西，一起吃面条儿。我觉得唱歌和运动都好，知道自己喜欢什么就很好。","translation":"Chiều nay không học, các bạn chọn việc yêu thích. Hai bạn hát hay muốn hát trong lớp, tôi cùng ba bạn khác chơi bóng rổ. Hẹn bốn giờ về lớp rồi đi ăn. Lúc đầu ai cũng muốn giữ bóng, không đưa bạn nên bóng nhanh ra ngoài. Tôi đề nghị nhìn bạn rồi chuyền. Chơi lại thấy khá hơn. Ba giờ rưỡi các bạn hát đến báo giáo viên cũng muốn chơi. Thầy cô chơi giỏi làm mọi người vui. Bốn giờ cả nhóm lấy đồ rồi ăn mì. Tôi thấy ca hát hay thể thao đều tốt, miễn biết mình thích gì.","pinyin":"xuéxiào jīntiān xiàwǔ méiyǒu kè ， tóngxué men xiǎng zuò yìxiē zìjǐ xǐhuan de shì 。 yǒu liǎng gè tóngxué chànggē chàng de hěn hǎo ， xiǎng zài jiàoshì lǐ chàng gěi dàjiā tīng 。 wǒ xǐhuan yùndòng ， hé sān míng tóngxué qù dǎ lánqiú 。 wǒmen shuō hǎo sì diǎn huí jiàoshì ， zài yìqǐ qù chīfàn 。 yī kāishǐ ， dàjiā dōu xiǎng zìjǐ ná qiú ， bù xiǎng gěi biérén ， qiú hěn kuài jiù dào wàibian qù le 。 wǒ shuō ， háishi kàn yī kàn péngyou zài nǎr ， zài gěi tā qiú 。 wǒmen zài dǎ ， jiù juéde búcuò le 。 sān diǎn bàn ， chànggē de tóngxué guòlai zhǎo wǒmen ， shuō lǎoshī yě xiǎng dǎqiú 。 lǎoshī dǎ de hěn hǎo ， ràng wǒmen dōu hěn gāoxìng 。 sì diǎn ， wǒmen huí jiàoshì ná dōngxi ， yìqǐ chī miàntiáor 。 wǒ juéde chànggē hé yùndòng dōu hǎo ， zhīdào zìjǐ xǐhuan shénme jiù hěn hǎo 。","grammar":["Cấu trúc một khi... liền...","Bổ ngữ trạng thái với 得","Bổ ngữ trạng thái với 「得」"],"questions":[{"id":"H2-R07-5-v2-Q1","question":"唱歌唱得好的有几个同学？","answer":"两个","options":["两个","八个","九个","十个"],"explanation":"Thông tin đối chiếu trong bài: “有两个同学唱歌唱得很好，想在教室里唱给大家听。”","evidence":"有两个同学唱歌唱得很好，想在教室里唱给大家听。"},{"id":"H2-R07-5-v2-Q2","question":"我和几名同学打篮球？","answer":"三名","options":["三十多名","三名","两名","四名"],"explanation":"Thông tin đối chiếu trong bài: “我喜欢运动，和三名同学去打篮球。”","evidence":"我喜欢运动，和三名同学去打篮球。"},{"id":"H2-R07-5-v2-Q3","question":"我们说好几点回教室？","answer":"四点","options":["九点二十分","三点五十分","四点","五点半"],"explanation":"Thông tin đối chiếu trong bài: “我们说好四点回教室，再一起去吃饭。”","evidence":"我们说好四点回教室，再一起去吃饭。"},{"id":"H2-R07-5-v2-Q4","question":"唱歌的同学几点来找我们？","answer":"三点半","options":["三点五十分","五点半","五点","三点半"],"explanation":"Thông tin đối chiếu trong bài: “三点半，唱歌的同学过来找我们，说老师也想打球。”","evidence":"三点半，唱歌的同学过来找我们，说老师也想打球。"},{"id":"H2-R07-5-v2-Q5","question":"谁也来打球？","answer":"老师","options":["老师","泰国人","爷爷","奶奶"],"explanation":"Thông tin đối chiếu trong bài: “三点半，唱歌的同学过来找我们，说老师也想打球。”","evidence":"三点半，唱歌的同学过来找我们，说老师也想打球。"},{"id":"H2-R07-5-v2-Q6","question":"我们一起吃什么？","answer":"面条儿","options":["一些菜","面条儿","牛奶","包子"],"explanation":"Thông tin đối chiếu trong bài: “四点，我们回教室拿东西，一起吃面条儿。”","evidence":"四点，我们回教室拿东西，一起吃面条儿。"}]},{"id":"H2-R08-1","lesson":8,"revision":2,"title":"Chọn đồng hồ cho bố","text":"爸爸的手表已经有很多年了，妈妈想给他买一个新的。星期日我们去商场，看见两个手表，一个二百元，一个三百元。贵的比便宜的大，也更好看。我想买贵的，妈妈说爸爸的手不大，小的就可以。售货员让我试试，我觉得小的更舒服。虽然大的漂亮，但是爸爸每天上班，看时间就好，不要太贵。我们买了二百元的，还去给爸爸买花。妈妈让我拿一个杯子，她说桌子左边的就可以。回家后，我们给爸爸手表，他说小的很好，还让我看看现在几点。我看见他很高兴，觉得妈妈说得对。","translation":"Đồng hồ bố dùng nhiều năm, mẹ muốn mua mới. Chủ nhật ở trung tâm thương mại có hai chiếc hai trăm và ba trăm tệ. Chiếc đắt lớn và đẹp hơn. Tôi thích chiếc đắt, mẹ bảo tay bố không lớn nên chiếc nhỏ vừa. Thử thấy nhỏ thoải mái hơn. Dù chiếc lớn đẹp, đi làm chỉ cần xem giờ, không cần quá đắt. Chúng tôi mua chiếc hai trăm và mua hoa. Mẹ bảo lấy chiếc cốc bên trái bàn. Về nhà tặng, bố thích chiếc nhỏ và bảo tôi xem giờ. Tôi thấy mẹ chọn đúng.","pinyin":"bàba de shǒubiǎo yǐjīng yǒu hěn duō nián le ， māma xiǎng gěi tā mǎi yí gè xīn de 。 xīngqīrì wǒmen qù shāngchǎng ， kàn jiàn liǎng gè shǒubiǎo ， yí gè èr bǎi yuán ， yí gè sān bǎi yuán 。 guì de bǐ piányi de dà ， yě gèng hǎokàn 。 wǒ xiǎng mǎi guì de ， māma shuō bàba de shǒu búdà ， xiǎo de jiù kěyǐ 。 shòuhuòyuán ràng wǒ shì shì ， wǒ juéde xiǎo de gèng shūfu 。 suīrán dà de piàoliang ， dànshì bàba měi tiānshàng bān ， kàn shíjiān jiù hǎo ， bú yào tài guì 。 wǒmen mǎi le èr bǎi yuán de ， hái qù gěi bàba mǎi huā 。 māma ràng wǒ ná yí gè bēizi ， tā shuō zhuōzi zuǒbian de jiù kěyǐ 。 huíjiā hòu ， wǒmen gěi bàba shǒubiǎo ， tā shuō xiǎo de hěn hǎo ， hái ràng wǒ kàn kàn xiànzài jǐ diǎn 。 wǒ kàn jiàn tā hěn gāoxìng ， juéde māma shuō de duì 。","grammar":["Câu so sánh hơn với 比","Câu so sánh 比 với 更/还","Cấu trúc câu nhượng bộ Tuy... nhưng"],"questions":[{"id":"H2-R08-1-v2-Q1","question":"大的手表多少钱？","answer":"三百元","options":["二十元","三百元","三十元","六十元"],"explanation":"Thông tin đối chiếu trong bài: “星期日我们去商场，看见两个手表，一个二百元，一个三百元。”","evidence":"星期日我们去商场，看见两个手表，一个二百元，一个三百元。"},{"id":"H2-R08-1-v2-Q2","question":"妈妈觉得爸爸要拿哪个？","answer":"小的","options":["一个杯子","一本书","小的","雪"],"explanation":"Thông tin đối chiếu trong bài: “我想买贵的，妈妈说爸爸的手不大，小的就可以。”","evidence":"我想买贵的，妈妈说爸爸的手不大，小的就可以。"},{"id":"H2-R08-1-v2-Q3","question":"哪个手表更大？","answer":"贵的","options":["大杯子","书里的问题","生日画","贵的"],"explanation":"Thông tin đối chiếu trong bài: “贵的比便宜的大，也更好看。”","evidence":"贵的比便宜的大，也更好看。"},{"id":"H2-R08-1-v2-Q4","question":"我们买的手表多少钱？","answer":"二百元","options":["二百元","五元","二十元","三十元"],"explanation":"Thông tin đối chiếu trong bài: “星期日我们去商场，看见两个手表，一个二百元，一个三百元。”","evidence":"星期日我们去商场，看见两个手表，一个二百元，一个三百元。"},{"id":"H2-R08-1-v2-Q5","question":"杯子在桌子哪边？","answer":"左边","options":["学校的书店","左边","前边的大教室","我家"],"explanation":"Thông tin đối chiếu trong bài: “妈妈让我拿一个杯子，她说桌子左边的就可以。”","evidence":"妈妈让我拿一个杯子，她说桌子左边的就可以。"},{"id":"H2-R08-1-v2-Q6","question":"礼物是给谁的？","answer":"爸爸","options":["他","弟弟","爸爸","朋友"],"explanation":"Thông tin đối chiếu trong bài: “爸爸的手表已经有很多年了，妈妈想给他买一个新的。”","evidence":"爸爸的手表已经有很多年了，妈妈想给他买一个新的。"}]},{"id":"H2-R08-2","lesson":8,"revision":2,"title":"Chọn suất phim sớm hơn","text":"今天晚上，我和妻子想去看电影。我喜欢有意思的电影，她想看爱情片。电影院有两个电影，一个七点开始，一个八点半开始。爱情片是八点半的，她觉得有点儿晚，明天还要早起床。我说虽然我已经看过七点的电影，但是觉得很好看，可以再看一次。妻子让我介绍一下，我说电影里有一个爱唱歌的老师，还有一些喜欢运动的学生。她觉得不错，我们就买了七点的票。下班后她在电影院左边的饭馆等我。饭馆比学校的贵一点儿，但面条儿很好吃。我们六点半吃完，去看电影。回家后，她说下次再去看爱情片。","translation":"Tối nay tôi và vợ muốn xem phim. Tôi thích phim thú vị, cô ấy muốn phim tình cảm. Có suất bảy giờ và tám giờ rưỡi; phim tình cảm chiếu muộn, mai cô ấy phải dậy sớm. Dù tôi đã xem phim bảy giờ, tôi sẵn lòng xem lại vì hay. Vợ nghe tôi kể về giáo viên thích hát và các học sinh mê thể thao, thấy được nên mua suất bảy giờ. Tan làm cô ấy đợi tôi ở quán bên trái rạp. Quán đắt hơn quán trường một chút nhưng mì ngon. Sáu giờ rưỡi ăn xong đi xem. Về nhà cô ấy hẹn lần sau xem phim tình cảm.","pinyin":"jīntiān wǎnshang ， wǒ hé qīzi xiǎng qù kàn diànyǐng 。 wǒ xǐhuan yǒu yì si de diànyǐng ， tā xiǎng kàn àiqíngpiàn 。 diànyǐngyuàn yǒu liǎng gè diànyǐng ， yí gè qī diǎn kāishǐ ， yí gè bā diǎn bàn kāishǐ 。 àiqíngpiàn shì bā diǎn bàn de ， tā juéde yǒudiǎnr wǎn ， míngtiān hái yào zǎo qǐchuáng 。 wǒ shuō suīrán wǒ yǐjīng kàn guò qī diǎn de diànyǐng ， dànshì juéde hěn hǎokàn ， kěyǐ zài kàn yī cì 。 qīzi ràng wǒ jièshào yíxià ， wǒ shuō diànyǐng lǐ yǒu yí gè ài chànggē de lǎoshī ， háiyǒu yìxiē xǐhuan yùndòng de xuésheng 。 tā juéde búcuò ， wǒmen jiù mǎi le qī diǎn de piào 。 xiàbān hòu tā zài diànyǐngyuàn zuǒbian de fànguǎn děng wǒ 。 fànguǎn bǐ xuéxiào de guì yìdiǎnr ， dàn miàntiáor hěn hǎochī 。 wǒmen liù diǎn bàn chī wán ， qù kàn diànyǐng 。 huíjiā hòu ， tā shuō xià cì zài qù kàn àiqíngpiàn 。","grammar":["Câu so sánh hơn với 比","Câu so sánh 比 với 更/还","Cấu trúc câu nhượng bộ Tuy... nhưng"],"questions":[{"id":"H2-R08-2-v2-Q1","question":"妻子想看什么电影？","answer":"爱情片","options":["书","爱情片","医","杯子"],"explanation":"Thông tin đối chiếu trong bài: “我喜欢有意思的电影，她想看爱情片。”","evidence":"我喜欢有意思的电影，她想看爱情片。"},{"id":"H2-R08-2-v2-Q2","question":"爱情片几点开始？","answer":"八点半","options":["七点半","六点十分","八点半","下午五点"],"explanation":"Thông tin đối chiếu trong bài: “爱情片是八点半的，她觉得有点儿晚，明天还要早起床。”","evidence":"爱情片是八点半的，她觉得有点儿晚，明天还要早起床。"},{"id":"H2-R08-2-v2-Q3","question":"我们买了几点的票？","answer":"七点","options":["九点二十分","三点五十分","五点半","七点"],"explanation":"Thông tin đối chiếu trong bài: “她觉得不错，我们就买了七点的票。”","evidence":"她觉得不错，我们就买了七点的票。"},{"id":"H2-R08-2-v2-Q4","question":"妻子在哪儿等我？","answer":"电影院左边的饭馆","options":["电影院左边的饭馆","药店","学校的教室","洗手间"],"explanation":"Thông tin đối chiếu trong bài: “下班后她在电影院左边的饭馆等我。”","evidence":"下班后她在电影院左边的饭馆等我。"},{"id":"H2-R08-2-v2-Q5","question":"饭馆比学校的贵还是便宜？","answer":"贵一点儿","options":["休息","贵一点儿","不休息","去"],"explanation":"Thông tin đối chiếu trong bài: “饭馆比学校的贵一点儿，但面条儿很好吃。”","evidence":"饭馆比学校的贵一点儿，但面条儿很好吃。"},{"id":"H2-R08-2-v2-Q6","question":"我们几点吃完饭？","answer":"六点半","options":["十一点半","八点二十分","六点半","九点二十分"],"explanation":"Thông tin đối chiếu trong bài: “我们六点半吃完，去看电影。”","evidence":"我们六点半吃完，去看电影。"}]},{"id":"H2-R08-3","lesson":8,"revision":2,"title":"Hai vợ chồng chia việc nhà","text":"姐姐和丈夫都在医院工作。虽然姐姐下班早，但是有时很累，回来就想休息。丈夫喜欢做饭，每天晚上做米饭和菜。姐姐觉得自己不能只休息，就准备吃完饭洗杯子。星期六他们请我们去家里吃饭。我看见房间左边有很多花，右边是姐姐买的新电脑。姐姐说，花是丈夫送的，比商场里的更好看。吃饭的时候，爸爸问谁做的鱼这么好吃，丈夫不好意思，说是他做的。姐姐很高兴，说他做饭比自己好。饭后，我想帮忙，姐姐让我和妹妹看电视，她去洗东西。回家的时候，我想自己也要多学做饭，不能每次都让妈妈做。","translation":"Chị gái và chồng cùng làm ở bệnh viện. Dù tan sớm, chị có lúc mệt nên muốn nghỉ. Anh thích nấu, tối nào cũng làm cơm. Chị không muốn chỉ nghỉ nên nhận rửa cốc sau bữa ăn. Thứ Bảy họ mời cả nhà. Tôi thấy bên trái có nhiều hoa, bên phải là máy tính mới của chị. Hoa anh tặng, chị khen đẹp hơn ở trung tâm thương mại. Bố hỏi ai nấu cá ngon, anh ngại ngùng nhận. Chị cười, khen anh nấu giỏi hơn mình. Tôi muốn giúp sau bữa nhưng chị bảo tôi xem tivi với em, chị rửa đồ. Tôi muốn học nấu nhiều hơn để không phải luôn nhờ mẹ.","pinyin":"jiějie hé zhàngfu dōu zài yīyuàn gōngzuò 。 suīrán jiějie xiàbān zǎo ， dànshì yǒushí hěn lèi ， huí lái jiù xiǎng xiūxi 。 zhàngfu xǐhuan zuòfàn ， měi tiān wǎnshang zuò mǐfàn hé cài 。 jiějie juéde zìjǐ bù néng zhǐ xiūxi ， jiù zhǔnbèi chī wán fàn xǐ bēizi 。 xīngqī liù tāmen qǐng wǒmen qù jiālǐ chīfàn 。 wǒ kàn jiàn fángjiān zuǒbian yǒu hěn duō huā ， yòubian shì jiějie mǎi de xīn diànnǎo 。 jiějie shuō ， huā shì zhàngfu sòng de ， bǐ shāngchǎng lǐ de gèng hǎokàn 。 chīfàn de shíhou ， bàba wèn shéi zuò de yú zhème hǎochī ， zhàngfu bù hǎo yìsi ， shuō shì tā zuò de 。 jiějie hěn gāoxìng ， shuō tā zuòfàn bǐ zìjǐ hǎo 。 fàn hòu ， wǒ xiǎng bāngmáng ， jiějie ràng wǒ hé mèimei kàn diànshì ， tā qù xǐ dōngxi 。 huíjiā de shíhou ， wǒ xiǎng zìjǐ yě yào duō xué zuòfàn ， bù néng měi cì dōu ràng māma zuò 。","grammar":["Câu so sánh hơn với 比","Câu so sánh 比 với 更/还","Cấu trúc câu nhượng bộ Tuy... nhưng"],"questions":[{"id":"H2-R08-3-v2-Q1","question":"姐姐和丈夫在哪儿工作？","answer":"医院","options":["超市","医院","那边","电影院"],"explanation":"Thông tin đối chiếu trong bài: “姐姐和丈夫都在医院工作。”","evidence":"姐姐和丈夫都在医院工作。"},{"id":"H2-R08-3-v2-Q2","question":"谁每天晚上做饭？","answer":"丈夫","options":["她","我们","丈夫","爸爸"],"explanation":"Thông tin đối chiếu trong bài: “丈夫喜欢做饭，每天晚上做米饭和菜。”","evidence":"丈夫喜欢做饭，每天晚上做米饭和菜。"},{"id":"H2-R08-3-v2-Q3","question":"姐姐准备吃完饭做什么？","answer":"洗杯子","options":["游泳","洗菜","买菜","洗杯子"],"explanation":"Thông tin đối chiếu trong bài: “姐姐觉得自己不能只休息，就准备吃完饭洗杯子。”","evidence":"姐姐觉得自己不能只休息，就准备吃完饭洗杯子。"},{"id":"H2-R08-3-v2-Q4","question":"花是谁送的？","answer":"丈夫","options":["丈夫","爸爸","妈妈","哥哥"],"explanation":"Thông tin đối chiếu trong bài: “姐姐说，花是丈夫送的，比商场里的更好看。”","evidence":"姐姐说，花是丈夫送的，比商场里的更好看。"},{"id":"H2-R08-3-v2-Q5","question":"谁做了好吃的鱼？","answer":"丈夫","options":["我","丈夫","你","老师"],"explanation":"Thông tin đối chiếu trong bài: “吃饭的时候，爸爸问谁做的鱼这么好吃，丈夫不好意思，说是他做的。”","evidence":"吃饭的时候，爸爸问谁做的鱼这么好吃，丈夫不好意思，说是他做的。"},{"id":"H2-R08-3-v2-Q6","question":"饭后姐姐让我和妹妹做什么？","answer":"看电视","options":["下班","看电影","看电视","读书"],"explanation":"Thông tin đối chiếu trong bài: “饭后，我想帮忙，姐姐让我和妹妹看电视，她去洗东西。”","evidence":"饭后，我想帮忙，姐姐让我和妹妹看电视，她去洗东西。"}]},{"id":"H2-R08-4","lesson":8,"revision":2,"title":"Chọn bên trái hay bên phải?","text":"我和朋友第一次去那家商场，想给妈妈买衣服。进去后，左边是红色的，右边是白色的。我记得妈妈喜欢白色，就想去右边。朋友说，红色的比白色的便宜，试试也可以。售货员拿了一件给我看，虽然颜色好看，但是有点儿小。我给妈妈打电话，让她下班后来看看。妈妈六点到了，试了左边的，也试了右边的，还是买了白色的。她说衣服比过去的长一点儿，穿了很舒服。我问她要不要再买一个手表，她说手表已经有了，我们还是去吃饭吧。我们去饭馆吃了鱼，妈妈让我下次别给她买太多东西。","translation":"Tôi cùng bạn lần đầu đến trung tâm thương mại mua áo cho mẹ. Bên trái đỏ, bên phải trắng. Nhớ mẹ thích trắng nên tôi muốn sang phải. Bạn bảo đỏ rẻ hơn, cứ thử xem. Chiếc người bán đưa đẹp nhưng hơi nhỏ nên tôi gọi mẹ tan làm đến thử. Sáu giờ mẹ đến, thử cả hai bên rồi chọn trắng. Mẹ thấy dài hơn áo cũ chút và mặc thoải mái. Tôi muốn mua thêm đồng hồ nhưng mẹ đã có, đề nghị đi ăn. Chúng tôi ăn cá ở quán, mẹ dặn lần sau đừng tốn nhiều tiền mua cho mẹ.","pinyin":"wǒ hé péngyou dì yī cì qù nà jiā shāngchǎng ， xiǎng gěi māma mǎi yīfu 。 jìnqù hòu ， zuǒbian shì hóngsè de ， yòubian shì báisè de 。 wǒ jìde māma xǐhuan báisè ， jiù xiǎng qù yòubian 。 péngyou shuō ， hóngsè de bǐ báisè de piányi ， shì shì yě kěyǐ 。 shòuhuòyuán ná le yí jiàn gěi wǒ kàn ， suīrán yánsè hǎokàn ， dànshì yǒudiǎnr xiǎo 。 wǒ gěi māma dǎ diànhuà ， ràng tā xiàbān hòulái kàn kàn 。 māma liù diǎn dào le ， shì le zuǒbian de ， yě shì le yòubian de ， háishi mǎi le báisè de 。 tā shuō yīfu bǐ guòqù de cháng yìdiǎnr ， chuān le hěn shūfu 。 wǒ wèn tā yào bú yào zài mǎi yí gè shǒubiǎo ， tā shuō shǒubiǎo yǐjīng yǒu le ， wǒmen háishi qù chīfàn ba 。 wǒmen qù fànguǎn chī le yú ， māma ràng wǒ xià cì bié gěi tā mǎi tài duō dōngxi 。","grammar":["Câu so sánh hơn với 比","Câu so sánh 比 với 更/还","Cấu trúc câu nhượng bộ Tuy... nhưng"],"questions":[{"id":"H2-R08-4-v2-Q1","question":"左边的衣服是什么颜色？","answer":"红色","options":["黑色","红色","绿色","白色"],"explanation":"Thông tin đối chiếu trong bài: “进去后，左边是红色的，右边是白色的。”","evidence":"进去后，左边是红色的，右边是白色的。"},{"id":"H2-R08-4-v2-Q2","question":"妈妈喜欢什么颜色？","answer":"白色","options":["绿色","红色","白色","黑色"],"explanation":"Thông tin đối chiếu trong bài: “我记得妈妈喜欢白色，就想去右边。”","evidence":"我记得妈妈喜欢白色，就想去右边。"},{"id":"H2-R08-4-v2-Q3","question":"哪个颜色的更便宜？","answer":"红色","options":["黑色","绿色","白色","红色"],"explanation":"Thông tin đối chiếu trong bài: “朋友说，红色的比白色的便宜，试试也可以。”","evidence":"朋友说，红色的比白色的便宜，试试也可以。"},{"id":"H2-R08-4-v2-Q4","question":"妈妈几点来商场？","answer":"六点","options":["六点","九点二十分","三点五十分","五点半"],"explanation":"Thông tin đối chiếu trong bài: “妈妈六点到了，试了左边的，也试了右边的，还是买了白色的。”","evidence":"妈妈六点到了，试了左边的，也试了右边的，还是买了白色的。"},{"id":"H2-R08-4-v2-Q5","question":"妈妈买了哪个颜色的？","answer":"白色","options":["绿色","白色","红色","黑色"],"explanation":"Thông tin đối chiếu trong bài: “妈妈六点到了，试了左边的，也试了右边的，还是买了白色的。”","evidence":"妈妈六点到了，试了左边的，也试了右边的，还是买了白色的。"},{"id":"H2-R08-4-v2-Q6","question":"妈妈要买新手表吗？","answer":"不要","options":["不太大","很远","不要","累"],"explanation":"Thông tin đối chiếu trong bài: “我问她要不要再买一个手表，她说手表已经有了，我们还是去吃饭吧。”","evidence":"我问她要不要再买一个手表，她说手表已经有了，我们还是去吃饭吧。"}]},{"id":"H2-R08-5","lesson":8,"revision":2,"title":"Hoa và một buổi tối ở nhà","text":"我和妻子已经认识三年了。昨天我想送她花，再一起去看爱情片。她下班的时候给我打电话，说今天比昨天累，想早一点儿回家。我说那就在家吃饭吧。我去买了她喜欢的红色花，还买了鱼和面条儿。回家后，我觉得自己做的鱼不太好吃，就问她要不要去饭馆。她很高兴：虽然鱼没有饭馆的好吃，但是面条儿很好，花也漂亮，我们就在家吃。吃完饭，我们在电脑上看了过去看过的电影。她记得很多意思，我有时已经忘了。我们说了很多三年前的事，觉得今天不出去也很好。","translation":"Tôi và vợ đã quen nhau ba năm. Hôm qua tôi muốn tặng hoa và xem phim tình cảm, nhưng cô ấy tan làm mệt hơn hôm trước, muốn về sớm. Tôi đổi sang ăn ở nhà, mua hoa đỏ cô ấy thích, cá và mì. Cá tự nấu chưa ngon nên tôi hỏi ra quán không. Vợ cười, bảo dù cá không bằng quán nhưng mì ngon, hoa đẹp, ở nhà được rồi. Ăn xong chúng tôi xem lại phim trên máy tính. Cô ấy nhớ nhiều chi tiết mà tôi quên. Kể những chuyện ba năm trước, cả hai thấy không ra ngoài vẫn rất vui.","pinyin":"wǒ hé qīzi yǐjīng rènshi sān nián le 。 zuótiān wǒ xiǎng sòng tā huā ， zài yìqǐ qù kàn àiqíngpiàn 。 tā xiàbān de shíhou gěi wǒ dǎ diànhuà ， shuō jīntiān bǐ zuótiān lèi ， xiǎng zǎo yìdiǎnr huíjiā 。 wǒ shuō nà jiù zàijiā chīfàn ba 。 wǒ qù mǎi le tā xǐhuan de hóngsè huā ， hái mǎi le yú hé miàntiáor 。 huíjiā hòu ， wǒ juéde zìjǐ zuò de yú bù tài hǎochī ， jiù wèn tā yào bú yào qù fànguǎn 。 tā hěn gāoxìng ： suīrán yú méiyǒu fànguǎn de hǎochī ， dànshì miàntiáor hěn hǎo ， huā yě piàoliang ， wǒmen jiù zàijiā chī 。 chī wán fàn ， wǒmen zài diànnǎo shàng kàn le guòqù kàn guò de diànyǐng 。 tā jìde hěn duō yìsi ， wǒ yǒushí yǐjīng wàng le 。 wǒmen shuō le hěn duō sān nián qián de shì ， juéde jīntiān bù chūqù yě hěn hǎo 。","grammar":["Câu so sánh hơn với 比","Câu so sánh 比 với 更/还","Cấu trúc câu nhượng bộ Tuy... nhưng"],"questions":[{"id":"H2-R08-5-v2-Q1","question":"我想送妻子什么？","answer":"花","options":["雪","花","衣服","手机"],"explanation":"Thông tin đối chiếu trong bài: “昨天我想送她花，再一起去看爱情片。”","evidence":"昨天我想送她花，再一起去看爱情片。"},{"id":"H2-R08-5-v2-Q2","question":"妻子今天比昨天怎么样？","answer":"累","options":["有","没有","累","很忙"],"explanation":"Thông tin đối chiếu trong bài: “她下班的时候给我打电话，说今天比昨天累，想早一点儿回家。”","evidence":"她下班的时候给我打电话，说今天比昨天累，想早一点儿回家。"},{"id":"H2-R08-5-v2-Q3","question":"妻子想早一点儿去哪儿？","answer":"回家","options":["做鱼","画画","准备晚饭","回家"],"explanation":"Thông tin đối chiếu trong bài: “她下班的时候给我打电话，说今天比昨天累，想早一点儿回家。”","evidence":"她下班的时候给我打电话，说今天比昨天累，想早一点儿回家。"},{"id":"H2-R08-5-v2-Q4","question":"我们在哪儿吃饭？","answer":"家","options":["家","后","大房间","小房间"],"explanation":"Thông tin đối chiếu trong bài: “她很高兴：虽然鱼没有饭馆的好吃，但是面条儿很好，花也漂亮，我们就在家吃。”","evidence":"她很高兴：虽然鱼没有饭馆的好吃，但是面条儿很好，花也漂亮，我们就在家吃。"},{"id":"H2-R08-5-v2-Q5","question":"妻子觉得什么很好吃？","answer":"面条儿","options":["热牛奶","面条儿","一杯水","鸡蛋"],"explanation":"Thông tin đối chiếu trong bài: “她很高兴：虽然鱼没有饭馆的好吃，但是面条儿很好，花也漂亮，我们就在家吃。”","evidence":"她很高兴：虽然鱼没有饭馆的好吃，但是面条儿很好，花也漂亮，我们就在家吃。"},{"id":"H2-R08-5-v2-Q6","question":"我们在哪儿看电影？","answer":"电脑上","options":["书店外","学校的书店","电脑上","前边的大教室"],"explanation":"Thông tin đối chiếu trong bài: “吃完饭，我们在电脑上看了过去看过的电影。”","evidence":"吃完饭，我们在电脑上看了过去看过的电影。"}]},{"id":"H2-R09-1","lesson":9,"revision":2,"title":"Ngôi nhà mới xa trường hơn","text":"我过去住在学校前边，走路五分钟就到教室。现在我和爸爸妈妈住在医院旁边，房间比过去的大，也有一个小书店。我很喜欢那里，但离学校远了，坐公交车要半个小时。我每天早上七点出去，八点上课。朋友的家离学校很近，他说我可以到他家住。我知道他一个人住，房间不大，就没有去。这个星期六，他来我家看我。我们在旁边的书店看书，还去饭馆喝咖啡。朋友说这里的书店和学校的一样好，下次他还想来。我想，家远一点儿也没关系，有时间就请朋友过来。","translation":"Trước tôi ở trước trường, đi bộ năm phút đến lớp. Nay cùng bố mẹ ở cạnh bệnh viện, phòng lớn hơn và có hiệu sách nhỏ. Tôi thích nhưng xa trường, đi xe buýt nửa giờ nên sáng bảy giờ đi, tám giờ học. Bạn ở gần trường, mời tôi đến ở; biết bạn ở một mình, phòng nhỏ nên tôi không đến. Thứ Bảy bạn đến chơi. Chúng tôi xem sách cạnh nhà, rồi uống cà phê ở quán. Bạn thấy hiệu sách tốt như ở trường và muốn lần sau đến nữa. Tôi thấy xa một chút cũng được, rảnh thì mời bạn sang.","pinyin":"wǒ guòqù zhù zài xuéxiào qiánbian ， zǒulù wǔ fēnzhōng jiù dào jiàoshì 。 xiànzài wǒ hé bàba māma zhù zài yīyuàn pángbiān ， fángjiān bǐ guòqù de dà ， yě yǒu yí gè xiǎo shūdiàn 。 wǒ hěn xǐhuan nàli ， dàn lí xuéxiào yuǎn le ， zuò gōngjiāochē yào bàn ge xiǎoshí 。 wǒ měi tiān zǎoshang qī diǎn chūqù ， bā diǎn shàngkè 。 péngyou de jiā lí xuéxiào hěn jìn ， tā shuō wǒ kěyǐ dào tā jiā zhù 。 wǒ zhīdào tā yí gè rén zhù ， fángjiān búdà ， jiù méiyǒu qù 。 zhège xīngqī liù ， tā lái wǒ jiā kàn wǒ 。 wǒmen zài pángbiān de shūdiàn kàn shū ， hái qù fànguǎn hē kāfēi 。 péngyou shuō zhèlǐ de shūdiàn hé xuéxiào de yíyàng hǎo ， xià cì tā hái xiǎng lái 。 wǒ xiǎng ， jiā yuǎn yìdiǎnr yě méi guān xi ， yǒu shíjiān jiù qǐng péngyou guòlai 。","grammar":["So sánh bằng","Diễn tả khoảng cách với 离","Bổ ngữ thời lượng (Diễn tả khoảng thời gian)"],"questions":[{"id":"H2-R09-1-v2-Q1","question":"我现在住在哪儿？","answer":"医院旁边","options":["我家","学校旁边","医院旁边","桌子左边"],"explanation":"Thông tin đối chiếu trong bài: “现在我和爸爸妈妈住在医院旁边，房间比过去的大，也有一个小书店。”","evidence":"现在我和爸爸妈妈住在医院旁边，房间比过去的大，也有一个小书店。"},{"id":"H2-R09-1-v2-Q2","question":"过去走路去教室要多少时间？","answer":"五分钟","options":["下午","晚上","早上","五分钟"],"explanation":"Thông tin đối chiếu trong bài: “我过去住在学校前边，走路五分钟就到教室。”","evidence":"我过去住在学校前边，走路五分钟就到教室。"},{"id":"H2-R09-1-v2-Q3","question":"现在坐车去学校要多少时间？","answer":"半个小时","options":["半个小时","六点","七点","八点"],"explanation":"Thông tin đối chiếu trong bài: “我很喜欢那里，但离学校远了，坐公交车要半个小时。”","evidence":"我很喜欢那里，但离学校远了，坐公交车要半个小时。"},{"id":"H2-R09-1-v2-Q4","question":"朋友的家离学校怎么样？","answer":"很近","options":["不会","很近","想","不想"],"explanation":"Thông tin đối chiếu trong bài: “朋友的家离学校很近，他说我可以到他家住。”","evidence":"朋友的家离学校很近，他说我可以到他家住。"},{"id":"H2-R09-1-v2-Q5","question":"星期六谁来我家？","answer":"朋友","options":["您","大家","朋友","你们"],"explanation":"Thông tin đối chiếu trong bài: “我想，家远一点儿也没关系，有时间就请朋友过来。”","evidence":"我想，家远一点儿也没关系，有时间就请朋友过来。"},{"id":"H2-R09-1-v2-Q6","question":"我们在饭馆喝什么？","answer":"咖啡","options":["一杯水","鸡蛋","面包","咖啡"],"explanation":"Thông tin đối chiếu trong bài: “我们在旁边的书店看书，还去饭馆喝咖啡。”","evidence":"我们在旁边的书店看书，还去饭馆喝咖啡。"}]},{"id":"H2-R09-2","lesson":9,"revision":2,"title":"Đến muộn vì đồng hồ hỏng","text":"我和朋友说好九点在学校门口见。早上我看手表，是八点，就在家吃早饭，喝了一杯咖啡。妈妈看见后问我怎么还不走，她的手机已经九点了。我知道手表坏了。我给朋友打电话，他已经在门口等了半个小时。我让他在旁边的饭馆坐一会儿，自己打车去。九点二十分，我到了学校，朋友说没关系，说他也有一次不知道时间。我们想打篮球，现在想去买手表。商场离学校不远，走路十分钟就到。我买的手表跟妈妈的颜色一样，但比她的便宜。下次出去还要看看手机上的时间。","translation":"Tôi hẹn bạn chín giờ ở cổng trường. Xem đồng hồ thấy tám giờ nên vẫn ăn sáng, uống cà phê. Mẹ hỏi sao chưa đi, điện thoại đã chín giờ rồi; tôi mới biết đồng hồ hỏng. Bạn đã chờ nửa giờ, tôi nhờ vào quán cạnh đó ngồi và đi taxi đến. Chín giờ hai mươi tới, bạn không giận vì từng xem nhầm giờ. Định chơi bóng rổ nhưng chúng tôi đổi đi mua đồng hồ. Trung tâm thương mại cách trường mười phút đi bộ. Tôi chọn màu giống mẹ nhưng rẻ hơn. Từ nay trước khi đi phải xem cả điện thoại.","pinyin":"wǒ hé péngyou shuō hǎo jiǔ diǎn zài xuéxiào ménkǒu jiàn 。 zǎoshang wǒ kàn shǒubiǎo ， shì bā diǎn ， jiù zàijiā chī zǎofàn ， hē le yī bēi kāfēi 。 māma kàn jiàn hòu wèn wǒ zěnme hái bù zǒu ， tā de shǒujī yǐjīng jiǔ diǎn le 。 wǒ zhīdào shǒubiǎo huài le 。 wǒ gěi péngyou dǎ diànhuà ， tā yǐjīng zài ménkǒu děng le bàn ge xiǎoshí 。 wǒ ràng tā zài pángbiān de fànguǎn zuò yíhuìr ， zìjǐ dǎchē qù 。 jiǔ diǎn èr shífēn ， wǒ dào le xuéxiào ， péngyou shuō méi guān xi ， shuō tā yě yǒu yī cì bù zhīdào shíjiān 。 wǒmen xiǎng dǎ lánqiú ， xiànzài xiǎng qù mǎi shǒubiǎo 。 shāngchǎng lí xuéxiào bù yuǎn ， zǒulù shífēn zhōng jiù dào 。 wǒ mǎi de shǒubiǎo gēn māma de yánsè yíyàng ， dàn bǐ tā de piányi 。 xià cì chūqù hái yào kàn kàn shǒujī shàng de shíjiān 。","grammar":["So sánh bằng","Diễn tả khoảng cách với 离","Bổ ngữ thời lượng (Diễn tả khoảng thời gian)"],"questions":[{"id":"H2-R09-2-v2-Q1","question":"我们说好几点见？","answer":"九点","options":["十一点半","八点二十分","九点","三点五十分"],"explanation":"Thông tin đối chiếu trong bài: “我和朋友说好九点在学校门口见。”","evidence":"我和朋友说好九点在学校门口见。"},{"id":"H2-R09-2-v2-Q2","question":"什么坏了？","answer":"手表","options":["我的电脑","桌子","猫","手表"],"explanation":"Thông tin đối chiếu trong bài: “我知道手表坏了。”","evidence":"我知道手表坏了。"},{"id":"H2-R09-2-v2-Q3","question":"朋友等了多少时间？","answer":"半个小时","options":["半个小时","星期三","星期四","星期五"],"explanation":"Thông tin đối chiếu trong bài: “我给朋友打电话，他已经在门口等了半个小时。”","evidence":"我给朋友打电话，他已经在门口等了半个小时。"},{"id":"H2-R09-2-v2-Q4","question":"我几点到学校？","answer":"九点二十分","options":["八点二十分","九点二十分","三点五十分","五点半"],"explanation":"Thông tin đối chiếu trong bài: “九点二十分，我到了学校，朋友说没关系，说他也有一次不知道时间。”","evidence":"九点二十分，我到了学校，朋友说没关系，说他也有一次不知道时间。"},{"id":"H2-R09-2-v2-Q5","question":"商场离学校走路要多少时间？","answer":"十分钟","options":["星期六","星期日","十分钟","三月八号"],"explanation":"Thông tin đối chiếu trong bài: “商场离学校不远，走路十分钟就到。”","evidence":"商场离学校不远，走路十分钟就到。"},{"id":"H2-R09-2-v2-Q6","question":"我买的手表和谁的颜色一样？","answer":"妈妈","options":["儿子","女儿","他","妈妈"],"explanation":"Thông tin đối chiếu trong bài: “我买的手表跟妈妈的颜色一样，但比她的便宜。”","evidence":"我买的手表跟妈妈的颜色一样，但比她的便宜。"}]},{"id":"H2-R09-3","lesson":9,"revision":2,"title":"Chiều cao không quyết định tất cả","text":"我们学校有两个男孩儿，个子都很高。他们都喜欢打篮球，但一个跑得快，一个游得好。今天下课后，我请他们让我看看怎么打球。他们个子比我高，我有点儿不好意思。他们说，运动不是只看个子，看看球在哪儿，朋友在哪儿，也要知道。我们从四点打到五点，我一次也没有让球到学校外去，觉得很高兴。五点后，我们在学校旁边喝咖啡。我问他们已经学了多少时间，他们说学了一年，每周打两次。我想，下星期也来跟他们一起打。回家的时候，我看见一个更高的男孩儿，他说自己还不会打篮球呢。","translation":"Có hai bạn nam cao, cùng thích bóng rổ; một người chạy nhanh, một người bơi giỏi. Tan học tôi nhờ họ hướng dẫn. Tôi thấp hơn nên ngại, họ bảo thể thao không chỉ nhìn chiều cao mà còn phải biết bóng và bạn ở đâu. Chơi từ bốn đến năm giờ, tôi không làm bóng ra ngoài lần nào nên vui. Sau đó uống cà phê cạnh trường, tôi hỏi đã học bao lâu. Họ học một năm, mỗi tuần hai lần. Tôi muốn tuần sau tập cùng. Trên đường về gặp người còn cao hơn nhưng chưa biết bóng rổ.","pinyin":"wǒmen xuéxiào yǒu liǎng gè nánháir ， gèzi dōu hěn gāo 。 tāmen dōu xǐhuan dǎ lánqiú ， dàn yí gè pǎo de kuài ， yí gè yóu de hǎo 。 jīntiān xià kè hòu ， wǒ qǐng tāmen ràng wǒ kàn kàn zěnme dǎqiú 。 tāmen gèzi bǐ wǒ gāo ， wǒ yǒudiǎnr bù hǎo yìsi 。 tāmen shuō ， yùndòng bù shì zhǐ kàn gèzi ， kàn kàn qiú zài nǎr ， péngyou zài nǎr ， yě yào zhīdào 。 wǒmen cóng sì diǎn dǎ dào wǔ diǎn ， wǒ yī cì yě méiyǒu ràng qiú dào xuéxiào wài qù ， juéde hěn gāoxìng 。 wǔ diǎn hòu ， wǒmen zài xuéxiào pángbiān hē kāfēi 。 wǒ wèn tāmen yǐjīng xué le duōshao shíjiān ， tāmen shuō xué le yī nián ， měi zhōu dǎ liǎng cì 。 wǒ xiǎng ， xià xīngqī yě lái gēn tāmen yìqǐ dǎ 。 huíjiā de shíhou ， wǒ kàn jiàn yí gè gèng gāo de nánháir ， tā shuō zìjǐ hái bù huì dǎ lánqiú ne 。","grammar":["So sánh bằng","Diễn tả khoảng cách với 离","Bổ ngữ thời lượng (Diễn tả khoảng thời gian)"],"questions":[{"id":"H2-R09-3-v2-Q1","question":"两个男孩儿喜欢什么运动？","answer":"打篮球","options":["游泳","跑步","打篮球","踢足球"],"explanation":"Thông tin đối chiếu trong bài: “回家的时候，我看见一个更高的男孩儿，他说自己还不会打篮球呢。”","evidence":"回家的时候，我看见一个更高的男孩儿，他说自己还不会打篮球呢。"},{"id":"H2-R09-3-v2-Q2","question":"我个子比他们高吗？","answer":"不高","options":["很远","累","贵一点儿","不高"],"explanation":"Thông tin đối chiếu trong bài: “他们个子比我高，我有点儿不好意思。”","evidence":"他们个子比我高，我有点儿不好意思。"},{"id":"H2-R09-3-v2-Q3","question":"我们几点开始打球？","answer":"四点","options":["四点","下午五点","下午两点","一点半"],"explanation":"Thông tin đối chiếu trong bài: “我们从四点打到五点，我一次也没有让球到学校外去，觉得很高兴。”","evidence":"我们从四点打到五点，我一次也没有让球到学校外去，觉得很高兴。"},{"id":"H2-R09-3-v2-Q4","question":"我们打了多少时间？","answer":"一个小时","options":["今天","一个小时","明天","昨天"],"explanation":"Thông tin đối chiếu trong bài: “我们从四点打到五点，我一次也没有让球到学校外去，觉得很高兴。”","evidence":"我们从四点打到五点，我一次也没有让球到学校外去，觉得很高兴。"},{"id":"H2-R09-3-v2-Q5","question":"他们已经学了多少时间？","answer":"一年","options":["三点五十分","两个星期","一年","三个星期"],"explanation":"Thông tin đối chiếu trong bài: “我问他们已经学了多少时间，他们说学了一年，每周打两次。”","evidence":"我问他们已经学了多少时间，他们说学了一年，每周打两次。"},{"id":"H2-R09-3-v2-Q6","question":"他们每周打几次？","answer":"两次","options":["四次","五次","第一次","两次"],"explanation":"Thông tin đối chiếu trong bài: “我问他们已经学了多少时间，他们说学了一年，每周打两次。”","evidence":"我问他们已经学了多少时间，他们说学了一年，每周打两次。"}]},{"id":"H2-R09-4","lesson":9,"revision":2,"title":"Tìm quán cà phê cho buổi học","text":"星期六，我和同学想知道在哪儿可以一起看书。学校的书店人很多，我们说话不太好，就想去旁边喝咖啡。学校左边有一家饭馆，咖啡很便宜，但里有很多人在说话。右边的那家离学校远一点儿，走路要十五分钟。我去过一次，记得里有大桌子。我们走过去，看见一个男孩儿正在看中文书。他让我们坐在他旁边，还问我们是哪间教室的学生。我们三个一起看了两个小时的书。虽然咖啡比左边那家贵，但是学习很舒服。下次上课前，我们还想来这里。","translation":"Thứ Bảy tôi và bạn tìm nơi cùng học. Hiệu sách trường đông, nói chuyện không tiện nên muốn sang quán cà phê. Quán bên trái rẻ nhưng ồn vì nhiều người nói. Quán bên phải xa hơn, đi bộ mười lăm phút, tôi từng đến và nhớ bàn lớn. Đến nơi thấy một bạn nam đang đọc sách tiếng Trung. Bạn mời ngồi cạnh và hỏi chúng tôi học phòng nào. Ba người học chung hai giờ. Dù cà phê đắt hơn quán trái, học ở đó thoải mái. Lần sau trước buổi học chúng tôi muốn quay lại.","pinyin":"xīngqī liù ， wǒ hé tóngxué xiǎng zhīdào zài nǎr kěyǐ yìqǐ kàn shū 。 xuéxiào de shūdiàn rén hěn duō ， wǒmen shuōhuà bù tài hǎo ， jiù xiǎng qù pángbiān hē kāfēi 。 xuéxiào zuǒbian yǒu yī jiā fànguǎn ， kāfēi hěn piányi ， dàn lǐ yǒu hěn duō rén zài shuōhuà 。 yòubian de nà jiā lí xuéxiào yuǎn yìdiǎnr ， zǒulù yào shí wǔ fēnzhōng 。 wǒ qù guò yī cì ， jìde lǐ yǒu dà zhuōzi 。 wǒmen zǒuguò qù ， kàn jiàn yí gè nánháir zhèngzài kàn Zhōngwén shū 。 tā ràng wǒmen zuò zài tā pángbiān ， hái wèn wǒmen shì nǎ jiān jiàoshì de xuésheng 。 wǒmen sān gè yìqǐ kàn le liǎng gè xiǎoshí de shū 。 suīrán kāfēi bǐ zuǒbian nà jiā guì ， dànshì xuéxí hěn shūfu 。 xià cì shàngkè qián ， wǒmen hái xiǎng lái zhèlǐ 。","grammar":["So sánh bằng","Diễn tả khoảng cách với 离","Bổ ngữ thời lượng (Diễn tả khoảng thời gian)"],"questions":[{"id":"H2-R09-4-v2-Q1","question":"我们星期几一起看书？","answer":"星期六","options":["星期三","星期四","星期六","星期五"],"explanation":"Thông tin đối chiếu trong bài: “星期六，我和同学想知道在哪儿可以一起看书。”","evidence":"星期六，我和同学想知道在哪儿可以一起看书。"},{"id":"H2-R09-4-v2-Q2","question":"哪边的咖啡便宜？","answer":"左边","options":["旁边","门口","药店","左边"],"explanation":"Thông tin đối chiếu trong bài: “学校左边有一家饭馆，咖啡很便宜，但里有很多人在说话。”","evidence":"学校左边有一家饭馆，咖啡很便宜，但里有很多人在说话。"},{"id":"H2-R09-4-v2-Q3","question":"去右边的饭馆走路要多少时间？","answer":"十五分钟","options":["十五分钟","七点","八点","九点"],"explanation":"Thông tin đối chiếu trong bài: “右边的那家离学校远一点儿，走路要十五分钟。”","evidence":"右边的那家离学校远一点儿，走路要十五分钟。"},{"id":"H2-R09-4-v2-Q4","question":"谁让我们坐在旁边？","answer":"男孩儿","options":["法国人","男孩儿","泰国人","爷爷"],"explanation":"Thông tin đối chiếu trong bài: “我们走过去，看见一个男孩儿正在看中文书。”","evidence":"我们走过去，看见一个男孩儿正在看中文书。"},{"id":"H2-R09-4-v2-Q5","question":"我们有几个人看书？","answer":"三个","options":["一个","两个","三个","四个"],"explanation":"Thông tin đối chiếu trong bài: “我们三个一起看了两个小时的书。”","evidence":"我们三个一起看了两个小时的书。"},{"id":"H2-R09-4-v2-Q6","question":"我们看了多少时间？","answer":"两个小时","options":["今年","明年","去年","两个小时"],"explanation":"Thông tin đối chiếu trong bài: “我们三个一起看了两个小时的书。”","evidence":"我们三个一起看了两个小时的书。"}]},{"id":"H2-R09-5","lesson":9,"revision":2,"title":"Một buổi chiều không vội về nhà","text":"星期日，我去医院看爸爸。医院离我家很远，公交车坐了一个小时。爸爸正在工作，让我在旁边等一会儿。我看见门口有一个男孩儿，拿了一个坏手表。他想找妈妈，但不知道妈妈在哪儿。我让他给家人打电话，他说手机在家。我就和他去问医生。医生认识他，让他在门口看书，妈妈就在里看病。我和他坐在一起看了半个小时的书。爸爸下班的时候，他妈妈也来了。妈妈谢谢我，问我是不是大学生。我说还在学中文，今天只是来找爸爸。回家后，爸爸说，我今天虽然等了很多时间，但让一个孩子找到了妈妈。","translation":"Chủ nhật tôi đến bệnh viện tìm bố, đi xe buýt một giờ. Bố đang làm nên bảo đợi cạnh đó. Ở cổng có cậu bé cầm đồng hồ hỏng, muốn tìm mẹ mà không biết ở đâu; điện thoại để nhà. Tôi đưa bạn hỏi bác sĩ. Bác sĩ quen, bảo ngồi đọc sách ở cổng vì mẹ đang khám bên trong. Tôi ngồi đọc cùng nửa giờ. Khi bố tan làm, mẹ bạn cũng ra, cảm ơn và hỏi tôi là sinh viên không. Tôi nói đang học tiếng Trung, hôm nay đến tìm bố. Về nhà bố bảo chờ lâu nhưng đã giúp được một người.","pinyin":"xīngqīrì ， wǒ qù yīyuàn kàn bàba 。 yīyuàn lí wǒ jiā hěn yuǎn ， gōngjiāochē zuò le yí gè xiǎoshí 。 bàba zhèngzài gōngzuò ， ràng wǒ zài pángbiān děng yíhuìr 。 wǒ kàn jiàn ménkǒu yǒu yí gè nánháir ， ná le yí gè huài shǒubiǎo 。 tā xiǎng zhǎo māma ， dàn bù zhīdào māma zài nǎr 。 wǒ ràng tā gěi jiārén dǎ diànhuà ， tā shuō shǒujī zàijiā 。 wǒ jiù hé tā qù wèn yīshēng 。 yīshēng rènshi tā ， ràng tā zài ménkǒu kàn shū ， māma jiù zài lǐ kànbìng 。 wǒ hé tā zuò zài yìqǐ kàn le bàn ge xiǎoshí de shū 。 bàba xiàbān de shíhou ， tā māma yě lái le 。 māma xièxie wǒ ， wèn wǒ shì bu shì dàxuéshēng 。 wǒ shuō hái zài xué Zhōngwén ， jīntiān zhǐ shì lái zhǎo bàba 。 huíjiā hòu ， bàba shuō ， wǒ jīntiān suīrán děng le hěn duō shíjiān ， dàn ràng yí gè háizi zhǎodào le māma 。","grammar":["So sánh bằng","Diễn tả khoảng cách với 离","Bổ ngữ thời lượng (Diễn tả khoảng thời gian)"],"questions":[{"id":"H2-R09-5-v2-Q1","question":"医院离我家坐车要多少时间？","answer":"一个小时","options":["八点二十分","九点二十分","一个小时","三点五十分"],"explanation":"Thông tin đối chiếu trong bài: “医院离我家很远，公交车坐了一个小时。”","evidence":"医院离我家很远，公交车坐了一个小时。"},{"id":"H2-R09-5-v2-Q2","question":"男孩儿拿了什么？","answer":"坏手表","options":["中国的书","电话的号","菜","坏手表"],"explanation":"Thông tin đối chiếu trong bài: “我看见门口有一个男孩儿，拿了一个坏手表。”","evidence":"我看见门口有一个男孩儿，拿了一个坏手表。"},{"id":"H2-R09-5-v2-Q3","question":"男孩儿想找谁？","answer":"妈妈","options":["妈妈","弟弟","朋友","医生"],"explanation":"Thông tin đối chiếu trong bài: “他想找妈妈，但不知道妈妈在哪儿。”","evidence":"他想找妈妈，但不知道妈妈在哪儿。"},{"id":"H2-R09-5-v2-Q4","question":"他的手机在哪儿？","answer":"家","options":["北京","家","西安","机场"],"explanation":"Thông tin đối chiếu trong bài: “我让他给家人打电话，他说手机在家。”","evidence":"我让他给家人打电话，他说手机在家。"},{"id":"H2-R09-5-v2-Q5","question":"谁认识男孩儿？","answer":"医生","options":["奶奶","丈夫","医生","妻子"],"explanation":"Thông tin đối chiếu trong bài: “医生认识他，让他在门口看书，妈妈就在里看病。”","evidence":"医生认识他，让他在门口看书，妈妈就在里看病。"},{"id":"H2-R09-5-v2-Q6","question":"我们一起看了多少时间的书？","answer":"半个小时","options":["八月十号","三点","五点","半个小时"],"explanation":"Thông tin đối chiếu trong bài: “我和他坐在一起看了半个小时的书。”","evidence":"我和他坐在一起看了半个小时的书。"}]},{"id":"H2-R10-1","lesson":10,"revision":2,"title":"Khi kỳ thi đến gần","text":"快要考试了，我今天下课后没有去打篮球，想回家看书。老师让我看看上次做错的题，还给我一个新本子。我看了看，有十多个词上次都写错了。我在新本子里再写一次。妈妈看见后问，为什么不只看书。我说老师让我们知道自己哪里错了，不是读完书就可以。晚上朋友给我打电话，问去饭馆喝咖啡还是在家学习。我想了一会儿，还是请他来家里。他有些题也不懂，我们可以一起看看。我们七点开始看书，八点半就做完了今天的题。朋友笑了，说，过去做错的题现在都懂了，明天可以再打球。","translation":"Sắp thi nên tan học tôi không chơi bóng rổ mà về học. Giáo viên bảo xem lại câu sai lần trước và cho quyển vở mới. Tôi viết hơn mười từ sai vào vở. Mẹ hỏi sao không chỉ đọc sách; tôi giải thích cô muốn biết sai ở đâu, không phải đọc hết là đủ. Tối bạn gọi rủ ra quán cà phê hay học ở nhà. Tôi mời đến vì cả hai có câu chưa hiểu, có thể hỏi nhau. Bảy giờ bắt đầu, tám giờ rưỡi xong bài hôm nay. Bạn vui vì những chỗ từng sai đã hiểu, mai có thể chơi bóng.","pinyin":"kuàiyào kǎoshì le ， wǒ jīntiān xià kè hòu méiyǒu qù dǎ lánqiú ， xiǎng huíjiā kàn shū 。 lǎoshī ràng wǒ kàn kàn shàng cì zuò cuò de tí ， hái gěi wǒ yí gè xīn běnzi 。 wǒ kàn le kàn ， yǒu shí duō gè cí shàng cì dōu xiě cuò le 。 wǒ zài xīn běnzi lǐ zài xiě yī cì 。 māma kàn jiàn hòu wèn ， wèishénme bù zhǐ kàn shū 。 wǒ shuō lǎoshī ràng wǒmen zhīdào zìjǐ nǎlǐ cuò le ， bù shì dú wán shū jiù kěyǐ 。 wǎnshang péngyou gěi wǒ dǎ diànhuà ， wèn qù fànguǎn hē kāfēi háishi zàijiā xuéxí 。 wǒ xiǎng le yíhuìr ， háishi qǐng tā lái jiālǐ 。 tā yǒuxiē tí yě bù dǒng ， wǒmen kěyǐ yìqǐ kàn kàn 。 wǒmen qī diǎn kāishǐ kàn shū ， bā diǎn bàn jiù zuò wán le jīntiān de tí 。 péngyou xiào le ， shuō ， guòqù zuò cuò de tí xiànzài dōu dǒng le ， míngtiān kěyǐ zài dǎqiú 。","grammar":["Câu vị ngữ cụm chủ-vị","Câu hỏi lựa chọn (Alternative Questions)","Diễn tả hành động sắp xảy ra"],"questions":[{"id":"H2-R10-1-v2-Q1","question":"快要做什么了？","answer":"考试","options":["下课","上班","下班","考试"],"explanation":"Thông tin đối chiếu trong bài: “快要考试了，我今天下课后没有去打篮球，想回家看书。”","evidence":"快要考试了，我今天下课后没有去打篮球，想回家看书。"},{"id":"H2-R10-1-v2-Q2","question":"老师给我什么？","answer":"新本子","options":["新本子","一个杯子","一本书","雪"],"explanation":"Thông tin đối chiếu trong bài: “老师让我看看上次做错的题，还给我一个新本子。”","evidence":"老师让我看看上次做错的题，还给我一个新本子。"},{"id":"H2-R10-1-v2-Q3","question":"我写了多少错的词？","answer":"十多个","options":["九个","十多个","十个","一个"],"explanation":"Thông tin đối chiếu trong bài: “我看了看，有十多个词上次都写错了。”","evidence":"我看了看，有十多个词上次都写错了。"},{"id":"H2-R10-1-v2-Q4","question":"朋友来哪儿学习？","answer":"我家","options":["西安","机场","我家","超市前"],"explanation":"Thông tin đối chiếu trong bài: “我想了一会儿，还是请他来家里。”","evidence":"我想了一会儿，还是请他来家里。"},{"id":"H2-R10-1-v2-Q5","question":"我们几点开始看书？","answer":"七点","options":["下午两点","一点半","两点半","七点"],"explanation":"Thông tin đối chiếu trong bài: “我们七点开始看书，八点半就做完了今天的题。”","evidence":"我们七点开始看书，八点半就做完了今天的题。"},{"id":"H2-R10-1-v2-Q6","question":"我们几点做完题？","answer":"八点半","options":["八点半","六点","七点","九点"],"explanation":"Thông tin đối chiếu trong bài: “我们七点开始看书，八点半就做完了今天的题。”","evidence":"我们七点开始看书，八点半就做完了今天的题。"}]},{"id":"H2-R10-2","lesson":10,"revision":2,"title":"Quyển vở để sau cửa","text":"今天老师要看我们的本子。我早上已经准备好，但出去的时候只拿了书包，没有拿桌子上的本子。到教室后，同学问我做完题没有，我就知道自己没有拿本子。我给爸爸打电话，让他看看桌子。爸爸说桌子上没有，他在门后面找到了，妹妹昨天拿去画画了。现在快九点了，我九点上课，不能回去。爸爸说医院离学校不远，可以送过来。我让他在学校门口等，自己下去接。老师看见后，问我是忘做题，还是忘拿本子。我说是忘拿，她笑了，让我下次出去前再看看。今天的题我只错了一个。","translation":"Hôm nay giáo viên kiểm tra vở. Sáng tôi chuẩn bị nhưng đi chỉ mang cặp, quên vở. Đến lớp bạn hỏi làm xong chưa tôi mới nhớ. Gọi bố tìm trên bàn không thấy, bố tìm được sau cửa: em gái lấy vẽ hôm qua. Gần chín giờ có lớp nên tôi không về được. Bố làm ở bệnh viện gần trường, có thể mang đến; tôi xin bố đợi cổng để xuống đón. Giáo viên hỏi quên làm hay quên vở. Tôi trả lời quên mang, cô cười và dặn lần sau kiểm tra trước khi đi. Bài hôm nay tôi chỉ sai một câu.","pinyin":"jīntiān lǎoshī yào kàn wǒmen de běnzi 。 wǒ zǎoshang yǐjīng zhǔnbèi hǎo ， dàn chūqù de shíhou zhǐ ná le shūbāo ， méiyǒu ná zhuōzi shàng de běnzi 。 dào jiàoshì hòu ， tóngxué wèn wǒ zuò wán tí méiyǒu ， wǒ jiù zhīdào zìjǐ méiyǒu ná běnzi 。 wǒ gěi bàba dǎ diànhuà ， ràng tā kàn kàn zhuōzi 。 bàba shuō zhuōzi shàng méiyǒu ， tā zài mén hòumiàn zhǎodào le ， mèimei zuótiān ná qù huà huà le 。 xiànzài kuài jiǔ diǎn le ， wǒ jiǔ diǎn shàngkè ， bù néng huí qù 。 bàba shuō yīyuàn lí xuéxiào bù yuǎn ， kěyǐ sòng guòlai 。 wǒ ràng tā zài xuéxiào ménkǒu děng ， zìjǐ xià qù jiē 。 lǎoshī kàn jiàn hòu ， wèn wǒ shì wàng zuò tí ， háishi wàng ná běnzi 。 wǒ shuō shì wàng ná ， tā xiào le ， ràng wǒ xià cì chūqù qián zài kàn kàn 。 jīntiān de tí wǒ zhǐ cuò le yí gè 。","grammar":["Câu vị ngữ cụm chủ-vị","Câu hỏi lựa chọn (Alternative Questions)","Diễn tả hành động sắp xảy ra"],"questions":[{"id":"H2-R10-2-v2-Q1","question":"老师今天要看什么？","answer":"本子","options":["生日画","画笔","鱼","本子"],"explanation":"Thông tin đối chiếu trong bài: “今天老师要看我们的本子。”","evidence":"今天老师要看我们的本子。"},{"id":"H2-R10-2-v2-Q2","question":"本子在哪儿找到？","answer":"门后面","options":["门后面","机场","超市前","书店外"],"explanation":"Thông tin đối chiếu trong bài: “爸爸说桌子上没有，他在门后面找到了，妹妹昨天拿去画画了。”","evidence":"爸爸说桌子上没有，他在门后面找到了，妹妹昨天拿去画画了。"},{"id":"H2-R10-2-v2-Q3","question":"谁昨天拿本子画画？","answer":"妹妹","options":["高中学生","妹妹","李","我"],"explanation":"Thông tin đối chiếu trong bài: “爸爸说桌子上没有，他在门后面找到了，妹妹昨天拿去画画了。”","evidence":"爸爸说桌子上没有，他在门后面找到了，妹妹昨天拿去画画了。"},{"id":"H2-R10-2-v2-Q4","question":"我几点上课？","answer":"九点","options":["下午两点","一点半","九点","两点半"],"explanation":"Thông tin đối chiếu trong bài: “现在快九点了，我九点上课，不能回去。”","evidence":"现在快九点了，我九点上课，不能回去。"},{"id":"H2-R10-2-v2-Q5","question":"谁送本子过来？","answer":"爸爸","options":["爷爷","奶奶","丈夫","爸爸"],"explanation":"Thông tin đối chiếu trong bài: “爸爸说医院离学校不远，可以送过来。”","evidence":"爸爸说医院离学校不远，可以送过来。"},{"id":"H2-R10-2-v2-Q6","question":"我今天错了几个题？","answer":"一个","options":["一个","七个","八个","九个"],"explanation":"Thông tin đối chiếu trong bài: “今天的题我只错了一个。”","evidence":"今天的题我只错了一个。"}]},{"id":"H2-R10-3","lesson":10,"revision":2,"title":"Đi chơi hay chuẩn bị khai giảng?","text":"明天就要开学了，朋友请我今天跟他去看电影。他说是爱情片，八点开始。我想去，但新买的书还没看，笔和本子也没准备。我问他，买东西还是看电影？他笑了，说两件事都可以做。下午我们去学校前的商店，我买了两个本子和三支笔，他买了一个书包。书包比我的小，但颜色一样。买完后，离电影开始还有两个小时，我们在饭馆吃了晚饭。我给妈妈打电话，说我不回家吃饭。看完电影回家，我没有再看电视，就准备好明天的东西。妈妈说，明天第一天上课，别忘了拿书。","translation":"Mai khai giảng, bạn rủ tối xem phim tình cảm lúc tám giờ. Tôi muốn đi nhưng chưa xem sách mới, cũng chưa chuẩn bị bút vở. Bạn bảo có thể vừa mua đồ vừa xem phim. Chiều chúng tôi đến cửa hàng trước trường: tôi mua hai vở, ba bút; bạn mua cặp nhỏ hơn cặp tôi nhưng cùng màu. Mua xong còn hai giờ tới phim, chúng tôi ăn tối rồi tôi gọi mẹ đừng đợi cơm. Về nhà không xem tivi nữa, tôi xếp đồ cho ngày mai. Mẹ dặn buổi học đầu đừng quên sách.","pinyin":"míngtiān jiùyào kāixué le ， péngyou qǐng wǒ jīntiān gēn tā qù kàn diànyǐng 。 tā shuō shì àiqíngpiàn ， bā diǎn kāishǐ 。 wǒ xiǎng qù ， dàn xīn mǎi de shū hái méi kàn ， bǐ hé běnzi yě méi zhǔnbèi 。 wǒ wèn tā ， mǎi dōngxi háishi kàn diànyǐng ？ tā xiào le ， shuō liǎng jiàn shì dōu kěyǐ zuò 。 xiàwǔ wǒmen qù xuéxiào qián de shāngdiàn ， wǒ mǎi le liǎng gè běnzi hé sān zhī bǐ ， tā mǎi le yí gè shūbāo 。 shūbāo bǐ wǒ de xiǎo ， dàn yánsè yíyàng 。 mǎi wán hòu ， lí diànyǐng kāishǐ háiyǒu liǎng gè xiǎoshí ， wǒmen zài fànguǎn chī le wǎnfàn 。 wǒ gěi māma dǎ diànhuà ， shuō wǒ bù huíjiā chīfàn 。 kàn wán diànyǐng huíjiā ， wǒ méiyǒu zài kàn diànshì ， jiù zhǔnbèi hǎo míngtiān de dōngxi 。 māma shuō ， míngtiān dì yī tiānshàng kè ， bié wàng le ná shū 。","grammar":["Câu vị ngữ cụm chủ-vị","Câu hỏi lựa chọn (Alternative Questions)","Diễn tả hành động sắp xảy ra"],"questions":[{"id":"H2-R10-3-v2-Q1","question":"什么时候开学？","answer":"明天","options":["今年","明年","去年","明天"],"explanation":"Thông tin đối chiếu trong bài: “明天就要开学了，朋友请我今天跟他去看电影。”","evidence":"明天就要开学了，朋友请我今天跟他去看电影。"},{"id":"H2-R10-3-v2-Q2","question":"电影几点开始？","answer":"八点","options":["八点","六点半","七点半","六点十分"],"explanation":"Thông tin đối chiếu trong bài: “他说是爱情片，八点开始。”","evidence":"他说是爱情片，八点开始。"},{"id":"H2-R10-3-v2-Q3","question":"我买了几个本子？","answer":"两个","options":["一个","两个","三个","四个"],"explanation":"Thông tin đối chiếu trong bài: “下午我们去学校前的商店，我买了两个本子和三支笔，他买了一个书包。”","evidence":"下午我们去学校前的商店，我买了两个本子和三支笔，他买了一个书包。"},{"id":"H2-R10-3-v2-Q4","question":"我买了几支笔？","answer":"三支","options":["四支","一支","三支","两支"],"explanation":"Thông tin đối chiếu trong bài: “下午我们去学校前的商店，我买了两个本子和三支笔，他买了一个书包。”","evidence":"下午我们去学校前的商店，我买了两个本子和三支笔，他买了一个书包。"},{"id":"H2-R10-3-v2-Q5","question":"朋友买了什么？","answer":"书包","options":["中国的书","电话的号","菜","书包"],"explanation":"Thông tin đối chiếu trong bài: “下午我们去学校前的商店，我买了两个本子和三支笔，他买了一个书包。”","evidence":"下午我们去学校前的商店，我买了两个本子和三支笔，他买了一个书包。"},{"id":"H2-R10-3-v2-Q6","question":"我给妈妈打电话说什么？","answer":"我不回家吃饭","options":["我不回家吃饭","考试","准备晚饭","送书"],"explanation":"Thông tin đối chiếu trong bài: “我给妈妈打电话，说我不回家吃饭。”","evidence":"我给妈妈打电话，说我不回家吃饭。"}]},{"id":"H2-R10-4","lesson":10,"revision":2,"title":"Sai một từ, hiểu khác cả câu","text":"中文课上，老师让我们看一个题：朋友是坐公交车来的，还是打车来的？我看见“车”，就说是爸爸开车送来的。同学们都很高兴，我有点儿不好意思。老师让我再看看题，里没有爸爸，也没有朋友家在哪里。我读了一次，知道只要看朋友怎么来，不要自己介绍很多事。下课后，我跟同学在教室后面坐了一会儿，问他怎么做这些题。他说考试的时候，要看看每个词，不知道就再读一读。我在本子上写了今天错的题，回家给妈妈看。妈妈不太懂中文，但觉得我知道错在哪里，就已经学到了很多。","translation":"Trong lớp, giáo viên hỏi bạn đến bằng xe buýt hay taxi. Tôi chỉ thấy chữ “xe” đã trả lời bố lái xe đưa đến. Các bạn cười khiến tôi ngại. Cô bảo đọc lại: đề không có bố hay nhà ở đâu, chỉ cần biết bạn đến bằng gì. Đọc lại tôi hiểu không cần tự thêm chuyện. Tan học tôi ngồi phía sau lớp hỏi bạn cách làm. Bạn bảo khi thi phải đọc từng từ, chưa hiểu thì đọc lại. Tôi chép câu sai vào vở và về cho mẹ xem. Mẹ chưa giỏi tiếng Trung nhưng thấy tôi biết sai ở đâu là đã học được nhiều.","pinyin":"Zhōngwén kè shàng ， lǎoshī ràng wǒmen kàn yí gè tí ： péngyou shì zuò gōngjiāochē lái de ， háishi dǎchē lái de ？ wǒ kàn jiàn “ chē ” ， jiù shuō shì bàba kāichē sòng lái de 。 tóngxué men dōu hěn gāoxìng ， wǒ yǒudiǎnr bù hǎo yìsi 。 lǎoshī ràng wǒ zài kàn kàn tí ， lǐ méiyǒu bàba ， yě méiyǒu péngyou jiā zài nǎlǐ 。 wǒ dú le yī cì ， zhīdào zhǐyào kàn péngyou zěnme lái ， bú yào zìjǐ jièshào hěn duō shì 。 xià kè hòu ， wǒ gēn tóngxué zài jiàoshì hòumiàn zuò le yíhuìr ， wèn tā zěnme zuò zhèxiē tí 。 tā shuō kǎoshì de shíhou ， yào kàn kàn měi gè cí ， bù zhīdào jiù zài dú yī dú 。 wǒ zài běnzi shàng xiě le jīntiān cuò de tí ， huíjiā gěi māma kàn 。 māma bù tài dǒng Zhōngwén ， dàn juéde wǒ zhīdào cuò zài nǎlǐ ， jiù yǐjīng xué dào le hěn duō 。","grammar":["Câu vị ngữ cụm chủ-vị","Câu hỏi lựa chọn (Alternative Questions)","Diễn tả hành động sắp xảy ra"],"questions":[{"id":"H2-R10-4-v2-Q1","question":"题里有爸爸吗？","answer":"没有","options":["太长","太小","不太大","没有"],"explanation":"Thông tin đối chiếu trong bài: “老师让我再看看题，里没有爸爸，也没有朋友家在哪里。”","evidence":"老师让我再看看题，里没有爸爸，也没有朋友家在哪里。"},{"id":"H2-R10-4-v2-Q2","question":"我看见哪个字就说了？","answer":"车","options":["车","雪","衣服","手机"],"explanation":"Thông tin đối chiếu trong bài: “我看见“车”，就说是爸爸开车送来的。”","evidence":"我看见“车”，就说是爸爸开车送来的。"},{"id":"H2-R10-4-v2-Q3","question":"老师让我再做什么？","answer":"看看题","options":["上课","看看题","下课","上班"],"explanation":"Thông tin đối chiếu trong bài: “老师让我再看看题，里没有爸爸，也没有朋友家在哪里。”","evidence":"老师让我再看看题，里没有爸爸，也没有朋友家在哪里。"},{"id":"H2-R10-4-v2-Q4","question":"下课后我们坐在哪儿？","answer":"教室后面","options":["学校的教室","洗手间","教室后面","医院旁边"],"explanation":"Thông tin đối chiếu trong bài: “下课后，我跟同学在教室后面坐了一会儿，问他怎么做这些题。”","evidence":"下课后，我跟同学在教室后面坐了一会儿，问他怎么做这些题。"},{"id":"H2-R10-4-v2-Q5","question":"我的错题写在哪儿？","answer":"本子上","options":["左边","右边","旁边","本子上"],"explanation":"Thông tin đối chiếu trong bài: “我在本子上写了今天错的题，回家给妈妈看。”","evidence":"我在本子上写了今天错的题，回家给妈妈看。"},{"id":"H2-R10-4-v2-Q6","question":"回家后我给谁看？","answer":"妈妈","options":["妈妈","哥哥","妹妹","儿子"],"explanation":"Thông tin đối chiếu trong bài: “我在本子上写了今天错的题，回家给妈妈看。”","evidence":"我在本子上写了今天错的题，回家给妈妈看。"}]},{"id":"H2-R10-5","lesson":10,"revision":2,"title":"Ngày đầu của học sinh mới","text":"开学那天，我们学校来了两个新同学。一个个子高，喜欢打篮球；一个不太高，喜欢看书。老师让他们介绍自己，还问想坐前边还是后面。他们都想坐前边，想听老师上课。我旁边有两个椅子，就请他们坐过来。上午的课有很多新词，我们一起写在本子上。下课后，一个同学看见自己的笔坏了，我给他一支新的。他要给我钱，我说不要，下次帮我看一下题就好。午饭的时候，我们在学校外吃了面条儿。我对他们说，星期五有一个考试，别只看新词，也要看看过去做错的题。","translation":"Ngày khai giảng có hai bạn mới: một bạn cao, thích bóng rổ; bạn kia thích sách. Giáo viên mời giới thiệu và hỏi muốn ngồi trước hay sau. Cả hai muốn ngồi trước để nghe rõ. Cạnh tôi có hai chỗ nên mời lại. Sáng có nhiều từ mới, chúng tôi cùng chép vào vở. Tan học một bạn thấy bút hỏng, tôi cho bút mới. Bạn muốn trả tiền nhưng tôi chỉ nhờ lần sau giúp xem bài. Trưa cùng ăn mì ngoài trường, tôi nhắc thứ Sáu có kiểm tra: đừng chỉ học từ mới, hãy xem cả câu sai trước đây.","pinyin":"kāixué nà tiān ， wǒmen xuéxiào lái le liǎng gè xīn tóngxué 。 yí gè gèzi gāo ， xǐhuan dǎ lánqiú ； yí gè bù tài gāo ， xǐhuan kàn shū 。 lǎoshī ràng tāmen jièshào zìjǐ ， hái wèn xiǎng zuò qiánbian háishi hòumiàn 。 tāmen dōu xiǎng zuò qiánbian ， xiǎng tīng lǎoshī shàngkè 。 wǒ pángbiān yǒu liǎng gè yǐzi ， jiù qǐng tāmen zuò guòlai 。 shàngwǔ de kè yǒu hěn duō xīn cí ， wǒmen yìqǐ xiě zài běnzi shàng 。 xià kè hòu ， yí gè tóngxué kàn jiàn zìjǐ de bǐ huài le ， wǒ gěi tā yī zhī xīn de 。 tā yào gěi wǒ qián ， wǒ shuō bú yào ， xià cì bāng wǒ kàn yíxià tí jiù hǎo 。 wǔfàn de shíhou ， wǒmen zài xuéxiào wài chī le miàntiáor 。 wǒ duì tāmen shuō ， xīngqī wǔ yǒu yí gè kǎoshì ， bié zhǐ kàn xīn cí ， yě yào kàn kàn guòqù zuò cuò de tí 。","grammar":["Câu vị ngữ cụm chủ-vị","Câu hỏi lựa chọn (Alternative Questions)","Diễn tả hành động sắp xảy ra"],"questions":[{"id":"H2-R10-5-v2-Q1","question":"开学来了几个新同学？","answer":"两个","options":["四个","五个","六个","两个"],"explanation":"Thông tin đối chiếu trong bài: “开学那天，我们学校来了两个新同学。”","evidence":"开学那天，我们学校来了两个新同学。"},{"id":"H2-R10-5-v2-Q2","question":"高个子的同学喜欢什么？","answer":"打篮球","options":["打篮球","走一会儿","跑太快","不要等我吃饭"],"explanation":"Thông tin đối chiếu trong bài: “一个个子高，喜欢打篮球；一个不太高，喜欢看书。”","evidence":"一个个子高，喜欢打篮球；一个不太高，喜欢看书。"},{"id":"H2-R10-5-v2-Q3","question":"他们想坐前边还是后面？","answer":"前边","options":["小房间","前边","桌子上","房间外边"],"explanation":"Thông tin đối chiếu trong bài: “老师让他们介绍自己，还问想坐前边还是后面。”","evidence":"老师让他们介绍自己，还问想坐前边还是后面。"},{"id":"H2-R10-5-v2-Q4","question":"什么坏了？","answer":"笔","options":["电话的号","菜","笔","饺子"],"explanation":"Thông tin đối chiếu trong bài: “下课后，一个同学看见自己的笔坏了，我给他一支新的。”","evidence":"下课后，一个同学看见自己的笔坏了，我给他一支新的。"},{"id":"H2-R10-5-v2-Q5","question":"我们午饭吃什么？","answer":"面条儿","options":["蛋糕和牛奶","面包和牛奶","热茶","面条儿"],"explanation":"Thông tin đối chiếu trong bài: “午饭的时候，我们在学校外吃了面条儿。”","evidence":"午饭的时候，我们在学校外吃了面条儿。"},{"id":"H2-R10-5-v2-Q6","question":"星期几有考试？","answer":"星期五","options":["星期五","星期一","星期二","星期三"],"explanation":"Thông tin đối chiếu trong bài: “我对他们说，星期五有一个考试，别只看新词，也要看看过去做错的题。”","evidence":"我对他们说，星期五有一个考试，别只看新词，也要看看过去做错的题。"}]},{"id":"H2-R11-1","lesson":11,"revision":2,"title":"Tan làm rồi mới mua thuốc","text":"妈妈今天下班的时候头有点儿疼，身体也不舒服。她想回家睡觉，不想去医院。我说路上有一家药店，可以进去问问。药店的先生穿着白色衣服，问妈妈头疼了多少时间。妈妈说上午就有点儿疼，中午还去公司上班了。他让妈妈去医院看医生，不要自己只买药。我给爸爸打电话，让他开车过来接我们。爸爸来得很快，送妈妈到了医院。医生问了很多问题，说今天要多休息。回家后，我给妈妈拿了一杯热水，爸爸做了晚饭。妈妈在床上，说最想做的事就是好好睡觉。我没有开电视，没有再让她看手机。","translation":"Tan làm mẹ hơi đau đầu và khó chịu, muốn về ngủ chứ không đi viện. Tôi đề nghị vào hiệu thuốc trên đường. Người ở hiệu thuốc mặc áo trắng, hỏi đau bao lâu. Mẹ đã đau từ sáng mà trưa vẫn làm, ông khuyên đến bác sĩ, đừng chỉ tự mua thuốc. Tôi gọi bố lái xe đón, bố đến nhanh đưa mẹ đi viện. Bác sĩ hỏi nhiều và dặn nghỉ. Về nhà tôi đưa nước nóng, bố nấu tối. Mẹ nằm trên giường, chỉ muốn ngủ ngon. Tôi không bật tivi, cũng không rủ mẹ xem điện thoại nữa.","pinyin":"māma jīntiān xiàbān de shíhou tóu yǒudiǎnr téng ， shēntǐ yě bù shūfu 。 tā xiǎng huíjiā shuìjiào ， bù xiǎng qù yīyuàn 。 wǒ shuō lùshang yǒu yī jiā yàodiàn ， kěyǐ jìnqù wèn wèn 。 yàodiàn de xiānsheng chuān zhe báisè yīfu ， wèn māma tóu téng le duōshao shíjiān 。 māma shuō shàngwǔ jiù yǒudiǎnr téng ， zhōngwǔ hái qù gōngsī shàngbān le 。 tā ràng māma qù yīyuàn kàn yīshēng ， bú yào zìjǐ zhǐ mǎi yào 。 wǒ gěi bàba dǎ diànhuà ， ràng tā kāichē guòlai jiē wǒmen 。 bàba lái de hěn kuài ， sòng māma dào le yīyuàn 。 yīshēng wèn le hěn duō wèntí ， shuō jīntiān yào duō xiūxi 。 huíjiā hòu ， wǒ gěi māma ná le yī bēi rè shuǐ ， bàba zuò le wǎnfàn 。 māma zài chuáng shàng ， shuō zuì xiǎng zuò de shì jiù shì hǎo hǎo shuìjiào 。 wǒ méiyǒu kāi diànshì ， méiyǒu zài ràng tā kàn shǒujī 。","grammar":["Trợ từ động thái 着","Trợ từ động thái 着 (zhe)","Phó từ chỉ mức độ 「最」"],"questions":[{"id":"H2-R11-1-v2-Q1","question":"妈妈怎么了？","answer":"头有点儿疼","options":["头有点儿疼","头不疼","身体很舒服","正在工作"],"explanation":"Thông tin đối chiếu trong bài: “妈妈今天下班的时候头有点儿疼，身体也不舒服。”","evidence":"妈妈今天下班的时候头有点儿疼，身体也不舒服。"},{"id":"H2-R11-1-v2-Q2","question":"我们路上进了哪儿？","answer":"药店","options":["旁边","药店","门口","教室后面"],"explanation":"Thông tin đối chiếu trong bài: “我说路上有一家药店，可以进去问问。”","evidence":"我说路上有一家药店，可以进去问问。"},{"id":"H2-R11-1-v2-Q3","question":"药店的先生穿什么颜色？","answer":"白色","options":["黑色","绿色","白色","红色"],"explanation":"Thông tin đối chiếu trong bài: “药店的先生穿着白色衣服，问妈妈头疼了多少时间。”","evidence":"药店的先生穿着白色衣服，问妈妈头疼了多少时间。"},{"id":"H2-R11-1-v2-Q4","question":"谁开车来接我们？","answer":"爸爸","options":["大家","你们","李文","爸爸"],"explanation":"Thông tin đối chiếu trong bài: “我给爸爸打电话，让他开车过来接我们。”","evidence":"我给爸爸打电话，让他开车过来接我们。"},{"id":"H2-R11-1-v2-Q5","question":"回家后谁做晚饭？","answer":"爸爸","options":["爸爸","大家","你们","李文"],"explanation":"Thông tin đối chiếu trong bài: “回家后，我给妈妈拿了一杯热水，爸爸做了晚饭。”","evidence":"回家后，我给妈妈拿了一杯热水，爸爸做了晚饭。"},{"id":"H2-R11-1-v2-Q6","question":"妈妈最想做什么？","answer":"睡觉","options":["吃晚饭","睡觉","写字","写汉字"],"explanation":"Thông tin đối chiếu trong bài: “妈妈在床上，说最想做的事就是好好睡觉。”","evidence":"妈妈在床上，说最想做的事就是好好睡觉。"}]},{"id":"H2-R11-2","lesson":11,"revision":2,"title":"Tập chậm lại để tiếp tục được lâu","text":"爷爷现在经常去运动。他说自己从小就喜欢跑步，现在也想每天跑。我想知道他的身体好不好，让他问问医生。星期六我跟他去了医院，医生说身体不错，运动可以，但别跑太快。下午我们在学校外走路，爷爷手里拿着一杯水，走得很慢。他说过去上班的时候，只想快，现在知道慢一点儿更舒服。我想跑，他让我去，自己在旁边等。我跑了半个小时回来，看见他正在给奶奶打电话，说今天没有累，晚上还想自己做饭。回家时，爷爷没有坐公交车，想再走一会儿。我觉得跟他一起运动，最好的不是跑了多远，是他很高兴。","translation":"Ông thường vận động và nói từ nhỏ đã thích chạy, giờ vẫn muốn chạy mỗi ngày. Tôi hơi lo, đề nghị hỏi bác sĩ. Thứ Bảy chúng tôi đi viện, bác sĩ thấy sức khỏe ổn, có thể vận động nhưng đừng chạy quá nhanh. Chiều đi bộ ngoài trường, ông cầm nước và đi chậm. Ông bảo trước đi làm chỉ muốn nhanh, giờ chậm một chút lại dễ chịu. Tôi chạy nửa giờ rồi quay lại, thấy ông gọi bà, nói không mệt và tối muốn nấu. Về nhà ông muốn đi thêm thay vì xe buýt. Tôi thấy điều tốt nhất là ông vui, không phải đi xa bao nhiêu.","pinyin":"yéye xiànzài jīngcháng qù yùndòng 。 tā shuō zìjǐ cóngxiǎo jiù xǐhuan pǎobù ， xiànzài yě xiǎng měi tiān pǎo 。 wǒ xiǎng zhīdào tā de shēntǐ hǎo bù hǎo ， ràng tā wèn wèn yīshēng 。 xīngqī liù wǒ gēn tā qù le yīyuàn ， yīshēng shuō shēntǐ búcuò ， yùndòng kěyǐ ， dàn bié pǎo tài kuài 。 xiàwǔ wǒmen zài xuéxiào wài zǒulù ， yéye shǒu lǐ ná zhe yī bēi shuǐ ， zǒu de hěn màn 。 tā shuō guòqù shàngbān de shíhou ， zhǐ xiǎng kuài ， xiànzài zhīdào màn yìdiǎnr gèng shūfu 。 wǒ xiǎng pǎo ， tā ràng wǒ qù ， zìjǐ zài pángbiān děng 。 wǒ pǎo le bàn ge xiǎoshí huí lái ， kàn jiàn tā zhèngzài gěi nǎinai dǎ diànhuà ， shuō jīntiān méiyǒu lèi ， wǎnshang hái xiǎng zìjǐ zuòfàn 。 huíjiā shí ， yéye méiyǒu zuò gōngjiāochē ， xiǎng zài zǒu yíhuìr 。 wǒ juéde gēn tā yìqǐ yùndòng ， zuìhǎo de bù shì pǎo le duō yuǎn ， shì tā hěn gāoxìng 。","grammar":["Trợ từ động thái 着","Trợ từ động thái 着 (zhe)","Phó từ chỉ mức độ 「最」"],"questions":[{"id":"H2-R11-2-v2-Q1","question":"爷爷从小喜欢什么运动？","answer":"跑步","options":["跑步","看电视","唱歌","学习"],"explanation":"Thông tin đối chiếu trong bài: “他说自己从小就喜欢跑步，现在也想每天跑。”","evidence":"他说自己从小就喜欢跑步，现在也想每天跑。"},{"id":"H2-R11-2-v2-Q2","question":"星期六我们去哪儿问医生？","answer":"医院","options":["饭店","医院","公司","北京"],"explanation":"Thông tin đối chiếu trong bài: “星期六我跟他去了医院，医生说身体不错，运动可以，但别跑太快。”","evidence":"星期六我跟他去了医院，医生说身体不错，运动可以，但别跑太快。"},{"id":"H2-R11-2-v2-Q3","question":"医生让爷爷别怎么样？","answer":"跑太快","options":["坐火车","坐飞机","跑太快","坐公交车"],"explanation":"Thông tin đối chiếu trong bài: “星期六我跟他去了医院，医生说身体不错，运动可以，但别跑太快。”","evidence":"星期六我跟他去了医院，医生说身体不错，运动可以，但别跑太快。"},{"id":"H2-R11-2-v2-Q4","question":"爷爷手里拿着什么？","answer":"水","options":["肉","鱼和肉","米饭和肉","水"],"explanation":"Thông tin đối chiếu trong bài: “下午我们在学校外走路，爷爷手里拿着一杯水，走得很慢。”","evidence":"下午我们在学校外走路，爷爷手里拿着一杯水，走得很慢。"},{"id":"H2-R11-2-v2-Q5","question":"我跑了多少时间？","answer":"半个小时","options":["半个小时","星期二","星期三","星期四"],"explanation":"Thông tin đối chiếu trong bài: “我跑了半个小时回来，看见他正在给奶奶打电话，说今天没有累，晚上还想自己做饭。”","evidence":"我跑了半个小时回来，看见他正在给奶奶打电话，说今天没有累，晚上还想自己做饭。"},{"id":"H2-R11-2-v2-Q6","question":"爷爷给谁打电话？","answer":"奶奶","options":["我们","奶奶","爸爸","妈妈"],"explanation":"Thông tin đối chiếu trong bài: “我跑了半个小时回来，看见他正在给奶奶打电话，说今天没有累，晚上还想自己做饭。”","evidence":"我跑了半个小时回来，看见他正在给奶奶打电话，说今天没有累，晚上还想自己做饭。"}]},{"id":"H2-R11-3","lesson":11,"revision":2,"title":"Chờ ở hiệu thuốc bên trái","text":"我和朋友说好下午四点在饭馆见，他没有来。我给他打电话，他说在路上头疼，正在药店里坐着。我不知道是哪家药店，他让我看学校左边，那家门口有一个拿着红色书包的女士。我走过去，女士是朋友的妻子。她说，朋友已经让医生看过了，现在可以回家休息。我说不要再去饭馆，我去买一些面包和牛奶给他。他最喜欢那家商店的面包，我去的时候只有一些，就都买了。我们一起送他回家。他有点儿不好意思，说下次再请我们吃饭。我让他别想太多，身体好了再说。","translation":"Tôi hẹn bạn bốn giờ ở quán nhưng bạn không đến. Gọi mới biết bạn đau đầu trên đường, đang ngồi ở hiệu thuốc bên trái trường. Bạn bảo tìm người phụ nữ cầm túi đỏ trước cửa. Đến nơi đó là vợ bạn, nói bác sĩ đã xem, giờ có thể về nghỉ. Tôi bỏ bữa hẹn, đi mua bánh mì và sữa. Bạn thích bánh của cửa hàng ấy, lúc tôi đến chỉ còn một ít nên mua hết. Chúng tôi đưa bạn về. Bạn ngại, hẹn mời ăn lần sau. Tôi bảo đừng nghĩ nhiều, khỏe rồi tính.","pinyin":"wǒ hé péngyou shuō hǎo xiàwǔ sì diǎn zài fànguǎn jiàn ， tā méiyǒu lái 。 wǒ gěi tā dǎ diànhuà ， tā shuō zài lùshang tóu téng ， zhèngzài yàodiàn lǐ zuò zhe 。 wǒ bù zhīdào shì nǎ jiā yàodiàn ， tā ràng wǒ kàn xuéxiào zuǒbian ， nà jiā ménkǒu yǒu yí gè ná zhe hóngsè shūbāo de nǚshì 。 wǒ zǒuguò qù ， nǚshì shì péngyou de qīzi 。 tā shuō ， péngyou yǐjīng ràng yīshēng kàn guò le ， xiànzài kěyǐ huíjiā xiūxi 。 wǒ shuō bú yào zài qù fànguǎn ， wǒ qù mǎi yìxiē miànbāo hé niúnǎi gěi tā 。 tā zuì xǐhuan nà jiā shāngdiàn de miànbāo ， wǒ qù de shíhou zhǐ yǒu yìxiē ， jiù dōu mǎi le 。 wǒmen yìqǐ sòng tā huíjiā 。 tā yǒudiǎnr bù hǎo yìsi ， shuō xià cì zài qǐng wǒmen chīfàn 。 wǒ ràng tā bié xiǎng tài duō ， shēntǐ hǎo le zài shuō 。","grammar":["Trợ từ động thái 着","Trợ từ động thái 着 (zhe)","Phó từ chỉ mức độ 「最」"],"questions":[{"id":"H2-R11-3-v2-Q1","question":"我们过去说好几点见？","answer":"四点","options":["四点","下午两点","一点半","两点半"],"explanation":"Thông tin đối chiếu trong bài: “我和朋友说好下午四点在饭馆见，他没有来。”","evidence":"我和朋友说好下午四点在饭馆见，他没有来。"},{"id":"H2-R11-3-v2-Q2","question":"朋友现在在哪儿？","answer":"药店","options":["西安","药店","机场","超市前"],"explanation":"Thông tin đối chiếu trong bài: “我给他打电话，他说在路上头疼，正在药店里坐着。”","evidence":"我给他打电话，他说在路上头疼，正在药店里坐着。"},{"id":"H2-R11-3-v2-Q3","question":"药店在学校哪边？","answer":"左边","options":["学校旁边","右边","左边","旁边"],"explanation":"Thông tin đối chiếu trong bài: “我不知道是哪家药店，他让我看学校左边，那家门口有一个拿着红色书包的女士。”","evidence":"我不知道是哪家药店，他让我看学校左边，那家门口有一个拿着红色书包的女士。"},{"id":"H2-R11-3-v2-Q4","question":"门口的女士是谁？","answer":"朋友的妻子","options":["爸爸","妈妈","哥哥","朋友的妻子"],"explanation":"Thông tin đối chiếu trong bài: “我走过去，女士是朋友的妻子。”","evidence":"我走过去，女士是朋友的妻子。"},{"id":"H2-R11-3-v2-Q5","question":"我给朋友买了什么？","answer":"面包和牛奶","options":["面包和牛奶","肉","鱼和肉","米饭和肉"],"explanation":"Thông tin đối chiếu trong bài: “我说不要再去饭馆，我去买一些面包和牛奶给他。”","evidence":"我说不要再去饭馆，我去买一些面包和牛奶给他。"},{"id":"H2-R11-3-v2-Q6","question":"朋友现在最想做什么？","answer":"休息","options":["吃饭","休息","坐出租车","上课"],"explanation":"Thông tin đối chiếu trong bài: “她说，朋友已经让医生看过了，现在可以回家休息。”","evidence":"她说，朋友已经让医生看过了，现在可以回家休息。"}]},{"id":"H2-R11-4","lesson":11,"revision":2,"title":"Bạn ngồi sau lớp bị đau đầu","text":"今天上课，我看见后面的同学没有写字。我问他怎么了，他说昨天晚上睡得太晚，现在头疼。我让他下课后跟我去医院，他说不想忘了今天的词。老师过来问了问，让他回家休息，明天再看我的本子。下课后，我写好今天的题，给他送到家。他的妈妈已经在家了，说他现在经常晚上看手机，不知道早点睡。我没有再跟他看电视，只给他介绍了老师说的几个词。他说最不想明天考试做不好。我说，今天休息好了，明天有时间学习。他喝了水，就在床上休息，我和他妈妈说再见。","translation":"Trong lớp tôi thấy bạn ngồi sau không viết. Bạn thức khuya nên đau đầu, nhưng không muốn bỏ lỡ từ mới để đi khám. Giáo viên hỏi rồi cho về nghỉ, mai xem vở tôi. Tan học tôi chép bài mang đến. Mẹ bạn nói gần đây hay xem điện thoại đêm, không chịu ngủ sớm. Tôi không xem tivi cùng, chỉ giới thiệu vài từ. Bạn sợ mai thi không tốt, tôi khuyên nghỉ hôm nay để mai học được. Uống nước xong bạn nghỉ trên giường, tôi chào mẹ bạn về.","pinyin":"jīntiān shàngkè ， wǒ kàn jiàn hòumiàn de tóngxué méiyǒu xiě zì 。 wǒ wèn tā zěnme le ， tā shuō zuótiān wǎnshang shuì de tài wǎn ， xiànzài tóu téng 。 wǒ ràng tā xià kè hòu gēn wǒ qù yīyuàn ， tā shuō bù xiǎng wàng le jīntiān de cí 。 lǎoshī guòlai wèn le wèn ， ràng tā huíjiā xiūxi ， míngtiān zài kàn wǒ de běnzi 。 xià kè hòu ， wǒ xiě hǎo jīntiān de tí ， gěi tā sòngdào jiā 。 tā de māma yǐjīng zàijiā le ， shuō tā xiànzài jīngcháng wǎnshang kàn shǒujī ， bù zhīdào zǎo diǎn shuì 。 wǒ méiyǒu zài gēn tā kàn diànshì ， zhǐ gěi tā jièshào le lǎoshī shuō de jǐ gè cí 。 tā shuō zuì bù xiǎng míngtiān kǎoshì zuò bù hǎo 。 wǒ shuō ， jīntiān xiūxi hǎo le ， míngtiān yǒu shíjiān xuéxí 。 tā hē le shuǐ ， jiù zài chuáng shàng xiūxi ， wǒ hé tā māma shuō zài jiàn 。","grammar":["Trợ từ động thái 着","Trợ từ động thái 着 (zhe)","Phó từ chỉ mức độ 「最」"],"questions":[{"id":"H2-R11-4-v2-Q1","question":"同学坐在教室哪儿？","answer":"后面","options":["后面","书店","桌子下","桌子前"],"explanation":"Thông tin đối chiếu trong bài: “今天上课，我看见后面的同学没有写字。”","evidence":"今天上课，我看见后面的同学没有写字。"},{"id":"H2-R11-4-v2-Q2","question":"他为什么头疼？","answer":"昨天晚上睡得太晚","options":["有点儿冷","昨天晚上睡得太晚","太热了","不冷"],"explanation":"Thông tin đối chiếu trong bài: “我问他怎么了，他说昨天晚上睡得太晚，现在头疼。”","evidence":"我问他怎么了，他说昨天晚上睡得太晚，现在头疼。"},{"id":"H2-R11-4-v2-Q3","question":"老师让他做什么？","answer":"回家休息","options":["写字","写汉字","回家休息","坐火车"],"explanation":"Thông tin đối chiếu trong bài: “老师过来问了问，让他回家休息，明天再看我的本子。”","evidence":"老师过来问了问，让他回家休息，明天再看我的本子。"},{"id":"H2-R11-4-v2-Q4","question":"我送什么到他家？","answer":"本子","options":["医","杯子","一个杯子","本子"],"explanation":"Thông tin đối chiếu trong bài: “老师过来问了问，让他回家休息，明天再看我的本子。”","evidence":"老师过来问了问，让他回家休息，明天再看我的本子。"},{"id":"H2-R11-4-v2-Q5","question":"他经常晚上看什么？","answer":"手机","options":["手机","生日画","画笔","鱼"],"explanation":"Thông tin đối chiếu trong bài: “他的妈妈已经在家了，说他现在经常晚上看手机，不知道早点睡。”","evidence":"他的妈妈已经在家了，说他现在经常晚上看手机，不知道早点睡。"},{"id":"H2-R11-4-v2-Q6","question":"他喝水后在哪儿休息？","answer":"床上","options":["我家","床上","学校旁边","桌子左边"],"explanation":"Thông tin đối chiếu trong bài: “他喝了水，就在床上休息，我和他妈妈说再见。”","evidence":"他喝了水，就在床上休息，我和他妈妈说再见。"}]},{"id":"H2-R11-5","lesson":11,"revision":2,"title":"Nồi cơm của bố khi mẹ đi vắng","text":"妈妈去西安旅游了，这个星期我跟爸爸在家。爸爸最喜欢吃鱼，但不会做，经常说出去吃就可以。我想让妈妈回来的时候高兴，就请奶奶让我们学做饭。奶奶来的时候，爸爸穿着上班的衣服，还拿着手机。我让他不要再看手机，跟我们一起洗菜。他有点儿不好意思，说自己手慢。我说慢一点儿没关系，别忘了看鱼。我们做了一个小时，鱼和菜都好了，米饭也不错。吃饭的时候，爸爸说第一次觉得自己做的比饭店的好吃。晚上我们给妈妈打电话，爸爸给她看桌子上的饭。我想，下次妈妈累的时候，爸爸也能让她休息了。","translation":"Mẹ đi Tây An, tuần này tôi ở nhà cùng bố. Bố thích cá nhưng chưa biết làm, thường muốn ra quán. Tôi mời bà dạy nấu để mẹ về vui. Bà đến, bố vẫn mặc đồ đi làm và cầm điện thoại. Tôi nhờ bố đặt xuống, cùng rửa rau. Bố ngại vì làm chậm, tôi bảo không sao, chỉ đừng quên xem cá. Một giờ sau cơm cá rau xong, khá ngon. Bố lần đầu thấy tự nấu ngon hơn quán. Tối gọi mẹ cho xem bữa ăn, tôi nghĩ từ nay mẹ mệt thì bố có thể để mẹ nghỉ.","pinyin":"māma qù Xī’ān lǚyóu le ， zhège xīngqī wǒ gēn bàba zàijiā 。 bàba zuì xǐhuan chī yú ， dàn bù huì zuò ， jīngcháng shuō chūqù chī jiù kěyǐ 。 wǒ xiǎng ràng māma huí lái de shíhou gāoxìng ， jiù qǐng nǎinai ràng wǒmen xué zuòfàn 。 nǎinai lái de shíhou ， bàba chuān zhe shàngbān de yīfu ， hái ná zhe shǒujī 。 wǒ ràng tā bú yào zài kàn shǒujī ， gēn wǒmen yìqǐ xǐ cài 。 tā yǒudiǎnr bù hǎo yìsi ， shuō zìjǐ shǒu màn 。 wǒ shuō màn yìdiǎnr méi guān xi ， bié wàng le kàn yú 。 wǒmen zuò le yí gè xiǎoshí ， yú hé cài dōu hǎo le ， mǐfàn yě búcuò 。 chīfàn de shíhou ， bàba shuō dì yī cì juéde zìjǐ zuò de bǐ fàndiàn de hǎochī 。 wǎnshang wǒmen gěi māma dǎ diànhuà ， bàba gěi tā kàn zhuōzi shàng de fàn 。 wǒ xiǎng ， xià cì māma lèi de shíhou ， bàba yě néng ràng tā xiūxi le 。","grammar":["Trợ từ động thái 着","Trợ từ động thái 着 (zhe)","Phó từ chỉ mức độ 「最」"],"questions":[{"id":"H2-R11-5-v2-Q1","question":"妈妈去哪儿旅游？","answer":"西安","options":["西安","小房间","桌子上","房间外边"],"explanation":"Thông tin đối chiếu trong bài: “妈妈去西安旅游了，这个星期我跟爸爸在家。”","evidence":"妈妈去西安旅游了，这个星期我跟爸爸在家。"},{"id":"H2-R11-5-v2-Q2","question":"爸爸最喜欢吃什么？","answer":"鱼","options":["茶","鱼","热牛奶","一杯水"],"explanation":"Thông tin đối chiếu trong bài: “爸爸最喜欢吃鱼，但不会做，经常说出去吃就可以。”","evidence":"爸爸最喜欢吃鱼，但不会做，经常说出去吃就可以。"},{"id":"H2-R11-5-v2-Q3","question":"我请谁来帮忙？","answer":"奶奶","options":["高中学生","李","奶奶","我"],"explanation":"Thông tin đối chiếu trong bài: “我想让妈妈回来的时候高兴，就请奶奶让我们学做饭。”","evidence":"我想让妈妈回来的时候高兴，就请奶奶让我们学做饭。"},{"id":"H2-R11-5-v2-Q4","question":"爸爸开始时拿着什么？","answer":"手机","options":["菜","饺子","面条儿","手机"],"explanation":"Thông tin đối chiếu trong bài: “奶奶来的时候，爸爸穿着上班的衣服，还拿着手机。”","evidence":"奶奶来的时候，爸爸穿着上班的衣服，还拿着手机。"},{"id":"H2-R11-5-v2-Q5","question":"我们做饭有多少时间？","answer":"一个小时","options":["一个小时","八月十号","三点","五点"],"explanation":"Thông tin đối chiếu trong bài: “我们做了一个小时，鱼和菜都好了，米饭也不错。”","evidence":"我们做了一个小时，鱼和菜都好了，米饭也不错。"},{"id":"H2-R11-5-v2-Q6","question":"晚上我们给谁打电话？","answer":"妈妈","options":["医生","妈妈","售货员","服务员"],"explanation":"Thông tin đối chiếu trong bài: “晚上我们给妈妈打电话，爸爸给她看桌子上的饭。”","evidence":"晚上我们给妈妈打电话，爸爸给她看桌子上的饭。"}]},{"id":"H2-R12-1","lesson":12,"revision":2,"title":"Trời âm u không có nghĩa sẽ mưa","text":"早上我看外面是阴天，就想今天不要出去了。爸爸说他小时候一看见阴天，就觉得会下雨，现在知道阴天也可以出去走走。我想坐地铁去书店，但不知道下午会不会下雨。妈妈让我在手机上看看天气，今天下午是晴天，比昨天热一点儿。我准备好书包，下楼去地铁站。地铁站比公交车站近，走路五分钟就到。我在书店看了两个小时的书，出来的时候天已经晴了。下午我没有回家，去了学校前边的饭馆。喝咖啡的时候，我想，早上不去书店，就看不到今天的晴天了。","translation":"Sáng thấy trời âm, tôi định không ra ngoài. Bố kể hồi nhỏ cứ âm u là nghĩ sẽ mưa, giờ biết vẫn đi dạo được. Tôi muốn đi tàu điện đến hiệu sách nhưng ngại mưa chiều. Mẹ bảo xem thời tiết trên điện thoại: chiều nắng, ấm hơn hôm qua. Tôi chuẩn bị cặp, xuống ga; ga gần hơn trạm xe buýt, đi năm phút. Đọc sách hai giờ, ra ngoài trời đã nắng. Tôi chưa về ngay mà ghé quán trước trường uống cà phê. Nghĩ nếu sáng không đi thì đã không thấy buổi chiều đẹp này.","pinyin":"zǎoshang wǒ kàn wàimiàn shì yīntiān ， jiù xiǎng jīntiā
