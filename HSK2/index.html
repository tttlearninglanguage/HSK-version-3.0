 số ước lượng", "formula": "Số nguyên chục + 多 + lượng từ + danh từ; hoặc số + lượng từ + 多 + danh từ (tùy đơn vị)", "explanation": "Trong tiếng Trung, để diễn tả một số lượng lớn hơn con số đã nêu, chúng ta đặt 「多」 ngay sau số đếm và lượng từ. Cấu trúc này giúp biểu thị ý nghĩa 'hơn' hoặc 'trên' một số lượng nhất định.", "tip": "Nếu số đếm là hàng chục (như 10, 20...), đặt 「多」 sau số đếm và trước lượng từ (ví dụ: 十多个人 - hơn 10 người).", "note": "Cần phân biệt với 「几」, vì 「多」 thường dùng cho số lượng lớn hơn, còn 「几」 dùng để hỏi hoặc ước lượng số lượng nhỏ hơn 10.", "examples": [{"zh": "北京大学有四万多名学生呢！", "pinyin": "běi jīng dà xué yǒu sì wàn duō míng xué shēng ne", "vi": "Đại học Bắc Kinh có hơn 40.000 sinh viên đấy!"}, {"zh": "教室里有二十多个学生。", "pinyin": "jiào shì lǐ yǒu èr shí duō gè xué shēng", "vi": "Trong lớp học có hơn 20 học sinh."}, {"zh": "这两个苹果五块多钱。", "pinyin": "zhè liǎng gè píng guǒ wǔ kuài duō qián", "vi": "Hai quả táo này có giá hơn 5 tệ."}], "clarification": "Ví dụ: 二十多个学生 (hơn 20 học sinh), 五块多钱 (hơn 5 tệ). Vị trí 多 cần phù hợp với đơn vị và cách đếm.", "newExamples": [{"zh": "小林买的书十多块钱。", "pinyin": "xiǎo lín mǎi de shū shí duō kuài qián 。", "vi": "Sách 小林 mua có giá hơn mười tệ."}, {"zh": "小林在车站等了二十多分钟。", "pinyin": "xiǎo lín zài chē zhàn děng le èr shí duō fēn zhōng 。", "vi": "小林 đã đợi ở bến xe hơn hai mươi phút."}]}, {"name": "Động từ/cụm động từ làm định ngữ", "formula": "Định ngữ (Động từ/Cụm động từ) + 的 + Trung tâm ngữ", "explanation": "Khi muốn dùng một hành động hoặc cụm từ để mô tả cho một danh từ, ta đặt hành động đó lên trước danh từ. Bắt buộc phải thêm trợ từ 「的」 vào giữa để nối định ngữ và trung tâm ngữ.", "tip": "Hãy xem định ngữ là một 'nhãn dán' mô tả tính chất cho danh từ phía sau, ví dụ: 'quần áo' (trung tâm ngữ) + 'mới mua' (định ngữ) = 'quần áo mới mua' 「新买的衣服」.", "note": "Đừng quên chữ 「的」, nếu thiếu nó câu văn sẽ bị coi là sai ngữ pháp trong tiếng Trung.", "examples": [{"zh": "他们卖的电影票也很便宜。", "pinyin": "tā men mài de diàn yǐng piào yě Tôi ăn cơm xong rồi.", "小雪今天来晚了。", "xiǎo xuě jīn tiān lái wǎn le", "Tiểu Tuyết hôm nay đến muộn rồi.", "Ví dụ: 菜都做好了。"]}, {"name": "Lặp lại động từ", "details": ["Công thức: AA (động từ đơn) hoặc ABAB (động từ đôi)", "Giải thích: Lặp lại động từ nhằm diễn tả hành động xảy ra trong thời gian ngắn, thử nghiệm hoặc mang sắc thái nhẹ nhàng. Cấu trúc này thường được dùng trong văn nói để tạo cảm giác gần gũi, thoải mái hơn. Ví dụ: 「看看」(xem thử) hoặc 「休息休息」(nghỉ ngơi một chút).", "Mẹo: Nếu động từ có hai âm tiết, bạn hãy lặp lại cả cụm theo dạng 「ABAB」, ví dụ 「打扫打扫」.", "Lưu ý: Không được dùng cấu trúc này với các động từ chỉ trạng thái tâm lý hoặc sự tồn tại như 「知道」, 「在」, 「有」.", "那你再想一想，你想好了，我来买票。", "nà nǐ zài xiǎng yī xiǎng nǐ xiǎng hǎo le wǒ lái mǎi piào", "Vậy bạn nghĩ thêm chút nữa đi, bạn nghĩ xong rồi thì mình sẽ đi mua vé.", "我有点儿累，现在想休息休息。", "wǒ yǒu diǎn ér lèi xiàn zài xiǎng xiū xī xiū xī", "Tôi hơi mệt, bây giờ muốn nghỉ ngơi một chút.", "你能过来帮帮忙吗？", "nǐ néng guò lái bāng bāng máng ma", "Bạn có thể qua đây giúp một tay không?", "Ví dụ: 那你再想一想，你想好了，我来买票。"]}, {"name": "Lặp lại động từ", "details": ["Công thức: Động từ đơn: AA | Động từ đa: ABAB | Thêm '了' giữa: A了A / AB了AB", "Giải thích: Việc lặp lại động từ nhằm diễn tả hành động xảy ra trong thời gian ngắn, mang tính chất thử nghiệm hoặc nhẹ nhàng. Cấu trúc này giúp câu văn trở nên tự nhiên và mềm mại hơn trong giao tiếp.", "Mẹo: Nếu động từ là từ đơn âm tiết, bạn có thể thêm 「了」 vào giữa hai từ, ví dụ: 「看一看」 hoặc 「看一看」 đều ổn.", "Lưu ý: Động từ lặp lại thường chỉ dùng cho các hành động mang tính ý chí, không dùng cho các động từ chỉ trạng thái tâm lý như 「爱」, 「想」 hay 「知道」.", "我休息了一下，现在觉得不累了。", "wǒ xiū xī le yī xià xiàn zài jué de bù lèi le", "Tôi đã nghỉ ngơi một lát, bây giờ thấy không mệt nữa rồi.", "他昨天来帮了帮忙。", "tā zuó tiān lái bāng le bāng máng", "Hôm qua anh ấy đã đến giúp một tay.", "Ví dụ: 我休息了一下，现在觉得不累了。"]}], "extended": [], "structuredGrammar": [{"name": "Bổ ngữ kết quả", "formula": "Chủ ngữ + Động từ + Bổ ngữ kết quả + (Tân ngữ)", "explanation": "Bổ ngữ kết quả được đặt ngay sau động từ chính để làm rõ kết quả hoặc trạng thái sau khi hành động xảy ra. Nó giúp người nghe hiểu rõ hơn về tính hoàn tất hoặc kết quả cụ thể của hành động đó trong câu.", "tip": "Các bổ ngữ kết quả thông dụng thường gặp là 「完」(xong), 「懂」(hiểu), 「见」(thấy), 「好」(xong/tốt), 「到」(đạt tới).", "note": "Khi phủ định, ta dùng 「没」(méi) hoặc 「没有」(méiyǒu) đặt trước động từ, tuyệt đối không dùng 「不」(bù) với bổ ngữ kết quả.", "examples": [{"zh": "菜都做好了。", "pinyin": "cài dōu zuò hǎo le", "vi": "Thức ăn đều đã nấu xong rồi."}, {"zh": "我吃完饭了。", "pinyin": "wǒ chī wán fàn le", "vi": "Tôi ăn cơm xong rồi."}, {"zh": "小雪今天来晚了。", "pinyin": "xiǎo xuě jīn tiān lái wǎn le", "vi": "Tiểu Tuyết hôm nay đến muộn rồi."}], "newExamples": [{"zh": "小林吃完饭以后就去上课了。", "pinyin": "xiǎo lín chī wán fàn yǐ hòu jiù qù shàng kè le 。", "vi": "Sau khi ăn cơm xong 小林 đi học ngay."}, {"zh": "老师又说了一遍，小林终于听懂了。", "pinyin": "lǎo shī yòu shuō le yī biàn ， xiǎo lín zhōng yú tīng dǒng le 。", "vi": "Thầy nói lại một lần, cuối cùng 小林 đã nghe hiểu."}]}, {"name": "Lặp lại động từ", "formula": "AA (động từ đơn) hoặc ABAB (động từ đôi)", "explanation": "Lặp lại động từ nhằm diễn tả hành động xảy ra trong thời gian ngắn, thử nghiệm hoặc mang sắc thái nhẹ nhàng. Cấu trúc này thường được dùng trong văn nói để tạo cảm giác gần gũi, thoải mái hơn. Ví dụ: 「看看」(xem thử) hoặc 「休息休息」(nghỉ ngơi một chút).", "tip": "Nếu động từ có hai âm tiết, bạn hãy lặp lại cả cụm theo dạng 「ABAB」, ví dụ 「打扫打扫」.", "note": "Không được dùng cấu trúc này với các động từ chỉ trạng thái tâm lý hoặc sự tồn tại như 「知道」, 「在」, 「有」.", "examples": [{"zh": "那你再想一想，你想好了，我来买票。", "pinyin": "nà nǐ zài xiǎng yī xiǎng nǐ xiǎng hǎo le wǒ lái mǎi piào", "vi": "Vậy bạn nghĩ thêm chút nữa đi, bạn nghĩ xong rồi thì mình sẽ đi mua vé."}, {"zh": "我有点儿累，现在想休息休息。", "pinyin": "wǒ yǒu diǎn ér lèi xiàn zài xiǎng xiū xī xiū xī", "vi": "Tôi hơi mệt, bây giờ muốn nghỉ ngơi một chút."}, {"zh": "你能过来帮帮忙吗？", "pinyin": "nǐ néng guò lái bāng bāng máng ma", "vi": "Bạn có thể qua đây giúp một tay không?"}], "newExamples": [{"zh": "这本书很有意思，小林，你也看看吧。", "pinyin": "zhè běn shū hěn yǒu yì si ， xiǎo lín ， nǐ yě kàn kàn ba 。", "vi": "Sách này thú vị, 小林, bạn cũng xem thử nhé."}, {"zh": "小林有点儿累，想先休息休息。", "pinyin": "xiǎo lín yǒu diǎn ér lèi ， xiǎng xiān xiū xī xiū xī 。", "vi": "小林 hơi mệt, muốn nghỉ một chút trước."}]}, {"name": "Lặp lại động từ", "formula": "Động từ đơn: AA | Động từ đa: ABAB | Thêm '了' giữa: A了A / AB了AB", "explanation": "Việc lặp lại động từ nhằm diễn tả hành động xảy ra trong thời gian ngắn, mang tính chất thử nghiệm hoặc nhẹ nhàng. Cấu trúc này giúp câu văn trở nên tự nhiên và mềm mại hơn trong giao tiếp.", "tip": "Nếu động từ là từ đơn âm tiết, bạn có thể thêm 「了」 vào giữa hai từ, ví dụ: 「看一看」 hoặc 「看一看」 đều ổn.", "note": "Động từ lặp lại thường chỉ dùng cho các hành động mang tính ý chí, không dùng cho các động từ chỉ trạng thái tâm lý như 「爱」, 「想」 hay 「知道」.", "examples": [{"zh": "我休息了一下，现在觉得不累了。", "pinyin": "wǒ xiū xī le yī xià xiàn zài jué de bù lèi le", "vi": "Tôi đã nghỉ ngơi một lát, bây giờ thấy không mệt nữa rồi."}, {"zh": "他昨天来帮了帮忙。", "pinyin": "tā zuó tiān lái bāng le bāng máng", "vi": "Hôm qua anh ấy đã đến giúp một tay."}], "newExamples": [{"zh": "小林看了看菜单，点了一碗面。", "pinyin": "xiǎo lín kàn le kàn cài dān ， diǎn le yī wǎn miàn 。", "vi": "小林 xem qua thực đơn rồi gọi một bát mì."}, {"zh": "小林想和小雨讨论讨论周末的计划。", "pinyin": "xiǎo lín xiǎng hé xiǎo yǔ tǎo lùn tǎo lùn zhōu mò de jì huà 。", "vi": "小林 muốn bàn một chút với 小雨 về kế hoạch cuối tuần."}]}]}, {"id": 4, "title": "Mua sắm và trải nghiệm", "subtitle": "过 · 商场 · 进去 · 条", "words": [{"id": "hsk2-04-01", "hanzi": "过", "pinyin": "guò", "meaning": "đã từng", "example": "我去过中国。", "examplePinyin": "Wǒ qù guo Zhōngguó.", "translation": "Tôi từng đến Trung Quốc."}, {"id": "hsk2-04-02", "hanzi": "商场", "pinyin": "shāngchǎng", "meaning": "trung tâm thương mại", "example": "商场里人很多。", "examplePinyin": "Shāngchǎng lǐ rén hěn duō.", "translation": "Trong trung tâm thương mại có nhiều người."}, {"id": "hsk2-04-03", "hanzi": "进去", "pinyin": "jìnqu", "meaning": "đi vào", "example": "请进去坐。", "examplePinyin": "Qǐng jìnqu zuò.", "translation": "Mời vào trong ngồi."}, {"id": "hsk2-04-04", "hanzi": "条", "pinyin": "tiáo", "meaning": "lượng từ vật dài", "example": "我买了一条裤子。", "examplePinyin": "Wǒ mǎi le yì tiáo kùzi.", "translation": "Tôi mua một chiếc quần."}, {"id": "hsk2-04-05", "hanzi": "裤子", "pinyin": "kùzi", "meaning": "quần", "example": "这条裤子很漂亮。", "examplePinyin": "Zhè tiáo kùzi hěn piàoliang.", "translation": "Chiếc quần này rất đẹp."}, {"id": "hsk2-04-06", "hanzi": "白色", "pinyin": "báisè", "meaning": "màu trắng", "example": "我喜欢白色。", "examplePinyin": "Wǒ xǐhuan báisè.", "translation": "Tôi thích màu trắng."}, {"id": "hsk2-04-07", "hanzi": "因为", "pinyin": "yīnwèi", "meaning": "bởi vì", "example": "因为下雨，我没出去。", "examplePinyin": "Yīnwèi xià yǔ, wǒ méi chūqu.", "translation": "Vì trời mưa nên tôi không ra ngoài."}, {"id": "hsk2-04-08", "hanzi": "试", "pinyin": "shì", "meaning": "thử", "example": "我想试一下。", "examplePinyin": "Wǒ xiǎng shì yíxià.", "translation": "Tôi muốn thử một chút."}, {"id": "hsk2-04-09", "hanzi": "红色", "pinyin": "hóngsè", "meaning": "màu đỏ", "example": "她喜欢红色。", "examplePinyin": "Tā xǐhuan hóngsè.", "translation": "Cô ấy thích màu đỏ."}, {"id": "hsk2-04-10", "hanzi": "所以", "pinyin": "suǒyǐ", "meaning": "cho nên", "example": "我累了，所以想休息。", "examplePinyin": "Wǒ lèi le, suǒyǐ xiǎng xiūxi.", "translation": "Tôi mệt nên muốn nghỉ."}, {"id": "hsk2-04-11", "hanzi": "书包", "pinyin": "shūbāo", "meaning": "cặp sách", "example": "书包在桌子上。", "examplePinyin": "Shūbāo zài zhuōzi shàng.", "translation": "Cặp sách ở trên bàn."}, {"id": "hsk2-04-12", "hanzi": "过去", "pinyin": "guòqù", "meaning": "quá khứ, đi qua", "example": "过去我住在北京。", "examplePinyin": "Guòqù wǒ zhù zài Běijīng.", "translation": "Trước đây tôi sống ở Bắc Kinh."}, {"id": "hsk2-04-13", "hanzi": "绿色", "pinyin": "lǜsè", "meaning": "màu xanh lá", "example": "这件衣服是绿色的。", "examplePinyin": "Zhè jiàn yīfu shì lǜsè de.", "translation": "Áo này màu xanh lá."}, {"id": "hsk2-04-14", "hanzi": "黑色", "pinyin": "hēisè", "meaning": "màu đen", "example": "我买黑色的。", "examplePinyin": "Wǒ mǎi hēisè de.", "translation": "Tôi mua cái màu đen."}, {"id": "hsk2-04-15", "hanzi": "更", "pinyin": "gèng", "meaning": "hơn", "example": "今天更冷。", "examplePinyin": "Jīntiān gèng lěng.", "translation": "Hôm nay lạnh hơn."}, {"id": "hsk2-04-16", "hanzi": "颜色", "pinyin": "yánsè", "meaning": "màu sắc", "example": "你喜欢什么颜色？", "examplePinyin": "Nǐ xǐhuan shénme yánsè?", "translation": "Bạn thích màu gì?"}], "grammar": [{"name": "Trợ từ động thái 过", "details": ["Công thức: S + V + 过 + (O) | S + 没(有) + V + 过 + (O)", "Giải thích: Trợ từ động thái 「过」 được dùng sau động từ để diễn tả một trải nghiệm hoặc hành động đã từng xảy ra trong quá khứ. Hành động này chỉ mang tính chất trải nghiệm và không còn kéo dài đến hiện tại.", "Mẹo: Khi muốn hỏi về trải nghiệm, hãy thêm 「吗」 ở cuối câu hoặc dùng cấu trúc 「没有」 ở cuối câu thay vì dùng 「吗」.", "Lưu ý: Đừng nhầm lẫn 「过」 với 「了」; 「了」 nhấn mạnh hành động đã hoàn thành, còn 「过」 nhấn mạnh vào trải nghiệm từng thực hiện.", "她去过中国。", "tā qù guò zhōng guó", "Cô ấy đã từng đi Trung Quốc.", "我吃过饺子，很好吃。", "wǒ chī guò jiǎo zi hěn hǎo chī", "Tôi đã từng ăn sủi cảo, rất ngon.", "她没去过中国。", "tā méi qù guò zhōng guó", "Cô ấy chưa từng đi Trung Quốc.", "Ví dụ: 她去过中国。"]}, {"name": "Cấu trúc nhân quả vì... nên...", "details": ["Công thức: 因为 (nguyên nhân), 所以 (kết quả)", "Giải thích: Cấu trúc này dùng để diễn tả quan hệ nguyên nhân và kết quả. 「因为」 đứng trước vế nêu lý do, còn 「所以」 đứng trước vế nêu kết quả tương ứng.", "Mẹo: Bạn có thể chỉ dùng một trong hai từ 「因为」 hoặc 「所以」 trong câu mà vẫn giữ nguyên ý nghĩa.", "Lưu ý: Trong tiếng Trung, bạn không nên đặt chủ ngữ trước 「因为」 nếu chủ ngữ ở hai vế là giống nhau.", "就是因为没穿过，所以要试试啊！", "jiù shì yīn wèi méi chuān guò suǒ yǐ yào shì shì a", "Chính vì chưa từng mặc nên mới phải thử chứ!", "因为我生病了，今天没去上班。", "yīn wèi wǒ shēng bìng le jīn tiān méi qù shàng bān", "Vì tôi bị bệnh nên hôm nay không đi làm.", "我没去过他家，所以让他开车来站接我。", "wǒ méi qù guò tā jiā suǒ yǐ ràng tā kāi chē lái zhàn jiē wǒ", "Tôi chưa từng đến nhà anh ấy nên bảo anh ấy lái xe đến trạm đón tôi.", "Ví dụ: 就是因为没穿过，所以要试试啊！"]}, {"name": "Cụm từ chữ 的 (Định ngữ)", "details": ["Công thức: Định ngữ + 的 + Danh từ (Trung tâm ngữ)", "Giải thích: Cấu trúc này dùng để nối các thành phần bổ nghĩa (định ngữ) với danh từ chính. Trong đó, 「的」 đóng vai trò như một chiếc cầu nối, giúp người nghe hiểu rõ tính chất hoặc chủ sở hữu của danh từ đó. Đôi khi danh từ chính có thể được lược bỏ nếu ngữ cảnh đã rõ ràng.", "Mẹo: Nếu định ngữ là đại từ chỉ quan hệ thân thiết như 「我的妈妈」(mẹ tôi) hay 「我的老师」(thầy tôi), bạn có thể lược bỏ 「的」 để câu tự nhiên hơn.", "Lưu ý: Đừng quên dùng 「的」 khi định ngữ là tính từ đa âm tiết hoặc cụm động từ bổ nghĩa cho danh từ, ví dụ: 「漂亮的书」 (sách đẹp).", "红色的、绿色的、黑色的，你想买哪个？", "hóng sè de lǜ sè de hēi sè de nǐ xiǎng mǎi nǎ gè", "Cái màu đỏ, màu xanh lá hay màu đen, bạn muốn mua cái nào?", "这个面包是爸爸买的，妈妈买的在那儿。", "zhè gè miàn bāo shì bà bà mǎi de mā mā mǎi de zài nà ér", "Cái bánh mì này là bố mua, cái mẹ mua ở đằng kia.", "这件衣服太贵了，还是买那件便宜的吧。", "zhè jiàn yī fú tài guì le hái shì mǎi nà jiàn pián yí de ba", "Bộ quần áo này đắt quá, hay là mua bộ rẻ kia đi.", "Ví dụ: 红色的、绿色的、黑色的，你想买哪个？"]}], "extended": [], "structuredGrammar": [{"name": "Trợ từ động thái 过", "formula": "S + V + 过 + (O) | S + 没(有) + V + 过 + (O)", "explanation": "Trợ từ động thái 「过」 được dùng sau động từ để diễn tả một trải nghiệm hoặc hành động đã từng xảy ra trong quá khứ. Hành động này chỉ mang tính chất trải nghiệm và không còn kéo dài đến hiện tại.", "tip": "Khi muốn hỏi về trải nghiệm, hãy thêm 「吗」 ở cuối câu hoặc dùng cấu trúc 「没有」 ở cuối câu thay vì dùng 「吗」.", "note": "Đừng nhầm lẫn 「过」 với 「了」; 「了」 nhấn mạnh hành động đã hoàn thành, còn 「过」 nhấn mạnh vào trải nghiệm từng thực hiện.", "examples": [{"zh": "她去过中国。", "pinyin": "tā qù guò zhōng guó", "vi": "Cô ấy đã từng đi Trung Quốc."}, {"zh": "我吃过饺子，很好吃。", "pinyin": "wǒ chī guò jiǎo zi hěn hǎo chī", "vi": "Tôi đã từng ăn sủi cảo, rất ngon."}, {"zh": "她没去过中国。", "pinyin": "tā méi qù guò zhōng guó", "vi": "Cô ấy chưa từng đi Trung Quốc."}], "newExamples": [{"zh": "小林以前去过北京，还想再去。", "pinyin": "xiǎo lín yǐ qián qù guò běi jīng ， hái xiǎng zài qù 。", "vi": "Trước đây 小林 từng đến Bắc Kinh và còn muốn đi nữa."}, {"zh": "小林以前没吃过饺子，今天是第一次。", "pinyin": "xiǎo lín yǐ qián méi chī guò jiǎo zi ， jīn tiān shì dì yī cì 。", "vi": "Trước đây 小林 chưa từng ăn sủi cảo, hôm nay là lần đầu."}]}, {"name": "Cấu trúc nhân quả vì... nên...", "formula": "因为 (nguyên nhân), 所以 (kết quả)", "explanation": "Cấu trúc này dùng để diễn tả quan hệ nguyên nhân và kết quả. 「因为」 đứng trước vế nêu lý do, còn 「所以」 đứng trước vế nêu kết quả tương ứng.", "tip": "Bạn có thể chỉ dùng một trong hai từ 「因为」 hoặc 「所以」 trong câu mà vẫn giữ nguyên ý nghĩa.", "note": "Trong tiếng Trung, bạn không nên đặt chủ ngữ trước 「因为」 nếu chủ ngữ ở hai vế là giống nhau.", "examples": [{"zh": "就是因为没穿过，所以要试试啊！", "pinyin": "jiù shì yīn wèi méi chuān guò suǒ yǐ yào shì shì a", "vi": "Chính vì chưa từng mặc nên mới phải thử chứ!"}, {"zh": "因为我生病了，今天没去上班。", "pinyin": "yīn wèi wǒ shēng bìng le jīn tiān méi qù shàng bān", "vi": "Vì tôi bị bệnh nên hôm nay không đi làm."}, {"zh": "我没去过他家，所以让他开车来站接我。", "pinyin": "wǒ méi qù guò tā jiā suǒ yǐ ràng tā kāi chē lái zhàn jiē wǒ", "vi": "Tôi chưa từng đến nhà anh ấy nên bảo anh ấy lái xe đến trạm đón tôi."}], "newExamples": [{"zh": "因为小林生病了，所以今天没来。", "pinyin": "yīn wèi xiǎo lín shēng bìng le ， suǒ yǐ jīn tiān méi lái 。", "vi": "Vì 小林 bị ốm nên hôm nay không đến."}, {"zh": "因为小林没有车，所以请小雨来接。", "pinyin": "yīn wèi xiǎo lín méi yǒu chē ， suǒ yǐ qǐng xiǎo yǔ lái jiē 。", "vi": "Vì 小林 không có xe nên nhờ 小雨 đến đón."}]}, {"name": "Cụm từ chữ 的 (Định ngữ)", "formula": "Định ngữ + 的 + Danh từ (Trung tâm ngữ)", "explanation": "Cấu trúc này dùng để nối các thành phần bổ nghĩa (định ngữ) với danh từ chính. Trong đó, 「的」 đóng vai trò như một chiếc cầu nối, giúp người nghe hiểu rõ tính chất hoặc chủ sở hữu của danh từ đó. Đôi khi danh từ chính có thể được lược bỏ nếu ngữ cảnh đã rõ ràng.", "tip": "Nếu định ngữ là đại từ chỉ quan hệ thân thiết như 「我的妈妈」(mẹ tôi) hay 「我的老师」(thầy tôi), bạn có thể lược bỏ 「的」 để câu tự nhiên hơn.", "note": "Đừng quên dùng 「的」 khi định ngữ là tính từ đa âm tiết hoặc cụm động từ bổ nghĩa cho danh từ, ví dụ: 「漂亮的书」 (sách đẹp).", "examples": [{"zh": "红色的、绿色的、黑色的，你想买哪个？", "pinyin": "hóng sè de lǜ sè de hēi sè de nǐ xiǎng mǎi nǎ gè", "vi": "Cái màu đỏ, màu xanh lá hay màu đen, bạn muốn mua cái nào?"}, {"zh": "这个面包是爸爸买的，妈妈买的在那儿。", "pinyin": "zhè gè miàn bāo shì bà bà mǎi de mā mā mǎi de zài nà ér", "vi": "Cái bánh mì này là bố mua, cái mẹ mua ở đằng kia."}, {"zh": "这件衣服太贵了，还是买那件便宜的吧。", "pinyin": "zhè jiàn yī fú tài guì le hái shì mǎi nà jiàn pián yí de ba", "vi": "Bộ quần áo này đắt quá, hay là mua bộ rẻ kia đi."}], "newExamples": [{"zh": "小林想买红色的，不想买黑色的。", "pinyin": "xiǎo lín xiǎng mǎi hóng sè de ， bù xiǎng mǎi hēi sè de 。", "vi": "小林 muốn mua cái màu đỏ, không muốn mua cái màu đen."}, {"zh": "这个杯子是小林的，那个是小雨的。", "pinyin": "zhè ge bēi zi shì xiǎo lín de ， nà ge shì xiǎo yǔ de 。", "vi": "Cốc này là của 小林, cốc kia là của 小雨."}]}]}, {"id": 5, "title": "Đón bạn đến nhà", "subtitle": "快 · 下来 · 上来 · 上去", "words": [{"id": "hsk2-05-01", "hanzi": "快", "pinyin": "kuài", "meaning": "nhanh", "example": "你快来！", "examplePinyin": "Nǐ kuài lái!", "translation": "Bạn đến nhanh lên!"}, {"id": "hsk2-05-02", "hanzi": "下来", "pinyin": "xiàlai", "meaning": "xuống đây", "example": "请下来。", "examplePinyin": "Qǐng xiàlai.", "translation": "Mời xuống đây."}, {"id": "hsk2-05-03", "hanzi": "上来", "pinyin": "shànglai", "meaning": "lên đây", "example": "你上来吧。", "examplePinyin": "Nǐ shànglai ba.", "translation": "Bạn lên đây đi."}, {"id": "hsk2-05-04", "hanzi": "上去", "pinyin": "shàngqu", "meaning": "lên đó", "example": "我走上去。", "examplePinyin": "Wǒ zǒu shàngqu.", "translation": "Tôi đi lên đó."}, {"id": "hsk2-05-05", "hanzi": "下面", "pinyin": "xiàmiàn", "meaning": "phía dưới", "example": "猫在桌子下面。", "examplePinyin": "Māo zài zhuōzi xiàmiàn.", "translation": "Mèo ở dưới bàn."}, {"id": "hsk2-05-06", "hanzi": "等", "pinyin": "děng", "meaning": "đợi", "example": "我在这里等你。", "examplePinyin": "Wǒ zài zhèlǐ děng nǐ.", "translation": "Tôi đợi bạn ở đây."}, {"id": "hsk2-05-07", "hanzi": "一会儿", "pinyin": "yíhuìr", "meaning": "một lát", "example": "请等一会儿。", "examplePinyin": "Qǐng děng yíhuìr.", "translation": "Hãy đợi một lát."}, {"id": "hsk2-05-08", "hanzi": "下去", "pinyin": "xiàqu", "meaning": "xuống đó", "example": "你先下去吧。", "examplePinyin": "Nǐ xiān xiàqu ba.", "translation": "Bạn xuống đó trước đi."}, {"id": "hsk2-05-09", "hanzi": "进来", "pinyin": "jìnlai", "meaning": "vào đây", "example": "请进来坐。", "examplePinyin": "Qǐng jìnlai zuò.", "translation": "Mời vào đây ngồi."}, {"id": "hsk2-05-10", "hanzi": "爷爷", "pinyin": "yéye", "meaning": "ông nội", "example": "爷爷喜欢喝茶。", "examplePinyin": "Yéye xǐhuan hē chá.", "translation": "Ông nội thích uống trà."}, {"id": "hsk2-05-11", "hanzi": "奶奶", "pinyin": "nǎinai", "meaning": "bà nội", "example": "奶奶在家。", "examplePinyin": "Nǎinai zài jiā.", "translation": "Bà nội ở nhà."}, {"id": "hsk2-05-12", "hanzi": "礼物", "pinyin": "lǐwù", "meaning": "quà", "example": "这是给你的礼物。", "examplePinyin": "Zhè shì gěi nǐ de lǐwù.", "translation": "Đây là quà dành cho bạn."}, {"id": "hsk2-05-13", "hanzi": "准备", "pinyin": "zhǔnbèi", "meaning": "chuẩn bị", "example": "我正在准备考试。", "examplePinyin": "Wǒ zhèngzài zhǔnbèi kǎoshì.", "translation": "Tôi đang chuẩn bị thi."}, {"id": "hsk2-05-14", "hanzi": "奶茶", "pinyin": "nǎichá", "meaning": "trà sữa", "example": "我想喝奶茶。", "examplePinyin": "Wǒ xiǎng hē nǎichá.", "translation": "Tôi muốn uống trà sữa."}, {"id": "hsk2-05-15", "hanzi": "跟", "pinyin": "gēn", "meaning": "cùng, với", "example": "我跟朋友去学校。", "examplePinyin": "Wǒ gēn péngyou qù xuéxiào.", "translation": "Tôi đến trường cùng bạn."}, {"id": "hsk2-05-16", "hanzi": "走", "pinyin": "zǒu", "meaning": "đi", "example": "我们走吧。", "examplePinyin": "Wǒmen zǒu ba.", "translation": "Chúng ta đi thôi."}, {"id": "hsk2-05-17", "hanzi": "酒店", "pinyin": "jiǔdiàn", "meaning": "khách sạn", "example": "酒店在车站旁边。", "examplePinyin": "Jiǔdiàn zài chēzhàn pángbiān.", "translation": "Khách sạn ở cạnh bến xe."}], "grammar": [{"name": "Bổ ngữ xu hướng đơn sau động từ chỉ hướng (上/下/进/出/回 + 来/去)", "details": ["Công thức: Động từ chỉ hướng (上/下/进/出/回/过) + 来 (lái) / 去 (qù)", "Giải thích: Bổ ngữ xu hướng đơn dùng để chỉ hướng di chuyển của hành động. Ở đây động từ chính là các động từ chỉ hướng như 「上」, 「下」, 「出」, 「进」, 「回」; thêm 「来」 khi hành động tiến về phía người nói và 「去」 khi hành động rời xa người nói (上来, 下去, 出来).", "Mẹo: Hãy ghi nhớ quy tắc đơn giản: 「来」 là 'đến đây', 「去」 là 'đi đó'.", "Lưu ý: Nếu có tân ngữ chỉ nơi chốn, phải đặt nó giữa động từ và 「来/去」 (回家去, 进教室来), không đặt sau 「来/去」.", "我不上去了，就在下面等你。", "wǒ bù shàng qù le jiù zài xià miàn děng nǐ", "Tôi không lên nữa, ở ngay dưới này đợi bạn.", "家月到下边了，你下去接她吧。", "jiā yuè dào xià biān le nǐ xià qù jiē tā ba", "Gia Nguyệt đến phía dưới rồi, bạn xuống đón cô ấy đi.", "我在外面呢，你出来吧。", "wǒ zài wài miàn ne nǐ chū lái ba", "Tôi đang ở bên ngoài này, bạn ra ngoài đi.", "Ví dụ: 我不上去了，就在下面等你。"]}, {"name": "Bổ ngữ xu hướng đơn sau động từ hành động (拿来, 送来)", "details": ["Công thức: Động từ + 来 (lái) / 去 (qù)", "Giải thích: Bổ ngữ xu hướng đơn được dùng sau động từ để chỉ hướng di chuyển của hành động. 「来」 dùng khi hướng về phía người nói (đến đây), còn 「去」 dùng khi hướng rời xa người nói (đi đó).", "Mẹo: Hãy tưởng tượng bạn là tâm điểm; nếu hành động tiến về phía bạn, hãy dùng 「来」, nếu hành động tiến xa bạn, hãy dùng 「去」.", "Lưu ý: Nếu có tân ngữ chỉ nơi chốn, tân ngữ đó bắt buộc phải đặt giữa động từ và bổ ngữ xu hướng (Ví dụ: 回家去 - về nhà đi).", "你们太客气了，还拿这么多礼物来！", "nǐ men tài kè qì le hái ná zhè me duō lǐ wù lái", "Các bạn khách sáo quá, còn mang nhiều quà đến thế này!", "家月给我送来了一本书。", "jiā yuè gěi wǒ sòng lái le yī běn shū", "Gia Nguyệt mang đến tặng tôi một quyển sách.", "上课了，你们快进教室来吧。", "shàng kè le nǐ men kuài jìn jiào shì lái ba", "Đến giờ học rồi, các bạn mau vào lớp đi.", "Ví dụ: 你们太客气了，还拿这么多礼物来！"]}, {"name": "Cấu trúc nhấn mạnh thời gian 「都……了」", "details": ["Công thức: 都 + [thời gian/sự việc] + 了", "Giải thích: Cấu trúc này được dùng để nhấn mạnh một sự việc đã xảy ra hoặc đã đến một thời điểm nào đó. Nó thường mang sắc thái cảm thán, thể hiện sự ngạc nhiên hoặc không hài lòng của người nói về việc gì đó đã kéo dài hoặc đã đến lúc phải thay đổi.", "Mẹo: Bạn có thể hiểu 「都」 trong trường hợp này giống như từ 'đã' hoặc 'đến tận' để nhấn mạnh sự trễ nải hoặc quá mức.", "Lưu ý: Cấu trúc này thường đi kèm với cảm xúc cá nhân, nên hãy chú ý ngữ điệu khi nói để người nghe hiểu rõ thái độ của bạn.", "都12点了，我们吃饭吧。", "dōu diǎn le wǒ men chī fàn ba", "Đã 12 giờ rồi, chúng ta ăn cơm thôi.", "都8点半了，你还不起床吗？", "dōu diǎn bàn le nǐ hái bù qǐ chuáng ma", "Đã 8 giờ rưỡi rồi, bạn vẫn chưa ngủ dậy sao?", "我都去过北京了，不想再去了。", "wǒ dōu qù guò běi jīng le bù xiǎng zài qù le", "Tôi đã đi Bắc Kinh rồi, không muốn đi nữa.", "Ví dụ: 都12点了，我们吃饭吧。"]}], "extended": [], "structuredGrammar": [{"name": "Bổ ngữ xu hướng đơn sau động từ chỉ hướng (上/下/进/出/回 + 来/去)", "formula": "Động từ chỉ hướng (上/下/进/出/回/过) + 来 (lái) / 去 (qù)", "explanation": "Bổ ngữ xu hướng đơn dùng để chỉ hướng di chuyển của hành động. Ở đây động từ chính là các động từ chỉ hướng như 「上」, 「下」, 「出」, 「进」, 「回」; thêm 「来」 khi hành động tiến về phía người nói và 「去」 khi hành động rời xa người nói (上来, 下去, 出来).", "tip": "Hãy ghi nhớ quy tắc đơn giản: 「来」 là 'đến đây', 「去」 là 'đi đó'.", "note": "Nếu có tân ngữ chỉ nơi chốn, phải đặt nó giữa động từ và 「来/去」 (回家去, 进教室来), không đặt sau 「来/去」.", "examples": [{"zh": "我不上去了，就在下面等你。", "pinyin": "wǒ bù shàng qù le jiù zài xià miàn děng nǐ", "vi": "Tôi không lên nữa, ở ngay dưới này đợi bạn."}, {"zh": "家月到下边了，你下去接她吧。", "pinyin": "jiā yuè dào xià biān le nǐ xià qù jiē tā ba", "vi": "Gia Nguyệt đến phía dưới rồi, bạn xuống đón cô ấy đi."}, {"zh": "我在外面呢，你出来吧。", "pinyin": "wǒ zài wài miàn ne nǐ chū lái ba", "vi": "Tôi đang ở bên ngoài này, bạn ra ngoài đi."}], "newExamples": [{"zh": "小林在楼上叫：“小雨，上来吧，我在这儿。”", "pinyin": "xiǎo lín zài lóu shàng jiào ： “ xiǎo yǔ ， shàng lái ba ， wǒ zài zhè ér 。 ”", "vi": "小林 ở trên lầu gọi: “小雨, lên đây nhé, tôi ở đây.”"}, {"zh": "小林在楼下说：“我不上去了，在下面等你。”", "pinyin": "xiǎo lín zài lóu xià shuō ： “ wǒ bù shàng qù le ， zài xià miàn děng nǐ 。 ”", "vi": "小林 ở dưới lầu nói: “Tôi không lên đó nữa, sẽ đợi bạn ở dưới.”"}]}, {"name": "Bổ ngữ xu hướng đơn sau động từ hành động (拿来, 送来)", "formula": "Động từ + 来 (lái) / 去 (qù)", "explanation": "Bổ ngữ xu hướng đơn được dùng sau động từ để chỉ hướng di chuyển của hành động. 「来」 dùng khi hướng về phía người nói (đến đây), còn 「去」 dùng khi hướng rời xa người nói (đi đó).", "tip": "Hãy tưởng tượng bạn là tâm điểm; nếu hành động tiến về phía bạn, hãy dùng 「来」, nếu hành động tiến xa bạn, hãy dùng 「去」.", "note": "Nếu có tân ngữ chỉ nơi chốn, tân ngữ đó bắt buộc phải đặt giữa động từ và bổ ngữ xu hướng (Ví dụ: 回家去 - về nhà đi).", "examples": [{"zh": "你们太客气了，还拿这么多礼物来！", "pinyin": "nǐ men tài kè qì le hái ná zhè me duō lǐ wù lái", "vi": "Các bạn khách sáo quá, còn mang nhiều quà đến thế này!"}, {"zh": "家月给我送来了一本书。", "pinyin": "jiā yuè gěi wǒ sòng lái le yī běn shū", "vi": "Gia Nguyệt mang đến tặng tôi một quyển sách."}, {"zh": "上课了，你们快进教室来吧。", "pinyin": "shàng kè le nǐ men kuài jìn jiào shì lái ba", "vi": "Đến giờ học rồi, các bạn mau vào lớp đi."}], "newExamples": [{"zh": "小林说：“请把那本书拿来，给我看看。”", "pinyin": "xiǎo lín shuō ： “ qǐng bǎ nà běn shū ná lái ， gěi wǒ kàn kàn 。 ”", "vi": "小林 nói: “Hãy mang quyển sách kia lại đây cho tôi xem.”"}, {"zh": "小林在家对小雨说：“把这本书带到学校去。”", "pinyin": "xiǎo lín zài jiā duì xiǎo yǔ shuō ： “ bǎ zhè běn shū dài dào xué xiào qù 。 ”", "vi": "小林 ở nhà nói với 小雨: “Mang quyển sách này đến trường đi.”"}]}, {"name": "Cấu trúc nhấn mạnh thời gian 「都……了」", "formula": "都 + [thời gian/sự việc] + 了", "explanation": "Cấu trúc này được dùng để nhấn mạnh một sự việc đã xảy ra hoặc đã đến một thời điểm nào đó. Nó thường mang sắc thái cảm thán, thể hiện sự ngạc nhiên hoặc không hài lòng của người nói về việc gì đó đã kéo dài hoặc đã đến lúc phải thay đổi.", "tip": "Bạn có thể hiểu 「都」 trong trường hợp này giống như từ 'đã' hoặc 'đến tận' để nhấn mạnh sự trễ nải hoặc quá mức.", "note": "Cấu trúc này thường đi kèm với cảm xúc cá nhân, nên hãy chú ý ngữ điệu khi nói để người nghe hiểu rõ thái độ của bạn.", "examples": [{"zh": "都12点了，我们吃饭吧。", "pinyin": "dōu 1 2 diǎn le ， wǒ men chī fàn ba 。", "vi": "Đã 12 giờ rồi, chúng ta ăn cơm thôi."}, {"zh": "都8点半了，你还不起床吗？", "pinyin": "dōu 8 diǎn bàn le ， nǐ hái bù qǐ chuáng ma ？", "vi": "Đã 8 giờ rưỡi rồi, bạn vẫn chưa ngủ dậy sao?"}, {"zh": "我都去过北京了，不想再去了。", "pinyin": "wǒ dōu qù guò běi jīng le bù xiǎng zài qù le", "vi": "Tôi đã đi Bắc Kinh rồi, không muốn đi nữa."}], "newExamples": [{"zh": "小林说：“都十一点了，你怎么还不睡？”", "pinyin": "xiǎo lín shuō ： “ dōu shí yì diǎn le ， nǐ zěn me hái bù shuì ？ ”", "vi": "小林 nói: “Đã mười một giờ rồi, sao bạn còn chưa ngủ?”"}, {"zh": "小林说：“都八点半了，快起床！”", "pinyin": "xiǎo lín shuō ： “ dōu bā diǎn bàn le ， kuài qǐ chuáng ！ ”", "vi": "小林 nói: “Đã tám giờ rưỡi rồi, mau dậy!”"}]}]}, {"id": 6, "title": "Sinh nhật vui vẻ", "subtitle": "生日 · 忘 · 画 · 画笔", "words": [{"id": "hsk2-06-01", "hanzi": "生日", "pinyin": "shēngrì", "meaning": "sinh nhật", "example": "今天是我的生日。", "examplePinyin": "Jīntiān shì wǒ de shēngrì.", "translation": "Hôm nay là sinh nhật tôi."}, {"id": "hsk2-06-02", "hanzi": "忘", "pinyin": "wàng", "meaning": "quên", "example": "别忘了带书。", "examplePinyin": "Bié wàng le dài shū.", "translation": "Đừng quên mang sách."}, {"id": "hsk2-06-03", "hanzi": "画", "pinyin": "huà", "meaning": "vẽ, tranh", "example": "我喜欢画画。", "examplePinyin": "Wǒ xǐhuan huà huà.", "translation": "Tôi thích vẽ tranh."}, {"id": "hsk2-06-04", "hanzi": "画笔", "pinyin": "huàbǐ", "meaning": "bút vẽ", "example": "这是我的画笔。", "examplePinyin": "Zhè shì wǒ de huàbǐ.", "translation": "Đây là bút vẽ của tôi."}, {"id": "hsk2-06-05", "hanzi": "蛋糕", "pinyin": "dàngāo", "meaning": "bánh kem", "example": "蛋糕很好吃。", "examplePinyin": "Dàngāo hěn hǎochī.", "translation": "Bánh kem rất ngon."}, {"id": "hsk2-06-06", "hanzi": "快乐", "pinyin": "kuàilè", "meaning": "vui vẻ", "example": "祝你生日快乐！", "examplePinyin": "Zhù nǐ shēngrì kuàilè!", "translation": "Chúc bạn sinh nhật vui vẻ!"}, {"id": "hsk2-06-07", "hanzi": "打开", "pinyin": "dǎkāi", "meaning": "mở", "example": "请打开门。", "examplePinyin": "Qǐng dǎkāi mén.", "translation": "Hãy mở cửa."}, {"id": "hsk2-06-08", "hanzi": "长", "pinyin": "cháng", "meaning": "dài", "example": "这条路很长。", "examplePinyin": "Zhè tiáo lù hěn cháng.", "translation": "Con đường này rất dài."}, {"id": "hsk2-06-09", "hanzi": "鱼", "pinyin": "yú", "meaning": "cá", "example": "我喜欢吃鱼。", "examplePinyin": "Wǒ xǐhuan chī yú.", "translation": "Tôi thích ăn cá."}, {"id": "hsk2-06-10", "hanzi": "肉", "pinyin": "ròu", "meaning": "thịt", "example": "我不吃肉。", "examplePinyin": "Wǒ bù chī ròu.", "translation": "Tôi không ăn thịt."}, {"id": "hsk2-06-11", "hanzi": "过", "pinyin": "guò", "meaning": "đã từng", "example": "我去过中国。", "examplePinyin": "Wǒ qù guo Zhōngguó.", "translation": "Tôi từng đến Trung Quốc."}, {"id": "hsk2-06-12", "hanzi": "地", "pinyin": "de", "meaning": "trợ từ trạng ngữ", "example": "她高兴地笑了。", "examplePinyin": "Tā gāoxìng de xiào le.", "translation": "Cô ấy vui vẻ mỉm cười."}, {"id": "hsk2-06-13", "hanzi": "床", "pinyin": "chuáng", "meaning": "giường", "example": "猫在床上。", "examplePinyin": "Māo zài chuáng shàng.", "translation": "Mèo ở trên giường."}, {"id": "hsk2-06-14", "hanzi": "舒服", "pinyin": "shūfu", "meaning": "thoải mái", "example": "这张床很舒服。", "examplePinyin": "Zhè zhāng chuáng hěn shūfu.", "translation": "Chiếc giường này rất thoải mái."}], "grammar": [{"name": "Lặp lại tính từ đơn âm tiết", "details": ["Công thức: AA + (的) | Ví dụ: 高高(的), 大大(的)", "Giải thích: Trong tiếng Trung, các tính từ đơn âm tiết thường được lặp lại để nhấn mạnh trạng thái hoặc tạo cảm giác gần gũi, miêu tả sinh động hơn. Khi dùng làm định ngữ đứng trước danh từ, bạn nên thêm trợ từ 「的」 vào sau tính từ đã lặp lại.", "Mẹo: Hãy tưởng tượng việc lặp lại tính từ giống như cách chúng ta thêm từ láy trong tiếng Việt để làm câu văn hay và biểu cảm hơn.", "Lưu ý: Không phải tính từ nào cũng có thể lặp lại, hãy chú ý xem từ đó có tự nhiên trong khẩu ngữ hay không.", "我再给她买个大大的生日蛋糕。", "wǒ zài gěi tā mǎi gè dà dà de shēng rì dàn gāo", "Tôi mua thêm cho cô ấy một cái bánh sinh nhật thật to.", "这只猫小小的，真让人喜欢。", "zhè zhī māo xiǎo xiǎo de zhēn ràng rén xǐ huān", "Chú mèo này nhỏ xíu, thật khiến người ta yêu quý.", "Ví dụ: 我再给她买个大大的生日蛋糕。"]}, {"name": "Cấu trúc liệt kê “什么的”", "details": ["Công thức: Danh từ 1, Danh từ 2... + 什么的", "Giải thích: Cụm từ 「什么的」 được đặt sau các danh từ đã liệt kê để chỉ rằng vẫn còn những sự vật tương tự khác chưa kể hết. Cấu trúc này thường dùng trong văn nói để câu văn trở nên tự nhiên hơn. Ví dụ: 我喜欢吃苹果、香蕉什么的 (Tôi thích ăn táo, chuối và những thứ tương tự).", "Mẹo: Bạn có thể hiểu 「什么的」 mang nghĩa tương đương với 'vân vân' hoặc 'các thứ' trong tiếng Việt.", "Lưu ý: Cấu trúc này chủ yếu dùng trong giao tiếp khẩu ngữ, không nên dùng trong các văn bản viết trang trọng.", "桌子上有电脑、杯子、书和画笔什么的。", "zhuō zi shàng yǒu diàn nǎo bēi zi shū hé huà bǐ shén me de", "Trên bàn có máy tính, cái ly, sách và cọ vẽ đại loại vậy.", "她拿来了一些水、面包和苹果什么的。", "tā ná lái le yī xiē shuǐ miàn bāo hé píng guǒ shén me de", "Cô ấy mang đến một ít nước, bánh mì và táo đại loại vậy.", "Ví dụ: 桌子上有电脑、杯子、书和画笔什么的。"]}, {"name": "Trợ từ kết cấu 地", "details": ["Công thức: Trạng ngữ + 地 + Động từ", "Giải thích: Trợ từ kết cấu 「地」 được đặt sau trạng ngữ (thường là tính từ) để bổ nghĩa cho động từ đứng sau nó. Nó giúp diễn tả cách thức hoặc trạng thái của một hành động đang diễn ra.", "Mẹo: Hãy nhớ quy tắc: 「的」 đi với danh từ, 「地」 đi với động từ, còn 「得」 đi với bổ ngữ.", "Lưu ý: Đừng nhầm lẫn với 「的」; trong khẩu ngữ, cả ba trợ từ này đều phát âm giống nhau là 'de', nhưng cách dùng trong văn viết thì hoàn toàn khác biệt.", "还要高高兴兴地玩。", "hái yào gāo gāo xìng xìng de wán", "Còn phải chơi đùa một cách thật vui vẻ.", "老师早早地到了教室。", "lǎo shī zǎo zǎo de dào le jiào shì", "Thầy giáo đã đến lớp từ rất sớm.", "爸爸很快地吃完早饭，就去上班了。", "bà bà hěn kuài de chī wán zǎo fàn jiù qù shàng bān le", "Bố ăn xong bữa sáng rất nhanh rồi đi làm luôn.", "Ví dụ: 还要高高兴兴地玩。"]}], "extended": [], "structuredGrammar": [{"name": "Lặp lại tính từ đơn âm tiết", "formula": "AA + (的) | Ví dụ: 高高(的), 大大(的)", "explanation": "Trong tiếng Trung, các tính từ đơn âm tiết thường được lặp lại để nhấn mạnh trạng thái hoặc tạo cảm giác gần gũi, miêu tả sinh động hơn. Khi dùng làm định ngữ đứng trước danh từ, bạn nên thêm trợ từ 「的」 vào sau tính từ đã lặp lại.", "tip": "Hãy tưởng tượng việc lặp lại tính từ giống như cách chúng ta thêm từ láy trong tiếng Việt để làm câu văn hay và biểu cảm hơn.", "note": "Không phải tính từ nào cũng có thể lặp lại, hãy chú ý xem từ đó có tự nhiên trong khẩu ngữ hay không.", "examples": [{"zh": "我再给她买个大大的生日蛋糕。", "pinyin": "wǒ zài gěi tā mǎi gè dà dà de shēng rì dàn gāo", "vi": "Tôi mua thêm cho cô ấy một cái bánh sinh nhật thật to."}, {"zh": "这只猫小小的，真让人喜欢。", "pinyin": "zhè zhī māo xiǎo xiǎo de zhēn ràng rén xǐ huān", "vi": "Chú mèo này nhỏ xíu, thật khiến người ta yêu quý."}], "newExamples": [{"zh": "小林给小雨买了一个大大的生日蛋糕。", "pinyin": "xiǎo lín gěi xiǎo yǔ mǎi le yí gè dà dà de shēng rì dàn gāo 。", "vi": "小林 mua cho 小雨 một chiếc bánh sinh nhật thật to."}, {"zh": "小林养了一只小小的猫。", "pinyin": "xiǎo lín yǎng le yī zhī xiǎo xiǎo de māo 。", "vi": "小林 nuôi một chú mèo nhỏ xíu."}]}, {"name": "Cấu trúc liệt kê “什么的”", "formula": "Danh từ 1, Danh từ 2... + 什么的", "explanation": "Cụm từ 「什么的」 được đặt sau các danh từ đã liệt kê để chỉ rằng vẫn còn những sự vật tương tự khác chưa kể hết. Cấu trúc này thường dùng trong văn nói để câu văn trở nên tự nhiên hơn. Ví dụ: 我喜欢吃苹果、香蕉什么的 (Tôi thích ăn táo, chuối và những thứ tương tự).", "tip": "Bạn có thể hiểu 「什么的」 mang nghĩa tương đương với 'vân vân' hoặc 'các thứ' trong tiếng Việt.", "note": "Cấu trúc này chủ yếu dùng trong giao tiếp khẩu ngữ, không nên dùng trong các văn bản viết trang trọng.", "examples": [{"zh": "桌子上有电脑、杯子、书和画笔什么的。", "pinyin": "zhuō zi shàng yǒu diàn nǎo bēi zi shū hé huà bǐ shén me de", "vi": "Trên bàn có máy tính, cái ly, sách và cọ vẽ đại loại vậy."}, {"zh": "她拿来了一些水、面包和苹果什么的。", "pinyin": "tā ná lái le yī xiē shuǐ miàn bāo hé píng guǒ shén me de", "vi": "Cô ấy mang đến một ít nước, bánh mì và táo đại loại vậy."}], "newExamples": [{"zh": "小林买了面包、水果什么的，准备去旅行。", "pinyin": "xiǎo lín mǎi le miàn bāo 、 shuǐ guǒ shén me de ， zhǔn bèi qù lǚ xíng 。", "vi": "小林 mua bánh mì, trái cây và các thứ tương tự để đi du lịch."}, {"zh": "桌上有小林的书、本子、画笔什么的。", "pinyin": "zhuō shàng yǒu xiǎo lín de shū 、 běn zi 、 huà bǐ shén me de 。", "vi": "Trên bàn có sách, vở, cọ vẽ và những thứ tương tự của 小林."}]}, {"name": "Trợ từ kết cấu 地", "formula": "Trạng ngữ + 地 + Động từ", "explanation": "Trợ từ kết cấu 「地」 được đặt sau trạng ngữ (thường là tính từ) để bổ nghĩa cho động từ đứng sau nó. Nó giúp diễn tả cách thức hoặc trạng thái của một hành động đang diễn ra.", "tip": "Hãy nhớ quy tắc: 「的」 đi với danh từ, 「地」 đi với động từ, còn 「得」 đi với bổ ngữ.", "note": "Đừng nhầm lẫn với 「的」; trong khẩu ngữ, cả ba trợ từ này đều phát âm giống nhau là 'de', nhưng cách dùng trong văn viết thì hoàn toàn khác biệt.", "examples": [{"zh": "还要高高兴兴地玩。", "pinyin": "hái yào gāo gāo xìng xìng de wán", "vi": "Còn phải chơi đùa một cách thật vui vẻ."}, {"zh": "老师早早地到了教室。", "pinyin": "lǎo shī zǎo zǎo de dào le jiào shì", "vi": "Thầy giáo đã đến lớp từ rất sớm."}, {"zh": "爸爸很快地吃完早饭，就去上班了。", "pinyin": "bà bà hěn kuài de chī wán zǎo fàn jiù qù shàng bān le", "vi": "Bố ăn xong bữa sáng rất nhanh rồi đi làm luôn."}], "newExamples": [{"zh": "小林高高兴兴地走进教室。", "pinyin": "xiǎo lín gāo gāo xìng xìng dì zǒu jìn jiào shì 。", "vi": "小林 vui vẻ bước vào lớp."}, {"zh": "小林早早地来到车站等小雨。", "pinyin": "xiǎo lín zǎo zǎo dì lái dào chē zhàn děng xiǎo yǔ 。", "vi": "小林 đến bến xe thật sớm để đợi 小雨."}]}]}, {"id": 7, "title": "Học tập và thể thao", "subtitle": "从 · 往 · 跑 · 打", "words": [{"id": "hsk2-07-01", "hanzi": "从", "pinyin": "cóng", "meaning": "từ", "example": "我从学校回来。", "examplePinyin": "Wǒ cóng xuéxiào huílai.", "translation": "Tôi từ trường về."}, {"id": "hsk2-07-02", "hanzi": "往", "pinyin": "wǎng", "meaning": "hướng", "example": "请往左走。", "examplePinyin": "Qǐng wǎng zuǒ zǒu.", "translation": "Hãy đi về bên trái."}, {"id": "hsk2-07-03", "hanzi": "跑", "pinyin": "pǎo", "meaning": "chạy", "example": "他跑得很快。", "examplePinyin": "Tā pǎo de hěn kuài.", "translation": "Anh ấy chạy rất nhanh."}, {"id": "hsk2-07-04", "hanzi": "打", "pinyin": "dǎ", "meaning": "đánh, chơi", "example": "我会打篮球。", "examplePinyin": "Wǒ huì dǎ lánqiú.", "translation": "Tôi biết chơi bóng rổ."}, {"id": "hsk2-07-05", "hanzi": "篮球", "pinyin": "lánqiú", "meaning": "bóng rổ", "example": "他喜欢打篮球。", "examplePinyin": "Tā xǐhuan dǎ lánqiú.", "translation": "Anh ấy thích chơi bóng rổ."}, {"id": "hsk2-07-06", "hanzi": "运动", "pinyin": "yùndòng", "meaning": "vận động", "example": "我每天运动。", "examplePinyin": "Wǒ měitiān yùndòng.", "translation": "Tôi vận động mỗi ngày."}, {"id": "hsk2-07-07", "hanzi": "踢", "pinyin": "tī", "meaning": "đá", "example": "我们去踢足球。", "examplePinyin": "Wǒmen qù tī zúqiú.", "translation": "Chúng ta đi đá bóng."}, {"id": "hsk2-07-08", "hanzi": "足球", "pinyin": "zúqiú", "meaning": "bóng đá", "example": "他喜欢足球。", "examplePinyin": "Tā xǐhuan zúqiú.", "translation": "Anh ấy thích bóng đá."}, {"id": "hsk2-07-09", "hanzi": "球", "pinyin": "qiú", "meaning": "quả bóng", "example": "这个球很大。", "examplePinyin": "Zhège qiú hěn dà.", "translation": "Quả bóng này rất to."}, {"id": "hsk2-07-10", "hanzi": "得", "pinyin": "de", "meaning": "trợ từ bổ ngữ", "example": "她唱得很好。", "examplePinyin": "Tā chàng de hěn hǎo.", "translation": "Cô ấy hát rất hay."}, {"id": "hsk2-07-11", "hanzi": "跑步", "pinyin": "pǎobù", "meaning": "chạy bộ", "example": "我每天跑步。", "examplePinyin": "Wǒ měitiān pǎobù.", "translation": "Tôi chạy bộ mỗi ngày."}, {"id": "hsk2-07-12", "hanzi": "游泳", "pinyin": "yóuyǒng", "meaning": "bơi", "example": "我喜欢游泳。", "examplePinyin": "Wǒ xǐhuan yóuyǒng.", "translation": "Tôi thích bơi."}, {"id": "hsk2-07-13", "hanzi": "游", "pinyin": "yóu", "meaning": "bơi", "example": "鱼在水里游。", "examplePinyin": "Yú zài shuǐ lǐ yóu.", "translation": "Cá bơi trong nước."}, {"id": "hsk2-07-14", "hanzi": "爱好", "pinyin": "àihào", "meaning": "sở thích", "example": "你的爱好是什么？", "examplePinyin": "Nǐ de àihào shì shénme?", "translation": "Sở thích của bạn là gì?"}, {"id": "hsk2-07-15", "hanzi": "开始", "pinyin": "kāishǐ", "meaning": "bắt đầu", "example": "我们开始上课。", "examplePinyin": "Wǒmen kāishǐ shàngkè.", "translation": "Chúng ta bắt đầu vào học."}], "grammar": [{"name": "Cấu trúc một khi... liền...", "details": ["Công thức: 一 [động từ/tính từ] 就 [động từ/tính từ]", "Giải thích: Cấu trúc này dùng để diễn tả hai hành động hoặc sự việc xảy ra nối tiếp nhau rất nhanh. Khi vế trước vừa xảy ra xong thì vế sau lập tức diễn ra ngay sau đó.", "Mẹo: Bạn có thể hiểu 「一」 mang nghĩa là 'vừa mới' và 「就」 mang nghĩa là 'liền', 'ngay lập tức'.", "Lưu ý: Không được dùng từ chỉ thời gian cụ thể (như 'hôm qua', 'ngày mai') trong cấu trúc này vì nó chỉ mối quan hệ nhân quả hoặc trình tự thời gian sát nút.", "你怎么一下课就往外跑？", "nǐ zěn me yī xià kè jiù wǎng wài pǎo", "Sao bạn vừa tan học đã chạy ra ngoài thế?", "我一到家，妈妈就打来电话了。", "wǒ yī dào jiā mā mā jiù dǎ lái diàn huà le", "Tôi vừa về đến nhà là mẹ đã gọi điện tới rồi.", "一到星期六，陈天中就跟同学去打篮球。", "yī dào xīng qī liù chén tiān zhōng jiù gēn tóng xué qù dǎ lán qiú", "Cứ đến thứ Bảy là Trần Thiên Trung lại đi chơi bóng rổ với bạn học.", "Ví dụ: 你怎么一下课就往外跑？"]}, {"name": "Bổ ngữ trạng thái với 得", "details": ["Công thức: Động từ + 得 + Hình dung từ (Tính từ)", "Giải t  rất tốt).", "note": "Đừng quên từ 「得」 ở giữa động từ và tính từ, đây là lỗi sai phổ biến nhất khi mới bắt đầu học.", "examples": [{"zh": "我游泳游得不快。", "pinyin": "wǒ yóu yǒng yóu de bù kuài", "vi": "Tôi bơi không nhanh."}, {"zh": "你篮球打得怎么样？", "pinyin": "nǐ lán qiú dǎ de zěn me yàng", "vi": "Bạn chơi bóng rổ thế nào?"}, {"zh": "白家月写汉字写得很好看。", "pinyin": "bái jiā yuè xiě hàn zì xiě de hěn hǎo kàn", "vi": "Bạch Gia Nguyệt viết chữ Hán rất đẹp."}], "newExamples": [{"zh": "小林汉字写得很好看。", "pinyin": "xiǎo lín hàn zì xiě de hěn hǎo kàn 。", "vi": "小林 viết chữ Hán rất đẹp."}, {"zh": "小林说中文说得很流利。", "pinyin": "xiǎo lín shuō zhōng wén shuō de hěn liú lì 。", "vi": "小林 nói tiếng Trung rất lưu loát."}]}]}, {"id": 8, "title": "Chọn điều mình thích", "subtitle": "手表 · 左边 · 左 · 比", "words": [{"id": "hsk2-08-01", "hanzi": "手表", "pinyin": "shǒubiǎo", "meaning": "đồng hồ đeo tay", "example": "这块手表是妈妈送给我的。", "examplePinyin": "zhè kuài shǒu biǎo shì mā mā sòng gěi wǒ de 。", "translation": "Chiếc đồng hồ này là mẹ tặng tôi."}, {"id": "hsk2-08-02", "hanzi": "左边", "pinyin": "zuǒbian", "meaning": "bên trái", "example": "左边的书是我的，右边的是你的。", "examplePinyin": "zuǒ biān de shū shì wǒ de ， yòu biān de shì nǐ de 。", "translation": "Sách bên trái là của tôi, bên phải là của bạn."}, {"id": "hsk2-08-03", "hanzi": "左", "pinyin": "zuǒ", "meaning": "trái", "example": "从这里向左走，银行就在前面。", "examplePinyin": "cóng zhè lǐ xiàng zuǒ zǒu ， yín háng jiù zài qián miàn 。", "translation": "Từ đây rẽ trái, ngân hàng ở ngay phía trước."}, {"id": "hsk2-08-04", "hanzi": "比", "pinyin": "bǐ", "meaning": "so với", "example": "这条路比那条近，我们走这条吧。", "examplePinyin": "zhè tiáo lù bǐ nà tiáo jìn ， wǒ men zǒu zhè tiáo ba 。", "translation": "Đường này gần hơn đường kia, chúng ta đi đường này nhé."}, {"id": "hsk2-08-05", "hanzi": "右边", "pinyin": "yòubian", "meaning": "bên phải", "example": "坐在我右边的女孩是我的同学。", "examplePinyin": "zuò zài wǒ yòu biān de nǚ hái shì wǒ de tóng xué 。", "translation": "Cô gái ngồi bên phải tôi là bạn học của tôi."}, {"id": "hsk2-08-06", "hanzi": "右", "pinyin": "yòu", "meaning": "phải", "example": "出了门向右走就到了。", "examplePinyin": "chū le mén xiàng yòu zǒu jiù dào le 。", "translation": "Ra cửa rẽ phải là đến."}, {"id": "hsk2-08-07", "hanzi": "记得", "pinyin": "jìde", "meaning": "nhớ", "example": "我还记得第一次见你的时候。", "examplePinyin": "wǒ hái jì de dì yī cì jiàn nǐ de shí hòu 。", "translation": "Tôi vẫn nhớ lần đầu gặp bạn."}, {"id": "hsk2-08-08", "hanzi": "爱情片", "pinyin": "àiqíngpiàn", "meaning": "phim tình cảm", "example": "姐姐喜欢爱情片，我更喜欢有意思的故事。", "examplePinyin": "jiě jiě xǐ huān ài qíng piàn ， wǒ gèng xǐ huān yǒu yì si de gù shì 。", "translation": "Chị thích phim tình cảm, tôi thích những câu chuyện thú vị hơn."}, {"id": "hsk2-08-09", "hanzi": "有意思", "pinyin": "yǒu yìsi", "meaning": "thú vị", "example": "跟你一起学习很有意思。", "examplePinyin": "gēn nǐ yì qǐ xué xí hěn yǒu yì si 。", "translation": "Học cùng bạn rất thú vị."}, {"id": "hsk2-08-10", "hanzi": "点", "pinyin": "diǎn", "meaning": "giờ, điểm", "example": "现在三点了，我们去喝点儿水吧。", "examplePinyin": "xiàn zài sān diǎn le ， wǒ men qù hē diǎn ér shuǐ ba 。", "translation": "Bây giờ ba giờ rồi, chúng ta đi uống chút nước nhé."}, {"id": "hsk2-08-11", "hanzi": "虽然", "pinyin": "suīrán", "meaning": "mặc dù", "example": "虽然今天很累，我还是去运动了。", "examplePinyin": "suī rán jīn tiān hěn lèi ， wǒ hái shì qù yùn dòng le 。", "translation": "Tuy hôm nay mệt, tôi vẫn đã đi vận động."}, {"id": "hsk2-08-12", "hanzi": "但是", "pinyin": "dànshì", "meaning": "nhưng", "example": "我听懂了，但是还不会说。", "examplePinyin": "wǒ tīng dǒng le ， dàn shì hái bú huì shuō 。", "translation": "Tôi nghe hiểu rồi nhưng vẫn chưa nói được."}, {"id": "hsk2-08-13", "hanzi": "花", "pinyin": "huā", "meaning": "hoa", "example": "妈妈最喜欢红色的花。", "examplePinyin": "mā mā zuì xǐ huān hóng sè de huā 。", "translation": "Mẹ thích hoa màu đỏ nhất."}, {"id": "hsk2-08-14", "hanzi": "妻子", "pinyin": "qīzi", "meaning": "vợ", "example": "他的妻子是一名教师。", "examplePinyin": "tā de qī zǐ shì yī míng jiào shī 。", "translation": "Vợ anh ấy .", "Ví dụ: 我看网上说这个电影比那个爱情片更有意思。"]}, {"name": "Cấu trúc câu nhượng bộ Tuy... nhưng", "details": ["Công thức: 虽然 (Sui rán) + [Mệnh đề 1], 但是 (dàn shì) + [Mệnh đề 2]", "Giải thích: Cấu trúc 「虽然……，但是……」 dùng để nối hai mệnh đề có ý nghĩa tương phản nhau. Bạn dùng nó để diễn đạt ý \"mặc dù... nhưng mà...\" trong tiếng Việt.", "Mẹo: Trong khẩu ngữ, bạn có thể lược bỏ 「虽然」 nhưng vẫn giữ lại 「但是」 để câu tự nhiên hơn.", "Lưu ý: Không được dùng đồng thời cả 「虽然」 và 「但是」 trong cùng một câu nếu ý nghĩa không có sự đối lập rõ ràng.", "虽然你忘了，但是我还记得。", "suī rán nǐ wàng le dàn shì wǒ hái jì de", "Mặc dù bạn đã quên nhưng tôi vẫn còn nhớ.", "外边下雪了，但是不太冷。", "wài biān xià xuě le dàn shì bù tài lěng", "Bên ngoài tuyết rơi rồi nhưng không lạnh lắm.", "虽然觉得有点儿累，我还是走回家了。", "suī rán jué de yǒu diǎn ér lèi wǒ hái shì zǒu huí jiā le", "Mặc dù thấy hơi mệt nhưng tôi vẫn đi bộ về nhà.", "Ví dụ: 虽然你忘了，但是我还记得。"]}], "extended": [], "structuredGrammar": [{"name": "Câu so sánh hơn với 比", "formula": "A 比 B + [Tính từ]", "explanation": "Cấu trúc 「A 比 B + Tính từ」 dùng để so sánh sự khác biệt giữa hai đối tượng. Trong đó, A là đối tượng được so sánh, B là đối tượng làm chuẩn, và tính từ đứng sau dùng để chỉ tính chất.", "tip": "Bạn có thể thêm các phó từ chỉ mức độ như 「更」 (gèng) hoặc 「还」 (hái) vào trước tính từ để nhấn mạnh sự so sánh, ví dụ: 「今天比昨天更冷」.", "note": "Trong câu so sánh với 「比」, tuyệt đối không được dùng 「很」 trước tính từ.", "examples": [{"zh": "我也觉得左边的比右边的好看。", "pinyin": "wǒ yě jué de zuǒ biān de bǐ yòu biān de hǎo kàn", "vi": "Tôi cũng thấy cái bên trái đẹp hơn cái bên phải."}, {"zh": "今天比昨天冷。", "pinyin": "jīn tiān bǐ zuó tiān lěng", "vi": "Hôm nay lạnh hơn hôm qua."}, {"zh": "他觉得踢足球比打篮球有意思。", "pinyin": "tā jué de tī zú qiú bǐ dǎ lán qiú yǒu yì sī", "vi": "Anh ấy thấy đá bóng thú vị hơn chơi bóng rổ."}], "newExamples": [{"zh": "小林比小雨高，但是年龄更小。", "pinyin": "xiǎo lín bǐ xiǎo yǔ gāo ， dàn shì nián líng gèng xiǎo 。", "vi": "小林 cao hơn 小雨 nhưng tuổi nhỏ hơn."}, {"zh": "小林觉得今天比昨天冷。", "pinyin": "xiǎo lín jué de jīn tiān bǐ zuó tiān lěng 。", "vi": "小林 thấy hôm nay lạnh hơn hôm qua."}]}, {"name": "Câu so sánh 比 với 更/还", "formula": "A 比 B + 更/还 + Tính từ", "explanation": "Cấu trúc này dùng khi cả A và B đều có tính chất được nói tới, nhưng A ở mức cao hơn. Đặt 「更」 hoặc 「还」 ngay trước tính từ để nhấn mạnh mức chênh lệch.", "tip": "「还」 thường mang thêm sắc thái ngạc nhiên hoặc nhấn mạnh hơn 「更」, ví dụ: 「他比我还高」.", "note": "Không được thêm các từ chỉ mức độ như 「很」, 「非常」 vào trước tính từ trong câu so sánh có 「比」.", "examples": [{"zh": "我看网上说这个电影比那个爱情片更有意思。", "pinyin": "wǒ kàn wǎng shàng shuō zhè gè diàn yǐng bǐ nà gè ài qíng piàn gèng yǒu yì sī", "vi": "Tôi thấy trên mạng nói bộ phim này thú vị hơn bộ phim tình cảm kia."}, {"zh": "今天比昨天更热。", "pinyin": "jīn tiān bǐ zuó tiān gèng rè", "vi": "Hôm nay còn nóng hơn cả hôm qua."}], "newExamples": [{"zh": "小林觉得这本书比那本更有意思。", "pinyin": "xiǎo lín jué de zhè běn shū bǐ nà běn gèng yǒu yì si 。", "vi": "小林 thấy sách này còn thú vị hơn sách kia."}, {"zh": "小林的弟弟比小林还高。", "pinyin": "xiǎo lín de dì di bǐ xiǎo lín hái gāo 。", "vi": "Em trai của 小林 còn cao hơn 小林."}]}, {"name": "Cấu trúc câu nhượng bộ Tuy... nhưng", "formula": "虽然 (Sui rán) + [Mệnh đề 1], 但是 (dàn shì) + [Mệnh đề 2]", "explanation": "Cấu trúc 「虽然……，但是……」 dùng để nối hai mệnh đề có ý nghĩa tương phản nhau. Bạn dùng nó để diễn đạt ý \"mặc dù... nhưng mà...\" trong tiếng Việt.", "tip": "Trong khẩu ngữ, bạn có thể lược bỏ 「虽然」 nhưng vẫn giữ lại 「但是」 để câu tự nhiên hơn.", "note": "Không được dùng đồng thời cả 「虽然」 và 「但是」 trong cùng một câu nếu ý nghĩa không có sự đối lập rõ ràng.", "examples": [{"zh": "虽然你忘了，但是我还记得。", "pinyin": "suī rán nǐ wàng le dàn shì wǒ hái jì de", "vi": "Mặc dù bạn đã quên nhưng tôi vẫn còn nhớ."}, {"zh": "外边下雪了，但是不太冷。", "pinyin": "wài biān xià xuě le dàn shì bù tài lěng", "vi": "Bên ngoài tuyết rơi rồi nhưng không lạnh lắm."}, {"zh": "虽然觉得有点儿累，我还是走回家了。", "pinyin": "suī rán jué de yǒu diǎn ér lèi wǒ hái shì zǒu huí jiā le", "vi": "Mặc dù thấy hơi mệt nhưng tôi vẫn đi bộ về nhà."}], "newExamples": [{"zh": "虽然小林很忙，但是每天都给家里打电话。", "pinyin": "suī rán xiǎo lín hěn máng ， dàn shì měi tiān dōu gěi jiā lǐ dǎ diàn huà 。", "vi": "Tuy 小林 bận nhưng ngày nào cũng gọi điện về nhà."}, {"zh": "虽然小林觉得累，但是还是做完了作业。", "pinyin": "suī rán xiǎo lín jué de lèi ， dàn shì hái shì zuò wán le zuò yè 。", "vi": "Tuy 小林 thấy mệt nhưng vẫn làm xong bài tập."}]}]}, {"id": 9, "title": "Khoảng cách và thời gian", "subtitle": "坏 · 旁边 · 男孩儿 · 这样", "words": [{"id": "hsk2-09-01", "hanzi": "坏", "pinyin": "huài", "meaning": "xấu, hỏng", "example": "我的手机坏了，不能打电话。", "examplePinyin": "wǒ de shǒu jī huài le ， bù néng dǎ diàn huà 。", "translation": "Điện thoại của tôi hỏng rồi, không gọi được."}, {"id": "hsk2-09-02", "hanzi": "旁边", "pinyin": "pángbiān", "meaning": "bên cạnh", "example": "请把书放在电脑旁边。", "examplePinyin": "qǐng bǎ shū fàng zài diàn nǎo páng biān 。", "translation": "Hãy đặt sách ở cạnh máy tính."}, {"id": "hsk2-09-03", "hanzi": "男孩儿", "pinyin": "nánháir", "meaning": "bé trai", "example": "那个男孩儿比我弟弟大两岁。", "examplePinyin": "nà ge nán hái er bǐ wǒ dì di dà liǎng suì 。", "translation": "Cậu bé kia lớn hơn em trai tôi hai tuổi."}, {"id": "hsk2-09-04", "hanzi": "这样", "pinyin": "zhèyàng", "meaning": "như thế này", "example": "这样做比以前方便多了。", "examplePinyin": "zhè yàng zuò bǐ yǐ qián fāng biàn duō le 。", "translation": "Làm như vậy tiện hơn trước nhiều."}, {"id": "hsk2-09-05", "hanzi": "个子", "pinyin": "gèzi", "meaning": "chiều cao", "example": "他的个子比哥哥还高。", "examplePinyin": "tā de gè zi bǐ gē gē hái gāo 。", "translation": "Dáng người anh ấy còn cao hơn anh trai."}, {"id": "hsk2-09-06", "hanzi": "那么", "pinyin": "nàme", "meaning": "như vậy, đến thế", "example": "这道题没有你想的那么难。", "examplePinyin": "zhè dào tí méi yǒu nǐ xiǎng de nà me nán 。", "translation": "Bài này không khó như bạn nghĩ."}, {"id": "hsk2-09-07", "hanzi": "高", "pinyin": "gāo", "meaning": "cao", "example": "这座楼比我们学校的楼高多了。", "examplePinyin": "zhè zuò lóu bǐ wǒ men xué xiào de lóu gāo duō le 。", "translation": "Tòa nhà này cao hơn tòa ở trường chúng tôi nhiều."}, {"id": "hsk2-09-08", "hanzi": "门口", "pinyin": "ménkǒu", "meaning": "cửa ra vào", "example": "老师站在门口等我们。", "examplePinyin": "lǎo shī zhàn zài mén kǒu děng wǒ men 。", "translation": "Thầy đứng ở cửa đợi chúng tôi."}, {"id": "hsk2-09-09", "hanzi": "咖啡", "pinyin": "kāfēi", "meaning": "cà phê", "example": "晚上喝咖啡以后，我常常睡不着。", "examplePinyin": "wǎn shàng hē kā fēi yǐ hòu ， wǒ cháng cháng shuì bù zhe 。", "translation": "Sau khi uống cà phê buổi tối tôi thường không ngủ được."}, {"id": "hsk2-09-10", "hanzi": "离", "pinyin": "lí", "meaning": "cách", "example": "学校离我家只有十分钟的路。", "examplePinyin": "xué xiào lí wǒ jiā zhǐ yǒu shí fēn zhōng de lù 。", "translation": "Trường chỉ cách nhà tôi mười phút đi đường."}, {"id": "hsk2-09-11", "hanzi": "近", "pinyin": "jìn", "meaning": "gần", "example": "我家离公园很近。", "examplePinyin": "wǒ jiā lí gōng yuán hěn jìn 。", "translation": "Nhà tôi rất gần công viên."}, {"id": "hsk2-09-12", "hanzi": "走路", "pinyin": "zǒulù", "meaning": "đi bộ", "example": "比起坐车，我更喜欢走路。", "examplePinyin": "bǐ qǐ zuò chē ， wǒ gèng xǐ huān zǒu lù 。", "translation": "So với đi xe tôi thích đi bộ hơn."}, {"id": "hsk2-09-13", "hanzi": "周", "pinyin": "zhōu", "meaning": "tuần", "example": "我一周去两次图书馆。", "examplePinyin": "wǒ yī zhōu qù liǎng cì tú shū guǎn 。", "translation": "Mỗi tuần tôi đến thư viện hai lần."}], "grammar": [{"name": "So sánh bằng", "details": ["Công thức: A 跟 B (不) 一样 (+ [Tính từ])", "Giải thích: Cấu trúc này dùng để so sánh sự tương đồng giữa hai đối tượng. Nếu thêm tính từ phía sau 「一样」, nó giúp xác định rõ khía cạnh đang được so sánh (ví dụ: kích thước, độ dài, màu sắc).", "Mẹo: Nếu muốn nói 'không giống nhau', bạn chỉ cần thêm 「不」 trước 「一样」 là được.", "Lưu ý: Lưu ý rằng sau 「一样」 thường không cần thêm các từ chỉ mức độ như 「很」 hay 「非常」.", "我的个子跟哥哥一样高。", "wǒ de gè zi gēn gē ge yī yàng gāo", "Tôi cao bằng anh trai.", "今天跟昨天一样冷。", "jīn tiān gēn zuó tiān yī yàng lěng", "Hôm nay lạnh như hôm qua.", "这块手表跟那块不一样。", "zhè kuài shǒu biǎo gēn nà kuài bù yī yàng", "Chiếc đồng hồ này không giống chiếc kia.", "Ví dụ: 我的个子跟哥哥一样高。"]}, {"name": "Diễn tả khoảng cách với 离", "details": ["Công thức: A + 离 + B + (khoảng cách / 近 / 远)", "Giải thích: Động từ 「离」 được dùng để diễn tả khoảng cách giữa hai địa điểm, người hoặc sự vật. Cấu trúc này giúp xác định xem từ điểm A đến điểm B cách nhau bao xa hoặc gần/xa như thế nào.", "Mẹo: Bạn có thể thêm từ 「近」(gần) hoặc 「远」(xa) vào cuối câu để nhấn mạnh khoảng cách.", "Lưu ý: Không được nhầm lẫn 「离」 (khoảng cách) với 「从」 (điểm xuất phát của hành động).", "咖啡店离这儿有点儿远。", "kā fēi diàn lí zhè ér yǒu diǎn ér yuǎn", "Quán cà phê cách đây hơi xa một chút.", "学校离医院不远。", "xué xiào lí yī yuàn bù yuǎn", "Trường học cách bệnh viện không xa.", "现在离我的生日还有三天。", "xiàn zài lí wǒ de shēng rì hái yǒu sān tiān", "Bây giờ cách ngày sinh nhật của tôi còn ba ngày nữa.", "Ví dụ: 咖啡店离这儿有点儿远。"]}, {"name": "Bổ ngữ thời lượng (Diễn tả khoảng thời gian)", "details": ["Công thức: Động từ + (tân ngữ) + Động từ + bổ ngữ thời lượng", "Giải thích: Bổ ngữ thời lượng dùng để chỉ khoảng thời gian kéo dài của một hành động. Khi câu có tân ngữ, bạn cần lặp lại động từ trước khi thêm khoảng thời gian, ví dụ 「我学中文学了两年」 (Tôi đã học tiếng Trung được hai năm).", "Mẹo: Nếu không muốn lặp lại động từ, bạn có thể đưa tân ngữ ra sau bổ ngữ thời lượng (chỉ áp dụng với tân ngữ chỉ người hoặc vật cụ thể).", "Lưu ý: Đừng quên thêm trợ từ 「了」 sau bổ ngữ thời lượng để thể hiện hành động đã xảy ra hoặc kéo dài đến hiện tại.", "走半个多小时就到了。", "zǒu bàn gè duō xiǎo shí jiù dào le", "Đi bộ hơn nửa tiếng là đến rồi.", "我们休息十分钟。", "wǒ men xiū xī shí fēn zhōng", "Chúng ta nghỉ ngơi mười phút.", "Ví dụ: 走半个多小时就到了。"]}], "extended": [], "structuredGrammar": [{"name": "So sánh bằng", "formula": "A 跟 B (不) 一样 (+ [Tính từ])", "explanation": "Cấu trúc này dùng để so sánh sự tương đồng giữa hai đối tượng. Nếu thêm tính từ phía sau 「一样」, nó giúp xác định rõ khía cạnh đang được so sánh (ví dụ: kích thước, độ dài, màu sắc).", "tip": "Nếu muốn nói 'không giống nhau', bạn chỉ cần thêm 「不」 trước 「一样」 là được.", "note": "Lưu ý rằng sau 「一样」 thường không cần thêm các từ chỉ mức độ như 「很」 hay 「非常」.", "examples": [{"zh": "我的个子跟哥哥一样高。", "pinyin": "wǒ de gè zi gēn gē ge yī yàng gāo", "vi": "Tôi cao bằng anh trai."}, {"zh": "今天跟昨天一样冷。", "pinyin": "jīn tiān gēn zuó tiān yī yàng lěng", "vi": "Hôm nay lạnh như hôm qua."}, {"zh": "这块手表跟那块不一样。", "pinyin": "zhè kuài shǒu biǎo gēn nà kuài bù yī yàng", "vi": "Chiếc đồng hồ này không giống chiếc kia."}], "newExamples": [{"zh": "小林的书包跟小雨的一样大。", "pinyin": "xiǎo lín de shū bāo gēn xiǎo yǔ de yī yàng dà 。", "vi": "Cặp của 小林 to bằng cặp của 小雨."}, {"zh": "小林喜欢蓝色，小雨喜欢红色，他们的爱好不一样。", "pinyin": "xiǎo lín xǐ huān lán sè ， xiǎo yǔ xǐ huān hóng sè ， tā men de ài hào bù yí yàng 。", "vi": "小林 thích xanh dương, 小雨 thích đỏ, sở thích họ khác nhau."}]}, {"name": "Diễn tả khoảng cách với 离", "formula": "A + 离 + B + (khoảng cách / 近 / 远)", "explanation": "Động từ 「离」 được dùng để diễn tả khoảng cách giữa hai địa điểm, người hoặc sự vật. Cấu trúc này giúp xác định xem từ điểm A đến điểm B cách nhau bao xa hoặc gần/xa như thế nào.", "tip": "Bạn có thể thêm từ 「近」(gần) hoặc 「远」(xa) vào cuối câu để nhấn mạnh khoảng cách.", "note": "Không được nhầm lẫn 「离」 (khoảng cách) với 「从」 (điểm xuất phát của hành động).", "examples": [{"zh": "咖啡店离这儿有点儿远。", "pinyin": "kā fēi diàn lí zhè ér yǒu diǎn ér yuǎn", "vi": "Quán cà phê cách đây hơi xa một chút."}, {"zh": "学校离医院不远。", "pinyin": "xué xiào lí yī yuàn bù yuǎn", "vi": "Trường học cách bệnh viện không xa."}, {"zh": "现在离我的生日还有三天。", "pinyin": "xiàn zài lí wǒ de shēng rì hái yǒu sān tiān", "vi": "Bây giờ cách ngày sinh nhật của tôi còn ba ngày nữa."}], "newExamples": [{"zh": "小林家离学校很近，走路就能到。", "pinyin": "xiǎo lín jiā lí xué xiào hěn jìn ， zǒu lù jiù néng dào 。", "vi": "Nhà 小林 rất gần trường, đi bộ là đến."}, {"zh": "小林问：“这里离机场有多远？”", "pinyin": "xiǎo lín wèn ： “ zhè lǐ lí jī chǎng yǒu duō yuǎn ？ ”", "vi": "小林 hỏi: “Từ đây cách sân bay bao xa?”"}]}, {"name": "Bổ ngữ thời lượng (Diễn tả khoảng thời gian)", "formula": "Động từ + (tân ngữ) + Động từ + bổ ngữ thời lượng", "explanation": "Bổ ngữ thời lượng dùng để chỉ khoảng thời gian kéo dài của một hành động. Khi câu có tân ngữ, bạn cần lặp lại động từ trước khi thêm khoảng thời gian, ví dụ 「我学中文学了两年」 (Tôi đã học tiếng Trung được hai năm).", "tip": "Nếu không muốn lặp lại động từ, bạn có thể đưa tân ngữ ra sau bổ ngữ thời lượng (chỉ áp dụng với tân ngữ chỉ người hoặc vật cụ thể).", "note": "Đừng quên thêm trợ từ 「了」 sau bổ ngữ thời lượng để thể hiện hành động đã xảy ra hoặc kéo dài đến hiện tại.", "examples": [{"zh": "走半个多小时就到了。", "pinyin": "zǒu bàn gè duō xiǎo shí jiù dào le", "vi": "Đi bộ hơn nửa tiếng là đến rồi."}, {"zh": "我们休息十分钟。", "pinyin": "wǒ men xiū xī shí fēn zhōng", "vi": "Chúng ta nghỉ ngơi mười phút."}], "newExamples": [{"zh": "小林学中文学了两年，现在说得很好。", "pinyin": "xiǎo lín xué zhōng wén xué le liǎng nián ， xiàn zài shuō de hěn hǎo 。", "vi": "小林 đã học tiếng Trung hai năm, giờ nói rất tốt."}, {"zh": "小林每天看书看半个小时，也就是三十分钟。", "pinyin": "xiǎo lín měi tiān kàn shū kàn bàn gè xiǎo shí ， yě jiù shì sān shí fēn zhōng 。", "vi": "Mỗi ngày 小林 đọc sách nửa tiếng, tức ba mươi phút."}]}]}, {"id": 10, "title": "Chuẩn bị ngày khai giảng", "subtitle": "开学 · 门 · 后面 · 笔", "words": [{"id": "hsk2-10-01", "hanzi": "开学", "pinyin": "kāixué", "meaning": "khai giảng", "example": "开学以前我要买几个本子。", "examplePinyin": "kāi xué yǐ qián wǒ yào mǎi jǐ gè běn zi 。", "translation": "Trước khi khai giảng tôi cần mua vài quyển vở."}, {"id": "hsk2-10-02", "hanzi": "门", "pinyin": "mén", "meaning": "cửa", "example": "教室的门开着，你直接进去吧。", "examplePinyin": "jiào shì de mén kāi zhe ， nǐ zhí jiē jìn qù ba 。", "translation": "Cửa lớp đang mở, bạn vào thẳng nhé."}, {"id": "hsk2-10-03", "hanzi": "后面", "pinyin": "hòumiàn", "meaning": "phía sau", "example": "我的书包在椅子后面。", "examplePinyin": "wǒ de shū bāo zài yǐ zi hòu miàn 。", "translation": "Cặp của tôi ở sau ghế."}, {"id": "hsk  "hsk2-10-13", "hanzi": "快要", "pinyin": "kuàiyào", "meaning": "sắp", "example": "电影快要结束了。", "examplePinyin": "diàn yǐng kuài yào jié shù le 。", "translation": "Bộ phim sắp kết thúc rồi."}, {"id": "hsk2-10-14", "hanzi": "笑", "pinyin": "xiào", "meaning": "cười", "example": "听了这个故事，大家都笑了。", "examplePinyin": "tīng le zhè ge gù shì ， dà jiā dōu xiào le 。", "translation": "Nghe câu chuyện này mọi người đều cười."}], "grammar": [{"name": "Câu vị ngữ cụm chủ-vị", "details": ["Công thức: Chủ ngữ lớn + (Chủ ngữ nhỏ + Vị ngữ nhỏ)", "Giải thích: Trong loại câu này, toàn bộ một cụm chủ-vị đóng vai trò làm vị ngữ cho chủ ngữ lớn. Chủ ngữ nhỏ thường là một bộ phận hoặc đối tượng liên quan trực tiếp đến chủ ngữ lớn. Cấu trúc này giúp miêu tả đặc điểm hoặc trạng thái chi tiết của chủ ngữ lớn.", "Mẹo: Hãy xem cụm chủ-vị phía sau như một lời giải thích hoặc miêu tả kỹ hơn cho chủ ngữ đứng đầu câu.", "Lưu ý: Cần phân biệt rõ đâu là chủ ngữ lớn và đâu là chủ ngữ nhỏ để tránh dịch sai ý nghĩa của câu.", "我的书包你看见了吗？", "wǒ de shū bāo nǐ kàn jiàn le ma", "Cái cặp sách của tôi bạn có nhìn thấy không?", "弟弟手很小。", "dì dì shǒu hěn xiǎo", "Tay của em trai rất nhỏ.", "这件事我知道。", "zhè jiàn shì wǒ zhī dào", "Chuyện này tôi biết.", "Ví dụ: 我的书包你看见了吗？"]}, {"name": "Câu hỏi lựa chọn (Alternative Questions)", "details": ["Công thức: A 还是 B 吗？ (A or B?)", "Giải thích: Câu hỏi lựa chọn dùng để đưa ra hai hay nhiều phương án để người nghe chọn lựa. Chúng ta sử dụng liên từ 「还是」 (háishì) để nối các lựa chọn trong câu hỏi.", "Mẹo: Trong câu hỏi lựa chọn, bạn không dùng 「吗」 ở cuối câu vì bản thân cấu trúc này đã là câu hỏi rồi.", "Lưu ý: Đừng nhầm lẫn giữa 「还是」 (dùng trong câu hỏi) và 「或者」 (huòzhě - dùng trong câu trần thuật để nói 'hoặc là').", "妈妈，是您准备考试还是我准备考试？", "mā mā shì nín zhǔn bèi kǎo shì hái shì wǒ zhǔn bèi kǎo shì", "Mẹ ơi, là mẹ chuẩn bị thi hay con chuẩn bị thi vậy?", "你更喜欢打篮球、踢足球还是游泳？", "nǐ gèng xǐ huān dǎ lán qiú tī zú qiú hái shì yóu yǒng", "Bạn thích chơi bóng rổ, đá bóng hay bơi lội hơn?", "我们什么时候去看电影？今天还是明天？", "wǒ men shén me shí hòu qù kàn diàn yǐng jīn tiān hái shì míng tiān", "Khi nào chúng ta đi xem phim? Hôm nay hay là ngày mai?", "Ví dụ: 妈妈，是您准备考试还是我准备考试？"]}, {"name": "Diễn tả hành động sắp xảy ra", "details": ["Công thức: Chủ ngữ + (要/快/快要/就要) + Vị ngữ + 了", "Giải thích: Cấu trúc này dùng để diễn tả một hành động hoặc trạng thái sắp sửa xảy ra trong tương lai gần. Bạn có thể sử dụng linh hoạt các từ 「要」, 「快」, 「快要」 hoặc 「就要」 trước vị ngữ và kết thúc câu bằng 「了」.", "Mẹo: Nếu trong câu có trạng ngữ chỉ thời gian cụ thể (ví dụ: 明天, 下星期), hãy dùng 「就要……了」 hoặc 「要……了」, không dùng 「快要……了」 hay 「快……了」.", "Lưu ý: Không nên nhầm lẫn cấu trúc này với 「了」 dùng để chỉ hành động đã hoàn thành trong quá khứ.", "饭菜快要做好了。", "fàn cài kuài yào zuò hǎo le", "Cơm canh sắp nấu xong rồi.", "火车快开了。", "huǒ chē kuài kāi le", "Tàu hỏa sắp chạy rồi.", "我们下星期就要考试了。", "wǒ men xià xīng qī jiù yào kǎo shì le", "Tuần sau chúng tôi phải thi rồi.", "Ví dụ: 饭菜快要做好了。"]}], "extended": [], "structuredGrammar": [{"name": "Câu vị ngữ cụm chủ-vị", "formula": "Chủ ngữ lớn + (Chủ ngữ nhỏ + Vị ngữ nhỏ)", "explanation": "Trong loại câu này, toàn bộ một cụm chủ-vị đóng vai trò làm vị ngữ cho chủ ngữ lớn. Chủ ngữ nhỏ thường là một bộ phận hoặc đối tượng liên quan trực tiếp đến chủ ngữ lớn. Cấu trúc này giúp miêu tả đặc điểm hoặc trạng thái chi tiết của chủ ngữ lớn.", "tip": "Hãy xem cụm chủ-vị phía sau như một lời giải thích hoặc miêu tả kỹ hơn cho chủ ngữ đứng đầu câu.", "note": "Cần phân biệt rõ đâu là chủ ngữ lớn và đâu là chủ ngữ nhỏ để tránh dịch sai ý nghĩa của câu.", "examples": [{"zh": "我的书包你看见了吗？", "pinyin": "wǒ de shū bāo nǐ kàn jiàn le ma", "vi": "Cái cặp sách của tôi bạn có nhìn thấy không?"}, {"zh": "弟弟手很小。", "pinyin": "dì dì shǒu hěn xiǎo", "vi": "Tay của em trai rất nhỏ."}, {"zh": "这件事我知道。", "pinyin": "zhè jiàn shì wǒ zhī dào", "vi": "Chuyện này tôi biết."}], "newExamples": [{"zh": "小林手很小，所以戴这副手套不合适。", "pinyin": "xiǎo lín shǒu hěn xiǎo ， suǒ yǐ dài zhè fù shǒu tào bù hé shì 。", "vi": "Tay 小林 nhỏ nên đeo đôi găng tay này không vừa."}, {"zh": "这件事我知道，小林还不知道。", "pinyin": "zhè jiàn shì wǒ zhī dào ， xiǎo lín hái bù zhī dào 。", "vi": "Chuyện này tôi biết, 小林 vẫn chưa biết."}]}, {"name": "Câu hỏi lựa chọn (Alternative Questions)", "formula": "A 还是 B？", "explanation": "Câu hỏi lựa chọn dùng để đưa ra hai hay nhiều phương án để người nghe chọn lựa. Chúng ta sử dụng liên từ 「还是」 (háishì) để nối các lựa chọn trong câu hỏi.", "tip": "Trong câu hỏi lựa chọn, bạn không dùng 「吗」 ở cuối câu vì bản thân cấu trúc này đã là câu hỏi rồi.", "note": "Đừng nhầm lẫn giữa 「还是」 (dùng trong câu hỏi) và 「或者」 (huòzhě - dùng trong câu trần thuật để nói 'hoặc là').", "examples": [{"zh": "妈妈，是您准备考试还是我准备考试？", "pinyin": "mā mā shì nín zhǔn bèi kǎo shì hái shì wǒ zhǔn bèi kǎo shì", "vi": "Mẹ ơi, là mẹ chuẩn bị thi hay con chuẩn bị thi vậy?"}, {"zh": "你更喜欢打篮球、踢足球还是游泳？", "pinyin": "nǐ gèng xǐ huān dǎ lán qiú tī zú qiú hái shì yóu yǒng", "vi": "Bạn thích chơi bóng rổ, đá bóng hay bơi lội hơn?"}, {"zh": "我们什么时候去看电影？今天还是明天？", "pinyin": "wǒ men shén me shí hòu qù kàn diàn yǐng jīn tiān hái shì míng tiān", "vi": "Khi nào chúng ta đi xem phim? Hôm nay hay là ngày mai?"}], "clarification": "Câu hỏi lựa chọn dùng 还是 và thường không thêm 吗 ở cuối. Công thức trong tài liệu có 吗; ở đây đã chỉnh để khớp với các ví dụ.", "newExamples": [{"zh": "小林问小雨：“你喝茶还是喝咖啡？”", "pinyin": "xiǎo lín wèn xiǎo yǔ ： “ nǐ hē chá hái shì hē kā fēi ？ ”", "vi": "小林 hỏi 小雨: “Bạn uống trà hay cà phê?”"}, {"zh": "小林想问：“我们今天去还是明天去？”", "pinyin": "xiǎo lín xiǎng wèn ： “ wǒ men jīn tiān qù hái shì míng tiān qù ？ ”", "vi": "小林 muốn hỏi: “Chúng ta đi hôm nay hay ngày mai?”"}]}, {"name": "Diễn tả hành động sắp xảy ra", "formula": "Chủ ngữ + (要/快/快要/就要) + Vị ngữ + 了", "explanation": "Cấu trúc này dùng để diễn tả một hành động hoặc trạng thái sắp sửa xảy ra trong tương lai gần. Bạn có thể sử dụng linh hoạt các từ 「要」, 「快」, 「快要」 hoặc 「就要」 trước vị ngữ và kết thúc câu bằng 「了」.", "tip": "Nếu trong câu có trạng ngữ chỉ thời gian cụ thể (ví dụ: 明天, 下星期), hãy dùng 「就要……了」 hoặc 「要……了」, không dùng 「快要……了」 hay 「快……了」.", "note": "Không nên nhầm lẫn cấu trúc này với 「了」 dùng để chỉ hành động đã hoàn thành trong quá khứ.", "examples": [{"zh": "饭菜快要做好了。", "pinyin": "fàn cài kuài yào zuò hǎo le", "vi": "Cơm canh sắp nấu xong rồi."}, {"zh": "火车快开了。", "pinyin": "huǒ chē kuài kāi le", "vi": "Tàu hỏa sắp chạy rồi."}, {"zh": "我们下星期就要考试了。", "pinyin": "wǒ men xià xīng qī jiù yào kǎo shì le", "vi": "Tuần sau chúng tôi phải thi rồi."}], "newExamples": [{"zh": "小林说：“火车快要开了，我们上车吧。”", "pinyin": "xiǎo lín shuō ： “ huǒ chē kuài yào kāi le ， wǒ men shàng chē ba 。 ”", "vi": "小林 nói: “Tàu sắp chạy rồi, chúng ta lên xe nhé.”"}, {"zh": "小林下星期就要考试了，正在复习。", "pinyin": "xiǎo lín xià xīng qī jiù yào kǎo shì le ， zhèng zài fù xí 。", "vi": "Tuần sau 小林 sắp thi, hiện đang ôn bài."}]}]}, {"id": 11, "title": "Thăm hỏi và chăm sóc", "subtitle": "药 · 药店 · 疼 · 身体", "words": [{"id": "hsk2-11-01", "hanzi": "药", "pinyin": "yào", "meaning": "thuốc", "example": "你吃过药了吗？", "examplePinyin": "nǐ chī guò yào le ma ？", "translation": "Bạn đã uống thuốc chưa?"}, {"id": "hsk2-11-02", "hanzi": "药店", "pinyin": "yàodiàn", "meaning": "hiệu thuốc", "example": "药店在医院的对面。", "examplePinyin": "yào diàn zài yī yuàn de duì miàn 。", "translation": "Hiệu thuốc ở đối diện bệnh viện."}, {"id": "hsk2-11-03", "hanzi": "疼", "pinyin": "téng", "meaning": "đau", "example": "我的头从早上就开始疼。", "examplePinyin": "wǒ de tóu cóng zǎo shàng jiù kāi shǐ téng 。", "translation": "Đầu tôi bắt đầu đau từ sáng."}, {"id": "hsk2-11-04", "hanzi": "身体", "pinyin": "shēntǐ", "meaning": "cơ thể", "example": "爷爷虽然年纪大了，但是身体很好。", "examplePinyin": "yé yé suī rán nián jì dà le ， dàn shì shēn tǐ hěn hǎo 。", "translation": "Tuy ông lớn tuổi nhưng sức khỏe rất tốt."}, {"id": "hsk2-11-05", "hanzi": "头", "pinyin": "tóu", "meaning": "đầu", "example": "爷爷家有一头牛。", "examplePinyin": "yé yé jiā yǒu yī tóu niú 。", "translation": "Nhà ông có một con bò."}, {"id": "hsk2-11-06", "hanzi": "慢", "pinyin": "màn", "meaning": "chậm", "example": "我听不太懂，请说慢一点儿。", "examplePinyin": "wǒ tīng bù tài dǒng ， qǐng shuō màn yì diǎn ér 。", "translation": "Tôi nghe chưa hiểu lắm, xin nói chậm hơn một chút."}, {"id": "hsk2-11-07", "hanzi": "路上", "pinyin": "lùshang", "meaning": "trên đường", "example": "回家的路上，我碰见了老师。", "examplePinyin": "huí jiā de lù shàng ， wǒ pèng jiàn le lǎo shī 。", "translation": "Trên đường về nhà tôi đã gặp thầy."}, {"id": "hsk2-11-08", "hanzi": "时", "pinyin": "shí", "meaning": "khi, lúc", "example": "我到家时，妈妈正在做饭。", "examplePinyin": "wǒ dào jiā shí ， mā mā zhèng zài zuò fàn 。", "translation": "Khi tôi về đến nhà mẹ đang nấu cơm."}, {"id": "hsk2-11-09", "hanzi": "着", "pinyin": "zhe", "meaning": "trợ từ trạng thái", "example": "他手里拿着一本书，站在门口。", "examplePinyin": "tā shǒu lǐ ná zhe yī běn shū ， zhàn zài mén kǒu 。", "translation": "Anh ấy cầm một quyển sách và đứng ở cửa."}, {"id": "hsk2-11-10", "hanzi": "经常", "pinyin": "jīngcháng", "meaning": "thường xuyên", "example": "他经常帮同学复习。", "examplePinyin": "tā jīng cháng bāng tóng xué fù xí 。", "translation": "Anh ấy thường giúp bạn học ôn bài."}, {"id": "hsk2-11-11", "hanzi": "进", "pinyin": "jìn", "meaning": "vào", "example": "上课了，同学们都进教室了。", "examplePinyin": "shàng kè le ， tóng xué men dōu jìn jiào shì le 。", "translation": "Đến giờ học rồi, các bạn đều vào lớp."}, {"id": "hsk2-11-12", "hanzi": "自", "pinyin": "zì", "meaning": "tự, từ", "example": "他来自越南，现在在北京学习。", "examplePinyin": "tā lái zì yuè nán ， xiàn zài zài běi jīng xué xí 。", "translation": "Anh ấy đến từ Việt Nam, hiện học ở Bắc Kinh."}, {"id": "hsk2-11-13", "hanzi": "从小", "pinyin": "cóngxiǎo", "meaning": "từ nhỏ", "example": "我从小就喜欢画画。", "examplePinyin": "wǒ cóng xiǎo jiù xǐ huān huà huà 。", "translation": "Từ nhỏ tôi đã thích vẽ."}, {"id": "hsk2-11-14", "hanzi": "最", "pinyin": "zuì", "meaning": "nhất", "example": "在这些书中，我最喜欢这一本。", "examplePinyin": "zài zhè xiē shū zhōng ， wǒ zuì xǐ huān zhè yī běn 。", "translation": "Trong những quyển sách này tôi thích quyển này nhất."}], "grammar": [{"name": "Trợ từ động thái 着", "details": ["Công thức: Chủ ngữ + Động từ + 着 + (Tân ngữ)", "Giải thích: Trợ từ động thái 「着」 được đặt sau động từ để biểu thị một hành động đang tiếp diễn hoặc một trạng thái đang tồn tại. Ví dụ: 「门开着」 (Cửa đang mở) diễn tả trạng thái của cánh cửa.", "Mẹo: Bạn có thể thêm trợ từ ngữ khí 「呢」 ở cuối câu để nhấn mạnh trạng thái đang tiếp diễn.", "Lưu ý: Cấu trúc phủ định của 「着」 thường dùng 「没有」 đặt trước động từ (Ví dụ: 「没穿着鞋」 - không mang giày).", "那你在这儿坐着。", "nà nǐ zài zhè ér zuò zhe", "Vậy bạn cứ ngồi ở đây đi.", "教室的门开着。", "jiào shì de mén kāi zhe", "Cửa phòng học đang mở.", "Ví dụ: 那你在这儿坐着。"]}, {"name": "Trợ từ động thái 着 (zhe)", "details": ["Công thức: Động từ + 着 + (Tân ngữ)", "Giải thích: Trợ từ 「着」 đặt sau động từ để biểu thị hành động hoặc trạng thái đang tiếp diễn. Nó cho thấy sự vật, sự việc vẫn đang duy trì ở thời điểm nói. Ví dụ: 「他站着」(Anh ấy đang đứng).", "Mẹo: Hãy nhớ 「着」 thường dùng để mô tả trạng thái hiện tại của chủ thể thay vì hành động đang chuyển động mạnh.", "Lưu ý: Không nhầm lẫn 「着」 với cấu trúc 「正在」, vì 「着」 tập trung vào trạng thái kéo dài hơn là nhấn mạnh hành động đang diễn ra.", "她穿着白色的裤子。", "tā chuān zhe bái sè de kù zi", "Cô ấy đang mặc cái quần màu trắng.", "陈天中没拿着咖啡。", "chén tiān zhōng méi ná zhe kā fēi", "Trần Thiên Trung không có cầm cà phê.", "Ví dụ: 她穿着白色的裤子。"]}, {"name": "Phó từ chỉ mức độ 「最」", "details": ["Công thức: S + 最 + Tính từ/Động từ tâm lý", "Giải thích: Phó từ 「最」 có nghĩa là \"nhất\", dùng để biểu thị mức độ cao nhất trong phạm vi so sánh. Nó thường được đặt trước các tính từ hoặc động từ chỉ tâm lý để nhấn mạnh đặc điểm đó vượt trội hơn mọi đối tượng khác.", "Mẹo: Bạn có thể dùng 「最」 với các động từ tâm lý như 「喜欢」(thích), 「爱」(yêu), 「想」(muốn) để thể hiện sở thích lớn nhất của bản thân.", "Lưu ý: Không nên dùng 「最」 với các động từ chỉ hành động thông thường (như ăn, uống, đi), mà chủ yếu dùng với tính từ và động từ chỉ cảm xúc.", "你最喜欢吃中国菜。", "nǐ zuì xǐ huān chī zhōng guó cài", "Bạn thích ăn món Trung Quốc nhất.", "在我们家，爸爸最高。", "zài wǒ men jiā bà bà zuì gāo", "Trong nhà chúng tôi, bố là người cao nhất.", "你们班谁说中文说得最好？", "nǐ men bān shuí shuō zhōng wén shuō de zuì hǎo", "Trong lớp các bạn ai nói tiếng Trung tốt nhất?", "Ví dụ: 你最喜欢吃中国菜。"]}], "extended": [], "structuredGrammar": [{"name": "Trợ từ động thái 着", "formula": "Chủ ngữ + Động từ + 着 + (Tân ngữ)", "explanation": "Trợ từ động thái 「着」 được đặt sau động từ để biểu thị một hành động đang tiếp diễn hoặc một trạng thái đang tồn tại. Ví dụ: 「门开着」 (Cửa đang mở) diễn tả trạng thái của cánh cửa.", "tip": "Bạn có thể thêm trợ từ ngữ khí 「呢」 ở cuối câu để nhấn mạnh trạng thái đang tiếp diễn.", "note": "Cấu trúc phủ định của 「着」 thường dùng 「没有」 đặt trước động từ (Ví dụ: 「没穿着鞋」 - không mang giày).", "examples": [{"zh": "那你在这儿坐着。", "pinyin": "nà nǐ zài zhè ér zuò zhe", "vi": "Vậy bạn cứ ngồi ở đây đi."}, {"zh": "教室的门开着。", "pinyin": "jiào shì de mén kāi zhe", "vi": "Cửa phòng học đang mở."}], "newExamples": [{"zh": "小林在门口站着，手里拿着一本书。", "pinyin": "xiǎo lín zài mén kǒu zhàn zhe ， shǒu lǐ ná zhe yī běn shū 。", "vi": "小林 đang đứng ở cửa, tay cầm một quyển sách."}, {"zh": "小林说：“门开着，你进来吧。”", "pinyin": "xiǎo lín shuō ： “ mén kāi zhe ， nǐ jìn lái ba 。 ”", "vi": "小林 nói: “Cửa đang mở, bạn vào nhé.”"}]}, {"name": "Trợ từ động thái 着 (zhe)", "formula": "Động từ + 着 + (Tân ngữ)", "explanation": "Trợ từ 「着」 đặt sau động từ để biểu thị hành động hoặc trạng thái đang tiếp diễn. Nó cho thấy sự vật, sự việc vẫn đang duy trì ở thời điểm nói. Ví dụ: 「他站着」(Anh ấy đang đứng).", "tip": "Hãy nhớ 「着」 thường dùng để mô tả trạng thái hiện tại của chủ thể thay vì hành động đang chuyển động mạnh.", "note": "Không nhầm lẫn 「着」 với cấu trúc 「正在」, vì 「着」 tập trung vào trạng thái kéo dài hơn là nhấn mạnh hành động đang diễn ra.", "examples": [{"zh": "她穿着白色的裤子。", "pinyin": "tā chuān zhe bái sè de kù zi", "vi": "Cô ấy đang mặc cái quần màu trắng."}, {"zh": "陈天中没拿着咖啡。", "pinyin": "chén tiān zhōng méi ná zhe kā fēi", "vi": "Trần Thiên Trung không có cầm cà phê."}], "newExamples": [{"zh": "小林穿着白色的裤子，很好看。", "pinyin": "xiǎo lín chuān zhe bái sè de kù zi ， hěn hǎo kàn 。", "vi": "小林 mặc quần trắng, trông rất đẹp."}, {"zh": "小林笑着跟小雨说：“明天见！”", "pinyin": "xiǎo lín xiào zhe gēn xiǎo yǔ shuō ： “ míng tiān jiàn ！ ”", "vi": "小林 mỉm cười nói với 小雨: “Hẹn mai gặp!”"}]}, {"name": "Phó từ chỉ mức độ 「最」", "formula": "S + 最 + Tính từ/Động từ tâm lý", "explanation": "Phó từ 「最」 có nghĩa là \"nhất\", dùng để biểu thị mức độ cao nhất trong phạm vi so sánh. Nó thường được đặt trước các tính từ hoặc động từ chỉ tâm lý để nhấn mạnh đặc điểm đó vượt trội hơn mọi đối tượng khác.", "tip": "Bạn có thể dùng 「最」 với các động từ tâm lý như 「喜欢」(thích), 「爱」(yêu), 「想」(muốn) để thể hiện sở thích lớn nhất của bản thân.", "note": "Không nên dùng 「最」 với các động từ chỉ hành động thông thường (như ăn, uống, đi), mà chủ yếu dùng với tính từ và động từ chỉ cảm xúc.", "examples": [{"zh": "你最喜欢吃中国菜。", "pinyin": "nǐ zuì xǐ huān chī zhōng guó cài", "vi": "Bạn thích ăn món Trung Quốc nhất."}, {"zh": "在我们家，爸爸最高。", "pinyin": "zài wǒ men jiā bà bà zuì gāo", "vi": "Trong nhà chúng tôi, bố là người cao nhất."}, {"zh": "你们班谁说中文说得最好？", "pinyin": "nǐ men bān shuí shuō zhōng wén shuō de zuì hǎo", "vi": "Trong lớp các bạn ai nói tiếng Trung tốt nhất?"}], "newExamples": [{"zh": "在三个孩子中，小林最高。", "pinyin": "zài sān gè hái zi zhōng ， xiǎo lín zuì gāo 。", "vi": "Trong ba đứa trẻ, 小林 cao nhất."}, {"zh": "小林说：“我喜欢的水果很多，其中最喜欢苹果。”", "pinyin": "xiǎo lín shuō ： “ wǒ xǐ huān de shuǐ guǒ hěn duō ， qí zhōng zuì xǐ huān píng guǒ 。 ”", "vi": "小林 nói: “Tôi thích nhiều loại quả, trong đó thích táo nhất.”"}]}]}, {"id": 12, "title": "Thời tiết và cuộc sống", "subtitle": "事情 · 晴 · 正 · 外面", "words": [{"id": "hsk2-12-01", "hanzi": "事情", "pinyin": "shìqing", "meaning": "sự việc", "example": "今天我有很多事情要做。", "examplePinyin": "jīn tiān wǒ yǒu hěn duō shì qíng yào zuò 。", "translation": "Hôm nay tôi có nhiều việc phải làm."}, {"id": "hsk2-12-02", "hanzi": "晴", "pinyin": "qíng", "meaning": "trời nắng", "example": "天气晴了，我们去公园吧。", "examplePinyin": "tiān qì qíng le ， wǒ men qù gōng yuán ba 。", "translation": "Trời quang rồi, chúng ta ra công viên nhé."}, {"id": "hsk2-12-03", "hanzi": "正", "pinyin": "zhèng", "meaning": "đang", "example": "我正准备出门，朋友就来了。", "examplePinyin": "wǒ zhèng zhǔn bèi chū mén ， péng yǒu jiù lái le 。", "translation": "Tôi đang chuẩn bị ra ngoài thì bạn đến."}, {"id": "hsk2-12-04", "hanzi": "外面", "pinyin": "wàimiàn", "meaning": "bên ngoài", "example": "外面下雨了，我们先在屋里等一会儿。", "examplePinyin": "wài miàn xià yǔ le ， wǒ men xiān zài wū lǐ děng yī huì er 。", "translation": "Bên ngoài mưa rồi, chúng ta đợi trong nhà một lát trước."}, {"id": "hsk2-12-05", "hanzi": "阴", "pinyin": "yīn", "meaning": "âm u", "example": "天阴了，也许快下雨了。", "examplePinyin": "tiān yīn le ， yě xǔ kuài xià yǔ le 。", "translation": "Trời âm u rồi, có lẽ sắp mưa."}, {"id": "hsk2-12-06", "hanzi": "从小", "pinyin": "cóngxiǎo", "meaning": "từ nhỏ", "example": "我从小就喜欢画画。", "examplePinyin": "wǒ cóng xiǎo jiù xǐ huān huà huà 。", "translation": "Từ nhỏ tôi đã thích vẽ."}, {"id": "hsk2-12-07", "hanzi": "地铁", "pinyin": "dìtiě", "meaning": "tàu điện ngầm", "example": "坐地铁比坐公交车快。", "examplePinyin": "zuò dì tiě bǐ zuò gōng jiāo chē kuài 。", "translation": "Đi tàu điện ngầm nhanh hơn đi xe buýt."}, {"id": "hsk2-12-08", "hanzi": "楼", "pinyin": "lóu", "meaning": "tầng, tòa nhà", "example": "我家楼下有一家小饭馆。", "examplePinyin": "wǒ jiā lóu xià yǒu yī jiā xiǎo fàn guǎn 。", "translation": "Dưới lầu nhà tôi có một quán ăn nhỏ."}, {"id": "hsk2-12-09", "hanzi": "站", "pinyin": "zhàn", "meaning": "đứng", "example": "请站在黄线后面等车。", "examplePinyin": "qǐng zhàn zài huáng xiàn hòu miàn děng chē 。", "translation": "Hãy đứng sau vạch vàng chờ xe."}, {"id": "hsk2-12-10", "hanzi": "小时候", "pinyin": "xiǎoshíhou", "meaning": "hồi nhỏ", "example": "小时候，我家旁边有一条小河。", "examplePinyin": "xiǎo shí hòu ， wǒ jiā páng biān yǒu yī tiáo xiǎo hé 。", "translation": "Hồi nhỏ bên cạnh nhà tôi có một con sông nhỏ."}, {"id": "hsk2-12-11", "hanzi": "好", "pinyin": "hǎo", "meaning": "tốt, rất", "example": "今天好冷，我们喝点热水吧。", "examplePinyin": "jīn tiān hǎo lěng ， wǒ men hē diǎn rè shuǐ ba 。", "translation": "Hôm nay lạnh quá, chúng ta uống chút nước nóng nhé."}], "grammar": [{"name": "Câu so sánh với bổ ngữ trạng thái", "details": ["Công thức: A 比 B + Động từ + 得 + Bổ ngữ (Tính từ)", "Giải thích: Cấu trúc này dùng để so sánh trình độ hoặc kết quả thực hiện một hành động giữa hai đối tượng. Bạn cần thêm 「得」 sau động từ để nối với tính từ miêu tả trạng thái hoặc mức độ.", "Mẹo: Hãy nhớ quy tắc 「A 比 B」 luôn đứng trước động từ, ví dụ: 「他比我跑得快」(Anh ấy chạy nhanh hơn tôi).", "Lưu ý: Đừng quên từ 「得」 giữa động từ và tính từ, đây là lỗi phổ biến nhất của người mới học.", "我这里比北京冷多了。", "wǒ zhè lǐ bǐ běi jīng lěng duō le", "Ở chỗ tôi lạnh hơn Bắc Kinh nhiều lắm.", "坐飞机比坐火车快得多。", "zuò fēi jī bǐ zuò huǒ chē kuài de duō", "Đi máy bay nhanh hơn đi tàu hỏa rất nhiều.", "Ví dụ: 我这里比北京冷多了。"]}, {"name": "Cấu trúc so sánh với 跟...相比", "details": ["Công thức: 跟 A 相比，B + tính từ + (bổ ngữ)", "Giải thích: Cấu trúc 「跟...相比」 được dùng để đưa ra đối tượng cần so sánh lên đầu câu nhằm nhấn mạnh chủ đề. Sau đó, bạn đưa ra đối tượng chính 「B」 kèm theo tính từ để nêu lên sự khác biệt. Đây là cách diễn đạt rất tự nhiên khi bạn muốn so sánh hai sự vật.", "Mẹo: Bạn có thể dịch cụm 「跟...相比」 là \"so với...\" để dễ hình dung trong tiếng Việt.", "Lưu ý: Đừng quên đặt đối tượng so sánh vào giữa 「跟」 và 「相比」, không được để ngoài phạm vi này.", "跟昨天相比，今天的雪下得更大。", "gēn zuó tiān xiāng bǐ jīn tiān de xuě xià de gèng dà", "So với hôm qua, hôm nay tuyết rơi to hơn.", "跟我相比，妈妈睡得晚多了。", "gēn wǒ xiāng bǐ mā ma shuì de wǎn duō le", "So với tôi, mẹ ngủ muộn hơn nhiều.", "Ví dụ: 跟昨天相比，今天的雪下得更大。"]}, {"name": "Cấu trúc so sánh 比起", "details": ["Công thức: 比起 + [đối tượng so sánh] (+ 来)，+ [chủ ngữ] + [vị ngữ]", "Giải thích: Cấu trúc này dùng để dẫn dắt đối tượng được đem ra so sánh trong câu. Nó giúp xác định rõ phạm vi hoặc đối tượng mà chủ ngữ đang được so sánh cùng.", "Mẹo: Bạn có thể thêm 「来」 vào sau đối tượng so sánh để câu văn nghe tự nhiên và đầy đủ hơn.", "Lưu ý: Cấu trúc này thường dùng để so sánh hai đối tượng với nhau, lưu ý không nhầm lẫn với các cấu trúc so sánh bằng 「跟...一样」.", "比起去年来，今年的冬天冷多了。", "bǐ qǐ qù nián lái jīn nián de dōng tiān lěng duō le", "So với năm ngoái, mùa đông năm nay lạnh hơn nhiều.", "比起坐公共汽车，我更喜欢骑自行车。", "bǐ qǐ zuò gōng gòng qì chē wǒ gèng xǐ huan qí zì xíng chē", "So với đi xe buýt, tôi thích đi xe đạp hơn.", "Ví dụ: 比起去年来，今年的冬天冷多了。"]}], "extended": [], "structuredGrammar": [{"name": "Câu so sánh với bổ ngữ trạng thái", "formula": "A 比 B + Động từ + 得 + Bổ ngữ (Tính từ)", "explanation": "Cấu trúc này dùng để so sánh trình độ hoặc kết quả thực hiện một hành động giữa hai đối tượng. Bạn cần thêm 「得」 sau động từ để nối với tính từ miêu tả trạng thái hoặc mức độ.", "tip": "Hãy nhớ quy tắc 「A 比 B」 luôn đứng trước động từ, ví dụ: 「他比我跑得快」(Anh ấy chạy nhanh hơn tôi).", "note": "Đừng quên từ 「得」 giữa động từ và tính từ, đây là lỗi phổ biến nhất của người mới học.", "examples": [{"zh": "我这里比北京冷多了。", "pinyin": "wǒ zhè lǐ bǐ běi jīng lěng duō le", "vi": "Ở chỗ tôi lạnh hơn Bắc Kinh nhiều lắm."}, {"zh": "坐飞机比坐火车快得多。", "pinyin": "zuò fēi jī bǐ zuò huǒ chē kuài de duō", "vi": "Đi máy bay nhanh hơn đi tàu hỏa rất nhiều."}], "newExamples": [{"zh": "小林比小雨跑得快。", "pinyin": "xiǎo lín bǐ xiǎo yǔ pǎo de kuài 。", "vi": "小林 chạy nhanh hơn 小雨."}, {"zh": "小林比小雨说中文说得流利。", "pinyin": "xiǎo lín bǐ xiǎo yǔ shuō zhōng wén shuō de liú lì 。", "vi": "小林 nói tiếng Trung lưu loát hơn 小雨."}]}, {"name": "Cấu trúc so sánh với 跟...相比", "formula": "跟 A 相比，B + tính từ + (bổ ngữ)", "explanation": "Cấu trúc 「跟...相比」 được dùng để đưa ra đối tượng cần so sánh lên đầu câu nhằm nhấn mạnh chủ đề. Sau đó, bạn đưa ra đối tượng chính 「B」 kèm theo tính từ để nêu lên sự khác biệt. Đây là cách diễn đạt rất tự nhiên khi bạn muốn so sánh hai sự vật.", "tip": "Bạn có thể dịch cụm 「跟...相比」 là \"so với...\" để
