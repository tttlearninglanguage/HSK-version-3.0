n bú yào chūqù le 。 bàba shuō tā xiǎoshíhou yī kàn jiàn yīntiān ， jiù juéde huì xiàyǔ ， xiànzài zhīdào yīntiān yě kěyǐ chūqù zǒu zǒu 。 wǒ xiǎng zuò dìtiě qù shūdiàn ， dàn bù zhīdào xiàwǔ huì bù huì xiàyǔ 。 māma ràng wǒ zài shǒujī shàng kàn kàn tiānqì ， jīntiān xiàwǔ shì qíngtiān ， bǐ zuótiān rè yìdiǎnr 。 wǒ zhǔnbèi hǎo shūbāo ， xià lóu qù dìtiězhàn 。 dìtiězhàn bǐ gōngjiāochē zhàn jìn ， zǒulù wǔ fēnzhōng jiù dào 。 wǒ zài shūdiàn kàn le liǎng gè xiǎoshí de shū ， chūlái de shíhou tiān yǐjīng qíng le 。 xiàwǔ wǒ méiyǒu huíjiā ， qù le xuéxiào qiánbian de fànguǎn 。 hē kāfēi de shíhou ， wǒ xiǎng ， zǎoshang bù qù shūdiàn ， jiù kàn bù dào jīntiān de qíngtiān le 。","grammar":["Câu so sánh với bổ ngữ trạng thái","Cấu trúc so sánh với 跟...相比","Cấu trúc so sánh 比起"],"questions":[{"id":"H2-R12-1-v2-Q1","question":"早上是什么天气？","answer":"阴天","options":["下雪了","阴天","很热","很冷"],"explanation":"Thông tin đối chiếu trong bài: “早上我看外面是阴天，就想今天不要出去了。”","evidence":"早上我看外面是阴天，就想今天不要出去了。"},{"id":"H2-R12-1-v2-Q2","question":"妈妈说下午是什么天气？","answer":"晴天","options":["下雨了","下雪了","晴天","很热"],"explanation":"Thông tin đối chiếu trong bài: “妈妈让我在手机上看看天气，今天下午是晴天，比昨天热一点儿。”","evidence":"妈妈让我在手机上看看天气，今天下午是晴天，比昨天热一点儿。"},{"id":"H2-R12-1-v2-Q3","question":"我怎么去书店？","answer":"坐地铁","options":["开车","走路","坐飞机","坐地铁"],"explanation":"Thông tin đối chiếu trong bài: “我想坐地铁去书店，但不知道下午会不会下雨。”","evidence":"我想坐地铁去书店，但不知道下午会不会下雨。"},{"id":"H2-R12-1-v2-Q4","question":"地铁站走路要多少时间？","answer":"五分钟","options":["五分钟","上午","下午","晚上"],"explanation":"Thông tin đối chiếu trong bài: “地铁站比公交车站近，走路五分钟就到。”","evidence":"地铁站比公交车站近，走路五分钟就到。"},{"id":"H2-R12-1-v2-Q5","question":"我在书店看了多少时间的书？","answer":"两个小时","options":["去年","两个小时","上午","下午"],"explanation":"Thông tin đối chiếu trong bài: “我在书店看了两个小时的书，出来的时候天已经晴了。”","evidence":"我在书店看了两个小时的书，出来的时候天已经晴了。"},{"id":"H2-R12-1-v2-Q6","question":"下午我在饭馆喝什么？","answer":"咖啡","options":["鱼和肉","米饭和肉","咖啡","蛋糕"],"explanation":"Thông tin đối chiếu trong bài: “喝咖啡的时候，我想，早上不去书店，就看不到今天的晴天了。”","evidence":"喝咖啡的时候，我想，早上不去书店，就看不到今天的晴天了。"}]},{"id":"H2-R12-2","lesson":12,"revision":2,"title":"Đi tàu điện để không đến muộn","text":"今天学校有事，老师让我八点半到。我家楼下就是公交车站，但早上坐车去学校要一个小时。跟坐公交车相比，坐地铁快得多，只要半个小时。我七点半下楼，想去地铁站，爷爷正在外面等车。他说自己从小住在这里，没有坐过地铁，不知道怎么买票。我让他跟我一起去，给他看手机上的票。他想去医院，坐地铁也可以到。我们在站里看了看，知道他要在哪里下车。我让他别走得太快。我八点二十分就到了学校。老师看见我很高兴，说今天没有来晚。下课后爷爷打电话来，说地铁可以自己坐，下次还想自己坐。","translation":"Giáo viên nhờ tôi đến trường tám giờ rưỡi. Trạm xe buýt ngay dưới nhà nhưng đi một giờ; tàu điện chỉ nửa giờ. Bảy giờ rưỡi xuống, tôi gặp ông đợi xe. Ông sống ở đây từ nhỏ mà chưa đi tàu điện, chưa biết mua vé. Tôi rủ đi cùng và cho xem vé trên điện thoại. Ông đến bệnh viện, tàu cũng đến được. Trong ga chúng tôi xem chỗ ông cần xuống. Tôi dặn đừng đi quá nhanh, mình đến trường tám giờ hai mươi. Tan học ông gọi khen tàu điện không khó như nghĩ, lần sau muốn tự đi.","pinyin":"jīntiān xuéxiào yǒu shì ， lǎoshī ràng wǒ bā diǎn bàn dào 。 wǒ jiā lóuxià jiù shì gōngjiāochē zhàn ， dàn zǎoshang zuò chē qù xuéxiào yào yí gè xiǎoshí 。 gēn zuò gōngjiāochē xiāngbǐ ， zuò dìtiě kuài de duō ， zhǐyào bàn ge xiǎoshí 。 wǒ qī diǎn bàn xià lóu ， xiǎng qù dìtiězhàn ， yéye zhèngzài wàimiàn děng chē 。 tā shuō zìjǐ cóngxiǎo zhù zài zhèlǐ ， méiyǒu zuò guò dìtiě ， bù zhīdào zěnme mǎi piào 。 wǒ ràng tā gēn wǒ yìqǐ qù ， gěi tā kàn shǒujī shàng de piào 。 tā xiǎng qù yīyuàn ， zuò dìtiě yě kěyǐ dào 。 wǒmen zài zhàn lǐ kàn le kàn ， zhīdào tā yào zài nǎlǐ xiàchē 。 wǒ ràng tā bié zǒu de tài kuài 。 wǒ bā diǎn èr shífēn jiù dào le xuéxiào 。 lǎoshī kàn jiàn wǒ hěn gāoxìng ， shuō jīntiān méiyǒu lái wǎn 。 xià kè hòu yéye dǎ diànhuà lái ， shuō dìtiě kěyǐ zìjǐ zuò ， xià cì hái xiǎng zìjǐ zuò 。","grammar":["Câu so sánh với bổ ngữ trạng thái","Cấu trúc so sánh với 跟...相比","Cấu trúc so sánh 比起"],"questions":[{"id":"H2-R12-2-v2-Q1","question":"老师让我几点到？","answer":"八点半","options":["七点","八点半","九点","十点"],"explanation":"Thông tin đối chiếu trong bài: “今天学校有事，老师让我八点半到。”","evidence":"今天学校有事，老师让我八点半到。"},{"id":"H2-R12-2-v2-Q2","question":"公交车去学校要多少时间？","answer":"一个小时","options":["七点","八点","一个小时","九点"],"explanation":"Thông tin đối chiếu trong bài: “我家楼下就是公交车站，但早上坐车去学校要一个小时。”","evidence":"我家楼下就是公交车站，但早上坐车去学校要一个小时。"},{"id":"H2-R12-2-v2-Q3","question":"地铁去学校要多少时间？","answer":"半个小时","options":["明天","昨天","今年","半个小时"],"explanation":"Thông tin đối chiếu trong bài: “跟坐公交车相比，坐地铁快得多，只要半个小时。”","evidence":"跟坐公交车相比，坐地铁快得多，只要半个小时。"},{"id":"H2-R12-2-v2-Q4","question":"我几点下楼？","answer":"七点半","options":["七点半","六点半","八点半","六点十分"],"explanation":"Thông tin đối chiếu trong bài: “我七点半下楼，想去地铁站，爷爷正在外面等车。”","evidence":"我七点半下楼，想去地铁站，爷爷正在外面等车。"},{"id":"H2-R12-2-v2-Q5","question":"爷爷想去哪儿？","answer":"医院","options":["书店外","医院","学校的书店","前边的大教室"],"explanation":"Thông tin đối chiếu trong bài: “他想去医院，坐地铁也可以到。”","evidence":"他想去医院，坐地铁也可以到。"},{"id":"H2-R12-2-v2-Q6","question":"我几点到学校？","answer":"八点二十分","options":["两点半","十一点半","八点二十分","九点二十分"],"explanation":"Thông tin đối chiếu trong bài: “我八点二十分就到了学校。”","evidence":"我八点二十分就到了学校。"}]},{"id":"H2-R12-3","lesson":12,"revision":2,"title":"Công việc trong tòa nhà bên kia","text":"姐姐今天让我帮忙送书到她的公司。公司在医院外面的楼里，我去过一次，记得要坐地铁。她说今天地铁站有事，让我坐公交车。我觉得公交车比地铁慢，但她让我别早来，她十点有时间。九点我出去，外面有点儿冷，我穿了比昨天多一些的衣服。到了公司楼下，姐姐还在上班，让我在下面喝一杯咖啡。我看了看，旁边有一个小男孩儿，正在和爷爷看天气。爷爷说今天下午会晴，可以去学校外玩。十点姐姐下来了，我给她书，她请我去吃午饭。虽然等了一会儿，但我觉得有咖啡、有书，也不错。","translation":"Chị nhờ mang sách đến công ty trong tòa nhà ngoài bệnh viện. Tôi từng đến bằng tàu điện. Hôm nay ga có việc nên chị bảo đi xe buýt, dù chậm hơn; chị mười giờ mới rảnh nên đừng đến sớm. Chín giờ tôi đi, trời lạnh nên mặc nhiều hơn hôm qua. Đến dưới công ty chị vẫn làm, bảo tôi uống cà phê đợi. Cạnh đó có cậu bé và ông xem thời tiết, ông nói chiều nắng có thể ra chơi ngoài trường. Mười giờ chị xuống nhận sách rồi mời trưa. Đợi chút mà có cà phê, sách thì cũng tốt.","pinyin":"jiějie jīntiān ràng wǒ bāngmáng sòng shū dào tā de gōngsī 。 gōngsī zài yīyuàn wàimiàn de lóu lǐ ， wǒ qù guò yī cì ， jìde yào zuò dìtiě 。 tā shuō jīntiān dìtiězhàn yǒu shì ， ràng wǒ zuò gōngjiāochē 。 wǒ juéde gōngjiāochē bǐ dìtiě màn ， dàn tā ràng wǒ bié zǎo lái ， tā shí diǎn yǒu shíjiān 。 jiǔ diǎn wǒ chūqù ， wàimiàn yǒudiǎnr lěng ， wǒ chuān le bǐ zuótiān duō yìxiē de yīfu 。 dào le gōngsī lóuxià ， jiějie hái zài shàngbān ， ràng wǒ zài xiàmian hē yī bēi kāfēi 。 wǒ kàn le kàn ， pángbiān yǒu yí gè xiǎo nánháir ， zhèngzài hé yéye kàn tiānqì 。 yéye shuō jīntiān xiàwǔ huì qíng ， kěyǐ qù xuéxiào wài wán 。 shí diǎn jiějie xià lái le ， wǒ gěi tā shū ， tā qǐng wǒ qù chī wǔfàn 。 suīrán děng le yíhuìr ， dàn wǒ juéde yǒu kāfēi 、 yǒu shū ， yě búcuò 。","grammar":["Câu so sánh với bổ ngữ trạng thái","Cấu trúc so sánh với 跟...相比","Cấu trúc so sánh 比起"],"questions":[{"id":"H2-R12-3-v2-Q1","question":"姐姐让我送什么？","answer":"书","options":["一只猫","书","中文课","医"],"explanation":"Thông tin đối chiếu trong bài: “姐姐今天让我帮忙送书到她的公司。”","evidence":"姐姐今天让我帮忙送书到她的公司。"},{"id":"H2-R12-3-v2-Q2","question":"公司在哪儿？","answer":"医院外面的楼里","options":["店里","房间里","医院外面的楼里","学校"],"explanation":"Thông tin đối chiếu trong bài: “公司在医院外面的楼里，我去过一次，记得要坐地铁。”","evidence":"公司在医院外面的楼里，我去过一次，记得要坐地铁。"},{"id":"H2-R12-3-v2-Q3","question":"姐姐让我今天怎么去？","answer":"坐公交车","options":["坐飞机","坐火车","坐出租车","坐公交车"],"explanation":"Thông tin đối chiếu trong bài: “她说今天地铁站有事，让我坐公交车。”","evidence":"她说今天地铁站有事，让我坐公交车。"},{"id":"H2-R12-3-v2-Q4","question":"我几点出去？","answer":"九点","options":["九点","十点","六点半","七点半"],"explanation":"Thông tin đối chiếu trong bài: “九点我出去，外面有点儿冷，我穿了比昨天多一些的衣服。”","evidence":"九点我出去，外面有点儿冷，我穿了比昨天多一些的衣服。"},{"id":"H2-R12-3-v2-Q5","question":"姐姐几点下来？","answer":"十点","options":["一点半","十点","两点半","十一点半"],"explanation":"Thông tin đối chiếu trong bài: “十点姐姐下来了，我给她书，她请我去吃午饭。”","evidence":"十点姐姐下来了，我给她书，她请我去吃午饭。"},{"id":"H2-R12-3-v2-Q6","question":"我在下面等时喝什么？","answer":"咖啡","options":["一杯水","鸡蛋","咖啡","面包"],"explanation":"Thông tin đối chiếu trong bài: “到了公司楼下，姐姐还在上班，让我在下面喝一杯咖啡。”","evidence":"到了公司楼下，姐姐还在上班，让我在下面喝一杯咖啡。"}]},{"id":"H2-R12-4","lesson":12,"revision":2,"title":"Ký ức về ngày tuyết","text":"昨天晚上下雪了，我今天早上看见楼下都是白色的。妈妈说，她小时候很喜欢下雪，一下雪就出去玩。现在她觉得太冷，只想在家喝热茶。我想跟她去书店，那里比家里热，还可以看看新书。妈妈说今天有事情，要给奶奶做午饭。我就自己坐地铁去，准备给奶奶买一本书。书店里有一本介绍做鱼的，字比我正在看的书少，我看了很多都懂。中午我拿书回家，妈妈已经做好了鱼。奶奶说她小时候也喜欢在雪里玩，现在最喜欢的是家人一起吃饭。下午我们坐在房间里看书，外面很冷，家里很舒服。","translation":"Đêm qua tuyết rơi, sáng dưới nhà trắng xóa. Mẹ kể nhỏ rất thích tuyết, hễ rơi là ra chơi; nay chỉ muốn ở nhà uống trà nóng. Tôi rủ đến hiệu sách ấm hơn nhà, nhưng mẹ có việc nấu trưa cho bà nên tôi đi tàu điện một mình, định mua sách cho bà. Có sách dạy làm cá ít chữ hơn quyển tôi đang đọc, nhiều chỗ tôi hiểu. Trưa mang về thì mẹ đã làm cá. Bà kể nhỏ cũng thích chơi tuyết, nay thích nhất cả nhà cùng ăn. Chiều ngồi trong phòng đọc, ngoài lạnh mà trong nhà dễ chịu.","pinyin":"zuótiān wǎnshang xiàxuě le ， wǒ jīntiān zǎoshang kàn jiàn lóuxià dōu shì báisè de 。 māma shuō ， tā xiǎoshíhou hěn xǐhuan xiàxuě ， yíxià xuě jiù chūqù wán 。 xiànzài tā juéde tài lěng ， zhǐ xiǎng zàijiā hē rè chá 。 wǒ xiǎng gēn tā qù shūdiàn ， nàli bǐ jiālǐ rè ， hái kěyǐ kàn kàn xīn shū 。 māma shuō jīntiān yǒu shìqing ， yào gěi nǎinai zuò wǔfàn 。 wǒ jiù zìjǐ zuò dìtiě qù ， zhǔnbèi gěi nǎinai mǎi yī běn shū 。 shūdiàn lǐ yǒu yī běn jièshào zuò yú de ， zì bǐ wǒ zhèngzài kàn de shū shǎo ， wǒ kàn le hěn duō dōu dǒng 。 zhōngwǔ wǒ ná shū huíjiā ， māma yǐjīng zuò hǎo le yú 。 nǎinai shuō tā xiǎoshíhou yě xǐhuan zài xuě lǐ wán ， xiànzài zuì xǐhuan de shì jiārén yìqǐ chīfàn 。 xiàwǔ wǒmen zuò zài fángjiān lǐ kàn shū ， wàimiàn hěn lěng ， jiālǐ hěn shūfu 。","grammar":["Câu so sánh với bổ ngữ trạng thái","Cấu trúc so sánh với 跟...相比","Cấu trúc so sánh 比起"],"questions":[{"id":"H2-R12-4-v2-Q1","question":"昨天晚上是什么天气？","answer":"下雪了","options":["阴天","下雪了","下雨了","很热"],"explanation":"Thông tin đối chiếu trong bài: “昨天晚上下雪了，我今天早上看见楼下都是白色的。”","evidence":"昨天晚上下雪了，我今天早上看见楼下都是白色的。"},{"id":"H2-R12-4-v2-Q2","question":"妈妈现在想在家喝什么？","answer":"热茶","options":["面条儿和菜","菜","热茶","饺子"],"explanation":"Thông tin đối chiếu trong bài: “现在她觉得太冷，只想在家喝热茶。”","evidence":"现在她觉得太冷，只想在家喝热茶。"},{"id":"H2-R12-4-v2-Q3","question":"我怎么去书店？","answer":"坐地铁","options":["走路","坐飞机","坐火车","坐地铁"],"explanation":"Thông tin đối chiếu trong bài: “我就自己坐地铁去，准备给奶奶买一本书。”","evidence":"我就自己坐地铁去，准备给奶奶买一本书。"},{"id":"H2-R12-4-v2-Q4","question":"我给谁买书？","answer":"奶奶","options":["奶奶","法国人","泰国人","爷爷"],"explanation":"Thông tin đối chiếu trong bài: “我就自己坐地铁去，准备给奶奶买一本书。”","evidence":"我就自己坐地铁去，准备给奶奶买一本书。"},{"id":"H2-R12-4-v2-Q5","question":"书是介绍做什么的？","answer":"鱼","options":["鸡蛋","鱼","面包","奶茶"],"explanation":"Thông tin đối chiếu trong bài: “书店里有一本介绍做鱼的，字比我正在看的书少，我看了很多都懂。”","evidence":"书店里有一本介绍做鱼的，字比我正在看的书少，我看了很多都懂。"},{"id":"H2-R12-4-v2-Q6","question":"中午谁已经做好了鱼？","answer":"妈妈","options":["法国人","泰国人","妈妈","爷爷"],"explanation":"Thông tin đối chiếu trong bài: “中午我拿书回家，妈妈已经做好了鱼。”","evidence":"中午我拿书回家，妈妈已经做好了鱼。"}]},{"id":"H2-R12-5","lesson":12,"revision":2,"title":"Sống trên cao hay ở dưới thấp?","text":"朋友想找个新家，让我跟他去看看学校旁边的楼。一个房间在上边，一个在下面，钱都一样。下面的比上边的冷一点儿，朋友喜欢上边的。我说上去要很多时间，他说每天可以多运动。他从小就住在楼下，想试试住上边。我们进去看了看，里有一个大桌子，桌子前可以看见学校。朋友说晴天的时候，可以在这儿学习，阴天就在床上休息。我问他怎么去上班，他说楼外就是地铁站，比现在的家近多了。回家后，他给家人打电话，说虽然还没有准备好东西，已经很想住过来了。","translation":"Bạn định đổi chỗ ở, nhờ tôi xem hai phòng trong tòa nhà cạnh trường: một trên, một dưới, giá gần bằng. Phòng dưới lạnh hơn chút nên bạn thích trên. Tôi thấy lên mất thời gian, bạn coi là vận động; từ nhỏ ở dưới nên muốn thử. Vào phòng có bàn lớn, trước bàn nhìn được trường. Bạn muốn ngày nắng học ở đó, ngày âm nghỉ trên giường. Ga tàu ở ngoài nhà, đi làm tiện hơn hiện tại nhiều. Về gọi gia đình, dù chưa chuẩn bị hết đồ bạn đã rất muốn chuyển đến.","pinyin":"péngyou xiǎng zhǎo gè xīn jiā ， ràng wǒ gēn tā qù kàn kàn xuéxiào pángbiān de lóu 。 yí gè fángjiān zài shàngbiān ， yí gè zài xiàmian ， qián dōu yíyàng 。 xiàmian de bǐ shàngbiān de lěng yìdiǎnr ， péngyou xǐhuan shàngbiān de 。 wǒ shuō shàng qù yào hěn duō shíjiān ， tā shuō měi tiān kěyǐ duō yùndòng 。 tā cóngxiǎo jiù zhù zài lóuxià ， xiǎng shì shì zhù shàngbiān 。 wǒmen jìnqù kàn le kàn ， lǐ yǒu yí gè dà zhuōzi ， zhuōzi qián kěyǐ kàn jiàn xuéxiào 。 péngyou shuō qíngtiān de shíhou ， kěyǐ zài zhèr xuéxí ， yīntiān jiù zài chuáng shàng xiūxi 。 wǒ wèn tā zěnme qù shàngbān ， tā shuō lóu wài jiù shì dìtiězhàn ， bǐ xiànzài de jiā jìn duō le 。 huíjiā hòu ， tā gěi jiārén dǎ diànhuà ， shuō suīrán hái méiyǒu zhǔnbèi hǎo dōngxi ， yǐjīng hěn xiǎng zhù guòlai le 。","grammar":["Câu so sánh với bổ ngữ trạng thái","Cấu trúc so sánh với 跟...相比","Cấu trúc so sánh 比起"],"questions":[{"id":"H2-R12-5-v2-Q1","question":"我们去看哪儿的楼？","answer":"学校旁边","options":["医院","学校旁边","店里","房间里"],"explanation":"Thông tin đối chiếu trong bài: “朋友想找个新家，让我跟他去看看学校旁边的楼。”","evidence":"朋友想找个新家，让我跟他去看看学校旁边的楼。"},{"id":"H2-R12-5-v2-Q2","question":"哪边的房间冷一点儿？","answer":"下面","options":["前边的大教室","我家","下面","学校旁边"],"explanation":"Thông tin đối chiếu trong bài: “下面的比上边的冷一点儿，朋友喜欢上边的。”","evidence":"下面的比上边的冷一点儿，朋友喜欢上边的。"},{"id":"H2-R12-5-v2-Q3","question":"朋友想住上边还是下面？","answer":"上边","options":["电影院左边的饭馆","中国","法国","上边"],"explanation":"Thông tin đối chiếu trong bài: “下面的比上边的冷一点儿，朋友喜欢上边的。”","evidence":"下面的比上边的冷一点儿，朋友喜欢上边的。"},{"id":"H2-R12-5-v2-Q4","question":"朋友从小住在哪儿？","answer":"楼下","options":["楼下","北京","西安","机场"],"explanation":"Thông tin đối chiếu trong bài: “他从小就住在楼下，想试试住上边。”","evidence":"他从小就住在楼下，想试试住上边。"},{"id":"H2-R12-5-v2-Q5","question":"房间里有什么大东西？","answer":"桌子","options":["书","桌子","医","杯子"],"explanation":"Thông tin đối chiếu trong bài: “我们进去看了看，里有一个大桌子，桌子前可以看见学校。”","evidence":"我们进去看了看，里有一个大桌子，桌子前可以看见学校。"},{"id":"H2-R12-5-v2-Q6","question":"楼外是什么车站？","answer":"地铁站","options":["公司","医院前边","地铁站","北京"],"explanation":"Thông tin đối chiếu trong bài: “我问他怎么去上班，他说楼外就是地铁站，比现在的家近多了。”","evidence":"我问他怎么去上班，他说楼外就是地铁站，比现在的家近多了。"}]},{"id":"H2-R13-1","lesson":13,"revision":2,"title":"Cây bút tặng giáo viên","text":"新年快到了，我想送中文老师一个礼物。她喜欢花，也经常在本子上写字。我准备买花，朋友说还可以送一支笔。我去商店看了看，有一支红色的笔很漂亮，比黑色的贵十元。我觉得老师可能更喜欢黑色，还是买了黑色的。回家后，妹妹问能不能帮我给她画画。我说可以，请她画我们班的教室。新年那天，我送给老师花、笔和画。她打开后，看见画里有她和同学们，很高兴。她告诉我，礼物不要太贵，知道学生在想她就很好。我想，这支笔可以在上课时写字，画也可以让她记得我们。","translation":"Sắp năm mới tôi muốn tặng giáo viên. Cô thích hoa, thường viết vở nên bạn gợi ý thêm bút. Ở cửa hàng bút đỏ đẹp, đắt hơn đen mười tệ; nghĩ cô thích đen hơn tôi chọn đen. Em gái xin vẽ lớp học đặt trong quà. Ngày đầu năm tôi tặng hoa, bút, tranh. Cô mở thấy mình và các bạn trong tranh rất vui, bảo quà không cần đắt, biết học sinh nhớ là tốt. Tôi mong bút dùng được trên lớp và tranh giúp cô nhớ chúng tôi.","pinyin":"xīnnián kuài dào le ， wǒ xiǎng sòng Zhōngwén lǎoshī yí gè lǐwù 。 tā xǐhuan huā ， yě jīngcháng zài běnzi shàng xiě zì 。 wǒ zhǔnbèi mǎi huā ， péngyou shuō hái kěyǐ sòng yī zhī bǐ 。 wǒ qù shāngdiàn kàn le kàn ， yǒu yī zhī hóngsè de bǐ hěn piàoliang ， bǐ hēisè de guì shí yuán 。 wǒ juéde lǎoshī kěnéng gèng xǐhuan hēisè ， háishi mǎi le hēisè de 。 huíjiā hòu ， mèimei wèn néng bù néng bāng wǒ gěi tā huà huà 。 wǒ shuō kěyǐ ， qǐng tā huà wǒmen bān de jiàoshì 。 xīnnián nà tiān ， wǒ sònggěi lǎoshī huā 、 bǐ hé huà 。 tā dǎ kāi hòu ， kàn jiàn huà lǐ yǒu tā hé tóngxué men ， hěn gāoxìng 。 tā gàosu wǒ ， lǐwù bú yào tài guì ， zhīdào xuésheng zài xiǎng tā jiù hěn hǎo 。 wǒ xiǎng ， zhè zhī bǐ kěyǐ zài shàngkè shí xiě zì ， huà yě kěyǐ ràng tā jìde wǒmen 。","grammar":["Câu có hai tân ngữ","Câu so sánh 比 với số lượng chênh lệch cụ thể","Câu so sánh 比 với mức chênh lệch nhỏ (一点儿/一些)"],"questions":[{"id":"H2-R13-1-v2-Q1","question":"我准备给谁送礼物？","answer":"中文老师","options":["爸爸","妈妈","中文老师","哥哥"],"explanation":"Thông tin đối chiếu trong bài: “新年快到了，我想送中文老师一个礼物。”","evidence":"新年快到了，我想送中文老师一个礼物。"},{"id":"H2-R13-1-v2-Q2","question":"红色的笔比黑色的贵多少？","answer":"十元","options":["三百元","二百元","五元","十元"],"explanation":"Thông tin đối chiếu trong bài: “我去商店看了看，有一支红色的笔很漂亮，比黑色的贵十元。”","evidence":"我去商店看了看，有一支红色的笔很漂亮，比黑色的贵十元。"},{"id":"H2-R13-1-v2-Q3","question":"我买了什么颜色的笔？","answer":"黑色","options":["黑色","白色","绿色","红色"],"explanation":"Thông tin đối chiếu trong bài: “我去商店看了看，有一支红色的笔很漂亮，比黑色的贵十元。”","evidence":"我去商店看了看，有一支红色的笔很漂亮，比黑色的贵十元。"},{"id":"H2-R13-1-v2-Q4","question":"谁帮我画画？","answer":"妹妹","options":["李","妹妹","我","你"],"explanation":"Thông tin đối chiếu trong bài: “回家后，妹妹问能不能帮我给她画画。”","evidence":"回家后，妹妹问能不能帮我给她画画。"},{"id":"H2-R13-1-v2-Q5","question":"妹妹画了哪儿？","answer":"教室","options":["学校前","学校外","教室","书店"],"explanation":"Thông tin đối chiếu trong bài: “我说可以，请她画我们班的教室。”","evidence":"我说可以，请她画我们班的教室。"},{"id":"H2-R13-1-v2-Q6","question":"老师觉得礼物要很贵吗？","answer":"不要","options":["不知道怎么游","有一个问题不懂","是","不要"],"explanation":"Thông tin đối chiếu trong bài: “她告诉我，礼物不要太贵，知道学生在想她就很好。”","evidence":"她告诉我，礼物不要太贵，知道学生在想她就很好。"}]},{"id":"H2-R13-2","lesson":13,"revision":2,"title":"Tự học trên mạng và hỏi thầy cô","text":"我想在新年学好中文，就问老师要多看书还是多上网。她告诉我，两件事都可以做，但网上的词有时比书里的多，要看看自己懂不懂。我每天在家上网半个小时，看见不懂的词就写在本子里。星期六我拿去问老师，她给我介绍了一本我更懂意思的书。我看见书上面有她的名字，是她教学生的时候写的。老师让我每次只看一点儿，不要一下看太多。我回家后给妈妈看，妈妈说现在我比去年爱看书多了。我希望明年能给她介绍很多中文的事，也想教妹妹写她自己的名字。今天晚上我没有看电影，准备看新书。","translation":"Tôi muốn học tốt trong năm mới, hỏi giáo viên nên đọc hay lên mạng nhiều. Cô bảo cả hai được nhưng từ trên mạng có lúc nhiều hơn sách, phải xem hiểu không. Mỗi ngày tôi lên mạng nửa giờ, chép từ chưa hiểu vào vở. Thứ Bảy hỏi cô, cô giới thiệu sách dễ hơn. Trên sách có tên cô, do cô viết khi dạy. Cô dặn mỗi lần chỉ xem một ít, đừng quá nhiều. Mẹ thấy năm nay tôi thích đọc hơn năm trước. Tôi mong năm sau kể mẹ nhiều chuyện tiếng Trung, còn dạy em viết tên. Tối nay tôi bỏ phim để đọc sách mới.","pinyin":"wǒ xiǎng zài xīnnián xué hǎo Zhōngwén ， jiù wèn lǎoshī yào duō kàn shū háishi duō shàngwǎng 。 tā gàosu wǒ ， liǎng jiàn shì dōu kěyǐ zuò ， dàn wǎngshàng de cí yǒushí bǐ shū lǐ de duō ， yào kàn kàn zìjǐ dǒng bù dǒng 。 wǒ měi tiān zàijiā shàngwǎng bàn ge xiǎoshí ， kàn jiàn bù dǒng de cí jiù xiě zài běnzi lǐ 。 xīngqī liù wǒ ná qù wèn lǎoshī ， tā gěi wǒ jièshào le yī běn wǒ gèng dǒng yìsi de shū 。 wǒ kàn jiàn shū shàngmian yǒu tā de míngzi ， shì tā jiàoxué shēng de shíhou xiě de 。 lǎoshī ràng wǒ měi cì zhǐ kàn yìdiǎnr ， bú yào yíxià kàn tài duō 。 wǒ huíjiā hòu gěi māma kàn ， māma shuō xiànzài wǒ bǐ qùnián ài kàn shū duō le 。 wǒ xīwàng míngnián néng gěi tā jièshào hěn duō Zhōngwén de shì ， yě xiǎng jiāo mèimei xiě tā zìjǐ de míngzi 。 jīntiān wǎnshang wǒ méiyǒu kàn diànyǐng ， zhǔnbèi kàn xīn shū 。","grammar":["Câu có hai tân ngữ","Câu so sánh 比 với số lượng chênh lệch cụ thể","Câu so sánh 比 với mức chênh lệch nhỏ (一点儿/一些)"],"questions":[{"id":"H2-R13-2-v2-Q1","question":"我每天上网多少时间？","answer":"半个小时","options":["一个半小时","今天","半个小时","明天"],"explanation":"Thông tin đối chiếu trong bài: “我每天在家上网半个小时，看见不懂的词就写在本子里。”","evidence":"我每天在家上网半个小时，看见不懂的词就写在本子里。"},{"id":"H2-R13-2-v2-Q2","question":"不懂的词写在哪儿？","answer":"本子里","options":["书店里面","地铁站","医院旁边","本子里"],"explanation":"Thông tin đối chiếu trong bài: “我每天在家上网半个小时，看见不懂的词就写在本子里。”","evidence":"我每天在家上网半个小时，看见不懂的词就写在本子里。"},{"id":"H2-R13-2-v2-Q3","question":"星期六我问谁？","answer":"老师","options":["老师","中国学生","外国学生","朋友的妈妈"],"explanation":"Thông tin đối chiếu trong bài: “星期六我拿去问老师，她给我介绍了一本我更懂意思的书。”","evidence":"星期六我拿去问老师，她给我介绍了一本我更懂意思的书。"},{"id":"H2-R13-2-v2-Q4","question":"新书上面有谁的名字？","answer":"老师","options":["我","老师","你","学生"],"explanation":"Thông tin đối chiếu trong bài: “我想在新年学好中文，就问老师要多看书还是多上网。”","evidence":"我想在新年学好中文，就问老师要多看书还是多上网。"},{"id":"H2-R13-2-v2-Q5","question":"我希望教妹妹写什么？","answer":"名字","options":["书里的问题","生日画","名字","画笔"],"explanation":"Thông tin đối chiếu trong bài: “我希望明年能给她介绍很多中文的事，也想教妹妹写她自己的名字。”","evidence":"我希望明年能给她介绍很多中文的事，也想教妹妹写她自己的名字。"},{"id":"H2-R13-2-v2-Q6","question":"我今天晚上准备做什么？","answer":"看书","options":["洗杯子","洗菜","买菜","看书"],"explanation":"Thông tin đối chiếu trong bài: “今天晚上我没有看电影，准备看新书。”","evidence":"今天晚上我没有看电影，准备看新书。"}]},{"id":"H2-R13-3","lesson":13,"revision":2,"title":"Tìm nhà vệ sinh trong khu lớp mới","text":"我们班今天去新的教室上课。房间比过去大一些，桌子上面有花，里面还有很多书。我坐在后面，看老师写的字有点儿小，就请旁边的同学帮我看看。他告诉我老师正在写新年想做的事。下课后，我想找洗手间，问一个在外面站着的先生。他说自己不是这里的老师，也不知道，让我去问前边的女士。女士很高兴，告诉我洗手间就在书店里面。回来的时候，我看见两个同学在上网。他们希望下个月去北京旅游，正在看车票。我给他们介绍我去过的书店，说那里可能有他们想看的书。他们让我下次和他们一起去。","translation":"Hôm nay lớp học ở phòng mới rộng hơn, có hoa trên bàn và chỗ để sách. Ngồi sau nhìn chữ nhỏ nên tôi nhờ bạn xem: giáo viên đang viết những việc năm mới muốn làm. Tan học tôi hỏi người đàn ông ngoài phòng chỗ vệ sinh; ông không làm ở đây nên chỉ hỏi cô phía trước. Cô vui vẻ chỉ nhà vệ sinh trong hiệu sách. Quay lại tôi thấy hai bạn lên mạng xem vé du lịch Bắc Kinh tháng sau. Tôi giới thiệu hiệu sách từng đến, có thể có sách họ muốn. Các bạn rủ lần sau đi cùng.","pinyin":"wǒmen bān jīntiān qù xīn de jiàoshì shàngkè 。 fángjiān bǐ guòqù dà yìxiē ， zhuōzi shàngmian yǒu huā ， lǐmiàn háiyǒu hěn duō shū 。 wǒ zuò zài hòumiàn ， kàn lǎoshī xiě de zì yǒudiǎnr xiǎo ， jiù qǐng pángbiān de tóngxué bāng wǒ kàn kàn 。 tā gàosu wǒ lǎoshī zhèngzài xiě xīnnián xiǎng zuò de shì 。 xià kè hòu ， wǒ xiǎng zhǎo xǐshǒujiān ， wèn yí gè zài wàimiàn zhàn zhe de xiānsheng 。 tā shuō zìjǐ bù shì zhèlǐ de lǎoshī ， yě bù zhīdào ， ràng wǒ qù wèn qiánbian de nǚshì 。 nǚshì hěn gāoxìng ， gàosu wǒ xǐshǒujiān jiù zài shūdiàn lǐmiàn 。 huí lái de shíhou ， wǒ kàn jiàn liǎng gè tóngxué zài shàngwǎng 。 tāmen xīwàng xià gè yuè qù Běijīng lǚyóu ， zhèngzài kàn chēpiào 。 wǒ gěi tāmen jièshào wǒ qù guò de shūdiàn ， shuō nàli kěnéng yǒu tāmen xiǎng kàn de shū 。 tāmen ràng wǒ xià cì hé tāmen yìqǐ qù 。","grammar":["Câu có hai tân ngữ","Câu so sánh 比 với số lượng chênh lệch cụ thể","Câu so sánh 比 với mức chênh lệch nhỏ (一点儿/一些)"],"questions":[{"id":"H2-R13-3-v2-Q1","question":"新教室比过去怎么样？","answer":"大一些","options":["太热了","不冷","大一些","可以"],"explanation":"Thông tin đối chiếu trong bài: “房间比过去大一些，桌子上面有花，里面还有很多书。”","evidence":"房间比过去大一些，桌子上面有花，里面还有很多书。"},{"id":"H2-R13-3-v2-Q2","question":"桌子上面有什么？","answer":"花","options":["衣服","手机","中文电影","花"],"explanation":"Thông tin đối chiếu trong bài: “房间比过去大一些，桌子上面有花，里面还有很多书。”","evidence":"房间比过去大一些，桌子上面有花，里面还有很多书。"},{"id":"H2-R13-3-v2-Q3","question":"我坐在哪儿？","answer":"后面","options":["后面","小房间","桌子上","房间外边"],"explanation":"Thông tin đối chiếu trong bài: “我坐在后面，看老师写的字有点儿小，就请旁边的同学帮我看看。”","evidence":"我坐在后面，看老师写的字有点儿小，就请旁边的同学帮我看看。"},{"id":"H2-R13-3-v2-Q4","question":"谁告诉我洗手间在哪儿？","answer":"女士","options":["妻子","女士","男孩儿","中国学生"],"explanation":"Thông tin đối chiếu trong bài: “女士很高兴，告诉我洗手间就在书店里面。”","evidence":"女士很高兴，告诉我洗手间就在书店里面。"},{"id":"H2-R13-3-v2-Q5","question":"洗手间在哪儿？","answer":"书店里面","options":["公司","医院前边","书店里面","北京"],"explanation":"Thông tin đối chiếu trong bài: “女士很高兴，告诉我洗手间就在书店里面。”","evidence":"女士很高兴，告诉我洗手间就在书店里面。"},{"id":"H2-R13-3-v2-Q6","question":"两个同学想去哪儿旅游？","answer":"北京","options":["书店外","学校的书店","前边的大教室","北京"],"explanation":"Thông tin đối chiếu trong bài: “他们希望下个月去北京旅游，正在看车票。”","evidence":"他们希望下个月去北京旅游，正在看车票。"}]},{"id":"H2-R13-4","lesson":13,"revision":2,"title":"Anh lớn hơn em ba tuổi","text":"我和弟弟都喜欢画画。他比我小三岁，但画得比我好。新年我想给他买画笔，妈妈说他已经有很多，还是送他一本画画的书。我上网看了看，有一本介绍画花和鱼的，比书店里的便宜五元。我问弟弟喜欢不喜欢，他让我别买，可能同学会送他。星期六他回来，拿了一本中文书，不是画画的。他说同学教他写了一些新词，很有意思。我就和他去书店，让他自己看画画的书。他看了很多书，想买最小的那本。我问为什么，他说小的好拿，每天坐公交车时也可以看。回家后，我们一起给妈妈画了花。","translation":"Tôi và em trai thích vẽ. Em nhỏ hơn ba tuổi mà vẽ giỏi hơn. Năm mới định tặng bút nhưng mẹ bảo đã nhiều, nên tặng sách. Tôi thấy sách vẽ hoa, cá trên mạng rẻ hơn hiệu sách năm tệ. Em bảo chưa mua, có thể bạn sẽ tặng. Thứ Bảy em mang về sách tiếng Trung, kể bạn dạy từ mới rất thú vị. Tôi đưa đến hiệu sách tự chọn sách vẽ; em xem lâu rồi chọn quyển nhỏ nhất để tiện mang, đi xe buýt cũng đọc được. Về hai anh em vẽ hoa tặng mẹ.","pinyin":"wǒ hé dìdi dōu xǐhuan huà huà 。 tā bǐ wǒ xiǎo sān suì ， dàn huà de bǐ wǒ hǎo 。 xīnnián wǒ xiǎng gěi tā mǎi huàbǐ ， māma shuō tā yǐjīng yǒu hěn duō ， háishi sòng tā yī běn huà huà de shū 。 wǒ shàngwǎng kàn le kàn ， yǒu yī běn jièshào huà huā hé yú de ， bǐ shūdiàn lǐ de piányi wǔ yuán 。 wǒ wèn dìdi xǐhuan bù xǐhuan ， tā ràng wǒ bié mǎi ， kěnéng tóngxué huì sòng tā 。 xīngqī liù tā huí lái ， ná le yī běn Zhōngwén shū ， bù shì huà huà de 。 tā shuō tóngxué jiāo tā xiě le yìxiē xīn cí ， hěn yǒu yì si 。 wǒ jiù hé tā qù shūdiàn ， ràng tā zìjǐ kàn huà huà de shū 。 tā kàn le hěn duō shū ， xiǎng mǎi zuì xiǎo de nà běn 。 wǒ wèn wèishénme ， tā shuō xiǎo de hǎo ná ， měi tiān zuò gōngjiāochē shí yě kěyǐ kàn 。 huíjiā hòu ， wǒmen yìqǐ gěi māma huà le huā 。","grammar":["Câu có hai tân ngữ","Câu so sánh 比 với số lượng chênh lệch cụ thể","Câu so sánh 比 với mức chênh lệch nhỏ (一点儿/一些)"],"questions":[{"id":"H2-R13-4-v2-Q1","question":"弟弟比我小几岁？","answer":"三岁","options":["六岁","八岁","三岁","十岁"],"explanation":"Thông tin đối chiếu trong bài: “他比我小三岁，但画得比我好。”","evidence":"他比我小三岁，但画得比我好。"},{"id":"H2-R13-4-v2-Q2","question":"妈妈让我买什么？","answer":"画画的书","options":["医","杯子","一个杯子","画画的书"],"explanation":"Thông tin đối chiếu trong bài: “新年我想给他买画笔，妈妈说他已经有很多，还是送他一本画画的书。”","evidence":"新年我想给他买画笔，妈妈说他已经有很多，还是送他一本画画的书。"},{"id":"H2-R13-4-v2-Q3","question":"网上的书便宜多少？","answer":"五元","options":["五元","三十元","六十元","七十元"],"explanation":"Thông tin đối chiếu trong bài: “我上网看了看，有一本介绍画花和鱼的，比书店里的便宜五元。”","evidence":"我上网看了看，有一本介绍画花和鱼的，比书店里的便宜五元。"},{"id":"H2-R13-4-v2-Q4","question":"弟弟的同学送了什么书？","answer":"中文书","options":["饺子","中文书","面条儿","名字"],"explanation":"Thông tin đối chiếu trong bài: “星期六他回来，拿了一本中文书，不是画画的。”","evidence":"星期六他回来，拿了一本中文书，不是画画的。"},{"id":"H2-R13-4-v2-Q5","question":"弟弟想买哪本？","answer":"最小的","options":["我的电脑","桌子","最小的","猫"],"explanation":"Thông tin đối chiếu trong bài: “他看了很多书，想买最小的那本。”","evidence":"他看了很多书，想买最小的那本。"},{"id":"H2-R13-4-v2-Q6","question":"我们给谁画花？","answer":"妈妈","options":["法国人","泰国人","爷爷","妈妈"],"explanation":"Thông tin đối chiếu trong bài: “回家后，我们一起给妈妈画了花。”","evidence":"回家后，我们一起给妈妈画了花。"}]},{"id":"H2-R13-5","lesson":13,"revision":2,"title":"Lời chúc ở phía trong món quà","text":"奶奶希望新年的时候家人都来家里吃饭。我跟姐姐准备给她送花，也想写一些中文给她。姐姐教我写：新年快乐，身体好。我觉得太少了，还想告诉奶奶，自己今年已经学会做饭，明年可以给她帮忙。姐姐说写这些就很好，见到奶奶再说也可以。我们买的花比去年贵十元，我们请爸爸开车送。爸爸开车送我们去，奶奶在楼下接。她没有看花，问我们冷不冷，想不想吃饭。吃完后，她打开礼物，看见里面的字，笑着说下次要让我教她写中文。我说奶奶已经认识很多字，我们可以一起学。","translation":"Bà mong năm mới cả nhà đến ăn cơm. Tôi và chị mua hoa, muốn viết lời chúc bên trong. Chị dạy tôi viết chúc năm mới vui, sức khỏe tốt. Tôi muốn thêm rằng năm nay đã biết nấu, năm sau giúp bà được. Chị bảo viết vậy trước, gặp rồi kể thêm. Hoa đắt hơn năm ngoái mười tệ, chúng tôi nhờ bố lái xe đưa đi. Bà đón dưới, chưa xem hoa đã hỏi có lạnh, đói không. Ăn xong mở quà thấy chữ bà cười, muốn tôi dạy tiếng Trung. Tôi bảo bà đã biết nhiều chữ, cùng học được rồi.","pinyin":"nǎinai xīwàng xīnnián de shíhou jiārén dōu lái jiālǐ chīfàn 。 wǒ gēn jiějie zhǔnbèi gěi tā sòng huā ， yě xiǎng xiě yìxiē Zhōngwén gěi tā 。 jiějie jiāo wǒ xiě ： xīnnián kuàilè ， shēntǐ hǎo 。 wǒ juéde tài shǎo le ， hái xiǎng gàosu nǎinai ， zìjǐ jīnnián yǐjīng xué huì zuòfàn ， míngnián kěyǐ gěi tā bāngmáng 。 jiějie shuō xiě zhèxiē jiù hěn hǎo ， jiàndào nǎinai zài shuō yě kěyǐ 。 wǒmen mǎi de huā bǐ qùnián guì shí yuán ， wǒmen qǐng bàba kāichē sòng 。 bàba kāichē sòng wǒmen qù ， nǎinai zài lóuxià jiē 。 tā méiyǒu kàn huā ， wèn wǒmen lěng bù lěng ， xiǎng bù xiǎng chīfàn 。 chī wán hòu ， tā dǎ kāi lǐwù ， kàn jiàn lǐmiàn de zì ， xiào zhe shuō xià cì yào ràng wǒ jiāo tā xiě Zhōngwén 。 wǒ shuō nǎinai yǐjīng rènshi hěn duō zì ， wǒmen kěyǐ yìqǐ xué 。","grammar":["Câu có hai tân ngữ","Câu so sánh 比 với số lượng chênh lệch cụ thể","Câu so sánh 比 với mức chênh lệch nhỏ (一点儿/一些)"],"questions":[{"id":"H2-R13-5-v2-Q1","question":"奶奶希望家人来做什么？","answer":"吃饭","options":["看书","看电视","吃饭","唱歌"],"explanation":"Thông tin đối chiếu trong bài: “奶奶希望新年的时候家人都来家里吃饭。”","evidence":"奶奶希望新年的时候家人都来家里吃饭。"},{"id":"H2-R13-5-v2-Q2","question":"谁教我写新年快乐？","answer":"姐姐","options":["他","弟弟","朋友","姐姐"],"explanation":"Thông tin đối chiếu trong bài: “姐姐教我写：新年快乐，身体好。”","evidence":"姐姐教我写：新年快乐，身体好。"},{"id":"H2-R13-5-v2-Q3","question":"我想告诉奶奶自己学会了什么？","answer":"做饭","options":["做饭","走一会儿","跑太快","不要等我吃饭"],"explanation":"Thông tin đối chiếu trong bài: “我觉得太少了，还想告诉奶奶，自己今年已经学会做饭，明年可以给她帮忙。”","evidence":"我觉得太少了，还想告诉奶奶，自己今年已经学会做饭，明年可以给她帮忙。"},{"id":"H2-R13-5-v2-Q4","question":"今年的花比去年贵多少？","answer":"十元","options":["二百元","十元","五元","三百元"],"explanation":"Thông tin đối chiếu trong bài: “我们买的花比去年贵十元，我们请爸爸开车送。”","evidence":"我们买的花比去年贵十元，我们请爸爸开车送。"},{"id":"H2-R13-5-v2-Q5","question":"谁开车送我们？","answer":"爸爸","options":["同学","您","爸爸","大家"],"explanation":"Thông tin đối chiếu trong bài: “我们买的花比去年贵十元，我们请爸爸开车送。”","evidence":"我们买的花比去年贵十元，我们请爸爸开车送。"},{"id":"H2-R13-5-v2-Q6","question":"礼物里面有什么？","answer":"中文","options":["笔","本子","新本子","中文"],"explanation":"Thông tin đối chiếu trong bài: “吃完后，她打开礼物，看见里面的字，笑着说下次要让我教她写中文。”","evidence":"吃完后，她打开礼物，看见里面的字，笑着说下次要让我教她写中文。"}]},{"id":"H2-R14-1","lesson":14,"revision":2,"title":"Ai đang đứng dưới nhà?","text":"下午我正在写字，妈妈给我打电话，说楼下站着一个人，拿着一个绿色的包。我不知道是谁，下去看了看，是我小时候的朋友。她现在住在北京，这次是来学校看老师的。她没有告诉我，就想让我高兴一下。我请她进来，她说包里有送给我的书，还有给妈妈的花。妈妈下班回来，觉得她比过去高了很多，问她是不是还喜欢跳舞。她说现在经常教小孩儿跳舞，自己也很喜欢。晚上我们在家吃饭，她给我看了手机里的画，一个女孩儿的眼睛很大，是她的学生画的。我想，这么多年没见，朋友有很多新事可以介绍。","translation":"Đang viết bài, tôi được mẹ gọi báo có người cầm túi xanh đứng dưới. Xuống xem là bạn thời nhỏ, nay ở Bắc Kinh, đến trường thăm giáo viên và muốn làm tôi bất ngờ. Tôi mời vào; túi có sách cho tôi, hoa cho mẹ. Mẹ về thấy bạn cao hơn trước, hỏi còn thích múa không. Bạn hay dạy trẻ múa và vẫn rất thích. Tối ăn ở nhà, bạn cho xem tranh học sinh vẽ trên điện thoại: cô bé mắt to. Lâu không gặp, bạn có nhiều chuyện mới để kể.","pinyin":"xiàwǔ wǒ zhèngzài xiě zì ， māma gěi wǒ dǎ diànhuà ， shuō lóuxià zhàn zhe yí gè rén ， ná zhe yí gè lǜsè de bāo 。 wǒ bù zhīdào shì shéi ， xià qù kàn le kàn ， shì wǒ xiǎoshíhou de péngyou 。 tā xiànzài zhù zài Běijīng ， zhè cì shì lái xuéxiào kàn lǎoshī de 。 tā méiyǒu gàosu wǒ ， jiù xiǎng ràng wǒ gāoxìng yíxià 。 wǒ qǐng tā jìnlái ， tā shuō bāo lǐ yǒu sònggěi wǒ de shū ， háiyǒu gěi māma de huā 。 māma xiàbān huí lái ， juéde tā bǐ guòqù gāo le hěn duō ， wèn tā shì bu shì hái xǐhuan tiàowǔ 。 tā shuō xiànzài jīngcháng jiāo xiǎoháir tiàowǔ ， zìjǐ yě hěn xǐhuan 。 wǎnshang wǒmen zàijiā chīfàn ， tā gěi wǒ kàn le shǒujī lǐ de huà ， yí gè nǚháir de yǎnjing hěn dà ， shì tā de xuésheng huà de 。 wǒ xiǎng ， zhème duō nián méi jiàn ， péngyou yǒu hěn duō xīn shì kěyǐ jièshào 。","grammar":["Câu tồn tại chỉ sự xuất hiện hoặc biến mất","Đại từ nghi vấn 多 hỏi mức độ","Bổ ngữ xu hướng phức hợp"],"questions":[{"id":"H2-R14-1-v2-Q1","question":"楼下的人拿着什么颜色的包？","answer":"绿色","options":["黑色","红色","白色","绿色"],"explanation":"Thông tin đối chiếu trong bài: “下午我正在写字，妈妈给我打电话，说楼下站着一个人，拿着一个绿色的包。”","evidence":"下午我正在写字，妈妈给我打电话，说楼下站着一个人，拿着一个绿色的包。"},{"id":"H2-R14-1-v2-Q2","question":"她是谁？","answer":"小时候的朋友","options":["小时候的朋友","老师","学生","同学"],"explanation":"Thông tin đối chiếu trong bài: “我不知道是谁，下去看了看，是我小时候的朋友。”","evidence":"我不知道是谁，下去看了看，是我小时候的朋友。"},{"id":"H2-R14-1-v2-Q3","question":"她现在住在哪儿？","answer":"北京","options":["房间外边","北京","前边","这边"],"explanation":"Thông tin đối chiếu trong bài: “她现在住在北京，这次是来学校看老师的。”","evidence":"她现在住在北京，这次是来学校看老师的。"},{"id":"H2-R14-1-v2-Q4","question":"她这次来学校看谁？","answer":"老师","options":["李文","姐姐","老师","她"],"explanation":"Thông tin đối chiếu trong bài: “她现在住在北京，这次是来学校看老师的。”","evidence":"她现在住在北京，这次是来学校看老师的。"},{"id":"H2-R14-1-v2-Q5","question":"她给妈妈什么？","answer":"花","options":["一只小狗","一只猫","中文课","花"],"explanation":"Thông tin đối chiếu trong bài: “我请她进来，她说包里有送给我的书，还有给妈妈的花。”","evidence":"我请她进来，她说包里有送给我的书，还有给妈妈的花。"},{"id":"H2-R14-1-v2-Q6","question":"她现在教小孩儿做什么？","answer":"跳舞","options":["跳舞","买菜","买票","做米饭"],"explanation":"Thông tin đối chiếu trong bài: “她说现在经常教小孩儿跳舞，自己也很喜欢。”","evidence":"她说现在经常教小孩儿跳舞，自己也很喜欢。"}]},{"id":"H2-R14-2","lesson":14,"revision":2,"title":"Khách đến khi nhà còn bừa","text":"今天我请两个同学来我家过年。妈妈让我早上准备房间，但我想还有很多时间，就在床上看书。十一点，门前面已经站着两个同学，我知道自己看书看了两个小时。桌子上有书，椅子上有包，房间里没有椅子可以坐。我有点儿不好意思，请他们到别的房间。一个同学笑着说，他的房子也经常这样，大家一起拿一拿东西就好。我们拿好书和包，房间很快就可以坐了。妈妈回来看见三个同学一起准备午饭，很高兴。吃饭的时候，她说一个人在家有时觉得没意思，有朋友来，虽然有点儿忙，但是很好。我知道下次要早一点儿准备，不让朋友站在门口等。","translation":"Tôi mời hai bạn đến nhà đón năm mới. Mẹ dặn sáng chuẩn bị phòng, tôi tưởng còn lâu nên đọc sách trên giường. Mười một giờ các bạn đã đứng trước cửa, tôi mới biết đọc quá lâu. Sách trên bàn, túi trên ghế, không có chỗ ngồi; tôi ngại mời ra ngoài phòng. Bạn cười bảo nhà mình cũng hay vậy, cùng dọn là được. Xếp sách túi xong có chỗ ngồi. Mẹ về thấy ba người chuẩn bị trưa rất vui. Mẹ thấy một mình buồn, có bạn dù bận vẫn tốt. Lần sau tôi phải chuẩn bị sớm để bạn khỏi chờ cổng.","pinyin":"jīntiān wǒ qǐng liǎng gè tóngxué lái wǒ jiā guònián 。 māma ràng wǒ zǎoshang zhǔnbèi fángjiān ， dàn wǒ xiǎng háiyǒu hěn duō shíjiān ， jiù zài chuáng shàng kàn shū 。 shí yī diǎn ， mén qiánmiàn yǐjīng zhàn zhe liǎng gè tóngxué ， wǒ zhīdào zìjǐ kàn shū kàn le liǎng gè xiǎoshí 。 zhuōzi shàng yǒu shū ， yǐzi shàng yǒu bāo ， fángjiān lǐ méiyǒu yǐzi kěyǐ zuò 。 wǒ yǒudiǎnr bù hǎo yìsi ， qǐng tāmen dào biéde fángjiān 。 yí gè tóngxué xiào zhe shuō ， tā de fángzi yě jīngcháng zhèyàng ， dàjiā yìqǐ ná yī ná dōngxi jiù hǎo 。 wǒmen ná hǎo shū hé bāo ， fángjiān hěn kuài jiù kěyǐ zuò le 。 māma huí lái kàn jiàn sān gè tóngxué yìqǐ zhǔnbèi wǔfàn ， hěn gāoxìng 。 chīfàn de shíhou ， tā shuō yí gè rén zàijiā yǒushí juéde méi yìsi ， yǒu péngyou lái ， suīrán yǒudiǎnr máng ， dànshì hěn hǎo 。 wǒ zhīdào xià cì yào zǎo yìdiǎnr zhǔnbèi ， bù ràng péngyou zhàn zài ménkǒu děng 。","grammar":["Câu tồn tại chỉ sự xuất hiện hoặc biến mất","Đại từ nghi vấn 多 hỏi mức độ","Bổ ngữ xu hướng phức hợp"],"questions":[{"id":"H2-R14-2-v2-Q1","question":"我请了几个同学？","answer":"两个","options":["二十多个","十多个","一个","两个"],"explanation":"Thông tin đối chiếu trong bài: “今天我请两个同学来我家过年。”","evidence":"今天我请两个同学来我家过年。"},{"id":"H2-R14-2-v2-Q2","question":"早上我在床上做什么？","answer":"看书","options":["看书","上班","下班","看电影"],"explanation":"Thông tin đối chiếu trong bài: “妈妈让我早上准备房间，但我想还有很多时间，就在床上看书。”","evidence":"妈妈让我早上准备房间，但我想还有很多时间，就在床上看书。"},{"id":"H2-R14-2-v2-Q3","question":"同学们几点到了？","answer":"十一点","options":["十点","十一点","六点半","七点半"],"explanation":"Thông tin đối chiếu trong bài: “十一点，门前面已经站着两个同学，我知道自己看书看了两个小时。”","evidence":"十一点，门前面已经站着两个同学，我知道自己看书看了两个小时。"},{"id":"H2-R14-2-v2-Q4","question":"椅子上有什么？","answer":"包","options":["画笔","鱼","包","花"],"explanation":"Thông tin đối chiếu trong bài: “桌子上有书，椅子上有包，房间里没有椅子可以坐。”","evidence":"桌子上有书，椅子上有包，房间里没有椅子可以坐。"},{"id":"H2-R14-2-v2-Q5","question":"谁一起准备午饭？","answer":"三个同学","options":["小时候的朋友","高中学生","李","三个同学"],"explanation":"Thông tin đối chiếu trong bài: “妈妈回来看见三个同学一起准备午饭，很高兴。”","evidence":"妈妈回来看见三个同学一起准备午饭，很高兴。"},{"id":"H2-R14-2-v2-Q6","question":"我下次要什么时候准备？","answer":"早一点儿","options":["早一点儿","九点二十分","三点五十分","五点半"],"explanation":"Thông tin đối chiếu trong bài: “我知道下次要早一点儿准备，不让朋友站在门口等。”","evidence":"我知道下次要早一点儿准备，不让朋友站在门口等。"}]},{"id":"H2-R14-3","lesson":14,"revision":2,"title":"Nhận đúng người mới ở cổng trường","text":"老师让我今天接一位新同学。她告诉我，新同学姓李，是个女孩儿，个子不高，眼睛很大。下午三点，我到学校门口，看见前面走过来一个女孩儿，拿着红色的包。我问她是不是来学中文，她笑着说自己来找弟弟，不是新同学。我有点儿不好意思，再看看手机，老师说新同学拿的是黑色的包。三点十分，一个拿黑色的包的女孩儿过来了。她说第一次来学校，路上问了很多人。我给她介绍教室和书店，还和她去找老师。老师让她坐我旁边。我觉得下次接人要记得看好，不可以只看眼睛大不大。","translation":"Giáo viên nhờ đón bạn mới họ Lý, nữ, không cao, mắt to. Ba giờ ở cổng tôi thấy cô gái cầm túi đỏ đi tới, hỏi học tiếng Trung không. Cô đến tìm em trai, tôi nhận nhầm. Xem lại điện thoại mới thấy bạn mới mang túi đen. Ba giờ mười bạn cầm túi đen đến, kể lần đầu đến trường phải hỏi nhiều người. Tôi giới thiệu lớp, hiệu sách rồi đưa tìm giáo viên. Cô xếp bạn ngồi cạnh tôi. Lần sau đón phải nhớ đủ thông tin, không chỉ xem mắt to hay nhỏ.","pinyin":"lǎoshī ràng wǒ jīntiān jiē yī wèi xīn tóngxué 。 tā gàosu wǒ ， xīn tóngxué xìng Lǐ ， shì gè nǚháir ， gèzi bù gāo ， yǎnjing hěn dà 。 xiàwǔ sān diǎn ， wǒ dào xuéxiào ménkǒu ， kàn jiàn qiánmiàn zǒuguò lái yí gè nǚháir ， ná zhe hóngsè de bāo 。 wǒ wèn tā shì bu shì lái xué Zhōngwén ， tā xiào zhe shuō zìjǐ lái zhǎo dìdi ， bù shì xīn tóngxué 。 wǒ yǒudiǎnr bù hǎo yìsi ， zài kàn kàn shǒujī ， lǎoshī shuō xīn tóngxué ná de shì hēisè de bāo 。 sān diǎn shífēn ， yí gè ná hēisè de bāo de nǚháir guòlai le 。 tā shuō dì yī cì lái xuéxiào ， lùshang wèn le hěn duō rén 。 wǒ gěi tā jièshào jiàoshì hé shūdiàn ， hái hé tā qù zhǎo lǎoshī 。 lǎoshī ràng tā zuò wǒ pángbiān 。 wǒ juéde xià cì jiē rén yào jìde kàn hǎo ， bù kěyǐ zhǐ kàn yǎnjing dà búdà 。","grammar":["Câu tồn tại chỉ sự xuất hiện hoặc biến mất","Đại từ nghi vấn 多 hỏi mức độ","Bổ ngữ xu hướng phức hợp"],"questions":[{"id":"H2-R14-3-v2-Q1","question":"新同学姓什么？","answer":"李","options":["你","老师","学生","李"],"explanation":"Thông tin đối chiếu trong bài: “她告诉我，新同学姓李，是个女孩儿，个子不高，眼睛很大。”","evidence":"她告诉我，新同学姓李，是个女孩儿，个子不高，眼睛很大。"},{"id":"H2-R14-3-v2-Q2","question":"新同学个子怎么样？","answer":"不高","options":["不高","不知道怎么游","有一个问题不懂","是"],"explanation":"Thông tin đối chiếu trong bài: “她告诉我，新同学姓李，是个女孩儿，个子不高，眼睛很大。”","evidence":"她告诉我，新同学姓李，是个女孩儿，个子不高，眼睛很大。"},{"id":"H2-R14-3-v2-Q3","question":"第一个女孩儿拿什么颜色的包？","answer":"红色","options":["黑色","红色","绿色","白色"],"explanation":"Thông tin đối chiếu trong bài: “下午三点，我到学校门口，看见前面走过来一个女孩儿，拿着红色的包。”","evidence":"下午三点，我到学校门口，看见前面走过来一个女孩儿，拿着红色的包。"},{"id":"H2-R14-3-v2-Q4","question":"第一个女孩儿来找谁？","answer":"弟弟","options":["丈夫","妻子","弟弟","男孩儿"],"explanation":"Thông tin đối chiếu trong bài: “我问她是不是来学中文，她笑着说自己来找弟弟，不是新同学。”","evidence":"我问她是不是来学中文，她笑着说自己来找弟弟，不是新同学。"},{"id":"H2-R14-3-v2-Q5","question":"新同学拿什么颜色的包？","answer":"黑色","options":["绿色","红色","白色","黑色"],"explanation":"Thông tin đối chiếu trong bài: “我有点儿不好意思，再看看手机，老师说新同学拿的是黑色的包。”","evidence":"我有点儿不好意思，再看看手机，老师说新同学拿的是黑色的包。"},{"id":"H2-R14-3-v2-Q6","question":"新同学几点过来？","answer":"三点十分","options":["三点十分","下午五点","下午两点","一点半"],"explanation":"Thông tin đối chiếu trong bài: “三点十分，一个拿黑色的包的女孩儿过来了。”","evidence":"三点十分，一个拿黑色的包的女孩儿过来了。"}]},{"id":"H2-R14-4","lesson":14,"revision":2,"title":"Tập múa trong phòng rộng","text":"学校想让我们在新年给家人看一些好玩的事。有的同学唱歌，有的同学介绍中文书，我和三个女孩儿准备跳舞。第一次跳舞，教室前面坐着很多人，我有点儿不好意思，不知道怎么跳舞。一个女孩儿让我不要看前面，只看看她怎么跳舞。我们跳舞跳了半个小时，我觉得自己也可以了。老师进来，看见我们都在笑，说今天的教室真有意思。回家后，我给妈妈介绍了这件事，她说自己从小就喜欢跳舞，想和我一起学。星期日我们在房间里跳舞，妹妹站在门口看，也想过来。我觉得一个人跳舞没意思，家人一起学更快乐。","translation":"Trường muốn năm mới có hoạt động cho gia đình xem. Có bạn hát, có bạn giới thiệu sách, tôi và ba bạn nữ múa. Lần tập đầu nhiều người ngồi phía trước, tôi ngại đến quên động tác. Bạn bảo đừng nhìn khán giả, cứ nhìn mình. Nửa giờ sau tôi thấy dễ hơn. Giáo viên vào thấy mọi người cười, khen lớp thú vị. Về kể mẹ, mẹ vốn thích từ nhỏ nên muốn học cùng. Chủ nhật chúng tôi tập trong phòng, em gái đứng ở cửa xem rồi xin tham gia. Tôi thấy học cùng gia đình vui hơn một mình.","pinyin":"xuéxiào xiǎng ràng wǒmen zài xīnnián gěi jiārén kàn yìxiē hǎo wán de shì 。 yǒude tóngxué chànggē ， yǒude tóngxué jièshào Zhōngwén shū ， wǒ hé sān gè nǚháir zhǔnbèi tiàowǔ 。 dì yī cì tiàowǔ ， jiàoshì qiánmiàn zuò zhe hěn duō rén ， wǒ yǒudiǎnr bù hǎo yìsi ， bù zhīdào zěnme tiàowǔ 。 yí gè nǚháir ràng wǒ bú yào kàn qiánmiàn ， zhǐ kàn kàn tā zěnme tiàowǔ 。 wǒmen tiàowǔ tiào le bàn ge xiǎoshí ， wǒ juéde zìjǐ yě kěyǐ le 。 lǎoshī jìnlái ， kàn jiàn wǒmen dōu zài xiào ， shuō jīntiān de jiàoshì zhēn yǒu yì si 。 huíjiā hòu ， wǒ gěi māma jièshào le zhè jiàn shì ， tā shuō zìjǐ cóngxiǎo jiù xǐhuan tiàowǔ ， xiǎng hé wǒ yìqǐ xué 。 xīngqīrì wǒmen zài fángjiān lǐ tiàowǔ ， mèimei zhàn zài ménkǒu kàn ， yě xiǎng guòlai 。 wǒ juéde yí gè rén tiàowǔ méi yìsi ， jiārén yìqǐ xué gèng kuàilè 。","grammar":["Câu tồn tại chỉ sự xuất hiện hoặc biến mất","Đại từ nghi vấn 多 hỏi mức độ","Bổ ngữ xu hướng phức hợp"],"questions":[{"id":"H2-R14-4-v2-Q1","question":"我和几个女孩儿准备跳舞？","answer":"三个","options":["一个","两个","四个","三个"],"explanation":"Thông tin đối chiếu trong bài: “有的同学唱歌，有的同学介绍中文书，我和三个女孩儿准备跳舞。”","evidence":"有的同学唱歌，有的同学介绍中文书，我和三个女孩儿准备跳舞。"},{"id":"H2-R14-4-v2-Q2","question":"第一次教室前面有什么人？","answer":"很多人","options":["很多人","小时候的朋友","三个同学","高中学生"],"explanation":"Thông tin đối chiếu trong bài: “第一次跳舞，教室前面坐着很多人，我有点儿不好意思，不知道怎么跳舞。”","evidence":"第一次跳舞，教室前面坐着很多人，我有点儿不好意思，不知道怎么跳舞。"},{"id":"H2-R14-4-v2-Q3","question":"女孩儿让我看谁怎么跳舞？","answer":"她","options":["你","她","老师","学生"],"explanation":"Thông tin đối chiếu trong bài: “一个女孩儿让我不要看前面，只看看她怎么跳舞。”","evidence":"一个女孩儿让我不要看前面，只看看她怎么跳舞。"},{"id":"H2-R14-4-v2-Q4","question":"我们跳舞跳了多少时间？","answer":"半个小时","options":["一个半小时","今天","半个小时","明天"],"explanation":"Thông tin đối chiếu trong bài: “我们跳舞跳了半个小时，我觉得自己也可以了。”","evidence":"我们跳舞跳了半个小时，我觉得自己也可以了。"},{"id":"H2-R14-4-v2-Q5","question":"谁从小喜欢跳舞？","answer":"妈妈","options":["法国人","泰国人","爷爷","妈妈"],"explanation":"Thông tin đối chiếu trong bài: “回家后，我给妈妈介绍了这件事，她说自己从小就喜欢跳舞，想和我一起学。”","evidence":"回家后，我给妈妈介绍了这件事，她说自己从小就喜欢跳舞，想和我一起学。"},{"id":"H2-R14-4-v2-Q6","question":"妹妹站在哪儿看？","answer":"门口","options":["门口","公司","医院前边","北京"],"explanation":"Thông tin đối chiếu trong bài: “星期日我们在房间里跳舞，妹妹站在门口看，也想过来。”","evidence":"星期日我们在房间里跳舞，妹妹站在门口看，也想过来。"}]},{"id":"H2-R14-5","lesson":14,"revision":2,"title":"Ngôi nhà không còn buồn tẻ","text":"爷爷奶奶的房子不大，但前面有一个可以坐着看书的椅子。过去我去的时候，那里只坐着爷爷一个人。奶奶经常在家里做饭，觉得他一个人太没意思。今年过年，家人都来，门口站着很多小孩儿。爷爷给他们介绍自己小时候的学校，一个女孩儿说她也想去看看。奶奶拿了很多面包和水果，让大家别只听，要吃一点儿。吃完后，爸爸和爷爷下去走走，妈妈和小孩儿看电视。我坐在前面，觉得这个房子，人多一点儿，意思就不一样。晚上回家前，爷爷让我有时间再来，我说下个星期就来，还要请同学一起看他的书。","translation":"Nhà ông bà không lớn, phía trước có chỗ ngồi đọc sách. Trước mỗi lần đến chỉ ông ngồi một mình, bà nấu trong nhà, thấy ông buồn. Năm nay cả nhà về, nhiều trẻ đứng trước cửa nghe ông kể trường thời nhỏ. Một bé gái muốn xem trường ấy. Bà mang bánh mì, trái cây ra, dặn vừa nghe vừa ăn. Sau đó bố và ông đi dạo, mẹ xem tivi cùng trẻ. Tôi thấy vẫn ngôi nhà cũ mà đông người thì khác. Trước khi về ông dặn rảnh lại đến, tôi hẹn tuần sau rủ thêm bạn xem sách ông.","pinyin":"yéye nǎinai de fángzi búdà ， dàn qiánmiàn yǒu yí gè kěyǐ zuò zhe kàn shū de yǐzi 。 guòqù wǒ qù de shíhou ， nàli zhǐ zuò zhe yéye yí gè rén 。 nǎinai jīngcháng zàijiā lǐ zuòfàn ， juéde tā yí gè rén tài méi yìsi 。 jīnnián guònián ， jiārén dōu lái ， ménkǒu zhàn zhe hěn duō xiǎoháir 。 yéye gěi tāmen jièshào zìjǐ xiǎoshíhou de xuéxiào ， yí gè nǚháir shuō tā yě xiǎng qù kàn kàn 。 nǎinai ná le hěn duō miànbāo hé shuǐguǒ ， ràng dàjiā bié zhǐ tīng ， yào chī yìdiǎnr 。 chī wán hòu ， bàba hé yéye xià qù zǒu zǒu ， māma hé xiǎoháir kàn diànshì 。 wǒ zuò zài qiánmiàn ， juéde zhège fángzi ， rén duō yìdiǎnr ， yìsi jiù bù yíyàng 。 wǎnshang huíjiā qián ， yéye ràng wǒ yǒu shíjiān zài lái ， wǒ shuō xià gè xīngqī jiù lái ， hái yào qǐng tóngxué yìqǐ kàn tā de shū 。","grammar":["Câu tồn tại chỉ sự xuất hiện hoặc biến mất","Đại từ nghi vấn 多 hỏi mức độ","Bổ ngữ xu hướng phức hợp"],"questions":[{"id":"H2-R14-5-v2-Q1","question":"爷爷过去坐在哪儿看书？","answer":"房子前面","options":["超市前","书店外","学校的书店","房子前面"],"explanation":"Thông tin đối chiếu trong bài: “爷爷奶奶的房子不大，但前面有一个可以坐着看书的椅子。”","evidence":"爷爷奶奶的房子不大，但前面有一个可以坐着看书的椅子。"},{"id":"H2-R14-5-v2-Q2","question":"奶奶过去经常做什么？","answer":"做饭","options":["做饭","上班","下班","看电影"],"explanation":"Thông tin đối chiếu trong bài: “奶奶经常在家里做饭，觉得他一个人太没意思。”","evidence":"奶奶经常在家里做饭，觉得他一个人太没意思。"},{"id":"H2-R14-5-v2-Q3","question":"今年什么时候家人都来？","answer":"过年","options":["上午","过年","下午","晚上"],"explanation":"Thông tin đối chiếu trong bài: “今年过年，家人都来，门口站着很多小孩儿。”","evidence":"今年过年，家人都来，门口站着很多小孩儿。"},{"id":"H2-R14-5-v2-Q4","question":"爷爷介绍什么？","answer":"小时候的学校","options":["医","杯子","小时候的学校","一个杯子"],"explanation":"Thông tin đối chiếu trong bài: “爷爷给他们介绍自己小时候的学校，一个女孩儿说她也想去看看。”","evidence":"爷爷给他们介绍自己小时候的学校，一个女孩儿说她也想去看看。"},{"id":"H2-R14-5-v2-Q5","question":"谁跟爷爷下去走走？","answer":"爸爸","options":["泰国人","爷爷","奶奶","爸爸"],"explanation":"Thông tin đối chiếu trong bài: “吃完后，爸爸和爷爷下去走走，妈妈和小孩儿看电视。”","evidence":"吃完后，爸爸和爷爷下去走走，妈妈和小孩儿看电视。"},{"id":"H2-R14-5-v2-Q6","question":"我说什么时候再来？","answer":"下个星期","options":["下个星期","半个小时","一个小时","两点半"],"explanation":"Thông tin đối chiếu trong bài: “晚上回家前，爷爷让我有时间再来，我说下个星期就来，还要请同学一起看他的书。”","evidence":"晚上回家前，爷爷让我有时间再来，我说下个星期就来，还要请同学一起看他的书。"}]},{"id":"H2-R15-1","lesson":15,"revision":2,"title":"Tên và giờ trên vé máy bay","text":"我准备出国学中文，已经在网上买好了机票。今天爸爸让我再看看上面的姓名、时间和机场。我觉得自己写得对，就没有看。他说上次朋友写错了姓名，出去前知道，准备了很多时间也没有去。我打开手机看，知道名字是对的，时间不是我想的早上八点，是晚上八点。我就给来接我的朋友打电话，告诉他别早上去机场。他笑着说，自己也觉得我是早上到的。我给他介绍了新的时间，还说想送他一本中国的书。爸爸让我早一点儿出去，路上要两个小时。我想，买好票不是就没有事情了，出去前要再看看。","translation":"Tôi sắp ra nước ngoài học tiếng Trung, đã mua vé máy bay trên mạng. Bố nhắc xem lại tên, giờ, sân bay. Tôi tưởng đúng nhưng bố kể bạn từng viết sai tên, đến lúc đi mới biết nên không đi được. Kiểm tra thấy tên đúng, giờ lại là tám tối chứ không phải tám sáng như nghĩ. Tôi gọi ngay cho bạn sẽ đón, báo đừng ra sân bay sáng. Bạn cũng tưởng sáng, cười rồi ghi giờ mới. Tôi hứa tặng sách Trung Quốc. Bố nhắc đi sớm vì đường mất hai giờ. Mua xong vé vẫn phải kiểm tra trước khi đi.","pinyin":"wǒ zhǔnbèi chūguó xué Zhōngwén ， yǐjīng zài wǎngshàng mǎi hǎo le jīpiào 。 jīntiān bàba ràng wǒ zài kàn kàn shàngmian de xìngmíng 、 shíjiān hé jīchǎng 。 wǒ juéde zìjǐ xiě de duì ， jiù méiyǒu kàn 。 tā shuō shàng cì péngyou xiě cuò le xìngmíng ， chūqù qián zhīdào ， zhǔnbèi le hěn duō shíjiān yě méiyǒu qù 。 wǒ dǎ kāi shǒujī kàn ， zhīdào míngzi shì duì de ， shíjiān bù shì wǒ xiǎng de zǎoshang bā diǎn ， shì wǎnshang bā diǎn 。 wǒ jiù gěi lái jiē wǒ de péngyou dǎ diànhuà ， gàosu tā bié zǎoshang qù jīchǎng 。 tā xiào zhe shuō ， zìjǐ yě juéde wǒ shì zǎoshang dào de 。 wǒ gěi tā jièshào le xīn de shíjiān ， hái shuō xiǎng sòng tā yī běn Zhōngguó de shū 。 bàba ràng wǒ zǎo yìdiǎnr chūqù ， lùshang yào liǎng gè xiǎoshí 。 wǒ xiǎng ， mǎi hǎo piào bù shì jiù méiyǒu shìqing le ， chūqù qián yào zài kàn kàn 。","grammar":["Vị trí phó từ chỉ tần suất","Vị trí bổ ngữ tần suất với tân ngữ","Câu chữ 有 (Sở hữu và Tồn tại)"],"questions":[{"id":"H2-R15-1-v2-Q1","question":"爸爸让我看机票上的什么？","answer":"姓名和时间","options":["姓名和时间","小时候的学校","中国的书","电话的号"],"explanation":"Thông tin đối chiếu trong bài: “今天爸爸让我再看看上面的姓名、时间和机场。”","evidence":"今天爸爸让我再看看上面的姓名、时间和机场。"},{"id":"H2-R15-1-v2-Q2","question":"名字写对了吗？","answer":"对了","options":["不大","对了","好吃","不贵"],"explanation":"Thông tin đối chiếu trong bài: “我打开手机看，知道名字是对的，时间不是我想的早上八点，是晚上八点。”","evidence":"我打开手机看，知道名字是对的，时间不是我想的早上八点，是晚上八点。"},{"id":"H2-R15-1-v2-Q3","question":"飞机是早上还是晚上八点？","answer":"晚上八点","options":["十点","六点半","晚上八点","七点半"],"explanation":"Thông tin đối chiếu trong bài: “我打开手机看，知道名字是对的，时间不是我想的早上八点，是晚上八点。”","evidence":"我打开手机看，知道名字是对的，时间不是我想的早上八点，是晚上八点。"},{"id":"H2-R15-1-v2-Q4","question":"我给谁打电话？","answer":"来接我的朋友","options":["你们","李文","姐姐","来接我的朋友"],"explanation":"Thông tin đối chiếu trong bài: “我就给来接我的朋友打电话，告诉他别早上去机场。”","evidence":"我就给来接我的朋友打电话，告诉他别早上去机场。"},{"id":"H2-R15-1-v2-Q5","question":"我想送他什么？","answer":"中国的书","options":["中国的书","学校","小的","贵的"],"explanation":"Thông tin đối chiếu trong bài: “我给他介绍了新的时间，还说想送他一本中国的书。”","evidence":"我给他介绍了新的时间，还说想送他一本中国的书。"},{"id":"H2-R15-1-v2-Q6","question":"路上要多少时间？","answer":"两个小时","options":["去年","两个小时","上午","下午"],"explanation":"Thông tin đối chiếu trong bài: “爸爸让我早一点儿出去，路上要两个小时。”","evidence":"爸爸让我早一点儿出去，路上要两个小时。"}]},{"id":"H2-R15-2","lesson":15,"revision":2,"title":"Người bạn thời trung học trở về","text":"我高中的朋友从外国回来了。他已经出国三年，这次回来准备住两个星期。我去机场接他，看见他拿着一个很小的包，问东西都在哪儿。他说这次只想看家人和朋友，不想买太多东西。我们过去经常去学校旁边的饭馆，现在那家饭馆已经没有了。我和他去一家新的，他觉得还是过去的好吃。我笑了，说可能不是饭的问题，是他太想高中时候的事。下午我们回学校，门口有很多学生，有人拿着书，有人看手机，好像过去的我们。朋友说，这次回家想再见一次老师，让我帮忙问问。我就给老师打电话，她让我们星期日来家里。","translation":"Bạn thời trung học từ nước ngoài về sau ba năm, ở hai tuần. Tôi ra sân bay thấy chỉ một túi nhỏ; bạn chỉ muốn gặp người thân, không mua nhiều. Quán từng hay ăn cạnh trường đã đóng nên tôi đưa quán mới, bạn vẫn thích quán cũ. Tôi đùa có lẽ nhớ thời đi học hơn là món ăn. Chiều về trường thấy học sinh cầm sách, xem điện thoại giống chúng tôi xưa. Bạn muốn gặp giáo viên lần nữa, nhờ tôi hỏi. Tôi gọi và cô mời Chủ nhật đến nhà.","pinyin":"wǒ gāozhōng de péngyou cóng wàiguó huí lái le 。 tā yǐjīng chūguó sān nián ， zhè cì huí lái zhǔnbèi zhù liǎng gè xīngqī 。 wǒ qù jīchǎng jiē tā ， kàn jiàn tā ná zhe yí gè hěn xiǎo de bāo ， wèn dōngxi dōu zài nǎr 。 tā shuō zhè cì zhǐ xiǎng kàn jiārén hé péngyou ， bù xiǎng mǎi tài duō dōngxi 。 wǒmen guòqù jīngcháng qù xuéxiào pángbiān de fànguǎn ， xiànzài nà jiā fànguǎn yǐjīng méiyǒu le 。 wǒ hé tā qù yī jiā xīn de ， tā juéde háishi guòqù de hǎochī 。 wǒ xiào le ， shuō kěnéng bù shì fàn de wèntí ， shì tā tài xiǎng gāozhōng shíhou de shì 。 xiàwǔ wǒmen huí xuéxiào ， ménkǒu yǒu hěn duō xuésheng ， yǒurén ná zhe shū ， yǒurén kàn shǒujī ， hǎoxiàng guòqù de wǒmen 。 péngyou shuō ， zhè cì huíjiā xiǎng zài jiàn yī cì lǎoshī ， ràng wǒ bāngmáng wèn wèn 。 wǒ jiù gěi lǎoshī dǎ diànhuà ， tā ràng wǒmen xīngqīrì lái jiālǐ 。","grammar":["Vị trí phó từ chỉ tần suất","Vị trí bổ ngữ tần suất với tân ngữ","Câu chữ 有 (Sở hữu và Tồn tại)"],"questions":[{"id":"H2-R15-2-v2-Q1","question":"朋友出国多少时间了？","answer":"三年","options":["三年","五月三号","八月十号","三点"],"explanation":"Thông tin đối chiếu trong bài: “他已经出国三年，这次回来准备住两个星期。”","evidence":"他已经出国三年，这次回来准备住两个星期。"},{"id":"H2-R15-2-v2-Q2","question":"这次准备住多少时间？","answer":"两个星期","options":["八月十号","两个星期","三点","五点"],"explanation":"Thông tin đối chiếu trong bài: “他已经出国三年，这次回来准备住两个星期。”","evidence":"他已经出国三年，这次回来准备住两个星期。"},{"id":"H2-R15-2-v2-Q3","question":"我在哪儿接朋友？","answer":"机场","options":["这边","饭店","机场","公司"],"explanation":"Thông tin đối chiếu trong bài: “我去机场接他，看见他拿着一个很小的包，问东西都在哪儿。”","evidence":"我去机场接他，看见他拿着一个很小的包，问东西都在哪儿。"},{"id":"H2-R15-2-v2-Q4","question":"过去的饭馆还在吗？","answer":"没有了","options":["不可以","卖","不卖","没有了"],"explanation":"Thông tin đối chiếu trong bài: “我们过去经常去学校旁边的饭馆，现在那家饭馆已经没有了。”","evidence":"我们过去经常去学校旁边的饭馆，现在那家饭馆已经没有了。"},{"id":"H2-R15-2-v2-Q5","question":"下午我们去了哪儿？","answer":"学校","options":["学校","书店里面","地铁站","医院旁边"],"explanation":"Thông tin đối chiếu trong bài: “下午我们回学校，门口有很多学生，有人拿着书，有人看手机，好像过去的我们。”","evidence":"下午我们回学校，门口有很多学生，有人拿着书，有人看手机，好像过去的我们。"},{"id":"H2-R15-2-v2-Q6","question":"老师让我们星期几去？","answer":"星期日","options":["星期六","星期日","星期一","星期二"],"explanation":"Thông tin đối chiếu trong bài: “我就给老师打电话，她让我们星期日来家里。”","evidence":"我就给老师打电话，她让我们星期日来家里。"}]},{"id":"H2-R15-3","lesson":15,"revision":2,"title":"Vé vào cửa và chuyến đi chưa thành","text":"妹妹第一次去北京，准备和同学去学校看老师们跳舞。她觉得有机票就可以进去，我告诉她还要看看有没有门票。她上网找了很多时间，说可以在网上准备票，但要写姓名。爸爸让我帮她看看，别写错。我看了时间，看见她买的门票是星期六，飞机星期日到。妹妹有点儿不好意思，说自己太想出去旅游了。我让她问问学校，能不能星期日再去。学校的老师说星期日也可以，还让她到的时候给他打电话。妹妹准备了一本书，想请老师介绍。出去前，她再看了一次票，说这次不会错了。","translation":"Em gái lần đầu đến Bắc Kinh định đến trường xem thầy cô múa. Em tưởng có vé máy bay là vào được, tôi nhắc xem cần vé vào cửa không. Tìm trên mạng thấy cần tên khi đặt. Bố nhờ tôi kiểm tra: vé vào cửa thứ Bảy nhưng máy bay Chủ nhật mới đến. Em ngại vì quá háo hức du lịch. Tôi bảo hỏi trường đổi sang Chủ nhật được không. Giáo viên đồng ý, còn dặn đến nơi gọi. Em chuẩn bị sách muốn nhờ giới thiệu. Trước khi đi em kiểm tra lại tất cả vé, tin lần này không sai.","pinyin":"mèimei dì yī cì qù Běijīng ， zhǔnbèi hé tóngxué qù xuéxiào kàn lǎoshī men tiàowǔ 。 tā juéde yǒu jīpiào jiù kěyǐ jìnqù ， wǒ gàosu tā hái yào kàn kàn yǒu méiyǒu ménpiào 。 tā shàngwǎng zhǎo le hěn duō shíjiān ， shuō kěyǐ zài wǎngshàng zhǔnbèi piào ， dàn yào xiě xìngmíng 。 bàba ràng wǒ bāng tā kàn kàn ， bié xiě cuò 。 wǒ kàn le shíjiān ， kàn jiàn tā mǎi de ménpiào shì xīngqī liù ， fēijī xīngqīrì dào 。 mèimei yǒudiǎnr bù hǎo yìsi ， shuō zìjǐ tài xiǎng chūqù lǚyóu le 。 wǒ ràng tā wèn wèn xuéxiào ， néng bù néng xīngqīrì zài qù 。 xuéxiào de lǎoshī shuō xīngqīrì yě kěyǐ ， hái ràng tā dào de shíhou gěi tā dǎ diànhuà 。 mèimei zhǔnbèi le yī běn shū ， xiǎng qǐng lǎoshī jièshào 。 chūqù qián ， tā zài kàn le yī cì piào ， shuō zhè cì bù huì cuò le 。","grammar":["Vị trí phó từ chỉ tần suất","Vị trí bổ ngữ tần suất với tân ngữ","Câu chữ 有 (Sở hữu và Tồn tại)"],"questions":[{"id":"H2-R15-3-v2-Q1","question":"妹妹第几次去北京？","answer":"第一次","options":["第一次","四次","五次","两次"],"explanation":"Thông tin đối chiếu trong bài: “妹妹第一次去北京，准备和同学去学校看老师们跳舞。”","evidence":"妹妹第一次去北京，准备和同学去学校看老师们跳舞。"},{"id":"H2-R15-3-v2-Q2","question":"网上准备门票要写什么？","answer":"姓名","options":["笔","姓名","本子","新本子"],"explanation":"Thông tin đối chiếu trong bài: “她上网找了很多时间，说可以在网上准备票，但要写姓名。”","evidence":"她上网找了很多时间，说可以在网上准备票，但要写姓名。"},{"id":"H2-R15-3-v2-Q3","question":"她买的门票是什么时候的？","answer":"星期六","options":["星期四","星期五","星期六","星期日"],"explanation":"Thông tin đối chiếu trong bài: “我看了时间，看见她买的门票是星期六，飞机星期日到。”","evidence":"我看了时间，看见她买的门票是星期六，飞机星期日到。"},{"id":"H2-R15-3-v2-Q4","question":"飞机星期几到？","answer":"星期日","options":["星期四","星期五","星期六","星期日"],"explanation":"Thông tin đối chiếu trong bài: “我看了时间，看见她买的门票是星期六，飞机星期日到。”","evidence":"我看了时间，看见她买的门票是星期六，飞机星期日到。"},{"id":"H2-R15-3-v2-Q5","question":"老师说星期日可以去吗？","answer":"可以","options":["可以","太热了","不冷","卖"],"explanation":"Thông tin đối chiếu trong bài: “学校的老师说星期日也可以，还让她到的时候给他打电话。”","evidence":"学校的老师说星期日也可以，还让她到的时候给他打电话。"},{"id":"H2-R15-3-v2-Q6","question":"妹妹准备了什么？","answer":"一本书","options":["小的","一本书","贵的","坏手表"],"explanation":"Thông tin đối chiếu trong bài: “妹妹准备了一本书，想请老师介绍。”","evidence":"妹妹准备了一本书，想请老师介绍。"}]},{"id":"H2-R15-4","lesson":15,"revision":2,"title":"Con đường cũ sau nhiều năm","text":"去年我回西安，看了小时候上学的路。过去从家到学校要走半个小时，现在旁边有了地铁站，只要十分钟。学校前面的书店还在，但里面的人不认识我。我买了一本书，想给妈妈看。走到过去的家门口，一只小鸟飞过来，站在旁边的桌子上。我看了很多时间，觉得这里好像没有什么不一样，也好像很多事不一样。下午，我给高中同学打电话，他说自己已经来这儿两次，下次可以一起看老师。晚上回家，我给妈妈介绍今天的事，她说这条路不一样了，我也大了，有时间还可以再回去看看。我准备明年再去一次。","translation":"Năm ngoái về Tây An, tôi đi lại đường đến trường thời nhỏ. Xưa đi bộ nửa giờ, nay có ga tàu gần đó, chỉ mười phút. Hiệu sách trước trường còn, nhưng người ở đó không nhận ra tôi. Tôi mua sách cho mẹ. Đến cửa nhà cũ có chim nhỏ bay lại, đậu cạnh bàn. Nhìn lâu thấy nơi này vừa như cũ vừa khác. Chiều gọi bạn trung học, bạn đã về hai lần, rủ lần sau cùng gặp giáo viên. Tối kể mẹ, mẹ bảo đường và con người đều thay đổi, rảnh vẫn có thể về xem. Tôi định năm sau lại về.","pinyin":"qùnián wǒ huí Xī’ān ， kàn le xiǎoshíhou shàngxué de lù 。 guòqù cóng jiā dào xuéxiào yào zǒu bàn ge xiǎoshí ， xiànzài pángbiān yǒu le dìtiězhàn ， zhǐyào shífēn zhōng 。 xuéxiào qiánmiàn de shūdiàn hái zài ， dàn lǐmiàn de rén bù rènshi wǒ 。 wǒ mǎi le yī běn shū ， xiǎng gěi māma kàn 。 zǒu dào guòqù de jiā ménkǒu ， yī zhǐ xiǎo niǎo fēi guòlai ， zhàn zài pángbiān de zhuōzi shàng 。 wǒ kàn le hěn duō shíjiān ， juéde zhèlǐ hǎoxiàng méiyǒu shénme bù yíyàng ， yě hǎoxiàng hěn duō shì bù yíyàng 。 xiàwǔ ， wǒ gěi gāozhōng tóngxué dǎ diànhuà ， tā shuō zìjǐ yǐjīng lái zhèr liǎng cì ， xià cì kěyǐ yìqǐ kàn lǎoshī 。 wǎnshang huíjiā ， wǒ gěi māma jièshào jīntiān de shì ， tā shuō zhè tiáo lù bù yíyàng le ， wǒ yě dà le ， yǒu shíjiān hái kěyǐ zài huí qù kàn kàn 。 wǒ zhǔnbèi míngnián zài qù yī cì 。","grammar":["Vị trí phó từ chỉ tần suất","Vị trí bổ ngữ tần suất với tân ngữ","Câu chữ 有 (Sở hữu và Tồn tại)"],"questions":[{"id":"H2-R15-4-v2-Q1","question":"我去年回了哪儿？","answer":"西安","options":["西安","旁边","门口","教室后面"],"explanation":"Thông tin đối chiếu trong bài: “去年我回西安，看了小时候上学的路。”","evidence":"去年我回西安，看了小时候上学的路。"},{"id":"H2-R15-4-v2-Q2","question":"过去走路上学要多少时间？","answer":"半个小时","options":["下课后","半个小时","下班后","一年"],"explanation":"Thông tin đối chiếu trong bài: “过去从家到学校要走半个小时，现在旁边有了地铁站，只要十分钟。”","evidence":"过去从家到学校要走半个小时，现在旁边有了地铁站，只要十分钟。"},{"id":"H2-R15-4-v2-Q3","question":"现在坐地铁要多少时间？","answer":"十分钟","options":["上午","下午","十分钟","晚上"],"explanation":"Thông tin đối chiếu trong bài: “过去从家到学校要走半个小时，现在旁边有了地铁站，只要十分钟。”","evidence":"过去从家到学校要走半个小时，现在旁边有了地铁站，只要十分钟。"},{"id":"H2-R15-4-v2-Q4","question":"我给谁买书？","answer":"妈妈","options":["我","你","老师","妈妈"],"explanation":"Thông tin đối chiếu trong bài: “我买了一本书，想给妈妈看。”","evidence":"我买了一本书，想给妈妈看。"},{"id":"H2-R15-4-v2-Q5","question":"家门口什么飞过来？","answer":"小鸟","options":["小鸟","杯子","一个杯子","一本书"],"explanation":"Thông tin đối chiếu trong bài: “走到过去的家门口，一只小鸟飞过来，站在旁边的桌子上。”","evidence":"走到过去的家门口，一只小鸟飞过来，站在旁边的桌子上。"},{"id":"H2-R15-4-v2-Q6","question":"我准备什么时候再去？","answer":"明年","options":["三个星期","明年","一个星期","快两年"],"explanation":"Thông tin đối chiếu trong bài: “我准备明年再去一次。”","evidence":"我准备明年再去一次。"}]},{"id":"H2-R15-5","lesson":15,"revision":2,"title":"Lời hẹn không chỉ nói một lần","text":"我在中国学习快两年了，明天要回国。同学们说想请我吃饭，让我介绍回国后准备做什么。我想再学中文，也想教高中学生。老师说可以经常给她打电话，有问题就问。我给同学送了几本书，里面写了大家的姓名和我的手机号。朋友问我还会不会再来，我说已经来过两次，还是想再来第三次。吃完饭，我们从学校走到地铁站，路上没有怎么说话。一个小孩儿看见鸟飞过来，很高兴，我记得自己第一次来的时候也这样，看什么都高兴。回到家，我准备好机票和包，给来送我的朋友打电话，告诉他明天别太早出去。","translation":"Tôi học ở Trung Quốc gần hai năm, ngày mai về nước. Các bạn mời ăn để hỏi kế hoạch. Tôi muốn tiếp tục học tiếng Trung và dạy học sinh trung học. Giáo viên bảo thường xuyên gọi, có câu hỏi cứ hỏi. Tôi tặng sách, bên trong ghi tên các bạn cùng số điện thoại mình. Bạn hỏi có trở lại không, tôi đã đến hai lần mà vẫn muốn lần ba. Sau bữa cả nhóm đi từ trường đến ga, ít nói. Thấy đứa trẻ vui vì chim bay, tôi nhớ ngày đầu mình cũng háo hức như vậy. Về nhà chuẩn bị vé, túi và gọi bạn sẽ tiễn, dặn mai đừng đi quá sớm.","pinyin":"wǒ zài Zhōngguó xuéxí kuài liǎng nián le ， míngtiān yào huíguó 。 tóngxué men shuō xiǎng qǐng wǒ chīfàn ， ràng wǒ jièshào huíguó hòu zhǔnbèi zuò shénme 。 wǒ xiǎng zài xué Zhōngwén ， yě xiǎng jiāo gāozhōng xuésheng 。 lǎoshī shuō kěyǐ jīngcháng gěi tā dǎ diànhuà ， yǒu wèntí jiù wèn 。 wǒ gěi tóngxué sòng le jǐ běn shū ， lǐmiàn xiě le dàjiā de xìngmíng hé wǒ de shǒujī hào 。 péngyou wèn wǒ hái huì bù huì zài lái ， wǒ shuō yǐjīng lái guò liǎng cì ， háishi xiǎng zài lái dì sān cì 。 chī wán fàn ， wǒmen cóng xuéxiào zǒu dào dìtiězhàn ， lùshang méiyǒu zěnme shuōhuà 。 yí gè xiǎoháir kàn jiàn niǎo fēi guòlai ， hěn gāoxìng ， wǒ jìde zìjǐ dì yī cì lái de shíhou yě zhèyàng ， kàn shénme dōu gāoxìng 。 huídào jiā ， wǒ zhǔnbèi hǎo jīpiào hé bāo ， gěi lái sòng wǒ de péngyou dǎ diànhuà ， gàosu tā míngtiān bié tài zǎo chūqù 。","grammar":["Vị trí phó từ chỉ tần suất","Vị trí bổ ngữ tần suất với tân ngữ","Câu chữ 有 (Sở hữu và Tồn tại)"],"questions":[{"id":"H2-R15-5-v2-Q1","question":"我在中国学了多少时间？","answer":"快两年","options":["快两年","半个小时","一个小时","两点半"],"explanation":"Thông tin đối chiếu trong bài: “我在中国学习快两年了，明天要回国。”","evidence":"我在中国学习快两年了，明天要回国。"},{"id":"H2-R15-5-v2-Q2","question":"我什么时候回国？","answer":"明天","options":["一个星期","明天","快两年","五点半"],"explanation":"Thông tin đối chiếu trong bài: “我在中国学习快两年了，明天要回国。”","evidence":"我在中国学习快两年了，明天要回国。"},{"id":"H2-R15-5-v2-Q3","question":"我想教什么学生？","answer":"高中学生","options":["来接我的朋友","小时候的朋友","高中学生","三个同学"],"explanation":"Thông tin đối chiếu trong bài: “我想再学中文，也想教高中学生。”","evidence":"我想再学中文，也想教高中学生。"},{"id":"H2-R15-5-v2-Q4","question":"书里写了什么号？","answer":"手机号","options":["学校","小的","贵的","手机号"],"explanation":"Thông tin đối chiếu trong bài: “我给同学送了几本书，里面写了大家的姓名和我的手机号。”","evidence":"我给同学送了几本书，里面写了大家的姓名和我的手机号。"},{"id":"H2-R15-5-v2-Q5","question":"我已经来过几次？","answer":"两次","options":["两次","四次","五次","第一次"],"explanation":"Thông tin đối chiếu trong bài: “朋友问我还会不会再来，我说已经来过两次，还是想再来第三次。”","evidence":"朋友问我还会不会再来，我说已经来过两次，还是想再来第三次。"},{"id":"H2-R15-5-v2-Q6","question":"吃完饭我们走到哪儿？","answer":"地铁站","options":["教室后面","地铁站","药店","学校的教室"],"explanation":"Thông tin đối chiếu trong bài: “吃完饭，我们从学校走到地铁站，路上没有怎么说话。”","evidence":"吃完饭，我们从学校走到地铁站，路上没有怎么说话。"}]}],"dictionary":[{"hanzi":"不客气","pinyin":"bù kèqi" window.h2GrammarQuestion=function(){const s=quiz;if(s.index>=s.questions.length){const total=s.questions.length;record('Ngữ pháp · '+({choice:'Chọn từ',order:'Sắp xếp',write:'Viết câu'}[s.mode]),s.correct,s.mode==='write'?0:total,{autoGraded:s.mode!=='write',selfAssessed:s.mode==='write',completed:total,selfCorrect:s.selfCount});document.querySelector('#app').innerHTML=back()+`<section class="panel h2-complete"><span class="h2-eyebrow">HOÀN THÀNH NGỮ PHÁP</span><h2>${s.mode==='write'?'Đã tự đối chiếu '+total+' câu':s.correct+'/'+total+' câu đúng'}</h2><p>${s.mode==='write'?s.selfCount+' câu bạn tự đánh dấu đã viết đúng. Hệ thống không chấm ngữ nghĩa tự động.':'Bạn có thể xem lại những câu chưa đúng trước khi làm lượt mới.'}</p><div class="toolbar"><button class="primary" onclick="h2StartGrammar('${s.mode}',${s.point})">Làm lại</button><button onclick="h2ShowMistakes()">Xem lại câu cần ôn</button></div></section>`;return}const q=s.questions[s.index];s.answered=false;s.options=shuffle(q.options);s.chosen=[];
let controls='';if(s.mode==='choice')controls=`<h2 class="h2-chinese h2-question">${h2Tokens(q.question)}</h2><div class="h2-options">${s.options.map((a,i)=>`<button class="h2-answer" onclick="h2AnswerGrammar(${i})">${E(a)}</button>`).join('')}</div>`;
else if(s.mode==='order'){s.tiles=shuffle(Array.from(q.sentence.replace(/[。！？：“”？，、]/g,'')));controls=`<p>${E(q.translation)}</p><div id="h2-selected" class="h2-tile-answer" aria-live="polite"></div><div class="h2-tiles">${s.tiles.map((t,i)=>`<button id="h2-tile-${i}" onclick="h2PickTile(${i})">${E(t)}</button>`).join('')}</div><div class="toolbar"><button onclick="h2ResetTiles()">Xếp lại</button><button class="primary" onclick="h2AnswerGrammar()">Kiểm tra</button></div>`}
else controls=`<h2>${E(q.translation)}</h2><p>Áp dụng: ${E(lesson.structuredGrammar[q.point].name)}</p><textarea id="h2-grammar-input" class="h2-writing" rows="4" lang="zh" placeholder="Viết câu bằng tiếng Trung…"></textarea><button class="primary" onclick="h2AnswerGrammar()">Đối chiếu câu mẫu</button>`;
document.querySelector('#app').innerHTML=back()+`<section class="panel h2-exercise"><div class="row"><span class="pill">NGỮ PHÁP · BÀI ${lesson.id}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div>${bar(s.index,s.questions.length)}<p class="h2-exercise-label">${E(lesson.structuredGrammar[q.point].name)}</p>${controls}<div id="h2-feedback" aria-live="polite"></div></section>`;window.scrollTo(0,0)};
window.h2PickTile=function(i){if(quiz.answered)return;const b=document.querySelector('#h2-tile-'+i);if(b.disabled)return;quiz.chosen.push({i,text:quiz.tiles[i]});b.disabled=true;document.querySelector('#h2-selected').textContent=quiz.chosen.map(x=>x.text).join('')};
window.h2ResetTiles=function(){if(quiz.answered)return;quiz.chosen=[];document.querySelector('#h2-selected').textContent='';document.querySelectorAll('.h2-tiles button').forEach(b=>b.disabled=false)};
const normalized=s=>String(s).replace(/[\s，。！？,.!?、；：:;“”"']/g,'');
window.h2AnswerGrammar=function(i){const s=quiz;if(s.answered)return;const q=s.questions[s.index];let ok=null;if(s.mode==='choice')ok=s.options[i]===q.answer;else if(s.mode==='order'){if(!s.chosen.length)return;ok=normalized(s.chosen.map(x=>x.text).join(''))===normalized(q.sentence)}else if(!document.querySelector('#h2-grammar-input').value.trim()){document.querySelector('#h2-grammar-input').focus();return}s.answered=true;if(ok)s.correct++;if(ok===false){store.wrong[q.id]=(store.wrong[q.id]||0)+1;s.mistakes=s.mistakes||[];s.mistakes.push(q);save()}document.querySelectorAll('.h2-answer,.h2-tiles button').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('is-correct')});
document.querySelector('#h2-feedback').innerHTML=`<div class="h2-feedback ${ok===false?'is-wrong':'is-right'}"><strong>${ok===null?'Đối chiếu với một cách viết mẫu':ok?'✓ Chính xác!':'✗ Chưa đúng theo đáp án mẫu'}</strong><div class="h2-chinese">${h2Tokens(q.sentence)}</div><p class="h2-pin">${E(q.pinyin)}</p><p>${E(q.translation)}</p><div class="h2-feedback-rule"><b>Vì sao?</b> ${E(q.explanation)}</div>${s.mode==='write'?'<p>Câu dịch có thể có nhiều cách diễn đạt đúng. Hãy tự đánh giá sau khi đối chiếu.</p>':''}</div>${s.mode==='write'?`<div class="toolbar"><button class="primary" onclick="h2SelfNext(true)">Tôi đã viết đúng →</button><button onclick="h2SelfNext(false)">Cần ôn thêm →</button></div>`:`<button class="primary" onclick="h2NextGrammar()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`}`};
window.h2NextGrammar=function(){quiz.index++;h2GrammarQuestion()};window.h2SelfNext=function(ok){if(ok)quiz.selfCount++;else{quiz.mistakes=quiz.mistakes||[];quiz.mistakes.push(quiz.questions[quiz.index])}h2NextGrammar()};
window.h2ShowMistakes=function(){const s=quiz;document.querySelector('#app').innerHTML=back()+`<section class="panel"><h2>Câu cần ôn lại</h2>${(s.mistakes||[]).length?(s.mistakes||[]).map(q=>h2ExampleCard(q.sentence,q.pinyin,q.translation)+`<p>${E(q.explanation)}</p>`).join(''):'<p>Bạn không có câu nào cần ôn trong lượt này.</p>'}</section>`};
// Keep old reading answers separate from the newly authored revision.
function readingProgress(p,create=false){const current=store.readingProgress?.[p.id];if(current&&(current.revision||1)===(p.revision||1))return current;if(!create)return null;store.readingProgress=store.readingProgress||{};if(current){store.archivedReadingProgress=store.archivedReadingProgress||[];store.archivedReadingProgress.push({...current,readingId:p.id,archivedAt:Date.now(),replacedByRevision:p.revision||1});}return store.readingProgress[p.id]={revision:p.revision||1,answers:{}};}
window.h2ReadingMenu=function(){session={mode:'h2-reading'};const passages=DATA.readings.filter(p=>p.lesson===lesson.id);document.querySelector('#app').innerHTML=back()+`<section class="reading-picker" style="--reading-accent:var(--accent)"><div class="reading-picker-grid">${passages.map((p,i)=>{const answers=readingProgress(p)?.answers||{};const answered=p.questions.filter(q=>answers[q.id]!==undefined).length;const correct=p.questions.filter(q=>answers[q.id]===true).length;const complete=answered===p.questions.length;return `<article class="reading-choice h2-reading-card" data-reading-card="${E(p.id)}"><span class="reading-eyebrow">BÀI ĐỌC ${i+1}</span><h3>${E(p.title)}</h3><p>${p.questions.length} câu hỏi</p><p class="reading-status ${complete?'reading-completed':''}">${complete?'Đã hoàn thành':answered?'Đang học':'Chưa học'}</p><p class="reading-muted">${answered}/${p.questions.length} câu đã trả lời · ${correct} đúng</p><button type="button" class="reading-primary" onclick="h2StartReading(${i})">${complete?'Đọc và luyện lại':'Bắt đầu đọc'}</button></article>`}).join('')}</div></section>`;window.scrollTo(0,0)};
window.h2StartReading=function(index){const all=DATA.readings.filter(p=>p.lesson===lesson.id);quiz={kind:'reading',passages:index===-1?all:[all[index]],pi:0,qi:0,correct:0,answered:false,showPinyin:false,showTranslation:false,total:index===-1?30:6,answers:[]};session={mode:'h2-reading'};h2RenderReading()};
window.h2RenderReading=function(){const s=quiz;if(s.pi>=s.passages.length){record('Đọc hiểu theo đoạn',s.correct,s.total);document.querySelector('#app').innerHTML=back()+`<section class="panel h2-complete"><span class="h2-eyebrow">HOÀN THÀNH ĐỌC HIỂU</span><h2>${s.correct}/${s.total} câu đúng</h2><p>Đã đọc ${s.passages.length} đoạn và vận dụng các mẫu câu của bài ${lesson.id}.</p><div class="toolbar"><button class="primary" onclick="h2ReadingMenu()">Chọn bài đọc khác</button><button onclick="h2ReviewReading()">Xem đáp án và giải thích</button></div></section>`;return}const p=s.passages[s.pi],q=p.questions[s.qi];s.answered=false;s.options=shuffle(q.options);const done=s.pi*6+s.qi;
document.querySelector('#app').innerHTML=back()+`<div class="toolbar"><button onclick="h2ReadingMenu()">← Danh sách bài đọc</button><span class="pill">Bài ${lesson.id} · Đoạn ${s.pi+1}/${s.passages.length}</span></div><div class="h2-reading-layout"><article class="panel h2-passage"><span class="h2-eyebrow">ĐỌC HIỂU HSK 2</span><h2>${E(p.title)}</h2><p class="h2-lookup-hint">Chạm / bấm vào một từ để tra nghĩa và nghe phát âm.</p><div class="h2-passage-text h2-chinese">${h2Tokens(p.text)}</div><div class="toolbar"><button data-reading-audio data-say="${E(p.text)}">🔊 Nghe cả đoạn</button><button onclick="h2ToggleReading('pinyin',this)">${s.showPinyin?'Ẩn':'Hiện'} pinyin</button><button onclick="h2ToggleReading('translation',this)">${s.showTranslation?'Ẩn':'Hiện'} bản dịch</button></div><p id="h2-reading-pinyin" class="h2-pin" ${s.showPinyin?'':'hidden'}>${E(p.pinyin)}</p><p id="h2-reading-translation" class="h2-reading-translation" ${s.showTranslation?'':'hidden'}>${E(p.translation)}</p><div class="h2-tags">${p.grammar.map(g=>`<span>${E(g)}</span>`).join('')}</div></article><section class="panel h2-reading-question"><div class="row"><span class="pill">CÂU ${done+1}/${s.total}</span><span class="spacer"></span><b>Đúng ${s.correct}</b></div>${bar(done,s.total)}<h3 class="h2-chinese">${h2Tokens(q.question)}</h3><div class="h2-options">${s.options.map((a,i)=>`<button class="h2-answer" onclick="h2AnswerReading(${i})">${E(a)}</button>`).join('')}</div><div id="h2-feedback" aria-live="polite"></div></section></div>`};
window.h2ToggleReading=function(key,button){if(key==='pinyin'){quiz.showPinyin=!quiz.showPinyin;document.querySelector('#h2-reading-pinyin').hidden=!quiz.showPinyin;if(button)button.textContent=(quiz.showPinyin?'Ẩn':'Hiện')+' pinyin'}else{quiz.showTranslation=!quiz.showTranslation;document.querySelector('#h2-reading-translation').hidden=!quiz.showTranslation;if(button)button.textContent=(quiz.showTranslation?'Ẩn':'Hiện')+' bản dịch'}};
window.h2AnswerReading=function(i){const s=quiz;if(s.answered)return;const p=s.passages[s.pi],q=p.questions[s.qi],ans=s.options[i],ok=ans===q.answer;s.answered=true;if(ok)s.correct++;else store.wrong[q.id]=(store.wrong[q.id]||0)+1;s.answers.push({q,ans,ok});const progress=readingProgress(p,true);progress.answers[q.id]=ok;save();document.querySelectorAll('.h2-reading-question .h2-answer').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('is-correct');else if(b.textContent===ans)b.classList.add('is-incorrect')});document.querySelector('#h2-feedback').innerHTML=`<div class="h2-feedback ${ok?'is-right':'is-wrong'}"><strong>${ok?'✓ Chính xác!':'✗ Chưa đúng'}</strong><p>Đáp án: <span class="h2-chinese">${E(q.answer)}</span></p><p>${E(q.explanation)}</p></div><button class="primary" onclick="h2NextReading()">${s.pi*6+s.qi+1===s.total?'Xem kết quả':s.qi===5?'Đọc đoạn tiếp theo →':'Câu tiếp theo →'}</button>`};
window.h2NextReading=function(){quiz.qi++;if(quiz.qi===6){quiz.pi++;quiz.qi=0;quiz.showPinyin=false;quiz.showTranslation=false;window.scrollTo(0,0)}h2RenderReading()};
window.h2ReviewReading=function(){document.querySelector('#app').innerHTML=back()+`<section class="panel"><h2>Đáp án và giải thích</h2>${quiz.answers.map((a,i)=>`<article class="h2-review-answer"><p><b>${i+1}. ${a.ok?'✓':'✗'}</b> <span class="h2-chinese">${h2Tokens(a.q.question)}</span></p><p>Bạn chọn: ${E(a.ans)}</p><p>Đáp án: <span class="h2-chinese">${E(a.q.answer)}</span></p><p>${E(a.q.explanation)}</p></article>`).join('')}</section>`};
// Add lookup to the existing sentence games and word examples, without changing their scoring.
let decorating=false;
function decorate(){if(decorating)return;decorating=true;try{document.querySelectorAll('#app .hanzi:not(button),#topicRoot .topic-hanzi:not(button),#topicRoot .topic-muted,#topicRoot .topic-example-zh').forEach(node=>{if(node.querySelector('button,input,textarea')||node.closest('.qh-card,.qh-top,.flash,.topic-flash')||node.dataset.h2Decorated)return;const text=node.textContent;if(/[\u3400-\u9fff]/.test(text)){node.innerHTML=h2Tokens(text);node.dataset.h2Decorated='1'}})}finally{decorating=false}}
const observer=new MutationObserver(decorate);observer.observe(document.querySelector('#app'),{childList:true,subtree:true});observer.observe(document.querySelector('#topicRoot'),{childList:true,subtree:true});
// Preserve familiar game entry while directing grammar to the authored 30-question bank.
const previousStart=startGame;startGame=function(mode,custom){if(mode==='grammar'){if(custom){const ids=new Set(custom.map(w=>w.id));const selected=L.filter(l=>l.words.some(w=>ids.has(w.id)));if(!selected.length)return;lesson=selected[0];h2StartGrammar('choice');if(selected.length>1){quiz.questions=shuffle(DATA.grammarQuestions.filter(q=>selected.some(l=>l.id===q.lesson))).slice(0,30);quiz.questions=quiz.questions.map(q=>({...q,sourceLesson:q.lesson}));h2GrammarQuestion()}return}h2StartGrammar('choice');return}return previousStart(mode,custom)};
// Keep per-question grammar labels accurate for mixed-Unit review.
const baseGrammarQuestion=h2GrammarQuestion;window.h2GrammarQuestion=function(){if(quiz?.kind==='grammar'&&quiz.questions[quiz.index]?.sourceLesson){lesson=L.find(l=>l.id===quiz.questions[quiz.index].sourceLesson)}baseGrammarQuestion()};
home();
})();
</script><script>(function(){

</script><script>(function(){
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function example(x){return `<div class="h2-ref-example"><div class="h2-chinese">${h2Tokens(x.zh)}</div><div class="h2-ref-pinyin">${e(x.pinyin)}</div><div class="h2-ref-translation">${e(x.vi)}</div><button class="h2-audio" data-say="${e(x.zh)}">🔊 Nghe câu</button></div>`}
renderGrammar=function(){const points=lesson.structuredGrammar||[];document.querySelector('#content').innerHTML=`<div class="h2-section-intro"><div><span class="h2-eyebrow">NGỮ PHÁP · BÀI ${lesson.id}</span><h2>Ngữ pháp và mẫu câu</h2><p>${points.length} điểm ngữ pháp · Công thức · Ví dụ minh họa</p></div><button class="primary" onclick="h2StartGrammar('choice')">Luyện 30 câu →</button></div>${points.map((g,i)=>`<article class="h2-ref-grammar" id="h2-gram-${i}"><h3>${i+1}. ${e(g.name)}</h3><div class="h2-ref-formula"><b>✎ CÔNG THỨC</b><p>${e(g.formula)}</p></div><div class="h2-ref-theory"><p><b class="h2-ref-explain-label">📖 Giải thích:</b> ${e(g.explanation)}</p>${g.tip?`<p><b class="h2-ref-tip-label">💡 Mẹo:</b> ${e(g.tip)}</p>`:''}${g.note?`<p><b class="h2-ref-note-label">⚠ Lưu ý:</b> ${e(g.note)}</p>`:''}${g.clarification?`<p><b class="h2-ref-note-label">⚠ Phân biệt:</b> ${e(g.clarification)}</p>`:''}</div><h4>Ví dụ minh họa</h4><div class="h2-ref-examples">${g.examples.map(example).join('')}</div>${g.newExamples.length?`<h4>Ví dụ vận dụng thêm</h4><div class="h2-ref-examples">${g.newExamples.map(example).join('')}</div>`:''}<button class="primary h2-ref-practice" onclick="h2StartGrammar('choice',${i})">Luyện 10 câu về ngữ pháp này →</button></article>`).join('')}`};

window.topicFlash=function(){const value=formerTopicFlash();const card=document.querySelector('#topicRoot .topic-flash');if(card){card.querySelectorAll('p.topic-muted').forEach(p=>{if(/[\u3400-\u9fff]/.test(p.textContent))p.classList.add('h2-topic-flash-zh')});}return value};
})();
