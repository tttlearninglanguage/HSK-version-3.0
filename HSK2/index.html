"sentence":"小安说：“我没有护照，现在还不能出国。”","pinyin":"xiǎo ān shuō ： “ wǒ méi yǒu hù zhào ， xiàn zài hái bù néng chū guó 。 ”","translation":"小安 nói: “Tôi chưa có hộ chiếu, bây giờ vẫn chưa thể ra nước ngoài.”","explanation":"Phủ định của 有 là 没有, không nói 不有."},{"id":"H2-G15-28","lesson":15,"point":2,"question":"小文说：“我＿＿＿护照，现在还不能出国。”","answer":"没有","options":["没有","不有","不比","不离"],"sentence":"小文说：“我没有护照，现在还不能出国。”","pinyin":"xiǎo wén shuō ： “ wǒ méi yǒu hù zhào ， xiàn zài hái bù néng chū guó 。 ”","translation":"小文 nói: “Tôi chưa có hộ chiếu, bây giờ vẫn chưa thể ra nước ngoài.”","explanation":"Phủ định của 有 là 没有, không nói 不有."},{"id":"H2-G15-29","lesson":15,"point":2,"question":"小东说：“我＿＿＿护照，现在还不能出国。”","answer":"没有","options":["没有","不有","不比","不离"],"sentence":"小东说：“我没有护照，现在还不能出国。”","pinyin":"xiǎo dōng shuō ： “ wǒ méi yǒu hù zhào ， xiàn zài hái bù néng chū guó 。 ”","translation":"小东 nói: “Tôi chưa có hộ chiếu, bây giờ vẫn chưa thể ra nước ngoài.”","explanation":"Phủ định của 有 là 没有, không nói 不有."},{"id":"H2-G15-30","lesson":15,"point":2,"question":"小明说：“我＿＿＿护照，现在还不能出国。”","answer":"没有","options":["没有","不有","不比","不离"],"sentence":"小明说：“我没有护照，现在还不能出国。”","pinyin":"xiǎo míng shuō ： “ wǒ méi yǒu hù zhào ， xiàn zài hái bù néng chū guó 。 ”","translation":"小明 nói: “Tôi chưa có hộ chiếu, bây giờ vẫn chưa thể ra nước ngoài.”","explanation":"Phủ định của 有 là 没有, không nói 不有."}],"readings":[{"id":"H2-R01-1","lesson":1,"revision":2,"title":"Đón mẹ đến Bắc Kinh","text":"妈妈是昨天晚上坐飞机来北京的。我和爸爸去机场接她。妈妈第一次来北京，不知道我们住在哪儿。爸爸让她给我打电话，我说：我们在机场的书店外。妈妈看见我们，很高兴。她给我一本中文书，让我有时间就读。我已经有很多中文书了，这本是妈妈给我的，我很喜欢。今天妈妈想去学校认识我的老师。我上午有课，爸爸就让妈妈下午去。中午我们在家吃饭，妈妈介绍了她在西安的工作。我有时不懂她的意思，就请爸爸帮忙。下午三点，我在学校外接妈妈，和她去看老师。","translation":"Mẹ đến Bắc Kinh bằng máy bay tối qua. Tôi và bố ra sân bay đón. Đây là lần đầu mẹ đến Bắc Kinh nên mẹ không biết chúng tôi ở đâu. Bố bảo mẹ gọi cho tôi; tôi nói chúng tôi ở ngoài hiệu sách trong sân bay. Mẹ gặp chúng tôi rất vui, cho tôi một quyển sách tiếng Trung và bảo tôi đọc. Tôi đã có nhiều sách nhưng vẫn rất thích quyển mẹ cho. Hôm nay mẹ muốn đến trường làm quen với giáo viên. Buổi sáng tôi có lớp nên bố bảo mẹ đi buổi chiều. Ăn trưa ở nhà, mẹ giới thiệu công việc ở Tây An. Có lúc tôi chưa hiểu nên nhờ bố giúp. Ba giờ chiều tôi đón mẹ ngoài trường rồi cùng vào gặp giáo viên.","pinyin":"māma shì zuótiān wǎnshang zuò fēijī lái Běijīng de 。 wǒ hé bàba qù jīchǎng jiē tā 。 māma dì yī cì lái Běijīng ， bù zhīdào wǒmen zhù zài nǎr 。 bàba ràng tā gěi wǒ dǎ diànhuà ， wǒ shuō ： wǒmen zài jīchǎng de shūdiàn wài 。 māma kàn jiàn wǒmen ， hěn gāoxìng 。 tā gěi wǒ yī běn Zhōngwén shū ， ràng wǒ yǒu shíjiān jiù dú 。 wǒ yǐjīng yǒu hěn duō Zhōngwén shū le ， zhè běn shì māma gěi wǒ de ， wǒ hěn xǐhuan 。 jīntiān māma xiǎng qù xuéxiào rènshi wǒ de lǎoshī 。 wǒ shàngwǔ yǒu kè ， bàba jiù ràng māma xiàwǔ qù 。 zhōngwǔ wǒmen zàijiā chīfàn ， māma jièshào le tā zài Xī’ān de gōngzuò 。 wǒ yǒushí bù dǒng tā de yìsi ， jiù qǐng bàba bāngmáng 。 xiàwǔ sān diǎn ， wǒ zài xuéxiào wài jiē māma ， hé tā qù kàn lǎoshī 。","grammar":["Trợ từ ngữ khí 吧","Nhấn mạnh thông tin đã xảy ra","Câu kiêm ngữ"],"questions":[{"id":"H2-R01-1-v2-Q1","question":"妈妈是怎么来北京的？","answer":"坐飞机","options":["开车","坐火车","坐飞机","坐出租车"],"explanation":"Thông tin đối chiếu trong bài: “妈妈是昨天晚上坐飞机来北京的。”","evidence":"妈妈是昨天晚上坐飞机来北京的。"},{"id":"H2-R01-1-v2-Q2","question":"谁和我去机场？","answer":"爸爸","options":["医生","售货员","服务员","爸爸"],"explanation":"Thông tin đối chiếu trong bài: “我和爸爸去机场接她。”","evidence":"我和爸爸去机场接她。"},{"id":"H2-R01-1-v2-Q3","question":"我们在机场的哪儿？","answer":"书店外","options":["书店外","桌子下","桌子前","前"],"explanation":"Thông tin đối chiếu trong bài: “爸爸让她给我打电话，我说：我们在机场的书店外。”","evidence":"爸爸让她给我打电话，我说：我们在机场的书店外。"},{"id":"H2-R01-1-v2-Q4","question":"妈妈给我什么？","answer":"一本中文书","options":["贵的","一本中文书","车","小时候的学校"],"explanation":"Thông tin đối chiếu trong bài: “她给我一本中文书，让我有时间就读。”","evidence":"她给我一本中文书，让我有时间就读。"},{"id":"H2-R01-1-v2-Q5","question":"我有时不懂，就请谁帮忙？","answer":"爸爸","options":["家人","中国人","爸爸","法国人"],"explanation":"Thông tin đối chiếu trong bài: “我有时不懂她的意思，就请爸爸帮忙。”","evidence":"我有时不懂她的意思，就请爸爸帮忙。"},{"id":"H2-R01-1-v2-Q6","question":"我下午几点接妈妈？","answer":"三点","options":["七点半","八点半","六点十分","三点"],"explanation":"Thông tin đối chiếu trong bài: “下午三点，我在学校外接妈妈，和她去看老师。”","evidence":"下午三点，我在学校外接妈妈，和她去看老师。"}]},{"id":"H2-R01-2","lesson":1,"revision":2,"title":"Giải thích một tin nhắn","text":"今天早上，老师给我打电话，让我下午去学校帮忙。我有些不懂：今天不是星期日吗，怎么还要上课？老师说，今天没有课，有三个中国学生来学校旅游，想认识我们的同学。我知道了，就给朋友打电话，请他也来。他已经回家了，下午不能来。我中午吃了饭，下午两点到学校。老师介绍了中国学生。他们会说中文。我的中文不太好，有时不知道他们的意思。我请他们再说一次。他们说好，让我有问题就问。我们就看书、写字，还看了一个中文电影。","translation":"Sáng nay giáo viên gọi điện nhờ tôi đến trường giúp buổi chiều. Tôi chưa hiểu vì hôm nay là Chủ nhật, sao vẫn phải học. Thầy cô giải thích hôm nay không có lớp mà có ba học sinh Trung Quốc đến tham quan trường, muốn làm quen với các bạn. Tôi gọi rủ bạn nhưng bạn đã về nhà, chiều không đến được. Ăn trưa xong, hai giờ tôi đến trường. Giáo viên giới thiệu các học sinh Trung Quốc. Tiếng Trung của tôi chưa tốt, đôi lúc chưa hiểu họ nói gì nên xin họ nói lại một lần. Chúng tôi đọc sách, viết chữ và xem một bộ phim tiếng Trung.","pinyin":"jīntiān zǎoshang ， lǎoshī gěi wǒ dǎ diànhuà ， ràng wǒ xiàwǔ qù xuéxiào bāngmáng 。 wǒ yǒuxiē bù dǒng ： jīntiān bù shì xīngqīrì ma ， zěnme hái yào shàngkè ？ lǎoshī shuō ， jīntiān méiyǒu kè ， yǒu sān gè Zhōngguó xuésheng lái xuéxiào lǚyóu ， xiǎng rènshi wǒmen de tóngxué 。 wǒ zhīdào le ， jiù gěi péngyou dǎ diànhuà ， qǐng tā yě lái 。 tā yǐjīng huíjiā le ， xiàwǔ bù néng lái 。 wǒ zhōngwǔ chī le fàn ， xiàwǔ liǎng diǎn dào xuéxiào 。 lǎoshī jièshào le Zhōngguó xuésheng 。 tāmen huì shuō Zhōngwén 。 wǒ de Zhōngwén bù tài hǎo ， yǒushí bù zhīdào tāmen de yìsi 。 wǒ qǐng tāmen zài shuō yī cì 。 tāmen shuō hǎo ， ràng wǒ yǒu wèntí jiù wèn 。 wǒmen jiù kàn shū 、 xiě zì ， hái kàn le yí gè Zhōngwén diànyǐng 。","grammar":["Trợ từ ngữ khí 吧","Nhấn mạnh thông tin đã xảy ra","Câu kiêm ngữ"],"questions":[{"id":"H2-R01-2-v2-Q1","question":"老师让我什么时候去学校？","answer":"下午","options":["半个小时","一个小时","下午","两点半"],"explanation":"Thông tin đối chiếu trong bài: “今天早上，老师给我打电话，让我下午去学校帮忙。”","evidence":"今天早上，老师给我打电话，让我下午去学校帮忙。"},{"id":"H2-R01-2-v2-Q2","question":"今天有课吗？","answer":"没有","options":["会","不会","想","没有"],"explanation":"Thông tin đối chiếu trong bài: “老师说，今天没有课，有三个中国学生来学校旅游，想认识我们的同学。”","evidence":"老师说，今天没有课，有三个中国学生来学校旅游，想认识我们的同学。"},{"id":"H2-R01-2-v2-Q3","question":"谁来学校旅游？","answer":"中国学生","options":["中国学生","售货员","服务员","家人"],"explanation":"Thông tin đối chiếu trong bài: “老师说，今天没有课，有三个中国学生来学校旅游，想认识我们的同学。”","evidence":"老师说，今天没有课，有三个中国学生来学校旅游，想认识我们的同学。"},{"id":"H2-R01-2-v2-Q4","question":"朋友下午能来吗？","answer":"不能","options":["太热了","不能","不冷","可以"],"explanation":"Thông tin đối chiếu trong bài: “他已经回家了，下午不能来。”","evidence":"他已经回家了，下午不能来。"},{"id":"H2-R01-2-v2-Q5","question":"我几点到学校？","answer":"两点","options":["十一点半","八点二十分","两点","九点二十分"],"explanation":"Thông tin đối chiếu trong bài: “我中午吃了饭，下午两点到学校。”","evidence":"我中午吃了饭，下午两点到学校。"},{"id":"H2-R01-2-v2-Q6","question":"我们看了什么电影？","answer":"中文电影","options":["中国的书","电话的号","菜","中文电影"],"explanation":"Thông tin đối chiếu trong bài: “我们就看书、写字，还看了一个中文电影。”","evidence":"我们就看书、写字，还看了一个中文电影。"}]},{"id":"H2-R01-3","lesson":1,"revision":2,"title":"Giúp bố tìm điện thoại","text":"爸爸今天要去医院看朋友。他已经穿好衣服了，手机不在桌子上。他让妈妈帮忙找，妈妈正在做午饭，就让我去看一下。我在爸爸的房间里没有看见手机，在我的房间里也没有看见。爸爸有时在家看电视，我就去看电视的房间找。手机在一个杯子下，不是爸爸的杯子，是我的。我给爸爸手机，爸爸说：谢谢你，我下午接你下课吧。我说今天学校没有课，我想和他去看朋友。妈妈让我们吃了饭再去，给朋友买一些水果。我们下午一点半去医院。","translation":"Hôm nay bố muốn đến bệnh viện thăm bạn. Bố mặc quần áo rồi nhưng điện thoại không ở trên bàn. Bố nhờ mẹ tìm; mẹ đang nấu trưa nên bảo tôi tìm giúp. Tôi không thấy điện thoại trong phòng bố hay phòng mình. Bố có lúc xem tivi nên tôi đến phòng có tivi tìm. Điện thoại ở dưới một chiếc cốc của tôi, không phải cốc của bố. Tôi đưa điện thoại cho bố, bố cảm ơn và hẹn chiều đón tôi tan học. Tôi nói hôm nay không có lớp, muốn cùng bố thăm bạn. Mẹ bảo ăn xong rồi đi và mua ít trái cây cho bạn. Một giờ rưỡi chiều chúng tôi đến bệnh viện.","pinyin":"bàba jīntiān yào qù yīyuàn kàn péngyou 。 tā yǐjīng chuān hǎo yīfu le ， shǒujī bù zài zhuōzi shàng 。 tā ràng māma bāngmáng zhǎo ， māma zhèngzài zuò wǔfàn ， jiù ràng wǒ qù kàn yíxià 。 wǒ zài bàba de fángjiān lǐ méiyǒu kàn jiàn shǒujī ， zài wǒ de fángjiān lǐ yě méiyǒu kàn jiàn 。 bàba yǒushí zàijiā kàn diànshì ， wǒ jiù qù kàn diànshì de fángjiān zhǎo 。 shǒujī zài yí gè bēizi xià ， bù shì bàba de bēizi ， shì wǒ de 。 wǒ gěi bàba shǒujī ， bàba shuō ： xièxie nǐ ， wǒ xiàwǔ jiē nǐ xià kè ba 。 wǒ shuō jīntiān xuéxiào méiyǒu kè ， wǒ xiǎng hé tā qù kàn péngyou 。 māma ràng wǒmen chī le fàn zài qù ， gěi péngyou mǎi yìxiē shuǐguǒ 。 wǒmen xiàwǔ yī diǎn bàn qù yīyuàn 。","grammar":["Trợ từ ngữ khí 吧","Nhấn mạnh thông tin đã xảy ra","Câu kiêm ngữ"],"questions":[{"id":"H2-R01-3-v2-Q1","question":"爸爸要去哪儿？","answer":"医院","options":["前","后","医院","大房间"],"explanation":"Thông tin đối chiếu trong bài: “爸爸今天要去医院看朋友。”","evidence":"爸爸今天要去医院看朋友。"},{"id":"H2-R01-3-v2-Q2","question":"谁让我找手机？","answer":"妈妈","options":["中国人","法国人","泰国人","妈妈"],"explanation":"Thông tin đối chiếu trong bài: “他让妈妈帮忙找，妈妈正在做午饭，就让我去看一下。”","evidence":"他让妈妈帮忙找，妈妈正在做午饭，就让我去看一下。"},{"id":"H2-R01-3-v2-Q3","question":"手机在哪儿？","answer":"杯子下","options":["杯子下","大房间","小房间","桌子上"],"explanation":"Thông tin đối chiếu trong bài: “手机在一个杯子下，不是爸爸的杯子，是我的。”","evidence":"手机在一个杯子下，不是爸爸的杯子，是我的。"},{"id":"H2-R01-3-v2-Q4","question":"那个杯子是谁的？","answer":"我","options":["家人","我","中国人","法国人"],"explanation":"Thông tin đối chiếu trong bài: “手机在一个杯子下，不是爸爸的杯子，是我的。”","evidence":"手机在一个杯子下，不是爸爸的杯子，是我的。"},{"id":"H2-R01-3-v2-Q5","question":"妈妈让我们买什么？","answer":"水果","options":["米饭和菜","苹果","水果","热水"],"explanation":"Thông tin đối chiếu trong bài: “妈妈让我们吃了饭再去，给朋友买一些水果。”","evidence":"妈妈让我们吃了饭再去，给朋友买一些水果。"},{"id":"H2-R01-3-v2-Q6","question":"我们几点去医院？","answer":"一点半","options":["三点","五点","六点","一点半"],"explanation":"Thông tin đối chiếu trong bài: “我们下午一点半去医院。”","evidence":"我们下午一点半去医院。"}]},{"id":"H2-R01-4","lesson":1,"revision":2,"title":"Bạn của chị gái đến chơi","text":"姐姐的朋友今天来我家。她是法国人，已经在中国住了一年。我不认识她，姐姐就给我们介绍。我问她喜欢北京吗，她说很喜欢，还想去西安旅游。我给她看我的中文书，她有些字不懂，就请我帮忙。我知道这些字的意思，很高兴。下午姐姐去医院工作，让我和朋友在家看电影。朋友不想看电影，想看一下我的学校。我今天休息，可以和她去。学校有一个书店，她给姐姐买了一本书，让我晚上给姐姐。我们五点回家，妈妈做了面条儿。朋友喜欢吃面条儿，还想和妈妈学做饭。","translation":"Hôm nay bạn của chị gái đến nhà. Chị ấy là người Pháp, đã sống ở Trung Quốc một năm. Tôi chưa quen nên chị gái giới thiệu. Bạn thích Bắc Kinh và còn muốn du lịch Tây An. Tôi cho chị ấy xem sách tiếng Trung; có chữ chị chưa hiểu nên nhờ tôi giúp. Tôi hiểu những chữ này nên rất vui. Chiều chị gái đi làm ở bệnh viện, nhờ tôi ở nhà xem phim cùng bạn. Bạn muốn xem trường của tôi hơn. Hôm nay tôi nghỉ nên đưa bạn đến trường. Ở hiệu sách trong trường, bạn mua một quyển cho chị gái và nhờ tôi đưa lại buổi tối. Năm giờ chúng tôi về nhà ăn mì mẹ nấu. Bạn còn muốn học mẹ nấu ăn.","pinyin":"jiějie de péngyou jīntiān lái wǒ jiā 。 tā shì Fǎguó rén ， yǐjīng zài Zhōngguó zhù le yī nián 。 wǒ bù rènshi tā ， jiějie jiù gěi wǒmen jièshào 。 wǒ wèn tā xǐhuan Běijīng ma ， tā shuō hěn xǐhuan ， hái xiǎng qù Xī’ān lǚyóu 。 wǒ gěi tā kàn wǒ de Zhōngwén shū ， tā yǒuxiē zì bù dǒng ， jiù qǐng wǒ bāngmáng 。 wǒ zhīdào zhèxiē zì de yìsi ， hěn gāoxìng 。 xiàwǔ jiějie qù yīyuàn gōngzuò ， ràng wǒ hé péngyou zàijiā kàn diànyǐng 。 péngyou bù xiǎng kàn diànyǐng ， xiǎng kàn yíxià wǒ de xuéxiào 。 wǒ jīntiān xiūxi ， kěyǐ hé tā qù 。 xuéxiào yǒu yí gè shūdiàn ， tā gěi jiějie mǎi le yī běn shū ， ràng wǒ wǎnshang gěi jiějie 。 wǒmen wǔ diǎn huíjiā ， māma zuò le miàntiáor 。 péngyou xǐhuan chī miàntiáor ， hái xiǎng hé māma xué zuòfàn 。","grammar":["Trợ từ ngữ khí 吧","Nhấn mạnh thông tin đã xảy ra","Câu kiêm ngữ"],"questions":[{"id":"H2-R01-4-v2-Q1","question":"姐姐的朋友是哪国人？","answer":"法国人","options":["大家","你们","法国人","李文"],"explanation":"Thông tin đối chiếu trong bài: “她是法国人，已经在中国住了一年。”","evidence":"她是法国人，已经在中国住了一年。"},{"id":"H2-R01-4-v2-Q2","question":"她已经在中国住了几年？","answer":"一年","options":["去年","上午","下午","一年"],"explanation":"Thông tin đối chiếu trong bài: “她是法国人，已经在中国住了一年。”","evidence":"她是法国人，已经在中国住了一年。"},{"id":"H2-R01-4-v2-Q3","question":"她不懂一些字，请谁帮忙？","answer":"我","options":["我","中国学生","外国学生","朋友的妈妈"],"explanation":"Thông tin đối chiếu trong bài: “我给她看我的中文书，她有些字不懂，就请我帮忙。”","evidence":"我给她看我的中文书，她有些字不懂，就请我帮忙。"},{"id":"H2-R01-4-v2-Q4","question":"姐姐下午在哪儿工作？","answer":"医院","options":["房间外边","医院","前边","这边"],"explanation":"Thông tin đối chiếu trong bài: “下午姐姐去医院工作，让我和朋友在家看电影。”","evidence":"下午姐姐去医院工作，让我和朋友在家看电影。"},{"id":"H2-R01-4-v2-Q5","question":"朋友给谁买书？","answer":"姐姐","options":["外国学生","朋友的妈妈","姐姐","来接我的朋友"],"explanation":"Thông tin đối chiếu trong bài: “学校有一个书店，她给姐姐买了一本书，让我晚上给姐姐。”","evidence":"学校有一个书店，她给姐姐买了一本书，让我晚上给姐姐。"},{"id":"H2-R01-4-v2-Q6","question":"我们几点回家？","answer":"五点","options":["九点","十点","六点半","五点"],"explanation":"Thông tin đối chiếu trong bài: “我们五点回家，妈妈做了面条儿。”","evidence":"我们五点回家，妈妈做了面条儿。"}]},{"id":"H2-R01-5","lesson":1,"revision":2,"title":"Sắp xếp buổi gặp giáo viên","text":"我想请中文老师来家里吃饭。爸爸妈妈已经认识老师了，我妹妹还不认识。妈妈让我给老师打电话，问她星期六有没有时间。老师星期六上午要上课，下午可以来。爸爸说，他三点去学校接老师。我说，老师想坐出租车来，让我们不要去接。妈妈想做饺子，我想给老师看我写的汉字。有些字我还不懂意思，想请老师介绍一下。妹妹很高兴，她会唱中文歌，要唱给老师听。星期六下午，老师两点半就来了。我们正在看书，她让我们读给她听。这次我们没有去饭店，在家吃了晚饭。","translation":"Tôi muốn mời giáo viên tiếng Trung đến nhà ăn cơm. Bố mẹ đã quen thầy cô, em gái thì chưa. Mẹ bảo tôi gọi hỏi thứ Bảy có rảnh không. Giáo viên có lớp sáng, chiều đến được. Bố định ba giờ ra trường đón nhưng giáo viên muốn đi taxi đến. Mẹ nấu sủi cảo. Tôi muốn cho giáo viên xem chữ Hán mình viết và hỏi nghĩa một số chữ. Em gái rất vui, muốn hát bài tiếng Trung cho giáo viên nghe. Hai giờ rưỡi chiều thứ Bảy giáo viên đã đến. Khi chúng tôi đang đọc sách, cô bảo đọc cho cô nghe. Lần này cả nhà ăn tối ở nhà thay vì ra quán.","pinyin":"wǒ xiǎng qǐng Zhōngwén lǎoshī lái jiālǐ chīfàn 。 bàba māma yǐjīng rènshi lǎoshī le ， wǒ mèimei hái bù rènshi 。 māma ràng wǒ gěi lǎoshī dǎ diànhuà ， wèn tā xīngqī liù yǒu méiyǒu shíjiān 。 lǎoshī xīngqī liù shàngwǔ yào shàngkè ， xiàwǔ kěyǐ lái 。 bàba shuō ， tā sān diǎn qù xuéxiào jiē lǎoshī 。 wǒ shuō ， lǎoshī xiǎng zuò chūzūchē lái ， ràng wǒmen bú yào qù jiē 。 māma xiǎng zuò jiǎozi ， wǒ xiǎng gěi lǎoshī kàn wǒ xiě de Hànzì 。 yǒuxiē zì wǒ hái bù dǒng yìsi ， xiǎng qǐng lǎoshī jièshào yíxià 。 mèimei hěn gāoxìng ， tā huì chàng Zhōngwén gē ， yào chàng gěi lǎoshī tīng 。 xīngqī liù xiàwǔ ， lǎoshī liǎng diǎn bàn jiù lái le 。 wǒmen zhèngzài kàn shū ， tā ràng wǒmen dú gěi tā tīng 。 zhè cì wǒmen méiyǒu qù fàndiàn ， zàijiā chī le wǎnfàn 。","grammar":["Trợ từ ngữ khí 吧","Nhấn mạnh thông tin đã xảy ra","Câu kiêm ngữ"],"questions":[{"id":"H2-R01-5-v2-Q1","question":"谁还不认识老师？","answer":"妹妹","options":["家人","中国人","妹妹","法国人"],"explanation":"Thông tin đối chiếu trong bài: “爸爸妈妈已经认识老师了，我妹妹还不认识。”","evidence":"爸爸妈妈已经认识老师了，我妹妹还不认识。"},{"id":"H2-R01-5-v2-Q2","question":"老师星期六上午做什么？","answer":"上课","options":["睡觉","起床","喝水","上课"],"explanation":"Thông tin đối chiếu trong bài: “老师星期六上午要上课，下午可以来。”","evidence":"老师星期六上午要上课，下午可以来。"},{"id":"H2-R01-5-v2-Q3","question":"老师想怎么来？","answer":"坐出租车","options":["坐出租车","坐飞机","坐火车","开车"],"explanation":"Thông tin đối chiếu trong bài: “我说，老师想坐出租车来，让我们不要去接。”","evidence":"我说，老师想坐出租车来，让我们不要去接。"},{"id":"H2-R01-5-v2-Q4","question":"妈妈想做什么？","answer":"饺子","options":["面条儿","饺子","一些菜","牛奶"],"explanation":"Thông tin đối chiếu trong bài: “妈妈想做饺子，我想给老师看我写的汉字。”","evidence":"妈妈想做饺子，我想给老师看我写的汉字。"},{"id":"H2-R01-5-v2-Q5","question":"老师几点来了？","answer":"两点半","options":["六点十分","下午五点","两点半","下午两点"],"explanation":"Thông tin đối chiếu trong bài: “星期六下午，老师两点半就来了。”","evidence":"星期六下午，老师两点半就来了。"},{"id":"H2-R01-5-v2-Q6","question":"这次我们在哪儿吃晚饭？","answer":"家","options":["桌子上","房间外边","前边","家"],"explanation":"Thông tin đối chiếu trong bài: “这次我们没有去饭店，在家吃了晚饭。”","evidence":"这次我们没有去饭店，在家吃了晚饭。"}]},{"id":"H2-R02-1","lesson":2,"revision":2,"title":"Chọn xe buýt hay taxi","text":"我家在学校前边，不远，但今天早上已经八点了，八点半有中文课。我想打车去，妈妈说车站就在超市前，坐公交车也可以。我去车站看了一下，那里有二十多个学生，都想坐车去学校。朋友也在那里，他第一次去我们的学校，不知道哪间教室上课。我让他和我去。车来了，我们坐公交车到学校，没有打车。我们八点二十分到学校，教室里已经有老师和十多名学生了。朋友没有中文书，我给他看我的书。老师介绍了今天的课，让我们下课后去书店买书。","translation":"Nhà tôi không xa trường nhưng sáng nay đã tám giờ, tám giờ rưỡi có lớp tiếng Trung. Tôi muốn đi taxi. Mẹ bảo trạm xe ở trước siêu thị, có thể đi xe buýt. Ở trạm có hơn hai mươi học sinh, trong đó có bạn tôi lần đầu đến trường này và chưa biết phòng học. Tôi rủ bạn đi cùng. Xe đến, chúng tôi đi xe buýt chứ không gọi taxi. Tám giờ hai mươi đến trường, trong lớp đã có giáo viên và hơn mười học sinh. Bạn không mang sách nên xem cùng tôi. Giáo viên giới thiệu bài học và bảo sau buổi học đến hiệu sách mua sách.","pinyin":"wǒ jiā zài xuéxiào qiánbian ， bù yuǎn ， dàn jīntiān zǎoshang yǐjīng bā diǎn le ， bā diǎn bàn yǒu Zhōngwén kè 。 wǒ xiǎng dǎchē qù ， māma shuō chēzhàn jiù zài chāoshì qián ， zuò gōngjiāochē yě kěyǐ 。 wǒ qù chēzhàn kàn le yíxià ， nàli yǒu èr shí duō gè xuésheng ， dōu xiǎng zuò chē qù xuéxiào 。 péngyou yě zài nàli ， tā dì yī cì qù wǒmen de xuéxiào ， bù zhīdào nǎ jiān jiàoshì shàngkè 。 wǒ ràng tā hé wǒ qù 。 chē lái le ， wǒmen zuò gōngjiāochē dào xuéxiào ， méiyǒu dǎchē 。 wǒmen bā diǎn èr shífēn dào xuéxiào ， jiàoshì lǐ yǐjīng yǒu lǎoshī hé shí duō míng xuésheng le 。 péngyou méiyǒu Zhōngwén shū ， wǒ gěi tā kàn wǒ de shū 。 lǎoshī jièshào le jīntiān de kè ， ràng wǒmen xià kè hòu qù shūdiàn mǎi shū 。","grammar":["Cấu trúc đưa ra đề nghị: Hay là... đi","Cách dùng 多 biểu thị số ước lượng","Động từ/cụm động từ làm định ngữ"],"questions":[{"id":"H2-R02-1-v2-Q1","question":"中文课几点上课？","answer":"八点半","options":["三点五十分","五点半","三点","八点半"],"explanation":"Thông tin đối chiếu trong bài: “我家在学校前边，不远，但今天早上已经八点了，八点半有中文课。”","evidence":"我家在学校前边，不远，但今天早上已经八点了，八点半有中文课。"},{"id":"H2-R02-1-v2-Q2","question":"车站在哪儿？","answer":"超市前","options":["超市前","药店","学校的教室","中国"],"explanation":"Thông tin đối chiếu trong bài: “我想打车去，妈妈说车站就在超市前，坐公交车也可以。”","evidence":"我想打车去，妈妈说车站就在超市前，坐公交车也可以。"},{"id":"H2-R02-1-v2-Q3","question":"车站有多少学生？","answer":"二十多个","options":["四个","二十多个","五个","六个"],"explanation":"Thông tin đối chiếu trong bài: “我去车站看了一下，那里有二十多个学生，都想坐车去学校。”","evidence":"我去车站看了一下，那里有二十多个学生，都想坐车去学校。"},{"id":"H2-R02-1-v2-Q4","question":"我们怎么去学校？","answer":"坐公交车","options":["坐出租车","开车","坐公交车","坐飞机"],"explanation":"Thông tin đối chiếu trong bài: “车来了，我们坐公交车到学校，没有打车。”","evidence":"车来了，我们坐公交车到学校，没有打车。"},{"id":"H2-R02-1-v2-Q5","question":"我们几点到学校？","answer":"八点二十分","options":["七点半","八点半","六点十分","八点二十分"],"explanation":"Thông tin đối chiếu trong bài: “我们八点二十分到学校，教室里已经有老师和十多名学生了。”","evidence":"我们八点二十分到学校，教室里已经有老师和十多名学生了。"},{"id":"H2-R02-1-v2-Q6","question":"朋友看谁的书？","answer":"我","options":["我","中国人","法国人","泰国人"],"explanation":"Thông tin đối chiếu trong bài: “朋友没有中文书，我给他看我的书。”","evidence":"朋友没有中文书，我给他看我的书。"}]},{"id":"H2-R02-2","lesson":2,"revision":2,"title":"Tìm đúng phòng học","text":"今天我第一次来这个学校学中文。学校有很多教室，我不知道老师在哪一间。学校外有两名外国学生，我想问他们，但他们也第一次来。我给老师打电话，老师让我去学校里的书店。她已经在那里了，要给新同学介绍课本。我在书店看见三十多名学生，有的人看书，有的人正在问老师问题。我找到老师，她和我们去前边那间大教室。外国学生坐在我前边。老师说下午没有课，我们可以去看一下学校。下课后，我没有回家，和新同学在学校吃了午饭，还去看了医院前的书店。","translation":"Hôm nay lần đầu tôi đến trường này học tiếng Trung. Có nhiều phòng nên tôi không biết giáo viên ở phòng nào. Hai học sinh nước ngoài cũng đến lần đầu nên không biết. Tôi gọi giáo viên; cô bảo đến hiệu sách trong trường, nơi cô đang giới thiệu sách cho các bạn mới. Tôi thấy hơn ba mươi học sinh ở đó, có người cầm sách, có người hỏi giáo viên. Cô đưa chúng tôi đến phòng lớn phía trước. Hai bạn nước ngoài ngồi trước tôi. Chiều không có lớp nên sau giờ học, tôi ở lại ăn trưa cùng bạn mới rồi đến hiệu sách trước bệnh viện.","pinyin":"jīntiān wǒ dì yī cì lái zhège xuéxiào xué Zhōngwén 。 xuéxiào yǒu hěn duō jiàoshì ， wǒ bù zhīdào lǎoshī zài nǎ yī jiān 。 xuéxiào wài yǒu liǎng míng wàiguó xuésheng ， wǒ xiǎng wèn tāmen ， dàn tāmen yě dì yī cì lái 。 wǒ gěi lǎoshī dǎ diànhuà ， lǎoshī ràng wǒ qù xuéxiào lǐ de shūdiàn 。 tā yǐjīng zài nàli le ， yào gěi xīn tóngxué jièshào kèběn 。 wǒ zài shūdiàn kàn jiàn sān shí duō míng xuésheng ， yǒude rén kàn shū ， yǒude rén zhèngzài wèn lǎoshī wèntí 。 wǒ zhǎodào lǎoshī ， tā hé wǒmen qù qiánbian nà jiān dà jiàoshì 。 wàiguó xuésheng zuò zài wǒ qiánbian 。 lǎoshī shuō xiàwǔ méiyǒu kè ， wǒmen kěyǐ qù kàn yíxià xuéxiào 。 xià kè hòu ， wǒ méiyǒu huíjiā ， hé xīn tóngxué zài xuéxiào chī le wǔfàn ， hái qù kàn le yīyuàn qián de shūdiàn 。","grammar":["Cấu trúc đưa ra đề nghị: Hay là... đi","Cách dùng 多 biểu thị số ước lượng","Động từ/cụm động từ làm định ngữ"],"questions":[{"id":"H2-R02-2-v2-Q1","question":"我今天来学校学什么？","answer":"中文","options":["手机","大杯子","书里的问题","中文"],"explanation":"Thông tin đối chiếu trong bài: “今天我第一次来这个学校学中文。”","evidence":"今天我第一次来这个学校学中文。"},{"id":"H2-R02-2-v2-Q2","question":"学校外有几名外国学生？","answer":"两名","options":["两名","四名","五名","十多名"],"explanation":"Thông tin đối chiếu trong bài: “学校外有两名外国学生，我想问他们，但他们也第一次来。”","evidence":"学校外有两名外国学生，我想问他们，但他们也第一次来。"},{"id":"H2-R02-2-v2-Q3","question":"老师让我去哪儿找她？","answer":"书店","options":["家","书店","超市","那边"],"explanation":"Thông tin đối chiếu trong bài: “我给老师打电话，老师让我去学校里的书店。”","evidence":"我给老师打电话，老师让我去学校里的书店。"},{"id":"H2-R02-2-v2-Q4","question":"书店有多少学生？","answer":"三十多名","options":["四名","五名","三十多名","两名"],"explanation":"Thông tin đối chiếu trong bài: “我在书店看见三十多名学生，有的人看书，有的人正在问老师问题。”","evidence":"我在书店看见三十多名学生，有的人看书，有的人正在问老师问题。"},{"id":"H2-R02-2-v2-Q5","question":"我们在哪间教室上课？","answer":"前边的大教室","options":["这边","饭店","公司","前边的大教室"],"explanation":"Thông tin đối chiếu trong bài: “我找到老师，她和我们去前边那间大教室。”","evidence":"我找到老师，她和我们去前边那间大教室。"},{"id":"H2-R02-2-v2-Q6","question":"下午有课吗？","answer":"没有","options":["没有","很漂亮","不大","好吃"],"explanation":"Thông tin đối chiếu trong bài: “老师说下午没有课，我们可以去看一下学校。”","evidence":"老师说下午没有课，我们可以去看一下学校。"}]},{"id":"H2-R02-3","lesson":2,"revision":2,"title":"Vé tàu mua trên mạng","text":"爸爸明天去北京工作，想在网上买火车票。他有电脑，但有时不知道网上的字是什么意思，就让我帮忙。我已经买了一次票了，知道怎么买。爸爸想买早上八点的，妈妈说还是坐九点的吧，别太早。我们看了网上的时间，九点的火车还有票。爸爸给我钱，让我买九点的票。明天妈妈开车和他去车站，我要上课，不能去。爸爸说，到北京就给我们打电话。他还想给北京的朋友一些茶。我家里有很多茶，妈妈让他给朋友一半。晚上我们吃饭，爸爸给我们介绍了北京的学校。","translation":"Ngày mai bố đi Bắc Kinh làm việc và muốn mua vé tàu trên mạng. Bố có máy tính nhưng đôi lúc không hiểu chữ nên nhờ tôi giúp. Tôi từng mua một lần nên biết cách. Bố muốn chuyến tám giờ, mẹ đề nghị chín giờ cho đỡ sớm. Trên mạng chuyến chín giờ vẫn còn vé, bố đưa tiền nhờ tôi mua. Mai mẹ lái xe đưa bố đến ga, tôi có lớp nên không đi được. Đến Bắc Kinh bố sẽ gọi về. Bố còn muốn mang trà cho bạn, mẹ bảo lấy một nửa số trà ở nhà. Buổi tối cả nhà ăn cơm, bố giới thiệu trường ở Bắc Kinh.","pinyin":"bàba míngtiān qù Běijīng gōngzuò ， xiǎng zài wǎngshàng mǎi huǒchē piào 。 tā yǒu diànnǎo ， dàn yǒushí bù zhīdào wǎngshàng de zì shì shénme yìsi ， jiù ràng wǒ bāngmáng 。 wǒ yǐjīng mǎi le yī cì piào le ， zhīdào zěnme mǎi 。 bàba xiǎng mǎi zǎoshang bā diǎn de ， māma shuō háishi zuò jiǔ diǎn de ba ， bié tài zǎo 。 wǒmen kàn le wǎngshàng de shíjiān ， jiǔ diǎn de huǒchē háiyǒu piào 。 bàba gěi wǒ qián ， ràng wǒ mǎi jiǔ diǎn de piào 。 míngtiān māma kāichē hé tā qù chēzhàn ， wǒ yào shàngkè ， bù néng qù 。 bàba shuō ， dào Běijīng jiù gěi wǒmen dǎ diànhuà 。 tā hái xiǎng gěi Běijīng de péngyou yìxiē chá 。 wǒ jiālǐ yǒu hěn duō chá ， māma ràng tā gěi péngyou yíbàn 。 wǎnshang wǒmen chīfàn ， bàba gěi wǒmen jièshào le Běijīng de xuéxiào 。","grammar":["Cấu trúc đưa ra đề nghị: Hay là... đi","Cách dùng 多 biểu thị số ước lượng","Động từ/cụm động từ làm định ngữ"],"questions":[{"id":"H2-R02-3-v2-Q1","question":"爸爸要去哪儿工作？","answer":"北京","options":["这边","饭店","公司","北京"],"explanation":"Thông tin đối chiếu trong bài: “爸爸明天去北京工作，想在网上买火车票。”","evidence":"爸爸明天去北京工作，想在网上买火车票。"},{"id":"H2-R02-3-v2-Q2","question":"爸爸请谁帮忙在网上买票？","answer":"我","options":["我","哥哥","妹妹","儿子"],"explanation":"Thông tin đối chiếu trong bài: “他有电脑，但有时不知道网上的字是什么意思，就让我帮忙。”","evidence":"他有电脑，但有时不知道网上的字是什么意思，就让我帮忙。"},{"id":"H2-R02-3-v2-Q3","question":"妈妈想买几点的票？","answer":"九点","options":["下午两点","九点","一点半","两点半"],"explanation":"Thông tin đối chiếu trong bài: “爸爸想买早上八点的，妈妈说还是坐九点的吧，别太早。”","evidence":"爸爸想买早上八点的，妈妈说还是坐九点的吧，别太早。"},{"id":"H2-R02-3-v2-Q4","question":"明天谁开车去车站？","answer":"妈妈","options":["李文","姐姐","妈妈","她"],"explanation":"Thông tin đối chiếu trong bài: “明天妈妈开车和他去车站，我要上课，不能去。”","evidence":"明天妈妈开车和他去车站，我要上课，不能去。"},{"id":"H2-R02-3-v2-Q5","question":"我不能去车站，要做什么？","answer":"要上课","options":["休息","买东西","吃饭","要上课"],"explanation":"Thông tin đối chiếu trong bài: “明天妈妈开车和他去车站，我要上课，不能去。”","evidence":"明天妈妈开车和他去车站，我要上课，不能去。"},{"id":"H2-R02-3-v2-Q6","question":"爸爸想给朋友什么？","answer":"茶","options":["茶","一杯水","鸡蛋","面包"],"explanation":"Thông tin đối chiếu trong bài: “他还想给北京的朋友一些茶。”","evidence":"他还想给北京的朋友一些茶。"}]},{"id":"H2-R02-4","lesson":2,"revision":2,"title":"Đi ăn ở đâu sau buổi học?","text":"下午三点下课后，我和朋友想去吃饭。学校前边的饭店有面条儿，但朋友想吃饺子。医院外的饭店有饺子，我们不知道远不远。朋友在网上看了一下，知道坐公交车要二十分钟。我说，晚上六点还有课，还是在学校前边吃吧。朋友想一下，说面条儿也很好吃。我们去饭店，里已经有二十多人了，没有两个人的桌子。一个先生让我们坐在他那边。他是学校的老师，想和他的学生吃饭。他给我们介绍了这家店，还说下次想吃饺子，可以坐车去医院外边那家。我们五点回学校，没有来晚。","translation":"Tan học lúc ba giờ, tôi và bạn muốn đi ăn. Quán trước trường có mì nhưng bạn muốn sủi cảo. Quán ngoài bệnh viện có sủi cảo, song chúng tôi chưa biết xa không. Tìm trên mạng thấy đi xe buýt mất hai mươi phút. Sáu giờ còn lớp nên tôi đề nghị ăn trước trường. Bạn đồng ý vì mì cũng ngon. Trong quán có hơn hai mươi người, không còn bàn cho hai người. Một người đàn ông mời chúng tôi ngồi cùng; ông là giáo viên đang đợi học sinh. Ông giới thiệu quán và bảo lần sau có thể đi xe đến quán sủi cảo. Năm giờ chúng tôi về trường, không bị muộn.","pinyin":"xiàwǔ sān diǎn xià kè hòu ， wǒ hé péngyou xiǎng qù chīfàn 。 xuéxiào qiánbian de fàndiàn yǒu miàntiáor ， dàn péngyou xiǎng chī jiǎozi 。 yīyuàn wài de fàndiàn yǒu jiǎozi ， wǒmen bù zhīdào yuǎn bù yuǎn 。 péngyou zài wǎngshàng kàn le yíxià ， zhīdào zuò gōngjiāochē yào èr shífēn zhōng 。 wǒ shuō ， wǎnshang liù diǎn háiyǒu kè ， háishi zài xuéxiào qiánbian chī ba 。 péngyou xiǎng yíxià ， shuō miàntiáor yě hěn hǎochī 。 wǒmen qù fàndiàn ， lǐ yǐjīng yǒu èr shí duō rén le ， méiyǒu liǎng gè rén de zhuōzi 。 yí gè xiānsheng ràng wǒmen zuò zài tā nàbiān 。 tā shì xuéxiào de lǎoshī ， xiǎng hé tā de xuésheng chīfàn 。 tā gěi wǒmen jièshào le zhè jiā diàn ， hái shuō xià cì xiǎng chī jiǎozi ， kěyǐ zuò chē qù yīyuàn wàibian nà jiā 。 wǒmen wǔ diǎn huí xuéxiào ， méiyǒu lái wǎn 。","grammar":["Cấu trúc đưa ra đề nghị: Hay là... đi","Cách dùng 多 biểu thị số ước lượng","Động từ/cụm động từ làm định ngữ"],"questions":[{"id":"H2-R02-4-v2-Q1","question":"我们几点下课？","answer":"三点","options":["五点半","五点","六点","三点"],"explanation":"Thông tin đối chiếu trong bài: “下午三点下课后，我和朋友想去吃饭。”","evidence":"下午三点下课后，我和朋友想去吃饭。"},{"id":"H2-R02-4-v2-Q2","question":"朋友想吃什么？","answer":"饺子","options":["饺子","面包","面包和牛奶","热茶"],"explanation":"Thông tin đối chiếu trong bài: “学校前边的饭店有面条儿，但朋友想吃饺子。”","evidence":"学校前边的饭店有面条儿，但朋友想吃饺子。"},{"id":"H2-R02-4-v2-Q3","question":"去医院外的饭店坐车要多少时间？","answer":"二十分钟","options":["两年","二十分钟","半个小时","一个小时"],"explanation":"Thông tin đối chiếu trong bài: “朋友在网上看了一下，知道坐公交车要二十分钟。”","evidence":"朋友在网上看了一下，知道坐公交车要二十分钟。"},{"id":"H2-R02-4-v2-Q4","question":"晚上几点还有课？","answer":"六点","options":["十点","七点半","六点","八点半"],"explanation":"Thông tin đối chiếu trong bài: “我说，晚上六点还有课，还是在学校前边吃吧。”","evidence":"我说，晚上六点还有课，还是在学校前边吃吧。"},{"id":"H2-R02-4-v2-Q5","question":"饭店里有多少人？","answer":"二十多人","options":["第十二课","五分钟","十分钟","二十多人"],"explanation":"Thông tin đối chiếu trong bài: “我们去饭店，里已经有二十多人了，没有两个人的桌子。”","evidence":"我们去饭店，里已经有二十多人了，没有两个人的桌子。"},{"id":"H2-R02-4-v2-Q6","question":"让我们坐的先生是谁？","answer":"老师","options":["老师","儿子","女儿","他"],"explanation":"Thông tin đối chiếu trong bài: “他是学校的老师，想和他的学生吃饭。”","evidence":"他是学校的老师，想和他的学生吃饭。"}]},{"id":"H2-R02-5","lesson":2,"revision":2,"title":"Ngày đầu của nhóm học sinh nước ngoài","text":"今天学校来了四名外国学生。他们是上午坐公交车来的，想认识我们的老师。老师让我给他们介绍学校。我和他们看了教室和书店，还在学校前边看了车站。有一个学生问，去北京的一个学校旅游怎么买票。我不知道那个学校在哪里，就请老师帮忙。老师说，今天下午他们还是坐出租车去吧，明天再坐公交车。中午，我们在学校吃饭。他们说米饭很好吃，菜也不贵。下午我有课，不能和他们去。他们让我在网上给他们介绍一些中文书，说回国后还要学习。我给他们看了三本书，他们都很喜欢。","translation":"Hôm nay trường có bốn học sinh nước ngoài đến bằng xe buýt buổi sáng để làm quen với giáo viên. Cô nhờ tôi giới thiệu trường. Tôi đưa họ xem lớp học, hiệu sách và trạm xe phía trước. Một bạn hỏi cách mua vé đi tham quan một nơi ở Bắc Kinh. Tôi chưa biết nơi đó nên nhờ cô giúp. Cô đề nghị chiều nay đi taxi, mai hãy đi xe buýt. Ăn trưa tại trường, các bạn khen cơm ngon, thức ăn không đắt. Chiều tôi có lớp nên không đi cùng được. Các bạn nhờ tôi giới thiệu sách tiếng Trung trên mạng để sau khi về nước vẫn học tiếp. Tôi cho xem ba quyển và họ đều thích.","pinyin":"jīntiān xuéxiào lái le sì míng wàiguó xuésheng 。 tāmen shì shàngwǔ zuò gōngjiāochē lái de ， xiǎng rènshi wǒmen de lǎoshī 。 lǎoshī ràng wǒ gěi tāmen jièshào xuéxiào 。 wǒ hé tāmen kàn le jiàoshì hé shūdiàn ， hái zài xuéxiào qiánbian kàn le chēzhàn 。 yǒu yí gè xuésheng wèn ， qù Běijīng de yí gè xuéxiào lǚyóu zěnme mǎi piào 。 wǒ bù zhīdào nàge xuéxiào zài nǎlǐ ， jiù qǐng lǎoshī bāngmáng 。 lǎoshī shuō ， jīntiān xiàwǔ tāmen háishi zuò chūzūchē qù ba ， míngtiān zài zuò gōngjiāochē 。 zhōngwǔ ， wǒmen zài xuéxiào chīfàn 。 tāmen shuō mǐfàn hěn hǎochī ， cài yě bù guì 。 xiàwǔ wǒ yǒu kè ， bù néng hé tāmen qù 。 tāmen ràng wǒ zài wǎngshàng gěi tāmen jièshào yìxiē Zhōngwén shū ， shuō huíguó hòu hái yào xuéxí 。 wǒ gěi tāmen kàn le sān běn shū ， tāmen dōu hěn xǐhuan 。","grammar":["Cấu trúc đưa ra đề nghị: Hay là... đi","Cách dùng 多 biểu thị số ước lượng","Động từ/cụm động từ làm định ngữ"],"questions":[{"id":"H2-R02-5-v2-Q1","question":"今天来了几名外国学生？","answer":"四名","options":["三十多名","两名","三名","四名"],"explanation":"Thông tin đối chiếu trong bài: “今天学校来了四名外国学生。”","evidence":"今天学校来了四名外国学生。"},{"id":"H2-R02-5-v2-Q2","question":"他们是怎么来的？","answer":"坐公交车","options":["坐公交车","坐火车","坐出租车","开车"],"explanation":"Thông tin đối chiếu trong bài: “他们是上午坐公交车来的，想认识我们的老师。”","evidence":"他们是上午坐公交车来的，想认识我们的老师。"},{"id":"H2-R02-5-v2-Q3","question":"谁让我介绍学校？","answer":"老师","options":["小时候的朋友","老师","三个同学","李"],"explanation":"Thông tin đối chiếu trong bài: “老师让我给他们介绍学校。”","evidence":"老师让我给他们介绍学校。"},{"id":"H2-R02-5-v2-Q4","question":"老师让他们下午怎么去？","answer":"坐出租车","options":["坐火车","坐公交车","坐出租车","开车"],"explanation":"Thông tin đối chiếu trong bài: “老师说，今天下午他们还是坐出租车去吧，明天再坐公交车。”","evidence":"老师说，今天下午他们还是坐出租车去吧，明天再坐公交车。"},{"id":"H2-R02-5-v2-Q5","question":"我下午不能去，要做什么？","answer":"有课","options":["坐火车","坐飞机","坐公交车","有课"],"explanation":"Thông tin đối chiếu trong bài: “下午我有课，不能和他们去。”","evidence":"下午我有课，不能和他们去。"},{"id":"H2-R02-5-v2-Q6","question":"我给他们看了几本书？","answer":"三本","options":["三本","两本","五本","十本"],"explanation":"Thông tin đối chiếu trong bài: “我给他们看了三本书，他们都很喜欢。”","evidence":"我给他们看了三本书，他们都很喜欢。"}]},{"id":"H2-R03-1","lesson":3,"revision":2,"title":"Lần đầu cùng bạn làm bữa tối","text":"今天是我第一次请朋友来家里吃晚饭。我会做菜，但一个人做这么多菜有点儿累。朋友下午四点就过来帮忙了。他让我洗菜，自己做米饭。我洗完菜，想拿一个大杯子给他喝水。他说手还没洗，让我拿水到桌子上。妈妈下班回来，看到菜已经做好了，非常高兴。她说今天的饭不错，想知道是谁做的。朋友不好意思，说，菜是我做的，他只做了米饭。吃完饭，我们没有出去看电影，一起洗杯子、看看书。我想，第一次请朋友吃饭，不要做太多菜，大家一起帮忙，就不会太累。","translation":"Đây là lần đầu tôi mời bạn đến nhà ăn tối. Tôi biết nấu nhưng làm nhiều món một mình hơi mệt. Bốn giờ bạn đã đến giúp. Bạn bảo tôi rửa rau, còn mình nấu cơm. Rửa xong tôi lấy cốc nước cho bạn. Bạn chưa rửa tay nên nhờ để nước trên bàn. Mẹ đi làm về, thấy cơm nước đã xong rất vui, khen ngon và hỏi ai nấu. Bạn ngại ngùng nói tôi làm món ăn, bạn chỉ nấu cơm. Ăn xong chúng tôi không đi xem phim mà rửa cốc, đọc sách. Tôi thấy lần đầu mời cơm không cần nhiều món; cùng giúp nhau sẽ đỡ mệt.","pinyin":"jīntiān shì wǒ dì yī cì qǐng péngyou lái jiālǐ chī wǎnfàn 。 wǒ huì zuò cài ， dàn yí gè rén zuò zhème duō cài yǒudiǎnr lèi 。 péngyou xiàwǔ sì diǎn jiù guòlai bāngmáng le 。 tā ràng wǒ xǐ cài ， zìjǐ zuò mǐfàn 。 wǒ xǐ wán cài ， xiǎng ná yí gè dà bēizi gěi tā hē shuǐ 。 tā shuō shǒu hái méi xǐ ， ràng wǒ ná shuǐ dào zhuōzi shàng 。 māma xiàbān huí lái ， kàndào cài yǐjīng zuò hǎo le ， fēicháng gāoxìng 。 tā shuō jīntiān de fàn búcuò ， xiǎng zhīdào shì shéi zuò de 。 péngyou bù hǎo yìsi ， shuō ， cài shì wǒ zuò de ， tā zhǐ zuò le mǐfàn 。 chī wán fàn ， wǒmen méiyǒu chūqù kàn diànyǐng ， yìqǐ xǐ bēizi 、 kàn kàn shū 。 wǒ xiǎng ， dì yī cì qǐng péngyou chīfàn ， bú yào zuò tài duō cài ， dàjiā yìqǐ bāngmáng ， jiù bù huì tài lèi 。","grammar":["Bổ ngữ kết quả","Lặp lại động từ"],"questions":[{"id":"H2-R03-1-v2-Q1","question":"朋友几点过来？","answer":"四点","options":["四点","七点半","八点半","六点十分"],"explanation":"Thông tin đối chiếu trong bài: “朋友下午四点就过来帮忙了。”","evidence":"朋友下午四点就过来帮忙了。"},{"id":"H2-R03-1-v2-Q2","question":"谁洗菜？","answer":"我","options":["朋友的妈妈","我","小时候的朋友","三个同学"],"explanation":"Thông tin đối chiếu trong bài: “他让我洗菜，自己做米饭。”","evidence":"他让我洗菜，自己做米饭。"},{"id":"H2-R03-1-v2-Q3","question":"谁做米饭？","answer":"朋友","options":["弟弟","医生","朋友","售货员"],"explanation":"Thông tin đối chiếu trong bài: “朋友不好意思，说，菜是我做的，他只做了米饭。”","evidence":"朋友不好意思，说，菜是我做的，他只做了米饭。"},{"id":"H2-R03-1-v2-Q4","question":"我拿什么给朋友喝水？","answer":"大杯子","options":["学校","小的","贵的","大杯子"],"explanation":"Thông tin đối chiếu trong bài: “我洗完菜，想拿一个大杯子给他喝水。”","evidence":"我洗完菜，想拿一个大杯子给他喝水。"},{"id":"H2-R03-1-v2-Q5","question":"妈妈什么时候回来？","answer":"下班后","options":["下班后","八点二十分","九点二十分","三点五十分"],"explanation":"Thông tin đối chiếu trong bài: “妈妈下班回来，看到菜已经做好了，非常高兴。”","evidence":"妈妈下班回来，看到菜已经做好了，非常高兴。"},{"id":"H2-R03-1-v2-Q6","question":"吃完饭后我们出去看电影了吗？","answer":"没有","options":["有点儿小","没有","有一个问题不懂","是"],"explanation":"Thông tin đối chiếu trong bài: “吃完饭，我们没有出去看电影，一起洗杯子、看看书。”","evidence":"吃完饭，我们没有出去看电影，一起洗杯子、看看书。"}]},{"id":"H2-R03-2","lesson":3,"revision":2,"title":"Mang sách trở lại trường","text":"昨天老师让我今天拿三本中文书去学校，给新来的同学看。我早上去学校太早，没有拿书。上课前，我给妈妈打电话，请她送过来。妈妈正在家里做饭，让我下课后自己回去拿。我想了想，还是上课吧。老师知道后，说没关系，下午再给同学们看。中午我吃完饭，坐公交车回家。妈妈已经洗好了水果，让我也拿一些给同学。下午两点，我回到学校，书和水果都拿来了。同学们吃水果、看书，问了我很多问题。我有些不懂，就让老师帮忙。","translation":"Hôm qua giáo viên nhờ tôi hôm nay mang ba quyển sách tiếng Trung cho bạn mới xem. Tôi ra khỏi nhà sớm nên quên sách. Trước giờ học tôi gọi nhờ mẹ mang đến, nhưng mẹ đang nấu nên bảo tan học tự về lấy. Tôi quyết định học trước. Cô biết chuyện, bảo chiều cho các bạn xem cũng được. Ăn trưa xong tôi đi xe buýt về nhà. Mẹ đã rửa trái cây và nhờ mang cho các bạn. Hai giờ chiều tôi trở lại trường, có cả sách lẫn trái cây. Các bạn ăn trái cây, xem sách và hỏi nhiều câu. Có câu tôi chưa hiểu nên nhờ cô giúp.","pinyin":"zuótiān lǎoshī ràng wǒ jīntiān ná sān běn Zhōngwén shū qù xuéxiào ， gěi xīn lái de tóngxué kàn 。 wǒ zǎoshang qù xuéxiào tài zǎo ， méiyǒu ná shū 。 shàngkè qián ， wǒ gěi māma dǎ diànhuà ， qǐng tā sòng guòlai 。 māma zhèngzài jiālǐ zuòfàn ， ràng wǒ xià kè hòu zìjǐ huí qù ná 。 wǒ xiǎng le xiǎng ， háishi shàngkè ba 。 lǎoshī zhīdào hòu ， shuō méi guān xi ， xiàwǔ zài gěi tóngxué men kàn 。 zhōngwǔ wǒ chī wán fàn ， zuò gōngjiāochē huíjiā 。 māma yǐjīng xǐ hǎo le shuǐguǒ ， ràng wǒ yě ná yìxiē gěi tóngxué 。 xiàwǔ liǎng diǎn ， wǒ huídào xuéxiào ， shū hé shuǐguǒ dōu ná lái le 。 tóngxué men chī shuǐguǒ 、 kàn shū ， wèn le wǒ hěn duō wèntí 。 wǒ yǒuxiē bù dǒng ， jiù ràng lǎoshī bāngmáng 。","grammar":["Bổ ngữ kết quả","Lặp lại động từ"],"questions":[{"id":"H2-R03-2-v2-Q1","question":"老师让我拿几本书？","answer":"三本","options":["三本","十本","两本","五本"],"explanation":"Thông tin đối chiếu trong bài: “昨天老师让我今天拿三本中文书去学校，给新来的同学看。”","evidence":"昨天老师让我今天拿三本中文书去学校，给新来的同学看。"},{"id":"H2-R03-2-v2-Q2","question":"早上我没有拿什么？","answer":"书","options":["一个杯子","书","雪","衣服"],"explanation":"Thông tin đối chiếu trong bài: “我早上去学校太早，没有拿书。”","evidence":"我早上去学校太早，没有拿书。"},{"id":"H2-R03-2-v2-Q3","question":"妈妈为什么不能送书？","answer":"正在做饭","options":["有课","叫","正在做饭","想"],"explanation":"Thông tin đối chiếu trong bài: “妈妈正在家里做饭，让我下课后自己回去拿。”","evidence":"妈妈正在家里做饭，让我下课后自己回去拿。"},{"id":"H2-R03-2-v2-Q4","question":"我吃完饭怎么回家？","answer":"坐公交车","options":["开车","坐飞机","坐火车","坐公交车"],"explanation":"Thông tin đối chiếu trong bài: “中午我吃完饭，坐公交车回家。”","evidence":"中午我吃完饭，坐公交车回家。"},{"id":"H2-R03-2-v2-Q5","question":"妈妈让我还拿什么？","answer":"水果","options":["水果","热牛奶","一杯水","鸡蛋"],"explanation":"Thông tin đối chiếu trong bài: “妈妈已经洗好了水果，让我也拿一些给同学。”","evidence":"妈妈已经洗好了水果，让我也拿一些给同学。"},{"id":"H2-R03-2-v2-Q6","question":"我下午几点回到学校？","answer":"两点","options":["下午五点","两点","一点半","十一点半"],"explanation":"Thông tin đối chiếu trong bài: “下午两点，我回到学校，书和水果都拿来了。”","evidence":"下午两点，我回到学校，书和水果都拿来了。"}]},{"id":"H2-R03-3","lesson":3,"revision":2,"title":"Cơm đã xong nhưng bố chưa về","text":"爸爸今天下班晚，妈妈让我们六点半吃饭。姐姐已经做好菜了，我的米饭还没有做好。弟弟很想出去玩，问能不能让他吃一些面包。我说再休息一下吧，米饭还没好。六点半，妈妈回来了，爸爸还在公司。妈妈说他有事，要七点回来。我们没有让他一个人吃晚饭，就一起看电视。弟弟洗了手，给爸爸拿好杯子。我再做了一个菜。七点，爸爸回到家，看见大家都在，很高兴。他说今天有点儿累，我就让他坐下休息。饭后，洗杯子的事是我们做的。","translation":"Hôm nay bố tan làm muộn, mẹ dặn sáu giờ rưỡi ăn cơm. Chị đã làm xong món ăn, tôi chưa nấu xong cơm. Em trai muốn ra chơi, hỏi có được ăn ít bánh mì trước không. Tôi bảo chờ một chút, cơm chưa xong. Sáu giờ rưỡi mẹ về nhưng bố còn việc ở công ty, bảy giờ mới về. Chúng tôi cùng xem tivi chờ để bố không ăn một mình. Em rửa tay và chuẩn bị cốc cho bố, tôi làm thêm một món. Bố về thấy cả nhà rất vui nhưng hơi mệt, tôi mời bố ngồi nghỉ. Sau bữa ăn chúng tôi rửa cốc.","pinyin":"bàba jīntiān xiàbān wǎn ， māma ràng wǒmen liù diǎn bàn chīfàn 。 jiějie yǐjīng zuò hǎo cài le ， wǒ de mǐfàn hái méiyǒu zuò hǎo 。 dìdi hěn xiǎng chūqù wán ， wèn néng bù néng ràng tā chī yìxiē miànbāo 。 wǒ shuō zài xiūxi yíxià ba ， mǐfàn hái méi hǎo 。 liù diǎn bàn ， māma huí lái le ， bàba hái zài gōngsī 。 māma shuō tā yǒu shì ， yào qī diǎn huí lái 。 wǒmen méiyǒu ràng tā yí gè rén chī wǎnfàn ， jiù yìqǐ kàn diànshì 。 dìdi xǐ le shǒu ， gěi bàba ná hǎo bēizi 。 wǒ zài zuò le yí gè cài 。 qī diǎn ， bàba huídào jiā ， kàn jiàn dàjiā dōu zài ， hěn gāoxìng 。 tā shuō jīntiān yǒudiǎnr lèi ， wǒ jiù ràng tā zuòxià xiūxi 。 fàn hòu ， xǐ bēizi de shì shì wǒmen zuò de 。","grammar":["Bổ ngữ kết quả","Lặp lại động từ"],"questions":[{"id":"H2-R03-3-v2-Q1","question":"谁已经做好菜？","answer":"姐姐","options":["姐姐","妈妈","哥哥","妹妹"],"explanation":"Thông tin đối chiếu trong bài: “姐姐已经做好菜了，我的米饭还没有做好。”","evidence":"姐姐已经做好菜了，我的米饭还没有做好。"},{"id":"H2-R03-3-v2-Q2","question":"什么还没做好？","answer":"米饭","options":["热牛奶","米饭","一杯水","鸡蛋"],"explanation":"Thông tin đối chiếu trong bài: “姐姐已经做好菜了，我的米饭还没有做好。”","evidence":"姐姐已经做好菜了，我的米饭还没有做好。"},{"id":"H2-R03-3-v2-Q3","question":"弟弟想吃什么？","answer":"面包","options":["面条儿和菜","菜","面包","饺子"],"explanation":"Thông tin đối chiếu trong bài: “弟弟很想出去玩，问能不能让他吃一些面包。”","evidence":"弟弟很想出去玩，问能不能让他吃一些面包。"},{"id":"H2-R03-3-v2-Q4","question":"妈妈几点回来？","answer":"六点半","options":["两点半","十一点半","八点二十分","六点半"],"explanation":"Thông tin đối chiếu trong bài: “六点半，妈妈回来了，爸爸还在公司。”","evidence":"六点半，妈妈回来了，爸爸还在公司。"},{"id":"H2-R03-3-v2-Q5","question":"爸爸几点回来？","answer":"七点","options":["七点","下午五点","下午两点","一点半"],"explanation":"Thông tin đối chiếu trong bài: “妈妈说他有事，要七点回来。”","evidence":"妈妈说他有事，要七点回来。"},{"id":"H2-R03-3-v2-Q6","question":"饭后谁洗杯子？","answer":"我们","options":["朋友","我们","医生","售货员"],"explanation":"Thông tin đối chiếu trong bài: “饭后，洗杯子的事是我们做的。”","evidence":"饭后，洗杯子的事是我们做的。"}]},{"id":"H2-R03-4","lesson":3,"revision":2,"title":"Không hiểu bài thì hỏi lại","text":"我今天在学校读了一本中文书。老师说，读完后要介绍它的意思。我看了一次，有些字认识，有些不认识。朋友让我再看一看，有问题就问他。我读完第二次，还是有一个问题不懂。下课后，我请老师帮忙。老师没有给我说意思，让我看看书里的一个问题。我看了看，再读一读，就懂了。回家后，我自己给妈妈介绍了这本书。妈妈不太懂中文，但知道我今天很高兴。她说，学习不是看完书就好了，不懂的时候要问。我想明天再去书店，找一本我可以看懂的中文书看。","translation":"Hôm nay tôi đọc một bài tiếng Trung ở trường. Giáo viên yêu cầu đọc xong giới thiệu ý nghĩa. Lần đầu có chữ tôi biết, có chữ chưa biết. Bạn khuyên đọc lại, có câu hỏi thì hỏi bạn. Đọc lần hai tôi vẫn còn một câu hỏi. Tan học tôi nhờ cô giúp. Cô chưa nói nghĩa mà bảo xem một câu hỏi trong sách. Tôi xem rồi đọc lại thì hiểu. Về nhà tôi giới thiệu cuốn sách với mẹ. Mẹ không giỏi tiếng Trung nhưng biết hôm nay tôi vui. Mẹ bảo không phải cứ đọc xong là được, chưa hiểu thì hỏi. Mai tôi muốn tìm một cuốn sách không quá khó ở hiệu sách.","pinyin":"wǒ jīntiān zài xuéxiào dú le yī běn Zhōngwén shū 。 lǎoshī shuō ， dú wán hòu yào jièshào tā de yìsi 。 wǒ kàn le yī cì ， yǒuxiē zì rènshi ， yǒuxiē bù rènshi 。 péngyou ràng wǒ zài kàn yī kàn ， yǒu wèntí jiù wèn tā 。 wǒ dú wán dì èr cì ， háishi yǒu yí gè wèntí bù dǒng 。 xià kè hòu ， wǒ qǐng lǎoshī bāngmáng 。 lǎoshī méiyǒu gěi wǒ shuō yìsi ， ràng wǒ kàn kàn shū lǐ de yí gè wèntí 。 wǒ kàn le kàn ， zài dú yī dú ， jiù dǒng le 。 huíjiā hòu ， wǒ zìjǐ gěi māma jièshào le zhè běn shū 。 māma bù tài dǒng Zhōngwén ， dàn zhīdào wǒ jīntiān hěn gāoxìng 。 tā shuō ， xuéxí bù shì kàn wán shū jiù hǎo le ， bù dǒng de shíhou yào wèn 。 wǒ xiǎng míngtiān zài qù shūdiàn ， zhǎo yī běn wǒ kěyǐ kàn dǒng de Zhōngwén shū kàn 。","grammar":["Bổ ngữ kết quả","Lặp lại động từ"],"questions":[{"id":"H2-R03-4-v2-Q1","question":"老师让我读完后做什么？","answer":"介绍意思","options":["介绍意思","工作","认识","做饭"],"explanation":"Thông tin đối chiếu trong bài: “老师说，读完后要介绍它的意思。”","evidence":"老师说，读完后要介绍它的意思。"},{"id":"H2-R03-4-v2-Q2","question":"读完第二次，还有问题不懂吗？","answer":"有","options":["能","有","不能","很漂亮"],"explanation":"Thông tin đối chiếu trong bài: “我读完第二次，还是有一个问题不懂。”","evidence":"我读完第二次，还是有一个问题不懂。"},{"id":"H2-R03-4-v2-Q3","question":"下课后我请谁帮忙？","answer":"老师","options":["妈妈","哥哥","老师","妹妹"],"explanation":"Thông tin đối chiếu trong bài: “下课后，我请老师帮忙。”","evidence":"下课后，我请老师帮忙。"},{"id":"H2-R03-4-v2-Q4","question":"老师让我看什么？","answer":"书里的问题","options":["杯子","一个杯子","一本书","书里的问题"],"explanation":"Thông tin đối chiếu trong bài: “老师没有给我说意思，让我看看书里的一个问题。”","evidence":"老师没有给我说意思，让我看看书里的一个问题。"},{"id":"H2-R03-4-v2-Q5","question":"回家后我给谁介绍书？","answer":"妈妈","options":["妈妈","中国学生","外国学生","来接我的朋友"],"explanation":"Thông tin đối chiếu trong bài: “回家后，我自己给妈妈介绍了这本书。”","evidence":"回家后，我自己给妈妈介绍了这本书。"},{"id":"H2-R03-4-v2-Q6","question":"明天我想去哪儿？","answer":"书店","options":["桌子前","书店","前","后"],"explanation":"Thông tin đối chiếu trong bài: “我想明天再去书店，找一本我可以看懂的中文书看。”","evidence":"我想明天再去书店，找一本我可以看懂的中文书看。"}]},{"id":"H2-R03-5","lesson":3,"revision":2,"title":"Đi ăn ngoài hay tự nấu?","text":"星期日早上，朋友问我想不想去饭店吃午饭。我昨天出去旅游了，今天有点儿累，不想坐车。他说可以来我家，一起做饭。我家里有米饭、面条儿和一些菜，没有包子。朋友想吃面条儿，我也喜欢。我们洗了手，他洗菜，我做面条儿。他不会做饭，看了看我怎么做，说自己也想学做饭。十一点半，午饭做好了。朋友觉得不错，吃完后还想给他妈妈介绍做饭的事。下午他回去了，我洗完杯子，在家休息。晚上妈妈回来，我给她做了面条儿。","translation":"Sáng Chủ nhật bạn hỏi tôi có muốn ra quán ăn trưa không. Hôm qua đi du lịch nên hôm nay tôi hơi mệt, không muốn đi xe. Bạn đề nghị đến nhà cùng nấu. Nhà có cơm, mì và rau nhưng không có bánh bao. Cả hai muốn ăn mì. Rửa tay xong bạn rửa rau, tôi nấu mì. Bạn chưa biết nấu nên xem tôi làm và muốn tự làm thử. Mười một giờ rưỡi xong bữa trưa. Bạn khen ngon, ăn xong còn muốn kể chuyện nấu ăn cho mẹ. Chiều bạn về, tôi rửa cốc rồi nghỉ. Tối mẹ về tôi lại nấu mì cho mẹ.","pinyin":"xīngqīrì zǎoshang ， péngyou wèn wǒ xiǎng bù xiǎng qù fàndiàn chī wǔfàn 。 wǒ zuótiān chūqù lǚyóu le ， jīntiān yǒudiǎnr lèi ， bù xiǎng zuò chē 。 tā shuō kěyǐ lái wǒ jiā ， yìqǐ zuòfàn 。 wǒ jiālǐ yǒu mǐfàn 、 miàntiáor hé yìxiē cài ， méiyǒu bāozi 。 péngyou xiǎng chī miàntiáor ， wǒ yě xǐhuan 。 wǒmen xǐ le shǒu ， tā xǐ cài ， wǒ zuò miàntiáor 。 tā bù huì zuòfàn ， kàn le kàn wǒ zěnme zuò ， shuō zìjǐ yě xiǎng xué zuòfàn 。 shí yī diǎn bàn ， wǔfàn zuò hǎo le 。 péngyou juéde búcuò ， chī wán hòu hái xiǎng gěi tā māma jièshào zuòfàn de shì 。 xiàwǔ tā huí qù le ， wǒ xǐ wán bēizi ， zàijiā xiūxi 。 wǎnshang māma huí lái ， wǒ gěi tā zuò le miàntiáor 。","grammar":["Bổ ngữ kết quả","Lặp lại động từ"],"questions":[{"id":"H2-R03-5-v2-Q1","question":"我今天为什么不想出去？","answer":"有点儿累","options":["有点儿累","大一些","没有了","对了"],"explanation":"Thông tin đối chiếu trong bài: “我昨天出去旅游了，今天有点儿累，不想坐车。”","evidence":"我昨天出去旅游了，今天有点儿累，不想坐车。"},{"id":"H2-R03-5-v2-Q2","question":"朋友想在哪儿做饭？","answer":"我家","options":["学校的书店","我家","前边的大教室","药店"],"explanation":"Thông tin đối chiếu trong bài: “他说可以来我家，一起做饭。”","evidence":"他说可以来我家，一起做饭。"},{"id":"H2-R03-5-v2-Q3","question":"家里没有什么？","answer":"包子","options":["面包","面包和牛奶","包子","热茶"],"explanation":"Thông tin đối chiếu trong bài: “我家里有米饭、面条儿和一些菜，没有包子。”","evidence":"我家里有米饭、面条儿和一些菜，没有包子。"},{"id":"H2-R03-5-v2-Q4","question":"谁洗菜？","answer":"朋友","options":["售货员","服务员","家人","朋友"],"explanation":"Thông tin đối chiếu trong bài: “星期日早上，朋友问我想不想去饭店吃午饭。”","evidence":"星期日早上，朋友问我想不想去饭店吃午饭。"},{"id":"H2-R03-5-v2-Q5","question":"午饭几点做好？","answer":"十一点半","options":["十一点半","八点","九点","十点"],"explanation":"Thông tin đối chiếu trong bài: “十一点半，午饭做好了。”","evidence":"十一点半，午饭做好了。"},{"id":"H2-R03-5-v2-Q6","question":"晚上我给谁做面条儿？","answer":"妈妈","options":["来接我的朋友","妈妈","小时候的朋友","三个同学"],"explanation":"Thông tin đối chiếu trong bài: “晚上妈妈回来，我给她做了面条儿。”","evidence":"晚上妈妈回来，我给她做了面条儿。"}]},{"id":"H2-R04-1","lesson":4,"revision":2,"title":"Không mua chiếc quần rẻ nhất","text":"今天我和姐姐去商场买裤子。我没买过白色的，想试一条。售货员拿了两条，一条五十元，一条八十元。五十元的很便宜，但穿了觉得有点儿小。八十元的更好看，姐姐让我再试试黑色的。我过去只穿过黑色裤子，这次想买白色的，所以还是买了白色的。姐姐没有买裤子，她想给弟弟买一个绿色书包。绿色的卖完了，只有红色的。她给弟弟打电话，问他喜欢不喜欢红色。弟弟说很喜欢，我们就买了。回家后，妈妈说我的裤子不错，还问下次能不能和我去商场。","translation":"Hôm nay tôi và chị đến trung tâm thương mại mua quần. Tôi chưa mua quần trắng nên muốn thử. Người bán đưa hai chiếc giá năm mươi và tám mươi tệ. Chiếc rẻ hơi nhỏ khi mặc, chiếc tám mươi đẹp hơn. Chị khuyên thử màu đen, nhưng trước giờ tôi chỉ mặc đen nên lần này vẫn chọn trắng. Chị định mua cặp xanh cho em trai song đã hết, chỉ còn đỏ. Gọi hỏi thấy em thích đỏ, chúng tôi mua. Về nhà mẹ khen quần và muốn lần sau đi cùng.","pinyin":"jīntiān wǒ hé jiějie qù shāngchǎng mǎi kùzi 。 wǒ méi mǎi guò báisè de ， xiǎng shì yì tiáo 。 shòuhuòyuán ná le liǎng tiáo ， yì tiáo wǔ shí yuán ， yì tiáo bā shí yuán 。 wǔ shí yuán de hěn piányi ， dàn chuān le juéde yǒudiǎnr xiǎo 。 bā shí yuán de gèng hǎokàn ， jiějie ràng wǒ zài shì shì hēisè de 。 wǒ guòqù zhǐ chuān guò hēisè kùzi ， zhè cì xiǎng mǎi báisè de ， suǒyǐ háishi mǎi le báisè de 。 jiějie méiyǒu mǎi kùzi ， tā xiǎng gěi dìdi mǎi yí gè lǜsè shūbāo 。 lǜsè de mài wán le ， zhǐ yǒu hóngsè de 。 tā gěi dìdi dǎ diànhuà ， wèn tā xǐhuan bù xǐhuan hóngsè 。 dìdi shuō hěn xǐhuan ， wǒmen jiù mǎi le 。 huíjiā hòu ， māma shuō wǒ de kùzi búcuò ， hái wèn xià cì néng bù néng hé wǒ qù shāngchǎng 。","grammar":["Trợ từ động thái 过","Cấu trúc nhân quả vì... nên...","Cụm từ chữ 的 (Định ngữ)"],"questions":[{"id":"H2-R04-1-v2-Q1","question":"我想试什么颜色的裤子？","answer":"白色","options":["绿色","白色","红色","黑色"],"explanation":"Thông tin đối chiếu trong bài: “我过去只穿过黑色裤子，这次想买白色的，所以还是买了白色的。”","evidence":"我过去只穿过黑色裤子，这次想买白色的，所以还是买了白色的。"},{"id":"H2-R04-1-v2-Q2","question":"五十元的裤子怎么样？","answer":"有点儿小","options":["下雨了","有点儿冷","有点儿小","太热了"],"explanation":"Thông tin đối chiếu trong bài: “五十元的很便宜，但穿了觉得有点儿小。”","evidence":"五十元的很便宜，但穿了觉得有点儿小。"},{"id":"H2-R04-1-v2-Q3","question":"我买的裤子多少钱？","answer":"八十元","options":["五元","二十元","三十元","八十元"],"explanation":"Thông tin đối chiếu trong bài: “八十元的更好看，姐姐让我再试试黑色的。”","evidence":"八十元的更好看，姐姐让我再试试黑色的。"},{"id":"H2-R04-1-v2-Q4","question":"姐姐想给谁买书包？","answer":"弟弟","options":["弟弟","服务员","家人","中国人"],"explanation":"Thông tin đối chiếu trong bài: “姐姐没有买裤子，她想给弟弟买一个绿色书包。”","evidence":"姐姐没有买裤子，她想给弟弟买一个绿色书包。"},{"id":"H2-R04-1-v2-Q5","question":"我们买了什么颜色的书包？","answer":"红色","options":["白色","红色","黑色","绿色"],"explanation":"Thông tin đối chiếu trong bài: “绿色的卖完了，只有红色的。”","evidence":"绿色的卖完了，只有红色的。"},{"id":"H2-R04-1-v2-Q6","question":"妈妈下次想去哪儿？","answer":"商场","options":["泰国","家","商场","超市"],"explanation":"Thông tin đối chiếu trong bài: “回家后，妈妈说我的裤子不错，还问下次能不能和我去商场。”","evidence":"回家后，妈妈说我的裤子不错，还问下次能不能和我去商场。"}]},{"id":"H2-R04-2","lesson":4,"revision":2,"title":"Từng đến Bắc Kinh nhưng chưa đến trường này","text":"老师问我们去过北京没有。我去过两次，但没有去过她介绍的大学。第一次是和爸爸一起去旅游的，第二次是去看朋友。今天老师给我们看了学校的书，里有很多教室和一个很大的书店。我很想再去北京，因为想在那个学校学中文。朋友说他也去过北京，很喜欢那里的饭。我问他，能不能一起去看看学校。他要上班，所以现在还不能去。我就给爸爸打电话，请他帮忙问问买票的事。爸爸让我自己在网上看看，还说不要只看学校的书，要给学校打电话。晚上我在家看了很多中文，再给学校打电话，问下个月的课。","translation":"Giáo viên hỏi chúng tôi từng đến Bắc Kinh chưa. Tôi đã đến hai lần nhưng chưa đến trường đại học cô giới thiệu: lần đầu đi du lịch cùng bố, lần sau thăm bạn. Cô cho xem sách giới thiệu trường, có nhiều lớp và hiệu sách lớn. Tôi muốn quay lại để học tiếng Trung ở đó. Bạn cũng từng đến và thích món ăn, nhưng hiện phải đi làm nên không đi cùng được. Tôi gọi bố nhờ hỏi chuyện mua vé. Bố bảo tự xem trên mạng và gọi trực tiếp cho trường, đừng chỉ đọc sách giới thiệu. Tối tôi ôn tiếng Trung rồi gọi hỏi lớp tháng sau.","pinyin":"lǎoshī wèn wǒmen qù guò Běijīng méiyǒu 。 wǒ qù guò liǎng cì ， dàn méiyǒu qù guò tā jièshào de dàxué 。 dì yī cì shì hé bàba yìqǐ qù lǚyóu de ， dì èr cì shì qù kàn péngyou 。 jīntiān lǎoshī gěi wǒmen kàn le xuéxiào de shū ， lǐ yǒu hěn duō jiàoshì hé yí gè hěn dà de shūdiàn 。 wǒ hěn xiǎng zài qù Běijīng ， yīnwèi xiǎng zài nàge xuéxiào xué Zhōngwén 。 péngyou shuō tā yě qù guò Běijīng ， hěn xǐhuan nàli de fàn 。 wǒ wèn tā ， néng bù néng yìqǐ qù kàn kàn xuéxiào 。 tā yào shàngbān ， suǒyǐ xiànzài hái bù néng qù 。 wǒ jiù gěi bàba dǎ diànhuà ， qǐng tā bāngmáng wèn wèn mǎi piào de shì 。 bàba ràng wǒ zìjǐ zài wǎngshàng kàn kàn ， hái shuō bú yào zhǐ kàn xuéxiào de shū ， yào gěi xuéxiào dǎ diànhuà 。 wǎnshang wǒ zàijiā kàn le hěn duō Zhōngwén ， zài gěi xuéxiào dǎ diànhuà ， wèn xià gè yuè de kè 。","grammar":["Trợ từ động thái 过","Cấu trúc nhân quả vì... nên...","Cụm từ chữ 的 (Định ngữ)"],"questions":[{"id":"H2-R04-2-v2-Q1","question":"我去过北京几次？","answer":"两次","options":["五次","两次","第一次","三次"],"explanation":"Thông tin đối chiếu trong bài: “我去过两次，但没有去过她介绍的大学。”","evidence":"我去过两次，但没有去过她介绍的大学。"},{"id":"H2-R04-2-v2-Q2","question":"我去过老师介绍的大学吗？","answer":"没有","options":["不在","很冷","没有","下雨了"],"explanation":"Thông tin đối chiếu trong bài: “我去过两次，但没有去过她介绍的大学。”","evidence":"我去过两次，但没有去过她介绍的大学。"},{"id":"H2-R04-2-v2-Q3","question":"我第一次和谁去北京？","answer":"爸爸","options":["哥哥","妹妹","儿子","爸爸"],"explanation":"Thông tin đối chiếu trong bài: “第一次是和爸爸一起去旅游的，第二次是去看朋友。”","evidence":"第一次是和爸爸一起去旅游的，第二次是去看朋友。"},{"id":"H2-R04-2-v2-Q4","question":"我为什么想再去？","answer":"想学中文","options":["想学中文","开车","睡觉","起床"],"explanation":"Thông tin đối chiếu trong bài: “我很想再去北京，因为想在那个学校学中文。”","evidence":"我很想再去北京，因为想在那个学校学中文。"},{"id":"H2-R04-2-v2-Q5","question":"朋友现在能一起去吗？","answer":"不能","options":["不在","不能","很冷","下雨了"],"explanation":"Thông tin đối chiếu trong bài: “他要上班，所以现在还不能去。”","evidence":"他要上班，所以现在还不能去。"},{"id":"H2-R04-2-v2-Q6","question":"爸爸让我给哪儿打电话？","answer":"学校","options":["房间外边","前边","学校","这边"],"explanation":"Thông tin đối chiếu trong bài: “爸爸让我自己在网上看看，还说不要只看学校的书，要给学校打电话。”","evidence":"爸爸让我自己在网上看看，还说不要只看学校的书，要给学校打电话。"}]},{"id":"H2-R04-3","lesson":4,"revision":2,"title":"Chiếc cặp không phải của mình","text":"下午下课，我拿了一个黑色书包回家。到家后，想看书，看见里没有我的中文书，只有一本汉语书和绿色的杯子。我的杯子是白色的，所以这不是我的书包。我给同学打电话，她说她的书包也是黑色的。我们说好在学校的书店见。我拿书包过去，她已经在那里了。我看了看，我的中文书都在，她也找到了自己的杯子。我们都很高兴。我说下次想买个红色书包，因为学校里黑色书包太多了。她觉得不要再买，给书包写个名字就可以。我觉得这个意思不错，回家就写了自己的名字。","translation":"Tan học tôi mang một chiếc cặp đen về nhà. Khi định đọc sách, thấy không có sách tiếng Trung của mình, chỉ có sách tiếng Hán và cốc xanh. Cốc của tôi trắng nên biết đã nhầm cặp. Tôi gọi bạn có cặp đen và hẹn ở hiệu sách trong trường. Bạn đã đợi ở đó, đổi lại cặp thấy sách tôi và cốc bạn đều còn. Chúng tôi cùng cười. Tôi muốn mua cặp đỏ vì có quá nhiều cặp đen. Bạn bảo không cần mua mới, chỉ viết tên lên cặp là được. Tôi thấy hợp lý nên về nhà viết tên mình.","pinyin":"xiàwǔ xià kè ， wǒ ná le yí gè hēisè shūbāo huíjiā 。 dào jiā hòu ， xiǎng kàn shū ， kàn jiàn lǐ méiyǒu wǒ de Zhōngwén shū ， zhǐ yǒu yī běn Hànyǔ shū hé lǜsè de bēizi 。 wǒ de bēizi shì báisè de ， suǒyǐ zhè bù shì wǒ de shūbāo 。 wǒ gěi tóngxué dǎ diànhuà ， tā shuō tā de shūbāo yě shì hēisè de 。 wǒmen shuō hǎo zài xuéxiào de shūdiàn jiàn 。 wǒ ná shūbāo guòqù ， tā yǐjīng zài nàli le 。 wǒ kàn le kàn ， wǒ de Zhōngwén shū dōu zài ， tā yě zhǎodào le zìjǐ de bēizi 。 wǒmen dōu hěn gāoxìng 。 wǒ shuō xià cì xiǎng mǎi gè hóngsè shūbāo ， yīnwèi xuéxiào lǐ hēisè shūbāo tài duō le 。 tā juéde bú yào zài mǎi ， gěi shūbāo xiě gè míngzi jiù kěyǐ 。 wǒ juéde zhège yìsi búcuò ， huíjiā jiù xiě le zìjǐ de míngzi 。","grammar":["Trợ từ động thái 过","Cấu trúc nhân quả vì... nên...","Cụm từ chữ 的 (Định ngữ)"],"questions":[{"id":"H2-R04-3-v2-Q1","question":"我拿回家什么颜色的书包？","answer":"黑色","options":["绿色","黑色","红色","白色"],"explanation":"Thông tin đối chiếu trong bài: “下午下课，我拿了一个黑色书包回家。”","evidence":"下午下课，我拿了一个黑色书包回家。"},{"id":"H2-R04-3-v2-Q2","question":"书包里是什么颜色的杯子？","answer":"绿色","options":["红色","白色","绿色","黑色"],"explanation":"Thông tin đối chiếu trong bài: “到家后，想看书，看见里没有我的中文书，只有一本汉语书和绿色的杯子。”","evidence":"到家后，想看书，看见里没有我的中文书，只有一本汉语书和绿色的杯子。"},{"id":"H2-R04-3-v2-Q3","question":"我的杯子是什么颜色？","answer":"白色","options":["黑色","绿色","红色","白色"],"explanation":"Thông tin đối chiếu trong bài: “我的杯子是白色的，所以这不是我的书包。”","evidence":"我的杯子是白色的，所以这不是我的书包。"},{"id":"H2-R04-3-v2-Q4","question":"我们在哪儿见？","answer":"学校的书店","options":["学校的书店","西安","机场","超市前"],"explanation":"Thông tin đối chiếu trong bài: “我们说好在学校的书店见。”","evidence":"我们说好在学校的书店见。"},{"id":"H2-R04-3-v2-Q5","question":"我为什么想买红色书包？","answer":"黑色书包太多了","options":["不贵","黑色书包太多了","不在","很冷"],"explanation":"Thông tin đối chiếu trong bài: “我说下次想买个红色书包，因为学校里黑色书包太多了。”","evidence":"我说下次想买个红色书包，因为学校里黑色书包太多了。"},{"id":"H2-R04-3-v2-Q6","question":"朋友让我写什么？","answer":"名字","options":["大杯子","书里的问题","名字","学校"],"explanation":"Thông tin đối chiếu trong bài: “我觉得这个意思不错，回家就写了自己的名字。”","evidence":"我觉得这个意思不错，回家就写了自己的名字。"}]},{"id":"H2-R04-4","lesson":4,"revision":2,"title":"Trời mưa nên đổi địa điểm","text":"星期六，我和朋友想出去旅游。我们没去过学校外那家大书店，想上午去看看，下午再去商场。早上九点下雨了，朋友打电话问我还去不去。我家在书店前边，但他要坐一个小时的车。因为下雨，我们就不去商场了，让他打车来我家。我已经做过几次面条儿，今天想做给朋友吃。他给我买了一个红色的杯子，说是上次去商场看见的。吃完饭，我们在家看电影。朋友说，今天没旅游，也很高兴。下午雨小了，他拿书回去，我想下星期天不下雨的时候再和他去书店。","translation":"Thứ Bảy tôi và bạn định đi tham quan hiệu sách lớn ngoài trường vào sáng, rồi đến trung tâm thương mại chiều. Chưa từng đến hiệu sách đó nên cả hai muốn xem. Chín giờ trời mưa, bạn gọi hỏi còn đi không. Nhà tôi ở trước hiệu sách, còn bạn đi xe mất một giờ. Vì mưa nên chúng tôi bỏ đi mua sắm, bạn đi taxi đến nhà tôi. Tôi đã nấu mì vài lần, nay làm cho bạn. Bạn tặng chiếc cốc đỏ thấy ở trung tâm thương mại lần trước. Ăn xong xem phim, bạn nói không đi du lịch vẫn vui. Chiều mưa nhỏ, bạn mang sách về; tôi muốn tuần sau trời đẹp cùng đến hiệu sách.","pinyin":"xīngqī liù ， wǒ hé péngyou xiǎng chūqù lǚyóu 。 wǒmen méi qù guò xuéxiào wài nà jiā dà shūdiàn ， xiǎng shàngwǔ qù kàn kàn ， xiàwǔ zài qù shāngchǎng 。 zǎoshang jiǔ diǎn xiàyǔ le ， péngyou dǎ diànhuà wèn wǒ hái qù bù qù 。 wǒ jiā zài shūdiàn qiánbian ， dàn tā yào zuò yí gè xiǎoshí de chē 。 yīnwèi xiàyǔ ， wǒmen jiù bù qù shāngchǎng le ， ràng tā dǎchē lái wǒ jiā 。 wǒ yǐjīng zuò guò jǐ cì miàntiáor ， jīntiān xiǎng zuò gěi péngyou chī 。 tā gěi wǒ mǎi le yí gè hóngsè de bēizi ， shuō shì shàng cì qù shāngchǎng kàn jiàn de 。 chī wán fàn ， wǒmen zàijiā kàn diànyǐng 。 péngyou shuō ， jīntiān méi lǚyóu ， yě hěn gāoxìng 。 xiàwǔ yǔ xiǎo le ， tā ná shū huí qù ， wǒ xiǎng xià xīngqītiān bù xiàyǔ de shíhou zài hé tā qù shūdiàn 。","grammar":["Trợ từ động thái 过","Cấu trúc nhân quả vì... nên...","Cụm từ chữ 的 (Định ngữ)"],"questions":[{"id":"H2-R04-4-v2-Q1","question":"我们上午想去哪儿？","answer":"书店","options":["超市","书店","那边","电影院"],"explanation":"Thông tin đối chiếu trong bài: “我们没去过学校外那家大书店，想上午去看看，下午再去商场。”","evidence":"我们没去过学校外那家大书店，想上午去看看，下午再去商场。"},{"id":"H2-R04-4-v2-Q2","question":"早上几点下雨？","answer":"九点","options":["五点","六点","九点","七点"],"explanation":"Thông tin đối chiếu trong bài: “早上九点下雨了，朋友打电话问我还去不去。”","evidence":"早上九点下雨了，朋友打电话问我还去不去。"},{"id":"H2-R04-4-v2-Q3","question":"朋友怎么来我家？","answer":"打车","options":["开车","坐飞机","坐火车","打车"],"explanation":"Thông tin đối chiếu trong bài: “因为下雨，我们就不去商场了，让他打车来我家。”","evidence":"因为下雨，我们就不去商场了，让他打车来我家。"},{"id":"H2-R04-4-v2-Q4","question":"我给朋友做什么？","answer":"面条儿","options":["面条儿","菜和饺子","菜","饺子"],"explanation":"Thông tin đối chiếu trong bài: “我已经做过几次面条儿，今天想做给朋友吃。”","evidence":"我已经做过几次面条儿，今天想做给朋友吃。"},{"id":"H2-R04-4-v2-Q5","question":"朋友给我什么颜色的杯子？","answer":"红色","options":["绿色","红色","白色","黑色"],"explanation":"Thông tin đối chiếu trong bài: “他给我买了一个红色的杯子，说是上次去商场看见的。”","evidence":"他给我买了一个红色的杯子，说是上次去商场看见的。"},{"id":"H2-R04-4-v2-Q6","question":"下午我们去商场了吗？","answer":"没有","options":["不可以","卖","没有","不卖"],"explanation":"Thông tin đối chiếu trong bài: “因为下雨，我们就不去商场了，让他打车来我家。”","evidence":"因为下雨，我们就不去商场了，让他打车来我家。"}]},{"id":"H2-R04-5","lesson":4,"revision":2,"title":"Thử một cách học khác","text":"我已经学过很多中文，但有时看书还是不懂。老师说，因为我只看字，不知道意思，所以看不懂。她让我试试读，再介绍意思。今天我读了一本书，里有一个在医院工作的爸爸和两个上学的孩子。我给朋友介绍爸爸的工作，朋友问孩子多大，我不知道。我还看了一次，知道儿子八岁，女儿六岁。老师说这次不错，因为我已经知道自己要找什么。下课后，我没有去商场买书包，去了书店，想找一本有学校的书。晚上我给妈妈介绍了今天书里的事，还请她问我几个问题。","translation":"Tôi đã học nhiều tiếng Trung nhưng đôi khi đọc sách vẫn không hiểu. Giáo viên bảo tôi chỉ nhìn chữ mà chưa biết cách dùng nên thấy khó. Cô đề nghị đọc rồi giới thiệu ý nghĩa. Hôm nay tôi đọc sách kể về người bố làm ở bệnh viện và hai con đi học. Tôi giới thiệu với bạn, bạn hỏi tuổi các con nhưng tôi không nhớ nên đọc lại: con trai tám tuổi, con gái sáu tuổi. Giáo viên khen vì tôi đã biết mình cần tìm gì. Tan học tôi đến hiệu sách thay vì mua cặp ở trung tâm thương mại, muốn tìm sách về trường học. Tối tôi kể mẹ nghe và nhờ mẹ hỏi vài câu.","pinyin":"wǒ yǐjīng xué guò hěn duō Zhōngwén ， dàn yǒushí kàn shū háishi bù dǒng 。 lǎoshī shuō ， yīnwèi wǒ zhǐ kàn zì ， bù zhīdào yìsi ， suǒyǐ kàn bù dǒng 。 tā ràng wǒ shì shì dú ， zài jièshào yìsi 。 jīntiān wǒ dú le yī běn shū ， lǐ yǒu yí gè zài yīyuàn gōngzuò de bàba hé liǎng gè shàngxué de háizi 。 wǒ gěi péngyou jièshào bàba de gōngzuò ， péngyou wèn háizi duō dà ， wǒ bù zhīdào 。 wǒ hái kàn le yī cì ， zhīdào érzi bā suì ， nǚ'ér liù suì 。 lǎoshī shuō zhè cì búcuò ， yīnwèi wǒ yǐjīng zhīdào zìjǐ yào zhǎo shénme 。 xià kè hòu ， wǒ méiyǒu qù shāngchǎng mǎi shūbāo ， qù le shūdiàn ， xiǎng zhǎo yī běn yǒu xuéxiào de shū 。 wǎnshang wǒ gěi māma jièshào le jīntiān shū lǐ de shì ， hái qǐng tā wèn wǒ jǐ gè wèntí 。","grammar":["Trợ từ động thái 过","Cấu trúc nhân quả vì... nên...","Cụm từ chữ 的 (Định ngữ)"],"questions":[{"id":"H2-R04-5-v2-Q1","question":"我有时看书懂了吗？","answer":"不懂","options":["不能","不懂","很漂亮","不大"],"explanation":"Thông tin đối chiếu trong bài: “我已经学过很多中文，但有时看书还是不懂。”","evidence":"我已经学过很多中文，但有时看书还是不懂。"},{"id":"H2-R04-5-v2-Q2","question":"书里的爸爸在哪儿工作？","answer":"医院","options":["那边","电影院","医院","店里"],"explanation":"Thông tin đối chiếu trong bài: “今天我读了一本书，里有一个在医院工作的爸爸和两个上学的孩子。”","evidence":"今天我读了一本书，里有一个在医院工作的爸爸和两个上学的孩子。"},{"id":"H2-R04-5-v2-Q3","question":"儿子几岁？","answer":"八岁","options":["十岁","十二岁","十九岁","八岁"],"explanation":"Thông tin đối chiếu trong bài: “我还看了一次，知道儿子八岁，女儿六岁。”","evidence":"我还看了一次，知道儿子八岁，女儿六岁。"},{"id":"H2-R04-5-v2-Q4","question":"女儿几岁？","answer":"六岁","options":["六岁","十二岁","十九岁","二十岁"],"explanation":"Thông tin đối chiếu trong bài: “我还看了一次，知道儿子八岁，女儿六岁。”","evidence":"我还看了一次，知道儿子八岁，女儿六岁。"},{"id":"H2-R04-5-v2-Q5","question":"下课后我去了哪儿？","answer":"书店","options":["前边","书店","这边","饭店"],"explanation":"Thông tin đối chiếu trong bài: “下课后，我没有去商场买书包，去了书店，想找一本有学校的书。”","evidence":"下课后，我没有去商场买书包，去了书店，想找一本有学校的书。"},{"id":"H2-R04-5-v2-Q6","question":"晚上我请谁问问题？","answer":"妈妈","options":["弟弟","朋友","妈妈","医生"],"explanation":"Thông tin đối chiếu trong bài: “晚上我给妈妈介绍了今天书里的事，还请她问我几个问题。”","evidence":"晚上我给妈妈介绍了今天书里的事，还请她问我几个问题。"}]},{"id":"H2-R05-1","lesson":5,"revision":2,"title":"Đợi bạn ở phía dưới","text":"今天朋友第一次来我家。我家在学校前边，朋友只知道学校，不知道怎么上来。我给他打电话，让他在学校外等一会儿，我下去接他。爷爷已经在下面了，正在看书。他不认识我的朋友，就给我打电话。我下来的时候，朋友和爷爷已经在一起说话了。朋友拿了奶茶，想让我和家人一起喝。奶奶正在准备晚饭，让我们快上去帮忙。朋友问能不能进来，我说不要不好意思，大家都想认识他。吃饭前，我们给爷爷介绍了学校的新老师。吃完后，朋友还想在下面看看，我就跟他一起下去走走。","translation":"Hôm nay bạn lần đầu đến nhà tôi. Nhà gần trường nhưng bạn chỉ biết trường, chưa biết cách lên. Tôi bảo bạn đợi ngoài trường một chút để xuống đón. Ông đã ở dưới đọc sách, không quen bạn nên gọi tôi. Khi tôi xuống, hai người đã trò chuyện. Bạn mang trà sữa cho cả nhà. Bà đang chuẩn bị tối, giục chúng tôi lên giúp. Bạn còn ngại xin vào, tôi bảo cả nhà đều muốn làm quen. Trước bữa ăn chúng tôi giới thiệu giáo viên mới với ông. Ăn xong tôi cùng bạn xuống dưới đi dạo.","pinyin":"jīntiān péngyou dì yī cì lái wǒ jiā 。 wǒ jiā zài xuéxiào qiánbian ， péngyou zhǐ zhīdào xuéxiào ， bù zhīdào zěnme shàng lái 。 wǒ gěi tā dǎ diànhuà ， ràng tā zài xuéxiào wài děng yíhuìr ， wǒ xià qù jiē tā 。 yéye yǐjīng zài xiàmian le ， zhèngzài kàn shū 。 tā bù rènshi wǒ de péngyou ， jiù gěi wǒ dǎ diànhuà 。 wǒ xià lái de shíhou ， péngyou hé yéye yǐjīng zài yìqǐ shuōhuà le 。 péngyou ná le nǎichá ， xiǎng ràng wǒ hé jiārén yìqǐ hē 。 nǎinai zhèngzài zhǔnbèi wǎnfàn ， ràng wǒmen kuài shàng qù bāngmáng 。 péngyou wèn néng bù néng jìnlái ， wǒ shuō bú yào bù hǎo yìsi ， dàjiā dōu xiǎng rènshi tā 。 chīfàn qián ， wǒmen gěi yéye jièshào le xuéxiào de xīn lǎoshī 。 chī wán hòu ， péngyou hái xiǎng zài xiàmian kàn kàn ， wǒ jiù gēn tā yìqǐ xià qù zǒu zǒu 。","grammar":["Bổ ngữ xu hướng đơn sau động từ chỉ hướng (上/下/进/出/回 + 来/去)","Bổ ngữ xu hướng đơn sau động từ hành động (拿来, 送来)","Cấu trúc nhấn mạnh thời gian 「都……了」"],"questions":[{"id":"H2-R05-1-v2-Q1","question":"朋友是第几次来我家？","answer":"第一次","options":["五次","两次","第一次","三次"],"explanation":"Thông tin đối chiếu trong bài: “今天朋友第一次来我家。”","evidence":"今天朋友第一次来我家。"},{"id":"H2-R05-1-v2-Q2","question":"我让朋友在哪儿等？","answer":"学校外","options":["药店","学校的教室","洗手间","学校外"],"explanation":"Thông tin đối chiếu trong bài: “我给他打电话，让他在学校外等一会儿，我下去接他。”","evidence":"我给他打电话，让他在学校外等一会儿，我下去接他。"},{"id":"H2-R05-1-v2-Q3","question":"爷爷在下面做什么？","answer":"看书","options":["看书","看电影","读书","看电视"],"explanation":"Thông tin đối chiếu trong bài: “爷爷已经在下面了，正在看书。”","evidence":"爷爷已经在下面了，正在看书。"},{"id":"H2-R05-1-v2-Q4","question":"朋友拿来什么？","answer":"奶茶","options":["鸡蛋","奶茶","面包","面包和牛奶"],"explanation":"Thông tin đối chiếu trong bài: “朋友拿了奶茶，想让我和家人一起喝。”","evidence":"朋友拿了奶茶，想让我和家人一起喝。"},{"id":"H2-R05-1-v2-Q5","question":"谁准备晚饭？","answer":"奶奶","options":["妹妹","儿子","奶奶","女儿"],"explanation":"Thông tin đối chiếu trong bài: “奶奶正在准备晚饭，让我们快上去帮忙。”","evidence":"奶奶正在准备晚饭，让我们快上去帮忙。"},{"id":"H2-R05-1-v2-Q6","question":"吃完饭我跟谁下去？","answer":"朋友","options":["医生","售货员","服务员","朋友"],"explanation":"Thông tin đối chiếu trong bài: “吃完后，朋友还想在下面看看，我就跟他一起下去走走。”","evidence":"吃完后，朋友还想在下面看看，我就跟他一起下去走走。"}]},{"id":"H2-R05-2","lesson":5,"revision":2,"title":"Món quà còn để trong phòng khách sạn","text":"我和妈妈去北京看爷爷奶奶，住在学校前边的酒店。我们准备了水果和一条绿色的裤子，想下午送给奶奶。吃完午饭，妈妈让我去下面等车，自己上去拿礼物。我在下面看见爷爷，他是来接我们的。他说奶奶已经做好菜了，让我们别在饭店吃。妈妈下来的时候，只拿了水果，裤子还在房间里。我想上去拿，妈妈说她知道在哪儿，让我跟爷爷在这里等一会儿。这次妈妈很快就下来了，拿了裤子和奶茶。爷爷很高兴，说，有水果、有奶茶，晚饭都不要做了。我们坐车去奶奶家，她看见礼物很高兴。","translation":"Tôi và mẹ đến Bắc Kinh thăm ông bà, ở khách sạn trước trường. Chúng tôi chuẩn bị trái cây và quần xanh tặng bà buổi chiều. Sau trưa mẹ bảo tôi xuống đợi xe, mẹ lên lấy quà. Ông đến đón, nói bà đã nấu nên đừng ăn ở quán. Mẹ xuống chỉ cầm trái cây, quên quần trong phòng. Tôi định lên lấy nhưng mẹ biết chỗ để nên tự lên, bảo tôi đợi cùng ông. Lần này mẹ xuống nhanh, cầm quần và trà sữa. Ông đùa có nhiều đồ ăn uống thế thì khỏi nấu tối nữa. Bà nhận quà rất vui.","pinyin":"wǒ hé māma qù Běijīng kàn yéye nǎinai ， zhù zài xuéxiào qiánbian de jiǔdiàn 。 wǒmen zhǔnbèi le shuǐguǒ hé yì tiáo lǜsè de kùzi ， xiǎng xiàwǔ sònggěi nǎinai 。 chī wán wǔfàn ， māma ràng wǒ qù xiàmian děng chē ， zìjǐ shàng qù ná lǐwù 。 wǒ zài xiàmian kàn jiàn yéye ， tā shì lái jiē wǒmen de 。 tā shuō nǎinai yǐjīng zuò hǎo cài le ， ràng wǒmen bié zài fàndiàn chī 。 māma xià lái de shíhou ， zhǐ ná le shuǐguǒ ， kùzi hái zài fángjiān lǐ 。 wǒ xiǎng shàng qù ná ， māma shuō tā zhīdào zài nǎr ， ràng wǒ gēn yéye zài zhèlǐ děng yíhuìr 。 zhè cì māma hěn kuài jiù xià lái le ， ná le kùzi hé nǎichá 。 yéye hěn gāoxìng ， shuō ， yǒu shuǐguǒ 、 yǒu nǎichá ， wǎnfàn dōu bú yào zuò le 。 wǒmen zuò chē qù nǎinai jiā ， tā kàn jiàn lǐwù hěn gāoxìng 。","grammar":["Bổ ngữ xu hướng đơn sau động từ chỉ hướng (上/下/进/出/回 + 来/去)","Bổ ngữ xu hướng đơn sau động từ hành động (拿来, 送来)","Cấu trúc nhấn mạnh thời gian 「都……了」"],"questions":[{"id":"H2-R05-2-v2-Q1","question":"我们住在哪儿？","answer":"酒店","options":["书店","桌子下","酒店","桌子前"],"explanation":"Thông tin đối chiếu trong bài: “我和妈妈去北京看爷爷奶奶，住在学校前边的酒店。”","evidence":"我和妈妈去北京看爷爷奶奶，住在学校前边的酒店。"},{"id":"H2-R05-2-v2-Q2","question":"裤子是什么颜色？","answer":"绿色","options":["白色","黑色","红色","绿色"],"explanation":"Thông tin đối chiếu trong bài: “我们准备了水果和一条绿色的裤子，想下午送给奶奶。”","evidence":"我们准备了水果和一条绿色的裤子，想下午送给奶奶。"},{"id":"H2-R05-2-v2-Q3","question":"谁来接我们？","answer":"爷爷","options":["爷爷","中国学生","外国学生","朋友的妈妈"],"explanation":"Thông tin đối chiếu trong bài: “我在下面看见爷爷，他是来接我们的。”","evidence":"我在下面看见爷爷，他是来接我们的。"},{"id":"H2-R05-2-v2-Q4","question":"谁已经做好菜？","answer":"奶奶","options":["她","奶奶","我们","爸爸"],"explanation":"Thông tin đối chiếu trong bài: “他说奶奶已经做好菜了，让我们别在饭店吃。”","evidence":"他说奶奶已经做好菜了，让我们别在饭店吃。"},{"id":"H2-R05-2-v2-Q5","question":"妈妈第一次下来拿了什么？","answer":"水果","options":["一杯水","鸡蛋","水果","面包"],"explanation":"Thông tin đối chiếu trong bài: “妈妈下来的时候，只拿了水果，裤子还在房间里。”","evidence":"妈妈下来的时候，只拿了水果，裤子还在房间里。"},{"id":"H2-R05-2-v2-Q6","question":"裤子还在哪儿？","answer":"房间里","options":["电影院","医院","店里","房间里"],"explanation":"Thông tin đối chiếu trong bài: “妈妈下来的时候，只拿了水果，裤子还在房间里。”","evidence":"妈妈下来的时候，只拿了水果，裤子还在房间里。"}]},{"id":"H2-R05-3","lesson":5,"revision":2,"title":"Đem sách xuống cho bạn","text":"朋友给我打电话，说已经到学校下面了，让我拿两本中文书下去。我正在房间里准备明天的课，现在找不到他的书。我给他回电话，让他上来一起找。他说不能上来，爷爷奶奶还在车里等他，要一起去旅游。我就让妹妹帮忙。妹妹知道书在哪儿，在书包里拿了书给我。我一看，只有一本是他的，一本是我的。我再找了找，第二本在桌子下。这次我拿对了，下去给朋友。他谢谢我，还送我一杯奶茶。回到房间，我想今天要好好看看自己的书，准备好自己的课。","translation":"Bạn gọi nói đã đến phía dưới trường, nhờ tôi đem hai quyển sách tiếng Trung xuống. Tôi đang chuẩn bị bài mai, chưa tìm được nên mời bạn lên cùng tìm. Bạn không lên được vì ông bà đang đợi trong xe để đi du lịch. Tôi nhờ em gái giúp. Em nhớ sách ở trong cặp nên lấy ra cho tôi. Chỉ một quyển của bạn, quyển kia của tôi; quyển còn lại ở dưới bàn. Tìm đúng tôi nhanh xuống đưa bạn. Bạn cảm ơn và cho tôi trà sữa. Trở lại phòng tôi muốn sắp xếp sách của mình và chuẩn bị bài cho tốt.","pinyin":"péngyou gěi wǒ dǎ diànhuà ， shuō yǐjīng dào xuéxiào xiàmian le ， ràng wǒ ná liǎng běn Zhōngwén shū xià qù 。 wǒ zhèngzài fángjiān lǐ zhǔnbèi míngtiān de kè ， xiànzài zhǎo bù dào tā de shū 。 wǒ gěi tā huí diànhuà ， ràng tā shàng lái yìqǐ zhǎo 。 tā shuō bù néng shàng lái ， yéye nǎinai hái zài chē lǐ děng tā ， yào yìqǐ qù lǚyóu 。 wǒ jiù ràng mèimei bāngmáng 。 mèimei zhīdào shū zài nǎr ， zài shūbāo lǐ ná le shū gěi wǒ 。 wǒ yī kàn ， zhǐ yǒu yī běn shì tā de ， yī běn shì wǒ de 。 wǒ zài zhǎo le zhǎo ， dì èr běn zài zhuōzi xià 。 zhè cì wǒ ná duì le ， xià qù gěi péngyou 。 tā xièxie wǒ ， hái sòng wǒ yī bēi nǎichá 。 huídào fángjiān ， wǒ xiǎng jīntiān yào hǎo hǎokàn kàn zìjǐ de shū ， zhǔnbèi hǎo zìjǐ de kè 。","grammar":["Bổ ngữ xu hướng đơn sau động từ chỉ hướng (上/下/进/出/回 + 来/去)","Bổ ngữ xu hướng đơn sau động từ hành động (拿来, 送来)","Cấu trúc nhấn mạnh thời gian 「都……了」"],"questions":[{"id":"H2-R05-3-v2-Q1","question":"朋友让我拿几本书？","answer":"两本","options":["十本","三本","两本","五本"],"explanation":"Thông tin đối chiếu trong bài: “朋友给我打电话，说已经到学校下面了，让我拿两本中文书下去。”","evidence":"朋友给我打电话，说已经到学校下面了，让我拿两本中文书下去。"},{"id":"H2-R05-3-v2-Q2","question":"谁在车里等朋友？","answer":"爷爷奶奶","options":["爸爸","妈妈","哥哥","爷爷奶奶"],"explanation":"Thông tin đối chiếu trong bài: “他说不能上来，爷爷奶奶还在车里等他，要一起去旅游。”","evidence":"他说不能上来，爷爷奶奶还在车里等他，要一起去旅游。"},{"id":"H2-R05-3-v2-Q3","question":"我请谁帮忙找书？","answer":"妹妹","options":["妹妹","我们","爸爸","妈妈"],"explanation":"Thông tin đối chiếu trong bài: “我就让妹妹帮忙。”","evidence":"我就让妹妹帮忙。"},{"id":"H2-R05-3-v2-Q4","question":"朋友的第二本书在哪儿？","answer":"桌子下","options":["机场","桌子下","超市前","书店外"],"explanation":"Thông tin đối chiếu trong bài: “我再找了找，第二本在桌子下。”","evidence":"我再找了找，第二本在桌子下。"},{"id":"H2-R05-3-v2-Q5","question":"我拿对书后上去还是下去？","answer":"下去","options":["送书","找书","下去","介绍意思"],"explanation":"Thông tin đối chiếu trong bài: “朋友给我打电话，说已经到学校下面了，让我拿两本中文书下去。”","evidence":"朋友给我打电话，说已经到学校下面了，让我拿两本中文书下去。"},{"id":"H2-R05-3-v2-Q6","question":"朋友送我什么？","answer":"奶茶","options":["鸡蛋","面包","面包和牛奶","奶茶"],"explanation":"Thông tin đối chiếu trong bài: “他谢谢我，还送我一杯奶茶。”","evidence":"他谢谢我，还送我一杯奶茶。"}]},{"id":"H2-R05-4","lesson":5,"revision":2,"title":"Mời bà vào lớp học","text":"奶奶今天跟我来学校。她没看过我们的教室，想看看我在哪儿学中文。我们到的时候，同学们已经在里上课了。我想在下面等下课，老师看见我们，让奶奶进来坐。奶奶有点儿不好意思，说自己不是学生，不能帮忙。老师说可以给大家介绍家里的菜。同学们都很高兴，问奶奶会不会做饺子。下课后，我们一起去学校的饭店。奶奶说面条儿不贵，就想吃面条儿。吃完后，她问书店在上边还是下面。我和她上去买书，她给我买了一本，还说回家后要让我读给爷爷听。今天这次上课，我很喜欢。","translation":"Hôm nay bà cùng tôi đến trường vì chưa xem lớp học tiếng Trung của tôi. Đến nơi các bạn đang học. Tôi định đợi tan học ở dưới nhưng giáo viên mời bà vào ngồi. Bà ngại vì không phải học sinh, cũng không biết giúp gì. Cô nhờ bà giới thiệu món ăn ở nhà, các bạn hào hứng hỏi có biết làm sủi cảo không. Tan học tôi đưa bà đến quán trong trường ăn mì. Bà chọn mì vì không đắt. Sau bữa ăn bà hỏi hiệu sách ở trên hay dưới, tôi đưa bà lên mua sách. Bà mua cho tôi một quyển để về đọc cho ông nghe. Tôi rất thích buổi học này.","pinyin":"nǎinai jīntiān gēn wǒ lái xuéxiào 。 tā méi kàn guò wǒmen de jiàoshì ， xiǎng kàn kàn wǒ zài nǎr xué Zhōngwén 。 wǒmen dào de shíhou ， tóngxué men yǐjīng zài lǐ shàngkè le 。 wǒ xiǎng zài xiàmian děng xià kè ， lǎoshī kàn jiàn wǒmen ， ràng nǎinai jìnlái zuò 。 nǎinai yǒudiǎnr bù hǎo yìsi ， shuō zìjǐ bù shì xuésheng ， bù néng bāngmáng 。 lǎoshī shuō kěyǐ gěi dàjiā jièshào jiālǐ de cài 。 tóngxué men dōu hěn gāoxìng ， wèn nǎinai huì bù huì zuò jiǎozi 。 xià kè hòu ， wǒmen yìqǐ qù xuéxiào de fàndiàn 。 nǎinai shuō miàntiáor bù guì ， jiù xiǎng chī miàntiáor 。 chī wán hòu ， tā wèn shūdiàn zài shàngbiān háishi xiàmian 。 wǒ hé tā shàng qù mǎi shū ， tā gěi wǒ mǎi le yī běn ， hái shuō huíjiā hòu yào ràng wǒ dú gěi yéye tīng 。 jīntiān zhè cì shàngkè ， wǒ hěn xǐhuan 。","grammar":["Bổ ngữ xu hướng đơn sau động từ chỉ hướng (上/下/进/出/回 + 来/去)","Bổ ngữ xu hướng đơn sau động từ hành động (拿来, 送来)","Cấu trúc nhấn mạnh thời gian 「都……了」"],"questions":[{"id":"H2-R05-4-v2-Q1","question":"谁今天跟我来学校？","answer":"奶奶","options":["女儿","他","奶奶","弟弟"],"explanation":"Thông tin đối chiếu trong bài: “奶奶今天跟我来学校。”","evidence":"奶奶今天跟我来学校。"},{"id":"H2-R05-4-v2-Q2","question":"我们到的时候同学们做什么？","answer":"上课","options":["认识","做饭","做菜","上课"],"explanation":"Thông tin đối chiếu trong bài: “我们到的时候，同学们已经在里上课了。”","evidence":"我们到的时候，同学们已经在里上课了。"},{"id":"H2-R05-4-v2-Q3","question":"谁让奶奶进来？","answer":"老师","options":["老师","家人","中国人","法国人"],"explanation":"Thông tin đối chiếu trong bài: “我想在下面等下课，老师看见我们，让奶奶进来坐。”","evidence":"我想在下面等下课，老师看见我们，让奶奶进来坐。"},{"id":"H2-R05-4-v2-Q4","question":"同学们问奶奶会不会做什么？","answer":"饺子","options":["茶","饺子","热牛奶","一杯水"],"explanation":"Thông tin đối chiếu trong bài: “同学们都很高兴，问奶奶会不会做饺子。”","evidence":"同学们都很高兴，问奶奶会不会做饺子。"},{"id":"H2-R05-4-v2-Q5","question":"我们午饭吃什么？","answer":"面条儿","options":["鸡蛋","面包","面条儿","奶茶"],"explanation":"Thông tin đối chiếu trong bài: “奶奶说面条儿不贵，就想吃面条儿。”","evidence":"奶奶说面条儿不贵，就想吃面条儿。"},{"id":"H2-R05-4-v2-Q6","question":"奶奶让我回家读给谁听？","answer":"爷爷","options":["家人","中国人","法国人","爷爷"],"explanation":"Thông tin đối chiếu trong bài: “我和她上去买书，她给我买了一本，还说回家后要让我读给爷爷听。”","evidence":"我和她上去买书，她给我买了一本，还说回家后要让我读给爷爷听。"}]},{"id":"H2-R05-5","lesson":5,"revision":2,"title":"Chuyển giờ gặp ở khách sạn","text":"我和朋友说好下午三点在酒店下面见。我想给他送礼物，是他喜欢的中文书。两点半，他打电话说还在上班，要四点回来。我已经准备出去，就想去学校书店看看。书店的老师正在给外国学生介绍一本书，让我也听一听。我看了看时间，已经三点半了，就给朋友打电话。他说现在快到酒店了，让我别在下面等，上去他的房间坐。我三点五十分到酒店，他还没回来。我坐在下面喝奶茶，四点他过来接我上去。我们看了书，准备去吃晚饭。这次只等了十分钟，礼物他也很喜欢。","translation":"Tôi hẹn bạn ba giờ chiều ở dưới khách sạn để tặng cuốn sách tiếng Trung bạn thích. Hai giờ rưỡi bạn gọi báo còn làm việc, bốn giờ mới về. Tôi đã chuẩn bị đi nên ghé hiệu sách trường. Giáo viên đang giới thiệu sách cho học sinh nước ngoài và mời tôi cùng nghe. Ba giờ rưỡi tôi gọi lại; bạn nói sắp đến khách sạn, bảo lên phòng ngồi thay vì đợi dưới. Ba giờ năm mươi tôi đến nhưng bạn chưa về nên ngồi uống trà sữa phía dưới. Bốn giờ bạn xuống đón lên. Chúng tôi xem sách rồi chuẩn bị ăn tối. Không phải chờ quá lâu và bạn rất thích quà.","pinyin":"wǒ hé péngyou shuō hǎo xiàwǔ sān diǎn zài jiǔdiàn xiàmian jiàn 。 wǒ xiǎng gěi tā sòng lǐwù ， shì tā xǐhuan de Zhōngwén shū 。 liǎng diǎn bàn ， tā dǎ diànhuà shuō hái zài shàngbān ， yào sì diǎn huí lái 。 wǒ yǐjīng zhǔnbèi chūqù ， jiù xiǎng qù xuéxiào shūdiàn kàn kàn 。 shūdiàn de lǎoshī zhèngzài gěi wàiguó xuésheng jièshào yī běn shū ， ràng wǒ yě tīng yī tīng 。 wǒ kàn le kàn shíjiān ， yǐjīng sān diǎn bàn le ， jiù gěi péngyou dǎ diànhuà 。 tā shuō xiànzài kuài dào jiǔdiàn le ， ràng wǒ bié zài xiàmian děng ， shàng qù tā de fángjiān zuò 。 wǒ sān diǎn wǔ shífēn dào jiǔdiàn ， tā hái méi huí lái 。 wǒ zuò zài xiàmian hē nǎichá ， sì diǎn tā guòlai jiē wǒ shàng qù 。 wǒmen kàn le shū ， zhǔnbèi qù chī wǎnfàn 。 zhè cì zhǐ děng le shífēn zhōng ， lǐwù tā yě hěn xǐhuan 。","grammar":["Bổ ngữ xu hướng đơn sau động từ chỉ hướng (上/下/进/出/回 + 来/去)","Bổ ngữ xu hướng đơn sau động từ hành động (拿来, 送来)","Cấu trúc nhấn mạnh thời gian 「都……了」"],"questions":[{"id":"H2-R05-5-v2-Q1","question":"我们过去想几点见？","answer":"三点","options":["九点二十分","五点半","三点","五点"],"explanation":"Thông tin đối chiếu trong bài: “我和朋友说好下午三点在酒店下面见。”","evidence":"我和朋友说好下午三点在酒店下面见。"},{"id":"H2-R05-5-v2-Q2","question":"我准备送什么？","answer":"中文书","options":["杯子","一个杯子","一本书","中文书"],"explanation":"Thông tin đối chiếu trong bài: “我想给他送礼物，是他喜欢的中文书。”","evidence":"我想给他送礼物，是他喜欢的中文书。"},{"id":"H2-R05-5-v2-Q3","question":"朋友要几点回来？","answer":"四点","options":["四点","下午两点","一点半","两点半"],"explanation":"Thông tin đối chiếu trong bài: “两点半，他打电话说还在上班，要四点回来。”","evidence":"两点半，他打电话说还在上班，要四点回来。"},{"id":"H2-R05-5-v2-Q4","question":"我在学校哪儿听介绍？","answer":"书店","options":["公司","书店","医院前边","北京"],"explanation":"Thông tin đối chiếu trong bài: “书店的老师正在给外国学生介绍一本书，让我也听一听。”","evidence":"书店的老师正在给外国学生介绍一本书，让我也听一听。"},{"id":"H2-R05-5-v2-Q5","question":"我几点到酒店？","answer":"三点五十分","options":["九点二十分","五点半","三点五十分","五点"],"explanation":"Thông tin đối chiếu trong bài: “我三点五十分到酒店，他还没回来。”","evidence":"我三点五十分到酒店，他还没回来。"},{"id":"H2-R05-5-v2-Q6","question":"朋友接我上去前我喝什么？","answer":"奶茶","options":["米饭和菜","苹果","水果","奶茶"],"explanation":"Thông tin đối chiếu trong bài: “我坐在下面喝奶茶，四点他过来接我上去。”","evidence":"我坐在下面喝奶茶，四点他过来接我上去。"}]},{"id":"H2-R06-1","lesson":6,"revision":2,"title":"Bức tranh làm quà sinh nhật","text":"明天是妈妈的先生日。我和妹妹没有去商场买礼物，想自己画画送给她。妹妹画学校，我画一条鱼。我们的画笔有红色、绿色和黑色，妈妈喜欢的颜色是红色。下午妈妈下班回来，我们还没有画完，就让爸爸请她去下面走走。爸爸很高兴，和妈妈出去买菜了。我们快快地画，六点半就做好了礼物。妈妈回来的时候，觉得很不好意思，让大家等她吃饭。我们给她看画，说生日快乐。她很高兴，说这条鱼真长，学校也很好看。晚上我们一起吃了蛋糕，妈妈没有只吃一半，她说今天可以多吃一点儿。","translation":"Mai là sinh nhật mẹ. Tôi và em gái không mua quà mà tự vẽ tranh: em vẽ trường, tôi vẽ một con cá. Bút có màu đỏ, xanh, đen; mẹ thích đỏ. Chiều mẹ về chúng tôi chưa vẽ xong nên nhờ bố rủ mẹ xuống đi dạo. Bố vui vẻ cùng mẹ ra mua rau. Chúng tôi vẽ nhanh, sáu giờ rưỡi xong quà. Mẹ về còn ngại vì mọi người phải đợi ăn tối. Chúng tôi đưa tranh và chúc sinh nhật vui vẻ. Mẹ cười, khen con cá dài và trường đẹp. Tối cả nhà ăn bánh kem; mẹ không chỉ ăn nửa phần mà cho phép mình ăn thêm một chút.","pinyin":"míngtiān shì māma de xiānsheng rì 。 wǒ hé mèimei méiyǒu qù shāngchǎng mǎi lǐwù ， xiǎng zìjǐ huà huà sònggěi tā 。 mèimei huà xuéxiào ， wǒ huà yì tiáo yú 。 wǒmen de huàbǐ yǒu hóngsè 、 lǜsè hé hēisè ， māma xǐhuan de yánsè shì hóngsè 。 xiàwǔ māma xiàbān huí lái ， wǒmen hái méiyǒu huà wán ， jiù ràng bàba qǐng tā qù xiàmian zǒu zǒu 。 bàba hěn gāoxìng ， hé māma chūqù mǎi cài le 。 wǒmen kuài kuài de huà ， liù diǎn bàn jiù zuò hǎo le lǐwù 。 māma huí lái de shíhou ， juéde hěn bù hǎo yìsi ， ràng dàjiā děng tā chīfàn 。 wǒmen gěi tā kàn huà ， shuō shēngrì kuàilè 。 tā hěn gāoxìng ， shuō zhè tiáo yú zhēn cháng ， xuéxiào yě hěn hǎokàn 。 wǎnshang wǒmen yìqǐ chī le dàngāo ， māma méiyǒu zhǐ chī yíbàn ， tā shuō jīntiān kěyǐ duō chī yìdiǎnr 。","grammar":["Lặp lại tính từ đơn âm tiết","Cấu trúc liệt kê “什么的”","Trợ từ kết cấu 地"],"questions":[{"id":"H2-R06-1-v2-Q1","question":"明天是谁的先生日？","answer":"妈妈","options":["同学","您","大家","妈妈"],"explanation":"Thông tin đối chiếu trong bài: “明天是妈妈的先生日。”","evidence":"明天是妈妈的先生日。"},{"id":"H2-R06-1-v2-Q2","question":"妹妹画什么？","answer":"学校","options":["学校","中国的书","电话的号","菜"],"explanation":"Thông tin đối chiếu trong bài: “妹妹画学校，我画一条鱼。”","evidence":"妹妹画学校，我画一条鱼。"},{"id":"H2-R06-1-v2-Q3","question":"我画什么？","answer":"鱼","options":["画笔","鱼","学校","小的"],"explanation":"Thông tin đối chiếu trong bài: “妹妹画学校，我画一条鱼。”","evidence":"妹妹画学校，我画一条鱼。"},{"id":"H2-R06-1-v2-Q4","question":"爸爸和妈妈出去做什么？","answer":"买菜","options":["坐出租车","上课","买菜","下课"],"explanation":"Thông tin đối chiếu trong bài: “爸爸很高兴，和妈妈出去买菜了。”","evidence":"爸爸很高兴，和妈妈出去买菜了。"},{"id":"H2-R06-1-v2-Q5","question":"礼物几点做好？","answer":"六点半","options":["两点半","十一点半","八点二十分","六点半"],"explanation":"Thông tin đối chiếu trong bài: “我们快快地画，六点半就做好了礼物。”","evidence":"我们快快地画，六点半就做好了礼物。"},{"id":"H2-R06-1-v2-Q6","question":"晚上我们吃了什么？","answer":"蛋糕","options":["蛋糕","菜和饺子","面条儿和菜","菜"],"explanation":"Thông tin đối chiếu trong bài: “晚上我们一起吃了蛋糕，妈妈没有只吃一半，她说今天可以多吃一点儿。”","evidence":"晚上我们一起吃了蛋糕，妈妈没有只吃一半，她说今天可以多吃一点儿。"}]},{"id":"H2-R06-2","lesson":6,"revision":2,"title":"Mua giường cho phòng nhỏ","text":"我和姐姐住一个房间。姐姐的床很长，我的床小，睡觉不太舒服。今天爸爸让我跟他去商场看床。我们看了白色、红色和黑色的床，白色的很漂亮，但太长，房间里没有多大的房间。红色的不长，我觉得不错，爸爸说颜色不太好看。我们还看了黑色的，我坐了坐，觉得很舒服，爸爸也喜欢。售货员说下午可以送到家，让我们在家等。我们回去吃午饭，妈妈做了鱼和肉。饭后我准备房间，拿走床上的书和画笔。下午四点，床送来了。姐姐说现在我的床更舒服，晚上她也想试一试。我说今天让我睡吧！","translation":"Tôi và chị chung phòng. Giường chị dài, giường tôi nhỏ nên ngủ chưa thoải mái. Hôm nay bố đưa tôi đến trung tâm thương mại xem giường. Xem các chiếc trắng, đỏ và đen, chiếc trắng đẹp nhưng quá dài, phòng không đủ chỗ. Chiếc đỏ vừa nhưng bố không thích màu. Tôi ngồi thử chiếc đen thấy rất thoải mái, bố cũng thích. Người bán bảo chiều giao đến nhà nên chúng tôi về đợi. Mẹ nấu cá, thịt ăn trưa. Sau đó tôi dọn sách và bút vẽ khỏi giường để chuẩn bị phòng. Bốn giờ giường mới đến. Chị cũng muốn thử ngủ, tôi xin hôm nay cho tôi ngủ trước.","pinyin":"wǒ hé jiějie zhù yí gè fángjiān 。 jiějie de chuáng hěn cháng ， wǒ de chuáng xiǎo ， shuìjiào bù tài shūfu 。 jīntiān bàba ràng wǒ gēn tā qù shāngchǎng kàn chuáng 。 wǒmen kàn le báisè 、 hóngsè hé hēisè de chuáng ， báisè de hěn piàoliang ， dàn tài cháng ， fángjiān lǐ méiyǒu duō dà de fángjiān 。 hóngsè de bù cháng ， wǒ juéde búcuò ， bàba shuō yánsè bù tài hǎokàn 。 wǒmen hái kàn le hēisè de ， wǒ zuò le zuò ， juéde hěn shūfu ， bàba yě xǐhuan 。 shòuhuòyuán shuō xiàwǔ kěyǐ sòngdào jiā ， ràng wǒmen zàijiā děng 。 wǒmen huí qù chī wǔfàn ， māma zuò le yú hé ròu 。 fàn hòu wǒ zhǔnbèi fángjiān ， ná zǒu chuáng shàng de shū hé huàbǐ 。 xiàwǔ sì diǎn ， chuáng sòng lái le 。 jiějie shuō xiànzài wǒ de chuáng gèng shūfu ， wǎnshang tā yě xiǎng shì yī shì 。 wǒ shuō jīntiān ràng wǒ shuì ba ！","grammar":["Lặp lại tính từ đơn âm tiết","Cấu trúc liệt kê “什么的”","Trợ từ kết cấu 地"],"questions":[{"id":"H2-R06-2-v2-Q1","question":"谁的床很小？","answer":"我","options":["中国学生","外国学生","朋友的妈妈","我"],"explanation":"Thông tin đối chiếu trong bài: “姐姐的床很长，我的床小，睡觉不太舒服。”","evidence":"姐姐的床很长，我的床小，睡觉不太舒服。"},{"id":"H2-R06-2-v2-Q2","question":"我们去哪儿看床？","answer":"商场","options":["商场","家","超市","那边"],"explanation":"Thông tin đối chiếu trong bài: “今天爸爸让我跟他去商场看床。”","evidence":"今天爸爸让我跟他去商场看床。"},{"id":"H2-R06-2-v2-Q3","question":"白色的床怎么样？","answer":"太长","options":["卖","太长","不卖","很好看"],"explanation":"Thông tin đối chiếu trong bài: “我们看了白色、红色和黑色的床，白色的很漂亮，但太长，房间里没有多大的房间。”","evidence":"我们看了白色、红色和黑色的床，白色的很漂亮，但太长，房间里没有多大的房间。"},{"id":"H2-R06-2-v2-Q4","question":"我们买什么颜色的床？","answer":"黑色","options":["绿色","红色","黑色","白色"],"explanation":"Thông tin đối chiếu trong bài: “我们看了白色、红色和黑色的床，白色的很漂亮，但太长，房间里没有多大的房间。”","evidence":"我们看了白色、红色和黑色的床，白色的很漂亮，但太长，房间里没有多大的房间。"},{"id":"H2-R06-2-v2-Q5","question":"午饭妈妈做了什么？","answer":"鱼和肉","options":["冷水","茶","热牛奶","鱼和肉"],"explanation":"Thông tin đối chiếu trong bài: “我们回去吃午饭，妈妈做了鱼和肉。”","evidence":"我们回去吃午饭，妈妈做了鱼和肉。"},{"id":"H2-R06-2-v2-Q6","question":"新床几点送来？","answer":"四点","options":["四点","五点半","三点","五点"],"explanation":"Thông tin đối chiếu trong bài: “下午四点，床送来了。”","evidence":"下午四点，床送来了。"}]},{"id":"H2-R06-3","lesson":6,"revision":2,"title":"Sinh nhật không nhất thiết phải ra quán","text":"朋友想在饭店过生日，请了五个同学。那家饭店的鱼很好吃，但一条鱼要八十元，蛋糕还要很多钱。他给我打电话，说有点儿不好意思，想请大家在家吃。我说在家很好，大家可以一起准备。他妈妈会做肉，我会做鱼，同学可以拿一些水果来。生日那天，我早上就到了他家。他的妹妹正在画画，要送他自己的画。我和他妈妈在做饭，同学们拿来了蛋糕和牛奶。朋友高兴地给大家介绍妹妹的画。我们吃了很多东西，还唱歌。他说家里不太大，但今天很快乐，大家也说下次还可以在家一起过生日。","translation":"Bạn định mừng sinh nhật ở quán, mời năm bạn học. Cá ở đó ngon nhưng tám mươi tệ một con, bánh cũng tốn nhiều tiền nên bạn ngại, gọi hỏi đổi về nhà được không. Tôi đồng ý: mẹ bạn nấu thịt, tôi làm cá, các bạn khác mang trái cây. Hôm sinh nhật tôi đến từ sáng. Em gái bạn đang vẽ tranh tặng anh. Tôi và mẹ bạn nấu ăn, các bạn mang bánh cùng sữa đến. Bạn vui vẻ giới thiệu tranh rồi mọi người ăn uống, ca hát. Dù nhà không quá rộng, bạn vẫn rất vui và các bạn muốn lần sau cùng tổ chức như vậy.","pinyin":"péngyou xiǎng zài fàndiàn guò shēngrì ， qǐng le wǔ gè tóngxué 。 nà jiā fàndiàn de yú hěn hǎochī ， dàn yì tiáo yú yào bā shí yuán ， dàngāo hái yào hěn duō qián 。 tā gěi wǒ dǎ diànhuà ， shuō yǒudiǎnr bù hǎo yìsi ， xiǎng qǐng dàjiā zàijiā chī 。 wǒ shuō zàijiā hěn hǎo ， dàjiā kěyǐ yìqǐ zhǔnbèi 。 tā māma huì zuò ròu ， wǒ huì zuò yú ， tóngxué kěyǐ ná yìxiē shuǐguǒ lái 。 shēngrì nà tiān ， wǒ zǎoshang jiù dào le tā jiā 。 tā de mèimei zhèngzài huà huà ， yào sòng
