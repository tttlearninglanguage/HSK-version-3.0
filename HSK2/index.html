ba 。", "translation": "Chiều có thể mưa, bạn mang ô nhé."}, {"id": "hsk2-13-10", "hanzi": "上网", "pinyin": "shàngwǎng", "meaning": "lên mạng", "example": "我每天上网看十分钟中文新闻。", "examplePinyin": "wǒ měi tiān shàng wǎng kàn shí fēn zhōng zhōng wén xīn wén 。", "translation": "Mỗi ngày tôi lên mạng xem tin tiếng Trung mười phút."}, {"id": "hsk2-13-11", "hanzi": "那样", "pinyin": "nàyàng", "meaning": "như thế", "example": "你那样说，妹妹会难过的。", "examplePinyin": "nǐ nà yàng shuō ， mèi mèi huì nán guò de 。", "translation": "Bạn nói như vậy em gái sẽ buồn đấy."}, {"id": "hsk2-13-12", "hanzi": "告诉", "pinyin": "gàosu", "meaning": "nói cho biết", "example": "请告诉我你的名字。", "examplePinyin": "qǐng gào sù wǒ nǐ de míng zì 。", "translation": "Hãy cho tôi biết tên bạn."}, {"id": "hsk2-13-13", "hanzi": "班", "pinyin": "bān", "meaning": "lớp", "example": "我们班有三个留学生。", "examplePinyin": "wǒ men bān yǒu sān gè liú xué shēng 。", "translation": "Lớp chúng tôi có ba lưu học sinh."}], "grammar": [{"name": "Câu có hai tân ngữ", "details": ["Công thức: Chủ ngữ + Động từ + Tân ngữ gián tiếp + Tân ngữ trực tiếp", "Giải thích: Trong tiếng Trung, một số động từ đặc biệt như 「送」(tặng), 「给」(đưa), 「教」(dạy) có thể kéo theo hai tân ngữ cùng lúc. Tân ngữ đầu tiên thường chỉ người (người nhận), tân ngữ thứ hai thường chỉ vật (vật được nhận). Cấu trúc này giúp câu diễn đạt đầy đủ thông tin về cả người và vật trong cùng một hành động.", "Mẹo: Hãy ghi nhớ các động từ hay gặp trong cấu trúc này như 「送」(tặng), 「借」(cho mượn), 「告诉」(nói với ai đó), 「教」(dạy ai đó).", "Lưu ý: Không phải động từ nào cũng có thể đi với hai tân ngữ, chỉ những động từ mang nghĩa trao đổi hoặc truyền đạt thông tin mới sử dụng được cấu trúc này.", "王老师喜欢花，就送给她花吧。", "wáng lǎo shī xǐ huān huā jiù sòng gěi tā huā ba", "Thầy Vương thích hoa, vậy tặng hoa cho thầy ấy đi.", "她拿给我一杯水。", "tā ná gěi wǒ yī bēi shuǐ", "Cô ấy mang cho tôi một ly nước.", "Ví dụ: 王老师喜欢花，就送给她花吧。"]}, {"name": "Câu so sánh 比 với số lượng chênh lệch cụ thể", "details": ["Công thức: A + 比 + B + Tính từ + Số lượng chênh lệch", "Giải thích: Cấu trúc này dùng để so sánh sự khác biệt giữa hai đối tượng A và B. Từ 「比」 đóng vai trò như từ 'hơn' trong tiếng Việt, đặt ngay trước đối tượng được so sánh.", "Mẹo: Nếu muốn nhấn mạnh mức độ chênh lệch, bạn có thể thêm các từ chỉ mức độ như 「更」 hoặc 「还」 vào trước tính từ.", "Lưu ý: Không được dùng 「很」 hay các từ chỉ mức độ khác ngay trước tính từ trong câu so sánh với 「比」.", "今天的词比昨天多了十个。", "jīn tiān de cí bǐ zuó tiān duō le shí gè", "Từ vựng hôm nay nhiều hơn hôm qua mười từ.", "姐姐比我大三岁。", "jiě jiě bǐ wǒ dà sān suì", "Chị gái lớn hơn tôi ba tuổi.", "Ví dụ: 今天的词比昨天多了十个。"]}, {"name": "Câu so sánh 比 với mức chênh lệch nhỏ (一点儿/一些)", "details": ["Công thức: A + 比 + B + Tính từ + 一点儿/一些", "Giải thích: Cấu trúc này dùng để so sánh sự chênh lệch giữa hai đối tượng A và B. Trong đó, 「比」 đóng vai trò là giới từ chỉ sự so sánh, đặt giữa hai đối tượng cần so sánh.", "Mẹo: Bạn có thể thêm các phó từ như 「更」 hoặc 「还」 trước tính từ để nhấn mạnh thêm mức độ so sánh.", "Lưu ý: Tuyệt đối không dùng 「很」, 「非常」 trước tính từ trong câu so sánh với 「比」.", "这个本子比我们一起买的那个贵一点儿。", "zhè ge běn zi bǐ wǒ men yī qǐ mǎi de nà ge guì yī diǎnr", "Quyển vở này đắt hơn quyển chúng ta cùng mua một chút.", "姐姐比我高一点儿。", "jiě jiě bǐ wǒ gāo yī diǎn ér", "Chị gái cao hơn tôi một chút.", "那间教室比这间大一些。", "nà jiān jiào shì bǐ zhè jiān dà yī xiē", "Phòng học kia lớn hơn phòng này một chút.", "Ví dụ: 这个本子比我们一起买的那个贵一点儿。"]}], "extended": [], "structuredGrammar": [{"name": "Câu có hai tân ngữ", "formula": "Chủ ngữ + Động từ + Tân ngữ gián tiếp + Tân ngữ trực tiếp", "explanation": "Trong tiếng Trung, một số động từ đặc biệt như 「送」(tặng), 「给」(đưa), 「教」(dạy) có thể kéo theo hai tân ngữ cùng lúc. Tân ngữ đầu tiên thường chỉ người (người nhận), tân ngữ thứ hai thường chỉ vật (vật được nhận). Cấu trúc này giúp câu diễn đạt đầy đủ thông tin về cả người và vật trong cùng một hành động.", "tip": "Hãy ghi nhớ các động từ hay gặp trong cấu trúc này như 「送」(tặng), 「借」(cho mượn), 「告诉」(nói với ai đó), 「教」(dạy ai đó).", "note": "Không phải động từ nào cũng có thể đi với hai tân ngữ, chỉ những động từ mang nghĩa trao đổi hoặc truyền đạt thông tin mới sử dụng được cấu trúc này.", "examples": [{"zh": "王老师喜欢花，就送给她花吧。", "pinyin": "wáng lǎo shī xǐ huān huā jiù sòng gěi tā huā ba", "vi": "Thầy Vương thích hoa, vậy tặng hoa cho thầy ấy đi."}, {"zh": "她拿给我一杯水。", "pinyin": "tā ná gěi wǒ yī bēi shuǐ", "vi": "Cô ấy mang cho tôi một ly nước."}], "newExamples": [{"zh": "小林给小雨一本书，希望小雨喜欢。", "pinyin": "xiǎo lín gěi xiǎo yǔ yī běn shū ， xī wàng xiǎo yǔ xǐ huān 。", "vi": "小林 đưa 小雨 một quyển sách, hy vọng 小雨 thích."}, {"zh": "小林教小雨中文，小雨学得很认真。", "pinyin": "xiǎo lín jiào xiǎo yǔ zhōng wén ， xiǎo yǔ xué de hěn rèn zhēn 。", "vi": "小林 dạy 小雨 tiếng Trung, 小雨 học rất chăm chú."}]}, {"name": "Câu so sánh 比 với số lượng chênh lệch cụ thể", "formula": "A + 比 + B + Tính từ + Số lượng chênh lệch", "explanation": "Cấu trúc này dùng để so sánh sự khác biệt giữa hai đối tượng A và B. Từ 「比」 đóng vai trò như từ 'hơn' trong tiếng Việt, đặt ngay trước đối tượng được so sánh.", "tip": "Nếu muốn nhấn mạnh mức độ chênh lệch, bạn có thể thêm các từ chỉ mức độ như 「更」 hoặc 「还」 vào trước tính từ.", "note": "Không được dùng 「很」 hay các từ chỉ mức độ khác ngay trước tính từ trong câu so sánh với 「比」.", "examples": [{"zh": "今天的词比昨天多了十个。", "pinyin": "jīn tiān de cí bǐ zuó tiān duō le shí gè", "vi": "Từ vựng hôm nay nhiều hơn hôm qua mười từ."}, {"zh": "姐姐比我大三岁。", "pinyin": "jiě jiě bǐ wǒ dà sān suì", "vi": "Chị gái lớn hơn tôi ba tuổi."}], "newExamples": [{"zh": "小林十五岁，小雨十二岁，小林比小雨大三岁。", "pinyin": "xiǎo lín shí wǔ suì ， xiǎo yǔ shí èr suì ， xiǎo lín bǐ xiǎo yǔ dà sān suì 。", "vi": "小林 mười lăm tuổi, 小雨 mười hai tuổi, 小林 lớn hơn 小雨 ba tuổi."}, {"zh": "小林的本子二十块，小雨的十块，前者比后者贵十块钱。", "pinyin": "xiǎo lín de běn zi èr shí kuài ， xiǎo yǔ de shí kuài ， qián zhě bǐ hòu zhě guì shí kuài qián 。", "vi": "Vở của 小林 hai mươi tệ, của 小雨 mười tệ, cái trước đắt hơn cái sau mười tệ."}]}, {"name": "Câu so sánh 比 với mức chênh lệch nhỏ (一点儿/一些)", "formula": "A + 比 + B + Tính từ + 一点儿/一些", "explanation": "Cấu trúc này dùng để so sánh sự chênh lệch giữa hai đối tượng A và B. Trong đó, 「比」 đóng vai trò là giới từ chỉ sự so sánh, đặt giữa hai đối tượng cần so sánh.", "tip": "Bạn có thể thêm các phó từ như 「更」 hoặc 「还」 trước tính từ để nhấn mạnh thêm mức độ so sánh.", "note": "Tuyệt đối không dùng 「很」, 「非常」 trước tính từ trong câu so sánh với 「比」.", "examples": [{"zh": "这个本子比我们一起买的那个贵一点儿。", "pinyin": "zhè ge běn zi bǐ wǒ men yī qǐ mǎi de nà ge guì yī diǎnr", "vi": "Quyển vở này đắt hơn quyển chúng ta cùng mua một chút."}, {"zh": "姐姐比我高一点儿。", "pinyin": "jiě jiě bǐ wǒ gāo yī diǎn ér", "vi": "Chị gái cao hơn tôi một chút."}, {"zh": "那间教室比这间大一些。", "pinyin": "nà jiān jiào shì bǐ zhè jiān dà yī xiē", "vi": "Phòng học kia lớn hơn phòng này một chút."}], "newExamples": [{"zh": "小林的书包比小雨的重一点儿，但差别不大。", "pinyin": "xiǎo lín de shū bāo bǐ xiǎo yǔ de zhòng yì diǎn ér ， dàn chā bié bù dà 。", "vi": "Cặp của 小林 nặng hơn của 小雨 một chút, nhưng chênh lệch không lớn."}, {"zh": "小林的房间比小雨的大一些，只多两平方米。", "pinyin": "xiǎo lín de fáng jiān bǐ xiǎo yǔ de dà yī xiē ， zhǐ duō liǎng píng fāng mǐ 。", "vi": "Phòng 小林 lớn hơn phòng 小雨 một chút, chỉ hơn hai mét vuông."}]}]}, {"id": 14, "title": "Bạn mới đến chơi", "subtitle": "站 · 包 · 过年 · 没意思", "words": [{"id": "hsk2-14-01", "hanzi": "站", "pinyin": "zhàn", "meaning": "đứng", "example": "请站在黄线后面等车。", "examplePinyin": "qǐng zhàn zài huáng xiàn hòu miàn děng chē 。", "translation": "Hãy đứng sau vạch vàng chờ xe."}, {"id": "hsk2-14-02", "hanzi": "包", "pinyin": "bāo", "meaning": "gói, túi", "example": "这个包有点儿重，我帮你拿吧。", "examplePinyin": "zhè ge bāo yǒu diǎn ér zhòng ， wǒ bāng nǐ ná ba 。", "translation": "Túi này hơi nặng, để tôi cầm giúp bạn nhé."}, {"id": "hsk2-14-03", "hanzi": "过年", "pinyin": "guònián", "meaning": "đón Tết", "example": "今年我们回老家过年。", "examplePinyin": "jīn nián wǒ men huí lǎo jiā guò nián 。", "translation": "Năm nay chúng tôi về quê ăn Tết."}, {"id": "hsk2-14-04", "hanzi": "没意思", "pinyin": "méi yìsi", "meaning": "chán", "example": "一个人在家看电视真没意思。", "examplePinyin": "yí gè rén zài jiā kàn diàn shì zhēn méi yì si 。", "translation": "Xem tivi ở nhà một mình thật chán."}, {"id": "hsk2-14-05", "hanzi": "位", "pinyin": "wèi", "meaning": "lượng từ lịch sự", "example": "这位先生是我们的新老师。", "examplePinyin": "zhè wèi xiān shēng shì wǒ men de xīn lǎo shī 。", "translation": "Vị này là thầy giáo mới của chúng tôi."}, {"id": "hsk2-14-06", "hanzi": "前面", "pinyin": "qiánmiàn", "meaning": "phía trước", "example": "前面走过来一位拿着雨伞的老师。", "examplePinyin": "qián miàn zǒu guò lái yī wèi ná zhe yǔ sǎn de lǎo shī 。", "translation": "Phía trước có một thầy giáo cầm ô đi tới."}, {"id": "hsk2-14-07", "hanzi": "房子", "pinyin": "fángzi", "meaning": "nhà", "example": "这所房子比我们以前住的大一些。", "examplePinyin": "zhè suǒ fáng zi bǐ wǒ men yǐ qián zhù de dà yī xiē 。", "translation": "Ngôi nhà này lớn hơn ngôi chúng tôi ở trước đây một chút."}, {"id": "hsk2-14-08", "hanzi": "小孩儿", "pinyin": "xiǎoháir", "meaning": "trẻ con", "example": "公园里有几个小孩儿正在玩。", "examplePinyin": "gōng yuán lǐ yǒu jǐ gè xiǎo hái ér zhèng zài wán 。", "translation": "Trong công viên có mấy đứa trẻ đang chơi."}, {"id": "hsk2-14-09", "hanzi": "女孩儿", "pinyin": "nǚháir", "meaning": "bé gái", "example": "那个穿红衣服的女孩儿正在跳舞。", "examplePinyin": "nà ge chuān hóng yī fú de nǚ hái ér zhèng zài tiào wǔ 。", "translation": "Cô bé mặc áo đỏ kia đang nhảy múa."}, {"id": "hsk2-14-10", "hanzi": "姓", "pinyin": "xìng", "meaning": "họ", "example": "我姓李，你贵姓？", "examplePinyin": "wǒ xìng lǐ ， nǐ guì xìng ？", "translation": "Tôi họ Lý, xin hỏi bạn họ gì?"}, {"id": "hsk2-14-11", "hanzi": "眼睛", "pinyin": "yǎnjing", "meaning": "mắt", "example": "妹妹的眼睛又大又亮。", "examplePinyin": "mèi mèi de yǎn jīng yòu dà yòu liàng 。", "translation": "Mắt em gái vừa to vừa sáng."}, {"id": "hsk2-14-12", "hanzi": "跳舞", "pinyin": "tiàowǔ", "meaning": "nhảy múa", "example": "妈妈一有时间就去公园跳舞。", "examplePinyin": "mā mā yī yǒu shí jiān jiù qù gōng yuán tiào wǔ 。", "translation": "Mẹ cứ có thời gian là đến công viên nhảy múa."}], "grammar": [{"name": "Câu tồn tại chỉ sự xuất hiện hoặc biến mất", "details": ["Công thức: Địa điểm + Động từ + (了/着) + Danh từ", "Giải thích: Câu tồn tại không chỉ dùng để nói về sự tồn tại, mà còn để miêu tả sự xuất hiện hoặc biến mất của người/vật tại một nơi nào đó. Cấu trúc này giúp người nghe hình dung rõ bối cảnh không gian nơi sự việc đang diễn ra.", "Mẹo: Hãy chú ý dùng thêm 「了」 hoặc 「着」 sau động từ để làm rõ trạng thái của sự việc (đã xuất hiện hoặc đang tồn tại).", "Lưu ý: Trong câu này, danh từ ở cuối câu thường không xác định (ví dụ: một cái bàn, vài người), không nên dùng các từ chỉ danh từ cụ thể hay đại từ riêng.", "你家楼下站着一个人。", "nǐ jiā lóu xià zhàn zhe yī gè rén", "Dưới lầu nhà bạn có một người đang đứng.", "前面走过来一个人。", "qián miàn zǒu guò lái yī gè rén", "Phía trước có một người đi tới.", "那间教室里坐着不少学生。", "nà jiān jiào shì lǐ zuò zhe bù shǎo xué shēng", "Trong phòng học kia có khá nhiều học sinh đang ngồi.", "我们班走了两个学生。", "wǒ men bān zǒu le liǎng gè xué shēng", "Lớp chúng tôi có hai học sinh đã chuyển đi.", "Ví dụ: 你家楼下站着一个人。"]}, {"name": "Đại từ nghi vấn 多 hỏi mức độ", "details": ["Công thức: Chủ ngữ + 多 + Tính từ (大, 高, 远,...) ?", "Giải thích: Trong tiếng Trung, 「多」 được dùng trước tính từ để hỏi về mức độ của sự vật, sự việc như tuổi tác, chiều cao hoặc khoảng cách. Khi trả lời câu hỏi này, bạn cần cung cấp một con số hoặc thông tin cụ thể thay vì dùng tính từ.", "Mẹo: Hãy ghi nhớ cấu trúc 「多」 + tính từ để đặt câu hỏi về quy mô hoặc kích thước, ví dụ: 「你多大？」 (Bạn bao nhiêu tuổi?).", "Lưu ý: Đừng nhầm lẫn 「多」 trong trường hợp này với nghĩa là \"nhiều\" (số lượng); ở đây nó đóng vai trò là đại từ nghi vấn về mức độ.", "你一个人在这儿多没意思啊！", "nǐ yī gè rén zài zhè ér duō méi yì sī a", "Một mình bạn ở đây thật là chẳng thú vị gì cả!", "多好看啊！买这件吧。", "duō hǎo kàn a mǎi zhè jiàn ba", "Đẹp biết bao! Mua bộ này đi.", "Ví dụ: 你一个人在这儿多没意思啊！"]}, {"name": "Bổ ngữ xu hướng phức hợp", "details": ["Công thức: Động từ + (上/下/进/出/回/过/起) + 来/去", "Giải thích: Bổ ngữ xu hướng phức hợp gồm một động từ chỉ phương hướng kết hợp với 「来」 (lại đây) hoặc 「去」 (đi tới đó). Cấu trúc này dùng để mô tả hướng di chuyển của hành động một cách chi tiết hơn. Ví dụ 「走进来」 nghĩa là đi vào đây, 「走进去」 nghĩa là đi vào đó.", "Mẹo: Nếu câu có tân ngữ là nơi chốn, hãy đặt tân ngữ vào giữa bổ ngữ xu hướng, ví dụ 「走进教室来」.", "Lưu ý: Chú ý phân biệt giữa 「来」 (hướng về phía người nói) và 「去」 (hướng xa khỏi người nói) để sử dụng chính xác.", "她经常跑上来找我玩儿。", "tā jīng cháng pǎo shàng lái zhǎo wǒ wán ér", "Cô ấy thường xuyên chạy lên đây tìm tôi chơi.", "楼不高，我们走上去吧。", "lóu bù gāo wǒ men zǒu shàng qù ba", "Lầu không cao, chúng ta đi bộ lên đi.", "一听到老师叫他的名字，他就站起来了。", "yī tīng dào lǎo shī jiào tā de míng zì tā jiù zhàn qǐ lái le", "Vừa nghe thấy thầy giáo gọi tên mình, anh ấy liền đứng dậy.", "Ví dụ: 她经常跑上来找我玩儿。"]}], "extended": [], "structuredGrammar": [{"name": "Câu tồn tại chỉ sự xuất hiện hoặc biến mất", "formula": "Địa điểm + Động từ + (了/着) + Danh từ", "explanation": "Câu tồn tại không chỉ dùng để nói về sự tồn tại, mà còn để miêu tả sự xuất hiện hoặc biến mất của người/vật tại một nơi nào đó. Cấu trúc này giúp người nghe hình dung rõ bối cảnh không gian nơi sự việc đang diễn ra.", "tip": "Hãy chú ý dùng thêm 「了」 hoặc 「着」 sau động từ để làm rõ trạng thái của sự việc (đã xuất hiện hoặc đang tồn tại).", "note": "Trong câu này, danh từ ở cuối câu thường không xác định (ví dụ: một cái bàn, vài người), không nên dùng các từ chỉ danh từ cụ thể hay đại từ riêng.", "examples": [{"zh": "你家楼下站着一个人。", "pinyin": "nǐ jiā lóu xià zhàn zhe yī gè rén", "vi": "Dưới lầu nhà bạn có một người đang đứng."}, {"zh": "前面走过来一个人。", "pinyin": "qián miàn zǒu guò lái yī gè rén", "vi": "Phía trước có một người đi tới."}, {"zh": "那间教室里坐着不少学生。", "pinyin": "nà jiān jiào shì lǐ zuò zhe bù shǎo xué shēng", "vi": "Trong phòng học kia có khá nhiều học sinh đang ngồi."}, {"zh": "我们班走了两个学生。", "pinyin": "wǒ men bān zǒu le liǎng gè xué shēng", "vi": "Lớp chúng tôi có hai học sinh đã chuyển đi."}], "newExamples": [{"zh": "小林家楼下站着一个人，是小雨。", "pinyin": "xiǎo lín jiā lóu xià zhàn zhe yí gè rén ， shì xiǎo yǔ 。", "vi": "Dưới lầu nhà 小林 có một người đang đứng, đó là 小雨."}, {"zh": "小林说：“门口来了一位客人。”", "pinyin": "xiǎo lín shuō ： “ mén kǒu lái le yī wèi kè rén 。 ”", "vi": "小林 nói: “Ở cửa có một vị khách đến rồi.”"}]}, {"name": "Đại từ nghi vấn 多 hỏi mức độ", "formula": "Chủ ngữ + 多 + Tính từ (大, 高, 远,...) ?", "explanation": "Trong tiếng Trung, 「多」 được dùng trước tính từ để hỏi về mức độ của sự vật, sự việc như tuổi tác, chiều cao hoặc khoảng cách. Khi trả lời câu hỏi này, bạn cần cung cấp một con số hoặc thông tin cụ thể thay vì dùng tính từ.", "tip": "Hãy ghi nhớ cấu trúc 「多」 + tính từ để đặt câu hỏi về quy mô hoặc kích thước, ví dụ: 「你多大？」 (Bạn bao nhiêu tuổi?).", "note": "Đừng nhầm lẫn 「多」 trong trường hợp này với nghĩa là \"nhiều\" (số lượng); ở đây nó đóng vai trò là đại từ nghi vấn về mức độ.", "examples": [{"zh": "你一个人在这儿多没意思啊！", "pinyin": "nǐ yī gè rén zài zhè ér duō méi yì sī a", "vi": "Một mình bạn ở đây thật là chẳng thú vị gì cả!"}, {"zh": "多好看啊！买这件吧。", "pinyin": "duō hǎo kàn a mǎi zhè jiàn ba", "vi": "Đẹp biết bao! Mua bộ này đi."}], "clarification": "Phân biệt: 多 + tính từ trong câu hỏi như 多大 / 多远 hỏi mức độ; 多好看啊 là câu cảm thán “đẹp biết bao”. Hai ví dụ gốc dưới đây thuộc cách cảm thán.", "newExamples": [{"zh": "小林问小雨：“你家离学校多远？”", "pinyin": "xiǎo lín wèn xiǎo yǔ ： “ nǐ jiā lí xué xiào duō yuǎn ？ ”", "vi": "小林 hỏi 小雨: “Nhà bạn cách trường bao xa?”"}, {"zh": "小林问：“你的弟弟多大了？”", "pinyin": "xiǎo lín wèn ： “ nǐ de dì di duō dà le ？ ”", "vi": "小林 hỏi: “Em trai bạn bao nhiêu tuổi rồi?”"}]}, {"name": "Bổ ngữ xu hướng phức hợp", "formula": "Động từ + (上/下/进/出/回/过/起) + 来/去", "explanation": "Bổ ngữ xu hướng phức hợp gồm một động từ chỉ phương hướng kết hợp với 「来」 (lại đây) hoặc 「去」 (đi tới đó). Cấu trúc này dùng để mô tả hướng di chuyển của hành động một cách chi tiết hơn. Ví dụ 「走进来」 nghĩa là đi vào đây, 「走进去」 nghĩa là đi vào đó.", "tip": "Nếu câu có tân ngữ là nơi chốn, hãy đặt tân ngữ vào giữa bổ ngữ xu hướng, ví dụ 「走进教室来」.", "note": "Chú ý phân biệt giữa 「来」 (hướng về phía người nói) và 「去」 (hướng xa khỏi người nói) để sử dụng chính xác.", "examples": [{"zh": "她经常跑上来找我玩儿。", "pinyin": "tā jīng cháng pǎo shàng lái zhǎo wǒ wán ér", "vi": "Cô ấy thường xuyên chạy lên đây tìm tôi chơi."}, {"zh": "楼不高，我们走上去吧。", "pinyin": "lóu bù gāo wǒ men zǒu shàng qù ba", "vi": "Lầu không cao, chúng ta đi bộ lên đi."}, {"zh": "一听到老师叫他的名字，他就站起来了。", "pinyin": "yī tīng dào lǎo shī jiào tā de míng zì tā jiù zhàn qǐ lái le", "vi": "Vừa nghe thấy thầy giáo gọi tên mình, anh ấy liền đứng dậy."}], "newExamples": [{"zh": "小林在教室里说：“小雨，请走进来，坐在我旁边。”", "pinyin": "xiǎo lín zài jiào shì lǐ shuō ： “ xiǎo yǔ ， qǐng zǒu jìn lái ， zuò zài wǒ páng biān 。 ”", "vi": "小林 ở trong lớp nói: “小雨, hãy bước vào đây, ngồi cạnh tôi.”"}, {"zh": "老师叫到小林的名字，小林就站起来回答问题。", "pinyin": "lǎo shī jiào dào xiǎo lín de míng zì ， xiǎo lín jiù zhàn qǐ lái huí dá wèn tí 。", "vi": "Thầy gọi tên 小林, 小林 liền đứng dậy trả lời."}]}]}, {"id": 15, "title": "Hẹn gặp lại bạn", "subtitle": "姓名 · 出国 · 门票 · 高中", "words": [{"id": "hsk2-15-01", "hanzi": "姓名", "pinyin": "xìngmíng", "meaning": "họ và tên", "example": "请在第一行写你的姓名。", "examplePinyin": "qǐng zài dì yī xíng xiě nǐ de xìng míng 。", "translation": "Hãy viết họ tên bạn ở dòng đầu tiên."}, {"id": "hsk2-15-02", "hanzi": "出国", "pinyin": "chūguó", "meaning": "ra nước ngoài", "example": "这是我第一次出国。", "examplePinyin": "zhè shì wǒ dì yī cì chū guó 。", "translation": "Đây là lần đầu tôi ra nước ngoài."}, {"id": "hsk2-15-03", "hanzi": "门票", "pinyin": "ménpiào", "meaning": "vé vào cửa", "example": "这张门票比昨天买的便宜十块。", "examplePinyin": "zhè zhāng mén piào bǐ zuó tiān mǎi de pián yi shí kuài 。", "translation": "Vé vào cửa này rẻ hơn vé mua hôm qua mười tệ."}, {"id": "hsk2-15-04", "hanzi": "高中", "pinyin": "gāozhōng", "meaning": "trung học phổ thông", "example": "姐姐高中毕业以后想学中文。", "examplePinyin": "jiě jiě gāo zhōng bì yè yǐ hòu xiǎng xué zhōng wén 。", "translation": "Sau khi tốt nghiệp cấp ba chị muốn học tiếng Trung."}, {"id": "hsk2-15-05", "hanzi": "出门", "pinyin": "chūmén", "meaning": "ra khỏi nhà", "example": "出门以前记得关灯。", "examplePinyin": "chū mén yǐ qián jì de guān dēng 。", "translation": "Trước khi ra ngoài nhớ tắt đèn."}, {"id": "hsk2-15-06", "hanzi": "路", "pinyin": "lù", "meaning": "đường", "example": "这条路一直通到火车站。", "examplePinyin": "zhè tiáo lù yì zhí tōng dào huǒ chē zhàn 。", "translation": "Con đường này thông thẳng tới ga tàu hỏa."}, {"id": "hsk2-15-07", "hanzi": "机场", "pinyin": "jīchǎng", "meaning": "sân bay", "example": "明天我去机场接从中国来的朋友。", "examplePinyin": "míng tiān wǒ qù jī chǎng jiē cóng zhōng guó lái de péng yǒu 。", "translation": "Ngày mai tôi ra sân bay đón bạn từ Trung Quốc đến."}, {"id": "hsk2-15-08", "hanzi": "机票", "pinyin": "jīpiào", "meaning": "vé máy bay", "example": "我已经买好下周回国的机票了。", "examplePinyin": "wǒ yǐ jīng mǎi hǎo xià zhōu huí guó de jī piào le 。", "translation": "Tôi đã mua xong vé máy bay về nước tuần sau."}, {"id": "hsk2-15-09", "hanzi": "飞", "pinyin": "fēi", "meaning": "bay", "example": "小鸟从树上飞下来了。", "examplePinyin": "xiǎo niǎo cóng shù shàng fēi xià lái le 。", "translation": "Chim nhỏ từ trên cây bay xuống đây."}, {"id": "hsk2-15-10", "hanzi": "好像", "pinyin": "hǎoxiàng", "meaning": "hình như", "example": "那个人好像是你的同学。", "examplePinyin": "nà ge rén hǎo xiàng shì nǐ de tóng xué 。", "translation": "Người kia hình như là bạn học của bạn."}, {"id": "hsk2-15-11", "hanzi": "鸟", "pinyin": "niǎo", "meaning": "chim", "example": "树上有几只鸟正在叫。", "examplePinyin": "shù shàng yǒu jǐ zhī niǎo zhèng zài jiào 。", "translation": "Trên cây có mấy con chim đang hót."}], "grammar": [{"name": "Vị trí phó từ chỉ tần suất", "details": ["Công thức: Chủ ngữ + Phó từ tần suất + Động từ + Tân ngữ", "Giải thích: Trong tiếng Trung, các phó từ chỉ tần suất như 「常常」(thường xuyên), 「总是」(luôn luôn) được đặt trước động từ để bổ nghĩa. Cấu trúc này giúp  tân ngữ khi tân ngữ đó là đại từ nhân xưng, vì sẽ gây sai ngữ pháp.", "examples": [{"zh": "我想找他一次。", "pinyin": "wǒ xiǎng zhǎo tā yī cì", "vi": "Tôi muốn tìm anh ấy một lần."}, {"zh": "安妮来过这儿两次。", "pinyin": "ān nī lái guò zhè ér liǎng cì", "vi": "Annie đã đến đây hai lần."}], "newExamples": [{"zh": "小林今天找了小雨一次，后来就回家了。", "pinyin": "xiǎo lín jīn tiān zhǎo le xiǎo yǔ yī cì ， hòu lái jiù huí jiā le 。", "vi": "Hôm nay 小林 đã tìm 小雨 một lần, sau đó về nhà."}, {"zh": "小林昨天给小雨打了两次电话，都没人接。", "pinyin": "xiǎo lín zuó tiān gěi xiǎo yǔ dǎ le liǎng cì diàn huà ， dōu méi rén jiē 。", "vi": "Hôm qua 小林 đã gọi điện cho 小雨 hai lần, đều không ai nghe."}]}, {"name": "Câu chữ 有 (Sở hữu và Tồn tại)", "formula": "S + 有 + O (Chủ ngữ + Có + Tân ngữ)", "explanation": "Động từ 「有」 dùng để chỉ sự sở hữu (có cái gì đó) hoặc sự tồn tại (có sự xuất hiện của ai/cái gì). Trong câu phủ định, ta dùng 「没有」 thay cho 「不有」.", "tip": "Khi muốn nói 'không có', hãy luôn dùng 「没有」, không bao giờ nói 「不有」.", "note": "Đừng nhầm lẫn giữa 「有」 (sở hữu/tồn tại) và 「是」 (định danh/là).", "examples": [{"zh": "你有一年没回国了吧？", "pinyin": "nǐ yǒu yī nián méi huí guó le ba", "vi": "Bạn đã một năm rồi không về nước phải không?"}, {"zh": "你女儿今年有10岁了吗？", "pinyin": "nǐ nǚ ér jīn nián yǒu 1 0 suì le ma ？", "vi": "Con gái bạn năm nay được 10 tuổi chưa?"}, {"zh": "我有一个月没给家里打电话了。", "pinyin": "wǒ yǒu yī gè yuè méi gěi jiā lǐ dǎ diàn huà le", "vi": "Tôi đã một tháng rồi chưa gọi điện về nhà."}], "clarification": "Ngoài sở hữu và tồn tại, 有 + khoảng thời gian + 没 + V nói đã một khoảng thời gian chưa làm việc gì. Các ví dụ gốc ở đây chủ yếu minh họa nghĩa thời lượng này.", "newExamples": [{"zh": "小林家里有一只小猫。", "pinyin": "xiǎo lín jiā lǐ yǒu yī zhī xiǎo māo 。", "vi": "Nhà 小林 có một chú mèo."}, {"zh": "小林说：“我没有护照，现在还不能出国。”", "pinyin": "xiǎo lín shuō ： “ wǒ méi yǒu hù zhào ， xiàn zài hái bù néng chū guó 。 ”", "vi": "小林 nói: “Tôi chưa có hộ chiếu, bây giờ vẫn chưa thể ra nước ngoài.”"}]}]}];

<script>
const L=window.HSK_LESSONS;let lesson=L[0],tab='words',flashIndex=0,flipped=false,session=null,filter='',hidePin=false,hideVi=false,onlyUnknown=false;
const KEY='hsk2-quest-v1';let store;try{store=JSON.parse(localStorage.getItem(KEY))||{known:{},history:[],wrong:{},recent:1}}catch{store={known:{},history:[],wrong:{},recent:1}};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(store));const all=()=>L.flatMap(x=>x.words);const known=()=>Object.values(store.known).filter(Boolean).length;const wordKey=w=>w.id;
function speak(t,rate=0.85){if(!('speechSynthesis'in window)){alert('Trình duyệt không hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=rate;speechSynthesis.speak(u)}
function home(){session=null;$('#app').innerHTML=`<section class="hero"><span class="pill">NEW HSK 2 · 15 BÀI</span><h1>HSK 2 VERSION 3.0</h1><p>211 lượt từ vựng · Flashcard · Luyện tập · Theo dõi tiến độ</p><div class="row"><button class="primary" onclick="openLesson(${store.recent||1})">▶ Tiếp tục bài ${store.recent||1}</button><button onclick="showReview()">Ôn tập tổng hợp</button></div></section><div class="grid"><div class="panel"><div class="stat">${known()}</div>Từ đã đánh dấu thuộc</div><div class="panel"><div class="stat">${store.history.length}</div>Lượt luyện tập</div><div class="panel"><div class="stat">${store.history.reduce((a,b)=>a+b.correct,0)}</div>Câu trả lời đúng</div></div><h2>15 bài học</h2><div class="grid">${L.map(x=>`<div class="card" onclick="openLesson(${x.id})"><span class="pill">Bài ${String(x.id).padStart(2,'0')}</span><h3 class="hanzi">${esc(x.title)}</h3><p>${esc(x.subtitle)}</p><small class="muted">${x.words.length} từ · ${x.grammar.length} mục ngữ pháp</small><div class="progress" style="margin-top:12px"><div style="width:${100*x.words.filter(w=>store.known[wordKey(w)]).length/x.words.length}%"></div></div></div>`).join('')}</div>`}
function openLesson(id,t='words'){lesson=L.find(x=>x.id===id);tab=t;store.recent=id;save();renderLesson()}
function renderLesson(){session=null;$('#app').innerHTML=`<button onclick="home()">← Trang chủ</button><h2>Bài ${lesson.id}: <span class="hanzi">${esc(lesson.title)}</span></h2><p class="muted">${esc(lesson.subtitle)} · ${lesson.words.length} từ vựng</p><div class="tabs">${[['words','Từ vựng'],['grammar','Ngữ pháp'],['flash','Flashcard'],['games','Trò chơi']].map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';renderLesson()">${n}</button>`).join('')}</div><section id="content"></section>`;if(tab==='words')renderWords();if(tab==='grammar')renderGrammar();if(tab==='flash')renderFlash();if(tab==='games')renderGames()}
function renderWords(){let words=lesson.words.filter(w=>(!onlyUnknown||!store.known[wordKey(w)])&&[w.hanzi,w.pinyin,w.meaning].join(' ').toLowerCase().includes(filter.toLowerCase()));$('#content').innerHTML=`<div class="toolbar"><input type="search" placeholder="Tìm Hán tự, Pinyin, nghĩa..." value="${esc(filter)}" oninput="filter=this.value;renderWords()"><button onclick="hidePin=!hidePin;renderWords()">${hidePin?'Hiện':'Ẩn'} Pinyin</button><button onclick="hideVi=!hideVi;renderWords()">${hideVi?'Hiện':'Ẩn'} nghĩa</button><button onclick="onlyUnknown=!onlyUnknown;renderWords()" class="${onlyUnknown?'active':''}">Chưa thuộc</button></div><div class="tablewrap panel"><table><thead><tr><th>STT</th><th>Hán tự</th><th>Pinyin</th><th>Nghĩa</th><th>Ví dụ và dịch</th><th>Học</th></tr></thead><tbody>${words.map((w,i)=>`<tr><td>${i+1}</td><td><div class="hanzi">${esc(w.hanzi)}</div><button onclick="speak('${w.hanzi.replace(/'/g,'')}')">🔊</button></td><td>${hidePin?'•••':esc(w.pinyin)}</td><td>${hideVi?'•••':esc(w.meaning)}</td><td><div class="hanzi" style="font-size:23px">${esc(w.example)}</div><div class="muted">${esc(w.examplePinyin||'')}</div><div class="muted">${hideVi?'•••':esc(w.translation)}</div><button onclick="speak(${JSON.stringify(w.example).replace(/"/g,'&quot;')})">🔊 Nghe câu</button></td><td><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Thuộc':'○ Chưa'}</button></td></tr>`).join('')}</tbody></table></div>`}
function toggleKnown(id){store.known[id]=!store.known[id];save();if(tab==='flash')renderFlash();else renderWords()}
function renderGrammar(){const make=(a,heading)=>`<h3>${heading}</h3>${a.map(g=>`<article class="panel grammar"><h3>${esc(g.name)}</h3><p>${g.details.map(esc).join('\n')}</p></article>`).join('')}`;$('#content').innerHTML=make(lesson.grammar,'Ngữ pháp giáo trình')+make(lesson.extended,'Chú thích mở rộng')}
function flashList(){return lesson.words.filter(w=>!onlyUnknown||!store.known[w.id])}function renderFlash(){let a=flashList();if(flashIndex>=a.length)flashIndex=0;let w=a[flashIndex];$('#content').innerHTML=`<div class="toolbar"><button onclick="onlyUnknown=!onlyUnknown;flashIndex=0;flipped=false;renderFlash()" class="${onlyUnknown?'active':''}">Chỉ từ chưa thuộc</button><button onclick="lesson.words.sort(()=>Math.random()-.5);flashIndex=0;renderFlash()">🔀 Trộn thẻ</button></div>${!w?'<div class="panel">Bạn đã đánh dấu thuộc tất cả từ trong bài.</div>':`<div class="panel flash" onclick="flipped=!flipped;renderFlash()"><div class="muted">Thẻ ${flashIndex+1}/${a.length}</div>${flipped?`<div class="hanzi big">${esc(w.hanzi)}</div><h2>${esc(w.pinyin)}</h2><h3>${esc(w.meaning)}</h3><div class="hanzi" style="font-size:24px">${esc(w.example)}</div><p>${esc(w.translation)}</p>`:`<div class="hanzi big">${esc(w.hanzi)}</div>`}</div><div class="toolbar"><button onclick="speak(${JSON.stringify(w.hanzi).replace(/"/g,'&quot;')})">🔊 Nghe</button><button onclick="flashIndex=Math.max(0,flashIndex-1);flipped=false;renderFlash()">← Trước</button><button onclick="toggleKnown('${w.id}')">${store.known[w.id]?'✓ Đã thuộc':'○ Đánh dấu thuộc'}</button><button class="primary" onclick="flashIndex=(flashIndex+1)%flashList().length;flipped=false;renderFlash()">Tiếp →</button></div>`}`}
const MODES=[['hanzi','Hán tự → Nghĩa'],['meaning','Nghĩa → Hán tự'],['pinyin','Chọn Pinyin'],['listen','Nghe chọn Hán tự'],['type','Gõ Hán tự'],['dictation','Nghe chép chính tả']];
function renderGames(){let modes=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${n}</h3><p class="muted">Luyện với dữ liệu từ vựng của bài</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<h3>Chọn chế độ luyện tập</h3><div class="grid">${modes}</div><p class="muted">Phiên bản này triển khai 6 chế độ từ vựng. Các chế độ viết đoạn, đọc hiểu dài, sắp xếp câu và thử thách ngữ pháp chuyên sâu sẽ được bổ sung ở giai đoạn nội dung tiếp theo, không sử dụng câu hỏi giả.</p>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(mode,custom){let pool=custom||lesson.words;let questions=shuffle(pool).slice(0,Math.min(30,pool.length));session={mode,questions,pool,index:0,correct:0,answered:false};renderQuestion()}
function renderQuestion(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=s.mode;let options=shuffle([w,...shuffle(s.pool.filter(x=>x.hanzi!==w.hanzi&&x.meaning!==w.meaning)).slice(0,3)]);s.options=options;let question=m==='meaning'?w.meaning:m==='hanzi'||m==='pinyin'?w.hanzi:m==='type'?w.meaning:'🔊 Nhấn nghe';$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${MODES.find(x=>x[0]===m)?.[1]||m}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${m==='hanzi'||m==='pinyin'?'hanzi big':''}">${esc(question)}</h2>${m==='listen'||m==='dictation'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Phát âm</button>':''}<div id="options">${m==='type'||m==='dictation'?`<input id="typed" placeholder="Nhập Hán tự" autocomplete="off"><button class="primary" onclick="checkAnswer($('#typed').value)">Kiểm tra</button>`:options.map((o,i)=>`<button class="option ${m==='meaning'||m==='listen'?'chinese-option':''}" onclick="checkAnswer(${i})">${esc(m==='hanzi'?o.meaning:m==='pinyin'?o.pinyin:m==='meaning'||m==='listen'?o.hanzi:o.meaning)}</button>`).join('')}</div><div id="feedback"></div></div>`;if(m==='listen'||m==='dictation')speak(w.hanzi)}
function checkAnswer(input){let s=session;if(s.answered)return;let w=s.questions[s.index],m=s.mode;let ok=typeof input==='number'?s.options[input].id===w.id:input.replace(/[\s，。！？,.!?]/g,'')===w.hanzi.replace(/[\s，。！？,.!?]/g,'');s.answered=true;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác!':'✗ Chưa đúng'}</strong><div class="hanzi">${esc(w.hanzi)}</div><div>${esc(w.pinyin)} · ${esc(w.meaning)}</div><p>${esc(w.example)} — ${esc(w.translation)}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderQuestion()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`;[...document.querySelectorAll('.option')].forEach(b=>b.disabled=true)}
function finishGame(){let s=session;store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập 🎉</h2><div class="stat">${s.correct}/${s.questions.length}</div><p>Tỷ lệ đúng: ${Math.round(100*s.correct/s.questions.length)}%</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`}
function showReview(){let ids=L.map(x=>x.id);$('#app').innerHTML=`<h2>Ôn tập tổng hợp</h2><div class="panel"><p>Chọn các bài để luyện từ vựng.</p><div class="grid">${L.map(x=>`<label><input type="checkbox" class="lessoncheck" value="${x.id}" checked> Bài ${x.id} · ${esc(x.title)}</label>`).join('')}</div><div class="toolbar"><select id="reviewMode">${MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('')}</select><button class="primary" onclick="startReview()">Bắt đầu (tối đa 30 câu)</button></div></div>`}
function startReview(){let selected=[...document.querySelectorAll('.lessoncheck:checked')].map(x=>+x.value);let pool=L.filter(x=>selected.includes(x.id)).flatMap(x=>x.words);if(!pool.length)return alert('Hãy chọn ít nhất một bài');lesson=L.find(x=>x.id===selected[0]);startGame($('#reviewMode').value,pool)}
function showStats(){$('#app').innerHTML=`<h2>Thống kê học tập</h2><div class="grid"><div class="panel"><div class="stat">${known()}</div>Từ đã thuộc (theo lượt bài)</div><div class="panel"><div class="stat">${store.history.length}</div>Lượt luyện tập</div><div class="panel"><div class="stat">${store.history.reduce((a,b)=>a+b.correct,0)}/${store.history.reduce((a,b)=>a+b.total,0)}</div>Câu đúng / tổng câu</div></div><h3>Lịch sử gần đây</h3><div class="panel">${store.history.slice(0,30).map(h=>`<p>${new Date(h.date).toLocaleString('vi-VN')} · Bài ${h.lesson} · ${esc(h.mode)} · ${h.correct}/${h.total}</p>`).join('')||'Chưa có lượt luyện tập.'}</div><div class="toolbar"><button onclick="exportProgress()">Xuất tiến độ JSON</button><label class="panel">Nhập JSON <input type="file" accept="application/json" onchange="importProgress(this.files[0])"></label><button onclick="if(confirm('Xóa toàn bộ tiến độ trên thiết bị này?')){localStorage.removeItem(KEY);location.reload()}">Đặt lại tiến độ</button></div>`}
function exportProgress(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}));a.download='hsk2-progress.json';a.click();URL.revokeObjectURL(a.href)}async function importProgress(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!x||typeof x.known!=='object'||!Array.isArray(x.history))throw Error();if(confirm('Thay thế tiến độ hiện tại?')){store=x;save();showStats()}}catch{alert('File tiến độ không hợp lệ')}}
home();

</script><script>
/* Additional fully interactive practice modes. All questions are sourced from the workbook examples. */
const BASE_MODES=MODES.slice();
MODES.push(['cloze','Điền từ vào câu'],['translate','Dịch câu Việt → Trung'],['order','Sắp xếp câu'],['reading','Đọc hiểu câu ví dụ'],['speaking','Luyện nói'],['grammar','Thử thách ngữ pháp'],['mixed','Thử thách tổng hợp']);
const originalRenderGames=renderGames;
renderGames=function(){let html=MODES.map(([m,n])=>`<div class="card" onclick="startGame('${m}')"><h3>${esc(n)}</h3><p class="muted">${['reading','grammar','speaking'].includes(m)?'Luyện theo câu ví dụ và kiến thức có trong sổ tay':'Luyện tập tương tác'}</p><button class="primary">Bắt đầu</button></div>`).join('');$('#content').innerHTML=`<div class="toolbar"><label>Số câu <select id="numQuestions"><option>10</option><option>20</option><option selected>30</option><option>50</option></select></label></div><div class="grid">${html}</div><p class="muted">Các chế độ bổ sung khai thác câu ví dụ thực tế trong sổ tay. Chế độ “Đọc hiểu” hiện là đọc hiểu câu, chưa phải 5 bài đọc dài/bài. Số câu không vượt quá số câu hỏi khác nhau có thể tạo từ nguồn.</p>`};
function cleanHan(s){return (s||'').replace(/[\s，。！？,.!?、；：:;“”"']/g,'')}
function examples(pool){return pool.filter(w=>w.example&&w.translation&&cleanHan(w.example).length>=3)}
function getLimit(){return Number($('#numQuestions')?.value||30)}
const originalStartGame=startGame;
startGame=function(mode,custom){if(BASE_MODES.some(x=>x[0]===mode)) {let p=custom||lesson.words;let q=shuffle(p).slice(0,Math.min(getLimit(),p.length));session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderQuestion();return}let p=custom||lesson.words;let q=shuffle(examples(p));if(mode==='grammar'){let gram=(custom?L.filter(l=>l.words.some(w=>p.includes(w))):[lesson]).flatMap(l=>l.grammar.map((g,i)=>({id:`g${l.id}-${i}`,grammar:g,hanzi:g.name,example:(g.details.find(s=>s.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(s=>s.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),meaning:g.name}))).filter(x=>x.example);q=shuffle(gram)}
if(mode==='mixed')q=shuffle([...q.map((w,i)=>({...w,submode:['cloze','translate','order','reading'][i%4]})),...q.map(w=>({...w,submode:'speaking'}))]);
q=q.slice(0,Math.min(getLimit(),q.length));if(!q.length){alert('Không đủ nội dung hợp lệ trong tài liệu cho chế độ này.');return}session={mode,questions:q,pool:p,index:0,correct:0,answered:false};renderAdvanced()};
function renderAdvanced(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],m=w.submode||s.mode;let sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));let missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];let prompt='',control='';s.target=sentence;s.missing=missing;
if(m==='cloze'){prompt=sentence.replace(missing,'＿＿');control=`<input id="advInput" placeholder="Điền Hán tự" autocomplete="off">`}
if(m==='translate'){prompt=w.translation;control=`<textarea id="advInput" placeholder="Viết câu bằng tiếng Trung"></textarea>`}
if(m==='order'){prompt=w.translation;let units=sentence.match(/[\u3400-\u9fff]+|[^\u3400-\u9fff]/g)||tokens;s.tiles=shuffle(tokens.filter(c=>!/[。！？]/.test(c)));s.chosen=[];control=`<div id="selectedTiles" class="panel hanzi"></div><div id="tileBank" class="toolbar">${s.tiles.map((t,i)=>`<button id="tile${i}" class="hanzi" onclick="pickTile(${i})">${esc(t)}</button>`).join('')}</div><button onclick="session.chosen=[];renderAdvanced()">Xếp lại</button>`}
if(m==='reading'){prompt=sentence;control=`<p><strong>Câu này có nghĩa gì?</strong></p><textarea id="advInput" placeholder="Viết nghĩa tiếng Việt của câu"></textarea>`}
if(m==='speaking'){prompt=sentence;control=`<div class="toolbar"><button onclick="speak(session.questions[session.index].example)">🔊 Nghe mẫu</button></div><p id="recognized" class="muted">Nghe mẫu, tự đọc lại rồi gõ câu để đối chiếu.</p><input id="advInput" placeholder="Có thể gõ câu bạn đã nói">`}
if(m==='grammar'){prompt=w.grammar.name;control=`<p><strong>Nhớ lại công thức và viết câu ví dụ cho cấu trúc này.</strong></p><textarea id="advInput" placeholder="Viết một câu ví dụ"></textarea>`}
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">${esc(MODES.find(x=>x[0]===m)?.[1]||m)}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><h2 class="${['cloze','speaking','reading'].includes(m)?'hanzi':''}">${esc(prompt)}</h2>${control}<div class="toolbar"><button class="primary" onclick="gradeAdvanced()">Kiểm tra / Đối chiếu</button></div><div id="feedback"></div></div>`}
function pickTile(i){let b=$('#tile'+i);if(b.disabled)return;session.chosen.push(session.tiles[i]);b.disabled=true;$('#selectedTiles').textContent=session.chosen.join('')}
function gradeAdvanced(){let s=session;if(s.answered)return;let w=s.questions[s.index],m=w.submode||s.mode,typed=m==='order'?s.chosen.join(''):($('#advInput')?.value||'').trim();if(!typed){alert('Hãy nhập câu trả lời trước.');return}let answer=m==='cloze'?s.missing:w.example;let ok=null;if(['cloze','translate','order','speaking'].includes(m))ok=cleanHan(typed)===cleanHan(answer);if(m==='reading'||m==='grammar')ok=null;s.answered=true;if(ok===true)s.correct++;if(ok===false)store.wrong[w.id]=(store.wrong[w.id]||0)+1;save();let explanation=m==='grammar'?w.grammar.details.join(' · '):`${w.pinyin||''} · ${w.translation||''}`;$('#feedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu với đáp án mẫu':ok?'✓ Trùng đáp án mẫu':'Chưa trùng đáp án mẫu'}</strong><p class="hanzi">${esc(answer)}</p><p>${esc(explanation)}</p><p class="muted">${m==='translate'||m==='grammar'||m==='reading'?'Các cách diễn đạt tương đương có thể đúng; website không có AI chấm ngữ pháp/ngữ nghĩa.':''}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderAdvanced()">${s.index===s.questions.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`}
function recordSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#recognized').textContent='Trình duyệt này không hỗ trợ nhận dạng giọng nói. Hãy thử Chrome hoặc Edge và cấp quyền micro.';return}let rec=new SR();rec.lang='zh-CN';rec.onresult=e=>{$('#advInput').value=e.results[0][0].transcript;$('#recognized').textContent='Nhận dạng: '+e.results[0][0].transcript};rec.onerror=e=>{$('#recognized').textContent='Không thể nhận dạng: '+e.error+'. Hãy kiểm tra quyền micro.'};rec.start()}
const oldFinish=finishGame;finishGame=function(){let s=session;if(BASE_MODES.some(x=>x[0]===s.mode))return oldFinish();store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:s.mode,correct:s.correct,total:s.questions.length,autoGraded:!['reading','grammar','mixed'].includes(s.mode)});store.history=store.history.slice(0,200);save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành lượt luyện tập</h2><div class="stat">${s.index} câu đã làm</div><p>${s.correct} câu trùng đáp án mẫu. Các câu tự đối chiếu không được tính là sai.</p><div class="toolbar"><button class="primary" onclick="startGame('${s.mode}')">Làm lại</button><button onclick="openLesson(${lesson.id},'games')">Chọn trò chơi</button><button onclick="home()">Trang chủ</button></div></div>`};
const oldReview=showReview;showReview=function(){oldReview();let sel=$('#reviewMode');sel.innerHTML=MODES.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');let btn=$('#app .primary');btn.textContent='Bắt đầu ôn tập';};

</script><script>
/* Additional practice, final exam, and answer review. No AI grading claims. */
const extraModes=[['paragraph','Viết đoạn văn có hướng dẫn'],['exam','Kiểm tra cuối khóa']];
MODES.push(...extraModes);
const previousRenderGames=renderGames;
renderGames=function(){previousRenderGames();const grid=$('#content .grid');grid.insertAdjacentHTML('beforeend',`<div class="card" onclick="startWriting()"><h3>✍️ Viết đoạn văn</h3><p class="muted">Luyện viết dựa trên câu ví dụ của bài; đối chiếu thủ công</p><button class="primary">Bắt đầu</button></div><div class="card" onclick="startFinalExam()"><h3>🏆 Kiểm tra cuối khóa</h3><p class="muted">100 câu: từ vựng, ngữ pháp và kỹ năng</p><button class="primary">Bắt đầu</button></div>`)};
function startWriting(){const words=lesson.words.filter(w=>w.example&&w.translation);if(!words.length)return alert('Chưa có câu ví dụ để luyện viết.');const selected=shuffle(words).slice(0,Math.min(30,words.length));session={mode:'paragraph',questions:selected,index:0,correct:0,answered:false};renderWriting()}
function renderWriting(){const s=session;if(s.index>=s.questions.length){finishWriting();return}const w=s.questions[s.index];$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Quay lại</button><div class="panel"><span class="pill">Luyện viết ${s.index+1}/${s.questions.length}</span><h2>Viết bằng tiếng Trung</h2><p>${esc(w.translation)}</p><p class="muted">Hãy tự viết câu này và có thể mở rộng thành một đoạn ngắn liên quan. Đây là bài tự luyện, không chấm ngữ pháp tự động.</p><textarea id="writingAnswer" rows="7" placeholder="Nhập chữ Hán...">${esc(s.draft||'')}</textarea><div class="toolbar"><button onclick="s.draft=$('#writingAnswer').value;localStorage.setItem('hsk-writing-draft',JSON.stringify({lesson:lesson.id,index:s.index,text:s.draft}));alert('Đã lưu bản nháp trên trình duyệt')">Lưu nháp</button><button class="primary" onclick="showWritingAnswer()">Xem đáp án mẫu</button></div><div id="writingFeedback"></div></div>`}
function showWritingAnswer(){const s=session,w=s.questions[s.index];s.draft=$('#writingAnswer').value;$('#writingFeedback').innerHTML=`<div class="result"><h3>Đáp án tham khảo</h3><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p class="muted">Hãy tự đối chiếu từ vựng, thứ tự từ và cấu trúc. Có thể có nhiều cách viết đúng.</p></div><button onclick="s.index++;s.draft='';renderWriting()" class="primary">${s.index+1===s.questions.length?'Hoàn thành':'Câu tiếp theo →'}</button>`}
function finishWriting(){store.history.unshift({date:new Date().toISOString(),lesson:lesson.id,mode:'paragraph',correct:0,total:session.questions.length,autoGraded:false});save();$('#app').innerHTML=`<div class="panel"><h2>Đã hoàn thành ${session.questions.length} bài tự luyện viết</h2><p>Không có điểm tự động vì câu trả lời cần người học đối chiếu.</p><button onclick="openLesson(${lesson.id},'games')">Quay lại bài</button></div>`}
const EXAM_PLAN=[['hanzi',20],['grammar',20],['reading',20],['listen',20],['translate',10],['mixed',10]];
function startFinalExam(){let pool=L.flatMap(l=>l.words);let questions=[];for(const [mode,count] of EXAM_PLAN){let items;if(mode==='grammar')items=L.flatMap(l=>l.grammar.map((g,i)=>({id:`gram-${l.id}-${i}`,grammar:g,example:(g.details.find(x=>x.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,''),translation:(g.details.find(x=>x.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),hanzi:g.name}))).filter(w=>w.example);else items=pool.filter(w=>w.example&&w.translation&&(mode!=='mixed'||w.example.includes(w.hanzi)));items=shuffle(items).slice(0,count);questions.push(...items.map(w=>({...w,examMode:mode==='mixed'?'cloze':mode})))}if(questions.length!==100){alert(`Ngân hàng chỉ đủ ${questions.length}/100 câu độc lập. Không tạo câu giả.`);return}lesson=L[0];session={mode:'final-exam',questions:shuffle(questions),index:0,correct:0,answered:false,graded:0,pool};renderExamQuestion()}
function renderExamQuestion(){const s=session;if(s.index>=s.questions.length){finishExam();return}const w=s.questions[s.index],m=w.examMode;s.answered=false;let q='',input='';if(m==='hanzi'||m==='listen'){s.options=shuffle([w,...shuffle(s.pool.filter(x=>x.id!==w.id&&x.meaning!==w.meaning)).slice(0,3)]);q=m==='hanzi'?w.hanzi:'Nghe và chọn nghĩa đúng';input=`${m==='listen'?'<button onclick="speak(session.questions[session.index].hanzi)">🔊 Nghe</button>':''}<div class="grid">${s.options.map((o,i)=>`<button class="option" onclick="answerExam(${i})">${esc(o.meaning)}</button>`).join('')}</div>`}else if(m==='grammar'){q=w.grammar.name;input=`<p>Hãy viết câu ví dụ sử dụng cấu trúc này.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='reading'){q=w.example;input=`<p>Hãy dịch câu sang tiếng Việt.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else if(m==='translate'){q=w.translation;input=`<p>Hãy dịch sang tiếng Trung.</p><textarea id="examInput" rows="3"></textarea><button class="primary" onclick="answerExam()">Đối chiếu</button>`}else{q=w.example.replace(w.hanzi,'＿＿');s.missing=w.hanzi;input=`<p>Điền từ còn thiếu.</p><input id="examInput" placeholder="Nhập Hán tự"><button class="primary" onclick="answerExam()">Kiểm tra</button>`}$('#app').innerHTML=`<div class="panel"><div class="row"><span class="pill">Đề cuối khóa · ${esc(m)}</span><span class="spacer"></span>${s.index+1}/100</div><div class="progress"><div style="width:${s.index}%"></div></div><h2 class="hanzi">${esc(q)}</h2>${input}<div id="examFeedback"></div></div>`;if(m==='listen')speak(w.hanzi)}
function answerExam(choice){const s=session;if(s.answered)return;const w=s.questions[s.index],m=w.examMode;let ok=null;if(m==='hanzi'||m==='listen')ok=s.options[choice]?.id===w.id;else{const val=$('#examInput').value.trim();if(!val)return alert('Hãy nhập câu trả lời trước.');if(m==='cloze')ok=cleanHan(val)===cleanHan(s.missing);else if(m==='translate')ok=cleanHan(val)===cleanHan(w.example)}s.answered=true;if(ok!==null){s.graded++;if(ok)s.correct++;else store.wrong[w.id]=(store.wrong[w.id]||0)+1}save();$('#examFeedback').innerHTML=`<div class="result"><strong>${ok===null?'Tự đối chiếu':ok?'✓ Đúng':'Chưa đúng theo đáp án mẫu'}</strong><p class="hanzi">${esc(w.example||w.hanzi)}</p><p>${esc(w.translation||'')}</p>${m==='grammar'?`<p>${esc(w.grammar.details.join(' · '))}</p>`:''}<p class="muted">Các câu tự luận không được chấm ngữ nghĩa tự động.</p></div><button class="primary" onclick="session.index++;renderExamQuestion()">${s.index===99?'Xem kết quả':'Tiếp tục →'}</button>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true)}
function finishExam(){const s=session;store.history.unshift({date:new Date().toISOString(),lesson:'1–15',mode:'final-exam',correct:s.correct,total:s.graded,autoGraded:false});save();$('#app').innerHTML=`<div class="panel"><h2>Hoàn thành 100 câu cuối khóa</h2><div class="stat">${s.correct}/${s.graded}</div><p>Điểm trên chỉ tính ${s.graded} câu có thể chấm tự động. ${100-s.graded} câu tự luận cần tự đối chiếu.</p><button onclick="home();if(typeof topicExit==='function')topicExit()">Trang chủ</button><button onclick="topicHome()">29 chủ đề</button><button onclick="topicToMain('stats')">Thống kê</button></div>`}

</script><script></script><script></script>
<style>

<script>
/* Cập nhật các chế độ, giữ nguyên dữ liệu và lưu tiến độ của bản cũ. */
(function(){
const oldGames=renderGames;
renderGames=function(){oldGames();const root=document.querySelector('#content');if(!root)return;
root.querySelectorAll('.card').forEach(card=>{const action=card.getAttribute('onclick')||card.querySelector('button')?.getAttribute('onclick')||'';if(/startFinalExam|startWriting\(|startWritingPrompts/.test(action)||/kiểm tra cuối khóa|30 đề luyện viết|^✍️ Viết đoạn văn$|100 câu:/i.test(card.textContent))card.remove()});
const grid=root.querySelector('.grid');if(grid)grid.insertAdjacentHTML('beforeend',`<div class="card" onclick="startGuidedWriting()"><h3>✍️ Viết đoạn văn có hướng dẫn</h3><p class="muted">Một chủ đề mỗi bài · gợi ý từ vựng bài hiện tại và các bài trước · tự viết và lưu nháp</p><button class="primary">Bắt đầu</button></div>`);
};
const oldRenderAdvanced=renderAdvanced;
renderAdvanced=function(){let s=session,w=s?.questions?.[s.index],m=w?.submode||s?.mode;
if(m==='grammar'){renderGrammarChallenge();return}
if(m!=='cloze'){oldRenderAdvanced();return}
if(s.index>=s.questions.length){finishGame();return}
const sentence=w.example||'',tokens=Array.from(sentence.replace(/[。！？]/g,''));const missing=w.hanzi&&sentence.includes(w.hanzi)?w.hanzi:tokens[Math.floor(tokens.length/2)];s.missing=missing;s.target=sentence;
const eligible=lesson.words.filter(x=>x.hanzi!==missing&&x.hanzi&&x.hanzi!==w.hanzi);const extras=L.filter(x=>x.id<=lesson.id).flatMap(x=>x.words).filter(x=>x.hanzi!==missing);
const opts=[missing,...shuffle([...eligible,...extras]).map(x=>x.hanzi).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3)];
while(opts.length<4){const fallback=['我','你','是','有','不','在','的','了','吗','很'];const next=fallback.find(x=>!opts.includes(x));if(!next)break;opts.push(next)}s.clozeOptions=shuffle(opts);
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><div class="row"><span class="pill">Điền từ vào câu · Bài ${lesson.id}</span><span class="spacer"></span><b>${s.index+1}/${s.questions.length}</b></div><div class="progress"><div style="width:${100*s.index/s.questions.length}%"></div></div><div class="answer-area"><p class="muted">Chọn một trong 4 đáp án để hoàn thành câu:</p><h2 class="hanzi" style="font-size:34px;line-height:1.9">${esc(sentence.replace(missing,'＿＿＿'))}</h2><div class="cloze-options">${s.clozeOptions.map((o,i)=>`<button onclick="answerCloze(${i})">${esc(o)}</button>`).join('')}</div></div><div id="feedback"></div></div>`;
};
window.answerCloze=function(i){let s=session;if(s.answered)return;const chosen=s.clozeOptions[i];s.answered=true;const ok=chosen===s.missing;if(ok)s.correct++;else store.wrong[s.questions[s.index].id]=(store.wrong[s.questions[s.index].id]||0)+1;save();document.querySelectorAll('.cloze-options button').forEach((b,j)=>{b.disabled=true;if(s.clozeOptions[j]===s.missing)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});let w=s.questions[s.index];$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác!':'✗ Chưa chính xác'}</strong><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation||'')}</p><p>Đáp án: <b class="hanzi">${esc(s.missing)}</b></p></div><button class="primary" onclick="session.index++;session.answered=false;renderAdvanced()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`};
const oldStart=startGame;
startGame=function(mode,custom){if(mode!=='grammar')return oldStart(mode,custom);
const g=lesson.grammar.filter(x=>x.details?.some(y=>y.startsWith('Ví dụ:')));
const qs=[];
for(const gram of g){let ex=(gram.details.find(x=>x.startsWith('Ví dụ:'))||'').replace(/^Ví dụ:\s*/,'').replace(/\s*[（(][^()（）]*[)）]/g,'').trim();if(!ex)continue;
let formula=(gram.details.find(x=>x.startsWith('Công thức:'))||'').replace(/^Công thức:\s*/,'');
let preferred=['正在','因为','所以','还是','或者','已经','可以','没有','什么','怎么','多少','几','了','吗','呢','的','是','在','有','不','也','都','很','比','会','能','要','和'];
let target=preferred.find(x=>ex.includes(x)&&((gram.name+' '+formula).includes(x)))||preferred.find(x=>ex.includes(x));
if(!target){const hits=lesson.words.filter(w=>ex.includes(w.hanzi));target=hits[0]?.hanzi}
if(!target)continue;
qs.push({id:'grammar-'+lesson.id+'-'+qs.length,grammar:gram,example:ex,translation:(gram.details.find(x=>x.startsWith('Nghĩa:'))||'').replace(/^Nghĩa:\s*/,''),target,formula});
}
if(!qs.length){alert('Bài này chưa có ví dụ ngữ pháp đủ rõ để tạo câu hỏi trắc nghiệm. Hãy xem phần Ngữ pháp của bài.');return}
const amount=Math.min(getLimit(),qs.length);let bank=[];for(let i=0;i<amount;i++)bank.push({...qs[i%qs.length],variant:i});
session={mode:'grammar',questions:shuffle(bank),index:0,correct:0,answered:false,pool:lesson.words};renderGrammarChallenge();
};
function renderGrammarChallenge(){let s=session;if(s.index>=s.questions.length){finishGame();return}let w=s.questions[s.index],target=w.target;
const current=L.filter(l=>l.id<=lesson.id).flatMap(l=>l.words).map(v=>v.hanzi);
const distractors=['的','了','吗','呢','是','有','在','不','很','也','都','和','会','能','要','比','几','什么','怎么','多少','正在','没有',...current].filter((x,i,a)=>x!==target&&a.indexOf(x)===i);
s.grammarOptions=shuffle([target,...shuffle(distractors).slice(0,3)]);
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Trở về Trò chơi</button><div class="panel"><span class="pill">Thử thách ngữ pháp · Bài ${lesson.id}</span><span class="pill">${s.index+1}/${s.questions.length}</span><div class="answer-area"><h3>${esc(w.grammar.name)}</h3><p class="muted">${esc(w.formula)}</p><p>Chọn từ thích hợp để hoàn thành câu:</p><h2 class="hanzi" style="font-size:34px">${esc(w.example.replace(target,'＿＿＿'))}</h2><div class="cloze-options">${s.grammarOptions.map((x,i)=>`<button onclick="answerGrammar(${i})">${esc(x)}</button>`).join('')}</div></div><div id="feedback"></div></div>`;
}
window.answerGrammar=function(i){let s=session;if(s.answered)return;let w=s.questions[s.index],ok=s.grammarOptions[i]===w.target;s.answered=true;if(ok)s.correct++;save();document.querySelectorAll('.cloze-options button').forEach((b,j)=>{b.disabled=true;if(s.grammarOptions[j]===w.target)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="result"><strong>${ok?'✓ Chính xác':'✗ Chưa đúng'}</strong><p class="hanzi">${esc(w.example)}</p><p>${esc(w.translation)}</p><p>${esc(w.grammar.details.join(' · '))}</p></div><button class="primary" onclick="session.index++;session.answered=false;renderGrammarChallenge()">${s.index+1===s.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`};
window.startGuidedWriting=function(){session={mode:'guided-writing'};renderGuidedWriting()};
window.renderGuidedWriting=function(){const current=lesson.words,prior=L.filter(l=>l.id<lesson.id).flatMap(l=>l.words);const selected=current.filter(w=>w.example).slice(0,8),priorSelected=prior.filter(w=>w.example).slice(-8);
const title=lesson.subtitle||lesson.title;const key='hsk2-guided-v2-'+lesson.id;const draft=localStorage.getItem(key)||'';
$('#app').innerHTML=`<button onclick="openLesson(${lesson.id},'games')">← Quay lại trò chơi</button><div class="panel"><span class="pill">Bài ${lesson.id} · Luyện viết có hướng dẫn</span><h2>✍️ Chủ đề: ${esc(title)}</h2><p>Viết một đoạn tiếng Trung khoảng 3–6 câu theo chủ đề bài học. Ưu tiên dùng từ vựng mới của bài ${lesson.id}; có thể sử dụng các từ và cấu trúc đã học ở bài 1–${lesson.id}.</p><div class="answer-area"><h3>1. Từ vựng của bài này</h3><div class="guided-words">${selected.map(w=>`<span>${esc(w.hanzi)} · ${esc(w.meaning)}</span>`).join('')}</div><h3>2. Từ vựng ôn tập từ các bài trước</h3><div class="guided-words">${priorSelected.length?priorSelected.map(w=>`<span>${esc(w.hanzi)} · ${esc(w.meaning)}</span>`).join(''):'<p>Bài đầu tiên: chưa có từ vựng của bài trước.</p>'}</div><h3>3. Gợi ý triển khai nội dung</h3><p>• Câu 1: Giới thiệu người, vật hoặc tình huống liên quan đến chủ đề.<br>• Câu 2–3: Bổ sung thông tin, hành động hoặc sở thích bằng từ mới.<br>• Câu 4–5: Đặt câu hỏi, nêu nhận xét hoặc kết thúc câu chuyện.<br>• Kiểm tra trật tự từ và các cấu trúc ngữ pháp đã học.</p><h3>4. Viết đoạn văn của bạn</h3><textarea id="guidedText" placeholder="在这里写你的中文段落……">${esc(draft)}</textarea><div class="toolbar"><button class="primary" onclick="saveGuidedWriting()">💾 Lưu bài viết</button><button onclick="showGuidedHints()">💡 Xem câu ví dụ và ngữ pháp</button><button onclick="speak(document.querySelector('#guidedText').value)">🔊 Nghe bài viết</button></div><div id="guidedHints"></div><p class="muted">Bài viết mở, không chấm ngữ nghĩa/phát âm tự động. Nội dung gợi ý được lấy từ từ vựng và ví dụ của bài học.</p></div></div>`;
};
window.saveGuidedWriting=function(){localStorage.setItem('hsk2-guided-v2-'+lesson.id,$('#guidedText').value);alert('Đã lưu bài viết trên trình duyệt này.')};
window.showGuidedHints=function(){const grammar=lesson.grammar.filter(g=>g.details?.some(d=>d.startsWith('Ví dụ:')));$('#guidedHints').innerHTML=`<div class="result"><h3>Ví dụ tham khảo</h3>${lesson.words.filter(w=>w.example).slice(0,5).map(w=>`<p class="hanzi" style="font-size:24px">${esc(w.example)}</p><p>${esc(w.translation)}</p>`).join('')}<h3>Ngữ pháp bài ${lesson.id}</h3>${grammar.map(g=>`<p><b>${esc(g.name)}</b>: ${esc(g.details.join(' · '))}</p>`).join('')||'<p>Bài này không liệt kê mục ngữ pháp riêng trong tài liệu.</p>'}</div>`};
/* Trình duyệt bắt buộc tự quản lý quyền micro; không có cách bỏ qua yêu cầu này. */
const oldRecord=recordSpeech;
recordSpeech=function(){const note=$('#recognized');if(note)note.textContent='Nếu đây là lần đầu, trình duyệt có thể yêu cầu cấp quyền micro. Bạn có thể chọn “Cho phép” và ghi nhớ quyền cho website. Không thể bỏ qua bước bảo mật này.';oldRecord()};
/* Nút quay lại thống nhất, cả các màn hình chưa có nút riêng. */
const back=document.createElement('button');back.id='hskBack';back.textContent='← Quay lại';back.onclick=()=>{if(session&&lesson){openLesson(lesson.id,'games')}else if(lesson){home()}else home()};document.body.appendChild(back);
const syncBack=()=>{back.style.display=(!lesson&&!session)?'none':'block'};
new MutationObserver(syncBack).observe($('#app'),{childList:true,subtree:false});syncBack();
})();
</script>

<script>
(function(){
'use strict';
const palette=['#ba4d39','#b66b20','#9a7b16','#6d8d25','#2f8753','#238578','#187c9c','#346eaf','#4d63b9','#7355b3','#9053a8','#b24d88','#ba536c','#ae5849','#537c33'];
const soft=['#fff1ed','#fff3e8','#fff9e8','#f4f8e7','#eaf7ee','#e9f8f4','#e9f6fa','#edf5ff','#eef1ff','#f3efff','#f8efff','#fff0f7','#fff0f3','#fff3ef','#f0f7e9'];
function theme(id){let i=Math.max(0,Math.min(14,(id||0)-1));document.documentElement.style.setProperty('--accent',id?palette[i]:'#168b70');document.documentElement.style.setProperty('--soft',id?soft[i]:'#eaf8f1');document.documentElement.style.setProperty('--accent-border',id?`color-mix(in srgb, ${palette[i]} 34%, white)`:'#e4e8ee');document.documentElement.style.setProperty('--flash-bg',id?soft[i]:'#ffffff')}
const nativeHome=home;
home=function(){nativeHome();theme(0);const app=document.querySelector('#app');const grid=app.querySelector('.hero~.grid:last-child');if(!grid)return;grid.className='unit-grid';grid.innerHTML=L.map((u,i)=>{let n=u.words.filter(w=>store.known[w.id]).length,pr=Math.round(100*n/Math.max(1,u.words.length));let grammar=u.grammar.filter(g=>g.details?.some(d=>d.startsWith('Ví dụ:'))).length;return `<button type="button" class="unit-card" style="--local:${palette[i]};--local-soft:${soft[i]}" onclick="openLesson(${u.id})"><span class="unit-number">UNIT ${String(u.id).padStart(2,'0')}</span><h3 class="hanzi">${esc(u.title)}</h3><div class="unit-info">${esc(u.subtitle)}</div><div class="unit-info">${u.words.length} từ vựng${grammar?' · '+grammar+' điểm ngữ pháp':''}</div><div class="progress" aria-label="Đã thuộc ${pr}%"><div style="width:${pr}%;background:${palette[i]}"></div></div><span class="unit-bottom">Khám phá bài học →</span></button>`}).join('')};
const nativeLesson=renderLesson;
renderLesson=function(){nativeLesson();theme(lesson.id);
const root=document.getElementById('app');
const heading=[...root.children].find(el=>el.tagName==='H2');
const subtitle=heading?.nextElementSibling;
if(heading){
 const banner=document.createElement('section');banner.className='unit-title-banner';
 const titleBlock=document.createElement('div');titleBlock.className='unit-title-copy';
 const eyebrow=document.createElement('span');eyebrow.className='unit-title-eyebrow';eyebrow.textContent='HSK 2 · BÀI '+String(lesson.id).padStart(2,'0');
 titleBlock.appendChild(eyebrow);titleBlock.appendChild(heading);
 if(subtitle?.classList.contains('muted'))titleBlock.appendChild(subtitle);
 banner.appendChild(titleBlock);root.insertBefore(banner,root.children[1]||null);
}
if(false){const btn=[...document.querySelectorAll('.tabs button')].find(x=>x.textContent.trim()==='Ngữ pháp');btn?.remove()}document.querySelectorAll('.unit-theme-tag').forEach(e=>e.remove());};
const groupModes=[['Từ vựng & ghi nhớ',[['hanzi','Hán tự → Nghĩa','🀄','Nhìn chữ Hán, nghe phát âm và chọn nghĩa'],['meaning','Nghĩa → Hán tự','🧠','Chọn chữ Hán đúng theo nghĩa tiếng Việt'],['pinyin','Chọn Pinyin','🔤','Nhận diện cách đọc của từ']]],['Nghe & viết',[['listen','Nghe chọn Hán tự','🎧','Nghe từ và chọn chữ Hán'],['type','Gõ Hán tự','⌨️','Gõ chữ Hán theo nghĩa và nghe gợi ý'],['dictation','Nghe chép chính tả','✍️','Nghe và gõ lại từ']]],['Câu & ngữ pháp',[['cloze','Điền từ vào câu','🧩','Chọn một trong bốn đáp án'],['translate','Dịch câu','📝','Dịch câu sang tiếng Trung'],['order','Sắp xếp câu','🔀','Sắp xếp chữ thành câu'],['reading','Đọc hiểu câu','📖','Đọc câu và đối chiếu nghĩa'],['speaking','Luyện nói','🎙️','Nghe và luyện nói theo câu mẫu'],['grammar','Thử thách ngữ pháp','📐','Luyện cấu trúc ngữ pháp của Unit']]]];
renderGames=function(){theme(lesson.id);const root=document.querySelector('#content');const groups=groupModes.map(([title,items])=>{const available=items.filter(([m])=>m!=='grammar'||(lesson.grammar.some(g=>g.details?.some(d=>d.startsWith('Ví dụ:')))));if(!available.length)return '';return `<section><h3 class="game-group-title">${title}</h3><div class="grid">${available.map(([m,name,emoji,desc])=>`<button type="button" class="game-card" onclick="${m==='passages'?'startPassages()':`startGame('${m}')`}"><span class="game-icon">${emoji}</span><span><h3>${name}</h3><p>${desc}</p></span></button>`).join('')}</div></section>`}).join('');root.innerHTML=`<div class="toolbar"><label for="numQuestions">Số câu mỗi lượt: <select id="numQuestions"><option>10</option><option>20</option><option selected>30</option><option>50</option></select></label></div><div class="game-groups">${groups}</div>`};
// Browser speech voices vary by installed operating-system voices; choose a clear Chinese voice when available.
let selectedVoice='';
function chineseVoices(){return (speechSynthesis.getVoices()||[]).filter(v=>/^zh(-|_)/i.test(v.lang))}
function pickVoice(){let v=chineseVoices();return v.find(x=>x.voiceURI===selectedVoice)||v.find(x=>/xiaoxiao|xiaoyi|huihui|tingting|meijia|mandarin|natural|google.*chinese/i.test(x.name))||v.find(x=>/zh-CN/i.test(x.lang))||v[0]||null}

window.filterCourseUnits=function(query){

", "id": "H2-T09-09"}, {"hanzi": "才", "pinyin": "cái", "meaning": "Chỉ, mãi mới", "example": "我等了很久，他才到。", "examplePinyin": "wǒ děng le hěn jiǔ ， tā cái dào 。", "translation": "Tôi đã đợi rất lâu anh ấy mới đến.", "id": "H2-T09-10"}, {"hanzi": "靠", "pinyin": "kào", "meaning": "Dựa vào", "example": "请坐靠窗的那个座位。", "examplePinyin": "qǐng zuò kào chuāng de nà ge zuò wèi 。", "translation": "Hãy ngồi ghế gần cửa sổ kia.", "id": "H2-T09-11"}, {"hanzi": "啊", "pinyin": "a", "meaning": "A, à", "example": "今天的天气真好啊！", "examplePinyin": "jīn tiān de tiān qì zhēn hǎo a ！", "translation": "Thời tiết hôm nay đẹp thật đấy!", "id": "H2-T09-12"}, {"hanzi": "成", "pinyin": "chéng", "meaning": "Trở thành", "example": "请把这句话翻译成中文。", "examplePinyin": "qǐng bǎ zhè jù huà fān yì chéng zhōng wén 。", "translation": "Hãy dịch câu này sang tiếng Trung.", "id": "H2-T09-13"}, {"hanzi": "更", "pinyin": "gèng", "meaning": "Hơn", "example": "我觉得这件比那件更好看。", "examplePinyin": "wǒ jué de zhè jiàn bǐ nà jiàn gèng hǎo kàn 。", "translation": "Tôi thấy chiếc này đẹp hơn chiếc kia nữa.", "id": "H2-T09-14"}, {"hanzi": "其中", "pinyin": "qízhōng", "meaning": "Trong số đó", "example": "这些学生中，其中三个来自越南。", "examplePinyin": "zhè xiē xué shēng zhōng ， qí zhōng sān gè lái zì yuè nán 。", "translation": "Trong số học sinh này có ba bạn đến từ Việt Nam.", "id": "H2-T09-15"}, {"hanzi": "不要", "pinyin": "búyào", "meaning": "Đừng, không muốn", "example": "不要在图书馆里打电话。", "examplePinyin": "bú yào zài tú shū guǎn lǐ dǎ diàn huà 。", "translation": "Đừng gọi điện trong thư viện.", "id": "H2-T09-16"}, {"hanzi": "快要", "pinyin": "kuàiyào", "meaning": "Sắp", "example": "电影快要结束了。", "examplePinyin": "diàn yǐng kuài yào jié shù le 。", "translation": "Bộ phim sắp kết thúc rồi.", "id": "H2-T09-17"}, {"hanzi": "一定", "pinyin": "yídìng", "meaning": "Nhất định", "example": "你一定要记得带书。", "examplePinyin": "nǐ yí dìng yào jì de dài shū 。", "translation": "Bạn nhất định phải nhớ mang sách.", "id": "H2-T09-18"}, {"hanzi": "离", "pinyin": "lí", "meaning": "Cách, từ", "example": "学校离我家只有十分钟的路。", "examplePinyin": "xué xiào lí wǒ jiā zhǐ yǒu shí fēn zhōng de lù 。", "translation": "Trường chỉ cách nhà tôi mười phút đi đường.", "id": "H2-T09-19"}, {"hanzi": "正是", "pinyin": "zhèngshì", "meaning": "Chính là", "example": "现在正是吃午饭的时候。", "examplePinyin": "xiàn zài zhèng shì chī wǔ fàn de shí hòu 。", "translation": "Bây giờ đúng là lúc ăn trưa.", "id": "H2-T09-20"}, {"hanzi": "又", "pinyin": "yòu", "meaning": "Lại, lần nữa", "example": "他昨天来了，今天又来了。", "examplePinyin": "tā zuó tiān lái le ， jīn tiān yòu lái le 。", "translation": "Hôm qua anh ấy đã đến, hôm nay lại đến.", "id": "H2-T09-21"}, {"hanzi": "不一定", "pinyin": "bù yídìng", "meaning": "Không nhất thiết", "example": "贵的东西不一定好。", "examplePinyin": "guì de dōng xī bù yí dìng hǎo 。", "translation": "Đồ đắt chưa chắc đã tốt.", "id": "H2-T09-22"}, {"hanzi": "不如", "pinyin": "bùrú", "meaning": "Không bằng", "example": "这里太远，走路不如坐车方便。", "examplePinyin": "zhè lǐ tài yuǎn ， zǒu lù bù rú zuò chē fāng biàn 。", "translation": "Chỗ này xa quá, đi bộ không tiện bằng đi xe.", "id": "H2-T09-23"}, {"hanzi": "为", "pinyin": "wèi", "meaning": "Vì, cho", "example": "谢谢你为我准备生日礼物。", "examplePinyin": "xiè xiè nǐ wèi wǒ zhǔn bèi shēng rì lǐ wù 。", "translation": "Cảm ơn bạn đã chuẩn bị quà sinh nhật cho tôi.", "id": "H2-T09-24"}, {"hanzi": "经过", "pinyin": "jīngguò", "meaning": "Đi qua, trải qua", "example": "我每天上学都经过这家店。", "examplePinyin": "wǒ měi tiān shàng xué dōu jīng guò zhè jiā diàn 。", "translation": "Mỗi ngày đi học tôi đều đi qua cửa hàng này.", "id": "H2-T09-25"}, {"hanzi": "不行", "pinyin": "bùxíng", "meaning": "Không được", "example": "今天不行，我还要上班。", "examplePinyin": "jīn tiān bù xíng ， wǒ hái yào shàng bān 。", "translation": "Hôm nay không được, tôi còn phải đi làm.", "id": "H2-T09-26"}, {"hanzi": "完", "pinyin": "wán", "meaning": "Hoàn thành", "example": "作业写完了，我才去睡觉。", "examplePinyin": "zuò yè xiě wán le ， wǒ cái qù shuì jiào 。", "translation": "Viết xong bài tập tôi mới đi ngủ.", "id": "H2-T09-27"}, {"hanzi": "什么样", "pinyin": "shénmeyàng", "meaning": "Loại gì", "example": "你想找什么样的工作？", "examplePinyin": "nǐ xiǎng zhǎo shén me yàng de gōng zuò ？", "translation": "Bạn muốn tìm công việc như thế nào?", "id": "H2-T09-28"}, {"hanzi": "怎么样", "pinyin": "zěnmeyàng", "meaning": "Thế nào", "example": "这家饭馆的菜怎么样？", "examplePinyin": "zhè jiā fàn guǎn de cài zěn me yàng ？", "translation": "Món ăn ở quán này thế nào?", "id": "H2-T09-29"}, {"hanzi": "为什么", "pinyin": "wèishénme", "meaning": "Tại sao", "example": "你为什么不和我们一起去？", "examplePinyin": "nǐ wèi shén me bù hé wǒ men yì qǐ qù ？", "translation": "Vì sao bạn không đi cùng chúng tôi?", "id": "H2-T09-30"}, {"hanzi": "怎样", "pinyin": "zěnyàng", "meaning": "Như thế nào", "example": "你知道怎样去火车站吗？", "examplePinyin": "nǐ zhī dào zěn yàng qù huǒ chē zhàn ma ？", "translation": "Bạn biết đi đến ga tàu thế nào không?", "id": "H2-T09-31"}, {"hanzi": "只要", "pinyin": "zhǐyào", "meaning": "Chỉ cần, miễn là", "example": "只要你有时间，就可以来我家。", "examplePinyin": "zhǐ yào nǐ yǒu shí jiān ， jiù kě yǐ lái wǒ jiā 。", "translation": "Chỉ cần bạn có thời gian là có thể đến nhà tôi.", "id": "H2-T09-32"}]}, {"id": 10, "name": "Từ Nối", "words": [{"hanzi": "然后", "pinyin": "ránhòu", "meaning": "Sau đó", "example": "我们先吃饭，然后去买书。", "examplePinyin": "wǒ men xiān chī fàn ， rán hòu qù mǎi shū 。", "translation": "Chúng tôi ăn cơm trước, sau đó đi mua sách.", "id": "H2-T10-01"}, {"hanzi": "虽然", "pinyin": "suīrán", "meaning": "Mặc dù", "example": "虽然今天很累，我还是去运动了。", "examplePinyin": "suī rán jīn tiān hěn lèi ， wǒ hái shì qù yùn dòng le 。", "translation": "Tuy hôm nay mệt, tôi vẫn đã đi vận động.", "id": "H2-T10-02"}, {"hanzi": "原来", "pinyin": "yuánlái", "meaning": "Ban đầu, hóa ra", "example": "原来你也住在这条街上！", "examplePinyin": "yuán lái nǐ yě zhù zài zhè tiáo jiē shàng ！", "translation": "Hóa ra bạn cũng sống trên con phố này!", "id": "H2-T10-03"}, {"hanzi": "后来", "pinyin": "hòulái", "meaning": "Sau này", "example": "他先在北京工作，后来去了上海。", "examplePinyin": "tā xiān zài běi jīng gōng zuò ， hòu lái qù le shàng hǎi 。", "translation": "Ban đầu anh ấy làm ở Bắc Kinh, sau đó đến Thượng Hải.", "id": "H2-T10-04"}, {"hanzi": "不但", "pinyin": "bùdàn", "meaning": "Không chỉ", "example": "她不但会说中文，还会写汉字。", "examplePinyin": "tā bù dàn huì shuō zhōng wén ， hái huì xiě hàn zì 。", "translation": "Cô ấy không chỉ nói được tiếng Trung mà còn viết được chữ Hán.", "id": "H2-T10-05"}, {"hanzi": "所以", "pinyin": "suǒyǐ", "meaning": "Vì vậy", "example": "我没带伞，所以想等雨停了再走。", "examplePinyin": "wǒ méi dài sǎn ， suǒ yǐ xiǎng děng yǔ tíng le zài zǒu 。", "translation": "Tôi không mang ô nên muốn đợi mưa tạnh rồi đi.", "id": "H2-T10-06"}, {"hanzi": "接下来", "pinyin": "jiēxiàlái", "meaning": "Tiếp theo", "example": "接下来，请大家打开课本。", "examplePinyin": "jiē xià lái ， qǐng dà jiā dǎ kāi kè běn 。", "translation": "Tiếp theo mọi người hãy mở sách giáo khoa.", "id": "H2-T10-07"}, {"hanzi": "接着", "pinyin": "jiēzhe", "meaning": "Tiếp tục, sau đó", "example": "他喝了一口水，接着讲故事。", "examplePinyin": "tā hē le yī kǒu shuǐ ， jiē zhe jiǎng gù shì 。", "translation": "Anh ấy uống một ngụm nước rồi tiếp tục kể chuyện.", "id": "H2-T10-08"}, {"hanzi": "如果", "pinyin": "rúguǒ", "meaning": "Nếu", "example": "如果明天不下雨，我们就去爬山。", "examplePinyin": "rú guǒ míng tiān bù xià yǔ ， wǒ men jiù qù pá shān 。", "translation": "Nếu ngày mai không mưa, chúng ta sẽ đi leo núi.", "id": "H2-T10-09"}, {"hanzi": "那", "pinyin": "nà", "meaning": "Vậy thì, thế thì", "example": "你不想坐车，那我们走回去吧。", "examplePinyin": "nǐ bù xiǎng zuò chē ， nà wǒ men zǒu huí qù ba 。", "translation": "Bạn không muốn đi xe, vậy chúng ta đi bộ về nhé.", "id": "H2-T10-10"}, {"hanzi": "不过", "pinyin": "búguò", "meaning": "Nhưng, tuy nhiên", "example": "这件衣服很好看，不过有点儿贵。", "examplePinyin": "zhè jiàn yī fú hěn hǎo kàn ， bù guò yǒu diǎn ér guì 。", "translation": "Bộ quần áo này đẹp, có điều hơi đắt.", "id": "H2-T10-11"}, {"hanzi": "可是", "pinyin": "kěshì", "meaning": "Nhưng", "example": "我想早睡，可是作业还没做完。", "examplePinyin": "wǒ xiǎng zǎo shuì ， kě shì z ": "Hãy viết tên bạn bằng tiếng Trung hoặc tiếng Anh.", "id": "H2-T10-20"}, {"hanzi": "例如", "pinyin": "lìrú", "meaning": "Ví dụ", "example": "很多水果都很好吃，例如苹果和香蕉。", "examplePinyin": "hěn duō shuǐ guǒ dōu hěn hǎo chī ， lì rú píng guǒ hé xiāng jiāo 。", "translation": "Nhiều loại quả rất ngon, chẳng hạn táo và chuối.", "id": "H2-T10-21"}]}, {"id": 11, "name": "Phó Từ", "words": [{"hanzi": "全体", "pinyin": "quántǐ", "meaning": "Toàn thể", "example": "全体同学都参加了今天的活动。", "examplePinyin": "quán tǐ tóng xué dōu cān jiā le jīn tiān de huó dòng 。", "translation": "Toàn thể học sinh đều tham gia hoạt động hôm nay.", "id": "H2-T11-01"}, {"hanzi": "多么", "pinyin": "duōme", "meaning": "Biết bao, đến mức nào", "example": "你看，这些小猫多么可爱！", "examplePinyin": "nǐ kàn ， zhè xiē xiǎo māo duō me kě ài ！", "translation": "Bạn nhìn xem, những chú mèo này đáng yêu biết bao!", "id": "H2-T11-02"}, {"hanzi": "老是", "pinyin": "lǎoshì", "meaning": "Luôn luôn", "example": "他老是忘记带钥匙。", "examplePinyin": "tā lǎo shì wàng jì dài yào shi 。", "translation": "Anh ấy hay quên mang chìa khóa.", "id": "H2-T11-03"}, {"hanzi": "十分", "pinyin": "shífēn", "meaning": "Rất", "example": "我十分感谢老师的帮助。", "examplePinyin": "wǒ shí fēn gǎn xiè lǎo shī de bāng zhù 。", "translation": "Tôi vô cùng cảm ơn sự giúp đỡ của thầy.", "id": "H2-T11-04"}, {"hanzi": "多", "pinyin": "duō", "meaning": "Bao nhiêu, nhiều", "example": "这里的人多，走路要小心。", "examplePinyin": "zhè lǐ de rén duō ， zǒu lù yào xiǎo xīn 。", "translation": "Ở đây đông người, đi bộ cần cẩn thận.", "id": "H2-T11-05"}, {"hanzi": "好", "pinyin": "hǎo", "meaning": "Rất", "example": "今天好冷，我们喝点热水吧。", "examplePinyin": "jīn tiān hǎo lěng ， wǒ men hē diǎn rè shuǐ ba 。", "translation": "Hôm nay lạnh quá, chúng ta uống chút nước nóng nhé.", "id": "H2-T11-06"}, {"hanzi": "身边", "pinyin": "shēnbiān", "meaning": "Bên cạnh", "example": "妈妈坐在我身边看书。", "examplePinyin": "mā mā zuò zài wǒ shēn biān kàn shū 。", "translation": "Mẹ ngồi bên cạnh tôi đọc sách.", "id": "H2-T11-07"}, {"hanzi": "平时", "pinyin": "píngshí", "meaning": "Thường ngày", "example": "你平时几点下班？", "examplePinyin": "nǐ píng shí jǐ diǎn xià bān ？", "translation": "Bình thường bạn tan làm lúc mấy giờ?", "id": "H2-T11-08"}, {"hanzi": "全", "pinyin": "quán", "meaning": "Toàn bộ", "example": "这些书我全看过了。", "examplePinyin": "zhè xiē shū wǒ quán kàn guò le 。", "translation": "Những quyển sách này tôi đã đọc hết rồi.", "id": "H2-T11-09"}, {"hanzi": "那样", "pinyin": "nàyàng", "meaning": "Như thế", "example": "你那样说，妹妹会难过的。", "examplePinyin": "nǐ nà yàng shuō ， mèi mèi huì nán guò de 。", "translation": "Bạn nói như vậy em gái sẽ buồn đấy.", "id": "H2-T11-10"}, {"hanzi": "一直", "pinyin": "yìzhí", "meaning": "Liên tục, suốt", "example": "我们一直走到河边才休息。", "examplePinyin": "wǒ men yì zhí zǒu dào hé biān cái xiū xī 。", "translation": "Chúng tôi đi mãi tới bờ sông mới nghỉ.", "id": "H2-T11-11"}, {"hanzi": "一般", "pinyin": "yìbān", "meaning": "Thông thường", "example": "我一般坐地铁去公司。", "examplePinyin": "wǒ yì bān zuò dì tiě qù gōng sī 。", "translation": "Tôi thường đi tàu điện ngầm đến công ty.", "id": "H2-T11-12"}, {"hanzi": "可能", "pinyin": "kěnéng", "meaning": "Có thể", "example": "下午可能下雨，你带上伞吧。", "examplePinyin": "xià wǔ kě néng xià yǔ ， nǐ dài shàng sǎn ba 。", "translation": "Chiều có thể mưa, bạn mang ô nhé.", "id": "H2-T11-13"}, {"hanzi": "大大", "pinyin": "dàdà", "meaning": "Rất nhiều, đáng kể", "example": "多练习能大大提高你的水平。", "examplePinyin": "duō liàn xí néng dà dà tí gāo nǐ de shuǐ píng 。", "translation": "Luyện tập nhiều có thể nâng cao đáng kể trình độ của bạn.", "id": "H2-T11-14"}, {"hanzi": "特别", "pinyin": "tèbié", "meaning": "Đặc biệt", "example": "今天的饺子特别好吃。", "examplePinyin": "jīn tiān de jiǎo zi tè bié hǎo chī 。", "translation": "Sủi cảo hôm nay đặc biệt ngon.", "id": "H2-T11-15"}, {"hanzi": "完全", "pinyin": "wánquán", "meaning": "Hoàn toàn", "example": "老师的话我完全听懂了。", "examplePinyin": "lǎo shī de huà wǒ wán quán tīng dǒng le 。", "translation": "Tôi đã hoàn toàn nghe hiểu lời thầy.", "id": "H2-T11-16"}, {"hanzi": "好像 mplePinyin": "zhōng guó de rén kǒu yǒu shí duō yì 。", "translation": "Dân số Trung Quốc có hơn một tỷ người.", "id": "H2-T15-01"}, {"hanzi": "万", "pinyin": "wàn", "meaning": "Mười nghìn", "example": "这所大学有两万多名学生。", "examplePinyin": "zhè suǒ dà xué yǒu liǎng wàn duō míng xué shēng 。", "translation": "Trường đại học này có hơn hai vạn sinh viên.", "id": "H2-T15-02"}, {"hanzi": "大部分", "pinyin": "dàbùfen", "meaning": "Phần lớn", "example": "大部分同学都坐车来学校。", "examplePinyin": "dà bù fèn tóng xué dōu zuò chē lái xué xiào 。", "translation": "Phần lớn các bạn đều đi xe đến trường.", "id": "H2-T15-03"}, {"hanzi": "一点点", "pinyin": "yìdiǎndiǎn", "meaning": "Một chút xíu", "example": "这杯水只要加一点点糖。", "examplePinyin": "zhè bēi shuǐ zhǐ yào jiā yì diǎn diǎn táng 。", "translation": "Cốc nước này chỉ cần thêm một chút xíu đường.", "id": "H2-T15-04"}, {"hanzi": "一部分", "pinyin": "yíbùfen", "meaning": "Một phần", "example": "这笔钱的一部分是给妈妈的。", "examplePinyin": "zhè bǐ qián de yī bù fèn shì gěi mā mā de 。", "translation": "Một phần số tiền này là dành cho mẹ.", "id": "H2-T15-05"}, {"hanzi": "部分", "pinyin": "bùfen", "meaning": "Bộ phận, phần", "example": "这本书最难的部分在后面。", "examplePinyin": "zhè běn shū zuì nán de bù fèn zài hòu miàn 。", "translation": "Phần khó nhất của quyển sách này ở phía sau.", "id": "H2-T15-06"}, {"hanzi": "大量", "pinyin": "dàliàng", "meaning": "Số lượng lớn", "example": "学语言需要大量练习。", "examplePinyin": "xué yǔ yán xū yào dà liàng liàn xí 。", "translation": "Học ngôn ngữ cần luyện tập rất nhiều.", "id": "H2-T15-07"}, {"hanzi": "好多", "pinyin": "hǎoduō", "meaning": "Rất nhiều", "example": "超市里有好多便宜的水果。", "examplePinyin": "chāo shì lǐ yǒu hǎo duō pián yi de shuǐ guǒ 。", "translation": "Trong siêu thị có rất nhiều trái cây rẻ.", "id": "H2-T15-08"}, {"hanzi": "不够", "pinyin": "búgòu", "meaning": "Không đủ", "example": "这些钱不够买两张票。", "examplePinyin": "zhè xiē qián bù gòu mǎi liǎng zhāng piào 。", "translation": "Số tiền này không đủ mua hai vé.", "id": "H2-T15-09"}, {"hanzi": "大多数", "pin
